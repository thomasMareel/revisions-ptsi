  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Le programme d'informatique commune de 2021 n'a pas de partie « méthodes numériques » : ces algorithmes appartiennent aux capacités numériques des programmes de physique-chimie, de mathématiques et de sciences de l'ingénieur. Ce chapitre les étudie du point de vue de l'informaticien : les programmer proprement, prouver qu'ils s'arrêtent, estimer leur coût, comprendre leurs erreurs et les tester. Les sujets d'informatique des concours y puisent souvent leurs problèmes, en rappelant les formules utiles dans l'énoncé.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Ce qui relève de l'informatique, et ce qui relève des autres disciplines</span>
    <div class="content">
      <p><strong>Programme d'informatique</strong> (exigible) :</p>
      <ul>
        <li><strong>Algorithmes dichotomiques</strong> (1ᵉʳ semestre) : appliqués à la recherche d'un zéro (§2), comme la recherche dans un tableau trié du chapitre « Recherche séquentielle, dictionnaires et dichotomie ».</li>
        <li><strong>Méthodes de programmation et analyse des algorithmes</strong> (2ᵉ semestre) : spécification, variant et invariant, complexité, jeux de tests (§2, §4, §8), avec les notations du chapitre « Spécification, correction et complexité ».</li>
        <li><strong>Représentation des nombres, précision des calculs en flottants</strong> (2ᵉ semestre) : ces notions « permettent d'expliquer certaines difficultés rencontrées et précautions à prendre lors de l'utilisation d'algorithmes de calcul numérique » (§1, §2, §5, §8 ; chapitre « Représentation des nombres »).</li>
        <li><strong>Fonctions</strong> passées en argument d'autres fonctions (annexe Python : <span class="code-inline">def</span>, <span class="code-inline">return</span>) (§1).</li>

      <p><strong>Capacités numériques des autres disciplines</strong> (exigibles dans ces disciplines, non en informatique) :</p>
      <ul>
        <li><strong>Physique-chimie PTSI</strong> (annexe « outils numériques ») : déterminer un intervalle adapté et mettre en œuvre une dichotomie avec une précision donnée, utiliser <span class="code-inline">bisect</span> (§1, §2) ; méthode des rectangles (§4) ; valeur approchée d'un nombre dérivé (§5) ; méthode d'Euler explicite pour une équation d'ordre 1 (§6) ; transformer une équation d'ordre \(n\) en système d'ordre 1, utiliser <span class="code-inline">odeint</span> (§7) ; tracés avec <span class="code-inline">matplotlib</span> (§1). En PT, la méthode des différences finies pour la diffusion est traitée dans le chapitre « Diffusion thermique ».</li>

<div class="course-section">
  <div class="sec-num">§1 · CALCULER UNE VALEUR APPROCHÉE</div>
  <h2>Méthodes numériques, fonctions en argument, deux sources d'erreur</h2>
  <div class="intro">Les <strong>méthodes numériques</strong> calculent une valeur <strong>approchée</strong> quand le calcul exact est impossible ou trop coûteux : zéro d'une fonction, intégrale, solution d'équation différentielle. L'équation \(x^3 - 2x - 5 = 0\) n'a pas de solution qu'on sache écrire simplement ; l'équation \(\theta'' = -\frac{g}{\ell} \sin\theta\) du pendule n'a pas de solution exprimable avec les fonctions usuelles. On veut pourtant des nombres.</div>

  <h3>La fonction comme donnée</h3>
  <p>Une méthode numérique s'applique à <em>n'importe quelle</em> fonction : on la programme une fois, et l'on passe la fonction étudiée en <strong>argument</strong>. En Python, une fonction est une valeur comme une autre : écrire <span class="code-inline">f</span> sans parenthèses désigne la fonction, <span class="code-inline">f(x)</span> l'appelle.</p>
  <pre class="codeblock"><span class="kw">def</span> f(x):
    <span class="kw">return</span> x ** 3 - 2 * x - 5</pre>
  <pre class="codeblock"><span class="kw">def</span> tableau_valeurs(f, a, b, n):
    <span class="str">"""Abscisses x_k = a + k*h (k = 0, …, n, avec h = (b - a)/n) et valeurs f(x_k)."""</span>
    h = (b - a) / n
    xs, ys = [], []
    <span class="kw">for</span> k <span class="kw">in</span> range(n + 1):
        x = a + k * h          <span class="cmt"># calculé à partir de k : pas d'erreur qui s'accumule</span>
        xs.append(x)
        ys.append(f(x))
    <span class="kw">return</span> xs, ys</pre>
  <p>Les abscisses sont calculées à partir de l'entier <span class="code-inline">k</span> : écrire <span class="code-inline">x = x + h</span> à chaque tour accumulerait les erreurs d'arrondi et pourrait même faire un point de trop ou de moins (chapitre « Représentation des nombres », §9). La fonction <span class="code-inline">tabuler</span> du chapitre « Fonctions » ne renvoyait que les valeurs ; celle-ci renvoie aussi les abscisses, utiles pour tracer.</p>

  <div class="method-box"><strong>Exemple — localiser le zéro de \(f(x) = x^3 - 2x - 5\)</strong>
    <div><table>
<tr><th>\(x_k\)</th><th>\(f(x_k)\)</th><th>signe</th></tr>
<tr><td>\(0{,}0\)</td><td>\(-5{,}000\)</td><td>\(-\)</td></tr>
<tr><td>\(0{,}5\)</td><td>\(-5{,}875\)</td><td>\(-\)</td></tr>
<tr><td>\(1{,}0\)</td><td>\(-6{,}000\)</td><td>\(-\)</td></tr>

    <ol>
      <li>On tabule \(f\) sur \([0, 3]\) avec un pas de 0,5.</li>
      <li>\(f(2) = -1 \lt 0\) et \(f(2{,}5) = 5{,}625 \gt 0\) : \(f\) étant continue, elle s'annule sur \([2 ;\ 2{,}5]\) (théorème des valeurs intermédiaires).</li>
      <li>\(f'(x) = 3x^2 - 2\) est positive pour \(x \ge 1\) ; sur \([0, 1]\), \(f\) reste négative. Le zéro est donc unique : c'est \(c \approx 2{,}0946\).</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> changements_de_signe(f, a, b, n):
    <span class="str">"""Liste des intervalles [x_k, x_(k+1)] de la subdivision où f change de signe."""</span>
    xs, ys = tableau_valeurs(f, a, b, n)
    res = []
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        <span class="kw">if</span> ys[k] * ys[k + 1] &lt;= 0:
            res.append((xs[k], xs[k + 1]))
    <span class="kw">return</span> res</pre>

[(2.0, 2.5)]</pre>

  <h3>Deux erreurs à ne pas confondre</h3>
  <div class="def-box">
    <ul>
      <li>L'<strong>erreur de méthode</strong> (ou de troncature, de discrétisation) vient de la méthode mathématique : un intervalle de largeur non nulle, des rectangles au lieu de l'aire exacte, un pas \(h\) non nul. Elle dépend du paramètre de la méthode (précision \(\varepsilon\), nombre de sous-intervalles \(n\), pas \(h\)) et tend vers 0 quand on le raffine.</li>
      <li>L'<strong>erreur d'arrondi</strong> vient de la représentation des réels par des flottants : chaque opération commet une erreur relative d'au plus \(1{,}1 \times 10^{-16}\) environ. Elle s'accumule avec le nombre d'opérations et peut être amplifiée par une soustraction de nombres voisins.</li>
    </ul>
  </div>
  <div class="prop-box"><strong>Le compromis.</strong> Raffiner la méthode diminue l'erreur de méthode mais multiplie les calculs : le coût augmente, et l'erreur d'arrondi finit par dominer. Pour chaque méthode, on cherche donc à connaître son <strong>coût</strong> (nombre d'évaluations de la fonction) et la façon dont son erreur de méthode décroît.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RÉSOUDRE f(x) = 0 PAR DICHOTOMIE</div>
  <h2>Diviser par deux l'intervalle qui contient le zéro</h2>
  <div class="intro">Si une fonction continue change de signe entre \(a\) et \(b\), elle s'annule entre les deux. En coupant l'intervalle en son milieu et en gardant la moitié où le changement de signe persiste, on enferme un zéro dans des intervalles deux fois plus petits à chaque étape. C'est l'idée de la recherche dichotomique dans un tableau trié (chapitre « Recherche séquentielle, dictionnaires et dichotomie », §7), appliquée à un intervalle de réels.</div>

  <div class="def-box"><strong>Dichotomie.</strong> On part de \(a \lt b\) tels que \(f\) est continue sur \([a, b]\) et \(f(a) f(b) \le 0\). Tant que \(b - a \gt \varepsilon\), on calcule le milieu \(m = \dfrac{a + b}2\) ; si \(f(a) f(m) \le 0\), on remplace \(b\) par \(m\), sinon on remplace \(a\) par \(m\). On renvoie le milieu du dernier intervalle.</div>
  <pre class="codeblock"><span class="kw">def</span> zero_dicho(f, a, b, eps):
    <span class="str">"""Précondition : a &lt; b, f continue sur [a, b], f(a) * f(b) &lt;= 0, eps &gt; 0.</span>
<span class="str">    Postcondition : renvoie x à distance au plus eps / 2 d'un zéro de f dans [a, b]."""</span>
    fa = f(a)
    <span class="kw">assert</span> a &lt; b <span class="kw">and</span> fa * f(b) &lt;= 0 <span class="kw">and</span> eps &gt; 0
    <span class="kw">while</span> b - a &gt; eps:
        <span class="cmt"># invariant : a &lt; b, fa == f(a) et f(a) * f(b) &lt;= 0</span>
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:       <span class="cmt"># f change de signe sur [a, m]</span>
            b = m
        <span class="kw">else</span>:                  <span class="cmt"># f(m) a le signe de f(a) : changement sur [m, b]</span>
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2</pre>
  <p>La valeur <span class="code-inline">fa</span> est gardée en mémoire : chaque étape ne calcule \(f\) qu'une fois, au milieu. Le parallèle avec la fonction <span class="code-inline">dicho</span> du chapitre « Recherche séquentielle, dictionnaires et dichotomie » est direct : l'intervalle d'indices \([g, d]\) y devient un intervalle de réels \([a, b]\), et le test \(t[m] = x\) un test de signe.</p>

  <div class="prop-box"><strong>Correction, terminaison, coût.</strong>
    <ul>
      <li><strong>Invariant</strong> : \(a \lt b\) et \(f(a) f(b) \le 0\). Il est vrai au départ (précondition) et conservé : si \(f(a) f(m) \le 0\), le nouvel intervalle \([a, m]\) le vérifie ; sinon \(f(m)\) est non nul et du signe de \(f(a)\), donc \(f(m) f(b)\) a le signe de \(f(a) f(b)\), négatif ou nul. Par le théorème des valeurs intermédiaires, \([a, b]\) contient toujours un zéro \(c\) de \(f\).</li>
      <li><strong>Correction</strong> : à la sortie, \(b - a \le \varepsilon\), et le milieu de \([a, b]\) est à distance au plus \(\dfrac{\varepsilon}2\) de \(c\).</li>
      <li><strong>Terminaison</strong> (en calcul exact) : après \(k\) étapes, la largeur vaut \(\dfrac{b_0 - a_0}{2^k}\). L'entier \(N - k\), où \(N\) est le plus petit entier tel que \(\dfrac{b_0 - a_0}{2^N} \le \varepsilon\), est un variant.</li>
      <li><strong>Coût</strong> : la boucle fait exactement
      $$N = \left\lceil \log_2 \frac{b_0 - a_0}{\varepsilon} \right\rceil$$
      tours, avec une évaluation de \(f\) par tour : \(O\big(\log((b_0 - a_0)/\varepsilon)\big)\). Chaque chiffre décimal de plus coûte environ \(\log_2 10 \approx 3{,}3\) étapes.</li>
    </ul>
  </div>

  <div class="method-box"><strong>Exemple — approcher \(\sqrt 2\) à 0,01 près</strong>
    <p>On cherche le zéro de \(g(x) = x^2 - 2\) sur \([1, 2]\) : \(g(1) = -1 \lt 0\) et \(g(2) = 2 \gt 0\). Avec \(\varepsilon = 0{,}01\), il faut \(N = \lceil \log_2 100 \rceil = 7\) étapes (\(2^7 = 128\)).</p>
    <div><table>
<tr><th>étape</th><th>\(a\)</th><th>\(b\)</th><th>\(m\)</th><th>\(g(m)\)</th><th>décision</th></tr>
<tr><td>1</td><td>\(1{,}00000\)</td><td>\(2{,}00000\)</td><td>\(1{,}50000\)</td><td>\(0{,}25000\)</td><td>\(b \leftarrow m\)</td></tr>
<tr><td>2</td><td>\(1{,}00000\)</td><td>\(1{,}50000\)</td><td>\(1{,}25000\)</td><td>\(-0{,}43750\)</td><td>\(a \leftarrow m\)</td></tr>

<figcaption>Dichotomie pour \(x^2 - 2 = 0\) sur \([1, 2]\) : à chaque étape, on calcule \(f\) au milieu (point) et l'on garde la moitié où \(f\) change de signe. La longueur de l'intervalle est divisée par 2 à chaque étape, et \(\sqrt 2\) (pointillés) y reste toujours.</figcaption>
</figure>
  <pre class="codeblock"><span class="kw">def</span> g(x):
    <span class="kw">return</span> x * x - 2</pre>
  <pre class="codeblock">&gt;&gt;&gt; zero_dicho(g, 1, 2, 1e-6)
1.4142136573791504
&gt;&gt;&gt; 2 ** 0.5                   <span class="cmt"># valeur de référence</span>
1.4142135623730951</pre>
  <p>Avec \(\varepsilon = 10^{-6}\), il faut 20 étapes ; le résultat est à moins de \(5 \times 10^{-7}\) de \(\sqrt 2\), comme prévu. On peut aussi fixer d'avance le nombre d'étapes avec une boucle <span class="code-inline">for</span>, ce qui garantit la terminaison sans raisonnement supplémentaire :</p>
  <pre class="codeblock"><span class="kw">def</span> nb_etapes(a, b, eps):
    <span class="str">"""Plus petit entier N tel que (b - a) / 2**N &lt;= eps."""</span>
    N = 0
    <span class="kw">while</span> (b - a) / 2 ** N &gt; eps:
        N = N + 1
    <span class="kw">return</span> N</pre>
  <pre class="codeblock"><span class="kw">def</span> zero_dicho_n(f, a, b, n):
    <span class="str">"""Même précondition que zero_dicho ; fait exactement n étapes et renvoie le</span>
<span class="str">    milieu du dernier intervalle, à distance au plus (b - a) / 2**(n+1) d'un zéro."""</span>
    fa = f(a)
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2</pre>
  <pre class="codeblock">&gt;&gt;&gt; nb_etapes(1, 2, 1e-6)
20
&gt;&gt;&gt; zero_dicho_n(g, 1, 2, 20)
1.4142136573791504</pre>

  <div class="notice"><strong>Piège : une précision plus fine que les flottants.</strong> La terminaison ci-dessus suppose un calcul exact. Près de \(10^6\), deux flottants voisins sont espacés de \(1{,}16 \times 10^{-10}\) : avec \(\varepsilon = 10^{-12}\), l'intervalle finit par avoir pour bornes deux flottants consécutifs ; leur milieu, arrondi, est égal à l'une des bornes, et \(b - a\) ne diminue plus.
  <pre class="codeblock"><span class="kw">def</span> h(x):
    <span class="kw">return</span> x - 1000000.3          <span class="cmt"># zéro : 1000000.3</span>

zero_dicho(h, 1e6, 1e6 + 1, 1e-12)   <span class="cmt"># ne s'arrête jamais</span></pre>
  Remèdes : demander une précision compatible avec la grandeur de la racine (quelques \(10^{-16}\) en valeur <em>relative</em>), fixer le nombre d'étapes par une boucle <span class="code-inline">for</span>, ou s'arrêter aussi quand \(m\) est égal à \(a\) ou à \(b\).</div>

  <div class="notice"><strong>Erreurs classiques</strong> :
    <ul>
      <li>lancer la dichotomie sans vérifier \(f(a) f(b) \le 0\) : avec \(f(x) = x^2 + 1\), elle renvoie un nombre qui n'est le zéro de rien ;</li>
      <li>appliquer la méthode à une fonction discontinue : avec \(f(x) = \dfrac1x\) sur \([-1, 1]\), il y a changement de signe mais pas de zéro, et la dichotomie converge vers la discontinuité 0 ;</li>
      <li>croire que la méthode trouve « le » zéro : s'il y en a plusieurs dans \([a, b]\), elle en trouve un, sans dire lequel.</li>
    </ul>
  </div>
  <p>En physique, le programme demande aussi de savoir utiliser la fonction <span class="code-inline">bisect</span> de la bibliothèque <span class="code-inline">scipy.optimize</span>, qui met en œuvre la même méthode :</p>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">from</span> scipy.optimize <span class="kw">import</span> bisect    <span class="cmt"># bibliothèque hors annexe</span>
&gt;&gt;&gt; bisect(g, 1, 2, xtol=1e-12)          <span class="cmt"># xtol : précision demandée sur x</span>
1.4142135623724243</pre>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LA MÉTHODE DE NEWTON</div>
  <h2>Suivre la tangente : rapide, mais sans garantie</h2>
  <div class="intro">La méthode de Newton n'est pas au programme d'informatique : c'est un exemple du programme de mathématiques (vitesse de convergence d'une suite récurrente) et une capacité de sciences de l'ingénieur (chapitre « Résolution numérique en sciences de l'ingénieur », §4). Les sujets d'informatique la proposent souvent, formule donnée, pour comparer sa vitesse à celle de la dichotomie.</div>

  <div class="def-box"><strong>Méthode de Newton.</strong> Pour \(f\) dérivable, on part d'un point \(x_0\) et l'on remplace la courbe par sa tangente au point courant : \(x_{k+1}\) est l'abscisse où la tangente en \(x_k\) coupe l'axe,
  $$x_{k+1} = x_k - \frac{f(x_k)}{f'(x_k)} \qquad (f'(x_k) \ne 0).$$</div>

  <pre class="codeblock"><span class="kw">def</span> newton(f, df, x0, eps, nmax):
    <span class="str">"""Méthode de Newton pour f(x) = 0, de dérivée df, depuis x0. S'arrête quand</span>
<span class="str">    deux termes consécutifs diffèrent d'au plus eps, ou après nmax itérations."""</span>
    x = x0
    <span class="kw">for</span> k <span class="kw">in</span> range(nmax):
        d = df(x)
        <span class="kw">assert</span> d != 0             <span class="cmt"># tangente horizontale : la méthode échoue</span>
        x_suiv = x - f(x) / d
        <span class="kw">if</span> abs(x_suiv - x) &lt;= eps:
            <span class="kw">return</span> x_suiv
        x = x_suiv
    <span class="kw">return</span> x</pre>
  <p>La boucle <span class="code-inline">for</span> borne le nombre d'itérations : la terminaison est assurée même si la suite ne converge pas (variant : \(n_{\max} - k\)). Le critère d'arrêt « deux termes consécutifs proches » est l'usage, mais il ne prouve pas que \(x\) est proche d'un zéro : on vérifie après coup que \(f(x)\) est petit.</p>

  <div class="method-box"><strong>Exemple — \(\sqrt 2\) en cinq itérations</strong>
    <p>Pour \(g(x) = x^2 - 2\), la formule devient \(x_{k+1} = x_k - \dfrac{x_k^2 - 2}{2x_k} = \dfrac12\left(x_k + \dfrac{2}{x_k}\right)\). Depuis \(x_0 = 2\) :</p>
    <div><table>
<tr><th>\(k\)</th><th>\(x_k\)</th><th>erreur \(|x_k - \sqrt 2|\)</th></tr>
<tr><td>0</td><td><span class="code-inline">2.0</span></td><td>\(5{,}9 \times 10^{-1}\)</td></tr>
<tr><td>1</td><td><span class="code-inline">1.5</span></td><td>\(8{,}6 \times 10^{-2}\)</td></tr>
<tr><td>2</td><td><span class="code-inline">1.4166666666666667</span></td><td>\(2{,}5 \times 10^{-3}\)</td></tr>
<tr><td>3</td><td><span class="code-inline">1.4142156862745099</span></td><td>\(2{,}1 \times 10^{-6}\)</td></tr>
<tr><td>4</td><td><span class="code-inline">1.4142135623746899</span></td><td>\(1{,}6 \times 10^{-12}\)</td></tr>
<tr><td>5</td><td><span class="code-inline">1.4142135623730951</span></td><td>\(0\)</td></tr>
</table></div>
    <ol>
      <li>Le nombre de chiffres significatifs exacts double à peu près à chaque itération (convergence <strong>quadratique</strong>, résultat de mathématiques admis ici) : 1, 3, 6, puis 12 chiffres.</li>
      <li>Dès la cinquième itération, on obtient le flottant le plus proche de \(\sqrt 2\) : on ne peut pas faire mieux en flottants. Les itérations suivantes oscillent d'un écart de flottant, et la fonction s'arrête sur le voisin <span class="code-inline">1.414213562373095</span>.</li>
      <li>La dichotomie sur \([1, 2]\) demande 20 étapes pour une précision de \(10^{-6}\) et une cinquantaine pour la précision maximale des flottants.</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> dg(x):
    <span class="kw">return</span> 2 * x</pre>
    <pre class="codeblock">&gt;&gt;&gt; newton(g, dg, 2.0, 1e-12, 50)
1.414213562373095
&gt;&gt;&gt; 2 ** 0.5                   <span class="cmt"># flottant voisin : écart de 2.2e-16</span>
1.4142135623730951</pre>
  </div>

  <div class="notice"><strong>Les risques de Newton</strong> :
    <ul>
      <li>une dérivée nulle ou très petite en un \(x_k\) : division par zéro, ou saut très loin ;</li>
      <li>un mauvais point de départ : la suite peut diverger ou tourner en rond. Pour \(p(x) = x^3 - 2x + 2\), depuis \(x_0 = 0\), on obtient \(x_1 = 1\), puis \(x_2 = 0\), et ainsi de suite indéfiniment ;</li>
      <li>il faut connaître la dérivée \(f'\).</li>
    </ul>
  </div>
  <pre class="codeblock"><span class="kw">def</span> p(x):
    <span class="kw">return</span> x ** 3 - 2 * x + 2

<span class="kw">def</span> dp(x):
    <span class="kw">return</span> 3 * x ** 2 - 2</pre>
  <pre class="codeblock">&gt;&gt;&gt; newton(p, dp, 0.0, 1e-12, 5)    <span class="cmt"># 0 -&gt; 1 -&gt; 0 -&gt; 1 -&gt; 0 -&gt; 1 : un cycle</span>
1.0
&gt;&gt;&gt; newton(p, dp, -2.0, 1e-12, 50)  <span class="cmt"># d'un meilleur point de départ : la racine</span>
-1.7692923542386314</pre>
  <div class="prop-box"><strong>Dichotomie ou Newton ?</strong> La dichotomie est <strong>sûre</strong> (un changement de signe suffit, le nombre d'étapes est connu d'avance) mais lente : un bit de précision par étape. Newton est <strong>rapide</strong> près d'un zéro simple, mais demande la dérivée et un bon point de départ, sans garantie de convergence. En pratique, on combine : quelques étapes de dichotomie pour s'approcher, puis Newton pour conclure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · INTÉGRALE APPROCHÉE : RECTANGLES ET TRAPÈZES</div>
  <h2>Remplacer l'aire sous la courbe par des aires simples</h2>
  <div class="intro">Pour approcher \(\displaystyle\int_a^b f(x)\,\mathrm{d}x\), on découpe \([a, b]\) en \(n\) sous-intervalles de même largeur et l'on remplace, sur chacun, l'aire sous la courbe par celle d'un rectangle ou d'un trapèze. Les notations sont celles du chapitre de mathématiques « Intégration (approfondissements) », §2.</div>

  <div class="def-box">Soit \(n \ge 1\), le <strong>pas</strong> \(h = \dfrac{b - a}{n}\) et les points \(x_k = a + kh\) pour \(k = 0, \dots, n\) (\(x_0 = a\), \(x_n = b\)).
    <ul>
      <li><strong>Méthode des rectangles</strong> (à gauche) : sur \([x_k, x_{k+1}]\), on prend la hauteur \(f(x_k)\) :
      $$R_n = h \sum_{k=0}^{n-1} f(x_k).$$</li>
      <li><strong>Méthode des trapèzes</strong> : sur \([x_k, x_{k+1}]\), on prend le trapèze qui joint les points \(\big(x_k, f(x_k)\big)\) et \(\big(x_{k+1}, f(x_{k+1})\big)\), d'aire \(h \dfrac{f(x_k) + f(x_{k+1})}2\) :
      $$T_n = h \left( \frac{f(a) + f(b)}{2} + \sum_{k=1}^{n-1} f(x_k) \right).$$</li>
    </ul>
  </div>

<figcaption>Approcher \(\displaystyle\int_0^2 \mathrm{e}^x\,\mathrm{d}x = \mathrm{e}^2 - 1 \approx 6{,}39\) avec \(n = 4\) sous-intervalles. Rectangles à gauche : la fonction croît, chaque rectangle manque un morceau d'aire. Trapèzes : la corde est au-dessus de la courbe (fonction convexe), l'erreur est bien plus petite.</figcaption>
</figure>
  <pre class="codeblock"><span class="kw">def</span> rectangles(f, a, b, n):
    <span class="str">"""Méthode des rectangles à gauche : h * (f(x_0) + … + f(x_(n-1)))."""</span>
    h = (b - a) / n
    s = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        s = s + f(a + k * h)      <span class="cmt"># hauteur prise au bord gauche de [x_k, x_(k+1)]</span>
    <span class="kw">return</span> h * s</pre>
  <pre class="codeblock"><span class="kw">def</span> trapezes(f, a, b, n):
    <span class="str">"""Méthode des trapèzes : h * ((f(a) + f(b)) / 2 + f(x_1) + … + f(x_(n-1)))."""</span>
    h = (b - a) / n
    s = (f(a) + f(b)) / 2
    <span class="kw">for</span> k <span class="kw">in</span> range(1, n):
        s = s + f(a + k * h)
    <span class="kw">return</span> h * s</pre>
  <p><strong>Coût</strong> : \(n\) évaluations de \(f\) pour les rectangles, \(n + 1\) pour les trapèzes, plus \(O(n)\) additions : la complexité est linéaire en \(n\), \(O(n)\), si une évaluation de \(f\) coûte un temps constant. Dans les sommes, les points intérieurs comptent une fois et les extrémités une demi-fois : c'est ce qui distingue les deux formules. Les variantes « rectangles à droite » (hauteur \(f(x_{k+1})\)) et « point milieu » (hauteur \(f\big(\frac{x_k + x_{k+1}}2\big)\)) se programment de la même façon.</p>

  <div class="method-box"><strong>Exemple — \(\displaystyle\int_0^1 \mathrm{e}^x\,\mathrm{d}x = \mathrm{e} - 1 \approx 1{,}718\,282\)</strong>
    <pre class="codeblock">&gt;&gt;&gt; <span class="kw">from</span> math <span class="kw">import</span> exp, e
&gt;&gt;&gt; rectangles(exp, 0, 1, 100), trapezes(exp, 0, 1, 100)
(1.7097047383081219, 1.718296147450417)
&gt;&gt;&gt; e - 1                                <span class="cmt"># valeur exacte de l'intégrale</span>
1.718281828459045</pre>
    <div><table>
<tr><th>\(n\)</th><th>\(R_n\)</th><th>erreur</th><th>\(T_n\)</th><th>erreur</th></tr>
<tr><td>10</td><td>\(1{,}633799\)</td><td>\(8{,}4 \times 10^{-2}\)</td><td>\(1{,}71971349\)</td><td>\(1{,}4 \times 10^{-3}\)</td></tr>
<tr><td>100</td><td>\(1{,}709705\)</td><td>\(8{,}6 \times 10^{-3}\)</td><td>\(1{,}71829615\)</td><td>\(1{,}4 \times 10^{-5}\)</td></tr>
<tr><td>1000</td><td>\(1{,}717423\)</td><td>\(8{,}6 \times 10^{-4}\)</td><td>\(1{,}71828197\)</td><td>\(1{,}4 \times 10^{-7}\)</td></tr>
</table></div>
    <ol>
      <li>Quand \(n\) est multiplié par 10, l'erreur des rectangles est divisée par 10 environ, celle des trapèzes par 100.</li>
      <li>Les rectangles à gauche sous-estiment l'intégrale d'une fonction croissante ; les trapèzes surestiment celle d'une fonction convexe (la corde est au-dessus de la courbe).</li>
    </ol>
  </div>
  <div class="prop-box"><strong>Erreurs de méthode</strong> (résultats de mathématiques). Si \(|f'| \le M_1\) sur \([a, b]\), l'erreur de la méthode des rectangles est au plus \(\dfrac{M_1 (b - a)^2}{2n}\). Si \(|f''| \le M_2\), celle de la méthode des trapèzes est au plus \(\dfrac{M_2 (b - a)^3}{12\, n^2}\).
  $$\left| \int_a^b f - R_n \right| \le \frac{M_1 (b-a)^2}{2n}, \qquad \left| \int_a^b f - T_n \right| \le \frac{M_2 (b-a)^3}{12\,n^2}.$$
  On dit que la méthode des rectangles est d'<strong>ordre 1</strong> (erreur en \(\frac1n\)) et celle des trapèzes d'<strong>ordre 2</strong> (erreur en \(\frac1{n^2}\)).</div>
  <div class="method-box"><strong>Exemple — choisir \(n\) pour une précision donnée</strong>
    <ol>
      <li>Pour \(\int_0^1 \mathrm{e}^x\,\mathrm{d}x\) à \(10^{-6}\) près par les trapèzes : \(M_2 = \mathrm{e}\), il suffit que \(\dfrac{\mathrm{e}}{12\,n^2} \le 10^{-6}\), soit \(n \ge \sqrt{\mathrm{e} \times 10^6 / 12} \approx 475{,}9\) : \(n = 476\).</li>
      <li>Par les rectangles, \(\dfrac{\mathrm{e}}{2n} \le 10^{-6}\) demande \(n \ge 1{,}36 \times 10^6\) : près de 3 000 fois plus d'évaluations.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreurs classiques</strong> : confondre le nombre \(n\) de sous-intervalles et le nombre \(n + 1\) de points ; calculer le pas par <span class="code-inline">(b - a) // n</span> (division entière : pas nul si \(b - a \lt n\)) ; dans les trapèzes, compter les extrémités en entier ou oublier de les compter ; faire varier <span class="code-inline">k</span> de 0 à <span class="code-inline">n</span> dans les rectangles (un rectangle de trop).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MESURES ET DÉRIVÉE APPROCHÉE</div>
  <h2>Quand on ne dispose que de valeurs, et le choix du pas</h2>
  <div class="intro">En physique et en sciences de l'ingénieur, la fonction est souvent inconnue : on dispose de mesures \(y_k\) prises aux instants \(t_k\), parfois irrégulièrement espacés. On intègre (une puissance pour obtenir une énergie, une vitesse pour obtenir une distance) et l'on dérive (une position pour obtenir une vitesse) directement sur ces listes. La dérivée approchée est aussi l'occasion de voir l'erreur d'arrondi l'emporter sur l'erreur de méthode.</div>

  <h3>Intégrer une liste de mesures</h3>
  <p>La méthode des trapèzes s'adapte à des pas variables : sur \([t_k, t_{k+1}]\), l'aire du trapèze vaut \((t_{k+1} - t_k) \dfrac{y_k + y_{k+1}}2\).</p>
  <pre class="codeblock"><span class="kw">def</span> trapezes_mesures(t, y):
    <span class="str">"""Valeur approchée de l'intégrale de la grandeur y entre t[0] et t[n-1] (n = len(t)),</span>
<span class="str">    les mesures y[k] étant prises aux instants croissants t[k] (pas éventuellement variable)."""</span>
    s = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(len(t) - 1):
        s = s + (t[k + 1] - t[k]) * (y[k] + y[k + 1]) / 2
    <span class="kw">return</span> s</pre>
  <div class="method-box"><strong>Exemple — énergie consommée par un moteur</strong>
    <pre class="codeblock">&gt;&gt;&gt; t = [0, 2, 4, 5, 6, 8, 10]                <span class="cmt"># instants (s)</span>
&gt;&gt;&gt; P = [0, 150, 380, 520, 600, 610, 600]     <span class="cmt"># puissance mesurée (W)</span>
&gt;&gt;&gt; trapezes_mesures(t, P)                     <span class="cmt"># énergie (J)</span>
4110.0</pre>
    <ol>
      <li>Les pas valent 2, 2, 1, 1, 2 et 2 s : la formule à pas constant de §4 ne s'applique pas.</li>
      <li>Somme des six trapèzes : \(150 + 530 + 450 + 560 + 1210 + 1210 = 4110\) J.</li>
      <li>Coût : un passage sur les listes, \(O(n)\) pour \(n\) mesures.</li>
    </ol>
  </div>

  <h3>Approcher un nombre dérivé</h3>
  <div class="def-box">Pour \(h \gt 0\) petit, le nombre dérivé \(f'(x)\) est approché par la <strong>différence avant</strong> (taux d'accroissement à droite) ou par la <strong>différence centrée</strong> :
  $$f'(x) \approx \frac{f(x + h) - f(x)}{h}, \qquad f'(x) \approx \frac{f(x + h) - f(x - h)}{2h}.$$
  D'après la formule de Taylor, l'erreur de méthode est au plus \(\dfrac{M_2}{2}\,h\) pour la première (si \(|f''| \le M_2\)) et \(\dfrac{M_3}{6}\,h^2\) pour la seconde (si \(|f'''| \le M_3\)).</div>
  <pre class="codeblock"><span class="kw">def</span> derivee_avant(f, x, h):
    <span class="str">"""Approximation de f'(x) par le taux d'accroissement à droite."""</span>
    <span class="kw">return</span> (f(x + h) - f(x)) / h

<span class="kw">def</span> derivee_centree(f, x, h):
    <span class="str">"""Approximation de f'(x) par le taux d'accroissement centré."""</span>
    <span class="kw">return</span> (f(x + h) - f(x - h)) / (2 * h)</pre>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">from</span> math <span class="kw">import</span> exp
&gt;&gt;&gt; derivee_avant(exp, 1, 1e-4), derivee_centree(exp, 1, 1e-4)
(2.718417747082924, 2.718281832989611)
&gt;&gt;&gt; exp(1)
2.718281828459045</pre>
  <p>Sur une liste de mesures, on calcule de même les taux d'accroissement entre mesures successives (schéma « avant ») ; la liste obtenue a un élément de moins.</p>
  <pre class="codeblock"><span class="kw">def</span> derivee_mesures(t, y):
    <span class="str">"""Listes des instants t[k] et des dérivées approchées (y[k+1] - y[k]) / (t[k+1] - t[k])</span>
<span class="str">    pour k = 0, …, n - 2 (différences avant)."""</span>
    ts, ds = [], []
    <span class="kw">for</span> k <span class="kw">in</span> range(len(t) - 1):
        ts.append(t[k])
        ds.append((y[k + 1] - y[k]) / (t[k + 1] - t[k]))
    <span class="kw">return</span> ts, ds</pre>

  <h3>Le choix du pas : erreur de méthode contre erreur d'arrondi</h3>
  <p>On pourrait croire qu'il suffit de prendre \(h\) aussi petit que possible. C'est faux : \(f(x + h)\) et \(f(x)\) deviennent très proches, et leur différence subit une <strong>cancellation</strong> (chapitre « Représentation des nombres », §8). Chaque valeur de \(f\) est arrondie avec une erreur absolue de l'ordre de \(\epsilon\,|f(x)|\), où \(\epsilon \approx 2{,}2 \times 10^{-16}\) ; divisée par \(h\), cette erreur devient de l'ordre de \(\dfrac{\epsilon\,|f(x)|}{h}\).</p>

  <div class="prop-box"><strong>Pas optimal.</strong> L'erreur totale de la différence avant est de l'ordre de
  $$\frac{M_2}{2}\,h + \frac{\epsilon\,|f(x)|}{h},$$
  somme d'un terme qui décroît et d'un terme qui croît quand \(h\) diminue. Elle est minimale pour \(h\) de l'ordre de \(\sqrt{\epsilon} \approx 10^{-8}\) (si \(f\) et ses dérivées sont de l'ordre de 1), et vaut alors environ \(10^{-8}\) : on ne gagne que la moitié des chiffres significatifs. Pour la différence centrée, le meilleur pas est de l'ordre de \(\epsilon^{1/3} \approx 10^{-5}\), pour une erreur de l'ordre de \(10^{-11}\).</div>
  <div class="notice"><strong>Pour des mesures</strong>, le problème est plus marqué encore : chaque mesure porte une incertitude bien supérieure à \(10^{-16}\), et dériver des mesures trop rapprochées amplifie leur bruit. On lisse les données ou l'on choisit un pas plus grand.</div>

<div class="course-section">
  <div class="sec-num">§6 · ÉQUATIONS DIFFÉRENTIELLES : LA MÉTHODE D'EULER</div>
  <h2>Avancer pas à pas en suivant la pente</h2>
  <div class="intro">Une équation différentielle d'ordre 1, \(y' = F(t, y)\), donne en chaque point la pente de la solution. Avec une condition initiale \(y(t_0) = y_0\) (problème de Cauchy), on peut avancer par petits pas en suivant la pente du point où l'on se trouve : c'est la <strong>méthode d'Euler explicite</strong>. En physique, c'est la capacité « mettre en œuvre la méthode d'Euler explicite afin de résoudre une équation différentielle d'ordre 1 », par exemple pour un circuit du premier ordre soumis à une tension quelconque (le circuit est étudié dans le chapitre « Circuit linéaire du premier ordre » ; l'exercice 09 en fait la simulation).</div>

  <div class="def-box"><strong>Méthode d'Euler.</strong> Pour le problème \(y' = F(t, y)\), \(y(t_0) = y_0\), avec un pas \(h \gt 0\), on pose \(t_k = t_0 + kh\) et l'on calcule les approximations \(y_k \approx y(t_k)\) par
  $$y_{k+1} = y_k + h\, F(t_k, y_k).$$
  C'est la différence avant de §5 lue à l'envers : \(\dfrac{y(t_{k+1}) - y(t_k)}{h} \approx y'(t_k) = F\big(t_k, y(t_k)\big)\).</div>
  <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):
    <span class="str">"""Méthode d'Euler pour y' = F(t, y), y(t0) = y0 : renvoie les listes</span>
<span class="str">    des instants t_k = t0 + k*h et des approximations y_k de y(t_k), k = 0, …, n."""</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)      <span class="cmt"># pente au point (t_k, y_k)</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys</pre>
  <p>Coût : \(n\) évaluations de \(F\), donc \(O(n)\) en temps ; les deux listes occupent \(O(n)\) en mémoire (complexité en espace, chapitre « Spécification, correction et complexité », §8). Si seule la valeur finale importe, on ne garde que <span class="code-inline">y</span> : l'espace devient \(O(1)\).</p>

  <div class="method-box"><strong>Exemple — \(y' = y\), \(y(0) = 1\), avec \(h = 0{,}25\)</strong>
    <p>Ici \(F(t, y) = y\), donc \(y_{k+1} = y_k + 0{,}25\, y_k = 1{,}25\, y_k\) et \(y_k = 1{,}25^k\). La solution exacte est \(y(t) = \mathrm{e}^t\).</p>

  <div class="notice"><strong>Un pas trop grand.</strong> Pour la décharge d'un condensateur, \(u' = -\dfrac{u}{\tau}\), la méthode donne \(u_{k+1} = \left(1 - \dfrac h\tau\right) u_k\). Si \(h \gt 2\tau\), le facteur \(1 - \dfrac h\tau\) est inférieur à \(-1\) : la solution numérique oscille et explose, alors que la vraie solution décroît vers 0. Le pas doit être petit devant les temps caractéristiques du système (constante de temps, période).

&gt;&gt;&gt; euler(F_rc, 0, 1.0, 2.5, 4)[1]       <span class="cmt"># h = 2,5 tau : oscillations qui explosent</span>

<div class="course-section">
  <div class="sec-num">§7 · ÉQUATIONS D'ORDRE 2 ET SYSTÈMES</div>
  <h2>Le vecteur d'état</h2>
  <div class="intro">La mécanique conduit à des équations d'ordre 2, comme \(\theta'' = -\frac{g}{\ell}\sin\theta\) pour le pendule simple, qu'on ne sait pas résoudre exactement. On se ramène à l'ordre 1 en suivant ensemble la position et la vitesse : le couple \((y, y')\) est l'<strong>état</strong> du système, et la méthode d'Euler s'applique à ce couple.</div>

  <div class="def-box">L'équation \(y'' = G(t, y, y')\) équivaut, en posant \(v = y'\), au <strong>système d'ordre 1</strong>
  $$\begin{cases} y' = v \\ v' = G(t, y, v) \end{cases}$$
  d'inconnue le couple \((y, v)\). La méthode d'Euler s'écrit alors \(y_{k+1} = y_k + h\, v_k\) et \(v_{k+1} = v_k + h\, G(t_k, y_k, v_k)\). Plus généralement, une équation d'ordre \(n\) devient un système de \(n\) équations d'ordre 1, d'inconnues \(y, y', \dots, y^{(n-1)}\).</div>
  <pre class="codeblock"><span class="kw">def</span> euler_ordre2(G, t0, y0, v0, h, n):
    <span class="str">"""y'' = G(t, y, y') avec y(t0) = y0 et y'(t0) = v0 : méthode d'Euler appliquée</span>
<span class="str">    au couple (y, v) où v = y'. Renvoie les listes des t_k, y_k et v_k."""</span>
    ts, ys, vs = [t0], [y0], [v0]
    y, v = y0, v0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        t = t0 + k * h
        y, v = y + h * v, v + h * G(t, y, v)   <span class="cmt"># les deux avec les anciennes valeurs</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
        vs.append(v)
    <span class="kw">return</span> ts, ys, vs</pre>
  <p>Les deux nouvelles valeurs sont calculées avec les <strong>anciennes</strong> valeurs grâce à l'affectation multiple <span class="code-inline">y, v = …</span> : Python évalue tout le membre de droite avant d'affecter. Écrire <span class="code-inline">y = y + h * v</span> puis <span class="code-inline">v = v + h * G(t, y, v)</span> utiliserait le nouveau <span class="code-inline">y</span> dans le calcul de <span class="code-inline">v</span> : ce serait une autre méthode.</p>

  <div class="method-box"><strong>Exemple — la période du pendule dépend de l'amplitude</strong>
    <p>Pour les petites oscillations, \(\sin\theta \approx \theta\) et la période vaut \(T_0 = 2\pi\sqrt{\ell/g}\), soit \(2{,}0061\) s pour \(\ell = 1\) m et \(g = 9{,}81\ \text{m·s}^{-2}\), quelle que soit l'amplitude. Le terme non linéaire \(\sin\theta\) change cela (capacité numérique de physique : « mettre en évidence le non-isochronisme des oscillations »).</p>
    <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> sin, pi, sqrt
g0, L = 9.81, 1.0                 <span class="cmt"># m/s², m</span>

<span class="kw">def</span> G_pendule(t, theta, omega):
    <span class="kw">return</span> -g0 / L * sin(theta)</pre>
    <pre class="codeblock"><span class="kw">def</span> periode(theta0, h):
    <span class="str">"""Période du pendule lâché sans vitesse depuis theta0 &gt; 0 (en radians) :</span>
<span class="str">    quatre fois l'instant du premier passage par theta = 0."""</span>
    ts, th, om = euler_ordre2(G_pendule, 0, theta0, 0.0, h, round(10 / h))
    <span class="kw">for</span> k <span class="kw">in</span> range(len(th) - 1):
        <span class="kw">if</span> th[k] &gt; 0 <span class="kw">and</span> th[k + 1] &lt;= 0:
            <span class="cmt"># interpolation linéaire entre t_k et t_(k+1)</span>
            t0 = ts[k] + h * th[k] / (th[k] - th[k + 1])
            <span class="kw">return</span> 4 * t0
    <span class="kw">return</span> <span class="kw">None</span></pre>
    <ol>
      <li>Lâché sans vitesse depuis \(\theta_0 \gt 0\), le pendule repasse par \(\theta = 0\) pour la première fois au quart de la période.</li>
      <li>On repère le premier \(k\) tel que \(\theta_k \gt 0 \ge \theta_{k+1}\), et l'on interpole linéairement entre \(t_k\) et \(t_{k+1}\).</li>
      <li>On compare à la valeur exacte, qu'on sait calculer par une autre méthode (une intégrale, hors programme).</li>
    </ol>

<tr><th>amplitude \(\theta_0\)</th><th>période (Euler, \(h = 10^{-4}\) s)</th><th>période exacte</th><th>rapport à \(T_0\)</th></tr>
<tr><td>10°</td><td>\(2{,}0099\)</td><td>\(2{,}0099\)</td><td>\(1{,}002\)</td></tr>
<tr><td>45°</td><td>\(2{,}0863\)</td><td>\(2{,}0863\)</td><td>\(1{,}040\)</td></tr>
<tr><td>90°</td><td>\(2{,}3679\)</td><td>\(2{,}3678\)</td><td>\(1{,}180\)</td></tr>
<tr><td>150°</td><td>\(3{,}5354\)</td><td>\(3{,}5351\)</td><td>\(1{,}762\)</td></tr>
</table></div>
    <p>La période augmente avec l'amplitude : 18 % de plus à 90°, 76 % de plus à 150°.</p>

  <div class="notice"><strong>Euler et les oscillateurs.</strong> Pour un oscillateur sans frottement, la méthode d'Euler fait croître l'énergie à chaque pas : l'amplitude calculée augmente, d'autant plus vite que le pas est grand (figure). Il faut un pas très petit devant la période, et contrôler le résultat, par exemple en vérifiant que l'énergie mécanique reste à peu près constante.</div>

  <p>En physique, on utilise la fonction <span class="code-inline">odeint</span> de la bibliothèque <span class="code-inline">scipy.integrate</span>, sa spécification étant fournie : elle prend la fonction qui donne la dérivée du vecteur d'état (attention : arguments dans l'ordre \((Y, t)\)), l'état initial et la liste des instants, et renvoie l'état à chacun de ces instants. Elle utilise une méthode plus précise qu'Euler, avec un pas adapté automatiquement.</p>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint     <span class="cmt"># bibliothèque hors annexe</span>
&gt;&gt;&gt; <span class="kw">def</span> F_vect(Y, t):                       <span class="cmt"># attention à l'ordre (Y, t) imposé par odeint</span>
...     theta, omega = Y
...     <span class="kw">return</span> [omega, -g0 / L * sin(theta)]
&gt;&gt;&gt; sol = odeint(F_vect, [pi / 2, 0.0], [0.0, 0.5, 1.0])
&gt;&gt;&gt; round(float(sol[2][0]), 6)              <span class="cmt"># angle à t = 1 s</span>

<div class="course-section">
  <div class="sec-num">§8 · VALIDER UN CALCUL NUMÉRIQUE</div>
  <h2>Tester, mesurer l'ordre, maîtriser le coût</h2>
  <div class="intro">Un programme de calcul numérique renvoie toujours un nombre, juste ou faux : rien ne signale une erreur de programmation, un pas trop grand ou une perte de précision. Il faut donc le valider, avec les outils du chapitre « Spécification, correction et complexité » (§5 : jeux de tests) adaptés aux flottants.</div>

  <h3>Des cas dont on connaît la réponse</h3>
  <p>Chaque méthode est exacte (aux arrondis près) sur des cas simples : c'est un excellent jeu de tests. Les comparaisons se font toujours à une tolérance.</p>
  <pre class="codeblock"><span class="kw">def</span> affine(x):
    <span class="kw">return</span> 3 * x - 1

<span class="kw">def</span> constante(x):
    <span class="kw">return</span> 2.0

<span class="kw">def</span> pente2(t, y):
    <span class="kw">return</span> 2.0                  <span class="cmt"># y' = 2 : solution affine y = y0 + 2t</span>

<span class="kw">assert</span> abs(trapezes(affine, 0, 2, 7) - 4) &lt;= 1e-12        <span class="cmt"># exacte pour les fonctions affines</span>
<span class="kw">assert</span> abs(rectangles(constante, 1, 4, 5) - 6) &lt;= 1e-12   <span class="cmt"># exacte pour les constantes</span>
ts, ys = euler(pente2, 0, 1.0, 0.1, 10)
<span class="kw">assert</span> abs(ys[10] - 3.0) &lt;= 1e-12                          <span class="cmt"># Euler exact si y'' = 0</span></pre>
  <ul>
    <li>la méthode des trapèzes est exacte pour les fonctions affines (la corde est la courbe), celle des rectangles pour les constantes ;</li>
    <li>la méthode d'Euler est exacte quand la solution est affine (\(y' = \) constante) ;</li>
    <li>la dichotomie appliquée à \(x \mapsto x - c\) doit renvoyer \(c\) à \(\varepsilon / 2\) près ; tester aussi une racine à une extrémité de l'intervalle.</li>
  </ul>

  <h3>Mesurer l'ordre de convergence</h3>
  <p>Sur un cas dont on connaît la valeur exacte, on calcule l'erreur \(E(n)\) pour \(n\), \(2n\), \(4n\)… Si la méthode est d'ordre \(p\), \(E(n) \approx \dfrac{C}{n^p}\), donc \(\dfrac{E(n)}{E(2n)} \approx 2^p\).</p>
  <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> exp, e
<span class="kw">def</span> erreur(methode, n):
    <span class="kw">return</span> abs(methode(exp, 0, 1, n) - (e - 1))

<span class="kw">for</span> n <span class="kw">in</span> [10, 20, 40, 80]:
    print(n, erreur(rectangles, n) / erreur(rectangles, 2 * n),
          erreur(trapezes, n) / erreur(trapezes, 2 * n))</pre>
  <div><table>
<tr><th>\(n\)</th><th>rectangles : \(E(n)/E(2n)\)</th><th>trapèzes : \(E(n)/E(2n)\)</th></tr>
<tr><td>10</td><td>\(1{,}983\)</td><td>\(4{,}000\)</td></tr>
<tr><td>20</td><td>\(1{,}992\)</td><td>\(4{,}000\)</td></tr>
<tr><td>40</td><td>\(1{,}996\)</td><td>\(4{,}000\)</td></tr>
<tr><td>80</td><td>\(1{,}998\)</td><td>\(4{,}000\)</td></tr>
</table></div>
  <p>Les rapports tendent vers 2 et 4 : les ordres 1 et 2 annoncés au §4 sont confirmés. Un rapport inattendu révèle souvent une erreur de programmation (un point oublié, un pas faux).</p>

  <h3>Le coût d'une précision</h3>
  <div class="prop-box"><strong>Comparer les méthodes</strong> par le nombre d'évaluations de la fonction pour une précision \(\varepsilon\) donnée :
    <ul>
      <li>dichotomie : \(\log_2 \frac{b - a}{\varepsilon}\) évaluations, soit 20 pour \(10^{-6}\) sur un intervalle de longueur 1 ;</li>
      <li>Newton, près d'un zéro simple : quelques itérations, mais deux évaluations (\(f\) et \(f'\)) par itération ;</li>
      <li>méthode d'ordre \(p\) (rectangles, trapèzes, Euler) : erreur en \(\frac{C}{n^p}\), donc \(n\) de l'ordre de \(\left(\frac{C}{\varepsilon}\right)^{1/p}\) : gagner un chiffre multiplie le coût par 10 à l'ordre 1, par \(\sqrt{10} \approx 3{,}2\) à l'ordre 2.</li>
    </ul>
  </div>
  <div class="notice"><strong>Valider aussi le résultat physique</strong> : ordre de grandeur, signe, unité, comportement attendu (la vitesse tend-elle vers une limite ? l'énergie se conserve-t-elle ?), et stabilité du résultat quand on divise le pas par 2. Le chapitre « Résolution numérique en sciences de l'ingénieur » (§9) détaille cette démarche.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Méthodes plus précises</h2>
  <div class="intro">Rien de cette section n'est exigible ; elle explique ce que font les fonctions des bibliothèques.</div>
  <ul>
    <li><strong>Méthode de Simpson</strong> : sur chaque paire de sous-intervalles, on remplace la courbe par une parabole. Erreur en \(\frac1{n^4}\) (ordre 4) pour un coût du même ordre que les trapèzes.</li>
    <li><strong>Méthodes de Runge-Kutta</strong> : pour \(y' = F(t, y)\), on évalue la pente en plusieurs points de chaque pas et l'on fait une moyenne pondérée. La méthode « RK4 » est d'ordre 4 ; <span class="code-inline">odeint</span> utilise des méthodes de ce type, avec un pas variable.</li>
    <li><strong>Stabilité</strong> : la méthode d'Euler <em>implicite</em>, \(y_{k+1} = y_k + h\,F(t_{k+1}, y_{k+1})\), demande de résoudre une équation à chaque pas, mais ne diverge pas sur \(u' = -u/\tau\) quel que soit le pas. La méthode d'Euler <em>symplectique</em> (calculer \(v\) avec le nouveau \(y\)) conserve bien mieux l'énergie d'un oscillateur.</li>
    <li><strong>Méthode de la sécante</strong> : la méthode de Newton où la dérivée est remplacée par la pente de la corde entre les deux derniers points ; pas besoin de \(f'\), convergence presque aussi rapide.</li>
    <li><strong>Systèmes linéaires</strong> : l'algorithme du pivot de Gauss (cours de mathématiques) et son usage en sciences de l'ingénieur (chapitre « Résolution numérique en sciences de l'ingénieur », §5).</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="numr-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ALGORITHMES NUMÉRIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Programmer une méthode numérique, c'est choisir la méthode, écrire une boucle sûre, connaître son coût et son erreur, puis vérifier le résultat. Ces réflexes servent en informatique comme dans les capacités numériques de physique et de sciences de l'ingénieur.</div>

  <div class="method-box"><strong>Méthode 1 — Localiser une racine avant de la calculer</strong>
    <ol>
      <li>Tabuler \(f\) sur un intervalle raisonnable (ou la tracer) avec des abscisses <span class="code-inline">a + k * h</span>.</li>
      <li>Repérer deux points consécutifs où \(f\) change de signe ; vérifier que \(f\) est continue entre les deux.</li>
      <li>Si possible, montrer l'unicité du zéro dans l'intervalle (signe de \(f'\), monotonie).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x) = \mathrm{e}^x - 3x\) : \(f(1) \approx -0{,}28 \lt 0\) et \(f(2) \approx 1{,}39 \gt 0\), et \(f'(x) = \mathrm{e}^x - 3\) s'annule en \(\ln 3 \approx 1{,}10\) : \(f\) décroît sur \([1, \ln 3]\), où elle reste négative, puis croît strictement sur \([\ln 3, 2]\). Un seul zéro dans \([1, 2]\), entre \(\ln 3\) et 2.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Appliquer la dichotomie avec une précision donnée</strong>
    <ol>
      <li>Vérifier le <strong>changement de signe</strong> : \(f(a) \cdot f(b) \le 0\), avec \(f\) continue sur \([a, b]\).</li>
      <li>Boucler tant que l'intervalle est plus large que la précision voulue \(\varepsilon\) ; garder <span class="code-inline">fa = f(a)</span> pour une seule évaluation par tour.</li>
      <li>À chaque tour, garder la moitié où \(f\) change de signe : si <span class="code-inline">fa * f(m) &lt;= 0</span>, \(b \leftarrow m\) ; sinon \(a \leftarrow m\).</li>
      <li>Nombre d'étapes : \(N = \left\lceil \log_2 \dfrac{b - a}{\varepsilon} \right\rceil\). Pour une précision très fine (proche de l'écart entre flottants), fixer ce nombre par une boucle <span class="code-inline">for</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> sur \([0, 1]\) à \(10^{-10}\) près : \(2^{33} \approx 8{,}6 \times 10^9 \lt 10^{10} \le 2^{34}\), donc 34 étapes.</p>
    <pre class="codeblock"><span class="kw">def</span> zero_dicho_n(f, a, b, n):
    <span class="str">"""Même précondition que zero_dicho ; fait exactement n étapes et renvoie le</span>
<span class="str">    milieu du dernier intervalle, à distance au plus (b - a) / 2**(n+1) d'un zéro."""</span>
    fa = f(a)
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2</pre>
  </div>

  <div class="method-box"><strong>Méthode 3 — Choisir entre dichotomie et Newton</strong>
    <ol>
      <li>Pas de dérivée disponible, ou robustesse voulue → <strong>dichotomie</strong> (sûre, lente).</li>
      <li>Dérivée connue et bon point de départ → <strong>Newton</strong> (rapide, mais peut diverger).</li>
      <li>Pour Newton : borner le nombre d'itérations, tester \(f'(x_k) \ne 0\), s'arrêter quand deux termes consécutifs sont proches, puis vérifier que \(f(x)\) est petit.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\sqrt 2\), Newton depuis 2 atteint la précision maximale en 5 itérations ; la dichotomie sur \([1, 2]\) en demande 52.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Programmer une intégrale approchée</strong>
    <ol>
      <li>Poser le pas <span class="code-inline">h = (b - a) / n</span> (division flottante) et les points <span class="code-inline">a + k * h</span>.</li>
      <li>Rectangles à gauche : \(k\) de 0 à \(n - 1\) (<span class="code-inline">range(n)</span>), puis multiplier la somme par \(h\).</li>
      <li>Trapèzes : partir de \(\dfrac{f(a) + f(b)}2\), ajouter \(f(x_k)\) pour \(k\) de 1 à \(n - 1\) (<span class="code-inline">range(1, n)</span>), multiplier par \(h\).</li>
      <li>Choisir \(n\) d'après la majoration de l'erreur : en \(\dfrac{M_1 (b-a)^2}{2n}\) pour les rectangles, \(\dfrac{M_2 (b-a)^3}{12 n^2}\) pour les trapèzes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\int_0^1 x^2\,\mathrm{d}x\) avec \(n = 4\) : rectangles \(\dfrac14(0 + \frac1{16} + \frac14 + \frac9{16}) = 0{,}218\,75\) ; trapèzes \(0{,}218\,75 + \dfrac14 \cdot \dfrac{1 - 0}{2} = 0{,}343\,75\) ; valeur exacte \(\frac13\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(n\) sous-intervalles, mais \(n + 1\) points. Une boucle <span class="code-inline">range(n + 1)</span> dans les rectangles compte un rectangle de trop.</div>

  <div class="method-box"><strong>Méthode 5 — Intégrer ou dériver une liste de mesures</strong>
    <ol>
      <li>Vérifier que les listes des instants et des valeurs ont la même longueur et que les instants croissent.</li>
      <li>Intégrer par les trapèzes avec le pas local \(t_{k+1} - t_k\) : la somme des \((t_{k+1} - t_k)\dfrac{y_k + y_{k+1}}2\).</li>
      <li>Dériver par les taux d'accroissement \(\dfrac{y_{k+1} - y_k}{t_{k+1} - t_k}\) : la liste obtenue a un élément de moins.</li>
      <li>Méfiance : dériver amplifie le bruit des mesures ; intégrer le lisse.</li>
    </ol>
    <p><em>Exemple éclair :</em> vitesses 0 ; 4 ; 6 m/s aux instants 0 ; 1 ; 3 s : distance \(1 \times \frac{0 + 4}2 + 2 \times \frac{4 + 6}2 = 12\) m ; accélérations 4 puis 1 m/s².</p>
    <pre class="codeblock"><span class="kw">def</span> trapezes_mesures(t, y):
    <span class="str">"""Valeur approchée de l'intégrale de la grandeur y entre t[0] et t[n-1] (n = len(t)),</span>
<span class="str">    les mesures y[k] étant prises aux instants croissants t[k] (pas éventuellement variable)."""</span>
    s = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(len(t) - 1):
        s = s + (t[k + 1] - t[k]) * (y[k] + y[k + 1]) / 2
    <span class="kw">return</span> s</pre>
  </div>

  <div class="method-box"><strong>Méthode 6 — Approcher une dérivée et choisir le pas</strong>
    <ol>
      <li>Différence avant \(\dfrac{f(x + h) - f(x)}{h}\) (erreur de méthode en \(h\)) ou centrée \(\dfrac{f(x + h) - f(x - h)}{2h}\) (erreur en \(h^2\)), si \(f\) est connue des deux côtés.</li>
      <li>Ne pas prendre \(h\) trop petit : la cancellation donne une erreur d'arrondi de l'ordre de \(\dfrac{10^{-16}\,|f(x)|}{h}\).</li>
      <li>Pour des grandeurs de l'ordre de 1 : \(h \approx 10^{-8}\) (avant), \(h \approx 10^{-5}\) (centrée).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\sin'(1) = \cos 1\), la différence avant donne une erreur de \(4 \times 10^{-5}\) avec \(h = 10^{-4}\), \(3 \times 10^{-9}\) avec \(h = 10^{-8}\), mais \(4 \times 10^{-5}\) de nouveau avec \(h = 10^{-12}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Appliquer la méthode d'Euler à une équation différentielle</strong>
    <ol>
      <li>Mettre l'équation sous la forme \(y' = F(t, y)\) : isoler la dérivée (pour \(\tau u' + u = e(t)\) : \(F(t, u) = \dfrac{e(t) - u}{\tau}\)).</li>
      <li>Pour une équation d'ordre 2, \(y'' = G(t, y, y')\), poser \(v = y'\) et travailler sur le couple \((y, v)\) : \(y' = v\), \(v' = G(t, y, v)\).</li>
      <li>Écrire la récurrence \(y_{k+1} = y_k + h\,F(t_k, y_k)\), avec \(t_k = t_0 + kh\) ; pour un couple, mettre à jour les deux composantes avec les anciennes valeurs (<span class="code-inline">y, v = y + h * v, v + h * G(t, y, v)</span>).</li>
      <li>Choisir \(h\) petit devant les temps caractéristiques (constante de temps, période), et vérifier en divisant \(h\) par 2.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y' = -2y\), \(y(0) = 1\), \(h = 0{,}1\) : \(y_{k+1} = 0{,}8\,y_k\), \(y_1 = 0{,}8\), \(y_2 = 0{,}64\) ; exact \(\mathrm{e}^{-0{,}4} \approx 0{,}670\).</p>
    <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):
    <span class="str">"""Méthode d'Euler pour y' = F(t, y), y(t0) = y0 : renvoie les listes</span>
<span class="str">    des instants t_k = t0 + k*h et des approximations y_k de y(t_k), k = 0, …, n."""</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)      <span class="cmt"># pente au point (t_k, y_k)</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys</pre>
  </div>
  <div class="notice"><strong>Piège</strong> : pour un système, écrire <span class="code-inline">y = y + h * v</span> puis <span class="code-inline">v = v + h * G(t, y, v)</span> utilise le nouveau <span class="code-inline">y</span> : ce n'est plus la méthode d'Euler explicite demandée.</div>

  <div class="method-box"><strong>Méthode 8 — Valider un résultat numérique</strong>
    <ol>
      <li>Tester sur des cas dont on connaît la réponse : fonction affine (trapèzes), constante (rectangles), \(y' =\) constante (Euler), \(x - c\) (dichotomie).</li>
      <li>Comparer les flottants à une tolérance, jamais avec <span class="code-inline">==</span>.</li>
      <li>Mesurer l'ordre : calculer l'erreur pour \(n\) et \(2n\) ; le rapport doit être proche de \(2^p\) pour une méthode d'ordre \(p\).</li>
      <li>Vérifier la vraisemblance : ordre de grandeur, unité, comportement attendu, résultat stable quand on divise le pas par 2.</li>
    </ol>
    <p><em>Exemple éclair :</em> une « méthode des trapèzes » dont l'erreur n'est divisée que par 2 quand \(n\) double est mal programmée (extrémités comptées en entier, par exemple).</p>
    <pre class="codeblock"><span class="kw">def</span> affine(x):
    <span class="kw">return</span> 3 * x - 1

<span class="kw">def</span> constante(x):
    <span class="kw">return</span> 2.0

<span class="kw">def</span> pente2(t, y):
    <span class="kw">return</span> 2.0                  <span class="cmt"># y' = 2 : solution affine y = y0 + 2t</span>

<span class="kw">assert</span> abs(trapezes(affine, 0, 2, 7) - 4) &lt;= 1e-12        <span class="cmt"># exacte pour les fonctions affines</span>
<span class="kw">assert</span> abs(rectangles(constante, 1, 4, 5) - 6) &lt;= 1e-12   <span class="cmt"># exacte pour les constantes</span>
ts, ys = euler(pente2, 0, 1.0, 0.1, 10)
<span class="kw">assert</span> abs(ys[10] - 3.0) &lt;= 1e-12                          <span class="cmt"># Euler exact si y'' = 0</span></pre>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> :
    <ul>
      <li>dichotomie sans changement de signe sur \([a, b]\) : aucun zéro garanti ;</li>
      <li>confondre nombre de sous-intervalles \(n\) et largeur \(h = (b-a)/n\) ;</li>
      <li>Newton avec \(f'(x) = 0\) : division par zéro ;</li>
      <li>croire qu'un résultat numérique est exact : c'est une <strong>approximation</strong>, entachée d'une erreur de méthode et d'erreurs d'arrondi ;</li>
      <li>calculer les abscisses ou les instants par <span class="code-inline">x = x + h</span> sur de nombreux pas.</li>
    </ul>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Racine carrée par dichotomie</h3>
  <div class="statement">On veut approcher \(\sqrt{2}\), zéro de \(f(x) = x^2 - 2\) sur \([1, 2]\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier qu'il y a bien un zéro dans \([1,2]\).</div>
  <div class="q"><strong>Q2.</strong> Donner l'intervalle après 2 étapes de dichotomie.</div>
  <div class="q"><strong>Q3.</strong> Combien d'étapes faut-il pour obtenir un intervalle de largeur au plus \(10^{-6}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(1) = -1 \lt 0\) et \(f(2) = 2 \gt 0\) : \(f\) est continue et change de signe → un zéro existe dans \([1,2]\) (théorème des valeurs intermédiaires). Il est unique, car \(f\) est strictement croissante sur \([1, 2]\).</p>
    <p><strong>Q2.</strong> \(m = 1{,}5\), \(f(1{,}5) = 0{,}25 \gt 0\) → on garde \([1 ; 1{,}5]\). Puis \(m = 1{,}25\), \(f(1{,}25) = -0{,}4375 \lt 0\) → on garde \([1{,}25 ; 1{,}5]\). (\(\sqrt{2} \approx 1{,}414\) y est bien.)</p>
    <p><strong>Q3.</strong> Après \(N\) étapes, la largeur vaut \(\dfrac{1}{2^N}\). Il faut \(2^N \ge 10^6\) : \(2^{19} = 524\,288\) ne suffit pas, \(2^{20} = 1\,048\,576\) suffit. Il faut 20 étapes, donc 20 évaluations de \(f\) au milieu.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Méthode des rectangles</h3>
  <div class="statement">Approcher \(\displaystyle\int_0^1 x^2\,dx\) (valeur exacte \(1/3\)) par les rectangles à gauche avec \(n = 2\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la valeur approchée par les rectangles à gauche.</div>
  <div class="q"><strong>Q2.</strong> Même question avec la méthode des trapèzes, toujours avec \(n = 2\).</div>
  <div class="q"><strong>Q3.</strong> Comparer les erreurs. Expliquer leur signe à l'aide du sens de variation et de la convexité de \(x \mapsto x^2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(h = 0{,}5\). Bords gauches : \(x = 0\) et \(x = 0{,}5\). Somme \(= h\,(f(0) + f(0{,}5)) = 0{,}5\,(0 + 0{,}25) = 0{,}125\). C'est une sous-estimation grossière (exact \(\approx 0{,}333\)) : il faut un \(n\) plus grand.</p>
    <p><strong>Q2.</strong> \(T_2 = h\left(\dfrac{f(0) + f(1)}2 + f(0{,}5)\right)\), soit \(T_2 = 0{,}5\,(0{,}5 + 0{,}25) = 0{,}375\).</p>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Une dichotomie à précision donnée</h3>
  <div class="statement">On cherche le réel \(c\) tel que \(\cos c = c\). On pose \(\varphi(x) = \cos x - x\) ; on dispose de <span class="code-inline">cos</span> du module <span class="code-inline">math</span>.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\varphi\) a un unique zéro dans \([0, 1]\).</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction <span class="code-inline">zero_dicho_n(f, a, b, n)</span> qui effectue exactement <span class="code-inline">n</span> étapes de dichotomie et renvoie le milieu du dernier intervalle. Donner un invariant de la boucle.</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">nb_etapes(a, b, eps)</span>, qui renvoie le plus petit entier \(N\) tel que \(\dfrac{b - a}{2^N} \le \varepsilon\). Combien d'étapes faut-il pour une précision de \(10^{-10}\) ? Combien d'évaluations de \(\varphi\) ?</div>
  <div class="q"><strong>Q4.</strong> Pourquoi la boucle <span class="code-inline">for</span> est-elle ici plus sûre qu'une boucle <span class="code-inline">while b - a &gt; eps</span> ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\varphi\) est continue, \(\varphi(0) = 1 \gt 0\) et \(\varphi(1) = \cos 1 - 1 \approx -0{,}46 \lt 0\) : elle s'annule sur \([0, 1]\). Comme \(\varphi'(x) = -\sin x - 1 \lt 0\) sur \([0, 1]\), elle est strictement décroissante : le zéro est unique.</p>
    <p><strong>Q2.</strong> On garde <span class="code-inline">fa</span> pour n'évaluer \(\varphi\) qu'une fois par tour.</p>
    <pre class="codeblock"><span class="kw">def</span> zero_dicho_n(f, a, b, n):
    <span class="str">"""Même précondition que zero_dicho ; fait exactement n étapes et renvoie le</span>
<span class="str">    milieu du dernier intervalle, à distance au plus (b - a) / 2**(n+1) d'un zéro."""</span>
    fa = f(a)
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        m = (a + b) / 2
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2</pre>
    <p>Invariant : \(a \lt b\), <span class="code-inline">fa</span> vaut \(f(a)\), \(f(a) f(b) \le 0\), et après \(k\) tours \(b - a = \dfrac{b_0 - a_0}{2^k}\) (en calcul exact). La boucle <span class="code-inline">for</span> fait \(n\) tours : la terminaison est immédiate.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> nb_etapes(a, b, eps):
    <span class="str">"""Plus petit entier N tel que (b - a) / 2**N &lt;= eps."""</span>
    N = 0
    <span class="kw">while</span> (b - a) / 2 ** N &gt; eps:
        N = N + 1
    <span class="kw">return</span> N</pre>
    <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> cos

<span class="kw">def</span> phi(x):
    <span class="kw">return</span> cos(x) - x</pre>
    <pre class="codeblock">&gt;&gt;&gt; phi(0), phi(1) &lt; 0
(1.0, <span class="kw">True</span>)
&gt;&gt;&gt; nb_etapes(0, 1, 1e-10)
34
&gt;&gt;&gt; zero_dicho_n(phi, 0, 1, 34)
0.7390851332165767</pre>
    <p>\(2^{33} \lt 10^{10} \le 2^{34}\) : 34 étapes, soit 35 évaluations de \(\varphi\) (une en \(a\), puis une par étape). Le résultat, 0,7390851332…, est à moins de \(\dfrac{1}{2^{35}} \approx 3 \times 10^{-11}\) du zéro.</p>
    <p><strong>Q4.</strong> Le nombre de tours est fixé avant la boucle : elle termine même si la précision demandée est plus fine que l'écart entre deux flottants voisins, cas où le test <span class="code-inline">b - a &gt; eps</span> pourrait rester vrai indéfiniment (exercice suivant).</p>

  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une dichotomie qui ne s'arrête pas</h3>
  <div class="statement">On utilise la fonction <span class="code-inline">zero_dicho(f, a, b, eps)</span> du cours (§2), qui boucle tant que <span class="code-inline">b - a &gt; eps</span>. Le programme suivant ne s'arrête jamais :
  <pre class="codeblock"><span class="kw">def</span> q(x):
    <span class="kw">return</span> x * x - 2e12            <span class="cmt"># zéro : racine de 2·10**12, environ 1 414 213,56</span>

r = zero_dicho(q, 1e6, 2e6, 1e-12)</pre></div>
  <div class="q"><strong>Q1.</strong> Vérifier que les préconditions sont satisfaites. Combien d'étapes faudrait-il en calcul exact ?</div>
  <div class="q"><strong>Q2.</strong> Près de \(1{,}4 \times 10^6\), deux flottants voisins sont espacés d'environ \(2{,}3 \times 10^{-10}\). Expliquer pourquoi la boucle ne termine pas.</div>
  <div class="q"><strong>Q3.</strong> Écrire une version <span class="code-inline">zero_dicho_sur</span> qui s'arrête aussi quand l'intervalle ne peut plus être coupé. Quelle précision peut-on espérer au mieux sur cette racine ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(q\) est continue, \(q(10^6) = 10^{12} - 2 \times 10^{12} \lt 0\) et \(q(2 \times 10^6) = 2 \times 10^{12} \gt 0\) ; \(a \lt b\) et \(\varepsilon \gt 0\). En calcul exact, il faudrait \(\left\lceil \log_2 \dfrac{10^6}{10^{-12}} \right\rceil = \lceil \log_2 10^{18} \rceil = 60\) étapes.</p>
    <p><strong>Q2.</strong> Après une cinquantaine d'étapes (\(10^6 / 2^{52} \approx 2{,}2 \times 10^{-10}\)), \(a\) et \(b\) sont deux flottants voisins, distants d'environ \(2{,}3 \times 10^{-10}\), largeur encore supérieure à \(10^{-12}\). Leur milieu exact n'est pas un flottant : il est arrondi à \(a\) ou à \(b\). L'intervalle reste alors le même à chaque tour, \(b - a\) ne diminue plus, et la condition <span class="code-inline">b - a &gt; eps</span> reste vraie : la boucle tourne indéfiniment. Le « variant » réel \(b - a\) ne décroît plus, parce que les flottants ne sont pas les réels.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> zero_dicho_sur(f, a, b, eps):
    <span class="str">"""Comme zero_dicho, mais s'arrête aussi quand a et b sont deux flottants voisins."""</span>
    fa = f(a)
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b) / 2
        <span class="kw">if</span> m == a <span class="kw">or</span> m == b:       <span class="cmt"># plus aucun flottant entre a et b</span>
            <span class="kw">return</span> m
        fm = f(m)
        <span class="kw">if</span> fa * fm &lt;= 0:
            b = m
        <span class="kw">else</span>:
            a, fa = m, fm
    <span class="kw">return</span> (a + b) / 2</pre>
    <pre class="codeblock"><span class="kw">def</span> q(x):
    <span class="kw">return</span> x * x - 2e12</pre>
    <pre class="codeblock">&gt;&gt;&gt; zero_dicho_sur(q, 1e6, 2e6, 1e-12)
1414213.5623730952
&gt;&gt;&gt; 2e12 ** 0.5
1414213.562373095</pre>
    <p>La terminaison est maintenant assurée : tant que <span class="code-inline">m</span> est strictement entre <span class="code-inline">a</span> et <span class="code-inline">b</span>, l'intervalle rétrécit strictement, et il n'y a qu'un nombre fini de flottants entre \(a_0\) et \(b_0\). On ne peut espérer mieux qu'un écart entre flottants voisins, environ \(2{,}3 \times 10^{-10}\), soit une précision relative de \(1{,}6 \times 10^{-16}\) : le résultat est l'un des deux flottants qui encadrent \(\sqrt{2 \times 10^{12}}\). Il faut donc toujours choisir \(\varepsilon\) en tenant compte de la grandeur de la racine (précision relative).</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Pourquoi ne peut-on pas utiliser la fonction <span class="code-inline">trapezes(f, a, b, n)</span> du cours ? Écrire une fonction <span class="code-inline">trapezes_mesures(t, y)</span> qui approche l'intégrale de la grandeur mesurée entre le premier et le dernier instant.</div>
  <div class="q"><strong>Q2.</strong> Calculer la distance parcourue entre 0 et 6 s, et la vitesse moyenne.</div>
  <div class="q"><strong>Q3.</strong> Écrire une fonction <span class="code-inline">derivee_mesures(t, y)</span> qui renvoie les listes des instants \(t_k\) et des accélérations approchées \(\dfrac{v_{k+1} - v_k}{t_{k+1} - t_k}\). Quelle est la complexité de ces deux fonctions ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On ne dispose pas d'une fonction <span class="code-inline">f</span> qu'on pourrait évaluer en tout point, seulement de valeurs aux instants mesurés, et le pas n'est pas constant. On somme les trapèzes de largeur locale \(t_{k+1} - t_k\) :</p>
    <pre class="codeblock"><span class="kw">def</span> trapezes_mesures(t, y):
    <span class="str">"""Valeur approchée de l'intégrale de la grandeur y entre t[0] et t[n-1] (n = len(t)),</span>
<span class="str">    les mesures y[k] étant prises aux instants croissants t[k] (pas éventuellement variable)."""</span>
    s = 0
    <span class="kw">for</span> k <span class="kw">in</span> range(len(t) - 1):
        s = s + (t[k + 1] - t[k]) * (y[k] + y[k + 1]) / 2
    <span class="kw">return</span> s</pre>
    <p><strong>Q2.</strong> Somme des six trapèzes :</p>
    <div class="formula">$$\begin{aligned} d &\approx 0{,}5 \times \tfrac{0 + 1{,}8}{2} + 0{,}5 \times \tfrac{1{,}8 + 3{,}2}{2} \\ &\quad + 1 \times \tfrac{3{,}2 + 5{,}0}{2} + 1 \times \tfrac{5{,}0 + 5{,}9}{2} \\ &\quad + 1{,}5 \times \tfrac{5{,}9 + 6{,}2}{2} + 1{,}5 \times \tfrac{6{,}2 + 6{,}3}{2} \\ &= 0{,}45 + 1{,}25 + 4{,}1 + 5{,}45 \\ &\quad + 9{,}075 + 9{,}375 = 29{,}7\ \text{m}. \end{aligned}$$</div>
    <p>Vitesse moyenne : \(\dfrac{29{,}7}{6} = 4{,}95\ \text{m·s}^{-1}\).</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> derivee_mesures(t, y):
    <span class="str">"""Listes des instants t[k] et des dérivées approchées (y[k+1] - y[k]) / (t[k+1] - t[k])</span>
<span class="str">    pour k = 0, …, n - 2 (différences avant)."""</span>
    ts, ds = [], []
    <span class="kw">for</span> k <span class="kw">in</span> range(len(t) - 1):
        ts.append(t[k])
        ds.append((y[k + 1] - y[k]) / (t[k + 1] - t[k]))
    <span class="kw">return</span> ts, ds</pre>
    <pre class="codeblock">&gt;&gt;&gt; d = trapezes_mesures(t, v)
&gt;&gt;&gt; round(d, 3), round(d / 6.0, 3)         <span class="cmt"># distance (m) et vitesse moyenne (m/s)</span>
(29.7, 4.95)
&gt;&gt;&gt; ts, acc = derivee_mesures(t, v)
&gt;&gt;&gt; [round(x, 2) <span class="kw">for</span> x <span class="kw">in</span> acc]             <span class="cmt"># accélérations (m/s²)</span>
[3.6, 2.8, 1.8, 0.9, 0.2, 0.07]</pre>
    <p>Chaque fonction fait un seul parcours des listes : complexité \(O(n)\) pour \(n\) mesures. L'accélération décroît : le chariot atteint une vitesse limite. Une erreur de mesure de 0,1 m/s sur une vitesse prise à 0,5 s d'intervalle donne une erreur de 0,2 m/s² sur l'accélération : la dérivation amplifie le bruit, l'intégration le lisse.</p>
  </div>
</div>

<div class="exo">
