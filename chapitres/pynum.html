  <h3>Racine carrée par la méthode de Newton</h3>
  <div class="statement">La méthode de Newton relève des programmes de mathématiques et de sciences de l'ingénieur ; on rappelle sa formule : \(x_{k+1} = x_k - \dfrac{f(x_k)}{f'(x_k)}\). Soit \(a \gt 0\) ; on cherche \(\sqrt a\), zéro positif de \(f(x) = x^2 - a\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que la récurrence s'écrit \(x_{k+1} = \dfrac12\left(x_k + \dfrac{a}{x_k}\right)\) (méthode de Héron).</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction <span class="code-inline">racine(a, eps)</span> qui part de \(x_0 = a\), s'arrête dès que \(|x_{k+1} - x_k| \le \varepsilon\, x_{k+1}\) et renvoie la valeur obtenue et le nombre d'itérations. Pourquoi un critère relatif ?</div>
  <div class="q"><strong>Q3.</strong> Que donnent <span class="code-inline">racine(2, 1e-15)</span> et <span class="code-inline">racine(1e6, 1e-15)</span> ? Comparer au nombre d'étapes d'une dichotomie.</div>
  <div class="q"><strong>Q4.</strong> Que se passe-t-il si l'on part de \(x_0 = 0\) ? de \(x_0 \lt 0\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f'(x) = 2x\), donc</p>
    <div class="formula">$$x_{k+1} = x_k - \frac{x_k^2 - a}{2x_k} = \frac{2x_k^2 - x_k^2 + a}{2x_k} = \frac12\left(x_k + \frac{a}{x_k}\right).$$</div>
    <p><strong>Q2.</strong> Un critère absolu \(|x_{k+1} - x_k| \le \varepsilon\) ne convient pas à toutes les grandeurs : pour \(a = 10^{12}\), deux flottants voisins près de \(10^6\) sont espacés de \(1{,}2 \times 10^{-10}\), et un seuil absolu de \(10^{-15}\) ne serait jamais atteint (sauf égalité exacte). Le critère relatif demande 15 chiffres significatifs communs, quelle que soit la grandeur.</p>
    <pre class="codeblock"><span class="kw">def</span> racine(a, eps):
    <span class="str">"""Racine carrée de a &gt; 0 par la méthode de Newton appliquée à x**2 - a,</span>
<span class="str">    depuis x0 = a ; renvoie la valeur et le nombre d'itérations."""</span>
    <span class="kw">assert</span> a &gt; 0
    x = a
    k = 0
    <span class="kw">while</span> <span class="kw">True</span>:
        x_suiv = (x + a / x) / 2
        k = k + 1
        <span class="kw">if</span> abs(x_suiv - x) &lt;= eps * x_suiv:     <span class="cmt"># critère relatif</span>
            <span class="kw">return</span> x_suiv, k
        x = x_suiv</pre>
    <p>Terminaison : elle n'est pas garantie par la boucle <span class="code-inline">while True</span> elle-même ; on admet ici la convergence de la suite (résultat de mathématiques : pour \(x_0 \gt 0\), la suite décroît vers \(\sqrt a\) à partir du rang 1). Par prudence, on peut borner le nombre d'itérations comme dans le cours.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock">&gt;&gt;&gt; racine(2, 1e-15)
(1.414213562373095, 6)
&gt;&gt;&gt; racine(1e6, 1e-15)
(1000.0, 16)</pre>
    <p>6 itérations pour \(\sqrt 2\) (dichotomie sur \([1, 2]\) : une cinquantaine d'étapes pour la même précision). Pour \(a = 10^6\), 16 itérations : depuis \(x_0 = 10^6\), loin de la racine, chaque itération divise d'abord \(x\) par 2 environ (\(x_{k+1} \approx x_k / 2\) quand \(x_k \gg \sqrt a\)) ; la convergence rapide ne commence qu'à proximité de 1 000. Un meilleur point de départ réduirait le nombre d'itérations.</p>
    <p><strong>Q4.</strong> Avec \(x_0 = 0\), la tangente est horizontale : division par zéro (<span class="code-inline">ZeroDivisionError</span>). Avec \(x_0 \lt 0\), la suite converge vers \(-\sqrt a\), l'autre zéro de \(f\) : la méthode trouve le zéro « proche » du point de départ, pas forcément celui qu'on cherche. Il faut donc imposer \(x_0 \gt 0\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Circuit RC soumis à un créneau</h3>
  <div class="statement">Un condensateur, initialement déchargé, est alimenté par un générateur de créneaux à travers une résistance. La tension \(u\) à ses bornes vérifie \(\tau\,\dfrac{\mathrm{d}u}{\mathrm{d}t} + u = e(t)\), avec \(\tau = 1\) ms. La tension \(e(t)\) vaut \(E = 5\) V pendant 2 ms, puis 0 V pendant 2 ms, et ainsi de suite (période 4 ms). C'est une capacité numérique du programme de physique : simuler la réponse d'un système du premier ordre à une excitation de forme quelconque. On choisit un pas \(h = 10^{-5}\) s.</div>
  <div class="q"><strong>Q1.</strong> Mettre l'équation sous la forme \(u' = F(t, u)\) et écrire la relation de récurrence de la méthode d'Euler.</div>
  <div class="q"><strong>Q2.</strong> Une demi-période compte \(p = 200\) pas. Écrire une fonction <span class="code-inline">e(k)</span> qui renvoie la tension du générateur au pas <span class="code-inline">k</span> (à l'instant \(kh\)), en n'utilisant que des opérations sur les entiers, puis une fonction <span class="code-inline">simulation(n)</span> qui renvoie la liste \([u_0, \dots, u_n]\).</div>
  <div class="q"><strong>Q3.</strong> À la fin de la première demi-période (\(t = 2\) ms), la solution exacte vaut \(E(1 - \mathrm{e}^{-2}) \approx 4{,}3233\) V. Montrer que \(u_{200} = E\left(1 - 0{,}99^{200}\right)\) et commenter l'écart.</div>
  <div class="q"><strong>Q4.</strong> En régime établi, la tension oscille entre \(\dfrac{E}{1 + \mathrm{e}^{-2}} \approx 4{,}404\) V et \(\dfrac{E\,\mathrm{e}^{-2}}{1 + \mathrm{e}^{-2}} \approx 0{,}596\) V. Comparer à la simulation de 10 périodes. Pourquoi le pas ne doit-il pas dépasser \(2\tau\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u' = F(t, u) = \dfrac{e(t) - u}{\tau}\), d'où</p>
    <div class="formula">$$u_{k+1} = u_k + h\,\frac{e(t_k) - u_k}{\tau} = \left(1 - \frac h\tau\right) u_k + \frac h\tau\, e(t_k).$$</div>
    <p><strong>Q2.</strong> Le numéro de la demi-période en cours est <span class="code-inline">k // p</span> ; elle est « haute » s'il est pair. Travailler sur l'entier <span class="code-inline">k</span> évite de tester un instant flottant (\(t = 0{,}002\) exactement ? le flottant calculé peut valoir 0,0019999…).</p>
    <pre class="codeblock">tau, E = 1e-3, 5.0         <span class="cmt"># constante de temps (s), tension haute du créneau (V)</span>
h = 1e-5                   <span class="cmt"># pas : tau / 100</span>
p = 200                    <span class="cmt"># nombre de pas par demi-période de 2 ms</span>

<span class="kw">def</span> e(k):
    <span class="str">"""Tension du générateur au pas k : E pendant p pas, puis 0 pendant p pas, etc."""</span>
    <span class="kw">if</span> (k // p) % 2 == 0:
        <span class="kw">return</span> E
    <span class="kw">return</span> 0.0

<span class="kw">def</span> simulation(n):
    <span class="str">"""Liste des tensions u_0, …, u_n aux instants k*h (condensateur déchargé au départ)."""</span>
    u = 0.0
    us = [u]
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        u = u + h * (e(k) - u) / tau      <span class="cmt"># u' = (e - u) / tau</span>
        us.append(u)
    <span class="kw">return</span> us</pre>
    <pre class="codeblock">&gt;&gt;&gt; us = simulation(4000)                 <span class="cmt"># 10 périodes de 4 ms</span>
&gt;&gt;&gt; round(us[200], 4)                     <span class="cmt"># fin de la 1re demi-période (t = 2 ms)</span>
4.3301
&gt;&gt;&gt; round(max(us[3600:]), 3), round(min(us[3600:]), 3)   <span class="cmt"># régime établi</span>
(4.409, 0.591)</pre>
    <p><strong>Q3.</strong> Pendant la première demi-période, \(e = E\) et \(u_{k+1} - E = 0{,}99\,(u_k - E)\) (car \(h/\tau = 0{,}01\)) : la suite \(u_k - E\) est géométrique de premier terme \(-E\), donc \(u_k = E(1 - 0{,}99^k)\) et \(u_{200} = 5\,(1 - 0{,}99^{200}) \approx 4{,}3301\) V. L'écart avec la valeur exacte est de 0,007 V, soit 0,16 % : c'est l'erreur de méthode, proportionnelle à \(h\) (on retrouve \(0{,}99^{200} = (1 - h/\tau)^{2\tau/h} \to \mathrm{e}^{-2}\) quand \(h \to 0\)).</p>
    <p><strong>Q4.</strong> La simulation donne 4,409 V et 0,591 V, à 0,005 V des valeurs exactes. Le facteur \(1 - \dfrac h\tau\) doit rester dans \(]-1, 1[\) pour que la solution numérique ne diverge pas : il faut \(h \lt 2\tau\). Pour une bonne précision, on prend \(h\) très petit devant \(\tau\) (ici \(h = \tau/100\)) ; le coût est \(O(n)\) avec \(n = 4000\) pas pour 10 périodes.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Chute d'un parachutiste : Euler, trapèzes et dichotomie</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème <em>méthode d'Euler, intégration de valeurs calculées, recherche dichotomique, validation et complexité</em>).</div>
  <div class="statement">Avant l'ouverture de son parachute, un parachutiste de masse \(m = 80\) kg, lâché sans vitesse, est soumis à son poids et à une force de frottement de norme \(k v^2\), avec \(k = 0{,}25\ \text{kg·m}^{-1}\). Sa vitesse verticale \(v(t)\) vérifie
  $$v' = g - \frac{k}{m}\,v^2, \qquad v(0) = 0, \qquad g = 9{,}81\ \text{m·s}^{-2}.$$
  On admet que la solution est \(v(t) = v_\ell \tanh\!\left(\dfrac{g t}{v_\ell}\right)\), avec \(v_\ell = \sqrt{mg/k}\) ; elle sert seulement à valider les calculs. Les fonctions <span class="code-inline">sqrt</span>, <span class="code-inline">tanh</span>, <span class="code-inline">log</span> et <span class="code-inline">cosh</span> s'importent du module <span class="code-inline">math</span>.</div>

  <p class="exo-part">Partie A — Méthode d'Euler</p>
  <div class="q"><strong>A1.</strong> Écrire la fonction <span class="code-inline">F(t: float, v: float) -&gt; float</span> du second membre, puis <span class="code-inline">vitesses(h: float, tmax: float) -&gt; tuple</span> qui renvoie les listes des instants \(t_i = ih\) et des vitesses \(v_i\) calculées par la méthode d'Euler, pour \(i\) de 0 à \(n = \) <span class="code-inline">round(tmax / h)</span>.</div>
  <div class="q"><strong>A2.</strong> Quelle est la complexité de <span class="code-inline">vitesses</span> en temps et en mémoire ?</div>
  <div class="q"><strong>A3.</strong> Que vaut \(v_\ell\) ? Interpréter physiquement.</div>

  <p class="exo-part">Partie B — Validation</p>
  <div class="q"><strong>B1.</strong> On calcule l'erreur \(v_n - v(10)\) à l'instant 10 s pour trois pas. Commenter le tableau obtenu.</div>
  <pre class="codeblock"><span class="kw">for</span> h <span class="kw">in</span> [0.1, 0.05, 0.025]:
    ts, vs = vitesses(h, 10)
    print(h, vs[len(vs) - 1] - v_exacte(10))</pre>
  <div><table>
<tr><th>pas \(h\) (s)</th><th>erreur sur \(v(10)\) (m/s)</th><th>rapport à la ligne précédente</th></tr>
<tr><td>\(0{,}100\)</td><td>\(0{,}1213\)</td><td>—</td></tr>
<tr><td>\(0{,}050\)</td><td>\(0{,}0606\)</td><td>\(2{,}00\)</td></tr>
<tr><td>\(0{,}025\)</td><td>\(0{,}0303\)</td><td>\(2{,}00\)</td></tr>
</table></div>
  <div class="q"><strong>B2.</strong> Pourquoi ne pas prendre un pas \(h = 10^{-9}\) s ?</div>

  <p class="exo-part">Partie C — Distance parcourue</p>
  <div class="q"><strong>C1.</strong> La distance parcourue est \(\displaystyle\int_0^{t} v(s)\,\mathrm{d}s\). Expliquer comment l'approcher à partir des listes renvoyées par <span class="code-inline">vitesses</span>, et donner sa valeur pour \(t = 10\) s et \(h = 0{,}1\) s. La valeur exacte est \(\dfrac{v_\ell^2}{g}\ln\cosh\dfrac{g t}{v_\ell} \approx 348{,}0\) m : d'où vient principalement l'écart ?</div>

  <p class="exo-part">Partie D — Instant où la vitesse atteint 99 % de la vitesse limite</p>
  <div class="q"><strong>D1.</strong> On pose \(c = k/m\) et \(\psi(v) = v + h\,(g - c v^2)\), de sorte que \(v_{i+1} = \psi(v_i)\). Montrer que si \(h \le \dfrac{1}{2 c v_\ell}\), alors \(\psi\) est croissante sur \([0, v_\ell]\), et en déduire que la suite \((v_i)\) est strictement croissante et majorée par \(v_\ell\). Vérifier que c'est le cas pour \(h = 0{,}1\) s.</div>
  <div class="q"><strong>D2.</strong> Écrire une fonction <span class="code-inline">premier_indice(v: list, seuil: float) -&gt; int</span> qui renvoie, par dichotomie, le plus petit indice \(i\) tel que <span class="code-inline">v[i] &gt;= seuil</span>, pour une liste croissante dont le dernier élément est au moins égal à <span class="code-inline">seuil</span>. Donner un invariant, un variant et la complexité.</div>
  <div class="q"><strong>D3.</strong> En déduire l'instant cherché avec \(h = 0{,}1\) s et \(t_{\max} = 30\) s, et le comparer à la valeur exacte \(\dfrac{v_\ell}{g}\operatorname{artanh}(0{,}99) \approx 15{,}12\) s. Pourquoi une recherche séquentielle suffirait-elle aussi en pratique ici ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong></p>
    <pre class="codeblock">g, m, k = 9.81, 80.0, 0.25          <span class="cmt"># m/s², kg, kg/m</span>

<span class="kw">def</span> F(t, v):
    <span class="str">"""Second membre de v' = g - (k/m) v² (chute avec frottement quadratique)."""</span>
    <span class="kw">return</span> g - k / m * v * v</pre>
    <pre class="codeblock"><span class="kw">def</span> vitesses(h, tmax):
    <span class="str">"""Méthode d'Euler de 0 à tmax avec le pas h, v(0) = 0 : listes des t_i et des v_i."""</span>
    n = round(tmax / h)
    ts, vs = [0.0], [0.0]
    v = 0.0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        v = v + h * F(i * h, v)
        ts.append((i + 1) * h)
        vs.append(v)
    <span class="kw">return</span> ts, vs</pre>
    <p>Les instants sont calculés par <span class="code-inline">(i + 1) * h</span> et non par additions successives, pour éviter le cumul des erreurs d'arrondi.</p>
    <p><strong>A2.</strong> La boucle fait \(n\) tours de coût constant : temps \(O(n)\), avec \(n = t_{\max}/h\). Les deux listes contiennent \(n + 1\) flottants : mémoire \(O(n)\).</p>
    <p><strong>A3.</strong></p>
    <pre class="codeblock"><span class="kw">from</span> math <span class="kw">import</span> sqrt, tanh, log, cosh
vlim = sqrt(m * g / k)

<span class="kw">def</span> v_exacte(t):
    <span class="kw">return</span> vlim * tanh(g * t / vlim)</pre>
    <p>\(v_\ell = \sqrt{80 \times 9{,}81 / 0{,}25} \approx 56{,}03\ \text{m·s}^{-1}\) (environ 200 km/h) : c'est la vitesse pour laquelle le frottement compense le poids (\(v' = 0\)) ; la vitesse tend vers cette limite.</p>
    <p><strong>B1.</strong> Quand le pas est divisé par 2, l'erreur est divisée par 2 : l'erreur de méthode est proportionnelle à \(h\), ce qui confirme que la méthode d'Euler est d'ordre 1 et que le programme est correct. L'erreur est positive : la méthode surestime la vitesse, la fonction \(v\) étant concave (la pente au début de chaque pas est plus forte que la pente moyenne sur le pas).</p>
    <p><strong>B2.</strong> Il faudrait \(10^{10}\) pas pour simuler 10 s : des heures de calcul et deux listes de dix milliards d'éléments, qui ne tiennent pas en mémoire. De plus, les erreurs d'arrondi (une par pas) s'accumuleraient et finiraient par dominer l'erreur de méthode. On choisit le pas d'après la précision voulue : ici, \(h = 0{,}01\) s donne déjà une erreur de l'ordre de 0,01 m/s.</p>
    <p><strong>C1.</strong> On ne connaît la vitesse qu'aux instants \(t_i\) : on applique la méthode des trapèzes à ces valeurs, avec la fonction <span class="code-inline">trapezes_mesures(t, y)</span> du cours (§5), ou directement \(h \left( \frac{v_0 + v_n}2 + \sum_{i=1}^{n-1} v_i \right)\) puisque le pas est constant.</p>
    <pre class="codeblock"><span class="kw">def</span> premier_indice(v, seuil):
    <span class="str">"""Précondition : v croissante, non vide, v[len(v) - 1] &gt;= seuil.</span>
<span class="str">    Renvoie le plus petit indice i tel que v[i] &gt;= seuil."""</span>
    g, d = 0, len(v) - 1
    <span class="kw">while</span> g &lt; d:
        <span class="cmt"># invariant : v[d] &gt;= seuil, et v[i] &lt; seuil pour tout i &lt; g</span>
        m = (g + d) // 2
        <span class="kw">if</span> v[m] &gt;= seuil:
            d = m           <span class="cmt"># m convient : le premier est en m ou avant</span>
        <span class="kw">else</span>:
            g = m + 1       <span class="cmt"># m et tout ce qui précède sont trop petits</span>
    <span class="kw">return</span> g</pre>
    <pre class="codeblock">&gt;&gt;&gt; ts, vs = vitesses(0.1, 30)
&gt;&gt;&gt; round(vlim, 2)
56.03
&gt;&gt;&gt; i = premier_indice(vs, 0.99 * vlim)
&gt;&gt;&gt; i, round(ts[i], 2)
(150, 15.0)
&gt;&gt;&gt; ts, vs = vitesses(0.1, 10)
&gt;&gt;&gt; round(trapezes_mesures(ts, vs), 1), round(vlim ** 2 / g * log(cosh(g * 10 / vlim)), 1)
(349.2, 348.0)</pre>
    <p>On obtient 349,2 m pour 348,0 m exactement. L'écart vient surtout des vitesses calculées par Euler, trop grandes d'environ 0,1 m/s (partie B) : la méthode des trapèzes, d'ordre 2, est bien plus précise que les valeurs auxquelles on l'applique. Pour améliorer le résultat, il faut diminuer le pas de la simulation.</p>
    <p><strong>D1.</strong> \(\psi'(v) = 1 - 2hcv \ge 1 - 2hcv_\ell \ge 0\) sur \([0, v_\ell]\) si \(h \le \dfrac{1}{2cv_\ell}\) : \(\psi\) est croissante, et \(\psi(v_\ell) = v_\ell\) car \(g - c v_\ell^2 = 0\). Par récurrence, si \(0 \le v_i \lt v_\ell\), alors \(v_{i+1} = \psi(v_i) \lt \psi(v_\ell) = v_\ell\) (la croissance est même stricte, \(\psi' \gt 0\) sur \([0, v_\ell[\)), et \(v_{i+1} - v_i = h\,(g - c v_i^2) \gt 0\). Ici \(c = 0{,}003\,125\ \text{m}^{-1}\) et \(\dfrac{1}{2 c v_\ell} \approx 2{,}86\) s : la condition est largement vérifiée pour \(h = 0{,}1\) s.</p>
    <p><strong>D2.</strong> (voir le code ci-dessus) Invariant : <span class="code-inline">v[d] &gt;= seuil</span>, et <span class="code-inline">v[i] &lt; seuil</span> pour tout \(i \lt g\) ; le plus petit indice cherché est donc dans \([g, d]\). Il est vrai au départ (\(g = 0\), \(d = n - 1\), précondition) et conservé : si <span class="code-inline">v[m] &gt;= seuil</span>, \(m\) convient et la réponse est au plus \(m\) ; sinon, la liste étant croissante, tous les indices jusqu'à \(m\) sont trop petits. Variant : \(d - g\), entier positif dans la boucle, qui diminue strictement (car \(g \le m \lt d\)). À la sortie, \(g = d\) est l'indice cherché. Comme pour la recherche dichotomique du chapitre « Recherche séquentielle, dictionnaires et dichotomie », la longueur de l'intervalle est au moins divisée par 2 à chaque tour : complexité \(O(\log n)\).</p>
    <p><strong>D3.</strong> L'indice trouvé est 150, soit \(t = 15{,}0\) s, pour 15,12 s exactement : la vitesse calculée par Euler, trop grande, atteint le seuil un peu trop tôt, et l'instant n'est connu qu'au pas \(h\) près. Une recherche séquentielle coûterait \(O(n)\) ; comme le calcul des vitesses coûte déjà \(O(n)\), le gain de la dichotomie ne change pas l'ordre de grandeur du coût total. Elle devient intéressante si l'on fait de nombreuses recherches dans la même liste (plusieurs seuils).</p>
  </div>
</div>
