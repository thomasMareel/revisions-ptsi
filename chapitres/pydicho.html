<div class="course-section">
  <div class="sec-num">§1 · LE COÛT D'UN ALGORITHME</div>
  <h2>Compter les opérations plutôt que chronométrer</h2>
  <div class="intro">Deux programmes justes peuvent mettre l'un une seconde, l'autre plusieurs heures sur les mêmes données. Pour les comparer sans dépendre de la machine, on compte les opérations qu'ils effectuent en fonction de la taille \(n\) des données, et l'on ne retient que l'ordre de grandeur, dans le cas le plus défavorable.</div>

  <div class="def-box">
    Une <strong>opération élémentaire</strong> est une opération dont la durée ne dépend pas de la taille des données : affectation, comparaison de deux nombres, opération arithmétique sur des nombres de taille bornée, accès à <span class="code-inline">t[i]</span>, calcul de <span class="code-inline">len(t)</span>, ajout en fin de liste par <span class="code-inline">append</span>, accès, insertion ou test de présence dans un dictionnaire (en moyenne, voir §4).<br>
    La <strong>complexité temporelle dans le pire cas</strong> d'un algorithme est le nombre maximal \(C(n)\) d'opérations élémentaires qu'il effectue sur une donnée de taille \(n\). On écrit \(C(n) = O(g(n))\) lorsque \(C(n) \le K\,g(n)\) pour une constante \(K\) et pour \(n\) assez grand.
  </div>

  <div class="prop-box">
    <strong>Les ordres de grandeur du chapitre.</strong>
    <ul>
      <li><strong>Coût constant</strong>, \(O(1)\) : le nombre d'opérations ne dépend pas de \(n\) (lire <span class="code-inline">t[0]</span>, tester une clé d'un dictionnaire).</li>
      <li><strong>Coût logarithmique</strong>, \(O(\log n)\) : on divise la taille du problème par deux à chaque étape (dichotomie, §7 ; exponentiation rapide, §8). \(\log_2 n\) est, à une unité près, le nombre de divisions par 2 qui ramènent \(n\) à 1 : \(\log_2 10^6 \approx 20\).</li>
      <li><strong>Coût linéaire</strong>, \(O(n)\) : on examine chaque élément un nombre borné de fois (recherche séquentielle, maximum, comptage).</li>
      <li><strong>Coût quadratique</strong>, \(O(n^2)\) : on examine tous les couples d'éléments (deux boucles imbriquées, §5 et §6).</li>
    </ul>
  </div>

  <p>Sur une donnée de taille \(n\), un algorithme linéaire qui fait \(3n + 2\) opérations est un \(O(n)\) : la constante 3 dépend de la façon de compter et de la machine, l'ordre de grandeur \(n\) n'en dépend pas. Ce qui compte est la façon dont le coût <em>grandit</em> : si \(n\) double, un coût linéaire double, un coût quadratique quadruple, un coût logarithmique augmente d'une seule opération.</p>

  <div><table>
    <tr><th>Coût</th><th>\(n = 10^3\)</th><th>\(n = 10^6\)</th><th>\(n = 10^9\)</th></tr>
    <tr><td>\(\log_2 n\)</td><td>0,1 µs</td><td>0,2 µs</td><td>0,3 µs</td></tr>
    <tr><td>\(n\)</td><td>10 µs</td><td>10 ms</td><td>10 s</td></tr>
    <tr><td>\(n \log_2 n\)</td><td>0,1 ms</td><td>0,2 s</td><td>5 min</td></tr>
    <tr><td>\(n^2\)</td><td>10 ms</td><td>3 h</td><td>300 ans</td></tr>
  </table></div>
  <p><em>Durées estimées à raison de \(10^8\) opérations élémentaires par seconde, ordre de grandeur pour Python sur un ordinateur portable (une boucle qui fait une comparaison par tour en effectue environ \(4 \times 10^7\) par seconde).</em></p>

  <div class="method-box">
    <strong>Exemple — Une boucle, puis deux boucles imbriquées</strong>
    <p>La fonction <span class="code-inline">somme</span> fait une affectation, puis deux opérations à chacun des \(n\) tours : \(2n + 1\) opérations, coût linéaire.</p>
<pre class="codeblock"><span class="kw">def</span> somme(t):
    s = 0              <span class="cmt"># 1 affectation</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:        <span class="cmt"># n tours de boucle</span>
        s = s + x      <span class="cmt"># 2 opérations par tour</span>
    <span class="kw">return</span> s</pre>
    <p>La fonction suivante compte les couples de cases égales. Pour \(i\) fixé, la boucle intérieure fait \(n - 1 - i\) tours, donc une comparaison par tour :</p>
<pre class="codeblock"><span class="kw">def</span> nb_paires_egales(t):
    <span class="cmt"># nombre de couples (i, j), i &lt; j, avec t[i] == t[j]</span>
    n = len(t)
    c = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):   <span class="cmt"># n - 1 - i tours</span>
            <span class="kw">if</span> t[i] == t[j]:
                c = c + 1
    <span class="kw">return</span> c</pre>
    <ol>
      <li>Nombre total de comparaisons : on additionne les tours de la boucle intérieure pour \(i = 0, 1, \dots, n-1\).</li>
      <li><div class="formula" data-nom="Nombre de couples i &lt; j">$$\sum_{i=0}^{n-1} (n - 1 - i) = (n-1) + (n-2) + \dots + 1 + 0 = \frac{n(n-1)}{2}.$$</div></li>
      <li>Pour \(n = 6\), cela fait 15 comparaisons, quel que soit le contenu de la liste ; pour \(n = 10^6\), environ \(5 \times 10^{11}\) : le coût est quadratique, \(O(n^2)\).</li>
    </ol>
<pre class="codeblock">nb_paires_egales([3, 1, 3, 3, 2, 1])   <span class="cmt"># 4</span></pre>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire qu'une ligne de code coûte une opération. <span class="code-inline">x in t</span> (pour une liste), <span class="code-inline">t[a:b]</span>, <span class="code-inline">t + u</span>, <span class="code-inline">t.copy()</span> ou la comparaison de deux chaînes parcourent leurs données : leur coût est proportionnel à la longueur en jeu. Une boucle qui exécute <span class="code-inline">x in t</span> à chaque tour est donc quadratique, et non linéaire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RECHERCHE SÉQUENTIELLE D'UN ÉLÉMENT</div>
  <h2>Parcourir jusqu'à trouver</h2>
  <div class="intro">Chercher une valeur dans une liste quelconque (non triée), c'est l'examiner case après case. On peut s'arrêter dès qu'on l'a trouvée ; en revanche, on ne peut conclure à son absence qu'après avoir tout examiné.</div>

  <div class="def-box">
    La <strong>recherche séquentielle</strong> (ou linéaire) d'une valeur \(x\) dans une liste \(t\) de longueur \(n\) compare successivement \(t[0], t[1], \dots\) à \(x\), et s'arrête à la première case égale à \(x\) ou à la fin de la liste.
  </div>

  <p>Avec une boucle <span class="code-inline">for</span>, la sortie anticipée se fait par <span class="code-inline">return</span> dans le corps de la boucle ; le <span class="code-inline">return False</span> placé <em>après</em> la boucle n'est atteint que si aucune case ne convient.</p>
<pre class="codeblock"><span class="kw">def</span> appartient(x, t):
    <span class="cmt"># renvoie True si la valeur x est dans la liste t</span>
    <span class="kw">for</span> y <span class="kw">in</span> t:
        <span class="kw">if</span> y == x:
            <span class="kw">return</span> <span class="kw">True</span>   <span class="cmt"># arrêt à la 1re rencontre</span>
    <span class="kw">return</span> <span class="kw">False</span>          <span class="cmt"># après avoir tout examiné</span></pre>
  <p>Pour obtenir l'<strong>indice</strong> de la première occurrence, une boucle <span class="code-inline">while</span> exprime directement la condition d'arrêt. Le <span class="code-inline">and</span> est <strong>paresseux</strong> : si <span class="code-inline">i &lt; len(t)</span> est faux, <span class="code-inline">t[i]</span> n'est pas évalué, ce qui évite de lire hors de la liste.</p>
<pre class="codeblock"><span class="kw">def</span> indice(x, t):
    <span class="cmt"># indice de la 1re occurrence de x dans t, -1 si absent</span>
    i = 0
    <span class="kw">while</span> i &lt; len(t) <span class="kw">and</span> t[i] != x:
        <span class="cmt"># invariant : x n'est pas dans t[0..i-1]</span>
        i = i + 1
    <span class="kw">if</span> i &lt; len(t):
        <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>

  <div class="prop-box">
    <strong>Correction et coût.</strong> L'invariant « \(x\) n'est dans aucune des cases \(t[0], \dots, t[i-1]\) » est vrai au départ (\(i = 0\) : aucune case) et conservé par chaque tour (on n'avance que si \(t[i] \ne x\)). À la sortie, soit \(i \lt n\) et \(t[i] = x\) : \(i\) est la première occurrence ; soit \(i = n\) et \(x\) est absent. La boucle termine car \(n - i\) est un entier positif qui diminue de 1 à chaque tour (variant).<br>
    <strong>Pire cas</strong> (\(x\) absent ou en dernière position) : \(n\) comparaisons, coût linéaire \(O(n)\). <strong>Meilleur cas</strong> (\(x\) en tête) : une comparaison, \(O(1)\).
  </div>

  <div class="method-box">
    <strong>Exemple — Dérouler la recherche</strong>
    <p>Avec <span class="code-inline">t = [7, 3, 9, 3, 5]</span> :</p>
    <ol>
      <li><span class="code-inline">indice(3, t)</span> : \(i = 0\), \(7 \ne 3\) ; \(i = 1\), \(t[1] = 3\) : la boucle s'arrête, la fonction renvoie 1 après deux comparaisons. La seconde occurrence (indice 3) n'est jamais examinée.</li>
      <li><span class="code-inline">indice(4, t)</span> : les cinq cases sont comparées à 4 sans succès ; \(i\) atteint 5, le test <span class="code-inline">i &lt; len(t)</span> devient faux et la fonction renvoie \(-1\).</li>
    </ol>
<pre class="codeblock">t = [7, 3, 9, 3, 5]
indice(3, t)       <span class="cmt"># 1   (2 comparaisons)</span>
indice(4, t)       <span class="cmt"># -1  (5 comparaisons)</span>
appartient(5, t)   <span class="cmt"># True</span></pre>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : placer le cas d'échec dans un <span class="code-inline">else</span> à l'intérieur de la boucle. La fonction ci-dessous sort dès le premier tour : elle renvoie <span class="code-inline">False</span> pour <span class="code-inline">appartient_faux(3, [7, 3])</span>.
<pre class="codeblock"><span class="kw">def</span> appartient_faux(x, t):
    <span class="kw">for</span> y <span class="kw">in</span> t:
        <span class="kw">if</span> y == x:
            <span class="kw">return</span> <span class="kw">True</span>
        <span class="kw">else</span>:
            <span class="kw">return</span> <span class="kw">False</span>   <span class="cmt"># ERREUR : sortie au 1er tour</span></pre>
  Autre piège : \(-1\) n'est pas un indice valide au sens du programme, mais Python accepte <span class="code-inline">t[-1]</span> (la dernière case) sans erreur. On teste donc toujours le résultat avant de s'en servir comme indice.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · MAXIMUM ET SECOND MAXIMUM</div>
  <h2>Garder en mémoire le meilleur candidat</h2>
  <div class="intro">Pour le maximum, il n'y a pas de sortie anticipée possible : la plus grande valeur peut se trouver dans la dernière case. On parcourt donc toute la liste en tenant à jour le meilleur candidat rencontré jusque-là.</div>

<pre class="codeblock"><span class="kw">def</span> maximum(t):
    <span class="cmt"># t : liste non vide ; renvoie sa plus grande valeur</span>
    m = t[0]
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t)):
        <span class="kw">if</span> t[i] &gt; m:
            m = t[i]
    <span class="kw">return</span> m

<span class="kw">def</span> indice_max(t):
    <span class="cmt"># t non vide ; indice de la 1re occurrence du maximum</span>
    im = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t)):
        <span class="kw">if</span> t[i] &gt; t[im]:
            im = i
    <span class="kw">return</span> im</pre>
  <p>On initialise avec la première case, et non avec 0 : une liste de températures hivernales peut ne contenir que des valeurs négatives. La précondition « liste non vide » est donc nécessaire, et doit figurer dans la spécification. Le test strict <span class="code-inline">t[i] &gt; t[im]</span> garde la <em>première</em> occurrence du maximum ; avec <span class="code-inline">&gt;=</span>, on obtiendrait la dernière.</p>

  <div class="prop-box">
    <strong>Invariant du maximum.</strong> Au début du tour d'indice \(i\), \(m\) est le maximum de \(t[0], \dots, t[i-1]\). Après le dernier tour, \(m\) est le maximum de toute la liste. Coût : exactement \(n - 1\) comparaisons, linéaire, dans tous les cas.
  </div>

  <h3>Le second maximum en un seul passage</h3>
  <p>On appelle ici <strong>second maximum</strong> le deuxième élément de la liste rangée par ordre décroissant, répétitions comprises : pour <span class="code-inline">[5, 9, 9]</span>, c'est 9. Plutôt que de trier (coût \(O(n \log n)\)) ou de faire deux passages, on tient à jour deux variables \(m_1 \ge m_2\) :</p>
<pre class="codeblock"><span class="kw">def</span> second_max(t):
    <span class="cmt"># t : au moins deux nombres ; renvoie le deuxième</span>
    <span class="cmt"># plus grand élément, répétitions comprises</span>
    <span class="kw">if</span> t[0] &gt;= t[1]:
        m1, m2 = t[0], t[1]
    <span class="kw">else</span>:
        m1, m2 = t[1], t[0]
    <span class="kw">for</span> i <span class="kw">in</span> range(2, len(t)):
        <span class="cmt"># invariant : m1 &gt;= m2 sont les deux plus</span>
        <span class="cmt"># grands éléments de t[0..i-1]</span>
        <span class="kw">if</span> t[i] &gt; m1:
            m1, m2 = t[i], m1   <span class="cmt"># l'ancien max descend</span>
        <span class="kw">elif</span> t[i] &gt; m2:
            m2 = t[i]
    <span class="kw">return</span> m2</pre>
  <p>Quand une valeur dépasse \(m_1\), l'ancien maximum devient le second : l'affectation simultanée <span class="code-inline">m1, m2 = t[i], m1</span> évalue d'abord les deux membres de droite, puis affecte. Écrire <span class="code-inline">m1 = t[i]</span> puis <span class="code-inline">m2 = m1</span> perdrait l'ancien maximum.</p>

  <div class="method-box">
    <strong>Exemple — Tableau d'états du second maximum</strong>
    <p>Avec <span class="code-inline">t = [4, 11, 7, 15, 11, 2]</span> : l'initialisation compare 4 et 11, d'où \(m_1 = 11\), \(m_2 = 4\).</p>
    <div><table>
      <tr><th>\(i\)</th><th>\(t[i]\)</th><th>cas</th><th>\(m_1\)</th><th>\(m_2\)</th></tr>
      <tr><td>2</td><td>7</td><td>\(4 \lt 7 \le 11\)</td><td>11</td><td>7</td></tr>
      <tr><td>3</td><td>15</td><td>\(15 \gt 11\)</td><td>15</td><td>11</td></tr>
      <tr><td>4</td><td>11</td><td>\(11 \le 11\)</td><td>15</td><td>11</td></tr>
      <tr><td>5</td><td>2</td><td>\(2 \le 11\)</td><td>15</td><td>11</td></tr>
    </table></div>
    <p>La fonction renvoie 11. Elle fait au plus \(1 + 2(n-2)\) comparaisons : coût linéaire.</p>
<pre class="codeblock">second_max([4, 11, 7, 15, 11, 2])   <span class="cmt"># 11</span>
second_max([5, 9, 9])               <span class="cmt"># 9</span>
second_max([-3, -8, -1])            <span class="cmt"># -3</span></pre>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier de préciser ce que l'on cherche. « Second maximum » peut aussi désigner la deuxième plus grande valeur <em>distincte</em> (pour <span class="code-inline">[5, 9, 9]</span>, ce serait 5, et la liste <span class="code-inline">[9, 9]</span> n'en aurait pas). La spécification tranche, et les tests doivent contenir des répétitions et des valeurs négatives.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · DICTIONNAIRES : RETROUVER ET COMPTER</div>
  <h2>Accéder à une valeur par sa clé, en temps constant</h2>
  <div class="intro">Une liste associe des valeurs à des indices 0, 1, 2… Un dictionnaire associe des valeurs à des <strong>clés</strong> choisies librement (chaînes, nombres, tuples). On l'utilise ici en boîte noire : on se sert de ses opérations et de leur coût sans savoir encore comment il est construit.</div>

  <div class="def-box">
    Un <strong>dictionnaire</strong> est un ensemble de couples <em>clé : valeur</em>, les clés étant deux à deux distinctes. On le crée par <span class="code-inline">{c1: v1, c2: v2}</span> (<span class="code-inline">{}</span> pour le dictionnaire vide) ; <span class="code-inline">d[c]</span> donne la valeur associée à la clé <span class="code-inline">c</span> ; <span class="code-inline">d[c] = v</span> associe <span class="code-inline">v</span> à <span class="code-inline">c</span> (en ajoutant la clé si elle est nouvelle, en remplaçant sa valeur sinon) ; <span class="code-inline">c in d</span> teste la présence de la clé ; <span class="code-inline">len(d)</span> est le nombre de clés.
  </div>
<pre class="codeblock">stock = {<span class="str">"vis"</span>: 120, <span class="str">"écrou"</span>: 80}
stock[<span class="str">"vis"</span>]                <span class="cmt"># 120</span>
stock[<span class="str">"rondelle"</span>] = 200     <span class="cmt"># nouvelle clé</span>
<span class="str">"écrou"</span> <span class="kw">in</span> stock            <span class="cmt"># True</span>
<span class="str">"boulon"</span> <span class="kw">in</span> stock           <span class="cmt"># False</span>
len(stock)                  <span class="cmt"># 3</span>
stock[<span class="str">"vis"</span>] = stock[<span class="str">"vis"</span>] - 20   <span class="cmt"># modification</span></pre>
  <p>On parcourt un dictionnaire par ses clés (<span class="code-inline">for c in d.keys():</span>) ou par ses couples (<span class="code-inline">for c, v in d.items():</span>) :</p>
<pre class="codeblock"><span class="kw">for</span> cle, valeur <span class="kw">in</span> stock.items():
    print(cle, valeur)
<span class="cmt"># affiche : vis 100, puis écrou 80, puis rondelle 200</span></pre>

  <div class="prop-box">
    <strong>Coût des opérations (admis).</strong> L'accès <span class="code-inline">d[c]</span>, l'affectation <span class="code-inline">d[c] = v</span> et le test <span class="code-inline">c in d</span> coûtent <strong>en moyenne un temps constant</strong>, quel que soit le nombre de clés. Pour une liste, le test <span class="code-inline">x in t</span> est une recherche séquentielle, de coût linéaire. Le parcours complet d'un dictionnaire de \(k\) clés coûte \(O(k)\).
  </div>

  <h3>Compter les occurrences</h3>
  <p>Le comptage est l'usage le plus courant : une clé par valeur rencontrée, associée à son nombre d'apparitions. Il faut créer la clé à la première rencontre.</p>
<pre class="codeblock"><span class="kw">def</span> compter(t):
    <span class="cmt"># dictionnaire {valeur : nombre d'occurrences dans t}</span>
    d = {}
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x <span class="kw">in</span> d:
            d[x] = d[x] + 1
        <span class="kw">else</span>:
            d[x] = 1     <span class="cmt"># première rencontre de x</span>
    <span class="kw">return</span> d</pre>
  <div class="method-box">
    <strong>Exemple — État du dictionnaire au fil du comptage</strong>
    <p>Avec les notes <span class="code-inline">[12, 15, 12, 9, 15, 12]</span> :</p>
    <ol>
      <li>12 est nouveau : <span class="code-inline">{12: 1}</span> ; 15 est nouveau : <span class="code-inline">{12: 1, 15: 1}</span>.</li>
      <li>12 est déjà une clé : <span class="code-inline">{12: 2, 15: 1}</span> ; 9 est nouveau : <span class="code-inline">{12: 2, 15: 1, 9: 1}</span>.</li>
      <li>15, puis 12 : <span class="code-inline">{12: 3, 15: 2, 9: 1}</span>. Six tours, chacun de coût constant : coût linéaire.</li>
    </ol>
<pre class="codeblock">compter([12, 15, 12, 9, 15, 12])
<span class="cmt"># {12: 3, 15: 2, 9: 1}</span>
compter(<span class="str">"abracadabra"</span>)
<span class="cmt"># {'a': 5, 'b': 2, 'r': 2, 'c': 1, 'd': 1}</span></pre>
  </div>
  <p>Pour trouver la valeur la plus fréquente, on compte une fois, puis on parcourt le dictionnaire. Sans dictionnaire, il faudrait recompter chaque valeur par une boucle intérieure : \(n^2\) comparaisons au lieu de \(O(n)\) opérations.</p>
<pre class="codeblock"><span class="kw">def</span> plus_frequent(t):
    <span class="cmt"># t non vide ; une valeur la plus fréquente de t</span>
    d = compter(t)
    meilleur = t[0]
    <span class="kw">for</span> cle, nb <span class="kw">in</span> d.items():
        <span class="kw">if</span> nb &gt; d[meilleur]:
            meilleur = cle
    <span class="kw">return</span> meilleur</pre>
<pre class="codeblock"><span class="kw">def</span> plus_frequent_naif(t):
    <span class="cmt"># même résultat, sans dictionnaire</span>
    meilleur, nb_meilleur = t[0], 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        nb = 0
        <span class="kw">for</span> y <span class="kw">in</span> t:     <span class="cmt"># on recompte x : n tours</span>
            <span class="kw">if</span> y == x:
                nb = nb + 1
        <span class="kw">if</span> nb &gt; nb_meilleur:
            meilleur, nb_meilleur = x, nb
    <span class="kw">return</span> meilleur</pre>
<pre class="codeblock">plus_frequent([12, 15, 12, 9, 15, 12])   <span class="cmt"># 12</span></pre>

  <h3>Retrouver vite : un dictionnaire comme index</h3>
  <p>Si l'on doit chercher de nombreuses valeurs dans la même liste, on construit une fois pour toutes un dictionnaire qui associe à chaque valeur sa position. Construire l'index coûte \(O(n)\), puis chaque recherche coûte un temps constant en moyenne, au lieu de \(O(n)\) par recherche séquentielle.</p>
<pre class="codeblock"><span class="kw">def</span> premieres_positions(t):
    <span class="cmt"># {valeur : indice de sa 1re occurrence dans t}</span>
    pos = {}
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> t[i] <span class="kw">not</span> <span class="kw">in</span> pos:
            pos[t[i]] = i
    <span class="kw">return</span> pos</pre>
<pre class="codeblock">pos = premieres_positions([7, 3, 9, 3, 5])
pos                  <span class="cmt"># {7: 0, 3: 1, 9: 2, 5: 4}</span>
9 <span class="kw">in</span> pos             <span class="cmt"># True</span>
pos[9]               <span class="cmt"># 2</span>
4 <span class="kw">in</span> pos             <span class="cmt"># False</span></pre>

  <div class="notice"><strong>Erreurs classiques</strong> : lire <span class="code-inline">d[c]</span> pour une clé absente provoque une erreur (<span class="code-inline">KeyError</span>) : d'où le test <span class="code-inline">if x in d</span> avant <span class="code-inline">d[x] = d[x] + 1</span>. Une clé doit être <strong>immuable</strong> : un nombre, une chaîne, un tuple conviennent, une liste non (<span class="code-inline">TypeError</span>). Enfin, <span class="code-inline">c in d</span> porte sur les <em>clés</em>, jamais sur les valeurs.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BOUCLES IMBRIQUÉES : UN FACTEUR DANS UN TEXTE</div>
  <h2>Chercher un mot dans un texte</h2>
  <div class="intro">Trouver un mot dans un document, une séquence dans un brin d'ADN : c'est chercher un <strong>facteur</strong>, c'est-à-dire une suite de caractères consécutifs. L'algorithme naïf essaie toutes les positions possibles, et compare le motif caractère par caractère à chaque position.</div>

  <div class="def-box">
    Une chaîne \(m\) de longueur \(p\) est un <strong>facteur</strong> de la chaîne \(\textit{texte}\) de longueur \(n\) s'il existe un indice \(i\), avec \(0 \le i \le n - p\), tel que \(\textit{texte}[i + k] = m[k]\) pour tout \(k\) de \(0\) à \(p - 1\). On dit que \(m\) apparaît à la position \(i\).
  </div>
<pre class="codeblock"><span class="kw">def</span> position(m, texte):
    <span class="cmt"># indice de la 1re occurrence du motif m, -1 sinon</span>
    n, p = len(texte), len(m)
    <span class="kw">for</span> i <span class="kw">in</span> range(n - p + 1):    <span class="cmt"># positions possibles</span>
        k = 0
        <span class="kw">while</span> k &lt; p <span class="kw">and</span> texte[i + k] == m[k]:
            k = k + 1             <span class="cmt"># m[0..k-1] coïncide</span>
        <span class="kw">if</span> k == p:                <span class="cmt"># les p caractères coïncident</span>
            <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>
  <p>La boucle extérieure parcourt les \(n - p + 1\) positions possibles : la dernière est \(n - p\), d'où <span class="code-inline">range(n - p + 1)</span>. La boucle intérieure avance tant que les caractères coïncident ; elle s'arrête au premier désaccord, ou quand les \(p\) caractères ont été vérifiés.</p>

  <div class="method-box">
    <strong>Exemple — Compter les comparaisons</strong>
    <p>Recherche de <span class="code-inline">"ATTAC"</span> (\(p = 5\)) dans <span class="code-inline">"CAGATTAGATTACA"</span> (\(n = 14\)) : 10 positions possibles, de 0 à 9.</p>
    <div><table>
      <tr><th>position \(i\)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>
      <tr><td>comparaisons</td><td>1</td><td>2</td><td>1</td><td>5</td><td>1</td><td>1</td><td>2</td><td>1</td><td>5</td></tr>
    </table></div>
    <ol>
      <li>Aux positions 1 et 6, le A coïncide, puis le G du texte diffère du T du motif (2 comparaisons).</li>
      <li>À la position 3, quatre caractères coïncident et le cinquième diffère (5 comparaisons).</li>
      <li>À la position 8, les cinq coïncident : la fonction renvoie 8, après 19 comparaisons au total. La position 9 n'est pas examinée.</li>
    </ol>
<pre class="codeblock">adn = <span class="str">"CAGATTAGATTACA"</span>
position(<span class="str">"ATTAC"</span>, adn)   <span class="cmt"># 8</span>
position(<span class="str">"TAG"</span>, adn)     <span class="cmt"># 5</span>
position(<span class="str">"GAG"</span>, adn)     <span class="cmt"># -1</span></pre>
  </div>

  <div class="prop-box">
    <strong>Coût dans le pire cas.</strong> Chaque position demande au plus \(p\) comparaisons : au plus \((n - p + 1)\,p\) comparaisons, donc \(O(np)\). Ce maximum est atteint, par exemple pour \(\textit{texte} = \texttt{aa}\dots\texttt{a}\) (\(n\) lettres) et \(m = \texttt{a}\dots\texttt{ab}\) (\(p - 1\) fois a, puis b) : à chaque position, les \(p - 1\) premiers caractères coïncident et le dernier diffère. Pour un motif de longueur \(n/2\), cela fait environ \(n^2/4\) comparaisons : coût quadratique en \(n\).
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : écrire <span class="code-inline">range(n - p)</span>, qui oublie la dernière position (le motif en toute fin de texte n'est jamais trouvé) ; inverser l'ordre des tests du <span class="code-inline">while</span> (<span class="code-inline">texte[i + k] == m[k] and k &lt; p</span> lit <span class="code-inline">m[p]</span>, hors du motif). La comparaison de tranches <span class="code-inline">texte[i:i + p] == m</span> est juste, mais elle recopie \(p\) caractères à chaque position : son coût n'est pas constant, il est en \(O(p)\), comme la boucle intérieure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · BOUCLES IMBRIQUÉES : LES DEUX VALEURS LES PLUS PROCHES</div>
  <h2>Examiner tous les couples, puis faire mieux</h2>
  <div class="intro">Dans une liste de mesures, on cherche les deux valeurs les plus proches l'une de l'autre (deux relevés presque identiques, deux altitudes voisines). La méthode directe examine tous les couples d'indices \(i \lt j\) : c'est l'archétype de l'algorithme quadratique.</div>

<pre class="codeblock"><span class="kw">def</span> ecart(a, b):
    <span class="cmt"># distance |a - b| (comme abs(a - b))</span>
    <span class="kw">if</span> a &gt;= b:
        <span class="kw">return</span> a - b
    <span class="kw">return</span> b - a

<span class="kw">def</span> plus_proches(t):
    <span class="cmt"># t : au moins deux nombres ; renvoie (i, j), i &lt; j,</span>
    <span class="cmt"># avec t[i] et t[j] les plus proches (le premier</span>
    <span class="cmt"># couple trouvé en cas d'égalité)</span>
    n = len(t)
    bi, bj, dmin = 0, 1, ecart(t[0], t[1])
    <span class="kw">for</span> i <span class="kw">in</span> range(n - 1):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):
            d = ecart(t[i], t[j])
            <span class="kw">if</span> d &lt; dmin:
                bi, bj, dmin = i, j, d
    <span class="kw">return</span> (bi, bj)</pre>
  <p>La fonction <span class="code-inline">ecart</span> calcule la valeur absolue de la différence sans recourir à <span class="code-inline">abs</span> (fonction de Python qui fait la même chose, mais ne figure pas dans l'annexe du programme). Le couple de départ \((0, 1)\) est un candidat valable : il fournit un écart minimal provisoire, ce qui évite d'inventer un « infini ».</p>

  <div class="method-box">
    <strong>Exemple — Six altitudes</strong>
    <p>Avec <span class="code-inline">t = [142, 98, 175, 103, 210, 171]</span> (\(n = 6\)) :</p>
    <ol>
      <li>Départ : couple \((0, 1)\), écart \(|142 - 98| = 44\).</li>
      <li>Ligne \(i = 0\) : écarts 44, 33, 39, 68, 29 ; le couple \((0, 2)\) (écart 33) puis \((0, 5)\) (écart 29) deviennent les meilleurs.</li>
      <li>Ligne \(i = 1\) : \(|98 - 103| = 5\), nouveau meilleur \((1, 3)\). Ligne \(i = 2\) : \(|175 - 171| = 4\), nouveau meilleur \((2, 5)\). Aucun écart plus petit ensuite.</li>
      <li>Résultat \((2, 5)\), après les \(\frac{6 \times 5}{2} = 15\) calculs d'écart de la double boucle.</li>
    </ol>
<pre class="codeblock">t = [142, 98, 175, 103, 210, 171]
plus_proches(t)    <span class="cmt"># (2, 5)</span></pre>
  </div>

  <div class="prop-box">
    <strong>Coût.</strong> La boucle intérieure fait \(n - 1 - i\) tours : au total \(\frac{n(n-1)}{2}\) calculs d'écart, quel que soit le contenu de la liste. Le coût est quadratique, \(O(n^2)\), dans tous les cas (il n'y a pas de sortie anticipée : un couple plus proche peut toujours apparaître plus loin).
  </div>

  <h3>Faire mieux en triant</h3>
  <p>Si les valeurs sont rangées par ordre croissant, les deux plus proches sont <strong>voisines</strong> : entre \(u_k \le u_{k+1} \le \dots \le u_l\), l'écart \(u_l - u_k\) est au moins égal à \(u_{k+1} - u_k\). Il suffit alors de comparer \(n - 1\) couples de voisines.</p>

<svg viewBox="0 0 352 80" role="img" aria-label="Les six valeurs rangées sur un axe : 98, 103, 142, 171, 175, 210. Les écarts entre voisines valent 5, 39, 29, 4 et 35 ; le plus petit, 4, sépare 171 et 175."><line x1="16" y1="48" x2="340" y2="48" class="sk-axis" marker-end="url(#sk-arrow-ink)"/><line x1="49.4" y1="44" x2="49.4" y2="52" class="sk-axis"/><text x="49.3846" y="68" class="lab-muted" text-anchor="middle">100</text><line x1="96.2" y1="44" x2="96.2" y2="52" class="sk-axis"/><text x="96.1538" y="68" class="lab-muted" text-anchor="middle">120</text><line x1="142.9" y1="44" x2="142.9" y2="52" class="sk-axis"/><text x="142.923" y="68" class="lab-muted" text-anchor="middle">140</text><line x1="189.7" y1="44" x2="189.7" y2="52" class="sk-axis"/><text x="189.692" y="68" class="lab-muted" text-anchor="middle">160</text><line x1="236.5" y1="44" x2="236.5" y2="52" class="sk-axis"/><text x="236.462" y="68" class="lab-muted" text-anchor="middle">180</text><line x1="283.2" y1="44" x2="283.2" y2="52" class="sk-axis"/><text x="283.231" y="68" class="lab-muted" text-anchor="middle">200</text><line x1="330.0" y1="44" x2="330.0" y2="52" class="sk-axis"/><text x="330" y="68" class="lab-muted" text-anchor="middle">220</text><path d="M44.7 38 Q50.6 16 56.4 38" class="sk-dash"/><text x="50.5538" y="18" class="lab-muted" text-anchor="middle" style="font-size:12px">5</text><path d="M56.4 38 Q102.0 16 147.6 38" class="sk-dash"/><text x="102" y="18" class="lab-muted" text-anchor="middle" style="font-size:12px">39</text><path d="M147.6 38 Q181.5 16 215.4 38" class="sk-dash"/><text x="181.508" y="18" class="lab-muted" text-anchor="middle" style="font-size:12px">29</text><path d="M215.4 38 Q220.1 16 224.8 38" class="sk-green"/><text x="220.092" y="18" class="lab-green" text-anchor="middle" style="font-size:12px">4</text><path d="M224.8 38 Q265.7 16 306.6 38" class="sk-dash"/><text x="265.692" y="18" class="lab-muted" text-anchor="middle" style="font-size:12px">35</text><circle cx="44.7" cy="48" r="4.5" class="fl-accent2"/><circle cx="56.4" cy="48" r="4.5" class="fl-accent2"/><circle cx="147.6" cy="48" r="4.5" class="fl-accent2"/><circle cx="215.4" cy="48" r="4.5" class="fl-accent2"/><circle cx="224.8" cy="48" r="4.5" class="fl-accent2"/><circle cx="306.6" cy="48" r="4.5" class="fl-accent2"/></svg>
<figcaption>Une fois les valeurs rangées dans l'ordre, il suffit de comparer chaque valeur à sa voisine : les deux plus proches (171 et 175, écart 4) sont forcément voisines.</figcaption>
</figure>
<pre class="codeblock"><span class="kw">def</span> ecart_min_trie(t):
    <span class="cmt"># écart minimal, en triant d'abord : les deux</span>
    <span class="cmt"># valeurs les plus proches deviennent voisines</span>
    u = sorted(t)
    dmin = u[1] - u[0]
    <span class="kw">for</span> k <span class="kw">in</span> range(1, len(u) - 1):
        <span class="kw">if</span> u[k + 1] - u[k] &lt; dmin:
            dmin = u[k + 1] - u[k]
    <span class="kw">return</span> dmin</pre>
  <div class="notice"><strong>Documentation</strong> : <span class="code-inline">sorted(t)</span> renvoie une <em>nouvelle</em> liste contenant les éléments de <span class="code-inline">t</span> dans l'ordre croissant (<span class="code-inline">t</span> n'est pas modifiée). Son coût est en \(O(n \log n)\) (voir le chapitre <em>Algorithmes de tri</em>). Le coût total devient \(O(n \log n) + O(n) = O(n \log n)\) : pour \(n = 10^6\), environ \(2 \times 10^7\) opérations au lieu de \(5 \times 10^{11}\).</div>

  <h3>Valider un algorithme par un autre</h3>
  <p>Disposer de deux méthodes différentes pour le même problème est un excellent outil de validation : la méthode quadratique, simple et facile à justifier, sert de référence pour tester la méthode rapide sur des centaines de listes tirées au hasard. Les deux couples trouvés peuvent différer (en cas d'égalité d'écart), mais les écarts doivent être égaux.</p>
<pre class="codeblock"><span class="kw">import</span> random

<span class="kw">def</span> tester_plus_proches(nb_essais):
    <span class="kw">for</span> essai <span class="kw">in</span> range(nb_essais):
        n = random.randint(2, 30)
        t = [random.randint(-50, 50) <span class="kw">for</span> k <span class="kw">in</span> range(n)]
        i, j = plus_proches(t)
        <span class="kw">assert</span> i &lt; j
        <span class="kw">assert</span> ecart(t[i], t[j]) == ecart_min_trie(t)
    print(<span class="str">"tests réussis"</span>)</pre>
  <div class="notice"><strong>Documentation</strong> : après <span class="code-inline">import random</span>, <span class="code-inline">random.randint(a, b)</span> renvoie un entier tiré au hasard entre <span class="code-inline">a</span> et <span class="code-inline">b</span> inclus. Une instruction <span class="code-inline">assert condition</span> arrête le programme si la condition est fausse : si le message final s'affiche, tous les essais ont réussi.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · RECHERCHE DICHOTOMIQUE</div>
  <h2>Couper en deux à chaque étape</h2>
  <div class="intro">Pour trouver un mot dans un dictionnaire papier, personne ne lit les pages une à une : on ouvre au milieu, et l'ordre alphabétique dit de quel côté continuer. Dans une liste <strong>triée</strong>, une seule comparaison avec la case du milieu élimine ainsi la moitié des cases restantes.</div>

  <div class="def-box">
    La <strong>recherche dichotomique</strong> d'une valeur \(x\) dans une liste \(t\) triée par ordre croissant maintient un intervalle d'indices \([g, d]\) qui contient \(x\) s'il est présent. À chaque tour, on compare \(x\) à \(t[m]\), avec \(m = \lfloor (g + d)/2 \rfloor\) : si \(t[m] = x\), c'est fini ; si \(t[m] \lt x\), on continue dans \([m + 1, d]\) ; sinon dans \([g, m - 1]\). On s'arrête sur un intervalle vide (\(g \gt d\)) : \(x\) est absent.
  </div>
<pre class="codeblock"><span class="kw">def</span> dicho(x, t):
    <span class="cmt"># t : liste triée dans l'ordre croissant ; renvoie</span>
    <span class="cmt"># un indice i tel que t[i] == x, ou -1 si x est absent</span>
    g, d = 0, len(t) - 1
    <span class="kw">while</span> g &lt;= d:
        <span class="cmt"># invariant : si x est dans t, il est dans t[g..d]</span>
        m = (g + d) // 2
        <span class="kw">if</span> t[m] == x:
            <span class="kw">return</span> m
        <span class="kw">elif</span> t[m] &lt; x:
            g = m + 1    <span class="cmt"># x ne peut être qu'à droite de m</span>
        <span class="kw">else</span>:
            d = m - 1    <span class="cmt"># x ne peut être qu'à gauche de m</span>
    <span class="kw">return</span> -1</pre>

</figure>

  <div class="method-box">
    <strong>Exemple — Tableau d'états, x présent puis absent</strong>
    <p>Avec <span class="code-inline">t = [3, 8, 12, 17, 21, 26, 30, 34, 41, 47, 52, 58, 63, 70, 77, 85]</span> (16 valeurs) et \(x = 52\) :</p>
    <div><table>
      <tr><th>tour</th><th>\(g\)</th><th>\(d\)</th><th>\(m\)</th><th>\(t[m]\)</th><th>décision</th></tr>
      <tr><td>1</td><td>0</td><td>15</td><td>7</td><td>34</td><td>\(34 \lt 52\) : \(g = 8\)</td></tr>
      <tr><td>2</td><td>8</td><td>15</td><td>11</td><td>58</td><td>\(58 \gt 52\) : \(d = 10\)</td></tr>
      <tr><td>3</td><td>8</td><td>10</td><td>9</td><td>47</td><td>\(47 \lt 52\) : \(g = 10\)</td></tr>
      <tr><td>4</td><td>10</td><td>10</td><td>10</td><td>52</td><td>trouvé : renvoie 10</td></tr>
    </table></div>
    <p>Avec \(x = 50\), les quatre premiers tours sont identiques, sauf que le dernier donne \(50 \lt 52\), d'où \(d = 9\). L'intervalle \([10, 9]\) est vide : la fonction renvoie \(-1\) après 4 comparaisons, là où la recherche séquentielle en aurait fait 16.</p>
<pre class="codeblock">t = [3, 8, 12, 17, 21, 26, 30, 34,
     41, 47, 52, 58, 63, 70, 77, 85]
dicho(52, t)     <span class="cmt"># 10</span>
dicho(50, t)     <span class="cmt"># -1</span>
dicho(3, t)      <span class="cmt"># 0</span></pre>
  </div>

  <div class="prop-box">
    <strong>Terminaison.</strong> La longueur \(d - g + 1\) de l'intervalle est un entier positif dans la boucle. Comme \(g \le m \le d\), les deux mises à jour excluent \(m\) : la longueur diminue strictement à chaque tour sans succès. C'est un variant : la boucle termine.<br>
    <strong>Correction.</strong> L'invariant « si \(x\) est dans \(t\), il est dans \(t[g..d]\) » est vrai au départ (\(g = 0\), \(d = n - 1\)). Il est conservé : si \(t[m] \lt x\), toutes les cases d'indice \(\le m\) sont \(\le t[m] \lt x\) (la liste est triée), donc \(x\) ne peut être qu'à droite de \(m\) ; de même dans l'autre cas. Si la fonction renvoie \(m\), alors \(t[m] = x\) ; si elle sort de la boucle, l'intervalle est vide et l'invariant dit que \(x\) est absent.
  </div>

  <div class="prop-box">
    <strong>Coût logarithmique.</strong> Un tour sans succès remplace un intervalle de \(L\) cases par un intervalle d'au plus \(\lfloor L/2 \rfloor\) cases. Après \(k\) tours sans succès, il reste au plus \(n/2^k\) cases. Si la boucle fait un \(k\)-ième tour, il restait au moins une case après les \(k - 1\) premiers, donc \(2^{k-1} \le n\). La boucle fait donc au plus
    <div class="formula" data-nom="Tours d'une dichotomie">$$\lfloor \log_2 n \rfloor + 1 \ \text{tours.}$$</div>
    La complexité est logarithmique, \(O(\log n)\). Pour \(n = 10^6\) : au plus 20 tours, contre \(10^6\) comparaisons pour la recherche séquentielle ; pour \(n = 10^9\) : 30 tours.
  </div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi l'intervalle perd au moins la moitié de ses cases</span>
    <div class="content">
      <p>Soit \(L = d - g + 1\) la longueur de l'intervalle et \(m = \lfloor (g + d)/2 \rfloor\). La partie de gauche \([g, m - 1]\) contient \(m - g\) cases et celle de droite \([m + 1, d]\) en contient \(d - m\). Comme \(m - g = \lfloor (d - g)/2 \rfloor\) et \(d - m = \lceil (d - g)/2 \rceil\), les deux sont au plus \(\lceil (L - 1)/2 \rceil = \lfloor L/2 \rfloor\).</p>
      <p>Par récurrence, après \(k\) tours sans succès, la longueur est au plus \(\lfloor n/2^k \rfloor\). Si la boucle fait un \((k+1)\)-ième tour, c'est que cette longueur vaut au moins 1, donc \(2^k \le n\), soit \(k \le \log_2 n\). Le nombre total de tours est au plus \(\lfloor \log_2 n \rfloor + 1\), et ce maximum est atteint, par exemple quand \(x\) est plus grand que toutes les valeurs (la longueur passe alors exactement de \(L\) à \(\lfloor L/2 \rfloor\) à chaque tour).</p>
    </div>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> :
    <ul>
      <li><span class="code-inline">m = (g + d) / 2</span> donne un flottant, qui n'est pas un indice : utiliser <span class="code-inline">//</span>.</li>
      <li>Ne pas exclure \(m\) (<span class="code-inline">g = m</span> au lieu de <span class="code-inline">g = m + 1</span>) : la boucle peut ne jamais finir. Avec <span class="code-inline">t = [4, 7]</span> et \(x = 9\) : \(g = 0\), \(d = 1\), \(m = 0\), \(t[0] \lt 9\), \(g = 0\) de nouveau, indéfiniment.</li>
      <li>Écrire <span class="code-inline">while g &lt; d</span> : l'intervalle d'une seule case n'est jamais examiné (<span class="code-inline">[5]</span> ne « contiendrait » pas 5).</li>
      <li>Appliquer la dichotomie à une liste non triée : aucune erreur ne s'affiche, mais le résultat est faux. Trier d'abord coûte \(O(n \log n)\) : cela n'est rentable que si l'on fait ensuite de nombreuses recherches.</li>
    </ul>
<pre class="codeblock"><span class="kw">def</span> dicho_boucle_infinie(x, t):
    g, d = 0, len(t) - 1
    <span class="kw">while</span> g &lt;= d:
        m = (g + d) // 2
        <span class="kw">if</span> t[m] == x:
            <span class="kw">return</span> m
        <span class="kw">elif</span> t[m] &lt; x:
            g = m        <span class="cmt"># ERREUR : m n'est pas exclu</span>
        <span class="kw">else</span>:
            d = m
    <span class="kw">return</span> -1</pre>
  </div>
  <p>La même idée sert à approcher un zéro d'une fonction continue qui change de signe (chapitre <em>Méthodes numériques</em>) et s'écrit aussi de façon récursive (chapitre <em>Récursivité</em>).</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · EXPONENTIATION RAPIDE</div>
  <h2>Calculer une puissance en divisant l'exposant par deux</h2>
  <div class="intro">Calculer \(x^n\) en multipliant \(n\) fois par \(x\) coûte \(n\) multiplications. Or \(x^{16} = \big(((x^2)^2)^2\big)^2\) ne demande que quatre élévations au carré. L'exponentiation rapide généralise cette idée à tout exposant, en lisant l'écriture de \(n\) en base 2.</div>

<pre class="codeblock"><span class="kw">def</span> puissance(x, n):
    <span class="cmt"># x nombre, n entier &gt;= 0 : n multiplications</span>
    p = 1
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        p = p * x
    <span class="kw">return</span> p</pre>
  <div class="prop-box">
    <strong>Principe.</strong> Pour tout entier \(n \ge 1\), en notant \(q = \lfloor n/2 \rfloor\) :
    <div class="formula" data-nom="Exponentiation rapide">$$x^n = \begin{cases} (x^2)^{q} & \text{si } n \text{ est pair,} \\ x \cdot (x^2)^{q} & \text{si } n \text{ est impair.} \end{cases}$$</div>
    On remplace donc le calcul de \(x^n\) par celui d'une puissance d'exposant moitié, au prix d'au plus deux multiplications.
  </div>
  <p>Dans la version itérative, \(r\) accumule le résultat, \(a\) prend successivement les valeurs \(x, x^2, x^4, x^8, \dots\) et \(k\) est l'exposant qui reste à traiter :</p>
<pre class="codeblock"><span class="kw">def</span> puissance_rapide(x, n):
    <span class="cmt"># x nombre, n entier &gt;= 0 ; renvoie x ** n</span>
    r, a, k = 1, x, n
    <span class="kw">while</span> k &gt; 0:
        <span class="cmt"># invariant : r * a ** k == x ** n ; variant : k</span>
        <span class="kw">if</span> k % 2 == 1:
            r = r * a    <span class="cmt"># k impair</span>
        a = a * a
        k = k // 2
    <span class="kw">return</span> r</pre>

  <div class="method-box">
    <strong>Exemple — Calcul de \(x^{13}\)</strong>
    <p>\(13 = 8 + 4 + 1\), soit \(1101\) en base 2. On suit les exposants : \(r = x^{e_r}\), \(a = x^{e_a}\).</p>
    <div><table>
      <tr><th>tour</th><th>\(k\) au début</th><th>\(k\) impair ?</th><th>\(e_r\) après</th><th>\(e_a\) après</th><th>\(k\) après</th></tr>
      <tr><td>1</td><td>13</td><td>oui : \(r = r \cdot a\)</td><td>1</td><td>2</td><td>6</td></tr>
      <tr><td>2</td><td>6</td><td>non</td><td>1</td><td>4</td><td>3</td></tr>
      <tr><td>3</td><td>3</td><td>oui</td><td>\(1 + 4 = 5\)</td><td>8</td><td>1</td></tr>
      <tr><td>4</td><td>1</td><td>oui</td><td>\(5 + 8 = 13\)</td><td>16</td><td>0</td></tr>
    </table></div>
    <p>On vérifie l'invariant à chaque ligne : \(e_r + k \, e_a = 13\) (par exemple \(1 + 3 \times 4 = 13\) après le tour 2). Il a fallu 7 multiplications au lieu de 13 ; les chiffres 1 de l'écriture binaire de 13 sont exactement les tours où \(r\) est multiplié.</p>
<pre class="codeblock">puissance_rapide(3, 13)      <span class="cmt"># 1594323</span>
puissance_rapide(2, 10)      <span class="cmt"># 1024</span>
puissance_rapide(1.5, 0)     <span class="cmt"># 1</span></pre>
  </div>

  <div class="prop-box">
    <strong>Correction, terminaison, coût.</strong> L'invariant \(r \cdot a^k = x^n\) est vrai au départ (\(1 \cdot x^n\)). Si \(k = 2q\) est pair, \(a^k = (a^2)^q\) ; si \(k = 2q + 1\), \(r \cdot a^k = (r \cdot a)(a^2)^q\) : dans les deux cas, les nouvelles valeurs le vérifient encore. Le variant \(k\) est un entier positif qui diminue strictement (\(\lfloor k/2 \rfloor \lt k\) pour \(k \ge 1\)) : la boucle termine, avec \(k = 0\), donc \(r = x^n\). Elle fait autant de tours que \(n\) a de chiffres en base 2, soit \(\lfloor \log_2 n \rfloor + 1\), avec au plus deux multiplications par tour : <strong>coût \(O(\log n)\)</strong> multiplications, contre \(n\) pour la méthode naïve. Pour \(n = 1000\) : 16 multiplications au lieu de 1000.
  </div>

  <div class="notice"><strong>Coût réel des multiplications</strong> : compter des multiplications n'est un vrai coût que si chaque multiplication coûte un temps constant (flottants, ou entiers modulo \(p\) comme dans l'exercice correspondant). Avec les entiers de Python, sans limite de taille, \(3^{1000}\) a 478 chiffres : les dernières multiplications portent sur de très grands nombres et coûtent bien plus cher que les premières (voir le chapitre <em>Représentation des nombres</em>). Erreur fréquente : écrire <span class="code-inline">k = k / 2</span>. Dès le premier tour, \(k\) devient un flottant (6,5 pour \(n = 13\)) qui n'est plus jamais « impair » au sens attendu : la boucle tourne plus de mille fois, jusqu'à ce que \(k\) s'annule par arrondi, et le résultat est faux ; avec un entier \(x\), les carrés successifs deviennent si grands que le calcul ne finit pratiquement pas. Il faut <span class="code-inline">k = k // 2</span>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · VALIDER : JEUX DE TESTS ET MESURE DES GAINS</div>
  <h2>Tester les cas limites et vérifier l'accélération</h2>
  <div class="intro">Une recherche dichotomique se trompe facilement d'une case. Avant de lui faire confiance, on la confronte à un jeu de tests écrit à la main, qui couvre les différentes familles d'entrées et leurs limites, puis à une méthode de référence sur des données tirées au hasard.</div>

  <div class="def-box">
    Un <strong>jeu de tests</strong> est une liste d'entrées accompagnées des sorties attendues. On <strong>partitionne</strong> les entrées en familles qui se comportent de la même façon (valeur présente, absente, plus petite que tout, plus grande que tout…) et l'on choisit au moins un représentant par famille, en insistant sur les <strong>limites</strong> : liste vide, un seul élément, valeur aux extrémités, répétitions.
  </div>
<pre class="codeblock"><span class="kw">def</span> tester_dicho():
    <span class="kw">assert</span> dicho(4, []) == -1      <span class="cmt"># liste vide</span>
    <span class="kw">assert</span> dicho(4, [4]) == 0      <span class="cmt"># un seul élément</span>
    <span class="kw">assert</span> dicho(5, [4]) == -1
    t = [2, 5, 5, 8, 13]
    <span class="kw">assert</span> dicho(2, t) == 0        <span class="cmt"># extrémités</span>
    <span class="kw">assert</span> dicho(13, t) == 4
    <span class="kw">assert</span> dicho(1, t) == -1       <span class="cmt"># hors des bornes</span>
    <span class="kw">assert</span> dicho(20, t) == -1
    <span class="kw">assert</span> dicho(6, t) == -1       <span class="cmt"># absent, entre deux</span>
    <span class="kw">assert</span> t[dicho(5, t)] == 5     <span class="cmt"># doublon : l'un ou l'autre</span>
    print(<span class="str">"tests réussis"</span>)</pre>
  <p>Quand la sortie n'est pas unique (ici, l'indice d'une valeur répétée), on teste une <em>propriété</em> de la sortie (« <span class="code-inline">t[i] == 5</span> ») plutôt qu'une valeur précise. La comparaison avec la recherche séquentielle, simple et sûre, complète le jeu :</p>
<pre class="codeblock"><span class="kw">import</span> random

<span class="kw">def</span> tester_dicho_hasard(nb_essais):
    <span class="kw">for</span> essai <span class="kw">in</span> range(nb_essais):
        n = random.randint(0, 50)
        t = sorted([random.randint(0, 100) <span class="kw">for</span> k <span class="kw">in</span> range(n)])
        x = random.randint(-5, 105)
        i = dicho(x, t)
        <span class="kw">if</span> i == -1:
            <span class="kw">assert</span> indice(x, t) == -1    <span class="cmt"># absent aussi</span>
        <span class="kw">else</span>:
            <span class="kw">assert</span> t[i] == x
    print(<span class="str">"tests réussis"</span>)</pre>

  <div class="method-box">
    <strong>Exemple — Mesurer l'accélération en comptant</strong>
    <p>Plutôt que de chronométrer, on instrumente les deux recherches pour qu'elles renvoient le nombre de comparaisons effectuées :</p>
<pre class="codeblock"><span class="kw">def</span> tours_sequentielle(x, t):
    <span class="cmt"># nombre de comparaisons faites par indice(x, t)</span>
    i = 0
    <span class="kw">while</span> i &lt; len(t) <span class="kw">and</span> t[i] != x:
        i = i + 1
    <span class="kw">if</span> i &lt; len(t):
        <span class="kw">return</span> i + 1     <span class="cmt"># x trouvé à l'indice i</span>
    <span class="kw">return</span> len(t)        <span class="cmt"># x absent</span>

<span class="kw">def</span> tours_dicho(x, t):
    <span class="cmt"># nombre de tours de la boucle de dicho(x, t)</span>
    g, d, nb = 0, len(t) - 1, 0
    <span class="kw">while</span> g &lt;= d:
        nb = nb + 1
        m = (g + d) // 2
        <span class="kw">if</span> t[m] == x:
            <span class="kw">return</span> nb
        <span class="kw">elif</span> t[m] &lt; x:
            g = m + 1
        <span class="kw">else</span>:
            d = m - 1
    <span class="kw">return</span> nb</pre>
    <ol>
      <li>Sur une liste triée d'un million d'entiers, une valeur absente coûte \(10^6\) comparaisons à la recherche séquentielle.</li>
      <li>La dichotomie en fait 19 ou 20, conformément à la borne \(\lfloor \log_2 10^6 \rfloor + 1 = 20\).</li>
    </ol>
<pre class="codeblock">t = [2 * k <span class="kw">for</span> k <span class="kw">in</span> range(1000000)]   <span class="cmt"># pairs, triés</span>
tours_sequentielle(-1, t)       <span class="cmt"># 1000000</span>
tours_dicho(-1, t)              <span class="cmt"># 19</span>
tours_sequentielle(1999999, t)  <span class="cmt"># 1000000</span>
tours_dicho(1999999, t)         <span class="cmt"># 20</span></pre>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : ne tester que des cas « au milieu ». Les erreurs d'indice (<span class="code-inline">range(n - p)</span> au lieu de <span class="code-inline">range(n - p + 1)</span>, <span class="code-inline">g &lt; d</span> au lieu de <span class="code-inline">g &lt;= d</span>) ne se voient qu'aux limites : valeur en dernière position, intervalle d'une case, liste vide. La méthode générale de spécification et de test est développée dans le chapitre <em>Spécification, correction et complexité</em>.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Quelques prolongements</h2>
  <ul>
    <li><strong>Recherche de motif plus rapide.</strong> Les algorithmes de Knuth, Morris et Pratt, ou de Boyer et Moore, évitent de recomparer des caractères déjà lus et cherchent un motif en temps \(O(n + p)\). Ils ne sont pas au programme.</li>
    <li><strong>Le module <span class="code-inline">bisect</span></strong> de Python fournit des recherches dichotomiques toutes faites (position d'insertion dans une liste triée). Son usage n'est pas exigible ; savoir écrire la dichotomie l'est.</li>
    <li><strong>Exponentiation rapide de matrices.</strong> La même méthode s'applique à toute multiplication associative : en élevant la matrice \(\begin{pmatrix} 1 &amp; 1 \\ 1 &amp; 0 \end{pmatrix}\) à la puissance \(n\), on obtient le \(n\)-ième terme de la suite de Fibonacci en \(O(\log n)\) produits de matrices.</li>
  </ul>
</div>
