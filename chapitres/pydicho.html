<template class="pan-tpl" data-panneau="dich-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · RECHERCHE ET DICHOTOMIE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Écrire sans erreur une recherche, un comptage ou une dichotomie, en évaluer le coût et le justifier, choisir la bonne structure de données : les savoir-faire attendus aux écrits comme aux oraux.</div>

  <div class="method-box"><strong>Méthode 1 — Écrire une recherche séquentielle avec sortie anticipée</strong>
    <ol>
      <li><span class="step">Spécifier.</span> Ce que renvoie la fonction en cas de succès (booléen, indice, élément) et en cas d'échec (<span class="code-inline">False</span>, \(-1\)).</li>
      <li><span class="step">Parcourir.</span> <span class="code-inline">for x in t</span> si seule la valeur compte ; <span class="code-inline">for i in range(len(t))</span> si l'on a besoin de l'indice.</li>
      <li><span class="step">Sortir au succès.</span> <span class="code-inline">return</span> dans le corps de la boucle, dès que la condition est remplie.</li>
      <li><span class="step">Conclure à l'échec.</span> Le <span class="code-inline">return</span> d'échec se place <em>après</em> la boucle, jamais dans un <span class="code-inline">else</span> du test.</li>
      <li><span class="step">Coût.</span> Pire cas : tout est parcouru, \(O(n)\) ; meilleur cas : \(O(1)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> premier relevé qui dépasse un seuil.</p>
<pre class="codeblock"><span class="kw">def</span> premier_depassement(t, seuil):
    <span class="cmt"># indice du 1er relevé &gt; seuil, -1 s'il n'y en a pas</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> t[i] &gt; seuil:
            <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>
<pre class="codeblock">premier_depassement([12, 17, 9, 23, 31], 20)   <span class="cmt"># 3</span>
premier_depassement([12, 17, 9], 20)           <span class="cmt"># -1</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 2 — Calculer un extremum ou un second extremum en un seul passage</strong>
    <ol>
      <li><span class="step">Initialiser avec les données.</span> Avec <span class="code-inline">t[0]</span> (et <span class="code-inline">t[1]</span> pour un second extremum, les deux rangés dans l'ordre), jamais avec 0 ; la liste doit être non vide (précondition écrite).</li>
      <li><span class="step">Parcourir la suite.</span> À partir de l'indice 1 (ou 2), en mettant à jour le meilleur candidat.</li>
      <li><span class="step">Choisir l'inégalité.</span> Stricte pour garder la première occurrence, large pour la dernière.</li>
      <li><span class="step">Second extremum.</span> Tests en cascade <span class="code-inline">if … elif …</span> ; quand le maximum change, l'ancien devient le second par affectation simultanée <span class="code-inline">m1, m2 = t[i], m1</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> indice du minimum.</p>
<pre class="codeblock"><span class="kw">def</span> indice_min(t):
    <span class="cmt"># t non vide ; indice de la 1re occurrence du minimum</span>
    im = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t)):
        <span class="kw">if</span> t[i] &lt; t[im]:
            im = i
    <span class="kw">return</span> im</pre>
<pre class="codeblock">indice_min([5, 2, 8, 2])    <span class="cmt"># 1</span></pre>
  </div>
  <div class="notice"><strong>Piège</strong> : un maximum initialisé à 0 est faux pour une liste de valeurs toutes négatives ; un « second maximum » mal spécifié (avec ou sans répétitions ?) donne deux réponses différentes pour <span class="code-inline">[5, 9, 9]</span>.</div>

  <div class="method-box"><strong>Méthode 3 — Compter ou repérer avec un dictionnaire</strong>
    <ol>
      <li><span class="step">Créer</span> un dictionnaire vide <span class="code-inline">d = {}</span>.</li>
      <li><span class="step">Parcourir</span> les données ; pour chaque valeur <span class="code-inline">x</span>, tester <span class="code-inline">x in d</span> : si oui, mettre à jour <span class="code-inline">d[x]</span> ; sinon, créer la clé.</li>
      <li><span class="step">Exploiter</span> le résultat par un parcours de <span class="code-inline">d.items()</span> (valeur la plus fréquente, valeurs uniques…).</li>
      <li><span class="step">Coût.</span> Chaque opération sur le dictionnaire est en temps constant en moyenne : \(O(n)\) au total, contre \(O(n^2)\) avec deux boucles imbriquées.</li>
    </ol>
    <p><em>Exemple éclair :</em> une valeur apparaît-elle deux fois ? Le dictionnaire sert ici d'ensemble des valeurs déjà vues.</p>
<pre class="codeblock"><span class="kw">def</span> a_un_doublon(t):
    <span class="cmt"># True si une valeur apparaît au moins deux fois dans t</span>
    vus = {}
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x <span class="kw">in</span> vus:
            <span class="kw">return</span> <span class="kw">True</span>
        vus[x] = <span class="kw">True</span>
    <span class="kw">return</span> <span class="kw">False</span></pre>
<pre class="codeblock">a_un_doublon([4, 1, 7, 1])   <span class="cmt"># True</span>
a_un_doublon([4, 1, 7])      <span class="cmt"># False</span></pre>
  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">d[x] = d[x] + 1</span> sur une clé absente provoque une erreur <span class="code-inline">KeyError</span> ; une liste ne peut pas servir de clé (utiliser un tuple).</div>

  <div class="method-box"><strong>Méthode 4 — Dénombrer les tours de boucles imbriquées</strong>
    <ol>
      <li><span class="step">Boucle intérieure.</span> Exprimer son nombre de tours en fonction de l'indice de la boucle extérieure (\(n\), \(i\), \(n - 1 - i\)…).</li>
      <li><span class="step">Additionner</span> sur toutes les valeurs de l'indice extérieur, avec les sommes usuelles :
        <div class="formula" data-nom="Somme des premiers entiers">$$\sum_{i=0}^{n-1} i = \frac{n(n-1)}{2}, \qquad \sum_{i=0}^{n-1} n = n^2.$$</div></li>
      <li><span class="step">Garder le terme dominant</span> : \(\frac{n(n-1)}{2} = O(n^2)\).</li>
      <li><span class="step">Sortie anticipée</span> : raisonner sur le pire cas, celui où elle ne se produit pas.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">for j in range(i)</span> dans <span class="code-inline">for i in range(n)</span> fait \(0 + 1 + \dots + (n-1) = \frac{n(n-1)}{2}\) tours ; trois boucles sur \(i \lt j \lt k\) en font \(\frac{n(n-1)(n-2)}{6}\), soit \(O(n^3)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Écrire une recherche dichotomique sans erreur d'indice</strong>
    <ol>
      <li><span class="step">Précondition.</span> La liste est triée (sinon, le résultat est faux sans message d'erreur).</li>
      <li><span class="step">Intervalle fermé.</span> <span class="code-inline">g, d = 0, len(t) - 1</span> et <span class="code-inline">while g &lt;= d</span> : on continue tant qu'il reste une case.</li>
      <li><span class="step">Milieu entier.</span> <span class="code-inline">m = (g + d) // 2</span>.</li>
      <li><span class="step">Trois cas, \(m\) toujours exclu.</span> Trouvé ; <span class="code-inline">g = m + 1</span> si <span class="code-inline">t[m] &lt; x</span> ; <span class="code-inline">d = m - 1</span> sinon.</li>
      <li><span class="step">Échec</span> après la boucle : l'intervalle est vide.</li>
    </ol>
    <p><em>Exemple éclair :</em> 23 dans <span class="code-inline">[2, 5, 8, 12, 16, 23, 38, 56, 72, 91]</span> : \(m = 4\) (16, à droite : \(g = 5\)), \(m = 7\) (56, à gauche : \(d = 6\)), \(m = 5\) : trouvé en 3 tours.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">g = m</span> ou <span class="code-inline">d = m</span> avec un intervalle fermé donne une boucle infinie ; <span class="code-inline">while g &lt; d</span> oublie la dernière case. Si l'on veut un intervalle semi-ouvert \([g, d[\) (recherche de la première position où insérer \(x\)), toute la méthode change : <span class="code-inline">d = len(t)</span>, <span class="code-inline">while g &lt; d</span>, <span class="code-inline">d = m</span> (voir l'exercice sur la première occurrence).</div>

  <div class="method-box"><strong>Méthode 6 — Justifier la terminaison et le coût d'une dichotomie</strong>
    <ol>
      <li><span class="step">Variant.</span> La longueur \(d - g + 1\) de l'intervalle est un entier positif qui diminue strictement à chaque tour, puisque \(m\) est exclu.</li>
      <li><span class="step">Invariant.</span> « Si \(x\) est présent, il est dans \(t[g..d]\) » : il se démontre avec le caractère trié de la liste.</li>
      <li><span class="step">Division par deux.</span> Chaque tour sans succès laisse au plus \(\lfloor L/2 \rfloor\) cases sur \(L\).</li>
      <li><span class="step">Conclusion.</span> Au plus \(\lfloor \log_2 n \rfloor + 1\) tours, coût \(O(\log n)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(n = 100\), \(2^6 = 64 \le 100 \lt 128 = 2^7\), donc \(\lfloor \log_2 100 \rfloor = 6\) : au plus 7 tours.</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Calculer une puissance par exponentiation rapide</strong>
    <ol>
      <li><span class="step">Trois variables</span> : \(r = 1\) (résultat), \(a = x\) (carrés successifs), \(k = n\) (exposant restant).</li>
      <li><span class="step">À chaque tour</span> : si \(k\) est impair, \(r \leftarrow r \cdot a\) ; puis \(a \leftarrow a^2\) et \(k \leftarrow \lfloor k/2 \rfloor\).</li>
      <li><span class="step">Invariant</span> \(r \cdot a^k = x^n\) ; variant \(k\) : à la fin, \(k = 0\) et \(r = x^n\).</li>
      <li><span class="step">Coût.</span> Autant de tours que de chiffres de \(n\) en base 2, au plus deux multiplications par tour : \(O(\log n)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x^{10}\), avec \(10 = 1010\) en base 2. \(k = 10\) pair : \(a = x^2\), \(k = 5\) ; impair : \(r = x^2\), \(a = x^4\), \(k = 2\) ; pair : \(a = x^8\), \(k = 1\) ; impair : \(r = x^2 \cdot x^8 = x^{10}\), \(k = 0\). Six multiplications au lieu de dix.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Construire un jeu de tests</strong>
    <ol>
      <li><span class="step">Partitionner</span> les entrées en familles de même comportement (valeur présente ou absente, en tête, au milieu, en fin…).</li>
      <li><span class="step">Ajouter les limites</span> : liste vide (si elle est permise), un ou deux éléments, valeurs répétées, valeurs négatives, extrémités.</li>
      <li><span class="step">Écrire la sortie attendue à la main</span> pour chaque entrée, et la tester par <span class="code-inline">assert</span>.</li>
      <li><span class="step">Tester une propriété</span> quand plusieurs sorties sont correctes (« <span class="code-inline">t[i] == x</span> » plutôt que « <span class="code-inline">i == 3</span> »).</li>
      <li><span class="step">Comparer</span> à une méthode simple et sûre sur des données tirées au hasard.</li>
    </ol>
    <p><em>Exemple éclair :</em> un jeu de tests pour le second maximum du cours.</p>
<pre class="codeblock"><span class="kw">def</span> tester_second_max():
    <span class="kw">assert</span> second_max([3, 7]) == 3        <span class="cmt"># deux éléments</span>
    <span class="kw">assert</span> second_max([7, 3]) == 3        <span class="cmt"># autre ordre</span>
    <span class="kw">assert</span> second_max([9, 9]) == 9        <span class="cmt"># maximum répété</span>
    <span class="kw">assert</span> second_max([-5, -2, -8]) == -5 <span class="cmt"># que des négatifs</span>
    <span class="kw">assert</span> second_max([1, 4, 4, 2]) == 4
    <span class="kw">assert</span> second_max([6, 1, 2, 3]) == 3  <span class="cmt"># maximum en tête</span>
    print(<span class="str">"tests réussis"</span>)</pre>
  </div>

  <div class="method-box"><strong>Méthode 9 — Choisir la structure : liste, liste triée ou dictionnaire</strong>
    <ol>
      <li><span class="step">Une seule recherche</span> dans une liste quelconque : recherche séquentielle, \(O(n)\). Trier d'abord (\(O(n \log n)\)) serait plus coûteux.</li>
      <li><span class="step">\(q\) recherches</span> : séquentielle \(O(qn)\) ; trier une fois puis dichotomie \(O(n \log n + q \log n)\) ; dictionnaire construit une fois, \(O(n + q)\) en moyenne.</li>
      <li><span class="step">Besoin d'ordre</span> (plus proche valeur, valeurs entre \(a\) et \(b\)) : liste triée et dichotomie ; le dictionnaire ne sait que tester une clé exacte.</li>
      <li><span class="step">Comptages, associations</span> (valeur → effectif, nom → position) : dictionnaire.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(n = 10^5\) noms et \(q = 10^4\) requêtes. Séquentiel : \(10^9\) comparaisons (une dizaine de secondes) ; tri puis dichotomie : environ \(1{,}7 \times 10^6 + 1{,}7 \times 10^5\) ; dictionnaire : environ \(1{,}1 \times 10^5\) opérations.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : <span class="code-inline">x in t</span> sur une liste ressemble au test d'un dictionnaire mais coûte \(O(n)\). Placé dans une boucle de \(n\) tours, il rend l'algorithme quadratique.</div>
</div>
</template>
<template class="pan-tpl" data-panneau="dich-exos">
<div class="exo-wrapper">

<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Dernière occurrence et nombre d'occurrences</h3>
  <div class="statement">On considère la liste <span class="code-inline">t = [4, 7, 4, 1, 7, 7, 2]</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire une fonction <span class="code-inline">derniere(x, t)</span> qui renvoie l'indice de la <em>dernière</em> occurrence de <span class="code-inline">x</span> dans la liste <span class="code-inline">t</span>, et \(-1\) si <span class="code-inline">x</span> est absent, en effectuant le moins de comparaisons possible. Combien de comparaisons fait l'appel <span class="code-inline">derniere(7, t)</span> ?</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction <span class="code-inline">nb_occ(x, t)</span> qui renvoie le nombre d'occurrences de <span class="code-inline">x</span> dans <span class="code-inline">t</span>.</div>
  <div class="q"><strong>Q3.</strong> Donner le coût de chaque fonction dans le pire et dans le meilleur cas, pour une liste de longueur \(n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On parcourt la liste <em>à rebours</em> : la première occurrence rencontrée est la dernière de la liste, et l'on peut s'arrêter aussitôt. Si <span class="code-inline">x</span> est absent, l'indice descend jusqu'à \(-1\), qui est justement la valeur à renvoyer.</p>
<pre class="codeblock"><span class="kw">def</span> derniere(x, t):
    <span class="cmt"># parcours à rebours : on s'arrête à la 1re rencontre</span>
    i = len(t) - 1
    <span class="kw">while</span> i &gt;= 0 <span class="kw">and</span> t[i] != x:
        i = i - 1
    <span class="kw">return</span> i       <span class="cmt"># vaut -1 si x est absent</span>

<span class="kw">def</span> nb_occ(x, t):
    c = 0
    <span class="kw">for</span> y <span class="kw">in</span> t:
        <span class="kw">if</span> y == x:
            c = c + 1
    <span class="kw">return</span> c</pre>
    <p><span class="code-inline">derniere(7, t)</span> compare <span class="code-inline">t[6] = 2</span>, puis <span class="code-inline">t[5] = 7</span> : 2 comparaisons, résultat 5. Un parcours de gauche à droite qui mémorise le dernier indice trouvé en ferait toujours 7. Le <span class="code-inline">and</span> paresseux évite de lire <span class="code-inline">t[-1]</span> quand \(i = -1\).</p>
<pre class="codeblock">t = [4, 7, 4, 1, 7, 7, 2]
derniere(7, t)    <span class="cmt"># 5</span>
derniere(4, t)    <span class="cmt"># 2</span>
derniere(9, t)    <span class="cmt"># -1</span>
nb_occ(7, t)      <span class="cmt"># 3</span></pre>
    <p><strong>Q2.</strong> Fonction <span class="code-inline">nb_occ</span> ci-dessus : un accumulateur incrémenté à chaque égalité ; ici, 3 occurrences de 7.</p>
    <p><strong>Q3.</strong> <span class="code-inline">derniere</span> : pire cas \(n\) comparaisons (valeur absente ou seulement en tête), \(O(n)\) ; meilleur cas 1 comparaison (valeur en dernière position), \(O(1)\). <span class="code-inline">nb_occ</span> : exactement \(n\) comparaisons dans tous les cas, \(O(n)\), car toute occurrence peut compter, il n'y a pas de sortie anticipée possible.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Relevés de température</h3>
  <div class="statement">Une station relève chaque jour la température à midi, en degrés entiers. Les relevés forment une liste non vide <span class="code-inline">T</span>, par exemple <span class="code-inline">T = [3, -2, 5, 8, 6, -1, 4]</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">amplitude(T)</span>, qui renvoie l'écart entre la plus haute et la plus basse température, en un seul parcours de la liste.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">jours_sous_moyenne(T)</span>, qui renvoie le nombre de jours où la température est strictement inférieure à la moyenne de la période. Peut-on se contenter d'un seul parcours ? Quel est le coût ?</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">plus_longue_hausse(T)</span>, qui renvoie la longueur de la plus longue suite de jours consécutifs où la température augmente strictement d'un jour au suivant (pour <span class="code-inline">T</span>, c'est 3 : −2, 5, 8). Donner un invariant de la boucle.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
<pre class="codeblock"><span class="kw">def</span> amplitude(T):
    mini, maxi = T[0], T[0]
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(T)):
        <span class="kw">if</span> T[i] &lt; mini:
            mini = T[i]
        <span class="kw">elif</span> T[i] &gt; maxi:
            maxi = T[i]
    <span class="kw">return</span> maxi - mini

<span class="kw">def</span> jours_sous_moyenne(T):
    s = 0
    <span class="kw">for</span> x <span class="kw">in</span> T:          <span class="cmt"># 1er passage : la moyenne</span>
        s = s + x
    moy = s / len(T)
    c = 0
    <span class="kw">for</span> x <span class="kw">in</span> T:          <span class="cmt"># 2e passage : le comptage</span>
        <span class="kw">if</span> x &lt; moy:
            c = c + 1
    <span class="kw">return</span> c

<span class="kw">def</span> plus_longue_hausse(T):
    meilleur, courant = 1, 1
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(T)):
        <span class="kw">if</span> T[i] &gt; T[i - 1]:
            courant = courant + 1
            <span class="kw">if</span> courant &gt; meilleur:
                meilleur = courant
        <span class="kw">else</span>:
            courant = 1
    <span class="kw">return</span> meilleur</pre>
    <p><strong>Q1.</strong> On tient à jour le minimum et le maximum à la fois, initialisés avec <span class="code-inline">T[0]</span> (les températures peuvent être négatives). Le <span class="code-inline">elif</span> est juste : comme <span class="code-inline">mini &lt;= maxi</span>, une valeur ne peut pas être à la fois plus petite que le minimum et plus grande que le maximum. Pour <span class="code-inline">T</span> : \(8 - (-2) = 10\).</p>
    <p><strong>Q2.</strong> La moyenne doit être connue avant de compter : un premier parcours la calcule, un second compte. Le coût reste linéaire (environ \(2n\) opérations). Pour <span class="code-inline">T</span>, la moyenne vaut \(23/7 \approx 3{,}29\) : les jours à 3, −2 et −1 sont en dessous, d'où 3.</p>
    <p><strong>Q3.</strong> <span class="code-inline">courant</span> est la longueur de la hausse qui se termine au jour \(i\). Invariant : au début du tour \(i\), <span class="code-inline">courant</span> est la longueur de la plus longue hausse qui se termine au jour \(i - 1\), et <span class="code-inline">meilleur</span> la plus longue hausse contenue dans <span class="code-inline">T[0..i-1]</span>. Une seule boucle de \(n - 1\) tours : coût linéaire.</p>
<pre class="codeblock">T = [3, -2, 5, 8, 6, -1, 4]
amplitude(T)             <span class="cmt"># 10</span>
jours_sous_moyenne(T)    <span class="cmt"># 3</span>
plus_longue_hausse(T)    <span class="cmt"># 3</span></pre>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Un second maximum à corriger</h3>
  <div class="statement">Spécification : <span class="code-inline">second(t)</span> reçoit une liste d'au moins deux nombres et renvoie son deuxième plus grand élément, répétitions comprises (pour <span class="code-inline">[5, 9, 9]</span>, la réponse est 9). Un élève propose :
<pre class="codeblock"><span class="kw">def</span> second(t):
    m1, m2 = t[0], t[0]
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &gt; m1:
            m2 = m1
            m1 = x
        <span class="kw">elif</span> x &gt; m2:
            m2 = x
    <span class="kw">return</span> m2</pre>
  </div>
  <div class="q"><strong>Q1.</strong> Que renvoient <span class="code-inline">second([3, 8, 5])</span>, <span class="code-inline">second([8, 3, 5])</span> et <span class="code-inline">second([8, 3])</span> ? Conclure.</div>
  <div class="q"><strong>Q2.</strong> Identifier l'erreur et la corriger. Proposer un jeu de tests qui l'aurait détectée.</div>
  <div class="q"><strong>Q3.</strong> On cherche maintenant la deuxième plus grande valeur <em>distincte</em> (pour <span class="code-inline">[9, 4, 9, 7]</span>, c'est 7). Écrire <span class="code-inline">second_distinct(t)</span>, pour une liste contenant au moins deux valeurs distinctes, et donner son coût.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Exécution pas à pas :</p>
<pre class="codeblock">second([3, 8, 5])    <span class="cmt"># 5</span>
second([8, 3, 5])    <span class="cmt"># 8</span>
second([8, 3])       <span class="cmt"># 8</span></pre>
    <p>Le premier résultat est juste, les deux autres sont faux (on attendait 5 et 3) : dès que le maximum est en tête, <span class="code-inline">m2</span> vaut ce maximum dès le départ et n'est jamais corrigé. La fonction n'est juste que si le maximum n'est pas en première position.</p>
    <p><strong>Q2.</strong> L'erreur est l'initialisation <span class="code-inline">m2 = t[0]</span>, qui suppose que <span class="code-inline">t[0]</span> peut être le second maximum alors qu'il est aussi compté comme maximum. On corrige en initialisant avec les deux premières cases rangées dans l'ordre et en parcourant à partir de l'indice 2 : c'est la fonction <span class="code-inline">second_max</span> du cours. (L'ordre des deux affectations <span class="code-inline">m2 = m1</span> puis <span class="code-inline">m1 = x</span> est, lui, correct.) Le jeu de tests doit faire varier la position du maximum : <span class="code-inline">[8, 3]</span> (attendu 3), <span class="code-inline">[3, 8]</span> (3), <span class="code-inline">[8, 3, 5]</span> (5), <span class="code-inline">[9, 9]</span> (9), <span class="code-inline">[-4, -7, -1]</span> (−4). Un jeu qui ne place jamais le maximum en tête laisse passer l'erreur.</p>
    <p><strong>Q3.</strong> On calcule d'abord le maximum \(m_1\) (fonction <span class="code-inline">maximum</span> du cours), puis le plus grand élément strictement inférieur à \(m_1\). Pour initialiser \(m_2\) avec une vraie valeur de la liste, on avance jusqu'à la première case différente de \(m_1\) : la boucle <span class="code-inline">while</span> s'arrête, car la précondition garantit qu'une telle case existe.</p>
<pre class="codeblock"><span class="kw">def</span> second_distinct(t):
    <span class="cmt"># t contient au moins deux valeurs distinctes</span>
    m1 = maximum(t)
    i = 0
    <span class="kw">while</span> t[i] == m1:  <span class="cmt"># s'arrête : une valeur diffère de m1</span>
        i = i + 1
    m2 = t[i]          <span class="cmt"># un candidat strictement inférieur à m1</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &lt; m1 <span class="kw">and</span> x &gt; m2:
            m2 = x
    <span class="kw">return</span> m2</pre>
<pre class="codeblock">second_distinct([9, 4, 9, 7])   <span class="cmt"># 7</span>
second_distinct([5, 9, 9])      <span class="cmt"># 5</span>
second_distinct([-1, -3])       <span class="cmt"># -3</span></pre>
    <p>Trois parcours au plus (maximum, recherche d'un candidat, dernière boucle), chacun de coût \(O(n)\) : coût linéaire.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Anagrammes</h3>
  <div class="statement">Deux mots sont des <strong>anagrammes</strong> s'ils sont formés des mêmes lettres, chacune répétée le même nombre de fois : « chien » et « niche », « ironique » et « onirique ». On dispose de la fonction <span class="code-inline">compter(t)</span> du cours, qui renvoie le dictionnaire des nombres d'occurrences des éléments d'une liste ou d'une chaîne.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">sont_anagrammes(u, v)</span>, de coût linéaire en la longueur des mots, en n'utilisant qu'un seul dictionnaire.</div>
  <div class="q"><strong>Q2.</strong> Justifier que la fonction renvoie <span class="code-inline">True</span> exactement quand <span class="code-inline">u</span> et <span class="code-inline">v</span> sont des anagrammes.</div>
  <div class="q"><strong>Q3.</strong> Une méthode sans dictionnaire compte, pour chaque lettre de <span class="code-inline">u</span>, ses occurrences dans <span class="code-inline">u</span> et dans <span class="code-inline">v</span>. Quel est son coût ? Pour tester toutes les paires d'une liste de \(k\) mots de longueur au plus \(L\), combien d'appels à <span class="code-inline">sont_anagrammes</span> faut-il ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> On compte les lettres de <span class="code-inline">u</span>, puis on « consomme » ces comptes avec les lettres de <span class="code-inline">v</span>.</p>
<pre class="codeblock"><span class="kw">def</span> sont_anagrammes(u, v):
    <span class="kw">if</span> len(u) != len(v):
        <span class="kw">return</span> <span class="kw">False</span>
    d = compter(u)            <span class="cmt"># fonction du cours (§4)</span>
    <span class="kw">for</span> c <span class="kw">in</span> v:
        <span class="kw">if</span> c <span class="kw">not</span> <span class="kw">in</span> d <span class="kw">or</span> d[c] == 0:
            <span class="kw">return</span> <span class="kw">False</span>    <span class="cmt"># c manque, ou est en excès dans v</span>
        d[c] = d[c] - 1
    <span class="kw">return</span> <span class="kw">True</span></pre>
<pre class="codeblock">sont_anagrammes(<span class="str">"chien"</span>, <span class="str">"niche"</span>)      <span class="cmt"># True</span>
sont_anagrammes(<span class="str">"ironique"</span>, <span class="str">"onirique"</span>)  <span class="cmt"># True</span>
sont_anagrammes(<span class="str">"aab"</span>, <span class="str">"abb"</span>)          <span class="cmt"># False</span></pre>
    <p><strong>Q2.</strong> Si la fonction renvoie <span class="code-inline">True</span>, chaque lettre de <span class="code-inline">v</span> a été prise dans un compte de <span class="code-inline">u</span> encore positif : chaque lettre apparaît dans <span class="code-inline">v</span> au plus autant de fois que dans <span class="code-inline">u</span>. Comme les deux mots ont la même longueur, il ne peut pas y avoir d'inégalité stricte pour une lettre (la somme des écarts est nulle) : les nombres d'occurrences sont égaux. Réciproquement, pour deux anagrammes, aucun compte n'est jamais épuisé trop tôt, et la boucle va jusqu'au bout. Le test de longueur est indispensable : sans lui, <span class="code-inline">"ab"</span> et <span class="code-inline">"a"</span> seraient déclarés anagrammes.</p>
    <p>Coût : <span class="code-inline">compter(u)</span> fait \(n\) tours, la boucle sur <span class="code-inline">v</span> aussi, chaque opération sur le dictionnaire étant en temps constant en moyenne : \(O(n)\).</p>
    <p><strong>Q3.</strong> Pour chacune des \(n\) lettres de <span class="code-inline">u</span>, deux parcours complets de longueur \(n\) : \(2n^2\) comparaisons, coût quadratique. Tester toutes les paires de \(k\) mots demande \(\frac{k(k-1)}{2}\) appels, chacun en \(O(L)\) avec la version à dictionnaire : \(O(k^2 L)\) au total.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Toutes les occurrences d'un motif</h3>
  <div class="statement">On reprend la recherche naïve d'un facteur du cours. Dans <span class="code-inline">"BANANAS"</span>, le motif <span class="code-inline">"ANA"</span> apparaît aux positions 1 et 3 : ces deux occurrences se <em>chevauchent</em> (elles partagent le A de la position 3).</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">occurrences(m, texte)</span>, qui renvoie la liste de toutes les positions du motif <span class="code-inline">m</span> dans <span class="code-inline">texte</span>, chevauchements compris.</div>
  <div class="q"><strong>Q2.</strong> On note \(n\) la longueur du texte et \(p\) celle du motif. Donner le nombre exact de comparaisons de caractères pour <span class="code-inline">texte</span> formé de \(n\) lettres a et <span class="code-inline">m</span> de \(p\) lettres a. Est-ce le pire cas ?</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">nb_disjointes(m, texte)</span> (motif non vide), qui compte les occurrences de gauche à droite sans chevauchement : après une occurrence trouvée en \(i\), la recherche reprend en \(i + p\). Justifier la terminaison.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Même double boucle que dans le cours, mais au lieu de renvoyer la première position, on ajoute chaque position trouvée à une liste.</p>
<pre class="codeblock"><span class="kw">def</span> occurrences(m, texte):
    <span class="cmt"># positions de m dans texte, chevauchements compris</span>
    n, p = len(texte), len(m)
    res = []
    <span class="kw">for</span> i <span class="kw">in</span> range(n - p + 1):
        k = 0
        <span class="kw">while</span> k &lt; p <span class="kw">and</span> texte[i + k] == m[k]:
            k = k + 1
        <span class="kw">if</span> k == p:
            res.append(i)
    <span class="kw">return</span> res</pre>
    <p><strong>Q2.</strong> Toutes les positions de 0 à \(n - p\) sont des occurrences, et chacune demande \(p\) comparaisons réussies : \((n - p + 1)\,p\) comparaisons. C'est le maximum possible, puisqu'aucune position ne peut demander plus de \(p\) comparaisons : c'est bien un pire cas (comme le texte « aaa…a » avec le motif « a…ab » du cours). Pour \(p = n/2\), cela fait environ \(n^2/4\) : coût quadratique.</p>
    <p><strong>Q3.</strong></p>
<pre class="codeblock"><span class="kw">def</span> nb_disjointes(m, texte):
    <span class="cmt"># m non vide ; occurrences sans chevauchement</span>
    n, p = len(texte), len(m)
    c, i = 0, 0
    <span class="kw">while</span> i &lt;= n - p:
        k = 0
        <span class="kw">while</span> k &lt; p <span class="kw">and</span> texte[i + k] == m[k]:
            k = k + 1
        <span class="kw">if</span> k == p:
            c = c + 1
            i = i + p     <span class="cmt"># on saute le motif trouvé</span>
        <span class="kw">else</span>:
            i = i + 1
    <span class="kw">return</span> c</pre>
<pre class="codeblock">occurrences(<span class="str">"ANA"</span>, <span class="str">"BANANAS"</span>)    <span class="cmt"># [1, 3]</span>
occurrences(<span class="str">"AA"</span>, <span class="str">"AAAA"</span>)        <span class="cmt"># [0, 1, 2]</span>
nb_disjointes(<span class="str">"AA"</span>, <span class="str">"AAAA"</span>)      <span class="cmt"># 2</span>
nb_disjointes(<span class="str">"ANA"</span>, <span class="str">"BANANAS"</span>)  <span class="cmt"># 1</span></pre>
    <p>Terminaison : à chaque tour, \(i\) augmente d'au moins 1 (de \(p \ge 1\) ou de 1). La quantité \(n - p - i\) est un entier qui diminue strictement et la boucle s'arrête dès qu'il devient négatif : c'est un variant. Le motif non vide est indispensable : avec \(p = 0\), \(i\) n'augmenterait jamais après une « occurrence ».</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Deux éléments de somme donnée</h3>
  <div class="statement">Étant donnés une liste d'entiers <span class="code-inline">t</span> et un entier <span class="code-inline">s</span>, on veut savoir s'il existe deux indices \(i \lt j\) tels que <span class="code-inline">t[i] + t[j] == s</span>. Exemple : <span class="code-inline">t = [8, 3, 11, 5, 14]</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">somme_naive(t, s)</span> avec deux boucles imbriquées. Coût dans le pire cas ?</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">somme_dico(t, s)</span>, de coût linéaire, à l'aide d'un dictionnaire des valeurs déjà rencontrées. Dérouler l'appel <span class="code-inline">somme_dico(t, 19)</span>.</div>
  <div class="q"><strong>Q3.</strong> On suppose maintenant <span class="code-inline">t</span> triée. Écrire <span class="code-inline">somme_triee(t, s)</span>, sans dictionnaire, avec deux indices <span class="code-inline">g</span> (parti de la gauche) et <span class="code-inline">d</span> (parti de la droite), de coût linéaire. Justifier sa correction.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
<pre class="codeblock"><span class="kw">def</span> somme_naive(t, s):
    n = len(t)
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):
            <span class="kw">if</span> t[i] + t[j] == s:
                <span class="kw">return</span> <span class="kw">True</span>
    <span class="kw">return</span> <span class="kw">False</span>

<span class="kw">def</span> somme_dico(t, s):
    vus = {}                  <span class="cmt"># valeurs déjà rencontrées</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> s - x <span class="kw">in</span> vus:      <span class="cmt"># un partenaire est déjà passé</span>
            <span class="kw">return</span> <span class="kw">True</span>
        vus[x] = <span class="kw">True</span>
    <span class="kw">return</span> <span class="kw">False</span></pre>
    <p><strong>Q1.</strong> Dans le pire cas (aucun couple ne convient), les \(\frac{n(n-1)}{2}\) couples sont examinés : \(O(n^2)\).</p>
    <p><strong>Q2.</strong> Pour chaque valeur \(x\), son partenaire éventuel est \(s - x\) : il suffit de savoir s'il est déjà passé. Pour <span class="code-inline">somme_dico(t, 19)</span> : 8 arrive, 11 n'est pas vu, on retient 8 ; 3 arrive, 16 n'est pas vu, on retient 3 ; 11 arrive, \(19 - 11 = 8\) a été vu : <span class="code-inline">True</span> (couple 8 + 11). Chaque tour est de coût constant en moyenne : \(O(n)\). Une valeur n'est cherchée que parmi les <em>précédentes</em>, ce qui garantit \(i \lt j\) (avec \(s = 6\), le seul 3 de la liste n'est pas apparié avec lui-même).</p>
<pre class="codeblock">t = [8, 3, 11, 5, 14]
somme_naive(t, 19), somme_dico(t, 19)    <span class="cmt"># (True, True)</span>
somme_naive(t, 12), somme_dico(t, 12)    <span class="cmt"># (False, False)</span>
somme_dico(t, 6)     <span class="cmt"># False  (3 + 3 interdit)</span>
somme_triee([3, 5, 8, 11, 14], 12)       <span class="cmt"># False</span></pre>
    <p><strong>Q3.</strong></p>
<pre class="codeblock"><span class="kw">def</span> somme_triee(t, s):
    <span class="cmt"># t trié dans l'ordre croissant</span>
    g, d = 0, len(t) - 1
    <span class="kw">while</span> g &lt; d:
        <span class="kw">if</span> t[g] + t[d] == s:
            <span class="kw">return</span> <span class="kw">True</span>
        <span class="kw">elif</span> t[g] + t[d] &lt; s:
            g = g + 1    <span class="cmt"># t[g] trop petit, même avec t[d]</span>
        <span class="kw">else</span>:
            d = d - 1    <span class="cmt"># t[d] trop grand, même avec t[g]</span>
    <span class="kw">return</span> <span class="kw">False</span></pre>
    <p>Invariant : aucun couple qui convient n'utilise un indice \(i \lt g\) ou \(j \gt d\). Si \(t[g] + t[d] \lt s\), alors pour tout \(j \le d\), \(t[g] + t[j] \le t[g] + t[d] \lt s\) : \(t[g]\) ne fait partie d'aucune solution restante, on peut l'écarter. Symétriquement si la somme est trop grande. Quand \(g = d\), il ne reste aucun couple : la réponse <span class="code-inline">False</span> est juste. Chaque tour diminue \(d - g\) de 1 : au plus \(n - 1\) tours, \(O(n)\). Si la liste n'est pas déjà triée, le tri coûte \(O(n \log n)\) et domine.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Première occurrence dans une liste triée</h3>
  <div class="statement">La liste <span class="code-inline">t = [1, 3, 3, 3, 6, 9, 9, 12]</span> est triée et contient des répétitions. On rappelle que <span class="code-inline">dicho(x, t)</span> (cours, §7) renvoie un indice <em>quelconque</em> de <span class="code-inline">x</span>.</div>
  <div class="q"><strong>Q1.</strong> Que renvoie <span class="code-inline">dicho(3, t)</span> ? Est-ce la première occurrence ?</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">premier_indice(x, t)</span>, qui renvoie le plus petit indice \(i\) tel que \(t[i] \ge x\) (et <span class="code-inline">len(t)</span> s'il n'y en a pas), en coût logarithmique. On utilisera un intervalle semi-ouvert \([g, d[\) et l'invariant « \(t[i] \lt x\) pour \(i \lt g\), \(t[i] \ge x\) pour \(i \ge d\) ». Comment en déduire si \(x\) est présent ?</div>
  <div class="q"><strong>Q3.</strong> En déduire une fonction <span class="code-inline">nb_occ_trie(x, t)</span> de coût \(O(\log n)\), qui compte les occurrences de <span class="code-inline">x</span>.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Premier tour : \(g = 0\), \(d = 7\), \(m = 3\), \(t[3] = 3\) : la fonction renvoie 3, alors que la première occurrence est à l'indice 1. La dichotomie du cours s'arrête au premier 3 qu'elle rencontre, pas forcément le premier de la liste.</p>
    <p><strong>Q2.</strong> Quand \(t[m] \ge x\), on ne peut pas exclure \(m\) : il est peut-être la réponse. On garde donc \(m\) comme borne droite exclue de la zone inconnue (<span class="code-inline">d = m</span>), ce qui n'est correct qu'avec un intervalle semi-ouvert.</p>
<pre class="codeblock"><span class="kw">def</span> premier_indice(x, t):
    <span class="cmt"># t trié ; plus petit i tel que t[i] &gt;= x (len(t) si aucun)</span>
    g, d = 0, len(t)
    <span class="kw">while</span> g &lt; d:
        <span class="cmt"># invariant : t[i] &lt; x si i &lt; g, et t[i] &gt;= x si i &gt;= d</span>
        m = (g + d) // 2
        <span class="kw">if</span> t[m] &lt; x:
            g = m + 1
        <span class="kw">else</span>:
            d = m        <span class="cmt"># t[m] &gt;= x : m reste candidat</span>
    <span class="kw">return</span> g</pre>
    <p>Au départ, l'invariant est vrai (aucun indice \(i \lt 0\), aucun \(i \ge n\)). Il est conservé : si \(t[m] \lt x\), les cases jusqu'à \(m\) sont \(\lt x\) (liste triée), d'où <span class="code-inline">g = m + 1</span> ; sinon les cases à partir de \(m\) sont \(\ge x\), d'où <span class="code-inline">d = m</span>. Terminaison : \(g \le m \lt d\), donc \(d - g\) diminue strictement. À la sortie, \(g = d\) et l'invariant dit exactement que \(g\) est la réponse. Au plus \(\lfloor \log_2 n \rfloor + 1\) tours. Enfin, \(x\) est présent si et seulement si <span class="code-inline">g &lt; len(t)</span> et <span class="code-inline">t[g] == x</span> (test paresseux, dans cet ordre).</p>
    <p><strong>Q3.</strong> On écrit de même le plus petit indice où \(t[i] \gt x\) (seul le test change : <span class="code-inline">t[m] &lt;= x</span>). Les occurrences de \(x\) occupent exactement les indices entre ces deux positions.</p>
<pre class="codeblock"><span class="kw">def</span> premier_strict(x, t):
    <span class="cmt"># t trié ; plus petit i tel que t[i] &gt; x (len(t) si aucun)</span>
    g, d = 0, len(t)
    <span class="kw">while</span> g &lt; d:
        m = (g + d) // 2
        <span class="kw">if</span> t[m] &lt;= x:
            g = m + 1
        <span class="kw">else</span>:
            d = m
    <span class="kw">return</span> g

<span class="kw">def</span> nb_occ_trie(x, t):
    <span class="kw">return</span> premier_strict(x, t) - premier_indice(x, t)</pre>
<pre class="codeblock">t = [1, 3, 3, 3, 6, 9, 9, 12]
dicho(3, t)            <span class="cmt"># 3</span>
premier_indice(3, t)   <span class="cmt"># 1</span>
nb_occ_trie(3, t)      <span class="cmt"># 3</span>
premier_indice(7, t)   <span class="cmt"># 5</span>
nb_occ_trie(7, t)      <span class="cmt"># 0</span>
premier_indice(20, t)  <span class="cmt"># 8</span></pre>
    <p>Deux dichotomies : \(O(\log n)\), au lieu de \(O(n)\) pour un comptage séquentiel.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Racine carrée entière par dichotomie</h3>
  <div class="statement">Pour un entier \(n \ge 0\), la <strong>racine carrée entière</strong> de \(n\) est l'unique entier \(r \ge 0\) tel que \(r^2 \le n \lt (r+1)^2\). On veut la calculer avec des entiers seulement.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(r\) appartient à \([0, n]\).</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">racine(n)</span> par dichotomie sur les entiers de \([0, n]\), en maintenant l'invariant \(g^2 \le n \lt (d+1)^2\). Pourquoi faut-il prendre ici le milieu arrondi <em>au-dessus</em>, <span class="code-inline">m = (g + d + 1) // 2</span> ?</div>
  <div class="q"><strong>Q3.</strong> Majorer le nombre de tours pour \(n = 10^{12}\) et comparer avec la méthode qui essaie \(r = 0, 1, 2, \dots\)</div>
  <div class="q"><strong>Q4.</strong> Pourquoi ne pas simplement calculer <span class="code-inline">int(n ** 0.5)</span> ? Tester avec \(n = 10^{16} - 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(0^2 = 0 \le n\), donc \(r \ge 0\). Si \(n \ge 1\), alors \(n \le n^2 \lt (n+1)^2\), donc \(r \le n\) ; si \(n = 0\), \(r = 0\). Dans tous les cas, \(r \in [0, n]\).</p>
    <p><strong>Q2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> racine(n):
    <span class="cmt"># n entier &gt;= 0 ; renvoie r tel que r*r &lt;= n &lt; (r+1)**2</span>
    g, d = 0, n
    <span class="kw">while</span> g &lt; d:
        <span class="cmt"># invariant : g*g &lt;= n &lt; (d+1)*(d+1)</span>
        m = (g + d + 1) // 2      <span class="cmt"># milieu arrondi au-dessus</span>
        <span class="kw">if</span> m * m &lt;= n:
            g = m
        <span class="kw">else</span>:
            d = m - 1
    <span class="kw">return</span> g</pre>
    <p>Au départ, \(0 \le n\) et \(n \lt (n+1)^2\) : l'invariant est vrai. Si \(m^2 \le n\), on peut prendre \(g = m\) ; sinon \(n \lt m^2 = ((m-1)+1)^2\), on peut prendre \(d = m - 1\). À la sortie, \(g = d\) et l'invariant donne \(g^2 \le n \lt (g+1)^2\) : \(g = r\).</p>
    <p>Terminaison : tant que \(g \lt d\), le milieu arrondi au-dessus vérifie \(g \lt m \le d\) ; les deux mises à jour diminuent donc strictement \(d - g\). Avec le milieu arrondi au-dessous, \(m\) peut valoir \(g\) (quand \(d = g + 1\)) et l'affectation <span class="code-inline">g = m</span> ne change rien : boucle infinie, dès <span class="code-inline">racine(1)</span>.</p>
    <p><strong>Q3.</strong> La longueur \(d - g + 1\) est au moins divisée par deux à chaque tour : au plus \(\lfloor \log_2 n \rfloor + 1\) tours, soit 40 pour \(n = 10^{12}\) (\(\log_2 10^{12} \approx 39{,}9\)). Essayer \(r = 0, 1, 2, \dots\) demande \(r + 1 \approx 10^6\) tours.</p>
<pre class="codeblock">racine(0), racine(1), racine(15), racine(16)   <span class="cmt"># (0, 1, 3, 4)</span>
racine(10**12 + 5)                             <span class="cmt"># 1000000</span>
n = 10**16 - 1
racine(n)            <span class="cmt"># 99999999</span>
int(n ** 0.5)        <span class="cmt"># 100000000</span></pre>
    <p><strong>Q4.</strong> <span class="code-inline">n ** 0.5</span> est un calcul en flottants, avec environ 16 chiffres significatifs. \(10^{16} - 1\) n'est pas représentable exactement : il est arrondi à \(10^{16}\), dont la racine vaut exactement \(10^8\), alors que la bonne réponse est \(10^8 - 1\). La méthode entière, elle, est exacte pour tout \(n\) (voir le chapitre <em>Représentation des nombres</em>).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Les trois derniers chiffres de \(7^{2026}\)</h3>
  <div class="statement">On veut calculer \(7^{2026} \bmod 1000\), c'est-à-dire les trois derniers chiffres de \(7^{2026}\), sans calculer ce nombre en entier. On rappelle que pour des entiers \(a, b \ge 0\) et \(m \ge 1\), <span class="code-inline">a % m</span> est le reste de la division euclidienne de \(a\) par \(m\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \((a \times b) \bmod m = \big((a \bmod m) \times (b \bmod m)\big) \bmod m\).</div>
  <div class="q"><strong>Q2.</strong> Adapter <span class="code-inline">puissance_rapide</span> du cours en une fonction <span class="code-inline">puissance_mod(x, n, m)</span> qui renvoie \(x^n \bmod m\), tous les calculs intermédiaires restant inférieurs à \(m^2\).</div>
  <div class="q"><strong>Q3.</strong> Combien de multiplications effectue <span class="code-inline">puissance_mod(7, 2026, 1000)</span> ? Combien de chiffres a \(7^{2026}\) ? Pourquoi la réduction modulo \(m\) change-t-elle le coût réel du calcul ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Écrivons \(a = q m + r\) et \(b = q' m + r'\) avec \(r = a \bmod m\) et \(r' = b \bmod m\). Alors \(ab = (qq'm + qr' + q'r)\,m + rr'\) : \(ab\) et \(rr'\) diffèrent d'un multiple de \(m\), donc ont le même reste.</p>
    <p><strong>Q2.</strong> On réduit après chaque multiplication ; l'invariant devient \((r \cdot a^k) \bmod m = x^n \bmod m\), conservé grâce à Q1. Les variables \(r\) et \(a\) restent inférieures à \(m\), leurs produits inférieurs à \(m^2\). (<span class="code-inline">1 % m</span> au départ traite le cas \(m = 1\), où le résultat doit être 0.)</p>
<pre class="codeblock"><span class="kw">def</span> puissance_mod(x, n, m):
    <span class="cmt"># x, n entiers &gt;= 0, m entier &gt;= 1 ; renvoie (x ** n) % m</span>
    r, a, k = 1 % m, x % m, n
    <span class="kw">while</span> k &gt; 0:
        <span class="cmt"># invariant : (r * a ** k) % m == (x ** n) % m</span>
        <span class="kw">if</span> k % 2 == 1:
            r = (r * a) % m
        a = (a * a) % m
        k = k // 2
    <span class="kw">return</span> r</pre>
<pre class="codeblock">puissance_mod(7, 2026, 1000)    <span class="cmt"># 649</span>
puissance_mod(2, 10, 1000)      <span class="cmt"># 24</span></pre>
    <p><strong>Q3.</strong> \(2026 = 11111101010\) en base 2 : 11 chiffres, dont 8 égaux à 1. La boucle fait 11 tours, avec 11 multiplications pour <span class="code-inline">a</span> et 8 pour <span class="code-inline">r</span> : 19 multiplications, au lieu de 2026. Le nombre \(7^{2026}\) a \(\lfloor 2026 \log_{10} 7 \rfloor + 1 = 1713\) chiffres. Sans réduction, les multiplications porteraient sur des entiers de plus en plus longs, de coût croissant ; avec la réduction, elles portent sur des nombres de moins de 7 chiffres, de coût constant : le coût total est vraiment en \(O(\log n)\). Résultat : les trois derniers chiffres de \(7^{2026}\) sont 649.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Surveillance vibratoire d'un pont</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves d'informatique PT (thème : recherche séquentielle, dictionnaire, recherche dichotomique, jeux de tests).</div>
  <div class="statement">Un capteur fixé sur le tablier d'un pont enregistre l'amplitude de ses vibrations. Chaque relevé est un couple <span class="code-inline">(instant, amplitude)</span> d'entiers : l'instant en secondes depuis minuit, l'amplitude en micromètres. Une journée de relevés est une liste <span class="code-inline">R</span> de tels couples, rangés par instants <strong>strictement croissants</strong>. On utilisera l'exemple :
<pre class="codeblock">R = [(5, 12), (17, 40), (31, 18), (3605, 55), (3720, 9),
     (7300, 61), (7310, 61), (9000, 7)]</pre>
  Pour un couple <span class="code-inline">c</span>, <span class="code-inline">c[0]</span> est l'instant et <span class="code-inline">c[1]</span> l'amplitude. On note \(n\) la longueur de <span class="code-inline">R</span>. Seuls les éléments du langage Python de l'annexe du programme sont autorisés.</div>

  <p class="exo-part">Partie A — Parcours séquentiels</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">premier_alerte(R: list, seuil: int) -&gt; int</span>, qui renvoie l'indice du premier relevé d'amplitude strictement supérieure à <span class="code-inline">seuil</span>, et \(-1\) s'il n'y en a pas. Que vaut <span class="code-inline">premier_alerte(R, 50)</span> ?</div>
  <div class="q"><strong>A2.</strong> Écrire <span class="code-inline">instant_max(R: list) -&gt; int</span>, qui renvoie l'instant du premier relevé d'amplitude maximale (\(R\) non vide).</div>
  <div class="q"><strong>A3.</strong> Un <em>épisode d'alerte</em> est une suite maximale de relevés consécutifs d'amplitude strictement supérieure au seuil. Écrire <span class="code-inline">nb_episodes(R: list, seuil: int) -&gt; int</span>. Combien d'épisodes pour le seuil 50 ? Donner le coût des trois fonctions.</div>

  <p class="exo-part">Partie B — Statistiques horaires</p>
  <div class="q"><strong>B1.</strong> L'heure d'un relevé est <span class="code-inline">instant // 3600</span>. Écrire <span class="code-inline">releves_par_heure(R: list) -&gt; dict</span>, qui renvoie un dictionnaire associant à chaque heure présente le nombre de relevés de cette heure.</div>
  <div class="q"><strong>B2.</strong> Écrire <span class="code-inline">heure_la_plus_chargee(R: list) -&gt; int</span>, qui renvoie l'heure ayant le plus de relevés (la plus petite en cas d'égalité). Justifier que la règle d'égalité est respectée.</div>
  <div class="q"><strong>B3.</strong> Quel est le coût de ces fonctions ? Quel avantage présente un dictionnaire par rapport à une liste de 24 compteurs si l'on étend l'étude à un enregistrement de plusieurs jours ?</div>

  <p class="exo-part">Partie C — Requêtes sur une période</p>
  <div class="q"><strong>C1.</strong> Écrire <span class="code-inline">premier_apres(R: list, a: int) -&gt; int</span>, qui renvoie le plus petit indice \(i\) tel que <span class="code-inline">R[i][0] &gt;= a</span> (\(n\) s'il n'y en a pas), par dichotomie. Énoncer l'invariant et justifier la terminaison.</div>
  <div class="q"><strong>C2.</strong> En déduire <span class="code-inline">nb_entre(R: list, a: int, b: int) -&gt; int</span>, nombre de relevés d'instant compris entre \(a\) et \(b\) inclus (\(a \le b\)), en \(O(\log n)\).</div>
  <div class="q"><strong>C3.</strong> Le capteur fait un relevé par seconde (\(n = 86\,400\)) et les ingénieurs posent \(q = 1\,000\) requêtes par jour. Comparer le nombre de comparaisons avec une méthode séquentielle.</div>

  <p class="exo-part">Partie D — Validation</p>
  <div class="q"><strong>D1.</strong> Toute la partie C repose sur une précondition. Laquelle ? Écrire <span class="code-inline">est_triee(R: list) -&gt; bool</span> qui la vérifie, et donner son coût.</div>
  <div class="q"><strong>D2.</strong> Proposer un jeu de tests de <span class="code-inline">nb_entre</span>, en justifiant le choix des cas.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1 à A3.</strong></p>
<pre class="codeblock"><span class="kw">def</span> premier_alerte(R, seuil):
    <span class="kw">for</span> i <span class="kw">in</span> range(len(R)):
        <span class="kw">if</span> R[i][1] &gt; seuil:
            <span class="kw">return</span> i
    <span class="kw">return</span> -1

<span class="kw">def</span> instant_max(R):
    im = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(R)):
        <span class="kw">if</span> R[i][1] &gt; R[im][1]:     <span class="cmt"># strict : 1re occurrence</span>
            im = i
    <span class="kw">return</span> R[im][0]

<span class="kw">def</span> nb_episodes(R, seuil):
    nb = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(len(R)):
        dessus = R[i][1] &gt; seuil
        <span class="kw">if</span> dessus <span class="kw">and</span> (i == 0 <span class="kw">or</span> R[i - 1][1] &lt;= seuil):
            <span class="cmt"># un épisode commence en i</span>
            nb = nb + 1
    <span class="kw">return</span> nb</pre>
    <p>A1 : <span class="code-inline">premier_alerte(R, 50)</span> vaut 3 (relevé <span class="code-inline">(3605, 55)</span>). A2 : test strict pour garder la première occurrence ; ici 7300. A3 : on compte les <em>débuts</em> d'épisode, c'est-à-dire les relevés au-dessus du seuil dont le prédécesseur n'existe pas ou est en dessous ; le <span class="code-inline">or</span> paresseux évite de lire <span class="code-inline">R[-1]</span> quand \(i = 0\). Pour le seuil 50, les relevés 3, 5 et 6 sont au-dessus : épisodes {3} et {5, 6}, soit 2. Les trois fonctions font un parcours : \(O(n)\) dans le pire cas (A1 peut s'arrêter avant).</p>
<pre class="codeblock">premier_alerte(R, 50)     <span class="cmt"># 3</span>
instant_max(R)            <span class="cmt"># 7300</span>
nb_episodes(R, 50)        <span class="cmt"># 2</span>
nb_episodes(R, 100)       <span class="cmt"># 0</span></pre>
    <p><strong>B1, B2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> releves_par_heure(R):
    d = {}
    <span class="kw">for</span> (instant, amp) <span class="kw">in</span> R:
        h = instant // 3600
        <span class="kw">if</span> h <span class="kw">in</span> d:
            d[h] = d[h] + 1
        <span class="kw">else</span>:
            d[h] = 1
    <span class="kw">return</span> d

<span class="kw">def</span> heure_la_plus_chargee(R):
    d = releves_par_heure(R)
    hmax = R[0][0] // 3600
    <span class="kw">for</span> h, nb <span class="kw">in</span> d.items():
        <span class="kw">if</span> nb &gt; d[hmax]:
            hmax = h
    <span class="kw">return</span> hmax</pre>
<pre class="codeblock">releves_par_heure(R)       <span class="cmt"># {0: 3, 1: 2, 2: 3}</span>
heure_la_plus_chargee(R)   <span class="cmt"># 0</span></pre>
    <p>Les clés sont insérées dans l'ordre du premier relevé de chaque heure, donc par heures croissantes puisque \(R\) est trié, et le parcours de <span class="code-inline">items()</span> suit l'ordre d'insertion. De plus <span class="code-inline">hmax</span> part de la plus petite heure et ne change que pour un effectif <em>strictement</em> plus grand : en cas d'égalité, la plus petite heure est gardée (ici 0, à égalité avec 2). Pour ne pas dépendre de l'ordre de parcours, on peut aussi remplacer le test par <span class="code-inline">nb &gt; d[hmax] or (nb == d[hmax] and h &lt; hmax)</span>.</p>
    <p><strong>B3.</strong> <span class="code-inline">releves_par_heure</span> : \(n\) tours de coût constant en moyenne, \(O(n)\) ; <span class="code-inline">heure_la_plus_chargee</span> : \(O(n)\) plus le parcours du dictionnaire, qui a au plus \(n\) clés : \(O(n)\). Sur plusieurs jours, les heures dépassent 23 : une liste de 24 cases ne suffit plus, alors que le dictionnaire accepte toute heure et ne contient que les heures effectivement présentes.</p>
    <p><strong>C1, C2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> premier_apres(R, a):
    <span class="cmt"># plus petit i tel que R[i][0] &gt;= a (len(R) sinon)</span>
    g, d = 0, len(R)
    <span class="kw">while</span> g &lt; d:
        <span class="cmt"># invariant : instants &lt; a avant g, &gt;= a à partir de d</span>
        m = (g + d) // 2
        <span class="kw">if</span> R[m][0] &lt; a:
            g = m + 1
        <span class="kw">else</span>:
            d = m
    <span class="kw">return</span> g

<span class="kw">def</span> nb_entre(R, a, b):
    <span class="cmt"># nombre de relevés d'instant compris entre a et b inclus</span>
    <span class="kw">return</span> premier_apres(R, b + 1) - premier_apres(R, a)</pre>
<pre class="codeblock">premier_apres(R, 3600)    <span class="cmt"># 3</span>
premier_apres(R, 10000)   <span class="cmt"># 8</span>
nb_entre(R, 30, 3700)     <span class="cmt"># 2</span>
nb_entre(R, 7300, 7310)   <span class="cmt"># 2</span>
nb_entre(R, 100, 200)     <span class="cmt"># 0</span></pre>
    <p>Invariant : les relevés d'indice \(\lt g\) ont un instant \(\lt a\), ceux d'indice \(\ge d\) un instant \(\ge a\). Vrai au départ ; conservé grâce au tri (si <span class="code-inline">R[m][0] &lt; a</span>, tous les relevés jusqu'à \(m\) sont avant \(a\)) ; à la sortie \(g = d\) est la réponse. Terminaison : \(g \le m \lt d\), donc \(d - g\) diminue strictement. Les instants étant entiers, les relevés entre \(a\) et \(b\) inclus sont ceux d'indice compris entre <span class="code-inline">premier_apres(R, a)</span> (inclus) et <span class="code-inline">premier_apres(R, b + 1)</span> (exclu) : d'où la différence. Deux dichotomies : \(O(\log n)\).</p>
    <p><strong>C3.</strong> Séquentiellement, chaque requête parcourt la liste : \(q n \approx 8{,}6 \times 10^7\) comparaisons. Par dichotomie : au plus \(2 \times 17\) tours par requête (\(\lfloor \log_2 86\,400 \rfloor + 1 = 17\)), soit environ \(3{,}4 \times 10^4\) comparaisons : 2 500 fois moins.</p>
    <p><strong>D1.</strong> La liste doit être triée par instants croissants (sinon la dichotomie donne un résultat faux, sans erreur).</p>
<pre class="codeblock"><span class="kw">def</span> est_triee(R):
    <span class="cmt"># instants strictement croissants ?</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(R) - 1):
        <span class="kw">if</span> R[i][0] &gt;= R[i + 1][0]:
            <span class="kw">return</span> <span class="kw">False</span>
    <span class="kw">return</span> <span class="kw">True</span></pre>
    <p>Au plus \(n - 1\) comparaisons : \(O(n)\). Vérifier cette précondition à chaque requête ferait perdre tout le bénéfice de la dichotomie : on la vérifie une fois, après l'enregistrement.</p>
    <p><strong>D2.</strong> On couvre les familles de requêtes (intervalle vide de relevés, contenant un ou plusieurs relevés, tous les relevés) et leurs limites (bornes égales à un instant, avant le premier, après le dernier, liste vide) :</p>
<pre class="codeblock"><span class="kw">def</span> tester_nb_entre():
    <span class="kw">assert</span> nb_entre([], 0, 10) == 0          <span class="cmt"># aucun relevé</span>
    <span class="kw">assert</span> nb_entre(R, 5, 5) == 1            <span class="cmt"># a = b = un instant</span>
    <span class="kw">assert</span> nb_entre(R, 0, 4) == 0            <span class="cmt"># avant le 1er</span>
    <span class="kw">assert</span> nb_entre(R, 9000, 9999) == 1      <span class="cmt"># le dernier</span>
    <span class="kw">assert</span> nb_entre(R, 9001, 9999) == 0      <span class="cmt"># après le dernier</span>
    <span class="kw">assert</span> nb_entre(R, 0, 10000) == len(R)   <span class="cmt"># tous</span>
    <span class="kw">assert</span> nb_entre(R, 6, 16) == 0           <span class="cmt"># entre deux relevés</span>
    print(<span class="str">"tests réussis"</span>)</pre>
