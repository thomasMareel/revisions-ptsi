<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Exploiter un essai de traction</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : traitement de données expérimentales en résistance des matériaux).</div>
  <div class="statement"><p>Une machine d'essai étire une éprouvette d'alliage d'aluminium de longueur utile \(L_0 = 50\) mm et de section \(S_0 = 20\ \text{mm}^2\), et enregistre l'allongement \(\Delta L\) (en mm) et la force \(F\) (en N). On en déduit la contrainte \(\sigma = F/S_0\) (en MPa, c'est-à-dire en N/mm²) et la déformation \(\varepsilon = \Delta L / L_0\) (sans unité). Le fichier <span class="code-inline">traction.txt</span> commence par des lignes de commentaire (premier caractère <span class="code-inline">#</span>), puis contient une ligne <span class="code-inline">dL;F</span> par mesure :</p>
<pre class="codeblock"># essai n°17 - alliage d'aluminium
# L0 = 50 mm ; S0 = 20 mm2
# allongement (mm) ; force (N)
0;0
0.025;702
0.05;1395
0.075;2108
0.1;2788
0.125;3497
0.15;4100
0.2;4640
0.25;4880
0.3;5040
0.5;5320
1.0;5620
2.0;5920
3.0;6060
4.0;6100
5.0;5960
5.5;5600</pre>
  <p><strong>Documentation.</strong> Le fichier se lit avec les fonctions de l'annexe : <span class="code-inline">open(nom, 'r')</span>, <span class="code-inline">readlines()</span> (liste des lignes, chacune terminée par <span class="code-inline">'\n'</span>), <span class="code-inline">split(sep)</span>, <span class="code-inline">close()</span> ; <span class="code-inline">open(nom, 'w')</span> et <span class="code-inline">write(s)</span> pour écrire. Pour les tracés, après <span class="code-inline">import matplotlib.pyplot as plt</span> : <span class="code-inline">plt.plot(X, Y)</span> trace la ligne brisée reliant les points \((X[k], Y[k])\), <span class="code-inline">plt.xlabel(s)</span> et <span class="code-inline">plt.ylabel(s)</span> légendent les axes, <span class="code-inline">plt.savefig(nom)</span> enregistre la figure dans un fichier image.</p></div>

  <div class="exo-part">Partie A — Lecture des mesures</div>
  <div class="q"><strong>Q1.</strong> Écrire une fonction <span class="code-inline">lire_essai(nom)</span> qui renvoie le couple <span class="code-inline">(dL, F)</span> des listes de flottants lues dans le fichier, en ignorant les commentaires et les éventuelles lignes vides.</div>
  <div class="q"><strong>Q2.</strong> Écrire une fonction <span class="code-inline">courbe(dL, F, L0, S0)</span> qui renvoie le couple <span class="code-inline">(eps, sig)</span> des listes des déformations et des contraintes.</div>

  <div class="exo-part">Partie B — Caractéristiques du matériau</div>
  <div class="q"><strong>Q3.</strong> La <strong>résistance à la traction</strong> \(R_m\) est la plus grande contrainte atteinte. Écrire une fonction <span class="code-inline">resistance(sig)</span> qui la renvoie.</div>
  <div class="q"><strong>Q4.</strong> Dans le domaine élastique (\(\varepsilon \le 0{,}002\) ici), \(\sigma \approx E\,\varepsilon\), où \(E\) est le module d'Young. La droite des moindres carrés passant par l'origine donne \(E = \dfrac{\sum \varepsilon_k\,\sigma_k}{\sum \varepsilon_k^2}\), les sommes portant sur les mesures du domaine élastique. Écrire une fonction <span class="code-inline">module_young(eps, sig, eps_max)</span>.</div>
  <div class="q"><strong>Q5.</strong> La <strong>limite d'élasticité conventionnelle</strong> \(R_{p0,2}\) est la contrainte au point où la courbe coupe la droite \(\sigma = E\,(\varepsilon - 0{,}002)\). On l'estime par la contrainte de la première mesure située sous cette droite. Écrire une fonction <span class="code-inline">limite_elastique(eps, sig, E)</span>.</div>

  <div class="exo-part">Partie C — Compte rendu</div>
  <div class="q"><strong>Q6.</strong> Écrire une fonction <span class="code-inline">compte_rendu(nom_essai, nom_cr)</span> qui lit l'essai et écrit dans le fichier <span class="code-inline">nom_cr</span> trois lignes <span class="code-inline">E (MPa);…</span>, <span class="code-inline">Rp02 (MPa);…</span> et <span class="code-inline">Rm (MPa);…</span>. Donner les valeurs obtenues pour l'essai ci-dessus.</div>
  <div class="q"><strong>Q7.</strong> Écrire les instructions qui enregistrent dans <span class="code-inline">essai17.png</span> la courbe \(\sigma(\varepsilon)\), avec ses axes légendés.</div>
  <div class="q"><strong>Q8.</strong> Donner la complexité de <span class="code-inline">compte_rendu</span> pour un fichier de \(n\) mesures. Une machine enregistre 1000 mesures par seconde pendant un essai de 3 minutes : le traitement est-il raisonnable ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Une ligne de données se découpe en exactement deux champs ; un commentaire commence par <span class="code-inline">#</span> (et peut contenir des points-virgules), une ligne vide vaut <span class="code-inline">'\n'</span>.</p>
<pre class="codeblock"><span class="kw">def</span> lire_essai(nom):
    f = open(nom, <span class="str">'r'</span>)
    lignes = f.readlines()
    f.close()
    dL, F = [], []
    <span class="kw">for</span> ligne <span class="kw">in</span> lignes:
        champs = ligne.split(<span class="str">';'</span>)
        <span class="kw">if</span> ligne[0] != <span class="str">'#'</span> <span class="kw">and</span> len(champs) == 2:
            dL.append(float(champs[0]))
            F.append(float(champs[1]))
    <span class="kw">return</span> dL, F</pre>
    <p><strong>Q2.</strong></p>
<pre class="codeblock"><span class="kw">def</span> courbe(dL, F, L0, S0):
    eps = [x / L0 <span class="kw">for</span> x <span class="kw">in</span> dL]
    sig = [f / S0 <span class="kw">for</span> f <span class="kw">in</span> F]
    <span class="kw">return</span> eps, sig</pre>
    <p><strong>Q3.</strong> Recherche séquentielle du maximum :</p>
<pre class="codeblock"><span class="kw">def</span> resistance(sig):
    m = sig[0]
    <span class="kw">for</span> s <span class="kw">in</span> sig:
        <span class="kw">if</span> s &gt; m:
            m = s
    <span class="kw">return</span> m</pre>
    <p><strong>Q4.</strong> On accumule les deux sommes sur les seules mesures du domaine élastique :</p>
<pre class="codeblock"><span class="kw">def</span> module_young(eps, sig, eps_max):
    num, den = 0, 0
    <span class="kw">for</span> k <span class="kw">in</span> range(len(eps)):
        <span class="kw">if</span> eps[k] &lt;= eps_max:
            num = num + eps[k] * sig[k]
            den = den + eps[k] ** 2
    <span class="kw">assert</span> den &gt; 0          <span class="cmt"># au moins une mesure non nulle dans le domaine</span>
    <span class="kw">return</span> num / den</pre>
    <p><strong>Q5.</strong> On parcourt les mesures dans l'ordre et l'on s'arrête à la première sous la droite décalée :</p>
<pre class="codeblock"><span class="kw">def</span> limite_elastique(eps, sig, E):
    <span class="kw">for</span> k <span class="kw">in</span> range(len(eps)):
        <span class="kw">if</span> sig[k] &lt; E * (eps[k] - 0.002):
            <span class="kw">return</span> sig[k]
    <span class="kw">return</span> <span class="kw">None</span>             <span class="cmt"># la courbe ne coupe pas la droite</span></pre>
    <p><strong>Q6.</strong></p>
<pre class="codeblock"><span class="kw">def</span> compte_rendu(nom_essai, nom_cr):
    dL, F = lire_essai(nom_essai)
    eps, sig = courbe(dL, F, 50, 20)
    E = module_young(eps, sig, 0.002)
    g = open(nom_cr, <span class="str">'w'</span>)
    g.write(<span class="str">'E (MPa);'</span> + str(E) + <span class="str">'\n'</span>)
    g.write(<span class="str">'Rp02 (MPa);'</span> + str(limite_elastique(eps, sig, E)) + <span class="str">'\n'</span>)
    g.write(<span class="str">'Rm (MPa);'</span> + str(resistance(sig)) + <span class="str">'\n'</span>)
    g.close()

compte_rendu(<span class="str">'traction.txt'</span>, <span class="str">'cr17.txt'</span>)
print(open(<span class="str">'cr17.txt'</span>, <span class="str">'r'</span>).read())</pre>
    <p>On obtient \(E \approx 69\,900\) MPa, soit environ 70 GPa (valeur usuelle pour l'aluminium), \(R_{p0,2} \approx 252\) MPa (mesure à \(\varepsilon = 0{,}006\), la première sous la droite) et \(R_m = 6100/20 = 305\) MPa.</p>
    <p><strong>Q7.</strong></p>
<pre class="codeblock"><span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt

dL, F = lire_essai(<span class="str">'traction.txt'</span>)
eps, sig = courbe(dL, F, 50, 20)
plt.plot(eps, sig)
plt.xlabel(<span class="str">'deformation'</span>)
plt.ylabel(<span class="str">'contrainte (MPa)'</span>)
plt.savefig(<span class="str">'essai17.png'</span>)</pre>
    <p><strong>Q8.</strong> La lecture est linéaire en la taille du fichier, et chacune des fonctions de la partie B fait un parcours : le coût est \(O(n)\). Trois minutes à 1000 mesures par seconde donnent \(n = 180\,000\) lignes, soit quelques millions d'opérations élémentaires : moins d'une seconde en Python, c'est raisonnable.</p>
