  <div class="sec-num">AU PROGRAMME · INFORMATIQUE</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre pose les bases du langage Python, outil de tout le programme d'informatique commune : valeurs et types, variables, opérations, comparaisons, booléens, affichage. Le premier semestre de 1ʳᵉ année « consolide l'apprentissage de la programmation en Python entrepris au lycée » ; l'annexe du programme fixe la liste <strong>limitative</strong> des éléments du langage exigibles. Les conditions et les boucles font l'objet du chapitre suivant, « Conditions &amp; boucles ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les éléments exigibles de l'annexe « Langage Python » traités ici (1ᵉʳ semestre)</span>
    <div class="content">
      <ul>
        <li><strong>Mise en place d'un environnement de travail</strong> : console et script, commentaires introduits par <span class="code-inline">#</span> (§1).</li>
        <li><strong>Instruction d'affectation</strong> avec <span class="code-inline">=</span> ; <strong>dépaquetage de tuples</strong> (<span class="code-inline">a, b = b, a</span>) (§2).</li>
        <li><strong>Typage dynamique</strong> : l'interpréteur détermine le type à la volée, lors de l'exécution (§3).</li>
        <li><strong>Opérations sur les entiers</strong> (<span class="code-inline">int</span>) : <span class="code-inline">+</span>, <span class="code-inline">-</span>, <span class="code-inline">*</span>, <span class="code-inline">//</span>, <span class="code-inline">**</span>, <span class="code-inline">%</span> avec des opérandes positifs ; <strong>sur les flottants</strong> (<span class="code-inline">float</span>) : <span class="code-inline">+</span>, <span class="code-inline">-</span>, <span class="code-inline">*</span>, <span class="code-inline">/</span>, <span class="code-inline">**</span> (§4).</li>

        <li><strong>Opérations sur les booléens</strong> (<span class="code-inline">bool</span>) : <span class="code-inline">not</span>, <span class="code-inline">or</span>, <span class="code-inline">and</span> (§6) <strong>et leur caractère paresseux</strong> (§7).</li>

<div class="course-section">
  <div class="sec-num">§1 · ÉCRIRE ET EXÉCUTER DU PYTHON</div>
  <h2>Console, script et commentaires</h2>
  <div class="intro">Un programme Python est une suite d'<strong>instructions</strong> exécutées l'une après l'autre, de haut en bas. On les tape soit dans la <strong>console</strong> (l'interpréteur interactif, pour essayer), soit dans un <strong>script</strong> (un fichier <span class="code-inline">.py</span> exécuté d'un bloc, pour écrire un vrai programme).</div>

  <h3>La console : essayer une expression</h3>
  <p>Dans la console, l'invite <span class="code-inline">&gt;&gt;&gt;</span> attend une ligne. Si c'est une <strong>expression</strong> (un calcul qui a une valeur), la console affiche cette valeur ; si c'est une instruction comme une affectation, elle l'exécute sans rien afficher.</p>
  <pre class="codeblock">&gt;&gt;&gt; 2 + 3 * 4
14
&gt;&gt;&gt; 7 / 2
3.5
&gt;&gt;&gt; x = 10       <span class="cmt"># une affectation n'affiche rien</span>
&gt;&gt;&gt; x * 2
20</pre>
  <p>Dans tout le site, une ligne qui commence par <span class="code-inline">&gt;&gt;&gt;</span> est tapée dans la console, et la ligne suivante, sans invite, est la réponse de Python.</p>

  <h3>Le script : un programme complet</h3>
  <p>Un script s'exécute en entier, sans rien afficher d'autre que ce qu'on demande avec <span class="code-inline">print</span> (§8). Tout ce qui suit un <span class="code-inline">#</span> sur une ligne est un <strong>commentaire</strong> : Python l'ignore, il sert au lecteur.</p>
  <pre class="codeblock"><span class="cmt"># Conversion d'une température (cette ligne est un commentaire)</span>
celsius = 21.5
fahrenheit = celsius * 9 / 5 + 32
print(fahrenheit)        <span class="cmt"># affiche 70.7</span></pre>

  <div class="def-box">Une <strong>expression</strong> est un morceau de code qui a une valeur : <span class="code-inline">celsius * 9 / 5 + 32</span>, <span class="code-inline">x &gt; 3</span>. Une <strong>instruction</strong> est exécutée pour son effet : affecter une variable, afficher, répéter… Cette distinction est approfondie dans le chapitre « Spécification, correction et complexité » (§1).</div>

  <div class="notice"><strong>Erreur classique</strong> : dans un script, une expression seule sur une ligne (<span class="code-inline">fahrenheit * 2</span>) est calculée puis oubliée ; seule la console affiche les valeurs d'elle-même. Pour voir un résultat dans un script, il faut <span class="code-inline">print</span>.</div>

  <h3>Lire un message d'erreur</h3>
  <p>Une <strong>erreur de syntaxe</strong> (deux-points oublié, parenthèse non fermée) est détectée avant l'exécution : rien ne s'exécute. Une <strong>erreur d'exécution</strong> arrête le programme à la ligne fautive ; les lignes précédentes ont déjà été exécutées. La dernière ligne du message donne le type d'erreur et sa cause :</p>
  <pre class="codeblock">&gt;&gt;&gt; 10 / 0
Traceback (most recent call last):
  ...
ZeroDivisionError: division by zero
&gt;&gt;&gt; prix * 2
Traceback (most recent call last):
  ...
NameError: name <span class="str">'prix'</span> <span class="kw">is</span> <span class="kw">not</span> defined</pre>
  <div class="method-box"><strong>Exemple — que fait ce script ?</strong>
    <pre class="codeblock">a = 5
print(a + 1)
print(a + b)
print(<span class="str">"fin"</span>)</pre>
    <ol>
      <li>Ligne 1 : <span class="code-inline">a</span> désigne 5. Ligne 2 : affichage de <span class="code-inline">6</span>.</li>
      <li>Ligne 3 : la variable <span class="code-inline">b</span> n'existe pas ; Python s'arrête sur <span class="code-inline">NameError: name 'b' is not defined</span>.</li>
      <li>La ligne 4 n'est jamais exécutée : le script affiche seulement <span class="code-inline">6</span>, puis le message d'erreur.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · VARIABLES ET AFFECTATION</div>
  <h2>Donner un nom à une valeur</h2>
  <div class="intro">Une variable permet de garder une valeur pour s'en resservir. Comprendre précisément ce que fait l'affectation, et dans quel ordre, suffit à prévoir le comportement de la plupart des programmes.</div>

  <div class="def-box">Une <strong>variable</strong> est un nom associé à une valeur. L'<strong>affectation</strong> <span class="code-inline">nom = expression</span> s'exécute en deux temps : <strong>1)</strong> Python calcule la valeur de l'expression de droite ; <strong>2)</strong> le nom de gauche désigne désormais cette valeur (l'ancienne association est oubliée).</div>
  <p>C'est pourquoi <span class="code-inline">n = n + 3</span> a un sens : on calcule d'abord <span class="code-inline">n + 3</span> avec l'ancienne valeur de <span class="code-inline">n</span>, puis <span class="code-inline">n</span> désigne le résultat. Le signe <span class="code-inline">=</span> n'est pas une égalité mathématique : <span class="code-inline">n = n + 3</span> serait une équation sans solution.</p>
  <pre class="codeblock">&gt;&gt;&gt; n = 4
&gt;&gt;&gt; n = n + 3      <span class="cmt"># à droite : 4 + 3 vaut 7 ; puis n désigne 7</span>
&gt;&gt;&gt; n
7
&gt;&gt;&gt; m = n          <span class="cmt"># m désigne la même valeur que n</span>
&gt;&gt;&gt; n = 0
&gt;&gt;&gt; m              <span class="cmt"># réaffecter n ne change pas m</span>
7</pre>

  <h3>Noms de variables</h3>
  <ul>
    <li>Lettres, chiffres et tiret bas <span class="code-inline">_</span>, sans commencer par un chiffre : <span class="code-inline">note_max</span>, <span class="code-inline">x2</span>, <span class="code-inline">nb_eleves</span> (mais pas <span class="code-inline">2x</span>).</li>
    <li>Majuscules et minuscules sont distinguées : <span class="code-inline">Total</span> et <span class="code-inline">total</span> sont deux variables différentes.</li>
    <li>Les mots réservés du langage (<span class="code-inline">if</span>, <span class="code-inline">for</span>, <span class="code-inline">in</span>, <span class="code-inline">and</span>, <span class="code-inline">True</span>, <span class="code-inline">def</span>…) sont interdits.</li>
    <li>Un nom explicite (<span class="code-inline">prix_ht</span>, <span class="code-inline">vitesse</span>) vaut mieux qu'un commentaire : le code se relit seul.</li>
  </ul>

  <div class="method-box"><strong>Exemple — dérouler un programme à la main</strong>
    <p>Que valent <span class="code-inline">a</span> et <span class="code-inline">b</span> à la fin ?</p>
    <pre class="codeblock">a = 3
b = 5
a = a + b
b = a - b
a = a - b</pre>
    <p>On note l'état des variables après chaque ligne (tableau d'états, ou « trace ») :</p>
    <div><table>
<tr><th>ligne</th><th>instruction</th><th><span class="code-inline">a</span> après</th><th><span class="code-inline">b</span> après</th></tr>
<tr><td>1</td><td><span class="code-inline">a = 3</span></td><td>3</td><td>—</td></tr>
<tr><td>2</td><td><span class="code-inline">b = 5</span></td><td>3</td><td>5</td></tr>
<tr><td>3</td><td><span class="code-inline">a = a + b</span></td><td>8</td><td>5</td></tr>
<tr><td>4</td><td><span class="code-inline">b = a - b</span></td><td>8</td><td>3</td></tr>
<tr><td>5</td><td><span class="code-inline">a = a - b</span></td><td>5</td><td>3</td></tr>
</table></div>
    <p>Les valeurs ont été échangées. L'astuce marche pour des nombres, mais elle est peu lisible : on préfère les deux écritures ci-dessous.</p>
  </div>

  <h3>Échanger deux valeurs, dépaquetage</h3>
  <p>La tentative naïve perd une valeur :</p>
  <pre class="codeblock">a = 3
b = 5
a = b            <span class="cmt"># a vaut 5 : l'ancienne valeur 3 est perdue</span>
b = a            <span class="cmt"># b vaut 5 aussi</span></pre>
  <p>Deux écritures justes : passer par une variable auxiliaire, ou utiliser l'<strong>affectation simultanée</strong>, qui évalue <em>tout</em> le membre de droite (le tuple <span class="code-inline">(d, c)</span>, ici <span class="code-inline">(5, 3)</span>) avant de répartir ses valeurs entre les noms de gauche ; on parle de <strong>dépaquetage</strong> du tuple.</p>
  <pre class="codeblock"><span class="cmt"># avec une variable auxiliaire</span>
a, b = 3, 5
aux = a
a = b
b = aux
<span class="cmt"># par affectation simultanée (dépaquetage d'un tuple)</span>
c, d = 3, 5
c, d = d, c</pre>
  <pre class="codeblock">&gt;&gt;&gt; q, r = 17 // 5, 17 % 5
&gt;&gt;&gt; q, r
(3, 2)
&gt;&gt;&gt; a, b = 1, 2, 3
Traceback (most recent call last):
  ...
ValueError: too many values to unpack (expected 2)</pre>

  <h3>Affectations abrégées</h3>
  <pre class="codeblock">x = 10
x += 5           <span class="cmt"># même effet que x = x + 5 : x vaut 15</span>
x *= 2           <span class="cmt"># x = x * 2 : x vaut 30</span>
x -= 1           <span class="cmt"># x = x - 1 : x vaut 29</span></pre>
  <p>Ces écritures, très répandues, ne figurent pas dans l'annexe du programme : <span class="code-inline">x = x + 5</span> est toujours accepté et a le même effet sur un nombre.</p>

  <div class="notice"><strong>Erreurs classiques</strong> : confondre <span class="code-inline">=</span> (affecter) et <span class="code-inline">==</span> (comparer, §5) ; écrire <span class="code-inline">5 = x</span> (erreur de syntaxe : à gauche, il faut un nom) ; utiliser une variable avant de l'avoir affectée (<span class="code-inline">NameError</span>).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TYPES DE BASE ET TYPAGE DYNAMIQUE</div>
  <h2>Entiers, flottants, booléens, chaînes</h2>
  <div class="intro">Chaque valeur a un <strong>type</strong>, qui décide des opérations possibles et de leur résultat : <span class="code-inline">7 / 2</span> et <span class="code-inline">"7" * 2</span> n'ont rien à voir. Quatre types suffisent pour commencer.</div>

  <div class="def-box">Les quatre <strong>types de base</strong> :
    <ul>
      <li><span class="code-inline">int</span> : les entiers, <span class="code-inline">-3</span>, <span class="code-inline">0</span>, <span class="code-inline">2026</span> ; leur taille n'est limitée que par la mémoire ;</li>
      <li><span class="code-inline">float</span> : les nombres à virgule flottante, écrits avec un <strong>point</strong> : <span class="code-inline">3.14</span>, <span class="code-inline">2.0</span>, <span class="code-inline">1e-3</span> (soit \(10^{-3}\)), <span class="code-inline">6.02e23</span> ; ce sont des <strong>valeurs approchées</strong> (environ 16 chiffres significatifs) ;</li>
      <li><span class="code-inline">bool</span> : les booléens, deux valeurs <span class="code-inline">True</span> (vrai) et <span class="code-inline">False</span> (faux) ;</li>
      <li><span class="code-inline">str</span> : les chaînes de caractères, entre guillemets <span class="code-inline">"PTSI"</span> ou apostrophes <span class="code-inline">'PTSI'</span> ; <span class="code-inline">""</span> est la chaîne vide.</li>
    </ul>
    <span class="code-inline">2</span>, <span class="code-inline">2.0</span> et <span class="code-inline">"2"</span> sont trois valeurs de types différents.
  </div>

  <div class="prop-box"><strong>Typage dynamique.</strong> En Python, le type appartient à la <strong>valeur</strong>, pas au nom : on ne déclare pas le type d'une variable, l'interpréteur le détermine à la volée, pendant l'exécution. Un même nom peut désigner successivement un entier puis une chaîne, et une opération impossible n'est détectée qu'au moment où sa ligne s'exécute.</div>
  <pre class="codeblock">&gt;&gt;&gt; type(7), type(7.0), type(<span class="str">"7"</span>), type(7 &gt; 3)
(&lt;<span class="kw">class</span> <span class="str">'int'</span>&gt;, &lt;<span class="kw">class</span> <span class="str">'float'</span>&gt;, &lt;<span class="kw">class</span> <span class="str">'str'</span>&gt;, &lt;<span class="kw">class</span> <span class="str">'bool'</span>&gt;)
&gt;&gt;&gt; x = 12
&gt;&gt;&gt; x = <span class="str">"douze"</span>    <span class="cmt"># permis : x désigne maintenant une chaîne</span>
&gt;&gt;&gt; x + 1
Traceback (most recent call last):
  ...
TypeError: can only concatenate str (<span class="kw">not</span> <span class="str">"int"</span>) to str</pre>
  <p>La fonction <span class="code-inline">type</span> (hors annexe) sert à explorer dans la console ; aucun sujet ne demande de l'utiliser.</p>

  <h3>Entiers exacts, flottants approchés</h3>
  <pre class="codeblock">&gt;&gt;&gt; 2 ** 100                 <span class="cmt"># entier exact, aussi grand que nécessaire</span>
1267650600228229401496703205376
&gt;&gt;&gt; 2.0 ** 100               <span class="cmt"># flottant : environ 16 chiffres significatifs</span>
1.2676506002282294e+30
&gt;&gt;&gt; 1e-3, 6.02e23            <span class="cmt"># notation scientifique des flottants</span>
(0.001, 6.02e+23)</pre>
  <p>Les entiers de Python sont <strong>exacts</strong> et de taille arbitraire ; les flottants sont des approximations, codés sur un nombre fixe de bits : leurs calculs comportent des erreurs d'arrondi (§5). La façon dont ces nombres sont représentés en machine est l'objet du chapitre « Représentation des nombres ».</p>

  <div class="method-box"><strong>Exemple — prévoir le type et la valeur</strong>
    <p>Règle : une opération entre deux <span class="code-inline">int</span> donne un <span class="code-inline">int</span>, sauf la division <span class="code-inline">/</span> qui donne toujours un <span class="code-inline">float</span> ; dès qu'un opérande est un <span class="code-inline">float</span>, le résultat est un <span class="code-inline">float</span> ; une comparaison donne un <span class="code-inline">bool</span>.</p>
    <div><table>
<tr><th>expression</th><th>type</th><th>valeur</th></tr>
<tr><td><span class="code-inline">7 + 2</span></td><td><span class="code-inline">int</span></td><td><span class="code-inline">9</span></td></tr>
<tr><td><span class="code-inline">7 + 2.0</span></td><td><span class="code-inline">float</span></td><td><span class="code-inline">9.0</span></td></tr>
<tr><td><span class="code-inline">7 / 7</span></td><td><span class="code-inline">float</span></td><td><span class="code-inline">1.0</span></td></tr>
<tr><td><span class="code-inline">7 // 2</span></td><td><span class="code-inline">int</span></td><td><span class="code-inline">3</span></td></tr>
<tr><td><span class="code-inline">7 % 2</span></td><td><span class="code-inline">int</span></td><td><span class="code-inline">1</span></td></tr>
<tr><td><span class="code-inline">2 ** 3</span></td><td><span class="code-inline">int</span></td><td><span class="code-inline">8</span></td></tr>
<tr><td><span class="code-inline">2 ** 0.5</span></td><td><span class="code-inline">float</span></td><td><span class="code-inline">1.4142135623730951</span></td></tr>
<tr><td><span class="code-inline">4 ** 0.5</span></td><td><span class="code-inline">float</span></td><td><span class="code-inline">2.0</span></td></tr>
<tr><td><span class="code-inline">3 * 1.5</span></td><td><span class="code-inline">float</span></td><td><span class="code-inline">4.5</span></td></tr>
<tr><td><span class="code-inline">"7" + "2"</span></td><td><span class="code-inline">str</span></td><td><span class="code-inline">'72'</span></td></tr>
<tr><td><span class="code-inline">7 &gt; 2</span></td><td><span class="code-inline">bool</span></td><td><span class="code-inline">True</span></td></tr>
</table></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · OPÉRATIONS SUR LES NOMBRES</div>
  <h2>Les opérateurs arithmétiques</h2>
  <div class="intro">Aux quatre opérations s'ajoutent trois opérateurs propres à l'informatique : le quotient et le reste de la division euclidienne, et la puissance. Le quotient et le reste servent sans cesse : parité, chiffres d'un nombre, conversions d'unités, calculs « cycliques ».</div>

  <div class="def-box">
    <ul>
      <li><span class="code-inline">+</span>, <span class="code-inline">-</span>, <span class="code-inline">*</span> : somme, différence, produit ;</li>
      <li><span class="code-inline">/</span> : division <strong>flottante</strong> ; le résultat est toujours un <span class="code-inline">float</span>, même quand la division tombe juste ;</li>
      <li><span class="code-inline">a // b</span> : <strong>quotient</strong> de la division euclidienne de <span class="code-inline">a</span> par <span class="code-inline">b</span> ;</li>
      <li><span class="code-inline">a % b</span> : <strong>reste</strong> de cette division (« <span class="code-inline">a</span> modulo <span class="code-inline">b</span> ») ;</li>
      <li><span class="code-inline">a ** b</span> : <span class="code-inline">a</span> puissance <span class="code-inline">b</span>.</li>
    </ul>
  </div>
  <div class="prop-box"><strong>Division euclidienne.</strong> Pour des entiers \(a \ge 0\) et \(b \gt 0\), \(q\) = <span class="code-inline">a // b</span> et \(r\) = <span class="code-inline">a % b</span> sont les uniques entiers tels que
    <div class="formula" data-nom="Quotient et reste">$$a = b\,q + r \qquad\text{avec}\qquad 0 \le r \lt b.$$</div>
    En particulier <span class="code-inline">a % b == 0</span> signifie que <span class="code-inline">b</span> divise <span class="code-inline">a</span>. Le programme se limite aux <strong>opérandes positifs</strong> ; diviser par zéro (<span class="code-inline">/</span>, <span class="code-inline">//</span> ou <span class="code-inline">%</span>) provoque une erreur <span class="code-inline">ZeroDivisionError</span>.</div>
  <pre class="codeblock">&gt;&gt;&gt; 17 / 5, 17 // 5, 17 % 5
(3.4, 3, 2)
&gt;&gt;&gt; 5 * (17 // 5) + 17 % 5     <span class="cmt"># on retrouve 17</span>
17
&gt;&gt;&gt; 2 ** 10, 2 ** 0.5, 10 ** -2
(1024, 1.4142135623730951, 0.01)
&gt;&gt;&gt; 10 / 2, 10 // 2
(5.0, 5)</pre>

  <h3>Priorités</h3>
  <div class="prop-box"><strong>Ordre d'évaluation.</strong> Du plus prioritaire au moins prioritaire :
    <ol>
      <li>les parenthèses ;</li>
      <li><span class="code-inline">**</span>, groupé <strong>de droite à gauche</strong> : <span class="code-inline">2 ** 3 ** 2</span> vaut <span class="code-inline">2 ** 9</span> ;</li>
      <li>le signe moins devant un nombre : <span class="code-inline">-2 ** 2</span> vaut <span class="code-inline">-(2 ** 2)</span>, soit <span class="code-inline">-4</span> ;</li>
      <li><span class="code-inline">*</span>, <span class="code-inline">/</span>, <span class="code-inline">//</span>, <span class="code-inline">%</span>, groupés de gauche à droite ;</li>
      <li><span class="code-inline">+</span>, <span class="code-inline">-</span>, de gauche à droite ;</li>
      <li>puis les comparaisons (§5), <span class="code-inline">not</span>, <span class="code-inline">and</span> et enfin <span class="code-inline">or</span> (§6).</li>
    </ol>
    Dans le doute, on met des parenthèses : elles ne coûtent rien et rendent l'intention claire.
  </div>
  <pre class="codeblock">&gt;&gt;&gt; 2 + 3 * 4 ** 2       <span class="cmt"># 4 ** 2 d'abord, puis 3 * 16, puis 2 + 48</span>
50
&gt;&gt;&gt; 2 ** 3 ** 2          <span class="cmt"># de droite à gauche : 2 ** 9</span>
512
&gt;&gt;&gt; -2 ** 2              <span class="cmt"># - (2 ** 2)</span>
-4
&gt;&gt;&gt; 7 // 2 * 2           <span class="cmt"># de gauche à droite : (7 // 2) * 2</span>
6
&gt;&gt;&gt; 20 / 4 / 2           <span class="cmt"># (20 / 4) / 2</span>
2.5</pre>
  <figure class="schema" style="max-width:420px">

</figure>

  <div class="method-box"><strong>Exemple — convertir une durée</strong>
    <p>Combien d'heures, minutes et secondes dans 10 000 secondes ?</p>
    <pre class="codeblock">duree = 10000                <span class="cmt"># durée en secondes</span>
h = duree // 3600            <span class="cmt"># heures complètes</span>
reste = duree % 3600         <span class="cmt"># secondes restantes</span>
m = reste // 60              <span class="cmt"># minutes complètes</span>
s = reste % 60               <span class="cmt"># secondes restantes</span>
print(h, m, s)               <span class="cmt"># affiche 2 46 40</span></pre>
    <ol>
      <li><span class="code-inline">10000 // 3600</span> vaut 2 : deux heures complètes ; il reste <span class="code-inline">10000 % 3600</span>, soit 2 800 secondes.</li>
      <li><span class="code-inline">2800 // 60</span> vaut 46 minutes, et il reste <span class="code-inline">2800 % 60</span>, soit 40 secondes.</li>
      <li>Vérification par la division euclidienne : \(2\times 3600 + 46\times 60 + 40 = 10\,000\).</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — les chiffres d'un entier</strong>
    <p>En base 10, <span class="code-inline">n % 10</span> est le chiffre des unités et <span class="code-inline">n // 10</span> l'entier privé de ce chiffre. Le chiffre de rang \(k\) (unités : \(k = 0\)) est donc <span class="code-inline">(n // 10 ** k) % 10</span>.</p>
    <pre class="codeblock">n = 2026
u = n % 10                   <span class="cmt"># unités : 6</span>
d = (n // 10) % 10           <span class="cmt"># dizaines : 2</span>
c = (n // 100) % 10          <span class="cmt"># centaines : 0</span>
m = n // 1000                <span class="cmt"># milliers : 2</span></pre>
    <p>Pour un entier de longueur quelconque, on répète ces deux opérations dans une boucle (chapitre « Conditions &amp; boucles », §5).</p>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : <span class="code-inline">^</span> n'est pas la puissance (c'est une opération sur les bits, hors programme) et ne provoque aucune erreur, d'où des résultats faux silencieux ; écrire <span class="code-inline">a / b</span> quand on veut un entier (<span class="code-inline">10 / 2</span> vaut <span class="code-inline">5.0</span>, un flottant, qui ne peut pas servir d'indice) ; oublier des parenthèses : <span class="code-inline">n // 10 % 10</span> se lit <span class="code-inline">(n // 10) % 10</span>, ce qui est bien voulu ici, mais <span class="code-inline">1 / 2 * x</span> vaut \(\dfrac{x}{2}\) et non \(\dfrac{1}{2x}\).</div>
  <pre class="codeblock">&gt;&gt;&gt; 2 ^ 3        <span class="cmt"># ce n'est PAS une puissance</span>
1
&gt;&gt;&gt; 2 ** 3
8</pre>
</div>

<div class="course-section">
  <div class="sec-num">§5 · COMPARAISONS</div>
  <h2>Comparer deux valeurs</h2>
  <div class="intro">Une comparaison est une expression dont la valeur est un booléen. Elle sert dans les conditions (<span class="code-inline">if</span>, <span class="code-inline">while</span>) et peut aussi être rangée dans une variable.</div>

  <div class="def-box">Les six opérateurs de comparaison : <span class="code-inline">==</span> (égal), <span class="code-inline">!=</span> (différent), <span class="code-inline">&lt;</span>, <span class="code-inline">&gt;</span>, <span class="code-inline">&lt;=</span> (inférieur ou égal), <span class="code-inline">&gt;=</span>. Leur résultat est <span class="code-inline">True</span> ou <span class="code-inline">False</span>. On peut comparer un <span class="code-inline">int</span> et un <span class="code-inline">float</span> (<span class="code-inline">3 == 3.0</span> est vrai) ; deux chaînes se comparent dans l'<strong>ordre lexicographique</strong> (celui du dictionnaire), caractère par caractère.</div>
  <pre class="codeblock">&gt;&gt;&gt; 3 &lt; 5, 3 == 3.0, 3 != 3
(<span class="kw">True</span>, <span class="kw">True</span>, <span class="kw">False</span>)
&gt;&gt;&gt; x = 7
&gt;&gt;&gt; 0 &lt;= x &lt; 10        <span class="cmt"># comme 0 &lt;= x and x &lt; 10</span>
<span class="kw">True</span>
&gt;&gt;&gt; <span class="str">"chat"</span> &lt; <span class="str">"chien"</span>, <span class="str">"chat"</span> &lt; <span class="str">"chaton"</span>
(<span class="kw">True</span>, <span class="kw">True</span>)
&gt;&gt;&gt; <span class="str">"10"</span> &lt; <span class="str">"9"</span>, <span class="str">"Zoé"</span> &lt; <span class="str">"ane"</span>
(<span class="kw">True</span>, <span class="kw">True</span>)</pre>
  <p>Python accepte l'enchaînement <span class="code-inline">0 &lt;= x &lt; 10</span>, qui signifie <span class="code-inline">0 &lt;= x and x &lt; 10</span>. Pour les chaînes, <span class="code-inline">"chat" &lt; "chien"</span> car les deux premiers caractères sont égaux et <span class="code-inline">"a"</span> précède <span class="code-inline">"i"</span> ; <span class="code-inline">"chat" &lt; "chaton"</span> car un début de mot vient avant le mot plus long. Mais l'ordre des caractères est celui de leur code : <strong>toutes les majuscules précèdent les minuscules</strong> (<span class="code-inline">"Zoé" &lt; "ane"</span>), et <span class="code-inline">"10" &lt; "9"</span> car on compare d'abord <span class="code-inline">"1"</span> et <span class="code-inline">"9"</span> : des nombres écrits en chaînes ne se comparent pas comme des nombres.</p>

  <h3>Flottants : jamais d'égalité stricte</h3>
  <p>Les flottants étant approchés, deux calculs mathématiquement égaux peuvent différer au dernier chiffre :</p>
  <pre class="codeblock">&gt;&gt;&gt; 0.1 + 0.2 == 0.3
<span class="kw">False</span>
&gt;&gt;&gt; 0.1 + 0.2
0.30000000000000004
&gt;&gt;&gt; abs((0.1 + 0.2) - 0.3) &lt; 1e-9
<span class="kw">True</span></pre>
  <div class="prop-box"><strong>Comparer deux flottants.</strong> On ne teste pas <span class="code-inline">x == y</span> mais \(|x - y| \lt \varepsilon\), avec une tolérance \(\varepsilon\) adaptée à l'ordre de grandeur des valeurs (par exemple \(10^{-9}\) pour des nombres de l'ordre de 1) : en Python <span class="code-inline">abs(x - y) &lt; 1e-9</span>, où <span class="code-inline">abs</span> est la valeur absolue. Le chapitre « Représentation des nombres » explique l'origine de ces écarts.</div>

  <div class="notice"><strong>Erreur classique</strong> : écrire <span class="code-inline">if x = 3:</span> au lieu de <span class="code-inline">if x == 3:</span>. En Python, l'affectation est une instruction, pas une expression : cette ligne est refusée (erreur de syntaxe), ce qui évite au moins une confusion silencieuse.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · BOOLÉENS : NOT, AND, OR</div>
  <h2>Combiner des conditions</h2>
  <div class="intro">Les conditions réelles combinent plusieurs comparaisons : « l'année est divisible par 4 <em>et</em> pas par 100, <em>ou</em> divisible par 400 ». Trois opérateurs suffisent.</div>

  <div class="def-box">Pour deux booléens <span class="code-inline">a</span> et <span class="code-inline">b</span> : <span class="code-inline">not a</span> est vrai si et seulement si <span class="code-inline">a</span> est faux ; <span class="code-inline">a and b</span> est vrai si et seulement si <span class="code-inline">a</span> <strong>et</strong> <span class="code-inline">b</span> sont vrais ; <span class="code-inline">a or b</span> est vrai si et seulement si <strong>au moins un</strong> des deux est vrai (« ou » inclusif).
    <div><table>
<tr><th><span class="code-inline">a</span></th><th><span class="code-inline">b</span></th><th><span class="code-inline">not a</span></th><th><span class="code-inline">a and b</span></th><th><span class="code-inline">a or b</span></th></tr>
<tr><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td></tr>
<tr><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td></tr>
<tr><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td></tr>
<tr><td><span class="code-inline">True</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">True</span></td></tr>
</table></div>
  </div>
  <p>Priorités : les comparaisons d'abord, puis <span class="code-inline">not</span>, puis <span class="code-inline">and</span>, puis <span class="code-inline">or</span>. Ainsi <span class="code-inline">not a or b and c</span> se lit <span class="code-inline">(not a) or (b and c)</span>. Un booléen est une valeur comme une autre : on peut le ranger dans une variable ou le renvoyer.</p>
  <pre class="codeblock">&gt;&gt;&gt; a, b = <span class="kw">True</span>, <span class="kw">False</span>
&gt;&gt;&gt; <span class="kw">not</span> a, a <span class="kw">and</span> b, a <span class="kw">or</span> b
(<span class="kw">False</span>, <span class="kw">False</span>, <span class="kw">True</span>)
&gt;&gt;&gt; n = 12
&gt;&gt;&gt; pair = n % 2 == 0        <span class="cmt"># un booléen se range dans une variable</span>
&gt;&gt;&gt; pair
<span class="kw">True</span>
&gt;&gt;&gt; <span class="kw">not</span> pair <span class="kw">or</span> n &gt; 10       <span class="cmt"># (not pair) or (n &gt; 10)</span>
<span class="kw">True</span></pre>

  <div class="prop-box"><strong>Lois de De Morgan.</strong> <span class="code-inline">not (a and b)</span> a la même valeur que <span class="code-inline">not a or not b</span> ; <span class="code-inline">not (a or b)</span> a la même valeur que <span class="code-inline">not a and not b</span>. Elles servent à écrire la <strong>négation</strong> d'une condition, par exemple la condition de sortie d'une boucle.</div>
  <pre class="codeblock">&gt;&gt;&gt; x = 12
&gt;&gt;&gt; <span class="kw">not</span> (0 &lt;= x <span class="kw">and</span> x &lt;= 10)
<span class="kw">True</span>
&gt;&gt;&gt; x &lt; 0 <span class="kw">or</span> x &gt; 10          <span class="cmt"># la même condition, réécrite</span>
<span class="kw">True</span></pre>

  <div class="method-box"><strong>Exemple — l'année bissextile</strong>
    <p>Une année est bissextile si elle est divisible par 4 sans l'être par 100, ou si elle est divisible par 400.</p>
    <pre class="codeblock">annee = 1900
bissextile = (annee % 4 == 0 <span class="kw">and</span> annee % 100 != 0) <span class="kw">or</span> annee % 400 == 0
print(bissextile)            <span class="cmt"># affiche False</span></pre>
    <div><table>
<tr><th><span class="code-inline">annee</span></th><th><span class="code-inline">annee % 4 == 0</span></th><th><span class="code-inline">annee % 100 != 0</span></th><th><span class="code-inline">annee % 400 == 0</span></th><th><span class="code-inline">bissextile</span></th></tr>
<tr><td>1900</td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td></tr>
<tr><td>2000</td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">True</span></td></tr>
<tr><td>2024</td><td><span class="code-inline">True</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td></tr>
<tr><td>2026</td><td><span class="code-inline">False</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">False</span></td></tr>
</table></div>
    <p>Les parenthèses ne sont pas indispensables (<span class="code-inline">and</span> passe avant <span class="code-inline">or</span>), mais elles reflètent la phrase et évitent l'erreur de lecture.</p>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : écrire <span class="code-inline">x == 1 or 2</span> pour « <span class="code-inline">x</span> vaut 1 ou 2 » : Python lit <span class="code-inline">(x == 1) or 2</span>, accepte un opérande qui n'est pas booléen et la condition est toujours considérée comme vraie ; il faut <span class="code-inline">x == 1 or x == 2</span>. Écrire <span class="code-inline">pair == True</span> : <span class="code-inline">pair</span> suffit, et <span class="code-inline">pair == False</span> s'écrit <span class="code-inline">not pair</span>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉVALUATION PARESSEUSE</div>
  <h2>And et or ne calculent que le nécessaire</h2>
  <div class="intro">Python évalue les opérandes de <span class="code-inline">and</span> et <span class="code-inline">or</span> de gauche à droite, et s'arrête dès que le résultat est connu. Ce comportement, exigible, permet d'écrire des conditions sûres : le second test n'est fait que si le premier l'autorise.</div>

  <div class="prop-box"><strong>Caractère paresseux.</strong> Pour évaluer <span class="code-inline">a and b</span>, Python évalue <span class="code-inline">a</span> ; si <span class="code-inline">a</span> est faux, le résultat est <span class="code-inline">False</span> et <span class="code-inline">b</span> <strong>n'est pas évalué</strong>. Pour <span class="code-inline">a or b</span>, si <span class="code-inline">a</span> est vrai, le résultat est <span class="code-inline">True</span> et <span class="code-inline">b</span> n'est pas évalué. Dans les autres cas, le résultat est la valeur de <span class="code-inline">b</span>.</div>
  <figure class="schema" style="max-width:420px">
<svg viewBox="0 0 360 194" role="img" aria-label="Évaluation paresseuse : pour a and b, si a est faux le résultat est False sans évaluer b ; pour a or b, si a est vrai le résultat est True sans évaluer b ; sinon le résultat est la valeur de b">
<text x="90" y="16" class="lab-b" text-anchor="middle" style="font-size:14px;font-family:var(--font-code);font-variant-ligatures:none">a and b</text>

<figcaption>Évaluation paresseuse. Dans <span class="code-inline">a and b</span>, si <span class="code-inline">a</span> est faux, le résultat <span class="code-inline">False</span> est connu : <span class="code-inline">b</span> n'est pas évalué. Dans <span class="code-inline">a or b</span>, c'est quand <span class="code-inline">a</span> est vrai que <span class="code-inline">b</span> est ignoré. Sinon, le résultat est la valeur de <span class="code-inline">b</span>.</figcaption>
</figure>

  <div class="method-box"><strong>Exemple — voir ce qui est évalué</strong>
    <p>La fonction <span class="code-inline">temoin</span> (une fonction se définit avec <span class="code-inline">def</span> et renvoie son résultat avec <span class="code-inline">return</span> : chapitre « Fonctions ») affiche un message quand elle est appelée, puis renvoie le booléen reçu :</p>
    <pre class="codeblock"><span class="kw">def</span> temoin(nom, valeur):
    <span class="str">"""Affiche nom (pour voir que l'opérande est évalué), renvoie valeur."""</span>
    print(<span class="str">"évalué :"</span>, nom)
    <span class="kw">return</span> valeur</pre>
    <pre class="codeblock">&gt;&gt;&gt; temoin(<span class="str">"A"</span>, <span class="kw">False</span>) <span class="kw">and</span> temoin(<span class="str">"B"</span>, <span class="kw">True</span>)
évalué : A
<span class="kw">False</span>
&gt;&gt;&gt; temoin(<span class="str">"A"</span>, <span class="kw">True</span>) <span class="kw">and</span> temoin(<span class="str">"B"</span>, <span class="kw">False</span>)
évalué : A
évalué : B
<span class="kw">False</span>
&gt;&gt;&gt; temoin(<span class="str">"A"</span>, <span class="kw">True</span>) <span class="kw">or</span> temoin(<span class="str">"B"</span>, <span class="kw">False</span>)
évalué : A
<span class="kw">True</span></pre>
    <ol>
      <li>1ʳᵉ ligne : <span class="code-inline">A</span> est faux, donc <span class="code-inline">A and …</span> est faux ; <span class="code-inline">B</span> n'est jamais évalué.</li>
      <li>2ᵉ ligne : <span class="code-inline">A</span> est vrai, il faut évaluer <span class="code-inline">B</span> pour conclure ; le résultat est la valeur de <span class="code-inline">B</span>.</li>
      <li>3ᵉ ligne : <span class="code-inline">A</span> est vrai, donc <span class="code-inline">A or …</span> est vrai ; <span class="code-inline">B</span> n'est pas évalué.</li>
    </ol>
  </div>

  <h3>Protéger une opération</h3>
  <p>On place en premier le test qui garantit que le second a un sens : diviseur non nul, indice valide…</p>
  <pre class="codeblock">&gt;&gt;&gt; d = 0
&gt;&gt;&gt; d != 0 <span class="kw">and</span> 10 % d == 0     <span class="cmt"># 10 % d n'est jamais calculé</span>
<span class="kw">False</span>
&gt;&gt;&gt; 10 % d == 0 <span class="kw">and</span> d != 0     <span class="cmt"># ordre inverse : erreur</span>
Traceback (most recent call last):
  ...
ZeroDivisionError: integer modulo by zero</pre>
  <pre class="codeblock">&gt;&gt;&gt; mot = <span class="str">"kayak"</span>
&gt;&gt;&gt; i = 5
&gt;&gt;&gt; i &lt; len(mot) <span class="kw">and</span> mot[i] == <span class="str">"k"</span>     <span class="cmt"># l'indice 5 n'existe pas : aucun accès</span>
<span class="kw">False</span>
&gt;&gt;&gt; mot[i] == <span class="str">"k"</span> <span class="kw">and</span> i &lt; len(mot)
Traceback (most recent call last):
  ...
IndexError: string index out of range</pre>
  <p><span class="code-inline">len(mot)</span> est la longueur de la chaîne et <span class="code-inline">mot[i]</span> son caractère d'indice <span class="code-inline">i</span>, les indices allant de 0 à <span class="code-inline">len(mot) - 1</span> (chapitre « Types construits »). Le test <span class="code-inline">i &lt; len(mot)</span> doit venir <strong>avant</strong> l'accès <span class="code-inline">mot[i]</span>. Ce schéma revient dans toutes les boucles de recherche (chapitre « Conditions &amp; boucles », §5).</p>

  <div class="notice"><strong>Erreur classique</strong> : croire que <span class="code-inline">and</span> est commutatif. Il l'est pour la valeur quand les deux opérandes se calculent, mais pas pour les erreurs : <span class="code-inline">10 % d == 0 and d != 0</span> plante si <span class="code-inline">d</span> vaut 0, alors que <span class="code-inline">d != 0 and 10 % d == 0</span> vaut <span class="code-inline">False</span>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · AFFICHER ET CONVERTIR</div>
  <h2>Print, chaînes et conversions de type</h2>
  <div class="intro">Pour communiquer un résultat, on l'affiche avec <span class="code-inline">print</span> ; pour fabriquer un message ou exploiter un texte lu dans un fichier, on passe d'un type à l'autre.</div>

  <div class="def-box"><span class="code-inline">print(e)</span> affiche la valeur de l'expression <span class="code-inline">e</span>, puis passe à la ligne. <span class="code-inline">print(e1, e2, …)</span> affiche plusieurs valeurs séparées par une espace ; <span class="code-inline">print()</span> affiche une ligne vide. Une chaîne est affichée sans ses guillemets.</div>
  <pre class="codeblock">&gt;&gt;&gt; h, m = 2, 46
&gt;&gt;&gt; print(h, <span class="str">"h"</span>, m, <span class="str">"min"</span>)
2 h 46 min
&gt;&gt;&gt; print(<span class="str">"total :"</span>, 3 * 1.5)
total : 4.5
&gt;&gt;&gt; <span class="str">"PTSI"</span>          <span class="cmt"># la console montre la valeur, avec ses guillemets</span>
<span class="str">'PTSI'</span>
&gt;&gt;&gt; print(<span class="str">"PTSI"</span>)   <span class="cmt"># print affiche le texte, sans guillemets</span>
PTSI</pre>

  <div class="prop-box"><strong>Afficher n'est pas renvoyer.</strong> <span class="code-inline">print</span> écrit à l'écran, pour un humain ; il ne produit aucune valeur utilisable par le programme (sa valeur est <span class="code-inline">None</span>, « rien »). Une fonction qui doit fournir un résultat le <strong>renvoie</strong> avec <span class="code-inline">return</span> (chapitre « Fonctions ») : un sujet qui demande « écrire une fonction qui renvoie… » n'accepte pas un <span class="code-inline">print</span>.</div>
  <pre class="codeblock">&gt;&gt;&gt; r = print(<span class="str">"bonjour"</span>)
bonjour
&gt;&gt;&gt; print(r)
<span class="kw">None</span></pre>

  <h3>Chaînes : concaténer, répéter, mesurer</h3>
  <pre class="codeblock">&gt;&gt;&gt; <span class="str">"PT"</span> + <span class="str">"SI"</span>, <span class="str">"ab"</span> * 3, len(<span class="str">"PTSI"</span>)
(<span class="str">'PTSI'</span>, <span class="str">'ababab'</span>, 4)
&gt;&gt;&gt; <span class="str">"3"</span> * 4          <span class="cmt"># répétition, pas multiplication !</span>
<span class="str">'3333'</span>
&gt;&gt;&gt; int(<span class="str">"3"</span>) * 4
12</pre>
  <p><span class="code-inline">+</span> met deux chaînes bout à bout, <span class="code-inline">*</span> répète une chaîne un nombre entier de fois, <span class="code-inline">len</span> donne le nombre de caractères. L'accès aux caractères et les tranches sont traités dans le chapitre « Types construits ».</p>

  <h3>Conversions</h3>
  <div class="def-box"><span class="code-inline">int(x)</span> convertit en entier : une chaîne qui écrit un entier (<span class="code-inline">int("42")</span>, espaces et saut de ligne autour tolérés), ou un flottant, dont la partie décimale est <strong>supprimée</strong> (<span class="code-inline">int(3.9)</span> vaut 3 : ce n'est pas un arrondi). <span class="code-inline">float(x)</span> convertit en flottant (<span class="code-inline">float("2.5")</span>, <span class="code-inline">float(3)</span>). <span class="code-inline">str(x)</span> donne l'écriture de <span class="code-inline">x</span> sous forme de chaîne (<span class="code-inline">str(12)</span> vaut <span class="code-inline">"12"</span>). Ces fonctions ne sont pas dans l'annexe, mais elles sont indispensables pour lire un fichier (chapitre « Modules, fichiers et statistiques ») : tout ce qu'on y lit est du texte.</div>
  <pre class="codeblock">&gt;&gt;&gt; int(<span class="str">"42"</span>) + 1, int(3.9), float(<span class="str">"2.5"</span>), float(3)
(43, 3, 2.5, 3.0)
&gt;&gt;&gt; str(12) + <span class="str">"3"</span>, <span class="str">"Note : "</span> + str(15)
(<span class="str">'123'</span>, <span class="str">'Note : 15'</span>)
&gt;&gt;&gt; int(<span class="str">"135\n"</span>)       <span class="cmt"># une ligne lue dans un fichier finit par un saut de ligne</span>
135
&gt;&gt;&gt; int(<span class="str">"3.5"</span>)
Traceback (most recent call last):
  ...
ValueError: invalid literal <span class="kw">for</span> int() <span class="kw">with</span> base 10: <span class="str">'3.5'</span></pre>

  <div class="method-box"><strong>Exemple — combien de chiffres a \(2^{100}\) ?</strong>
    <pre class="codeblock">&gt;&gt;&gt; n = 2 ** 100
&gt;&gt;&gt; len(str(n))      <span class="cmt"># nombre de chiffres de n</span>
31</pre>
    <ol>
      <li><span class="code-inline">str(n)</span> écrit l'entier en base 10 ; <span class="code-inline">len</span> compte ses caractères, donc ses chiffres.</li>
      <li>Contrôle : \(2^{10} = 1024 \approx 10^3\), donc \(2^{100} \approx 10^{30}\), un nombre de 31 chiffres.</li>
      <li>Sans conversion, on compte les divisions par 10 nécessaires (chapitre « Conditions &amp; boucles », §5).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : <span class="code-inline">"3" + 4</span> provoque une <span class="code-inline">TypeError</span> (on ne concatène pas une chaîne et un nombre : écrire <span class="code-inline">"3" + str(4)</span> ou <span class="code-inline">int("3") + 4</span>) ; pire, <span class="code-inline">"3" * 4</span> ne provoque aucune erreur et vaut <span class="code-inline">"3333"</span>. Un nombre lu dans un fichier est une chaîne tant qu'on ne l'a pas converti.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Saisie au clavier, f-strings, opérandes négatifs</h2>
  <div class="intro">Ces outils, utiles en dehors des concours, ne sont pas exigibles : les sujets fournissent leurs données en paramètre des fonctions et demandent de <strong>renvoyer</strong> les résultats.</div>
  <ul>
    <li><strong>Saisie</strong> : <span class="code-inline">input("message")</span> affiche le message, attend une ligne tapée au clavier et la renvoie <strong>toujours sous forme de chaîne</strong> ; il faut la convertir pour calculer.</li>
  </ul>
  <pre class="codeblock">age = int(input(<span class="str">"Votre âge ? "</span>))    <span class="cmt"># input renvoie une chaîne</span>
print(<span class="str">"Dans 10 ans :"</span>, age + 10)</pre>
  <ul>
    <li><strong>f-strings</strong> : une chaîne précédée de <span class="code-inline">f</span> insère la valeur des expressions écrites entre accolades.</li>
  </ul>
  <pre class="codeblock">h, m = 2, 46
print(f"{h} h {m} min")      <span class="cmt"># affiche 2 h 46 min</span></pre>
  <ul>
    <li><strong>Paramètres de print</strong> : <span class="code-inline">print(a, b, sep="-")</span> change le séparateur, <span class="code-inline">print(a, end="")</span> supprime le passage à la ligne.</li>
    <li><strong>Opérandes négatifs</strong> : Python arrondit le quotient <span class="code-inline">//</span> vers \(-\infty\) et donne au reste <span class="code-inline">%</span> le signe du diviseur ; la relation \(a = b\,q + r\) reste vraie.</li>
  </ul>
  <pre class="codeblock">&gt;&gt;&gt; -7 // 2, -7 % 2
(-4, 1)
&gt;&gt;&gt; 2 * (-7 // 2) + (-7 % 2)
-7</pre>
</div>
</template>
<template class="pan-tpl" data-panneau="pyb-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · BASES DE PYTHON</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Neuf savoir-faire de base, à pratiquer jusqu'à l'automatisme : ils servent dans chaque programme et dans chaque question « que fait ce code ? » des épreuves.</div>

  <div class="method-box"><strong>Méthode 1 — Dérouler un programme à la main</strong>
    <ol>
      <li>Dresser un tableau d'états : une ligne par instruction exécutée, une colonne par variable (et une colonne « affichage » s'il y a des <span class="code-inline">print</span>).</li>
      <li>Pour chaque affectation, calculer le membre de droite avec les valeurs <strong>actuelles</strong> des variables, puis mettre à jour la seule colonne du nom de gauche.</li>
      <li>Pour une affectation simultanée <span class="code-inline">a, b = …</span>, calculer <strong>tout</strong> le membre de droite avant de modifier une colonne.</li>
      <li>Conclure par les valeurs finales et l'affichage obtenu.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">x = 2
y = x * 3
x = y - x
y = x // 2</pre>
    <p>États successifs : <span class="code-inline">x</span> vaut 2 ; <span class="code-inline">y</span> vaut 6 ; <span class="code-inline">x</span> vaut \(6 - 2 = 4\) ; <span class="code-inline">y</span> vaut <span class="code-inline">4 // 2</span>, soit 2. À la fin, <span class="code-inline">x == 4</span> et <span class="code-inline">y == 2</span>.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une affectation simultanée n'équivaut pas à deux affectations successives. Avec <span class="code-inline">a, b = 2, 3</span> au départ :
    <pre class="codeblock">a, b = 2, 3
a, b = b, a + b      <span class="cmt"># à droite : (3, 5), puis a = 3 et b = 5</span></pre>
    <pre class="codeblock">a, b = 2, 3
a = b                <span class="cmt"># a vaut 3</span>
b = a + b            <span class="cmt"># b vaut 3 + 3, soit 6</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 2 — Choisir entre <span class="code-inline">/</span>, <span class="code-inline">//</span> et <span class="code-inline">%</span></strong>
    <ol>
      <li>Résultat réel (une moyenne, une vitesse) : division flottante <span class="code-inline">/</span>.</li>
      <li>Nombre de « paquets complets » (heures dans une durée, groupes complets) : quotient <span class="code-inline">//</span>.</li>
      <li>Ce qui reste, ou la position dans un cycle (minutes restantes, jour de la semaine, parité) : reste <span class="code-inline">%</span>.</li>
      <li>Contrôler avec \(a = b\,q + r\) et \(0 \le r \lt b\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 100 élèves en groupes de 24.</p>
    <pre class="codeblock">eleves, taille = 100, 24
complets = eleves // taille                 <span class="cmt"># 4 groupes complets</span>
restants = eleves % taille                  <span class="cmt"># 4 élèves sans groupe complet</span>
necessaires = (eleves + taille - 1) // taille   <span class="cmt"># 5 groupes en tout</span></pre>
    <p>\(100 = 24 \times 4 + 4\) : 4 groupes complets, 4 élèves restants, donc 5 groupes nécessaires. <span class="code-inline">(a + b - 1) // b</span> est le quotient arrondi à l'entier <strong>supérieur</strong>, sans passer par les flottants.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Extraire les chiffres d'un entier</strong>
    <ol>
      <li>Chiffre des unités : <span class="code-inline">n % 10</span>.</li>
      <li>Entier privé de son dernier chiffre : <span class="code-inline">n // 10</span>.</li>
      <li>Chiffre de rang \(k\) (unités : \(k = 0\)) : <span class="code-inline">(n // 10 ** k) % 10</span>.</li>
      <li>Pour recomposer un nombre, multiplier chaque chiffre par la puissance de 10 de sa nouvelle position.</li>
    </ol>
    <p><em>Exemple éclair :</em> renverser un entier de trois chiffres.</p>
    <pre class="codeblock">n = 472
r = (n % 10) * 100 + (n // 10 % 10) * 10 + n // 100    <span class="cmt"># 274</span></pre>
    <p>Unités 2, dizaines 7, centaines 4 : \(2\times 100 + 7\times 10 + 4 = 274\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Prévoir le type et la valeur d'une expression</strong>
    <ol>
      <li>Placer les parenthèses implicites selon les priorités : <span class="code-inline">**</span>, puis <span class="code-inline">*</span>, <span class="code-inline">/</span>, <span class="code-inline">//</span>, <span class="code-inline">%</span>, puis <span class="code-inline">+</span>, <span class="code-inline">-</span>, puis comparaisons, <span class="code-inline">not</span>, <span class="code-inline">and</span>, <span class="code-inline">or</span>.</li>
      <li>Évaluer de l'intérieur vers l'extérieur, en notant le <strong>type</strong> de chaque résultat intermédiaire.</li>
      <li>Règles de type : <span class="code-inline">int</span> avec <span class="code-inline">int</span> donne <span class="code-inline">int</span> sauf <span class="code-inline">/</span> ; un <span class="code-inline">float</span> dans l'opération donne un <span class="code-inline">float</span> ; une comparaison donne un <span class="code-inline">bool</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> <span class="code-inline">3 + 7 // 2 * 2.0 ** 2</span> se lit <span class="code-inline">3 + ((7 // 2) * (2.0 ** 2))</span> ; <span class="code-inline">2.0 ** 2</span> vaut <span class="code-inline">4.0</span>, <span class="code-inline">7 // 2</span> vaut <span class="code-inline">3</span>, leur produit <span class="code-inline">12.0</span>, d'où le flottant <span class="code-inline">15.0</span>.</p>
    <pre class="codeblock">&gt;&gt;&gt; 3 + 7 // 2 * 2.0 ** 2
15.0</pre>
  </div>

  <div class="method-box"><strong>Méthode 5 — Écrire une condition et sa négation</strong>
    <ol>
      <li>Traduire la phrase avec <span class="code-inline">and</span> (« et », « à la fois ») et <span class="code-inline">or</span> (« ou », au sens inclusif), en ajoutant les parenthèses qui suivent la phrase.</li>
      <li>Pour la négation, appliquer De Morgan : <span class="code-inline">and</span> devient <span class="code-inline">or</span> et inversement, chaque comparaison est remplacée par son contraire (<span class="code-inline">&lt;</span> par <span class="code-inline">&gt;=</span>, <span class="code-inline">==</span> par <span class="code-inline">!=</span>).</li>
      <li>Vérifier sur une valeur de chaque cas, et sur les valeurs limites (égalités).</li>
    </ol>
    <p><em>Exemple éclair :</em> « <span class="code-inline">x</span> est dans \([a, b]\) » s'écrit <span class="code-inline">a &lt;= x &lt;= b</span> ; sa négation est <span class="code-inline">x &lt; a or x &gt; b</span> (et non <span class="code-inline">x &lt; a and x &gt; b</span>, toujours faux).</p>
    <pre class="codeblock">&gt;&gt;&gt; a, b, x = 0, 10, 12
&gt;&gt;&gt; a &lt;= x &lt;= b
<span class="kw">False</span>
&gt;&gt;&gt; x &lt; a <span class="kw">or</span> x &gt; b          <span class="cmt"># la négation, sans not</span>
<span class="kw">True</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 6 — Protéger un calcul par l'évaluation paresseuse</strong>
    <ol>
      <li>Repérer l'opération qui peut échouer : division ou reste par une valeur nulle, accès à un indice qui peut ne pas exister.</li>
      <li>Écrire d'abord le test qui la rend sûre, puis <span class="code-inline">and</span>, puis le calcul : <span class="code-inline">garde and calcul</span>.</li>
      <li>Pour « cas facile ou calcul », écrire <span class="code-inline">cas_facile or calcul</span> : le calcul n'est fait que si nécessaire.</li>
    </ol>
    <p><em>Exemple éclair :</em> « <span class="code-inline">d</span> divise <span class="code-inline">n</span> » avec <span class="code-inline">d</span> éventuellement nul : <span class="code-inline">d != 0 and n % d == 0</span>. Une ligne d'un fichier commence-t-elle par <span class="code-inline">#</span> ?</p>
    <pre class="codeblock">&gt;&gt;&gt; ligne = <span class="str">""</span>
&gt;&gt;&gt; len(ligne) &gt; 0 <span class="kw">and</span> ligne[0] == <span class="str">"#"</span>     <span class="cmt"># ligne vide : pas d'accès à ligne[0]</span>
<span class="kw">False</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 7 — Comparer deux flottants</strong>
    <ol>
      <li>Ne jamais tester l'égalité <span class="code-inline">x == y</span> de deux résultats de calculs en flottants.</li>
      <li>Choisir une tolérance \(\varepsilon\) adaptée à l'ordre de grandeur des valeurs et à la précision voulue.</li>
      <li>Tester <span class="code-inline">abs(x - y) &lt; eps</span> ; pour des valeurs très grandes ou très petites, comparer plutôt l'écart relatif <span class="code-inline">abs(x - y) &lt; eps * abs(y)</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">&gt;&gt;&gt; 0.1 * 3 == 0.3
<span class="kw">False</span>
&gt;&gt;&gt; abs(0.1 * 3 - 0.3) &lt; 1e-9
<span class="kw">True</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 8 — Convertir entre chaînes et nombres</strong>
    <ol>
      <li>Repérer le type de chaque donnée : tout texte lu dans un fichier (ou saisi au clavier avec <span class="code-inline">input</span>, hors programme) est une <strong>chaîne</strong>.</li>
      <li>Convertir avant de calculer : <span class="code-inline">int(…)</span> pour un entier, <span class="code-inline">float(…)</span> pour un nombre à virgule (écrit avec un <strong>point</strong>).</li>
      <li>Convertir avant de concaténer : <span class="code-inline">str(…)</span> pour mettre un nombre dans un message.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">&gt;&gt;&gt; ligne = <span class="str">"17\n"</span>            <span class="cmt"># texte lu dans un fichier</span>
&gt;&gt;&gt; int(ligne) + 1
18
&gt;&gt;&gt; <span class="str">"Total : "</span> + str(int(ligne) + 1)
<span class="str">'Total : 18'</span>
&gt;&gt;&gt; float(<span class="str">"2,5"</span>)              <span class="cmt"># virgule décimale : refusée</span>
Traceback (most recent call last):
  ...
ValueError: could <span class="kw">not</span> convert string to float: <span class="str">'2,5'</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 9 — Lire un message d'erreur et corriger</strong>
    <ol>
      <li>Lire la <strong>dernière ligne</strong> du message : le type d'erreur et sa cause ; la ligne fautive est indiquée juste au-dessus.</li>
      <li>Identifier la famille : <span class="code-inline">SyntaxError</span> (code mal écrit, rien n'a été exécuté), <span class="code-inline">NameError</span> (nom inconnu : faute de frappe, variable pas encore affectée), <span class="code-inline">TypeError</span> (opération impossible pour ces types), <span class="code-inline">ValueError</span> (conversion impossible), <span class="code-inline">ZeroDivisionError</span>, <span class="code-inline">IndexError</span> (indice inexistant).</li>
      <li>Corriger la cause, pas le symptôme : une conversion manquante, une garde oubliée, un nom mal orthographié.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">&gt;&gt;&gt; note = 15
&gt;&gt;&gt; <span class="str">"Note : "</span> + note
Traceback (most recent call last):
  ...
TypeError: can only concatenate str (<span class="kw">not</span> <span class="str">"int"</span>) to str
&gt;&gt;&gt; <span class="str">"Note : "</span> + str(note)
<span class="str">'Note : 15'</span></pre>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : <span class="code-inline">=</span> affecte, <span class="code-inline">==</span> compare ; <span class="code-inline">/</span> donne un flottant même quand la division tombe juste (<span class="code-inline">4 / 2</span> vaut <span class="code-inline">2.0</span>) ; <span class="code-inline">^</span> n'est pas la puissance (<span class="code-inline">**</span>) ; <span class="code-inline">"3" * 4</span> vaut <span class="code-inline">"3333"</span> sans aucune erreur ; une condition <span class="code-inline">x == 1 or 2</span> est toujours vraie.</div>
</div>

  <h3>Évaluation paresseuse : erreur ou pas ?</h3>
  <div class="statement">On a exécuté <span class="code-inline">x = 0</span> et <span class="code-inline">s = "abc"</span>. Pour chaque expression, donner sa valeur ou l'erreur provoquée : (a) <span class="code-inline">x != 0 and 1 / x &gt; 2</span> ; (b) <span class="code-inline">1 / x &gt; 2 and x != 0</span> ; (c) <span class="code-inline">x == 0 or 1 / x &gt; 2</span> ; (d) <span class="code-inline">x != 0 or 1 / x &gt; 2</span> ; (e) <span class="code-inline">len(s) &gt; 3 and s[3] == "d"</span> ; (f) <span class="code-inline">len(s) &lt;= 3 or s[3] == "d"</span> ; (g) <span class="code-inline">s[3] == "d" or len(s) &lt;= 3</span>. On rappelle que <span class="code-inline">s[i]</span> est le caractère d'indice <span class="code-inline">i</span> de <span class="code-inline">s</span>, pour <span class="code-inline">i</span> entre 0 et <span class="code-inline">len(s) - 1</span>.</div>
  <div class="q"><strong>Q1.</strong> Répondre pour chacune des sept expressions, en justifiant.</div>
  <div class="q"><strong>Q2.</strong> Écrire une condition vraie si et seulement si <span class="code-inline">d</span> divise <span class="code-inline">n</span>, valable aussi quand <span class="code-inline">d</span> vaut 0 (on convient que 0 ne divise rien).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Résultats obtenus en Python (vérifiés) :</p>
    <div><table>
<tr><th></th><th>expression</th><th>résultat</th><th>pourquoi</th></tr>
<tr><td>(a)</td><td><span class="code-inline">x != 0 and 1 / x &gt; 2</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">x != 0</span> est faux : <span class="code-inline">and</span> s'arrête, la division n'est pas évaluée.</td></tr>
<tr><td>(b)</td><td><span class="code-inline">1 / x &gt; 2 and x != 0</span></td><td><span class="code-inline">ZeroDivisionError</span></td><td>la division <span class="code-inline">1 / x</span> est évaluée en premier.</td></tr>
<tr><td>(c)</td><td><span class="code-inline">x == 0 or 1 / x &gt; 2</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">x == 0</span> est vrai : <span class="code-inline">or</span> s'arrête.</td></tr>
<tr><td>(d)</td><td><span class="code-inline">x != 0 or 1 / x &gt; 2</span></td><td><span class="code-inline">ZeroDivisionError</span></td><td><span class="code-inline">x != 0</span> est faux : <span class="code-inline">or</span> évalue le second opérande, d'où la division par zéro.</td></tr>
<tr><td>(e)</td><td><span class="code-inline">len(s) &gt; 3 and s[3] == "d"</span></td><td><span class="code-inline">False</span></td><td><span class="code-inline">len(s) &gt; 3</span> est faux (3 n'est pas &gt; 3) : <span class="code-inline">s[3]</span> n'est pas évalué.</td></tr>
<tr><td>(f)</td><td><span class="code-inline">len(s) &lt;= 3 or s[3] == "d"</span></td><td><span class="code-inline">True</span></td><td><span class="code-inline">len(s) &lt;= 3</span> est vrai : <span class="code-inline">or</span> s'arrête.</td></tr>
<tr><td>(g)</td><td><span class="code-inline">s[3] == "d" or len(s) &lt;= 3</span></td><td><span class="code-inline">IndexError</span></td><td><span class="code-inline">s[3]</span> est évalué en premier et l'indice 3 n'existe pas.</td></tr>
</table></div>
    <p>Règle : <span class="code-inline">and</span> s'arrête au premier opérande faux, <span class="code-inline">or</span> au premier opérande vrai ; une erreur n'apparaît que si l'opération fautive est effectivement évaluée. Dans (d), le premier opérande <span class="code-inline">x != 0</span> est faux : <span class="code-inline">or</span> doit évaluer le second, et la division par zéro se produit.</p>
    <p><strong>Q2.</strong> <span class="code-inline">d != 0 and n % d == 0</span> : le reste n'est calculé que si <span class="code-inline">d</span> n'est pas nul.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Calendrier et horloge : le reste au travail</h3>
  <div class="statement">On numérote les jours de la semaine de 0 (lundi) à 6 (dimanche). Le 1ᵉʳ janvier 2026 est un jeudi (numéro 3) ; 2026 n'est pas bissextile.</div>
  <div class="q"><strong>Q1.</strong> Le \(k\)-ième jour de l'année (\(k = 1\) pour le 1ᵉʳ janvier) a pour numéro <span class="code-inline">(3 + k - 1) % 7</span>. Justifier.</div>
  <div class="q"><strong>Q2.</strong> Quel jour de la semaine tombe le 14 juillet 2026 ?</div>
  <div class="q"><strong>Q3.</strong> Combien de semaines complètes compte l'année 2026 ? Quel jour de la semaine sera le 1ᵉʳ janvier 2027 ?</div>
  <div class="q"><strong>Q4.</strong> Un train part à 22 h 50 et roule 135 minutes. À quelle heure arrive-t-il ? Écrire le calcul en Python.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le \(k\)-ième jour vient \(k - 1\) jours après le 1ᵉʳ janvier ; chaque jour avance le numéro de 1, et tous les 7 jours on revient au même numéro : on prend donc le reste modulo 7 de \(3 + (k - 1)\).</p>
    <p><strong>Q2.</strong> Les six premiers mois comptent \(31 + 28 + 31 + 30 + 31 + 30 = 181\) jours, donc le 14 juillet est le jour \(k = 195\).</p>
    <pre class="codeblock">k = 31 + 28 + 31 + 30 + 31 + 30 + 14    <span class="cmt"># 14 juillet : 195e jour</span>
jour = (3 + k - 1) % 7                  <span class="cmt"># 1, soit mardi</span></pre>
    <p>\(197 = 7\times 28 + 1\) : numéro 1, c'est un <strong>mardi</strong>.</p>
    <p><strong>Q3.</strong> <span class="code-inline">365 // 7</span> vaut 52 semaines complètes, et il reste <span class="code-inline">365 % 7</span>, soit 1 jour. Le 1ᵉʳ janvier 2027 est le jour 366 compté depuis le 1ᵉʳ janvier 2026 : <span class="code-inline">(3 + 365) % 7</span> vaut 4, un <strong>vendredi</strong> (un jour de plus que le jeudi, puisque l'année compte 52 semaines et 1 jour).</p>
    <p><strong>Q4.</strong> On compte en minutes depuis minuit, modulo la durée d'un jour (1 440 minutes) :</p>
    <pre class="codeblock">depart = 22 * 60 + 50                   <span class="cmt"># 1370 min après minuit</span>
arrivee = (depart + 135) % (24 * 60)    <span class="cmt"># 65 : le lendemain</span>
h, m = arrivee // 60, arrivee % 60      <span class="cmt"># 1 h 5</span></pre>
    <p>Le train arrive le lendemain à 1 h 05.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Pièges de l'arithmétique Python — prédire et expliquer</h3>
  <div class="statement">Sans exécuter, prédire <strong>et justifier</strong> le résultat de chaque expression.</div>
  <div class="q"><strong>Q1.</strong> Que valent <span class="code-inline">2 ** 3 ** 2</span> et <span class="code-inline">-2 ** 2</span> ? (associativité et priorité de <span class="code-inline">**</span>).</div>
  <div class="q"><strong>Q2.</strong> Pourquoi <span class="code-inline">0.1 + 0.2 == 0.3</span> vaut-il <span class="code-inline">False</span> ? Quel réflexe adopter pour comparer deux flottants ?</div>
  <div class="q"><strong>Q3.</strong> Que vaut <span class="code-inline">2 ^ 3</span> ? Pourquoi cette erreur est-elle dangereuse ?</div>
  <div class="q"><strong>Q4.</strong> (Hors programme : opérandes négatifs, pour aller plus loin.) Que valent <span class="code-inline">-7 // 2</span> et <span class="code-inline">-7 % 2</span> en Python ? Vérifier l'identité <span class="code-inline">a == (a // b) * b + a % b</span>.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> <span class="code-inline">**</span> est <strong>associatif à droite</strong> : <span class="code-inline">2 ** 3 ** 2 = 2 ** (3 ** 2) = 2 ** 9 = 512</span>. Le moins unaire est <strong>moins prioritaire</strong> que <span class="code-inline">**</span> : <span class="code-inline">-2 ** 2 = -(2 ** 2) = -4</span> (et non \(4\)).</p>
    <p><strong>Q2.</strong> Les flottants sont stockés en <strong>binaire</strong> sur un nombre fini de bits : \(0{,}1\) et \(0{,}2\) n'ont pas de représentation exacte, et <span class="code-inline">0.1 + 0.2</span> vaut \(0{,}30000000000000004\neq 0{,}3\). Réflexe : ne jamais tester l'égalité stricte de flottants, mais un écart inférieur à une <strong>tolérance</strong> : <span class="code-inline">abs((0.1 + 0.2) - 0.3) &lt;= 1e-9</span>.</p>
    <p><strong>Q3.</strong> <span class="code-inline">2 ^ 3</span> vaut 1 : <span class="code-inline">^</span> est une opération sur l'écriture binaire des entiers (« ou exclusif », hors programme), pas la puissance. Python ne signale aucune erreur, le résultat est faux en silence ; la puissance s'écrit <span class="code-inline">2 ** 3</span>.</p>
    <p><strong>Q4.</strong> Python arrondit le quotient <span class="code-inline">//</span> <strong>vers \(-\infty\)</strong> : <span class="code-inline">-7 // 2 = -4</span> (partie entière de \(-3{,}5\)) et <span class="code-inline">-7 % 2 = 1</span> (le reste a le signe du <em>diviseur</em>). Vérification : \((-4)\times 2 + 1 = -7\) ; l'identité <span class="code-inline">a == (a // b) * b + a % b</span> est toujours respectée. Le programme limite <span class="code-inline">//</span> et <span class="code-inline">%</span> aux opérandes positifs : ce comportement n'est pas exigible.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Horodatage d'une station météo</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : opérations entières, booléens, évaluation paresseuse, affichage).</div>
  <div class="statement">Une station météo enregistre ses mesures en notant l'instant <span class="code-inline">t</span> de chaque mesure : le nombre de secondes écoulées depuis le 1ᵉʳ janvier à 0 h (un entier positif ou nul). On rappelle qu'une fonction s'écrit <span class="code-inline">def nom(param1, param2):</span> suivi d'un bloc indenté qui se termine par <span class="code-inline">return valeur</span> ; les annotations <span class="code-inline">t: int</span> et <span class="code-inline">-&gt; bool</span> indiquent les types attendus (Python ne les vérifie pas). <strong>Aucune boucle n'est nécessaire dans cet exercice.</strong></div>

  <p class="exo-part">Partie A — Conversions</p>
  <div class="q"><strong>A1.</strong> Écrire une fonction <span class="code-inline">jour_heure(t: int) -&gt; tuple</span> qui renvoie le tuple <span class="code-inline">(j, h, m, s)</span> : numéro du jour <span class="code-inline">j</span> (0 pour le 1ᵉʳ janvier), heure <span class="code-inline">h</span>, minute <span class="code-inline">m</span> et seconde <span class="code-inline">s</span> de l'instant <span class="code-inline">t</span>. Que renvoie <span class="code-inline">jour_heure(200000)</span> ?</div>
  <div class="q"><strong>A2.</strong> Écrire la fonction réciproque <span class="code-inline">secondes(j: int, h: int, m: int, s: int) -&gt; int</span>.</div>
  <div class="q"><strong>A3.</strong> Écrire une fonction <span class="code-inline">meme_heure(t1: int, t2: int) -&gt; bool</span> qui indique si deux mesures ont été prises dans la même heure de la journée (de 7 h 00 à 7 h 59, par exemple), éventuellement à des jours différents. Elle ne doit contenir aucun <span class="code-inline">if</span>.</div>

  <p class="exo-part">Partie B — Contrôle des mesures</p>
  <div class="q"><strong>B1.</strong> Une mesure est plausible si la température <span class="code-inline">temp</span> (en °C) est comprise entre −40 et 60 et l'humidité <span class="code-inline">humid</span> (en %) entre 0 et 100, bornes comprises. Écrire <span class="code-inline">valide(temp: float, humid: float) -&gt; bool</span>, puis <span class="code-inline">suspecte(temp: float, humid: float) -&gt; bool</span>, sa négation, sans utiliser <span class="code-inline">not</span>.</div>
  <div class="q"><strong>B2.</strong> Écrire <span class="code-inline">proche(mesure: float, ref: float) -&gt; bool</span>, qui renvoie <span class="code-inline">True</span> si et seulement si <span class="code-inline">ref</span> n'est pas nulle et l'écart relatif \(\dfrac{|\text{mesure} - \text{ref}|}{|\text{ref}|}\) vaut au plus 5 %. On utilisera la fonction <span class="code-inline">abs</span> (valeur absolue).</div>
  <div class="q"><strong>B3.</strong> Que se passerait-il, pour <span class="code-inline">ref = 0</span>, si l'on écrivait les deux tests de B2 dans l'ordre inverse ? Pourquoi divise-t-on par <span class="code-inline">abs(ref)</span> et non par <span class="code-inline">ref</span> ?</div>

  <p class="exo-part">Partie C — Affichage et représentation</p>
  <div class="q"><strong>C1.</strong> Écrire une fonction <span class="code-inline">afficher(t: int, temp: float) -&gt; None</span> qui affiche par exemple <span class="code-inline">jour 2 : 7 h 33 min ; 21.5 °C</span> (les secondes ne sont pas affichées).</div>
  <div class="q"><strong>C2.</strong> Après <span class="code-inline">x = afficher(200000, 21.5)</span>, que vaut <span class="code-inline">x</span> ? Peut-on utiliser <span class="code-inline">afficher</span> pour calculer ?</div>
  <div class="q"><strong>C3.</strong> L'électronique de la station range <span class="code-inline">t</span> dans un entier non signé de 32 bits, dont la plus grande valeur est \(2^{32} - 1\). Pendant combien d'années, environ, la station peut-elle dater ses mesures ? Ce problème se pose-t-il pour un entier Python ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Un jour compte \(24\times 3600 = 86\,400\) secondes. Le quotient de <span class="code-inline">t</span> par 86 400 est le nombre de jours complets écoulés, donc le numéro du jour ; le reste <span class="code-inline">r</span> est la durée écoulée depuis minuit, qu'on découpe de la même façon en heures (3 600 s), puis en minutes.</p>
    <pre class="codeblock"><span class="kw">def</span> jour_heure(t: int) -&gt; tuple:
    <span class="str">"""Précondition : t &gt;= 0 (secondes depuis le 1er janvier, 0 h).</span>
<span class="str">    Renvoie (j, h, m, s) : jour, heure, minute, seconde."""</span>
    j = t // 86400              <span class="cmt"># 86400 secondes par jour</span>
    r = t % 86400               <span class="cmt"># secondes écoulées dans le jour j</span>
    h = r // 3600
    m = (r % 3600) // 60
    s = r % 60
    <span class="kw">return</span> j, h, m, s</pre>
    <p>Pour <span class="code-inline">t = 200000</span> : \(200\,000 = 2\times 86\,400 + 27\,200\), puis \(27\,200 = 7\times 3600 + 2000\) et \(2000 = 33\times 60 + 20\) : la fonction renvoie <span class="code-inline">(2, 7, 33, 20)</span>, le 3 janvier à 7 h 33 min 20 s.</p>
    <p><strong>A2.</strong> On recompose de l'unité la plus grande à la plus petite (schéma de Horner) :</p>
    <pre class="codeblock"><span class="kw">def</span> secondes(j: int, h: int, m: int, s: int) -&gt; int:
    <span class="str">"""Instant (en secondes) du jour j à h heures m minutes s secondes."""</span>
    <span class="kw">return</span> ((j * 24 + h) * 60 + m) * 60 + s</pre>
    <p><strong>A3.</strong> L'heure de la journée est <span class="code-inline">(t % 86400) // 3600</span> ; on renvoie directement le booléen de la comparaison.</p>
    <pre class="codeblock"><span class="kw">def</span> meme_heure(t1: int, t2: int) -&gt; bool:
    <span class="str">"""Vrai si t1 et t2 tombent dans la même heure de la journée."""</span>
    <span class="kw">return</span> (t1 % 86400) // 3600 == (t2 % 86400) // 3600</pre>
    <p><strong>B1.</strong> Comparaisons enchaînées et <span class="code-inline">and</span> ; pour la négation, De Morgan : chaque comparaison est inversée et <span class="code-inline">and</span> devient <span class="code-inline">or</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> valide(temp: float, humid: float) -&gt; bool:
    <span class="kw">return</span> -40 &lt;= temp &lt;= 60 <span class="kw">and</span> 0 &lt;= humid &lt;= 100

<span class="kw">def</span> suspecte(temp: float, humid: float) -&gt; bool:
    <span class="kw">return</span> temp &lt; -40 <span class="kw">or</span> temp &gt; 60 <span class="kw">or</span> humid &lt; 0 <span class="kw">or</span> humid &gt; 100</pre>
    <p><strong>B2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> proche(mesure: float, ref: float) -&gt; bool:
    <span class="str">"""Vrai si ref n'est pas nulle et si mesure s'écarte de ref</span>
<span class="str">    de 5 % au plus (en valeur relative)."""</span>
    <span class="kw">return</span> ref != 0 <span class="kw">and</span> abs(mesure - ref) / abs(ref) &lt;= 0.05</pre>
    <p><strong>B3.</strong> Grâce à l'évaluation paresseuse, si <span class="code-inline">ref</span> vaut 0 le test <span class="code-inline">ref != 0</span> est faux et la division n'est pas évaluée : <span class="code-inline">proche(3.0, 0.0)</span> vaut <span class="code-inline">False</span>. Dans l'ordre inverse, la division serait évaluée en premier et provoquerait une <span class="code-inline">ZeroDivisionError</span>. On divise par <span class="code-inline">abs(ref)</span> car une température de référence peut être négative : avec <span class="code-inline">ref = -10.0</span> et <span class="code-inline">mesure = -9.8</span>, l'écart relatif vaut \(0{,}2/10 = 2\,\%\), alors que diviser par <span class="code-inline">ref</span> donnerait un nombre négatif, toujours inférieur à 0,05.</p>
    <p><strong>C1.</strong> On réutilise <span class="code-inline">jour_heure</span> ; <span class="code-inline">print</span> sépare ses arguments par une espace.</p>
    <pre class="codeblock"><span class="kw">def</span> afficher(t: int, temp: float) -&gt; <span class="kw">None</span>:
    j, h, m, s = jour_heure(t)
    print(<span class="str">"jour"</span>, j, <span class="str">":"</span>, h, <span class="str">"h"</span>, m, <span class="str">"min ;"</span>, temp, <span class="str">"°C"</span>)</pre>
    <pre class="codeblock">&gt;&gt;&gt; jour_heure(200000)
(2, 7, 33, 20)
&gt;&gt;&gt; secondes(2, 7, 33, 20)
200000
&gt;&gt;&gt; meme_heure(200000, 25300), proche(19.2, 20.0), proche(3.0, 0.0)
(<span class="kw">True</span>, <span class="kw">True</span>, <span class="kw">False</span>)
&gt;&gt;&gt; x = afficher(200000, 21.5)
jour 2 : 7 h 33 min ; 21.5 °C
&gt;&gt;&gt; print(x)
<span class="kw">None</span></pre>
    <p><strong>C2.</strong> <span class="code-inline">x</span> vaut <span class="code-inline">None</span> : <span class="code-inline">afficher</span> <strong>affiche</strong> un texte mais ne <strong>renvoie</strong> aucune valeur. On ne peut rien calculer avec son résultat ; pour cela il faut une fonction qui renvoie (comme <span class="code-inline">jour_heure</span>).</p>
    <p><strong>C3.</strong></p>
    <pre class="codeblock">&gt;&gt;&gt; (2 ** 32 - 1) // 86400            <span class="cmt"># jours représentables</span>
49710
&gt;&gt;&gt; (2 ** 32 - 1) // 86400 // 365     <span class="cmt"># soit environ 136 ans</span>
136</pre>
    <p>La station peut dater ses mesures pendant environ 136 ans. Les entiers de Python ne sont pas limités en taille (§3 du cours) : le calcul en Python n'a pas cette limite, mais un programme qui stocke les instants dans des mots de taille fixe doit s'en soucier (chapitre « Représentation des nombres »).</p>
  </div>
</div>
