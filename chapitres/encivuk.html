      <h2>Institutions britanniques</h2>
      <div class="intro">Repères de civilisation pour comprendre et commenter l'actualité britannique : un classique des documents de colle.</div>
      <div class="prop-box"><strong>Régime</strong> : monarchie constitutionnelle, sans constitution écrite codifiée. Chef de l'État = le monarque (rôle symbolique).</div>
      <div class="prop-box"><strong>Parlement</strong> (Westminster) : House of Commons (élue, MPs) + House of Lords (non élue). Chef du gouvernement = le Prime Minister (10 Downing Street).</div>
      <div class="prop-box"><strong>Partis &amp; scrutin</strong> : Conservatives (Tories) vs Labour ; scrutin majoritaire à un tour (first-past-the-post).</div>
      <div class="notice">Le Royaume-Uni réunit quatre nations : England, Scotland, Wales, Northern Ireland (avec une <em>devolution</em> de pouvoirs).</div>
