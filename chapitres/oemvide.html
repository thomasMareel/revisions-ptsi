  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Partie 4.5 « Propagation » du programme de PT, pour l'espace vide de charges et de courants. Les équations de propagation sont établies dans le chapitre « Équations de Maxwell » et rappelées au §1.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

        <li><strong>Équation de d'Alembert</strong> : citer ses solutions à une dimension (§1, §2).</li>
        <li><strong>Onde plane et onde plane progressive</strong> : décrire leur structure dans le vide (transversalité, relation de structure) (§2, §3).</li>

<div class="course-section">
  <div class="sec-num">§1 · ÉQUATIONS DE PROPAGATION</div>
  <h2>Des équations de Maxwell à l'équation de d'Alembert</h2>
  <div class="intro">Loin de toute source, les deux champs s'entretiennent l'un l'autre : une variation temporelle de \(\vec B\) fait naître \(\vec E\) (Maxwell-Faraday) et une variation de \(\vec E\) fait naître \(\vec B\) (Maxwell-Ampère). Ce couplage croisé produit une perturbation qui se propage à vitesse finie : l'onde électromagnétique.</div>

  <h3>Le vide local</h3>
  <div class="def-box">
    On appelle <strong>vide (local)</strong> une région de l'espace dépourvue de charges et de courants : \(\rho = 0\) et \(\vec j = \vec 0\). Les sources de l'onde (antenne, étoile, lampe…) existent, mais <em>ailleurs</em>. Les équations de Maxwell s'y réduisent à :
    $$\operatorname{div}\vec E = 0 \qquad\qquad \operatorname{div}\vec B = 0$$
    $$\overrightarrow{\operatorname{rot}}\,\vec E = -\frac{\partial\vec B}{\partial t} \qquad\qquad \overrightarrow{\operatorname{rot}}\,\vec B = \frac{1}{c^2}\,\frac{\partial\vec E}{\partial t}$$
    avec \(\mu_0\varepsilon_0 c^2 = 1\). On les désigne par (MG), (MΦ), (MF) et (MA).
  </div>

  <h3>Équations de d'Alembert</h3>
  <div class="prop-box">
    Dans le vide local, chacun des deux champs vérifie l'<strong>équation de d'Alembert</strong> :
    $$\vec\Delta\vec E - \frac{1}{c^2}\,\frac{\partial^2\vec E}{\partial t^2} = \vec 0$$
    $$\vec\Delta\vec B - \frac{1}{c^2}\,\frac{\partial^2\vec B}{\partial t^2} = \vec 0$$
    où \(\vec\Delta\) est le laplacien vectoriel (en coordonnées cartésiennes, le laplacien de chaque composante). La célérité des ondes est
    $$c = \frac{1}{\sqrt{\varepsilon_0\,\mu_0}} \approx 3{,}00\times10^{8}\ \text{m·s}^{-1}$$
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir l'équation vérifiée par \(\vec E\), puis celle de \(\vec B\).</span>
    <div class="content">
      <p>On prend le rotationnel de (MF) et on utilise l'identité du double rotationnel :</p>
      <div class="formula">$$\overrightarrow{\operatorname{rot}}\big(\overrightarrow{\operatorname{rot}}\,\vec E\big) = \overrightarrow{\operatorname{grad}}\big(\operatorname{div}\vec E\big) - \vec\Delta\vec E$$ $$= -\vec\Delta\vec E$$</div>
      <p>car \(\operatorname{div}\vec E = 0\) (MG). D'autre part, en permutant les dérivations d'espace et de temps puis en utilisant (MA) :</p>
      <div class="formula">$$\overrightarrow{\operatorname{rot}}\Big(-\frac{\partial\vec B}{\partial t}\Big) = -\frac{\partial}{\partial t}\big(\overrightarrow{\operatorname{rot}}\,\vec B\big)$$ $$= -\frac{1}{c^2}\,\frac{\partial^2\vec E}{\partial t^2}$$</div>
      <p>En égalant : \(\vec\Delta\vec E = \dfrac{1}{c^2}\dfrac{\partial^2\vec E}{\partial t^2}\). Pour \(\vec B\), même démarche en partant du rotationnel de (MA), avec \(\operatorname{div}\vec B = 0\) et (MF).</p>
    </div>
  </div>
  <p>Valeurs : \(\varepsilon_0 \approx 8{,}85\times10^{-12}\ \text{F·m}^{-1}\), \(\mu_0 \approx 4\pi\times10^{-7}\ \text{H·m}^{-1}\). La valeur \(c = 299\,792\,458\ \text{m·s}^{-1}\) est aujourd'hui exacte (elle sert à définir le mètre). Historiquement, retrouver la vitesse de la lumière à partir de constantes purement électriques et magnétiques a permis d'identifier la lumière à une onde électromagnétique.</p>
  <div class="notice">
    <strong>Ce que dit l'équation de d'Alembert… et ce qu'elle ne dit pas.</strong> Elle est <strong>linéaire</strong> (toute combinaison linéaire de solutions est solution : principe de superposition) et <strong>invariante par \(t\to -t\)</strong> (pas de terme de dérivée première : propagation réversible, sans atténuation ni dissipation). En revanche, elle ne contient pas toute l'information : un champ solution de d'Alembert n'est un champ électromagnétique que s'il vérifie aussi (MG), (MΦ) et le couplage (MF). Ce sont ces contraintes supplémentaires qui imposent la <em>structure</em> de l'onde (§3).
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · ONDES PLANES PROGRESSIVES</div>
  <h2>Ondes planes progressives : solutions de d'Alembert</h2>
  <div class="intro">On note \(\xi(M,t)\) l'une quelconque des composantes cartésiennes de \(\vec E\) ou de \(\vec B\) : elle obéit à l'équation de d'Alembert scalaire. On en cherche les solutions les plus simples, qui serviront de « briques » pour décrire toutes les autres.</div>

  <h3>Vocabulaire</h3>
  <div class="def-box">
    <ul style="margin:.2rem 0;padding-left:1.2rem">
      <li>Une <strong>surface d'onde</strong> (ou front d'onde) est, à un instant donné, l'ensemble des points où la grandeur \(\xi\) a la même phase.</li>
      <li>L'onde est <strong>plane</strong> si ses surfaces d'onde sont des plans parallèles entre eux, orthogonaux à une direction fixe repérée par un vecteur unitaire \(\vec u\).</li>
      <li>L'onde est <strong>progressive</strong> si son profil se translate en bloc, sans se déformer, dans le sens de \(\vec u\) à la vitesse \(c\).</li>
    </ul>
  </div>

  <h3>Solution générale à une dimension</h3>
  <div class="prop-box">
    Si \(\xi\) ne dépend que de \(x\) et de \(t\), l'équation \(\dfrac{\partial^2\xi}{\partial x^2} - \dfrac{1}{c^2}\dfrac{\partial^2\xi}{\partial t^2} = 0\) a pour solution générale
    $$\xi(x,t) = f\Big(t - \frac{x}{c}\Big) + g\Big(t + \frac{x}{c}\Big)$$
    où \(f\) et \(g\) sont deux fonctions quelconques (deux fois dérivables). Le terme \(f\) est une onde plane progressive vers les \(x\) croissants (\(\vec u = \vec e_x\)) ; le terme \(g\) est une onde plane progressive vers les \(x\) décroissants (\(\vec u = -\vec e_x\)), dite <strong>régressive</strong>. Écriture équivalente : \(F(x - ct) + G(x + ct)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Changement de variables \(p = t - x/c\), \(q = t + x/c\).</span>
    <div class="content">
      <p>Avec \(\xi(x,t) = \psi(p,q)\), la règle de dérivation composée donne \(\dfrac{\partial}{\partial t} = \dfrac{\partial}{\partial p} + \dfrac{\partial}{\partial q}\) et \(\dfrac{\partial}{\partial x} = \dfrac{1}{c}\Big(\dfrac{\partial}{\partial q} - \dfrac{\partial}{\partial p}\Big)\). Alors :</p>
      <div class="formula">$$\frac{\partial^2\xi}{\partial x^2} - \frac{1}{c^2}\frac{\partial^2\xi}{\partial t^2} = \frac{1}{c^2}\Big[\big(\partial_q - \partial_p\big)^2 - \big(\partial_p + \partial_q\big)^2\Big]\psi$$ $$= -\frac{4}{c^2}\,\frac{\partial^2\psi}{\partial p\,\partial q}$$</div>
      <p>L'équation devient \(\dfrac{\partial^2\psi}{\partial p\,\partial q} = 0\) : \(\dfrac{\partial\psi}{\partial q}\) ne dépend que de \(q\), et en intégrant, \(\psi = f(p) + g(q)\).</p>
    </div>
  </div>
  <p>Lecture physique : avec \(\xi(x,t) = f(t - x/c)\), on a \(\xi(x,t) = \xi(0,\,t - x/c)\). Le point d'abscisse \(x\) rejoue donc exactement ce qui s'est passé en \(x = 0\), avec un retard \(x/c\). Autre point de vue : deux instantanés du profil, pris aux instants \(t_1\) et \(t_2\) se superposent après une translation de \(c\,(t_2 - t_1)\) vers les \(x\) croissants. La forme est conservée, seule sa position change (même un profil dissymétrique garde sa dissymétrie).</p>

  <h3>Direction de propagation quelconque</h3>
  <div class="prop-box">
    Soit \(\vec u\) un vecteur unitaire de composantes \((u_x, u_y, u_z)\). L'onde plane progressive qui avance selon \(\vec u\) s'écrit, avec \(\vec r = \overrightarrow{OM}\) :
    $$\xi(M,t) = f\Big(t - \frac{\vec u\cdot\vec r}{c}\Big)$$
    $$\xi(M,t) = f\Big(t - \frac{u_x x + u_y y + u_z z}{c}\Big)$$
    Ses surfaces d'onde sont les plans d'équation \(\vec u\cdot\vec r = \text{cte}\), tous orthogonaux à \(\vec u\).
  </div>
  <p>Par linéarité, toute superposition d'ondes planes progressives (directions, sens et profils différents) est encore solution. Réciproquement, l'analyse de Fourier permet d'écrire toute solution de d'Alembert comme une telle superposition : les ondes planes progressives servent de « briques » universelles. Exemple : deux OPPM (§4) de même amplitude et de même pulsation, se propageant en sens opposés, donnent une onde <strong>stationnaire</strong>, qui ne progresse pas (exercice 11 ; voir aussi le chapitre « Ondes électromagnétiques et conducteurs »).</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un capteur placé en \(x = 0\) enregistre le signal \(s(t)\) d'une onde plane progressive vers les \(x\) croissants. Qu'enregistre un capteur identique placé en \(x = 900\ \text{m}\) ?</span>
    <div class="content"><p>Comme \(\xi(x,t) = f(t - x/c)\) avec \(f = s\), le second capteur enregistre \(s(t - \tau)\), avec un retard \(\tau = x/c = 900/(3{,}0\times10^8) = 3{,}0\ \mu\text{s}\) : même signal, même forme, décalé dans le temps.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · STRUCTURE DE L'ONDE PLANE PROGRESSIVE</div>
  <h2>Transversalité et relation de structure</h2>
  <div class="intro">L'équation de d'Alembert admet beaucoup de solutions ; les équations de Maxwell en éliminent la plupart. Pour une onde plane progressive dans le vide, \(\vec E\) et \(\vec B\) ne sont pas indépendants : la connaissance de l'un donne l'autre.</div>

  <div class="prop-box">
    <strong>Structure d'une OPP électromagnétique dans le vide</strong> (direction de propagation \(\vec u\)) :
    <ul style="margin:.4rem 0;padding-left:1.2rem">
      <li><strong>Transversalité</strong> : \(\vec E\cdot\vec u = 0\) et \(\vec B\cdot\vec u = 0\) (on écarte les champs statiques uniformes, sans rapport avec l'onde).</li>
      <li><strong>Relation de structure</strong> :</li>
    </ul>
    $$\vec B = \frac{\vec u\wedge\vec E}{c} \qquad\Longleftrightarrow\qquad \vec E = c\,\vec B\wedge\vec u$$
    Conséquences : \(\vec E\perp\vec B\) ; le trièdre \((\vec u, \vec E, \vec B)\) est direct ; \(\|\vec E\| = c\,\|\vec B\|\) en tout point et à chaque instant ; \(\vec E\) et \(\vec B\) varient en phase.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Cas \(\vec u = \vec e_x\) : les champs sont fonctions de \(p = t - x/c\).</span>
    <div class="content">
      <p>Pour une fonction de \(p\), \(\dfrac{\partial}{\partial x} = -\dfrac{1}{c}\dfrac{\mathrm d}{\mathrm dp}\) et \(\dfrac{\partial}{\partial t} = \dfrac{\mathrm d}{\mathrm dp}\) ; on note \('\) la dérivée par rapport à \(p\).</p>
      <p><strong>(MG)</strong> : \(\operatorname{div}\vec E = \partial_x E_x = -E_x'/c = 0\), donc \(E_x\) est constant : c'est un champ statique, nul pour l'onde. De même (MΦ) donne \(B_x = 0\).</p>
      <p><strong>(MF)</strong> : \(\overrightarrow{\operatorname{rot}}\,\vec E\) \(= -\partial_x E_z\,\vec e_y + \partial_x E_y\,\vec e_z\) \(= \dfrac{E_z'}{c}\,\vec e_y - \dfrac{E_y'}{c}\,\vec e_z\), à égaler à \(-\vec B' = -B_y'\,\vec e_y - B_z'\,\vec e_z\).</p>
      <p>D'où \(B_y' = -E_z'/c\) et \(B_z' = E_y'/c\), puis, en intégrant (constantes nulles pour l'onde) : \(\vec B = \dfrac{1}{c}\big(-E_z\,\vec e_y + E_y\,\vec e_z\big) = \dfrac{\vec e_x\wedge\vec E}{c}\).</p>
      <p>La forme réciproque vient du double produit vectoriel, avec \(\vec u\cdot\vec u=1\) et \(\vec u\cdot\vec E=0\) :</p>
      <div class="formula">$$\big(\vec u\wedge\vec E\big)\wedge\vec u = \vec E\,(\vec u\cdot\vec u) - \vec u\,(\vec u\cdot\vec E) = \vec E$$</div>
    </div>
  </div>

  <p>Ordre de grandeur : un champ électrique d'amplitude \(1\ \text{kV·m}^{-1}\) (lumière solaire) s'accompagne d'un champ magnétique de seulement \(3\ \mu\text{T}\), environ quinze fois moins que le champ magnétique terrestre.</p>

  <h3>Conséquence sur la force de Lorentz</h3>
  <p>Une particule de charge \(q\) et de vitesse \(\vec v\) soumise à l'onde subit \(\vec F = q\,\vec E + q\,\vec v\wedge\vec B\). Comme \(\|\vec v\wedge\vec B\|\le vB = vE/c\) :</p>
  <div class="formula">$$\frac{\|\vec F_{m}\|}{\|\vec F_{e}\|} \le \frac{v}{c} \ll 1$$</div>
  <p>pour une particule non relativiste.</p>
  <p>En pratique, la matière (électrons d'une antenne, molécules de la rétine, capteur photosensible…) ne « ressent » que \(\vec F \approx q\,\vec E\). Voilà pourquoi récepteurs et détecteurs réagissent au champ électrique, et pourquoi l'optique décrit la lumière par une « vibration lumineuse » liée à \(\vec E\). Quant à \(\vec B\), la relation de structure le fournit sans calcul supplémentaire.</p>
  <div class="notice"><strong>Attention.</strong> La relation \(\vec B = \vec u\wedge\vec E/c\) concerne <strong>une</strong> onde plane progressive, de direction \(\vec u\) donnée. Elle est fausse pour une superposition d'ondes de directions différentes (onde stationnaire, onde sphérique proche de la source…) : on l'applique alors à chaque onde séparément puis on additionne, ou l'on revient à (MF).</div>

  <h3>Structure d'une onde plane quelconque</h3>
  <p>Une onde <strong>plane</strong> n'est pas forcément progressive : la somme \(f(t-x/c)+g(t+x/c)\) d'une onde progressive et d'une onde régressive dépend encore de \(x\) et \(t\) seulement. La transversalité reste vraie : (MG) donne \(\partial_x E_x=0\), et la composante sur \(\vec e_x\) de (MA) donne \(\dfrac{1}{c^2}\,\partial_t E_x=\partial_y B_z-\partial_z B_y=0\), puisque rien ne dépend de \(y\) ni de \(z\). \(E_x\) est donc constant (champ statique, nul pour l'onde) ; de même \(B_x=0\) par (MΦ) et (MF). En revanche, il n'y a plus de relation de structure globale : elle vaut séparément pour la partie progressive (\(\vec u=\vec e_x\)) et pour la partie régressive (\(\vec u=-\vec e_x\)), et \(\vec B\) n'est plus en phase avec \(\vec E\) (exercice 11).</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · ONDE PLANE PROGRESSIVE MONOCHROMATIQUE</div>
  <h2>OPPM : vecteur d'onde, dispersion, notation complexe</h2>
  <div class="intro">Une onde plane progressive dont le profil est sinusoïdal est dite monochromatique (ou harmonique). Par analyse de Fourier, toute onde est une superposition d'OPPM : c'est l'outil de calcul de base.</div>

  <div class="def-box">
    Une <strong>OPPM</strong> de pulsation \(\omega\), se propageant selon \(\vec u\), a des composantes de la forme
    $$\xi(M,t) = \xi_0\cos\big(\omega t - \vec k\cdot\vec r + \varphi\big)$$
    avec \(\vec k = k\,\vec u\). Le vecteur \(\vec k\) est le <strong>vecteur d'onde</strong> (en \(\text{rad·m}^{-1}\)), \(\xi_0 \gt 0\) l'amplitude et \(\varphi\) la phase à l'origine.
  </div>
  <div class="prop-box">
    <strong>Relation de dispersion du vide.</strong> En reportant l'OPPM dans l'équation de d'Alembert, on obtient \(-k^2 + \omega^2/c^2 = 0\), soit
    $$k = \frac{\omega}{c}$$
    <strong>Vitesse de phase</strong> : vitesse de déplacement des surfaces d'onde (plans de phase constante),
    $$v_\varphi = \frac{\omega}{k} = c$$
    Elle ne dépend pas de \(\omega\) : le vide est un milieu <strong>non dispersif</strong>.
  </div>

  <h3>Double périodicité</h3>
  <p>À \(\vec r\) fixé, l'OPPM est périodique dans le temps ; à \(t\) fixé, elle est périodique dans l'espace, le long de \(\vec u\) :</p>
  <div class="formula">$$T = \frac{2\pi}{\omega} = \frac{1}{\nu} \qquad\quad \lambda = \frac{2\pi}{k} = \frac{1}{\sigma}$$ $$\lambda = c\,T = \frac{c}{\nu}$$</div>
  <p>La fréquence \(\nu\) compte les périodes par seconde ; de même, le nombre d'onde \(\sigma = 1/\lambda\) (en \(\text{m}^{-1}\), notation de l'optique, à ne pas confondre avec la conductivité \(\sigma\) des conducteurs) compte les longueurs d'onde par mètre. La relation \(\lambda = cT\) signifie qu'en une période l'onde avance d'une longueur d'onde.</p>

  <h3>Notation complexe</h3>
  <div class="def-box">
    On associe au champ réel \(\vec E = \operatorname{Re}\big(\underline{\vec E}\big)\) le champ complexe
    $$\underline{\vec E}(M,t) = \underline{\vec E}_0\,e^{\,i(\omega t - \vec k\cdot\vec r)}$$
    où le vecteur complexe \(\underline{\vec E}_0\) contient amplitudes et phases. Les dérivations deviennent des multiplications :
    $$\frac{\partial}{\partial t}\ \to\ i\omega \qquad\qquad \vec\nabla\ \to\ -i\vec k$$
    d'où
    $$\operatorname{div}\to -i\vec k\cdot \qquad \overrightarrow{\operatorname{rot}}\to -i\vec k\wedge \qquad \vec\Delta\to -k^2$$
  </div>
  <div class="prop-box">
    <strong>Équations de Maxwell pour une OPPM dans le vide</strong> :
    $$-i\vec k\cdot\underline{\vec E} = 0 \qquad\qquad -i\vec k\cdot\underline{\vec B} = 0$$
    $$-i\vec k\wedge\underline{\vec E} = -i\omega\,\underline{\vec B} \qquad\qquad -i\vec k\wedge\underline{\vec B} = \frac{i\omega}{c^2}\,\underline{\vec E}$$
    On en lit immédiatement la transversalité et la relation de structure \(\underline{\vec B} = \dfrac{\vec k\wedge\underline{\vec E}}{\omega}\). En reportant celle-ci dans la dernière équation, il vient \(\vec k\wedge(\vec k\wedge\underline{\vec E}) = -\dfrac{\omega^2}{c^2}\,\underline{\vec E}\), et comme \(\vec k\cdot\underline{\vec E}=0\), le membre de gauche vaut \(-k^2\,\underline{\vec E}\) : on retrouve \(k^2 = \omega^2/c^2\). Cette relation impose la norme \(\|\vec k\| = \omega/c\) mais laisse libre l'orientation de \(\vec k\) : changer \(\vec k\) en \(-\vec k\) donne l'onde qui se propage en sens inverse.
  </div>
  <div class="notice"><strong>Convention.</strong> On garde ici la convention \(e^{\,i\omega t}\) de l'électrocinétique et des chapitres voisins (Maxwell, conducteurs). Certains ouvrages écrivent \(e^{\,i(\vec k\cdot\vec r - \omega t)}\) : alors \(\partial/\partial t\to -i\omega\) et \(\vec\nabla\to i\vec k\), et les signes des parties imaginaires (vecteur d'onde ou conductivité complexes) s'inversent. Les résultats physiques (champs réels) sont identiques ; il suffit de rester cohérent dans tout un exercice. Enfin, la notation complexe ne vaut que pour des opérations <strong>linéaires</strong> : pour les grandeurs énergétiques (produits), voir le §7.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Dans le vide, \(\vec E = E_0\cos(\omega t + kz)\,\vec e_y\). Sens de propagation ? Champ \(\vec B\) ?</span>
    <div class="content"><p>La phase \(\omega t + kz\) reste constante si \(z\) diminue quand \(t\) augmente : l'onde progresse vers les \(z\) décroissants, \(\vec u = -\vec e_z\). Relation de structure : \(\vec B = \dfrac{-\vec e_z\wedge E_0\,\vec e_y}{c}\cos(\omega t + kz)\) \(= \dfrac{E_0}{c}\cos(\omega t + kz)\,\vec e_x\), car \(\vec e_z\wedge\vec e_y = -\vec e_x\). Vérification : \((\vec u, \vec E, \vec B) = (-\vec e_z, \vec e_y, \vec e_x)\) est bien direct.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · POLARISATION</div>
  <h2>Polarisation d'une OPPM</h2>
  <div class="intro">Une onde électromagnétique étant transverse, son champ électrique possède deux composantes indépendantes dans le plan d'onde. La façon dont la direction de \(\vec E\) évolue dans ce plan définit l'état de polarisation de l'onde.</div>

  <p>Pour une OPPM se propageant selon \(\vec e_z\), le champ le plus général s'écrit (à un choix d'origine des temps près) :</p>
  <div class="formula">$$E_x = E_{0x}\cos(\omega t - kz)$$ $$E_y = E_{0y}\cos(\omega t - kz - \phi) \qquad E_z = 0$$</div>
  <p>où \(E_{0x}, E_{0y} \ge 0\) sont les amplitudes et \(\phi\) le retard de phase de la composante \(y\) sur la composante \(x\).</p>

  <div class="def-box">
    <strong>Polarisation rectiligne</strong> : \(\phi = 0\) ou \(\phi = \pi\). Les deux composantes sont proportionnelles à chaque instant et \(\vec E\) garde une <strong>direction fixe</strong>, faisant avec \(\vec e_x\) l'angle \(\theta\) tel que \(\tan\theta = \pm E_{0y}/E_{0x}\). On peut alors choisir les axes pour écrire \(\vec E = E_0\cos(\omega t - kz)\,\vec e_x\).
    <br>Le <strong>plan de polarisation</strong> est le plan contenant \(\vec E\) et la direction de propagation. Dans un plan d'onde fixé, l'extrémité de \(\vec E\) parcourt un segment ; à un instant fixé, le long de l'axe, \(\vec E\) dessine une sinusoïde contenue dans ce plan.
  </div>

  <h3>Polarisations circulaire et elliptique (hors programme, pour aller plus loin)</h3>
  <div class="prop-box">
    Dans le cas général, l'extrémité de \(\vec E\) décrit une <strong>ellipse</strong> dans le plan d'onde : polarisation <strong>elliptique</strong>. Elle est <strong>circulaire</strong> si \(E_{0x} = E_{0y}\) et \(\phi = \pm\pi/2\) : \(\|\vec E\|\) est alors constant et \(\vec E\) tourne à la vitesse angulaire \(\omega\).
    <br>Sens de rotation, vu par un observateur qui <strong>reçoit</strong> l'onde : trigonométrique si \(0 \lt \phi \lt \pi\), horaire si \(-\pi \lt \phi \lt 0\). Les qualificatifs « droite » et « gauche » varient d'un ouvrage à l'autre : décrire plutôt le sens observé.
  </div>

  <h3>Lumière naturelle, polariseur, loi de Malus</h3>
  <div class="def-box">
    La lumière émise par le Soleil ou une lampe est une succession de trains d'ondes très brefs dont les polarisations sont aléatoires et indépendantes : elle est dite <strong>non polarisée</strong> (lumière naturelle). Un <strong>polariseur</strong> (par exemple un film dichroïque) transmet la composante de \(\vec E\) parallèle à son axe et absorbe la composante orthogonale : l'onde émergente est polarisée rectilignement selon l'axe.
  </div>
  <div class="prop-box">
    <strong>Loi de Malus.</strong> Une onde polarisée rectilignement d'éclairement \(I_0\) traverse un polariseur parfait dont l'axe fait l'angle \(\alpha\) avec sa direction de polarisation. L'amplitude transmise est \(E_0\cos\alpha\), donc
    $$I = I_0\cos^2\alpha$$
    En lumière naturelle, la moyenne de \(\cos^2\alpha\) sur toutes les directions vaut \(1/2\) : \(I = I_0/2\) quelle que soit l'orientation du polariseur. Deux polariseurs croisés (axes orthogonaux) éteignent la lumière.
  </div>
  <div class="method-box">
    <strong>Exemple — mettre en évidence la polarisation d'un émetteur d'ondes centimétriques</strong>
    <p>En TP, un émetteur à cornet rayonne une onde de fréquence \(f\approx10\ \text{GHz}\) (\(\lambda=3\ \text{cm}\)) ; le récepteur, à diode, délivre un signal proportionnel à l'éclairement reçu. Entre les deux, on place une <strong>grille</strong> de fils métalliques parallèles, espacés de quelques millimètres (bien moins que \(\lambda\)).</p>
    <ol>
      <li>Fils parallèles à \(\vec E\) : le champ met en mouvement les électrons le long des fils, qui se comportent comme un miroir pour cette composante ; le signal transmis s'annule.</li>
      <li>Fils perpendiculaires à \(\vec E\) : les électrons ne peuvent pas suivre le champ sur une longueur notable ; l'onde passe presque sans perte. L'axe de transmission de la grille est donc <strong>perpendiculaire</strong> aux fils (piège classique).</li>
      <li>En tournant la grille d'un angle \(\alpha\) à partir de la position de transmission maximale, le signal suit \(\cos^2\alpha\) (loi de Malus) et s'annule deux fois par tour : l'onde émise est polarisée rectilignement. Avec une lumière naturelle, aucune extinction n'apparaîtrait.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un polariseur, utilisé comme « analyseur », fait un tour complet devant un faisceau. Trois relevés sont possibles : (a) l'éclairement transmis s'annule pour deux positions opposées ; (b) il ne varie pas du tout ; (c) il oscille entre un maximum et un minimum non nul. Que conclure dans chaque cas ?</span>
    <div class="content"><p>(a) Pour l'orientation d'extinction, la projection de \(\vec E\) sur l'axe est nulle à chaque instant : \(\vec E\) garde une direction fixe, orthogonale à cet axe. L'onde est polarisée rectilignement.</p><p>(b) Aucune direction n'est privilégiée : l'onde peut être naturelle ou polarisée circulairement (un vecteur qui tourne à norme constante a la même valeur efficace de projection sur tout axe). L'analyseur seul ne permet pas de trancher.</p><p>(c) Une direction est privilégiée, mais sans extinction : polarisation elliptique, ou mélange de lumière naturelle et de lumière polarisée (lumière partiellement polarisée).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉNERGIE ÉLECTROMAGNÉTIQUE</div>
  <h2>Énergie transportée par une onde plane</h2>
  <div class="intro">Une onde transporte de l'énergie sans transporter de matière : c'est ainsi que le Soleil chauffe la Terre et qu'une antenne alimente un récepteur. On applique ici les outils énergétiques des équations de Maxwell à l'onde plane progressive.</div>

  <div class="def-box">
    Rappels : la <strong>densité volumique d'énergie électromagnétique</strong> (\(\text{J·m}^{-3}\)) et le <strong>vecteur de Poynting</strong> (\(\text{W·m}^{-2}\)) sont
    $$u_{em} = \frac{\varepsilon_0E^2}{2} + \frac{B^2}{2\mu_0} \qquad\qquad \vec\Pi = \frac{\vec E\wedge\vec B}{\mu_0}$$
    La puissance qui traverse une surface \(S\) orientée par \(\vec n\) est le flux \(P = \displaystyle\iint_S \vec\Pi\cdot\vec n\,\mathrm dS\). (Le vecteur de Poynting est noté \(\vec R\) dans certains ouvrages.)
  </div>
  <div class="prop-box">
    <strong>Pour une OPP dans le vide</strong>, \(B = E/c\) entraîne l'<strong>équipartition</strong> de l'énergie entre les deux champs :
    $$\frac{\varepsilon_0E^2}{2} = \frac{B^2}{2\mu_0} \qquad\text{d'où}\qquad u_{em} = \varepsilon_0E^2 = \frac{B^2}{\mu_0}$$
    et, avec \(\vec E\wedge(\vec u\wedge\vec E) = E^2\,\vec u\) (car \(\vec E\perp\vec u\)) :
    $$\vec\Pi = \frac{E^2}{\mu_0c}\,\vec u = \varepsilon_0c\,E^2\,\vec u = c\,u_{em}\,\vec u$$
    L'énergie se propage dans la direction et le sens de l'onde.
  </div>

  <h3>Vitesse de propagation de l'énergie</h3>
  <p>On note \(v_e\) la vitesse à laquelle l'énergie progresse selon \(\vec u\), et l'on considère une aire \(S\) perpendiculaire à \(\vec u\). L'énergie qui franchit \(S\) durant \(\mathrm dt\), soit \(\Pi\,S\,\mathrm dt\), se trouvait juste avant dans la tranche d'épaisseur \(v_e\,\mathrm dt\) située en amont de \(S\), qui en contient \(u_{em}\,S\,v_e\,\mathrm dt\). En égalant ces deux quantités :</p>
  <div class="formula">$$v_e = \frac{\|\vec\Pi\|}{u_{em}} = c = v_\varphi$$</div>
  <p>Dans le vide, l'énergie avance à la même vitesse que la phase. (Pour une OPPM on raisonne sur les valeurs moyennes, avec le même résultat.)</p>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Bilan local</span>
    <span class="prompt">Vérifier que l'onde plane progressive \(\vec E=f(t-x/c)\,\vec e_y\) satisfait le bilan local de Poynting du vide, \(\partial_t u_{em}+\operatorname{div}\vec\Pi=0\).</span>
    <div class="content"><p>Relation de structure : \(\vec B=\dfrac{f}{c}\,\vec e_z\), donc \(u_{em}=\varepsilon_0f^2\) et \(\vec\Pi=\dfrac{f^2}{\mu_0c}\,\vec e_x=\varepsilon_0c\,f^2\,\vec e_x\). Avec \(p=t-x/c\) : \(\partial_t u_{em}=2\varepsilon_0ff'\) et \(\operatorname{div}\vec\Pi=\partial_x(\varepsilon_0cf^2)\), soit \(\operatorname{div}\vec\Pi=-2\varepsilon_0ff'\) (car \(\partial_x p=-1/c\)). La somme est nulle : l'énergie qui disparaît d'un endroit est exactement celle qui en sort, sans échange avec la matière (\(\vec j=\vec 0\)).</p></div>
  </div>

  <h3>Moyennes temporelles pour une OPPM</h3>
  <p>Aucun détecteur optique (œil, photodiode, capteur d'appareil photo) ne peut suivre des oscillations à \(10^{14}\)–\(10^{15}\ \text{Hz}\) : il ne mesure que des <strong>moyennes temporelles</strong>. En radio aussi, c'est la puissance moyenne reçue qui compte dans les bilans. Avec \(\langle\cos^2(\omega t - kz)\rangle = 1/2\), pour une OPPM polarisée rectilignement d'amplitude \(E_0\) :</p>
  <div class="prop-box">
    $$\langle u_{em}\rangle = \frac{\varepsilon_0E_0^2}{2} \qquad\qquad \langle\vec\Pi\rangle = \frac{\varepsilon_0c\,E_0^2}{2}\,\vec u = \frac{E_0^2}{2\mu_0c}\,\vec u$$
    En notation complexe (champs de même pulsation) :
    $$\langle\vec\Pi\rangle = \frac{1}{2\mu_0}\operatorname{Re}\big(\underline{\vec E}\wedge\underline{\vec B}^{*}\big)$$
    $$\langle u_{em}\rangle = \frac{\varepsilon_0}{4}\,\underline{\vec E}\cdot\underline{\vec E}^{*} + \frac{1}{4\mu_0}\,\underline{\vec B}\cdot\underline{\vec B}^{*}$$
  </div>
  <div class="notice"><strong>Piège.</strong> Une grandeur énergétique est <strong>quadratique</strong> : \(\operatorname{Re}(\underline a)\operatorname{Re}(\underline b)\ne\operatorname{Re}(\underline a\,\underline b)\). On calcule soit en réel (revenir aux champs réels avant de multiplier), soit avec la formule \(\tfrac12\operatorname{Re}(\underline a\,\underline b^{*})\), qui donne directement une <strong>moyenne</strong>. Jamais \(\underline{\vec E}\wedge\underline{\vec B}/\mu_0\) tel quel.</div>

  <h3>Éclairement</h3>
  <div class="def-box">
    L'<strong>éclairement</strong> (ou intensité, noté \(I\) ou \(\mathcal E\)) mesure la puissance moyenne qui arrive sur un écran, par unité d'aire, l'écran étant placé perpendiculairement à la direction de propagation :
    $$I = \|\langle\vec\Pi\rangle\| = \frac{\varepsilon_0c}{2}\,E_0^2$$
    $$I = \frac{\varepsilon_0c}{2}\,\underline{\vec E}\cdot\underline{\vec E}^{*}$$
    Seul compte le <strong>carré de l'amplitude</strong>. Pour une polarisation quelconque, les deux composantes transverses s'ajoutent en énergie : \(I = \dfrac{\varepsilon_0c}{2}\big(E_{0x}^2 + E_{0y}^2\big)\), quel que soit leur déphasage, donc quel que soit l'état de polarisation.
  </div>
  <p>Ordres de grandeur (\(\mu_0c \approx 377\ \Omega\), « impédance du vide », d'où \(I = E_0^2/(2\times377\ \Omega)\)) :</p>
  <ul>
    <li>Soleil au sommet de l'atmosphère : \(I \approx 1{,}4\ \text{kW·m}^{-2}\), soit \(E_0 \approx 1\ \text{kV·m}^{-1}\) et \(B_0 \approx 3\ \mu\text{T}\).</li>
    <li>Téléphone rayonnant 1 W dans toutes les directions, à 1 m : \(I \approx 0{,}08\ \text{W·m}^{-2}\), \(E_0 \approx 8\ \text{V·m}^{-1}\).</li>
    <li>Box Wi-Fi de 0,1 W, à 2 m : \(I \approx 2\ \text{mW·m}^{-2}\), \(E_0 \approx 1\ \text{V·m}^{-1}\).</li>
  </ul>
  <div class="method-box">
    <strong>Exemple — champs dans le faisceau d'un pointeur laser</strong>
    <p>Pointeur de puissance \(P = 1\ \text{mW}\), faisceau de 1 mm de diamètre, assimilé localement à une OPPM polarisée rectilignement.</p>
    <ol>
      <li>Éclairement : \(I = \dfrac{P}{\pi d^2/4} = \dfrac{10^{-3}}{7{,}9\times10^{-7}} \approx 1{,}3\ \text{kW·m}^{-2}\), comparable au Soleil, mais concentré sur 1 mm² : d'où le danger pour l'œil, qui le focalise encore.</li>
      <li>Amplitude du champ électrique : \(E_0 = \sqrt{\dfrac{2I}{\varepsilon_0 c}} = \sqrt{2\times1\,300\times377} \approx 1\ \text{kV·m}^{-1}\).</li>
      <li>Champ magnétique : \(B_0 = E_0/c \approx 3\ \text{µT}\), une quinzaine de fois moins que le champ terrestre : la force magnétique sur un électron du milieu (\(evB\), avec \(v \ll c\)) est négligeable devant la force électrique \(eE\).</li>
      <li>Densité d'énergie moyenne : \(\langle u\rangle = I/c \approx 4\times10^{-6}\ \text{J·m}^{-3}\).</li>
    </ol>
  </div>

</div>

<div class="course-section">
  <div class="sec-num">§8 · LIMITES DU MODÈLE</div>
  <h2>Paquets d'ondes et ondes sphériques</h2>
  <div class="intro">L'OPPM est un modèle commode mais irréaliste : elle remplit tout l'espace, depuis toujours et pour toujours. Il faut savoir en quoi les ondes réelles en diffèrent, et quand le modèle reste légitime.</div>

  <h3>Paquet d'ondes</h3>
  <p>Une OPPM n'a ni début ni fin, et son amplitude est la même dans tout le plan d'onde : sommée sur tout l'espace, son énergie serait infinie. Une onde réelle est émise pendant une durée finie (train d'ondes) et occupe une section finie (faisceau).</p>
  <div class="def-box">
    Par analyse de Fourier, un signal de durée finie \(\Delta t\) s'écrit comme une somme continue d'OPPM, dont les pulsations ne sont notables que dans une bande de largeur \(\Delta\omega\) centrée sur \(\omega_0\) : c'est un <strong>paquet d'ondes</strong>, d'énergie finie. Plus le signal est bref, plus son spectre est étalé :
    $$\Delta\omega\,\Delta t \sim 2\pi \qquad\text{soit}\qquad \Delta\nu\,\Delta t \sim 1$$
    Une onde « quasi monochromatique » (\(\Delta\nu \ll \nu_0\)) est donc un train d'ondes qui contient un grand nombre de périodes.
  </div>
  <div class="prop-box">
    Dans le vide, toutes les composantes du paquet avancent à la même vitesse \(c\) (milieu <strong>non dispersif</strong>) : le paquet garde sa forme et se déplace à la vitesse \(c\). Dans un milieu dispersif (plasma, verre…), les composantes se décalent les unes par rapport aux autres : l'enveloppe se déforme et avance à la vitesse de groupe, différente de la vitesse de phase.
  </div>

  <h3>Onde sphérique</h3>
  <div class="prop-box">
    Une source ponctuelle placée en \(O\) et rayonnant de façon isotrope émet, à grande distance, une onde dont chaque composante est de la forme
    $$\xi(r,t) = \frac{A}{r}\,f\Big(t - \frac{r}{c}\Big)$$
    (onde sphérique divergente : surfaces d'onde = sphères de centre \(O\), propagation selon \(\vec e_r\)). L'amplitude décroît en \(1/r\), donc \(\langle\Pi\rangle\) en \(1/r^2\) ; ainsi la puissance moyenne \(\langle\Pi\rangle\,4\pi r^2\) à travers une sphère de rayon \(r\) est la même pour tout \(r\). Rien n'est absorbé : la même puissance se répartit simplement sur des sphères de plus en plus grandes (décroissance <strong>géométrique</strong>).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Pourquoi \(1/r\) ? On admet que, pour une fonction de \(r\) seul, \(\Delta\xi = \dfrac{1}{r}\dfrac{\partial^2(r\xi)}{\partial r^2}\).</span>
    <div class="content"><p>L'équation de d'Alembert devient \(\dfrac{\partial^2(r\xi)}{\partial r^2} - \dfrac{1}{c^2}\dfrac{\partial^2(r\xi)}{\partial t^2} = 0\) : la fonction \(r\xi\) obéit à l'équation à une dimension, donc \(r\xi = f(t - r/c) + g(t + r/c)\). Le terme \(f\) est l'onde divergente, \(g\) une onde convergente vers \(O\). On vérifie que ce facteur \(1/r\) est précisément celui qui rend égales les puissances traversant deux sphères concentriques quelconques.</p></div>
  </div>

  <h3>Approximation d'onde plane locale</h3>
  <div class="prop-box">
    Loin de la source, sur une zone de taille \(a\) petite devant la distance \(r\) à la source, l'onde sphérique est <strong>localement plane</strong> :
    <ul style="margin:.4rem 0;padding-left:1.2rem">
      <li>son amplitude y est quasi uniforme : variation relative \(\sim a/r \ll 1\) ;</li>
      <li>la sphère d'onde s'écarte peu de son plan tangent : sur un disque de diamètre \(a\), l'écart maximal vaut \(\delta \approx a^2/(8r)\), à comparer à \(\lambda\) (il faut \(\delta \ll \lambda\)).</li>
    </ul>
    On y applique alors tous les résultats de l'OPP avec \(\vec u = \vec e_r\) : \(\vec B = \vec e_r\wedge\vec E/c\), équipartition, \(\vec\Pi = c\,u_{em}\,\vec e_r\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">La lumière solaire reçue sur un banc d'optique de 2 m est-elle une onde plane ?</span>
    <div class="content"><p>\(r \approx 1{,}5\times10^{11}\ \text{m}\) : \(a/r \sim 10^{-11}\) et \(\delta \approx 4/(1{,}2\times10^{12}) \approx 3\times10^{-12}\ \text{m}\), très petit devant \(\lambda \approx 0{,}5\ \mu\text{m}\). Pour un point du Soleil, le modèle d'onde plane est excellent (la taille apparente du Soleil, environ 0,5°, fait en revanche que la lumière reçue est une superposition d'ondes planes de directions légèrement différentes).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · ONDES ÉLECTROMAGNÉTIQUES DANS LE VIDE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à établir l'équation de propagation, à lire une onde plane progressive (direction, sens, polarisation), à en déduire le champ magnétique, à travailler en notation complexe, à analyser une polarisation avec un polariseur et à évaluer l'énergie transportée. Convention du cours : \(\underline{\vec E}=\underline{\vec E}_0\,e^{i(\omega t-\vec k\cdot\vec r)}\).</div>

  <div class="method-box">
    <strong>Méthode 1 — Établir l'équation de propagation d'un champ</strong>
    <ol>
      <li><span class="step">Écrire Maxwell</span> dans la région étudiée en précisant les hypothèses (vide local : \(\rho = 0\), \(\vec j = \vec 0\)).</li>
      <li><span class="step">Prendre le rotationnel</span> de (MF) pour \(\vec E\), de (MA) pour \(\vec B\).</li>
      <li><span class="step">Développer</span> le double rotationnel, \(\overrightarrow{\operatorname{grad}}(\operatorname{div}\vec X) - \vec\Delta\vec X\), et utiliser l'équation de divergence nulle.</li>
      <li><span class="step">Permuter</span> \(\overrightarrow{\operatorname{rot}}\) et \(\partial/\partial t\) (variables indépendantes), puis remplacer par l'autre équation de Maxwell.</li>
      <li><span class="step">Identifier</span> la forme de d'Alembert et la célérité \(c = 1/\sqrt{\varepsilon_0\mu_0}\) ; vérifier l'homogénéité.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(\varepsilon_0=8{,}854\times10^{-12}\ \text{F·m}^{-1}\) et \(\mu_0=4\pi\times10^{-7}\ \text{H·m}^{-1}\), \(\varepsilon_0\mu_0\approx1{,}113\times10^{-17}\ \text{s}^2\text{·m}^{-2}\), d'où \(c=1/\sqrt{\varepsilon_0\mu_0}\approx3{,}00\times10^{8}\ \text{m·s}^{-1}\) : en unités, \(\text{F·m}^{-1}\times\text{H·m}^{-1}=\text{s}^2\text{·m}^{-2}\), car \(\text{F}\times\text{H}=\text{s}^2\) (\(RC\) et \(L/R\) sont des temps).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Reconnaître une onde plane progressive, sa direction et son sens</strong>
    <ol>
      <li>Écrire la dépendance spatio-temporelle sous la forme \(f(t - \vec u\cdot\vec r/c)\) ou, pour une OPPM, \(\cos(\omega t - \vec k\cdot\vec r + \varphi)\).</li>
      <li>Surfaces d'onde : à \(t\) fixé, phase constante \(\Leftrightarrow \vec k\cdot\vec r = \text{cte}\) : plans orthogonaux à \(\vec k\). L'onde est plane.</li>
      <li>Sens : chercher comment doit varier la position pour garder une phase constante quand \(t\) augmente. \(\omega t - kz\) : vers les \(z\) croissants ; \(\omega t + kz\) : vers les \(z\) décroissants.</li>
      <li>Vérifier \(\omega/k = c\) (sinon ce n'est pas une onde dans le vide, ou l'énoncé est faux).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec E=E_0\cos(1{,}2\times10^{10}\,t+40\,y)\,\vec e_z\) (SI) avance selon \(-\vec e_y\) et vibre selon \(\vec e_z\) ; \(\omega/k=3{,}0\times10^{8}\ \text{m·s}^{-1}\) (vide), \(f=\omega/2\pi\approx1{,}9\ \text{GHz}\) et \(\lambda=2\pi/k\approx16\ \text{cm}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le sens de propagation se lit dans la <em>phase</em>, la polarisation sur le <em>vecteur</em> placé devant le cosinus. Pour une onde plane dans le vide, ces deux directions sont toujours perpendiculaires.</div>

  <div class="method-box">
    <strong>Méthode 3 — Déterminer \(\vec B\) connaissant \(\vec E\)</strong>
    <ol>
      <li><span class="step">Une seule OPP (ou OPPM) dans le vide ?</span> Relation de structure : \(\vec B = \dfrac{\vec u\wedge\vec E}{c}\) ou, en complexe, \(\underline{\vec B} = \dfrac{\vec k\wedge\underline{\vec E}}{\omega}\). Contrôler le trièdre direct \((\vec u,\vec E,\vec B)\) et \(B = E/c\).</li>
      <li><span class="step">Superposition d'ondes</span> de directions ou de sens différents : appliquer la relation à chaque onde, puis sommer.</li>
      <li><span class="step">Champ quelconque</span> (onde stationnaire, champ donné sans décomposition évidente) : calculer \(\overrightarrow{\operatorname{rot}}\,\vec E\), puis obtenir \(\vec B\) comme primitive en temps de \(\partial_t\vec B = -\overrightarrow{\operatorname{rot}}\,\vec E\) (en complexe, diviser par \(-i\omega\)). Ne pas ajouter de partie statique, étrangère à l'onde.</li>
      <li><span class="step">Contrôle</span> : \(\operatorname{div}\vec B = 0\), et éventuellement (MA).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec E=E_0\cos(\omega t-kx)\,\vec e_z\) avec \(E_0=6{,}0\ \text{V·m}^{-1}\) : \(\vec u=\vec e_x\) et \(\vec e_x\wedge\vec e_z=-\vec e_y\), donc \(\vec B=-\dfrac{E_0}{c}\cos(\omega t-kx)\,\vec e_y\), d'amplitude \(20\ \text{nT}\). Trièdre \((\vec e_x,\vec e_z,-\vec e_y)\) : direct.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Travailler en notation complexe (OPPM)</strong>
    <ol>
      <li>Écrire \(\underline{\vec E} = \underline{\vec E}_0\,e^{\,i(\omega t - \vec k\cdot\vec r)}\) en annonçant la convention.</li>
      <li>Remplacer \(\partial/\partial t\) par \(i\omega\) et \(\vec\nabla\) par \(-i\vec k\) dans les équations de Maxwell.</li>
      <li>Lire : \(\vec k\cdot\underline{\vec E} = 0\) (transversalité), \(\underline{\vec B} = \vec k\wedge\underline{\vec E}/\omega\) (structure), \(k^2 = \omega^2/c^2\) (dispersion).</li>
      <li>Revenir aux champs réels par \(\vec E = \operatorname{Re}(\underline{\vec E})\) <strong>avant</strong> tout produit, ou utiliser les moyennes en \(\tfrac12\operatorname{Re}(\underline a\,\underline b^{*})\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec k=\dfrac{k}{\sqrt2}(\vec e_x+\vec e_z)\) et \(\underline{\vec E}=E_0\,e^{i(\omega t-\vec k\cdot\vec r)}\,\vec e_y\) : \(\vec k\cdot\vec e_y=0\), transversalité vérifiée ; comme \((\vec e_x+\vec e_z)\wedge\vec e_y=\vec e_z-\vec e_x\), \(\underline{\vec B}=\dfrac{\vec k\wedge\underline{\vec E}}{\omega}\) vaut \(\dfrac{E_0}{c\sqrt2}\,(\vec e_z-\vec e_x)\,e^{i(\omega t-\vec k\cdot\vec r)}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Vérifier qu'un champ proposé est un champ électromagnétique</strong>
    <ol>
      <li><span class="step">Ne pas s'arrêter à d'Alembert</span> : une solution de l'équation de propagation n'est un champ électromagnétique que si elle vérifie aussi les quatre équations de Maxwell.</li>
      <li><span class="step">Tester (MG) et (MΦ)</span> : divergences nulles dans le vide (transversalité pour une onde plane).</li>
      <li><span class="step">Tester (MF) et (MA)</span> avec le couple \((\vec E,\vec B)\) proposé : ils fixent le rapport des amplitudes et la relation de dispersion.</li>
      <li><span class="step">Conclure</span> : champ possible, impossible, ou possible seulement avec des sources (alors \(\rho=\varepsilon_0\operatorname{div}\vec E\), \(\vec j\) tiré de (MA)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec E=E_0\cos(\omega t-kz)\,\vec e_z\) donne \(\operatorname{div}\vec E=kE_0\sin(\omega t-kz)\neq0\) : dans le vide, (MG) est violée. Une onde plane électromagnétique ne peut pas être longitudinale.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Identifier un état de polarisation</strong>
    <ol>
      <li>Écrire les deux composantes transverses avec la même forme de phase : \(E_{0x}\cos(\omega t - kz)\) et \(E_{0y}\cos(\omega t - kz - \phi)\) (transformer un \(\sin\) en \(\cos(\cdot - \pi/2)\), un signe moins en déphasage de \(\pi\)).</li>
      <li>\(\phi = 0\) ou \(\pi\) : polarisation <strong>rectiligne</strong> (seul cas exigible), de direction \(\tan\theta=\pm E_{0y}/E_{0x}\).</li>
      <li>Hors programme : \(E_{0x} = E_{0y}\) et \(\phi = \pm\pi/2\) : circulaire ; sinon elliptique. Sens de rotation : comparer \(\vec E\) à \(t=0\) et à \(t=T/4\) dans un plan d'onde, pour un observateur qui reçoit l'onde.</li>
      <li>Plan de polarisation : le plan qui contient \(\vec E\) (rectiligne) et la direction de propagation.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\vec E=E_0\cos(\omega t-kz)\,(\vec e_x-2\,\vec e_y)\) : les deux composantes sont en opposition de phase, la polarisation est rectiligne selon \(\vec e_x-2\vec e_y\), à \(63^\circ\) de \(\vec e_x\) (vers \(-\vec e_y\)), d'amplitude \(\sqrt5\,E_0\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Utiliser un polariseur : loi de Malus et mise en évidence</strong>
    <ol>
      <li>Projeter \(\vec E\) sur l'axe du polariseur : l'onde transmise est polarisée selon cet axe, d'amplitude \(E_0\cos\alpha\).</li>
      <li>Rectiligne : \(I = I_0\cos^2\alpha\) ; lumière naturelle : \(I = I_0/2\) quelle que soit l'orientation. Pour une chaîne, appliquer Malus <strong>successivement</strong>.</li>
      <li>Mettre en évidence une polarisation rectiligne : faire tourner un analyseur devant le faisceau ; deux extinctions par tour \(\Leftrightarrow\) polarisation rectiligne (orthogonale à l'axe d'extinction).</li>
      <li>Ondes centimétriques : la grille de fils transmet la composante de \(\vec E\) <strong>perpendiculaire</strong> aux fils (axe de transmission orthogonal aux fils).</li>
    </ol>
    <p><em>Exemple éclair :</em> une onde polarisée rectilignement d'éclairement \(50\ \text{W·m}^{-2}\) traverse un polariseur à \(30^\circ\) de sa polarisation : \(I_1=50\cos^2 30^\circ=37{,}5\ \text{W·m}^{-2}\) ; puis un second polariseur à \(60^\circ\) du premier : \(I_2=37{,}5\cos^2 60^\circ\approx9{,}4\ \text{W·m}^{-2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Calculer une grandeur énergétique moyenne</strong>
    <ol>
      <li>Obtenir \(\vec E\) et \(\vec B\) <strong>réels</strong> (ou complexes si l'on utilise les formules de moyenne).</li>
      <li>Former \(\vec\Pi = \vec E\wedge\vec B/\mu_0\) et \(u_{em}\), puis moyenner avec \(\langle\cos^2\rangle = \langle\sin^2\rangle = 1/2\) et \(\langle\cos\cdot\sin\rangle = 0\) (mêmes arguments).</li>
      <li>Puissance : flux de \(\langle\vec\Pi\rangle\) à travers la surface (seule compte la projection sur la normale).</li>
      <li>Contrôles pour une OPP dans le vide : équipartition, \(\|\langle\vec\Pi\rangle\|=c\,\langle u_{em}\rangle\) (énergie avançant à \(c\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> OPPM d'amplitude \(E_0=100\ \text{V·m}^{-1}\) : \(\langle\Pi\rangle=\dfrac{\varepsilon_0cE_0^2}{2}\approx13\ \text{W·m}^{-2}\) et \(\langle u_{em}\rangle=\dfrac{\varepsilon_0E_0^2}{2}\approx4{,}4\times10^{-8}\ \text{J·m}^{-3}\), dont le rapport vaut bien \(c\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Passer de la puissance d'une source au champ (ordres de grandeur)</strong>
    <ol>
      <li>Source isotrope de puissance moyenne \(P\), sans absorption : \(\langle\Pi\rangle(r) = \dfrac{P}{4\pi r^2}\) (même puissance à travers toute sphère).</li>
      <li>Amplitude : \(E_0 = \sqrt{2\mu_0c\,\langle\Pi\rangle}\), avec \(\mu_0c \approx 377\ \Omega\) ; puis \(B_0 = E_0/c\).</li>
      <li>Puissance captée par un récepteur d'aire \(S\) orthogonale à la propagation : \(\langle\Pi\rangle S\).</li>
      <li>Justifier l'onde plane locale : taille \(a\) du récepteur petite devant \(r\), et \(a^2/(8r)\ll\lambda\).</li>
    </ol>
    <p><em>Exemple éclair :</em> antenne de 20 W supposée isotrope, à 50 m : \(\langle\Pi\rangle=\dfrac{20}{4\pi\times50^2}\approx6{,}4\times10^{-4}\ \text{W·m}^{-2}\) et \(E_0\approx\sqrt{2\times377\times6{,}4\times10^{-4}}\approx0{,}7\ \text{V·m}^{-1}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 10 — Situer une onde dans le spectre et juger le modèle de l'OPPM</strong>
    <ol>
      <li>Convertir : \(\lambda=c/\nu\) ; repères \(1\ \text{GHz}\leftrightarrow30\ \text{cm}\) et \(600\ \text{THz}\leftrightarrow500\ \text{nm}\).</li>
      <li>Nommer le domaine (radio, micro-ondes, infrarouge, visible de 400 à 750 nm, ultraviolet, X, \(\gamma\)) et lui associer une application.</li>
      <li>Quasi-monochromatique ? Comparer la largeur spectrale \(\Delta\nu\) à \(\nu_0\) ; durée d'un train d'ondes \(\Delta t\sim1/\Delta\nu\), longueur \(c\,\Delta t\).</li>
      <li>Onde plane ? Comparer les dimensions du faisceau ou du récepteur à la distance à la source (méthode 9).</li>
    </ol>
    <p><em>Exemple éclair :</em> laser hélium-néon, \(\lambda=633\ \text{nm}\) (rouge), \(\nu_0\approx4{,}7\times10^{14}\ \text{Hz}\), largeur \(\Delta\nu\approx1{,}5\ \text{GHz}\) : \(\Delta\nu/\nu_0\approx3\times10^{-6}\), trains d'ondes de \(\approx0{,}7\ \text{ns}\), soit \(\approx20\ \text{cm}\) : le modèle de l'OPPM est excellent à l'échelle d'un banc d'optique.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul>
      <li>Utiliser \(\vec B = \vec u\wedge\vec E/c\) pour une onde stationnaire ou pour une somme d'ondes de directions différentes : cette relation est propre à <em>chaque</em> onde plane progressive.</li>
      <li>Former \(\vec\Pi\) ou \(u_{em}\) directement avec les champs complexes, ou perdre le facteur \(1/2\) des moyennes.</li>
      <li>Se tromper de signe dans \(\vec u\) pour une onde régressive (\(\omega t + kz\Rightarrow\vec u = -\vec e_z\)), ce qui inverse \(\vec B\).</li>
      <li>Oublier que l'éclairement d'une onde quelconque est la <strong>somme</strong> des contributions des deux composantes transverses, indépendamment de leurs phases.</li>
      <li>Croire que l'amplitude d'une onde sphérique décroît par absorption : dans le vide, la décroissance en \(1/r\) est purement géométrique.</li>
      <li>Confondre fréquence \(\nu\) et pulsation \(\omega = 2\pi\nu\) dans les applications numériques (facteur 6 d'erreur sur \(k\) ou \(\lambda\)).</li>
    </ul>
  </div>
</div>
</template>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Lire une onde plane progressive monochromatique</h3>
  <div class="statement">Dans le vide, une onde électromagnétique a pour champ électrique (unités SI) :
    $$\vec E(M,t) = E_0\cos\big(6{,}0\times10^{9}\,\pi\,t - 20\pi\,y\big)\,\vec e_x$$
    avec \(E_0 = 12\ \text{V·m}^{-1}\). Données : \(c = 3{,}0\times10^{8}\ \text{m·s}^{-1}\), \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Préciser la direction et le sens de propagation, la fréquence, la longueur d'onde et le domaine du spectre. Vérifier la relation de dispersion.</div>
  <div class="q"><strong>Q2.</strong> Quel est l'état de polarisation ? Quel est le plan de polarisation ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(\vec B(M,t)\) et son amplitude.</div>
  <div class="q"><strong>Q4.</strong> Calculer le vecteur de Poynting moyen et la puissance moyenne traversant un carré de 10 cm de côté placé orthogonalement à la propagation.</div>
  <div class="q"><strong>Q5.</strong> Calculer \(\langle u_{em}\rangle\) et vérifier que l'énergie se propage à la vitesse \(c\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La phase est de la forme \(\omega t - ky\) avec \(\omega = 6{,}0\times10^{9}\pi\ \text{rad·s}^{-1}\) et \(k = 20\pi\ \text{rad·m}^{-1}\) : l'onde est plane (plans \(y = \text{cte}\)) et progresse vers les \(y\) croissants, \(\vec u = \vec e_y\). Fréquence \(\nu = \omega/2\pi = 3{,}0\ \text{GHz}\) ; longueur d'onde \(\lambda = 2\pi/k = 0{,}10\ \text{m}\) : micro-ondes. Dispersion : \(\omega/k = 6{,}0\times10^{9}\pi/20\pi\) \(= 3{,}0\times10^{8}\ \text{m·s}^{-1}\) \(= c\). ✓</p>
    <p><strong>Q2.</strong> \(\vec E\) garde la direction fixe \(\vec e_x\) : polarisation rectiligne selon \(\vec e_x\). Le plan de polarisation contient \(\vec E\) et \(\vec u\) : c'est le plan \((xOy)\).</p>
    <p><strong>Q3.</strong> Relation de structure : \(\vec B = \dfrac{\vec e_y\wedge\vec E}{c}\) \(= \dfrac{E_0}{c}\cos(\omega t - ky)\,(\vec e_y\wedge\vec e_x)\) \(= -\dfrac{E_0}{c}\cos(\omega t - ky)\,\vec e_z\). Amplitude \(B_0 = 12/(3{,}0\times10^{8}) = 4{,}0\times10^{-8}\ \text{T}\). Contrôle : \((\vec e_y, \vec e_x, -\vec e_z)\) est direct.</p>
    <p><strong>Q4.</strong> \(\vec\Pi = \dfrac{\vec E\wedge\vec B}{\mu_0}\) \(= \dfrac{E_0^2}{\mu_0c}\cos^2(\omega t - ky)\,\big(\vec e_x\wedge(-\vec e_z)\big)\) \(= \dfrac{E_0^2}{\mu_0c}\cos^2(\omega t - ky)\,\vec e_y\). En moyenne : \(\langle\vec\Pi\rangle = \dfrac{\varepsilon_0cE_0^2}{2}\,\vec e_y\), soit \(\dfrac{8{,}85\times10^{-12}\times3{,}0\times10^{8}\times144}{2}\) \(\approx 0{,}19\ \text{W·m}^{-2}\). Sur \(S = 1{,}0\times10^{-2}\ \text{m}^2\) : \(\langle P\rangle \approx 1{,}9\ \text{mW}\).</p>
    <p><strong>Q5.</strong> \(\langle u_{em}\rangle = \dfrac{\varepsilon_0E_0^2}{2}\) \(= 8{,}85\times10^{-12}\times72\) \(\approx 6{,}4\times10^{-10}\ \text{J·m}^{-3}\). Alors \(\|\langle\vec\Pi\rangle\|/\langle u_{em}\rangle = c\) : l'énergie avance à la vitesse \(c\) dans le sens \(\vec e_y\).</p>
  </div>
</div>

  <div class="q"><strong>Q1.</strong> Pour chaque source, calculer la grandeur manquante (\(\lambda\) ou \(\nu\)) et nommer le domaine du spectre.</div>
  <div class="q"><strong>Q2.</strong> Pourquoi les rayons X conviennent-ils à l'étude de la structure des cristaux ?</div>
  <div class="q"><strong>Q3.</strong> Une antenne simple (dipôle) a une longueur de l'ordre de \(\lambda/2\). Évaluer cette longueur pour la radio FM (100 MHz) et pour la 5G. Commenter.</div>
  <div class="q"><strong>Q4.</strong> L'œil est sensible de 400 nm à 750 nm. Quelle bande de fréquences cela représente-t-il ? À quelle couleur correspond la fréquence \(6{,}0\times10^{14}\ \text{Hz}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>

    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(\lambda=c/\nu\) : (a) \(\lambda=6{,}0\times10^{6}\ \text{m}=6\,000\ \text{km}\), ondes radio (très basses fréquences) ; (b) \(\lambda\approx3{,}9\ \text{km}\), radio, ondes longues ; (c) \(\lambda\approx8{,}6\ \text{cm}\), micro-ondes ; (d) \(\lambda\approx3{,}9\ \text{mm}\), micro-ondes (ondes millimétriques) ; (e) \(\nu=c/\lambda\approx3{,}2\times10^{14}\ \text{Hz}\), infrarouge proche ; (f) \(\nu\approx1{,}2\times10^{15}\ \text{Hz}\), ultraviolet ; (g) \(\nu\approx1{,}9\times10^{18}\ \text{Hz}\), rayons X.</p>
    <p><strong>Q2.</strong> Leur longueur d'onde (0,1 nm environ) est comparable aux distances entre atomes d'un cristal : le réseau cristallin diffracte les rayons X comme un réseau optique diffracte la lumière, et la figure de diffraction renseigne sur l'arrangement des atomes. La lumière visible, mille fois plus « grosse », ne « voit » pas ces détails.</p>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Une impulsion régressive</h3>
  <div class="statement">Dans le vide, une brève impulsion électromagnétique est décrite par
    $$\vec E(x,t) = E_0\,\exp\!\Big(-\frac{(x + ct)^2}{a^2}\Big)\,\vec e_z$$
    avec \(E_0 = 2{,}0\times10^{3}\ \text{V·m}^{-1}\) et \(a = 0{,}30\ \text{m}\). On donne \(\displaystyle\int_{-\infty}^{+\infty} e^{-2s^2/a^2}\,\mathrm ds = a\sqrt{\pi/2}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que chaque composante de ce champ vérifie l'équation de d'Alembert. Dans quel sens l'impulsion se propage-t-elle ? Où se trouve son maximum à l'instant \(t\) ?</div>
  <div class="q"><strong>Q2.</strong> Ordre de grandeur de la durée de l'impulsion vue par un capteur fixe ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(\vec B\) par la relation de structure, puis vérifier le résultat avec (MF).</div>
  <div class="q"><strong>Q4.</strong> Exprimer le vecteur de Poynting. Calculer l'énergie transportée par l'impulsion à travers une surface de \(1\ \text{m}^2\) orthogonale à \(\vec e_x\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Posons \(g(s) = e^{-s^2/a^2}\) et \(s = x + ct\). Alors \(\partial_x^2 E_z = E_0\,g''(s)\) et \(\partial_t^2 E_z = c^2E_0\,g''(s)\) : \(\partial_x^2 E_z - \frac{1}{c^2}\partial_t^2 E_z = 0\). ✓ Le champ ne dépend que de \(x + ct\) : onde plane progressive vers les \(x\) décroissants (régressive), \(\vec u = -\vec e_x\). Le maximum est en \(s = 0\), soit \(x = -ct\).</p>
    <p><strong>Q2.</strong> En un point fixe, le champ n'est notable que tant que \(|x + ct| \lesssim a\), soit pendant une durée de l'ordre de \(2a/c = 2\ \text{ns}\).</p>
    <p><strong>Q3.</strong> \(\vec B = \dfrac{(-\vec e_x)\wedge\vec E}{c}\) \(= \dfrac{E_0}{c}\,g(s)\,\big(-\vec e_x\wedge\vec e_z\big)\) \(= \dfrac{E_0}{c}\,g(x + ct)\,\vec e_y\). Vérification : \(\overrightarrow{\operatorname{rot}}\,\vec E = -\partial_x E_z\,\vec e_y = -E_0\,g'(s)\,\vec e_y\) et \(-\partial_t\vec B = -\dfrac{E_0}{c}\,c\,g'(s)\,\vec e_y = -E_0\,g'(s)\,\vec e_y\). ✓</p>
    <p><strong>Q4.</strong> \(\vec\Pi = \dfrac{\vec E\wedge\vec B}{\mu_0}\) \(= \dfrac{E_0^2}{\mu_0c}\,g^2(s)\,(\vec e_z\wedge\vec e_y)\) \(= -\varepsilon_0c\,E_0^2\,g^2(s)\,\vec e_x\) \(= -c\,u_{em}\,\vec e_x\) : l'énergie part vers les \(x\) décroissants. L'énergie qui traverse \(1\ \text{m}^2\) est celle que contient un cylindre de \(1\ \text{m}^2\) de base couvrant toute l'impulsion :</p>
    <div class="formula">$$\frac{W}{S} = \int_{-\infty}^{+\infty}\varepsilon_0E_0^2\,e^{-2s^2/a^2}\,\mathrm ds = \varepsilon_0E_0^2\,a\sqrt{\frac{\pi}{2}}$$ $$\frac{W}{S} \approx 1{,}3\times10^{-5}\ \text{J·m}^{-2}$$</div>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Ces champs sont-ils des ondes électromagnétiques ?</h3>
  <div class="statement">On se place dans le vide (\(\rho=0\), \(\vec j=\vec 0\)). \(E_0\), \(k\), \(a\) sont des constantes positives et \(c=1/\sqrt{\varepsilon_0\mu_0}\). Pour chacun des champs électriques suivants, dire s'il peut décrire une onde électromagnétique ; si oui, déterminer \(\vec B\) (sans partie statique) et décrire l'onde.<br>
  (a) \(\vec E_a=E_0\cos(\omega t-kz)\,\vec e_z\) avec \(\omega=kc\) ;<br>
  (b) \(\vec E_b=E_0\cos(\omega t-kx)\,\vec e_y\) avec \(\omega=2kc\) ;<br>
  (c) \(\vec E_c=E_0\cos(kz)\cos(\omega t)\,\vec e_x\) avec \(\omega=kc\) ;<br>
  (d) \(\vec E_d=E_0\,e^{-(x-ct)^2/a^2}\,(\vec e_y+\vec e_z)\).</div>
  <div class="q"><strong>Q1.</strong> Étudier (a) et (b).</div>
  <div class="q"><strong>Q2.</strong> Étudier (c). L'onde est-elle plane ? progressive ? Vérifier les quatre équations de Maxwell et comparer \(\vec B\) à \(\vec e_z\wedge\vec E_c/c\). Écrire \(\vec E_c\) comme une somme de deux OPPM.</div>
  <div class="q"><strong>Q3.</strong> Étudier (d) : direction et sens de propagation, polarisation, champ magnétique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> (a) \(\operatorname{div}\vec E_a=\partial_zE_z=kE_0\sin(\omega t-kz)\neq0\) : (MG) est violée dans le vide. Ce champ vérifie pourtant l'équation de d'Alembert : c'est la preuve qu'elle ne suffit pas. Une onde plane dans le vide est transverse, jamais longitudinale. (b) Chaque composante devrait vérifier d'Alembert : \(-k^2+\omega^2/c^2=3k^2\neq0\). Impossible : dans le vide, \(\omega/k=c\) obligatoirement.</p>
    <p><strong>Q2.</strong> Le champ ne dépend que de \(z\) et de \(t\) : onde plane, de plans d'onde \(z=\text{cte}\) ; mais elle n'est pas progressive (variables séparées : onde stationnaire). (MG) : \(\operatorname{div}\vec E_c=\partial_xE_x=0\). (MF) : \(\overrightarrow{\operatorname{rot}}\,\vec E_c=\partial_zE_x\,\vec e_y\), soit \(-kE_0\sin(kz)\cos(\omega t)\,\vec e_y\), doit valoir \(-\partial_t\vec B\), d'où, sans partie statique,</p>
    <div class="formula">$$\vec B=\frac{E_0}{c}\,\sin(kz)\,\sin(\omega t)\,\vec e_y$$</div>
    <p>(MΦ) : \(\partial_yB_y=0\). (MA) : \(\overrightarrow{\operatorname{rot}}\,\vec B=-\partial_zB_y\,\vec e_x\), soit \(-\dfrac{kE_0}{c}\cos(kz)\sin(\omega t)\,\vec e_x\), et \(\dfrac{1}{c^2}\partial_t\vec E_c=-\dfrac{\omega E_0}{c^2}\cos(kz)\sin(\omega t)\,\vec e_x\) : égalité car \(\omega=kc\). Le champ est transverse, mais \(\vec e_z\wedge\vec E_c/c=\dfrac{E_0}{c}\cos(kz)\cos(\omega t)\,\vec e_y\neq\vec B\) : pas de relation de structure globale (quadrature en temps et en espace). Avec \(\cos p\cos q=\tfrac12[\cos(p+q)+\cos(p-q)]\) : \(\vec E_c=\dfrac{E_0}{2}\big[\cos(\omega t-kz)+\cos(\omega t+kz)\big]\vec e_x\), somme de deux OPPM d'amplitude \(E_0/2\) se propageant en sens opposés ; la relation de structure vaut pour chacune.</p>
    <p><strong>Q3.</strong> Fonction de \(x-ct\) : onde plane progressive selon \(+\vec e_x\) (impulsion de largeur \(\sim a\)). \(\vec E_d\) est orthogonal à \(\vec e_x\) (transverse) et garde la direction fixe \(\vec e_y+\vec e_z\) : polarisation rectiligne, à \(45^\circ\) de \(\vec e_y\). Relation de structure : \(\vec B=\dfrac{\vec e_x\wedge\vec E_d}{c}=\dfrac{E_0}{c}\,e^{-(x-ct)^2/a^2}\,(\vec e_z-\vec e_y)\), car \(\vec e_x\wedge\vec e_y=\vec e_z\) et \(\vec e_x\wedge\vec e_z=-\vec e_y\). Contrôle : \(\vec E_d\cdot\vec B=0\) et \(\|\vec B\|=\|\vec E_d\|/c\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Onde oblique et notation complexe</h3>
  <div class="statement">Dans le vide, on considère l'OPPM de champ complexe
    $$\underline{\vec E} = E_0\,e^{\,i(\omega t - \vec k\cdot\vec r)}\,\vec e_z$$ $$\vec k = \frac{k}{5}\big(3\,\vec e_x + 4\,\vec e_y\big)$$ avec \(E_0\) réel.
    Application numérique : \(\nu = 5{,}0\ \text{GHz}\), \(E_0 = 3{,}0\ \text{V·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Donner le vecteur unitaire de propagation \(\vec u\) et l'équation des surfaces d'onde. Calculer \(k\), \(\lambda\) et les composantes de \(\vec k\).</div>
  <div class="q"><strong>Q2.</strong> Écrire les équations de Maxwell en notation complexe. Vérifier que ce champ est compatible avec (MG) et retrouver la relation de dispersion.</div>
  <div class="q"><strong>Q3.</strong> En déduire \(\underline{\vec B}\), puis les champs réels \(\vec E\) et \(\vec B\).</div>
  <div class="q"><strong>Q4.</strong> Calculer \(\langle\vec\Pi\rangle\) à l'aide de la notation complexe. Quelle puissance moyenne traverse une plaque d'aire \(0{,}50\ \text{m}^2\) contenue dans le plan \(x = 0\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec u = \vec k/k = \tfrac15(3\,\vec e_x + 4\,\vec e_y)\) (bien unitaire : \(9 + 16 = 25\)). Surfaces d'onde : \(\vec k\cdot\vec r = \text{cte}\), soit les plans \(3x + 4y = \text{cte}\). \(k = 2\pi\nu/c\) \(= 2\pi\times5{,}0\times10^{9}/3{,}0\times10^{8}\) \(\approx 105\ \text{rad·m}^{-1}\), \(\lambda = c/\nu = 6{,}0\ \text{cm}\), \(k_x = 3k/5 \approx 63\ \text{rad·m}^{-1}\), \(k_y = 4k/5 \approx 84\ \text{rad·m}^{-1}\).</p>
    <p><strong>Q2.</strong> \(-i\vec k\cdot\underline{\vec E} = 0\), \(-i\vec k\cdot\underline{\vec B} = 0\), \(-i\vec k\wedge\underline{\vec E} = -i\omega\underline{\vec B}\), \(-i\vec k\wedge\underline{\vec B} = i\omega\underline{\vec E}/c^2\). Comme \(\vec k\) est dans le plan \((xOy)\) et \(\underline{\vec E}\) selon \(\vec e_z\), \(\vec k\cdot\underline{\vec E} = 0\) : (MG) est vérifiée. En reportant \(\underline{\vec B} = \vec k\wedge\underline{\vec E}/\omega\) dans (MA) : \(\vec k\wedge(\vec k\wedge\underline{\vec E}) = -k^2\underline{\vec E}\) (car \(\vec k\cdot\underline{\vec E}=0\)), qui doit valoir \(-\dfrac{\omega^2}{c^2}\underline{\vec E}\) : d'où \(k = \omega/c\).</p>
    <p><strong>Q3.</strong> Avec \(\vec e_x\wedge\vec e_z = -\vec e_y\) et \(\vec e_y\wedge\vec e_z = \vec e_x\) :</p>
    <div class="formula">$$\underline{\vec B} = \frac{k}{5\omega}\,E_0\,(3\,\vec e_x + 4\,\vec e_y)\wedge\vec e_z\;e^{\,i(\omega t - \vec k\cdot\vec r)}$$ $$\underline{\vec B} = \frac{E_0}{5c}\,\big(4\,\vec e_x - 3\,\vec e_y\big)\,e^{\,i(\omega t - \vec k\cdot\vec r)}$$</div>
    <p>Champs réels (avec \(\vec k\cdot\vec r = k(3x + 4y)/5\)) : \(\vec E = E_0\cos(\omega t - \vec k\cdot\vec r)\,\vec e_z\) et \(\vec B = \dfrac{E_0}{5c}\cos(\omega t - \vec k\cdot\vec r)\,(4\,\vec e_x - 3\,\vec e_y)\). Contrôles : \((4\vec e_x - 3\vec e_y)\cdot(3\vec e_x + 4\vec e_y) = 0\) et \(\|\vec B\| = \|\vec E\|/c\).</p>
    <p><strong>Q4.</strong> Avec la formule de moyenne \(\tfrac{1}{2\mu_0}\operatorname{Re}\big(\underline{\vec E}\wedge\underline{\vec B}^{*}\big)\), on obtient \(\langle\vec\Pi\rangle = \dfrac{E_0^2}{10\mu_0c}\,\vec e_z\wedge(4\,\vec e_x - 3\,\vec e_y)\) \(= \dfrac{E_0^2}{10\mu_0c}\,(3\,\vec e_x + 4\,\vec e_y)\) \(= \dfrac{\varepsilon_0cE_0^2}{2}\,\vec u\). Norme : \(2{,}66\times10^{-3}\times9/2 \approx 1{,}2\times10^{-2}\ \text{W·m}^{-2}\). La plaque a pour normale \(\vec e_x\) : \(\langle P\rangle = \langle\vec\Pi\rangle\cdot\vec e_x\,S\) \(= 1{,}2\times10^{-2}\times\tfrac35\times0{,}50\) \(\approx 3{,}6\ \text{mW}\) (seule la projection sur la normale compte).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Faire passer la lumière entre deux polariseurs croisés</h3>
  <div class="statement">Une lumière naturelle d'éclairement \(I_0 = 80\ \text{W·m}^{-2}\) traverse un polariseur parfait \(P_1\) d'axe \(\vec e_x\), puis un polariseur parfait \(P_3\) d'axe \(\vec e_y\). Données : \(\varepsilon_0c = 2{,}66\times10^{-3}\ \text{S}\).</div>
  <div class="q"><strong>Q1.</strong> Éclairement \(I_1\) et amplitude \(E_1\) du champ après \(P_1\) ? Éclairement après \(P_3\) ?</div>
  <div class="q"><strong>Q2.</strong> On intercale entre \(P_1\) et \(P_3\) un polariseur \(P_2\) dont l'axe fait l'angle \(\theta\) avec \(\vec e_x\). Exprimer l'éclairement final \(I_3(\theta)\). Pour quel angle est-il maximal ? Calculer \(I_3\) pour \(\theta = 45^\circ\) et \(\theta = 30^\circ\).</div>
  <div class="q"><strong>Q3.</strong> On remplace \(P_2\) par \(N\) polariseurs, le \(j\)-ième ayant son axe à l'angle \(j\pi/(2N)\) de \(\vec e_x\) (le dernier est donc confondu avec \(P_3\), que l'on retire). Exprimer l'éclairement final ; le calculer pour \(N = 10\) et étudier la limite \(N\to\infty\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En lumière naturelle, un polariseur transmet la moitié de l'éclairement : \(I_1 = 40\ \text{W·m}^{-2}\), onde polarisée selon \(\vec e_x\). \(E_1 = \sqrt{2I_1/(\varepsilon_0c)}\) \(= \sqrt{80/2{,}66\times10^{-3}}\) \(\approx 1{,}7\times10^{2}\ \text{V·m}^{-1}\). \(P_3\) est croisé avec la polarisation : \(I = I_1\cos^2(\pi/2) = 0\), extinction.</p>
    <p><strong>Q2.</strong> Malus deux fois : \(I_2 = I_1\cos^2\theta\), puis l'onde est polarisée selon l'axe de \(P_2\), qui fait \(\pi/2 - \theta\) avec celui de \(P_3\) : \(I_3 = I_1\cos^2\theta\,\sin^2\theta = \dfrac{I_1}{4}\sin^2 2\theta\). Maximum pour \(\theta = 45^\circ\) : \(I_3 = I_1/4 = 10\ \text{W·m}^{-2}\) (soit \(I_0/8\)). Pour \(\theta = 30^\circ\) : \(I_3 = 10\times\sin^2 60^\circ = 7{,}5\ \text{W·m}^{-2}\). Ajouter un polariseur fait réapparaître la lumière : chaque polariseur <em>réoriente</em> la polarisation.</p>
    <p><strong>Q3.</strong> Chaque polariseur fait l'angle \(\pi/(2N)\) avec le précédent : \(I = I_1\cos^{2N}\!\Big(\dfrac{\pi}{2N}\Big)\). Pour \(N = 10\) : \(\cos 9^\circ \approx 0{,}9877\), \(I \approx 40\times0{,}78 \approx 31\ \text{W·m}^{-2}\). Pour \(N\) grand, \(\ln(I/I_1) = 2N\ln\cos\frac{\pi}{2N}\) \(\approx 2N\times\Big(-\dfrac{\pi^2}{8N^2}\Big)\) \(= -\dfrac{\pi^2}{4N}\to 0\) : \(I\to I_1\). On fait tourner la polarisation de \(90^\circ\) presque sans perte.</p>
  </div>
</div>

<div class="exo">

    <p><strong>Q2.</strong> Comparons à \(U_0\cos^2\alpha\) avec \(U_0=200\ \text{mV}\) : 150 mV, 100 mV, 50 mV et 0 mV. L'accord est excellent : c'est la loi de Malus, le récepteur jouant le rôle d'analyseur. Le signal s'annule (presque) pour une orientation : le champ électrique émis garde une direction fixe, l'onde est <strong>polarisée rectilignement</strong>, selon l'axe du cornet émetteur. Le résidu de 2 mV vient d'imperfections : réflexions sur la table et les objets voisins, polarisation imparfaite de l'émetteur, sélectivité imparfaite du récepteur.</p>
