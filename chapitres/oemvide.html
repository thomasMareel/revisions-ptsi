<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Émetteur radio : onde sphérique et onde plane locale</h3>
  <div class="statement">Un émetteur FM de fréquence \(\nu = 100\ \text{MHz}\) rayonne une puissance moyenne \(P = 10\ \text{kW}\), supposée répartie de façon isotrope ; on néglige toute absorption et le rôle du sol. Données : \(\mu_0c \approx 377\ \Omega\), \(c = 3{,}0\times10^{8}\ \text{m·s}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\langle\Pi\rangle\) varie en \(1/r^2\) et l'amplitude du champ en \(1/r\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\langle\Pi\rangle\), \(E_0\) et \(B_0\) à \(r = 20\ \text{km}\).</div>
  <div class="q"><strong>Q3.</strong> Un récepteur occupe une zone de taille \(a = 10\ \text{m}\) à cette distance. Justifier qu'on peut y traiter l'onde comme plane.</div>
  <div class="q"><strong>Q4.</strong> Le récepteur fonctionne si \(E_0 \ge 1{,}0\ \text{mV·m}^{-1}\). Quelle portée prévoit ce modèle ? En réalité, la portée d'un émetteur FM est de l'ordre de 50 à 100 km : proposer une explication.</div>
  <div class="q"><strong>Q5.</strong> Au niveau de l'orbite terrestre (\(d = 1{,}5\times10^{11}\ \text{m}\)), l'éclairement solaire vaut \(1{,}36\ \text{kW·m}^{-2}\). En déduire la puissance rayonnée par le Soleil.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En régime permanent, sans absorption, la puissance moyenne qui traverse toute sphère centrée sur l'émetteur vaut \(P\). Par isotropie, \(\langle\Pi\rangle\) est uniforme sur la sphère : \(\langle\Pi\rangle\,4\pi r^2 = P\), donc \(\langle\Pi\rangle = P/(4\pi r^2)\). Comme \(\langle\Pi\rangle\) est proportionnel à \(E_0^2\), \(E_0\propto 1/r\).</p>
    <p><strong>Q2.</strong> \(\langle\Pi\rangle = \dfrac{1{,}0\times10^{4}}{4\pi\times(2{,}0\times10^{4})^2}\) \(\approx 2{,}0\times10^{-6}\ \text{W·m}^{-2}\). \(E_0 = \sqrt{2\mu_0c\,\langle\Pi\rangle}\) \(= \sqrt{2\times377\times2{,}0\times10^{-6}}\) \(\approx 3{,}9\times10^{-2}\ \text{V·m}^{-1}\) (39 mV/m). \(B_0 = E_0/c \approx 1{,}3\times10^{-10}\ \text{T}\).</p>
    <p><strong>Q3.</strong> \(\lambda = c/\nu = 3{,}0\ \text{m}\). Variation relative d'amplitude sur la zone : \(a/r = 5\times10^{-4}\), négligeable. Écart entre la sphère d'onde et son plan tangent : \(\delta \approx a^2/(8r)\) \(= 100/(1{,}6\times10^{5})\) \(\approx 6\times10^{-4}\ \text{m}\) \(\ll \lambda\). L'onde y est localement plane, de direction \(\vec e_r\).</p>
    <p><strong>Q4.</strong> \(E_0\propto 1/r\) : \(r_{max} = 20\ \text{km}\times\dfrac{39}{1{,}0} \approx 8\times10^{2}\ \text{km}\). La portée réelle est bien plus faible car les ondes métriques se propagent essentiellement en ligne droite : la rotondité de la Terre masque l'émetteur au-delà de l'horizon (\(\sqrt{2R_Th}\approx 60\ \text{km}\) pour une antenne à \(h = 300\ \text{m}\)), sans parler des obstacles et des pertes au sol.</p>
    <p><strong>Q5.</strong> \(P_\odot = 4\pi d^2\,I\) \(= 4\pi\times(1{,}5\times10^{11})^2\times1{,}36\times10^{3}\) \(\approx 3{,}8\times10^{26}\ \text{W}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan d'énergie local et faisceau laser de découpe</h3>
  <div class="statement">Dans le vide, une OPPM a pour champ électrique \(\vec E=E_0\cos(\omega t-kz)\,\vec e_x\). Un laser de découpe industriel émet une puissance continue \(P=2{,}0\ \text{kW}\) à \(\lambda=1{,}06\ \mu\text{m}\) ; au foyer, son faisceau est un disque de diamètre \(d=0{,}20\ \text{mm}\), où on l'assimile à une OPPM polarisée rectilignement. Données : \(c=3{,}00\times10^{8}\ \text{m·s}^{-1}\), \(\mu_0c\approx377\ \Omega\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\vec B\), \(u_{em}\) et \(\vec\Pi\) à chaque instant. Vérifier l'équation locale de Poynting du vide, \(\partial_tu_{em}+\operatorname{div}\vec\Pi=0\), et montrer qu'elle impose \(\omega=kc\).</div>
  <div class="q"><strong>Q2.</strong> Calculer l'éclairement au foyer, puis les amplitudes \(E_0\) et \(B_0\). Comparer \(E_0\) au champ électrique qui lie l'électron au noyau dans un atome d'hydrogène, \(\approx5\times10^{11}\ \text{V·m}^{-1}\).</div>
  <div class="q"><strong>Q3.</strong> Quelle énergie électromagnétique un tronçon de 1,0 m du faisceau contient-il ? Commenter.</div>
  <div class="q"><strong>Q4.</strong> Dans quel domaine du spectre ce laser émet-il ? Justifier, à l'aide de la relation de structure, que l'action de l'onde sur les électrons du métal est essentiellement électrique, pour des électrons de vitesse \(v\sim10^{6}\ \text{m·s}^{-1}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(\varphi=\omega t-kz\) : \(\vec B=\dfrac{E_0}{c}\cos\varphi\,\vec e_y\) (relation de structure, \(\vec e_z\wedge\vec e_x=\vec e_y\)), \(u_{em}=\dfrac{\varepsilon_0E_0^2}{2}\cos^2\varphi+\dfrac{E_0^2}{2\mu_0c^2}\cos^2\varphi\), soit \(u_{em}=\varepsilon_0E_0^2\cos^2\varphi\), et \(\vec\Pi=\dfrac{E_0^2}{\mu_0c}\cos^2\varphi\,\vec e_z=c\,u_{em}\,\vec e_z\). Puis \(\partial_tu_{em}=-2\omega\varepsilon_0E_0^2\cos\varphi\sin\varphi\) et \(\operatorname{div}\vec\Pi=\partial_z\Pi_z\), soit \(+2kc\,\varepsilon_0E_0^2\cos\varphi\sin\varphi\). La somme est nulle à tout instant et en tout point si et seulement si \(\omega=kc\) : on retrouve la relation de dispersion du vide, et l'énergie qui disparaît d'une tranche est exactement celle qui en sort.</p>
    <p><strong>Q2.</strong> \(I=\dfrac{P}{\pi d^2/4}\approx6{,}4\times10^{10}\ \text{W·m}^{-2}\) (cinquante millions de fois l'éclairement solaire). \(E_0=\sqrt{2\mu_0c\,I}\approx6{,}9\times10^{6}\ \text{V·m}^{-1}\) et \(B_0=E_0/c\approx2{,}3\times10^{-2}\ \text{T}\). Ce champ, considérable à notre échelle, reste près de \(10^{5}\) fois (\(7\times10^{4}\)) plus faible que le champ atomique : l'onde n'arrache pas directement les électrons des atomes, elle chauffe le métal par effet Joule.</p>
    <p><strong>Q3.</strong> L'énergie qui traverse une section pendant \(\Delta t\) vaut \(P\,\Delta t\) ; elle occupait une longueur \(c\,\Delta t\) de faisceau. Un mètre contient donc \(W=P/c\approx6{,}7\times10^{-6}\ \text{J}\) : malgré la puissance, l'énergie « en vol » est minuscule, car elle se déplace à la vitesse \(c\).</p>
    <p><strong>Q4.</strong> \(1{,}06\ \mu\text{m}\) dépasse 750 nm : infrarouge proche. Pour un électron, \(\|q\vec v\wedge\vec B\|\le evB_0=evE_0/c\), donc le rapport force magnétique / force électrique est au plus \(v/c\sim3\times10^{-3}\) : l'action de l'onde se réduit pratiquement à \(-e\vec E\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Une onde polarisée circulairement (hors programme, pour aller plus loin)</h3>
  <div class="statement">Dans le vide, une OPPM a pour champ électrique
    $$\vec E = E_0\cos(\omega t - kz)\,\vec e_x + E_0\sin(\omega t - kz)\,\vec e_y$$</div>
  <div class="q"><strong>Q1.</strong> Dans le plan \(z = 0\), décrire l'évolution de \(\vec E\). Dans quel sens tourne-t-il pour un observateur qui reçoit l'onde ?</div>
  <div class="q"><strong>Q2.</strong> À \(t = 0\), quelle courbe décrit l'extrémité de \(\vec E\) lorsque l'on se déplace le long de l'axe \(Oz\) ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(\vec B\), puis \(\vec\Pi\). Que remarque-t-on ? Comparer \(\langle\Pi\rangle\) à celui d'une onde polarisée rectilignement d'amplitude \(E_0\).</div>
  <div class="q"><strong>Q4.</strong> L'onde traverse un polariseur parfait dont l'axe fait l'angle \(\alpha\) avec \(\vec e_x\). Exprimer le champ transmis et l'éclairement transmis. Commenter.</div>
  <div class="q"><strong>Q5.</strong> Montrer qu'une onde polarisée rectilignement \(E_0\cos(\omega t - kz)\,\vec e_x\) est la somme de deux ondes polarisées circulairement, tournant en sens opposés.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En \(z = 0\) : \(\vec E = E_0(\cos\omega t\,\vec e_x + \sin\omega t\,\vec e_y)\). Sa norme vaut constamment \(E_0\) et il fait l'angle \(\omega t\) avec \(\vec e_x\) : il tourne uniformément, de \(\vec e_x\) vers \(\vec e_y\). L'onde allant vers \(+\vec e_z\), l'observateur qui la reçoit voit \(\vec e_z\) pointer vers lui : la rotation de \(\vec e_x\) vers \(\vec e_y\) lui apparaît dans le sens <strong>trigonométrique</strong>. Polarisation circulaire (\(E_{0x} = E_{0y}\), \(\phi = \pi/2\)).</p>
    <p><strong>Q2.</strong> À \(t = 0\) : \(\vec E(z) = E_0(\cos kz\,\vec e_x - \sin kz\,\vec e_y)\) : l'extrémité de \(\vec E\) décrit une <strong>hélice</strong> d'axe \(Oz\), de rayon \(E_0\) et de pas \(\lambda\).</p>
    <p><strong>Q3.</strong> \(\vec B = \dfrac{\vec e_z\wedge\vec E}{c}\) \(= \dfrac{E_0}{c}\cos(\omega t - kz)\,\vec e_y\) \(- \dfrac{E_0}{c}\sin(\omega t - kz)\,\vec e_x\). \(\vec E\) et \(\vec B\) sont orthogonaux, transverses, de normes \(E_0\) et \(E_0/c\) constantes : \(\vec\Pi = \dfrac{E_0^2}{\mu_0c}\,\vec e_z = \varepsilon_0c\,E_0^2\,\vec e_z\) est <strong>constant</strong> (pas de fluctuation à \(2\omega\)). \(\langle\Pi\rangle = \varepsilon_0cE_0^2\) : le double de l'onde rectiligne d'amplitude \(E_0\), puisque deux composantes d'amplitude \(E_0\) contribuent chacune \(\varepsilon_0cE_0^2/2\).</p>
    <p><strong>Q4.</strong> Composante sur l'axe \(\vec e_\alpha = \cos\alpha\,\vec e_x + \sin\alpha\,\vec e_y\) : \(E_0\cos(\omega t - kz)\cos\alpha\) \(+ E_0\sin(\omega t - kz)\sin\alpha\) \(= E_0\cos(\omega t - kz - \alpha)\). Onde transmise polarisée rectilignement selon \(\vec e_\alpha\), d'amplitude \(E_0\) : \(I = \varepsilon_0cE_0^2/2\), la <strong>moitié</strong> de l'éclairement incident, quel que soit \(\alpha\). Avec un polariseur seul, on ne distingue pas cette onde d'une lumière naturelle.</p>
    <p><strong>Q5.</strong> Avec \(\theta = \omega t - kz\) :</p>
    <div class="formula">$$\frac{E_0}{2}\big(\cos\theta\,\vec e_x + \sin\theta\,\vec e_y\big)$$ $$+\ \frac{E_0}{2}\big(\cos\theta\,\vec e_x - \sin\theta\,\vec e_y\big) = E_0\cos\theta\,\vec e_x$$</div>
    <p>C'est la somme d'une onde circulaire tournant dans le sens trigonométrique et d'une onde tournant dans le sens horaire, chacune d'amplitude \(E_0/2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Deux ondes contra-propagatives : quand la relation de structure tombe en défaut</h3>
  <div class="statement">Dans le vide, on superpose deux OPPM de même amplitude \(E_0\), polarisées selon \(\vec e_x\) et se propageant en sens opposés le long de \(Oz\) :
    $$\vec E_1 = E_0\cos(\omega t - kz)\,\vec e_x$$ $$\vec E_2 = E_0\cos(\omega t + kz)\,\vec e_x$$</div>
  <div class="q"><strong>Q1.</strong> Exprimer le champ total \(\vec E\) sous forme d'un produit. L'onde résultante est-elle progressive ? Situer les nœuds de \(\vec E\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer le champ magnétique total \(\vec B\) en utilisant correctement les relations de structure ; vérifier avec (MF). Montrer que \(\vec B\ne\vec e_z\wedge\vec E/c\). Situer les nœuds de \(\vec B\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le vecteur de Poynting instantané et sa moyenne. Interpréter.</div>
  <div class="q"><strong>Q4.</strong> Calculer les densités moyennes d'énergie électrique et magnétique en fonction de \(z\). Y a-t-il équipartition locale ? Que vaut \(\langle u_{em}\rangle\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\cos(\omega t - kz) + \cos(\omega t + kz)\) \(= 2\cos\omega t\cos kz\), donc \(\vec E = 2E_0\cos(\omega t)\cos(kz)\,\vec e_x\). Les variables d'espace et de temps sont séparées : l'onde ne progresse pas, elle est <strong>stationnaire</strong>. Nœuds de \(\vec E\) (champ nul à tout instant) : \(\cos kz = 0\), soit \(z = \lambda/4 + n\lambda/2\).</p>
    <p><strong>Q2.</strong> Chaque onde est une OPP : \(\vec B_1 = \dfrac{\vec e_z\wedge\vec E_1}{c} = \dfrac{E_0}{c}\cos(\omega t - kz)\,\vec e_y\) et \(\vec B_2 = \dfrac{(-\vec e_z)\wedge\vec E_2}{c}\) \(= -\dfrac{E_0}{c}\cos(\omega t + kz)\,\vec e_y\). Somme :</p>
    <div class="formula">$$\vec B = \frac{E_0}{c}\big[\cos(\omega t - kz) - \cos(\omega t + kz)\big]\vec e_y$$ $$\vec B = \frac{2E_0}{c}\,\sin(\omega t)\,\sin(kz)\,\vec e_y$$</div>
    <p>Vérification : \(\overrightarrow{\operatorname{rot}}\,\vec E\) \(= \partial_z E_x\,\vec e_y\) \(= -2E_0k\cos\omega t\sin kz\,\vec e_y\), et \(-\partial_t\vec B = -\dfrac{2E_0\omega}{c}\cos\omega t\sin kz\,\vec e_y\) : identiques puisque \(k = \omega/c\). ✓ En revanche \(\vec e_z\wedge\vec E/c = \dfrac{2E_0}{c}\cos\omega t\cos kz\,\vec e_y\ne\vec B\) : \(\vec E\) et \(\vec B\) sont en quadrature dans le temps et dans l'espace. Nœuds de \(\vec B\) : \(\sin kz = 0\), \(z = n\lambda/2\), décalés de \(\lambda/4\) de ceux de \(\vec E\).</p>
    <p><strong>Q3.</strong> \(\vec\Pi = \dfrac{\vec E\wedge\vec B}{\mu_0}\) \(= \dfrac{4E_0^2}{\mu_0c}\cos\omega t\sin\omega t\cos kz\sin kz\,\vec e_z\) \(= \dfrac{E_0^2}{\mu_0c}\sin(2\omega t)\sin(2kz)\,\vec e_z\), de moyenne nulle. L'énergie ne se propage pas en moyenne : elle oscille sur des distances de \(\lambda/4\), entre les ventres de \(\vec E\) et ceux de \(\vec B\). Les deux ondes transportent des puissances égales et opposées.</p>
    <p><strong>Q4.</strong> \(\Big\langle\dfrac{\varepsilon_0E^2}{2}\Big\rangle\) \(= \dfrac{\varepsilon_0}{2}\,4E_0^2\cos^2 kz\times\dfrac12\) \(= \varepsilon_0E_0^2\cos^2 kz\) et \(\Big\langle\dfrac{B^2}{2\mu_0}\Big\rangle\) \(= \dfrac{1}{2\mu_0}\,\dfrac{4E_0^2}{c^2}\sin^2 kz\times\dfrac12\) \(= \varepsilon_0E_0^2\sin^2 kz\). Pas d'équipartition locale (signature d'une onde non progressive), mais \(\langle u_{em}\rangle = \varepsilon_0E_0^2\) est uniforme : c'est la somme des densités moyennes \(\varepsilon_0E_0^2/2\) des deux ondes.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Réception d'une chaîne de télévision par satellite</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>ondes électromagnétiques dans le vide</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un satellite géostationnaire, situé à \(d = 3{,}6\times10^{4}\ \text{km}\) du récepteur, diffuse des programmes de télévision sur une porteuse de fréquence \(\nu_0 = 12{,}0\ \text{GHz}\). Son émetteur rayonne une puissance moyenne \(P_e = 120\ \text{W}\). Le récepteur est une antenne parabolique de diamètre \(D = 60\ \text{cm}\) qui concentre l'onde sur une petite antenne placée en son foyer. On assimile l'espace entre le satellite et le sol au vide. On note \(Oz\) l'axe vertical ascendant au niveau du récepteur ; on suppose, pour simplifier, que le satellite est à la verticale du récepteur.
    <br>Données : \(c = 3{,}00\times10^{8}\ \text{m·s}^{-1}\), \(\varepsilon_0 = 8{,}85\times10^{-12}\ \text{F·m}^{-1}\).
  </div>

  <p class="exo-part">Partie A — Structure de l'onde reçue</p>
  <div class="q"><strong>A1.</strong> Calculer \(\lambda_0\), \(k\) et \(\omega\). Justifier qu'au voisinage de la parabole l'onde peut être modélisée par une onde plane (deux critères chiffrés).</div>
  <div class="q"><strong>A2.</strong> Près du récepteur, le champ électrique s'écrit en notation complexe \(\underline{\vec E} = E_0\,e^{\,i(\omega t + kz)}\,\vec e_x\) (\(E_0\) réel). Identifier le vecteur d'onde et vérifier que l'onde descend vers le sol. Préciser son état de polarisation.</div>
  <div class="q"><strong>A3.</strong> À l'aide des équations de Maxwell écrites en notation complexe, déterminer \(\underline{\vec B}\) puis le champ magnétique réel.</div>
  <div class="q"><strong>A4.</strong> Pourquoi les électrons de l'antenne placée au foyer sont-ils mis en mouvement essentiellement par le champ électrique ? Comment faut-il orienter cette antenne (un petit brin conducteur rectiligne) ?</div>

  <p class="exo-part">Partie B — Bilan de puissance</p>
  <div class="q"><strong>B1.</strong> Si le satellite rayonnait de façon isotrope, quelle serait la valeur de \(\langle\Pi\rangle\) au niveau du sol ?</div>
  <div class="q"><strong>B2.</strong> En réalité, l'antenne du satellite concentre sa puissance sur une zone de couverture d'aire \(\Sigma = 8{,}0\times10^{12}\ \text{m}^2\), où l'on suppose l'éclairement uniforme. Calculer \(\langle\Pi\rangle\) et le gain \(G\) de l'antenne d'émission, rapport de cette valeur à celle de B1.</div>
  <div class="q"><strong>B3.</strong> En déduire l'amplitude \(E_0\) et celle du champ magnétique \(B_0\).</div>
  <div class="q"><strong>B4.</strong> Quelle puissance moyenne la parabole collecte-t-elle ? Commenter.</div>

  <p class="exo-part">Partie C — Deux programmes sur la même fréquence</p>
  <div class="q"><strong>C1.</strong> Le satellite émet sur la même porteuse deux programmes indépendants, l'un polarisé selon \(\vec e_x\) (« H »), l'autre selon \(\vec e_y\) (« V »), avec la même amplitude \(E_0\). Le brin récepteur est orienté selon \(\vec e_\beta\), faisant l'angle \(\beta\) avec \(\vec e_x\) ; la puissance captée est proportionnelle au carré moyen de la composante du champ selon \(\vec e_\beta\), et l'on admet que les puissances des deux programmes s'ajoutent. Exprimer le rapport \(\rho\) entre la puissance captée du programme V et celle du programme H.</div>
  <div class="q"><strong>C2.</strong> On veut recevoir H avec une diaphonie \(\rho \le 1{,}0\ \%\). Quelle erreur d'orientation \(\beta\) peut-on tolérer ? Que se passe-t-il pour \(\beta = 45^\circ\) ?</div>
  <div class="q"><strong>C3.</strong> (Hors programme : polarisation circulaire.) D'autres satellites émettent en polarisation circulaire. Montrer qu'un brin rectiligne capte alors la même puissance quelle que soit son orientation, et préciser quelle fraction de la puissance de l'onde il récupère.</div>

  <p class="exo-part">Partie D — Signal modulé et paquet d'ondes</p>
  <div class="q"><strong>D1.</strong> On modélise un signal modulé par la superposition de deux OPPM de pulsations \(\omega_0 \pm \delta\omega\) (\(\delta\omega \ll \omega_0\)), d'amplitude \(E_0/2\) chacune, de même polarisation \(\vec e_x\), se propageant vers \(-\vec e_z\). Écrire le champ réel total sous la forme d'un produit et montrer que l'enveloppe se propage sans déformation. À quelle vitesse ?</div>
  <div class="q"><strong>D2.</strong> Calculer la durée de propagation satellite → sol. Quel retard minimal subit un direct transmis par une liaison sol → satellite → sol ?</div>
  <div class="q"><strong>D3.</strong> Le canal du satellite a une largeur spectrale \(\Delta\nu = 36\ \text{MHz}\). Estimer la durée minimale d'une impulsion transmise et son extension spatiale. Le modèle d'OPPM utilisé dans les parties A à C est-il justifié pour la porteuse ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(\lambda_0 = c/\nu_0 = 2{,}50\ \text{cm}\), \(k = 2\pi/\lambda_0 \approx 251\ \text{rad·m}^{-1}\), \(\omega = 2\pi\nu_0 \approx 7{,}54\times10^{10}\ \text{rad·s}^{-1}\). L'onde émise est localement sphérique ; sur la parabole : variation relative d'amplitude \(D/d \approx 1{,}7\times10^{-8}\) et écart à la planéité \(\delta \approx D^2/(8d)\) \(= 0{,}36/(2{,}9\times10^{8})\) \(\approx 1{,}3\times10^{-9}\ \text{m}\), négligeable devant \(\lambda_0\). L'onde est localement plane.</p>
    <p><strong>A2.</strong> Par identification avec \(e^{\,i(\omega t - \vec k\cdot\vec r)}\) : \(\vec k\cdot\vec r = -kz\), donc \(\vec k = -k\,\vec e_z\) : l'onde se propage vers les \(z\) décroissants, c'est-à-dire vers le sol. Le champ réel \(\vec E = E_0\cos(kz + \omega t)\,\vec e_x\) garde la direction \(\vec e_x\) : polarisation rectiligne horizontale.</p>
    <p><strong>A3.</strong> (MF) : \(-i\vec k\wedge\underline{\vec E} = -i\omega\underline{\vec B}\), donc \(\underline{\vec B} = \dfrac{\vec k\wedge\underline{\vec E}}{\omega}\) \(= \dfrac{-k\,E_0}{\omega}(\vec e_z\wedge\vec e_x)\,e^{\,i(\omega t + kz)}\) \(= -\dfrac{E_0}{c}\,e^{\,i(\omega t + kz)}\,\vec e_y\). Champ réel : \(\vec B = -\dfrac{E_0}{c}\cos(kz + \omega t)\,\vec e_y\). Contrôle : \((-\vec e_z, \vec e_x, -\vec e_y)\) est direct.</p>
    <p><strong>A4.</strong> Pour une charge de vitesse \(v\), \(\|q\vec v\wedge\vec B\|/\|q\vec E\|\le v/c\), infime pour les électrons de conduction : \(\vec F\approx -e\vec E\). Les électrons ne pouvant se déplacer que le long du brin, celui-ci doit être <strong>parallèle à \(\vec E\)</strong>, donc selon \(\vec e_x\).</p>
    <p><strong>B1.</strong> \(\langle\Pi\rangle_{iso}\) \(= \dfrac{P_e}{4\pi d^2}\) \(= \dfrac{120}{4\pi\times(3{,}6\times10^{7})^2}\) \(\approx 7{,}4\times10^{-15}\ \text{W·m}^{-2}\).</p>
    <p><strong>B2.</strong> \(\langle\Pi\rangle = P_e/\Sigma\) \(= 120/8{,}0\times10^{12}\) \(= 1{,}5\times10^{-11}\ \text{W·m}^{-2}\). \(G = \dfrac{4\pi d^2}{\Sigma} \approx \dfrac{1{,}63\times10^{16}}{8{,}0\times10^{12}}\), soit \(G\approx2{,}0\times10^{3}\) : sans antenne directive, l'essentiel de la puissance partirait dans l'espace.</p>
    <p><strong>B3.</strong> \(E_0 = \sqrt{\dfrac{2\langle\Pi\rangle}{\varepsilon_0c}}\) \(= \sqrt{\dfrac{3{,}0\times10^{-11}}{2{,}66\times10^{-3}}}\) \(\approx 1{,}1\times10^{-4}\ \text{V·m}^{-1}\), soit environ \(0{,}1\ \text{mV·m}^{-1}\). \(B_0 = E_0/c \approx 3{,}5\times10^{-13}\ \text{T}\).</p>
    <p><strong>B4.</strong> L'onde arrive selon l'axe de la parabole : \(P_r = \langle\Pi\rangle\,\dfrac{\pi D^2}{4}\) \(= 1{,}5\times10^{-11}\times0{,}283\) \(\approx 4{,}2\times10^{-12}\ \text{W}\). Quelques picowatts seulement : il faut un amplificateur à très faible bruit au foyer, et la parabole sert précisément à collecter l'onde sur une grande surface.</p>
    <p><strong>C1.</strong> Composante captée : \(E_0\cos\beta\cos(kz + \omega t)\) pour H et \(E_0\sin\beta\cos(kz + \omega t + \psi)\) pour V. Carrés moyens : \(\tfrac12E_0^2\cos^2\beta\) et \(\tfrac12E_0^2\sin^2\beta\). Donc \(\rho = \tan^2\beta\) (loi de Malus appliquée à chaque programme).</p>
    <p><strong>C2.</strong> \(\tan^2\beta \le 0{,}010\) \(\Leftrightarrow \tan\beta\) \(\le 0{,}10\) \(\Leftrightarrow \beta\) \(\le 5{,}7^\circ\). Pour \(\beta = 45^\circ\), \(\rho = 1\) : les deux programmes sont reçus avec la même puissance et se brouillent totalement. D'où le réglage soigneux de l'orientation de la tête de réception.</p>
    <p><strong>C3.</strong> Onde circulaire : \(\vec E = E_0\big[\cos\theta\,\vec e_x \pm \sin\theta\,\vec e_y\big]\) avec \(\theta = kz + \omega t\). Composante selon \(\vec e_\beta\) : \(E_0\cos(\theta\mp\beta)\), de carré moyen \(E_0^2/2\) indépendant de \(\beta\). Le brin récupère la moitié de la puissance de l'onde (dont l'éclairement vaut \(\varepsilon_0cE_0^2\)) : aucun réglage d'orientation, mais une perte d'un facteur 2, sauf à utiliser une antenne de réception adaptée à la polarisation circulaire.</p>
    <p><strong>D1.</strong> En posant \(\tau = t + z/c\) (onde vers \(-\vec e_z\)) :</p>
    <div class="formula">$$\vec E = \frac{E_0}{2}\Big[\cos\big((\omega_0 + \delta\omega)\tau\big) + \cos\big((\omega_0 - \delta\omega)\tau\big)\Big]\vec e_x$$ $$\vec E = E_0\cos(\delta\omega\,\tau)\,\cos(\omega_0\tau)\,\vec e_x$$</div>
    <p>L'enveloppe \(E_0\cos\big(\delta\omega(t + z/c)\big)\) est une fonction de \(t + z/c\) seulement : elle se propage vers le sol à la vitesse \(c\), sans déformation, car les deux composantes ont la même vitesse de phase (vide non dispersif).</p>
    <p><strong>D2.</strong> \(d/c = 3{,}6\times10^{7}/3{,}00\times10^{8} = 0{,}12\ \text{s}\). Pour un aller-retour sol → satellite → sol : au moins \(0{,}24\ \text{s}\), décalage perceptible dans un dialogue en direct.</p>
    <p><strong>D3.</strong> \(\Delta t\sim 1/\Delta\nu \approx 28\ \text{ns}\), extension spatiale \(c\,\Delta t\approx 8\ \text{m}\). Comme \(\Delta\nu/\nu_0 = 3\times10^{-3}\ll 1\), le signal est quasi monochromatique (chaque impulsion contient plusieurs centaines de périodes de la porteuse) : le modèle d'OPPM de fréquence \(\nu_0\) est justifié pour les parties A à C.</p>
  </div>
