  <h3>Diviseurs et nombres premiers</h3>
  <div class="statement">On travaille avec des entiers <span class="code-inline">n &gt;= 2</span>.</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">plus_petit_diviseur(n)</span> qui renvoie le plus petit diviseur de <span class="code-inline">n</span> supérieur ou égal à 2. Pourquoi la boucle termine-t-elle ?</div>
  <div class="q"><strong>Q2.</strong> En déduire une fonction <span class="code-inline">est_premier(n)</span> d'une ligne.</div>
  <div class="q"><strong>Q3.</strong> Compter les nombres premiers inférieurs à 100.</div>
  <div class="q"><strong>Q4.</strong> Un étudiant propose la fonction ci-dessous. Pour quels entiers se trompe-t-elle ?
  <pre class="codeblock"><span class="kw">def</span> est_premier_faux(n):
    <span class="kw">for</span> d <span class="kw">in</span> range(2, n):
        <span class="kw">if</span> n % d == 0:
            <span class="kw">return</span> <span class="kw">False</span>
        <span class="kw">else</span>:
            <span class="kw">return</span> <span class="kw">True</span></pre></div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On essaie <span class="code-inline">d = 2, 3, …</span> tant que <span class="code-inline">d</span> ne divise pas <span class="code-inline">n</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> plus_petit_diviseur(n):
    <span class="str">"""Plus petit diviseur d &gt;= 2 de l'entier n &gt;= 2."""</span>
    d = 2
    <span class="kw">while</span> n % d != 0:
        d = d + 1
    <span class="kw">return</span> d

<span class="kw">def</span> est_premier(n):
    <span class="kw">return</span> plus_petit_diviseur(n) == n</pre>
    <p>La boucle termine car <span class="code-inline">n</span> se divise lui-même : <span class="code-inline">d</span> augmente de 1 à chaque tour et la condition est fausse au plus tard quand <span class="code-inline">d</span> vaut <span class="code-inline">n</span> (variant : \(n - d\)).</p>
    <p><strong>Q2.</strong> <span class="code-inline">n</span> est premier si et seulement si son plus petit diviseur au moins égal à 2 est <span class="code-inline">n</span> lui-même : c'est la seconde fonction ci-dessus.</p>
    <p><strong>Q3.</strong></p>
    <pre class="codeblock">c = 0
<span class="kw">for</span> n <span class="kw">in</span> range(2, 100):
    <span class="kw">if</span> est_premier(n):
        c = c + 1
print(c)            <span class="cmt"># affiche 25</span></pre>
    <p><strong>Q4.</strong> Le <span class="code-inline">else: return True</span> est <strong>dans</strong> la boucle : la fonction conclut dès le premier essai <span class="code-inline">d = 2</span>. Elle déclare donc premier tout entier impair au moins égal à 3, par exemple 9, 15 ou 21 ; et pour <span class="code-inline">n = 2</span>, <span class="code-inline">range(2, 2)</span> est vide, aucun <span class="code-inline">return</span> n'est exécuté et la fonction renvoie <span class="code-inline">None</span>. Correction : supprimer le <span class="code-inline">else</span> et écrire <span class="code-inline">return True</span> après la boucle.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Maximum, occurrences et écarts</h3>
  <div class="statement"><span class="code-inline">t</span> est une liste non vide de nombres (des températures, par exemple).</div>
  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">nb_max(t)</span> qui renvoie le nombre d'occurrences de la plus grande valeur de <span class="code-inline">t</span>, en un seul parcours.</div>
  <div class="q"><strong>Q2.</strong> <span class="code-inline">t</span> ayant au moins deux éléments, écrire <span class="code-inline">plus_grand_ecart(t)</span> qui renvoie le couple <span class="code-inline">(i, e)</span>, où <span class="code-inline">e</span> est la plus grande valeur de <span class="code-inline">abs(t[i + 1] - t[i])</span> et <span class="code-inline">i</span> le premier indice où elle est atteinte.</div>
  <div class="q"><strong>Q3.</strong> Pourquoi initialiser le maximum de Q1 avec <span class="code-inline">t[0]</span> plutôt qu'avec 0 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Deux accumulateurs : le maximum provisoire <span class="code-inline">m</span> et son nombre d'occurrences <span class="code-inline">c</span>. Un nouveau maximum remet le compte à 1.</p>
    <pre class="codeblock"><span class="kw">def</span> nb_max(t):
    <span class="str">"""Nombre d'occurrences de la plus grande valeur de t (non vide)."""</span>
    m = t[0]
    c = 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &gt; m:            <span class="cmt"># nouveau maximum : on recommence à compter</span>
            m = x
            c = 1
        <span class="kw">elif</span> x == m:
            c = c + 1
    <span class="kw">return</span> c</pre>
    <p>La boucle parcourt tous les éléments, y compris <span class="code-inline">t[0]</span> : au premier tour <span class="code-inline">x == m</span>, d'où <span class="code-inline">c = 1</span>.</p>
    <p><strong>Q2.</strong> On initialise avec le premier écart (indice 0), puis on parcourt les indices 1 à <span class="code-inline">len(t) - 2</span> pour que <span class="code-inline">t[i + 1]</span> existe. La comparaison stricte garde le premier indice.</p>
    <pre class="codeblock"><span class="kw">def</span> plus_grand_ecart(t):
    <span class="str">"""Renvoie (i, e) : e = plus grande valeur de abs(t[i + 1] - t[i]),</span>
<span class="str">    atteinte pour la première fois à l'indice i (t a au moins 2 éléments)."""</span>
    ib = 0
    eb = abs(t[1] - t[0])
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t) - 1):
        e = abs(t[i + 1] - t[i])
        <span class="kw">if</span> e &gt; eb:
            ib, eb = i, e
    <span class="kw">return</span> ib, eb</pre>
    <pre class="codeblock">&gt;&gt;&gt; nb_max([4, 9, 2, 9, 9, 1]), nb_max([-3, -7, -3])
(3, 2)
&gt;&gt;&gt; plus_grand_ecart([12, 15, 9, 10, 17, 16])
(3, 7)</pre>
    <p>Dans <span class="code-inline">[12, 15, 9, 10, 17, 16]</span>, les écarts valent 3, 6, 1, 7, 1 : le plus grand, 7, est atteint à l'indice 3.</p>
    <p><strong>Q3.</strong> Si toutes les valeurs sont négatives (températures d'hiver), un maximum initialisé à 0 ne serait jamais battu : la fonction compterait des 0 absents de la liste. <span class="code-inline">t[0]</span> est une valeur réellement présente.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Boucles imbriquées : compter et accélérer</h3>
  <div class="statement">On s'intéresse aux couples d'entiers <span class="code-inline">(a, b)</span> avec <span class="code-inline">1 &lt;= a &lt;= b</span> et <span class="code-inline">a * b == N</span>.</div>
  <div class="q"><strong>Q1.</strong> Combien de fois le corps de <span class="code-inline">for i in range(n): for j in range(i, n): …</span> est-il exécuté ?</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">couples_produit(N)</span> qui compte ces couples avec deux boucles imbriquées de 1 à <span class="code-inline">N</span>. Combien de tests <span class="code-inline">a * b == N</span> effectue-t-elle ?</div>
  <div class="q"><strong>Q3.</strong> Écrire une version à une seule boucle, qui s'arrête dès que <span class="code-inline">a * a &gt; N</span>. Combien de tours pour \(N = 10^6\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour chaque <span class="code-inline">i</span>, la boucle intérieure fait \(n - i\) tours : au total \(n + (n-1) + \dots + 1 = \dfrac{n(n+1)}{2}\).</p>
    <p><strong>Q2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> couples_produit(N):
    <span class="str">"""Nombre de couples (a, b), 1 &lt;= a &lt;= b, tels que a * b == N."""</span>
    c = 0
    <span class="kw">for</span> a <span class="kw">in</span> range(1, N + 1):
        <span class="kw">for</span> b <span class="kw">in</span> range(a, N + 1):
            <span class="kw">if</span> a * b == N:
                c = c + 1
    <span class="kw">return</span> c</pre>
    <p>Pour chaque <span class="code-inline">a</span>, <span class="code-inline">b</span> va de <span class="code-inline">a</span> à <span class="code-inline">N</span> : c'est le schéma de Q1 avec \(N\) valeurs, d'où \(\dfrac{N(N+1)}{2}\) tests (5 050 pour \(N = 100\)). Pour \(N = 100\), la fonction trouve 5 couples : (1, 100), (2, 50), (4, 25), (5, 20), (10, 10).</p>
    <p><strong>Q3.</strong> Pour un <span class="code-inline">a</span> donné, il y a au plus un <span class="code-inline">b</span> possible, <span class="code-inline">N // a</span>, à condition que <span class="code-inline">a</span> divise <span class="code-inline">N</span> ; la contrainte <span class="code-inline">a &lt;= b</span> s'écrit <span class="code-inline">a * a &lt;= N</span>.</p>
    <pre class="codeblock"><span class="kw">def</span> couples_produit_rapide(N):
    c = 0
    a = 1
    <span class="kw">while</span> a * a &lt;= N:          <span class="cmt"># a &lt;= b = N // a équivaut à a * a &lt;= N</span>
        <span class="kw">if</span> N % a == 0:
            c = c + 1
        a = a + 1
    <span class="kw">return</span> c</pre>
    <pre class="codeblock">&gt;&gt;&gt; couples_produit(100), couples_produit_rapide(100)
(5, 5)</pre>
    <p>La boucle tourne tant que <span class="code-inline">a * a &lt;= N</span>, soit \(\lfloor\sqrt{N}\rfloor\) tours : 1 000 tours pour \(N = 10^6\), contre environ \(5\times 10^{11}\) tests pour la version de Q2. Réfléchir avant d'imbriquer des boucles peut tout changer (chapitre « Spécification, correction et complexité »).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Suite de Syracuse — temps de vol et record</h3>
  <div class="statement">
    La suite de Syracuse part d'un entier \(u \ge 1\) et applique la règle : si \(u\) est pair, \(u \leftarrow u/2\) ; sinon \(u \leftarrow 3u+1\). On admet (conjecture de Collatz) qu'elle atteint toujours \(1\). Le <strong>temps de vol</strong> est le nombre d'étapes pour atteindre \(1\).
  </div>
  <p class="exo-part">Partie A — Vol d'une valeur</p>
  <div class="q"><strong>A1.</strong> Écrire un programme qui, pour une valeur de départ <span class="code-inline">u</span>, calcule son temps de vol <span class="code-inline">t</span> et son <strong>altitude maximale</strong> <span class="code-inline">m</span> (plus grande valeur atteinte). Pourquoi une boucle <span class="code-inline">while</span> (et non <span class="code-inline">for</span>) ?</div>
  <div class="q"><strong>A2.</strong> Dérouler à la main pour \(u = 6\) : donner la suite des valeurs, le temps de vol et l'altitude maximale.</div>
  <p class="exo-part">Partie B — Recherche d'un record</p>
  <div class="q"><strong>B1.</strong> Écrire un programme qui détermine, parmi les départs \(u_0\) de \(1\) à \(N\), celui dont le temps de vol est le plus grand (en cas d'égalité, le plus petit \(u_0\)). On utilisera deux boucles imbriquées.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <pre class="codeblock"><span class="cmt"># A1 : u est l'entier de départ (u &gt;= 1)</span>
t = 0           <span class="cmt"># temps de vol</span>
m = u           <span class="cmt"># altitude maximale</span>
<span class="kw">while</span> u != 1:
    <span class="kw">if</span> u % 2 == 0:
        u = u // 2
    <span class="kw">else</span>:
        u = 3 * u + 1
    t = t + 1
    <span class="kw">if</span> u &gt; m:
        m = u
print(t, m)</pre>
    <p>On répète <em>jusqu'à</em> atteindre 1, sans savoir à l'avance en combien d'étapes (aucune borne connue) : c'est le cas d'usage typique de <span class="code-inline">while</span>. Personne ne sait d'ailleurs prouver que cette boucle termine pour tout \(u\) : c'est précisément la conjecture de Collatz (voir « Spécification, correction et complexité », §3).</p>
    <p><strong>A2.</strong> \(6 \to 3 \to 10 \to 5 \to 16 \to 8 \to 4 \to 2 \to 1\) : temps de vol \(t = 8\), altitude maximale \(m = 16\).</p>
    <pre class="codeblock"><span class="cmt"># B1 : record sur les départs 1..N</span>
record_u = 1
record_t = 0
<span class="kw">for</span> u0 <span class="kw">in</span> range(1, N + 1):
    u = u0
    t = 0
    <span class="kw">while</span> u != 1:
        <span class="kw">if</span> u % 2 == 0:
            u = u // 2
        <span class="kw">else</span>:
            u = 3 * u + 1
        t = t + 1
    <span class="kw">if</span> t &gt; record_t:        <span class="cmt"># &gt; strict : garde le plus petit u0 en cas d'égalité</span>
        record_t = t
        record_u = u0
print(record_u, record_t)</pre>
    <p>Pour \(N = 30\), le programme affiche <span class="code-inline">27 111</span> : le départ 27 met 111 étapes à retomber sur 1. La variable <span class="code-inline">u</span> est réinitialisée à chaque tour extérieur (<span class="code-inline">u = u0</span>), ainsi que le compteur <span class="code-inline">t</span> : c'est l'erreur classique des boucles imbriquées.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Surveillance d'une crue</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : boucles, accumulateurs, sorties anticipées, boucles imbriquées).</div>
  <div class="statement">Une station mesure toutes les heures la hauteur d'une rivière (en cm). Les mesures sont rangées dans une liste <span class="code-inline">h</span> de longueur \(n \ge 1\) ; <span class="code-inline">h[i]</span> est la mesure de l'heure <span class="code-inline">i</span>. Un <strong>seuil</strong> d'alerte est donné. Un <strong>épisode</strong> est une suite maximale de mesures consécutives strictement supérieures au seuil. On ne s'autorise que les éléments de Python au programme (<span class="code-inline">len</span>, accès <span class="code-inline">h[i]</span>, <span class="code-inline">append</span>), et l'on rappelle que les annotations <span class="code-inline">h: list</span> et <span class="code-inline">-&gt; int</span> indiquent les types attendus. Exemple utilisé dans tout l'exercice :
  <pre class="codeblock">h = [80, 120, 130, 95, 140, 150, 160, 100]
seuil = 110</pre>
  </div>

  <p class="exo-part">Partie A — Détecter un dépassement</p>
  <div class="q"><strong>A1.</strong> Écrire <span class="code-inline">depasse(h: list, seuil: float) -&gt; bool</span> qui indique si au moins une mesure dépasse strictement le seuil, en s'arrêtant dès que possible.</div>
  <div class="q"><strong>A2.</strong> Écrire <span class="code-inline">premier_depassement(h: list, seuil: float) -&gt; int</span> qui renvoie l'indice de la première mesure strictement supérieure au seuil, ou −1 s'il n'y en a pas, à l'aide d'une boucle <span class="code-inline">while</span>. Pourquoi l'ordre des deux tests de la condition est-il imposé ?</div>
  <div class="q"><strong>A3.</strong> Combien de comparaisons avec le seuil <span class="code-inline">premier_depassement</span> effectue-t-elle au pire ? Pour quelles listes ?</div>

  <p class="exo-part">Partie B — Épisodes de crue</p>
  <div class="q"><strong>B1.</strong> Un épisode commence à l'indice <span class="code-inline">i</span> si <span class="code-inline">h[i] &gt; seuil</span> et si <span class="code-inline">i</span> vaut 0 ou <span class="code-inline">h[i - 1] &lt;= seuil</span>. Écrire <span class="code-inline">nb_episodes(h: list, seuil: float) -&gt; int</span>. Justifier la place du test <span class="code-inline">i == 0</span>.</div>
  <div class="q"><strong>B2.</strong> Écrire <span class="code-inline">plus_long_episode(h: list, seuil: float) -&gt; int</span> qui renvoie la durée (en heures) du plus long épisode, 0 s'il n'y en a aucun, en un seul parcours.</div>
  <div class="q"><strong>B3.</strong> Dérouler <span class="code-inline">plus_long_episode</span> sur l'exemple.</div>

  <p class="exo-part">Partie C — Lisser les mesures</p>
  <div class="q"><strong>C1.</strong> Pour un entier \(1 \le k \le n\), la moyenne glissante d'indice \(i\) est la moyenne des \(k\) mesures <span class="code-inline">h[i]</span>, …, <span class="code-inline">h[i + k - 1]</span>, pour \(0 \le i \le n - k\). Écrire <span class="code-inline">moyennes_glissantes(h: list, k: int) -&gt; list</span> avec deux boucles imbriquées. Combien d'additions effectue-t-elle ?</div>
  <div class="q"><strong>C2.</strong> Remarquer qu'en passant de la fenêtre <span class="code-inline">i - 1</span> à la fenêtre <span class="code-inline">i</span>, une seule mesure entre et une seule sort. En déduire <span class="code-inline">moyennes_rapides(h: list, k: int) -&gt; list</span>, qui ne calcule la première somme qu'une fois. Combien d'additions et de soustractions ? Comparer pour un an de mesures horaires (\(n = 8760\)) et \(k = 24\).</div>
  <div class="q"><strong>C3.</strong> Les deux fonctions renvoient-elles toujours exactement les mêmes flottants ? Comment comparer leurs résultats dans un test ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Schéma de recherche : <span class="code-inline">return True</span> dans la boucle dès qu'une mesure convient, <span class="code-inline">return False</span> après la boucle.</p>
    <pre class="codeblock"><span class="kw">def</span> depasse(h: list, seuil: float) -&gt; bool:
    <span class="kw">for</span> x <span class="kw">in</span> h:
        <span class="kw">if</span> x &gt; seuil:
            <span class="kw">return</span> <span class="kw">True</span>      <span class="cmt"># un dépassement suffit</span>
    <span class="kw">return</span> <span class="kw">False</span>             <span class="cmt"># tout examiné : aucun dépassement</span></pre>
    <p><strong>A2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> premier_depassement(h: list, seuil: float) -&gt; int:
    i = 0
    <span class="kw">while</span> i &lt; len(h) <span class="kw">and</span> h[i] &lt;= seuil:
        i = i + 1
    <span class="kw">if</span> i &lt; len(h):
        <span class="kw">return</span> i             <span class="cmt"># sortie car h[i] &gt; seuil</span>
    <span class="kw">return</span> -1                <span class="cmt"># sortie car i == len(h)</span></pre>
    <p>À cause de l'évaluation paresseuse de <span class="code-inline">and</span>, <span class="code-inline">h[i]</span> n'est lu que si <span class="code-inline">i &lt; len(h)</span> : dans l'ordre inverse, la dernière évaluation lirait <span class="code-inline">h[len(h)]</span> quand aucune mesure ne dépasse, d'où une <span class="code-inline">IndexError</span>. À la sortie, ou bien <span class="code-inline">i == len(h)</span> (rien trouvé), ou bien <span class="code-inline">h[i] &gt; seuil</span> : le test final distingue les deux cas.</p>
    <p><strong>A3.</strong> Chaque tour fait une comparaison <span class="code-inline">h[i] &lt;= seuil</span> ; au pire, toutes les mesures sont examinées : \(n\) comparaisons, quand aucune mesure ne dépasse le seuil ou que seule la dernière le dépasse. Le coût est linéaire.</p>
    <p><strong>B1.</strong> On compte les débuts d'épisode.</p>
    <pre class="codeblock"><span class="kw">def</span> nb_episodes(h: list, seuil: float) -&gt; int:
    c = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(len(h)):
        <span class="kw">if</span> h[i] &gt; seuil <span class="kw">and</span> (i == 0 <span class="kw">or</span> h[i - 1] &lt;= seuil):
            c = c + 1        <span class="cmt"># i est le début d'un épisode</span>
    <span class="kw">return</span> c</pre>
    <p>Pour <span class="code-inline">i = 0</span>, <span class="code-inline">h[i - 1]</span> serait <span class="code-inline">h[-1]</span> : un indice négatif, hors de l'usage autorisé (en Python, il désignerait même la <em>dernière</em> mesure, ce qui fausserait le résultat). Placé avant le <span class="code-inline">or</span>, le test <span class="code-inline">i == 0</span> est vrai et, par évaluation paresseuse, <span class="code-inline">h[i - 1]</span> n'est pas évalué. Les parenthèses sont nécessaires : <span class="code-inline">and</span> est prioritaire sur <span class="code-inline">or</span>.</p>
    <p><strong>B2.</strong> Deux accumulateurs : la longueur de l'épisode en cours, remise à 0 dès qu'une mesure ne dépasse pas, et le record. Le record est initialisé à 0, valeur attendue quand il n'y a aucun épisode (ici 0 n'est pas un piège : c'est la bonne réponse pour une liste sans dépassement).</p>
    <pre class="codeblock"><span class="kw">def</span> plus_long_episode(h: list, seuil: float) -&gt; int:
    record = 0               <span class="cmt"># plus long épisode déjà terminé ou en cours</span>
    courant = 0              <span class="cmt"># longueur de l'épisode en cours</span>
    <span class="kw">for</span> x <span class="kw">in</span> h:
        <span class="kw">if</span> x &gt; seuil:
            courant = courant + 1
            <span class="kw">if</span> courant &gt; record:
                record = courant
        <span class="kw">else</span>:
            courant = 0      <span class="cmt"># l'épisode en cours s'interrompt</span>
    <span class="kw">return</span> record</pre>
    <p><strong>B3.</strong> Avec le seuil 110 :</p>
    <div><table>
<tr><th><span class="code-inline">i</span></th><th><span class="code-inline">h[i]</span></th><th><span class="code-inline">h[i] &gt; seuil</span> ?</th><th><span class="code-inline">courant</span></th><th><span class="code-inline">record</span></th></tr>
<tr><td>0</td><td>80</td><td>non</td><td>0</td><td>0</td></tr>
<tr><td>1</td><td>120</td><td>oui</td><td>1</td><td>1</td></tr>
<tr><td>2</td><td>130</td><td>oui</td><td>2</td><td>2</td></tr>
<tr><td>3</td><td>95</td><td>non</td><td>0</td><td>2</td></tr>
<tr><td>4</td><td>140</td><td>oui</td><td>1</td><td>2</td></tr>
<tr><td>5</td><td>150</td><td>oui</td><td>2</td><td>2</td></tr>
<tr><td>6</td><td>160</td><td>oui</td><td>3</td><td>3</td></tr>
<tr><td>7</td><td>100</td><td>non</td><td>0</td><td>3</td></tr>
</table></div>
    <p>Deux épisodes, de 2 et 3 heures : la fonction renvoie 3 (et <span class="code-inline">nb_episodes</span> renvoie 2).</p>
    <p><strong>C1.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> moyennes_glissantes(h: list, k: int) -&gt; list:
    <span class="str">"""Précondition : 1 &lt;= k &lt;= len(h)."""</span>
    res = []
    <span class="kw">for</span> i <span class="kw">in</span> range(len(h) - k + 1):
        s = 0
        <span class="kw">for</span> j <span class="kw">in</span> range(i, i + k):      <span class="cmt"># k additions</span>
            s = s + h[j]
        res.append(s / k)
    <span class="kw">return</span> res</pre>
    <p>La boucle extérieure fait \(n - k + 1\) tours, la boucle intérieure \(k\) additions à chaque tour : \((n - k + 1)\,k\) additions en tout.</p>
    <p><strong>C2.</strong></p>
    <pre class="codeblock"><span class="kw">def</span> moyennes_rapides(h: list, k: int) -&gt; list:
    <span class="str">"""Précondition : 1 &lt;= k &lt;= len(h)."""</span>
    s = 0
    <span class="kw">for</span> j <span class="kw">in</span> range(k):
        s = s + h[j]
    res = [s / k]
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(h) - k + 1):
        s = s + h[i + k - 1] - h[i - 1]    <span class="cmt"># entre h[i+k-1], sort h[i-1]</span>
        res.append(s / k)
    <span class="kw">return</span> res</pre>
    <p>\(k\) additions pour la première somme, puis, pour chacune des \(n - k\) fenêtres suivantes, une addition et une soustraction : \(k + 2(n - k)\) opérations, un coût linéaire en \(n\) quel que soit \(k\).</p>
    <div><table>
<tr><th>version</th><th>opérations (n = 8760, k = 24)</th></tr>
<tr><td><span class="code-inline">moyennes_glissantes</span></td><td>209 688</td></tr>
<tr><td><span class="code-inline">moyennes_rapides</span></td><td>17 496</td></tr>
</table></div>
    <p><strong>C3.</strong> Pas toujours : les flottants sont arrondis à chaque opération, et la version rapide enchaîne des additions et des soustractions dans un autre ordre, ce qui peut accumuler des écarts au dernier chiffre (sur l'exemple, les résultats coïncident).</p>
    <pre class="codeblock">&gt;&gt;&gt; h = [80, 120, 130, 95, 140, 150, 160, 100]
&gt;&gt;&gt; depasse(h, 110), premier_depassement(h, 110), premier_depassement(h, 200)
(<span class="kw">True</span>, 1, -1)
&gt;&gt;&gt; nb_episodes(h, 110), plus_long_episode(h, 110)
(2, 3)
&gt;&gt;&gt; moyennes_glissantes(h, 3)
[110.0, 115.0, 121.66666666666667, 128.33333333333334, 150.0, 136.66666666666666]
&gt;&gt;&gt; moyennes_rapides(h, 3) == moyennes_glissantes(h, 3)
<span class="kw">True</span></pre>
    <p>Dans un test, on compare donc les deux listes terme à terme avec une tolérance, par exemple <span class="code-inline">abs(a[i] - b[i]) &lt; 1e-9</span> pour tout <span class="code-inline">i</span>, après avoir vérifié qu'elles ont la même longueur.</p>
