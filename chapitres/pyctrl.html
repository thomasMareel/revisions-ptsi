  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Les structures de contrôle décident de <strong>quelles</strong> instructions s'exécutent, et <strong>combien de fois</strong> : conditions, boucles bornées et non bornées, sorties anticipées. Elles sont l'outil de tous les algorithmes du programme (recherche, tris, graphes…). Ce chapitre suit « Bases de Python » ; les preuves de terminaison et de correction des boucles (variant, invariant) et le calcul de leur coût sont traités dans « Spécification, correction et complexité ».</div>

        <li><strong>Boucle</strong> <span class="code-inline">while</span> (sans <span class="code-inline">else</span>) (§5).</li>

<div class="course-section">
  <div class="sec-num">§1 · BLOCS ET INDENTATION</div>
  <h2>Le décalage des lignes fait la structure</h2>
  <div class="intro">Une condition ou une boucle commande un <strong>bloc</strong> d'instructions. En Python, aucune accolade ni aucun mot « fin » : c'est l'indentation, le décalage des lignes vers la droite, qui dit où commence et où finit chaque bloc.</div>

  <div class="def-box">Une ligne qui se termine par <strong>deux-points</strong> <span class="code-inline">:</span> (<span class="code-inline">if</span>, <span class="code-inline">elif</span>, <span class="code-inline">else</span>, <span class="code-inline">for</span>, <span class="code-inline">while</span>, <span class="code-inline">def</span>) annonce un <strong>bloc</strong> : les lignes suivantes, décalées d'un même cran (4 espaces par convention), en font partie. Le bloc se termine à la première ligne qui revient au niveau de départ. Un bloc peut en contenir d'autres, décalés d'un cran de plus.</div>
  <pre class="codeblock">n = 7
<span class="kw">if</span> n % 2 == 0:
    print(<span class="str">"pair"</span>)
    n = n // 2
<span class="kw">else</span>:
    print(<span class="str">"impair"</span>)
    n = 3 * n + 1
print(n)               <span class="cmt"># hors du if : toujours exécuté</span></pre>
  <figure class="schema" style="max-width:440px">

  <div class="method-box"><strong>Exemple — quelles lignes s'exécutent ?</strong>
    <ol>
      <li>Avec <span class="code-inline">n = 7</span> : <span class="code-inline">7 % 2 == 0</span> est faux, on saute le bloc du <span class="code-inline">if</span> et on exécute celui du <span class="code-inline">else</span> : affichage de <span class="code-inline">impair</span>, puis <span class="code-inline">n</span> vaut \(3\times 7 + 1 = 22\).</li>
      <li>La dernière ligne n'est pas décalée : elle est hors du <span class="code-inline">if … else</span> et s'exécute dans tous les cas ; elle affiche <span class="code-inline">22</span>.</li>
      <li>Avec <span class="code-inline">n = 10</span>, on exécuterait le bloc du <span class="code-inline">if</span> : affichage de <span class="code-inline">pair</span>, puis <span class="code-inline">5</span>.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : oublier les deux-points ; oublier de décaler le bloc, ce que Python refuse avant toute exécution (<span class="code-inline">IndentationError</span>) ; décaler une ligne de trop ou de moins, ce que Python accepte souvent… en changeant le sens du programme (exemple au §3). Le code suivant est refusé :
    <pre class="codeblock"><span class="kw">if</span> n &gt; 0:
print(<span class="str">"positif"</span>)</pre>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · INSTRUCTION CONDITIONNELLE</div>
  <h2>If, elif, else</h2>
  <div class="intro">Une instruction conditionnelle exécute un bloc ou un autre selon la valeur d'une condition, c'est-à-dire d'une expression booléenne (comparaisons combinées par <span class="code-inline">and</span>, <span class="code-inline">or</span>, <span class="code-inline">not</span> : chapitre « Bases de Python », §5 à §7).</div>

  <div class="def-box">
    <ul>
      <li><span class="code-inline">if c:</span> suivi d'un bloc : le bloc est exécuté si <span class="code-inline">c</span> est vraie, sauté sinon.</li>
      <li><span class="code-inline">if c:</span> bloc 1 <span class="code-inline">else:</span> bloc 2 : exactement un des deux blocs est exécuté.</li>
      <li><span class="code-inline">if c1:</span> … <span class="code-inline">elif c2:</span> … <span class="code-inline">elif c3:</span> … <span class="code-inline">else:</span> … : les conditions sont testées <strong>dans l'ordre</strong> ; le bloc de la <strong>première</strong> condition vraie est exécuté, et lui seul ; les conditions suivantes ne sont même pas évaluées. Le bloc <span class="code-inline">else</span> (facultatif) est exécuté si aucune n'est vraie.</li>
    </ul>
  </div>
  <figure class="schema" style="max-width:440px">

</figure>
  <p>Dans ce chapitre, les exemples sont souvent écrits sous forme de <strong>fonctions</strong> : <span class="code-inline">def nom(paramètres):</span> suivi d'un bloc, où <span class="code-inline">return valeur</span> termine la fonction en renvoyant le résultat (chapitre « Fonctions »).</p>
  <pre class="codeblock"><span class="kw">def</span> tarif(age):
    <span class="str">"""Prix d'entrée (en euros) selon l'âge, entier positif."""</span>
    <span class="kw">if</span> age &lt; 4:
        <span class="kw">return</span> 0
    <span class="kw">elif</span> age &lt; 12:
        <span class="kw">return</span> 5
    <span class="kw">elif</span> age &lt; 65:
        <span class="kw">return</span> 9
    <span class="kw">else</span>:
        <span class="kw">return</span> 6</pre>

  <div class="method-box"><strong>Exemple — l'ordre des tests compte</strong>
    <p>Valeurs de <span class="code-inline">tarif</span> pour quelques âges :</p>
    <div><table>
<tr><th><span class="code-inline">age</span></th><th><span class="code-inline">tarif(age)</span></th><th>branche exécutée</th></tr>
<tr><td>2</td><td>0</td><td><span class="code-inline">age &lt; 4</span></td></tr>
<tr><td>4</td><td>5</td><td><span class="code-inline">age &lt; 12</span></td></tr>
<tr><td>8</td><td>5</td><td><span class="code-inline">age &lt; 12</span></td></tr>
<tr><td>12</td><td>9</td><td><span class="code-inline">age &lt; 65</span></td></tr>
<tr><td>30</td><td>9</td><td><span class="code-inline">age &lt; 65</span></td></tr>
<tr><td>65</td><td>6</td><td><span class="code-inline">else</span></td></tr>
<tr><td>70</td><td>6</td><td><span class="code-inline">else</span></td></tr>
</table></div>
    <ol>
      <li>Pour <span class="code-inline">tarif(8)</span> : <span class="code-inline">8 &lt; 4</span> est faux, puis <span class="code-inline">8 &lt; 12</span> est vrai, la fonction renvoie 5 ; le test <span class="code-inline">age &lt; 65</span> n'est jamais évalué.</li>
      <li>Grâce à l'ordre croissant des seuils, chaque branche <span class="code-inline">elif</span> sait que les tests précédents ont échoué : la branche <span class="code-inline">age &lt; 12</span> ne concerne que les âges de 4 à 11.</li>
      <li>Si l'on écrit les tests dans le désordre, une branche peut devenir inaccessible :</li>
    </ol>
    <pre class="codeblock"><span class="kw">def</span> tarif_faux(age):
    <span class="kw">if</span> age &lt; 65:
        <span class="kw">return</span> 9
    <span class="kw">elif</span> age &lt; 12:       <span class="cmt"># jamais atteint : age &lt; 12 entraîne age &lt; 65</span>
        <span class="kw">return</span> 5
    <span class="kw">elif</span> age &lt; 4:
        <span class="kw">return</span> 0
    <span class="kw">else</span>:
        <span class="kw">return</span> 6</pre>
    <p>Ici tout âge inférieur à 65 renvoie 9, y compris 2 ou 8 : les branches suivantes ne servent qu'aux âges d'au moins 65 ans, pour lesquels <span class="code-inline">age &lt; 12</span> et <span class="code-inline">age &lt; 4</span> sont faux, d'où 6.</p>
  </div>

  <h3>Deux if ou un if … elif ?</h3>
  <p>Deux <span class="code-inline">if</span> successifs sont deux tests <strong>indépendants</strong> : le second est toujours évalué, avec les valeurs modifiées par le premier bloc. Avec <span class="code-inline">elif</span>, le second test n'a lieu que si le premier a échoué.</p>
  <pre class="codeblock">x = 5
<span class="kw">if</span> x &gt; 0:
    x = x - 10
<span class="kw">if</span> x &lt; 0:              <span class="cmt"># test indépendant : il voit le nouveau x</span>
    print(<span class="str">"négatif"</span>)</pre>
  <pre class="codeblock">x = 5
<span class="kw">if</span> x &gt; 0:
    x = x - 10
<span class="kw">elif</span> x &lt; 0:            <span class="cmt"># pas évalué : la 1re condition était vraie</span>
    print(<span class="str">"négatif"</span>)</pre>
  <p>Le premier programme affiche <span class="code-inline">négatif</span> alors que <span class="code-inline">x</span> valait 5 au départ ; le second n'affiche rien.</p>

  <div class="method-box"><strong>Exemple — nombre de solutions d'une équation du second degré</strong>
    <pre class="codeblock"><span class="kw">def</span> nb_racines(a, b, c):
    <span class="str">"""Nombre de solutions réelles de a*x**2 + b*x + c = 0,</span>
<span class="str">    pour des entiers a, b, c avec a non nul."""</span>
    delta = b * b - 4 * a * c
    <span class="kw">if</span> delta &gt; 0:
        <span class="kw">return</span> 2
    <span class="kw">elif</span> delta == 0:
        <span class="kw">return</span> 1
    <span class="kw">else</span>:
        <span class="kw">return</span> 0</pre>
    <ol>
      <li>Les trois cas \(\Delta \gt 0\), \(\Delta = 0\), \(\Delta \lt 0\) sont exclusifs et couvrent tout : une chaîne <span class="code-inline">if … elif … else</span> les traduit directement.</li>
      <li><span class="code-inline">nb_racines(1, -3, 2)</span> : \(\Delta = 9 - 8 = 1 \gt 0\), renvoie 2 (solutions 1 et 2). <span class="code-inline">nb_racines(1, 2, 1)</span> : \(\Delta = 0\), renvoie 1. <span class="code-inline">nb_racines(1, 0, 1)</span> : \(\Delta = -4\), renvoie 0.</li>
      <li>Le test <span class="code-inline">delta == 0</span> est sûr parce que les coefficients sont des entiers ; avec des flottants, il faudrait une tolérance (« Bases de Python », §5).</li>
    </ol>
  </div>

  <div class="prop-box"><strong>Renvoyer un booléen.</strong> Une condition est déjà un booléen : plutôt que <span class="code-inline">if n % 2 == 0: return True</span> puis <span class="code-inline">else: return False</span>, on écrit directement :
    <pre class="codeblock"><span class="kw">def</span> est_pair(n):
    <span class="kw">return</span> n % 2 == 0      <span class="cmt"># le booléen lui-même, sans if</span></pre>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : écrire <span class="code-inline">if x == 1 or 2:</span> (toujours vrai, il faut <span class="code-inline">x == 1 or x == 2</span>) ; mettre une condition après <span class="code-inline">else</span> (refusé : <span class="code-inline">else</span> n'en a pas, c'est <span class="code-inline">elif</span> qui en a une) ; laisser des cas non couverts sans <span class="code-inline">else</span> ; écrire <span class="code-inline">if trouve == True:</span> au lieu de <span class="code-inline">if trouve:</span>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · BOUCLE FOR SUR UN RANGE</div>
  <h2>Répéter un nombre de fois connu</h2>
  <div class="intro">Quand on sait d'avance combien de tours faire (pour \(k\) allant de 1 à \(n\)…), on utilise une boucle <span class="code-inline">for</span> sur un <span class="code-inline">range</span> : la variable de boucle prend successivement chaque valeur de l'intervalle.</div>

  <div class="def-box"><span class="code-inline">for i in range(a, b):</span> suivi d'un bloc exécute le bloc pour <span class="code-inline">i</span> valant <span class="code-inline">a</span>, <span class="code-inline">a + 1</span>, …, <span class="code-inline">b - 1</span> : la borne <span class="code-inline">b</span> est <strong>exclue</strong>. <span class="code-inline">range(n)</span> abrège <span class="code-inline">range(0, n)</span> : <span class="code-inline">i</span> vaut 0, 1, …, <span class="code-inline">n - 1</span>.
    <div class="formula" data-nom="Nombre de tours d'un range">$$\text{nombre de tours de } \texttt{range(a, b)} = b - a \quad \text{si } b \ge a, \qquad 0 \text{ sinon.}$$</div>
  </div>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">for</span> i <span class="kw">in</span> range(2, 6):
...     print(i, i ** 2)
2 4
3 9
4 16
5 25
&gt;&gt;&gt; <span class="kw">for</span> i <span class="kw">in</span> range(3):
...     print(i)
0
1
2
&gt;&gt;&gt; <span class="kw">for</span> i <span class="kw">in</span> range(5, 2):    <span class="cmt"># b &lt;= a : aucun tour</span>
...     print(i)</pre>

  <div class="method-box"><strong>Exemple — calculer \(n!\) et suivre la boucle</strong>
    <pre class="codeblock">n = 5
p = 1                        <span class="cmt"># produit vide</span>
<span class="kw">for</span> k <span class="kw">in</span> range(1, n + 1):    <span class="cmt"># k = 1, 2, ..., n</span>
    p = p * k
print(p)                     <span class="cmt"># affiche 120</span></pre>
    <p>Tableau des tours (valeurs <strong>à la fin</strong> de chaque tour) :</p>
    <div><table>
<tr><th><span class="code-inline">k</span></th><th><span class="code-inline">p</span> en fin de tour</th></tr>
<tr><td>1</td><td>1</td></tr>
<tr><td>2</td><td>2</td></tr>
<tr><td>3</td><td>6</td></tr>
<tr><td>4</td><td>24</td></tr>
<tr><td>5</td><td>120</td></tr>
</table></div>
    <ol>
      <li>Pour aller jusqu'à <span class="code-inline">n</span> inclus, la borne est <span class="code-inline">n + 1</span>.</li>
      <li><span class="code-inline">p</span> démarre à 1, élément neutre du produit : pour <span class="code-inline">n = 0</span>, la boucle ne fait aucun tour et <span class="code-inline">p</span> vaut bien \(0! = 1\).</li>
      <li>À la fin du tour où <span class="code-inline">k</span> vaut \(j\), <span class="code-inline">p</span> vaut \(j!\) : c'est un <strong>invariant</strong> de la boucle (chapitre « Spécification, correction et complexité », §4).</li>
    </ol>
  </div>

  <h3>Dedans ou après la boucle ?</h3>
  <p>Une seule colonne d'écart change tout : une instruction décalée sous le <span class="code-inline">for</span> s'exécute à chaque tour, une instruction revenue au niveau du <span class="code-inline">for</span> s'exécute une fois, après la boucle.</p>
  <pre class="codeblock">s = 0
<span class="kw">for</span> k <span class="kw">in</span> range(1, 4):
    s = s + k
    print(s)         <span class="cmt"># dans la boucle : affiche 1, puis 3, puis 6</span>
print(s)             <span class="cmt"># après la boucle : affiche 6, une fois</span></pre>

  <h3>Un range ne contient que des entiers</h3>
  <pre class="codeblock">&gt;&gt;&gt; <span class="kw">for</span> x <span class="kw">in</span> range(0, 2, 0.5):
...     print(x)
Traceback (most recent call last):
  ...
TypeError: <span class="str">'float'</span> object cannot be interpreted <span class="kw">as</span> an integer</pre>
  <p>Pour parcourir des valeurs réelles régulièrement espacées (tableau de valeurs, méthodes numériques), on boucle sur un <strong>entier</strong> <span class="code-inline">k</span> et on calcule <span class="code-inline">x = a + k * h</span> :</p>
  <pre class="codeblock">a, b, n = 0.0, 2.0, 4
h = (b - a) / n                <span class="cmt"># pas de la subdivision : 0.5</span>
<span class="kw">for</span> k <span class="kw">in</span> range(n + 1):         <span class="cmt"># k = 0, 1, ..., n</span>
    x = a + k * h
    print(x, x ** 2 - 2)</pre>

  <div class="prop-box"><strong>Variable de boucle.</strong> À chaque tour, la variable de boucle reçoit la valeur suivante du <span class="code-inline">range</span>, quoi qu'on lui ait fait subir dans le corps : la modifier dans le bloc ne change ni le nombre de tours ni les valeurs suivantes.
    <pre class="codeblock"><span class="kw">for</span> i <span class="kw">in</span> range(3):
    print(i)
    i = 10           <span class="cmt"># sans effet : le tour suivant reprend la valeur suivante</span></pre>
    Ce programme affiche 0, 1 et 2.
  </div>
  <p>Avec un troisième argument, <span class="code-inline">range(a, b, p)</span> avance par pas de <span class="code-inline">p</span> : <span class="code-inline">range(1, 10, 3)</span> donne 1, 4, 7 et <span class="code-inline">range(10, 0, -2)</span> donne 10, 8, 6, 4, 2. Le pas ne figure pas dans l'annexe : un énoncé qui l'utilise le rappelle.</p>

  <div class="notice"><strong>Erreurs classiques</strong> : oublier que la borne supérieure est exclue (<span class="code-inline">range(1, n)</span> s'arrête à <span class="code-inline">n - 1</span>) ; partir de 1 au lieu de 0 pour les indices ; vérifier une borne en testant le plus petit cas (<span class="code-inline">n = 0</span> ou <span class="code-inline">n = 1</span>) évite la plupart de ces erreurs « à un près ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PARCOURIR CHAÎNES, LISTES, TUPLES, DICTIONNAIRES</div>
  <h2>Boucler sur les éléments d'une séquence</h2>
  <div class="intro">Une boucle <span class="code-inline">for</span> peut parcourir directement les éléments d'une chaîne, d'une liste ou d'un tuple, sans passer par les indices ; pour un dictionnaire, elle parcourt ses clés, ou ses couples (clé, valeur).</div>

  <div class="def-box">Si <span class="code-inline">s</span> est une chaîne, une liste ou un tuple, <span class="code-inline">for x in s:</span> exécute le bloc une fois pour chaque élément, dans l'ordre : <span class="code-inline">x</span> vaut <span class="code-inline">s[0]</span>, puis <span class="code-inline">s[1]</span>, …, puis <span class="code-inline">s[len(s) - 1]</span>. Pour un dictionnaire <span class="code-inline">d</span>, <span class="code-inline">for k in d.keys():</span> parcourt les clés et <span class="code-inline">for k, v in d.items():</span> parcourt les couples (clé, valeur).</div>
  <pre class="codeblock"><span class="kw">def</span> nb_occurrences(s, car):
    <span class="str">"""Nombre de fois où le caractère car apparaît dans la chaîne s."""</span>
    c = 0
    <span class="kw">for</span> x <span class="kw">in</span> s:
        <span class="kw">if</span> x == car:
            c = c + 1
    <span class="kw">return</span> c</pre>

  <h3>Par élément ou par indice ?</h3>
  <p>On parcourt <strong>par élément</strong> (<span class="code-inline">for x in s</span>) quand seule la valeur compte, et <strong>par indice</strong> (<span class="code-inline">for i in range(len(s))</span>) quand on a besoin de la position : comparer un élément à son voisin, renvoyer un indice, modifier une liste.</p>
  <pre class="codeblock"><span class="kw">def</span> nb_doublets(s):
    <span class="str">"""Nombre d'indices i tels que s[i] == s[i + 1]."""</span>
    c = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(len(s) - 1):     <span class="cmt"># i + 1 doit rester un indice valide</span>
        <span class="kw">if</span> s[i] == s[i + 1]:
            c = c + 1
    <span class="kw">return</span> c</pre>
  <pre class="codeblock">&gt;&gt;&gt; nb_occurrences(<span class="str">"abracadabra"</span>, <span class="str">"a"</span>)
5
&gt;&gt;&gt; nb_doublets(<span class="str">"aabbb"</span>), nb_doublets(<span class="str">"ballon"</span>), nb_doublets(<span class="str">""</span>)
(3, 1, 0)</pre>

  <div class="method-box"><strong>Exemple — trace de <span class="code-inline">nb_doublets("aabbb")</span></strong>
    <p>La chaîne a 5 caractères ; <span class="code-inline">i</span> parcourt <span class="code-inline">range(4)</span>, de 0 à 3, pour que <span class="code-inline">s[i + 1]</span> existe toujours.</p>
    <div><table>
<tr><th><span class="code-inline">i</span></th><th><span class="code-inline">s[i]</span></th><th><span class="code-inline">s[i + 1]</span></th><th>égaux ?</th><th><span class="code-inline">c</span> après le tour</th></tr>
<tr><td>0</td><td><span class="code-inline">'a'</span></td><td><span class="code-inline">'a'</span></td><td>oui</td><td>1</td></tr>
<tr><td>1</td><td><span class="code-inline">'a'</span></td><td><span class="code-inline">'b'</span></td><td>non</td><td>1</td></tr>
<tr><td>2</td><td><span class="code-inline">'b'</span></td><td><span class="code-inline">'b'</span></td><td>oui</td><td>2</td></tr>
<tr><td>3</td><td><span class="code-inline">'b'</span></td><td><span class="code-inline">'b'</span></td><td>oui</td><td>3</td></tr>
</table></div>
    <p>Résultat : 3. Avec <span class="code-inline">range(len(s))</span>, le dernier tour lirait <span class="code-inline">s[5]</span>, qui n'existe pas : <span class="code-inline">IndexError</span>. Pour la chaîne vide, <span class="code-inline">range(-1)</span> ne fait aucun tour et la fonction renvoie 0, comme il se doit.</p>
  </div>

  <h3>Listes, tuples, dictionnaires</h3>
  <pre class="codeblock">notes = [12, 15.5, 9, 17]
total = 0
<span class="kw">for</span> x <span class="kw">in</span> notes:
    total = total + x
moyenne = total / len(notes)       <span class="cmt"># 13.375</span></pre>
  <pre class="codeblock">stock = {<span class="str">"pommes"</span>: 12, <span class="str">"poires"</span>: 0, <span class="str">"kiwis"</span>: 7}
<span class="kw">for</span> fruit, n <span class="kw">in</span> stock.items():
    <span class="kw">if</span> n == 0:
        print(<span class="str">"rupture :"</span>, fruit)
total = 0
<span class="kw">for</span> fruit <span class="kw">in</span> stock.keys():
    total = total + stock[fruit]   <span class="cmt"># total vaut 19 à la fin</span></pre>
  <p>Le premier programme calcule la moyenne \(\dfrac{12 + 15{,}5 + 9 + 17}{4} = 13{,}375\) ; le second affiche <span class="code-inline">rupture : poires</span>, puis cumule les quantités (19 fruits). Un tuple se parcourt comme une liste : <span class="code-inline">for x in (3, 1, 4):</span>. Le fonctionnement des listes et des dictionnaires est détaillé dans le chapitre « Types construits ».</p>

  <div class="notice"><strong>Erreur classique</strong> : modifier la liste qu'on est en train de parcourir (lui ajouter ou lui retirer des éléments dans le corps de <span class="code-inline">for x in t</span>) : le parcours devient imprévisible. On construit plutôt une nouvelle liste.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BOUCLE WHILE</div>
  <h2>Répéter tant qu'une condition est vraie</h2>
  <div class="intro">Quand on ne sait pas d'avance combien de tours seront nécessaires (atteindre un seuil, épuiser les chiffres d'un nombre, trouver un élément), on répète <strong>tant qu'</strong>une condition reste vraie.</div>

  <div class="def-box"><span class="code-inline">while c:</span> suivi d'un bloc : Python évalue la condition <span class="code-inline">c</span> ; si elle est vraie, il exécute le bloc, puis revient au test ; dès qu'elle est fausse, il passe à la suite. La condition est testée <strong>avant</strong> chaque tour : si elle est fausse dès le départ, le bloc n'est jamais exécuté.</div>
  <figure class="schema" style="max-width:400px">
<svg viewBox="0 0 330 186" role="img" aria-label="Organigramme d'une boucle while : on teste la condition ; si elle est vraie on exécute le corps puis on reteste ; si elle est fausse on passe à la suite">
<line x1="150" y1="4" x2="150" y2="22" class="sk-ink" marker-end="url(#sk-arrow-ink)"/>
<polygon points="150,22 228,46 150,70 72,46" class="sk-accent2 fl-accent2-soft"/>
<text x="150" y="51" text-anchor="middle" style="font-size:12px">condition vraie ?</text>
<line x1="150" y1="70" x2="150" y2="98" class="sk-ink" marker-end="url(#sk-arrow-ink)"/>
<text x="158" y="89" class="lab-green" style="font-size:12px">vrai</text>
<rect x="86" y="100" width="128" height="32" rx="4" class="sk-green fl-green-soft"/>
<text x="150" y="121" text-anchor="middle">corps de la boucle</text>
<path d="M86,116 L36,116 L36,46 L68,46" class="sk-dash" fill="none" marker-end="url(#sk-arrow-ink)"/>
<text x="42" y="90" class="lab-muted" style="font-size:12px">on reteste</text>
<path d="M228,46 L262,46 L262,150" class="sk-ink" fill="none" marker-end="url(#sk-arrow-ink)"/>
<text x="244" y="38" class="lab-accent" text-anchor="middle" style="font-size:12px">faux</text>
<rect x="206" y="152" width="112" height="28" rx="4" class="sk-ink fl-soft"/>
<text x="262" y="171" text-anchor="middle">suite</text>
</svg>
<figcaption>Boucle <span class="code-inline">while</span> : le test a lieu <strong>avant</strong> chaque tour. Tant que la condition est vraie, on exécute le corps puis on reteste ; dès qu'elle est fausse, on sort. Si elle est fausse dès le départ, le corps n'est jamais exécuté.</figcaption>
</figure>
  <pre class="codeblock"><span class="kw">def</span> nb_chiffres(n):
    <span class="str">"""Nombre de chiffres en base 10 de l'entier n &gt;= 1."""</span>
    c = 0
    <span class="kw">while</span> n &gt; 0:
        n = n // 10          <span class="cmt"># on retire le dernier chiffre</span>
        c = c + 1
    <span class="kw">return</span> c</pre>

  <div class="method-box"><strong>Exemple — trace de <span class="code-inline">nb_chiffres(2026)</span></strong>
    <div><table>
<tr><th>moment</th><th><span class="code-inline">n</span></th><th><span class="code-inline">c</span></th><th>test suivant</th></tr>
<tr><td>avant le 1er tour</td><td>2026</td><td>0</td><td><span class="code-inline">2026 &gt; 0</span> : on entre</td></tr>
<tr><td>après le tour 1</td><td>202</td><td>1</td><td><span class="code-inline">202 &gt; 0</span> : on continue</td></tr>
<tr><td>après le tour 2</td><td>20</td><td>2</td><td><span class="code-inline">20 &gt; 0</span> : on continue</td></tr>
<tr><td>après le tour 3</td><td>2</td><td>3</td><td><span class="code-inline">2 &gt; 0</span> : on continue</td></tr>
<tr><td>après le tour 4</td><td>0</td><td>4</td><td><span class="code-inline">0 &gt; 0</span> faux : sortie</td></tr>
</table></div>
    <ol>
      <li>Chaque tour retire le dernier chiffre (<span class="code-inline">n // 10</span>) et compte un chiffre de plus.</li>
      <li>La boucle s'arrête quand <span class="code-inline">n</span> vaut 0 : les 4 chiffres ont été comptés.</li>
      <li>Elle s'arrête toujours : <span class="code-inline">n</span> est un entier positif qui diminue strictement à chaque tour. C'est un <strong>variant</strong> de boucle, outil de preuve de terminaison (chapitre « Spécification, correction et complexité », §3).</li>
    </ol>
  </div>

  <div class="method-box"><strong>Exemple — atteindre un seuil</strong>
    <p>Placé à 3 % par an, au bout de combien d'années un capital a-t-il doublé ?</p>
    <pre class="codeblock">capital = 1000.0
annees = 0
<span class="kw">while</span> capital &lt; 2000:
    capital = capital * 1.03     <span class="cmt"># intérêts de 3 % par an</span>
    annees = annees + 1
print(annees)                    <span class="cmt"># affiche 24</span></pre>
    <p>Contrôle : \(1{,}03^{23} \approx 1{,}974 \lt 2\) et \(1{,}03^{24} \approx 2{,}033 \ge 2\). Le nombre de tours n'était pas connu d'avance : c'est le cas d'usage de <span class="code-inline">while</span>.</p>
  </div>

  <h3>De for à while</h3>
  <p>Toute boucle <span class="code-inline">for i in range(a, b)</span> s'écrit avec <span class="code-inline">while</span> : initialiser <span class="code-inline">i</span>, tester <span class="code-inline">i &lt; b</span>, incrémenter <span class="code-inline">i</span> à la fin du corps. Le programme suivant affiche exactement la même chose que le premier exemple du §3. L'inverse n'est pas toujours possible : <span class="code-inline">for</span> exige de connaître l'ensemble des valeurs à parcourir.</p>
  <pre class="codeblock">i = 2
<span class="kw">while</span> i &lt; 6:
    print(i, i ** 2)
    i = i + 1</pre>

  <h3>Boucle de recherche : une condition double</h3>
  <pre class="codeblock"><span class="kw">def</span> premier_indice(s, car):
    <span class="str">"""Indice de la 1re occurrence de car dans s, ou -1 si car est absent."""</span>
    i = 0
    <span class="kw">while</span> i &lt; len(s) <span class="kw">and</span> s[i] != car:
        i = i + 1
    <span class="kw">if</span> i &lt; len(s):
        <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>
  <p>On avance tant qu'il reste des caractères <strong>et</strong> que le caractère courant n'est pas le bon. L'ordre des deux tests est essentiel : grâce à l'évaluation paresseuse de <span class="code-inline">and</span>, <span class="code-inline">s[i]</span> n'est lu que si <span class="code-inline">i &lt; len(s)</span>. À la sortie, la condition est fausse ; d'après De Morgan, <span class="code-inline">i &gt;= len(s)</span> (on a tout parcouru sans trouver) <strong>ou</strong> <span class="code-inline">s[i] == car</span> (trouvé) : le test qui suit la boucle distingue les deux cas. <span class="code-inline">premier_indice("banane", "n")</span> vaut 2 et <span class="code-inline">premier_indice("banane", "z")</span> vaut −1.</p>

  <div class="notice"><strong>Erreurs classiques</strong> : la <strong>boucle infinie</strong>, quand rien dans le corps ne rapproche la condition de la fausseté (variable non mise à jour) ou quand la condition d'arrêt est une égalité jamais atteinte. Ne pas exécuter :
    <pre class="codeblock">i = 0
<span class="kw">while</span> i != 10:
    i = i + 3        <span class="cmt"># 0, 3, 6, 9, 12… : i ne vaut jamais 10</span></pre>
  </div>
  <p>Une condition <span class="code-inline">i &lt; 10</span> aurait arrêté la boucle. Avec des flottants, le nombre de tours peut surprendre : en ajoutant 0,1 à partir de 0, la somme de dix termes vaut 0,9999999999999999, encore inférieure à 1, d'où un onzième tour. Pour compter des tours, on pilote la boucle par un <strong>entier</strong>.</p>
  <pre class="codeblock">&gt;&gt;&gt; x, tours = 0.0, 0
&gt;&gt;&gt; <span class="kw">while</span> x &lt; 1.0:
...     x = x + 0.1
...     tours = tours + 1
&gt;&gt;&gt; tours, x
(11, 1.0999999999999999)</pre>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SORTIR D'UNE BOUCLE : BREAK ET RETURN</div>
  <h2>S'arrêter dès qu'on a la réponse</h2>
  <div class="intro">Dans une recherche, il est inutile de continuer une fois l'élément trouvé. Deux instructions interrompent une boucle : <span class="code-inline">return</span>, dans une fonction, et <span class="code-inline">break</span>.</div>

  <div class="def-box"><span class="code-inline">return v</span> dans le corps d'une boucle termine immédiatement la <strong>fonction</strong> (donc toutes ses boucles) en renvoyant <span class="code-inline">v</span>. <span class="code-inline">break</span> termine immédiatement la boucle la plus <strong>intérieure</strong> qui le contient ; l'exécution reprend après cette boucle.</div>

  <h3>Le schéma de recherche</h3>
  <pre class="codeblock"><span class="kw">def</span> contient(t, v):
    <span class="str">"""Indique si la valeur v figure dans la liste t."""</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x == v:
            <span class="kw">return</span> <span class="kw">True</span>      <span class="cmt"># trouvé : on s'arrête</span>
    <span class="kw">return</span> <span class="kw">False</span>             <span class="cmt"># la boucle a tout parcouru sans trouver</span></pre>
  <div class="prop-box"><strong>Où placer les deux return.</strong> Le <span class="code-inline">return True</span> est <strong>dans</strong> la boucle, sous le test : on conclut dès qu'un élément convient. Le <span class="code-inline">return False</span> est <strong>après</strong> la boucle, au niveau du <span class="code-inline">for</span> : on ne peut conclure à l'absence qu'après avoir tout examiné.</div>
  <div class="notice"><strong>Erreur classique</strong> : placer le <span class="code-inline">return False</span> dans un <span class="code-inline">else</span> à l'intérieur de la boucle. La fonction conclut alors dès le premier élément, et ne renvoie rien (<span class="code-inline">None</span>) pour une liste vide :
    <pre class="codeblock"><span class="kw">def</span> contient_faux(t, v):
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x == v:
            <span class="kw">return</span> <span class="kw">True</span>
        <span class="kw">else</span>:
            <span class="kw">return</span> <span class="kw">False</span>     <span class="cmt"># ERREUR : conclut dès le 1er élément</span></pre>
    <pre class="codeblock">&gt;&gt;&gt; contient([4, 7, 9], 7), contient_faux([4, 7, 9], 7)
(<span class="kw">True</span>, <span class="kw">False</span>)
&gt;&gt;&gt; print(contient_faux([], 7))     <span class="cmt"># liste vide : aucun return exécuté</span>
<span class="kw">None</span></pre>
  </div>

  <div class="method-box"><strong>Exemple — tester si un entier est premier</strong>
    <pre class="codeblock"><span class="kw">def</span> est_premier(n):
    <span class="str">"""Indique si l'entier n &gt;= 2 est premier."""</span>
    d = 2
    <span class="kw">while</span> d * d &lt;= n:
        <span class="kw">if</span> n % d == 0:
            <span class="kw">return</span> <span class="kw">False</span>     <span class="cmt"># un diviseur : inutile de continuer</span>
        d = d + 1
    <span class="kw">return</span> <span class="kw">True</span>              <span class="cmt"># aucun diviseur jusqu'à la racine de n</span></pre>
    <ol>
      <li>Si \(n = d\times e\) avec \(2 \le d \le e\), alors \(d^2 \le n\) : il suffit de chercher un diviseur <span class="code-inline">d</span> tant que <span class="code-inline">d * d &lt;= n</span>.</li>
      <li>Dès qu'un diviseur est trouvé, <span class="code-inline">return False</span> arrête tout. Si la boucle se termine, aucun diviseur n'existe : <span class="code-inline">return True</span>, après la boucle.</li>
      <li>Trace de <span class="code-inline">est_premier(91)</span> :</li>
    </ol>
    <div><table>
<tr><th><span class="code-inline">d</span></th><th><span class="code-inline">d * d &lt;= n</span> ?</th><th><span class="code-inline">n % d</span></th><th>action</th></tr>
<tr><td>2</td><td>4 ≤ 91 : oui</td><td>1</td><td>on continue</td></tr>
<tr><td>3</td><td>9 ≤ 91 : oui</td><td>1</td><td>on continue</td></tr>
<tr><td>4</td><td>16 ≤ 91 : oui</td><td>3</td><td>on continue</td></tr>
<tr><td>5</td><td>25 ≤ 91 : oui</td><td>1</td><td>on continue</td></tr>
<tr><td>6</td><td>36 ≤ 91 : oui</td><td>1</td><td>on continue</td></tr>
<tr><td>7</td><td>49 ≤ 91 : oui</td><td>0</td><td>diviseur : renvoie <span class="code-inline">False</span></td></tr>
</table></div>
    <p>\(91 = 7\times 13\) n'est pas premier. Pour <span class="code-inline">est_premier(97)</span>, la boucle teste <span class="code-inline">d</span> de 2 à 9 (car \(10^2 \gt 97\)) sans trouver de diviseur et la fonction renvoie <span class="code-inline">True</span>.</p>
  </div>

  <h3>break</h3>
  <p>Plus petit entier \(k\) tel que \(1^2 + 2^2 + \dots + k^2 \gt 1000\) :</p>
  <pre class="codeblock">total = 0
<span class="kw">for</span> k <span class="kw">in</span> range(1, 100):
    total = total + k * k
    <span class="kw">if</span> total &gt; 1000:
        <span class="kw">break</span>            <span class="cmt"># on sort de la boucle for</span>
print(k, total)          <span class="cmt"># affiche 14 1015</span></pre>
  <p>Après un <span class="code-inline">break</span>, la variable de boucle garde sa dernière valeur. La même recherche s'écrit sans <span class="code-inline">break</span>, en mettant le critère d'arrêt dans la condition d'un <span class="code-inline">while</span> ; les deux écritures sont acceptées.</p>
  <pre class="codeblock">total = 0
k = 0
<span class="kw">while</span> total &lt;= 1000:
    k = k + 1
    total = total + k * k
print(k, total)          <span class="cmt"># affiche 14 1015</span></pre>
  <div class="notice"><strong>À savoir</strong> : <span class="code-inline">continue</span> (passer au tour suivant) et les clauses <span class="code-inline">else</span> des boucles ne figurent pas dans l'annexe du programme : on s'en passe facilement avec un <span class="code-inline">if</span>.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ACCUMULATEURS</div>
  <h2>Construire un résultat tour après tour</h2>
  <div class="intro">La plupart des boucles calculent un résultat petit à petit : une somme, un compte, un maximum, une chaîne. La variable qui le porte s'appelle un accumulateur.</div>

  <div class="def-box">Un <strong>accumulateur</strong> est une variable <strong>initialisée avant</strong> la boucle, <strong>mise à jour</strong> à chaque tour et <strong>utilisée après</strong>. Sa valeur initiale est celle qui convient quand il n'y a rien à traiter (aucun tour).</div>
  <div><table>
<tr><th>on calcule</th><th>avant la boucle</th><th>à chaque tour</th></tr>
<tr><td>somme</td><td><span class="code-inline">s = 0</span></td><td><span class="code-inline">s = s + x</span></td></tr>
<tr><td>produit</td><td><span class="code-inline">p = 1</span></td><td><span class="code-inline">p = p * x</span></td></tr>
<tr><td>compteur</td><td><span class="code-inline">c = 0</span></td><td><span class="code-inline">if condition: c = c + 1</span></td></tr>
<tr><td>maximum</td><td><span class="code-inline">m = t[0]</span></td><td><span class="code-inline">if x &gt; m: m = x</span></td></tr>
<tr><td>« il existe »</td><td><span class="code-inline">trouve = False</span></td><td><span class="code-inline">if condition: trouve = True</span></td></tr>
<tr><td>« pour tout »</td><td><span class="code-inline">ok = True</span></td><td><span class="code-inline">if not condition: ok = False</span></td></tr>
<tr><td>chaîne</td><td><span class="code-inline">r = ""</span></td><td><span class="code-inline">r = r + c   (ou r = c + r)</span></td></tr>
<tr><td>liste</td><td><span class="code-inline">L = []</span></td><td><span class="code-inline">L.append(x)</span></td></tr>
</table></div>

  <pre class="codeblock"><span class="kw">def</span> maximum(t):
    <span class="str">"""Plus grande valeur de la liste non vide t."""</span>
    m = t[0]
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &gt; m:
            m = x
    <span class="kw">return</span> m</pre>
  <pre class="codeblock"><span class="kw">def</span> maximum_faux(t):
    m = 0                <span class="cmt"># ERREUR si toutes les valeurs sont négatives</span>
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &gt; m:
            m = x
    <span class="kw">return</span> m</pre>
  <pre class="codeblock"><span class="kw">def</span> indice_max(t):
    <span class="str">"""Indice de la première plus grande valeur de la liste non vide t."""</span>
    imax = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t)):
        <span class="kw">if</span> t[i] &gt; t[imax]:
            imax = i
    <span class="kw">return</span> imax</pre>
  <pre class="codeblock"><span class="kw">def</span> renverse(s):
    <span class="str">"""Chaîne s écrite à l'envers."""</span>
    r = <span class="str">""</span>
    <span class="kw">for</span> c <span class="kw">in</span> s:
        r = c + r        <span class="cmt"># chaque caractère passe devant les précédents</span>
    <span class="kw">return</span> r</pre>
  <pre class="codeblock">&gt;&gt;&gt; maximum([-5, -2, -9]), maximum_faux([-5, -2, -9])
(-2, 0)
&gt;&gt;&gt; indice_max([12, 17, 9, 17, 15])
1
&gt;&gt;&gt; renverse(<span class="str">"PTSI"</span>), renverse(<span class="str">"radar"</span>) == <span class="str">"radar"</span>
(<span class="str">'ISTP'</span>, <span class="kw">True</span>)
&gt;&gt;&gt; stats([12, 17, 9, 17, 15])
(9, 17, 14.0)</pre>

  <div class="method-box"><strong>Exemple — trace de <span class="code-inline">indice_max([12, 17, 9, 17, 15])</span></strong>
    <div><table>
<tr><th><span class="code-inline">i</span></th><th><span class="code-inline">t[i]</span></th><th>meilleur avant</th><th>comparaison</th><th><span class="code-inline">imax</span> après</th></tr>
<tr><td>1</td><td>17</td><td>12 (indice 0)</td><td>17 &gt; 12 : oui</td><td>1</td></tr>
<tr><td>2</td><td>9</td><td>17 (indice 1)</td><td>9 &gt; 17 : non</td><td>1</td></tr>
<tr><td>3</td><td>17</td><td>17 (indice 1)</td><td>17 &gt; 17 : non</td><td>1</td></tr>
<tr><td>4</td><td>15</td><td>17 (indice 1)</td><td>15 &gt; 17 : non</td><td>1</td></tr>
</table></div>
    <ol>
      <li>On mémorise l'<strong>indice</strong> du meilleur élément vu, ce qui donne aussi sa valeur <span class="code-inline">t[imax]</span>.</li>
      <li>La comparaison stricte <span class="code-inline">&gt;</span> garde le <strong>premier</strong> maximum (indice 1) : la seconde valeur 17, à l'indice 3, n'est pas strictement plus grande. Avec <span class="code-inline">&gt;=</span>, on obtiendrait le dernier (indice 3).</li>
      <li>Le premier élément sert de valeur initiale : la liste doit être non vide (précondition).</li>
    </ol>
  </div>

  <h3>Plusieurs accumulateurs dans une même boucle</h3>
  <pre class="codeblock"><span class="kw">def</span> stats(t):
    <span class="str">"""Renvoie (minimum, maximum, moyenne) de la liste non vide t."""</span>
    mini, maxi, s = t[0], t[0], 0
    <span class="kw">for</span> x <span class="kw">in</span> t:
        <span class="kw">if</span> x &lt; mini:
            mini = x
        <span class="kw">if</span> x &gt; maxi:
            maxi = x
        s = s + x
    <span class="kw">return</span> mini, maxi, s / len(t)</pre>
  <p>Un seul parcours suffit pour le minimum, le maximum et la somme : <span class="code-inline">stats([12, 17, 9, 17, 15])</span> vaut <span class="code-inline">(9, 17, 14.0)</span>. Les deux <span class="code-inline">if</span> sont indépendants ; un <span class="code-inline">if … elif</span> conviendrait aussi, car une valeur ne peut pas être à la fois plus petite que le minimum et plus grande que le maximum provisoires, mais deux tests séparés se justifient plus simplement.</p>

  <div class="notice"><strong>Erreurs classiques</strong> : initialiser l'accumulateur <strong>dans</strong> la boucle (il repart de zéro à chaque tour) ; initialiser un maximum à 0 (faux si toutes les valeurs sont négatives, comme le montre <span class="code-inline">maximum_faux</span>) ou à une valeur « très petite » arbitraire ; se tromper d'élément neutre (1 pour un produit, pas 0).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · BOUCLES IMBRIQUÉES</div>
  <h2>Une boucle dans une boucle</h2>
  <div class="intro">Pour examiner toutes les paires d'éléments, toutes les cases d'un tableau à deux dimensions ou toutes les combinaisons de paramètres, on place une boucle dans le corps d'une autre.</div>

  <div class="def-box">Dans deux boucles <strong>imbriquées</strong>, la boucle intérieure est exécutée <strong>entièrement</strong> à chaque tour de la boucle extérieure. Le corps intérieur est donc exécuté (nombre de tours extérieurs) × (nombre de tours intérieurs) fois quand ce dernier ne dépend pas du tour ; sinon, on additionne les nombres de tours intérieurs.</div>
  <pre class="codeblock"><span class="kw">for</span> i <span class="kw">in</span> range(1, 5):
    ligne = <span class="str">""</span>
    <span class="kw">for</span> j <span class="kw">in</span> range(i):
        ligne = ligne + <span class="str">"*"</span>
    print(ligne)</pre>
  <p>Au tour <span class="code-inline">i</span> de la boucle extérieure, la boucle intérieure fait <span class="code-inline">i</span> tours et construit une ligne de <span class="code-inline">i</span> étoiles ; le programme affiche quatre lignes de 1, 2, 3 et 4 étoiles (on pouvait aussi écrire <span class="code-inline">"*" * i</span>).</p>

  <h3>Toutes les paires d'indices</h3>
  <pre class="codeblock"><span class="kw">def</span> nb_paires_egales(t):
    <span class="str">"""Nombre de couples d'indices (i, j), i &lt; j, tels que t[i] == t[j]."""</span>
    c = 0
    n = len(t)
    <span class="kw">for</span> i <span class="kw">in</span> range(n):
        <span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):    <span class="cmt"># j parcourt les indices après i</span>
            <span class="kw">if</span> t[i] == t[j]:
                c = c + 1
    <span class="kw">return</span> c</pre>

    <div class="formula" data-nom="Nombre de paires i &lt; j">$$(n-1) + \dots + 1 + 0 = \frac{n(n-1)}{2}$$</div>
    fois.
    Ce nombre croît comme \(n^2\) : on parle de coût <strong>quadratique</strong> (chapitre « Spécification, correction et complexité », §6 et §7).</div>

  <div class="method-box"><strong>Exemple — triangles rectangles à côtés entiers</strong>
    <p>On cherche les triplets d'entiers \(a \le b \lt c \le N\) tels que \(a^2 + b^2 = c^2\).</p>
    <pre class="codeblock"><span class="kw">def</span> triplets(N):
    <span class="str">"""Affiche les triplets a &lt;= b &lt; c &lt;= N tels que a² + b² = c²."""</span>
    <span class="kw">for</span> a <span class="kw">in</span> range(1, N + 1):
        <span class="kw">for</span> b <span class="kw">in</span> range(a, N + 1):
            <span class="kw">for</span> c <span class="kw">in</span> range(b + 1, N + 1):
                <span class="kw">if</span> a * a + b * b == c * c:
                    print(a, b, c)</pre>
    <pre class="codeblock">&gt;&gt;&gt; nb_paires_egales([3, 1, 3, 3, 1])
4
&gt;&gt;&gt; triplets(20)
3 4 5
5 12 13
6 8 10
8 15 17
9 12 15
12 16 20</pre>
    <ol>
      <li>Les bornes des boucles intérieures dépendent des variables extérieures (<span class="code-inline">b</span> part de <span class="code-inline">a</span>, <span class="code-inline">c</span> part de <span class="code-inline">b + 1</span>) : chaque triplet n'est examiné qu'une fois.</li>
      <li><span class="code-inline">nb_paires_egales([3, 1, 3, 3, 1])</span> vaut 4 : trois paires parmi les indices 0, 2, 3 (valeur 3) et une paire d'indices 1, 4 (valeur 1).</li>
      <li>Trois boucles imbriquées jusqu'à \(N\) font de l'ordre de \(N^3/6\) tours : pour \(N = 1000\), plus de cent millions de tests. On gagnerait beaucoup en calculant <span class="code-inline">c</span> à partir de <span class="code-inline">a</span> et <span class="code-inline">b</span> plutôt qu'en le cherchant.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreurs classiques</strong> : réutiliser le même nom de variable pour les deux boucles ; oublier de réinitialiser, au début de chaque tour extérieur, l'accumulateur de la boucle intérieure (ici <span class="code-inline">ligne = ""</span>) ; croire qu'un <span class="code-inline">break</span> dans la boucle intérieure arrête aussi la boucle extérieure : il ne sort que de la boucle intérieure (pour tout arrêter, on utilise <span class="code-inline">return</span> dans une fonction).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>D'autres écritures de boucles</h2>
  <div class="intro">Ces outils existent en Python mais ne sont pas exigibles ; un sujet qui les emploie les documente. On peut toujours s'en passer.</div>
  <ul>
    <li><span class="code-inline">continue</span> passe directement au tour suivant (équivalent : mettre la suite du corps dans un <span class="code-inline">if</span>).</li>
    <li><span class="code-inline">for … else</span> et <span class="code-inline">while … else</span> : le bloc <span class="code-inline">else</span> s'exécute si la boucle n'a pas été interrompue par un <span class="code-inline">break</span>.</li>
    <li>L'expression conditionnelle <span class="code-inline">a if c else b</span> vaut <span class="code-inline">a</span> si <span class="code-inline">c</span> est vraie, <span class="code-inline">b</span> sinon.</li>
    <li><span class="code-inline">enumerate(s)</span> donne les couples (indice, élément), <span class="code-inline">zip(s, t)</span> les couples d'éléments de même rang de deux séquences.</li>
  </ul>
  <pre class="codeblock"><span class="kw">for</span> i, c <span class="kw">in</span> enumerate(<span class="str">"abc"</span>):     <span class="cmt"># enumerate : hors programme</span>
    print(i, c)</pre>
</div>
</template>
<template class="pan-tpl" data-panneau="pyc-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CONDITIONS &amp; BOUCLES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Neuf savoir-faire pour écrire des conditions et des boucles justes du premier coup, et pour vérifier celles des autres. Les preuves (variant, invariant) et le calcul de coût sont détaillés dans « Spécification, correction et complexité ».</div>

  <div class="method-box"><strong>Méthode 1 — Choisir entre <span class="code-inline">for</span> et <span class="code-inline">while</span></strong>
    <ol>
      <li>Nombre de répétitions <strong>connu à l'avance</strong> (pour \(k\) de 1 à \(n\), pour chaque élément d'une liste, d'une chaîne) : boucle <span class="code-inline">for</span>.</li>
      <li>On répète <strong>jusqu'à</strong> un événement (seuil atteint, élément trouvé, plus de chiffres), sans savoir en combien de tours : boucle <span class="code-inline">while</span>.</li>
      <li>Une recherche qui peut s'arrêter tôt s'écrit au choix avec <span class="code-inline">for</span> et <span class="code-inline">return</span> (Méthode 5) ou avec <span class="code-inline">while</span> et une condition double.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">s = 0
<span class="kw">for</span> k <span class="kw">in</span> range(1, 101):      <span class="cmt"># nombre de tours connu : for</span>
    s = s + k                <span class="cmt"># s vaut 5050 à la fin</span>
n = 0
<span class="kw">while</span> 2 ** n &lt;= 10 ** 6:     <span class="cmt"># nombre de tours inconnu : while</span>
    n = n + 1                <span class="cmt"># n vaut 20 à la fin</span></pre>
    <p>\(2^{19} = 524\,288 \le 10^6 \lt 2^{20} = 1\,048\,576\) : la boucle <span class="code-inline">while</span> s'arrête avec <span class="code-inline">n = 20</span>.</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Écrire une boucle d'accumulation</strong>
    <ol>
      <li><strong>Initialiser</strong> l'accumulateur avant la boucle, avec la valeur qui convient quand il n'y a rien à traiter : 0 pour une somme ou un compteur, 1 pour un produit, <span class="code-inline">""</span> pour une chaîne, le premier élément pour un maximum.</li>
      <li><strong>Mettre à jour</strong> l'accumulateur à chaque tour (éventuellement sous condition).</li>
      <li><strong>Utiliser</strong> le résultat après la boucle, au niveau d'indentation du <span class="code-inline">for</span>.</li>
    </ol>
    <p><em>Exemple éclair :</em> produit des entiers impairs de 1 à 9.</p>
    <pre class="codeblock">p = 1                        <span class="cmt"># élément neutre du produit</span>
<span class="kw">for</span> k <span class="kw">in</span> range(1, 10):
    <span class="kw">if</span> k % 2 == 1:
        p = p * k            <span class="cmt"># 1 * 3 * 5 * 7 * 9</span>
print(p)                     <span class="cmt"># affiche 945</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 3 — Fixer les bornes d'un <span class="code-inline">range</span></strong>
    <ol>
      <li>Écrire la liste des valeurs voulues pour la variable de boucle (de 1 à \(n\) ? de 0 à <span class="code-inline">len(t) - 2</span> ?).</li>
      <li>Traduire : <span class="code-inline">range(a, b)</span> donne <span class="code-inline">a</span>, …, <span class="code-inline">b - 1</span>, soit \(b - a\) tours ; pour aller jusqu'à <span class="code-inline">n</span> inclus, écrire <span class="code-inline">n + 1</span>.</li>
      <li>Si le corps lit <span class="code-inline">t[i + 1]</span>, s'arrêter à <span class="code-inline">range(len(t) - 1)</span> pour que <span class="code-inline">i + 1</span> reste un indice valide.</li>
      <li>Vérifier sur le <strong>plus petit cas</strong> (\(n = 0\) ou \(n = 1\), liste vide ou à un élément).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\displaystyle\sum_{k=1}^{n} \frac{1}{k^2}\), on vérifie la borne avec \(n = 1\) : un seul tour, \(k = 1\), somme 1.</p>
    <pre class="codeblock">n = 1
s = 0
<span class="kw">for</span> k <span class="kw">in</span> range(1, n + 1):    <span class="cmt"># cas le plus petit : un seul tour, k = 1</span>
    s = s + 1 / k ** 2       <span class="cmt"># s vaut 1.0 : la borne est bonne</span></pre>
  </div>

  <div class="method-box"><strong>Méthode 4 — Écrire une cascade <span class="code-inline">if</span> / <span class="code-inline">elif</span> / <span class="code-inline">else</span></strong>
    <ol>
      <li>Lister les cas et les ranger par seuils <strong>monotones</strong> (du plus exigeant au moins exigeant, ou l'inverse).</li>
      <li>Écrire les tests dans cet ordre : chaque <span class="code-inline">elif</span> peut supposer que les tests précédents ont échoué, ce qui évite les doubles conditions.</li>
      <li>Terminer par <span class="code-inline">else</span> pour couvrir tout ce qui reste.</li>
      <li>Tester une valeur par cas et chaque <strong>valeur limite</strong> (16, 14, 12, 10 ci-dessous).</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock"><span class="kw">def</span> mention(note):
    <span class="kw">if</span> note &gt;= 16:
        <span class="kw">return</span> <span class="str">"très bien"</span>
    <span class="kw">elif</span> note &gt;= 14:
        <span class="kw">return</span> <span class="str">"bien"</span>
    <span class="kw">elif</span> note &gt;= 12:
        <span class="kw">return</span> <span class="str">"assez bien"</span>
    <span class="kw">elif</span> note &gt;= 10:
        <span class="kw">return</span> <span class="str">"admis"</span>
    <span class="kw">else</span>:
        <span class="kw">return</span> <span class="str">"ajourné"</span></pre>
    <p>La branche <span class="code-inline">note &gt;= 14</span> n'a pas besoin de <span class="code-inline">and note &lt; 16</span> : si on y arrive, le test précédent a échoué.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Chercher et s'arrêter dès que possible</strong>
    <ol>
      <li>Parcourir les éléments (ou les indices, si la position est demandée).</li>
      <li>Dès que l'élément courant convient : <span class="code-inline">return</span> du résultat, <strong>dans</strong> la boucle.</li>
      <li><strong>Après</strong> la boucle (au niveau du <span class="code-inline">for</span>) : <span class="code-inline">return</span> de la réponse « rien trouvé » (<span class="code-inline">False</span>, <span class="code-inline">-1</span>…).</li>
      <li>Avec <span class="code-inline">while</span> : condition double, la garde <span class="code-inline">i &lt; len(t)</span> en premier, puis <span class="code-inline">and</span> et le test « <span class="code-inline">t[i]</span> ne convient pas » ; après la boucle, un test dit pourquoi on est sorti.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock"><span class="kw">def</span> premier_multiple(t, d):
    <span class="str">"""Indice du premier multiple de d (d &gt; 0) dans t, ou -1."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(t)):
        <span class="kw">if</span> t[i] % d == 0:
            <span class="kw">return</span> i             <span class="cmt"># trouvé : on s'arrête</span>
    <span class="kw">return</span> -1                    <span class="cmt"># après la boucle : aucun multiple</span></pre>
  </div>
  <div class="notice"><strong>Piège</strong> : un <span class="code-inline">else: return …</span> dans la boucle conclut dès le premier élément examiné. La réponse « rien trouvé » ne se donne qu'après la boucle.</div>

  <div class="method-box"><strong>Méthode 6 — Suivre un maximum et sa position</strong>
    <ol>
      <li>Initialiser avec le <strong>premier élément</strong> (ou son indice 0), jamais avec 0 ni avec une valeur arbitraire.</li>
      <li>Parcourir les indices suivants ; si l'élément courant bat le meilleur, mettre à jour l'indice.</li>
      <li>Choisir la comparaison : <span class="code-inline">&gt;</span> garde la <strong>première</strong> position du maximum, <span class="code-inline">&gt;=</span> la <strong>dernière</strong>.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock"><span class="kw">def</span> indice_dernier_max(t):
    <span class="str">"""Indice de la dernière plus grande valeur de t (non vide)."""</span>
    imax = 0
    <span class="kw">for</span> i <span class="kw">in</span> range(1, len(t)):
        <span class="kw">if</span> t[i] &gt;= t[imax]:      <span class="cmt"># &gt;= : en cas d'égalité, on avance</span>
            imax = i
    <span class="kw">return</span> imax</pre>
    <pre class="codeblock">&gt;&gt;&gt; mention(15), mention(10), mention(9.5)
(<span class="str">'bien'</span>, <span class="str">'admis'</span>, <span class="str">'ajourné'</span>)
&gt;&gt;&gt; premier_multiple([7, 11, 15, 20], 5), premier_multiple([7, 11], 5)
(2, -1)
&gt;&gt;&gt; indice_dernier_max([3, 8, 2, 8])
3</pre>
  </div>

  <div class="method-box"><strong>Méthode 7 — Dérouler une boucle à la main</strong>
    <ol>
      <li>Une ligne par tour ; une colonne pour la variable de boucle (ou pour le test du <span class="code-inline">while</span>), une colonne par variable modifiée.</li>
      <li>Noter les valeurs <strong>à la fin</strong> de chaque tour, en calculant avec les valeurs du tour précédent.</li>
      <li>Pour un <span class="code-inline">while</span>, écrire le test avant chaque tour, y compris le dernier, celui qui est faux.</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">u = 1
<span class="kw">for</span> k <span class="kw">in</span> range(3):
    u = 2 * u + k</pre>
    <p>Fin du tour <span class="code-inline">k = 0</span> : <span class="code-inline">u</span> vaut \(2\times 1 + 0 = 2\) ; <span class="code-inline">k = 1</span> : \(2\times 2 + 1 = 5\) ; <span class="code-inline">k = 2</span> : \(2\times 5 + 2 = 12\). À la fin, <span class="code-inline">u == 12</span>.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Écrire une boucle <span class="code-inline">while</span> qui termine</strong>
    <ol>
      <li>Formuler la condition d'<strong>arrêt</strong>, puis écrire sa négation (lois de De Morgan) : c'est la condition de <strong>continuation</strong>, celle qu'on écrit après <span class="code-inline">while</span>.</li>
      <li>Vérifier que chaque tour rapproche de l'arrêt : une quantité entière positive qui diminue strictement (un <strong>variant</strong>) garantit la terminaison.</li>
      <li>Préférer une inégalité à une égalité dans la condition (<span class="code-inline">i &lt; n</span> plutôt que <span class="code-inline">i != n</span>), et un compteur entier à un flottant.</li>
    </ol>
    <p><em>Exemple éclair :</em> plus petit \(n\) tel que \(1 + \frac{1}{2} + \dots + \frac{1}{n} \gt 3\). L'arrêt est « <span class="code-inline">s &gt; 3</span> », on continue donc tant que <span class="code-inline">s &lt;= 3</span> :</p>
    <pre class="codeblock">s = 0
n = 0
<span class="kw">while</span> s &lt;= 3:                <span class="cmt"># on continue tant que l'arrêt n'est pas atteint</span>
    n = n + 1
    s = s + 1 / n            <span class="cmt"># s = 1 + 1/2 + ... + 1/n</span>
print(n)                     <span class="cmt"># affiche 11</span></pre>
    <p>La boucle termine car la série harmonique diverge (cours de mathématiques) ; ici \(1 + \dots + \frac{1}{10} \approx 2{,}929\) et \(1 + \dots + \frac{1}{11} \approx 3{,}020\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Compter les tours de boucles imbriquées</strong>
    <ol>
      <li>Pour chaque valeur de la variable extérieure, compter les tours de la boucle intérieure.</li>
      <li>Additionner ces nombres sur toutes les valeurs extérieures ; s'ils sont tous égaux, c'est un produit.</li>
      <li>Utiliser \(0 + 1 + \dots + (n-1) = \dfrac{n(n-1)}{2}\) pour les boucles « triangulaires ».</li>
    </ol>
    <p><em>Exemple éclair :</em></p>
    <pre class="codeblock">n = 6
c1 = 0
<span class="kw">for</span> i <span class="kw">in</span> range(n):
    <span class="kw">for</span> j <span class="kw">in</span> range(i):           <span class="cmt"># i tours pour chaque i</span>
        c1 = c1 + 1              <span class="cmt"># c1 vaut 15 = 6 * 5 / 2</span>
c2 = 0
<span class="kw">for</span> i <span class="kw">in</span> range(n):
    <span class="kw">for</span> j <span class="kw">in</span> range(n):           <span class="cmt"># n tours pour chaque i</span>
        c2 = c2 + 1              <span class="cmt"># c2 vaut 36 = 6 * 6</span></pre>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : indentation incohérente (erreur, ou mauvais bloc exécuté) ; boucle infinie (variable du test jamais mise à jour) ; <span class="code-inline">range(n)</span> s'arrête à <span class="code-inline">n - 1</span> (borne supérieure <strong>exclue</strong>) ; accumulateur initialisé <strong>dans</strong> la boucle (remis à zéro à chaque tour) ; <span class="code-inline">return</span> « rien trouvé » placé dans la boucle au lieu d'après.</div>
</div>
</template>

  <div class="q"><strong>Q1.</strong> Écrire <span class="code-inline">nb_majuscules(s)</span> qui compte les majuscules (sans accent) de la chaîne <span class="code-inline">s</span>.</div>
  <div class="q"><strong>Q2.</strong> Écrire <span class="code-inline">premier_chiffre(s)</span> qui renvoie l'indice du premier chiffre de <span class="code-inline">s</span>, ou −1 s'il n'y en a pas, avec une boucle <span class="code-inline">while</span>.</div>
  <div class="q"><strong>Q3.</strong> Écrire <span class="code-inline">double_lettre(s)</span> qui indique si <span class="code-inline">s</span> contient deux caractères consécutifs égaux, en s'arrêtant dès qu'on en trouve.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Compteur et parcours par élément : seule la valeur des caractères compte.</p>
    <pre class="codeblock"><span class="kw">def</span> nb_majuscules(s):
    <span class="str">"""Nombre de lettres majuscules (sans accent) de s."""</span>
    c = 0
    <span class="kw">for</span> x <span class="kw">in</span> s:
        <span class="kw">if</span> <span class="str">"A"</span> &lt;= x &lt;= <span class="str">"Z"</span>:
            c = c + 1
    <span class="kw">return</span> c</pre>
    <p><strong>Q2.</strong> On avance tant qu'il reste des caractères et que le caractère courant n'est pas un chiffre ; la garde <span class="code-inline">i &lt; len(s)</span> vient en premier (évaluation paresseuse).</p>
    <pre class="codeblock"><span class="kw">def</span> premier_chiffre(s):
    <span class="str">"""Indice du premier chiffre de s, ou -1 s'il n'y en a pas."""</span>
    i = 0
    <span class="kw">while</span> i &lt; len(s) <span class="kw">and</span> <span class="kw">not</span> (<span class="str">"0"</span> &lt;= s[i] &lt;= <span class="str">"9"</span>):
        i = i + 1
    <span class="kw">if</span> i &lt; len(s):
        <span class="kw">return</span> i
    <span class="kw">return</span> -1</pre>
    <p><strong>Q3.</strong> Parcours par indice, car on compare chaque caractère à son voisin ; <span class="code-inline">range(len(s) - 1)</span> garantit que <span class="code-inline">s[i + 1]</span> existe. Le <span class="code-inline">return False</span> est après la boucle.</p>
    <pre class="codeblock"><span class="kw">def</span> double_lettre(s):
    <span class="str">"""Indique si s contient deux caractères consécutifs égaux."""</span>
    <span class="kw">for</span> i <span class="kw">in</span> range(len(s) - 1):
        <span class="kw">if</span> s[i] == s[i + 1]:
            <span class="kw">return</span> <span class="kw">True</span>
    <span class="kw">return</span> <span class="kw">False</span></pre>
    <pre class="codeblock">&gt;&gt;&gt; nb_majuscules(<span class="str">"Le Mans, PTSI"</span>), premier_chiffre(<span class="str">"PT2026"</span>), premier_chiffre(<span class="str">"PTSI"</span>)
(6, 2, -1)
&gt;&gt;&gt; double_lettre(<span class="str">"ballon"</span>), double_lettre(<span class="str">"python"</span>), double_lettre(<span class="str">""</span>)
(<span class="kw">True</span>, <span class="kw">False</span>, <span class="kw">False</span>)</pre>
  </div>
