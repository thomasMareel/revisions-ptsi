<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">La partie « Séries numériques » du programme de PT prolonge l'étude des séries à termes positifs de 1ʳᵉ année : comparaison série-intégrale, séries alternées, convergence absolue des séries à termes réels ou complexes, règle de d'Alembert et produit de Cauchy. Elle prépare directement les séries entières et les variables aléatoires discrètes (espérance d'une variable à valeurs dans un ensemble infini). Les outils de comparaison (\(o\), \(O\), \(\sim\), développements limités) sont rappelés dans le chapitre « Suites numériques (approfondissements) ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Rappels de 1ʳᵉ année</strong> : sommes partielles, convergence, somme, reste, divergence grossière, lien suite-série, séries géométriques, série exponentielle (§1) ; séries à termes positifs, comparaison, équivalents, séries de Riemann (§2).</li>
        <li><strong>Comparaison série-intégrale</strong> : établir la convergence ou la divergence d'une série, estimer les sommes partielles d'une série divergente et le reste d'une série convergente, dans le cas d'une fonction monotone (§3).</li>
        <li><strong>Théorème des séries alternées</strong> : convergence, encadrement de la somme, signe et majoration du reste (§4).</li>
        <li><strong>Convergence absolue</strong> d'une série à termes réels ou complexes ; une série absolument convergente converge ; comparaisons \(|u_n| \leq |v_n|\), \(O\), \(o\), \(\sim\) (§5).</li>
        <li><strong>Règle de d'Alembert</strong> (§6).</li>
        <li><strong>Produit de Cauchy</strong> de deux séries absolument convergentes ; démonstration non exigible (§7).</li>
      </ul>
      <p>Le programme limite l'étude des séries semi-convergentes aux séries alternées. Hors programme : le critère de Cauchy, les familles sommables (la sommation par paquets n'est utilisée, admise, qu'en probabilités), les séries de Bertrand (traitées en exercice), la règle de Raabe-Duhamel, la transformation d'Abel (fin de chapitre).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · CONVERGENCE, SOMME, RESTE</div>
  <h2>Rappels : une série est une suite de sommes partielles</h2>
  <div class="intro">Étudier une série, c'est étudier la suite de ses sommes partielles. Les rappels de ce paragraphe fixent le vocabulaire et les deux séries de référence, géométrique et exponentielle, sur lesquelles reposent presque tous les critères.</div>

  <div class="def-box">
    Soit \((u_n)_{n \geq 0}\) une suite réelle ou complexe. La <strong>série</strong> \(\sum u_n\) est la suite des <strong>sommes partielles</strong> \(S_n = \sum_{k=0}^{n} u_k\). Elle <strong>converge</strong> si \((S_n)\) a une limite finie \(S\), appelée <strong>somme</strong> de la série et notée \(\sum_{n=0}^{+\infty} u_n\) ; sinon elle <strong>diverge</strong>. Si la série converge, son <strong>reste</strong> d'ordre \(n\) est
    <div class="formula" data-nom="Reste d'une série convergente">$$R_n = S - S_n = \sum_{k=n+1}^{+\infty} u_k \xrightarrow[n\to\infty]{} 0.$$</div>
    Modifier un nombre fini de termes ne change pas la <strong>nature</strong> (convergence ou divergence), mais modifie en général la somme.
  </div>
  <div class="prop-box">
    <strong>Propriétés de base.</strong>
    <ul>
      <li><strong>Linéarité</strong> : si \(\sum u_n\) et \(\sum v_n\) convergent, \(\sum(\lambda u_n + \mu v_n)\) converge et a pour somme \(\lambda\sum u_n + \mu\sum v_n\). La somme d'une série convergente et d'une série divergente diverge.</li>
      <li><strong>Divergence grossière</strong> : si \(\sum u_n\) converge, alors \(u_n \to 0\), car \(u_n = S_n - S_{n-1}\) et les deux sommes tendent vers \(S\). Une série dont le terme général ne tend pas vers 0 diverge <strong>grossièrement</strong>.</li>
      <li><strong>Lien suite-série</strong> : la suite \((a_n)\) converge si et seulement si la série télescopique \(\sum (a_{n+1} - a_n)\) converge, et alors \(\sum_{n=0}^{+\infty} (a_{n+1} - a_n) = \lim a_n - a_0\).</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Séries de référence.</strong> Pour \(z \in \mathbb{C}\) :
    <ul>
      <li>la <strong>série géométrique</strong> \(\sum z^n\) converge si et seulement si \(|z| \lt 1\), et alors</li>
    </ul>
    <div class="formula" data-nom="Série géométrique">$$\sum_{n=0}^{+\infty} z^n = \frac{1}{1-z}, \qquad R_n = \frac{z^{n+1}}{1-z} ;$$</div>
    <ul>
      <li>la <strong>série exponentielle</strong> converge pour tout \(z\) :</li>
    </ul>
    <div class="formula" data-nom="Série exponentielle">$$\sum_{n=0}^{+\infty} \frac{z^n}{n!} = e^z.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La série géométrique, de la somme partielle à la condition \(|z| \lt 1\).</span>
    <div class="content"><p>Pour \(z \neq 1\), \((1 - z)S_n = 1 - z^{n+1}\), donc \(S_n = \dfrac{1 - z^{n+1}}{1 - z}\). Si \(|z| \lt 1\), \(|z^{n+1}| = |z|^{n+1} \to 0\) et \(S_n \to \dfrac{1}{1-z}\) ; le reste vaut \(\dfrac{1}{1-z} - S_n = \dfrac{z^{n+1}}{1-z}\). Si \(|z| \geq 1\), \(|z^n| \geq 1\) ne tend pas vers 0 : divergence grossière (pour \(z = 1\), \(S_n = n + 1\)).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — deux télescopages, deux conclusions opposées</strong>
    <ol>
      <li>\(u_n = \dfrac{1}{n(n+1)} = \dfrac1n - \dfrac{1}{n+1}\) (\(n \geq 1\)) : \(S_n = 1 - \dfrac{1}{n+1} \to 1\). La série converge, de somme 1, et son reste vaut exactement \(R_n = \dfrac{1}{n+1}\).</li>
      <li>\(v_n = \ln\!\left(1 + \dfrac1n\right) = \ln(n+1) - \ln n\) : \(\sum_{k=1}^{n} v_k = \ln(n+1) \to +\infty\). La série diverge, bien que \(v_n \to 0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : « \(u_n \to 0\), donc la série converge ». La condition \(u_n \to 0\) est <strong>nécessaire</strong>, jamais suffisante : la série harmonique \(\sum \frac1n\) et l'exemple 2 ci-dessus divergent. Elle ne sert qu'à prouver une divergence.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · SÉRIES À TERMES POSITIFS</div>
  <h2>Rappels : tout se joue sur la comparaison</h2>
  <div class="intro">Quand les termes sont positifs, les sommes partielles croissent : la série converge ou tend vers \(+\infty\), sans autre possibilité. On compare alors le terme général à celui d'une série de référence, le plus souvent par un équivalent.</div>

  <div class="prop-box">
    <strong>Critère fondamental.</strong> Si \(u_n \geq 0\) pour tout \(n\), la suite \((S_n)\) est croissante : \(\sum u_n\) converge si et seulement si \((S_n)\) est <strong>majorée</strong>. Sinon \(S_n \to +\infty\), ce que l'on note \(\sum_{n=0}^{+\infty} u_n = +\infty\).
  </div>
  <div class="prop-box">
    <strong>Théorèmes de comparaison</strong> (\(u_n, v_n \geq 0\) à partir d'un certain rang) :
    <ul>
      <li>si \(u_n \leq v_n\) : la convergence de \(\sum v_n\) entraîne celle de \(\sum u_n\), et la divergence de \(\sum u_n\) celle de \(\sum v_n\) ;</li>
      <li>si \(u_n = O(v_n)\) (en particulier si \(u_n = o(v_n)\)) : la convergence de \(\sum v_n\) entraîne celle de \(\sum u_n\) ;</li>
      <li>si \(u_n \sim v_n\) : les deux séries sont de <strong>même nature</strong>.</li>
    </ul>
  </div>
  <div class="prop-box">
    <strong>Séries de Riemann.</strong> Pour \(\alpha \in \mathbb{R}\) :
    <div class="formula" data-nom="Séries de Riemann">$$\sum_{n \geq 1} \frac{1}{n^\alpha} \text{ converge} \iff \alpha \gt 1.$$</div>
    La démonstration, par comparaison avec une intégrale, est donnée au §3.
  </div>
  <div class="method-box">
    <strong>Méthode — la règle « \(n^\alpha u_n\) »</strong>
    <ol>
      <li>Si \(n^\alpha u_n \to 0\) pour un \(\alpha \gt 1\), alors \(u_n = o\!\left(\frac{1}{n^\alpha}\right)\) : la série converge.</li>
      <li>Si \(n\,u_n \to +\infty\) (ou vers une limite \(\ell \gt 0\)), alors \(u_n \geq \frac1n\) à partir d'un certain rang (resp. \(u_n \sim \frac{\ell}{n}\)) : la série diverge.</li>
      <li>On choisit souvent \(\alpha = 2\), ou \(\alpha = \frac32\) quand un logarithme traîne : \(\dfrac{\ln n}{n^2} = o\!\left(\dfrac{1}{n^{3/2}}\right)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — quatre natures en une ligne chacune</strong>
    <ol>
      <li>\(u_n = \dfrac{n + 1}{n^3 + 2} \sim \dfrac{1}{n^2}\) : converge (Riemann, \(\alpha = 2\)).</li>
      <li>\(u_n = \sin\dfrac1n \sim \dfrac1n\), positif : diverge.</li>
      <li>\(u_n = 1 - \cos\dfrac{\pi}{n} \sim \dfrac{\pi^2}{2n^2}\) : converge.</li>
      <li>\(u_n = e^{-\sqrt n}\) : \(n^2 e^{-\sqrt n} = \exp(2\ln n - \sqrt n) \to 0\), donc \(u_n = o\!\left(\frac{1}{n^2}\right)\) : converge.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le critère d'équivalence à des termes de signe <strong>variable</strong>. L'équivalence ne transmet la nature que pour des termes de signe constant (à partir d'un certain rang) ; le contre-exemple est au §5.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · COMPARAISON SÉRIE-INTÉGRALE</div>
  <h2>Une somme et une intégrale de même nature</h2>
  <div class="intro">Pour une fonction monotone, la méthode des rectangles encadre la somme \(f(1) + \cdots + f(n)\) entre deux intégrales. On en tire trois usages : décider de la nature d'une série (Riemann, logarithmes), trouver un équivalent des sommes partielles d'une série divergente, et un équivalent du reste d'une série convergente.</div>

  <div class="prop-box">
    <strong>Encadrement.</strong> Soit \(f\) continue, positive et <strong>décroissante</strong> sur \([n_0, +\infty[\). Pour tout entier \(k \geq n_0 + 1\) :
    <div class="formula" data-nom="Comparaison série-intégrale">$$\int_k^{k+1} f(t)\,\mathrm{d}t \;\leq\; f(k) \;\leq\; \int_{k-1}^{k} f(t)\,\mathrm{d}t.$$</div>
    En sommant pour \(k\) de \(n_0 + 1\) à \(n\), puis en ajoutant \(f(n_0)\) :
    <div class="formula">$$\begin{aligned} \int_{n_0}^{n+1} f(t)\,\mathrm{d}t \leq{} &\sum_{k=n_0}^{n} f(k)\\ &\leq f(n_0) + \int_{n_0}^{n} f(t)\,\mathrm{d}t. \end{aligned}$$</div>
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Sous ces hypothèses, la série \(\sum f(n)\) converge si et seulement si l'intégrale \(\displaystyle\int_{n_0}^{+\infty} f(t)\,\mathrm{d}t\) converge, c'est-à-dire si \(x \mapsto \int_{n_0}^{x} f\) a une limite finie en \(+\infty\) (chapitre « Intégrales généralisées »). De plus, la suite \(\displaystyle w_n = \sum_{k=n_0}^{n} f(k) - \int_{n_0}^{n} f(t)\,\mathrm{d}t\) converge toujours.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Monotonie de \(F(x) = \int_{n_0}^x f\) et des sommes partielles.</span>
    <div class="content">
      <p>Comme \(f \geq 0\), \(F(x) = \int_{n_0}^{x} f\) est croissante : l'intégrale converge si et seulement si \(F\) est majorée, ce qui équivaut à « la suite \((F(n))\) est majorée ». Les sommes partielles \(S_n = \sum_{k=n_0}^n f(k)\) croissent aussi.</p>
      <p>Si l'intégrale converge, de valeur \(I\), alors \(S_n \leq f(n_0) + F(n) \leq f(n_0) + I\) : les sommes partielles sont majorées, la série converge. Si la série converge, de somme \(S\), alors \(F(n+1) \leq S_n \leq S\) : \((F(n))\) est majorée, l'intégrale converge.</p>
      <p>Pour \((w_n)\) : \(w_{n+1} - w_n = f(n+1) - \int_n^{n+1} f \leq 0\), donc \((w_n)\) décroît ; et \(w_n = \sum_{k=n_0}^{n-1}\left(f(k) - \int_k^{k+1} f\right) + f(n) \geq 0\). Décroissante et minorée, elle converge.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — les séries de Riemann</strong>
    <ol>
      <li>Si \(\alpha \leq 0\), \(\frac{1}{n^\alpha}\) ne tend pas vers 0 : divergence grossière.</li>
      <li>Si \(\alpha \gt 0\), \(f(t) = t^{-\alpha}\) est continue, positive, décroissante sur \([1, +\infty[\). Pour \(\alpha \neq 1\), \(\int_1^x t^{-\alpha}\,\mathrm{d}t = \dfrac{x^{1-\alpha} - 1}{1 - \alpha}\), qui a une limite finie si et seulement si \(\alpha \gt 1\) ; pour \(\alpha = 1\), \(\int_1^x \frac{\mathrm{d}t}{t} = \ln x \to +\infty\).</li>
      <li>Conclusion : \(\sum \frac{1}{n^\alpha}\) converge si et seulement si \(\alpha \gt 1\).</li>
    </ol>
  </div>

  <h3>Sommes partielles d'une série divergente</h3>
  <div class="method-box">
    <strong>Exemple — la série harmonique et la constante d'Euler</strong>
    <p>Avec \(f(t) = \frac1t\) et \(H_n = \sum_{k=1}^{n} \frac1k\), l'encadrement donne \(\ln(n+1) \leq H_n \leq 1 + \ln n\), donc :</p>
    <div class="formula" data-nom="Série harmonique">$$H_n = \sum_{k=1}^{n} \frac1k \sim \ln n.$$</div>
    <p>Plus précisément, la suite \(u_n = H_n - \ln n\) décroît, car \(u_{n+1} - u_n = \dfrac{1}{n+1} - \displaystyle\int_n^{n+1}\frac{\mathrm{d}t}{t} \leq 0\), et la suite \(v_n = H_n - \ln(n+1)\) croît, car \(v_{n+1} - v_n = \dfrac{1}{n+1} - \displaystyle\int_{n+1}^{n+2}\frac{\mathrm{d}t}{t} \geq 0\). Leur différence \(\ln\!\left(1 + \frac1n\right)\) tend vers 0 : elles sont adjacentes. Leur limite commune est la <strong>constante d'Euler</strong> \(\gamma \approx 0{,}5772\), et \(H_n = \ln n + \gamma + o(1)\). Pour \(n = 100\) : \(H_{100} \approx 5{,}1874\) et \(\ln 100 + \gamma \approx 5{,}1824\).</p>
  </div>

  <h3>Reste d'une série convergente</h3>
  <div class="method-box">
    <strong>Exemple — combien de termes pour approcher \(\sum \frac{1}{k^2}\) ?</strong>
    <ol>
      <li>Avec \(f(t) = \frac{1}{t^2}\) et en sommant l'encadrement de \(k = n+1\) à \(+\infty\) : \(\displaystyle\int_{n+1}^{+\infty}\frac{\mathrm{d}t}{t^2} \leq R_n \leq \int_n^{+\infty}\frac{\mathrm{d}t}{t^2}\), soit</li>
    </ol>
    <div class="formula" data-nom="Reste de la série des 1/k²">$$\frac{1}{n+1} \leq \sum_{k=n+1}^{+\infty} \frac{1}{k^2} \leq \frac{1}{n},$$</div>
    <p>donc \(R_n \sim \frac1n\).</p>
    <ol start="2">
      <li>Pour \(n = 10\) : \(R_{10} \approx 0{,}0952\), bien compris entre \(0{,}0909\) et \(0{,}1\).</li>
      <li>Garantir une erreur inférieure à \(10^{-4}\) par la seule somme partielle demande \(n = 10^4\) termes : la convergence est lente.</li>
      <li>L'encadrement suggère une correction : \(S_n + \frac1n\) approche la somme \(\frac{\pi^2}{6}\) avec une erreur voisine de \(\frac{1}{2n^2}\) (\(5{,}0 \times 10^{-5}\) pour \(n = 100\), contre \(10^{-2}\) sans correction).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une divergence très lente : \(\sum \frac{1}{n\ln n}\)</strong>
    <p>\(f(t) = \dfrac{1}{t\ln t}\) est continue, positive et décroissante sur \([2, +\infty[\) (dénominateur croissant), de primitive \(\ln(\ln t)\), qui tend vers \(+\infty\) : la série diverge. L'encadrement donne</p>
    <div class="formula">$$\sum_{k=2}^{n} \frac{1}{k \ln k} \sim \ln(\ln n).$$</div>
    <p>La divergence est spectaculairement lente : la somme partielle d'ordre \(10^6\) vaut environ 3,42, et il faudrait de l'ordre de \(10^{29}\) termes pour dépasser 5.</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la monotonie. Pour \(f(t) = \sin^2(\pi t)\), continue et positive mais pas monotone, \(\sum f(n) = 0\) converge alors que \(\int_0^{+\infty} f\) diverge. Toujours vérifier (et écrire) que \(f\) est monotone sur l'intervalle utilisé.</div>
  <div class="method-box">
    <strong>Méthode — encadrer une somme par des intégrales</strong>
    <ol>
      <li>Identifier \(f\) avec \(u_k = f(k)\) et vérifier sa monotonie sur \([n_0, +\infty[\) (par la dérivée si besoin).</li>
      <li>Écrire l'encadrement élémentaire entre \(f(k)\) et l'intégrale sur \([k, k+1]\) ou \([k-1, k]\), dans le bon sens.</li>
      <li>Sommer en surveillant les bornes : de \(n_0\) à \(n\) pour une somme partielle, de \(n+1\) à \(+\infty\) pour un reste.</li>
      <li>Calculer les intégrales et conclure par encadrement : deux bornes équivalentes donnent un équivalent.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · SÉRIES ALTERNÉES</div>
  <h2>Le seul critère de semi-convergence au programme</h2>
  <div class="intro">Une série peut converger sans converger absolument, grâce aux compensations entre termes positifs et négatifs. Le programme n'étudie ce phénomène que dans un cas, celui des séries alternées, mais il en tire un résultat très précis : un encadrement de la somme et du reste.</div>

  <div class="prop-box">
    <strong>Théorème des séries alternées.</strong> Soit \((a_n)\) une suite réelle qui <strong>décroît</strong> et <strong>tend vers 0</strong> (elle est donc positive). Alors la série \(\sum (-1)^n a_n\) converge et, en notant \(S\) sa somme :
    <ul>
      <li>la somme est encadrée par deux sommes partielles consécutives : \(S_{2n+1} \leq S \leq S_{2n}\) pour tout \(n\) ;</li>
      <li>le reste \(R_n = \sum_{k=n+1}^{+\infty} (-1)^k a_k\) a le signe de son premier terme \((-1)^{n+1}a_{n+1}\), et</li>
    </ul>
    <div class="formula" data-nom="Majoration du reste d'une série alternée">$$|R_n| \leq a_{n+1}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Les sommes partielles de rang pair et impair sont adjacentes.</span>
    <div class="content">
      <p>\(S_{2n+2} - S_{2n} = -a_{2n+1} + a_{2n+2} \leq 0\) : \((S_{2n})\) décroît. \(S_{2n+3} - S_{2n+1} = a_{2n+2} - a_{2n+3} \geq 0\) : \((S_{2n+1})\) croît. Enfin \(S_{2n} - S_{2n+1} = a_{2n+1} \to 0\). Les deux suites sont adjacentes : elles ont une limite commune \(S\), et \(S_{2n+1} \leq S \leq S_{2n}\). Comme les suites extraites de rangs pairs et impairs ont la même limite, \(S_n \to S\) : la série converge.</p>
      <p>Pour le reste, si \(n\) est pair : \(S_{n+1} \leq S \leq S_n\), donc \(-a_{n+1} = S_{n+1} - S_n \leq R_n = S - S_n \leq 0\). Le reste est négatif, du signe de \((-1)^{n+1}a_{n+1}\), et \(|R_n| \leq a_{n+1}\). Le cas \(n\) impair est symétrique (\(S_n \leq S \leq S_{n+1}\)).</p>
    </div>
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — la série harmonique alternée a pour somme \(\ln 2\)</strong>
    <ol>
      <li><strong>Convergence</strong> : \(a_n = \frac{1}{n+1}\) décroît vers 0, donc \(\sum \frac{(-1)^n}{n+1}\) converge, et \(\frac12 = S_1 \leq S \leq S_0 = 1\).</li>
      <li><strong>Valeur</strong> : pour \(t \in [0, 1]\), la somme géométrique finie donne \(\dfrac{1}{1+t} = \displaystyle\sum_{k=0}^{n} (-t)^k + \frac{(-t)^{n+1}}{1+t}\). On intègre sur \([0, 1]\) :</li>
    </ol>
    <div class="formula">$$\ln 2 = S_n + (-1)^{n+1}\int_0^1 \frac{t^{n+1}}{1+t}\,\mathrm{d}t.$$</div>
    <ol start="3">
      <li>L'intégrale est comprise entre 0 et \(\int_0^1 t^{n+1}\,\mathrm{d}t = \frac{1}{n+2}\), qui tend vers 0 : \(S_n \to \ln 2\). On retrouve au passage \(|R_n| \leq \frac{1}{n+2} = a_{n+1}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — nombre de termes pour une précision donnée</strong>
    <p>La série \(\sum \frac{(-1)^n}{2n+1}\) vérifie le théorème (sa somme vaut \(\frac{\pi}{4}\), on le montrera dans le chapitre « Séries entières »). Pour approcher \(\frac\pi4\) à \(10^{-3}\) près, il suffit que \(a_{n+1} = \frac{1}{2n+3} \leq 10^{-3}\), soit \(n \geq 498{,}5\) : la somme partielle \(S_{499}\), qui compte 500 termes, convient. De plus, on connaît le signe de l'erreur : \(R_{499}\) a le signe de \((-1)^{500}\), donc \(S_{499}\) est une valeur approchée <strong>par défaut</strong>.</p>
  </div>
  <div class="notice"><strong>La décroissance est indispensable.</strong> Avec, pour \(n \geq 1\), \(a_n = \frac1n\) si \(n\) est pair et \(a_n = \frac{1}{n^2}\) si \(n\) est impair, \((a_n)\) est positive et tend vers 0, mais la série \(\sum(-1)^n a_n\) diverge : ses termes positifs forment une série divergente (\(\sum \frac{1}{2p}\)) et ses termes négatifs une série convergente. Autre piège : le théorème s'applique aussi à une série dont les termes alternent de signe avec \(|u_n|\) décroissant vers 0, mais seulement <strong>à partir d'un certain rang</strong> ; l'encadrement du reste ne vaut alors qu'à partir de ce rang.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CONVERGENCE ABSOLUE</div>
  <h2>Termes réels ou complexes : contrôler le module</h2>
  <div class="intro">Pour une série de signe quelconque ou à termes complexes, le premier réflexe est d'étudier la série des modules, qui est à termes positifs : tous les outils du §2 et du §3 s'y appliquent. Si elle converge, la série de départ converge aussi.</div>

  <div class="def-box">
    La série \(\sum u_n\) (réelle ou complexe) est <strong>absolument convergente</strong> si la série à termes positifs \(\sum |u_n|\) converge. Une série convergente qui n'est pas absolument convergente est dite <strong>semi-convergente</strong> ; exemple : \(\sum \frac{(-1)^n}{n+1}\) (§4), puisque \(\sum \frac{1}{n+1}\) diverge.
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Une série absolument convergente est convergente, et
    <div class="formula" data-nom="Inégalité triangulaire pour les séries">$$\left|\sum_{n=0}^{+\infty} u_n\right| \leq \sum_{n=0}^{+\infty} |u_n|.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Séparer parties positive et négative, puis parties réelle et imaginaire.</span>
    <div class="content">
      <p><strong>Cas réel.</strong> On pose \(u_n^+ = \max(u_n, 0)\) et \(u_n^- = \max(-u_n, 0)\). Ce sont des réels positifs, majorés par \(|u_n|\) : par comparaison, \(\sum u_n^+\) et \(\sum u_n^-\) convergent. Or \(u_n = u_n^+ - u_n^-\), donc \(\sum u_n\) converge par linéarité.</p>
      <p><strong>Cas complexe.</strong> \(|\operatorname{Re} u_n| \leq |u_n|\) et \(|\operatorname{Im} u_n| \leq |u_n|\) : les séries réelles \(\sum \operatorname{Re} u_n\) et \(\sum \operatorname{Im} u_n\) sont absolument convergentes, donc convergentes, et \(\sum u_n\) converge.</p>
      <p><strong>Inégalité.</strong> Pour tout \(n\), \(\left|\sum_{k=0}^n u_k\right| \leq \sum_{k=0}^n |u_k|\) (inégalité triangulaire sur une somme finie) ; on passe à la limite dans cette inégalité large.</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Théorèmes de comparaison</strong> pour des suites complexes \((u_n)\), \((v_n)\) :
    <ul>
      <li>si \(|u_n| \leq |v_n|\) à partir d'un certain rang, la convergence absolue de \(\sum v_n\) entraîne celle de \(\sum u_n\) ;</li>
      <li>si \(u_n = O(v_n)\), et en particulier si \(u_n = o(v_n)\), la convergence absolue de \(\sum v_n\) entraîne celle de \(\sum u_n\) ;</li>
      <li>si \(u_n \sim v_n\), la convergence absolue de \(\sum v_n\) <strong>équivaut</strong> à celle de \(\sum u_n\).</li>
    </ul>
    (On applique le §2 aux suites positives \(|u_n|\) et \(|v_n|\) : \(u_n = O(v_n)\) signifie \(|u_n| \leq M|v_n|\), et \(u_n \sim v_n\) entraîne \(|u_n| \sim |v_n|\).)
  </div>
  <div class="method-box">
    <strong>Exemple — des séries à termes complexes ou de signe variable</strong>
    <ol>
      <li>\(\sum \dfrac{e^{in\theta}}{n^2}\) (\(\theta\) réel) : \(\left|\dfrac{e^{in\theta}}{n^2}\right| = \dfrac{1}{n^2}\), série absolument convergente.</li>
      <li>\(\sum \dfrac{\cos n}{n\sqrt n}\) : \(\left|\dfrac{\cos n}{n^{3/2}}\right| \leq \dfrac{1}{n^{3/2}}\), absolument convergente bien que le signe de \(\cos n\) varie de façon irrégulière.</li>
      <li>\(\sum \dfrac{(1+i)^n}{3^n}\) : \(\left|\dfrac{1+i}{3}\right| = \dfrac{\sqrt2}{3} \lt 1\), série géométrique absolument convergente, de somme \(\dfrac{1}{1 - (1+i)/3} = \dfrac{3}{2 - i} = \dfrac{6 + 3i}{5}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : transmettre la convergence simple par équivalent. Avec \(u_n = \dfrac{(-1)^n}{\sqrt n}\) et \(v_n = \dfrac{(-1)^n}{\sqrt n} + \dfrac1n\), on a \(u_n \sim v_n\) (car \(\frac1n = o\big(\frac{1}{\sqrt n}\big)\)). Pourtant \(\sum u_n\) converge (séries alternées) et \(\sum v_n\) diverge (somme d'une série convergente et d'une série divergente). L'équivalence ne transmet que la convergence <strong>absolue</strong>, ou la nature pour des termes de signe constant.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÈGLE DE D'ALEMBERT</div>
  <h2>Comparer à une série géométrique par le rapport des termes</h2>
  <div class="intro">Quand le terme général contient des factorielles ou des puissances \(n\)-ièmes, le quotient de deux termes consécutifs se simplifie et révèle un comportement géométrique. C'est aussi l'outil de base pour calculer le rayon de convergence d'une série entière.</div>

  <div class="prop-box">
    <strong>Règle de d'Alembert.</strong> Soit \((u_n)\) une suite complexe ne s'annulant pas à partir d'un certain rang, telle que \(\left|\dfrac{u_{n+1}}{u_n}\right| \to \ell \in [0, +\infty]\).
    <ul>
      <li>Si \(\ell \lt 1\), la série \(\sum u_n\) converge absolument.</li>
      <li>Si \(\ell \gt 1\), la série \(\sum u_n\) diverge grossièrement.</li>
      <li>Si \(\ell = 1\), on ne peut pas conclure : \(\sum \frac1n\) diverge, \(\sum \frac{1}{n^2}\) converge, et les deux donnent \(\ell = 1\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Glisser un réel \(q\) entre \(\ell\) et 1.</span>
    <div class="content">
      <p><strong>Cas \(\ell \lt 1\).</strong> Soit \(q\) tel que \(\ell \lt q \lt 1\). À partir d'un rang \(N\), \(|u_{n+1}| \leq q\,|u_n|\), d'où par récurrence \(|u_n| \leq |u_N|\,q^{n-N}\) pour \(n \geq N\). Le terme \(|u_n|\) est dominé par celui d'une série géométrique de raison \(q \lt 1\) : \(\sum |u_n|\) converge.</p>
      <p><strong>Cas \(\ell \gt 1\).</strong> À partir d'un rang \(N\), \(|u_{n+1}| \geq |u_n|\) : la suite \((|u_n|)\) est croissante à partir de ce rang, donc minorée par \(|u_N| \gt 0\), et ne tend pas vers 0.</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — trois séries réglées par d'Alembert</strong>
    <ol>
      <li>\(u_n = \dfrac{n^2}{2^n}\) : \(\dfrac{u_{n+1}}{u_n} = \dfrac12\left(1 + \dfrac1n\right)^2 \to \dfrac12\) : convergence.</li>
      <li>\(u_n = \dfrac{z^n}{n!}\), \(z \neq 0\) : \(\left|\dfrac{u_{n+1}}{u_n}\right| = \dfrac{|z|}{n+1} \to 0\) : convergence absolue pour tout complexe \(z\).</li>
      <li>\(u_n = \dfrac{(2n)!}{(n!)^2\,5^n}\) : \(\dfrac{u_{n+1}}{u_n} = \dfrac{(2n+2)(2n+1)}{5\,(n+1)^2} = \dfrac{2(2n+1)}{5(n+1)} \to \dfrac45\) : convergence.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un cas \(\ell = 1\) que la preuve tranche quand même</strong>
    <p>\(u_n = \dfrac{n!\,e^n}{n^n}\). On calcule \(\dfrac{u_{n+1}}{u_n} = \dfrac{e}{(1 + 1/n)^n} \to 1\) : la règle ne conclut pas. Mais \(n\ln\!\left(1 + \frac1n\right) \lt 1\) (car \(\ln(1+x) \lt x\) pour \(x \gt 0\)), donc \(\left(1 + \frac1n\right)^n \lt e\) et le rapport est strictement supérieur à 1 : la suite \((u_n)\) croît, ne tend pas vers 0, et la série diverge grossièrement. Ce que la démonstration utilise vraiment, c'est la position du rapport par rapport à 1.</p>
  </div>
  <div class="notice"><strong>Mauvais outil</strong> : pour un terme général rationnel en \(n\) (ou contenant des puissances de \(n\) et des logarithmes), le rapport tend toujours vers 1 et la règle de d'Alembert est inopérante. On passe alors par un équivalent et les séries de Riemann.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · PRODUIT DE CAUCHY</div>
  <h2>Multiplier deux séries</h2>
  <div class="intro">Pour multiplier deux sommes infinies, on regroupe les produits \(u_p v_q\) selon la valeur de \(p + q\), exactement comme on multiplie deux polynômes. Ce regroupement est légitime pour des séries absolument convergentes ; il donne en particulier la relation fonctionnelle de l'exponentielle et prépare le produit des séries entières.</div>

  <div class="def-box">
    Le <strong>produit de Cauchy</strong> des séries \(\sum u_n\) et \(\sum v_n\) est la série \(\sum w_n\) de terme général
    <div class="formula" data-nom="Produit de Cauchy">$$w_n = \sum_{k=0}^{n} u_k\,v_{n-k} = \sum_{p+q=n} u_p\,v_q.$$</div>
  </div>
  <div class="prop-box">
    <strong>Théorème.</strong> Si \(\sum u_n\) et \(\sum v_n\) sont <strong>absolument convergentes</strong>, leur produit de Cauchy est absolument convergent et
    <div class="formula">$$\sum_{n=0}^{+\infty} w_n = \left(\sum_{n=0}^{+\infty} u_n\right)\left(\sum_{n=0}^{+\infty} v_n\right).$$</div>
    La démonstration n'est pas exigible.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Idée de la preuve</span>
    <span class="prompt">Le triangle des indices est coincé entre deux carrés.</span>
    <div class="content"><p>Pour des termes positifs, \(\sum_{n=0}^{N} w_n\) est la somme des \(u_p v_q\) sur le triangle \(p + q \leq N\). Ce triangle contient le carré \(p, q \leq N/2\) et est contenu dans le carré \(p, q \leq N\) :</p>
    <div class="formula">$$\begin{aligned} \Big(\sum_{p \leq N/2} u_p\Big)\Big(\sum_{q \leq N/2} v_q\Big) &\leq \sum_{n=0}^{N} w_n\\ &\leq \Big(\sum_{p \leq N} u_p\Big)\Big(\sum_{q \leq N} v_q\Big). \end{aligned}$$</div>
    <p>Les deux bornes tendent vers le produit des sommes. Le cas général s'en déduit en contrôlant l'écart par les mêmes sommes écrites avec \(|u_p|\) et \(|v_q|\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — \(e^a e^b = e^{a+b}\) pour \(a, b\) complexes</strong>
    <ol>
      <li>Les séries \(\sum \frac{a^n}{n!}\) et \(\sum \frac{b^n}{n!}\) convergent absolument (§6).</li>
      <li>Leur produit de Cauchy a pour terme \(w_n = \displaystyle\sum_{k=0}^{n} \frac{a^k}{k!}\,\frac{b^{n-k}}{(n-k)!} = \frac{1}{n!}\sum_{k=0}^{n}\binom{n}{k}a^k b^{n-k} = \frac{(a+b)^n}{n!}\) (formule du binôme).</li>
      <li>Le théorème donne \(\displaystyle\sum_{n=0}^{+\infty}\frac{(a+b)^n}{n!} = \Big(\sum \frac{a^n}{n!}\Big)\Big(\sum \frac{b^n}{n!}\Big)\), c'est-à-dire \(e^{a+b} = e^a e^b\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — le carré de la série géométrique</strong>
    <p>Pour \(|z| \lt 1\), le produit de Cauchy de \(\sum z^n\) par elle-même a pour terme \(w_n = \sum_{k=0}^n z^k z^{n-k} = (n+1)z^n\). Donc</p>
    <div class="formula" data-nom="Carré de la série géométrique">$$\sum_{n=0}^{+\infty}(n+1)\,z^n = \frac{1}{(1-z)^2} \qquad (|z| \lt 1).$$</div>
    <p>Application : \(\sum_{n=0}^{+\infty} \dfrac{n+1}{2^n} = \dfrac{1}{(1 - 1/2)^2} = 4\).</p>
  </div>
  <div class="notice"><strong>L'hypothèse de convergence absolue n'est pas décorative.</strong> Avec \(u_n = v_n = \dfrac{(-1)^n}{\sqrt{n+1}}\), les deux séries convergent (séries alternées). Mais \(w_n = (-1)^n\sum_{k=0}^{n}\dfrac{1}{\sqrt{(k+1)(n-k+1)}}\), et chaque racine est majorée par \(\frac{n+2}{2}\) (moyenne arithmético-géométrique), d'où \(|w_n| \geq \dfrac{2(n+1)}{n+2} \geq 1\) : le produit de Cauchy diverge grossièrement.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · STRATÉGIE D'ÉTUDE</div>
  <h2>Déterminer la nature d'une série</h2>
  <div class="intro">Les critères précédents s'organisent en un ordre de réflexion presque systématique. Le développement asymptotique du terme général, vu en 1ʳᵉ année, est l'outil qui débloque les cas où aucun critère ne s'applique directement.</div>

  <div class="method-box">
    <strong>Méthode — l'ordre des questions</strong>
    <ol>
      <li><strong>Le terme général tend-il vers 0 ?</strong> Sinon, divergence grossière, et c'est fini.</li>
      <li><strong>Signe constant</strong> (au moins à partir d'un certain rang) : chercher un équivalent simple et comparer à une série de Riemann ou géométrique ; règle \(n^\alpha u_n\) ; règle de d'Alembert si factorielles ou puissances \(n\)-ièmes ; comparaison série-intégrale si \(u_n = f(n)\) avec \(f\) monotone (logarithmes).</li>
      <li><strong>Signe variable ou termes complexes</strong> : étudier d'abord la convergence absolue.</li>
      <li><strong>Pas de convergence absolue</strong> : si la série est alternée avec \(|u_n|\) décroissant vers 0, théorème des séries alternées ; sinon, développer le terme général en somme d'un terme alterné (séries alternées), d'un terme de signe constant (équivalent) et d'un terme absolument convergent.</li>
      <li><strong>Calcul de la somme</strong>, quand il est demandé : télescopage, séries géométriques et exponentielle, développements en série entière (chapitre « Séries entières »), intégrale (comme pour \(\ln 2\) au §4).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — deux termes positifs qui demandent un développement</strong>
    <ol>
      <li>\(u_n = e - \left(1 + \frac1n\right)^n\). Le développement \(\left(1 + \frac1n\right)^n = e - \frac{e}{2n} + O\!\left(\frac{1}{n^2}\right)\) (chapitre « Suites numériques (approfondissements) », §4) donne \(u_n \sim \frac{e}{2n}\), positif : la série diverge.</li>
      <li>\(v_n = n^{1/n^2} - 1 = \exp\!\left(\frac{\ln n}{n^2}\right) - 1 \sim \frac{\ln n}{n^2}\). Comme \(n^{3/2}\cdot\frac{\ln n}{n^2} = \frac{\ln n}{\sqrt n} \to 0\), on a \(v_n = o\!\left(\frac{1}{n^{3/2}}\right)\) : la série converge.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — une série « presque alternée » qui diverge</strong>
    <p>\(u_n = \ln\!\left(1 + \dfrac{(-1)^n}{\sqrt n}\right)\) pour \(n \geq 2\). On a \(u_n \sim \frac{(-1)^n}{\sqrt n}\), dont la série converge ; mais l'équivalent ne permet pas de conclure (signe variable, pas de convergence absolue). On développe \(\ln(1 + x) = x - \frac{x^2}{2} + O(x^3)\) avec \(x = \frac{(-1)^n}{\sqrt n}\) :</p>
    <div class="formula">$$u_n = \frac{(-1)^n}{\sqrt n} - \frac{1}{2n} + O\!\left(\frac{1}{n^{3/2}}\right).$$</div>
    <ol>
      <li>\(\sum \frac{(-1)^n}{\sqrt n}\) converge (séries alternées) ;</li>
      <li>\(\sum \frac{1}{2n}\) diverge ;</li>
      <li>le terme en \(O\big(n^{-3/2}\big)\) donne une série absolument convergente.</li>
    </ol>
    <p>Somme de deux séries convergentes et d'une série divergente : \(\sum u_n\) diverge (vers \(-\infty\)).</p>
  </div>
  <div class="notice"><strong>À retenir</strong> : un équivalent du terme général ne suffit pour conclure que si les termes sont de signe constant. Pour un terme alterné, il faut pousser le développement jusqu'à obtenir un reste absolument convergent.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Sommation par paquets, Bertrand, Raabe-Duhamel, Abel</h2>
  <div class="intro">Ces compléments ne sont pas exigibles ; ils éclairent des exercices classiques ou les probabilités.</div>
  <div class="prop-box">
    <strong>Ordre et regroupement des termes.</strong> La somme d'une série <strong>absolument</strong> convergente ne dépend ni de l'ordre des termes ni de la façon de les regrouper en paquets (on parle de famille sommable). Le programme admet ce résultat et ne l'utilise que dans le cadre des probabilités (espérance, théorème de transfert, sommes doubles avec le théorème de Fubini). Pour une série semi-convergente, c'est faux : en prenant les termes de \(1 - \frac12 + \frac13 - \frac14 + \cdots\) dans l'ordre « un positif, deux négatifs », \(1 - \frac12 - \frac14 + \frac13 - \frac16 - \frac18 + \cdots\), on obtient \(\frac12\ln 2\) au lieu de \(\ln 2\).
  </div>
  <div class="prop-box">
    <strong>Séries de Bertrand.</strong> \(\sum_{n \geq 2} \dfrac{1}{n^\alpha(\ln n)^\beta}\) converge si et seulement si \(\alpha \gt 1\), ou \(\alpha = 1\) et \(\beta \gt 1\). Le cas \(\alpha = 1\) se traite par comparaison série-intégrale (§3) ; les autres par la règle « \(n^\gamma u_n\) » du §2, avec \(1 \lt \gamma \lt \alpha\) si \(\alpha \gt 1\), et \(\gamma = 1\) si \(\alpha \lt 1\).
  </div>
  <div class="prop-box">
    <strong>Règle de Raabe-Duhamel.</strong> Pour une série à termes strictement positifs, si \(\dfrac{u_{n+1}}{u_n} = 1 - \dfrac{a}{n} + O\!\left(\dfrac{1}{n^2}\right)\), alors \(u_n \sim \dfrac{C}{n^a}\) avec \(C \gt 0\) : la série converge si et seulement si \(a \gt 1\). Elle complète d'Alembert dans le cas \(\ell = 1\).
  </div>
  <div class="prop-box">
    <strong>Critère de Cauchy et transformation d'Abel.</strong> Une série converge si et seulement si ses « tranches » \(\sum_{k=n}^{m} u_k\) tendent vers 0 uniformément en \(m \geq n\) (critère de Cauchy). Avec une sommation par parties (transformation d'Abel), on en déduit par exemple que \(\sum \frac{e^{in\theta}}{n}\) converge pour \(\theta \notin 2\pi\mathbb{Z}\), bien qu'elle ne soit ni absolument convergente ni alternée.
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="sr2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · SÉRIES 2A</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à décider de la nature d'une série (le plus souvent), à encadrer ses sommes partielles ou son reste, et à calculer sa somme quand c'est possible.</div>

  <div class="method-box"><strong>Méthode 1 — Choisir l'outil : l'ordre des questions</strong>
    <ol>
      <li>Le terme général tend-il vers 0 ? Sinon : <strong>divergence grossière</strong>, c'est fini.</li>
      <li>Termes de <strong>signe constant</strong> (à partir d'un rang) : équivalent et comparaison à une série de Riemann ou géométrique (méthode 3) ; règle de d'Alembert en présence de factorielles ou de puissances \(n\)-ièmes (méthode 9) ; comparaison série-intégrale si \(u_n = f(n)\) avec \(f\) monotone (méthodes 4 et 5).</li>
      <li>Termes de <strong>signe variable</strong> ou <strong>complexes</strong> : étudier d'abord la convergence absolue (méthode 7).</li>
      <li>Pas de convergence absolue : théorème des séries alternées (méthode 6), ou développement asymptotique du terme général (méthode 8).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_n = \dfrac{n + (-1)^n}{n^2}\) a un signe constant (positif pour \(n \geq 2\)) et \(u_n \sim \dfrac1n\) : la série diverge. Inutile d'invoquer les séries alternées.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : « \(u_n \to 0\), donc la série converge ». La condition est nécessaire, jamais suffisante : \(\sum \frac1n\) diverge.</div>

  <div class="method-box"><strong>Méthode 2 — Calculer une somme par télescopage</strong>
    <ol>
      <li>Écrire le terme général sous la forme \(u_n = a_{n+1} - a_n\) (décomposition en éléments simples d'une fraction rationnelle, logarithme d'un quotient).</li>
      <li>Calculer la somme partielle : \(\sum_{k=n_0}^{n} u_k = a_{n+1} - a_{n_0}\).</li>
      <li>Conclure par le <strong>lien suite-série</strong> : la série converge si et seulement si \((a_n)\) converge, et sa somme vaut \(\lim a_n - a_{n_0}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(1 + \dfrac{1}{n(n+2)} = \dfrac{(n+1)^2}{n(n+2)}\), donc \(\ln\!\left(1 + \dfrac{1}{n(n+2)}\right) = \big[\ln(n+1) - \ln n\big] - \big[\ln(n+2) - \ln(n+1)\big]\). La somme de \(n = 1\) à \(N\) vaut \(\ln 2 + \ln\dfrac{N+1}{N+2}\), qui tend vers \(\ln 2\) : la série converge, de somme \(\ln 2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Comparer à une série de Riemann</strong>
    <ol>
      <li>Vérifier que les termes sont <strong>positifs</strong> à partir d'un certain rang.</li>
      <li>Chercher un équivalent simple \(u_n \sim \dfrac{c}{n^\alpha}\) (\(c \gt 0\)) : la série converge si et seulement si \(\alpha \gt 1\).</li>
      <li>À défaut d'équivalent simple (logarithmes, exponentielles), utiliser la règle « \(n^\alpha u_n\) » : si \(n^\alpha u_n \to 0\) pour un \(\alpha \gt 1\), convergence ; si \(n u_n \to +\infty\), divergence.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_n = \dfrac{(\ln n)^2}{n^{3/2}}\). On glisse \(\alpha = \frac54\) entre 1 et \(\frac32\) : \(n^{5/4}u_n = \dfrac{(\ln n)^2}{n^{1/4}} \to 0\), donc \(u_n = o\!\left(\dfrac{1}{n^{5/4}}\right)\) et la série converge.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Estimer les sommes partielles d'une série divergente</strong>
    <ol>
      <li>Écrire \(u_k = f(k)\) avec \(f\) continue, positive et <strong>décroissante</strong> sur \([n_0, +\infty[\) (vérifier la monotonie, par la dérivée si besoin).</li>
      <li>Encadrer : \(\displaystyle\int_k^{k+1} f \leq f(k) \leq \int_{k-1}^{k} f\), puis sommer de \(n_0\) (ou \(n_0 + 1\)) à \(n\).</li>
      <li>Calculer les intégrales : deux bornes équivalentes donnent un équivalent de la somme partielle.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(t) = \dfrac{\ln t}{t}\) a pour dérivée \(\dfrac{1 - \ln t}{t^2}\), négative pour \(t \geq e\) : \(f\) décroît sur \([3, +\infty[\). De primitive \(\frac12(\ln t)^2\), l'encadrement donne</p>
    <div class="formula">$$\sum_{k=3}^{n} \frac{\ln k}{k} \sim \frac{(\ln n)^2}{2}.$$</div>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la monotonie. Elle n'est souvent vraie qu'à partir d'un certain rang (ici \(t \geq e\)) : on commence alors la somme à ce rang, les premiers termes, en nombre fini, ne changeant ni la nature ni l'équivalent.</div>

  <div class="method-box"><strong>Méthode 5 — Encadrer un reste et compter les termes</strong>
    <ol>
      <li>Pour \(f\) décroissante et intégrable sur \([n_0, +\infty[\), sommer l'encadrement de \(k = n+1\) à \(+\infty\) :</li>
    </ol>
    <div class="formula">$$\int_{n+1}^{+\infty} f(t)\,\mathrm{d}t \leq R_n = \sum_{k=n+1}^{+\infty} f(k) \leq \int_{n}^{+\infty} f(t)\,\mathrm{d}t.$$</div>
    <ol start="2">
      <li>Bornes équivalentes : un équivalent du reste. Pour une précision \(\varepsilon\), choisir \(n\) tel que la borne de droite soit inférieure à \(\varepsilon\).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(\sum \frac{1}{k^3}\), \(\dfrac{1}{2(n+1)^2} \leq R_n \leq \dfrac{1}{2n^2}\), donc \(R_n \sim \dfrac{1}{2n^2}\). La somme partielle approche \(\sum_{k=1}^{+\infty}\frac{1}{k^3}\) à \(10^{-6}\) près dès que \(2n^2 \geq 10^6\), soit \(n \geq 708\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Appliquer le théorème des séries alternées</strong>
    <ol>
      <li>Écrire \(u_n = (-1)^n a_n\) et vérifier les <strong>trois</strong> hypothèses : \(a_n \geq 0\), \((a_n)\) décroissante (à partir d'un rang), \(a_n \to 0\).</li>
      <li>Conclure à la convergence ; la somme est encadrée par deux sommes partielles consécutives.</li>
      <li>Pour une valeur approchée : \(|R_n| \leq a_{n+1}\), et \(R_n\) a le signe de son premier terme \((-1)^{n+1}a_{n+1}\), ce qui dit si \(S_n\) est une valeur par défaut ou par excès.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(e^{-1} = \sum_{n \geq 0} \frac{(-1)^n}{n!}\), et \(\frac{1}{n!}\) décroît vers 0. Pour une erreur inférieure à \(10^{-6}\), il suffit que \(\frac{1}{(n+1)!} \leq 10^{-6}\) : \(n = 9\) (\(10! = 3\,628\,800\)). Le reste \(R_9\) a le signe de \(\frac{(-1)^{10}}{10!} \gt 0\) : \(S_9 \approx 0{,}367\,879\,2\) est une valeur par défaut de \(e^{-1} \approx 0{,}367\,879\,4\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la décroissance. Une suite positive qui tend vers 0 sans décroître ne suffit pas ; et l'encadrement du reste ne vaut qu'à partir du rang où la décroissance commence.</div>

  <div class="method-box"><strong>Méthode 7 — Prouver une convergence absolue</strong>
    <ol>
      <li>Passer au module : \(|u_n|\) est positif, tous les outils des méthodes 3 à 5 s'appliquent.</li>
      <li>Majorer \(|u_n|\) par le terme d'une série convergente (\(|\cos|\), \(|\sin|\), \(|e^{i\theta}|\) bornés par 1), ou chercher un équivalent de \(|u_n|\), ou montrer \(u_n = O(v_n)\) avec \(\sum v_n\) absolument convergente.</li>
      <li>Conclure : absolument convergente, donc convergente, et \(\left|\sum u_n\right| \leq \sum |u_n|\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_n = \dfrac{(-1)^n n}{n^3 + 1}\) : \(|u_n| \sim \dfrac{1}{n^2}\), série absolument convergente. De même \(\sum \frac{\sin n}{n^2}\), puisque \(\left|\frac{\sin n}{n^2}\right| \leq \frac{1}{n^2}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Développer un terme général qui change de signe</strong>
    <ol>
      <li>Si \(\sum |u_n|\) diverge et que la série n'est pas exactement alternée, développer \(u_n\) jusqu'à un reste <strong>absolument convergent</strong> (souvent \(O(n^{-3/2})\) ou \(O(n^{-2})\)).</li>
      <li>Classer les termes obtenus : terme alterné (séries alternées), terme de signe constant (équivalent, Riemann), reste (convergence absolue).</li>
      <li>Conclure : une somme de séries convergentes converge ; convergentes plus <strong>une</strong> divergente, elle diverge.</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(n \geq 2\), \(u_n = \dfrac{(-1)^n}{\sqrt n + (-1)^n}\). Avec \(\frac{x}{1+x} = x - x^2 + O(x^3)\) et \(x = \frac{(-1)^n}{\sqrt n}\) :</p>
    <div class="formula">$$u_n = \frac{(-1)^n}{\sqrt n} - \frac1n + O\!\left(\frac{1}{n^{3/2}}\right).$$</div>
    <p>Le premier terme donne une série convergente, le dernier une série absolument convergente, le terme \(-\frac1n\) une série divergente : \(\sum u_n\) diverge, alors que \(u_n \sim \frac{(-1)^n}{\sqrt n}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : conclure par équivalent pour des termes de signe variable. L'équivalence ne transmet que la convergence <strong>absolue</strong> (ou la nature pour des termes de signe constant) : l'exemple ci-dessus le montre.</div>

  <div class="method-box"><strong>Méthode 9 — Utiliser la règle de d'Alembert</strong>
    <ol>
      <li>Réserver la règle aux termes qui contiennent des <strong>factorielles</strong>, des puissances \(a^n\) ou \(n^n\) : le quotient \(\left|\frac{u_{n+1}}{u_n}\right|\) se simplifie.</li>
      <li>Calculer sa limite \(\ell\) : convergence absolue si \(\ell \lt 1\), divergence grossière si \(\ell \gt 1\).</li>
      <li>Si \(\ell = 1\), la règle ne conclut pas : revenir à un équivalent ; si le quotient reste \(\geq 1\), la suite \((|u_n|)\) croît et la série diverge grossièrement.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_n = \dfrac{n^n}{n!\,3^n}\). Le quotient vaut \(\dfrac{(n+1)^{n+1}\,n!\,3^n}{(n+1)!\,3^{n+1}\,n^n} = \dfrac13\left(1 + \dfrac1n\right)^n \to \dfrac{e}{3} \lt 1\) : la série converge.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer d'Alembert à une fraction rationnelle en \(n\) (ou à des puissances de \(n\) et de \(\ln n\)) : le rapport tend toujours vers 1, la règle est inopérante.</div>

  <div class="method-box"><strong>Méthode 10 — Calculer avec un produit de Cauchy</strong>
    <ol>
      <li>Vérifier que les deux séries sont <strong>absolument</strong> convergentes.</li>
      <li>Calculer le terme \(w_n = \sum_{k=0}^{n} u_k v_{n-k}\) (souvent une somme géométrique ou un binôme).</li>
      <li>Conclure : \(\sum w_n\) converge absolument et sa somme est le produit des deux sommes.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(u_k = \frac{1}{2^k}\) et \(v_k = \frac{1}{3^k}\), \(w_n = \frac{1}{3^n}\sum_{k=0}^{n}\left(\frac32\right)^k = \frac{3}{2^n} - \frac{2}{3^n}\). Donc \(\sum_{n \geq 0} w_n = 2 \times \frac32 = 3\), ce que confirme le calcul direct \(6 - 3\).</p>
  </div>
  <div class="notice"><strong>Hors programme</strong> : les familles sommables et la sommation par paquets (théorème de Fubini pour les sommes doubles) ne sont utilisées, admises, qu'en probabilités ; les séries de Bertrand \(\sum \frac{1}{n^\alpha (\ln n)^\beta}\) ne sont pas un résultat de cours : on les traite au cas par cas par comparaison série-intégrale (exercice 06).</div>
</div>
</template>

<div class="exo-wrapper">
<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Cinq natures</h3>
  <div class="statement">Déterminer la nature des séries de terme général suivant (\(n \geq 1\)).</div>
  <div class="q"><strong>Q1.</strong> \(\dfrac{n}{n^3 + 1}\). <strong>Q2.</strong> \(\dfrac{1}{\sqrt{n(n+1)}}\). <strong>Q3.</strong> \(1 - \cos\dfrac{1}{\sqrt n}\). <strong>Q4.</strong> \(n^2 e^{-n}\). <strong>Q5.</strong> \(\dfrac{\ln n}{n}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p>Tous les termes sont positifs : on compare à une série de référence.</p>
    <p><strong>Q1.</strong> \(\frac{n}{n^3 + 1} \sim \frac{1}{n^2}\) : convergente (Riemann, \(\alpha = 2\)).</p>
    <p><strong>Q2.</strong> \(\sqrt{n(n+1)} \sim n\), donc le terme est équivalent à \(\frac1n\) : divergente.</p>
    <p><strong>Q3.</strong> \(\frac{1}{\sqrt n} \to 0\) et \(1 - \cos\varepsilon \sim \frac{\varepsilon^2}{2}\) : le terme est équivalent à \(\frac{1}{2n}\), la série diverge. (Le piège : ce n'est pas \(\frac{1}{n^2}\).)</p>
    <p><strong>Q4.</strong> \(n^2 \cdot n^2 e^{-n} = n^4 e^{-n} \to 0\) (croissances comparées), donc \(n^2e^{-n} = o\!\left(\frac{1}{n^2}\right)\) : convergente. La règle de d'Alembert conclut aussi : le quotient \(\left(1 + \frac1n\right)^2 e^{-1}\) tend vers \(e^{-1} \lt 1\).</p>
    <p><strong>Q5.</strong> Pour \(n \geq 3\), \(\ln n \geq 1\), donc \(\frac{\ln n}{n} \geq \frac1n\) : divergente par comparaison avec la série harmonique.</p>
  </div>
</div>
<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Nature par équivalent</h3>
  <div class="statement">Nature de \(\sum_{n\ge1} \ln\!\left(1 + \dfrac{1}{n^2}\right)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>\(\ln(1+1/n^2) \sim 1/n^2 \gt 0\) : même nature que \(\sum 1/n^2\) (Riemann, \(\alpha=2 \gt 1\)), donc <strong>convergente</strong>.</p></div>
</div>
<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Deux télescopages</h3>
  <div class="statement">Montrer la convergence et calculer la somme de chaque série.</div>
  <div class="q"><strong>Q1.</strong> \(\displaystyle\sum_{n \geq 1} \frac{1}{n(n+1)(n+2)}\) (on pourra comparer à \(\frac{1}{n(n+1)} - \frac{1}{(n+1)(n+2)}\)).</div>
  <div class="q"><strong>Q2.</strong> \(\displaystyle\sum_{n \geq 2} \ln\!\left(1 - \frac{1}{n^2}\right)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> En réduisant au même dénominateur :</p>
    <div class="formula">$$\frac{1}{n(n+1)} - \frac{1}{(n+1)(n+2)} = \frac{(n+2) - n}{n(n+1)(n+2)} = \frac{2}{n(n+1)(n+2)}.$$</div>
    <p>Avec \(a_n = \frac{1}{n(n+1)}\), le terme général vaut \(\frac12(a_n - a_{n+1})\), et</p>
    <div class="formula">$$\sum_{k=1}^{n} \frac{1}{k(k+1)(k+2)} = \frac12\big(a_1 - a_{n+1}\big) \xrightarrow[n\to\infty]{} \frac12 \cdot \frac12 = \frac14.$$</div>
    <p><strong>Q2.</strong> \(1 - \frac{1}{n^2} = \frac{(n-1)(n+1)}{n^2}\), donc, avec \(b_n = \ln n - \ln(n-1)\) (\(n \geq 2\)), le terme vaut</p>
    <div class="formula">$$\ln\!\left(1 - \frac{1}{n^2}\right) = \big[\ln(n+1) - \ln n\big] - \big[\ln n - \ln(n-1)\big] = b_{n+1} - b_n.$$</div>
    <p>La somme de \(n = 2\) à \(N\) vaut \(b_{N+1} - b_2 = \ln\dfrac{N+1}{N} - \ln 2\), qui tend vers \(-\ln 2\). La série converge, de somme \(-\ln 2\) (les termes sont négatifs, équivalents à \(-\frac{1}{n^2}\) : la convergence était prévisible).</p>
  </div>
</div>
<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Série alternée</h3>
  <div class="statement">Étudier \(\sum_{n\ge1} \dfrac{(-1)^n}{\sqrt n}\) : convergence ? absolue ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>\(a_n = 1/\sqrt n\) positive, décroissante, \(\to 0\) : par le théorème des séries alternées, la série <strong>converge</strong>.</p>
  <p>Mais \(\sum 1/\sqrt n\) (Riemann \(\alpha=1/2 \le 1\)) <strong>diverge</strong> : la série est <strong>semi-convergente</strong>.</p></div>
</div>
<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Restes et sommes partielles par comparaison série-intégrale</h3>
  <div class="statement">Soit \(\alpha \gt 1\) et \(R_n = \displaystyle\sum_{k=n+1}^{+\infty}\frac{1}{k^\alpha}\) le reste de la série de Riemann convergente.</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\dfrac{1}{(\alpha - 1)(n+1)^{\alpha-1}} \leq R_n \leq \dfrac{1}{(\alpha - 1)n^{\alpha-1}}\), et en déduire un équivalent de \(R_n\).</div>
  <div class="q"><strong>Q2.</strong> Cas \(\alpha = \frac32\) : combien de termes la majoration demande-t-elle pour approcher la somme à \(10^{-2}\) près ? Commenter.</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(\displaystyle\sum_{k=1}^{n}\frac{1}{2k+1} \sim \frac{\ln n}{2}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(f(t) = t^{-\alpha}\) est continue, positive et décroissante sur \([1, +\infty[\) : pour \(k \geq 2\), \(\int_k^{k+1} f \leq f(k) \leq \int_{k-1}^{k} f\). On somme de \(k = n+1\) à \(+\infty\) (les intégrales convergent car \(\alpha \gt 1\)) :</p>
    <div class="formula">$$\int_{n+1}^{+\infty}\frac{\mathrm{d}t}{t^\alpha} \leq R_n \leq \int_{n}^{+\infty}\frac{\mathrm{d}t}{t^\alpha}, \qquad \int_{x}^{+\infty}\frac{\mathrm{d}t}{t^\alpha} = \frac{1}{(\alpha-1)\,x^{\alpha-1}}.$$</div>
    <p>Comme \((n+1)^{\alpha - 1} \sim n^{\alpha - 1}\), les deux bornes sont équivalentes : \(R_n \sim \dfrac{1}{(\alpha-1)\,n^{\alpha-1}}\).</p>
    <p><strong>Q2.</strong> Pour \(\alpha = \frac32\), \(R_n \leq \frac{2}{\sqrt n}\), qui est inférieur à \(10^{-2}\) dès que \(\sqrt n \geq 200\), soit \(n \geq 40\,000\). La minoration montre que l'on ne peut guère faire mieux (\(R_n \geq \frac{2}{\sqrt{n+1}}\)) : quarante mille termes pour deux décimales, la convergence est très lente. Avec la correction \(S_n + \frac{2}{\sqrt n}\), on gagnerait beaucoup.</p>
    <p><strong>Q3.</strong> \(g(t) = \frac{1}{2t + 1}\) est continue, positive et décroissante sur \([1, +\infty[\), de primitive \(\frac12\ln(2t+1)\). L'encadrement donne</p>
    <div class="formula">$$\frac12\ln\frac{2n+3}{3} \leq \sum_{k=1}^{n}\frac{1}{2k+1} \leq \frac13 + \frac12\ln\frac{2n+1}{3}.$$</div>
    <p>Les deux bornes valent \(\frac12\ln n + O(1)\), donc sont équivalentes à \(\frac{\ln n}{2}\) : la somme aussi.</p>
  </div>
</div>
<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Une série de Bertrand (résultat général hors programme)</h3>
  <div class="statement">Nature de \(\displaystyle\sum_{n\ge2} \frac{1}{n\,(\ln n)^2}\) ? (Le critère général des séries de Bertrand n'est pas au programme : on raisonne par comparaison série-intégrale.)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>\(f(t)=\dfrac{1}{t(\ln t)^2}\) est continue, positive et décroissante sur \([2, +\infty[\) (dénominateur croissant). \(\displaystyle\int_2^{X} f = \Big[-\frac{1}{\ln t}\Big]_2^{X} = \frac{1}{\ln 2}-\frac{1}{\ln X} \to \frac{1}{\ln 2}\) : l'intégrale converge, donc la série <strong>converge</strong> (cas \(\alpha=1\), \(\beta=2 \gt 1\) des séries de Bertrand).</p></div>
</div>
<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>D'Alembert et produit de Cauchy</h3>
  <div class="statement">Questions indépendantes.</div>
  <div class="q"><strong>Q1.</strong> Étudier la nature de \(\sum \dfrac{a^n\, n!}{n^n}\) pour \(a = 1\), \(a = 2\) et \(a = 3\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le produit de Cauchy des séries \(\sum \frac{1}{n!}\) et \(\sum \frac{(-1)^n}{n!}\), et retrouver ainsi que \(e \cdot e^{-1} = 1\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\displaystyle\sum_{n=0}^{+\infty}\frac{n+1}{3^n}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Termes strictement positifs ; le quotient vaut</p>
    <div class="formula">$$\frac{u_{n+1}}{u_n} = \frac{a^{n+1}(n+1)!\,n^n}{(n+1)^{n+1}\,a^n\,n!} = a\left(\frac{n}{n+1}\right)^n = \frac{a}{(1 + 1/n)^n} \xrightarrow[n\to\infty]{} \frac{a}{e}.$$</div>
    <p>Pour \(a = 1\) et \(a = 2\), \(\frac ae \lt 1\) : convergence. Pour \(a = 3\), \(\frac3e \approx 1{,}10 \gt 1\) : divergence grossière.</p>
    <p><strong>Q2.</strong> Les deux séries convergent absolument (règle de d'Alembert). Le terme du produit vaut, pour \(n \geq 1\),</p>
    <div class="formula">$$w_n = \sum_{k=0}^{n}\frac{1}{k!}\cdot\frac{(-1)^{n-k}}{(n-k)!} = \frac{1}{n!}\sum_{k=0}^{n}\binom nk (-1)^{n-k} = \frac{(1 - 1)^n}{n!} = 0,$$</div>
    <p>et \(w_0 = 1\). La somme du produit vaut donc 1, et le théorème donne \(\left(\sum\frac{1}{n!}\right)\left(\sum\frac{(-1)^n}{n!}\right) = 1\), c'est-à-dire \(e \cdot e^{-1} = 1\).</p>
    <p><strong>Q3.</strong> Le produit de Cauchy de \(\sum z^n\) par elle-même donne \(\sum_{n \geq 0}(n+1)z^n = \frac{1}{(1-z)^2}\) pour \(|z| \lt 1\). Avec \(z = \frac13\) : la somme vaut \(\dfrac{1}{(2/3)^2} = \dfrac94\).</p>
  </div>
</div>
<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ★</span>
  <h3>Une série presque alternée, selon un paramètre</h3>
  <div class="statement">Soit \(\alpha \gt 0\). Pour \(n \geq 2\), on pose \(u_n = \dfrac{(-1)^n}{n^\alpha + (-1)^n}\).</div>
  <div class="q"><strong>Q1.</strong> Pour quels \(\alpha\) la série \(\sum u_n\) est-elle absolument convergente ?</div>
  <div class="q"><strong>Q2.</strong> Vérifier que \(u_n = \dfrac{(-1)^n}{n^\alpha} - \dfrac{1}{n^\alpha\,\big(n^\alpha + (-1)^n\big)}\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(\sum u_n\) converge si et seulement si \(\alpha \gt \frac12\).</div>
  <div class="q"><strong>Q4.</strong> Pourquoi le théorème des séries alternées ne s'applique-t-il pas directement à \(\sum u_n\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(n \geq 2\), \(n^\alpha \gt 1\), donc \(u_n\) est défini, et \(|u_n| = \frac{1}{n^\alpha + (-1)^n} \sim \frac{1}{n^\alpha}\). La série \(\sum |u_n|\) converge si et seulement si \(\alpha \gt 1\) (Riemann).</p>
    <p><strong>Q2.</strong> On réduit au même dénominateur :</p>
    <div class="formula">$$\frac{(-1)^n}{n^\alpha + (-1)^n} - \frac{(-1)^n}{n^\alpha} = \frac{(-1)^n\big(n^\alpha - n^\alpha - (-1)^n\big)}{n^\alpha\big(n^\alpha + (-1)^n\big)} = -\frac{1}{n^\alpha\big(n^\alpha + (-1)^n\big)}.$$</div>
    <p><strong>Q3.</strong> La série \(\sum \frac{(-1)^n}{n^\alpha}\) converge pour tout \(\alpha \gt 0\) (séries alternées : \(\frac{1}{n^\alpha}\) décroît vers 0). Le second terme \(b_n = \frac{1}{n^\alpha(n^\alpha + (-1)^n)}\) est positif et équivalent à \(\frac{1}{n^{2\alpha}}\) : \(\sum b_n\) converge si et seulement si \(2\alpha \gt 1\). Comme \(u_n = \frac{(-1)^n}{n^\alpha} - b_n\) :</p>
    <ul>
      <li>si \(\alpha \gt \frac12\), \(\sum u_n\) est la différence de deux séries convergentes : elle converge ;</li>
      <li>si \(\alpha \leq \frac12\), c'est la différence d'une série convergente et d'une série divergente : elle diverge.</li>
    </ul>
    <p>Bilan : absolument convergente pour \(\alpha \gt 1\), semi-convergente pour \(\frac12 \lt \alpha \leq 1\), divergente pour \(0 \lt \alpha \leq \frac12\).</p>
    <p><strong>Q4.</strong> Les termes alternent bien de signe, mais \(|u_n| = \frac{1}{n^\alpha + (-1)^n}\) ne décroît pas : pour \(n\) pair, \(|u_n| = \frac{1}{n^\alpha + 1}\), et pour \(n + 1\) impair, \(|u_{n+1}| = \frac{1}{(n+1)^\alpha - 1}\), qui est plus grand dès que \((n+1)^\alpha - n^\alpha \lt 2\). Pour \(\alpha \leq 1\) (le cas où la question se pose), c'est vrai pour tout \(n\) : par les accroissements finis, \((n+1)^\alpha - n^\alpha = \alpha c^{\alpha - 1} \leq \alpha \leq 1\) pour un \(c \in\ ]n, n+1[\). L'équivalent \(u_n \sim \frac{(-1)^n}{n^\alpha}\) ne suffit pas non plus : le signe varie.</p>
  </div>
</div>
<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Une somme calculée par une intégrale</h3>
  <div class="statement">Calculer \(\displaystyle\sum_{n\ge1} \frac{1}{n}\Big(\frac12\Big)^n\), en intégrant sur \(\left[0, \frac12\right]\) une somme géométrique finie (comme pour la série harmonique alternée du cours).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p>La série converge (\(\frac{1}{n2^n} \leq \frac{1}{2^n}\)). Pour \(t \in \left[0, \frac12\right]\) et \(n \geq 1\), la somme géométrique finie donne \(\dfrac{1}{1-t} = \displaystyle\sum_{k=0}^{n-1} t^k + \dfrac{t^n}{1-t}\). On intègre sur \(\left[0, \frac12\right]\) :</p>
  <div class="formula">$$\ln 2 = \sum_{k=1}^{n}\frac{1}{k\,2^k} + \int_0^{1/2}\frac{t^n}{1-t}\,\mathrm{d}t.$$</div>
  <p>Sur \(\left[0, \frac12\right]\), \(\frac{1}{1-t} \leq 2\), donc l'intégrale est comprise entre 0 et \(2\displaystyle\int_0^{1/2} t^n\,\mathrm{d}t = \frac{1}{(n+1)2^n}\), qui tend vers 0. Ainsi \(\displaystyle\sum_{n\ge1}\frac{1}{n\,2^n} = \ln 2\). (Le chapitre « Séries entières » retrouve ce résultat en évaluant \(-\ln(1-x) = \sum_{n \geq 1}\frac{x^n}{n}\) en \(x = \frac12\).)</p></div>
</div>
<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>La série de Leibniz et ses restes</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : série alternée, reste, représentation intégrale, développement asymptotique).</div>
  <div class="statement">On considère la série \(\displaystyle\sum_{n \geq 0}\frac{(-1)^n}{2n+1}\), ses sommes partielles \(S_n = \displaystyle\sum_{k=0}^{n}\frac{(-1)^k}{2k+1}\) et, pour tout \(n \in \mathbb{N}\), l'intégrale \(I_n = \displaystyle\int_0^1 \frac{t^{2n+2}}{1+t^2}\,\mathrm{d}t\).</div>
  <div class="exo-part"><strong>Partie A — Convergence et somme.</strong></div>
  <div class="q"><strong>A1.</strong> Justifier la convergence de la série, et donner un encadrement de sa somme \(S\) par \(S_0\) et \(S_1\).</div>
  <div class="q"><strong>A2.</strong> Montrer que, pour \(t \in [0, 1]\), \(\dfrac{1}{1+t^2} = \displaystyle\sum_{k=0}^{n}(-1)^k t^{2k} + (-1)^{n+1}\frac{t^{2n+2}}{1+t^2}\). En déduire que \(\dfrac\pi4 = S_n + (-1)^{n+1}I_n\), puis que \(S = \dfrac\pi4\).</div>
  <div class="exo-part"><strong>Partie B — Le reste.</strong></div>
  <div class="q"><strong>B1.</strong> On note \(R_n = S - S_n\). Exprimer \(R_n\) à l'aide de \(I_n\), et retrouver le signe du reste et la majoration \(|R_n| \leq \frac{1}{2n+3}\) du théorème des séries alternées.</div>
  <div class="q"><strong>B2.</strong> Par une intégration par parties, montrer que \(I_n = \dfrac{1}{2(2n+3)} + \dfrac{2}{2n+3}\displaystyle\int_0^1 \frac{t^{2n+4}}{(1+t^2)^2}\,\mathrm{d}t\), puis que \(I_n = \dfrac{1}{4n} + O\!\left(\dfrac{1}{n^2}\right)\).</div>
  <div class="q"><strong>B3.</strong> Combien de termes faut-il sommer pour approcher \(\frac\pi4\) à \(10^{-4}\) près ? Comparer à ce que donne la majoration du théorème des séries alternées.</div>
  <div class="exo-part"><strong>Partie C — La série des restes.</strong></div>
  <div class="q"><strong>C1.</strong> Déduire de B2 que la série \(\sum R_n\) converge. Converge-t-elle absolument ?</div>
  <div class="q"><strong>C2.</strong> Montrer que \(\displaystyle\sum_{n=0}^{N} R_n = -\int_0^1 \frac{t^2\big(1 - (-t^2)^{N+1}\big)}{(1+t^2)^2}\,\mathrm{d}t\), puis que \(\displaystyle\sum_{n=0}^{+\infty} R_n = \frac14 - \frac\pi8\). (On pourra calculer \(\int_0^1 \frac{t^2}{(1+t^2)^2}\,\mathrm{d}t\) par parties, en écrivant \(\frac{t^2}{(1+t^2)^2} = t \cdot \frac{t}{(1+t^2)^2}\).)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(a_n = \frac{1}{2n+1}\) est positive, décroissante et tend vers 0 : le théorème des séries alternées donne la convergence et \(S_1 \leq S \leq S_0\), soit \(\frac23 \leq S \leq 1\).</p>
    <p><strong>A2.</strong> Somme géométrique finie de raison \(-t^2 \neq 1\) : \(\sum_{k=0}^{n}(-t^2)^k = \frac{1 - (-t^2)^{n+1}}{1 + t^2}\), d'où l'égalité. On l'intègre sur \([0, 1]\), avec \(\int_0^1 \frac{\mathrm{d}t}{1+t^2} = \arctan 1 = \frac\pi4\) et \(\int_0^1 t^{2k}\,\mathrm{d}t = \frac{1}{2k+1}\) : \(\frac\pi4 = S_n + (-1)^{n+1}I_n\). Comme \(0 \leq I_n \leq \int_0^1 t^{2n+2}\,\mathrm{d}t = \frac{1}{2n+3}\), \(I_n \to 0\) et \(S_n \to \frac\pi4\) : \(S = \frac\pi4\).</p>
    <p><strong>B1.</strong> \(R_n = \frac\pi4 - S_n = (-1)^{n+1}I_n\). Comme \(I_n \gt 0\), le reste a le signe de \((-1)^{n+1}\), celui de son premier terme \(\frac{(-1)^{n+1}}{2n+3}\), et \(|R_n| = I_n \leq \frac{1}{2n+3}\) : c'est exactement ce qu'annonce le théorème des séries alternées.</p>
    <p><strong>B2.</strong> On écrit \(\frac{t^{2n+2}}{1+t^2} = t^{2n+2}\cdot\frac{1}{1+t^2}\) et l'on intègre \(t^{2n+2}\) en \(\frac{t^{2n+3}}{2n+3}\), en dérivant \(\frac{1}{1+t^2}\) en \(-\frac{2t}{(1+t^2)^2}\) :</p>
    <div class="formula">$$I_n = \left[\frac{t^{2n+3}}{(2n+3)(1+t^2)}\right]_0^1 + \frac{2}{2n+3}\int_0^1 \frac{t^{2n+4}}{(1+t^2)^2}\,\mathrm{d}t.$$</div>
    <p>Le crochet vaut \(\frac{1}{2(2n+3)}\). L'intégrale restante est comprise entre 0 et \(\int_0^1 t^{2n+4}\,\mathrm{d}t = \frac{1}{2n+5}\) : le second terme est un \(O\!\left(\frac{1}{n^2}\right)\). Enfin \(\frac{1}{2(2n+3)} = \frac{1}{4n}\cdot\frac{1}{1 + \frac{3}{2n}} = \frac{1}{4n} + O\!\left(\frac{1}{n^2}\right)\). D'où \(I_n = \frac{1}{4n} + O\!\left(\frac{1}{n^2}\right)\), et \(|R_n| \sim \frac{1}{4n}\).</p>
    <p><strong>B3.</strong> D'après B2, \(\frac{1}{2(2n+3)} \leq I_n \leq \frac{1}{2(2n+3)} + \frac{2}{(2n+3)(2n+5)}\). Il faut donc au moins \(2(2n+3) \geq 10^4\), soit \(n \geq 2\,499\) (2 500 termes, de \(k = 0\) à \(n\)) ; la borne de droite garantit la précision dès \(n = 2\,501\), et un calcul numérique montre que \(n = 2\,499\) suffit déjà (\(I_{2499} \approx 0{,}999\,999\,996 \times 10^{-4}\)). La majoration \(|R_n| \leq \frac{1}{2n+3}\) du théorème des séries alternées demanderait \(n \geq 4\,999\) : elle est pessimiste d'un facteur 2. Dans les deux cas, la convergence est lente (erreur en \(\frac{1}{4n}\)).</p>
    <p><strong>C1.</strong> \(R_n = (-1)^{n+1}I_n = \frac{(-1)^{n+1}}{4n} + O\!\left(\frac{1}{n^2}\right)\) pour \(n \geq 1\). La série \(\sum \frac{(-1)^{n+1}}{4n}\) converge (séries alternées) et le reste \(O\!\left(\frac{1}{n^2}\right)\) donne une série absolument convergente : \(\sum R_n\) converge. Elle ne converge pas absolument, car \(|R_n| \sim \frac{1}{4n}\).</p>
    <p><strong>C2.</strong> Par linéarité de l'intégrale, \(\sum_{n=0}^{N} R_n = \int_0^1 \frac{1}{1+t^2}\sum_{n=0}^{N}(-1)^{n+1}t^{2n+2}\,\mathrm{d}t\), et la somme géométrique finie donne</p>
    <div class="formula">$$\sum_{n=0}^{N}(-1)^{n+1}t^{2n+2} = -t^2\sum_{n=0}^{N}(-t^2)^n = -\frac{t^2\left(1 - (-t^2)^{N+1}\right)}{1+t^2},$$</div>
    <p>d'où la formule annoncée. Le terme en \((-t^2)^{N+1}\) contribue au plus \(\int_0^1 t^{2N+4}\,\mathrm{d}t = \frac{1}{2N+5}\), qui tend vers 0. Donc \(\sum_{n=0}^{+\infty}R_n = -\int_0^1 \frac{t^2}{(1+t^2)^2}\,\mathrm{d}t\). Par parties, en intégrant \(\frac{t}{(1+t^2)^2}\) en \(-\frac{1}{2(1+t^2)}\) :</p>
    <div class="formula">$$\int_0^1 \frac{t^2}{(1+t^2)^2}\,\mathrm{d}t = \left[-\frac{t}{2(1+t^2)}\right]_0^1 + \frac12\int_0^1\frac{\mathrm{d}t}{1+t^2} = -\frac14 + \frac\pi8.$$</div>
    <p>Finalement \(\sum_{n=0}^{+\infty} R_n = \frac14 - \frac\pi8 \approx -0{,}1427\).</p>
  </div>
</div>
