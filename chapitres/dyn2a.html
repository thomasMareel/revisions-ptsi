<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Inertie d'un marteau de menuisier</h3>
  <div class="statement">Un marteau est modélisé par deux solides homogènes. Le <strong>manche</strong> est une tige mince de masse \(m_1 = 0{,}30\ \text{kg}\) et de longueur \(L = 0{,}30\ \text{m}\), portée par l'axe \((O,\vec x)\) entre \(x = 0\) (extrémité tenue en main) et \(x = L\). La <strong>tête</strong> est un cylindre plein de masse \(m_2 = 0{,}60\ \text{kg}\), de rayon \(R = 15\ \text{mm}\) et de longueur \(\ell = 100\ \text{mm}\), d'axe parallèle à \(\vec y\), de centre \(H\) tel que \(\overrightarrow{OH} = (L+R)\,\vec x\). Le mouvement de frappe est une rotation autour de l'axe \((O,\vec z)\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la position du centre d'inertie \(G\) du marteau.</div>
  <div class="q"><strong>Q2.</strong> Justifier la forme de la matrice d'inertie du marteau en \(O\) dans la base \((\vec x,\vec y,\vec z)\). Est-elle la même en \(G\) ?</div>
  <div class="q"><strong>Q3.</strong> Calculer le moment d'inertie \(C_O\) par rapport à l'axe de frappe \((O,\vec z)\). Quelle erreur commet-on en assimilant la tête à un point matériel placé en \(H\) ?</div>
  <div class="q"><strong>Q4.</strong> En déduire le rayon de giration autour de \((O,\vec z)\), puis le moment d'inertie \(C_G\) autour de l'axe parallèle passant par \(G\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les deux centres d'inertie sont sur \((O,\vec x)\) : \(G_1\) en \(x = L/2\), \(H\) en \(x = L + R\). Donc \(y_G = z_G = 0\) et</p>
    <div class="formula">$$x_G = \frac{m_1\frac{L}{2} + m_2(L+R)}{m_1+m_2} = \frac{0{,}30\times0{,}15 + 0{,}60\times0{,}315}{0{,}90} = 0{,}260\ \text{m}$$</div>
    <p>\(G\) est à 26 cm de la main, dans le manche, tout près de la tête.</p>
    <p><strong>Q2.</strong> Le plan \((O,\vec x,\vec y)\) est plan de symétrie matérielle (tige sur l'axe, cylindre symétrique par \(z\mapsto -z\)) : \(D = E = 0\). Le plan \((O,\vec z,\vec x)\) l'est aussi (cylindre centré en \(y = 0\)) : \(D = F = 0\). La matrice en \(O\) est donc diagonale, \(\mathrm{diag}(A_O, B_O, C_O)\). \(G\) appartenant aux deux plans, la matrice en \(G\) est aussi diagonale dans la même base (avec d'autres valeurs).</p>
    <p><strong>Q3.</strong> Manche autour d'une extrémité : \(m_1L^2/3 = 9{,}0\cdot10^{-3}\ \text{kg·m}^2\). Tête : l'axe \((H,\vec z)\) est perpendiculaire à l'axe du cylindre, d'où \(m_2(R^2/4 + \ell^2/12) = 5{,}34\cdot10^{-4}\ \text{kg·m}^2\), puis Huygens : \(m_2(L+R)^2 = 5{,}95\cdot10^{-2}\ \text{kg·m}^2\).</p>
    <div class="formula">$$C_O = 9{,}0\cdot10^{-3} + 5{,}34\cdot10^{-4} + 5{,}954\cdot10^{-2} \approx 6{,}91\cdot10^{-2}\ \text{kg·m}^2$$</div>
    <p>Le modèle « point matériel » oublie seulement \(5{,}34\cdot10^{-4}\), soit environ 0,8 % du total : excellente approximation, parce que la tête est petite devant sa distance à l'axe.</p>
    <p><strong>Q4.</strong> Rayon de giration et Huygens depuis \(G\) :</p>
    <div class="formula">$$k = \sqrt{\frac{C_O}{m_1+m_2}} = \sqrt{\frac{0{,}0691}{0{,}90}} \approx 0{,}277\ \text{m}$$
$$C_G = C_O - (m_1+m_2)\,x_G^2 = 0{,}0691 - 0{,}90\times0{,}260^2 \approx 8{,}2\cdot10^{-3}\ \text{kg·m}^2$$</div>
    <p>\(C_G\) est environ 8 fois plus petit que \(C_O\) : un marteau tenu près de la tête (au voisinage de \(G\)) est bien plus facile à manier, mais frappe beaucoup moins fort.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Plaque triangulaire : symétries, Huygens et axes principaux</h3>
  <div class="statement">Une plaque mince homogène, de masse \(m\), a la forme du triangle rectangle de sommets \(O(0,0)\), \((a,0)\) et \((0,b)\) dans le plan \((O,\vec x,\vec y)\). Son centre d'inertie est \(G(a/3,\ b/3,\ 0)\). Le calcul intégral des éléments d'inertie n'étant pas exigible, on donne (valeurs fournies par un modeleur 3D, ou obtenues par intégration à la question Q5) les éléments en \(O\), dans la base \((\vec x,\vec y,\vec z)\) :</div>
  <div class="formula">$$A_O = \frac{m b^2}{6} \qquad B_O = \frac{m a^2}{6} \qquad F_O = \int_S x y\,dm = \frac{m a b}{12}$$</div>
  <div class="q"><strong>Q1.</strong> Que peut-on dire a priori de \(D_O\), \(E_O\) et \(C_O\) ? Écrire la matrice \([I(O,S)]\). Le signe de \(F_O\) était-il prévisible ?</div>
  <div class="q"><strong>Q2.</strong> En déduire, par le théorème de Huygens, la matrice d'inertie en \(G\) dans la même base.</div>
  <div class="q"><strong>Q3.</strong> Cas \(a = b\) : déterminer les axes et moments principaux d'inertie en \(G\). Interpréter à l'aide d'une symétrie.</div>
  <div class="q"><strong>Q4.</strong> Toujours pour \(a = b\), calculer le moment d'inertie autour de l'axe \((O,\vec u)\), avec \(\vec u = (\vec x + \vec y)/\sqrt2\), à partir de \([I(O,S)]\). Pourquoi retrouve-t-on l'un des moments principaux de Q3 ?</div>
  <div class="q"><strong>Q5 (hors programme, pour aller plus loin).</strong> Retrouver \(B_O\) et \(F_O\) par intégration.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Plaque dans le plan \(z = 0\) : \(D = \int yz\,dm = 0\), \(E = \int zx\,dm = 0\) et \(C = \int(x^2+y^2)\,dm = A + B\). Le plan \((O,\vec x,\vec y)\) de la plaque est plan de symétrie : \(\vec z\) est principal. Aucun autre plan de symétrie ne contient \(\vec z\) : \(F\) n'a aucune raison d'être nul. Il est même positif, car toute la matière est dans le quart de plan \(x \geq 0\), \(y \geq 0\), où \(xy \geq 0\).</p>
    <div class="formula">$$[I(O,S)] = \frac{m}{12}\begin{bmatrix} 2b^2 & -ab & 0 \\ -ab & 2a^2 & 0 \\ 0 & 0 & 2(a^2+b^2) \end{bmatrix}_{(\vec x,\vec y,\vec z)}$$</div>
    <p><strong>Q2.</strong> Huygens relie \(O\) au centre d'inertie, avec \(\overrightarrow{OG} = \frac a3\vec x + \frac b3\vec y\) : on retranche les termes de la masse concentrée en \(G\). \(A_G = \frac{mb^2}{6} - \frac{mb^2}{9} = \frac{mb^2}{18}\), \(B_G = \frac{ma^2}{18}\), \(C_G = \frac{m(a^2+b^2)}{18}\) et \(F_G = F_O - m\frac{a}{3}\frac{b}{3} = \frac{mab}{12} - \frac{mab}{9} = -\frac{mab}{36}\).</p>
    <div class="formula">$$[I(G,S)] = \frac{m}{36}\begin{bmatrix} 2b^2 & ab & 0 \\ ab & 2a^2 & 0 \\ 0 & 0 & 2(a^2+b^2) \end{bmatrix}_{(\vec x,\vec y,\vec z)}$$</div>
    <p>Le produit d'inertie a changé de signe entre \(O\) et \(G\) : autour de \(G\), la matière située dans les quadrants où \(x - x_G\) et \(y - y_G\) sont de signes opposés (vers les sommets \((a,0)\) et \((0,b)\)) l'emporte.</p>
    <p><strong>Q3.</strong> Pour \(a = b\), le bloc \(\frac{ma^2}{36}\begin{bmatrix} 2 & 1 \\ 1 & 2\end{bmatrix}\) a pour valeurs propres \(3\) et \(1\) (vecteurs \((1,1)\) et \((1,-1)\)). Axes principaux en \(G\) : \(\vec u = \frac{\vec x+\vec y}{\sqrt2}\) avec \(\frac{ma^2}{12}\), \(\vec v = \frac{\vec x-\vec y}{\sqrt2}\) avec \(\frac{ma^2}{36}\), et \(\vec z\) avec \(\frac{ma^2}{9}\) (on vérifie \(\frac{1}{12}+\frac{1}{36} = \frac19\), relation des plaques). Interprétation : le triangle isocèle est symétrique par rapport à la médiane issue de \(O\), de direction \(\vec u\) ; le plan \((G,\vec u,\vec z)\) est plan de symétrie, donc \(\vec v\), qui lui est normal, est principal, et \(\vec u\) aussi. La forme diagonale de la matrice dans la base \((\vec u, \vec v, \vec z)\) se lisait donc sans calcul.</p>
    <p><strong>Q4.</strong> Avec \(\{u\} = (1, 1, 0)/\sqrt2\) :</p>
    <div class="formula">$$I_{(O,\vec u)} = \{u\}^T[I(O,S)]\{u\} = \frac{m}{12}\cdot\frac{2a^2 + 2a^2 - 2a^2}{2} = \frac{ma^2}{12}$$</div>
    <p>L'axe \((O,\vec u)\) est la médiane issue de \(O\) : il passe par \(G\) (\(x_G = y_G\)) et il est porté par l'axe principal \(\vec u\). Le terme de Huygens est nul (distance de \(G\) à l'axe nulle) : \(I_{(O,\vec u)} = I_{(G,\vec u)} = \frac{ma^2}{12}\), ce qui contrôle les deux calculs.</p>
    <p><strong>Q5.</strong> Masse surfacique \(\mu = 2m/(ab)\), \(dm = \mu\,dx\,dy\) avec \(0 \le x \le a\) et \(0 \le y \le b(1 - x/a)\).</p>
    <div class="formula">$$B_O = \int x^2\,dm = \mu\int_0^a x^2\, b\left(1-\frac{x}{a}\right)dx = \mu\,b\left(\frac{a^3}{3}-\frac{a^3}{4}\right) = \frac{m a^2}{6}$$</div>
    <div class="formula">$$F_O = \int x y\,dm = \mu\int_0^a x\,\frac{b^2}{2}\left(1-\frac{x}{a}\right)^2 dx = \mu\,\frac{b^2}{2}\cdot\frac{a^2}{12} = \frac{m a b}{12}$$</div>
    <p>Par échange des rôles de \(x\) et \(y\) : \(A_O = mb^2/6\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Bras télescopique d'un robot de palettisation</h3>
  <div class="statement">Le bâti \(0\) (repère \(\mathcal R_0 = (O,\vec x_0,\vec y_0,\vec z_0)\) galiléen, \(\vec z_0\) vertical) porte un bras \(1\) en liaison pivot d'axe \((O,\vec z_0)\), d'angle \(\theta = (\vec x_0,\vec x_1)\) ; \(C_1\) est son moment d'inertie autour de \((O,\vec z_0)\). Un coulisseau \(2\), de masse \(m_2\), est en liaison glissière de direction \(\vec x_1\) avec \(1\) : \(\overrightarrow{OG_2} = r(t)\,\vec x_1\) ; sa matrice en \(G_2\) est diagonale dans la base \(1\), de troisième terme \(C_2\). Un moteur exerce le couple \(C_m\,\vec z_0\) sur \(1\), un actionneur linéaire la force \(F\,\vec x_1\) de \(1\) sur \(2\). Liaisons parfaites ; le mouvement a lieu dans un plan horizontal.<br>Données : \(C_1 = 0{,}80\ \text{kg·m}^2\), \(C_2 = 0{,}05\ \text{kg·m}^2\), \(m_2 = 4{,}0\ \text{kg}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer l'énergie cinétique de l'ensemble \(\{1,2\}\) dans son mouvement par rapport à \(0\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\vec\sigma(O,\{1,2\}/0)\cdot\vec z_0\).</div>
  <div class="q"><strong>Q3.</strong> Proposer, en les justifiant, l'isolement et l'équation qui donnent \(C_m\) d'une part, \(F\) d'autre part, sans faire intervenir d'inconnue de liaison. Établir ces deux relations.</div>
  <div class="q"><strong>Q4.</strong> Le bras tourne à \(\dot\theta = 2{,}0\ \text{rad·s}^{-1}\) constant pendant que le coulisseau rentre à \(\dot r = -0{,}50\ \text{m·s}^{-1}\) constant. Calculer \(C_m\) et \(F\) pour \(r = 0{,}60\ \text{m}\) et interpréter leurs signes.</div>
  <div class="q"><strong>Q5.</strong> Moteur débrayé (\(C_m = 0\)) : le bras tourne à \(2{,}0\ \text{rad·s}^{-1}\) quand \(r = 0{,}90\ \text{m}\). Quelle est sa vitesse quand le coulisseau atteint \(r = 0{,}30\ \text{m}\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Bras en rotation autour d'un axe fixe : \(E_c(1/0) = \frac12 C_1\dot\theta^2\). Coulisseau, König en \(G_2\) avec \(\vec V(G_2/0) = \dot r\,\vec x_1 + r\dot\theta\,\vec y_1\) et \(\vec\Omega(2/0) = \dot\theta\,\vec z_0\) : \(E_c(2/0) = \frac12 m_2(\dot r^2 + r^2\dot\theta^2) + \frac12 C_2\dot\theta^2\). Au total :</p>
    <div class="formula">$$E_c(\{1,2\}/0) = \frac12\left(C_1 + C_2 + m_2 r^2\right)\dot\theta^2 + \frac12 m_2\dot r^2$$</div>
    <p><strong>Q2.</strong> \(O\) est un point fixe de \(1\) : \(\vec\sigma(O,1/0)\cdot\vec z_0 = C_1\dot\theta\). Pour \(2\), \(\vec\sigma(G_2,2/0) = C_2\dot\theta\,\vec z_0\), puis transport :</p>
    <div class="formula">$$\vec\sigma(O,2/0) = \vec\sigma(G_2,2/0) + \overrightarrow{OG_2}\wedge m_2\vec V(G_2/0)$$</div>
    <p>avec :</p>
    <div class="formula">$$r\,\vec x_1\wedge m_2(\dot r\,\vec x_1 + r\dot\theta\,\vec y_1) = m_2 r^2\dot\theta\,\vec z_0$$</div>
    <p>D'où \(\vec\sigma(O,\{1,2\}/0)\cdot\vec z_0 = (C_1 + C_2 + m_2 r^2)\,\dot\theta\).</p>
    <p><strong>Q3.</strong> <em>Couple</em> : isoler \(\{1,2\}\) (la force \(F\) devient intérieure) et écrire le TMD en \(O\) projeté sur \(\vec z_0\) : la pivot parfaite n'a pas de moment selon son axe, le poids est parallèle à \(\vec z_0\). \(O\) et \(\vec z_0\) étant fixes, \(\vec\delta(O)\cdot\vec z_0 = \frac{d}{dt}(\vec\sigma(O)\cdot\vec z_0)\) :</p>
    <div class="formula">$$C_m = \left(C_1 + C_2 + m_2 r^2\right)\ddot\theta + 2\,m_2\,r\,\dot r\,\dot\theta$$</div>
    <p><em>Force</em> : isoler \(2\), TRD projeté sur \(\vec x_1\) (la glissière parfaite ne transmet rien selon \(\vec x_1\), le poids est vertical). Avec</p>
    <div class="formula">$$\vec\Gamma(G_2/0) = (\ddot r - r\dot\theta^2)\,\vec x_1 + (r\ddot\theta + 2\dot r\dot\theta)\,\vec y_1$$</div>
    <p>on obtient :</p>
    <div class="formula">$$F = m_2\left(\ddot r - r\,\dot\theta^2\right)$$</div>
    <p><strong>Q4.</strong> \(\ddot\theta = 0\) et \(\ddot r = 0\) :</p>
    <div class="formula">$$C_m = 2\times4{,}0\times0{,}60\times(-0{,}50)\times2{,}0 = -4{,}8\ \text{N·m}$$</div>
    <p>Le moteur doit <em>freiner</em>, sinon la rotation s'accélérerait quand la masse se rapproche de l'axe (terme de Coriolis). \(F = 4{,}0\times(0 - 0{,}60\times4{,}0) = -9{,}6\ \text{N}\) : l'actionneur tire le coulisseau vers l'axe ; c'est la force centripète nécessaire à sa trajectoire.</p>
    <p><strong>Q5.</strong> Avec \(C_m = 0\), \((C_1+C_2+m_2r^2)\dot\theta\) se conserve : \(J(0{,}90) = 0{,}85 + 4{,}0\times0{,}81 = 4{,}09\ \text{kg·m}^2\), \(J(0{,}30) = 0{,}85 + 0{,}36 = 1{,}21\ \text{kg·m}^2\), d'où \(\dot\theta = 2{,}0\times4{,}09/1{,}21 \approx 6{,}8\ \text{rad·s}^{-1}\). C'est l'effet « patineuse qui ramène les bras ».</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Disque calé de travers sur son arbre</h3>
  <div class="statement">Un arbre vertical, de masse négligeable, tourne à vitesse constante \(\omega\) autour de l'axe fixe \((O,\vec z_0)\) ; \((\vec x_1,\vec y_1,\vec z_0)\) est une base liée à l'arbre. Il porte un disque mince homogène (masse \(m\), rayon \(R\), centre \(O\)) monté avec un défaut : sa normale \(\vec z_2\) est obtenue par rotation d'angle constant \(\alpha\) autour de \(\vec x_1 = \vec x_2\), soit \(\vec y_2 = \cos\alpha\,\vec y_1 + \sin\alpha\,\vec z_0\) et \(\vec z_2 = -\sin\alpha\,\vec y_1 + \cos\alpha\,\vec z_0\). L'arbre est guidé par deux paliers en \(P\) et \(Q\), avec \(\overrightarrow{OP} = d\,\vec z_0\) et \(\overrightarrow{OQ} = -d\,\vec z_0\), modélisés par des liaisons linéaires annulaires d'axe \(\vec z_0\) ; une butée reprend le poids.<br>Données : \(m = 4{,}0\ \text{kg}\), \(R = 0{,}15\ \text{m}\), \(\alpha = 1{,}0°\), \(N = 3\,000\ \text{tr/min}\), \(d = 0{,}10\ \text{m}\).</div>
  <div class="q"><strong>Q1.</strong> Donner la matrice d'inertie du disque en \(O\) dans la base \(2\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que, dans la base \(1\), \(E = F = 0\), et calculer le produit d'inertie \(D\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(\vec\sigma(O,\text{disque}/0)\) puis \(\vec\delta(O,\text{disque}/0)\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer les actions radiales des paliers. Application numérique ; comparer au poids du disque.</div>
  <div class="q"><strong>Q5.</strong> Pour corriger le défaut, on fixe deux masselottes identiques \(\mu\), assimilées à des points, en \((y,z) = (\rho,-e)\) et \((-\rho, e)\) dans le plan \((O,\vec y_1,\vec z_0)\), avec \(\rho = 0{,}12\ \text{m}\) et \(e = 0{,}05\ \text{m}\). Montrer que l'équilibrage statique est conservé et calculer \(\mu\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Axe de révolution \((O,\vec z_2)\) : \([I(O)]_2 = \mathrm{diag}(A, A, C)\) avec \(A = mR^2/4\) (diamètre) et \(C = mR^2/2\) (normale).</p>
    <p><strong>Q2.</strong> Le plan \((O,\vec y_1,\vec z_0)\) contient \(\vec y_2\) et \(\vec z_2\) : la symétrie \(x\mapsto -x\) conserve le disque, donc les produits contenant \(x\) sont nuls : \(E = F = 0\). Un point du disque s'écrit \(u\,\vec x_2 + v\,\vec y_2\), donc \(y = v\cos\alpha\), \(z = v\sin\alpha\) et</p>
    <div class="formula">$$D = \int yz\,dm = \sin\alpha\cos\alpha\int v^2\,dm = \frac{mR^2}{4}\sin\alpha\cos\alpha$$</div>
    <p>(\(\int v^2\,dm\) est le moment d'inertie autour du diamètre porté par \(\vec x_2\), soit \(mR^2/4\).) Numériquement \(D = 0{,}0225\times0{,}01745 = 3{,}93\cdot10^{-4}\ \text{kg·m}^2\).</p>
    <p><strong>Q3.</strong> \(O\) est fixe et lié au disque, \(\vec\Omega = \omega\,\vec z_0\). Dans la base \(1\) : \(\vec\sigma(O) = \omega(-E\,\vec x_1 - D\,\vec y_1 + C'\,\vec z_0)\) avec \(C' = A\sin^2\alpha + C\cos^2\alpha\), soit \(\vec\sigma(O) = \omega(-D\,\vec y_1 + C'\,\vec z_0)\). En dérivant, \(\omega\) constant et \(\frac{d\vec y_1}{dt} = -\omega\,\vec x_1\) :</p>
    <div class="formula">$$\vec\delta(O,\text{disque}/0) = D\,\omega^2\,\vec x_1 = \frac{mR^2}{4}\sin\alpha\cos\alpha\;\omega^2\,\vec x_1$$</div>
    <p>Ce moment est perpendiculaire à l'axe et tourne avec l'arbre.</p>
    <p><strong>Q4.</strong> Actions radiales \(\vec F_P = X_P\vec x_1 + Y_P\vec y_1\) et \(\vec F_Q = X_Q\vec x_1 + Y_Q\vec y_1\). TRD transverse : \(G = O\) est fixe, donc \(X_P + X_Q = 0\) et \(Y_P + Y_Q = 0\). TMD en \(O\) :</p>
    <div class="formula">$$d\,\vec z_0\wedge\vec F_P - d\,\vec z_0\wedge\vec F_Q = d(X_P - X_Q)\,\vec y_1 - d(Y_P - Y_Q)\,\vec x_1 = D\omega^2\,\vec x_1$$</div>
    <p>D'où \(X_P = X_Q = 0\) et</p>
    <div class="formula">$$Y_Q = -Y_P = \frac{D\,\omega^2}{2d}$$</div>
    <p>Avec \(\omega = 314\ \text{rad·s}^{-1}\) : \(D\omega^2 \approx 38{,}8\ \text{N·m}\) et \(|Y_P| = |Y_Q| \approx 194\ \text{N}\), environ cinq fois le poids du disque (39 N), pour un défaut de calage de seulement 1°. Ces efforts tournent à 50 Hz dans le bâti.</p>
    <p><strong>Q5.</strong> Les deux masselottes sont symétriques par rapport à \(O\) : leur centre d'inertie commun est \(O\), donc \(G\) reste sur l'axe. Leur produit d'inertie vaut \(\mu(\rho\cdot(-e) + (-\rho)\cdot e) = -2\mu\rho e\). L'axe devient principal si \(D - 2\mu\rho e = 0\) :</p>
    <div class="formula">$$\mu = \frac{D}{2\rho e} = \frac{3{,}93\cdot10^{-4}}{2\times0{,}12\times0{,}05} \approx 33\ \text{g}$$</div>
    <p>Il faut deux masses dans deux plans différents : une seule masse déplacerait \(G\) hors de l'axe.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Tourelle de caméra orientable à deux axes</h3>
  <div class="statement">Une caméra de surveillance est orientée par deux moteurs. Le bâti \(0\) est fixe (repère \(\mathcal R_0\) galiléen, \(\vec z_0\) vertical). La tourelle \(1\) tourne autour de \((O,\vec z_0)\) : \(\psi = (\vec x_0,\vec x_1)\), moment d'inertie \(J_1\) autour de cet axe. La caméra \(2\) tourne par rapport à \(1\) autour de \((O,\vec x_1)\) : \(\theta = (\vec y_1,\vec y_2) = (\vec z_1,\vec z_2)\), avec \(\vec z_1 = \vec z_0\). Son centre d'inertie est en \(O\), à l'intersection des deux axes, et sa matrice d'inertie en \(O\) est \(\mathrm{diag}(A_2, B_2, C_2)\) dans la base \(2\). Moteurs : couple \(C_\psi\,\vec z_0\) de \(0\) sur \(1\), couple \(C_\theta\,\vec x_1\) de \(1\) sur \(2\). Liaisons parfaites.<br>Données : \(J_1 = 0{,}050\), \(A_2 = 0{,}012\), \(B_2 = 0{,}020\), \(C_2 = 0{,}008\) (en \(\text{kg·m}^2\)).</div>
  <div class="q"><strong>Q1.</strong> Exprimer \(\vec\Omega(2/0)\) dans la base \(2\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\vec\sigma(O,2/0)\). Pourquoi la formule \(\vec\sigma = \overline{\overline{I}}\,\vec\Omega\) est-elle applicable ?</div>
  <div class="q"><strong>Q3.</strong> Calculer l'énergie cinétique \(E_c(\{1,2\}/0)\).</div>
  <div class="q"><strong>Q4.</strong> Quel isolement et quelle équation donnent \(C_\theta\) ? Montrer que \(C_\theta = A_2\ddot\theta + (C_2 - B_2)\,\dot\psi^2\sin\theta\cos\theta\).</div>
  <div class="q"><strong>Q5.</strong> Établir de même l'expression de \(C_\psi\).</div>
  <div class="q"><strong>Q6.</strong> Applications : (a) balayage à \(\dot\psi = 3{,}0\ \text{rad·s}^{-1}\) constant, caméra maintenue à \(\theta = 45°\) ; (b) même balayage, mais la caméra bascule à \(\dot\theta = 1{,}0\ \text{rad·s}^{-1}\) au passage de \(\theta = 45°\). Calculer les couples utiles et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec\Omega(2/0) = \dot\theta\,\vec x_1 + \dot\psi\,\vec z_0\). La figure de changement de base \(1\to2\) donne \(\vec z_0 = \vec z_1 = \sin\theta\,\vec y_2 + \cos\theta\,\vec z_2\), d'où</p>
    <div class="formula">$$\vec\Omega(2/0) = \dot\theta\,\vec x_2 + \dot\psi\sin\theta\,\vec y_2 + \dot\psi\cos\theta\,\vec z_2$$</div>
    <p><strong>Q2.</strong> \(O\) est un point de \(2\) (sur l'axe de la pivot \(1\)/\(2\)) fixe dans \(\mathcal R_0\) (sur l'axe \((O,\vec z_0)\)) ; c'est aussi \(G_2\). Donc \(\vec\sigma(O,2/0) = \overline{\overline{I}}(O,2)\,\vec\Omega(2/0)\), calculé dans la base \(2\) où la matrice est diagonale :</p>
    <div class="formula">$$\vec\sigma(O,2/0) = A_2\dot\theta\,\vec x_2 + B_2\dot\psi\sin\theta\,\vec y_2 + C_2\dot\psi\cos\theta\,\vec z_2$$</div>
    <p><strong>Q3.</strong> \(E_c(1/0) = \frac12 J_1\dot\psi^2\) ; pour \(2\), point fixe : \(2E_c = \vec\Omega\cdot\vec\sigma(O)\). Au total :</p>
    <div class="formula">$$E_c(\{1,2\}/0) = \frac12\left[J_1 + B_2\sin^2\theta + C_2\cos^2\theta\right]\dot\psi^2 + \frac12 A_2\dot\theta^2$$</div>
    <p><strong>Q4.</strong> Isoler \(2\) et écrire le TMD en \(O\) projeté sur \(\vec x_1\) : la pivot parfaite \(1\)/\(2\) n'a pas de moment sur \(\vec x_1\), et le poids passe par \(G_2 = O\). Donc \(C_\theta = \vec\delta(O,2/0)\cdot\vec x_1\). \(O\) est fixe, mais \(\vec x_1\) est mobile, avec \(\frac{d\vec x_1}{dt}\big|_0 = \dot\psi\,\vec y_1\) :</p>
    <div class="formula">$$\vec\delta(O)\cdot\vec x_1 = \frac{d}{dt}\left(\vec\sigma(O)\cdot\vec x_1\right) - \dot\psi\,\vec\sigma(O)\cdot\vec y_1$$</div>
    <p>Or \(\vec\sigma\cdot\vec x_1 = A_2\dot\theta\) et, avec \(\vec y_1 = \cos\theta\,\vec y_2 - \sin\theta\,\vec z_2\), \(\vec\sigma\cdot\vec y_1 = (B_2 - C_2)\,\dot\psi\sin\theta\cos\theta\). D'où \(C_\theta = A_2\ddot\theta + (C_2 - B_2)\,\dot\psi^2\sin\theta\cos\theta\).</p>
    <p><strong>Q5.</strong> Isoler \(\{1,2\}\) (\(C_\theta\) devient intérieur) ; TMD en \(O\) projeté sur \(\vec z_0\) : pivot \(0\)/\(1\) sans moment sur son axe, poids parallèle à \(\vec z_0\). \(O\) et \(\vec z_0\) étant fixes, \(C_\psi = \frac{d}{dt}\big(\vec\sigma(O,\{1,2\}/0)\cdot\vec z_0\big)\), avec</p>
    <div class="formula">$$\vec\sigma(O,2/0)\cdot\vec z_0 = (B_2\sin^2\theta + C_2\cos^2\theta)\,\dot\psi$$</div>
    <p>d'où :</p>
    <div class="formula">$$C_\psi = \left(J_1 + B_2\sin^2\theta + C_2\cos^2\theta\right)\ddot\psi + 2\,(B_2 - C_2)\,\dot\theta\,\dot\psi\sin\theta\cos\theta$$</div>
    <p><strong>Q6.</strong> (a) \(\ddot\theta = 0\), \(\ddot\psi = 0\), \(\dot\theta = 0\) : \(C_\psi = 0\) et</p>
    <div class="formula">$$C_\theta = (0{,}008 - 0{,}020)\times9{,}0\times0{,}5 = -0{,}054\ \text{N·m}$$</div>
    <p>Même à angle constant, le moteur de basculement doit fournir un couple : la rotation autour de \(\vec z_0\) tend à aligner l'axe de plus grande inertie (\(\vec y_2\), \(B_2\) maximal) avec l'axe de rotation, c'est-à-dire à faire croître \(\theta\) vers \(90°\). (b) Cette fois :</p>
    <div class="formula">$$C_\psi = 2\times0{,}012\times1{,}0\times3{,}0\times0{,}5 = 0{,}036\ \text{N·m}$$</div>
    <p>Bien que \(\dot\psi\) soit constant, le moteur de lacet travaille, car l'inertie de l'ensemble autour de \(\vec z_0\) varie avec \(\theta\) (même mécanisme qu'à l'exercice 03). Le couple de basculement, lui, ne dépend pas de \(\dot\theta\) : si le basculement se fait à \(\dot\theta\) constant (\(\ddot\theta = 0\)), \(C_\theta\) garde au passage de \(45°\) la valeur \(-0{,}054\ \text{N·m}\) trouvée en (a).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Pendule inversé sur chariot : équations du mouvement et linéarisation</h3>
  <div class="statement">Un chariot \(1\), de masse \(M\), se déplace sans frottement selon \(\vec x_0\) sur un rail horizontal lié au bâti \(0\) (galiléen, \(\vec y_0\) vertical ascendant) : \(\overrightarrow{OA} = x(t)\,\vec x_0\). Une tige homogène \(2\), de masse \(m\) et de longueur \(2\ell\), est articulée en \(A\) sur le chariot par une pivot parfaite d'axe \((A,\vec z_0)\) ; \(\theta = (\vec y_0,\vec y_1)\), \(\overrightarrow{AG} = \ell\,\vec y_1\) avec \(\vec y_1 = -\sin\theta\,\vec x_0 + \cos\theta\,\vec y_0\), et \(J_G = m(2\ell)^2/12 = m\ell^2/3\) son moment d'inertie autour de \((G,\vec z_0)\). Un moteur exerce sur le chariot la force horizontale \(F\,\vec x_0\).<br>Données : \(M = 8{,}0\ \text{kg}\), \(m = 2{,}0\ \text{kg}\), \(\ell = 0{,}50\ \text{m}\), \(g = 9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\vec\Gamma(G,2/0)\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\vec\delta(A,2/0)\cdot\vec z_0 = J_A\ddot\theta - m\ell\,\ddot x\cos\theta\), avec \(J_A = J_G + m\ell^2\). Pourquoi ne peut-on pas écrire \(\vec\delta(A) = \frac{d\vec\sigma(A)}{dt}\) ?</div>
  <div class="q"><strong>Q3.</strong> Appliquer le TMD à la tige, en \(A\), projeté sur \(\vec z_0\).</div>
  <div class="q"><strong>Q4.</strong> Appliquer le TRD à l'ensemble \(\{1,2\}\), projeté sur \(\vec x_0\). Justifier ces deux choix.</div>
  <div class="q"><strong>Q5.</strong> Vérifier que \(\theta = 0\), \(F = 0\) est une position d'équilibre et linéariser les deux équations autour d'elle.</div>
  <div class="q"><strong>Q6.</strong> En déduire la fonction de transfert \(\theta(p)/F(p)\), ses pôles et conclure sur la stabilité. Application numérique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overrightarrow{OG} = (x - \ell\sin\theta)\,\vec x_0 + \ell\cos\theta\,\vec y_0\). En dérivant deux fois dans la base fixe :</p>
    <div class="formula">$$\vec\Gamma(G,2/0) = \left(\ddot x - \ell\ddot\theta\cos\theta + \ell\dot\theta^2\sin\theta\right)\vec x_0 - \left(\ell\ddot\theta\sin\theta + \ell\dot\theta^2\cos\theta\right)\vec y_0$$</div>
    <p><strong>Q2.</strong> \(A\) est mobile et sa vitesse \(\dot x\,\vec x_0\) n'est pas colinéaire à celle de \(G\) : le terme complémentaire \(m\,\vec V(A)\wedge\vec V(G)\) ne s'annule pas. On passe donc par \(G\) : \(\vec\delta(G,2/0) = J_G\ddot\theta\,\vec z_0\) (problème plan, \(\vec z_0\) principal), puis \(\vec\delta(A) = \vec\delta(G) + \overrightarrow{AG}\wedge m\vec\Gamma(G)\). Avec \(\overrightarrow{AG} = (-\ell\sin\theta,\ \ell\cos\theta)\) :</p>
    <div class="formula">$$\left(\overrightarrow{AG}\wedge m\vec\Gamma(G)\right)\cdot\vec z_0 = m\left[\ell^2\ddot\theta\sin^2\theta + \ell^2\ddot\theta\cos^2\theta - \ell\ddot x\cos\theta\right] = m\ell^2\ddot\theta - m\ell\ddot x\cos\theta$$</div>
    <p>(les termes en \(\dot\theta^2\) se compensent), d'où le résultat avec \(J_A = J_G + m\ell^2 = \frac43 m\ell^2\).</p>
    <p><strong>Q3.</strong> Actions sur la tige : pivot parfaite en \(A\) (moment nul sur \(\vec z_0\)) et poids en \(G\) : \(\overrightarrow{AG}\wedge(-mg\,\vec y_0) = mg\ell\sin\theta\,\vec z_0\). Donc</p>
    <div class="formula">$$J_A\,\ddot\theta - m\ell\,\ddot x\cos\theta = m g\ell\sin\theta \qquad (1)$$</div>
    <p><strong>Q4.</strong> Sur \(\{1,2\}\), les actions horizontales extérieures se réduisent à \(F\) (rail sans frottement, poids vertical) et l'action de la pivot est intérieure :</p>
    <div class="formula">$$(M+m)\,\ddot x - m\ell\left(\ddot\theta\cos\theta - \dot\theta^2\sin\theta\right) = F \qquad (2)$$</div>
    <p>Ces deux équations ne contiennent aucune inconnue de liaison : ce sont les équations du mouvement des deux paramètres \(x\) et \(\theta\).</p>
    <p><strong>Q5.</strong> Avec \(\theta = 0\), \(\dot\theta = \ddot\theta = \ddot x = 0\) et \(F = 0\), (1) et (2) sont vérifiées. Au premier ordre (\(\sin\theta\approx\theta\), \(\cos\theta\approx1\), \(\dot\theta^2\theta\) négligé) : \(J_A\ddot\theta - m\ell\ddot x = mg\ell\,\theta\) et \((M+m)\ddot x - m\ell\ddot\theta = F\).</p>
    <p><strong>Q6.</strong> On élimine \(\ddot x = (F + m\ell\ddot\theta)/(M+m)\) :</p>
    <div class="formula">$$\left[(M+m)J_A - m^2\ell^2\right]\ddot\theta - (M+m)\,mg\ell\,\theta = m\ell\,F$$</div>
    <p>Avec \(J_A = \frac43 m\ell^2\), le crochet vaut \(m\ell^2(4M+m)/3\), d'où</p>
    <div class="formula">$$\frac{\theta(p)}{F(p)} = \frac{K}{p^2 - p_0^2},\qquad K = \frac{3}{\ell\,(4M+m)},\qquad p_0 = \sqrt{\frac{3\,(M+m)\,g}{(4M+m)\,\ell}}$$</div>
    <p>Pôles \(\pm p_0\) : le pôle \(+p_0\), réel positif, rend le système <strong>instable</strong> en boucle ouverte (la tige tombe). Application : \(p_0 = \sqrt{3\times10\times9{,}81/(34\times0{,}5)} \approx 4{,}2\ \text{s}^{-1}\), soit une divergence en \(e^{t/0{,}24\,\text{s}}\) : l'asservissement de \(F\) doit réagir en quelques centièmes de seconde.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Centrifugeuse de laboratoire : inertie, paliers et équilibrage</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>cinétique, PFD 3D et équilibrage</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Une centrifugeuse de paillasse comporte un bâti \(0\) (repère \(\mathcal R_0 = (O,\vec x_0,\vec y_0,\vec z_0)\) galiléen, \(\vec z_0\) vertical ascendant) et un rotor \(1\) en liaison pivot d'axe \((O,\vec z_0)\), réalisée par un palier supérieur en \(O\) (modèle : liaison sphérique) et un palier inférieur en \(O_2\), \(\overrightarrow{OO_2} = -L\,\vec z_0\) (modèle : linéaire annulaire d'axe \(\vec z_0\)). On note \(\theta = (\vec x_0,\vec x_1)\) et \((\vec x_1,\vec y_1,\vec z_0)\) la base liée au rotor. Un moteur exerce sur \(1\) le couple \(C_m\,\vec z_0\) ; liaisons parfaites.<br>
    • Rotor seul : masse \(m_r = 1{,}2\ \text{kg}\), centre d'inertie en \(O\), axe de révolution \((O,\vec z_0)\), moment d'inertie \(C_r = 6{,}0\cdot10^{-3}\ \text{kg·m}^2\) autour de cet axe.<br>
    • Quatre logements \(P_1\) à \(P_4\) : \(\overrightarrow{OP_k} = r\,\vec u_k + h\,\vec z_0\) avec \(\vec u_1 = \vec x_1\), \(\vec u_2 = \vec y_1\), \(\vec u_3 = -\vec x_1\), \(\vec u_4 = -\vec y_1\). Un tube plein est assimilé à un point matériel de masse \(m_t = 50\ \text{g}\) placé en \(P_k\).<br>
    • \(r = 80\ \text{mm}\), \(h = 40\ \text{mm}\), \(L = 100\ \text{mm}\), vitesse de service \(N = 6\,000\ \text{tr/min}\), \(g = 9{,}81\ \text{m·s}^{-2}\).
  </div>

  <p class="exo-part">Partie A — Rotor chargé de quatre tubes</p>
  <div class="q"><strong>A1.</strong> Déterminer la position du centre d'inertie \(G\) de l'ensemble.</div>
  <div class="q"><strong>A2.</strong> Montrer que les produits d'inertie \(D\), \(E\), \(F\) de l'ensemble en \(O\), dans la base \(1\), sont nuls. Calculer le moment d'inertie \(C\) autour de \((O,\vec z_0)\).</div>
  <div class="q"><strong>A3.</strong> Le rotor atteint sa vitesse de service en \(t_a = 20\ \text{s}\) sous couple constant. Quel théorème, appliqué à quel système et projeté sur quel axe, donne \(C_m\) ? Calculer \(C_m\) et l'énergie cinétique à la vitesse de service.</div>

  <p class="exo-part">Partie B — Erreur de chargement : le tube \(P_1\) est absent</p>
  <div class="q"><strong>B1.</strong> Déterminer la nouvelle masse \(M\) et la position de \(G\).</div>
  <div class="q"><strong>B2.</strong> Calculer \(D\), \(E\), \(F\) en \(O\) dans la base \(1\). Le rotor est-il équilibré statiquement ? dynamiquement ?</div>
  <div class="q"><strong>B3.</strong> À vitesse constante \(\omega\), déterminer le torseur dynamique du rotor chargé en \(O\). Applications numériques.</div>

  <p class="exo-part">Partie C — Actions dans les paliers</p>
  <div class="q"><strong>C1.</strong> Faire le bilan des actions extérieures sur le rotor chargé et le décompte inconnues / équations.</div>
  <div class="q"><strong>C2.</strong> Déterminer, en régime permanent, les actions des paliers et le couple moteur. Applications numériques.</div>
  <div class="q"><strong>C3.</strong> Commenter ces résultats.</div>

  <p class="exo-part">Partie D — Règles de chargement</p>
  <div class="q"><strong>D1.</strong> On ne charge que deux tubes, en \(P_1\) et \(P_3\). Le rotor est-il équilibré ?</div>
  <div class="q"><strong>D2.</strong> Un autre rotor possède six logements à \(60°\) les uns des autres. Montrer que trois tubes de même masse placés à \(120°\) le laissent équilibré. Énoncer une règle générale.</div>
  <div class="q"><strong>D3.</strong> Quatre tubes sont chargés, mais l'un d'eux contient \(0{,}5\ \text{g}\) de moins que les autres. Estimer l'effort maximal dans les paliers.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Les tubes sont symétriques deux à deux par rapport à l'axe : \(x_G = y_G = 0\). Sur l'axe, \(z_G = \frac{4m_t h}{m_r + 4m_t} = \frac{0{,}2\times0{,}04}{1{,}4} \approx 5{,}7\ \text{mm}\).</p>
    <p><strong>A2.</strong> Le rotor seul, de révolution, a des produits nuls. Pour les points : \(D = m_t h\sum y_k = m_t h(0 + r + 0 - r) = 0\), \(E = m_t h\sum x_k = 0\), \(F = m_t\sum x_k y_k = 0\) (chaque point a \(x_k = 0\) ou \(y_k = 0\)). Les tubes ajoutent chacun \(m_t r^2\) :</p>
    <div class="formula">$$C = C_r + 4m_t r^2 = 6{,}0\cdot10^{-3} + 1{,}28\cdot10^{-3} = 7{,}28\cdot10^{-3}\ \text{kg·m}^2$$</div>
    <p><strong>A3.</strong> TMD appliqué au rotor chargé, en \(O\) (point fixe), projeté sur \(\vec z_0\) : les paliers n'ont pas de moment sur l'axe, le poids est parallèle à l'axe. \(\vec\delta(O)\cdot\vec z_0 = C\ddot\theta\) (§6), donc \(C_m = C\ddot\theta\). Avec \(\omega_s = 6000\times2\pi/60 = 628\ \text{rad·s}^{-1}\) et \(\ddot\theta = \omega_s/t_a = 31{,}4\ \text{rad·s}^{-2}\) : \(C_m \approx 0{,}23\ \text{N·m}\). À la vitesse de service :</p>
    <div class="formula">$$E_c = \frac12 C\omega_s^2 = \frac12\times7{,}28\cdot10^{-3}\times3{,}95\cdot10^{5} \approx 1{,}4\ \text{kJ}$$</div>
    <p><strong>B1.</strong> \(M = m_r + 3m_t = 1{,}35\ \text{kg}\). Les tubes \(P_2\) et \(P_4\) se compensent selon \(\vec y_1\) ; il reste \(P_3\) en \(x = -r\) : \(x_G = -\frac{m_t r}{M} \approx -3{,}0\ \text{mm}\), \(y_G = 0\), \(z_G = \frac{3m_t h}{M} \approx 4{,}4\ \text{mm}\).</p>
    <p><strong>B2.</strong> \(D = m_t h(r - r) = 0\), \(F = 0\), mais seul \(P_3\) contribue à \(E\) : \(E = -m_t r h\), soit \(E = -1{,}6\cdot10^{-4}\ \text{kg·m}^2\). \(G\) n'est pas sur l'axe : ni équilibrage statique, ni équilibrage dynamique.</p>
    <p><strong>B3.</strong> Avec \(\ddot\theta = 0\), \(\dot\theta = \omega\), les formules du §9 donnent, puisque \(M x_G = -m_t r\) :</p>
    <div class="formula">$$M\,\vec\Gamma(G) = -M\omega^2 x_G\,\vec x_1 = m_t r\,\omega^2\,\vec x_1,\qquad \vec\delta(O) = -E\,\omega^2\,\vec y_1 = m_t r h\,\omega^2\,\vec y_1$$</div>
    <p>Numériquement, \(\omega^2 \approx 3{,}95\cdot10^{5}\ \text{rad}^2\text{·s}^{-2}\) : \(m_t r\omega^2 \approx 1{,}58\ \text{kN}\) et \(m_t r h\omega^2 \approx 63\ \text{N·m}\). Contrôle : tout se passe comme si l'on ajoutait au rotor équilibré une masse \(-m_t\) en \(P_1\).</p>
    <p><strong>C1.</strong> Poids \(-Mg\,\vec z_0\) en \(G\) ; palier \(O\) : \(X_O\vec x_1 + Y_O\vec y_1 + Z_O\vec z_0\), moment nul en \(O\) ; palier \(O_2\) : \(X_2\vec x_1 + Y_2\vec y_1\), moment nul en \(O_2\) ; couple \(C_m\,\vec z_0\). Six inconnues, six équations : problème isostatique.</p>
    <p><strong>C2.</strong> Moments en \(O\) du palier inférieur et du poids :</p>
    <div class="formula">$$\overrightarrow{OO_2}\wedge(X_2\vec x_1 + Y_2\vec y_1) = L Y_2\,\vec x_1 - L X_2\,\vec y_1 \qquad \overrightarrow{OG}\wedge(-Mg\,\vec z_0) = Mg\,x_G\,\vec y_1 = -m_t r g\,\vec y_1$$</div>
    <p>TMD en \(O\) :</p>
    <div class="formula">$$\vec x_1 :\ L Y_2 = 0,\qquad \vec y_1 :\ -L X_2 - m_t r g = m_t r h\omega^2,\qquad \vec z_0 :\ C_m = 0$$</div>
    <p>TRD : \(X_O + X_2 = m_t r\omega^2\), \(Y_O + Y_2 = 0\), \(Z_O - Mg = 0\). D'où \(Y_2 = Y_O = 0\), \(Z_O = Mg \approx 13\ \text{N}\) et</p>
    <div class="formula">$$X_2 = -\frac{m_t r\,(h\omega^2 + g)}{L} \approx -632\ \text{N},\qquad X_O = m_t r\left[\omega^2\left(1 + \frac{h}{L}\right) + \frac{g}{L}\right] \approx 2{,}21\ \text{kN}$$</div>
    <p><strong>C3.</strong> Ces efforts sont fixes dans la base \(1\), donc tournent à \(100\ \text{Hz}\) dans le bâti : vibrations violentes et fatigue des roulements. Le palier supérieur encaisse environ 2,2 kN, soit plus de 150 fois le poids du rotor, à cause d'un seul tube de 50 g. Le terme en \(g\) est négligeable devant le terme en \(\omega^2\). D'où les détecteurs de balourd qui coupent le moteur.</p>
    <p><strong>D1.</strong> \(\sum x_k = r - r = 0\) et \(\sum y_k = 0\) : \(G\) sur l'axe ; \(E = m_t h(r - r) = 0\), \(D = 0\) : équilibrage statique <em>et</em> dynamique.</p>
    <p><strong>D2.</strong> Pour des angles \(\varphi_k = 0,\ 2\pi/3,\ 4\pi/3\) : \(\sum\cos\varphi_k = \sum\sin\varphi_k = 0\). Donc \(G\) est sur l'axe, et \(E = m_t h r\sum\cos\varphi_k = 0\), \(D = m_t h r\sum\sin\varphi_k = 0\) : équilibré. Règle : des tubes de même masse, à la même hauteur, disposés selon un polygone régulier (ou par paires diamétralement opposées) ; sinon, compléter par des tubes d'équilibrage remplis d'eau.</p>
    <p><strong>D3.</strong> Le défaut équivaut à une masse \(-\Delta m = -0{,}5\ \text{g}\) en un logement : les actions radiales de la partie C (et le torseur dynamique de B3) sont multipliées par \(\Delta m/m_t = 1/100\) ; seule \(Z_O \approx Mg\) ne change pratiquement pas. Effort maximal \(\approx 22\ \text{N}\) au palier supérieur, tournant, encore supérieur au poids du rotor : on pèse les tubes deux à deux au dixième de gramme avant de lancer une centrifugation.</p>
