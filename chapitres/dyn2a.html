<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la compétence B2 de 2ᵉ année « déterminer les caractéristiques d'un solide ou d'un ensemble de solides indéformables » et la première partie de la compétence C2 (semestre S3) : torseurs cinétique et dynamique, énergie cinétique, inertie et masse équivalentes, principe fondamental de la dynamique en référentiel galiléen, que le mouvement soit imposé ou à déterminer. Il généralise en 3D le chapitre Dynamique du solide de 1ʳᵉ année et s'appuie sur la démarche d'isolement du chapitre Chaînes de solides. La seconde partie de C2 — puissances, théorème de l'énergie cinétique, rendement — fait l'objet du chapitre Énergétique des systèmes de solides.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Solide indéformable</strong> : définition, repère lié, équivalence solide/repère (B2, S3 ; rappel de la cinématique de 1ʳᵉ année) (§1).</li>
        <li><strong>Volume, masse, centre d'inertie</strong> d'un solide ou d'un ensemble de solides (B2, S3) (§1).</li>
        <li><strong>Matrice d'inertie</strong> : opérateur d'inertie, moments et produits d'inertie, base principale, symétries matérielles, théorème de Huygens, solides usuels et solides composés (B2, S3) (§2, §3, §4).</li>
        <li><strong>Torseur cinétique</strong> d'un solide ou d'un ensemble de solides par rapport à un référentiel galiléen (C2, S3) (§5).</li>
        <li><strong>Torseur dynamique</strong> ; dérivation d'un vecteur exprimé dans une base mobile (C2, S3) (§6).</li>
        <li><strong>Énergie cinétique</strong> ; <strong>inertie et masse équivalentes</strong> (C2, S3) (§7).</li>
        <li><strong>Référentiel galiléen</strong> ; <strong>principe fondamental de la dynamique</strong> (théorèmes de la résultante et du moment dynamiques) ; principe des actions réciproques (C2, S3) (§8).</li>
        <li><strong>Choix des isolements et des équations</strong> : principe fondamental de la dynamique ou théorème de l'énergie cinétique (C1, S3) (§8).</li>
        <li><strong>Loi de mouvement quand les efforts sont connus</strong> ; position d'équilibre ; linéarisation autour d'un point de fonctionnement (C2 et B2, S3) (§8).</li>
        <li><strong>Actions mécaniques quand le mouvement est imposé</strong> : actions dans les paliers d'un rotor, équilibrage statique et dynamique (C2, S3) (§9).</li>
      </ul>
      <p>Non évalué : les <strong>calculs intégraux</strong> des éléments d'inertie (centre d'inertie et matrice) ne donnent pas lieu à évaluation. Les intégrales et les démonstrations des §1 et §2 servent à comprendre d'où viennent les résultats ; aux concours, on justifie la forme de la matrice par les symétries (§3), on utilise Huygens et les matrices des solides usuels (§4), et les valeurs numériques sont fournies (énoncé, modeleur 3D). Rien d'autre n'est hors programme dans ce chapitre ; l'équilibrage (§9), application directe du mouvement imposé, est très présent aux concours.</p>
    </div>
  </div>

<div class="course-section">
  <div class="sec-num">§1 · MASSE ET CENTRE D'INERTIE</div>
  <h2>Où se trouve la matière ?</h2>
  <div class="intro">La cinétique décrit la façon dont la masse d'un solide est répartie. Deux pièces de même masse ne demandent pas les mêmes efforts pour un même mouvement : tout dépend de la position de la matière par rapport aux axes. Le premier niveau de description est la masse totale et le point qui « porte » la translation : le centre d'inertie.</div>

  <h3>Solide indéformable et repère lié (rappel)</h3>
  <div class="def-box">
    Un <strong>solide indéformable</strong> est un ensemble de points dont les distances mutuelles restent constantes au cours du temps : \(\|\overrightarrow{AB}\| = \text{cte}\) pour tous points \(A\), \(B\) du solide. On peut alors lui attacher une origine et une base orthonormée directe dans lesquelles tous ses points sont immobiles : c'est le <strong>repère lié</strong> au solide. Décrire le mouvement du solide revient à décrire celui de ce repère : c'est l'<strong>équivalence solide/repère</strong>, qui permet d'écrire indifféremment \(\vec\Omega(S/\mathcal R)\) ou \(\vec\Omega(\mathcal R_S/\mathcal R)\).
  </div>
  <p>Ce modèle convient tant que les déformations réelles (de quelques micromètres à quelques dixièmes de millimètre pour une pièce mécanique) ne changent ni la géométrie utile ni la répartition de la masse. Il cesse de convenir lorsqu'on s'intéresse précisément à ces déformations (chapitre Résistance des matériaux) ou à des pièces très souples (courroies, câbles, ressorts). C'est dans un repère lié que la répartition de masse se décrit par des grandeurs constantes : masse, position du centre d'inertie, matrice d'inertie.</p>

  <h3>Masse d'un système matériel</h3>
  <div class="def-box">
    <strong>Système discret</strong> (ensemble de points ou de pièces de masses \(m_i\)) : \(m = \sum_i m_i\).<br>
    <strong>Système continu</strong> : on associe à chaque point \(M\) un élément de masse \(dm\), volumique \(\rho(M)\,dV\) (pièces massives), surfacique \(\sigma(M)\,dS\) (plaques, tôles minces) ou linéique \(\lambda(M)\,d\ell\) (tiges, câbles).
    <div class="formula">$$m = \int_S dm = \iiint_V \rho(M)\,dV \qquad \text{(solide homogène : } m = \rho\,V\text{)}$$</div>
  </div>
  <div class="prop-box">
    <strong>Conservation de la masse.</strong> Pour un système matériel fermé (en particulier un solide), la masse est constante. Conséquence très utile pour toutes les démonstrations du chapitre : on peut dériver sous le signe somme,
    <div class="formula">$$\frac{d}{dt}\int_S \vec f(M,t)\,dm = \int_S \frac{d\vec f(M,t)}{dt}\,dm$$</div>
  </div>

  <h3>Centre d'inertie</h3>
  <div class="def-box">
    Le centre d'inertie \(G\) est l'unique point tel que \(\int_S \overrightarrow{GM}\,dm = \vec 0\). De façon équivalente, pour tout point \(O\) :
    <div class="formula">$$\overrightarrow{OG} = \frac{1}{m}\int_S \overrightarrow{OM}\,dm$$
$$\text{système discret : }\ \overrightarrow{OG} = \frac{1}{m}\sum_i m_i\,\overrightarrow{OG_i}$$</div>
    Dans un champ de pesanteur uniforme, \(G\) est aussi le point d'application du poids (centre de gravité).
  </div>
  <div class="prop-box">
    <strong>Propriétés pratiques.</strong>
    <ul style="margin:.4rem 0">
      <li><strong>Symétrie</strong> : si le solide possède un plan, un axe ou un centre de symétrie <em>matérielle</em> (géométrie et répartition des masses), \(G\) lui appartient.</li>
      <li><strong>Associativité</strong> : pour un solide composé de pièces \((m_i, G_i)\), \(G\) est le barycentre des \(G_i\) affectés des masses \(m_i\).</li>
      <li><strong>Évidement</strong> : un trou se traite comme une « masse négative ». Avec \((m_p, G_p)\) le solide plein et \((m_t, G_t)\) la matière enlevée :</li>
    </ul>
    <div class="formula">$$\overrightarrow{OG} = \frac{m_p\,\overrightarrow{OG_p} - m_t\,\overrightarrow{OG_t}}{m_p - m_t}$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Une tôle circulaire homogène (rayon \(R\), centre \(O\)) est percée d'un trou de rayon \(R/2\) centré en \(x = R/2\). Où se trouve \(G\) ?</span>
    <div class="content">
      <p>Les masses sont proportionnelles aux aires : plein \(\pi R^2\) (centre \(O\)), trou \(\pi R^2/4\) (centre en \(x = R/2\)). L'axe \((O,\vec x)\) est axe de symétrie, donc \(G\) est dessus :</p>
      <div class="formula">$$x_G = \frac{0 - \frac{\pi R^2}{4}\cdot\frac{R}{2}}{\pi R^2 - \frac{\pi R^2}{4}} = -\frac{R}{6}$$</div>
      <p>\(G\) est décalé de \(R/6\) du côté opposé au trou : logique, la matière restante y est plus abondante.</p>
    </div>
  </div>
  <div class="notice">Ordres de grandeur des masses volumiques : acier \(\approx 7{,}8\cdot10^3\ \text{kg·m}^{-3}\), fonte \(\approx 7{,}2\cdot10^3\), laiton \(\approx 8{,}5\cdot10^3\), aluminium \(\approx 2{,}7\cdot10^3\), polymères techniques \(\approx 1{,}0\) à \(1{,}4\cdot10^3\ \text{kg·m}^{-3}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · OPÉRATEUR ET MATRICE D'INERTIE</div>
  <h2>La répartition de masse autour d'un point</h2>
  <div class="intro">En rotation, la masse ne suffit plus : c'est la distance de la matière aux axes qui compte. Toute l'information utile pour la rotation d'un solide autour d'un point \(O\) tient dans un opérateur linéaire symétrique, représenté par une matrice \(3\times 3\).</div>

  <h3>Opérateur d'inertie</h3>
  <div class="def-box">
    L'<strong>opérateur d'inertie</strong> du solide \(S\) au point \(O\) est l'application linéaire
    <div class="formula">$$\overline{\overline{I}}(O,S) : \vec u \longmapsto \int_S \overrightarrow{OM}\wedge\left(\vec u\wedge\overrightarrow{OM}\right)dm$$</div>
    Il apparaît naturellement : si le solide tourne autour de \(O\) avec le vecteur rotation \(\vec\Omega\), chaque point a pour vitesse \(\vec\Omega\wedge\overrightarrow{OM}\), et \(\int_S \overrightarrow{OM}\wedge(\vec\Omega\wedge\overrightarrow{OM})\,dm\) est exactement \(\overline{\overline{I}}(O,S)\,\vec\Omega\).
  </div>

  <h3>Matrice d'inertie</h3>
  <p>Dans une base orthonormée directe \(\mathcal B = (\vec x,\vec y,\vec z)\), avec \(\overrightarrow{OM} = x\,\vec x + y\,\vec y + z\,\vec z\) :</p>
  <div class="formula">$$[I(O,S)]_{\mathcal B} = \begin{bmatrix} A & -F & -E \\ -F & B & -D \\ -E & -D & C \end{bmatrix}_{(\vec x,\vec y,\vec z)}$$</div>
  <div class="formula">$$A = \int_S (y^2+z^2)\,dm,\qquad B = \int_S (z^2+x^2)\,dm,\qquad C = \int_S (x^2+y^2)\,dm$$</div>
  <div class="formula">$$D = \int_S y\,z\,dm,\qquad E = \int_S z\,x\,dm,\qquad F = \int_S x\,y\,dm$$</div>
  <div class="def-box">
    \(A\), \(B\), \(C\) sont les <strong>moments d'inertie</strong> par rapport aux axes \((O,\vec x)\), \((O,\vec y)\), \((O,\vec z)\) : toujours positifs, en \(\text{kg·m}^2\). \(D\), \(E\), \(F\) sont les <strong>produits d'inertie</strong>, de signe quelconque. Repère mnémotechnique : \(D\) ne contient pas \(x\), \(E\) ne contient pas \(y\), \(F\) ne contient pas \(z\) ; chacun est placé, avec un signe moins, à la croisée des deux coordonnées qu'il contient.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">D'où sortent ces six intégrales ?</span>
    <div class="content">
      <p>On calcule l'image du premier vecteur de base : \(\vec x\wedge\overrightarrow{OM} = y\,\vec z - z\,\vec y\), puis</p>
      <div class="formula">$$\overrightarrow{OM}\wedge(\vec x\wedge\overrightarrow{OM}) = (y^2+z^2)\,\vec x - x y\,\vec y - z x\,\vec z$$</div>
      <p>Après intégration, la première colonne de la matrice vaut \((A,\,-F,\,-E)\). Le même calcul avec \(\vec y\) et \(\vec z\) donne les deux autres colonnes ; la matrice obtenue est symétrique.</p>
    </div>
  </div>
  <div class="notice"><strong>Ce qui est exigible.</strong> Le calcul intégral des éléments d'inertie (centre d'inertie, moments et produits) n'est pas évalué. Il faut savoir ce que mesure chaque terme, justifier la forme de la matrice par les symétries (§3), transporter avec Huygens et assembler des solides usuels (§4) ; les valeurs numériques sont données par l'énoncé ou lues dans le modeleur 3D (propriétés de masse de la pièce).</div>

  <h3>Moment d'inertie par rapport à un axe, rayon de giration</h3>
  <div class="prop-box">
    Pour un axe \(\Delta = (O,\vec u)\) avec \(\vec u\) unitaire, en notant \(d(M,\Delta)\) la distance de \(M\) à l'axe :
    <div class="formula">$$I_\Delta = \vec u\cdot\overline{\overline{I}}(O,S)\,\vec u = \int_S d(M,\Delta)^2\,dm$$</div>
    car, par permutation du produit mixte :
    <div class="formula">$$\vec u\cdot\left(\overrightarrow{OM}\wedge(\vec u\wedge\overrightarrow{OM})\right) = \|\vec u\wedge\overrightarrow{OM}\|^2 = d^2$$</div>
    En matrice : \(I_\Delta = \{u\}^{T}[I(O,S)]\{u\}\).<br>
    Le <strong>rayon de giration</strong> \(k_\Delta\) est défini par \(I_\Delta = m\,k_\Delta^2\) : c'est la distance à laquelle il faudrait concentrer toute la masse pour obtenir la même inertie (cylindre plein autour de son axe : \(k = R/\sqrt2 \approx 0{,}71\,R\)).
  </div>

  <h3>Propriétés de la matrice</h3>
  <div class="prop-box">
    <ul style="margin:.4rem 0">
      <li><strong>Symétrique réelle</strong>, donc diagonalisable dans une base orthonormée (théorème spectral) : c'est la <strong>base principale d'inertie</strong> ; ses axes sont les <strong>axes principaux</strong>, les valeurs propres \(A', B', C'\) les <strong>moments principaux</strong>.</li>
      <li>Elle dépend du point <em>et</em> de la base : toujours préciser les deux.</li>
      <li>\(A + B + C = 2\int_S OM^2\,dm\) (invariant) et chaque moment est au plus la somme des deux autres : \(A \le B + C\).</li>
      <li><strong>Plaque mince</strong> dans le plan \((O,\vec x,\vec y)\) : \(z = 0\), donc \(D = E = 0\) et \(C = A + B\).</li>
      <li><strong>Additivité</strong> : \([I(O,S_1\cup S_2)] = [I(O,S_1)] + [I(O,S_2)]\), à condition d'écrire les deux matrices au même point et dans la même base.</li>
    </ul>
  </div>
  <div class="notice">La matrice d'inertie est <strong>constante dans une base liée au solide</strong> (les coordonnées des points n'y dépendent pas du temps). C'est toujours dans une telle base qu'on l'écrit, puis qu'on calcule le produit \([I]\{\Omega\}\) après avoir exprimé \(\vec\Omega\) dans cette même base.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SYMÉTRIES MATÉRIELLES</div>
  <h2>Lire les zéros de la matrice sur la géométrie</h2>
  <div class="intro">Calculer six intégrales est rarement nécessaire : les symétries de la pièce annulent des produits d'inertie et égalisent des moments. Justifier la forme de la matrice avant tout calcul est un attendu systématique des sujets.</div>

  <h3>Un plan de symétrie</h3>
  <div class="prop-box">
    Si \((O,\vec x,\vec y)\) est plan de symétrie matérielle (à chaque élément \(dm\) en \((x,y,z)\) correspond un élément de même masse en \((x,y,-z)\)), toute intégrale contenant \(z\) à la puissance 1 s'annule : \(D = E = 0\). L'axe \((O,\vec z)\), normal au plan, est principal.
    <div class="formula">$$[I(O,S)] = \begin{bmatrix} A & -F & 0 \\ -F & B & 0 \\ 0 & 0 & C \end{bmatrix}_{(\vec x,\vec y,\vec z)}$$</div>
    <strong>Règle</strong> : un plan de symétrie annule les deux produits qui contiennent la coordonnée normale à ce plan.
  </div>

  <h3>Deux plans de symétrie orthogonaux</h3>
  <div class="prop-box">
    Si \((O,\vec x,\vec y)\) et \((O,\vec z,\vec x)\) sont plans de symétrie : le premier annule \(D\) et \(E\), le second \(D\) et \(F\). La base \((\vec x,\vec y,\vec z)\) est principale, la matrice est diagonale.
  </div>

  <h3>Axe de symétrie, axe de révolution, symétrie sphérique</h3>
  <div class="prop-box">
    <ul style="margin:.4rem 0">
      <li><strong>Axe de symétrie</strong> \((O,\vec z)\) (le demi-tour autour de \(\vec z\) conserve le solide : \((x,y,z)\mapsto(-x,-y,z)\)) : \(D = E = 0\), l'axe est principal.</li>
      <li><strong>Axe de révolution matérielle</strong> \((O,\vec z)\) : en plus \(A = B\), et <em>toute</em> base \((\vec x,\vec y,\vec z)\) avec \(\vec x,\vec y\perp\vec z\) est principale.</li>
      <li><strong>Symétrie sphérique</strong> (sphère en son centre) : \(A = B = C\), toute base est principale.</li>
    </ul>
    <div class="formula">$$[I(O,S)] = \begin{bmatrix} A & 0 & 0 \\ 0 & A & 0 \\ 0 & 0 & C \end{bmatrix}_{(\vec x,\vec y,\vec z)}\quad \text{pour tous } \vec x,\vec y \perp \vec z$$</div>
  </div>
  <div style="overflow-x:auto;margin:.6rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Élément de symétrie (passant par \(O\))</th><th style="padding:.35rem;border:1px solid var(--grid)">Produits nuls</th><th style="padding:.35rem;border:1px solid var(--grid)">En plus</th><th style="padding:.35rem;border:1px solid var(--grid)">Exemple</th></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">plan \((O,\vec x,\vec y)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(D, E\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\vec z\) principal</td><td style="padding:.35rem;border:1px solid var(--grid)">bielle, levier plan</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">plan \((O,\vec y,\vec z)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(E, F\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\vec x\) principal</td><td style="padding:.35rem;border:1px solid var(--grid)">—</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">deux plans orthogonaux</td><td style="padding:.35rem;border:1px solid var(--grid)">\(D, E, F\)</td><td style="padding:.35rem;border:1px solid var(--grid)">base principale</td><td style="padding:.35rem;border:1px solid var(--grid)">pavé, profilé en I</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">axe de révolution \((O,\vec z)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(D, E, F\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(A = B\)</td><td style="padding:.35rem;border:1px solid var(--grid)">arbre, disque, poulie</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">symétrie sphérique</td><td style="padding:.35rem;border:1px solid var(--grid)">tous</td><td style="padding:.35rem;border:1px solid var(--grid)">\(A = B = C\)</td><td style="padding:.35rem;border:1px solid var(--grid)">bille</td></tr>
    </table>
  </div>
  <div class="notice"><strong>Pièges.</strong> (1) La symétrie doit être <em>matérielle</em> : une pièce géométriquement symétrique mais faite de deux matériaux peut ne pas l'être. (2) Le point \(O\) doit appartenir au plan ou à l'axe de symétrie ; sinon, écrire la matrice en \(G\) et transporter par Huygens. (3) Un seul plan ne donne qu'un axe principal. (4) Un axe de symétrie d'ordre au moins 3 (hélice tripale, prisme hexagonal) suffit à donner \(A = B\) en un point de cet axe.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · HUYGENS GÉNÉRALISÉ ET SOLIDES USUELS</div>
  <h2>Changer de point, assembler des pièces</h2>
  <div class="intro">Les matrices de référence sont données au centre d'inertie, là où les symétries sont maximales. Le théorème de Huygens généralisé les transporte en n'importe quel point ; l'additivité permet d'assembler une pièce à partir de formes simples.</div>

  <h3>Théorème de Huygens généralisé</h3>
  <div class="prop-box">
    Pour tout point \(O\) et tout vecteur \(\vec u\) :
    <div class="formula">$$\overline{\overline{I}}(O,S)\,\vec u = \overline{\overline{I}}(G,S)\,\vec u + m\,\overrightarrow{OG}\wedge\left(\vec u\wedge\overrightarrow{OG}\right)$$</div>
    Le second terme est l'opérateur d'inertie, en \(O\), d'un point de masse \(m\) placé en \(G\). Avec \(\overrightarrow{OG} = a\,\vec x + b\,\vec y + c\,\vec z\) (mêmes axes en \(O\) et en \(G\)) :
    <div class="formula">$$A_O = A_G + m(b^2+c^2),\qquad B_O = B_G + m(c^2+a^2),\qquad C_O = C_G + m(a^2+b^2)$$</div>
    <div class="formula">$$D_O = D_G + m\,b\,c,\qquad E_O = E_G + m\,c\,a,\qquad F_O = F_G + m\,a\,b$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi n'y a-t-il pas de terme croisé ?</span>
    <div class="content">
      <p>On écrit \(\overrightarrow{OM} = \overrightarrow{OG} + \overrightarrow{GM}\) et on développe le double produit vectoriel. Les termes croisés contiennent tous \(\int_S \overrightarrow{GM}\,dm\), nul par définition de \(G\). Il reste l'opérateur en \(G\) (terme en \(\overrightarrow{GM}\overrightarrow{GM}\)) et celui de la masse \(m\) concentrée en \(G\) (terme en \(\overrightarrow{OG}\overrightarrow{OG}\)).</p>
    </div>
  </div>
  <div class="notice">Huygens relie un point quelconque <strong>au centre d'inertie</strong>, jamais deux points quelconques entre eux : pour passer de \(O_1\) à \(O_2\), retrancher le terme de \(O_1\) pour revenir en \(G\), puis ajouter celui de \(O_2\). Conséquence : pour une direction donnée, le moment d'inertie est minimal autour de l'axe passant par \(G\).</div>

  <h3>Matrices des solides usuels</h3>
  <p>Matrices au centre d'inertie \(G\), dans une base principale (produits nuls) ; \(m\) masse du solide.</p>
  <div style="overflow-x:auto;margin:.6rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Solide</th><th style="padding:.35rem;border:1px solid var(--grid)">Axe de \(A\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(A\)</th><th style="padding:.35rem;border:1px solid var(--grid)">\(B = C\) (ou \(B\), \(C\))</th></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Tige mince, longueur \(L\)</td><td style="padding:.35rem;border:1px solid var(--grid)">axe de la tige</td><td style="padding:.35rem;border:1px solid var(--grid)">\(0\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{mL^2}{12}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Cylindre plein \((R, L)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">axe du cylindre</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{mR^2}{2}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{mR^2}{4}+\frac{mL^2}{12}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Disque mince \((R)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">normale</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{mR^2}{2}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{mR^2}{4}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Cylindre creux \((R, r, L)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">axe du cylindre</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{m(R^2+r^2)}{2}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{m(R^2+r^2)}{4}+\frac{mL^2}{12}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Tube mince \((R, L)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">axe du tube</td><td style="padding:.35rem;border:1px solid var(--grid)">\(mR^2\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{mR^2}{2}+\frac{mL^2}{12}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Pavé \(a\times b\times c\) (selon \(\vec x,\vec y,\vec z\))</td><td style="padding:.35rem;border:1px solid var(--grid)">\((G,\vec x)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{m(b^2+c^2)}{12}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">\(B = \frac{m(c^2+a^2)}{12}\), \(C = \frac{m(a^2+b^2)}{12}\)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Sphère pleine \((R)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">tout diamètre</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{2mR^2}{5}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">idem</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">Sphère creuse mince \((R)\)</td><td style="padding:.35rem;border:1px solid var(--grid)">tout diamètre</td><td style="padding:.35rem;border:1px solid var(--grid)">\(\frac{2mR^2}{3}\)</td><td style="padding:.35rem;border:1px solid var(--grid)">idem</td></tr>
    </table>
  </div>
  <p>Exemples immédiats : tige autour d'une extrémité, \(\frac{mL^2}{12} + m\left(\frac{L}{2}\right)^2 = \frac{mL^2}{3}\) ; point matériel à la distance \(R\) d'un axe, \(mR^2\).</p>

  <h3>Solide composé</h3>
  <div class="prop-box">
    <ol style="margin:.4rem 0">
      <li>Découper la pièce en formes usuelles (les évidements comptent en négatif).</li>
      <li>Écrire chaque matrice en son centre d'inertie \(G_i\), dans une base commune. Si une pièce est inclinée, changer de base : \([I]_{\mathcal B'} = P^{T}\,[I]_{\mathcal B}\,P\), où \(P\) a pour colonnes les vecteurs de \(\mathcal B'\) exprimés dans \(\mathcal B\).</li>
      <li>Transporter chaque matrice au point commun \(O\) par Huygens.</li>
      <li>Additionner.</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Matrice d'inertie d'un cube homogène (arête \(a\), masse \(m\)) en l'un de ses sommets \(O\), axes selon les arêtes.</span>
    <div class="content">
      <p>En \(G\), trois plans de symétrie et \(A_G = B_G = C_G = \frac{m(a^2+a^2)}{12} = \frac{ma^2}{6}\). Avec \(\overrightarrow{OG} = \frac a2(\vec x+\vec y+\vec z)\) : \(A_O = \frac{ma^2}{6} + m\left(\frac{a^2}{4}+\frac{a^2}{4}\right) = \frac{2ma^2}{3}\) et \(D_O = 0 + m\frac{a}{2}\cdot\frac{a}{2} = \frac{ma^2}{4}\) (de même \(E_O\), \(F_O\)).</p>
      <div class="formula">$$[I(O,S)] = m a^2\begin{bmatrix} 2/3 & -1/4 & -1/4 \\ -1/4 & 2/3 & -1/4 \\ -1/4 & -1/4 & 2/3 \end{bmatrix}_{(\vec x,\vec y,\vec z)}$$</div>
      <p>En \(O\), les arêtes ne sont pas axes principaux. Autour de la grande diagonale \(\vec u = (\vec x+\vec y+\vec z)/\sqrt3\) :</p>
      <div class="formula">$$I = \{u\}^{T}[I]\{u\} = \frac{ma^2}{3}\left(3\cdot\frac23 - 6\cdot\frac14\right) = \frac{ma^2}{6}$$</div>
      <p>C'est la même valeur qu'autour de tout axe passant par \(G\) : normal, la diagonale passe par \(G\), où l'inertie du cube est « sphérique ».</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · TORSEUR CINÉTIQUE</div>
  <h2>Quantité de mouvement et moment cinétique</h2>
  <div class="intro">Le torseur cinétique rassemble la quantité de mouvement d'un solide (résultante) et son « moment de quantité de mouvement » (moment cinétique). Il se calcule à partir du torseur cinématique et des éléments d'inertie.</div>

  <h3>Définition</h3>
  <div class="def-box">
    Pour un solide \(S\) en mouvement par rapport au repère \(\mathcal R\), en un point \(A\) quelconque :
    <div class="formula">$$\{\mathcal C(S/\mathcal R)\} = \begin{Bmatrix} \vec p(S/\mathcal R) = \displaystyle\int_S \vec V(M/\mathcal R)\,dm \\ \vec\sigma(A,S/\mathcal R) = \displaystyle\int_S \overrightarrow{AM}\wedge\vec V(M/\mathcal R)\,dm \end{Bmatrix}_A$$</div>
    Unités : \(\text{kg·m·s}^{-1}\) pour \(\vec p\), \(\text{kg·m}^2\text{·s}^{-1}\) pour \(\vec\sigma\). C'est un torseur :
    <div class="formula">$$\vec\sigma(B,S/\mathcal R) = \vec\sigma(A,S/\mathcal R) + \overrightarrow{BA}\wedge\vec p(S/\mathcal R)$$</div>
  </div>

  <h3>Résultante cinétique</h3>
  <div class="prop-box">
    En dérivant \(\int_S \overrightarrow{OM}\,dm = m\,\overrightarrow{OG}\) (masse constante) :
    <div class="formula">$$\vec p(S/\mathcal R) = m\,\vec V(G,S/\mathcal R)$$</div>
  </div>

  <h3>Moment cinétique</h3>
  <div class="prop-box">
    Pour un point \(A\) lié au solide \(S\) :
    <div class="formula">$$\vec\sigma(A,S/\mathcal R) = m\,\overrightarrow{AG}\wedge\vec V(A,S/\mathcal R) + \overline{\overline{I}}(A,S)\,\vec\Omega(S/\mathcal R)$$</div>
    Deux cas à connaître par cœur :
    <div class="formula">$$\text{au centre d'inertie : }\ \vec\sigma(G,S/\mathcal R) = \overline{\overline{I}}(G,S)\,\vec\Omega(S/\mathcal R)$$</div>
    <div class="formula">$$A\in S \text{ fixe dans } \mathcal R :\ \vec\sigma(A,S/\mathcal R) = \overline{\overline{I}}(A,S)\,\vec\Omega(S/\mathcal R)$$</div>
    En translation (\(\vec\Omega = \vec 0\)) : \(\vec\sigma(G,S/\mathcal R) = \vec 0\). Ailleurs, calculer en \(G\) puis transporter.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Établir la formule générale du moment cinétique.</span>
    <div class="content">
      <p>Le champ des vitesses du solide donne \(\vec V(M) = \vec V(A) + \vec\Omega\wedge\overrightarrow{AM}\). En reportant dans la définition :</p>
      <div class="formula">$$\vec\sigma(A) = \left(\int_S \overrightarrow{AM}\,dm\right)\wedge\vec V(A) + \int_S \overrightarrow{AM}\wedge(\vec\Omega\wedge\overrightarrow{AM})\,dm$$
$$\vec\sigma(A) = m\,\overrightarrow{AG}\wedge\vec V(A) + \overline{\overline{I}}(A,S)\,\vec\Omega$$</div>
    </div>
  </div>
  <div class="notice">En général, \(\vec\sigma(G)\) (ou \(\vec\sigma(A)\) en un point \(A\) du solide fixe dans \(\mathcal R\)) <strong>n'est pas colinéaire</strong> à \(\vec\Omega\) : il ne l'est que si \(\vec\Omega\) est porté par un axe principal d'inertie en ce point. C'est l'origine des efforts parasites dans les paliers d'un rotor déséquilibré (§9) et des couples gyroscopiques. Méthode : exprimer \(\vec\Omega\) dans la base liée au solide, y calculer \([I]\{\Omega\}\), puis revenir à la base voulue.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Solide en rotation d'angle \(\theta\) autour d'un axe fixe \((O,\vec z_0)\), matrice quelconque en \(O\) dans sa base liée \((\vec x_1,\vec y_1,\vec z_0)\). Moment cinétique en \(O\) ?</span>
    <div class="content">
      <p>\(O\) est fixe et appartient au solide, \(\vec\Omega = \dot\theta\,\vec z_0\) :</p>
      <div class="formula">$$\vec\sigma(O,S/\mathcal R_0) = \begin{bmatrix} A & -F & -E \\ -F & B & -D \\ -E & -D & C \end{bmatrix}\begin{Bmatrix} 0 \\ 0 \\ \dot\theta \end{Bmatrix} = \dot\theta\left(-E\,\vec x_1 - D\,\vec y_1 + C\,\vec z_0\right)$$</div>
      <p>La projection sur l'axe, \(C\dot\theta = J_\Delta\dot\theta\), redonne le résultat de première année ; mais des composantes transverses existent dès que \(D\) ou \(E\) est non nul.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · TORSEUR DYNAMIQUE</div>
  <h2>Quantité d'accélération et moment dynamique</h2>
  <div class="intro">C'est le torseur qui apparaît dans le principe fondamental. On ne le calcule presque jamais par sa définition : on le déduit du torseur cinétique par dérivation.</div>

  <div class="def-box">
    <div class="formula">$$\{\mathcal D(S/\mathcal R)\} = \begin{Bmatrix} \vec R_d(S/\mathcal R) = \displaystyle\int_S \vec\Gamma(M/\mathcal R)\,dm \\ \vec\delta(A,S/\mathcal R) = \displaystyle\int_S \overrightarrow{AM}\wedge\vec\Gamma(M/\mathcal R)\,dm \end{Bmatrix}_A$$</div>
    \(\vec\Gamma\) est l'accélération (notée aussi \(\vec a\)). Unités : N et N·m. Torseur :
    <div class="formula">$$\vec\delta(B,S/\mathcal R) = \vec\delta(A,S/\mathcal R) + \overrightarrow{BA}\wedge\vec R_d(S/\mathcal R)$$</div>
  </div>

  <h3>Résultante dynamique</h3>
  <div class="formula">$$\vec R_d(S/\mathcal R) = m\,\vec\Gamma(G,S/\mathcal R)$$</div>

  <h3>Lien avec le moment cinétique</h3>
  <div class="prop-box">
    Pour un point \(A\) quelconque (lié ou non au solide), de vitesse \(\vec V(A/\mathcal R)\) :
    <div class="formula">$$\vec\delta(A,S/\mathcal R) = \left.\frac{d\vec\sigma(A,S/\mathcal R)}{dt}\right|_{\mathcal R} + m\,\vec V(A/\mathcal R)\wedge\vec V(G,S/\mathcal R)$$</div>
    Le terme complémentaire disparaît, et \(\vec\delta(A) = \frac{d\vec\sigma(A)}{dt}\big|_{\mathcal R}\), dans trois cas : \(A = G\) ; \(A\) fixe dans \(\mathcal R\) ; \(\vec V(A/\mathcal R)\) colinéaire à \(\vec V(G,S/\mathcal R)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver la définition du moment cinétique.</span>
    <div class="content">
      <p>Avec \(\frac{d}{dt}\overrightarrow{AM} = \vec V(M) - \vec V(A)\) et la dérivation sous l'intégrale (§1) :</p>
      <div class="formula">$$\frac{d\vec\sigma(A)}{dt} = \int_S (\vec V(M) - \vec V(A))\wedge\vec V(M)\,dm + \int_S \overrightarrow{AM}\wedge\vec\Gamma(M)\,dm$$
$$\frac{d\vec\sigma(A)}{dt} = -\vec V(A)\wedge m\,\vec V(G) + \vec\delta(A)$$</div>
      <p>D'où la relation annoncée (le premier terme de l'intégrale est nul : \(\vec V(M)\wedge\vec V(M) = \vec 0\)).</p>
    </div>
  </div>

  <h3>Dériver un vecteur exprimé dans une base mobile</h3>
  <div class="prop-box">
    <div class="formula">$$\left.\frac{d\vec u}{dt}\right|_{\mathcal R_0} = \left.\frac{d\vec u}{dt}\right|_{\mathcal R_1} + \vec\Omega(\mathcal R_1/\mathcal R_0)\wedge\vec u$$</div>
    Pour une rotation d'angle \(\theta\) autour de \(\vec z_0 = \vec z_1\) : \(\left.\frac{d\vec x_1}{dt}\right|_0 = \dot\theta\,\vec y_1\) et \(\left.\frac{d\vec y_1}{dt}\right|_0 = -\dot\theta\,\vec x_1\).
  </div>
  <figure class="schema" style="max-width:380px">
  <svg viewBox="0 0 240 190" role="img" aria-label="Figure de changement de base pour une rotation d'angle thêta autour de z0">
    <line x1="100" y1="140" x2="212" y2="140" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>
    <line x1="100" y1="140" x2="100" y2="28" class="sk-axis" marker-end="url(#sk-arrow-ink)"/>
    <line x1="100" y1="140" x2="191" y2="87.5" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>
    <line x1="100" y1="140" x2="47.5" y2="49" class="sk-accent" marker-end="url(#sk-arrow-accent)"/>

    <circle cx="100" cy="140" r="1.6" class="fl-ink"/>

    <text x="104" y="26" class="lab-it">y₀</text>

  </svg>
  <figcaption>Figure de changement de base : \(\vec x_1 = \cos\theta\,\vec x_0 + \sin\theta\,\vec y_0\) et \(\vec y_1 = -\sin\theta\,\vec x_0 + \cos\theta\,\vec y_0\). Une figure par rotation : c'est l'outil de base de tous les calculs de dérivées et de projections.</figcaption>
  </figure>

  <h3>Démarche de calcul</h3>
  <div class="prop-box">
    <ol style="margin:.4rem 0">
      <li>Calculer \(\vec\sigma\) en \(G\) ou en un point fixe du solide (formules simples du §5).</li>
      <li>Dériver par rapport à \(\mathcal R\) : attention aux vecteurs de base mobiles.</li>
      <li>Transporter au point utile pour le PFD : \(\vec\delta(B) = \vec\delta(A) + \overrightarrow{BA}\wedge m\,\vec\Gamma(G)\).</li>
    </ol>
    Pour un ensemble \(\Sigma = \{S_1,\dots,S_n\}\) : sommer les torseurs dynamiques de chaque solide, tous écrits au même point.
  </div>
  <div class="prop-box">
    <strong>Projection astucieuse.</strong> Si \(A\) est fixe (ou \(A = G\)) et \(\vec u\) un vecteur unitaire :
    <div class="formula">$$\vec\delta(A)\cdot\vec u = \frac{d}{dt}\big(\vec\sigma(A)\cdot\vec u\big) - \vec\sigma(A)\cdot\frac{d\vec u}{dt}\Big|_{\mathcal R}$$</div>
    Si de plus \(\vec u\) est fixe dans \(\mathcal R\), \(\vec\delta(A)\cdot\vec u = \frac{d}{dt}\big(\vec\sigma(A)\cdot\vec u\big)\) : on évite de dériver tout le vecteur.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Pour le solide en rotation autour de l'axe fixe \((O,\vec z_0)\) du §5, que vaut \(\vec\delta(O)\cdot\vec z_0\) ?</span>
    <div class="content">
      <p>\(O\) et \(\vec z_0\) sont fixes : \(\vec\delta(O)\cdot\vec z_0 = \frac{d}{dt}(C\dot\theta) = C\ddot\theta\). Le « \(J\ddot\theta\) » de première année reste exact en projection sur l'axe, même pour une pièce dont les produits d'inertie ne sont pas nuls.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉNERGIE CINÉTIQUE</div>
  <h2>Énergie cinétique d'un solide et d'un ensemble de solides</h2>
  <div class="intro">L'énergie cinétique est le scalaire qui servira dans les approches énergétiques (puissances, théorème de l'énergie cinétique, rendement : chapitre Énergétique des systèmes de solides). En 3D, elle s'obtient élégamment comme comoment de deux torseurs déjà connus.</div>

  <div class="def-box">
    <div class="formula">$$E_c(S/\mathcal R) = \frac12\int_S \vec V(M/\mathcal R)^2\,dm \qquad \text{(en J)}$$</div>
  </div>
  <div class="prop-box">
    <strong>Comoment des torseurs cinétique et cinématique</strong>, écrits au même point \(A\) (le résultat ne dépend pas de \(A\)) :
    <div class="formula">$$2E_c(S/\mathcal R) = \{\mathcal C(S/\mathcal R)\}\otimes\{\mathcal V(S/\mathcal R)\}$$</div>
    <div class="formula">$$2E_c(S/\mathcal R) = m\,\vec V(G,S/\mathcal R)\cdot\vec V(A,S/\mathcal R) + \vec\sigma(A,S/\mathcal R)\cdot\vec\Omega(S/\mathcal R)$$</div>
    Rappel, pour deux torseurs écrits au même point \(A\) :
    <div class="formula">$$\{\vec R_1, \vec M_1\}_A\otimes\{\vec R_2, \vec M_2\}_A = \vec R_1\cdot\vec M_2 + \vec R_2\cdot\vec M_1$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Retrouver la formule du comoment.</span>
    <div class="content">
      <p>Avec \(\vec V(M) = \vec V(A) + \vec\Omega\wedge\overrightarrow{AM}\) et la permutation circulaire du produit mixte :</p>
      <div class="formula">$$\vec V(M)^2 = \vec V(M)\cdot\vec V(A) + \vec V(M)\cdot(\vec\Omega\wedge\overrightarrow{AM})$$
$$\vec V(M)^2 = \vec V(M)\cdot\vec V(A) + \vec\Omega\cdot(\overrightarrow{AM}\wedge\vec V(M))$$</div>
      <p>On intègre sur \(S\) : \(2E_c = m\vec V(G)\cdot\vec V(A) + \vec\Omega\cdot\vec\sigma(A)\).</p>
    </div>
  </div>
  <h3>Cas particuliers</h3>
  <div class="formula">$$\text{En } G \text{ (König) : }\ E_c = \frac12 m\,V(G)^2 + \frac12\,\vec\Omega\cdot\overline{\overline{I}}(G,S)\,\vec\Omega$$</div>
  <div class="formula">$$A\in S \text{ fixe : }\ E_c = \frac12\,\vec\Omega\cdot\overline{\overline{I}}(A,S)\,\vec\Omega$$</div>
  <div class="prop-box">
    Avec \(\vec\Omega = p\,\vec x + q\,\vec y + r\,\vec z\) dans la base de la matrice :
    <div class="formula">$$\vec\Omega\cdot\overline{\overline{I}}\,\vec\Omega = A p^2 + B q^2 + C r^2 - 2D\,q r - 2E\,r p - 2F\,p q$$</div>
    Rotation autour d'un axe fixe \(\Delta\) : \(E_c = \frac12 J_\Delta\,\omega^2\). Translation : \(E_c = \frac12 m V^2\).
  </div>

  <h3>Ensemble de solides, inertie équivalente</h3>
  <div class="prop-box">
    L'énergie cinétique est additive : \(E_c(\Sigma/\mathcal R) = \sum_i E_c(S_i/\mathcal R)\), chaque terme étant calculé au point le plus commode pour le solide concerné. Pour un mécanisme à un seul paramètre \(q\) (souvent l'angle de l'arbre moteur), toutes les vitesses sont proportionnelles à \(\dot q\) :
    <div class="formula">$$E_c(\Sigma/\mathcal R) = \frac12 J_{eq}\,\dot q^2,\qquad J_{eq} = \sum_i J_i\left(\frac{\omega_i}{\dot q}\right)^2 + \sum_k m_k\left(\frac{V_k}{\dot q}\right)^2$$</div>
    \(J_{eq}\) est l'inertie équivalente ramenée sur \(q\) (une masse équivalente si \(q\) est une translation). Elle est constante si les rapports de transmission le sont (engrenages, poulies, vis-écrou) et dépend de la position sinon (bielle-manivelle, came).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Ordre de grandeur</span>
    <span class="prompt">Un moteur (rotor : \(J_m = 5\cdot10^{-4}\ \text{kg·m}^2\)) entraîne via un réducteur de rapport \(1/20\) une table d'inertie \(0{,}5\ \text{kg·m}^2\). Quelle inertie « voit » le moteur ?</span>
    <div class="content">
      <div class="formula">$$J_{eq} = J_m + 0{,}5\times\left(\frac{1}{20}\right)^2 = 5\cdot10^{-4} + 1{,}25\cdot10^{-3} = 1{,}75\cdot10^{-3}\ \text{kg·m}^2$$</div>
      <p>Le réducteur divise l'inertie de la charge par \(400\) : elle ne « pèse » plus que 2,5 fois le rotor. C'est une raison majeure d'interposer un réducteur.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PRINCIPE FONDAMENTAL DE LA DYNAMIQUE</div>
  <h2>Référentiel galiléen, théorèmes généraux, stratégie</h2>
  <div class="intro">Le principe fondamental relie le torseur dynamique (le mouvement) au torseur des actions extérieures (les causes). Bien l'appliquer, c'est surtout bien choisir ce qu'on isole et sur quel axe on projette.</div>

  <h3>Référentiel galiléen</h3>
  <div class="def-box">
    Il existe des référentiels, dits <strong>galiléens</strong>, dans lesquels le principe fondamental s'applique ; tout référentiel en translation rectiligne uniforme par rapport à un référentiel galiléen l'est aussi. En sciences industrielles, le repère lié au bâti (donc à la Terre) est considéré comme galiléen : la rotation terrestre (\(\approx 7{,}3\cdot10^{-5}\ \text{rad·s}^{-1}\)) produit des effets négligeables devant les accélérations des mécanismes.
  </div>

  <h3>Énoncé et théorèmes généraux</h3>
  <div class="prop-box">
    Pour tout ensemble matériel \(E\), dans un référentiel galiléen \(\mathcal R_g\), les deux torseurs étant écrits au même point :
    <div class="formula">$$\{\mathcal D(E/\mathcal R_g)\} = \{\mathcal T(\bar E\to E)\}$$</div>
    <div class="formula">$$\text{TRD : }\ m\,\vec\Gamma(G,E/\mathcal R_g) = \vec R(\bar E\to E)$$</div>
    <div class="formula">$$\text{TMD : }\ \vec\delta(A,E/\mathcal R_g) = \vec M(A,\bar E\to E)\quad \text{pour tout point } A$$</div>
    Un isolement fournit 6 équations scalaires en 3D (3 pour un problème plan). La statique est le cas particulier \(\{\mathcal D\} = \{0\}\) : équilibre, ou quantités dynamiques négligeables.
  </div>
  <h3>Actions réciproques</h3>
  <div class="prop-box">
    En appliquant le PFD à \(E_1\), à \(E_2\) et à \(E_1\cup E_2\), on obtient \(\{\mathcal T(E_1\to E_2)\} = -\{\mathcal T(E_2\to E_1)\}\). Conséquence : les actions <em>intérieures</em> à l'ensemble isolé n'apparaissent pas dans son bilan.
  </div>

  <h3>Stratégie : quel isolement, quelle équation ?</h3>
  <p>On distingue deux types de problèmes : <strong>efforts connus, mouvement inconnu</strong> (on cherche la loi de mouvement : équations différentielles) et <strong>mouvement imposé, efforts inconnus</strong> (on dimensionne un actionneur ou une liaison : la loi de mouvement est donnée par le cahier des charges).</p>
  <div style="overflow-x:auto;margin:.6rem 0">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid)">Je cherche…</th><th style="padding:.35rem;border:1px solid var(--grid)">J'isole…</th><th style="padding:.35rem;border:1px solid var(--grid)">J'écris…</th></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">le couple moteur d'une pivot, ou la loi de mouvement de son paramètre</td><td style="padding:.35rem;border:1px solid var(--grid)">l'ensemble situé en aval de la pivot</td><td style="padding:.35rem;border:1px solid var(--grid)">TMD en un point de l'axe, projeté sur l'axe</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">l'effort d'un vérin le long d'une glissière, ou la loi de mouvement correspondante</td><td style="padding:.35rem;border:1px solid var(--grid)">l'ensemble situé en aval de la glissière</td><td style="padding:.35rem;border:1px solid var(--grid)">TRD projeté sur la direction de la glissière</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">les actions dans les paliers d'un arbre</td><td style="padding:.35rem;border:1px solid var(--grid)">l'arbre et ce qu'il porte</td><td style="padding:.35rem;border:1px solid var(--grid)">les équations restantes (TRD et TMD transverses)</td></tr>
      <tr><td style="padding:.35rem;border:1px solid var(--grid)">la loi de mouvement d'un mécanisme à un seul paramètre, sans demander les efforts de liaison</td><td style="padding:.35rem;border:1px solid var(--grid)">tout le mécanisme mobile</td><td style="padding:.35rem;border:1px solid var(--grid)">théorème de l'énergie cinétique (chapitre Énergétique des systèmes de solides)</td></tr>
    </table>
  </div>
  <p>Le théorème de l'énergie cinétique se déduit du principe fondamental : il n'apporte qu'<strong>une</strong> équation scalaire, et rien de nouveau. Son intérêt est pratique : appliqué à tout le mécanisme, il élimine d'un coup les actions des liaisons parfaites et évite d'isoler les solides un par un quand seule la loi de mouvement est demandée (réducteur et charge, bielle-manivelle, chariot entraîné par courroie). Pour les efforts de liaison, on revient au principe fondamental, solide par solide.</p>
  <div class="prop-box">
    Une liaison parfaite ne transmet aucun effort selon ses mobilités : la projection « sur la mobilité » l'élimine. Dans une chaîne ouverte, on isole successivement depuis l'extrémité. Toujours commencer par le <strong>graphe de structure</strong> et le décompte inconnues / équations ; écrire les moments en un point où passent beaucoup d'inconnues, ou en \(G\) / en un point fixe pour simplifier \(\vec\delta\).
  </div>

  <h3>Positions d'équilibre et linéarisation</h3>
  <div class="prop-box">
    <ul style="margin:.4rem 0">
      <li><strong>Position d'équilibre</strong> : on pose \(q = q_e\) constant (\(\dot q = \ddot q = 0\)) dans les équations du mouvement ; il reste une équation algébrique, souvent trigonométrique, en \(q_e\).</li>
      <li><strong>Linéarisation</strong> autour de \(q_e\) : \(q = q_e + \varepsilon\) avec \(\varepsilon\) petit ; développer au premier ordre (\(\sin(q_e+\varepsilon) \approx \sin q_e + \varepsilon\cos q_e\), \(\cos(q_e+\varepsilon) \approx \cos q_e - \varepsilon\sin q_e\)) et négliger les produits de petites quantités (\(\varepsilon^2\), \(\dot\varepsilon^2\), \(\varepsilon\ddot\varepsilon\)…).</li>
      <li><strong>Point de fonctionnement</strong> (vitesse \(\omega_0\), couple \(C_0\)…) : on pose \(\omega = \omega_0 + \Delta\omega\), \(C = C_0 + \Delta C\), on retranche l'équation du régime établi et on garde le premier ordre.</li>
    </ul>
    On obtient une équation différentielle linéaire à coefficients constants, d'où une fonction de transfert (lien avec les SLCI). Pour \(J\ddot\varepsilon + k\,\varepsilon = 0\) : équilibre stable si \(k > 0\) (oscillations, non amorties en l'absence de frottement), instable si \(k \lt 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un bras d'inertie \(J\) autour d'un axe horizontal fixe, de centre d'inertie à la distance \(a\) de l'axe, est actionné par un couple \(C\) ; \(\theta\) est mesuré depuis l'horizontale : \(J\ddot\theta = C - mga\cos\theta\). Linéariser autour de \(\theta_0\).</span>
    <div class="content">
      <p>Équilibre : \(C_0 = mga\cos\theta_0\). Avec \(\theta = \theta_0 + \varepsilon\) et \(C = C_0 + \Delta C\), au premier ordre :</p>
      <div class="formula">$$J\ddot\varepsilon = C_0 + \Delta C - mga(\cos\theta_0 - \varepsilon\sin\theta_0)$$</div>
      <p>et, puisque \(C_0 = mga\cos\theta_0\) :</p>
      <div class="formula">$$J\ddot\varepsilon - mga\sin\theta_0\,\varepsilon = \Delta C \quad\Rightarrow\quad \frac{\varepsilon(p)}{\Delta C(p)} = \frac{1}{J p^2 - mga\sin\theta_0}$$</div>
      <p>Bras au-dessus de l'horizontale (\(\sin\theta_0 > 0\)) : un pôle réel positif, équilibre instable sans asservissement. Bras pendant (\(\theta_0 = -\pi/2\)) : oscillations de pulsation \(\sqrt{mga/J}\).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · ROTATION AUTOUR D'UN AXE FIXE · ÉQUILIBRAGE</div>
  <h2>Actions dans les paliers, équilibrage statique et dynamique</h2>
  <div class="intro">Roues, broches, turbines, tambours de machine à laver : les rotors tournent vite. Un petit défaut de répartition de masse crée des efforts tournants dans les paliers, sources de vibrations, de bruit et d'usure. Le PFD permet de les chiffrer et de dire comment les supprimer.</div>

  <h3>Modèle</h3>
  <p>Un solide \(1\) est en liaison pivot d'axe \((O,\vec z_0)\) avec un bâti \(0\) galiléen ; \(\theta = (\vec x_0,\vec x_1)\), base liée \((\vec x_1,\vec y_1,\vec z_0)\), \(\overrightarrow{OG} = a\,\vec x_1 + b\,\vec y_1 + c\,\vec z_0\), matrice d'inertie en \(O\) quelconque (notations du §2) dans la base liée.</p>
  <h3>Torseur dynamique en \(O\)</h3>
  <div class="formula">$$m\,\vec\Gamma(G,1/0) = m\left[(-b\ddot\theta - a\dot\theta^2)\,\vec x_1 + (a\ddot\theta - b\dot\theta^2)\,\vec y_1\right]$$</div>
  <div class="formula">$$\vec\delta(O,1/0) = (-E\ddot\theta + D\dot\theta^2)\,\vec x_1 + (-D\ddot\theta - E\dot\theta^2)\,\vec y_1 + C\ddot\theta\,\vec z_0$$</div>
  <p>Le moment s'obtient en dérivant \(\vec\sigma(O,1/0) = \dot\theta(-E\,\vec x_1 - D\,\vec y_1 + C\,\vec z_0)\) avec \(\frac{d\vec x_1}{dt} = \dot\theta\,\vec y_1\) et \(\frac{d\vec y_1}{dt} = -\dot\theta\,\vec x_1\).</p>

  <h3>Conséquences pour les paliers</h3>
  <div class="prop-box">
    La projection du TMD sur \(\vec z_0\) donne la loi de mouvement (\(C\ddot\theta = \) somme des couples sur l'axe). Les quatre équations transverses (TRD sur \(\vec x_1\), \(\vec y_1\) ; TMD sur \(\vec x_1\), \(\vec y_1\)) donnent les actions radiales des paliers. Elles contiennent des termes en \(\dot\theta^2\) fixes dans la base \(1\), donc <strong>tournant</strong> avec le rotor dans le bâti : efforts périodiques à la fréquence de rotation, d'où vibrations.
  </div>
  <h3>Conditions d'équilibrage</h3>
  <div class="def-box">
    <ul style="margin:.4rem 0">
      <li><strong>Équilibrage statique</strong> : \(G\) sur l'axe de rotation (\(a = b = 0\)). La résultante dynamique est nulle. Vérifiable à l'arrêt : le rotor reste en équilibre dans toute position.</li>
      <li><strong>Équilibrage dynamique</strong> : en plus, l'axe de rotation est axe principal d'inertie (\(D = E = 0\)). Alors \(\vec\delta(O,1/0) = C\ddot\theta\,\vec z_0\) : les paliers ne subissent plus d'effort dû à la rotation. Ne se détecte qu'en rotation.</li>
    </ul>
    Bilan : un rotor est parfaitement équilibré si son axe de rotation est un <strong>axe principal central d'inertie</strong>.
  </div>
  <figure class="schema">
  <svg viewBox="0 0 320 190" role="img" aria-label="Disque calé de travers sur un arbre guidé par deux paliers">

  </figure>

  <h3>Réalisation pratique</h3>
  <div class="prop-box">
    On ajoute (ou on enlève) des masses ponctuelles \(\mu_k\) aux points \((x_k, y_k, z_k)\) de la base liée. Conditions à satisfaire :
    <div class="formula">$$\text{statique : }\ m\,a + \sum_k \mu_k x_k = 0,\qquad m\,b + \sum_k \mu_k y_k = 0$$
$$\text{dynamique (en plus) : }\ E + \sum_k \mu_k z_k x_k = 0,\qquad D + \sum_k \mu_k y_k z_k = 0$$</div>
    Quatre conditions : une masse dans un seul plan peut corriger un défaut statique, mais l'équilibrage dynamique exige <strong>deux masses dans deux plans distincts</strong> (masselottes des deux côtés d'une jante sur une équilibreuse de roues).
  </div>
  <div class="notice"><strong>Ordres de grandeur.</strong> Un balourd \(m\,e\) crée un effort tournant \(F = m\,e\,\omega^2\), proportionnel au carré de la vitesse. Rotor de 100 kg dont \(G\) est décalé de 0,1 mm, à 3 000 tr/min (\(\omega \approx 314\ \text{rad·s}^{-1}\)) : \(F \approx 100\times10^{-4}\times314^2 \approx 1\ \text{kN}\), autant que son poids. Roue de voiture (rayon 0,3 m) à 130 km/h (\(\omega \approx 120\ \text{rad·s}^{-1}\)) avec une masselotte de 10 g manquante à 0,2 m de l'axe : \(F \approx 29\ \text{N}\) tournants, ressentis dans le volant.</div>
</div>

<template class="pan-tpl" data-panneau="dy2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CINÉTIQUE ET DYNAMIQUE 3D</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>
  <div class="intro">Dans l'ordre du cours : centre d'inertie et matrice d'inertie (§1 à §4), torseurs cinétique et dynamique (§5, §6), énergie cinétique et inertie équivalente (§7), choix des isolements et linéarisation (§8), actions dans les paliers et équilibrage (§9).</div>

  <div class="method-box">
    <strong>Méthode 1 — Centre d'inertie d'une pièce composée</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Symétries d'abord.</span> Repérer plans et axes de symétrie matérielle : \(G\) leur appartient, ce qui élimine une ou deux coordonnées sans calcul.</li>
      <li><span class="step">Découper.</span> Décomposer en formes dont le centre d'inertie est connu ; un trou est une pièce de masse négative.</li>
      <li><span class="step">Masses.</span> Calculer les \(m_i = \rho V_i\) (ou les aires et longueurs si l'épaisseur ou la section est constante).</li>
      <li><span class="step">Barycentre.</span> \(\overrightarrow{OG} = \frac{1}{m}\sum_i m_i\,\overrightarrow{OG_i}\), coordonnée par coordonnée, avec \(O\) bien choisi (sur un axe de symétrie).</li>
      <li><span class="step">Contrôle.</span> \(G\) doit tomber du côté où la matière est la plus abondante ; en cas d'intégrale, vérifier la masse totale obtenue avec les mêmes bornes.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Justifier la forme d'une matrice d'inertie, puis la calculer</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Point et base.</span> Préciser le point (souvent \(G\) ou un point de l'axe de rotation) et une base liée au solide, alignée sur ses symétries.</li>
      <li><span class="step">Zéros.</span> Chaque plan de symétrie passant par le point annule les deux produits contenant sa coordonnée normale ; un axe de révolution donne en plus deux moments égaux.</li>
      <li><span class="step">Valeurs.</span> Aux concours, les moments et produits non nuls sont fournis (énoncé, modeleur 3D) ou se déduisent des solides usuels et de Huygens (méthode 3) : le calcul intégral des éléments d'inertie n'est pas évalué. S'il faut malgré tout intégrer (pour comprendre ou contrôler) : choisir \(dm\) adapté (tranche, couronne, bande), exprimer la distance à l'axe, fixer les bornes, et vérifier la masse avec les mêmes bornes.</li>
      <li><span class="step">Raccourcis.</span> Plaque : \(C = A + B\). Révolution : \(2A + C = 2\int OM^2\,dm\) peut éviter une intégrale.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Matrice d'un solide composé en un point</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Tableau.</span> Pour chaque pièce : masse, position de \(G_i\), matrice en \(G_i\) dans sa base principale.</li>
      <li><span class="step">Même base.</span> Ramener toutes les matrices dans la base commune (\(P^{T}[I]P\) pour une pièce inclinée).</li>
      <li><span class="step">Même point.</span> Huygens de \(G_i\) vers \(O\) : \(+m_i(b_i^2+c_i^2)\) sur \(A\), \(+m_i b_i c_i\) sur \(D\), etc., avec \(\overrightarrow{OG_i} = a_i\vec x + b_i\vec y + c_i\vec z\).</li>
      <li><span class="step">Sommer</span> (et soustraire les évidements).</li>
      <li><span class="step">Piège.</span> Huygens se fait toujours depuis le centre d'inertie de la pièce concernée ; les signes des produits suivent ceux de \(b_i c_i\), \(c_i a_i\), \(a_i b_i\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Torseur cinétique puis dynamique d'un solide</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Cinématique.</span> Figures de changement de base, \(\vec\Omega(S/\mathcal R)\) par composition, \(\vec V(G,S/\mathcal R)\) par dérivation de \(\overrightarrow{OG}\) ou par transport.</li>
      <li><span class="step">Point de calcul.</span> \(G\), ou un point du solide fixe dans \(\mathcal R\) : \(\vec\sigma = \overline{\overline{I}}\,\vec\Omega\). Exprimer \(\vec\Omega\) dans la base où la matrice est connue et constante.</li>
      <li><span class="step">Dériver</span> \(\vec\sigma\) par rapport à \(\mathcal R\) composante par composante, sans oublier les dérivées des vecteurs de base mobiles. Si une seule projection est utile, dériver la projection (§6).</li>
      <li><span class="step">Transporter</span> si besoin : \(\vec\delta(B) = \vec\delta(A) + \overrightarrow{BA}\wedge m\,\vec\Gamma(G)\).</li>
      <li><span class="step">Contrôle.</span> Homogénéité (N·m), cas particulier simple (rotation pure autour d'un axe principal : \(\vec\delta = J\ddot\theta\,\vec z\)).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Énergie cinétique d'un mécanisme, inertie équivalente</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Solide par solide.</span> Pour chacun, choisir la formule la plus simple : rotation autour d'un axe fixe, translation, ou König en \(G\).</li>
      <li><span class="step">Lois entrée-sortie.</span> Exprimer toutes les vitesses en fonction du paramètre choisi \(\dot q\) (rapports de réduction, roulement sans glissement, pas de vis).</li>
      <li><span class="step">Factoriser</span> \(E_c = \frac12 J_{eq}\dot q^2\) et identifier \(J_{eq}\) ; vérifier si elle dépend de la position.</li>
      <li><span class="step">Piège.</span> Un solide qui tourne <em>et</em> dont le centre se déplace (satellite d'un train épicycloïdal, roue d'un véhicule) a deux contributions.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Choisir l'isolement, le théorème et la projection</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Objectif.</span> Loi de mouvement (efforts connus) ou effort inconnu (mouvement imposé) ? Lister les inconnues cherchées.</li>
      <li><span class="step">Graphe de structure.</span> Liaisons, actions extérieures, inconnues de chaque liaison.</li>
      <li><span class="step">Isolement.</span> Le plus petit ensemble pour lequel l'inconnue cherchée est extérieure et les autres inconnues gênantes intérieures ou éliminables.</li>
      <li><span class="step">Équation.</span> Pivot d'axe \((A,\vec u)\) : TMD en \(A\) projeté sur \(\vec u\). Glissière de direction \(\vec u\) : TRD projeté sur \(\vec u\). Une équation, une inconnue. Loi de mouvement d'un mécanisme à un seul paramètre, efforts de liaison non demandés : théorème de l'énergie cinétique sur tout le mécanisme (chapitre Énergétique des systèmes de solides).</li>
      <li><span class="step">Calcul de \(\vec\delta\)</span> au point choisi (méthode 4) ; vérifier le signe physique du résultat (un couple moteur positif en accélération, etc.).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Linéariser autour d'un équilibre ou d'un point de fonctionnement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Équilibre.</span> Écrire l'équation complète, puis la résoudre avec \(\dot q = \ddot q = 0\) : \(q_e\) (et l'effort d'équilibre \(F_0\) ou \(C_0\)).</li>
      <li><span class="step">Petites variations.</span> \(q = q_e + \varepsilon\), \(F = F_0 + \Delta F\) ; développer les fonctions trigonométriques au premier ordre.</li>
      <li><span class="step">Tri des termes.</span> Garder les termes d'ordre 1 en \(\varepsilon\), \(\dot\varepsilon\), \(\ddot\varepsilon\), \(\Delta F\) ; supprimer les produits (\(\dot\varepsilon^2\), \(\varepsilon\ddot\varepsilon\)…) ; les termes d'ordre 0 s'éliminent avec l'équation d'équilibre.</li>
      <li><span class="step">Exploitation.</span> Laplace (conditions initiales nulles) : fonction de transfert ; signe des coefficients : stabilité.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Calculer les actions des paliers d'un rotor et l'équilibrer</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Données d'inertie.</span> Base liée au rotor \((\vec x_1,\vec y_1,\vec z_0)\), axe de rotation \((O,\vec z_0)\) ; position de \(G\) (\(a\), \(b\)) et produits d'inertie \(D\), \(E\) en \(O\).</li>
      <li><span class="step">Torseur dynamique en \(O\).</span> \(m\vec\Gamma(G)\) par double dérivation de \(\overrightarrow{OG}\) ; \(\vec\delta(O)\) en dérivant \(\vec\sigma(O) = \dot\theta(-E\,\vec x_1 - D\,\vec y_1 + C\,\vec z_0)\) avec \(\frac{d\vec x_1}{dt} = \dot\theta\,\vec y_1\), \(\frac{d\vec y_1}{dt} = -\dot\theta\,\vec x_1\).</li>
      <li><span class="step">Paliers.</span> Projection du TMD sur \(\vec z_0\) : loi de mouvement (ou couple moteur) ; les quatre équations transverses (TRD et TMD sur \(\vec x_1\), \(\vec y_1\)) donnent les actions radiales, fixes dans la base 1, donc tournantes dans le bâti.</li>
      <li><span class="step">Équilibrer.</span> Statique : ramener \(G\) sur l'axe (\(m\,a + \sum\mu_k x_k = 0\), \(m\,b + \sum\mu_k y_k = 0\)). Dynamique : en plus, annuler \(D\) et \(E\) (\(E + \sum\mu_k z_k x_k = 0\), \(D + \sum\mu_k y_k z_k = 0\)) : deux masses dans deux plans distincts.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> un rotor de 20 kg dont \(G\) est à 0,2 mm de l'axe tourne à 1 500 tr/min (\(\omega \approx 157\ \text{rad·s}^{-1}\)) : effort tournant \(m\,e\,\omega^2 \approx 20\times2\cdot10^{-4}\times157^2 \approx 99\ \text{N}\). Une masse de correction placée à 0,10 m de l'axe, à l'opposé de \(G\) et dans le plan perpendiculaire à l'axe qui contient \(G\), vaut \(\mu = m\,e/r = 40\ \text{g}\) pour l'équilibrage statique.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Dériver un vecteur exprimé dans une base mobile comme si la base était fixe.</li>
      <li>Écrire \(\vec\sigma = J\,\vec\Omega\) alors que \(\vec\Omega\) n'est pas porté par un axe principal.</li>
      <li>Écrire \(\vec\delta(A) = \frac{d\vec\sigma(A)}{dt}\) en un point \(A\) mobile qui n'est pas \(G\) (ce n'est permis que si \(\vec V(A)\) est colinéaire à \(\vec V(G)\)).</li>
      <li>Additionner des moments, matrices ou torseurs écrits en des points ou dans des bases différents.</li>
      <li>Appliquer Huygens entre deux points dont aucun n'est \(G\).</li>
      <li>Appliquer le PFD dans un repère non galiléen ou oublier une action extérieure (poids, ressort, actions de liaison).</li>
      <li>Linéariser avant d'avoir écrit l'équation complète, ou garder un terme en \(\dot\theta^2\).</li>
    </ul>
  </div>
</div>
</template>
