  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties 1.7.1 « Champ magnétique » et 1.7.2 « Actions d'un champ magnétique » du programme de PTSI : <strong>tout y est exigible en 1ʳᵉ année</strong>, sauf la dernière section. Le programme privilégie les phénomènes, les cartes de champ, les ordres de grandeur et les expressions fournies, plutôt que le calcul des champs. Le chapitre prépare <a href="#induction/cours">« Induction électromagnétique »</a> (parties 1.7.3 à 1.7.5) et, en 2ᵉ année, <a href="#magnetostat/cours">« Magnétostatique : théorème d'Ampère »</a>, qui établit les champs admis ici. Les cartes de champ sont à explorer en trois dimensions dans l'onglet « Simulateur ».</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Ordres de grandeur</strong> : citer des valeurs de champs magnétiques au voisinage d'aimants, dans un appareil d'IRM, pour le champ terrestre (§1, §5).</li>
        <li><strong>Cartes de champ</strong> : exploiter la représentation graphique d'un champ vectoriel ; identifier les zones de champ uniforme, de champ faible et l'emplacement des sources (§2).</li>
        <li><strong>Symétries et invariances</strong> des distributions de courant : en déduire des propriétés du champ créé (§3).</li>
        <li><strong>Lien entre le champ et l'intensité</strong> : évaluer l'ordre de grandeur d'un champ à partir d'expressions fournies (§4, §5).</li>
        <li><strong>Allure des cartes</strong> de champ d'un aimant droit, d'une spire circulaire et d'une bobine longue (§4, §5).</li>
        <li><strong>Champ quasi uniforme</strong> : décrire un dispositif qui le réalise (§6).</li>
        <li><strong>Moment magnétique</strong> : le définir pour une boucle de courant plane ; l'associer à un aimant par analogie ; citer un ordre de grandeur pour un aimant usuel (§7).</li>
        <li><strong>Force de Laplace</strong> : densité linéique sur un élément de courant filiforme ; différencier le champ extérieur subi du champ propre ; établir et citer la résultante sur une barre placée dans un champ extérieur uniforme et stationnaire (§8).</li>
        <li><strong>Puissance des forces de Laplace</strong> sur une barre en translation (§9).</li>
        <li><strong>Spire rectangulaire</strong> en rotation autour d'un axe de symétrie orthogonal au champ : établir et exploiter le moment du couple en fonction du moment magnétique et du champ ; puissance (§10).</li>
        <li><strong>Aimant dans un champ uniforme</strong> : positions d'équilibre et stabilité ; boussole (§11).</li>
        <li><strong>Champ tournant</strong> : le créer à l'aide de deux ou trois bobines et mettre en rotation une aiguille aimantée (§12).</li>
      </ul>
      <p>Hors programme en PTSI (regroupé en fin de chapitre) : le calcul d'un champ par la loi de Biot et Savart (hors programme des deux années) ou par le théorème d'Ampère et la conservation du flux (2ᵉ année) ; les milieux magnétiques, le champ \(\vec H\) et les circuits magnétiques. Le couplage avec l'induction (rails de Laplace parcourus par un courant induit, moteur à courant continu, freinage) est traité dans le chapitre « Induction électromagnétique ».</p>

<div class="course-section">
  <div class="sec-num">§1 · LE CHAMP MAGNÉTIQUE ET SES SOURCES</div>
  <h2>Un champ vectoriel créé par les courants et les aimants</h2>
  <div class="intro">Une boussole s'oriente vers le nord, un aimant attire un clou, un fil parcouru par un courant fait tourner une aiguille aimantée posée à côté de lui (expérience d'Œrsted, 1820) : ces trois observations relèvent d'une même grandeur, le champ magnétique. Elle est au cœur des moteurs électriques, des haut-parleurs, de l'imagerie médicale par IRM et, avec l'induction, de la production de presque toute l'électricité.</div>
  <div class="def-box">
    <strong>Champ magnétique.</strong> En chaque point \(M\) de l'espace règne un champ magnétique \(\vec B(M)\), vecteur dont la norme se mesure en <strong>tesla</strong> (T). Ses sources sont les <strong>courants électriques</strong> (charges en mouvement) et les <strong>aimants</strong>. Le champ est <strong>stationnaire</strong> quand ses sources ne varient pas dans le temps (courants constants, aimants immobiles) : c'est le cas de ce chapitre.
  </div>
  <p><strong>Mise en évidence et mesure.</strong> Une petite aiguille aimantée, libre de tourner, s'aligne sur la direction de \(\vec B\), son pôle nord indiquant le sens du champ (§11). De la limaille de fer saupoudrée autour d'un aimant dessine les lignes de champ, sans leur sens (§2). On mesure une composante du champ avec un teslamètre, dont la sonde exploite l'effet Hall. On rencontre encore l'ancienne unité, le gauss : \(1\ \text{G} = 10^{-4}\ \text{T}\).</p>
  <div class="prop-box">
    <strong>Deux propriétés des sources.</strong>
    <ul>
      <li><strong>Proportionnalité</strong> : le champ créé par un circuit est proportionnel à l'intensité \(I\) qui le parcourt ; il change de sens quand le courant change de sens.</li>
      <li><strong>Superposition</strong> : le champ créé par plusieurs sources est la somme vectorielle des champs que créerait chacune d'elles seule.</li>
    </ul>
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Situation</th><th style="text-align:left">Champ magnétique</th></tr>
    <tr><td>Champ terrestre en France</td><td>\(\approx 47\ \mu\text{T}\), soit \(5\times10^{-5}\ \text{T}\) (composante horizontale \(\approx 21\ \mu\text{T}\))</td></tr>
    <tr><td>Fil parcouru par 1 A, à 1 cm</td><td>\(20\ \mu\text{T}\)</td></tr>
    <tr><td>Bobine de travaux pratiques</td><td>de l'ordre du mT</td></tr>
    <tr><td>Aimant usuel (ferrite), au contact</td><td>\(\approx 0{,}1\ \text{T}\)</td></tr>
    <tr><td>Aimant néodyme-fer-bore, au contact</td><td>\(0{,}5\) à \(1\ \text{T}\)</td></tr>
    <tr><td>Entrefer d'un électroaimant de laboratoire</td><td>\(\approx 1\ \text{T}\)</td></tr>
    <tr><td>IRM médicale</td><td>1,5 à 3 T (7 T et plus en recherche)</td></tr>
    <tr><td>Aimants supraconducteurs du LHC</td><td>8,3 T</td></tr>
    <tr><td>Record en champ permanent</td><td>\(\approx 45\ \text{T}\)</td></tr>
    <tr><td>Surface d'une étoile à neutrons</td><td>\(\sim 10^{8}\ \text{T}\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — une boussole faussée par un câble</strong>
    <p>Un câble vertical, parcouru par un courant montant \(I = 2{,}0\ \text{A}\), traverse une table à \(d = 3{,}0\ \text{cm}\) au nord d'une boussole. On admet l'expression du champ d'un fil rectiligne, \(B = \dfrac{\mu_0 I}{2\pi d}\) (§4), avec \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).</p>
    <ol>
      <li>Champ du câble à l'emplacement de la boussole : \(B_c = \dfrac{2\times10^{-7}\times2{,}0}{0{,}030} \approx 13\ \mu\text{T}\). Il est horizontal, orthogonal au segment câble–boussole : dirigé vers l'est (règle de la main droite, §4).</li>
      <li>L'aiguille, sur un pivot vertical, ne s'oriente que selon la <strong>composante horizontale</strong> du champ total, \(\vec B_h + \vec B_c\), où \(\vec B_h\), dirigé vers le nord, vaut \(21\ \mu\text{T}\) (superposition).</li>
      <li>Les deux champs sont orthogonaux : l'aiguille tourne vers l'est d'un angle \(\alpha\) tel que \(\tan\alpha = B_c/B_h \approx 0{,}63\), soit \(\alpha \approx 32^\circ\). Quelques ampères suffisent à fausser une boussole à quelques centimètres.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(47\ \mu\text{T}\) pour le champ qui oriente une boussole. En France, le champ terrestre plonge vers le sol d'environ \(64^\circ\) sous l'horizontale (§5) ; une boussole ordinaire ne « voit » que sa composante horizontale, d'environ \(21\ \mu\text{T}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LIGNES ET CARTES DE CHAMP</div>
  <h2>Lire une carte de champ magnétique</h2>
  <div class="intro">Comme on représente un écoulement par ses lignes de courant, on représente un champ magnétique par ses lignes de champ. Une carte bien tracée montre d'un coup d'œil où sont les sources, où le champ est intense, faible ou uniforme : c'est la première capacité du programme.</div>
  <div class="def-box">
    <strong>Ligne de champ.</strong> Courbe tangente en chacun de ses points au champ \(\vec B\), orientée dans le sens de \(\vec B\). Un <strong>tube de champ</strong> est formé des lignes de champ qui s'appuient sur une petite courbe fermée. Une <strong>carte de champ</strong> représente des lignes de champ dans un plan, choisi en général de symétrie ou d'antisymétrie (§3).
  </div>
  <div class="prop-box">
    <strong>Propriétés des lignes de champ magnétique.</strong>
    <ul>
      <li>Deux lignes de champ ne se coupent jamais, sauf en un point où le champ est <strong>nul</strong> : ailleurs, la direction de \(\vec B\) est unique.</li>
      <li>Les lignes de champ magnétique <strong>tournent autour des courants</strong> et <strong>ne partent d'aucun point</strong> : elles se referment sur elles-mêmes, ou s'en vont à l'infini. C'est une différence essentielle avec les lignes du champ électrique, qui partent des charges positives. Il n'existe pas de « charge magnétique » ; la propriété correspondante, la conservation du flux magnétique, est établie en 2ᵉ année.</li>
      <li><strong>Lignes serrées : champ intense ; lignes écartées : champ faible ; lignes parallèles et équidistantes : champ uniforme.</strong> Pour un champ plan (fils rectilignes parallèles, ci-dessous) tracé avec le même flux entre deux lignes voisines, l'écartement de deux lignes voisines est même inversement proportionnel à la norme du champ ; pour une coupe d'une distribution de révolution (spire, bobine, aimant, §4 et §5), la règle reste qualitative.</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Méthode — lire une carte de champ magnétique</strong>
    <ol>
      <li><strong>Sources</strong> : points autour desquels les lignes s'enroulent en petites boucles serrées (fils perpendiculaires au plan de la carte), ou faces par lesquelles les lignes sortent et rentrent en se resserrant (pôles d'un aimant, faces d'une bobine).</li>
      <li><strong>Sens des courants</strong> : par la règle de la main droite, à partir du sens de rotation des lignes autour d'un fil (§4).</li>
      <li><strong>Champ uniforme</strong> : régions où les lignes sont parallèles et équidistantes.</li>
      <li><strong>Champ faible, champ nul</strong> : lignes très écartées ; point où deux lignes se croisent.</li>
      <li><strong>Comparer deux intensités</strong> : rapport inverse des écartements de deux lignes voisines (carte de champ plan).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — exploiter la carte d'un fil placé dans un champ uniforme</strong>
    <p>La carte ci-dessus est calculée pour un fil rectiligne \(W\) placé dans un champ uniforme \(\vec B_0\) horizontal, de norme \(B_0 = 0{,}10\ \text{mT}\). Les points \(P\) et \(Q\) sont à \(r_0 = 2{,}0\ \text{cm}\) du fil.</p>
    <ol>
      <li><strong>Sources</strong> : les lignes s'enroulent autour de \(W\) en boucles fermées ; loin du fil, elles redeviennent parallèles et équidistantes : c'est le champ uniforme \(\vec B_0\), dirigé vers la droite d'après les flèches.</li>
      <li><strong>Sens du courant</strong> : autour de \(W\), les lignes tournent dans le sens trigonométrique ; par la règle de la main droite, le courant sort de la figure, vers le lecteur.</li>
      <li><strong>Point de champ nul</strong> : en \(P\), deux lignes se croisent, le champ du fil y compense exactement \(\vec B_0\). Avec l'expression fournie du champ d'un fil :
        <div class="formula">$$\frac{\mu_0 I}{2\pi r_0} = B_0\ \Longrightarrow\ I = \frac{2\pi r_0 B_0}{\mu_0}$$</div>
        soit \(I = \dfrac{0{,}020\times1{,}0\times10^{-4}}{2\times10^{-7}} = 10\ \text{A}\).</li>
      <li><strong>Champ intense</strong> : en \(Q\), le champ du fil a le sens de \(\vec B_0\) : \(B_Q = 2B_0 = 0{,}20\ \text{mT}\). Les lignes y sont deux fois plus serrées que loin du fil.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire un sens sur un spectre de limaille de fer, qui ne donne que la direction des lignes ; ou dessiner une ligne de champ magnétique qui part d'un point. Une carte dont une ligne magnétique commence ou s'arrête quelque part est fausse.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · SYMÉTRIES ET INVARIANCES</div>
  <h2>Prévoir la direction du champ sans calcul</h2>
  <div class="intro">Les symétries de la distribution de courant imposent la direction du champ en certains points, et ses invariances suppriment des variables. On obtient ainsi la forme du champ avant tout calcul, et l'on vérifie qu'une carte est plausible. Les règles sont <strong>inversées</strong> par rapport à celles du champ électrique : c'est le point à retenir.</div>
  <div class="def-box">
    Soit \(P'\) le symétrique d'un point \(P\) par rapport à un plan, et \(\mathcal S(\vec j)\) le symétrique d'un vecteur.
    <ul>
      <li>Un plan \(\Pi\) est un <strong>plan de symétrie</strong> des courants si le courant en \(P'\) est le symétrique du courant en \(P\), pour tout point \(P\) ;</li>
      <li>un plan \(\Pi^*\) est un <strong>plan d'antisymétrie</strong> des courants si le courant en \(P'\) est l'<strong>opposé</strong> du symétrique du courant en \(P\).</li>
    </ul>
    Un courant contenu dans un plan est inchangé par la symétrie par rapport à ce plan ; un courant qui le traverse orthogonalement est changé en son opposé.
  </div>
  <div class="prop-box">
    <strong>Conséquences pour le champ magnétique.</strong>
    <ul>
      <li>En un point \(M\) d'un <strong>plan de symétrie</strong> des courants, \(\vec B(M)\) est <strong>orthogonal</strong> à ce plan.</li>
      <li>En un point \(M\) d'un <strong>plan d'antisymétrie</strong> des courants, \(\vec B(M)\) est <strong>contenu</strong> dans ce plan.</li>
      <li>Si la distribution est <strong>invariante</strong> par translation selon un axe ou par rotation autour d'un axe, les composantes de \(\vec B\) ne dépendent pas de la coordonnée correspondante.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pourquoi des règles inversées ?</span>
    <span class="prompt">Le champ magnétique agit par un produit vectoriel.</span>
    <div class="content"><p>Le champ magnétique se manifeste par une force du type \(q\,\vec v\wedge\vec B\) (force de Lorentz, chapitre « Particules chargées ») ou \(I\,\mathrm{d}\vec\ell\wedge\vec B\) (force de Laplace, §8). Dans une symétrie plane, un produit vectoriel ne se transforme pas comme ses deux facteurs : pour que la force sur le courant symétrique soit la symétrique de la force, il faut que \(\vec B\) se transforme en l'<strong>opposé</strong> de son symétrique. En un point d'un plan de symétrie, \(\vec B\) est donc égal à l'opposé de son symétrique : sa composante parallèle au plan est nulle. Image à retenir : le plan qui contient un fil rectiligne est plan de symétrie, et le champ tourne autour du fil, donc traverse ce plan à angle droit.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — deux fils parcourus par des courants opposés</strong>
    <p>Deux fils rectilignes parallèles, distants de \(2a\), sont parcourus par \(I\) et \(-I\) (figure). On cherche le champ en un point \(M\) du plan médiateur \(\Pi^*\), à la distance \(a\) du plan des fils. Données : \(I = 5{,}0\ \text{A}\), \(a = 2{,}0\ \text{cm}\).</p>
    <ol>
      <li><strong>Plan médiateur</strong> : il échange les deux fils ; le symétrique du courant \(I\) est un courant \(I\) de même sens, alors que le second fil porte \(-I\) : c'est un plan d'<strong>antisymétrie</strong>, \(\vec B(M)\) y est contenu.</li>
      <li><strong>Plan perpendiculaire aux fils passant par \(M\)</strong> : les courants le traversent, leurs symétriques sont opposés : plan d'antisymétrie, \(\vec B(M)\) y est aussi contenu. La distribution est invariante par translation le long des fils : \(\vec B\) ne dépend pas de la position le long des fils.</li>
      <li><strong>Conclusion</strong> : \(\vec B(M)\) est porté par l'intersection des deux plans, perpendiculaire au plan des fils.</li>
      <li><strong>Valeur</strong> (superposition, expression fournie du fil) : chaque fil est à \(a\sqrt2\) de \(M\) et crée un champ de norme \(\dfrac{\mu_0 I}{2\pi a\sqrt2}\), incliné de \(45^\circ\) sur la direction trouvée. Les composantes parallèles au plan des fils se compensent, les autres s'ajoutent :
        <div class="formula">$$\begin{aligned}B(M) &= 2\times\frac{\mu_0 I}{2\pi a\sqrt2}\times\frac{1}{\sqrt2}\\ &= \frac{\mu_0 I}{2\pi a}\end{aligned}$$</div>
        soit \(B(M) = \dfrac{2\times10^{-7}\times5{,}0}{0{,}020} = 50\ \mu\text{T}\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — spire circulaire</strong>
    <ol>
      <li>Tout plan qui contient l'axe de la spire est traversé orthogonalement par les courants : c'est un plan d'antisymétrie. En un point de l'axe, \(\vec B\) est contenu dans tous ces plans : il est <strong>porté par l'axe</strong>.</li>
      <li>Le plan de la spire contient les courants : c'est un plan de symétrie. En un point de ce plan, \(\vec B\) lui est orthogonal : il est <strong>parallèle à l'axe</strong>, comme le montre la carte du §4.</li>
      <li>En un point quelconque, \(\vec B\) est contenu dans le plan qui passe par l'axe et par ce point (plan d'antisymétrie) : il n'a pas de composante orthoradiale. L'invariance par rotation autour de l'axe donne, en coordonnées cylindriques, \(\vec B = B_r(r,z)\,\vec e_r + B_z(r,z)\,\vec e_z\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer les règles du champ électrique, ou chercher les symétries du champ au lieu de celles des <strong>courants</strong>. Vérification rapide : le plan qui contient un fil rectiligne est un plan de symétrie, et le champ tourne autour du fil, donc lui est orthogonal.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · FIL RECTILIGNE, SPIRE ET BOBINE PLATE</div>
  <h2>Les sources élémentaires : cartes et expressions fournies</h2>
  <div class="intro">Le fil rectiligne et la spire circulaire sont les briques de toutes les sources de courant. Le programme de PTSI demande de connaître l'allure de leurs cartes et le sens du champ, et d'exploiter les expressions de leurs champs, qui sont <strong>fournies</strong> : celle du fil est établie en 2ᵉ année par le théorème d'Ampère, celle de la spire relève de la loi de Biot et Savart, hors programme.</div>
  <div class="prop-box">
    <strong>Règle de la main droite.</strong>
    <ul>
      <li><strong>Fil</strong> : le pouce de la main droite dans le sens du courant, les doigts repliés indiquent le sens dans lequel les lignes de champ tournent autour du fil.</li>
      <li><strong>Spire ou bobine</strong> : les doigts repliés dans le sens du courant, le pouce indique le sens du champ au centre.</li>
    </ul>
  </div>

<figcaption>Lignes de champ calculées. À gauche, fil rectiligne vu en coupe, courant sortant (⊙) : cercles centrés sur le fil, orientés par la règle de la main droite ; leurs rayons sont en progression géométrique, si bien que leur écartement, proportionnel à la distance \(r\), traduit un champ qui décroît en \(1/r\). À droite, spire circulaire coupée par un plan contenant son axe (tirets) : courant sortant en haut (⊙), entrant en bas (⊗). Près du conducteur, les lignes sont presque des cercles ; au centre, le champ est porté par l'axe, dirigé vers la droite.</figcaption>
</figure>
  <div class="prop-box">
    <strong>Champs de référence (expressions fournies).</strong> Avec \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\), perméabilité du vide :
    <ul>
      <li><strong>Fil rectiligne très long</strong>, à la distance \(r\) : champ orthoradial, de norme
        <div class="formula" data-nom="Champ d'un fil rectiligne (fourni)">$$B = \frac{\mu_0 I}{2\pi r}$$</div></li>
      <li><strong>Spire circulaire</strong> de rayon \(R\), en un point de son axe à la distance \(z\) de son centre : champ axial, de norme
        <div class="formula" data-nom="Champ sur l'axe d'une spire (fourni)">$$B(z) = \frac{\mu_0 I R^2}{2\,(R^2+z^2)^{3/2}}$$</div>
        soit, au centre :
        <div class="formula" data-nom="Champ au centre d'une spire (fourni)">$$B(0) = \frac{\mu_0 I}{2R}$$</div></li>
      <li><strong>Bobine plate</strong> de \(N\) spires jointives : \(N\) fois le champ d'une spire.</li>
    </ul>
  </div>
  <p><strong>Faces nord et sud.</strong> La face d'une spire ou d'une bobine par laquelle le champ sort est sa <strong>face nord</strong> : vu de face, le courant y tourne dans le sens trigonométrique. Par l'autre face, la face sud, le champ rentre. Une bobine se comporte ainsi comme un aimant (§5, §7).</p>
  <div class="method-box">
    <strong>Exemple — champ sur l'axe d'une bobine plate</strong>
    <p>Bobine plate de \(N = 100\) spires de rayon \(R = 5{,}0\ \text{cm}\), parcourue par \(I = 1{,}0\ \text{A}\).</p>
    <ol>
      <li>Au centre : \(B(0) = \dfrac{\mu_0 NI}{2R}\), soit \(1{,}3\ \text{mT}\), plus de vingt-cinq fois le champ terrestre.</li>
      <li>Sur l'axe, à \(z = R\) : le facteur \(\dfrac{R^3}{(R^2+z^2)^{3/2}}\) vaut \(2^{-3/2}\approx0{,}35\), d'où \(B \approx 0{,}44\ \text{mT}\) ; à \(z = 2R\), il vaut \(5^{-3/2}\approx0{,}089\), d'où \(B \approx 0{,}11\ \text{mT}\).</li>
      <li>Loin de la bobine (\(z \gg R\)), \(B \approx \dfrac{\mu_0 NIR^2}{2z^3}\) décroît en \(1/z^3\), bien plus vite que le champ d'un fil, en \(1/r\) : le champ d'une boucle de courant est très localisé.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre \(\dfrac{\mu_0 I}{2\pi r}\) (fil, à la distance \(r\)) et \(\dfrac{\mu_0 I}{2R}\) (centre d'une spire de rayon \(R\), <strong>sans</strong> \(\pi\)) ; ou laisser une distance en centimètres dans l'application numérique.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · BOBINE LONGUE, AIMANT DROIT, CHAMP TERRESTRE</div>
  <h2>Trois sources aux cartes de même allure</h2>
  <div class="intro">En empilant des spires, on obtient une bobine longue (ou solénoïde), qui produit un champ intérieur uniforme. Sa carte a la même allure que celle d'un aimant droit, et que celle de la Terre : ces trois sources se comportent de la même façon, ce que traduira la notion de moment magnétique (§7).</div>
  <div class="prop-box">
    <strong>Champ d'une bobine longue (admis en PTSI).</strong> Une bobine de \(N\) spires jointives, de longueur \(L\) grande devant son rayon \(R\), parcourue par \(I\), crée à l'intérieur, loin des extrémités, un champ <strong>uniforme</strong>, parallèle à l'axe, de norme
    <div class="formula" data-nom="Champ d'une bobine longue (admis)">$$B = \mu_0\,n\,I\qquad\text{avec}\qquad n = \frac{N}{L}$$</div>
    le nombre de spires par unité de longueur. À l'extérieur, le champ est faible devant le champ intérieur (nul dans le modèle de la bobine infinie). Sens : règle de la main droite. Ce résultat est établi en 2ᵉ année par le théorème d'Ampère.
  </div>

  <div class="prop-box">
    <strong>Aimant droit.</strong> À l'extérieur, les lignes de champ <strong>sortent par le pôle nord</strong> et <strong>rentrent par le pôle sud</strong>, comme pour la face nord et la face sud d'une bobine ; elles se referment à l'intérieur de l'aimant, du pôle sud vers le pôle nord. Les pôles ne sont pas des « charges magnétiques » : en cassant un aimant en deux, on obtient deux aimants complets, chacun avec un pôle nord et un pôle sud.
  </div>
  <div class="method-box">
    <strong>Exemple — bobine longue de travaux pratiques</strong>
    <p>Bobine de longueur \(L = 40\ \text{cm}\), de rayon \(R = 3{,}0\ \text{cm}\), comportant \(N = 200\) spires parcourues par \(I = 1{,}5\ \text{A}\).</p>
    <ol>
      <li>\(n = N/L = 500\ \text{m}^{-1}\) et \(B = \mu_0 nI \approx 0{,}94\ \text{mT}\), une vingtaine de fois le champ terrestre.</li>
      <li>Validité du modèle : pour une bobine de longueur finie, l'énoncé fournit le champ au centre, \(B = \mu_0 nI\,\dfrac{L}{\sqrt{L^2+4R^2}}\). Ici le facteur correctif vaut \(0{,}989\) : l'écart à \(\mu_0 nI\) n'est que de 1 %.</li>
      <li>Près des extrémités, le champ tombe à environ la moitié de sa valeur centrale et les lignes s'évasent (figure) : le champ n'est uniforme que dans la partie centrale.</li>
    </ol>
  </div>
  <h3>Le champ magnétique terrestre</h3>
  <p>À grande échelle, le champ terrestre a l'allure du champ d'un aimant droit placé au centre de la Terre, dont le <strong>pôle sud</strong> serait tourné vers le <strong>nord géographique</strong>. Le pôle nord d'une aiguille aimantée est attiré par ce pôle sud : il indique donc le nord. Le champ est créé par les courants électriques du noyau externe de la Terre, fait de fer liquide ; son axe est incliné d'une dizaine de degrés sur l'axe de rotation, il se déplace lentement et s'est inversé de nombreuses fois au cours des temps géologiques.</p>

  <div class="method-box">
    <strong>Exemple — composantes du champ terrestre en France</strong>
    <p>En France, \(B_T \approx 47\ \mu\text{T}\) et l'inclinaison, angle du champ avec l'horizontale, vaut \(I \approx 64^\circ\), le champ plongeant vers le sol.</p>
    <ol>
      <li>Composante horizontale, dirigée vers le nord : \(B_h = B_T\cos I \approx 21\ \mu\text{T}\) ; c'est elle qui oriente une boussole.</li>
      <li>Composante verticale, dirigée vers le bas : \(B_v = B_T\sin I \approx 42\ \mu\text{T}\), deux fois plus grande.</li>
      <li>À l'équateur magnétique, le champ est horizontal (\(\approx 30\ \mu\text{T}\)) ; près des pôles magnétiques, il est presque vertical (\(\approx 60\ \mu\text{T}\)).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appeler « pôle nord » de la Terre, au sens physique, le pôle magnétique proche du nord géographique. C'est un pôle <strong>sud</strong> au sens de l'aimant : les lignes de champ y rentrent.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · RÉALISER UN CHAMP QUASI UNIFORME</div>
  <h2>Bobine longue, bobines de Helmholtz, entrefer d'un électroaimant</h2>
  <div class="intro">Dévier un faisceau d'électrons, étalonner une sonde, étudier une boussole, réaliser une IRM : toutes ces expériences demandent un champ uniforme dans un volume donné. Le programme demande de savoir décrire un dispositif qui le réalise.</div>
  <ul>
    <li><strong>Intérieur d'une bobine longue</strong> (§5) : champ \(\mu_0 nI\) très uniforme loin des extrémités, mais dans un volume fermé, peu accessible. C'est la géométrie des aimants d'IRM, bobines supraconductrices dans lesquelles on glisse le patient.</li>
    <li><strong>Bobines de Helmholtz</strong> : deux bobines plates identiques, coaxiales, parcourues dans le même sens par le même courant, écartées d'une distance égale à leur rayon. Le champ est uniforme au voisinage du centre, dans un volume ouvert où l'on peut placer un tube à électrons ou une boussole.</li>
    <li><strong>Entrefer d'un électroaimant ou d'un aimant en U</strong> : entre deux faces polaires planes, parallèles et proches, le champ est quasi uniforme et intense (de l'ordre de 1 T), dans un petit volume.</li>

</figure>
  <div class="prop-box">
    <strong>Bobines de Helmholtz.</strong> Pour deux bobines de \(N\) spires de rayon \(R\), écartées de \(d = R\), le champ au centre vaut
    <div class="formula" data-nom="Champ au centre des bobines de Helmholtz">$$B_0 = \left(\frac45\right)^{3/2}\frac{\mu_0 NI}{R} \approx 0{,}72\,\frac{\mu_0 NI}{R}$$</div>
    Il reste égal à \(B_0\) à 1 % près sur une portion de l'axe de longueur \(0{,}6\,R\) environ, et dans une région de taille comparable autour du centre.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi un écart égal au rayon ?</span>
    <div class="content">
      <p>Avec l'expression fournie du champ sur l'axe d'une bobine (§4), placée en \(z = \pm d/2\) :</p>
      <div class="formula">$$B(z) = B_1\,\big[f(z - d/2) + f(z + d/2)\big]$$</div>
      <p>avec \(B_1 = \dfrac{\mu_0 NI}{2R}\) et \(f(u) = \Big(1 + \dfrac{u^2}{R^2}\Big)^{-3/2}\).</p>
      <p>La fonction \(B\) est paire : \(B'(0) = 0\). Sa dérivée seconde en \(0\), \(B''(0) = 2B_1f''(d/2)\), a le signe de \(f''(d/2)\) ; un calcul direct donne :</p>
      <div class="formula">$$f''(u) = \frac{3}{R^2}\Big(\frac{4u^2}{R^2} - 1\Big)\Big(1+\frac{u^2}{R^2}\Big)^{-7/2}$$</div>
      <p>qui s'annule pour \(u = R/2\). Avec \(d = R\), on a donc \(B''(0) = 0\) : le développement de \(B\) autour du centre n'a pas de terme en \(z^2\), le premier écart est en \(z^4\), et le champ est remarquablement plat. Enfin, au centre :</p>
      <div class="formula">$$\begin{aligned}B(0) &= 2\times\frac{\mu_0 NI}{2R}\Big(1 + \frac14\Big)^{-3/2}\\ &= \Big(\frac45\Big)^{3/2}\frac{\mu_0 NI}{R}\end{aligned}$$</div>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — bobines de Helmholtz de travaux pratiques</strong>
    <p>Deux bobines de \(N = 130\) spires, de rayon \(R = 15\ \text{cm}\), écartées de \(15\ \text{cm}\), parcourues par \(I = 1{,}0\ \text{A}\).</p>
    <ol>
      <li>\(B_0 = 0{,}716\times\dfrac{\mu_0 NI}{R}\), soit \(B_0 \approx 0{,}78\ \text{mT}\).</li>
      <li>Zone d'uniformité à 1 % : \(|z| \lt 0{,}31\,R \approx 4{,}7\ \text{cm}\) de part et d'autre du centre, soit près de 10 cm le long de l'axe.</li>
      <li>Pour obtenir \(1{,}0\ \text{mT}\), il faut \(I = 1{,}0/0{,}78 \approx 1{,}3\ \text{A}\) ; pour compenser la composante horizontale du champ terrestre (\(21\ \mu\text{T}\)), quelques dizaines de milliampères suffisent.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écarter davantage les bobines « pour agrandir la zone uniforme ». Écartées de \(2R\), elles laissent au centre un creux d'environ un tiers (figure) ; trop rapprochées, elles donnent une bosse. L'écart \(d = R\) est le compromis optimal.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · MOMENT MAGNÉTIQUE</div>
  <h2>Résumer une boucle de courant ou un aimant par un vecteur</h2>
  <div class="intro">Loin d'une petite boucle de courant, et pour les actions qu'elle subit dans un champ uniforme, seuls comptent son intensité, son aire et son orientation : on les rassemble dans un vecteur, le moment magnétique. Un aimant se décrit de la même façon : c'est ce qui unifie bobines, aimants, aiguilles de boussole et planètes.</div>
  <div class="def-box">
    <strong>Moment magnétique d'une boucle plane.</strong> Une boucle plane d'aire \(S\), parcourue par l'intensité \(I\), a pour moment magnétique
    <div class="formula" data-nom="Moment magnétique d'une boucle">$$\vec{\mathcal M} = I\,S\,\vec n\qquad(\text{A·m}^2)$$</div>
    où la normale unitaire \(\vec n\) est orientée par la <strong>règle de la main droite</strong> à partir du sens du courant : doigts repliés dans le sens du courant, pouce selon \(\vec n\). Pour une bobine plate de \(N\) spires : \(\vec{\mathcal M} = N I S\,\vec n\).
  </div>

  <div class="prop-box">
    <strong>Aimant et boucle de courant.</strong> Un aimant possède un moment magnétique \(\vec{\mathcal M}\), dirigé de son pôle sud vers son pôle nord. À grande distance, son champ est celui d'une boucle de courant de même moment, et dans un champ uniforme il subit les mêmes actions (§10, §11). Microscopiquement, le magnétisme d'un aimant vient des moments magnétiques de ses électrons, alignés par milliards de milliards.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Objet</th><th style="text-align:left">Moment magnétique</th></tr>
    <tr><td>Électron (magnéton de Bohr)</td><td>\(9{,}3\times10^{-24}\ \text{A·m}^2\)</td></tr>
    <tr><td>Aiguille de boussole</td><td>de l'ordre de \(10^{-2}\ \text{A·m}^2\)</td></tr>
    <tr><td>Aimant usuel de quelques cm³</td><td>de l'ordre de \(1\ \text{A·m}^2\)</td></tr>
    <tr><td>Terre</td><td>\(8\times10^{22}\ \text{A·m}^2\)</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — un aimant vu comme une bobine</strong>
    <p>Un cube de néodyme-fer-bore de \(1\ \text{cm}^3\) a un moment magnétique d'environ \(1{,}0\ \text{A·m}^2\) (valeur fournie par le fabricant).</p>
    <ol>
      <li>Bobine plate de \(N = 100\) spires de rayon \(5{,}0\ \text{cm}\), parcourue par \(1{,}0\ \text{A}\) : \(\mathcal M = NI\pi R^2 \approx 0{,}79\ \text{A·m}^2\). Le petit cube vaut à lui seul une bobine de 100 spires de 10 cm de diamètre.</li>
      <li>Une boucle unique de la taille d'une face du cube (\(S = 1\ \text{cm}^2\)) devrait porter \(I = \mathcal M/S \approx 1\times10^{4}\ \text{A}\) : les « courants équivalents » d'un aimant sont énormes, ce qu'aucun fil de cuivre ne supporterait. D'où l'intérêt des aimants dans les petits moteurs.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : orienter \(\vec n\) au hasard. Le sens de \(\vec{\mathcal M}\) est fixé par le sens du courant ; il est dirigé vers la face nord de la boucle, celle par laquelle sort le champ.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · FORCE DE LAPLACE</div>
  <h2>La force exercée par un champ magnétique sur un courant</h2>
  <div class="intro">Un conducteur parcouru par un courant et placé dans un champ magnétique subit une force : c'est le principe des moteurs, des haut-parleurs et des disjoncteurs magnétiques. Le programme demande son expression locale et sa résultante sur une barre rectiligne dans un champ uniforme.</div>
  <div class="def-box">
    <strong>Force de Laplace.</strong> Un élément de circuit filiforme de longueur \(\mathrm{d}\ell\), parcouru par l'intensité \(I\), placé dans un champ magnétique <strong>extérieur</strong> \(\vec B\), subit la force
    <div class="formula" data-nom="Force de Laplace élémentaire">$$\mathrm{d}\vec F = I\,\mathrm{d}\vec\ell\wedge\vec B$$</div>
    où \(\mathrm{d}\vec\ell\) est orienté dans le sens choisi pour compter \(I\). La densité linéique de force, \(\dfrac{\mathrm{d}\vec F}{\mathrm{d}\ell} = I\,\vec t\wedge\vec B\) (\(\vec t\) vecteur unitaire tangent), est perpendiculaire au conducteur et au champ.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Origine microscopique</span>
    <span class="prompt">La force de Laplace, somme des forces de Lorentz sur les porteurs de charge</span>
    <div class="content"><p>Dans un conducteur de section \(s\), les porteurs de charge \(q\), au nombre de \(n\) par unité de volume, se déplacent à la vitesse moyenne \(\vec v\) parallèle au fil. Un tronçon de longueur \(\mathrm{d}\ell\) en contient \(n\,s\,\mathrm{d}\ell\), qui subissent chacun la force magnétique \(q\,\vec v\wedge\vec B\) (chapitre « Particules chargées »). Leur somme vaut \(n\,s\,\mathrm{d}\ell\,q\,\vec v\wedge\vec B\). Or l'intensité est \(I = nqvs\) et \(\vec v\,\mathrm{d}\ell = v\,\mathrm{d}\vec\ell\) : on retrouve \(I\,\mathrm{d}\vec\ell\wedge\vec B\). Les porteurs transmettent cette force au réseau du métal, donc au conducteur.</p></div>
  </div>
  <div class="prop-box">
    <strong>Champ extérieur et champ propre.</strong> Dans \(\mathrm{d}\vec F = I\,\mathrm{d}\vec\ell\wedge\vec B\), \(\vec B\) est le champ <strong>extérieur</strong>, créé par les autres sources (aimant, bobine, Terre, autre circuit). Le champ propre, créé par le conducteur lui-même, ne lui imprime aucune force d'ensemble : les actions qu'exercent les uns sur les autres les éléments d'un même conducteur se compensent deux à deux. Près d'un fil, le champ propre peut pourtant être bien plus intense que le champ extérieur : il ne faut pas l'en ajouter.
  </div>
  <div class="method-box">
    <strong>Établir la résultante sur une barre rectiligne</strong> (champ extérieur uniforme et stationnaire)
    <ol>
      <li>La barre \(AB\), de longueur \(\ell\), est parcourue par \(I\) de \(A\) vers \(B\) ; tous ses éléments \(\mathrm{d}\vec\ell\) sont orientés de \(A\) vers \(B\).</li>
      <li>\(\vec B\) étant uniforme, on le sort de l'intégrale :
        <div class="formula">$$\begin{aligned}\vec F &= \int_A^B I\,\mathrm{d}\vec\ell\wedge\vec B\\ &= I\Big(\int_A^B\mathrm{d}\vec\ell\Big)\wedge\vec B\end{aligned}$$</div></li>
      <li>La somme des éléments vaut \(\overrightarrow{AB}\) :
        <div class="formula" data-nom="Résultante de Laplace sur une barre">$$\vec F = I\,\overrightarrow{AB}\wedge\vec B$$</div>
        de norme \(F = I\ell B\sin\alpha\), où \(\alpha\) est l'angle entre la barre et le champ. Les forces élémentaires étant identiques, la résultante s'applique au milieu de la barre.</li>
    </ol>
    <p>Le même calcul vaut pour un fil de forme quelconque allant de \(A\) à \(B\). Pour un circuit <strong>fermé</strong> (\(B = A\)) dans un champ uniforme, la résultante est nulle : le champ ne peut que le faire tourner (§10).</p>
  </div>
  <p><strong>Sens de la force.</strong> Celui du produit vectoriel, que l'on visualise par la règle des trois doigts de la main droite : pouce selon le courant \(I\,\mathrm{d}\vec\ell\), index selon \(\vec B\), majeur selon \(\vec F\).</p>
  <div class="method-box">
    <strong>Exemple — barre dans l'entrefer d'un aimant en U</strong>
    <p>Une barre horizontale traverse l'entrefer d'un aimant en U, où règne un champ vertical uniforme \(B = 0{,}10\ \text{T}\) sur une longueur \(\ell = 10\ \text{cm}\) ; elle est parcourue par \(I = 5{,}0\ \text{A}\).</p>
    <ol>
      <li>Barre et champ sont orthogonaux : \(F = I\ell B = 0{,}050\ \text{N}\), horizontale et perpendiculaire à la barre.</li>
      <li>Le poids d'une barre de \(10\ \text{g}\) vaut \(0{,}098\ \text{N}\) : la force de Laplace est du même ordre. Ces forces sont modestes, sauf pour de forts courants ou de forts champs.</li>
      <li>Inverser le courant ou retourner l'aimant inverse la force ; faire les deux la laisse inchangée.</li>
    </ol>
  </div>
  <h3>Force entre deux fils parallèles</h3>
  <p>Deux fils rectilignes parallèles, distants de \(d\), parcourus par \(I_1\) et \(I_2\) : le fil 2 est placé dans le champ extérieur du fil 1, \(B_1 = \dfrac{\mu_0 I_1}{2\pi d}\), orthogonal au fil 2. Une longueur \(\ell\) du fil 2 subit donc la force</p>
  <div class="formula" data-nom="Force entre deux fils parallèles">$$\frac{F}{\ell} = I_2 B_1 = \frac{\mu_0 I_1 I_2}{2\pi d}$$</div>
  <p>Les fils s'<strong>attirent</strong> si les courants sont de même sens et se <strong>repoussent</strong> s'ils sont de sens opposés (règle des trois doigts). Pour \(1\ \text{A}\) dans chaque fil et \(d = 1\ \text{m}\), \(F/\ell = 2\times10^{-7}\ \text{N·m}^{-1}\) : c'était la définition de l'ampère jusqu'en 2019.</p>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\vec B\wedge I\,\mathrm{d}\vec\ell\) (force de sens opposé) ; orienter \(\mathrm{d}\vec\ell\) sans tenir compte du sens de \(I\) ; ou ajouter au champ extérieur le champ propre du conducteur.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · PUISSANCE DES FORCES DE LAPLACE ET EFFET MOTEUR</div>
  <h2>Mettre une barre en mouvement : les rails de Laplace</h2>
  <div class="intro">Une force qui déplace son point d'application travaille : la force de Laplace peut convertir de l'énergie électrique en énergie mécanique. C'est l'effet moteur, que les rails de Laplace montrent sous sa forme la plus simple.</div>
  <p><strong>Dispositif.</strong> Une barre conductrice \(PQ\), de masse \(m\), glisse sans frottement sur deux rails horizontaux parallèles distants de \(\ell\), dans un champ uniforme et stationnaire \(\vec B = B\,\vec e_z\) vertical, dirigé vers le haut. Un générateur fait circuler l'intensité \(I\), de \(Q\) vers \(P\) dans la barre. L'axe \(Ox\) est parallèle aux rails.</p>

  <div class="prop-box">
    <strong>Force et puissance.</strong> La force de Laplace sur la barre vaut \(\vec F = I\,\overrightarrow{QP}\wedge\vec B = I\ell B\,\vec e_x\) : elle est parallèle aux rails. Sa puissance, quand la barre avance à la vitesse \(\vec v = v\,\vec e_x\), est
    <div class="formula" data-nom="Puissance de la force de Laplace sur une barre">$$\mathcal P = \vec F\cdot\vec v = I\,\ell\,B\,v$$</div>
    Si \(\mathcal P \gt 0\), la force est motrice : le dispositif convertit de l'énergie électrique en énergie mécanique, c'est l'<strong>effet moteur</strong>. Si \(\mathcal P \lt 0\), elle est résistante.
  </div>
  <div class="method-box">
    <strong>Exemple — démarrage d'une barre</strong>
    <p>Barre de masse \(m = 20\ \text{g}\), rails distants de \(\ell = 8{,}0\ \text{cm}\), \(B = 0{,}15\ \text{T}\), intensité maintenue à \(I = 4{,}0\ \text{A}\). La barre part du repos.</p>
    <ol>
      <li>Force : \(F = I\ell B = 48\ \text{mN}\). Le poids et la réaction des rails se compensent ; le principe fondamental de la dynamique projeté sur \(\vec e_x\) donne \(m\dot v = F\), soit une accélération \(F/m = 2{,}4\ \text{m·s}^{-2}\).</li>
      <li>Après \(0{,}50\ \text{s}\) : \(v = 1{,}2\ \text{m·s}^{-1}\), et la puissance de la force de Laplace vaut \(\mathcal P = Fv \approx 58\ \text{mW}\).</li>
      <li>Ce modèle néglige l'induction : dès que la barre bouge, une force électromotrice induite apparaît dans le circuit et réduit le courant, si bien que la barre tend vers une vitesse limite. Ce couplage est étudié dans le chapitre <a href="#induction/cours">« Induction électromagnétique »</a>, qui établit aussi la conversion de puissance \(\mathcal P_{\text{Laplace}} + e\,i = 0\).</li>
    </ol>
  </div>
  <h3>Le haut-parleur électrodynamique</h3>
  <p>Un aimant cylindrique crée, dans un entrefer annulaire, un champ <strong>radial</strong> de norme \(B\). Une bobine mobile de \(N\) spires de rayon \(a\), solidaire de la membrane, est placée dans cet entrefer. Chaque élément de fil, orthoradial, est orthogonal au champ radial : toutes les forces élémentaires sont axiales et de même sens, et leur somme vaut \(F = I\,(2\pi a N)\,B\). Un courant alternatif fait vibrer la membrane à sa fréquence : le signal électrique devient un son.</p>
  <div class="method-box">
    <strong>Exemple — force motrice d'un haut-parleur</strong>
    <p>\(N = 50\) spires de rayon \(a = 1{,}5\ \text{cm}\), \(B = 1{,}0\ \text{T}\), \(I = 0{,}50\ \text{A}\) : la longueur de fil dans l'entrefer est \(2\pi aN \approx 4{,}7\ \text{m}\), et \(F \approx 0{,}50\times4{,}7\times1{,}0 \approx 2{,}4\ \text{N}\), largement de quoi accélérer une membrane de quelques grammes.</p>
  </div>
  <p>Le moteur à courant continu repose sur le même principe : des conducteurs parcourus par un courant dans le champ d'un aimant, dans une géométrie de rotation. Son fonctionnement, qui fait intervenir l'induction, est étudié dans le chapitre « Induction électromagnétique ».</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que la force de Laplace est toujours motrice. Elle l'est quand le courant est imposé par un générateur dans le bon sens ; quand le courant est induit par le mouvement lui-même, elle s'oppose toujours au mouvement (loi de Lenz, chapitre « Induction électromagnétique »).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · COUPLE SUR UNE SPIRE RECTANGULAIRE</div>
  <h2>Un cadre mobile autour d'un axe : le couple magnétique</h2>
  <div class="intro">Dans un champ uniforme, un circuit fermé ne subit aucune force d'ensemble (§8), mais il peut tourner. Le programme étudie un cadre rectangulaire mobile autour d'un axe : c'est le modèle du rotor d'un moteur, et il conduit à l'expression générale du couple magnétique \(\vec{\mathcal M}\wedge\vec B\).</div>
  <p><strong>Dispositif.</strong> Un cadre rectangulaire de côtés \(a\) et \(b\), parcouru par \(I\), peut tourner autour d'un axe fixe \(\Delta\) passant par les milieux des côtés de longueur \(b\) : les côtés de longueur \(a\) sont parallèles à \(\Delta\). Le champ \(\vec B\) est uniforme, stationnaire et orthogonal à \(\Delta\). On oriente \(\Delta\) par un vecteur unitaire \(\vec e_\Delta\), et l'on repère la position du cadre par l'angle \(\theta = (\vec B, \vec n)\), orienté par \(\vec e_\Delta\), entre le champ et la normale au cadre ; le moment magnétique du cadre est \(\vec{\mathcal M} = Iab\,\vec n\).</p>

<figcaption>Cadre rectangulaire (côtés \(a\) parallèles à l'axe \(\Delta\), côtés \(b\) perpendiculaires) parcouru par \(I\), dans un champ uniforme \(\vec B\) orthogonal à \(\Delta\) ; \(\theta\) est l'angle de \(\vec B\) à la normale \(\vec n\). Les forces \(\vec F_1\) et \(\vec F_2\) sur les côtés parallèles à \(\Delta\) sont opposées et forment un couple qui fait tourner \(\vec n\) vers \(\vec B\) ; les forces sur les deux autres côtés sont portées par \(\Delta\) et n'ont pas de moment par rapport à cet axe.</figcaption>
</figure>
  <div class="method-box">
    <strong>Établir le moment du couple</strong>
    <ol>
      <li><strong>Côtés de longueur \(b\)</strong>, orthogonaux à \(\Delta\) comme le champ : \(\mathrm{d}\vec\ell\wedge\vec B\) est parallèle à \(\Delta\). Une force parallèle à un axe a un moment nul par rapport à cet axe : ces deux côtés ne font pas tourner le cadre.</li>
      <li><strong>Côtés de longueur \(a\)</strong>, parallèles à \(\Delta\) donc orthogonaux à \(\vec B\) : ils subissent des forces \(\vec F_1\) et \(\vec F_2 = -\vec F_1\) de norme \(IaB\), orthogonales au champ. Leur résultante est nulle : elles forment un <strong>couple</strong>.</li>
      <li><strong>Bras de levier</strong> : chaque côté est à la distance \(b/2\) de l'axe ; la distance de \(\Delta\) à la droite d'action de chaque force vaut \(\dfrac b2|\sin\theta|\). Le moment total des deux forces est \(2\times IaB\times\dfrac b2|\sin\theta| = IabB|\sin\theta|\).</li>
      <li><strong>Signe</strong> : le couple fait tourner \(\vec n\) vers \(\vec B\), donc fait diminuer \(\theta\) quand \(0 \lt \theta \lt \pi\) :
        <div class="formula" data-nom="Moment du couple sur un cadre">$$\Gamma_\Delta = -\,\mathcal M\,B\,\sin\theta$$</div>
        avec \(\mathcal M = Iab\).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Couple magnétique.</strong> Dans un champ uniforme, une boucle de courant plane (et, par analogie, un aimant) de moment magnétique \(\vec{\mathcal M}\) subit des actions de résultante nulle et de moment
    <div class="formula" data-nom="Couple magnétique">$$\vec\Gamma = \vec{\mathcal M}\wedge\vec B$$</div>
    Sa projection sur l'axe de rotation est \(\Gamma_\Delta = \vec\Gamma\cdot\vec e_\Delta = -\mathcal M B\sin\theta\). Ce couple tend à aligner \(\vec{\mathcal M}\) sur \(\vec B\), dans le même sens.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration vectorielle</span>
    <span class="prompt">Le calcul du cadre en coordonnées, et le lien avec \(\vec{\mathcal M}\wedge\vec B\)</span>
    <div class="content">
      <p>Prenons \(\Delta = Oz\), \(\vec B = B\,\vec e_x\) et \(\vec n = \cos\theta\,\vec e_x + \sin\theta\,\vec e_y\). Notons \(\vec u = \vec e_z\wedge\vec n = -\sin\theta\,\vec e_x + \cos\theta\,\vec e_y\). Le côté situé en \(\frac b2\vec u\) est parcouru dans le sens de \(\vec e_z\), celui situé en \(-\frac b2\vec u\) dans le sens de \(-\vec e_z\) : on vérifie que ce sens de parcours donne bien la normale \(\vec n\) par la règle de la main droite. Les forces valent \(\vec F_1 = Ia\,\vec e_z\wedge B\,\vec e_x = IaB\,\vec e_y\) et \(\vec F_2 = -IaB\,\vec e_y\). Leur moment en \(O\) :</p>
      <div class="formula">$$\begin{aligned}\vec\Gamma &= \frac b2\vec u\wedge\vec F_1 + \Big(-\frac b2\vec u\Big)\wedge\vec F_2\\ &= IabB\,(\vec u\wedge\vec e_y) = -IabB\sin\theta\,\vec e_z\end{aligned}$$</div>
      <p>Les forces sur les côtés de longueur \(b\), parallèles à \(\vec e_z\), donnent un moment orthogonal à \(\vec e_z\) : il est compensé par la liaison et ne contribue pas à \(\Gamma_\Delta\). Par ailleurs :</p>
      <div class="formula">$$\begin{aligned}\vec{\mathcal M}\wedge\vec B &= Iab\,(\cos\theta\,\vec e_x + \sin\theta\,\vec e_y)\wedge B\,\vec e_x\\ &= -IabB\sin\theta\,\vec e_z\end{aligned}$$</div>
      <p>c'est bien le même vecteur.</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Puissance du couple.</strong> Quand le cadre tourne à la vitesse angulaire \(\omega = \dot\theta\), la puissance des actions de Laplace vaut
    <div class="formula" data-nom="Puissance du couple magnétique">$$\mathcal P = \Gamma_\Delta\,\omega = -\mathcal M B\sin\theta\,\dot\theta$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — rotor élémentaire</strong>
    <p>Cadre de \(N = 50\) spires, de côtés \(a = 4{,}0\ \text{cm}\) et \(b = 3{,}0\ \text{cm}\), parcouru par \(I = 0{,}20\ \text{A}\), dans \(B = 0{,}50\ \text{T}\).</p>
    <ol>
      <li>\(\mathcal M = NIab = 1{,}2\times10^{-2}\ \text{A·m}^2\) ; couple maximal, pour \(\theta = \pm90^\circ\) : \(\mathcal MB = 6{,}0\times10^{-3}\ \text{N·m}\).</li>
      <li>Pour \(\theta = 30^\circ\) : \(\Gamma_\Delta = -\mathcal MB\sin30^\circ\), soit \(-3{,}0\times10^{-3}\ \text{N·m}\) : le couple ramène \(\vec n\) vers \(\vec B\).</li>
      <li>Si le cadre passe par \(\theta = 90^\circ\) en tournant vers \(\vec B\) à \(\omega = -20\ \text{rad·s}^{-1}\) : \(\mathcal P = \Gamma_\Delta\,\omega = +0{,}12\ \text{W}\), le couple est moteur. Une fois \(\theta = 0\) dépassé, il devient résistant : sur un tour complet, son travail est nul. Pour obtenir un moteur, il faut inverser le courant à chaque demi-tour (collecteur du moteur à courant continu) ou faire tourner le champ (§12).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : se tromper de bras de levier (\(\cos\theta\) au lieu de \(\sin\theta\)) ou de signe. Contrôle : le couple est nul quand \(\vec{\mathcal M}\) et \(\vec B\) sont colinéaires, maximal quand ils sont orthogonaux, et il fait toujours tourner \(\vec{\mathcal M}\) vers \(\vec B\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · AIMANT DANS UN CHAMP UNIFORME : ÉQUILIBRE ET STABILITÉ</div>
  <h2>Pourquoi une boussole indique le nord</h2>
  <div class="intro">Un aimant, de moment \(\vec{\mathcal M}\), placé dans un champ uniforme subit le même couple qu'une boucle de courant. Ses positions d'équilibre et leur stabilité expliquent le fonctionnement de la boussole, et ses petites oscillations permettent de mesurer un champ.</div>
  <div class="prop-box">
    <strong>Positions d'équilibre.</strong> Une aiguille aimantée mobile autour d'un axe \(\Delta\) orthogonal au champ uniforme subit le moment \(\Gamma_\Delta = -\mathcal M B\sin\theta\), avec \(\theta = (\vec B, \vec{\mathcal M})\). Il s'annule pour :
    <ul>
      <li>\(\theta = 0\) : \(\vec{\mathcal M}\) et \(\vec B\) de même sens. Pour un petit écart, \(\Gamma_\Delta \approx -\mathcal MB\,\theta\) ramène l'aiguille : équilibre <strong>stable</strong> ;</li>
      <li>\(\theta = \pi\) : \(\vec{\mathcal M}\) et \(\vec B\) de sens opposés. Pour \(\theta = \pi + \varepsilon\), \(\Gamma_\Delta \approx +\mathcal MB\,\varepsilon\) écarte l'aiguille : équilibre <strong>instable</strong>.</li>
    </ul>
  </div>
  <p><strong>Énergie potentielle.</strong> Le travail élémentaire du couple quand l'aiguille tourne de \(\mathrm{d}\theta\) vaut \(\Gamma_\Delta\,\mathrm{d}\theta = -\mathcal MB\sin\theta\,\mathrm{d}\theta\), qui est l'opposé de la variation de \(-\mathcal MB\cos\theta\). On lui associe donc l'énergie potentielle</p>
  <div class="formula" data-nom="Énergie potentielle d'un moment magnétique">$$E_p = -\vec{\mathcal M}\cdot\vec B = -\mathcal M B\cos\theta$$</div>
  <p>telle que \(\Gamma_\Delta = -\dfrac{\mathrm{d}E_p}{\mathrm{d}\theta}\).</p>
  <p>On retrouve les résultats de la mécanique : l'équilibre stable correspond au minimum de \(E_p\), l'équilibre instable à son maximum.</p>

</figure>
  <div class="method-box">
    <strong>Exemple — période d'oscillation d'une boussole</strong>
    <p>Une aiguille de moment d'inertie \(J = 6{,}0\times10^{-8}\ \text{kg·m}^2\) par rapport à son pivot vertical et de moment magnétique \(\mathcal M = 2{,}0\times10^{-2}\ \text{A·m}^2\) oscille dans la composante horizontale du champ terrestre, \(B_h = 21\ \mu\text{T}\).</p>
    <ol>
      <li>Théorème du moment cinétique par rapport à l'axe du pivot (frottements négligés) : \(J\ddot\theta = -\mathcal MB_h\sin\theta \approx -\mathcal MB_h\,\theta\) pour de petits angles.</li>
      <li>C'est l'équation d'un oscillateur harmonique, de pulsation et de période
        <div class="formula" data-nom="Petites oscillations d'un moment magnétique">$$\omega_0 = \sqrt{\frac{\mathcal MB}{J}}\qquad T_0 = \frac{2\pi}{\omega_0}$$</div>
        Ici :
        <div class="formula">$$\omega_0 = \sqrt{\frac{4{,}2\times10^{-7}}{6{,}0\times10^{-8}}} \approx 2{,}6\ \text{s}^{-1}$$</div>
        soit \(T_0 \approx 2{,}4\ \text{s}\).</li>
      <li>La période varie en \(1/\sqrt{B}\) : si des bobines ajoutent \(63\ \mu\text{T}\) dans la direction du nord, le champ quadruple et la période est divisée par deux, \(1{,}2\ \text{s}\). Mesurer la période permet donc de mesurer un champ.</li>
    </ol>
  </div>
  <p><strong>La boussole.</strong> Sur un pivot vertical, l'aiguille ne peut tourner que dans un plan horizontal : elle s'aligne sur la composante horizontale du champ, son pôle nord tourné vers le nord. Libre de tourner autour d'un axe horizontal orthogonal au méridien magnétique (à peu près est-ouest), une aiguille d'inclinaison s'aligne sur le champ lui-même et mesure l'inclinaison. Dans un champ <strong>non uniforme</strong>, un aimant subit en plus une force qui l'entraîne vers les régions de champ intense : c'est ainsi qu'un aimant attire un clou, qu'il a d'abord aimanté.</p>
  <div class="notice"><strong>Erreur classique</strong> : confondre le sens de \(\theta\). Avec \(\theta = (\vec B, \vec{\mathcal M})\), le couple vaut \(-\mathcal MB\sin\theta\) ; avec l'angle \((\vec{\mathcal M}, \vec B)\), il change de signe. Contrôle physique : le couple ramène toujours \(\vec{\mathcal M}\) vers \(\vec B\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§12 · CHAMP TOURNANT ET EFFET MOTEUR</div>
  <h2>Faire tourner une aiguille aimantée</h2>
  <div class="intro">Un aimant suit un champ magnétique : si le champ tourne, l'aimant tourne avec lui. Le programme demande de créer un champ tournant avec deux ou trois bobines fixes et d'y mettre en rotation une aiguille aimantée. C'est le principe des moteurs synchrones, des alternateurs de centrales et de la plupart des moteurs de traction.</div>
  <div class="method-box">
    <strong>Créer un champ tournant avec deux bobines</strong>
    <ol>
      <li>Deux bobines identiques, d'axes \(Ox\) et \(Oy\) orthogonaux, sont placées à la même distance de \(O\). Chacune crée en \(O\) un champ porté par son axe et proportionnel à son courant : \(\vec B_1 = k\,i_1\,\vec e_x\) et \(\vec B_2 = k\,i_2\,\vec e_y\).</li>
      <li>On les alimente par des courants sinusoïdaux de même amplitude, en <strong>quadrature</strong> : \(i_1 = I_m\cos\omega t\) et \(i_2 = I_m\sin\omega t\).</li>
      <li>Par superposition, avec \(B_0 = kI_m\) :
        <div class="formula" data-nom="Champ tournant de deux bobines en quadrature">$$\vec B = B_0\,\big(\cos\omega t\,\vec e_x + \sin\omega t\,\vec e_y\big)$$</div>
        Le champ en \(O\) garde la norme \(B_0\) et fait avec \(\vec e_x\) l'angle \(\omega t\) : il <strong>tourne</strong> à la vitesse angulaire \(\omega\), de \(\vec e_x\) vers \(\vec e_y\). Inverser l'un des courants inverse le sens de rotation.</li>
    </ol>
  </div>

</figure>
  <div class="prop-box">
    <strong>Trois bobines et courants triphasés.</strong> Trois bobines identiques dont les axes font entre eux des angles de \(120^\circ\), alimentées par des courants triphasés \(i_k = I_m\cos\big(\omega t - \tfrac{2k\pi}{3}\big)\), \(k = 0, 1, 2\), créent au centre un champ de norme constante \(\tfrac32B_0\), qui tourne à la vitesse angulaire \(\omega\). Le réseau triphasé fournit ainsi naturellement un champ tournant : c'est la raison d'être des moteurs triphasés.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le champ des trois bobines</span>
    <div class="content">
      <p>La bobine \(k\) a pour axe \(\vec u_k = \cos\varphi_k\,\vec e_x + \sin\varphi_k\,\vec e_y\), avec \(\varphi_k = 2k\pi/3\), et crée \(k_0\,i_k\,\vec u_k\), avec \(B_0 = k_0I_m\). Composante selon \(\vec e_x\) :</p>
      <div class="formula">$$\begin{aligned}B_x &= B_0\sum_{k=0}^{2}\cos(\omega t - \varphi_k)\cos\varphi_k\\ &= \frac{B_0}{2}\sum_{k=0}^{2}\big[\cos\omega t + \cos(\omega t - 2\varphi_k)\big]\\ &= \frac32\,B_0\cos\omega t\end{aligned}$$</div>
      <p>car les trois angles \(2\varphi_k\) valent \(0\), \(4\pi/3\) et \(8\pi/3\) : ils sont espacés de \(120^\circ\) et la somme des trois cosinus est nulle. De même, \(B_y = \tfrac32B_0\sin\omega t\).</p>
    </div>
  </div>
  <p><strong>Moteur synchrone.</strong> Une aiguille aimantée placée en \(O\), mobile autour de l'axe \(Oz\), peut tourner à la même vitesse angulaire \(\omega\) que le champ, en restant en retard d'un angle constant \(\alpha\) sur lui. Elle subit alors, d'après le §10, un couple constant</p>
  <div class="formula" data-nom="Couple d'un moteur synchrone">$$\Gamma_z = \mathcal M\,B_0\sin\alpha$$</div>
  <p>moteur pour \(0 \lt \alpha \lt \pi\). En régime permanent, il équilibre le couple résistant \(\Gamma_r\) de la charge et des frottements : \(\mathcal MB_0\sin\alpha = \Gamma_r\). Le couple ne peut dépasser \(\mathcal MB_0\) : au-delà, l'aiguille <strong>décroche</strong>, ne suit plus le champ et s'arrête. Immobile, elle subit un couple qui change de signe à chaque demi-tour du champ, de moyenne nulle : un moteur synchrone ne démarre pas seul si le champ tourne vite ; on le lance, ou l'on augmente progressivement la fréquence.</p>
  <div class="method-box">
    <strong>Exemple — aiguille entraînée par un champ tournant</strong>
    <p>Champ tournant \(B_0 = 2{,}0\ \text{mT}\) à la fréquence \(f = 5{,}0\ \text{Hz}\) ; aiguille de moment \(\mathcal M = 2{,}0\times10^{-2}\ \text{A·m}^2\) ; couple résistant \(\Gamma_r = 1{,}0\times10^{-5}\ \text{N·m}\).</p>
    <ol>
      <li>Couple maximal : \(\mathcal MB_0 = 4{,}0\times10^{-5}\ \text{N·m}\), supérieur à \(\Gamma_r\) : l'aiguille peut suivre le champ.</li>
      <li>Retard : \(\sin\alpha = \Gamma_r/(\mathcal MB_0) = 0{,}25\), soit \(\alpha \approx 14^\circ\).</li>
      <li>Puissance mécanique fournie : \(\mathcal P = \Gamma_r\,\omega \approx 3{,}1\times10^{-4}\ \text{W}\). Si le couple résistant dépassait \(4{,}0\times10^{-5}\ \text{N·m}\), l'aiguille décrocherait.</li>
    </ol>
  </div>
  <div class="notice"><strong>Pour situer</strong> : dans un moteur asynchrone (hors programme), le rotor n'est pas aimanté ; c'est un conducteur dans lequel le champ tournant induit des courants, et il tourne un peu moins vite que le champ. Les alternateurs des centrales sont des machines synchrones fonctionnant à l'envers : le rotor, entraîné par une turbine, crée un champ tournant qui induit des tensions dans les bobines fixes.</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Calculer un champ ; milieux magnétiques</h2>
  <p><strong>Calcul des champs.</strong> Les expressions admises dans ce chapitre se démontrent. Le champ d'une distribution quelconque s'obtient par la loi de Biot et Savart, \(\mathrm{d}\vec B = \dfrac{\mu_0}{4\pi}\,\dfrac{I\,\mathrm{d}\vec\ell\wedge\overrightarrow{PM}}{PM^3}\), hors programme des deux années ; elle donne le champ sur l'axe d'une spire (§4). Pour les distributions très symétriques (fil, bobine longue, bobine torique), le <strong>théorème d'Ampère</strong>, \(\oint_{\mathcal C}\vec B\cdot\mathrm{d}\vec\ell = \mu_0 I_{\text{enlacé}}\), et la <strong>conservation du flux magnétique</strong>, \(\oint_\Sigma\vec B\cdot\vec n\,\mathrm{d}S = 0\), sont au programme de 2ᵉ année : voir <a href="#magnetostat/cours">« Magnétostatique : théorème d'Ampère »</a>.</p>
  <p><strong>Milieux ferromagnétiques.</strong> Le fer, les ferrites et certains alliages canalisent et renforcent fortement le champ magnétique : c'est pourquoi les électroaimants et les transformateurs ont un noyau de fer. On les décrit avec un second champ, \(\vec H\) (en \(\text{A·m}^{-1}\)), et, pour un matériau linéaire, une perméabilité relative \(\mu_r\) : \(\vec B = \mu_0\mu_r\vec H\), avec \(\mu_r\) de l'ordre de \(10^3\) à \(10^5\) pour le fer. Dans un <strong>circuit magnétique</strong> (noyau de longueur \(\ell\) et de section \(S\), bobiné de \(N\) spires), le flux \(\Phi\) obéit à une loi analogue à la loi d'Ohm : \(NI = \mathcal R\,\Phi\), où \(\mathcal R = \dfrac{\ell}{\mu_0\mu_rS}\) est la réluctance ; un entrefer d'air, sans le facteur \(\mu_r\), domine souvent la réluctance totale, même s'il est mince. À l'interface entre deux milieux, la composante normale de \(\vec B\) et, sans courant surfacique, la composante tangentielle de \(\vec H\) sont continues. Ces notions ne sont au programme de physique d'aucune des deux années.</p>
  <p><strong>Inductance d'une bobine longue.</strong> Le flux du champ \(\mu_0 nI\) à travers les \(N\) spires d'une bobine longue de section \(S\) conduit à son inductance propre, \(L = \mu_0 N^2S/\ell\), et à l'énergie magnétique \(\tfrac12 LI^2\) : ces résultats, exigibles en PTSI, sont établis dans le chapitre <a href="#induction/cours">« Induction électromagnétique »</a>.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · CHAMP MAGNÉTIQUE ET LAPLACE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles en PTSI : lire et tracer une carte de champ, prévoir la direction du champ par les symétries, évaluer un champ à partir d'une expression fournie, orienter un circuit et son moment magnétique, calculer la force de Laplace, sa puissance et le couple sur une spire ou un aimant, discuter l'équilibre d'une boussole et exploiter un champ tournant.</div>

  <div class="method-box"><strong>Méthode 1 — Lire une carte de champ magnétique</strong>
    <ol>
      <li><span class="step">Sources.</span> Repérer les points autour desquels les lignes s'enroulent en petites boucles serrées (fils perpendiculaires à la carte), ou les faces par lesquelles elles sortent et rentrent en se resserrant (pôles d'un aimant, faces d'une bobine).</li>
      <li><span class="step">Sens des courants.</span> Règle de la main droite : si les lignes tournent dans le sens trigonométrique autour d'un fil, le courant sort de la carte, vers le lecteur.</li>
      <li><span class="step">Zones.</span> Champ uniforme : lignes parallèles et équidistantes ; champ faible : lignes très écartées ; champ nul : point où deux lignes se croisent.</li>
      <li><span class="step">Intensités.</span> Sur une carte de champ plan tracée à flux égal entre lignes voisines, le rapport des champs en deux points est l'inverse du rapport des écartements.</li>
      <li><span class="step">Cohérence.</span> Vérifier que les lignes ne partent d'aucun point et respectent les symétries des courants (méthode 3).</li>
    </ol>
    <p><em>Exemple éclair :</em> sur la carte d'un champ plan, deux lignes voisines sont écartées de \(2\ \text{mm}\) en \(A\) et de \(8\ \text{mm}\) en \(B\). Si \(B_A = 0{,}60\ \text{mT}\), alors \(B_B = 0{,}60\times\dfrac{2}{8} = 0{,}15\ \text{mT}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : lire un sens sur un spectre de limaille de fer (il ne donne que la direction) ; appliquer la règle des écartements de façon quantitative à une coupe d'une bobine ou d'une spire, où elle n'est que qualitative.</div>

  <div class="method-box"><strong>Méthode 2 — Tracer l'allure d'une carte : aimant droit, spire, bobine longue</strong>
    <ol>
      <li><span class="step">Plan de coupe.</span> Tracer un plan qui contient l'axe ; y placer les conducteurs coupés, ⊙ d'un côté de l'axe et ⊗ de l'autre, selon le sens du courant.</li>
      <li><span class="step">Près des conducteurs.</span> Dessiner de petites boucles presque circulaires autour de chaque conducteur, orientées par la règle de la main droite.</li>
      <li><span class="step">À l'intérieur.</span> Spire : lignes qui traversent le disque en se resserrant, parallèles à l'axe au centre. Bobine longue : lignes parallèles et équidistantes loin des extrémités, champ uniforme. Aimant : lignes du pôle sud vers le pôle nord.</li>
      <li><span class="step">À l'extérieur.</span> Les lignes sortent par la face nord (ou le pôle nord), s'écartent et reviennent rentrer par la face sud : chaque ligne est fermée.</li>
      <li><span class="step">Contrôle.</span> L'axe est une ligne de champ ; les lignes traversent à angle droit le plan médian de la bobine (plan de symétrie des courants) ; la carte est symétrique par rapport à l'axe.</li>
    </ol>
    <p><em>Exemple éclair :</em> vue depuis son extrémité droite, une bobine est parcourue par un courant qui tourne dans le sens trigonométrique. Son extrémité droite est donc la face nord : à l'intérieur, le champ va de la gauche vers la droite ; à l'extérieur, les lignes reviennent de la droite vers la gauche, très écartées.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : arrêter les lignes sur les pôles d'un aimant comme des lignes de champ électrique sur des charges. Elles continuent à l'intérieur de l'aimant, du sud vers le nord.</div>

  <div class="method-box"><strong>Méthode 3 — Prévoir la direction du champ par les symétries et les invariances</strong>
    <ol>
      <li><span class="step">Point courant.</span> Choisir un point \(M\) et les coordonnées adaptées (cylindriques pour un fil, une spire, une bobine).</li>
      <li><span class="step">Plans passant par \(M\).</span> Chercher les plans de symétrie et d'antisymétrie <em>des courants</em> : \(\vec B(M)\) est <strong>orthogonal</strong> à un plan de symétrie et <strong>contenu</strong> dans un plan d'antisymétrie.</li>
      <li><span class="step">Invariances.</span> Une translation ou une rotation qui laisse la distribution inchangée supprime la coordonnée correspondante.</li>
      <li><span class="step">Conclusion écrite.</span> Par exemple \(\vec B = B_\theta(r)\,\vec e_\theta\) pour un fil, \(\vec B = B_z(z)\,\vec e_z\) sur l'axe d'une spire.</li>
    </ol>
    <p><em>Exemple éclair :</em> deux fils parallèles en \(x = \pm a\), parcourus par la même intensité \(I = 8{,}0\ \text{A}\) dans le même sens. Le plan \(x = 0\) échange les fils en conservant les courants : plan de symétrie, donc en \(M(0, y)\), \(\vec B\) est porté par \(\vec e_x\). Par superposition, avec \(a = 3{,}0\ \text{cm}\), \(y = 4{,}0\ \text{cm}\) et \(d = \sqrt{a^2+y^2} = 5{,}0\ \text{cm}\) : \(B = \dfrac{\mu_0 I y}{\pi d^2} \approx 51\ \mu\text{T}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer les règles du champ électrique (elles sont inversées) ou chercher les symétries du champ au lieu de celles des courants. Repère : le plan qui contient un fil est plan de symétrie, et le champ du fil le traverse à angle droit.</div>

  <div class="method-box"><strong>Méthode 4 — Évaluer un champ à partir d'une expression fournie</strong>
    <ol>
      <li><span class="step">Modèle.</span> Identifier la source (fil, spire, bobine plate, bobine longue) et vérifier les conditions du modèle : fil long devant la distance, bobine longue devant son rayon, point loin des extrémités.</li>
      <li><span class="step">Unités.</span> Distances en mètres, intensités en ampères ; retenir \(\dfrac{\mu_0}{2\pi} = 2\times10^{-7}\ \text{H·m}^{-1}\) et \(\mu_0 \approx 1{,}26\times10^{-6}\ \text{H·m}^{-1}\).</li>
      <li><span class="step">Superposition.</span> Additionner <strong>vectoriellement</strong> les champs des différentes sources, y compris le conducteur de retour du courant.</li>
      <li><span class="step">Comparaison.</span> Situer le résultat : champ terrestre \(5\times10^{-5}\ \text{T}\), bobine de TP \(10^{-3}\ \text{T}\), aimant \(0{,}1\) à \(1\ \text{T}\), IRM \(1{,}5\) à \(3\ \text{T}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> un seul conducteur parcouru par \(16\ \text{A}\) crée à \(50\ \text{cm}\) le champ \(2\times10^{-7}\times16/0{,}50 \approx 6{,}4\ \mu\text{T}\). Dans un câble domestique, le courant revient par un conducteur voisin : les deux champs, opposés, se compensent presque, et le champ réel est bien plus faible.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : confondre \(\dfrac{\mu_0 I}{2\pi r}\) (fil) et \(\dfrac{\mu_0 I}{2R}\) (centre d'une spire, sans \(\pi\)) ; utiliser \(\mu_0 nI\) près des extrémités d'une bobine, où le champ ne vaut plus que la moitié environ.</div>

  <div class="method-box"><strong>Méthode 5 — Orienter un circuit, sa normale et son moment magnétique</strong>
    <ol>
      <li><span class="step">Sens de parcours.</span> Choisir un sens positif pour l'intensité \(I\) (algébrique) le long du circuit.</li>
      <li><span class="step">Normale.</span> En déduire la normale \(\vec n\) par la règle de la main droite : doigts repliés dans le sens de parcours, pouce selon \(\vec n\).</li>
      <li><span class="step">Moment.</span> \(\vec{\mathcal M} = N I S\,\vec n\) pour \(N\) spires d'aire \(S\) ; si \(I \lt 0\), \(\vec{\mathcal M}\) est opposé à \(\vec n\).</li>
      <li><span class="step">Faces.</span> La face nord est celle vers laquelle pointe \(\vec{\mathcal M}\) : le champ en sort. Pour un aimant, \(\vec{\mathcal M}\) va du pôle sud vers le pôle nord.</li>
    </ol>
    <p><em>Exemple éclair :</em> une spire carrée de côté \(3{,}0\ \text{cm}\), horizontale, est parcourue par \(2{,}0\ \text{A}\) dans le sens trigonométrique vu de dessus : \(\mathcal M = 2{,}0\times(0{,}030)^2 = 1{,}8\times10^{-3}\ \text{A·m}^2\), vertical vers le haut ; la face supérieure est la face nord.</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer la force de Laplace sur une barre ou un circuit</strong>
    <ol>
      <li><span class="step">Champ.</span> Vérifier que \(\vec B\) est le champ <strong>extérieur</strong> (pas le champ propre du conducteur) et qu'il est uniforme sur la partie du conducteur qu'il baigne.</li>
      <li><span class="step">Orientation.</span> Orienter \(\mathrm{d}\vec\ell\) dans le sens choisi pour \(I\) ; pour une barre \(AB\) parcourue de \(A\) vers \(B\) : \(\vec F = I\,\overrightarrow{AB}\wedge\vec B\), appliquée au milieu de la partie dans le champ.</li>
      <li><span class="step">Calcul.</span> Par composantes, ou par la règle des trois doigts de la main droite (pouce : courant ; index : champ ; majeur : force) ; norme \(I\ell B\sin\alpha\).</li>
      <li><span class="step">Circuit fermé.</span> Dans un champ uniforme, la résultante sur un circuit fermé est nulle : chercher alors le couple (méthode 8).</li>
      <li><span class="step">Comparaison.</span> Comparer la force aux autres actions (poids, réaction, frottement) avant d'écrire le principe fondamental de la dynamique.</li>
    </ol>
    <p><em>Exemple éclair :</em> une barre de \(20\ \text{cm}\) dirigée selon \(\vec e_y\), parcourue par \(3{,}0\ \text{A}\) dans le sens de \(\vec e_y\), dans \(\vec B = 0{,}050\ \text{T}\ \vec e_x\) : \(\vec F = I\ell\,\vec e_y\wedge B\,\vec e_x = -I\ell B\,\vec e_z\), soit \(0{,}030\ \text{N}\) selon \(-\vec e_z\). Si le champ faisait \(30^\circ\) avec la barre, la force serait deux fois plus faible.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : inverser le produit vectoriel (\(\vec B\wedge I\,\mathrm{d}\vec\ell\)) ; prendre la longueur totale de la barre au lieu de la longueur plongée dans le champ.</div>

  <div class="method-box"><strong>Méthode 7 — Exprimer la puissance des actions de Laplace</strong>
    <ol>
      <li><span class="step">Translation.</span> Pour une barre de vitesse \(\vec v\) : \(\mathcal P = \vec F\cdot\vec v\) ; sur des rails, \(\mathcal P = I\ell Bv\) si les vecteurs sont bien orientés.</li>
      <li><span class="step">Rotation.</span> Pour un cadre ou un aimant tournant autour d'un axe fixe \(\Delta\) à la vitesse angulaire \(\omega = \dot\theta\) : \(\mathcal P = \Gamma_\Delta\,\omega\).</li>
      <li><span class="step">Signe.</span> \(\mathcal P \gt 0\) : action motrice, conversion d'énergie électrique en énergie mécanique (effet moteur) ; \(\mathcal P \lt 0\) : action résistante.</li>
      <li><span class="step">Bilan.</span> L'énergie mécanique fournie vient du générateur ; le lien précis, \(\mathcal P_{\text{Laplace}} + e\,i = 0\), fait intervenir la force électromotrice induite (chapitre « Induction électromagnétique »).</li>
    </ol>
    <p><em>Exemple éclair :</em> une barre poussée par \(F = 48\ \text{mN}\) avance à \(0{,}50\ \text{m·s}^{-1}\) : \(\mathcal P = 24\ \text{mW}\). Un cadre soumis à \(\Gamma_\Delta = -2{,}0\times10^{-3}\ \text{N·m}\) tourne à \(\omega = -10\ \text{rad·s}^{-1}\) : \(\mathcal P = +2{,}0\times10^{-2}\ \text{W}\), le couple est moteur.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre des normes au lieu de grandeurs algébriques : un couple négatif et une vitesse angulaire négative donnent une puissance positive.</div>

  <div class="method-box"><strong>Méthode 8 — Calculer le couple sur une spire ou un aimant</strong>
    <ol>
      <li><span class="step">Moment magnétique.</span> \(\vec{\mathcal M} = NIS\,\vec n\) (méthode 5), ou la valeur fournie pour un aimant.</li>
      <li><span class="step">Couple.</span> \(\vec\Gamma = \vec{\mathcal M}\wedge\vec B\) dans un champ uniforme ; la résultante des forces est nulle.</li>
      <li><span class="step">Projection.</span> Sur l'axe de rotation : \(\Gamma_\Delta = \vec\Gamma\cdot\vec e_\Delta = -\mathcal MB\sin\theta\), avec \(\theta = (\vec B, \vec{\mathcal M})\) orienté par \(\vec e_\Delta\), si \(\vec B\) est orthogonal à \(\Delta\). Sinon, seule la composante de \(\vec B\) orthogonale à \(\Delta\) compte.</li>
      <li><span class="step">Contrôle.</span> Le couple est nul pour \(\vec{\mathcal M}\) colinéaire à \(\vec B\), maximal (\(\mathcal MB\)) pour \(\vec{\mathcal M}\perp\vec B\), et fait tourner \(\vec{\mathcal M}\) vers \(\vec B\).</li>
    </ol>
    <p><em>Exemple éclair :</em> bobine plate de 20 spires de rayon \(2{,}0\ \text{cm}\), parcourue par \(0{,}50\ \text{A}\) : \(\mathcal M = NI\pi R^2 \approx 1{,}3\times10^{-2}\ \text{A·m}^2\). Dans \(B = 0{,}10\ \text{T}\) orthogonal à \(\vec{\mathcal M}\), le couple vaut \(1{,}3\times10^{-3}\ \text{N·m}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : se tromper de bras de levier (\(\cos\theta\) au lieu de \(\sin\theta\)), ou oublier qu'un champ parallèle à l'axe de rotation ne produit aucun couple autour de cet axe.</div>

  <div class="method-box"><strong>Méthode 9 — Étudier l'équilibre et la stabilité d'un moment magnétique</strong>
    <ol>
      <li><span class="step">Actions.</span> Écrire le moment total par rapport à l'axe : \(\Gamma_\Delta(\theta) = -\mathcal MB\sin\theta\), plus éventuellement d'autres couples (fil de torsion, poids) ; ou l'énergie potentielle \(E_p = -\mathcal MB\cos\theta\).</li>
      <li><span class="step">Équilibres.</span> Résoudre \(\Gamma_\Delta(\theta_e) = 0\) : pour le seul couple magnétique, \(\theta_e = 0\) et \(\theta_e = \pi\).</li>
      <li><span class="step">Stabilité.</span> Stable si \(\dfrac{\mathrm{d}\Gamma_\Delta}{\mathrm{d}\theta}(\theta_e) \lt 0\) (couple de rappel), c'est-à-dire si \(E_p\) est minimale ; instable sinon.</li>
      <li><span class="step">Petites oscillations.</span> Théorème du moment cinétique, \(J\ddot\theta = \Gamma_\Delta\), linéarisé autour de \(\theta_e = 0\) : \(\omega_0 = \sqrt{\mathcal MB/J}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une aiguille (\(J = 6{,}0\times10^{-8}\ \text{kg·m}^2\), \(\mathcal M = 2{,}0\times10^{-2}\ \text{A·m}^2\)) placée au centre de bobines qui créent \(B = 0{,}50\ \text{mT}\), bien plus que le champ terrestre : \(\omega_0 = \sqrt{\dfrac{\mathcal MB}{J}} \approx 13\ \text{rad·s}^{-1}\), soit \(T_0 \approx 0{,}49\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Créer et exploiter un champ tournant</strong>
    <ol>
      <li><span class="step">Dispositif.</span> Deux bobines identiques d'axes orthogonaux, à la même distance du centre, alimentées par des courants de même amplitude en <strong>quadrature</strong> ; ou trois bobines à \(120^\circ\) alimentées en triphasé.</li>
      <li><span class="step">Champ au centre.</span> Par superposition : \(\vec B = B_0(\cos\omega t\,\vec e_x + \sin\omega t\,\vec e_y)\), de norme constante, tournant à \(\omega\) de l'axe de la bobine en avance vers celui de la bobine en retard (\(\tfrac32B_0\) pour trois bobines).</li>
      <li><span class="step">Aiguille synchrone.</span> En régime permanent, l'aiguille tourne à \(\omega\) avec un retard \(\alpha\) tel que \(\mathcal MB_0\sin\alpha = \Gamma_r\) ; puissance fournie \(\mathcal P = \Gamma_r\,\omega\).</li>
      <li><span class="step">Limite.</span> Si \(\Gamma_r \gt \mathcal MB_0\), l'aiguille décroche ; immobile, elle subit un couple de moyenne nulle et ne démarre pas seule.</li>
    </ol>
    <p><em>Exemple éclair :</em> avec \(\mathcal MB_0 = 4{,}0\times10^{-5}\ \text{N·m}\) et \(\Gamma_r = 2{,}0\times10^{-5}\ \text{N·m}\), \(\sin\alpha = 0{,}50\) : l'aiguille suit le champ avec un retard de \(30^\circ\). À \(50\ \text{Hz}\), elle tournerait à \(3\,000\ \text{tr·min}^{-1}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : alimenter les deux bobines par des courants <strong>en phase</strong> : le champ garde alors une direction fixe (la bissectrice des axes) et oscille sans tourner.</div>
</div>
</template>
