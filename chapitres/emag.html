  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Champ d'un câble et boussole déviée</h3>
  <div class="statement">Un câble rectiligne vertical, très long, est parcouru par un courant montant \(I = 10\ \text{A}\). On admet l'expression du champ d'un fil rectiligne, \(B = \dfrac{\mu_0 I}{2\pi r}\), avec \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\). La composante horizontale du champ terrestre vaut \(B_h = 21\ \mu\text{T}\) et elle est dirigée vers le nord.</div>
  <div class="q"><strong>Q1.</strong> Calculer le champ du câble à \(r = 1{,}0\ \text{cm}\) et à \(r = 10\ \text{cm}\).</div>
  <div class="q"><strong>Q2.</strong> À quelle distance \(r_0\) le champ du câble est-il égal à \(B_h\) ?</div>
  <div class="q"><strong>Q3.</strong> Donner la direction et le sens du champ du câble en un point \(P\) situé à l'est du câble.</div>
  <div class="q"><strong>Q4.</strong> Une boussole est posée en \(P\), à \(10\ \text{cm}\) à l'est du câble. Dévie-t-elle ? Même question si elle est posée à \(10\ \text{cm}\) au sud du câble ; calculer alors l'angle de déviation et son sens.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{\mu_0}{2\pi} = 2\times10^{-7}\ \text{H·m}^{-1}\) : à \(1{,}0\ \text{cm}\), \(B = \dfrac{2\times10^{-7}\times10}{0{,}010}\), soit \(200\ \mu\text{T}\) ; à \(10\ \text{cm}\), dix fois moins, \(20\ \mu\text{T}\). Le champ décroît en \(1/r\).</p>
    <p><strong>Q2.</strong> \(r_0 = \dfrac{\mu_0 I}{2\pi B_h}\), soit \(r_0 = \dfrac{2\times10^{-7}\times10}{21\times10^{-6}} \approx 9{,}5\ \text{cm}\). Au-delà de quelques dizaines de centimètres, le câble ne perturbe presque plus une boussole.</p>
    <p><strong>Q3.</strong> Règle de la main droite : pouce vers le haut (sens du courant), les doigts tournent dans le sens trigonométrique vu de dessus. En un point situé à l'est du câble, le champ est horizontal, orthogonal à la direction câble–point, et dirigé vers le <strong>nord</strong>. (Vectoriellement, avec \(\vec e_z\) vers le haut et \(\vec e_x\) vers l'est : \(\vec e_z\wedge\vec e_x = \vec e_y\), le nord.)</p>
    <p><strong>Q4.</strong> À l'est, le champ du câble (\(20\ \mu\text{T}\)) est dirigé vers le nord, comme \(\vec B_h\) : le champ horizontal total, \(41\ \mu\text{T}\), reste dirigé vers le nord et la boussole <strong>ne dévie pas</strong> (elle devient seulement plus « raide »). Au sud du câble, le champ du câble est dirigé vers l'<strong>est</strong> (\(\vec e_z\wedge(-\vec e_y) = \vec e_x\)), orthogonal à \(\vec B_h\) : l'aiguille tourne vers l'est d'un angle \(\alpha\) tel que \(\tan\alpha = \dfrac{20}{21}\), soit \(\alpha \approx 44^\circ\). L'effet d'un câble sur une boussole dépend donc beaucoup de sa position.</p>
  </div>
</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Autour de \(A\) et de \(C\), les lignes forment de petites boucles fermées, de plus en plus serrées en s'approchant du point : ce sont les signatures de deux fils perpendiculaires à la carte. Les courants sont de <strong>même sens</strong> : entre les fils, les champs des deux fils sont opposés et peuvent s'annuler (point \(N\)) ; loin des fils, les lignes entourent l'ensemble, comme pour un fil unique. Avec des courants opposés, le champ entre les fils serait au contraire renforcé.</p>
    <p><strong>Q2.</strong> Autour de chaque fil, les lignes tournent dans le sens trigonométrique (flèches dirigées vers la gauche en haut des boucles). Par la règle de la main droite, les deux courants <strong>sortent</strong> de la figure, vers le lecteur.</p>
    <p><strong>Q3.</strong> \(N\) est le point de croisement de la ligne en forme de « 8 », sur le segment \([AC]\) : avec l'échelle, \(AN \approx 1{,}0\ \text{cm}\) et \(NC \approx 3{,}0\ \text{cm}\). En \(N\), les champs des deux fils sont opposés et de même norme : \(\dfrac{\mu_0 I_A}{2\pi\,AN} = \dfrac{\mu_0 I_C}{2\pi\,NC}\), d'où \(\dfrac{I_C}{I_A} = \dfrac{NC}{AN} \approx 3\). Le point de champ nul est plus près du fil le moins intense.</p>
    <p><strong>Q4.</strong> Ce plan contient les deux courants, inchangés par la symétrie : c'est un plan de <strong>symétrie</strong>. En chacun de ses points, le champ lui est orthogonal : sur la carte, les lignes coupent la droite \((AC)\) à angle droit, ce qu'on observe. La carte est d'ailleurs symétrique par rapport à cette droite.</p>
    <p><strong>Q5.</strong> Le champ est le plus intense là où les lignes sont les plus serrées : au voisinage immédiat des fils. Tout près des fils, à même distance, le champ est environ trois fois plus intense près de \(C\), qui porte le courant le plus fort, que près de \(A\) : autour de \(C\), les boucles serrées occupent une région bien plus large. Loin des fils, les lignes sont presque des cercles qui entourent l'ensemble, comme celles d'un fil unique portant \(I_A + I_C = 4I_A\).</p>
    <p><strong>Q6.</strong> \(I_C = 6{,}0\ \text{A}\). En \(O'\), à \(2{,}0\ \text{cm}\) de chaque fil, les deux champs sont orthogonaux à \((AC)\) et opposés ; celui de \(C\) l'emporte : \(B = \dfrac{\mu_0(I_C - I_A)}{2\pi\times0{,}020}\), soit \(B = 40\ \mu\text{T}\). Il a le sens du champ créé par \(C\) à sa gauche : vers le <strong>bas</strong> de la figure (courant sortant, rotation dans le sens trigonométrique).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Moment magnétique et couple sur une spire carrée</h3>
  <div class="statement">Une spire carrée de côté \(a = 2{,}0\ \text{cm}\), parcourue par \(I = 0{,}10\ \text{A}\), est placée dans un champ uniforme de norme \(B = 50\ \text{mT}\). Sa normale \(\vec n\), orientée par le sens du courant, fait l'angle \(\theta = 60^\circ\) avec \(\vec B\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le moment magnétique \(\vec{\mathcal M}\) de la spire (norme, direction, sens).</div>
  <div class="q"><strong>Q2.</strong> Calculer la norme du couple exercé sur la spire. Quel est son effet ? Que vaut la résultante des forces de Laplace ?</div>
  <div class="q"><strong>Q3.</strong> Calculer l'énergie potentielle \(E_p = -\vec{\mathcal M}\cdot\vec B\). Pour quelle position est-elle minimale ? maximale ? Quel travail faut-il fournir pour retourner la spire de sa position d'équilibre stable à sa position d'équilibre instable ? Faire le lien avec une boussole.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec{\mathcal M} = IS\,\vec n\) avec \(S = a^2 = 4{,}0\times10^{-4}\ \text{m}^2\) : \(\mathcal M = IS = 4{,}0\times10^{-5}\ \text{A·m}^2\), porté par la normale, dans le sens donné par la règle de la main droite à partir du sens du courant.</p>
    <p><strong>Q2.</strong> La norme du couple est \(\Gamma = \|\vec{\mathcal M}\wedge\vec B\| = \mathcal MB\sin\theta\) :</p>
    <div class="formula">$$\begin{aligned}\Gamma &= 4{,}0\times10^{-5}\times0{,}050\times\sin60^\circ\\ &\approx 1{,}7\times10^{-6}\ \text{N·m}\end{aligned}$$</div>
    <p>Le couple fait tourner \(\vec{\mathcal M}\) vers \(\vec B\). Le champ étant uniforme et le circuit fermé, la résultante des forces de Laplace est <strong>nulle</strong> : la spire tourne sans se déplacer.</p>
    <p><strong>Q3.</strong> \(E_p = -\mathcal MB\cos\theta\), soit \(E_p = -1{,}0\times10^{-6}\ \text{J}\). Minimum \(-\mathcal MB\) pour \(\theta = 0\) (\(\vec{\mathcal M}\) dans le sens de \(\vec B\)) : équilibre stable. Maximum \(+\mathcal MB\) pour \(\theta = \pi\) : équilibre instable. Le travail à fournir pour passer de l'un à l'autre est \(\Delta E_p = 2\mathcal MB = 4{,}0\times10^{-6}\ \text{J}\). Une aiguille de boussole, qui est un moment magnétique, s'oriente de même dans la position d'énergie minimale : son moment dans le sens du champ horizontal, son pôle nord vers le nord.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ☆ ☆</span>
  <h3>La balançoire de Laplace</h3>
  <div class="statement">Une tige conductrice horizontale \(CD\), de longueur \(\ell = 5{,}0\ \text{cm}\) et de masse \(m = 10\ \text{g}\), est suspendue par deux fils conducteurs souples, de masse négligeable, accrochés à un axe horizontal fixe. La tige est entièrement plongée dans l'entrefer d'un aimant en U, où règne un champ uniforme vertical de norme \(B = 0{,}20\ \text{T}\) ; les fils de suspension sont hors du champ. Un générateur fait circuler \(I = 3{,}0\ \text{A}\) dans la tige. On prend \(g = 9{,}8\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Donner la direction de la force de Laplace qui s'exerce sur la tige, puis calculer sa norme.</div>
  <div class="q"><strong>Q2.</strong> La tige s'écarte et s'immobilise, les fils faisant l'angle \(\alpha\) avec la verticale. Établir que \(\tan\alpha = \dfrac{I\ell B}{mg}\) et calculer \(\alpha\).</div>
  <div class="q"><strong>Q3.</strong> Que devient \(\alpha\) si l'on inverse le courant ? si l'on retourne l'aimant ? si l'on fait les deux ? si l'on double \(I\) ?</div>
  <div class="q"><strong>Q4.</strong> Proposer une méthode pour mesurer \(B\) avec ce dispositif.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec F = I\,\overrightarrow{CD}\wedge\vec B\) (si le courant va de \(C\) vers \(D\)) : orthogonale à la tige et au champ vertical, elle est <strong>horizontale</strong> et perpendiculaire à la tige. La tige étant orthogonale au champ, \(F = I\ell B = 3{,}0\times10^{-2}\ \text{N}\). Elle s'applique au milieu de la tige.</p>
    <p><strong>Q2.</strong> La tige est soumise à son poids \(m\vec g\) (vertical), à la force de Laplace \(\vec F\) (horizontale), et aux tensions des deux fils, dirigées le long des fils. À l'équilibre, la somme des tensions compense \(m\vec g + \vec F\) : les fils sont donc alignés sur \(m\vec g + \vec F\), qui fait avec la verticale l'angle \(\alpha\) tel que \(\tan\alpha = \dfrac{F}{mg} = \dfrac{I\ell B}{mg}\). Numériquement, \(\tan\alpha = \dfrac{0{,}030}{0{,}098} \approx 0{,}31\) et \(\alpha \approx 17^\circ\).</p>
    <p><strong>Q3.</strong> Inverser le courant, ou retourner l'aimant (ce qui inverse \(\vec B\)), inverse la force : la tige s'écarte du même angle de l'autre côté. Faire les deux ne change rien. Doubler \(I\) double \(\tan\alpha\) : \(\tan\alpha \approx 0{,}61\), \(\alpha \approx 31^\circ\) (et non \(34^\circ\) : c'est la tangente, pas l'angle, qui est proportionnelle à \(I\)).</p>
    <p><strong>Q4.</strong> Mesurer \(\alpha\) pour plusieurs valeurs de \(I\), tracer \(\tan\alpha\) en fonction de \(I\) : on obtient une droite passant par l'origine, de pente \(\dfrac{\ell B}{mg}\), dont on déduit \(B\) connaissant \(m\), \(g\) et la longueur \(\ell\) de tige plongée dans le champ.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Bobine longue : champ, fil et petite spire dans le champ</h3>
  <div class="statement">Une bobine de longueur \(L = 50\ \text{cm}\) et de rayon \(R = 2{,}0\ \text{cm}\) comporte \(n = 1\,000\) spires jointives par mètre, parcourues par \(I = 2{,}0\ \text{A}\). On donne \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <p class="exo-part">Partie A — Le champ de la bobine</p>
  <div class="q"><strong>A1.</strong> On modélise la bobine par une bobine infinie. Par des arguments de symétrie et d'invariance, montrer qu'à l'intérieur le champ est parallèle à l'axe \(Oz\) et ne dépend que de la distance \(r\) à l'axe.</div>
  <div class="q"><strong>A2.</strong> On admet que \(B = \mu_0 nI\) à l'intérieur. Calculer \(B\) et le comparer au champ terrestre. L'énoncé fournit le champ au centre d'une bobine de longueur finie, \(B_c = \mu_0 nI\,\dfrac{L}{\sqrt{L^2+4R^2}}\) : le modèle de la bobine infinie est-il justifié ?</div>
  <p class="exo-part">Partie B — Force sur un fil</p>
  <div class="q"><strong>B1.</strong> Un fil rectiligne parcouru par \(I' = 3{,}0\ \text{A}\) traverse la bobine perpendiculairement à son axe ; la longueur de fil plongée dans le champ est \(\ell = 5{,}0\ \text{cm}\). Calculer la force de Laplace qu'il subit et préciser sa direction.</div>
  <div class="q"><strong>B2.</strong> Que devient cette force si le fil est placé parallèlement à l'axe ?</div>
  <p class="exo-part">Partie C — Petite spire au centre</p>
  <div class="q"><strong>C1.</strong> Une petite spire plane d'aire \(S = 4{,}0\ \text{cm}^2\), parcourue par \(i = 0{,}50\ \text{A}\), est placée au centre de la bobine, mobile autour d'un de ses diamètres orthogonal à l'axe. Calculer son moment magnétique et le couple maximal qu'elle peut subir.</div>
  <div class="q"><strong>C2.</strong> Quelles sont ses positions d'équilibre ? Laquelle est stable ? Comparer alors, au centre de la petite spire, le sens de son propre champ et celui du champ de la bobine.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Soit \(M\) un point intérieur. Dans le modèle de la bobine infinie à spires jointives, chaque spire est assimilée à un cercle d'axe \(Oz\) : le plan orthogonal à l'axe passant par \(M\) laisse la distribution inchangée et conserve les courants, qui lui sont parallèles. C'est un plan de symétrie des courants, donc \(\vec B(M)\) lui est orthogonal, <strong>parallèle à l'axe</strong>. Tout plan contenant l'axe est traversé orthogonalement par les courants : plan d'antisymétrie, qui contient bien \(\vec B(M)\) (cohérent). La bobine infinie est invariante par translation le long de \(Oz\) et par rotation autour de \(Oz\) : \(\vec B = B_z(r)\,\vec e_z\). (Le théorème d'Ampère, vu en 2ᵉ année, montre en plus que \(B_z\) ne dépend pas de \(r\).)</p>
    <p><strong>A2.</strong> \(B = 4\pi\times10^{-7}\times1\,000\times2{,}0\), soit \(B \approx 2{,}5\ \text{mT}\), une cinquantaine de fois le champ terrestre (\(47\ \mu\text{T}\)). Le facteur correctif vaut \(\dfrac{0{,}50}{\sqrt{0{,}25+4\times0{,}020^2}} \approx 0{,}997\) : l'écart à \(\mu_0 nI\) au centre est de 0,3 %, le modèle est justifié loin des extrémités (\(L = 25R\)).</p>
    <p><strong>B1.</strong> Le fil est orthogonal au champ : \(F = I'\ell B \approx 3{,}8\times10^{-4}\ \text{N}\), une force faible (le poids d'un trentième de gramme). \(\vec F = I'\,\vec\ell\wedge\vec B\) est orthogonale au fil et à l'axe de la bobine.</p>
    <p><strong>B2.</strong> Fil parallèle au champ : \(\vec\ell\wedge\vec B = \vec 0\), la force est nulle.</p>
    <p><strong>C1.</strong> \(\mathcal M = iS = 2{,}0\times10^{-4}\ \text{A·m}^2\). Le diamètre de rotation est orthogonal au champ : le couple vaut \(\mathcal MB|\sin\theta|\), maximal pour \(\vec{\mathcal M}\perp\vec B\) : \(\Gamma_{\max} = \mathcal MB \approx 5{,}0\times10^{-7}\ \text{N·m}\).</p>
    <p><strong>C2.</strong> Équilibres pour \(\vec{\mathcal M}\) colinéaire à \(\vec B\) : \(\theta = 0\) (même sens, stable, énergie \(-\mathcal MB\) minimale) et \(\theta = \pi\) (sens opposé, instable). À l'équilibre stable, \(\vec{\mathcal M}\) a le sens de \(\vec B\) : le champ propre de la petite spire, dirigé selon \(\vec{\mathcal M}\) en son centre, a donc <strong>le même sens</strong> que le champ de la bobine. La spire s'oriente de façon à renforcer le champ qui la traverse.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Bobines de Helmholtz : champ uniforme et compensation du champ terrestre</h3>
  <div class="statement">Deux bobines plates identiques de \(N = 100\) spires et de rayon \(R = 10\ \text{cm}\) sont placées sur le même axe \(Oz\), en \(z = -d/2\) et \(z = +d/2\), et parcourues dans le même sens par le même courant \(I\). On admet que le champ d'une bobine plate en un point de son axe, à la distance \(u\) de son centre, vaut \(B_1(u) = \dfrac{\mu_0 NIR^2}{2(R^2+u^2)^{3/2}}\). On donne \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer le champ au centre \(O\) en fonction de \(d\). On choisit \(d = R\) (bobines de Helmholtz) : montrer que \(B(O) = \left(\tfrac45\right)^{3/2}\dfrac{\mu_0 NI}{R}\) et le calculer pour \(I = 0{,}50\ \text{A}\).</div>
  <div class="q"><strong>Q2.</strong> Calculer l'écart relatif entre le champ en \(z = R/5\) et le champ en \(O\). Comparer à l'écart relatif, à la même distance, pour une bobine seule. Conclure.</div>
  <div class="q"><strong>Q3.</strong> On veut annuler, au centre du dispositif, la composante horizontale du champ terrestre, \(B_h = 21\ \mu\text{T}\), dirigée vers le nord. Comment orienter l'axe des bobines et dans quel sens faire circuler le courant ? Calculer l'intensité nécessaire.</div>
  <div class="q"><strong>Q4.</strong> Comment se comporte une boussole placée au centre quand le champ horizontal est ainsi annulé ? Et si l'on double ensuite l'intensité ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par superposition, chaque bobine est à la distance \(d/2\) de \(O\) et y crée un champ axial de même sens :</p>
    <div class="formula">$$\begin{aligned}B(O) &= 2\,B_1\Big(\frac d2\Big) = \frac{\mu_0 NIR^2}{\big(R^2+d^2/4\big)^{3/2}}\\ &\underset{d=R}{=}\ \frac{\mu_0 NIR^2}{\big(\tfrac54R^2\big)^{3/2}}\\ &= \Big(\frac45\Big)^{3/2}\frac{\mu_0 NI}{R}\end{aligned}$$</div>
    <p>Numériquement :</p>
    <div class="formula">$$\begin{aligned}B(O) &= 0{,}716\times\frac{4\pi\times10^{-7}\times50}{0{,}10}\\ &\approx 4{,}5\times10^{-4}\ \text{T}\end{aligned}$$</div>
    <p><strong>Q2.</strong> En \(z = R/5\), les bobines sont aux distances \(0{,}3\,R\) et \(0{,}7\,R\) :</p>
    <div class="formula">$$\begin{aligned}\frac{B(R/5)}{B(O)} &= \frac{(1{,}09)^{-3/2}+(1{,}49)^{-3/2}}{2\times(1{,}25)^{-3/2}}\\ &\approx 0{,}998\end{aligned}$$</div>
    <p>soit un écart de \(-0{,}2\ \%\). Pour une bobine seule, le champ en \(z = R/5\) ne vaut plus que \((1{,}04)^{-3/2} \approx 0{,}943\) fois sa valeur au centre : écart de \(-5{,}7\ \%\), trente fois plus. Le dispositif de Helmholtz produit un champ quasi uniforme au voisinage du centre, dans un volume accessible.</p>
    <p><strong>Q3.</strong> Le champ des bobines est porté par leur axe : il faut un axe horizontal orienté nord–sud, et un courant tel que le champ au centre soit dirigé vers le <strong>sud</strong> (règle de la main droite : vu depuis le sud, le courant tourne dans le sens trigonométrique). Intensité :</p>
    <div class="formula">$$\begin{aligned}I &= \frac{B_hR}{0{,}716\,\mu_0 N}\\ &= \frac{21\times10^{-6}\times0{,}10}{0{,}716\times4\pi\times10^{-7}\times100}\\ &\approx 23\ \text{mA}\end{aligned}$$</div>
    <p><strong>Q4.</strong> Sur son pivot vertical, l'aiguille ne subit plus de couple : aucun champ horizontal ne la rappelle, elle reste dans la position où on la pose (équilibre indifférent), seuls les frottements la retiennent. Avec \(46\ \text{mA}\), le champ horizontal total vaut \(21\ \mu\text{T}\) dirigé vers le sud : l'aiguille se retourne et indique le sud ; sa position « nord » est devenue l'équilibre instable.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Aimants : moment magnétique et ordres de grandeur</h3>
  <div class="statement">Pour un aimant uniformément aimanté de volume \(V\), on admet \(\mathcal M \approx \dfrac{B_rV}{\mu_0}\), où \(B_r\) est une caractéristique du matériau : \(B_r \approx 1{,}3\ \text{T}\) pour le néodyme-fer-bore, \(0{,}40\ \text{T}\) pour une ferrite. À grande distance \(z\) d'un moment magnétique, sur son axe, le champ vaut \(B = \dfrac{\mu_0\mathcal M}{2\pi z^3}\) ; dans son plan équatorial, à la distance \(r\), il vaut \(\dfrac{\mu_0\mathcal M}{4\pi r^3}\). On donne \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le moment magnétique d'un aimant cylindrique en néodyme-fer-bore de diamètre \(10\ \text{mm}\) et de hauteur \(5{,}0\ \text{mm}\), puis celui d'un barreau de ferrite de \(40\times20\times10\ \text{mm}^3\).</div>
  <div class="q"><strong>Q2.</strong> Quelle intensité devrait parcourir une spire unique entourant le cylindre de néodyme pour avoir le même moment ? Commenter.</div>
  <div class="q"><strong>Q3.</strong> Calculer le champ du cylindre de néodyme sur son axe à \(10\ \text{cm}\), puis à \(30\ \text{cm}\). À quelle distance son champ est-il égal à la composante horizontale du champ terrestre, \(21\ \mu\text{T}\) ? Conséquence pour l'utilisation d'une boussole ?</div>
  <div class="q"><strong>Q4.</strong> À l'équateur, le champ terrestre vaut environ \(30\ \mu\text{T}\) au sol. En modélisant la Terre (rayon \(R_T = 6{,}4\times10^{6}\ \text{m}\)) par un moment magnétique placé en son centre, estimer son moment magnétique. Quel champ ce modèle prévoit-il aux pôles ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Cylindre de rayon \(5{,}0\ \text{mm}\) : \(V = \pi r^2h \approx 3{,}9\times10^{-7}\ \text{m}^3\). Barreau : \(V = 8{,}0\times10^{-6}\ \text{m}^3\). D'où :</p>
    <div class="formula">$$\begin{aligned}\mathcal M_{\text{NdFeB}} &\approx \frac{1{,}3\times3{,}9\times10^{-7}}{4\pi\times10^{-7}}\\ &\approx 0{,}41\ \text{A·m}^2\\ \mathcal M_{\text{ferrite}} &\approx \frac{0{,}40\times8{,}0\times10^{-6}}{4\pi\times10^{-7}}\\ &\approx 2{,}5\ \text{A·m}^2\end{aligned}$$</div>
    <p>On retrouve l'ordre de grandeur du cours : de l'ordre de \(1\ \text{A·m}^2\) pour un aimant usuel.</p>
    <p><strong>Q2.</strong> Spire d'aire \(S = \pi r^2 \approx 7{,}9\times10^{-5}\ \text{m}^2\) : \(I = \mathcal M/S \approx 5\times10^{3}\ \text{A}\). Aucun fil de cuivre de cette taille ne supporterait un tel courant (il fondrait) : un petit aimant remplace avantageusement une bobine dans un moteur ou un haut-parleur.</p>
    <p><strong>Q3.</strong> À \(10\ \text{cm}\) : \(B = 2\times10^{-7}\times\dfrac{0{,}41}{0{,}10^3} \approx 81\ \mu\text{T}\), quatre fois le champ horizontal terrestre ; à \(30\ \text{cm}\), \(27\) fois moins (\(1/z^3\)) : \(3{,}0\ \mu\text{T}\). Égalité pour \(z^3 = \dfrac{2\times10^{-7}\times0{,}41}{21\times10^{-6}}\), soit \(z \approx 16\ \text{cm}\). Une boussole doit donc être tenue à quelques dizaines de centimètres de tout aimant (haut-parleur, téléphone, fermoir) ; la décroissance en \(1/z^3\) rend la perturbation très locale.</p>
    <p><strong>Q4.</strong> Au sol, à l'équateur, \(B_{eq} = \dfrac{\mu_0\mathcal M_T}{4\pi R_T^3}\), d'où :</p>
    <div class="formula">$$\begin{aligned}\mathcal M_T &= \frac{4\pi R_T^3B_{eq}}{\mu_0}\\ &= 10^7\times2{,}6\times10^{20}\times3{,}0\times10^{-5}\\ &\approx 8\times10^{22}\ \text{A·m}^2\end{aligned}$$</div>
    <p>Aux pôles, on est sur l'axe du moment : le champ y est deux fois plus grand, \(\approx 60\ \mu\text{T}\), en accord avec les mesures.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Force entre deux fils parallèles</h3>
  <div class="statement">Deux câbles rectilignes parallèles, distants de \(d = 5{,}0\ \text{cm}\), sont parcourus dans le même sens par \(I_1 = 100\ \text{A}\) et \(I_2 = 50\ \text{A}\). On admet l'expression du champ d'un fil, \(B = \dfrac{\mu_0 I}{2\pi r}\), avec \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer le champ \(B_1\) créé par le câble 1 à l'emplacement du câble 2.</div>
  <div class="q"><strong>Q2.</strong> Calculer la force par unité de longueur exercée sur le câble 2. Est-ce une attraction ou une répulsion ? Pourquoi n'a-t-on pas tenu compte du champ créé par le câble 2 lui-même ?</div>
  <div class="q"><strong>Q3.</strong> Calculer de même la force exercée par le câble 2 sur le câble 1. Commenter.</div>
  <div class="q"><strong>Q4.</strong> Lors d'un court-circuit, les deux conducteurs d'un appareil, distants de \(2{,}0\ \text{mm}\), sont parcourus par \(500\ \text{A}\) en sens opposés. Calculer la force par unité de longueur et son effet.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(B_1 = \dfrac{\mu_0 I_1}{2\pi d} = \dfrac{2\times10^{-7}\times100}{0{,}050}\), soit \(B_1 = 0{,}40\ \text{mT}\), orthogonal au plan des deux câbles.</p>
    <p><strong>Q2.</strong> Le câble 2 est orthogonal à \(\vec B_1\) : \(\dfrac{F}{\ell} = I_2B_1 = 2{,}0\times10^{-2}\ \text{N·m}^{-1}\). Avec la règle des trois doigts (ou \(\vec e_z\wedge\vec e_y = -\vec e_x\) pour le câble 2 placé en \(x = d\), le câble 1 en \(O\), les courants selon \(\vec e_z\)), la force est dirigée vers le câble 1 : courants de même sens, <strong>attraction</strong>. La force de Laplace ne fait intervenir que le champ extérieur : le champ propre du câble 2 n'exerce sur lui aucune force d'ensemble.</p>
    <p><strong>Q3.</strong> Le câble 2 crée en 1 le champ \(B_2 = \dfrac{\mu_0 I_2}{2\pi d} = 2{,}0\times10^{-4}\ \text{T}\), d'où \(\dfrac{F}{\ell} = I_1B_2 = 2{,}0\times10^{-2}\ \text{N·m}^{-1}\), dirigée vers le câble 2. Les deux forces sont opposées et de même norme, \(\dfrac{\mu_0I_1I_2}{2\pi d}\) : c'est le principe des actions réciproques, bien que les champs \(B_1\) et \(B_2\) soient différents.</p>
    <p><strong>Q4.</strong> \(\dfrac{F}{\ell} = \dfrac{\mu_0I^2}{2\pi d} = \dfrac{2\times10^{-7}\times500^2}{2{,}0\times10^{-3}}\), soit \(25\ \text{N·m}^{-1}\) ou \(0{,}25\ \text{N}\) par centimètre de conducteur, en <strong>répulsion</strong> (courants opposés). Ces efforts brutaux peuvent déformer les barres et les bobinages d'une installation ; certains disjoncteurs limiteurs exploitent au contraire cette répulsion pour écarter très vite leurs contacts.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Rails de Laplace alimentés : effet moteur</h3>
  <div class="statement">On reprend le dispositif du cours (§9) : une barre \(PQ\), de masse \(m = 0{,}10\ \text{kg}\), glisse sans frottement sur deux rails horizontaux parallèles à \(Ox\), distants de \(\ell = 0{,}50\ \text{m}\). Le champ \(\vec B = B\,\vec e_z\), vertical vers le haut, est uniforme, avec \(B = 0{,}20\ \text{T}\). Un générateur impose l'intensité \(I = 5{,}0\ \text{A}\), qui circule de \(Q\) vers \(P\) dans la barre, c'est-à-dire selon \(\vec e_y\) (le repère \((\vec e_x,\vec e_y,\vec e_z)\) est direct). La barre part du repos.</div>
  <div class="q"><strong>Q1.</strong> Calculer la force de Laplace sur la barre (direction, sens, norme).</div>
  <div class="q"><strong>Q2.</strong> En supposant l'intensité constante, déterminer la vitesse et la distance parcourue au bout de \(1{,}0\ \text{s}\).</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance de la force de Laplace quand la barre avance à \(v = 2{,}0\ \text{m·s}^{-1}\). D'où vient cette énergie ?</div>
  <div class="q"><strong>Q4.</strong> On admet (chapitre « Induction électromagnétique ») que le mouvement fait apparaître dans le circuit, orienté dans le sens de \(I\), une force électromotrice induite \(e = -B\ell v\), en convention générateur. Calculer \(e\) pour \(v = 2{,}0\ \text{m·s}^{-1}\) et vérifier que \(\mathcal P_{\text{Laplace}} + e\,I = 0\). Pourquoi l'hypothèse « intensité constante » devient-elle difficile à tenir quand la vitesse augmente ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\vec F = I\,\overrightarrow{QP}\wedge\vec B\), avec \(\overrightarrow{QP} = \ell\,\vec e_y\) et \(\vec e_y\wedge\vec e_z = \vec e_x\) : \(\vec F = I\ell B\,\vec e_x\). La force est parallèle aux rails, dirigée selon \(+\vec e_x\), de norme \(5{,}0\times0{,}50\times0{,}20 = 0{,}50\ \text{N}\).</p>
    <p><strong>Q2.</strong> Le poids et la réaction des rails se compensent (pas de frottement) ; le principe fondamental de la dynamique projeté sur \(\vec e_x\) donne \(m\dot v = F\), soit une accélération constante \(F/m = 5{,}0\ \text{m·s}^{-2}\). Au bout de \(1{,}0\ \text{s}\) : \(v = 5{,}0\ \text{m·s}^{-1}\) et \(x = \tfrac12\times5{,}0\times1{,}0^2 = 2{,}5\ \text{m}\).</p>
    <p><strong>Q3.</strong> \(\mathcal P = \vec F\cdot\vec v = 0{,}50\times2{,}0 = 1{,}0\ \text{W}\) : la force est motrice, elle fournit de l'énergie cinétique à la barre. Cette énergie vient du générateur : c'est une conversion d'énergie électrique en énergie mécanique, l'effet moteur.</p>
    <p><strong>Q4.</strong> \(e = -0{,}20\times0{,}50\times2{,}0 = -0{,}20\ \text{V}\) et \(e\,I = -1{,}0\ \text{W}\) : on a bien \(\mathcal P_{\text{Laplace}} + eI = 1{,}0 - 1{,}0 = 0\). La f.é.m. induite, négative, s'oppose au courant (force contre-électromotrice) : le circuit reçoit par elle la puissance électrique \(-eI = 1{,}0\ \text{W}\), exactement convertie en puissance mécanique. Comme \(|e|\) croît avec \(v\), le générateur doit fournir une tension de plus en plus grande pour maintenir \(I\) : avec un générateur de f.é.m. fixe, le courant diminue et la barre tend vers une vitesse limite (étude au chapitre « Induction électromagnétique »).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Haut-parleur électrodynamique</h3>
  <div class="statement">Dans un haut-parleur, un aimant crée dans un entrefer annulaire d'axe \(Oz\) un champ <strong>radial</strong>, \(\vec B = B\,\vec e_r\) (coordonnées cylindriques d'axe \(Oz\)), de norme uniforme \(B = 0{,}80\ \text{T}\). Une bobine mobile de \(N = 60\) spires circulaires de rayon \(a = 12\ \text{mm}\), d'axe \(Oz\), placée dans l'entrefer, est solidaire de la membrane. L'ensemble mobile a une masse \(m = 6{,}0\ \text{g}\) ; la suspension exerce une force de rappel de raideur \(k = 1{,}5\times10^{3}\ \text{N·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> La bobine est parcourue par \(i\), orienté selon \(\vec e_\theta\). Montrer que les forces de Laplace élémentaires sont toutes dirigées selon \(\vec e_z\), dans le même sens, et que leur résultante vaut \(\vec F = -2\pi aNB\,i\,\vec e_z\). Calculer le « facteur de force » \(2\pi aNB\).</div>
  <div class="q"><strong>Q2.</strong> Pour un courant constant \(i = 0{,}40\ \text{A}\), calculer la force et le déplacement de la membrane à l'équilibre.</div>
  <div class="q"><strong>Q3.</strong> Si le champ dans lequel est placée la bobine était uniforme, quelle serait la résultante des forces de Laplace ? Pourquoi le champ radial est-il indispensable ?</div>
  <div class="q"><strong>Q4.</strong> La bobine est alimentée par \(i(t) = I_m\cos\omega t\). À un instant où \(i = 0{,}40\ \text{A}\) et où la membrane se déplace à \(0{,}20\ \text{m·s}^{-1}\) dans le sens de la force, calculer la puissance de la force de Laplace.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour un élément \(\mathrm{d}\vec\ell = a\,\mathrm{d}\theta\,\vec e_\theta\) : \(\mathrm{d}\vec F = i\,a\,\mathrm{d}\theta\,\vec e_\theta\wedge B\,\vec e_r\), soit \(\mathrm{d}\vec F = -iaB\,\mathrm{d}\theta\,\vec e_z\), car \(\vec e_\theta\wedge\vec e_r = -\vec e_z\) (base \((\vec e_r,\vec e_\theta,\vec e_z)\) directe). Toutes les forces élémentaires ont la même direction et le même sens, quel que soit \(\theta\) : elles s'ajoutent sans compensation. Sur \(N\) tours, \(\vec F = -2\pi aNB\,i\,\vec e_z\). Facteur de force : \(2\pi\times0{,}012\times60\times0{,}80 \approx 3{,}6\ \text{N·A}^{-1}\) (ou \(\text{T·m}\)) ; c'est le produit de \(B\) par la longueur totale de fil dans l'entrefer, \(4{,}5\ \text{m}\).</p>
    <p><strong>Q2.</strong> \(F = 3{,}6\times0{,}40 \approx 1{,}4\ \text{N}\). À l'équilibre, la suspension compense la force : \(x = F/k \approx 1{,}4/1\,500 \approx 1{,}0\ \text{mm}\).</p>
    <p><strong>Q3.</strong> Dans un champ uniforme, la résultante des forces de Laplace sur un circuit fermé est nulle (§8) : la bobine ne serait pas poussée. Le champ radial fait que le champ « tourne » avec le fil, de sorte que chaque élément est poussé dans le même sens : c'est toute l'astuce de la géométrie du haut-parleur.</p>
    <p><strong>Q4.</strong> La force est proportionnelle à \(i\) et suit donc ses variations : elle oscille à la pulsation \(\omega\). À l'instant considéré, \(F \approx 1{,}4\ \text{N}\) et \(\mathcal P = Fv \approx 1{,}4\times0{,}20 \approx 0{,}29\ \text{W}\), positive : la force de Laplace fournit de l'énergie mécanique à la membrane, qui la transmet à l'air sous forme d'onde sonore.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Cadre rectangulaire : couple, oscillations et principe du moteur</h3>
  <div class="statement">Un cadre rectangulaire de \(N = 100\) spires, de côtés \(a = 5{,}0\ \text{cm}\) (parallèles à l'axe \(\Delta\)) et \(b = 4{,}0\ \text{cm}\), peut tourner sans frottement autour d'un axe vertical \(\Delta\) passant par les milieux des côtés de longueur \(b\). Son moment d'inertie par rapport à \(\Delta\) vaut \(J = 2{,}0\times10^{-5}\ \text{kg·m}^2\). Il est parcouru par \(I = 0{,}30\ \text{A}\) et placé dans un champ uniforme horizontal \(B = 0{,}20\ \text{T}\). On repère sa position par l'angle \(\theta = (\vec B, \vec n)\), orienté par \(\vec e_\Delta\) (voir la figure du §10 du cours).</div>
  <div class="q"><strong>Q1.</strong> Montrer que les forces sur les côtés de longueur \(b\) ne font pas tourner le cadre. Calculer la norme de la force qui s'exerce sur chacun des côtés de longueur \(a\).</div>
  <div class="q"><strong>Q2.</strong> Établir l'expression \(\Gamma_\Delta = -\mathcal MB\sin\theta\) et calculer \(\mathcal M\) et le couple maximal.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les positions d'équilibre et leur stabilité. Calculer la période des petites oscillations autour de la position stable.</div>
  <div class="q"><strong>Q4.</strong> Le cadre est lâché sans vitesse depuis \(\theta_0 = 90^\circ\). Calculer sa vitesse angulaire quand il passe par \(\theta = 0\). Que se passe-t-il ensuite ?</div>
  <div class="q"><strong>Q5.</strong> Un moteur extérieur entraîne le cadre à vitesse angulaire constante \(\omega \gt 0\). Montrer que le travail du couple magnétique sur un tour est nul. On inverse désormais le courant chaque fois que \(\sin\theta\) change de signe, de sorte que le couple magnétique soit toujours de même signe que \(\omega\) (rôle du collecteur d'un moteur à courant continu). Calculer le couple moyen et la puissance moyenne fournie par les actions de Laplace pour \(\omega\) correspondant à \(600\ \text{tr·min}^{-1}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les côtés de longueur \(b\) sont orthogonaux à \(\Delta\), comme \(\vec B\) : \(\mathrm{d}\vec\ell\wedge\vec B\) est parallèle à \(\Delta\), et une force parallèle à un axe a un moment nul par rapport à cet axe. Les côtés de longueur \(a\) sont orthogonaux au champ : \(F = NIaB = 0{,}30\ \text{N}\) sur chacun, les deux forces étant opposées.</p>
    <p><strong>Q2.</strong> Les deux forces forment un couple ; chacune a pour bras de levier \(\dfrac b2|\sin\theta|\) : le moment total vaut \(NIabB|\sin\theta|\), et il fait tourner \(\vec n\) vers \(\vec B\), donc \(\Gamma_\Delta = -\mathcal MB\sin\theta\) avec \(\mathcal M = NIab = 6{,}0\times10^{-2}\ \text{A·m}^2\) (c'est la projection de \(\vec{\mathcal M}\wedge\vec B\) sur \(\vec e_\Delta\)). Couple maximal : \(\mathcal MB = 1{,}2\times10^{-2}\ \text{N·m}\), pour \(\theta = \pm90^\circ\).</p>
    <p><strong>Q3.</strong> \(\Gamma_\Delta = 0\) pour \(\theta = 0\) (stable : \(\Gamma_\Delta \approx -\mathcal MB\theta\) ramène le cadre) et \(\theta = \pi\) (instable). Le théorème du moment cinétique, \(J\ddot\theta = -\mathcal MB\sin\theta \approx -\mathcal MB\,\theta\), donne \(\omega_0 = \sqrt{\mathcal MB/J} \approx 24{,}5\ \text{rad·s}^{-1}\) (avec \(\mathcal MB = 1{,}2\times10^{-2}\ \text{N·m}\)) et \(T_0 = 2\pi/\omega_0 \approx 0{,}26\ \text{s}\).</p>
    <p><strong>Q4.</strong> Sans frottement, l'énergie \(\tfrac12J\dot\theta^2 + E_p\), avec \(E_p = -\mathcal MB\cos\theta\), se conserve : \(\tfrac12J\omega^2 = \mathcal MB(\cos0 - \cos90^\circ) = \mathcal MB\), d'où \(|\omega| = \sqrt{2\mathcal MB/J} \approx 35\ \text{rad·s}^{-1}\). Le cadre dépasse l'équilibre, remonte jusqu'à \(\theta = -90^\circ\), et oscille indéfiniment entre \(\pm90^\circ\) (en réalité, les frottements l'amortissent jusqu'à \(\theta = 0\)).</p>
    <p><strong>Q5.</strong> À vitesse constante, \(\theta = \omega t\) et \(\mathcal P = \Gamma_\Delta\omega = -\mathcal MB\omega\sin\omega t\), de moyenne nulle sur un tour : le couple est moteur pendant un demi-tour et résistant pendant l'autre. En inversant le courant quand \(\sin\theta\) change de signe, \(\Gamma_\Delta = +\mathcal MB|\sin\theta|\) reste positif ; sa moyenne sur un tour est \(\mathcal MB\times\dfrac2\pi\) (valeur moyenne de \(|\sin|\)) :</p>
    <div class="formula">$$\begin{aligned}\langle\Gamma_\Delta\rangle &= \frac{2\mathcal MB}{\pi} \approx 7{,}6\times10^{-3}\ \text{N·m}\\ \langle\mathcal P\rangle &= \langle\Gamma_\Delta\rangle\,\omega\\ &\approx 7{,}6\times10^{-3}\times\frac{2\pi\times600}{60}\\ &\approx 0{,}48\ \text{W}\end{aligned}$$</div>
    <p>C'est le principe du moteur à courant continu, dont le collecteur assure ce changement de sens ; plusieurs cadres décalés rendent le couple presque constant.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Boussole, bobines de Helmholtz et champ tournant</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>champ magnétique : bobines de Helmholtz, moment magnétique, équilibre et oscillations d'une boussole, champ tournant</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.

  <div class="statement">
    Une petite aiguille aimantée, de moment magnétique \(\mathcal M = 2{,}0\times10^{-2}\ \text{A·m}^2\) et de moment d'inertie \(J = 6{,}0\times10^{-8}\ \text{kg·m}^2\), peut tourner sans frottement autour d'un pivot vertical. Elle est placée au centre \(O\) d'une paire de bobines de Helmholtz (deux bobines plates coaxiales de \(N = 50\) spires, de rayon \(R = 10\ \text{cm}\), écartées de \(R\), parcourues dans le même sens par l'intensité \(I\)). On admet qu'au centre, le champ des bobines est porté par leur axe et vaut \(B_b = \kappa I\), avec \(\kappa = \big(\tfrac45\big)^{3/2}\dfrac{\mu_0 N}{R}\) et \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\). La composante horizontale du champ terrestre, \(\vec B_h\), dirigée vers le nord, est inconnue ; sa composante verticale n'agit pas sur l'aiguille.

  <p class="exo-part">Partie A — Mesure de la composante horizontale du champ terrestre</p>
  <div class="q"><strong>A1.</strong> Calculer \(\kappa\).</div>
  <div class="q"><strong>A2.</strong> L'axe des bobines est horizontal et orienté est–ouest. Montrer qu'à l'équilibre l'aiguille fait avec le nord l'angle \(\alpha\) tel que \(\tan\alpha = \dfrac{\kappa I}{B_h}\). Justifier que cette position est stable.</div>
  <div class="q"><strong>A3.</strong> On mesure : \(I = 10\), \(20\), \(40\), \(60\), \(80\ \text{mA}\) pour \(\alpha = 12^\circ\), \(23^\circ\), \(40{,}5^\circ\), \(52^\circ\), \(60^\circ\). Exploiter ces mesures pour déterminer \(B_h\).</div>
  <div class="q"><strong>A4.</strong> Une erreur de lecture \(\delta\alpha\) sur l'angle entraîne une erreur relative sur \(\tan\alpha\). Montrer qu'elle vaut \(\dfrac{\delta\alpha}{\sin\alpha\cos\alpha}\) et en déduire l'angle pour lequel la mesure est la plus précise.</div>

  <p class="exo-part">Partie B — Oscillations de l'aiguille</p>
  <div class="q"><strong>B1.</strong> L'aiguille est placée dans un champ horizontal uniforme de norme \(B\). Établir l'équation de son mouvement et la période \(T\) des petites oscillations autour de sa position d'équilibre stable.</div>
  <div class="q"><strong>B2.</strong> Sans courant, on mesure \(T_0 = 2{,}37\ \text{s}\). On tourne le dispositif pour que l'axe des bobines soit orienté nord–sud, et l'on fait passer \(I = 140\ \text{mA}\) dans le sens qui renforce \(\vec B_h\) : on mesure \(T_1 = 1{,}19\ \text{s}\). Montrer que \(\Big(\dfrac{T_0}{T_1}\Big)^2 = 1 + \dfrac{\kappa I}{B_h}\) et en déduire \(B_h\). Vérifier la cohérence avec la partie A et avec la valeur de \(\mathcal M\) et de \(J\).</div>
  <div class="q"><strong>B3.</strong> On inverse le courant. Décrire le comportement de l'aiguille quand \(I\) croît de \(0\) à \(140\ \text{mA}\).</div>

  <p class="exo-part">Partie C — Champ tournant et moteur synchrone</p>
  <div class="q"><strong>C1.</strong> On ajoute une seconde paire de bobines identique, d'axe nord–sud, la première étant d'axe est–ouest. On alimente la paire est–ouest par \(i_1 = I_m\cos\omega t\) et la paire nord–sud par \(i_2 = I_m\sin\omega t\). En négligeant le champ terrestre, montrer que le champ au centre est un champ tournant, préciser sa norme \(B_0\) et son sens de rotation (vu de dessus, avec \(\vec e_x\) vers l'est et \(\vec e_y\) vers le nord). Calculer \(B_0\) pour \(I_m = 0{,}50\ \text{A}\).</div>
  <div class="q"><strong>C2.</strong> L'aiguille tourne en synchronisme avec le champ, à \(f = 2{,}0\ \text{Hz}\), et subit un couple de frottement \(\Gamma_r = 1{,}5\times10^{-6}\ \text{N·m}\). Calculer l'angle de retard \(\alpha\) de l'aiguille sur le champ et la puissance fournie par le couple magnétique. Quel couple de frottement provoquerait le décrochage ?</div>
  <div class="q"><strong>C3.</strong> Le champ terrestre n'est pas négligeable : estimer son importance relative et son effet sur le mouvement de l'aiguille.</div>
  <div class="q"><strong>C4.</strong> L'aiguille étant initialement immobile, le champ tournant est établi brusquement à \(f = 2{,}0\ \text{Hz}\). Calculer la pulsation \(\omega_1 = \sqrt{\mathcal MB_0/J}\) des petites oscillations de l'aiguille dans le champ \(B_0\), et la comparer à la pulsation \(2\pi f\) du champ. Expliquer pourquoi l'aiguille ne démarre pas, et proposer un mode de démarrage.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong></p>
    <div class="formula">$$\begin{aligned}\kappa &= 0{,}716\times\frac{4\pi\times10^{-7}\times50}{0{,}10}\\ &\approx 4{,}5\times10^{-4}\ \text{T·A}^{-1}\end{aligned}$$</div>
    <p>Ainsi \(1\ \text{mA}\) crée \(0{,}45\ \mu\text{T}\).</p>
    <p><strong>A2.</strong> Le champ horizontal total en \(O\) est \(\vec B_h + \vec B_b\), avec \(\vec B_h\) vers le nord et \(\vec B_b\) selon l'axe est–ouest : ces deux vecteurs sont orthogonaux. L'aiguille, qui ne peut tourner que dans le plan horizontal, s'aligne à l'équilibre stable sur ce champ total, son moment dans le même sens (§11 du cours) ; elle fait donc avec le nord l'angle \(\alpha\) tel que \(\tan\alpha = \dfrac{B_b}{B_h} = \dfrac{\kappa I}{B_h}\). L'équilibre est stable car \(\vec{\mathcal M}\) et le champ total sont de même sens : un petit écart crée un couple de rappel.</p>
    <p><strong>A3.</strong> \(\tan\alpha\) doit être proportionnel à \(I\) : les valeurs \(0{,}213\) ; \(0{,}424\) ; \(0{,}854\) ; \(1{,}28\) ; \(1{,}73\) sont bien alignées avec l'origine en fonction de \(I\). La pente (régression linéaire passant par l'origine) vaut \(\dfrac{\kappa}{B_h} \approx 21{,}5\ \text{A}^{-1}\), d'où \(B_h = \dfrac{4{,}5\times10^{-4}}{21{,}5}\), soit \(B_h \approx 21\ \mu\text{T}\). Exploiter toute la série plutôt qu'un seul point réduit l'effet des erreurs de lecture.</p>
    <p><strong>A4.</strong> \(\mathrm{d}(\tan\alpha) = \dfrac{\mathrm{d}\alpha}{\cos^2\alpha}\), donc :</p>
    <div class="formula">$$\begin{aligned}\frac{\delta(\tan\alpha)}{\tan\alpha} &= \frac{\delta\alpha}{\cos^2\alpha\tan\alpha}\\ &= \frac{\delta\alpha}{\sin\alpha\cos\alpha} = \frac{2\,\delta\alpha}{\sin2\alpha}\end{aligned}$$</div>
    <p>Elle est minimale pour \(\sin2\alpha = 1\) : \(\alpha = 45^\circ\). On choisit donc \(I\) pour que la déviation soit voisine de \(45^\circ\), ici \(I \approx 47\ \text{mA}\). Près de \(0\) ou de \(90^\circ\), une petite erreur sur l'angle fausse fortement le résultat.</p>
    <p><strong>B1.</strong> Avec \(\theta\) l'angle entre le champ et le moment de l'aiguille, le théorème du moment cinétique par rapport à l'axe du pivot donne \(J\ddot\theta = -\mathcal MB\sin\theta\). Pour de petits angles, \(J\ddot\theta + \mathcal MB\,\theta = 0\) : oscillations harmoniques de période \(T = 2\pi\sqrt{\dfrac{J}{\mathcal MB}}\).</p>
    <p><strong>B2.</strong> Sans courant, \(B = B_h\) ; avec le courant, le champ des bobines s'ajoute à \(\vec B_h\) dans la même direction : \(B = B_h + \kappa I\). La période variant en \(1/\sqrt B\), \(\Big(\dfrac{T_0}{T_1}\Big)^2 = \dfrac{B_h+\kappa I}{B_h} = 1 + \dfrac{\kappa I}{B_h}\). Avec \(\kappa I = 4{,}5\times10^{-4}\times0{,}140 \approx 63\ \mu\text{T}\) et \((T_0/T_1)^2 = (2{,}37/1{,}19)^2 \approx 3{,}97\) : \(B_h = \dfrac{63}{3{,}97 - 1} \approx 21\ \mu\text{T}\), en accord avec la partie A. Contrôle : \(T_0 = 2\pi\sqrt{J/(\mathcal MB_h)} \approx 2{,}37\ \text{s}\) avec les valeurs de l'énoncé, cohérent avec la mesure. Cette méthode ne demande que des mesures de durées, très précises.</p>
    <p><strong>B3.</strong> Le champ horizontal vaut \(B_h - \kappa I\) (vers le nord) : il diminue, l'aiguille indique toujours le nord mais oscille de plus en plus lentement. Il s'annule pour \(\kappa I = B_h\), soit \(I \approx 47\ \text{mA}\) : l'aiguille n'a plus de position privilégiée (équilibre indifférent). Au-delà, le champ total est dirigé vers le sud : la position « nord » devient instable, l'aiguille se retourne et indique le sud ; à \(140\ \text{mA}\), le champ vaut \(63 - 21 = 42\ \mu\text{T}\) vers le sud.</p>
    <p><strong>C1.</strong> Par superposition, \(\vec B = \kappa i_1\,\vec e_x + \kappa i_2\,\vec e_y\), soit \(\vec B = B_0(\cos\omega t\,\vec e_x + \sin\omega t\,\vec e_y)\) avec \(B_0 = \kappa I_m\) : vecteur de norme constante qui fait l'angle \(\omega t\) avec \(\vec e_x\). Il tourne à la vitesse angulaire \(\omega\), de l'est vers le nord, c'est-à-dire dans le sens trigonométrique vu de dessus. \(B_0 = \kappa I_m \approx 2{,}25\times10^{-4}\ \text{T}\).</p>
    <p><strong>C2.</strong> En régime synchrone, l'aiguille a un retard constant \(\alpha\) et subit le couple \(\mathcal MB_0\sin\alpha\), qui équilibre le frottement :</p>
    <div class="formula">$$\begin{aligned}\sin\alpha &= \frac{\Gamma_r}{\mathcal MB_0}\\ &= \frac{1{,}5\times10^{-6}}{2{,}0\times10^{-2}\times2{,}25\times10^{-4}}\\ &\approx 0{,}33\end{aligned}$$</div>
    <p>d'où \(\alpha \approx 19^\circ\). Puissance : \(\mathcal P = \Gamma_r\,\omega = \Gamma_r\times2\pi f \approx 1{,}9\times10^{-5}\ \text{W}\), dissipée par le frottement. Décrochage si \(\Gamma_r \gt \mathcal MB_0 \approx 4{,}5\times10^{-6}\ \text{N·m}\).</p>
    <p><strong>C3.</strong> \(B_h/B_0 \approx 21/225 \approx 9\ \%\). Le champ total, \(\vec B_h + \vec B\), n'a plus une norme constante et ne tourne plus uniformément : il est plus intense quand \(\vec B\) pointe vers le nord, plus faible à l'opposé. Le couple moteur et l'angle de retard varient donc au cours du tour, et la rotation de l'aiguille est légèrement irrégulière, sans que sa vitesse moyenne change. On peut augmenter \(I_m\), ou compenser \(\vec B_h\) par un courant continu dans la paire nord–sud (exercice 6).</p>
    <p><strong>C4.</strong> \(\mathcal MB_0 = 4{,}5\times10^{-6}\ \text{N·m}\), d'où \(\omega_1 = \sqrt{\mathcal MB_0/J} \approx 8{,}7\ \text{rad·s}^{-1}\), alors que \(2\pi f \approx 12{,}6\ \text{rad·s}^{-1}\). Immobile, l'aiguille subit le couple \(\mathcal MB_0\sin(\omega t - \varphi)\), qui change de signe à chaque demi-tour du champ : avant qu'elle ait eu le temps de prendre de la vitesse (durée caractéristique \(1/\omega_1\)), le couple s'inverse, et sa moyenne est nulle. L'aiguille vibre sur place sans démarrer. Il faut la lancer à la main dans le bon sens, ou démarrer à basse fréquence (\(\omega \ll \omega_1\), où elle suit le champ quasi statiquement) puis augmenter progressivement la fréquence : c'est le problème du démarrage des moteurs synchrones.</p>
  </div>
