<template class="pan-tpl" data-panneau="th2-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Vocabulaire des transformations</h3>
  <div class="statement">Un gaz parfait diatomique (\(C_V = \tfrac52nR\), \(C_P = \tfrac72nR\)) part de l'état A (\(P_0 = 1{,}0\ \text{bar}\), \(T_0 = 300\ \text{K}\), \(V_0 = 2{,}0\ \text{L}\)) et atteint l'état final par trois chemins quasi statiques différents. Identifier la nature de chaque transformation et déterminer l'état final :</div>
  <div class="q"><strong>Q1.</strong> A → B₁ : \(P\) reste égale à \(P_0\), \(T\) monte jusqu'à 600 K.</div>
  <div class="q"><strong>Q2.</strong> A → B₂ : \(V\) reste égal à \(V_0\), \(P\) double.</div>
  <div class="q"><strong>Q3.</strong> A → B₃ : \(T\) reste égale à \(T_0\), \(V\) double.</div>
  <div class="q"><strong>Q4.</strong> Pour chaque cas, calculer \(W\), \(\Delta U\) et \(Q\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(P\) constante : <strong>isobare</strong>. À \(P\) et \(n\) fixés, \(V\) est proportionnel à \(T\) : \(T\) double, donc \(V_{B_1} = 4{,}0\ \text{L}\).</p>
    <p><strong>Q2.</strong> \(V\) constant : <strong>isochore</strong>. À \(V\) fixé, \(P\) est proportionnelle à \(T\) : \(P_{B_2} = 2{,}0\ \text{bar}\) et \(T_{B_2} = 600\ \text{K}\).</p>
    <p><strong>Q3.</strong> \(T\) constante : <strong>isotherme</strong>. \(PV = \text{cste}\) : \(P_{B_3} = 0{,}50\ \text{bar}\).</p>
    <p><strong>Q4.</strong> Inutile de calculer \(n\) : \(nRT_0 = P_0V_0 = 10^5\times2{,}0\times10^{-3} = 200\ \text{J}\), et une hausse de 300 K donne \(nR\,\Delta T = 200\ \text{J}\).</p>
    <ul>
      <li>A → B₁ (isobare) : \(W = -P_0(V_{B_1} - V_0) = -200\ \text{J}\) ; \(\Delta U = \tfrac52nR\,\Delta T = 500\ \text{J}\) ; \(Q = \Delta U - W = 700\ \text{J}\), qui est bien \(C_P\,\Delta T\) (monobare : \(Q = \Delta H\)).</li>
      <li>A → B₂ (isochore) : \(W = 0\) ; \(\Delta U = 500\ \text{J}\) (même \(\Delta T\)) ; \(Q = \Delta U = 500\ \text{J}\).</li>
      <li>A → B₃ (isotherme) : \(\Delta U = 0\) (gaz parfait) ; \(W = -nRT_0\ln2 = -200\ln2 \approx -139\ \text{J}\) ; \(Q = -W \approx +139\ \text{J}\).</li>
    </ul>
    <p>Pour la même élévation de température, l'isobare demande 200 J de plus que l'isochore : c'est le travail fourni par le gaz en se dilatant.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Cycle rectangulaire dans le diagramme de Clapeyron</h3>
  <div class="statement">Une mole de gaz parfait monoatomique (\(C_{V,m} = \tfrac32R\), \(C_{P,m} = \tfrac52R\)) décrit, de façon quasi statique, le cycle ABCDA :
    <ul>
      <li>A → B : isobare à \(P_1 = 2{,}0\times10^5\ \text{Pa}\), de \(V_1 = 10\ \text{L}\) à \(V_2 = 20\ \text{L}\) ;</li>
      <li>B → C : isochore à \(V_2\), de \(P_1\) à \(P_2 = 1{,}0\times10^5\ \text{Pa}\) ;</li>
      <li>C → D : isobare à \(P_2\), de \(V_2\) à \(V_1\) ;</li>
      <li>D → A : isochore à \(V_1\), de \(P_2\) à \(P_1\).</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Tracer le cycle dans le diagramme de Clapeyron. Dans quel sens est-il parcouru ? Le gaz est-il moteur ou récepteur ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le travail reçu sur chaque étape et sur le cycle. Retrouver ce dernier par une aire.</div>
  <div class="q"><strong>Q3.</strong> En déduire le transfert thermique total reçu sur un cycle.</div>
  <div class="q"><strong>Q4.</strong> Calculer les températures des quatre états, puis le transfert thermique reçu sur chaque étape. Vérifier le résultat de Q3.</div>
  <div class="q"><strong>Q5.</strong> On appelle rendement le rapport du travail fourni par le gaz au transfert thermique qu'il reçoit effectivement (somme des \(Q\) positifs). Le calculer.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> A (10 L ; 2 bar) en haut à gauche, B (20 L ; 2 bar) en haut à droite, C (20 L ; 1 bar) en bas à droite, D (10 L ; 1 bar) en bas à gauche : le rectangle est parcouru dans le sens <strong>horaire</strong>, le gaz est <strong>moteur</strong> (\(W_{\text{cycle}} \lt 0\)).</p>
    <p><strong>Q2.</strong> \(W_{AB} = -P_1(V_2 - V_1) = -2\,000\ \text{J}\) ; \(W_{BC} = 0\) ; \(W_{CD} = -P_2(V_1 - V_2) = +1\,000\ \text{J}\) ; \(W_{DA} = 0\). Sur le cycle, \(W = -1\,000\ \text{J}\) : c'est l'opposé de l'aire du rectangle, \((P_1 - P_2)(V_2 - V_1) = 10^5\times10^{-2} = 1\,000\ \text{J}\).</p>
    <p><strong>Q3.</strong> Cycle : \(\Delta U = 0\), donc \(Q = -W = +1\,000\ \text{J}\).</p>
    <p><strong>Q4.</strong> \(T = PV/R\) : \(T_A = 241\ \text{K}\), \(T_B = 481\ \text{K}\), \(T_C = 241\ \text{K}\), \(T_D = 120\ \text{K}\). Avec \(nR\,\Delta T = \Delta(PV)\) : \(Q_{AB} = \tfrac52P_1(V_2 - V_1) = +5\,000\ \text{J}\) (isobare : \(C_P\,\Delta T\)) ; \(Q_{BC} = \tfrac32V_2(P_2 - P_1) = -3\,000\ \text{J}\) (isochore : \(C_V\,\Delta T\)) ; \(Q_{CD} = \tfrac52P_2(V_1 - V_2) = -2\,500\ \text{J}\) ; \(Q_{DA} = \tfrac32V_1(P_1 - P_2) = +1\,500\ \text{J}\). Somme : \(5\,000 - 3\,000 - 2\,500 + 1\,500 = 1\,000\ \text{J}\), comme en Q3.</p>
    <p><strong>Q5.</strong> Le gaz reçoit \(5\,000 + 1\,500 = 6\,500\ \text{J}\) et fournit 1 000 J de travail : rendement \(1\,000/6\,500 \approx 0{,}15\). Il cède 5 500 J sur les deux autres étapes. Le rendement des machines thermiques est étudié dans le chapitre « Machines thermiques ».</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Compression adiabatique réversible (pompe à vélo)</h3>
  <div class="statement">On comprime de l'air (gaz parfait diatomique, \(\gamma = 1{,}4\)) dans une pompe à vélo bouchée. La compression, rapide mais sans frottement, est supposée adiabatique et quasi statique. État initial : \(T_0 = 293\ \text{K}\), \(P_0 = 1{,}0\ \text{bar}\), \(V_0 = 500\ \text{mL}\). On comprime jusqu'à \(V_1 = V_0/3\).</div>
  <div class="q"><strong>Q1.</strong> Calculer la pression finale \(P_1\) et la température finale \(T_1\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le travail \(W\) reçu par l'air.</div>
  <div class="q"><strong>Q3.</strong> Quel travail faudrait-il pour la même réduction de volume, effectuée très lentement, à 293 K ? Comparer.</div>
  <div class="q"><strong>Q4.</strong> Commenter la valeur de \(T_1\) : une pompe à vélo atteint-elle cette température ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Gaz parfait, \(\gamma\) constant, adiabatique et réversible : lois de Laplace. \(P_1 = P_0\left(\dfrac{V_0}{V_1}\right)^\gamma = 3^{1{,}4} \approx 4{,}66\ \text{bar}\) et \(T_1 = T_0\left(\dfrac{V_0}{V_1}\right)^{\gamma - 1} = 293\times3^{0{,}4} \approx 455\ \text{K}\), soit 182 °C.</p>
    <p><strong>Q2.</strong> \(Q = 0\), donc :</p>
    <div class="formula">$$W = \Delta U = \frac{P_1V_1 - P_0V_0}{\gamma - 1} = \frac{4{,}66\times10^5\times1{,}667\times10^{-4} - 50}{0{,}4} \approx +69\ \text{J}$$</div>
    <p>Avec \(n = P_0V_0/(RT_0) \approx 2{,}05\times10^{-2}\ \text{mol}\), \(\tfrac52nR(T_1 - T_0)\) donne la même valeur.</p>
    <p><strong>Q3.</strong> Isotherme quasi statique : \(W' = nRT_0\ln3 = P_0V_0\ln3\), soit \(50\times1{,}10 \approx 55\ \text{J}\). La compression adiabatique demande 25 % de travail en plus : l'air s'échauffe, sa pression monte plus vite, et il faut pousser plus fort.</p>
    <p><strong>Q4.</strong> Le modèle surestime fortement l'échauffement observé. Un coup de pompe dure une fraction de seconde : l'air atteint brièvement une température élevée, mais il échange de l'énergie avec le corps de pompe, de capacité thermique bien plus grande, et, dans une vraie pompe, la valve s'ouvre dès que la pression dépasse celle du pneu, si bien que l'air n'est pas comprimé jusqu'au bout. Après une série de coups, le bas de la pompe n'est que tiède ou chaud au toucher, de l'ordre de quelques dizaines de degrés.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Calorimétrie : capacité thermique de l'aluminium</h3>
  <div class="statement">Un calorimètre de valeur en eau \(\mu = 40\ \text{g}\) contient \(m_0 = 200\ \text{g}\) d'eau à \(T_0 = 20{,}0\ °\text{C}\). On y plonge \(m = 150\ \text{g}\) d'aluminium sortis d'une étuve à \(T_1 = 100{,}0\ °\text{C}\). La température finale d'équilibre est \(T_f = 29{,}5\ °\text{C}\). Donnée : \(c_{\text{eau}} = 4{,}18\ \text{J·K}^{-1}\text{·g}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Préciser le système et écrire son bilan d'enthalpie.</div>
  <div class="q"><strong>Q2.</strong> En déduire la capacité thermique massique \(c_{\text{Al}}\) de l'aluminium.</div>
  <div class="q"><strong>Q3.</strong> Comparer à la valeur tabulée \(0{,}897\ \text{J·K}^{-1}\text{·g}^{-1}\).</div>
  <div class="q"><strong>Q4.</strong> Le thermomètre est lu au dixième de degré. Quelle erreur relative une lecture \(T_f = 29{,}4\ °\text{C}\) entraînerait-elle ? Quelle grandeur limite la précision ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système {calorimètre, eau, aluminium}, supposé calorifugé, à la pression atmosphérique (monobare, équilibre mécanique au début et à la fin) : \(\Delta H = 0\). Par extensivité :</p>
    <div class="formula">$$(m_0 + \mu)\,c_{\text{eau}}(T_f - T_0) + m\,c_{\text{Al}}(T_f - T_1) = 0$$</div>
    <p><strong>Q2.</strong> On isole \(c_{\text{Al}}\), en veillant au signe (\(T_1 - T_f \gt 0\)) :</p>
    <div class="formula">$$c_{\text{Al}} = \frac{(m_0 + \mu)\,c_{\text{eau}}(T_f - T_0)}{m\,(T_1 - T_f)} = \frac{240\times4{,}18\times9{,}5}{150\times70{,}5} \approx 0{,}901\ \text{J·K}^{-1}\text{·g}^{-1}$$</div>
    <p><strong>Q3.</strong> Écart relatif \(0{,}004/0{,}897\), moins de 0,5 % : la mesure est excellente ; elle confirme que les pertes thermiques ont été faibles pendant l'expérience.</p>
    <p><strong>Q4.</strong> Avec 29,4 °C : \(c_{\text{Al}} = \dfrac{240\times4{,}18\times9{,}4}{150\times70{,}6} \approx 0{,}890\ \text{J·K}^{-1}\text{·g}^{-1}\), soit 1,2 % d'écart pour 0,1 °C. L'essentiel vient du facteur \(T_f - T_0 = 9{,}5\ \text{K}\) (0,1 sur 9,5 : 1,1 %), bien plus que de \(T_1 - T_f\) (0,1 sur 70,5). Pour gagner en précision, il faut que l'eau s'échauffe davantage : moins d'eau, ou plus de métal.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Détente de Joule-Gay-Lussac : gaz parfait et gaz réel</h3>
  <div class="statement">Deux enceintes de même volume \(V_0\), à parois rigides et calorifugées, sont reliées par un robinet fermé. L'une contient une mole de gaz à \(P_0 = 2{,}0\ \text{bar}\) et \(T_0 = 300\ \text{K}\), l'autre est vide. On ouvre le robinet.</div>
  <div class="q"><strong>Q1.</strong> Écrire le bilan d'énergie du gaz. En déduire \(\Delta U\), puis la température finale pour un gaz parfait.</div>
  <div class="q"><strong>Q2.</strong> Calculer la pression finale \(P_f\) pour un gaz parfait.</div>
  <div class="q"><strong>Q3.</strong> Pour un gaz réel, l'énergie interne dépend aussi du volume ; l'énoncé fournit \(U = C_VT - an^2/V\), où le terme en \(a \gt 0\) traduit les attractions entre molécules. Montrer que \(\Delta T \lt 0\). Calculer \(\Delta T\) pour \(a = 0{,}10\ \text{J·m}^3\text{·mol}^{-2}\) et \(C_V = \tfrac32R\) (on estimera \(V_0\) par la loi des gaz parfaits).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système : le gaz. Parois calorifugées : \(Q = 0\). Parois rigides : la frontière extérieure ne bouge pas et le gaz ne pousse rien en se répandant dans le vide : \(W = 0\). Le gaz est au repos au début et à la fin, donc \(\Delta U = 0\). Pour un gaz parfait, \(U = C_VT\) ne dépend que de \(T\) : \(T_f = T_0 = 300\ \text{K}\).</p>
    <p><strong>Q2.</strong> \(V_f = 2V_0\) et \(T_f = T_0\) : \(P_f = P_0/2 = 1{,}0\ \text{bar}\).</p>
    <p><strong>Q3.</strong> \(\Delta U = 0\) avec \(U = C_VT - an^2/V\) :</p>
    <div class="formula">$$C_V(T_f - T_0) = an^2\left(\frac{1}{V_f} - \frac{1}{V_0}\right) = an^2\left(\frac{1}{2V_0} - \frac{1}{V_0}\right) = -\frac{an^2}{2V_0}$$</div>
    <p>donc \(\Delta T = -\dfrac{an^2}{2C_VV_0} \lt 0\). Avec \(V_0 \approx RT_0/P_0 = 1{,}25\times10^{-2}\ \text{m}^3\) :</p>
    <div class="formula">$$\Delta T = -\frac{0{,}10}{2\times12{,}47\times1{,}25\times10^{-2}} \approx -0{,}32\ \text{K}$$</div>
    <p>Le refroidissement est faible mais mesurable : en s'éloignant les unes des autres, les molécules qui s'attirent gagnent de l'énergie potentielle d'interaction, prise sur leur agitation thermique. Plus le gaz est dense au départ (\(V_0\) petit), plus l'effet est grand.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ☆ ☆</span>
  <h3>De l'énergie mécanique à l'énergie interne : la grenaille de plomb</h3>
  <div class="statement">Un tube vertical fermé, de hauteur \(h = 1{,}0\ \text{m}\), contient \(m = 1{,}0\ \text{kg}\) de grenaille de plomb (\(c = 129\ \text{J·K}^{-1}\text{·kg}^{-1}\)). On retourne le tube 50 fois de suite, rapidement : à chaque retournement, le plomb tombe de \(h\) et s'arrête au fond. On néglige les transferts thermiques pendant l'expérience et la capacité thermique du tube.</div>
  <div class="q"><strong>Q1.</strong> Quel système choisir ? Quel travail reçoit-il à chaque retournement ?</div>
  <div class="q"><strong>Q2.</strong> Appliquer le premier principe sur les 50 retournements et calculer l'élévation de température du plomb.</div>
  <div class="q"><strong>Q3.</strong> Pourquoi choisir du plomb plutôt que de l'aluminium ?</div>
  <div class="q"><strong>Q4.</strong> De combien s'échauffe l'eau d'une chute de 50 m, si toute son énergie potentielle reste dans l'eau ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système : le plomb. En retournant le tube, l'expérimentateur remonte le plomb de \(h\) : il lui fournit le travail \(mgh = 1{,}0\times9{,}81\times1{,}0 = 9{,}81\ \text{J}\) (énergie potentielle). Pendant la chute, le poids rend ce travail au plomb sous forme d'énergie cinétique, que le choc final, inélastique, dissipe en énergie interne.</p>
    <p><strong>Q2.</strong> Plomb au repos au début et à la fin, \(Q \approx 0\) : \(\Delta U = W = 50\,mgh \approx 490\ \text{J}\). Phase condensée : \(\Delta T = \dfrac{\Delta U}{mc} = \dfrac{490}{129} \approx 3{,}8\ \text{K}\).</p>
    <p><strong>Q3.</strong> Pour une même énergie, l'échauffement est inversement proportionnel à \(c\) : avec l'aluminium (\(c \approx 900\)), il serait sept fois plus faible, 0,5 K, difficile à mesurer précisément. Cette expérience, inspirée de celles de Joule, montre qu'un travail peut produire le même effet qu'un transfert thermique.</p>
    <p><strong>Q4.</strong> Par kilogramme d'eau : \(c\,\Delta T = gh\), donc \(\Delta T = \dfrac{9{,}81\times50}{4\,180} \approx 0{,}12\ \text{K}\). L'eau stocke beaucoup d'énergie interne pour un faible échauffement.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Chauffer un gaz sous un piston lesté</h3>
  <div class="statement">Un cylindre vertical est fermé par un piston de masse \(m_p = 10\ \text{kg}\) et de section \(S = 100\ \text{cm}^2\), mobile sans frottement ; l'atmosphère est à \(P_0 = 1{,}0\times10^5\ \text{Pa}\). Il contient \(V_i = 2{,}0\ \text{L}\) d'air (gaz parfait diatomique) à 20 °C. Une résistance chauffe lentement l'air jusqu'à 120 °C. Donnée : \(g = 9{,}81\ \text{m·s}^{-2}\).</div>
  <div class="q"><strong>Q1.</strong> Exprimer et calculer la pression \(P\) de l'air. De quel type de transformation s'agit-il ?</div>
  <div class="q"><strong>Q2.</strong> Calculer la quantité d'air, le volume final et la hauteur dont monte le piston.</div>
  <div class="q"><strong>Q3.</strong> Calculer \(W\), \(\Delta U\) et le transfert thermique \(Q\) reçu par l'air. Vérifier \(Q = \Delta H\).</div>
  <div class="q"><strong>Q4.</strong> Montrer que le travail fourni par l'air se partage entre l'atmosphère et le piston, et chiffrer chaque part.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Équilibre du piston (lent, donc à chaque instant) : \(PS = P_0S + m_pg\), soit \(P = P_0 + \dfrac{m_pg}{S}\), soit \(1{,}098\times10^5\ \text{Pa}\). Elle reste constante : transformation <strong>isobare</strong> (quasi statique, à pression extérieure constante).</p>
    <p><strong>Q2.</strong> \(n = \dfrac{PV_i}{RT_i} \approx 9{,}01\times10^{-2}\ \text{mol}\). À pression constante, \(V \propto T\) : \(V_f = 2{,}0\times\dfrac{393{,}15}{293{,}15} \approx 2{,}68\ \text{L}\). Le piston monte de \(\Delta V/S = 0{,}682\times10^{-3}/10^{-2} \approx 6{,}8\ \text{cm}\).</p>
    <p><strong>Q3.</strong> \(W = -P\,\Delta V \approx -74{,}9\ \text{J}\). \(\Delta U = n\,\tfrac52R\,\Delta T \approx 187\ \text{J}\). \(Q = \Delta U - W \approx 262\ \text{J}\). Et \(\Delta H = n\,\tfrac72R\,\Delta T \approx 262\ \text{J}\) : on retrouve \(Q = \Delta H\), puisque la transformation est monobare avec équilibre mécanique au début et à la fin.</p>
    <p><strong>Q4.</strong> \(|W| = P\,\Delta V = P_0\,\Delta V + m_pg\,\Delta V/S\) : 68,2 J pour repousser l'atmosphère et \(m_pg\,h = 98{,}1\times0{,}0682 \approx 6{,}7\ \text{J}\) pour soulever le piston (son énergie potentielle). Total : 74,9 J.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Trois chemins entre deux états</h3>
  <div class="statement">0,20 mol de gaz parfait diatomique passe de l'état A (\(T_A = 300\ \text{K}\), \(P_A = 1{,}0\ \text{bar}\)) à l'état B (\(T_B = 300\ \text{K}\), \(P_B = 3{,}0\ \text{bar}\)) par trois chemins quasi statiques :
    <ul>
      <li>chemin 1 : isotherme ;</li>
      <li>chemin 2 : isochore AC jusqu'à \(P_B\), puis isobare CB ;</li>
      <li>chemin 3 : isobare AD jusqu'au volume \(V_B\), puis isochore DB.</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> Calculer \(V_A\), \(V_B\), \(T_C\), \(T_D\), et représenter les trois chemins dans le diagramme de Clapeyron.</div>
  <div class="q"><strong>Q2.</strong> Que vaut \(\Delta U\) sur chaque chemin ?</div>
  <div class="q"><strong>Q3.</strong> Calculer le travail reçu sur chaque chemin et les classer à l'aide du diagramme.</div>
  <div class="q"><strong>Q4.</strong> En déduire le transfert thermique reçu sur chaque chemin. Pour le chemin 2, le vérifier étape par étape.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(V_A = \dfrac{nRT_A}{P_A} \approx 4{,}99\ \text{L}\) et \(V_B = V_A/3 \approx 1{,}66\ \text{L}\). Isochore AC (volume \(V_A\)) jusqu'à 3,0 bar : \(T_C = 3T_A = 900\ \text{K}\). Isobare AD (1,0 bar) jusqu'à \(V_B\) : \(T_D = T_A/3 = 100\ \text{K}\). Dans le plan \((V, P)\), le chemin 2 passe en haut (verticale puis horizontale à 3 bar), le chemin 3 en bas (horizontale à 1 bar puis verticale), l'isotherme entre les deux.</p>
    <p><strong>Q2.</strong> \(T_B = T_A\) et \(U\) ne dépend que de \(T\) : \(\Delta U = 0\) sur les trois chemins.</p>
    <p><strong>Q3.</strong> Compressions : \(W \gt 0\), égal à l'aire sous chaque chemin. Chemin 1 : \(W_1 = nRT\ln\dfrac{V_A}{V_B} = nRT\ln3 \approx 548\ \text{J}\). Chemin 2 (seule l'isobare CB travaille) : \(W_2 = -P_B(V_B - V_A) \approx 998\ \text{J}\). Chemin 3 : \(W_3 = -P_A(V_B - V_A) \approx 333\ \text{J}\). Classement \(W_2 \gt W_1 \gt W_3\) : le chemin qui passe le plus haut demande le plus de travail.</p>
    <p><strong>Q4.</strong> \(Q = \Delta U - W = -W\) : \(Q_1 \approx -548\ \text{J}\), \(Q_2 \approx -998\ \text{J}\), \(Q_3 \approx -333\ \text{J}\) ; le gaz cède toujours de l'énergie au milieu extérieur. Chemin 2 étape par étape : \(Q_{AC} = n\,\tfrac52R(T_C - T_A) \approx +2\,494\ \text{J}\) et \(Q_{CB} = n\,\tfrac72R(T_B - T_C) \approx -3\,492\ \text{J}\), somme \(-998\ \text{J}\). Le gaz reçoit d'abord, puis cède davantage : le bilan seul ne dit rien des échanges intermédiaires.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Méthode électrique : valeur en eau et capacité thermique d'un liquide</h3>
  <div class="statement">Un calorimètre contient 400 g d'eau à 18,0 °C. Une résistance \(R = 10{,}0\ \Omega\), parcourue par un courant \(I = 2{,}00\ \text{A}\) pendant 6,0 min, porte l'ensemble à 26,1 °C (agitation permanente). Donnée : \(c_{\text{eau}} = 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Écrire le bilan d'énergie du système {calorimètre, eau, résistance} et calculer la valeur en eau \(\mu\).</div>
  <div class="q"><strong>Q2.</strong> On remplace l'eau par 400 g d'éthanol, initialement à 18,0 °C. Le même chauffage élève la température de 13,3 K. Calculer la capacité thermique massique de l'éthanol.</div>
  <div class="q"><strong>Q3.</strong> En réalité, 5 % de l'énergie électrique est perdue pendant la première mesure. Que vaut alors \(\mu\) ? Commenter la fiabilité de la méthode pour mesurer \(\mu\), et proposer une amélioration.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Système calorifugé, monobare, qui reçoit le travail électrique \(W_e = RI^2\,\Delta t = 14\,400\ \text{J}\) : \(\Delta H = W_e\), soit \((m + \mu)\,c_{\text{eau}}\,\Delta T = W_e\) avec \(\Delta T = 8{,}1\ \text{K}\). Donc \(m + \mu = \dfrac{14\,400}{4\,180\times8{,}1} \approx 0{,}425\ \text{kg}\) et \(\mu \approx 25\ \text{g}\).</p>
    <p><strong>Q2.</strong> \((m\,c + \mu\,c_{\text{eau}})\,\Delta T = W_e\), d'où :</p>
    <div class="formula">$$c = \frac{W_e/\Delta T - \mu\,c_{\text{eau}}}{m} = \frac{1\,083 - 106}{0{,}400} \approx 2{,}44\ \text{kJ·K}^{-1}\text{·kg}^{-1}$$</div>
    <p>C'est proche de la valeur tabulée (2,44 à 25 °C). L'éthanol s'échauffe plus vite que l'eau : sa capacité thermique massique est plus faible.</p>
    <p><strong>Q3.</strong> Seuls \(0{,}95\,W_e = 13\,680\ \text{J}\) ont chauffé l'ensemble : \(m + \mu = 0{,}404\ \text{kg}\), \(\mu \approx 4\ \text{g}\) au lieu de 25. Une petite erreur sur l'énergie (5 %) donne une erreur énorme sur \(\mu\), qui n'est qu'une petite correction devant les 400 g d'eau. On mesure mieux \(\mu\) avec peu d'eau, ou par la méthode des mélanges, et en limitant les pertes (couvercle, durée courte, température initiale un peu inférieure à l'ambiante).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Bilan en puissance : le ballon d'eau chaude</h3>
  <div class="statement">Un ballon d'eau chaude contient 150 L d'eau (\(C = 6{,}27\times10^5\ \text{J·K}^{-1}\)), chauffée par une résistance de puissance \(\mathcal P = 2{,}0\ \text{kW}\). Malgré son isolant, il perd vers la pièce, à \(T_a = 15\ °\text{C}\), la puissance \(G\,(T - T_a)\), avec \(G = 1{,}5\ \text{W·K}^{-1}\). L'eau, homogène, est à 15 °C au départ.</div>
  <div class="q"><strong>Q1.</strong> Sans pertes, combien de temps faut-il pour atteindre 65 °C ?</div>
  <div class="q"><strong>Q2.</strong> Écrire le premier principe entre \(t\) et \(t + \mathrm{d}t\) en tenant compte des pertes. En déduire \(T(t)\), la constante de temps et la durée de chauffe jusqu'à 65 °C. Les pertes jouent-elles un rôle pendant la chauffe ?</div>
  <div class="q"><strong>Q3.</strong> Un thermostat maintient ensuite l'eau à 65 °C. Quelle puissance moyenne faut-il ? Quelle énergie par jour ?</div>
  <div class="q"><strong>Q4.</strong> Le chauffage est coupé pendant 10 h. Quelle est alors la température de l'eau ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(Q = C\,\Delta T = 6{,}27\times10^5\times50 \approx 31{,}4\ \text{MJ}\) et \(\Delta t = Q/\mathcal P \approx 15\,700\ \text{s}\), soit 4 h 21 min.</p>
    <p><strong>Q2.</strong> Entre \(t\) et \(t + \mathrm{d}t\) (eau incompressible, monobare) : \(C\,\mathrm{d}T = \mathcal P\,\mathrm{d}t - G(T - T_a)\,\mathrm{d}t\), soit \(C\,\dfrac{\mathrm{d}T}{\mathrm{d}t} + G(T - T_a) = \mathcal P\). Avec \(T(0) = T_a\) : \(T(t) = T_a + \dfrac{\mathcal P}{G}\left(1 - \mathrm{e}^{-t/\tau}\right)\), \(\tau = \dfrac{C}{G} \approx 4{,}18\times10^5\ \text{s}\), soit 116 h. La durée de chauffe est \(t = -\tau\ln\left(1 - \dfrac{G\times50}{\mathcal P}\right) \approx 16\,000\ \text{s}\), 2 % de plus que sans pertes : pendant la chauffe, les pertes (au plus 75 W) sont négligeables devant 2 kW. (La limite \(T_a + \mathcal P/G\), plus de 1 300 °C, n'a pas de sens physique : le thermostat coupe bien avant.)</p>
    <p><strong>Q3.</strong> Régime permanent : \(\mathrm{d}T/\mathrm{d}t = 0\), la résistance compense les pertes : \(G(65 - 15) = 75\ \text{W}\) en moyenne, soit \(75\times86\,400 \approx 6{,}5\ \text{MJ}\), 1,8 kWh par jour, sans tirer une goutte d'eau.</p>
    <p><strong>Q4.</strong> Sans chauffage : \(C\,\mathrm{d}T/\mathrm{d}t = -G(T - T_a)\), donc \(T - T_a = 50\,\mathrm{e}^{-t/\tau}\). Après 10 h (36 000 s) : \(T = 15 + 50\,\mathrm{e}^{-0{,}086} \approx 60{,}9\ °\text{C}\). L'eau perd 4 °C en une nuit : un bon ballon garde sa chaleur, ce qui permet de chauffer aux heures creuses.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Compression brutale dans un cylindre calorifugé</h3>
  <div class="statement">Un cylindre calorifugé, fermé par un piston sans masse mobile sans frottement, contient 0,10 mol d'air (gaz parfait diatomique, \(\gamma = 1{,}4\)) à \(T_i = 300\ \text{K}\) sous \(P_i = 1{,}0\ \text{bar}\). On pose brusquement sur le piston une masse qui porte la pression extérieure à \(P_e = 3{,}0\ \text{bar}\), et l'on attend l'équilibre.</div>
  <div class="q"><strong>Q1.</strong> Pourquoi ne peut-on pas utiliser la loi de Laplace ? Quelles sont la pression finale et la nature de la transformation ?</div>
  <div class="q"><strong>Q2.</strong> Par le premier principe, établir la température finale \(T_f\) en fonction de \(T_i\), \(P_i\), \(P_e\) et \(\gamma\). Calculer \(T_f\), \(V_i\) et \(V_f\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le travail reçu par le gaz et le comparer à celui d'une compression adiabatique réversible jusqu'à la même pression.</div>
  <div class="q"><strong>Q4.</strong> Montrer que, si fort que soit \(P_e\), le volume ne peut pas être divisé par plus de \(\gamma/(\gamma - 1)\).</div>
  <div class="q"><strong>Q5.</strong> On retire l'isolation : le gaz revient à 300 K au contact de l'air extérieur, la masse restant sur le piston. Calculer le volume final et le transfert thermique reçu par le gaz.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La compression est brutale : le gaz passe par des états hors d'équilibre, la transformation n'est pas réversible, et Laplace ne s'applique pas. À l'équilibre final, le piston sans masse impose \(P_f = P_e = 3{,}0\ \text{bar}\). Transformation <strong>adiabatique</strong> (calorifugé) et <strong>monobare</strong> (\(P_e\) constante).</p>
    <p><strong>Q2.</strong> Système {gaz, piston, masse}, au repos au début et à la fin : \(\Delta U = W = -P_e(V_f - V_i)\), avec \(P_eV_f = nRT_f\) et \(V_i = nRT_i/P_i\). Avec \(C_V = nR/(\gamma - 1)\) :</p>
    <div class="formula">$$\frac{T_f - T_i}{\gamma - 1} = -T_f + T_i\,\frac{P_e}{P_i} \quad\Longrightarrow\quad T_f = T_i\,\frac{1 + (\gamma - 1)P_e/P_i}{\gamma}$$</div>
    <p>\(T_f = 300\times\dfrac{1 + 0{,}4\times3}{1{,}4} \approx 471\ \text{K}\) ; \(V_i = \dfrac{nRT_i}{P_i} \approx 2{,}49\ \text{L}\) ; \(V_f = \dfrac{nRT_f}{P_e} \approx 1{,}31\ \text{L}\).</p>
    <p><strong>Q3.</strong> \(W = \Delta U = n\,\tfrac52R(T_f - T_i) \approx 356\ \text{J}\) ; contrôle : \(-P_e(V_f - V_i) \approx 356\ \text{J}\). Laplace jusqu'à 3,0 bar : \(T = T_i(P_e/P_i)^{(\gamma-1)/\gamma} \approx 411\ \text{K}\), \(V \approx 1{,}14\ \text{L}\), \(W \approx 230\ \text{J}\). La compression brutale demande plus de travail, chauffe davantage le gaz et le comprime moins.</p>
    <p><strong>Q4.</strong> Avec \(r = P_e/P_i\) :</p>
    <div class="formula">$$\frac{V_i}{V_f} = \frac{P_e}{P_i}\,\frac{T_i}{T_f} = \frac{\gamma\,r}{1 + (\gamma - 1)\,r}$$</div>
    <p>Cette fonction croît avec \(r\) et tend vers \(\gamma/(\gamma - 1) = 3{,}5\) : au-delà, l'énergie reçue chauffe le gaz plus qu'elle ne le comprime. Ici, \(V_i/V_f \approx 1{,}91\).</p>
    <p><strong>Q5.</strong> Monobare sous \(P_e\), avec équilibre mécanique au début et à la fin : \(V = nR\times300/P_e \approx 0{,}83\ \text{L}\) et \(Q = \Delta H = n\,\tfrac72R(300 - 471) \approx -499\ \text{J}\). Sur l'ensemble des deux étapes, le gaz est revenu à 300 K : il a reçu \(356 + 143 = 499\ \text{J}\) de travail et cédé autant à l'extérieur.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Deux compartiments, un piston et une résistance</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>premier principe, loi de Laplace</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Un cylindre horizontal, rigide et calorifugé, est partagé en deux compartiments par un piston calorifugé, mobile sans frottement. Au départ, chacun contient la même quantité \(n\) d'air (gaz parfait diatomique, \(\gamma = 1{,}4\)) dans le même état : \(P_0 = 1{,}00\ \text{bar}\), \(V_0 = 2{,}50\ \text{L}\), \(T_0 = 300\ \text{K}\). Une résistance placée dans le compartiment (1) chauffe très lentement son gaz, jusqu'à ce que la pression atteigne \(P_f = 2{,}00\ \text{bar}\). La capacité thermique de la résistance est négligeable. Donnée : \(R = 8{,}314\ \text{J·K}^{-1}\text{·mol}^{-1}\).
  </div>

</figure>

  <p class="exo-part">Partie A — Conditions imposées</p>
  <div class="q"><strong>A1.</strong> Calculer \(n\). Que peut-on dire, à chaque instant, des pressions \(P_1\) et \(P_2\) des deux gaz ? Et de \(V_1 + V_2\) ?</div>
  <div class="q"><strong>A2.</strong> Quelle est la nature de la transformation du gaz (2) ? Celle du gaz (1) ?</div>

  <p class="exo-part">Partie B — État final</p>
  <div class="q"><strong>B1.</strong> Déterminer le volume \(V_2\) et la température \(T_2\) du gaz (2) dans l'état final.</div>
  <div class="q"><strong>B2.</strong> En déduire \(V_1\) et \(T_1\). Représenter les deux transformations dans un même diagramme de Clapeyron.</div>

  <p class="exo-part">Partie C — Bilans d'énergie</p>
  <div class="q"><strong>C1.</strong> Calculer le travail \(W_2\) reçu par le gaz (2), puis le travail \(W_1\) reçu par le gaz (1).</div>
  <div class="q"><strong>C2.</strong> Calculer l'énergie \(W_e\) fournie par la résistance, d'abord par un bilan sur le gaz (1), puis par un bilan sur l'ensemble des deux gaz. Montrer que \(W_e = \dfrac{2V_0(P_f - P_0)}{\gamma - 1}\).</div>
  <div class="q"><strong>C3.</strong> La résistance reçoit une puissance électrique de 10 W. Quelle est la durée du chauffage ? Que penser de l'hypothèse « très lentement » ?</div>

  <p class="exo-part">Partie D — Variantes</p>
  <div class="q"><strong>D1.</strong> Le chauffage terminé, le piston, bloqué dans sa position, devient diathermane. Déterminer l'état d'équilibre final des deux gaz. On débloque alors le piston : bouge-t-il ?</div>
  <div class="q"><strong>D2.</strong> On recommence l'expérience initiale avec de l'hélium (\(\gamma = 5/3\)) à la place de l'air. Quelle énergie faut-il fournir ? Commenter.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(n = \dfrac{P_0V_0}{RT_0} = \dfrac{250}{8{,}314\times300} \approx 0{,}100\ \text{mol}\) par compartiment. Le piston, sans masse ni frottement, évolue lentement : son équilibre impose \(P_1 = P_2\) à chaque instant. Le cylindre est rigide : \(V_1 + V_2 = 2V_0 = 5{,}00\ \text{L}\).</p>
    <p><strong>A2.</strong> Gaz (2) : il ne reçoit aucun transfert thermique (piston et parois calorifugés) et il est comprimé lentement, sans frottement : transformation <strong>adiabatique et réversible</strong>, à laquelle s'applique la loi de Laplace. Gaz (1) : il reçoit l'énergie de la résistance ; sa transformation est quasi statique mais <strong>pas adiabatique</strong> : Laplace ne s'applique pas.</p>
    <p><strong>B1.</strong> Laplace pour le gaz (2), \(P_0V_0^\gamma = P_fV_2^\gamma\), puis en \((T, P)\) :</p>
    <div class="formula">$$V_2 = V_0\left(\frac{P_0}{P_f}\right)^{1/\gamma} \approx 1{,}52\ \text{L} \qquad T_2 = T_0\left(\frac{P_f}{P_0}\right)^{(\gamma-1)/\gamma} \approx 366\ \text{K}$$</div>
    <p>avec \(0{,}5^{1/1{,}4} \approx 0{,}610\) et \(2^{0{,}4/1{,}4} \approx 1{,}219\).</p>
    <p><strong>B2.</strong> \(V_1 = 2V_0 - V_2 \approx 3{,}48\ \text{L}\) et \(T_1 = T_0\,\dfrac{P_fV_1}{P_0V_0} \approx 834\ \text{K}\). Dans le plan \((V, P)\), les deux chemins partent du même point (2,50 L ; 1,00 bar) et arrivent à la même pression 2,00 bar : celui du gaz (2) est l'adiabatique de Laplace vers les petits volumes ; celui du gaz (1) monte vers les grands volumes, sa pression valant à chaque instant \(P_0\left(\dfrac{V_0}{2V_0 - V_1}\right)^\gamma\).</p>
    <p><strong>C1.</strong> Gaz (2) adiabatique, avec \(C_V = nR/(\gamma - 1)\) et \(nRT = PV\) :</p>
    <div class="formula">$$W_2 = \Delta U_2 = \frac{P_fV_2 - P_0V_0}{\gamma - 1} = \frac{304{,}8 - 250}{0{,}4} \approx 137\ \text{J}$$</div>
    <p>Le piston, sans masse, transmet intégralement le travail : à chaque instant, \(\delta W_1 = -P\,\mathrm{d}V_1 = +P\,\mathrm{d}V_2 = -\delta W_2\), donc \(W_1 = -137\ \text{J}\) (le gaz (1) fournit le travail qui comprime le gaz (2)).</p>
    <p><strong>C2.</strong> Gaz (1) : le transfert thermique qu'il reçoit est l'énergie fournie par la résistance.</p>
    <div class="formula">$$\Delta U_1 = \frac{P_fV_1 - P_0V_0}{\gamma - 1} = \frac{695{,}2 - 250}{0{,}4} \approx 1\,113\ \text{J} \qquad W_e = Q_1 = \Delta U_1 - W_1 \approx 1\,250\ \text{J}$$</div>
    <p>Ensemble des deux gaz et du piston : volume total constant et parois calorifugées, la seule énergie reçue est \(W_e\) ; par extensivité :</p>
    <div class="formula">$$W_e = \Delta U_1 + \Delta U_2 = \frac{P_f(V_1 + V_2) - 2P_0V_0}{\gamma - 1} = \frac{2V_0(P_f - P_0)}{\gamma - 1} = 1\,250\ \text{J}$$</div>
    <p>Le second bilan évite tout calcul de travail.</p>
    <p><strong>C3.</strong> \(\Delta t = 1\,250/10 = 125\ \text{s}\). Le piston se déplace d'environ 1 L en deux minutes : bien plus lentement que les ondes de pression (quelques millisecondes pour traverser le cylindre), si bien que la pression reste uniforme ; l'hypothèse quasi statique est raisonnable. L'hypothèse « adiabatique » du gaz (2) l'est moins : en deux minutes, un vrai piston laisserait passer un peu d'énergie.</p>
    <p><strong>D1.</strong> Piston bloqué : chaque gaz garde son volume, le système total ne reçoit rien (\(W = 0\), \(Q = 0\)), donc \(U_1 + U_2\) est conservée. Même \(n\), même \(C_V\) : la température commune finale est la moyenne, \(T = \dfrac{834 + 366}{2} = 600\ \text{K}\). Pressions : \(P_1' = nRT/V_1 \approx 1{,}44\ \text{bar}\) et \(P_2' = nRT/V_2 \approx 3{,}28\ \text{bar}\). Débloqué, le piston est poussé vers le compartiment (1) ; à l'équilibre (températures et pressions égales, même \(n\)), les deux volumes sont égaux à 2,50 L. Le volume total et l'énergie interne totale étant conservés, \(T = 600\ \text{K}\) et \(P = 2{,}00\ \text{bar}\).</p>
    <p><strong>D2.</strong> La formule de C2 donne \(W_e = \dfrac{5\times10^{-3}\times10^5}{2/3} = 750\ \text{J}\), contre 1 250 J pour l'air. Un gaz monoatomique a une capacité thermique plus faible (\(C_V = \tfrac32nR\) au lieu de \(\tfrac52nR\)) : pour la même hausse de pression à volume total fixé, il faut augmenter moins son énergie interne. Le gaz (2) monte à \(300\times2^{0{,}4} \approx 396\ \text{K}\), le gaz (1) à environ 804 K.</p>
  </div>
