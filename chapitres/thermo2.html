  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre traite les parties 3.2 « Énergie échangée par un système au cours d'une transformation » et 3.3 « Premier principe. Bilans d'énergie » du programme de PTSI. Il s'appuie sur <a href="#thermo1/cours">« Introduction thermodynamique »</a> (variables d'état, gaz parfait, phases condensées, énergie interne, \(C_V\)). Les enthalpies de changement d'état, qui font aussi partie de 3.3, sont traitées dans <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a> (§7, §8). Il prépare <a href="#thermo3/cours">« Deuxième principe : bilans d'entropie »</a> et <a href="#machines/cours">« Machines thermiques »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Transformations</strong> isochore, isotherme, isobare, monobare, monotherme ; définir un système adapté à une problématique donnée (§1, §2).</li>
        <li>Exploiter les <strong>conditions imposées par le milieu extérieur</strong> pour déterminer l'état d'équilibre final (§1, §6).</li>
        <li><strong>Thermostat</strong>, transformations monotherme et isotherme : identifier dans une situation expérimentale le ou les systèmes modélisables par un thermostat (§1).</li>
        <li><strong>Transferts thermiques</strong> : distinguer qualitativement conduction, convection et rayonnement (§2) ; transformation adiabatique (§1, §5, §6).</li>
        <li><strong>Premier principe</strong> : définir un système fermé et établir pour ce système un bilan énergétique faisant intervenir travail et transfert thermique (§2) ; l'utiliser entre deux états voisins (§2, §5, §9) ; exploiter l'extensivité de l'énergie interne (§2, §8).</li>

<div class="course-section">
  <div class="sec-num">§1 · TRANSFORMATIONS THERMODYNAMIQUES</div>
  <h2>Types de transformations</h2>
  <div class="intro">Un système subit une transformation lorsqu'il évolue d'un état d'équilibre thermodynamique à un autre. Le vocabulaire des transformations dit ce qui est imposé au système (une pression extérieure, une température extérieure, un volume, l'absence d'échange thermique) : c'est lui qui indique, dans un énoncé, quelles simplifications s'appliquent.</div>
  <p><strong>Choisir le système.</strong> C'est la première décision d'un bilan : le gaz seul, le gaz et le piston, l'eau et le calorimètre… Le système est délimité par une frontière (une paroi ou une surface fictive) ; tout le reste est le milieu extérieur. Les systèmes ouvert, fermé et isolé sont définis dans <a href="#thermo1/cours">« Introduction thermodynamique »</a>, §1 ; le premier principe de ce chapitre porte sur un <strong>système fermé</strong>.</p>

  <h3>Les transformations de base</h3>
  <ul>
    <li><strong>Isochore</strong> : le volume du système reste constant (paroi indéformable). Les forces de pression ne travaillent pas (§3).</li>
    <li><strong>Isobare</strong> : la pression <em>du système</em> est définie et constante tout au long de la transformation.</li>
    <li><strong>Monobare</strong> : la pression <em>extérieure</em> \(P_{\text{ext}}\) exercée sur la frontière mobile reste constante (atmosphère, piston lesté). Si le système est en équilibre mécanique au début et à la fin, \(P_i = P_f = P_{\text{ext}}\), mais sa pression peut varier, ou ne pas être définie, entre les deux.</li>
    <li><strong>Isotherme</strong> : la température <em>du système</em> est définie et constante.</li>
    <li><strong>Monotherme</strong> : le système n'échange de transfert thermique qu'avec un seul thermostat, de température \(T_0\) ; s'il atteint l'équilibre thermique avec lui, \(T_f = T_0\).</li>
    <li><strong>Adiabatique</strong> : aucun transfert thermique (\(Q = 0\)) : parois calorifugées, ou transformation rapide devant la durée des transferts thermiques (une compression d'une fraction de seconde dans un cylindre).</li>
    <li><strong>Cyclique</strong> : l'état final est l'état initial ; toutes les fonctions d'état reprennent leur valeur, \(\Delta U = 0\) et \(\Delta H = 0\).</li>
  </ul>
  <h3>Transformation quasi statique</h3>
  <div class="def-box">
    Une transformation <strong>quasi statique</strong> est assez lente pour que le système passe par une suite continue d'états d'équilibre interne : à chaque instant, sa pression, sa température et son volume sont définis. Pour un fluide sous un piston sans masse ni frottement, l'équilibre mécanique impose alors \(P_{\text{ext}} = P\) à chaque instant.
  </div>
  <p>Exemple classique : on comprime un gaz en posant sur le piston de petites masselottes une à une, en attendant l'équilibre après chacune ; on revient à l'état initial en les retirant une à une. Seule une transformation quasi statique se représente par une <strong>courbe</strong> dans le diagramme de Clapeyron \((P, V)\) ; une transformation brutale n'y a que deux points, l'état initial et l'état final.</p>
  <h3>Transformation réversible et irréversible</h3>
  <div class="def-box">
    Une transformation <strong>réversible</strong> est une transformation quasi statique, sans phénomène dissipatif, dont on peut inverser le sens par une modification infinitésimale des conditions extérieures : le système et le milieu extérieur repassent alors par les mêmes états. Toute transformation réelle est <strong>irréversible</strong> ; la transformation réversible est une limite idéale.
  </div>
  <div class="prop-box">
    Une transformation réversible est nécessairement quasi statique, mais la réciproque est fausse : un piston déplacé très lentement mais qui frotte sur son cylindre évolue de façon quasi statique et irréversible.
  </div>
  <p>Causes d'irréversibilité (à connaître) :</p>
  <ul>
    <li>transformations brutales (choc, détente dans le vide, piston lâché) : inhomogénéités de pression ;</li>
    <li>phénomènes dissipatifs : frottements, viscosité, effet Joule ;</li>
    <li>inhomogénéités de température (transfert thermique sous un écart fini) ou de concentration (diffusion).</li>
  </ul>
  <p>Le deuxième principe chiffre ces irréversibilités par l'entropie créée : <a href="#thermo3/cours">« Deuxième principe : bilans d'entropie »</a>, §1 et §6.</p>
  <h3>Thermostat</h3>
  <div class="def-box">
    Un <strong>thermostat</strong> (ou source de chaleur) est un système qui échange de l'énergie thermique sans que sa température varie : sa capacité thermique est très grande devant celle du système étudié.
  </div>
  <p><strong>Identifier un thermostat</strong> dans une situation expérimentale : l'atmosphère pour une tasse de thé, l'eau d'un fleuve pour le circuit de refroidissement d'une centrale, un bain thermostaté (régulé) pour un tube à essai, la glace fondante pour un petit échantillon (elle reste à 0 °C tant qu'il en reste). Le même corps n'est pas un thermostat pour tous les systèmes : tout dépend du rapport des capacités thermiques et des énergies échangées.</p>
  <div class="method-box">
    <strong>Exemple — la pièce, un thermostat pour une tasse de thé</strong>
    <ol>
      <li>250 mL de thé (eau, \(c = 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\)) refroidissent de 80 °C à 20 °C dans une pièce de 50 m³ : ils cèdent \(0{,}25\times4\,180\times60 \approx 62{,}7\ \text{kJ}\).</li>
      <li>L'air de la pièce (60 kg, capacité thermique \(\approx 60\ \text{kJ·K}^{-1}\), soixante fois celle du thé) ne s'échaufferait que d'environ 1 K s'il gardait toute cette énergie ; avec les murs et les meubles, l'élévation est imperceptible.</li>
      <li>Pour la tasse, la pièce est donc un thermostat à 20 °C. Pour un radiateur de 2 kW allumé toute la journée, elle ne l'est plus : c'est elle le système qu'on chauffe.</li>
    </ol>
  </div>
  <h3>État final imposé par le milieu extérieur</h3>
  <p>Avant tout calcul d'énergie, on détermine souvent l'état final par les conditions que l'extérieur impose : équilibre mécanique des parois mobiles (pression), équilibre thermique avec un thermostat à travers une paroi diathermane (température), parois rigides (volume) ; l'équation d'état fournit la variable restante.</p>

  <div class="method-box">
    <strong>Exemple — un piston lesté plongé dans un bain</strong>
    <ol>
      <li>Un cylindre vertical, plongé dans un bain à \(T_0 = 20\ °\text{C}\), contient \(V_i = 1{,}00\ \text{L}\) d'air sous \(P_0 = 1{,}00\ \text{bar}\), fermé par un piston sans masse ni frottement de section \(S = 50{,}0\ \text{cm}^2\) (hauteur de gaz 20,0 cm). On pose sur le piston une masse \(M = 51{,}0\ \text{kg}\), puis on attend l'équilibre.</li>
      <li>Système : l'air (fermé, gaz parfait). Conditions imposées : la pression extérieure sur le gaz devient \(P_0 + Mg/S = 10^5 + \dfrac{51{,}0\times9{,}81}{50{,}0\times10^{-4}} \approx 2{,}00\ \text{bar}\) ; le bain impose \(T_0\).</li>
      <li>État final : équilibre mécanique du piston, \(P_f = 2{,}00\ \text{bar}\) ; équilibre thermique, \(T_f = T_0\).</li>
      <li>Équation d'état, \(n\) et \(T\) fixés : \(P_fV_f = P_0V_i\), donc \(V_f = 0{,}500\ \text{L}\) ; le piston descend de 10,0 cm.</li>
      <li>Cet état final ne dépend pas de la façon de poser la masse (d'un coup ou grain par grain). Le travail et le transfert thermique, eux, en dépendent (§6).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · ÉNONCER LE PREMIER PRINCIPE</div>
  <h2>Le premier principe de la thermodynamique</h2>
  <div class="intro">Le premier principe étend la conservation de l'énergie de la mécanique à toutes les formes d'énergie : un système fermé ne peut gagner de l'énergie que si l'extérieur lui en fournit, par travail ou par transfert thermique. C'est l'outil de tous les bilans d'énergie de la thermodynamique.</div>
  <h3>Les deux modes d'échange d'énergie</h3>
  <div class="def-box">
    <strong>Travail \(W\)</strong> : énergie échangée par l'action de forces macroscopiques exercées par le milieu extérieur sur le système et dont le point d'application se déplace (forces de pression sur un piston, hélice qui brasse un fluide, forces électriques dans une résistance).<br><br>
    <strong>Transfert thermique \(Q\)</strong> (on disait autrefois « chaleur ») : énergie échangée à l'échelle microscopique, sans déplacement macroscopique de la frontière, à cause d'un écart de température entre le système et l'extérieur.
  </div>
  <p><strong>Convention de signe</strong>, du point de vue du système : \(W\) et \(Q\) sont des grandeurs <strong>algébriques</strong>, comptées positivement quand le système les <strong>reçoit</strong>, négativement quand il les cède. C'est la convention de tous les chapitres de thermodynamique du site.</p>
  <figure class="schema">

</figure>
  <h3>Trois modes de transfert thermique</h3>
  <ul>
    <li><strong>Conduction</strong> : de proche en proche, par l'agitation des particules, sans déplacement de matière ; c'est le seul mode dans un solide (le manche d'une casserole qui chauffe, les pertes à travers un mur).</li>
    <li><strong>Convection</strong> : transport d'énergie par un mouvement d'ensemble d'un fluide ; naturelle (l'air chauffé par un radiateur monte, car moins dense) ou forcée (ventilateur, pompe, vent).</li>
    <li><strong>Rayonnement</strong> : tout corps émet un rayonnement électromagnétique qui dépend de sa température (infrarouge à température ambiante ; il devient visible, rouge sombre, vers 500 °C) ; seul mode possible dans le vide. Le Soleil apporte environ \(1\ \text{kW·m}^{-2}\) au sol par beau temps.</li>
  </ul>
  <p>Exemple qualitatif : une bouteille isotherme limite les trois modes à la fois. Le vide entre les deux parois supprime la conduction et la convection ; les parois argentées renvoient le rayonnement ; seul le col, en plastique peu conducteur, laisse passer un peu d'énergie par conduction.</p>
  <h3>Énoncé du premier principe</h3>
  <div class="prop-box">
    <strong>Premier principe.</strong> À tout système est associée une fonction d'état extensive, l'<strong>énergie interne</strong> \(U\). Pour un système fermé qui évolue entre deux états d'équilibre, en recevant le travail \(W\) de toutes les forces extérieures et le transfert thermique \(Q\) :
    <div class="formula" data-nom="Premier principe">$$\Delta U + \Delta E_c = W + Q$$</div>
    où \(E_c\) est l'énergie cinétique macroscopique du système. Si l'on compte l'énergie potentielle de pesanteur \(E_p\) avec l'énergie du système, on écrit \(\Delta U + \Delta E_c + \Delta E_p = W + Q\), le travail du poids étant alors exclu de \(W\).
  </div>
  <p>Le plus souvent, le système est <strong>macroscopiquement au repos</strong> au début et à la fin (\(\Delta E_c = 0\)) et l'on néglige la variation de son énergie potentielle :</p>
  <div class="formula" data-nom="Premier principe (système au repos)">$$\Delta U = W + Q$$</div>
  <p><strong>Entre deux états voisins</strong>, au cours d'une transformation élémentaire :</p>
  <div class="formula" data-nom="Premier principe entre deux états voisins">$$\mathrm{d}U = \delta W + \delta Q$$</div>
  <h3>Statuts différents des deux membres</h3>
  <p>\(U\) est une <strong>fonction d'état</strong> : \(\Delta U\) ne dépend que des états initial et final, et se calcule avec l'expression de \(U\) (gaz parfait : \(\Delta U = C_V\,\Delta T\) ; phase condensée : \(\Delta U = C\,\Delta T\), voir « Introduction thermodynamique », §5 et §6). \(W\) et \(Q\) sont des <strong>énergies échangées</strong> au cours de la transformation : elles dépendent du chemin suivi et se calculent le long de ce chemin. D'où les notations : \(\mathrm{d}U\) est la petite variation d'une fonction d'état, \(\delta W\) et \(\delta Q\) de petites quantités échangées ; on n'écrit jamais \(\Delta W\) ni \(\Delta Q\), qui n'ont pas de sens.</p>
  <p><strong>Extensivité</strong> : l'énergie interne d'un système formé de plusieurs parties est la somme des leurs, \(U = U_1 + U_2 + \dots\), et \(\Delta U = \sum_k \Delta U_k\). On choisit souvent un système formé de plusieurs corps qui échangent de l'énergie entre eux : ces échanges internes disparaissent du bilan (§8).</p>
  <div class="method-box">
    <strong>Exemple — où va l'énergie cinétique d'une voiture qui freine ?</strong>
    <ol>
      <li>Une voiture de 1 000 kg roule à 72 km/h (20 m/s) et s'arrête sur une route horizontale ; on néglige la résistance de l'air.</li>
      <li>Système : la voiture. Le poids et la réaction de la route ne travaillent pas (roues sans glissement : les points de contact sont immobiles) ; le freinage est bref : \(Q \approx 0\).</li>
      <li>Premier principe : \(\Delta U + \Delta E_c = 0\), donc \(\Delta U = -\Delta E_c = \tfrac12\times1\,000\times20^2 = 200\ \text{kJ}\).</li>
      <li>Si cette énergie reste dans les quatre disques de frein (5 kg de fonte chacun, \(c \approx 500\ \text{J·K}^{-1}\text{·kg}^{-1}\)), ils s'échauffent de \(\Delta T = 200\times10^3/(20\times500) = 20\ \text{K}\). L'énergie cinétique est devenue de l'énergie interne, cédée ensuite à l'air.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : confondre transfert thermique et température (un système peut recevoir \(Q \gt 0\) sans s'échauffer : gaz détendu à température constante, glace qui fond) ; oublier les signes (\(W\) et \(Q\) sont reçus) ; écrire « \(\Delta Q\) ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · TRAVAIL DES FORCES DE PRESSION</div>
  <h2>Expression et calcul du travail W</h2>
  <div class="intro">Pour un fluide enfermé dans un cylindre, le travail reçu est celui des forces de pression exercées par l'extérieur sur la paroi mobile. On l'obtient en découpant la transformation en déplacements élémentaires et en sommant leurs travaux le long du chemin suivi.</div>
  <h3>Expression élémentaire</h3>
  <p>Un gaz est enfermé dans un cylindre par un piston de section \(S\), d'axe \(\vec u_x\) orienté vers l'extérieur. Le milieu extérieur exerce sur le gaz, à travers le piston, la force \(\vec F_{\text{ext}} = -P_{\text{ext}}S\,\vec u_x\), où \(P_{\text{ext}}\) est la pression extérieure (le poids d'un piston lesté y est inclus : \(P_{\text{ext}} = P_0 + Mg/S\)). Pour un déplacement \(\mathrm{d}x\) du piston, le volume varie de \(\mathrm{d}V = S\,\mathrm{d}x\) et le gaz reçoit :</p>
  <div class="formula" data-nom="Travail élémentaire des forces de pression">$$\delta W = \vec F_{\text{ext}}\cdot\mathrm{d}x\,\vec u_x = -P_{\text{ext}}\,\mathrm{d}V \qquad W = -\int_{V_i}^{V_f} P_{\text{ext}}\,\mathrm{d}V$$</div>
  <ul>
    <li><strong>Compression</strong> : \(\mathrm{d}V \lt 0\), donc \(\delta W \gt 0\) : le gaz reçoit du travail.</li>
    <li><strong>Détente</strong> : \(\mathrm{d}V \gt 0\), donc \(\delta W \lt 0\) : le gaz fournit du travail à l'extérieur.</li>
  </ul>
  <p>Le résultat vaut pour une paroi de forme quelconque : c'est toujours la pression <strong>extérieure</strong> qui figure dans \(\delta W\). Pour une transformation quasi statique sans frottement, \(P_{\text{ext}} = P\) à chaque instant et \(W = -\displaystyle\int P\,\mathrm{d}V\).</p>
  <h3>Cas usuels</h3>
  <ul>
    <li><strong>Isochore</strong> : \(\mathrm{d}V = 0\) à chaque instant, \(W = 0\).</li>
    <li><strong>Monobare</strong>, même brutale : \(P_{\text{ext}}\) constante sort de l'intégrale.</li>
  </ul>
  <div class="formula" data-nom="Travail d'une transformation monobare">$$W = -P_{\text{ext}}\,(V_f - V_i)$$</div>
  <ul>
    <li><strong>Isobare quasi statique</strong> : de même, \(W = -P\,(V_f - V_i)\).</li>
    <li><strong>Isotherme quasi statique d'un gaz parfait</strong> : \(P = nRT_0/V\) le long du chemin, d'où</li>
  </ul>
  <div class="formula" data-nom="Travail isotherme quasi statique (gaz parfait)">$$W = -\int_{V_i}^{V_f}\frac{nRT_0}{V}\,\mathrm{d}V = -nRT_0\ln\frac{V_f}{V_i} = nRT_0\ln\frac{P_f}{P_i}$$</div>
  <ul>
    <li><strong>Adiabatique</strong> : \(Q = 0\), donc \(W = \Delta U\), sans intégrer (§5, §7).</li>
  </ul>
  <h3>Découper et sommer sur un chemin donné</h3>
  <p>Quand \(P_{\text{ext}}\) varie le long du chemin, on l'exprime en fonction de la seule variable \(V\) (ou d'une variable qui lui est liée, comme la position du piston), puis on intègre. Ordre de grandeur utile : \(1\ \text{bar·L} = 10^5\ \text{Pa}\times10^{-3}\ \text{m}^3 = 100\ \text{J}\).</p>
  <div class="method-box">
    <strong>Exemple — un gaz qui repousse un ressort</strong>
    <ol>
      <li>Un gaz chauffé lentement repousse un piston sans masse de section \(S = 20\ \text{cm}^2\), qui comprime un ressort de raideur \(k = 2\,000\ \text{N·m}^{-1}\) (au repos au départ) ; l'atmosphère, à \(P_0 = 1{,}0\ \text{bar}\), agit de l'autre côté. Le volume augmente de \(0{,}40\ \text{L}\).</li>
      <li>Une seule variable : l'enfoncement \(x = (V - V_i)/S\). Force extérieure sur le piston : \(P_0S + kx\), donc \(P_{\text{ext}} = P_0 + \dfrac{k\,(V - V_i)}{S^2}\).</li>
      <li>Sommation : \(W = -\displaystyle\int_{V_i}^{V_f}P_{\text{ext}}\,\mathrm{d}V = -P_0\,\Delta V - \dfrac{k\,(\Delta V)^2}{2S^2} = -40 - 40 = -80\ \text{J}\).</li>
      <li>Contrôle : le gaz a fourni 40 J pour repousser l'atmosphère et 40 J emmagasinés dans le ressort, \(\tfrac12kx^2\) avec \(x = 0{,}20\ \text{m}\).</li>
    </ol>
  </div>
  <h3>Lecture dans le diagramme de Clapeyron</h3>
  <p>Pour un chemin quasi statique, \(W = -\int P\,\mathrm{d}V\) est l'opposé de l'<strong>aire sous la courbe</strong> dans le diagramme \((P, V)\), comptée positivement quand on la parcourt vers les volumes croissants. En détente, \(W \lt 0\) et \(|W|\) est cette aire ; en compression, \(W \gt 0\). Une transformation monobare brutale n'a pas de courbe, mais son travail est l'aire du rectangle sous la droite \(P = P_{\text{ext}}\).</p>

    <strong>Exemple — détente quasi statique ou brutale</strong>

  </div>

<div class="course-section">
  <div class="sec-num">§4 · ENTHALPIE</div>
  <h2>La fonction enthalpie H</h2>
  <div class="intro">Beaucoup de transformations se font à l'air libre, sous la pression atmosphérique constante. Le travail des forces de pression y prend une forme simple, qu'on fait passer dans une nouvelle fonction d'état : l'enthalpie. Le transfert thermique se lit alors directement sur sa variation.</div>
  <div class="def-box">
    On définit l'<strong>enthalpie</strong> d'un système, où \(P\) est sa pression et \(V\) son volume :
    <div class="formula" data-nom="Enthalpie">$$H = U + PV$$</div>
    \(H\) est une fonction d'état extensive, exprimée en joules.
  </div>
  <h3>Premier principe pour une transformation monobare</h3>
  <p>Le système subit une transformation monobare (\(P_{\text{ext}} = P_0\) constante), avec <strong>équilibre mécanique dans l'état initial et dans l'état final</strong> : \(P_i = P_f = P_0\). Il est au repos au début et à la fin, et ne reçoit pas d'autre travail que celui des forces de pression. Alors \(W = -P_0(V_f - V_i)\) et</p>
  <div class="formula">$$U_f - U_i = -P_fV_f + P_iV_i + Q \quad\Longrightarrow\quad (U_f + P_fV_f) - (U_i + P_iV_i) = Q$$</div>
  <div class="prop-box">
    <strong>Bilan d'enthalpie.</strong> Pour une transformation monobare avec équilibre mécanique dans l'état initial et dans l'état final, le système ne recevant que le travail des forces de pression :
    <div class="formula" data-nom="Bilan d'enthalpie (monobare)">$$\Delta H = Q$$</div>
    S'il reçoit en plus un travail autre que celui des forces de pression \(W_{\text{autre}}\) (électrique, d'une hélice), \(\Delta H = Q + W_{\text{autre}}\).
  </div>
  <p>Comparaison : pour une transformation <strong>isochore</strong> sans autre travail, \(W = 0\) et \(\Delta U = Q\) ; pour une transformation <strong>monobare</strong>, \(\Delta H = Q\). Les deux évitent de calculer \(W\).</p>
  <h3>Gaz parfait : enthalpie molaire</h3>
  <p>Pour un gaz parfait, \(PV_m = RT\), donc à partir de l'énergie interne molaire :</p>
  <div class="formula" data-nom="Enthalpie molaire du gaz parfait">$$H_m(T) = U_m(T) + RT$$</div>
  <p>Elle ne dépend que de la température (deuxième loi de Joule) : \(H_m = \tfrac52RT\) pour un gaz parfait monoatomique, \(H_m = \tfrac72RT\) pour un diatomique aux températures usuelles. Une transformation isotherme d'un gaz parfait a donc \(\Delta U = 0\) <em>et</em> \(\Delta H = 0\).</p>
  <h3>Phase condensée : enthalpie fonction de T seule</h3>
  <p>Pour une phase condensée peu compressible et peu dilatable, \(H_m = U_m(T) + PV_m\), où \(V_m\) est petit et presque constant. Le terme \(PV_m\) varie très peu devant \(U_m\) : on peut considérer que \(H_m\) ne dépend que de \(T\), et \(\mathrm{d}H \approx \mathrm{d}U = C\,\mathrm{d}T\). On ne distingue plus \(\Delta U\) et \(\Delta H\).</p>
  <div class="method-box">
    <strong>Exemple — l'eau liquide, chiffres à l'appui</strong>
    <ol>
      <li>Chauffer 1 kg d'eau de 1 K sous pression constante : \(\Delta h \approx 4{,}18\ \text{kJ·kg}^{-1}\).</li>
      <li>Augmenter sa pression de 1 bar à température constante : \(\Delta(Pv) \approx v\,\Delta P = 10^{-3}\times10^5 = 0{,}1\ \text{kJ·kg}^{-1}\), quarante fois moins. Les tables donnent, à 20 °C, une enthalpie massique plus grande de \(0{,}85\ \text{kJ·kg}^{-1}\) sous 10 bar que sous 1 bar : l'effet d'un échauffement de 0,2 K.</li>
      <li>Chauffer l'eau de 20 à 80 °C sous 1 bar la dilate de 2,7 % : \(P\,\Delta v = 2{,}7\ \text{J·kg}^{-1}\), contre \(\Delta u = 251\ \text{kJ·kg}^{-1}\). Pour des écarts de pression de quelques bars, \(h\) ne dépend que de \(T\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — chauffer un gaz sous un piston libre</strong>
    <ol>
      <li>0,50 mol de gaz parfait diatomique, sous un piston libre soumis à l'atmosphère (1,0 bar), est chauffé de 20 °C à 120 °C ; le piston est immobile au début et à la fin.</li>
      <li>Monobare avec équilibre mécanique aux deux bouts : \(Q = \Delta H = n\,\tfrac72R\,\Delta T\), soit \(0{,}50\times3{,}5\times8{,}314\times100 \approx 1\,455\ \text{J}\).</li>
      <li>Travail : \(W = -P_0\,\Delta V = -nR\,\Delta T \approx -416\ \text{J}\) (le gaz soulève le piston et repousse l'atmosphère).</li>
      <li>Contrôle : \(\Delta U = n\,\tfrac52R\,\Delta T \approx 1\,039\ \text{J} = W + Q\). Sur 1 455 J reçus, 29 % repartent en travail.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\Delta H = Q\) pour une transformation isochore, ou pour une transformation monobare dont l'état initial n'est pas en équilibre mécanique (gaz comprimé au départ, piston bloqué puis libéré). Autre erreur : oublier un travail électrique ou mécanique (\(\Delta H = Q + W_{\text{autre}}\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · CAPACITÉS THERMIQUES ET RELATION DE MAYER</div>
  <h2>C_P, relation de Mayer et coefficient γ</h2>
  <div class="intro">La capacité thermique à volume constant \(C_V\) a été définie dans « Introduction thermodynamique », §5. On définit de même \(C_P\) à partir de l'enthalpie. Pour un gaz parfait, la relation de Mayer relie les deux, et leur rapport \(\gamma\) gouverne les transformations adiabatiques.</div>
  <div class="def-box">
    La <strong>capacité thermique à pression constante</strong> est \(C_P = \left(\dfrac{\partial H}{\partial T}\right)_P\), en \(\text{J·K}^{-1}\). Pour un gaz parfait ou une phase condensée, \(H\) ne dépend que de \(T\) et \(\mathrm{d}H = C_P\,\mathrm{d}T\). Capacités molaire \(C_{P,m} = C_P/n\) (\(\text{J·K}^{-1}\text{·mol}^{-1}\)) et massique \(c_P = C_P/m\) (\(\text{J·K}^{-1}\text{·kg}^{-1}\)).
  </div>
  <div class="prop-box">
    <strong>Relation de Mayer</strong>, pour un <strong>gaz parfait</strong> seulement :
    <div class="formula" data-nom="Relation de Mayer">$$C_P - C_V = nR \qquad C_{P,m} - C_{V,m} = R$$</div>
    Démonstration : \(H = U + nRT\), donc \(\mathrm{d}H = \mathrm{d}U + nR\,\mathrm{d}T\), soit \(C_P\,\mathrm{d}T = (C_V + nR)\,\mathrm{d}T\).
  </div>
  <div class="formula">$$\begin{array}{|c|c|c|}\hline
   & \textbf{monoatomique} & \textbf{diatomique} \\ \hline
  C_{V,m} & \frac{3}{2}R & \frac{5}{2}R \\ \hline
  C_{P,m} & \frac{5}{2}R & \frac{7}{2}R \\ \hline
  \gamma & 5/3 & 7/5 \\ \hline
  \end{array}$$</div>
  <div class="def-box">
    Le <strong>coefficient</strong> \(\gamma = C_P/C_V\) (sans dimension, supérieur à 1) vaut \(5/3 \approx 1{,}67\) pour un gaz parfait monoatomique, \(7/5 = 1{,}4\) pour un diatomique (air) aux températures usuelles. Avec la relation de Mayer :
    <div class="formula" data-nom="Capacités thermiques et γ">$$C_V = \frac{nR}{\gamma - 1} \qquad C_P = \frac{\gamma\,nR}{\gamma - 1}$$</div>
  </div>
  <p>En massique, avec la masse molaire \(M\) : \(c_V = \dfrac{R}{M(\gamma-1)}\) et \(c_P = \dfrac{\gamma R}{M(\gamma-1)}\). Pour l'air (\(M = 29\ \text{g·mol}^{-1}\), \(\gamma = 1{,}4\)) : \(c_V \approx 717\) et \(c_P \approx 1\,003\ \text{J·K}^{-1}\text{·kg}^{-1}\), à comparer aux valeurs mesurées à 20 °C, 718 et 1 006.</p>
  <h3>Phases condensées et ordres de grandeur</h3>
  <p>Pour une phase condensée, \(\mathrm{d}H \approx \mathrm{d}U\) (§4), donc \(C_P \approx C_V\) : on parle simplement de <strong>capacité thermique</strong> \(C = mc\), et \(\Delta H \approx \Delta U = C\,\Delta T\).</p>
  <div class="prop-box">
    <strong>Ordre de grandeur à connaître</strong> : la capacité thermique massique de l'eau liquide vaut \(c_{\text{eau}} \approx 4{,}18\ \text{kJ·K}^{-1}\text{·kg}^{-1}\) : il faut 4,18 kJ pour chauffer 1 kg d'eau de 1 K. C'est l'une des plus grandes de tous les corps usuels.
  </div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Corps (vers 20 °C)</th><th style="text-align:left">\(c\) (kJ·K⁻¹·kg⁻¹)</th><th style="text-align:left">Corps</th><th style="text-align:left">\(c\) (kJ·K⁻¹·kg⁻¹)</th></tr>
    <tr><td>Eau liquide</td><td>4,18</td><td>Aluminium</td><td>0,90</td></tr>
    <tr><td>Glace (0 °C)</td><td>2,1</td><td>Fer, acier</td><td>0,45</td></tr>
    <tr><td>Huile alimentaire</td><td>≈ 1,7 à 2</td><td>Cuivre</td><td>0,385</td></tr>
    <tr><td>Air (\(c_P\))</td><td>1,0</td><td>Plomb</td><td>0,13</td></tr>
    <tr><td>Béton, verre</td><td>≈ 0,85</td><td>Vapeur d'eau (\(c_P\), 100 °C)</td><td>2,0</td></tr>
  </table></div>
  <div class="method-box">
    <strong>Exemple — l'énergie d'un bain</strong>
    <ol>
      <li>Une baignoire de 150 L d'eau est remplie à 40 °C avec de l'eau du réseau à 15 °C.</li>
      <li>\(Q = \Delta H = mc\,\Delta T = 150\times4{,}18\times25 \approx 15{,}7\ \text{MJ}\), soit 4,35 kWh (une heure de fonctionnement d'un gros radiateur).</li>
      <li>La même énergie chaufferait de 25 K environ 1,4 t de fer (\(15{,}7\times10^6/(0{,}45\times10^3\times25)\)) : l'eau stocke beaucoup d'énergie pour un faible échauffement, d'où son usage dans le chauffage central et le rôle des océans sur le climat.</li>
    </ol>
  </div>
  <h3>Relations de Laplace</h3>
  <div class="prop-box">
    Pour un <strong>gaz parfait</strong> de \(\gamma\) constant qui subit une transformation <strong>adiabatique et réversible</strong> :
    <div class="formula" data-nom="Lois de Laplace">$$PV^{\gamma} = \text{cste} \qquad TV^{\gamma-1} = \text{cste} \qquad T^{\gamma}P^{1-\gamma} = \text{cste}$$</div>
    Ces relations valent à chaque instant de la transformation. La loi de Laplace et ses conditions d'application sont au programme de la partie 3.4 : <a href="#thermo3/cours">« Deuxième principe : bilans d'entropie »</a>, §8, qui l'établit aussi par l'entropie.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')"><span class="label">Démonstration</span><span class="prompt">Les relations de Laplace par le premier principe</span><div class="content">
    <p>Entre deux états voisins d'une transformation adiabatique (\(\delta Q = 0\)) et quasi statique sans frottement (\(P_{\text{ext}} = P\)), le premier principe s'écrit \(\mathrm{d}U = \delta W = -P\,\mathrm{d}V\). Pour un gaz parfait, \(\mathrm{d}U = C_V\,\mathrm{d}T\) avec \(C_V = nR/(\gamma - 1)\) et \(P = nRT/V\) :</p>
    <div class="formula">$$\frac{nR}{\gamma - 1}\,\mathrm{d}T = -\frac{nRT}{V}\,\mathrm{d}V \quad\Longrightarrow\quad \frac{\mathrm{d}T}{T} + (\gamma - 1)\frac{\mathrm{d}V}{V} = 0$$</div>
    <p>On intègre, \(\gamma\) étant constant : \(\ln T + (\gamma - 1)\ln V = \text{cste}\), soit \(TV^{\gamma-1} = \text{cste}\). Avec \(T = PV/(nR)\), on obtient \(PV^\gamma = \text{cste}\), puis, avec \(V = nRT/P\), \(T^\gamma P^{1-\gamma} = \text{cste}\).</p>
  </div></div>
  <p>Dans le diagramme de Clapeyron, la pente de l'adiabatique réversible, \(-\gamma P/V\), est \(\gamma\) fois celle de l'isotherme, \(-P/V\) (figure du §1). Le travail reçu s'obtient sans intégrer : \(W = \Delta U = C_V(T_f - T_i)\).</p>
  <div class="method-box">
    <strong>Exemple — refroidir de l'air en le détendant</strong>
    <ol>
      <li>De l'air (\(\gamma = 1{,}4\)) à 20 °C sous 5,0 bar se détend jusqu'à 1,0 bar de façon adiabatique et réversible (turbine bien isolée, sans frottement).</li>
      <li>Laplace en \((T, P)\) : \(T_f = T_i\left(\dfrac{P_f}{P_i}\right)^{(\gamma-1)/\gamma} = 293{,}15\times0{,}2^{0{,}286} \approx 185\ \text{K}\), soit −88 °C ; le volume est multiplié par \(5^{1/1{,}4} \approx 3{,}16\).</li>
      <li>Travail reçu par mole : \(W = C_{V,m}(T_f - T_i)\), soit \(\tfrac52\times8{,}314\times(185{,}1 - 293{,}15) \approx -2{,}25\ \text{kJ}\) : le gaz fournit du travail en puisant dans son énergie interne, d'où le refroidissement. C'est le principe des machines frigorifiques à air des avions.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la relation de Mayer ou parler de \(\gamma\) pour une phase condensée ; appliquer \(PV^\gamma = \text{cste}\) à une transformation brutale, ou qui échange de la chaleur (dans ces cas, on écrit seulement le premier principe : §6, §7).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · APPLICATIONS DU PREMIER PRINCIPE</div>
  <h2>Détente de Joule-Gay-Lussac et transformations brutales</h2>
  <div class="intro">Dans une transformation brutale, les états intermédiaires ne sont pas des états d'équilibre : on ne peut rien intégrer le long du chemin. Le premier principe, qui ne porte que sur les états initial et final et sur les échanges, suffit pourtant souvent à trouver l'état final et les énergies échangées.</div>
  <h3>Détente de Joule-Gay-Lussac (détente dans le vide)</h3>
  <p>Dispositif : un gaz occupe un volume \(V_1\) d'une enceinte à parois rigides et calorifugées ; l'autre partie, de volume \(V_2\), est vide. On ouvre le robinet qui les sépare : le gaz se répand dans tout le volume \(V_1 + V_2\).</p>
  <p>Système : le gaz (le vide ne contient rien). Parois calorifugées : \(Q = 0\). Parois rigides : rien ne bouge à la frontière extérieure, \(W = 0\) (le gaz ne pousse sur rien en se répandant dans le vide). Le gaz est au repos au début et à la fin :</p>
  <div class="formula" data-nom="Détente de Joule-Gay-Lussac">$$\Delta U = 0$$</div>
  <p>La détente est <strong>isoénergétique</strong>. Pour un gaz parfait, \(U\) ne dépend que de \(T\) (première loi de Joule) : \(T_f = T_i\), et \(P_f = P_i\,\dfrac{V_1}{V_1 + V_2}\). C'est l'expérience historique qui a montré que l'énergie interne d'un gaz dilué ne dépend que de sa température. Cette détente est irréversible : le bilan d'entropie est fait dans « Deuxième principe », §9.</p>
  <div class="method-box">
    <strong>Exemple — détente d'un gaz réel</strong>
    <ol>
      <li>Une mole de dioxyde de carbone à 300 K occupe 1,0 L et se détend dans le vide jusqu'à 2,0 L. L'énoncé fournit son énergie interne molaire (modèle de Van der Waals) : \(U_m = C_{V,m}T - a/V_m\), avec \(C_{V,m} \approx 29\ \text{J·K}^{-1}\text{·mol}^{-1}\) et \(a = 0{,}366\ \text{Pa·m}^6\text{·mol}^{-2}\).</li>
      <li>\(\Delta U = 0\) : \(C_{V,m}(T_f - T_i) = a\left(\dfrac{1}{V_f} - \dfrac{1}{V_i}\right) = 0{,}366\times(500 - 1\,000) = -183\ \text{J}\).</li>
      <li>\(\Delta T \approx -183/29 \approx -6{,}3\ \text{K}\) : le gaz réel se refroidit, car éloigner les molécules qui s'attirent coûte de l'énergie, prise sur l'agitation thermique. Les tables donnent environ −11 K : le modèle donne le signe et l'ordre de grandeur. Pour un gaz dilué (\(a/V_m\) négligeable), on retrouve \(\Delta T = 0\).</li>
    </ol>
  </div>
  <h3>Piston lâché : énergie échangée</h3>
  <p>Reprenons le piston lesté du §1 (figure du §1). L'état final est le même que la masse soit posée d'un coup ou grain par grain ; le travail et le transfert thermique ne le sont pas. Pour une transformation brutale, on choisit un système qui contient les pièces mobiles, dont l'énergie cinétique est nulle au début et à la fin.</p>
  <div class="method-box">
    <strong>Exemple — masse posée d'un coup ou grain par grain</strong>
    <ol>
      <li>Masse posée d'un coup. Système {gaz, piston, masse} : il reçoit le travail de l'atmosphère et du poids de la masse, forces constantes dont le total vaut \(P_{\text{ext}}S\) avec \(P_{\text{ext}} = P_0 + Mg/S = 2{,}00\ \text{bar}\). Monobare : \(W = -P_{\text{ext}}(V_f - V_i) = 2{,}00\times10^5\times0{,}500\times10^{-3} = +100\ \text{J}\) (50 J de l'atmosphère, 50 J du poids : \(Mgh\) avec \(h = 10\ \text{cm}\)).</li>
      <li>\(T_f = T_i\) et le gaz est parfait : \(\Delta U = 0\), donc \(Q = -W = -100\ \text{J}\) : le gaz cède 100 J au bain.</li>
      <li>Grain par grain (isotherme quasi statique) : \(W = nRT_0\ln\dfrac{V_i}{V_f} = P_0V_i\ln2 \approx 69\ \text{J}\) et \(Q \approx -69\ \text{J}\).</li>
      <li>Les 31 J d'écart : lâchés d'un coup, le piston et la masse oscillent avant de s'arrêter ; l'énergie de ces oscillations est dissipée dans le gaz (viscosité), puis cédée au bain. Plus la transformation est brutale, plus le milieu extérieur fournit de travail pour le même état final.</li>
    </ol>
  </div>
  <p><strong>Compression adiabatique brutale.</strong> Si le cylindre est calorifugé, \(Q = 0\) et le premier principe donne \(C_V(T_f - T_i) = -P_{\text{ext}}(V_f - V_i)\), avec \(P_fV_f = nRT_f\) et \(P_f = P_{\text{ext}}\) : deux équations pour \(T_f\) et \(V_f\). Le gaz finit plus chaud qu'avec une compression de Laplace jusqu'à la même pression (« Deuxième principe », §9 ; exercice « Concours PT »).</p>
  <div class="notice"><strong>Erreur classique</strong> : « le gaz se détend, donc il fournit du travail » dans une détente de Joule-Gay-Lussac : il ne pousse rien, \(W = 0\). Autre erreur : appliquer la loi de Laplace à une compression brutale, qui n'est pas réversible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · BILANS SUR UN CHEMIN DONNÉ</div>
  <h2>Calculer Q connaissant W et ΔU</h2>
  <div class="intro">Le transfert thermique se calcule rarement directement : on ne sait pas mesurer ce qui traverse une paroi. On calcule \(\Delta U\) par l'expression de l'énergie interne, \(W\) le long du chemin, et le premier principe donne \(Q\).</div>
  <div class="method-box">
    <strong>Méthode — transfert thermique sur un chemin</strong>
    <ol>
      <li>Déterminer les états initial et final (équation d'état, conditions imposées) ; calculer \(\Delta U\) (ou \(\Delta H\)) par l'expression de la fonction d'état, sans se soucier du chemin.</li>
      <li>Calculer \(W\) sur le chemin donné, étape par étape (§3).</li>
      <li>En déduire \(Q = \Delta U - W\) pour chaque étape ; additionner.</li>
      <li>Contrôler : signes (le gaz reçoit-il ou cède-t-il ?), et, en monobare, \(Q = \Delta H\).</li>
    </ol>
  </div>
  <p>Bilans des transformations quasi statiques d'un gaz parfait (\(C_V = nR/(\gamma - 1)\), \(C_P = \gamma C_V\)) :</p>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Transformation</th><th style="text-align:left">\(W\)</th><th style="text-align:left">\(Q\)</th><th style="text-align:left">\(\Delta U\)</th><th style="text-align:left">\(\Delta H\)</th></tr>
    <tr><td>Isochore</td><td>0</td><td>\(C_V\,\Delta T\)</td><td>\(C_V\,\Delta T\)</td><td>\(C_P\,\Delta T\)</td></tr>
    <tr><td>Isobare</td><td>\(-P\,\Delta V = -nR\,\Delta T\)</td><td>\(C_P\,\Delta T\)</td><td>\(C_V\,\Delta T\)</td><td>\(C_P\,\Delta T\)</td></tr>
    <tr><td>Isotherme</td><td>\(-nRT\ln(V_f/V_i)\)</td><td>\(-W\)</td><td>0</td><td>0</td></tr>
    <tr><td>Adiabatique réversible</td><td>\(C_V\,\Delta T\)</td><td>0</td><td>\(C_V\,\Delta T\)</td><td>\(C_P\,\Delta T\)</td></tr>
  </table></div>

<figcaption>0,40 mol de gaz parfait diatomique va de A (10 L ; 1 bar ; 300 K) à B (20 L ; 2 bar ; 1 200 K). Chemin 1 (rouge) : isochore AC puis isobare CB ; chemin 2 (bleu) : isobare AD puis isochore DB. Les travaux sont les aires sous les isobares, de signes négatifs (détentes) : \(W_1 = -2{,}0\ \text{kJ}\) (les deux bandes), \(W_2 = -1{,}0\ \text{kJ}\) (la bande bleue). La variation d'énergie interne, \(\Delta U = 7{,}5\ \text{kJ}\), est la même : les transferts thermiques diffèrent, \(Q_1 = 9{,}5\ \text{kJ}\) et \(Q_2 = 8{,}5\ \text{kJ}\). Tirets : isothermes de A et de B.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — deux chemins, mêmes états</strong>
    <ol>
      <li>0,40 mol de gaz parfait diatomique va de A (1 bar ; 10 L ; 300 K) à B (2 bar ; 20 L ; 1 200 K).</li>
      <li>Fonction d'état : \(\Delta U = \tfrac52nR(T_B - T_A) = \tfrac52(P_BV_B - P_AV_A)\), soit \(\tfrac52(4\,000 - 1\,000) = 7\,500\ \text{J}\), quel que soit le chemin.</li>
      <li>Chemin 1, isochore AC puis isobare CB à 2 bar : \(W_1 = -2\times10^5\times10\times10^{-3} = -2\,000\ \text{J}\), donc \(Q_1 = 7\,500 + 2\,000 = 9\,500\ \text{J}\).</li>
      <li>Chemin 2, isobare AD à 1 bar puis isochore DB : \(W_2 = -1\,000\ \text{J}\), donc \(Q_2 = 8\,500\ \text{J}\).</li>
      <li>Même \(\Delta U\), mais des \(W\) et des \(Q\) différents : seuls ces derniers dépendent du chemin.</li>
    </ol>
  </div>
  <p><strong>Sur un cycle</strong>, \(\Delta U = 0\) : \(W + Q = 0\), le travail fourni par le fluide est égal au transfert thermique total qu'il reçoit. Le cycle ACBDA de la figure (parcouru en sens horaire) fournit \(W = -1\,000\ \text{J}\) ; c'est le point de départ des machines thermiques (« Machines thermiques », §2 à §4).</p>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(Q = C_V\,\Delta T\) sur une isobare (c'est \(C_P\,\Delta T\)), ou \(Q = 0\) sur une isotherme parce que \(\Delta T = 0\) (le gaz parfait reçoit \(Q = -W\), non nul). Transfert thermique et variation de température sont deux choses différentes.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CALORIMÉTRIE</div>
  <h2>Mesurer des énergies</h2>
  <div class="intro">La calorimétrie mesure des capacités thermiques, des enthalpies de changement d'état ou de réaction à partir de températures. Elle repose sur un bilan d'enthalpie dans une enceinte presque calorifugée et sur l'extensivité de l'enthalpie : c'est la technique expérimentale du programme pour les bilans d'énergie.</div>

<figcaption>Calorimètre : un vase intérieur entouré d'une double paroi isolante (vide ou air) et fermé par un couvercle limite les transferts thermiques avec la pièce pendant la mesure ; l'agitateur rend la température de l'eau uniforme ; la résistance, alimentée par un générateur, apporte un travail électrique connu \(W_e = UI\,\Delta t\). Le vase, l'agitateur, le thermomètre et la résistance s'échauffent avec l'eau : leur capacité thermique totale est la capacité \(C_{\text{calo}} = \mu\,c_{\text{eau}}\) du calorimètre.</figcaption>
</figure>
  <h3>Principe</h3>
  <p>Système : le calorimètre et tout son contenu. Pendant la mesure, on le suppose <strong>calorifugé</strong> (\(Q = 0\)), la transformation est <strong>monobare</strong> (pression atmosphérique) avec équilibre mécanique au début et à la fin. Le bilan d'enthalpie (§4) et l'extensivité donnent :</p>
  <div class="formula" data-nom="Bilan calorimétrique">$$\Delta H = \sum_k C_k\,(T_f - T_{i,k}) = W_e$$</div>
  <p>où \(W_e = UI\,\Delta t\) est le travail électrique reçu si une résistance chauffe le contenu (sinon \(W_e = 0\)). Les échanges d'énergie entre les corps du calorimètre sont internes au système : ils n'apparaissent pas.</p>
  <div class="def-box">
    La <strong>valeur en eau</strong> \(\mu\) d'un calorimètre est la masse d'eau qui aurait la même capacité thermique que lui (vase, agitateur, thermomètre) : \(C_{\text{calo}} = \mu\,c_{\text{eau}}\). Elle vaut quelques dizaines de grammes pour un calorimètre de laboratoire et se mesure avant toute expérience.
  </div>
  <div class="method-box">
    <strong>Exemple — mesurer la valeur en eau</strong>
    <ol>
      <li>Le calorimètre contient \(m_1 = 200\ \text{g}\) d'eau à \(T_1 = 18{,}0\ °\text{C}\), en équilibre. On ajoute \(m_2 = 200\ \text{g}\) d'eau à \(T_2 = 60{,}0\ °\text{C}\) ; après agitation, \(T_f = 37{,}4\ °\text{C}\).</li>
      <li>\(\Delta H = 0\) : \((m_1 + \mu)\,c_{\text{eau}}(T_f - T_1) + m_2\,c_{\text{eau}}(T_f - T_2) = 0\), et \(c_{\text{eau}}\) se simplifie.</li>
      <li>\(\mu = m_2\,\dfrac{T_2 - T_f}{T_f - T_1} - m_1 = 200\times\dfrac{22{,}6}{19{,}4} - 200 \approx 33\ \text{g}\).</li>
    </ol>
  </div>
  <h3>Méthode des mélanges : capacité thermique d'un solide</h3>
  <p>Un solide de masse \(m\), chauffé à \(T_1\) (étuve, eau bouillante), est plongé dans le calorimètre contenant une masse \(m_0\) d'eau à \(T_0\). Le bilan \((m_0 + \mu)\,c_{\text{eau}}(T_f - T_0) + m\,c\,(T_f - T_1) = 0\) donne :</p>
  <div class="formula" data-nom="Méthode des mélanges">$$c = \frac{(m_0 + \mu)\,c_{\text{eau}}\,(T_f - T_0)}{m\,(T_1 - T_f)}$$</div>
  <div class="method-box">
    <strong>Exemple — capacité thermique du fer</strong>
    <ol>
      <li>100 g de fer sortis d'un bain à 95,0 °C sont plongés dans 250 g d'eau à 20,0 °C (\(\mu = 30\ \text{g}\)) ; on lit \(T_f = 22{,}8\ °\text{C}\).</li>
      <li>\(c = \dfrac{0{,}280\times4\,180\times2{,}8}{0{,}100\times72{,}2} \approx 454\ \text{J·K}^{-1}\text{·kg}^{-1}\) (valeur tabulée : 449).</li>
      <li>Sensibilité : une erreur de 0,1 °C sur \(T_f\) change le résultat de 3,7 %, presque entièrement par le petit écart \(T_f - T_0 = 2{,}8\ \text{K}\). On choisit donc une masse d'eau assez faible (et un thermomètre au dixième de degré) pour que l'eau s'échauffe de plusieurs degrés.</li>
    </ol>
  </div>
  <h3>Méthode électrique</h3>
  <p>Une résistance plongée dans le calorimètre reçoit du générateur le travail électrique \(W_e = UI\,\Delta t\), qu'elle transmet au contenu. Le bilan \(\Delta H = W_e\) permet de mesurer une capacité thermique (celle d'un liquide, ou \(\mu\)) avec une énergie connue.</p>
  <div class="method-box">
    <strong>Exemple — capacité thermique d'une huile</strong>
    <ol>
      <li>Le calorimètre (\(\mu = 30\ \text{g}\)) contient 300 g d'huile. La résistance est alimentée sous \(U = 12{,}0\ \text{V}\), \(I = 2{,}50\ \text{A}\), pendant 5,00 min : \(W_e = 12{,}0\times2{,}50\times300 = 9\,000\ \text{J}\).</li>
      <li>La température monte de 14,2 K : \((m\,c + \mu\,c_{\text{eau}})\,\Delta T = W_e\).</li>
      <li>\(c = \dfrac{W_e/\Delta T - \mu\,c_{\text{eau}}}{m}\), soit \(\dfrac{9\,000/14{,}2 - 0{,}030\times4\,180}{0{,}300} \approx 1{,}7\ \text{kJ·K}^{-1}\text{·kg}^{-1}\). Avec 300 g d'eau, la même énergie n'aurait élevé la température que de 6,5 K.</li>
    </ol>
  </div>
  <h3>Protocole et précautions</h3>
  <ul>
    <li>Mesurer \(\mu\) d'abord, dans les mêmes conditions (même volume d'eau, même agitateur).</li>
    <li>Agiter en permanence et attendre l'équilibre avant chaque lecture ; noter l'extremum de température.</li>
    <li>Limiter la durée de l'expérience et les écarts à la température ambiante (les pertes croissent avec l'écart) ; on peut partir un peu en dessous de l'ambiante pour finir un peu au-dessus, les pertes se compensant en partie.</li>
    <li>Changements d'état (glace qui fond, vapeur qui se condense) : même bilan, avec un terme \(m\,\Delta h_{12}\) ; méthode et mesure d'une enthalpie de fusion dans <a href="#changement/cours">« Corps pur diphasé et changements d'état »</a>, §8.</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : se tromper de signe en isolant \(c\) (le dénominateur est \(T_1 - T_f\), positif pour un solide chaud) ; oublier la valeur en eau ; mélanger capacité thermique \(C\) (en \(\text{J·K}^{-1}\)) et capacité massique \(c\). Les différences de températures peuvent rester en degrés Celsius.</div>
</div>

<div class="course-section">
  <div class="sec-num">§9 · PREMIER PRINCIPE EN PUISSANCE</div>
  <h2>Bilans d'énergie entre deux instants voisins</h2>
  <div class="intro">Combien de temps faut-il pour chauffer un ballon d'eau chaude, et jusqu'à quelle température monte un liquide qui perd de l'énergie ? On applique le premier principe entre deux états voisins, aux instants \(t\) et \(t + \mathrm{d}t\), et l'on divise par \(\mathrm{d}t\).</div>
  <div class="prop-box">
    <strong>Bilan en puissance.</strong> Entre \(t\) et \(t + \mathrm{d}t\), un système fermé au repos reçoit \(\delta W = \mathcal P_{\text{méca}}\,\mathrm{d}t\) et \(\delta Q = \mathcal P_{\text{th}}\,\mathrm{d}t\) (puissances reçues, en watts) :
    <div class="formula" data-nom="Premier principe en puissance">$$\frac{\mathrm{d}U}{\mathrm{d}t} = \mathcal P_{\text{méca}} + \mathcal P_{\text{th}}$$</div>
    Pour une phase condensée de capacité \(C\), chauffée par une puissance électrique \(\mathcal P\) et qui perd la puissance \(\mathcal P_{\text{pertes}}\) : \(C\,\dfrac{\mathrm{d}T}{\mathrm{d}t} = \mathcal P - \mathcal P_{\text{pertes}}\).
  </div>
  <div class="method-box">
    <strong>Exemple — le ballon d'eau chaude</strong>
    <ol>
      <li>Un chauffe-eau électrique de 200 L chauffe l'eau de 15 °C à 60 °C avec une résistance de 2,2 kW.</li>
      <li>Énergie : \(Q = mc\,\Delta T = 200\times4{,}18\times45 \approx 37{,}6\ \text{MJ}\) (10,5 kWh).</li>
      <li>Sans pertes, \(C\,\mathrm{d}T/\mathrm{d}t = \mathcal P\) est constant : \(\Delta t = 37{,}6\times10^6/2\,200 \approx 17\,100\ \text{s}\), soit 4 h 45 min, d'où le chauffage la nuit, en heures creuses.</li>
      <li>Avec 80 W de pertes moyennes à travers l'isolant : \(\Delta t = 37{,}6\times10^6/2\,120\), soit 4 h 56 min.</li>
    </ol>
  </div>
  <p>Quand les pertes dépendent de la température, le bilan devient une équation différentielle. Avec une loi de pertes \(\mathcal P_{\text{pertes}} = G\,(T - T_a)\) fournie par l'énoncé (\(G\) en \(\text{W·K}^{-1}\), \(T_a\) température ambiante ; la modélisation des transferts thermiques par conduction est au programme de PT) :</p>
  <div class="formula">$$C\,\frac{\mathrm{d}T}{\mathrm{d}t} + G\,(T - T_a) = \mathcal P \quad\Longrightarrow\quad T(t) = T_a + \frac{\mathcal P}{G}\left(1 - \mathrm{e}^{-t/\tau}\right),\quad \tau = \frac{C}{G}$$</div>
  <p>(solution pour \(T(0) = T_a\)). La température tend vers \(T_{\text{lim}} = T_a + \mathcal P/G\), atteinte quand les pertes compensent exactement la puissance de chauffe : c'est un régime permanent, où \(\mathrm{d}U/\mathrm{d}t = 0\).</p>

    <strong>Exemple — un thermoplongeur dans une casserole</strong>
    <ol>
      <li>1,0 L d'eau à 20 °C (\(C = 4\,180\ \text{J·K}^{-1}\)) ; thermoplongeur de 300 W ; pertes \(G(T - T_a)\) avec \(G = 5{,}0\ \text{W·K}^{-1}\).</li>
      <li>\(\tau = C/G = 836\ \text{s} \approx 14\ \text{min}\) et \(T_{\text{lim}} = 20 + 300/5{,}0 = 80\ °\text{C}\) : l'eau n'atteindra jamais l'ébullition.</li>
      <li>Pour atteindre 70 °C : \(t = -\tau\ln\left(1 - \dfrac{50}{60}\right) \approx 1\,500\ \text{s}\), 25 min, contre 12 min sans pertes. Il faut un couvercle ou un appareil plus puissant.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer « énergie = puissance × durée » avec des pertes qui varient ; écrire le bilan avec une puissance perdue comptée comme reçue (\(\mathcal P_{\text{th}} = -\mathcal P_{\text{pertes}}\)). Toujours repartir de \(\mathrm{d}U = \delta W + \delta Q\) sur \(\mathrm{d}t\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Fluides en écoulement, transformations polytropiques</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI. Le premier principe pour un fluide en écoulement est au programme de 2ᵉ année (<a href="#thermoouv/cours">« Systèmes ouverts et thermodynamique industrielle »</a>).</div>
  <p><strong>Détente de Joule-Thomson (vue en 2ᵉ année).</strong> Un gaz s'écoule en régime permanent à travers un étranglement (paroi poreuse, robinet à peine ouvert, détendeur) dans une conduite calorifugée, de la pression \(P_1\) à \(P_2 \lt P_1\). On suit une masse de gaz donnée (système fermé) : le gaz qui la pousse en amont lui fournit le travail \(P_1V_1\), elle fournit \(P_2V_2\) au gaz en aval, et \(Q = 0\). Donc \(U_2 - U_1 = P_1V_1 - P_2V_2\), soit \(H_2 = H_1\) : la détente est <strong>isenthalpique</strong>. Pour un gaz parfait, \(T\) ne change pas ; un gaz réel se refroidit en général, ce qu'exploitent la liquéfaction des gaz et les réfrigérateurs.</p>
  <p><strong>Premier principe industriel.</strong> Pour un fluide qui traverse une machine en régime permanent : \(\Delta h + \Delta e_c + \Delta e_p = w_i + q\), en grandeurs massiques, où \(w_i\) est le travail reçu des parties mobiles (compresseur, turbine). C'est l'outil de toute l'étude des machines de 2ᵉ année.</p>
  <p><strong>Transformations polytropiques.</strong> Une transformation quasi statique vérifiant \(PV^k = \text{cste}\) (\(k\) réel fixé) modélise une compression réelle qui échange un peu de chaleur : \(k = 1\) pour l'isotherme, \(k = \gamma\) pour l'adiabatique réversible. Pour \(k \ne 1\), \(W = \dfrac{P_fV_f - P_iV_i}{k - 1}\). Exemple : un compresseur d'air (\(k = 1{,}3\)) qui fait passer 1,0 L de 1 à 6 bar le réduit à \(6^{-1/1{,}3} \approx 0{,}25\ \text{L}\) et lui fournit environ 170 J.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="th2-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · 1ER PRINCIPE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Les exercices de premier principe suivent presque toujours le même squelette : un système, une transformation, un état final, un travail, un bilan. Ces méthodes couvrent les savoir-faire exigibles des parties 3.2 et 3.3 du programme. Notations : \(W\) et \(Q\) reçus par le système (algébriques), \(P_{\text{ext}}\) pression extérieure, \(C_V = nR/(\gamma - 1)\), \(C_P = \gamma C_V\), \(c\) capacité thermique massique, \(\mu\) valeur en eau.</div>

  <div class="method-box"><strong>Méthode 1 — Définir le système et identifier la transformation</strong>
    <ol>
      <li><span class="step">Système fermé.</span> Choisir ce qui évolue et le délimiter : le gaz seul ; le gaz, le piston et la masse posée dessus (s'ils bougent) ; le calorimètre et tout son contenu.</li>
      <li><span class="step">Lire les contraintes.</span> Parois rigides : isochore ; pression extérieure constante : monobare ; un seul thermostat : monotherme ; parois calorifugées ou évolution rapide : adiabatique ; évolution lente sans frottement : quasi statique.</li>
      <li><span class="step">Traduire.</span> Adiabatique : \(Q = 0\) ; isochore : \(W = 0\) ; monobare : \(W = -P_{\text{ext}}\,\Delta V\) ; cycle : \(\Delta U = \Delta H = 0\) ; gaz parfait isotherme : \(\Delta U = \Delta H = 0\).</li>
      <li><span class="step">Choisir l'outil.</span> \(\Delta U = W + Q\) en général, \(\Delta H = Q\) en monobare avec équilibre mécanique au début et à la fin, \(\Delta U + \Delta E_c = W + Q\) si le système bouge.</li>
    </ol>
    <p><em>Exemple éclair :</em> chauffer 1,0 L d'eau de 20 à 100 °C dans une casserole ouverte. Système : l'eau ; monobare (atmosphère), équilibre mécanique aux deux bouts : \(Q = \Delta H = mc\,\Delta T = 1{,}0\times4{,}18\times80 \approx 334\ \text{kJ}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Calculer le travail des forces de pression sur un chemin donné</strong>
    <ol>
      <li><span class="step">Pression extérieure.</span> Exprimer \(P_{\text{ext}}\) le long du chemin en fonction d'une seule variable (le volume, ou la position du piston) ; pour un chemin quasi statique sans frottement, \(P_{\text{ext}} = P\), donnée par l'équation d'état.</li>
      <li><span class="step">Découper.</span> Écrire le travail élémentaire \(\delta W = -P_{\text{ext}}\,\mathrm{d}V\).</li>
      <li><span class="step">Sommer.</span> Intégrer de \(V_i\) à \(V_f\) ; un chemin en plusieurs étapes se traite étape par étape.</li>
      <li><span class="step">Contrôler.</span> Compression : \(W \gt 0\) ; détente : \(W \lt 0\) ; unités SI (\(1\ \text{bar·L} = 100\ \text{J}\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> un gaz se détend lentement de 2,0 L à 3,0 L contre une pression extérieure qui croît linéairement de 1,0 bar à 1,5 bar. \(W = -\int P_{\text{ext}}\,\mathrm{d}V\) est l'aire d'un trapèze : \(W = -\tfrac12(1{,}0 + 1{,}5)\times10^5\times1{,}0\times10^{-3} = -125\ \text{J}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Lire un travail dans le diagramme de Clapeyron</strong>
    <ol>
      <li><span class="step">Chemin quasi statique.</span> \(|W|\) est l'aire sous la courbe \(P(V)\) ; \(W \lt 0\) si l'on va vers les grands volumes, \(W \gt 0\) sinon.</li>
      <li><span class="step">Transformation monobare brutale.</span> Pas de courbe : \(|W|\) est l'aire du rectangle sous la droite \(P = P_{\text{ext}}\), entre \(V_i\) et \(V_f\).</li>
      <li><span class="step">Cycle.</span> \(|W|\) est l'aire intérieure ; sens horaire (volume en abscisse) : moteur, \(W \lt 0\) ; sens trigonométrique : récepteur, \(W \gt 0\).</li>
      <li><span class="step">Comparer des chemins</span> entre deux mêmes états : celui qui passe le plus haut en détente fournit le plus de travail.</li>
    </ol>
    <p><em>Exemple éclair :</em> le cycle A (1 L ; 1 bar) → B (3 L ; 1 bar) → C (1 L ; 3 bar) → A est un triangle d'aire \(\tfrac12\times2\ \text{L}\times2\ \text{bar} = 2\ \text{bar·L}\), parcouru dans le sens trigonométrique : \(W = +200\ \text{J}\), le cycle est récepteur.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour une transformation brutale, \(P\) n'est pas définie et \(W \ne -\int P\,\mathrm{d}V\) : seule \(P_{\text{ext}}\) compte. Et la règle « horaire = moteur » suppose \(V\) en abscisse et \(P\) en ordonnée.</div>

  <div class="method-box"><strong>Méthode 4 — Déterminer l'état final d'une transformation brutale</strong>
    <ol>
      <li><span class="step">Conditions finales.</span> Équilibre mécanique : \(P_f = P_{\text{ext}}\) (sous un piston sans masse) ; équilibre thermique avec un thermostat : \(T_f = T_0\) ; parois rigides : \(V_f = V_i\).</li>
      <li><span class="step">Premier principe</span> entre l'état initial et l'état final, avec \(W = -P_{\text{ext}}(V_f - V_i)\) en monobare, \(Q = 0\) si calorifugé.</li>
      <li><span class="step">Équation d'état</span> pour éliminer \(V_f\) (ou \(P_f\)) ; résoudre.</li>
      <li><span class="step">Ne pas</span> utiliser la loi de Laplace : la transformation n'est pas réversible. Cas particulier, la détente dans le vide (Joule-Gay-Lussac) : \(W = 0\), \(Q = 0\), \(\Delta U = 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> 0,10 mol d'air (\(C_{V,m} = \tfrac52R\)) à 300 K sous 5,0 bar, dans un cylindre calorifugé ; on débloque le piston sans masse, soumis à l'atmosphère (1,0 bar). Équilibre final : \(P_f = 1{,}0\ \text{bar}\). Premier principe, par mole : \(\tfrac52R(T_f - T_i) = -P_0(V_{m,f} - V_{m,i})\), avec \(P_0V_{m,f} = RT_f\) et \(P_0V_{m,i} = RT_i\,P_0/P_i\), d'où \(T_f = T_i\,\dfrac{2{,}5 + 0{,}2}{3{,}5} \approx 231\ \text{K}\) (et non 189 K, valeur que donnerait Laplace).</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer le transfert thermique sur un chemin donné</strong>
    <ol>
      <li><span class="step">États.</span> Déterminer les états initial et final de chaque étape (équation d'état).</li>
      <li><span class="step">Fonction d'état.</span> Calculer \(\Delta U\) (gaz parfait : \(C_V\,\Delta T\) ; phase condensée : \(C\,\Delta T\)), indépendamment du chemin.</li>
      <li><span class="step">Travail.</span> Calculer \(W\) sur l'étape (méthode 2).</li>
      <li><span class="step">Conclure.</span> \(Q = \Delta U - W\) ; additionner les étapes ; contrôler le signe et, en monobare, \(Q = \Delta H\).</li>
    </ol>
    <p><em>Exemple éclair :</em> une mole de gaz parfait monoatomique chauffée de 300 K à 400 K sous 1 bar (isobare quasi statique) : \(W = -R\,\Delta T \approx -831\ \text{J}\), \(\Delta U = \tfrac32R\,\Delta T \approx 1\,247\ \text{J}\), donc \(Q \approx 2\,078\ \text{J}\), égal à \(C_{P,m}\,\Delta T = \tfrac52R\,\Delta T\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : transfert thermique et variation de température sont distincts. Sur une isotherme, \(\Delta T = 0\) mais \(Q = -W \ne 0\) ; sur une adiabatique, \(Q = 0\) mais la température varie.</div>

  <div class="method-box"><strong>Méthode 6 — Faire un bilan d'enthalpie</strong>
    <ol>
      <li><span class="step">Vérifier les conditions</span> : transformation monobare, équilibre mécanique dans l'état initial et dans l'état final, système au repos.</li>
      <li><span class="step">Calculer \(\Delta H\)</span> : gaz parfait, \(C_P\,\Delta T\) ; phase condensée, \(C\,\Delta T = mc\,\Delta T\) ; plusieurs corps : somme (extensivité).</li>
      <li><span class="step">Écrire</span> \(\Delta H = Q + W_{\text{autre}}\), où \(W_{\text{autre}}\) est le travail autre que celui des forces de pression (électrique, d'une hélice), souvent nul.</li>
    </ol>
    <p><em>Exemple éclair :</em> chauffer 2,0 kg de cuivre (\(c = 385\ \text{J·K}^{-1}\text{·kg}^{-1}\)) de 20 °C à 220 °C à l'air libre demande \(Q = \Delta H = 2{,}0\times385\times200 = 154\ \text{kJ}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Utiliser les capacités thermiques d'un gaz parfait</strong>
    <ol>
      <li><span class="step">Reconnaître le gaz</span> : monoatomique (\(\gamma = 5/3\) : He, Ar), diatomique aux températures usuelles (\(\gamma = 7/5\) : air, N₂, O₂) ; sinon, \(\gamma\) ou \(C_V\) est donné.</li>
      <li><span class="step">Écrire</span> \(C_V = \dfrac{nR}{\gamma - 1}\) et \(C_P = \dfrac{\gamma nR}{\gamma - 1}\), donc \(C_P - C_V = nR\) (Mayer).</li>
      <li><span class="step">Passer au massique</span> avec la masse molaire \(M\) : \(c_V = \dfrac{R}{M(\gamma - 1)}\), \(c_P = \gamma c_V\).</li>
      <li><span class="step">Raccourcis</span> : \(\Delta U = \dfrac{\Delta(PV)}{\gamma - 1}\) et \(\Delta H = \dfrac{\gamma\,\Delta(PV)}{\gamma - 1}\), sans calculer \(n\) ni \(T\).</li>
    </ol>
    <p><em>Exemple éclair :</em> hélium (\(M = 4{,}0\ \text{g·mol}^{-1}\), monoatomique) : \(c_V = \dfrac{3R}{2M} \approx 3\,120\) et \(c_P = \dfrac{5R}{2M} \approx 5\,200\ \text{J·K}^{-1}\text{·kg}^{-1}\), plus que l'eau, car une mole d'hélium ne pèse que 4 g.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Utiliser les relations de Laplace</strong>
    <ol>
      <li><span class="step">Vérifier les quatre conditions</span> : gaz parfait, \(\gamma\) constant, transformation adiabatique, réversible (quasi statique sans frottement).</li>
      <li><span class="step">Choisir la forme</span> adaptée aux données : \((P, V)\) : \(PV^\gamma\) ; \((T, V)\) : \(TV^{\gamma - 1}\) ; \((T, P)\) : \(T^\gamma P^{1-\gamma}\).</li>
      <li><span class="step">Relier</span> l'état initial et l'état final ; en déduire la grandeur manquante par l'équation d'état.</li>
      <li><span class="step">Travail</span> : \(W = \Delta U = C_V(T_f - T_i)\), car \(Q = 0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> l'air d'un cylindre de moteur à essence (20 °C, 1,0 bar) est comprimé dans un rapport volumique de 8, de façon adiabatique et réversible : \(T_f = 293\times8^{0{,}4} \approx 673\ \text{K}\), \(P_f = 8^{1{,}4} \approx 18\ \text{bar}\), travail reçu \(\tfrac52R\times380 \approx 7{,}9\ \text{kJ}\) par mole.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer Laplace à une transformation brutale (méthode 4), à un gaz qui échange de la chaleur, ou à une phase condensée. Les conditions et l'interprétation par l'entropie sont dans le chapitre « Deuxième principe », §8.</div>

  <div class="method-box"><strong>Méthode 9 — Faire un bilan calorimétrique</strong>
    <ol>
      <li><span class="step">Système</span> : le calorimètre et tout son contenu ; calorifugé et monobare, donc \(\Delta H = W_e\) (travail électrique d'une résistance, sinon 0).</li>
      <li><span class="step">Hypothèse sur l'état final</span> : une seule température \(T_f\) pour tous les corps ; s'il peut y avoir un changement d'état, faire une hypothèse et la vérifier (chapitre « Corps pur diphasé », §8).</li>
      <li><span class="step">Extensivité</span> : \(\sum_k m_kc_k(T_f - T_k) + \mu\,c_{\text{eau}}(T_f - T_{\text{calo}}) = W_e\), le calorimètre étant à la température initiale de l'eau qu'il contient.</li>
      <li><span class="step">Isoler l'inconnue</span> (\(T_f\), \(c\), \(\mu\)) et contrôler : \(T_f\) doit être comprise entre les températures initiales extrêmes (sans \(W_e\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> 300 g d'eau à 20 °C dans un calorimètre de valeur en eau 20 g, puis 200 g d'eau à 70 °C : \(T_f = \dfrac{320\times20 + 200\times70}{520} \approx 39{,}2\ °\text{C}\) (sans le calorimètre, on trouverait 40,0 °C).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : isoler \(c\) avec un mauvais signe (écrire \(T_f - T_1\) au dénominateur pour un solide chaud donne une capacité négative) ; oublier la valeur en eau ; confondre \(C\) (\(\text{J·K}^{-1}\)) et \(c\) (\(\text{J·K}^{-1}\text{·kg}^{-1}\)).</div>

  <div class="method-box"><strong>Méthode 10 — Écrire un bilan d'énergie en puissance</strong>
    <ol>
      <li><span class="step">Deux instants voisins.</span> Entre \(t\) et \(t + \mathrm{d}t\) : \(\mathrm{d}U = \delta W + \delta Q\), avec \(\delta W = \mathcal P_{\text{méca}}\,\mathrm{d}t\) et \(\delta Q = \mathcal P_{\text{th}}\,\mathrm{d}t\) (puissances reçues).</li>
      <li><span class="step">Diviser</span> par \(\mathrm{d}t\) : \(C\,\dfrac{\mathrm{d}T}{\mathrm{d}t} = \mathcal P - \mathcal P_{\text{pertes}}\) pour une phase condensée chauffée.</li>
      <li><span class="step">Résoudre</span> : puissances constantes, température affine en \(t\) ; pertes \(G(T - T_a)\) données, équation du premier ordre de constante de temps \(\tau = C/G\) et de limite \(T_a + \mathcal P/G\).</li>
      <li><span class="step">Régime permanent</span> : \(\mathrm{d}T/\mathrm{d}t = 0\), la puissance fournie compense les pertes.</li>
    </ol>
    <p><em>Exemple éclair :</em> un aquarium perd \(G(T - T_a)\) avec \(G = 4{,}0\ \text{W·K}^{-1}\). Pour le maintenir à 26 °C dans une pièce à 18 °C, il faut une résistance de \(4{,}0\times8 = 32\ \text{W}\).</p>
  </div>

  <div class="notice"><strong>Pièges classiques du premier principe</strong> :
    <ul>
      <li>se tromper de signe : \(W\) et \(Q\) sont reçus ; une détente donne \(W \lt 0\), un gaz qui refroidit cède \(Q \lt 0\) ;</li>
      <li>écrire \(\Delta H = Q\) pour une transformation isochore, ou sans équilibre mécanique dans l'état initial ;</li>
      <li>croire qu'un cycle a \(W = 0\) et \(Q = 0\) : seuls \(\Delta U\) et \(\Delta H\) sont nuls, \(W + Q = 0\) ;</li>
      <li>pour un gaz parfait isotherme : \(\Delta U = \Delta H = 0\), donc \(Q = -W\) ;</li>
      <li>confondre la détente de Joule-Gay-Lussac (dans le vide, \(\Delta U = 0\), au programme) et celle de Joule-Thomson (à travers un étranglement, \(\Delta H = 0\), vue en 2ᵉ année).</li>
    </ul>
  </div>
</div>
