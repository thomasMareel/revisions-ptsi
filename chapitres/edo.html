<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Second membre polynôme ou exponentiel</h3>
  <div class="statement">Résoudre sur \(\mathbb R\), sans condition initiale.</div>
  <div class="q"><strong>Q1.</strong> \(y'' - 3y' + 2y = t^2\).</div>
  <div class="q"><strong>Q2.</strong> \(y'' + y = \mathrm{e}^{2t}\).</div>
  <div class="q"><strong>Q3.</strong> \(y'' - 2y' + y = \mathrm{e}^{t}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(r^2 - 3r + 2 = (r - 1)(r - 2)\) : \(y_h = \lambda\,\mathrm{e}^t + \mu\,\mathrm{e}^{2t}\). Le coefficient de \(y\) est non nul : on cherche \(y_p = \alpha t^2 + \beta t + \gamma\). En reportant :</p>
    <div class="formula">$$2\alpha - 3(2\alpha t + \beta) + 2(\alpha t^2 + \beta t + \gamma) = 2\alpha\,t^2 + (2\beta - 6\alpha)\,t + (2\alpha - 3\beta + 2\gamma) = t^2 .$$</div>
    <p>Identification : \(\alpha = \frac12\), puis \(\beta = 3\alpha = \frac32\), puis \(2\gamma = 3\beta - 2\alpha = \frac72\), \(\gamma = \frac74\). Solutions : \(y(t) = \lambda\,\mathrm{e}^t + \mu\,\mathrm{e}^{2t} + \dfrac{t^2}{2} + \dfrac{3t}{2} + \dfrac74\).</p>
    <p><strong>Q2.</strong> Racines \(\pm i\) : \(y_h = \lambda\cos t + \mu\sin t\). \(2\) n'est pas racine : \(y_p = \frac{1}{2^2 + 1}\,\mathrm{e}^{2t} = \frac15\,\mathrm{e}^{2t}\). Solutions : \(y(t) = \lambda\cos t + \mu\sin t + \frac15\,\mathrm{e}^{2t}\).</p>
    <p><strong>Q3.</strong> \(r^2 - 2r + 1 = (r - 1)^2\), racine double 1 : \(y_h = (\lambda + \mu t)\,\mathrm{e}^t\). Le second membre \(\mathrm{e}^t\) a pour exposant la racine double : \(y_p = \frac12\,t^2\,\mathrm{e}^t\). Vérification : avec \(y_p' = \frac12(2t + t^2)\,\mathrm{e}^t\) et \(y_p'' = \frac12(2 + 4t + t^2)\,\mathrm{e}^t\), on trouve \(y_p'' - 2y_p' + y_p = \mathrm{e}^t\). Solutions : \(y(t) = \left(\lambda + \mu t + \frac{t^2}{2}\right)\mathrm{e}^t\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Oscillateur excité hors résonance</h3>
  <div class="statement">Résoudre \(y'' + 4y = 5\cos t\) avec \(y(0) = 0\) et \(y'(0) = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p>Homogène : \(r^2 + 4 = 0\), \(r = \pm 2i\), \(y_h = \lambda\cos(2t) + \mu\sin(2t)\).</p>
    <p>Particulière : \(\omega = 1\), et \(i\) n'est pas racine (seuls \(\pm 2i\) le sont). Avec \(\frac{5}{4 - 1} = \frac53\) réel : \(y_p = \frac53\cos t\) (aucun terme en sinus, car il n'y a pas de terme en \(y'\)).</p>
    <p>Conditions initiales : \(y(0) = \lambda + \frac53 = 0\) donne \(\lambda = -\frac53\) ; \(y'(t) = -2\lambda\sin(2t) + 2\mu\cos(2t) - \frac53\sin t\), donc \(y'(0) = 2\mu = 0\) et \(\mu = 0\).</p>
    <p>Solution : \(y(t) = \frac53\big(\cos t - \cos(2t)\big)\). C'est la superposition de deux oscillations de pulsations 1 et 2, qui reste bornée (\(|y| \le \frac{10}{3}\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Décharge d'un condensateur</h3>
  <div class="statement">Un condensateur de capacité \(C\), chargé sous la tension \(U_0\), est branché à \(t = 0\) sur une résistance \(R\). La tension \(u(t)\) à ses bornes vérifie \(RC\,u' + u = 0\). Donner \(u(t)\), puis l'instant \(t_5\) où \(u\) vaut 5 % de \(U_0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p>Forme résolue : \(u' + \frac{1}{RC}\,u = 0\). Solutions : \(u(t) = K\,\mathrm{e}^{-t/(RC)}\).</p>
    <p>\(u(0) = U_0\) donne \(K = U_0\) : \(u(t) = U_0\,\mathrm{e}^{-t/\tau}\), avec \(\tau = RC\), constante de temps.</p>
    <p>\(u(t_5) = 0{,}05\,U_0\) équivaut à \(\mathrm{e}^{-t_5/\tau} = 0{,}05\), soit \(t_5 = \tau\ln 20 \approx 3{,}0\,\tau\). Pour \(R = 10\ \text{k}\Omega\) et \(C = 100\ \text{nF}\) (\(\tau = 1\ \text{ms}\)), \(t_5 \approx 3\ \text{ms}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Deux équations à coefficients variables</h3>
  <div class="statement">On résout par la variation de la constante.</div>
  <div class="q"><strong>Q1.</strong> Résoudre \(y' + y\tan t = \cos^2 t\) sur \(]-\frac\pi2, \frac\pi2[\), puis trouver la solution telle que \(y(0) = 1\).</div>
  <div class="q"><strong>Q2.</strong> Résoudre \(t\,y' + y = \cos t\) sur \(]0, +\infty[\), puis trouver la solution telle que \(y(\pi) = 0\).</div>
  <div class="q"><strong>Q3.</strong> Parmi les solutions de Q2, lesquelles ont une limite finie en \(0^+\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(a(t) = \tan t\), de primitive \(A(t) = -\ln(\cos t)\) (\(\cos t \gt 0\) sur l'intervalle). Homogène : \(K\,\mathrm{e}^{\ln\cos t} = K\cos t\). Avec \(y = K(t)\cos t\) : \(K'(t)\cos t = \cos^2 t\), donc \(K'(t) = \cos t\), \(K(t) = \sin t + K\). Solutions : \(y(t) = (\sin t + K)\cos t\). La condition \(y(0) = K = 1\) donne \(y(t) = (1 + \sin t)\cos t\).</p>
    <p><strong>Q2.</strong> Forme résolue : \(y' + \frac1t\,y = \frac{\cos t}{t}\). Homogène : \(A(t) = \ln t\), \(y_h = \frac Kt\). Avec \(y = \frac{K(t)}{t}\) : \(\frac{K'(t)}{t} = \frac{\cos t}{t}\), \(K'(t) = \cos t\), \(K(t) = \sin t + K\). Solutions : \(y(t) = \dfrac{\sin t + K}{t}\). On pouvait aussi remarquer que \(t\,y' + y = (t\,y)'\). La condition \(y(\pi) = \frac{K}{\pi} = 0\) donne \(y(t) = \dfrac{\sin t}{t}\).</p>
    <p><strong>Q3.</strong> Quand \(t \to 0^+\), \(\sin t \to 0\) : si \(K \neq 0\), \(\frac{\sin t + K}{t}\) tend vers \(\pm\infty\) (signe de \(K\)) ; si \(K = 0\), \(\frac{\sin t}{t} \to 1\). Une seule solution a une limite finie en \(0^+\) : celle de Q2. On retrouve que le coefficient de \(y'\), qui s'annule en 0, rend ce point singulier.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Circuit RC en régime sinusoïdal</h3>
  <div class="statement">Un circuit RC série, initialement déchargé, est alimenté à partir de \(t = 0\) par la tension \(e(t) = E\cos(\omega t)\). La tension \(u\) aux bornes du condensateur vérifie \(\tau\,u' + u = E\cos(\omega t)\), avec \(\tau = RC\), et \(u(0) = 0\).</div>
  <div class="q"><strong>Q1.</strong> En résolvant \(\tau\,z' + z = E\,\mathrm{e}^{i\omega t}\), déterminer une solution particulière de la forme \(u_p(t) = U\cos(\omega t - \varphi)\), avec \(U \gt 0\) et \(\varphi \in [0, \frac\pi2[\).</div>
  <div class="q"><strong>Q2.</strong> Application numérique : \(\tau = 1\ \text{ms}\), fréquence \(500\ \text{Hz}\). Calculer \(\omega\tau\), \(\frac UE\) et \(\varphi\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer la solution \(u\) qui vérifie \(u(0) = 0\). Au bout de combien de temps le régime transitoire est-il inférieur à 1 % de l'amplitude \(U\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On cherche \(z = c\,\mathrm{e}^{i\omega t}\) : \(\tau\,i\omega\,c + c = E\), \(c = \frac{E}{1 + i\omega\tau}\). Avec \(1 + i\omega\tau = \sqrt{1 + \omega^2\tau^2}\,\mathrm{e}^{i\varphi}\), \(\varphi = \arctan(\omega\tau)\), on a \(c = \frac{E}{\sqrt{1 + \omega^2\tau^2}}\,\mathrm{e}^{-i\varphi}\). Les coefficients étant réels, la partie réelle de \(z\) est solution pour le second membre \(E\cos(\omega t)\) :</p>
    <div class="formula">$$u_p(t) = \frac{E}{\sqrt{1 + \omega^2\tau^2}}\cos(\omega t - \varphi), \qquad \varphi = \arctan(\omega\tau) .$$</div>
    <p><strong>Q2.</strong> \(\omega = 2\pi \times 500 = 1\,000\,\pi\ \text{rad/s}\), donc \(\omega\tau = \pi\). Alors \(\frac UE = \frac{1}{\sqrt{1 + \pi^2}} \approx 0{,}30\) et \(\varphi = \arctan\pi \approx 1{,}26\ \text{rad}\), soit \(72°\) : le circuit atténue et retarde le signal (c'est un filtre passe-bas, chapitre « Régime sinusoïdal forcé et filtrage linéaire »).</p>
    <p><strong>Q3.</strong> Solutions : \(u = u_p + K\,\mathrm{e}^{-t/\tau}\). Comme \(\cos\varphi = \frac{1}{\sqrt{1 + \omega^2\tau^2}}\), \(u_p(0) = \frac{E}{1 + \omega^2\tau^2}\), et \(u(0) = 0\) impose \(K = -u_p(0)\) :</p>
    <div class="formula">$$u(t) = \frac{E}{\sqrt{1 + \omega^2\tau^2}}\cos(\omega t - \varphi) - \frac{E}{1 + \omega^2\tau^2}\,\mathrm{e}^{-t/\tau} .$$</div>
    <p>Le transitoire est inférieur à \(1\ \%\) de \(U\) quand \(\frac{\mathrm{e}^{-t/\tau}}{1 + \omega^2\tau^2} \le \frac{0{,}01}{\sqrt{1 + \omega^2\tau^2}}\), soit \(t \ge \tau\ln\frac{100}{\sqrt{1 + \pi^2}} \approx 3{,}4\,\tau = 3{,}4\ \text{ms}\), moins de deux périodes du signal (2 ms).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Superposition et résonance</h3>
  <div class="statement">On considère \((E) : y'' + y = t + \cos t\).</div>
  <div class="q"><strong>Q1.</strong> Trouver une solution particulière de \(y'' + y = t\), puis de \(y'' + y = \cos t\).</div>
  <div class="q"><strong>Q2.</strong> En déduire la solution de \((E)\) telle que \(y(0) = 0\) et \(y'(0) = 0\).</div>
  <div class="q"><strong>Q3.</strong> Cette solution est-elle bornée sur \([0, +\infty[\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(t\) : le coefficient de \(y\) vaut \(1 \neq 0\), on cherche \(\gamma t + \delta\) : \(\gamma t + \delta = t\), donc \(y_1 = t\). Pour \(\cos t = \operatorname{Re}(\mathrm{e}^{it})\) : \(i\) est racine de \(r^2 + 1 = 0\), c'est la résonance. La forme \(\frac{A}{2\lambda + a}\,t\,\mathrm{e}^{\lambda t}\) donne \(z = \frac{1}{2i}\,t\,\mathrm{e}^{it} = -\frac i2\,t\,\mathrm{e}^{it}\), de partie réelle \(y_2 = \frac12\,t\sin t\).</p>
    <p><strong>Q2.</strong> Par superposition, les solutions de \((E)\) sont \(y = \lambda\cos t + \mu\sin t + t + \frac12\,t\sin t\). Alors \(y(0) = \lambda = 0\) ; en dérivant,</p>
    <div class="formula">$$y'(t) = -\lambda\sin t + \mu\cos t + 1 + \frac12\sin t + \frac12\,t\cos t ,$$</div>
    <p>d'où \(y'(0) = \mu + 1 = 0\), \(\mu = -1\). Solution : \(y(t) = t - \sin t + \frac12\,t\sin t\).</p>
    <p><strong>Q3.</strong> Non : en \(t_k = \frac\pi2 + 2k\pi\), \(y(t_k) = \frac32\,t_k - 1 \to +\infty\). Deux causes s'ajoutent : le second membre \(t\) n'est pas borné, et le terme résonant \(\frac12\,t\sin t\) oscille avec une amplitude qui croît linéairement.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ★</span>
  <h3>Particule chargée dans un champ magnétique</h3>
  <div class="statement">Une particule de masse \(m\) et de charge \(q \gt 0\) se déplace dans le plan \((Oxy)\), dans un champ magnétique uniforme \(\vec B = B\,\vec u_z\) (\(B \gt 0\)). La force de Lorentz \(q\,\vec v \wedge \vec B\) donne les équations \(v_x' = \omega\,v_y\) et \(v_y' = -\omega\,v_x\), avec \(\omega = \frac{qB}{m}\). À \(t = 0\), la particule est en \(O\) avec la vitesse \(v_0\,\vec u_x\) (\(v_0 \gt 0\)).</div>
  <div class="q"><strong>Q1.</strong> On pose \(W = v_x + i\,v_y\). Montrer que \(W' = -i\omega\,W\) et en déduire \(W(t)\).</div>
  <div class="q"><strong>Q2.</strong> On pose \(Z = x + i\,y\), affixe de la position. Déterminer \(Z(t)\), et montrer que la trajectoire est un cercle dont on donnera le centre et le rayon \(R\).</div>
  <div class="q"><strong>Q3.</strong> Application numérique pour un proton (\(m = 1{,}67 \times 10^{-27}\ \text{kg}\), \(q = 1{,}60 \times 10^{-19}\ \text{C}\)) avec \(v_0 = 1{,}0 \times 10^6\ \text{m/s}\) et \(B = 0{,}10\ \text{T}\) : \(\omega\), \(R\) et la période.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> En factorisant \(-i\omega\) (car \(\omega\,v_y = -i\omega \times i\,v_y\)) :</p>
    <div class="formula">$$W' = v_x' + i\,v_y' = \omega\,v_y - i\omega\,v_x = -i\omega\,(v_x + i\,v_y) = -i\omega\,W .$$</div>
    <p>C'est une équation homogène d'ordre 1 à coefficient constant complexe : \(W(t) = W(0)\,\mathrm{e}^{-i\omega t} = v_0\,\mathrm{e}^{-i\omega t}\). Le vecteur vitesse tourne à vitesse angulaire \(\omega\) (dans le sens horaire), en gardant la norme \(v_0\).</p>
    <p><strong>Q2.</strong> \(Z' = W\), donc \(Z\) est la primitive de \(v_0\,\mathrm{e}^{-i\omega t}\) nulle en 0 (chapitre « Primitives », §5) :</p>
    <div class="formula">$$Z(t) = \frac{v_0}{-i\omega}\left(\mathrm{e}^{-i\omega t} - 1\right) = -\frac{i v_0}{\omega} + \frac{i v_0}{\omega}\,\mathrm{e}^{-i\omega t} .$$</div>
    <p>Donc \(\left|Z(t) - \left(-\frac{iv_0}{\omega}\right)\right| = \frac{v_0}{\omega}\) pour tout \(t\) : la particule décrit le cercle de centre le point \((0, -R)\) et de rayon \(R = \frac{v_0}{\omega} = \frac{m\,v_0}{q\,B}\). Contrôle : à \(t = 0\), la force \(q\,v_0B\,(\vec u_x \wedge \vec u_z) = -q\,v_0B\,\vec u_y\) pointe bien vers ce centre.</p>
    <p><strong>Q3.</strong></p>
    <div class="formula">$$\omega = \frac{1{,}60 \times 10^{-19} \times 0{,}10}{1{,}67 \times 10^{-27}} \approx 9{,}6 \times 10^6\ \text{rad/s} ,$$</div>
    <p>\(R = \frac{v_0}{\omega} \approx 0{,}10\ \text{m}\), période \(\frac{2\pi}{\omega} \approx 0{,}66\ \mu\text{s}\), indépendante de la vitesse (principe du cyclotron, chapitre « Particules chargées — Lorentz »).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ☆</span>
  <h3>Méthode d'Euler et ordre de l'erreur</h3>
  <div class="statement">On considère le problème de Cauchy \(y' = t - y\), \(y(0) = 1\), sur \([0, 1]\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer la solution exacte et sa valeur en \(t = 1\).</div>
  <div class="q"><strong>Q2.</strong> Appliquer à la main la méthode d'Euler avec le pas \(h = 0{,}5\), puis \(h = 0{,}25\), jusqu'à \(t = 1\). Calculer l'erreur commise en \(t = 1\) dans les deux cas.</div>
  <div class="q"><strong>Q3.</strong> Avec la fonction <code>euler(F, t0, y0, h, n)</code> du chapitre « Méthodes numériques », on obtient en \(t = 1\) les valeurs \(0{,}697\,357\) (\(h = 0{,}1\)) et \(0{,}732\,065\) (\(h = 0{,}01\)). Que dire de l'erreur en fonction de \(h\) ?</div>
  <div class="q"><strong>Q4.</strong> Pour l'équation \(y' = -y\), montrer que la méthode donne \(y_k = (1 - h)^k\,y_0\). Pour quels pas \(h \gt 0\) la suite tend-elle vers 0 comme la solution exacte ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(y' + y = t\) : homogène \(K\,\mathrm{e}^{-t}\), solution particulière \(t - 1\) (polynôme de degré 1 : \(\gamma + \gamma t + \delta = t\) donne \(\gamma = 1\), \(\delta = -1\)). \(y(0) = -1 + K = 1\) : \(y(t) = t - 1 + 2\,\mathrm{e}^{-t}\), et \(y(1) = 2\,\mathrm{e}^{-1} \approx 0{,}7358\).</p>
    <p><strong>Q2.</strong> Schéma : \(y_{k+1} = y_k + h\,(t_k - y_k)\). Avec \(h = 0{,}5\) : \(y_1 = 1 + 0{,}5\,(0 - 1) = 0{,}5\), \(y_2 = 0{,}5 + 0{,}5\,(0{,}5 - 0{,}5) = 0{,}5\) ; erreur \(0{,}236\). Avec \(h = 0{,}25\) : \(y_1 = 0{,}75\), \(y_2 = 0{,}625\), \(y_3 = 0{,}59375\), \(y_4 \approx 0{,}6328\) ; erreur \(0{,}103\).</p>
    <p><strong>Q3.</strong> Les erreurs valent \(0{,}236\) ; \(0{,}103\) ; \(0{,}0384\) ; \(0{,}0037\) pour \(h = 0{,}5\) ; \(0{,}25\) ; \(0{,}1\) ; \(0{,}01\). Pour les petits pas, diviser \(h\) par 10 divise l'erreur par 10 environ : l'erreur est proportionnelle à \(h\), la méthode est d'ordre 1. Pour gagner une décimale, il faut dix fois plus de calculs.</p>
    <p><strong>Q4.</strong> \(y_{k+1} = y_k + h\,(-y_k) = (1 - h)\,y_k\), suite géométrique : \(y_k = (1 - h)^k\,y_0\). Elle tend vers 0 si et seulement si \(|1 - h| \lt 1\), soit \(0 \lt h \lt 2\). Pour \(h = 2{,}5\), on obtient \(1\), \(-1{,}5\), \(2{,}25\), \(-3{,}375\)… : la suite oscille et diverge, alors que \(\mathrm{e}^{-t}\) décroît. Le pas doit rester petit devant la constante de temps (ici 1).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un oscillateur amorti : régimes, dépassement, résonance</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves de mathématiques PT (thème : équations différentielles linéaires du second ordre). Pour t'entraîner sur les sujets réellement tombés : <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.</div>
  <div class="statement">Soit \(\alpha \ge 0\) un réel. On étudie l'équation \((E_\alpha) : y'' + 2\alpha\,y' + y = f(t)\), où \(f\) est une fonction continue sur \(\mathbb R\) ; elle modélise un oscillateur de pulsation propre 1 (le temps a été rendu sans dimension), amorti par le terme \(2\alpha\,y'\).</div>

  <p class="exo-part">Partie A — Équation homogène</p>
  <div class="q"><strong>A1.</strong> Selon la valeur de \(\alpha\) (\(0 \le \alpha \lt 1\), \(\alpha = 1\), \(\alpha \gt 1\)), donner les solutions réelles de \(y'' + 2\alpha\,y' + y = 0\).</div>
  <div class="q"><strong>A2.</strong> Montrer que si \(\alpha \gt 0\), toutes ces solutions tendent vers 0 en \(+\infty\). Que se passe-t-il pour \(\alpha = 0\) ?</div>

  <p class="exo-part">Partie B — Réponse à un échelon (\(\alpha = \frac12\), \(f = 1\))</p>
  <div class="q"><strong>B1.</strong> Déterminer la solution \(y\) de \(y'' + y' + y = 1\) telle que \(y(0) = y'(0) = 0\).</div>
  <div class="q"><strong>B2.</strong> Calculer \(y'(t)\), en déduire l'instant \(t_1 \gt 0\) du premier maximum et la valeur \(y(t_1)\). Quel est le dépassement relatif ?</div>

  <p class="exo-part">Partie C — Régime sinusoïdal forcé (\(\alpha \gt 0\), \(f(t) = \cos(\omega t)\), \(\omega \gt 0\))</p>
  <div class="q"><strong>C1.</strong> Déterminer une solution particulière en résolvant \(z'' + 2\alpha\,z' + z = \mathrm{e}^{i\omega t}\). Montrer que son amplitude vaut \(G(\omega) = \dfrac{1}{\sqrt{(1 - \omega^2)^2 + 4\alpha^2\omega^2}}\).</div>
  <div class="q"><strong>C2.</strong> Justifier que toute solution de \((E_\alpha)\) est, pour \(t\) grand, aussi proche qu'on veut de cette solution particulière.</div>
  <div class="q"><strong>C3.</strong> En étudiant \(X \mapsto (1 - X)^2 + 4\alpha^2 X\) sur \(]0, +\infty[\), montrer que \(G\) admet un maximum sur \(]0, +\infty[\) si et seulement si \(\alpha \lt \frac{1}{\sqrt2}\), atteint en \(\omega_r = \sqrt{1 - 2\alpha^2}\), et que \(G(\omega_r) = \dfrac{1}{2\alpha\sqrt{1 - \alpha^2}}\).</div>
  <div class="q"><strong>C4.</strong> Application : \(\alpha = 0{,}1\). Calculer \(\omega_r\), \(G(\omega_r)\) et \(G(1)\).</div>

  <p class="exo-part">Partie D — Sans amortissement (\(\alpha = 0\), \(f(t) = \cos t\))</p>
  <div class="q"><strong>D1.</strong> Résoudre \(y'' + y = \cos t\) avec \(y(0) = y'(0) = 0\). La solution est-elle bornée ?</div>
  <div class="q"><strong>D2.</strong> En physique, cette équation s'écrit \(\ddot x + \frac{\omega_0}{Q}\,\dot x + \omega_0^2\,x = \ldots\) ; en sciences de l'ingénieur, \(\ddot x + 2\xi\omega_0\,\dot x + \omega_0^2\,x = \ldots\). Exprimer \(Q\) et \(\xi\) en fonction de \(\alpha\) (avec \(\omega_0 = 1\)), et traduire les conditions \(\alpha = 1\) et \(\alpha \lt \frac{1}{\sqrt2}\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Équation caractéristique \(r^2 + 2\alpha r + 1 = 0\), de discriminant \(4(\alpha^2 - 1)\).</p>
    <ul>
      <li>\(0 \le \alpha \lt 1\) : racines \(-\alpha \pm i\beta\) avec \(\beta = \sqrt{1 - \alpha^2}\) ; \(y(t) = \mathrm{e}^{-\alpha t}\big(\lambda\cos(\beta t) + \mu\sin(\beta t)\big)\).</li>
      <li>\(\alpha = 1\) : racine double \(-1\) ; \(y(t) = (\lambda + \mu t)\,\mathrm{e}^{-t}\).</li>
      <li>\(\alpha \gt 1\) : racines réelles \(r_\pm = -\alpha \pm \sqrt{\alpha^2 - 1}\) ; \(y(t) = \lambda\,\mathrm{e}^{r_+ t} + \mu\,\mathrm{e}^{r_- t}\).</li>
    </ul>
    <p><strong>A2.</strong> Si \(0 \lt \alpha \lt 1\), \(|y(t)| \le (|\lambda| + |\mu|)\,\mathrm{e}^{-\alpha t} \to 0\). Si \(\alpha = 1\), \(t\,\mathrm{e}^{-t} \to 0\) par croissances comparées. Si \(\alpha \gt 1\), \(r_- \lt r_+ \lt 0\), car \(\sqrt{\alpha^2 - 1} \lt \alpha\) ; les deux exponentielles tendent vers 0. (C'est le critère du cours : \(a = 2\alpha \gt 0\) et \(b = 1 \gt 0\).) Pour \(\alpha = 0\), les solutions \(\lambda\cos t + \mu\sin t\) sont bornées mais ne tendent pas vers 0, sauf la solution nulle : l'oscillateur non amorti oscille indéfiniment.</p>
    <p><strong>B1.</strong> \(y_p = 1\) ; racines \(-\frac12 \pm i\frac{\sqrt3}{2}\). Donc \(y = 1 + \mathrm{e}^{-t/2}\big(\lambda\cos\frac{\sqrt3 t}{2} + \mu\sin\frac{\sqrt3 t}{2}\big)\). \(y(0) = 1 + \lambda = 0\), \(\lambda = -1\) ; \(y'(0) = -\frac\lambda2 + \frac{\sqrt3}{2}\mu = 0\), \(\mu = -\frac{1}{\sqrt3}\) :</p>
    <div class="formula">$$y(t) = 1 - \mathrm{e}^{-t/2}\left(\cos\frac{\sqrt3\,t}{2} + \frac{1}{\sqrt3}\sin\frac{\sqrt3\,t}{2}\right) .$$</div>
    <p><strong>B2.</strong> En dérivant, les termes en cosinus se compensent : \(y'(t) = \frac{2}{\sqrt3}\,\mathrm{e}^{-t/2}\sin\frac{\sqrt3\,t}{2}\). \(y'\) est positive sur \(]0, t_1[\) et change de signe en \(t_1 = \frac{2\pi}{\sqrt3} \approx 3{,}63\), où \(\cos\frac{\sqrt3 t_1}{2} = \cos\pi = -1\) : \(y(t_1) = 1 + \mathrm{e}^{-\pi/\sqrt3} \approx 1{,}163\). Le dépassement relatif est de \(16{,}3\ \%\).</p>
    <p><strong>C1.</strong> \(i\omega\) n'est pas racine (les racines ont une partie réelle \(-\alpha \lt 0\)). On cherche \(z = c\,\mathrm{e}^{i\omega t}\) : \((-\omega^2 + 2i\alpha\omega + 1)\,c = 1\). Les coefficients étant réels, \(y_p = \operatorname{Re}\dfrac{\mathrm{e}^{i\omega t}}{1 - \omega^2 + 2i\alpha\omega}\) est solution, d'amplitude \(\left|\dfrac{1}{1 - \omega^2 + 2i\alpha\omega}\right| = G(\omega)\).</p>
    <p><strong>C2.</strong> Toute solution s'écrit \(y = y_p + y_h\), où \(y_h\) est solution de l'équation homogène ; d'après A2 (\(\alpha \gt 0\)), \(y_h(t) \to 0\). Donc \(y(t) - y_p(t) \to 0\) : c'est le régime permanent, indépendant des conditions initiales.</p>
    <p><strong>C3.</strong> \(G(\omega) = \frac{1}{\sqrt{g(\omega^2)}}\) avec \(g(X) = (1 - X)^2 + 4\alpha^2 X\). \(G\) est maximale quand \(g(\omega^2)\) est minimale. \(g'(X) = -2(1 - X) + 4\alpha^2\) s'annule en \(X_0 = 1 - 2\alpha^2\), et \(g\) décroît puis croît. Si \(\alpha \lt \frac{1}{\sqrt2}\), \(X_0 \gt 0\) et le minimum de \(g\) sur \(]0, +\infty[\) est atteint en \(X_0\) : \(G\) atteint son maximum en \(\omega_r = \sqrt{X_0}\). Si \(\alpha \ge \frac{1}{\sqrt2}\), \(g\) est croissante sur \(]0, +\infty[\) et \(G\) décroissante : pas de maximum. Enfin \(g(X_0) = 4\alpha^4 + 4\alpha^2(1 - 2\alpha^2) = 4\alpha^2(1 - \alpha^2)\), d'où \(G(\omega_r) = \dfrac{1}{2\alpha\sqrt{1 - \alpha^2}}\).</p>
    <p><strong>C4.</strong> \(\omega_r = \sqrt{0{,}98} \approx 0{,}990\), \(G(\omega_r) = \frac{1}{0{,}2\sqrt{0{,}99}} \approx 5{,}03\), et \(G(1) = \frac{1}{2\alpha} = 5\). Pour un faible amortissement, la résonance a lieu presque à la pulsation propre, avec une amplitude proche de \(\frac{1}{2\alpha}\).</p>
    <p><strong>D1.</strong> \(i\) est racine de \(r^2 + 1\) : résonance. La solution particulière \(\frac12\,t\sin t\) vérifie déjà \(y(0) = 0\) et \(y'(0) = 0\) ; par unicité de la solution du problème de Cauchy, \(y(t) = \frac12\,t\sin t\). Elle n'est pas bornée : en \(t_k = \frac\pi2 + 2k\pi\), \(y(t_k) = \frac{t_k}{2} \to +\infty\).</p>
    <p><strong>D2.</strong> Avec \(\omega_0 = 1\) : \(\frac{1}{Q} = 2\alpha\), soit \(Q = \frac{1}{2\alpha}\), et \(2\xi = 2\alpha\), soit \(\xi = \alpha\). Le régime critique \(\alpha = 1\) correspond à \(Q = \frac12\) (ou \(\xi = 1\)) ; la condition de résonance \(\alpha \lt \frac{1}{\sqrt2}\) correspond à \(Q \gt \frac{1}{\sqrt2}\) (ou \(\xi \lt \frac{1}{\sqrt2}\)), la condition connue en physique pour la résonance en élongation (chapitre « Oscillateurs harmoniques », §10).</p>
  </div>
