<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties « Équations différentielles linéaires du premier ordre » et « du second ordre à coefficients constants » de la section « Techniques fondamentales de calcul différentiel et intégral » du programme de PTSI (premier semestre). Le point de vue est pratique : savoir résoudre, en s'appuyant sur le calcul de primitives (chapitre « Primitives ») et sur les nombres complexes. Le programme demande d'illustrer le cours par des exemples issus des autres disciplines : circuits électriques, oscillateurs mécaniques, thermique. La variable est notée \(t\), comme le temps en physique (le programme écrit \(x\)). La structure de l'ensemble des solutions sera reprise en algèbre linéaire (chapitres « Espaces vectoriels », §7, et « Applications linéaires », §7) ; le chapitre « Équations différentielles (approfondissements) » de 2ᵉ année traite l'ordre 2 à coefficients variables.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Équation linéaire du premier ordre</strong> \(y' + a(t)\,y = b(t)\), où \(a\) et \(b\) sont des fonctions réelles ou complexes, continues sur un intervalle \(I\) ; équation homogène associée (§1).</li>
        <li><strong>Ensemble des solutions de l'équation homogène</strong> ; cas particulier où \(a\) est constante (§2).</li>
        <li><strong>Principe de superposition</strong> ; description de l'ensemble des solutions à partir d'une solution particulière et des solutions de l'équation homogène associée (§3).</li>
        <li><strong>Méthode de la variation de la constante</strong> (§4).</li>
        <li><strong>Existence et unicité de la solution d'un problème de Cauchy</strong> (premier ordre) (§5).</li>
        <li><strong>Équation linéaire du second ordre à coefficients constants</strong> \(y'' + a\,y' + b\,y = f(t)\), \(a\), \(b\) scalaires, \(f\) réelle ou complexe, continue sur un intervalle ; équation homogène associée ; ensemble des solutions de l'équation homogène (§6) ; si \(a\) et \(b\) sont réels, description des solutions réelles (§7).</li>
        <li><strong>Solution particulière</strong> pour un second membre polynôme, de la forme \(t \mapsto A\,\mathrm{e}^{\lambda t}\) avec \((A, \lambda) \in \mathbb C^2\), \(t \mapsto B\cos(\omega t)\) et \(t \mapsto B\sin(\omega t)\) avec \((B, \omega) \in \mathbb R^2\) ; principe de superposition (§8).</li>
        <li><strong>Existence et unicité de la solution d'un problème de Cauchy</strong> (second ordre), la démonstration étant hors programme (§9).</li>
        <li><strong>Exemples issus des autres disciplines</strong> : régimes transitoire et permanent, stabilité, correspondance avec les notations de la physique et des sciences de l'ingénieur (§7, §10) ; discrétisation par la méthode d'Euler, suggérée par le programme (§11).</li>
      </ul>
      <p>Hors programme de mathématiques en PTSI : le second membre général \(P(t)\,\mathrm{e}^{\lambda t}\), la variation des constantes à l'ordre 2, les équations d'ordre 2 à coefficients variables et le wronskien (vus en 2ᵉ année), les équations non linéaires. Les équations à variables séparables ne sont pas au programme de mathématiques, mais leur résolution est une capacité des outils mathématiques de physique-chimie. Tout cela est regroupé en fin de chapitre.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · ÉQUATIONS DIFFÉRENTIELLES LINÉAIRES</div>
  <h2>Le cadre et le vocabulaire</h2>
  <div class="intro">Une équation différentielle relie une fonction inconnue \(y\) à ses dérivées. Presque toutes les lois d'évolution de la physique en sont : la loi des mailles d'un circuit, le principe fondamental de la dynamique, la loi de Newton du refroidissement. Lorsqu'elles sont <strong>linéaires</strong>, on sait les résoudre complètement, et l'ensemble de leurs solutions a une structure simple.</div>

  <div class="def-box">
    Dans tout le chapitre, \(\mathbb K\) désigne \(\mathbb R\) ou \(\mathbb C\) et \(I\) un intervalle de \(\mathbb R\) non réduit à un point. Soit \(a, b : I \to \mathbb K\) continues. Une <strong>solution sur \(I\)</strong> de l'équation différentielle linéaire du premier ordre
    <div class="formula">$$(E)\qquad y' + a(t)\,y = b(t)$$</div>
    est une fonction \(y : I \to \mathbb K\) dérivable telle que \(y'(t) + a(t)\,y(t) = b(t)\) pour tout \(t \in I\). La fonction \(b\) est le <strong>second membre</strong> ; l'<strong>équation homogène associée</strong> (ou sans second membre) est \((H) : y' + a(t)\,y = 0\). De même, pour \(a\), \(b\) dans \(\mathbb K\) et \(f : I \to \mathbb K\) continue, on étudie l'équation du second ordre à coefficients constants \(y'' + a\,y' + b\,y = f(t)\) et son équation homogène \(y'' + a\,y' + b\,y = 0\).
  </div>
  <p><strong>Pourquoi « linéaire ».</strong> L'application \(L : y \mapsto y' + a\,y\) vérifie \(L(\lambda y_1 + \mu y_2) = \lambda L(y_1) + \mu L(y_2)\) pour tous scalaires \(\lambda\), \(\mu\) : elle est linéaire. Résoudre \((E)\), c'est chercher les \(y\) tels que \(L(y) = b\). Les équations \(y' = y^2\) ou \(\theta'' + \sin\theta = 0\) (pendule) ne sont pas linéaires : \(y^2\) et \(\sin\theta\) ne dépendent pas linéairement de l'inconnue. Les coefficients, eux, peuvent dépendre de \(t\) à l'ordre 1.</p>
  <p><strong>Forme résolue.</strong> Une équation \(\alpha(t)\,y' + \beta(t)\,y = \gamma(t)\) se ramène à la forme \((E)\) en divisant par \(\alpha(t)\), sur chaque intervalle où \(\alpha\) ne s'annule pas : on obtient \(a = \beta/\alpha\) et \(b = \gamma/\alpha\). Par exemple, \((1 + t^2)\,y' + 2t\,y = 1\) s'écrit \(y' + \frac{2t}{1 + t^2}\,y = \frac{1}{1 + t^2}\) sur \(\mathbb R\) tout entier.</p>

  <table>
    <tr><th>situation</th><th>équation</th><th>chapitre</th></tr>
    <tr><td>charge d'un condensateur</td><td>\(\tau\,u' + u = E\), \(\tau = RC\)</td><td>« Circuit linéaire du premier ordre »</td></tr>
    <tr><td>chute avec frottement linéaire</td><td>\(v' + \frac{k}{m}\,v = g\)</td><td>« Principes de la dynamique : lois de Newton »</td></tr>
    <tr><td>masse-ressort amorti</td><td>\(m\,x'' + h\,x' + k\,x = 0\)</td><td>« Oscillateurs harmoniques »</td></tr>
    <tr><td>circuit RLC série</td><td>\(L\,q'' + R\,q' + \frac{q}{C} = e(t)\)</td><td>« Circuit RLC série »</td></tr>
  </table>

  <div class="method-box">
    <strong>Exemple — vérifier qu'une fonction est solution</strong>
    <ol>
      <li>La fonction \(y(t) = t - 1 + 2\,\mathrm{e}^{-t}\) est-elle solution sur \(\mathbb R\) de \(y' + y = t\) ? On calcule \(y'(t) = 1 - 2\,\mathrm{e}^{-t}\).</li>
      <li>\(y'(t) + y(t) = 1 - 2\,\mathrm{e}^{-t} + t - 1 + 2\,\mathrm{e}^{-t} = t\) : oui. De plus \(y(0) = -1 + 2 = 1\).</li>
      <li>La fonction \(t \mapsto t - 1\) est aussi solution, mais vaut \(-1\) en 0. Une équation différentielle a en général une infinité de solutions ; une condition initiale en choisit une (§5).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : parler de solution sans préciser l'intervalle. Une solution est une fonction définie sur un <strong>intervalle</strong> sur lequel les coefficients sont continus ; pour \(t\,y' - y = 0\), il faut travailler séparément sur \(]-\infty, 0[\) et sur \(]0, +\infty[\), car le coefficient de \(y'\) s'annule en 0.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · PREMIER ORDRE : L'ÉQUATION HOMOGÈNE</div>
  <h2>Une seule exponentielle, à une constante près</h2>
  <div class="intro">L'équation homogène \(y' + a(t)\,y = 0\) dit que la vitesse de variation de \(y\) est proportionnelle à \(y\) : c'est la décharge d'un condensateur, la décroissance radioactive, le refroidissement d'un corps. Sa résolution ne demande qu'une primitive de \(a\).</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(a : I \to \mathbb K\) continue et \(A\) une primitive de \(a\) sur \(I\). Les solutions sur \(I\) de \(y' + a(t)\,y = 0\) sont les fonctions
    <div class="formula" data-nom="Solutions de y′ + a(t) y = 0">$$y(t) = K\,\mathrm{e}^{-A(t)}, \qquad K \in \mathbb K .$$</div>
    Si \(a\) est constante, ce sont les \(t \mapsto K\,\mathrm{e}^{-at}\). L'ensemble des solutions est une <strong>droite vectorielle</strong> ; une solution non nulle ne s'annule en aucun point de \(I\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Multiplier par \(\mathrm{e}^{A(t)}\) fait apparaître une dérivée de produit.</span>
    <div class="content">
      <p>Soit \(y : I \to \mathbb K\) dérivable, et \(z(t) = y(t)\,\mathrm{e}^{A(t)}\). Comme \(A' = a\) (et \((\mathrm{e}^{A})' = a\,\mathrm{e}^{A}\), y compris si \(a\) est complexe),</p>
      <div class="formula">$$z'(t) = \big(y'(t) + a(t)\,y(t)\big)\,\mathrm{e}^{A(t)} .$$</div>
      <p>Donc \(y\) est solution si et seulement si \(z' = 0\) sur l'intervalle \(I\), c'est-à-dire si \(z\) est constante (pour une fonction complexe, ses parties réelle et imaginaire sont constantes), égale à un certain \(K\) : \(y = K\,\mathrm{e}^{-A}\). Comme \(\mathrm{e}^{-A(t)} \neq 0\), une telle solution ne s'annule que si \(K = 0\), et alors partout.</p>
    </div>
  </div>
  <p><strong>Le cas constant en physique.</strong> L'équation \(\tau\,y' + y = 0\) (\(\tau \gt 0\)) a pour solutions \(K\,\mathrm{e}^{-t/\tau}\). La <strong>constante de temps</strong> \(\tau\) fixe l'échelle : \(y\) est divisée par \(\mathrm{e}\) (il en reste 37 %) en un temps \(\tau\), il en reste 5 % au bout de \(3\tau\) et 1 % au bout de \(4{,}6\,\tau\). La demi-vie, temps de division par 2, vaut \(\tau\ln 2\).</p>

  <div class="method-box">
    <strong>Exemple — trois équations homogènes</strong>
    <ol>
      <li>\(y' + 2t\,y = 0\) sur \(\mathbb R\) : une primitive de \(2t\) est \(t^2\), donc \(y(t) = K\,\mathrm{e}^{-t^2}\). La solution qui vaut 3 en 0 est \(3\,\mathrm{e}^{-t^2}\), une courbe en cloche.</li>
      <li>\((1 + t^2)\,y' - 2t\,y = 0\) sur \(\mathbb R\) : forme résolue \(y' - \frac{2t}{1 + t^2}\,y = 0\) ; une primitive de \(a(t) = -\frac{2t}{1 + t^2}\) est \(A(t) = -\ln(1 + t^2)\), donc \(y(t) = K\,\mathrm{e}^{\ln(1 + t^2)} = K\,(1 + t^2)\).</li>
      <li>\(y' - i\omega\,y = 0\) (\(\omega\) réel), à valeurs complexes : \(y(t) = K\,\mathrm{e}^{i\omega t}\), \(K \in \mathbb C\). Le point \(y(t)\) tourne sur un cercle à la vitesse angulaire \(\omega\) : c'est la représentation complexe d'une grandeur sinusoïdale.</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : se tromper de signe, \(K\,\mathrm{e}^{+at}\) pour \(y' + a\,y = 0\) (contrôle : dériver) ; ou écrire \(K\,\mathrm{e}^{-a(t)\,t}\) quand \(a\) dépend de \(t\), au lieu de \(K\,\mathrm{e}^{-A(t)}\) avec \(A\) primitive de \(a\). Pour \(y' + 2t\,y = 0\), \(\mathrm{e}^{-2t^2}\) n'est pas solution.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · STRUCTURE DES SOLUTIONS ET PRINCIPE DE SUPERPOSITION</div>
  <h2>Une solution particulière plus les solutions homogènes</h2>
  <div class="intro">Grâce à la linéarité, il suffit de trouver <em>une</em> solution de l'équation complète : toutes les autres s'en déduisent en ajoutant les solutions de l'équation homogène. Et un second membre compliqué se découpe en morceaux simples. Ces deux résultats valent pour l'ordre 1 comme pour l'ordre 2.</div>

  <div class="prop-box">
    <strong>Structure.</strong> Soit \(L\) l'une des applications linéaires \(y \mapsto y' + a(t)\,y\) ou \(y \mapsto y'' + a\,y' + b\,y\), et \(y_p\) une solution particulière de \(L(y) = f\). Les solutions de \(L(y) = f\) sont exactement les fonctions
    <div class="formula" data-nom="Solution générale = particulière + homogène">$$y = y_p + y_h, \qquad y_h \text{ solution de l'équation homogène } L(y_h) = 0 .$$</div>
    <strong>Principe de superposition.</strong> Si \(L(y_1) = f_1\) et \(L(y_2) = f_2\), alors \(L(\lambda y_1 + \mu y_2) = \lambda f_1 + \mu f_2\) pour tous \(\lambda\), \(\mu\) dans \(\mathbb K\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout vient de la linéarité de \(L\).</span>
    <div class="content">
      <p>La superposition est la linéarité de \(L\). Pour la structure, puisque \(L(y_p) = f\) :</p>
      <div class="formula">$$L(y) = f \iff L(y) = L(y_p) \iff L(y - y_p) = 0 ,$$</div>
      <p>c'est-à-dire : \(y - y_p\) est solution de l'équation homogène. L'ensemble des solutions est donc le translaté de l'ensemble des solutions homogènes par \(y_p\) : une droite affine à l'ordre 1, un plan affine à l'ordre 2 (on dit aussi un sous-espace affine).</p>
    </div>
  </div>
  <p><strong>Passer par les complexes.</strong> Si les coefficients sont <strong>réels</strong> et si \(z\) est une solution complexe de \(L(z) = g\), alors \(L(\operatorname{Re} z) = \operatorname{Re} g\) et \(L(\operatorname{Im} z) = \operatorname{Im} g\), car dériver et multiplier par un réel commutent avec la partie réelle. Pour un second membre \(B\cos(\omega t) = \operatorname{Re}\big(B\,\mathrm{e}^{i\omega t}\big)\), on résout donc avec \(B\,\mathrm{e}^{i\omega t}\), plus simple, et l'on prend la partie réelle (§4, §8).</p>

  <div class="method-box">
    <strong>Exemple — découper le second membre</strong>
    <ol>
      <li>Résoudre \(y' + 2y = 3 + \mathrm{e}^{-t}\) sur \(\mathbb R\). Homogène : \(K\,\mathrm{e}^{-2t}\).</li>
      <li>Pour le morceau \(3\), une constante \(c\) convient si \(2c = 3\) : \(y_1 = \frac32\). Pour le morceau \(\mathrm{e}^{-t}\), on essaie \(y_2 = \gamma\,\mathrm{e}^{-t}\) : \(-\gamma\,\mathrm{e}^{-t} + 2\gamma\,\mathrm{e}^{-t} = \mathrm{e}^{-t}\) donne \(\gamma = 1\).</li>
      <li>Par superposition, \(y_p = \frac32 + \mathrm{e}^{-t}\), et les solutions sont \(y(t) = \frac32 + \mathrm{e}^{-t} + K\,\mathrm{e}^{-2t}\), \(K \in \mathbb R\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire que la somme de deux solutions de \((E)\) est encore solution de \((E)\). Elle est solution de l'équation de second membre \(2b\). C'est la <strong>différence</strong> de deux solutions de \((E)\) qui est solution de l'équation homogène.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PREMIER ORDRE : SOLUTION PARTICULIÈRE</div>
  <h2>La variation de la constante, et les seconds membres usuels</h2>
  <div class="intro">Reste à trouver une solution particulière de \(y' + a(t)\,y = b(t)\). La variation de la constante marche toujours : elle ramène le problème à un calcul de primitive. Quand \(a\) est constante et que le second membre est simple (constant, polynôme, exponentielle, sinusoïde), on gagne du temps en cherchant directement une solution de même forme.</div>

  <div class="prop-box">
    <strong>Méthode de la variation de la constante.</strong> Soit \(A\) une primitive de \(a\) sur \(I\). On cherche une solution sous la forme \(y(t) = K(t)\,\mathrm{e}^{-A(t)}\), avec \(K\) dérivable. En reportant, les termes en \(K(t)\) se simplifient et il reste
    <div class="formula" data-nom="Variation de la constante (ordre 1)">$$K'(t)\,\mathrm{e}^{-A(t)} = b(t), \qquad\text{soit}\qquad K'(t) = b(t)\,\mathrm{e}^{A(t)} .$$</div>
    Toute primitive \(K\) de \(b\,\mathrm{e}^{A}\) donne une solution particulière ; avec toutes les primitives, on obtient toutes les solutions : \(y(t) = \mathrm{e}^{-A(t)}\Big(\displaystyle\int^t b(s)\,\mathrm{e}^{A(s)}\,\mathrm{d}s\Big)\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le calcul qui fait disparaître \(K(t)\).</span>
    <div class="content">
      <p>Si \(y = K\,\mathrm{e}^{-A}\), alors \(y' = K'\,\mathrm{e}^{-A} - a\,K\,\mathrm{e}^{-A}\), donc \(y' + a\,y = K'\,\mathrm{e}^{-A}\). Ainsi \(y\) est solution si et seulement si \(K' = b\,\mathrm{e}^{A}\). Toute fonction \(y\) peut s'écrire \(K\,\mathrm{e}^{-A}\) (avec \(K = y\,\mathrm{e}^{A}\)) : la méthode ne perd aucune solution. Comme \(b\,\mathrm{e}^{A}\) est continue, elle a des primitives (chapitre « Primitives », §2).</p>
    </div>
  </div>

  <p><strong>Seconds membres usuels quand \(a\) est une constante.</strong> On cherche \(y_p\) de la forme du second membre :</p>
  <ul>
    <li>\(b\) constant, \(a \neq 0\) : la constante \(y_p = \frac{b}{a}\) ; \(b\) polynôme de degré \(n\), \(a \neq 0\) : un polynôme de degré \(n\) ;</li>
    <li>\(b(t) = B\,\mathrm{e}^{\lambda t}\) (\(B\), \(\lambda\) complexes) : \(y_p = \dfrac{B}{\lambda + a}\,\mathrm{e}^{\lambda t}\) si \(\lambda \neq -a\) ; si \(\lambda = -a\) (le second membre est solution de l'équation homogène), \(y_p = B\,t\,\mathrm{e}^{-at}\) ;</li>
    <li>\(b(t) = B\cos(\omega t)\) ou \(B\sin(\omega t)\), \(a\) réel : partie réelle ou imaginaire de la solution \(\dfrac{B}{a + i\omega}\,\mathrm{e}^{i\omega t}\) obtenue pour \(B\,\mathrm{e}^{i\omega t}\) (§3).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — deux variations de la constante</strong>
    <ol>
      <li>\((1 + t^2)\,y' + 2t\,y = 1\) sur \(\mathbb R\). Forme résolue : \(a(t) = \frac{2t}{1 + t^2}\), \(A(t) = \ln(1 + t^2)\), solutions homogènes \(\frac{K}{1 + t^2}\). On pose \(y = \frac{K(t)}{1 + t^2}\) : \(K'(t) = \frac{1}{1 + t^2}\,\mathrm{e}^{\ln(1 + t^2)} = 1\), donc \(K(t) = t + K\). Solutions : \(y(t) = \dfrac{t + K}{1 + t^2}\). On pouvait le voir directement : le membre de gauche est la dérivée de \((1 + t^2)\,y\).</li>
      <li>\(y' - 2y = \dfrac{\mathrm{e}^{2t}}{1 + t^2}\) sur \(\mathbb R\). Homogène : \(K\,\mathrm{e}^{2t}\). Avec \(y = K(t)\,\mathrm{e}^{2t}\) : \(K'(t) = \frac{1}{1 + t^2}\), \(K(t) = \arctan t + K\). Solutions : \(y(t) = (\arctan t + K)\,\mathrm{e}^{2t}\). Aucune « forme du second membre » n'aurait permis de deviner ce résultat.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — la maison qui suit la température extérieure</strong>
    <ol>
      <li>La température intérieure \(\theta\) d'une maison non chauffée suit la loi de Newton \(\tau\,\theta' + \theta = \theta_e(t)\), où \(\theta_e(t) = \theta_0 + \Theta\cos(\omega t)\) est la température extérieure, qui oscille sur 24 h (\(\omega = \frac{2\pi}{24}\ \text{h}^{-1}\)), et \(\tau = 4\ \text{h}\) traduit l'inertie thermique.</li>
      <li>Superposition : la constante \(\theta_0\) est solution pour le second membre \(\theta_0\). Pour \(\Theta\cos(\omega t) = \operatorname{Re}\big(\Theta\,\mathrm{e}^{i\omega t}\big)\), on cherche \(z = c\,\mathrm{e}^{i\omega t}\) : \(\tau\,i\omega\,c + c = \Theta\), donc \(c = \dfrac{\Theta}{1 + i\omega\tau}\).</li>
      <li>Avec \(1 + i\omega\tau = \sqrt{1 + \omega^2\tau^2}\,\mathrm{e}^{i\varphi}\), \(\varphi = \arctan(\omega\tau)\), la partie réelle donne la solution particulière
      <div class="formula">$$\theta_p(t) = \theta_0 + \frac{\Theta}{\sqrt{1 + \omega^2\tau^2}}\cos(\omega t - \varphi) .$$</div></li>
      <li>Ici \(\omega\tau = \frac\pi3 \approx 1{,}05\) : l'amplitude est multipliée par \(0{,}69\) (pour \(\Theta = 5\ \text{°C}\), \(3{,}5\ \text{°C}\) à l'intérieur), et le retard vaut \(\varphi = 46°\), soit \(3{,}1\ \text{h}\). Les solutions sont \(\theta_p + K\,\mathrm{e}^{-t/\tau}\) : au bout de quelques \(\tau\), la maison oublie sa température initiale et suit \(\theta_p\) (§10).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : chercher \(y_p = \gamma\,\mathrm{e}^{-3t}\) pour \(y' + 3y = \mathrm{e}^{-3t}\). Ce candidat est solution de l'équation homogène : on obtiendrait \(0 = \mathrm{e}^{-3t}\). Il faut \(y_p = \gamma\,t\,\mathrm{e}^{-3t}\), et l'on trouve \(\gamma = 1\) ; la variation de la constante le donne d'ailleurs directement (\(K' = 1\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · PROBLÈME DE CAUCHY À L'ORDRE 1</div>
  <h2>Une condition initiale, une seule solution</h2>
  <div class="intro">Connaître l'état initial d'un système du premier ordre (la tension aux bornes d'un condensateur, la température d'un corps) suffit à prévoir toute son évolution. C'est le théorème d'existence et d'unicité, qui découle ici directement de la résolution explicite.</div>

  <div class="prop-box">
    <strong>Théorème (problème de Cauchy).</strong> Soit \(a, b : I \to \mathbb K\) continues, \(t_0 \in I\) et \(y_0 \in \mathbb K\). Il existe une <strong>unique</strong> solution \(y\) de \(y' + a(t)\,y = b(t)\) sur \(I\) telle que \(y(t_0) = y_0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une seule valeur de la constante convient.</span>
    <div class="content">
      <p>Par les §2 à §4, les solutions sont les \(y = y_p + K\,\mathrm{e}^{-A}\), \(K \in \mathbb K\). La condition \(y(t_0) = y_0\) s'écrit \(K\,\mathrm{e}^{-A(t_0)} = y_0 - y_p(t_0)\) ; comme \(\mathrm{e}^{-A(t_0)} \neq 0\), elle détermine un unique \(K\).</p>
    </div>
  </div>

<figcaption>Solutions de y′ + y = t : y(t) = t − 1 + K e^(−t), une pour chaque valeur de y(0) = K − 1 (en pointillés, y(0) = −1,5 ; −0,5 ; 0,5 ; 2,5 ; 3,5). Par chaque point passe une seule courbe (problème de Cauchy) : deux solutions ne se croisent jamais. La solution particulière t − 1 (en vert) est le régime permanent : le terme K e^(−t) s'efface et toutes les solutions oublient leur condition initiale. En rouge, celle qui vérifie y(0) = 1,5.</figcaption>
</figure>

  <div class="method-box">
    <strong>Exemple — la charge d'un condensateur</strong>
    <ol>
      <li>Un condensateur déchargé est relié à \(t = 0\) à un générateur de tension \(E = 5\ \text{V}\) à travers une résistance ; la tension \(u\) à ses bornes vérifie \(\tau\,u' + u = E\), avec \(\tau = RC = 1\ \text{ms}\), et \(u(0) = 0\) (chapitre « Circuit linéaire du premier ordre », §3).</li>
      <li>Solutions : \(u(t) = E + K\,\mathrm{e}^{-t/\tau}\) (la constante \(E\) est solution particulière). La condition initiale donne \(K = -E\) : \(u(t) = E\big(1 - \mathrm{e}^{-t/\tau}\big)\).</li>
      <li>À \(t = \tau\), \(u = E(1 - \mathrm{e}^{-1}) \approx 3{,}16\ \text{V}\) (63 % de \(E\)) ; \(u\) atteint 99 % de \(E\) à \(t = \tau\ln 100 \approx 4{,}6\ \text{ms}\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : oublier que le théorème suppose l'équation <strong>résolue</strong> (coefficient 1 devant \(y'\)) sur tout l'intervalle. Pour \(t\,y' - y = 0\), les solutions sur \(]0, +\infty[\) sont les \(K\,t\) ; aucune ne vérifie \(y(0) = 1\) si l'on cherche une solution sur \(\mathbb R\), et toutes vérifient \(y(0) = 0\) : en \(t = 0\), où le coefficient de \(y'\) s'annule, ni l'existence ni l'unicité ne sont garanties (étude reprise en 2ᵉ année).</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · SECOND ORDRE À COEFFICIENTS CONSTANTS : SOLUTIONS COMPLEXES</div>
  <h2>L'équation caractéristique</h2>
  <div class="intro">Pour \(y'' + a\,y' + b\,y = 0\) avec \(a\), \(b\) constants, on cherche des solutions exponentielles \(\mathrm{e}^{rt}\) : leurs dérivées sont proportionnelles à elles-mêmes, et l'équation différentielle devient une équation du second degré en \(r\). On commence par les solutions à valeurs complexes, le cas le plus simple ; les solutions réelles s'en déduisent au §7.</div>

  <div class="def-box">
    Pour \(a\), \(b\) dans \(\mathbb K\), l'<strong>équation caractéristique</strong> de \(y'' + a\,y' + b\,y = 0\) est
    <div class="formula" data-nom="Équation caractéristique">$$r^2 + a\,r + b = 0 .$$</div>
    Elle vient du calcul, valable pour tout \(r \in \mathbb C\) : \(\big(\mathrm{e}^{rt}\big)'' + a\big(\mathrm{e}^{rt}\big)' + b\,\mathrm{e}^{rt} = (r^2 + a\,r + b)\,\mathrm{e}^{rt}\). Ainsi \(t \mapsto \mathrm{e}^{rt}\) est solution si et seulement si \(r\) est racine de l'équation caractéristique.
  </div>

  <div class="prop-box">
    <strong>Théorème (solutions complexes).</strong> Soit \(a, b \in \mathbb C\). Les solutions \(y : \mathbb R \to \mathbb C\) de \(y'' + a\,y' + b\,y = 0\) sont :
    <ul>
      <li>si l'équation caractéristique a deux racines distinctes \(r_1\), \(r_2\) : \(y(t) = \lambda\,\mathrm{e}^{r_1 t} + \mu\,\mathrm{e}^{r_2 t}\), \((\lambda, \mu) \in \mathbb C^2\) ;</li>
      <li>si elle a une racine double \(r_0 = -\frac a2\) : \(y(t) = (\lambda + \mu\,t)\,\mathrm{e}^{r_0 t}\), \((\lambda, \mu) \in \mathbb C^2\).</li>
    </ul>
    L'ensemble des solutions est un <strong>plan vectoriel</strong> : deux constantes à fixer.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">On se ramène au premier ordre en posant \(y = z\,\mathrm{e}^{r_1 t}\).</span>
    <div class="content">
      <p>Soit \(r_1\) une racine, et \(y = z\,\mathrm{e}^{r_1 t}\) (toute fonction s'écrit ainsi, avec \(z = y\,\mathrm{e}^{-r_1 t}\)). On calcule \(y' = (z' + r_1 z)\,\mathrm{e}^{r_1 t}\) et \(y'' = (z'' + 2r_1 z' + r_1^2 z)\,\mathrm{e}^{r_1 t}\), d'où, puisque \(r_1^2 + a r_1 + b = 0\) :</p>
      <div class="formula">$$y'' + a\,y' + b\,y = \big(z'' + (2r_1 + a)\,z'\big)\,\mathrm{e}^{r_1 t} .$$</div>
      <p>Donc \(y\) est solution si et seulement si \(w = z'\) vérifie l'équation du premier ordre \(w' + (2r_1 + a)\,w = 0\), soit \(w = c\,\mathrm{e}^{-(2r_1 + a)t}\) (§2). Or \(r_1 + r_2 = -a\) (somme des racines), donc \(-(2r_1 + a) = r_2 - r_1\).</p>
      <p>Si \(r_1 \neq r_2\) : \(z' = c\,\mathrm{e}^{(r_2 - r_1)t}\) donne \(z = \frac{c}{r_2 - r_1}\,\mathrm{e}^{(r_2 - r_1)t} + d\), et \(y = d\,\mathrm{e}^{r_1 t} + \frac{c}{r_2 - r_1}\,\mathrm{e}^{r_2 t}\). Si \(r_1 = r_2\) : \(z' = c\), \(z = ct + d\), et \(y = (d + ct)\,\mathrm{e}^{r_1 t}\). Les constantes \(c\), \(d\) étant quelconques, on obtient exactement les formes annoncées.</p>
    </div>
  </div>

  <div class="method-box">
    <strong>Exemple — des coefficients complexes, puis réels</strong>
    <ol>
      <li>\(z'' + i\,z' + 2z = 0\) : \(r^2 + i r + 2 = 0\) a pour discriminant \(i^2 - 8 = -9 = (3i)^2\), et pour racines \(r = \frac{-i \pm 3i}{2}\), soit \(i\) et \(-2i\). Solutions : \(z(t) = \lambda\,\mathrm{e}^{it} + \mu\,\mathrm{e}^{-2it}\), \((\lambda, \mu) \in \mathbb C^2\).</li>
      <li>\(y'' + 4y = 0\) : racines \(\pm 2i\), solutions complexes \(\lambda\,\mathrm{e}^{2it} + \mu\,\mathrm{e}^{-2it}\). Pour \(\lambda = \mu = \frac12\), on obtient \(\cos(2t)\) ; pour \(\lambda = -\mu = \frac{1}{2i}\), \(\sin(2t)\). Les solutions réelles sont les combinaisons réelles de ces deux-là (§7).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : en cas de racine double, écrire \(\lambda\,\mathrm{e}^{r_0 t} + \mu\,\mathrm{e}^{r_0 t}\) : ce n'est que \((\lambda + \mu)\,\mathrm{e}^{r_0 t}\), une seule constante. Il manque la solution \(t\,\mathrm{e}^{r_0 t}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · SECOND ORDRE : SOLUTIONS RÉELLES</div>
  <h2>Trois régimes selon le signe du discriminant</h2>
  <div class="intro">Quand \(a\) et \(b\) sont réels, ce qui est le cas en physique, on veut les solutions réelles. Le signe du discriminant \(\Delta = a^2 - 4b\) décide de leur allure : somme de deux exponentielles, régime critique, ou oscillations dans une enveloppe exponentielle.</div>

  <div class="prop-box">
    <strong>Théorème (solutions réelles).</strong> Soit \(a, b \in \mathbb R\) et \(\Delta = a^2 - 4b\). Les solutions réelles de \(y'' + a\,y' + b\,y = 0\) sont, avec \((\lambda, \mu) \in \mathbb R^2\) :
    <ul>
      <li>\(\Delta \gt 0\), deux racines réelles \(r_1 \neq r_2\) : \(y(t) = \lambda\,\mathrm{e}^{r_1 t} + \mu\,\mathrm{e}^{r_2 t}\) ;</li>
      <li>\(\Delta = 0\), racine double \(r_0 = -\frac a2\) : \(y(t) = (\lambda + \mu\,t)\,\mathrm{e}^{r_0 t}\) ;</li>
      <li>\(\Delta \lt 0\), racines \(\alpha \pm i\beta\) avec \(\alpha = -\frac a2\), \(\beta = \frac{\sqrt{-\Delta}}{2} \gt 0\) :</li>
    </ul>
    <div class="formula" data-nom="Solutions réelles, Δ négatif">$$y(t) = \mathrm{e}^{\alpha t}\big(\lambda\cos(\beta t) + \mu\sin(\beta t)\big) = C\,\mathrm{e}^{\alpha t}\cos(\beta t - \varphi) .$$</div>
    Dans la seconde écriture, \(C = \sqrt{\lambda^2 + \mu^2}\) est l'amplitude initiale et \(\varphi\) une phase telle que \(\cos\varphi = \frac{\lambda}{C}\), \(\sin\varphi = \frac{\mu}{C}\) (si \(C \neq 0\)).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Une solution réelle est la partie réelle d'une solution complexe.</span>
    <div class="content">
      <p>Les cas \(\Delta \ge 0\) se lisent dans le §6 : une solution réelle est une solution complexe à valeurs réelles, et en évaluant \(y\) et \(y'\) en 0 on voit que \(\lambda\) et \(\mu\) sont alors réels. Pour \(\Delta \lt 0\) : si \(y\) est une solution réelle, c'est une solution complexe, \(y = c_1\,\mathrm{e}^{(\alpha + i\beta)t} + c_2\,\mathrm{e}^{(\alpha - i\beta)t}\), et \(y = \operatorname{Re} y\) (§3, coefficients réels). Or, pour tout complexe \(c\),</p>
      <div class="formula">$$\operatorname{Re}\big(c\,\mathrm{e}^{(\alpha + i\beta)t}\big) = \mathrm{e}^{\alpha t}\big(\operatorname{Re}(c)\cos\beta t - \operatorname{Im}(c)\sin\beta t\big) ,$$</div>
      <p>et de même pour \(\mathrm{e}^{(\alpha - i\beta)t}\) : on obtient bien une combinaison réelle de \(\mathrm{e}^{\alpha t}\cos\beta t\) et \(\mathrm{e}^{\alpha t}\sin\beta t\). Réciproquement, ces deux fonctions, parties réelle et imaginaire de la solution \(\mathrm{e}^{(\alpha + i\beta)t}\), sont des solutions réelles. Enfin, avec \(\lambda = C\cos\varphi\) et \(\mu = C\sin\varphi\) :</p>
      <div class="formula">$$\lambda\cos x + \mu\sin x = C(\cos\varphi\cos x + \sin\varphi\sin x) = C\cos(x - \varphi) .$$</div>
    </div>
  </div>

<figcaption>Solutions de y″ + a y′ + y = 0 telles que y(0) = 1 et y′(0) = 0. Pour a = 0,4, Δ = a² − 4 &lt; 0 : régime pseudo-périodique, oscillations de pseudo-pulsation β = √(1 − a²/4) ≈ 0,98 dans l'enveloppe ±1,02 e^(−t/5) (pointillés). Pour a = 2, Δ = 0 : régime critique, (1 + t) e^(−t), retour le plus rapide sans dépasser 0. Pour a = 5, Δ &gt; 0 : régime apériodique, somme de deux exponentielles décroissantes, retour lent dominé par e^(−0,21 t).</figcaption>
</figure>

  <p><strong>Correspondance avec la physique et les sciences de l'ingénieur.</strong> Un oscillateur amorti (masse-ressort avec frottement fluide, circuit RLC) obéit à une équation de ce type, que la physique écrit sous forme canonique \(\ddot x + \frac{\omega_0}{Q}\,\dot x + \omega_0^2\,x = 0\) : la pulsation propre \(\omega_0\) et le facteur de qualité \(Q\) correspondent à \(b = \omega_0^2\) et \(a = \frac{\omega_0}{Q}\). Alors \(\Delta = \omega_0^2\left(\frac{1}{Q^2} - 4\right)\) : régime pseudo-périodique si \(Q \gt \frac12\), critique si \(Q = \frac12\), apériodique si \(Q \lt \frac12\) (chapitre « Oscillateurs harmoniques », §5 et §6). Les sciences de l'ingénieur écrivent \(a = 2\xi\omega_0\), avec le coefficient d'amortissement \(\xi = \frac{1}{2Q}\) (chapitre « Systèmes du 2e ordre ») ; la limite devient \(\xi = 1\). Dans ce chapitre de mathématiques, on garde \(a\) et \(b\).</p>

  <div class="method-box">
    <strong>Exemple — une masse au bout d'un ressort</strong>
    <ol>
      <li>Une masse \(m = 0{,}5\ \text{kg}\), un ressort de raideur \(k = 50\ \text{N/m}\), un frottement fluide de coefficient \(h = 1\ \text{kg/s}\) (noté \(\alpha\) dans le chapitre « Oscillateurs harmoniques ») : \(m\,x'' + h\,x' + k\,x = 0\), soit \(x'' + 2x' + 100x = 0\).</li>
      <li>\(\Delta = 4 - 400 \lt 0\) ; racines \(-1 \pm i\sqrt{99}\), avec \(\sqrt{99} \approx 9{,}95\). Solutions : \(x(t) = \mathrm{e}^{-t}\big(\lambda\cos(9{,}95\,t) + \mu\sin(9{,}95\,t)\big)\).</li>
      <li>Pseudo-période \(T = \frac{2\pi}{\sqrt{99}} \approx 0{,}63\ \text{s}\) ; à chaque pseudo-période, l'amplitude est divisée par \(\mathrm{e}^{0{,}63} \approx 1{,}9\). En notations de physique : \(\omega_0 = 10\ \text{rad/s}\), \(Q = \frac{\omega_0}{a} = 5\).</li>
      <li>Autre exemple, à racines réelles : \(y'' - y' - 2y = 0\), \(r^2 - r - 2 = (r - 2)(r + 1)\), solutions \(\lambda\,\mathrm{e}^{2t} + \mu\,\mathrm{e}^{-t}\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : pour \(\Delta \lt 0\), écrire des solutions réelles en \(\mathrm{e}^{(\alpha \pm i\beta)t}\) avec des constantes réelles (elles ne sont pas réelles), ou confondre la pseudo-pulsation \(\beta\) avec \(\sqrt{b}\) : \(\beta = \sqrt{b - \frac{a^2}{4}}\), un peu plus petite.</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · SECOND ORDRE : SOLUTION PARTICULIÈRE</div>
  <h2>Polynôme, exponentielle, sinusoïde</h2>
  <div class="intro">Pour \(y'' + a\,y' + b\,y = f(t)\), le programme demande de savoir trouver une solution particulière dans trois cas : \(f\) polynôme, \(f(t) = A\,\mathrm{e}^{\lambda t}\), \(f(t) = B\cos(\omega t)\) ou \(B\sin(\omega t)\). Dans chaque cas, on cherche une solution « de la même forme », et l'on corrige quand le second membre résonne avec l'équation homogène. Les sommes de tels seconds membres se traitent par superposition (§3).</div>

  <div class="prop-box">
    <strong>Second membre polynôme</strong> \(P\) de degré \(n\) : si \(b \neq 0\), il existe une solution polynomiale de degré \(n\) ; si \(b = 0\) et \(a \neq 0\), une solution \(t\,Q(t)\) avec \(\deg Q = n\) ; si \(a = b = 0\), on primitive deux fois. On identifie les coefficients.
  </div>
  <div class="prop-box">
    <strong>Second membre \(A\,\mathrm{e}^{\lambda t}\)</strong> (\(A\), \(\lambda\) complexes). On cherche \(y_p = C\,\mathrm{e}^{\lambda t}\), \(C\,t\,\mathrm{e}^{\lambda t}\) ou \(C\,t^2\,\mathrm{e}^{\lambda t}\) selon que \(\lambda\) n'est pas racine, est racine simple ou racine double de l'équation caractéristique. On trouve :
    <div class="formula" data-nom="Solution particulière pour A exp(λt)">$$y_p = \frac{A}{\lambda^2 + a\lambda + b}\,\mathrm{e}^{\lambda t}, \qquad y_p = \frac{A}{2\lambda + a}\,t\,\mathrm{e}^{\lambda t}, \qquad y_p = \frac A2\,t^2\,\mathrm{e}^{\lambda t} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Justification</span>
    <span class="prompt">Dériver \(t^k\,\mathrm{e}^{\lambda t}\) fait apparaître les dérivées du polynôme caractéristique.</span>
    <div class="content">
      <p>Notons \(\chi(r) = r^2 + a r + b\). Le calcul du §6 donne \(L(\mathrm{e}^{\lambda t}) = \chi(\lambda)\,\mathrm{e}^{\lambda t}\). De même, en dérivant :</p>
      <div class="formula">$$L\big(t\,\mathrm{e}^{\lambda t}\big) = \big(\chi(\lambda)\,t + \chi'(\lambda)\big)\,\mathrm{e}^{\lambda t}, \qquad L\big(t^2\,\mathrm{e}^{\lambda t}\big) = \big(\chi(\lambda)\,t^2 + 2\chi'(\lambda)\,t + 2\big)\,\mathrm{e}^{\lambda t} ,$$</div>
      <p>avec \(\chi'(\lambda) = 2\lambda + a\). Si \(\chi(\lambda) \neq 0\), \(C = \frac{A}{\chi(\lambda)}\). Si \(\lambda\) est racine simple, \(\chi(\lambda) = 0 \neq \chi'(\lambda)\), et \(C = \frac{A}{\chi'(\lambda)}\). Si \(\lambda\) est racine double, \(\chi(\lambda) = \chi'(\lambda) = 0\), et \(2C = A\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Second membre \(B\cos(\omega t)\) ou \(B\sin(\omega t)\)</strong> (\(B\), \(\omega\) réels, \(\omega \gt 0\), \(a\), \(b\) réels). On résout avec \(B\,\mathrm{e}^{i\omega t}\), puis on prend la partie réelle (pour le cosinus) ou imaginaire (pour le sinus). Si \(i\omega\) n'est pas racine :
    <div class="formula" data-nom="Régime sinusoïdal forcé">$$y_p = \operatorname{Re}\left(\frac{B\,\mathrm{e}^{i\omega t}}{b - \omega^2 + i\,a\,\omega}\right), \qquad\text{d'amplitude}\qquad \frac{|B|}{\sqrt{(b - \omega^2)^2 + a^2\omega^2}} .$$</div>
    Si \(i\omega\) est racine (\(a = 0\) et \(b = \omega^2\)), c'est la <strong>résonance</strong> : \(y_p = \dfrac{B}{2\omega}\,t\sin(\omega t)\) pour \(B\cos(\omega t)\). On peut aussi chercher directement \(y_p = \gamma\cos(\omega t) + \delta\sin(\omega t)\) (multipliée par \(t\) en cas de résonance).
  </div>

  <div class="method-box">
    <strong>Exemple — un second membre de chaque sorte</strong>
    <ol>
      <li>\(y'' + 3y' + 2y = 4t + 2\) : \(b \neq 0\), on cherche \(y_p = \gamma t + \delta\). Il vient \(3\gamma + 2\gamma t + 2\delta = 4t + 2\), d'où \(\gamma = 2\) et \(\delta = -2\) : \(y_p = 2t - 2\).</li>
      <li>\(y'' - 4y = \mathrm{e}^{2t}\) : \(r^2 - 4 = (r - 2)(r + 2)\), et 2 est racine simple. Formule : \(y_p = \frac{1}{2 \times 2 + 0}\,t\,\mathrm{e}^{2t} = \frac14\,t\,\mathrm{e}^{2t}\).</li>
      <li>\(y'' + 2y' + 5y = 10\cos t\) : \(i\) n'est pas racine (les racines sont \(-1 \pm 2i\)). Avec \(\omega = 1\) : \(\frac{10}{5 - 1 + 2i} = \frac{10}{4 + 2i} = \frac{10(4 - 2i)}{20} = 2 - i\), et \(y_p = \operatorname{Re}\big((2 - i)(\cos t + i\sin t)\big) = 2\cos t + \sin t\). Amplitude \(\sqrt5\).</li>
      <li>\(y'' + 4y = \cos(2t)\) : \(2i\) est racine, résonance ; \(y_p = \frac14\,t\sin(2t)\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§9 · PROBLÈME DE CAUCHY À L'ORDRE 2</div>
  <h2>Position et vitesse initiales</h2>
  <div class="intro">Pour un système du second ordre, la position initiale ne suffit pas à prévoir le mouvement : il faut aussi la vitesse initiale. Deux conditions fixent les deux constantes de la solution générale.</div>

  <div class="prop-box">
    <strong>Théorème (problème de Cauchy, admis).</strong> Soit \(a, b \in \mathbb K\), \(f : I \to \mathbb K\) continue, \(t_0 \in I\) et \((y_0, y_1) \in \mathbb K^2\). Il existe une unique solution \(y\) de \(y'' + a\,y' + b\,y = f(t)\) sur \(I\) telle que
    <div class="formula">$$y(t_0) = y_0 \qquad\text{et}\qquad y'(t_0) = y_1 .$$</div>
    La démonstration est hors programme (elle sera vue en 2ᵉ année, dans un cadre plus général).
  </div>

  <div class="method-box">
    <strong>Méthode — résoudre un problème de Cauchy</strong>
    <ol>
      <li>Écrire la solution générale complète : \(y = y_p + \lambda\,y_1 + \mu\,y_2\), où \((y_1, y_2)\) sont les deux solutions homogènes de base.</li>
      <li>Dériver cette expression <strong>complète</strong>, \(y_p\) compris.</li>
      <li>Écrire \(y(t_0) = y_0\) et \(y'(t_0) = y_1\) : un système de deux équations en \((\lambda, \mu)\), qui a une unique solution.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — réponse à un échelon, et dépassement</strong>
    <ol>
      <li>\(y'' + 2y' + 5y = 5\), \(y(0) = 0\), \(y'(0) = 0\) : un système au repos auquel on impose une consigne constante. Solution particulière constante : \(y_p = 1\). Racines \(-1 \pm 2i\).</li>
      <li>\(y(t) = 1 + \mathrm{e}^{-t}\big(\lambda\cos(2t) + \mu\sin(2t)\big)\) ; \(y(0) = 1 + \lambda = 0\) donne \(\lambda = -1\). Puis \(y'(0) = -\lambda + 2\mu = 0\) donne \(\mu = -\frac12\).</li>
      <li>\(y(t) = 1 - \mathrm{e}^{-t}\big(\cos(2t) + \frac12\sin(2t)\big)\), et l'on vérifie que \(y'(t) = \frac52\,\mathrm{e}^{-t}\sin(2t)\).</li>
      <li>\(y'\) s'annule d'abord en \(t = \frac\pi2\), où \(y\big(\frac\pi2\big) = 1 + \mathrm{e}^{-\pi/2} \approx 1{,}21\) : la sortie dépasse sa valeur finale de 21 % avant de s'y stabiliser.</li>
    </ol>
  </div>

    <strong>Exemple — amplitude et phase d'une oscillation</strong>
    <ol>
      <li>\(y'' + 4y = 0\), \(y(0) = 3\), \(y'(0) = -4\). Solution générale : \(\lambda\cos(2t) + \mu\sin(2t)\), d'où \(\lambda = 3\) et \(2\mu = -4\).</li>

<div class="course-section">
  <div class="sec-num">§10 · STABILITÉ, RÉGIMES TRANSITOIRE ET PERMANENT</div>
  <h2>Ce que devient la solution au bout d'un long moment</h2>
  <div class="intro">En physique et en sciences de l'ingénieur, la question est souvent : le système revient-il à l'équilibre, et vers quel comportement tend-il ? Pour une équation à coefficients constants réels, la réponse se lit sur les racines de l'équation caractéristique.</div>

  <div class="prop-box">
    <strong>Critère de stabilité.</strong> Soit \(a\), \(b\) réels. Toutes les solutions de \(y'' + a\,y' + b\,y = 0\) tendent vers 0 en \(+\infty\) si et seulement si les racines de l'équation caractéristique ont une partie réelle strictement négative, ce qui équivaut à
    <div class="formula" data-nom="Critère de stabilité (ordre 2)">$$a \gt 0 \qquad\text{et}\qquad b \gt 0 .$$</div>
    À l'ordre 1, toutes les solutions de \(y' + a\,y = 0\) tendent vers 0 si et seulement si \(a \gt 0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Somme et produit des racines.</span>
    <div class="content">
      <p>Les solutions de base \(\mathrm{e}^{rt}\), \(t\,\mathrm{e}^{rt}\), \(\mathrm{e}^{\alpha t}\cos\beta t\), \(\mathrm{e}^{\alpha t}\sin\beta t\) tendent vers 0 si et seulement si la partie réelle de \(r\) (ou \(\alpha\)) est strictement négative, car \(|\mathrm{e}^{rt}| = \mathrm{e}^{\operatorname{Re}(r)\,t}\) (et \(t\,\mathrm{e}^{rt} \to 0\) par croissances comparées). Si \(\Delta \lt 0\), les racines \(\alpha \pm i\beta\) ont pour partie réelle \(\alpha = -\frac a2\), négative si et seulement si \(a \gt 0\) ; et \(b = \alpha^2 + \beta^2 \gt 0\) automatiquement. Si \(\Delta \ge 0\), les racines réelles \(r_1\), \(r_2\) vérifient \(r_1 + r_2 = -a\) et \(r_1 r_2 = b\) : elles sont toutes deux strictement négatives si et seulement si leur somme est négative et leur produit positif, soit \(a \gt 0\) et \(b \gt 0\).</p>
    </div>
  </div>
  <p><strong>Régime transitoire, régime permanent.</strong> Si l'équation est stable, toute solution de l'équation complète s'écrit \(y = y_p + y_h\) avec \(y_h \to 0\) : au bout de quelques constantes de temps, il ne reste que \(y_p\), le <strong>régime permanent</strong> (constante pour un échelon, sinusoïde de même pulsation que l'excitation pour un second membre sinusoïdal : le <strong>régime sinusoïdal forcé</strong>). Le terme \(y_h\), qui dépend des conditions initiales, est le <strong>régime transitoire</strong>. Si \(a = 0 \lt b\), les solutions homogènes oscillent sans s'amortir ; si \(a \lt 0\) ou \(b \lt 0\), certaines divergent : le système est instable.</p>

  <div class="method-box">
    <strong>Exemple — un circuit RLC</strong>
    <ol>
      <li>Circuit RLC série alimenté par \(e(t)\), avec \(R = 100\ \Omega\), \(L = 0{,}1\ \text{H}\), \(C = 1\ \mu\text{F}\) : la charge vérifie \(q'' + \frac RL\,q' + \frac{1}{LC}\,q = \frac{e(t)}{L}\), donc \(a = \frac RL = 1\,000\ \text{s}^{-1}\) et \(b = \frac{1}{LC} = 10^7\ \text{s}^{-2}\).</li>
      <li>\(a \gt 0\) et \(b \gt 0\) : le circuit est stable. \(\Delta = 10^6 - 4 \times 10^7 \lt 0\) : régime transitoire pseudo-périodique, en \(\mathrm{e}^{-500 t}\) (il s'éteint en une dizaine de millisecondes), de pseudo-pulsation \(\beta = \sqrt{10^7 - 500^2} \approx 3\,122\ \text{rad/s}\).</li>
      <li>En notations de physique, \(\omega_0 = \frac{1}{\sqrt{LC}} \approx 3\,162\ \text{rad/s}\) et \(Q = \frac1R\sqrt{\frac LC} \approx 3{,}2\) (chapitre « Circuit RLC série »).</li>
      <li>À l'inverse, \(y'' - 0{,}2\,y' + y = 0\) a pour racines \(0{,}1 \pm 0{,}99\,i\) : les oscillations croissent comme \(\mathrm{e}^{0{,}1 t}\). Un « amortissement négatif » décrit un système qui reçoit de l'énergie (une corde frottée par un archet, un oscillateur électronique au démarrage).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire que \(b \gt 0\) suffit. Pour \(y'' + y = 0\), les solutions oscillent sans tendre vers 0, et la moindre excitation à la pulsation 1 les fait croître sans limite (résonance, §8). Le critère demande les deux conditions.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · APPROCHER UNE SOLUTION : LA MÉTHODE D'EULER</div>
  <h2>Quand la primitive n'est pas calculable</h2>
  <div class="intro">La variation de la constante donne toujours une formule, mais elle contient une primitive que l'on ne sait pas toujours écrire. On calcule alors la solution numériquement. La méthode d'Euler, que le programme cite comme exemple de discrétisation, avance pas à pas en suivant la pente donnée par l'équation. Elle est étudiée dans le chapitre d'informatique « Méthodes numériques » (§6) et appliquée aux circuits dans « Circuit linéaire du premier ordre » (§9).</div>

  <div class="prop-box">
    <strong>Méthode d'Euler.</strong> Pour le problème \(y' = F(t, y)\), \(y(t_0) = y_0\), et un pas \(h \gt 0\), on pose \(t_k = t_0 + kh\) et l'on calcule des approximations \(y_k \approx y(t_k)\) par
    <div class="formula" data-nom="Méthode d'Euler">$$y_{k+1} = y_k + h\,F(t_k, y_k) .$$</div>
    C'est l'approximation affine \(y(t_k + h) \approx y(t_k) + h\,y'(t_k)\) : on suit la tangente sur un pas. L'erreur sur un intervalle de temps fixé est proportionnelle à \(h\) (méthode d'ordre 1).
  </div>

  <div class="method-box">
    <strong>Exemple — une équation dont la solution n'a pas de formule usuelle</strong>
    <ol>
      <li>\(y' + 2t\,y = 1\), \(y(0) = 0\). Homogène : \(K\,\mathrm{e}^{-t^2}\) ; variation de la constante : \(K'(t) = \mathrm{e}^{t^2}\). La solution est donc \(y(t) = \mathrm{e}^{-t^2}\displaystyle\int_0^t\mathrm{e}^{s^2}\,\mathrm{d}s\), mais \(\mathrm{e}^{s^2}\) n'a pas de primitive usuelle (chapitre « Primitives », §4).</li>
      <li>Euler avec \(F(t, y) = 1 - 2t\,y\) et \(h = 0{,}25\) : \(y_1 = 0 + 0{,}25 \times 1 = 0{,}25\), \(y_2 = 0{,}25 + 0{,}25\,(1 - 2 \times 0{,}25 \times 0{,}25) \approx 0{,}469\), et ainsi de suite.</li>
      <li>À \(t = 1\), on trouve \(0{,}626\) avec \(h = 0{,}25\), \(0{,}570\) avec \(h = 0{,}1\), \(0{,}541\) avec \(h = 0{,}01\), pour une valeur exacte \(0{,}538\) : l'erreur (\(0{,}088\) ; \(0{,}032\) ; \(0{,}003\)) est à peu près proportionnelle au pas.</li>
      <li>La solution atteint son maximum, environ \(0{,}541\), en \(t \approx 0{,}92\), puis décroît vers 0 comme \(\frac{1}{2t}\).</li>
    </ol>
  </div>

<figcaption>Équation y′ + 2t y = 1 avec y(0) = 0 : la variation de la constante donne y(t) = e^(−t²) ∫₀ᵗ e^(s²) ds, intégrale sans primitive usuelle (trait fin, calculée numériquement ; maximum ≈ 0,541 en t ≈ 0,92). En rouge, la méthode d'Euler avec le pas h = 0,25 : chaque segment suit la pente 1 − 2tₖyₖ calculée au début du pas. L'écart, ≈ 0,09 en t = 1, est divisé par 10 environ quand on divise h par 10.</figcaption>
</figure>

  <p>Une équation d'ordre 2 se ramène à un système de deux équations d'ordre 1 en prenant pour inconnues \(y\) et \(v = y'\) : c'est ainsi qu'on simule un pendule aux grandes amplitudes (chapitre « Méthodes numériques », §7).</p>

  <div class="notice"><strong>Erreur classique</strong> : prendre un pas trop grand. Pour \(y' = -\frac{y}{\tau}\), la méthode donne \(y_{k+1} = \left(1 - \frac h\tau\right)y_k\) : si \(h \gt 2\tau\), la suite oscille et diverge alors que la vraie solution décroît. Le pas doit être petit devant les temps caractéristiques (constante de temps, période).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce que l'on verra plus tard</h2>
  <div class="intro">Ces compléments ne sont pas exigibles en PTSI. Un énoncé qui en a besoin donne la méthode à suivre.</div>
  <ul>
    <li><strong>Second membre \(P(t)\,\mathrm{e}^{\lambda t}\)</strong>, avec \(P\) polynôme : on cherche \(y_p = t^m\,Q(t)\,\mathrm{e}^{\lambda t}\), où \(\deg Q = \deg P\) et \(m \in \{0, 1, 2\}\) est la multiplicité de \(\lambda\) comme racine de l'équation caractéristique. Exemple : pour \(y'' - y = t\,\mathrm{e}^t\), 1 est racine simple et \(y_p = \left(\frac{t^2}{4} - \frac t4\right)\mathrm{e}^t\). Ce cas est rappelé au début du chapitre « Équations différentielles (approfondissements) » de 2ᵉ année.</li>
    <li><strong>Ordre 2 à coefficients variables</strong>, \(y'' + a(t)\,y' + b(t)\,y = c(t)\) : théorème de Cauchy, plan des solutions, wronskien, recherche de solutions développables en série entière, variation des constantes (méthode de Lagrange). C'est le programme de 2ᵉ année.</li>
    <li><strong>Équations à variables séparables</strong>, \(y' = g(t)\,h(y)\) : on écrit \(\frac{\mathrm{d}y}{h(y)} = g(t)\,\mathrm{d}t\) et l'on primitive des deux côtés. La physique-chimie s'en sert (capacité de ses outils mathématiques) : pour une réaction d'ordre 2, \([A]' = -k\,[A]^2\) donne \(\frac{1}{[A]} = \frac{1}{[A]_0} + k\,t\).</li>
    <li><strong>Équations non linéaires</strong> : le théorème de Cauchy-Lipschitz garantit encore une solution unique au voisinage de la condition initiale, mais plus forcément sur tout l'intervalle. Les solutions de \(y' = y^2\) sont les \(\frac{1}{c - t}\) (et la fonction nulle) : partie de \(y(0) = 1\), la solution \(\frac{1}{1 - t}\) explose en \(t = 1\). On les étudie qualitativement ou numériquement (pendule aux grandes amplitudes, chapitre « Oscillateurs harmoniques », §11).</li>
  </ul>
</div>

<template class="pan-tpl" data-panneau="edo-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · ÉQUATIONS DIFFÉRENTIELLES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Résoudre une équation différentielle linéaire suit toujours le même plan : identifier l'équation, résoudre l'équation homogène, trouver une solution particulière, additionner, et seulement à la fin appliquer les conditions initiales. Chaque méthode donne ses étapes, un exemple éclair vérifié et le piège associé. Les notations sont celles du cours (§1 à §11) : la variable est \(t\), les équations s'écrivent \(y' + a(t)\,y = b(t)\) et \(y'' + a\,y' + b\,y = f(t)\).</div>

  <div class="method-box">
    <strong>Méthode 1 — Reconnaître l'équation et la mettre sous forme résolue</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Vérifier qu'elle est <strong>linéaire</strong> : \(y\), \(y'\), \(y''\) n'apparaissent qu'au premier degré, multipliés par des fonctions de \(t\) seulement.</li>
      <li><span class="step">Étape 2.</span> Lire l'<strong>ordre</strong> ; à l'ordre 2, vérifier que les coefficients sont <strong>constants</strong> (sinon : chapitre de 2ᵉ année).</li>
      <li><span class="step">Étape 3.</span> Diviser par le coefficient de la dérivée la plus haute, sur un <strong>intervalle</strong> où il ne s'annule pas.</li>
      <li><span class="step">Étape 4.</span> Repérer le second membre et l'équation homogène associée.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(t\,y' + y = 2t\) est linéaire d'ordre 1 ; sur \(]0, +\infty[\), elle s'écrit \(y' + \frac1t\,y = 2\). En revanche \(y' = 1 + y^2\) n'est pas linéaire, et \(y'' + t\,y = 0\) est d'ordre 2 à coefficient variable.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Résoudre une équation homogène d'ordre 1</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire l'équation sous la forme \(y' + a(t)\,y = 0\) (attention au signe de \(a\)).</li>
      <li><span class="step">Étape 2.</span> Calculer une primitive \(A\) de \(a\) sur l'intervalle.</li>
      <li><span class="step">Étape 3.</span> Conclure : \(y(t) = K\,\mathrm{e}^{-A(t)}\), \(K \in \mathbb R\) (ou \(\mathbb C\)) ; simplifier \(\mathrm{e}^{\pm\ln(\ldots)}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y' - \frac1t\,y = 0\) sur \(]0, +\infty[\) : \(a(t) = -\frac1t\), \(A(t) = -\ln t\), donc \(y(t) = K\,\mathrm{e}^{\ln t} = K\,t\). Et \(y' + y\cos t = 0\) : \(A = \sin\), \(y(t) = K\,\mathrm{e}^{-\sin t}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Trouver une solution particulière d'ordre 1 quand \(a\) est constant</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Second membre constant ou polynôme (\(a \neq 0\)) : chercher un polynôme de même degré.</li>
      <li><span class="step">Étape 2.</span> Second membre \(B\,\mathrm{e}^{\lambda t}\) : chercher \(\gamma\,\mathrm{e}^{\lambda t}\), d'où \(\gamma = \frac{B}{\lambda + a}\) ; si \(\lambda = -a\), chercher \(\gamma\,t\,\mathrm{e}^{\lambda t}\).</li>
      <li><span class="step">Étape 3.</span> Second membre \(B\cos(\omega t)\) ou \(B\sin(\omega t)\) : résoudre avec \(B\,\mathrm{e}^{i\omega t}\), puis prendre la partie réelle ou imaginaire.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y' + 4y = 8t\) : \(y_p = \gamma t + \delta\) donne \(\gamma + 4\gamma t + 4\delta = 8t\), soit \(y_p = 2t - \frac12\). \(y' - y = 3\,\mathrm{e}^{2t}\) : \(y_p = \frac{3}{2 - 1}\,\mathrm{e}^{2t} = 3\,\mathrm{e}^{2t}\). \(y' + y = 2\sin t\) : avec \(2\,\mathrm{e}^{it}\), \(z_p = \frac{2}{1 + i}\,\mathrm{e}^{it} = (1 - i)\,\mathrm{e}^{it}\), dont la partie imaginaire est \(y_p = \sin t - \cos t\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Appliquer la variation de la constante</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Résoudre l'homogène : \(y_h = K\,\mathrm{e}^{-A(t)}\) (méthode 2).</li>
      <li><span class="step">Étape 2.</span> Poser \(y = K(t)\,\mathrm{e}^{-A(t)}\) et reporter : il reste \(K'(t)\,\mathrm{e}^{-A(t)} = b(t)\). Si des termes en \(K(t)\) subsistent, l'homogène est fausse.</li>
      <li><span class="step">Étape 3.</span> Primitiver \(K'(t) = b(t)\,\mathrm{e}^{A(t)}\) (chapitre « Primitives ») ; la constante d'intégration donne d'un coup toutes les solutions.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y' + \frac1t\,y = 1\) sur \(]0, +\infty[\) : \(y_h = \frac Kt\) ; avec \(y = \frac{K(t)}{t}\), on obtient \(\frac{K'(t)}{t} = 1\), \(K(t) = \frac{t^2}{2} + K\). Solutions : \(y(t) = \frac t2 + \frac Kt\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la variation de la constante s'applique à l'équation <strong>résolue</strong>. Pour \(t\,y' + y = t\), il faut diviser par \(t\) avant d'écrire \(K'(t)\,\mathrm{e}^{-A(t)} = b(t)\), avec \(b(t) = 1\) et non \(t\).</div>

  <div class="method-box">
    <strong>Méthode 5 — Résoudre une équation homogène d'ordre 2</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire l'équation caractéristique \(r^2 + a\,r + b = 0\) et calculer \(\Delta = a^2 - 4b\).</li>
      <li><span class="step">Étape 2.</span> \(\Delta \gt 0\) : \(\lambda\,\mathrm{e}^{r_1 t} + \mu\,\mathrm{e}^{r_2 t}\) ; \(\Delta = 0\) : \((\lambda + \mu t)\,\mathrm{e}^{r_0 t}\) ; \(\Delta \lt 0\), racines \(\alpha \pm i\beta\) : \(\mathrm{e}^{\alpha t}\big(\lambda\cos\beta t + \mu\sin\beta t\big)\).</li>
      <li><span class="step">Étape 3.</span> Si l'énoncé demande les solutions complexes (ou si \(a\), \(b\) sont complexes) : \(\lambda\,\mathrm{e}^{r_1 t} + \mu\,\mathrm{e}^{r_2 t}\) avec \(\lambda\), \(\mu\) complexes, même quand les racines sont complexes.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y'' + 6y' + 9y = 0\) : \((r + 3)^2 = 0\), solutions \((\lambda + \mu t)\,\mathrm{e}^{-3t}\). \(y'' + 2y' + 2y = 0\) : racines \(-1 \pm i\), solutions réelles \(\mathrm{e}^{-t}(\lambda\cos t + \mu\sin t)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Solution particulière d'ordre 2 : second membre polynôme ou exponentiel</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Polynôme \(P\) de degré \(n\) : si \(b \neq 0\), chercher un polynôme de degré \(n\) ; si \(b = 0\) et \(a \neq 0\), chercher \(t\,Q(t)\) avec \(\deg Q = n\). Identifier les coefficients.</li>
      <li><span class="step">Étape 2.</span> \(A\,\mathrm{e}^{\lambda t}\) : calculer \(\chi(\lambda) = \lambda^2 + a\lambda + b\). Si \(\chi(\lambda) \neq 0\) : \(y_p = \frac{A}{\chi(\lambda)}\,\mathrm{e}^{\lambda t}\). Si \(\lambda\) est racine simple : \(y_p = \frac{A}{2\lambda + a}\,t\,\mathrm{e}^{\lambda t}\). Si racine double : \(y_p = \frac A2\,t^2\,\mathrm{e}^{\lambda t}\).</li>
      <li><span class="step">Étape 3.</span> Toujours vérifier en reportant dans l'équation.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y'' - y' = 2t\) : \(b = 0\), on cherche \(\gamma t^2 + \delta t\) ; \(2\gamma - (2\gamma t + \delta) = 2t\) donne \(\gamma = -1\), \(\delta = -2\), \(y_p = -t^2 - 2t\). \(y'' + y' - 2y = \mathrm{e}^t\) : \(r^2 + r - 2 = (r - 1)(r + 2)\), 1 est racine simple, \(y_p = \frac{1}{2 + 1}\,t\,\mathrm{e}^t = \frac13\,t\,\mathrm{e}^t\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Second membre sinusoïdal : passer en complexes</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire \(B\cos(\omega t) = \operatorname{Re}\big(B\,\mathrm{e}^{i\omega t}\big)\) ou \(B\sin(\omega t) = \operatorname{Im}\big(B\,\mathrm{e}^{i\omega t}\big)\) (coefficients \(a\), \(b\) réels).</li>
      <li><span class="step">Étape 2.</span> Si \(i\omega\) n'est pas racine : \(z_p = \frac{B}{b - \omega^2 + ia\omega}\,\mathrm{e}^{i\omega t}\). Mettre le coefficient sous forme algébrique, développer, prendre \(\operatorname{Re}\) ou \(\operatorname{Im}\).</li>
      <li><span class="step">Étape 3.</span> Si \(i\omega\) est racine (\(a = 0\), \(b = \omega^2\)) : résonance, \(z_p = \frac{B}{2i\omega}\,t\,\mathrm{e}^{i\omega t}\), solution qui croît comme \(t\).</li>
      <li><span class="step">Étape 4.</span> Amplitude du régime forcé : \(\frac{|B|}{\sqrt{(b - \omega^2)^2 + a^2\omega^2}}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y'' + y = 3\sin(2t)\) : \(z_p = \frac{3}{1 - 4}\,\mathrm{e}^{2it} = -\mathrm{e}^{2it}\), d'où \(y_p = -\sin(2t)\). \(y'' + 9y = \sin(3t)\) : résonance, \(z_p = \frac{1}{6i}\,t\,\mathrm{e}^{3it} = -\frac{i}{6}\,t\,\mathrm{e}^{3it}\), dont la partie imaginaire est \(y_p = -\frac16\,t\cos(3t)\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 8 — Découper le second membre (superposition)</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire le second membre comme une somme de termes de types connus : constante, polynôme, \(A\,\mathrm{e}^{\lambda t}\), \(B\cos(\omega t)\), \(B\sin(\omega t)\).</li>
      <li><span class="step">Étape 2.</span> Trouver une solution particulière pour chaque terme, séparément (méthodes 3, 6, 7).</li>
      <li><span class="step">Étape 3.</span> Additionner : la somme est une solution particulière de l'équation complète.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y'' - y = 1 + \mathrm{e}^{2t} + \cos t\) : \(y_1 = -1\), \(y_2 = \frac{\mathrm{e}^{2t}}{4 - 1} = \frac{\mathrm{e}^{2t}}{3}\), \(y_3 = \operatorname{Re}\frac{\mathrm{e}^{it}}{-1 - 1} = -\frac{\cos t}{2}\). Donc \(y_p = -1 + \frac{\mathrm{e}^{2t}}{3} - \frac{\cos t}{2}\).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 9 — Résoudre un problème de Cauchy</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Écrire la solution générale <strong>complète</strong> \(y = y_p + y_h\), avec une constante (ordre 1) ou deux (ordre 2).</li>
      <li><span class="step">Étape 2.</span> À l'ordre 2, dériver toute l'expression, \(y_p\) compris.</li>
      <li><span class="step">Étape 3.</span> Écrire les conditions en \(t_0\) et résoudre le système ; contrôler la solution obtenue dans l'équation et dans les conditions.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y'' - 3y' + 2y = 2\), \(y(0) = 0\), \(y'(0) = 1\) : \(y = 1 + \lambda\,\mathrm{e}^t + \mu\,\mathrm{e}^{2t}\) ; \(\lambda + \mu = -1\) et \(\lambda + 2\mu = 1\), d'où \(\mu = 2\), \(\lambda = -3\) : \(y(t) = 1 - 3\,\mathrm{e}^t + 2\,\mathrm{e}^{2t}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : déterminer les constantes sur \(y_h\) seule, puis ajouter \(y_p\) : la solution obtenue ne vérifie plus les conditions initiales.</div>

  <div class="method-box">
    <strong>Méthode 10 — Lire une équation de physique</strong>
    <ol>
      <li><span class="step">Étape 1.</span> Diviser par le coefficient de la dérivée la plus haute : forme \(\tau\,y' + y = \ldots\) (ordre 1, constante de temps \(\tau\)) ou \(y'' + a\,y' + b\,y = \ldots\) (ordre 2).</li>
      <li><span class="step">Étape 2.</span> Ordre 2 : identifier \(\omega_0 = \sqrt b\) et \(Q = \frac{\omega_0}{a}\) (physique ; en sciences de l'ingénieur \(\xi = \frac{a}{2\omega_0}\)), en déduire le régime : pseudo-périodique si \(Q \gt \frac12\).</li>
      <li><span class="step">Étape 3.</span> Stabilité : \(a \gt 0\) et \(b \gt 0\) (ordre 1 : \(\tau \gt 0\)). Alors le régime transitoire s'éteint et il reste le régime permanent \(y_p\).</li>
      <li><span class="step">Étape 4.</span> Ordres de grandeur : le transitoire dure 3 à 5 constantes de temps, \(\tau\) à l'ordre 1, \(\frac2a\) (celle de l'enveloppe \(\mathrm{e}^{-at/2}\)) à l'ordre 2 en régime pseudo-périodique.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(2\ddot x + 8\dot x + 200x = 0\) devient \(\ddot x + 4\dot x + 100x = 0\) : \(\omega_0 = 10\ \text{rad/s}\), \(Q = 2{,}5\), régime pseudo-périodique et stable, enveloppe \(\mathrm{e}^{-2t}\) (constante de temps \(0{,}5\ \text{s}\)), pseudo-pulsation \(\sqrt{100 - 4} \approx 9{,}8\ \text{rad/s}\).</p>
  </div>

  <div class="notice"><strong>Pièges récapitulés</strong> : signe de l'exponentielle (\(K\,\mathrm{e}^{-A}\) pour \(y' + a\,y = 0\)) ; primitive \(A\) oubliée quand \(a\) dépend de \(t\) ; facteur \(t\) oublié en cas de racine double ou de résonance ; terme en \(\sin\) oublié pour un second membre en \(\cos\) ; partie réelle prise avant d'avoir développé ; constantes déterminées avant d'avoir ajouté \(y_p\) ; division par un coefficient qui s'annule.</div>
</div>

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Premier ordre à coefficient constant</h3>
  <div class="statement">Résoudre sur \(\mathbb{R}\) les problèmes suivants.</div>
  <div class="q"><strong>Q1.</strong> \(y' + 2y = 0\), \(y(0) = 3\).</div>
  <div class="q"><strong>Q2.</strong> \(y' - 3y = 6\), \(y(0) = 0\).</div>
  <div class="q"><strong>Q3.</strong> \(y' + y = \mathrm{e}^{-t}\), \(y(0) = 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Solutions \(K\,\mathrm{e}^{-2t}\) ; la condition initiale donne \(K = 3\) : \(y(t) = 3\,\mathrm{e}^{-2t}\).</p>
    <p><strong>Q2.</strong> Homogène : \(K\,\mathrm{e}^{3t}\). Une constante \(c\) est solution si \(-3c = 6\) : \(y_p = -2\). Solution générale \(y = K\,\mathrm{e}^{3t} - 2\) ; \(y(0) = K - 2 = 0\) donne \(K = 2\) : \(y(t) = 2\,\mathrm{e}^{3t} - 2\).</p>
    <p><strong>Q3.</strong> Homogène : \(K\,\mathrm{e}^{-t}\). Le second membre \(\mathrm{e}^{-t}\) est lui-même solution de l'équation homogène (\(\lambda = -1 = -a\)) : on cherche \(y_p = \gamma\,t\,\mathrm{e}^{-t}\). Alors \(y_p' + y_p = \gamma\,\mathrm{e}^{-t}\), donc \(\gamma = 1\). Solution générale \(y = (K + t)\,\mathrm{e}^{-t}\), et \(y(0) = K = 1\) : \(y(t) = (1 + t)\,\mathrm{e}^{-t}\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Variation de la constante</h3>
  <div class="statement">Résoudre sur \(]0, +\infty[\) l'équation \(t\,y' - y = t^2\), avec \(y(1) = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p>On divise par \(t\), qui ne s'annule pas sur \(I = \,]0, +\infty[\) : \(y' - \frac{1}{t}\,y = t\).</p>
    <p>Homogène : \(a(t) = -\frac1t\), \(A(t) = -\ln t\), donc \(y_h(t) = K\,\mathrm{e}^{\ln t} = K\,t\).</p>
    <p>Variation de la constante : \(y = K(t)\,t\) donne \(y' - \frac yt = K'(t)\,t + K(t) - K(t) = K'(t)\,t\), qui doit valoir \(t\). Donc \(K'(t) = 1\) et \(K(t) = t + C\).</p>
    <p>Solutions : \(y(t) = t^2 + C\,t\). La condition \(y(1) = 1 + C = 0\) donne \(C = -1\) : \(y(t) = t^2 - t\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Second ordre homogène</h3>
  <div class="statement">Déterminer les solutions réelles des équations suivantes.</div>
  <div class="q"><strong>Q1.</strong> \(y'' - 5y' + 6y = 0\).</div>
  <div class="q"><strong>Q2.</strong> \(y'' + 4y' + 4y = 0\).</div>
  <div class="q"><strong>Q3.</strong> \(y'' + 2y' + 5y = 0\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(r^2 - 5r + 6 = (r - 2)(r - 3)\) : \(y(t) = \lambda\,\mathrm{e}^{2t} + \mu\,\mathrm{e}^{3t}\), \((\lambda, \mu) \in \mathbb R^2\).</p>
    <p><strong>Q2.</strong> \(r^2 + 4r + 4 = (r + 2)^2\), racine double \(-2\) : \(y(t) = (\lambda + \mu t)\,\mathrm{e}^{-2t}\).</p>
    <p><strong>Q3.</strong> \(\Delta = 4 - 20 = -16\), racines \(-1 \pm 2i\) : \(y(t) = \mathrm{e}^{-t}\big(\lambda\cos(2t) + \mu\sin(2t)\big)\).</p>
