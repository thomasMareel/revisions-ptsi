<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Coordonnées polaires</h3>
  <div class="statement">Le plan est muni d'un repère orthonormé direct \((O;\vec\imath,\vec\jmath)\). On considère \(A(3,-3\sqrt3)\) et \(B(-2,-2)\).</div>
  <div class="q"><strong>Q1.</strong> Donner des coordonnées polaires de \(A\) et de \(B\).</div>
  <div class="q"><strong>Q2.</strong> Donner les coordonnées cartésiennes du point \(C\) de coordonnées polaires \(\big(2,\frac{3\pi}{4}\big)\).</div>
  <div class="q"><strong>Q3.</strong> En déduire une mesure de l'angle orienté \((\overrightarrow{OA},\overrightarrow{OB})\), et la contrôler par les produits scalaire et mixte.</div>
  <div class="q"><strong>Q4.</strong> Donner une équation polaire du cercle \(x^2+y^2+4x=0\) ; préciser son centre et son rayon.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(OA=\sqrt{9+27}=6\), \(\cos\theta_A=\frac36=\frac12\) et \(\sin\theta_A=-\frac{3\sqrt3}{6}=-\frac{\sqrt3}2\) : \(\theta_A=-\frac\pi3\), d'où \(\big(6,-\frac\pi3\big)\). Pour \(B\) : \(OB=2\sqrt2\), \(\cos\theta_B=\sin\theta_B=-\frac{\sqrt2}{2}\) : \(\theta_B=-\frac{3\pi}{4}\) (le point est dans le 3ᵉ quadrant ; \(\arctan\frac yx=\frac\pi4\) serait faux), d'où \(\big(2\sqrt2,-\frac{3\pi}4\big)\).</p>
    <p><strong>Q2.</strong> \(x=2\cos\frac{3\pi}4=-\sqrt2\), \(y=2\sin\frac{3\pi}4=\sqrt2\) : \(C(-\sqrt2,\sqrt2)\).</p>
    <p><strong>Q3.</strong> Les angles polaires se retranchent :</p>
    <div class="formula">$$(\overrightarrow{OA},\overrightarrow{OB})\equiv\theta_B-\theta_A=-\frac{3\pi}4+\frac\pi3=-\frac{5\pi}{12}\pmod{2\pi} .$$</div>
    <p>Contrôle : \(\overrightarrow{OA}\cdot\overrightarrow{OB}=-6+6\sqrt3\) et \(OA\times OB=12\sqrt2\), donc le cosinus vaut \(\frac{\sqrt3-1}{2\sqrt2}=\frac{\sqrt6-\sqrt2}{4}=\cos\frac{5\pi}{12}\). Et \([\overrightarrow{OA},\overrightarrow{OB}]\) vaut \(3\times(-2)-(-3\sqrt3)\times(-2)\), soit \(-6-6\sqrt3\lt0\) : l'angle est bien négatif.</p>
    <p><strong>Q4.</strong> Avec \(x^2+y^2=r^2\) et \(x=r\cos\theta\) : \(r^2+4r\cos\theta=0\), soit \(r=0\) ou \(r=-4\cos\theta\) (pour \(\cos\theta\leqslant0\), puisque \(r\geqslant0\)). En cartésiennes, \((x+2)^2+y^2=4\) : cercle de centre \((-2,0)\) et de rayon 2, qui passe par \(O\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Produit scalaire dans un triangle</h3>
  <div class="statement">Dans un repère orthonormé, on donne \(A(-1,1)\), \(B(3,-1)\) et \(C(2,4)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\overrightarrow{AB}\cdot\overrightarrow{AC}\), \(AB\), \(AC\), puis l'angle \(\widehat{BAC}\) à \(0{,}1\) degré près.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(BC\) par la formule d'Al-Kashi, puis vérifier avec les coordonnées.</div>
  <div class="q"><strong>Q3.</strong> Déterminer le projeté orthogonal \(H\) de \(C\) sur \((AB)\), la hauteur \(CH\) et l'aire du triangle.</div>
  <div class="q"><strong>Q4.</strong> Sans coordonnées : deux vecteurs vérifient \(\|\vec u\|=3\), \(\|\vec v\|=5\) et \(\|\vec u-\vec v\|=7\). Calculer \(\vec u\cdot\vec v\) et l'angle entre \(\vec u\) et \(\vec v\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overrightarrow{AB}=(4,-2)\), \(\overrightarrow{AC}=(3,3)\), donc \(\overrightarrow{AB}\cdot\overrightarrow{AC}=12-6=6\) (base orthonormée). \(AB=\sqrt{20}=2\sqrt5\), \(AC=3\sqrt2\). Ainsi \(\cos\widehat{BAC}=\frac{6}{6\sqrt{10}}=\frac{1}{\sqrt{10}}\) et \(\widehat{BAC}\approx71{,}6^\circ\).</p>
    <p><strong>Q2.</strong> \(BC^2=AB^2+AC^2-2\,\overrightarrow{AB}\cdot\overrightarrow{AC}\), soit \(20+18-12=26\), donc \(BC=\sqrt{26}\). Avec les coordonnées : \(\overrightarrow{BC}=(-1,5)\), de norme \(\sqrt{26}\).</p>
    <p><strong>Q3.</strong> \(H=A+\frac{\overrightarrow{AC}\cdot\overrightarrow{AB}}{AB^2}\,\overrightarrow{AB}\), soit \(H=A+\frac{6}{20}(4,-2)=\big(\frac15,\frac25\big)\). Puis \(\overrightarrow{HC}=\big(\frac95,\frac{18}5\big)\), orthogonal à \(\overrightarrow{AB}\) (\(\frac{36}5-\frac{36}5=0\)), et \(CH=\frac95\sqrt5=\frac{9}{\sqrt5}\). Aire : \(\frac12\,AB\times CH=\frac12\times2\sqrt5\times\frac9{\sqrt5}=9\) ; contrôle par le produit mixte, \(\frac12\big|[\overrightarrow{AB},\overrightarrow{AC}]\big|=\frac12|12+6|=9\).</p>
    <p><strong>Q4.</strong> Par l'identité \(\|\vec u-\vec v\|^2=\|\vec u\|^2+\|\vec v\|^2-2\,\vec u\cdot\vec v\) : \(49=9+25-2\,\vec u\cdot\vec v\), donc \(\vec u\cdot\vec v=-\frac{15}2\). Puis \(\cos\theta=\frac{-15/2}{15}=-\frac12\) : \(\theta=\frac{2\pi}3\). Les seules normes suffisent : c'est l'intérêt de la polarisation.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Produit mixte : alignement et aires</h3>
  <div class="statement">Repère orthonormé direct. On donne \(A(2,1)\), \(B(6,3)\) et, pour \(m\in\mathbb R\), \(C_m(m,5)\).</div>
  <div class="q"><strong>Q1.</strong> Pour quelle valeur de \(m\) les points \(A\), \(B\), \(C_m\) sont-ils alignés ?</div>
  <div class="q"><strong>Q2.</strong> Pour \(m=0\), calculer l'aire du triangle \(ABC_0\) et dire s'il est parcouru dans le sens direct.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'aire du pentagone convexe \(OPQRS\) avec \(P(4,0)\), \(Q(5,3)\), \(R(2,5)\), \(S(-1,3)\).</div>
  <div class="q"><strong>Q4.</strong> Démontrer, avec les coordonnées, que \((\vec u\cdot\vec v)^2+[\vec u,\vec v]^2=\|\vec u\|^2\|\vec v\|^2\) pour tous vecteurs \(\vec u\), \(\vec v\). Retrouver ainsi que \(|\vec u\cdot\vec v|\leqslant\|\vec u\|\,\|\vec v\|\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\overrightarrow{AB}=(4,2)\), \(\overrightarrow{AC_m}=(m-2,4)\) : \([\overrightarrow{AB},\overrightarrow{AC_m}]=16-2(m-2)=20-2m\), nul si et seulement si \(m=10\).</p>
    <p><strong>Q2.</strong> Pour \(m=0\), le produit mixte vaut \(20\gt0\) : aire \(\frac{20}2=10\), et le triangle \(ABC_0\) est direct (on tourne de \(\overrightarrow{AB}\) vers \(\overrightarrow{AC_0}\) dans le sens trigonométrique).</p>
    <p><strong>Q3.</strong> On découpe le pentagone en triangles issus de \(O\) (il est convexe et les sommets sont donnés dans le sens direct) : \([\overrightarrow{OP},\overrightarrow{OQ}]=12\), \([\overrightarrow{OQ},\overrightarrow{OR}]=25-6=19\), \([\overrightarrow{OR},\overrightarrow{OS}]=6+5=11\). Les trois sont positifs, et l'aire vaut \(\frac{12+19+11}{2}=21\).</p>
    <p><strong>Q4.</strong> Avec \(\vec u=(x,y)\), \(\vec v=(x',y')\) :</p>
    <div class="formula">$$(xx'+yy')^2+(xy'-yx')^2=x^2x'^2+y^2y'^2+x^2y'^2+y^2x'^2=(x^2+y^2)(x'^2+y'^2) .$$</div>
    <p>(les doubles produits \(2xx'yy'\) se compensent). Comme \([\vec u,\vec v]^2\geqslant0\), on obtient \((\vec u\cdot\vec v)^2\leqslant\|\vec u\|^2\|\vec v\|^2\), avec égalité si et seulement si \([\vec u,\vec v]=0\), c'est-à-dire si \(\vec u\) et \(\vec v\) sont colinéaires.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Hauteurs, médiatrices et droite d'Euler</h3>
  <div class="statement">Repère orthonormé ; triangle \(A(0,0)\), \(B(6,0)\), \(C(2,4)\).</div>
  <div class="q"><strong>Q1.</strong> Écrire une équation de chacune des trois hauteurs du triangle.</div>
  <div class="q"><strong>Q2.</strong> Montrer qu'elles sont concourantes en un point \(H\) que l'on déterminera (orthocentre).</div>
  <div class="q"><strong>Q3.</strong> Déterminer le centre \(\Omega\) et le rayon du cercle circonscrit, comme intersection de deux médiatrices ; vérifier avec le troisième sommet et donner une équation du cercle.</div>
  <div class="q"><strong>Q4.</strong> Soit \(G\) le centre de gravité. Montrer que \(\Omega\), \(G\), \(H\) sont alignés et que \(\overrightarrow{\Omega H}=3\,\overrightarrow{\Omega G}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Une hauteur passe par un sommet et a pour vecteur normal le côté opposé. Par \(A\), de normale \(\overrightarrow{BC}=(-4,4)\), ou \((-1,1)\) : \(-x+y=0\). Par \(B\), de normale \(\overrightarrow{AC}=(2,4)\), ou \((1,2)\) : \((x-6)+2y=0\), soit \(x+2y=6\). Par \(C\), de normale \(\overrightarrow{AB}=(6,0)\) : \(x=2\).</p>
    <p><strong>Q2.</strong> Les hauteurs issues de \(A\) et de \(C\) se coupent en \(H(2,2)\), et \(2+2\times2=6\) : \(H\) est aussi sur la troisième.</p>
    <p><strong>Q3.</strong> La médiatrice de \([AB]\) passe par le milieu \((3,0)\) avec la normale \((1,0)\) : \(x=3\). Celle de \([AC]\) passe par \((1,2)\) avec la normale \((1,2)\) : \((x-1)+2(y-2)=0\), soit \(x+2y=5\). Intersection : \(\Omega(3,1)\). Alors \(\Omega A=\Omega B=\Omega C=\sqrt{10}\) (contrôle : \(\overrightarrow{\Omega C}=(-1,3)\)). Cercle : \((x-3)^2+(y-1)^2=10\).</p>
    <p><strong>Q4.</strong> \(G\big(\frac83,\frac43\big)\), \(\overrightarrow{\Omega G}=\big(-\frac13,\frac13\big)\), \(\overrightarrow{\Omega H}=(-1,1)=3\,\overrightarrow{\Omega G}\). En particulier \([\overrightarrow{\Omega G},\overrightarrow{\Omega H}]=0\) : les trois points sont alignés, sur la droite d'Euler du triangle. (La relation \(\overrightarrow{\Omega H}=3\,\overrightarrow{\Omega G}\) est vraie dans tout triangle.)</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Distances, symétrique et bissectrices</h3>
  <div class="statement">Repère orthonormé ; \(\mathcal D_1 : 3x+4y-12=0\), \(\mathcal D_2 : 4x-3y-16=0\) et \(P(2,5)\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(d(P,\mathcal D_1)\), le projeté orthogonal \(H\) de \(P\) sur \(\mathcal D_1\) et le symétrique \(P'\) de \(P\) par rapport à \(\mathcal D_1\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(\mathcal D_1\) et \(\mathcal D_2\) sont perpendiculaires et déterminer leur point d'intersection \(I\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer l'ensemble des points équidistants de \(\mathcal D_1\) et de \(\mathcal D_2\) (les bissectrices).</div>
  <div class="q"><strong>Q4.</strong> Déterminer les cercles de rayon 1 tangents à la fois à \(\mathcal D_1\) et à \(\mathcal D_2\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(d=\frac{|6+20-12|}{\sqrt{9+16}}=\frac{14}5\). Projeté : \(\lambda=\frac{14}{25}\) et \(H=P-\lambda(3,4)=\big(\frac{8}{25},\frac{69}{25}\big)\) ; contrôle : \(\frac{24+276-300}{25}=0\). Symétrique : \(P'=2H-P=\big(-\frac{34}{25},\frac{13}{25}\big)\).</p>
    <p><strong>Q2.</strong> Les normales \((3,4)\) et \((4,-3)\) ont un produit scalaire nul : les droites sont perpendiculaires. En combinant \(3\times(\mathcal D_1)\) et \(4\times(\mathcal D_2)\) : \(25x=100\), d'où \(I(4,0)\).</p>
    <p><strong>Q3.</strong> Les deux normales ont la même norme 5, donc \(M\) est équidistant si et seulement si \(|3x+4y-12|=|4x-3y-16|\), c'est-à-dire \(3x+4y-12=\pm(4x-3y-16)\). On obtient deux droites : \(x-7y-4=0\) et \(7x+y-28=0\). Elles passent par \(I\) et sont perpendiculaires (\(7-7=0\)) : ce sont les bissectrices des angles formés par \(\mathcal D_1\) et \(\mathcal D_2\).</p>
    <p><strong>Q4.</strong> Le centre doit être à la distance 1 des deux droites, donc sur une bissectrice, à la distance 1 de \(\mathcal D_1\). Sur \(x-7y-4=0\), paramétrée par \((4+7t,t)\) : \(\frac{|3(4+7t)+4t-12|}{5}=5|t|=1\), \(t=\pm\frac15\), centres \(\big(\frac{27}5,\frac15\big)\) et \(\big(\frac{13}5,-\frac15\big)\). Sur \(7x+y-28=0\), paramétrée par \((4+s,-7s)\) : \(5|s|=1\), centres \(\big(\frac{21}5,-\frac75\big)\) et \(\big(\frac{19}5,\frac75\big)\). Quatre cercles, un dans chacun des quatre angles ; contrôle pour le premier : \(\frac{|108-3-80|}{25}=1\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Régionnement : la meilleure production d'un atelier</h3>
  <div class="statement">Un atelier fabrique chaque jour \(x\) pièces de type 1 et \(y\) pièces de type 2 (\(x\), \(y\) réels positifs). Le temps de soudure impose \(x+2y\leqslant16\), celui d'usinage \(3x+2y\leqslant24\). Le bénéfice est \(f(x,y)=3x+4y\) (en centaines d'euros). On note \(\mathcal R\) l'ensemble des points \(M(x,y)\) qui respectent toutes les contraintes.</div>
  <div class="q"><strong>Q1.</strong> Décrire \(\mathcal R\) par des inéquations et en déterminer les sommets.</div>
  <div class="q"><strong>Q2.</strong> Interpréter \(f(x,y)\) comme \(\vec u\cdot\overrightarrow{OM}\) pour un vecteur \(\vec u\) à préciser ; décrire les lignes de niveau de \(f\) et le sens dans lequel \(f\) augmente.</div>
  <div class="q"><strong>Q3.</strong> Montrer que \(f(x,y)\leqslant36\) sur \(\mathcal R\), en écrivant \(3x+4y\) comme combinaison des deux contraintes, et en déduire la production optimale.</div>
  <div class="q"><strong>Q4.</strong> Que se passe-t-il si le bénéfice devient \(g(x,y)=3x+2y\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(\mathcal R\) est défini par \(x\geqslant0\), \(y\geqslant0\), \(x+2y\leqslant16\) et \(3x+2y\leqslant24\) : intersection de quatre demi-plans fermés (l'origine vérifie tout, ce qui fixe les côtés). Sommets : \(O(0,0)\) ; \((8,0)\) (usinage, \(y=0\)) ; \((0,8)\) (soudure, \(x=0\)) ; et l'intersection des deux contraintes, \(x+2y=16\), \(3x+2y=24\), qui donne \(2x=8\), soit \((4,6)\). Le point \((0,12)\), sur la droite d'usinage, viole la soudure : il n'est pas un sommet.</p>
    <p><strong>Q2.</strong> \(f(x,y)=\vec u\cdot\overrightarrow{OM}\) avec \(\vec u=(3,4)\). Ses lignes de niveau \(3x+4y=k\) sont des droites orthogonales à \(\vec u\), et \(f\) augmente quand on se déplace dans le sens de \(\vec u\) (la ligne de niveau \(k\) passe par \(\frac{k}{25}\,\vec u\)). On cherche donc la ligne de niveau la plus « avancée » dans la direction de \(\vec u\) qui rencontre encore \(\mathcal R\).</p>
    <p><strong>Q3.</strong> On cherche \(\alpha\), \(\beta\) avec \(3x+4y=\alpha(x+2y)+\beta(3x+2y)\) : \(\alpha+3\beta=3\) et \(2\alpha+2\beta=4\), d'où \(\beta=\frac12\), \(\alpha=\frac32\). Sur \(\mathcal R\) :</p>
    <div class="formula">$$f(x,y)=\tfrac32\,(x+2y)+\tfrac12\,(3x+2y)\leqslant\tfrac32\times16+\tfrac12\times24=36 ,$$</div>
    <p>avec égalité si et seulement si les deux contraintes sont saturées, c'est-à-dire au sommet \((4,6)\). La production optimale est de 4 pièces de type 1 et 6 de type 2, pour un bénéfice de 3 600 €. Contrôle sur les autres sommets : \(f(8,0)=24\), \(f(0,8)=32\), \(f(0,0)=0\).</p>
    <p><strong>Q4.</strong> Les lignes de niveau de \(g\) sont parallèles au côté d'usinage \(3x+2y=24\). Comme \(g\leqslant24\) sur \(\mathcal R\) par la contrainte même, le maximum 24 est atteint en tout point du segment joignant \((8,0)\) et \((4,6)\) : la solution optimale n'est plus unique.</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Tangentes à un cercle issues d'un point</h3>
  <div class="statement">Repère orthonormé ; \(\mathcal C : x^2+y^2-2x-4y=0\) et \(P(6,2)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal C\) est un cercle, donner son centre \(\Omega\) et son rayon \(R\), et vérifier que \(O\in\mathcal C\). Écrire la tangente en \(O\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les tangentes à \(\mathcal C\) passant par \(P\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer les points de contact \(T_1\), \(T_2\), et la longueur \(PT_1\).</div>
  <div class="q"><strong>Q4.</strong> Retrouver \(T_1\) et \(T_2\) comme intersection de \(\mathcal C\) et du cercle de diamètre \([\Omega P]\). Pourquoi est-ce légitime ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \((x-1)^2+(y-2)^2=5\) : centre \(\Omega(1,2)\), rayon \(\sqrt5\). \(O\) vérifie l'équation (\(0=0\)). Tangente en \(O\) : vecteur normal \(\overrightarrow{\Omega O}=(-1,-2)\), d'où \(x+2y=0\).</p>
    <p><strong>Q2.</strong> \(\Omega P=5\gt\sqrt5\) : \(P\) est extérieur, il y a deux tangentes. La verticale \(x=6\) est à la distance 5 de \(\Omega\) : elle n'est pas tangente. Les autres droites par \(P\) s'écrivent \(y-2=m(x-6)\), soit \(mx-y+2-6m=0\), et sont tangentes si et seulement si la distance de \(\Omega\) vaut \(R\) : \(\frac{|m-2+2-6m|}{\sqrt{m^2+1}}=\sqrt5\), soit \(25m^2=5(m^2+1)\), \(m=\pm\frac12\). Tangentes : \(x-2y-2=0\) et \(x+2y-10=0\).</p>
    <p><strong>Q3.</strong> Le point de contact est le projeté de \(\Omega\) sur la tangente. Pour \(x-2y-2=0\) : \(\lambda=\frac{1-4-2}{5}=-1\), \(T_1=\Omega-\lambda(1,-2)=(2,0)\). Pour \(x+2y-10=0\) : \(\lambda=\frac{1+4-10}{5}=-1\), \(T_2=\Omega+(1,2)=(2,4)\). Les deux sont sur \(\mathcal C\) (\(1+4=5\)). Longueur : \(PT_1=\sqrt{16+4}=2\sqrt5=\sqrt{\Omega P^2-R^2}\) (Pythagore dans \(\Omega T_1P\), rectangle en \(T_1\)).</p>
    <p><strong>Q4.</strong> En un point de contact \(T\), le rayon est orthogonal à la tangente : \(\overrightarrow{T\Omega}\cdot\overrightarrow{TP}=0\), donc \(T\) est sur le cercle de diamètre \([\Omega P]\), d'équation \((x-1)(x-6)+(y-2)^2=0\). Réciproquement, un point de \(\mathcal C\) sur ce cercle voit \([\Omega P]\) sous un angle droit, et \((TP)\) est la tangente en \(T\). Retranchant les deux équations, \(x^2+y^2-2x-4y\) et \(x^2+y^2-7x-4y+10\), on obtient \(5x-10=0\), soit \(x=2\), puis \(y^2-4y=0\) : \(T_1(2,0)\), \(T_2(2,4)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Cercle par trois points et intersections</h3>
  <div class="statement">Repère orthonormé ; \(A(1,1)\), \(B(5,3)\), \(C(-1,5)\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer le cercle \(\mathcal C\) passant par \(A\), \(B\), \(C\) (on cherchera une équation \(x^2+y^2+\alpha x+\beta y+\gamma=0\)).</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'intersection de \(\mathcal C\) et de la droite \(\mathcal D : x-y+4=0\) ; contrôler la longueur de la corde.</div>
  <div class="q"><strong>Q3.</strong> Déterminer l'intersection de \(\mathcal C\) et du cercle \(\mathcal C'\) de centre \(\Omega'(6,0)\) et de rayon \(\sqrt{10}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Les trois points donnent le système linéaire \(\alpha+\beta+\gamma=-2\), \(5\alpha+3\beta+\gamma=-34\), \(-\alpha+5\beta+\gamma=-26\). En retranchant la première équation aux deux autres : \(2\alpha+\beta=-16\) et \(-\alpha+2\beta=-12\), d'où \(\beta=-8\), \(\alpha=-4\), puis \(\gamma=10\). \(\mathcal C : x^2+y^2-4x-8y+10=0\), soit \((x-2)^2+(y-4)^2=10\) : centre \(\Omega(2,4)\), rayon \(\sqrt{10}\). Contrôle : \(\overrightarrow{\Omega A}=(-1,-3)\), \(\overrightarrow{\Omega B}=(3,-1)\), \(\overrightarrow{\Omega C}=(-3,1)\), tous de norme \(\sqrt{10}\).</p>
    <p><strong>Q2.</strong> \(d(\Omega,\mathcal D)=\frac{|2-4+4|}{\sqrt2}=\sqrt2\lt\sqrt{10}\) : deux points. Avec \(y=x+4\) : \((x-2)^2+x^2=10\), soit \(x^2-2x-3=0\), \(x=3\) ou \(x=-1\) : points \((3,7)\) et \((-1,3)\). Corde : \(\sqrt{16+16}=4\sqrt2=2\sqrt{10-2}\).</p>
    <p><strong>Q3.</strong> \(\mathcal C' : x^2+y^2-12x+26=0\). \(\Omega\Omega'=\sqrt{16+16}=4\sqrt2\approx5{,}66\), compris entre \(0\) et \(2\sqrt{10}\approx6{,}32\) : deux points. Différence des équations : \(8x-8y-16=0\), soit \(y=x-2\). Dans \(\mathcal C\) : \((x-2)^2+(x-6)^2=10\), soit \(x^2-8x+15=0\), \(x=3\) ou \(x=5\) : points \((3,1)\) et \((5,3)\). La droite \(y=x-2\) est bien orthogonale à \(\overrightarrow{\Omega\Omega'}=(4,-4)\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Point d'un cercle le plus proche d'une droite</h3>
  <div class="statement">Repère orthonormé ; \(\mathcal C\) cercle de centre \(O\) et de rayon 2, \(\mathcal D : 3x+4y=20\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal C\) et \(\mathcal D\) sont disjoints.</div>
  <div class="q"><strong>Q2.</strong> Pour \(M(t)=(2\cos t,2\sin t)\), exprimer \(d\big(M(t),\mathcal D\big)\) sous la forme \(a-b\cos(t-\varphi)\), avec \(\varphi\) défini par \(\cos\varphi=\frac35\), \(\sin\varphi=\frac45\).</div>
  <div class="q"><strong>Q3.</strong> En déduire les points de \(\mathcal C\) le plus proche et le plus éloigné de \(\mathcal D\), et les distances correspondantes. Interpréter géométriquement.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(d(O,\mathcal D)=\frac{20}{5}=4\gt2\) : aucun point commun.</p>
    <p><strong>Q2.</strong> \(d\big(M(t),\mathcal D\big)=\frac{|6\cos t+8\sin t-20|}{5}\). Or \(6\cos t+8\sin t=10\big(\frac35\cos t+\frac45\sin t\big)\), c'est-à-dire \(10\cos(t-\varphi)\), toujours inférieur ou égal à 10, donc à 20 : la valeur absolue vaut \(20-10\cos(t-\varphi)\) et \(d=4-2\cos(t-\varphi)\).</p>
    <p><strong>Q3.</strong> Minimum \(4-2=2\) pour \(t=\varphi\) : point \(\big(\frac65,\frac85\big)\). Maximum \(4+2=6\) pour \(t=\varphi+\pi\) : point \(\big(-\frac65,-\frac85\big)\). Ces deux points sont sur la droite passant par \(O\) et dirigée par la normale \((3,4)\) à \(\mathcal D\) : le plus court chemin de \(\mathcal C\) à \(\mathcal D\) suit la perpendiculaire à \(\mathcal D\) issue du centre, et les distances extrêmes sont \(d(O,\mathcal D)\mp R\).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Géométrie par les nombres complexes</h3>
  <div class="statement">Le plan est identifié à \(\mathbb C\) par un repère orthonormé direct. On donne \(A(1,2)\) et \(B(4,3)\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer le point \(C\) tel que \(ABC\) soit équilatéral et direct.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\overline{(b-a)}\,(c-a)\) et en déduire \(\overrightarrow{AB}\cdot\overrightarrow{AC}\) et l'aire du triangle \(ABC\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer l'image de \(D(3,-1)\) par la rotation de centre \(A\) et d'angle \(\frac\pi2\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer l'ensemble des points \(M\), d'affixe \(z\neq i\), tels que \(\frac{z-1}{z-i}\) soit imaginaire pur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> \(C\) est l'image de \(B\) par la rotation de centre \(A\) et d'angle \(\frac\pi3\) : \(c=a+e^{i\pi/3}(b-a)\), avec \(e^{i\pi/3}=\tfrac12+i\tfrac{\sqrt3}2\) et \(b-a=3+i\), soit</p>
    <div class="formula">$$c=\frac{5-\sqrt3}{2}+i\,\frac{5+3\sqrt3}{2} .$$</div>
    <p><strong>Q2.</strong> Comme \(c-a=e^{i\pi/3}(b-a)\), \(\overline{(b-a)}\,(c-a)=|b-a|^2e^{i\pi/3}\), soit \(10\,e^{i\pi/3}=5+5\sqrt3\,i\). Donc \(\overrightarrow{AB}\cdot\overrightarrow{AC}=5\) (\(=10\cos\frac\pi3\)) et \([\overrightarrow{AB},\overrightarrow{AC}]=5\sqrt3\) : l'aire vaut \(\frac{5\sqrt3}{2}\), c'est bien \(\frac{\sqrt3}4\,AB^2\) avec \(AB^2=10\).</p>
    <p><strong>Q3.</strong> \(z'=a+i(z_D-a)\), avec \(z_D-a=2-3i\) : \(z'=1+2i+(3+2i)=4+4i\), le point \((4,4)\). Contrôle : \(\overrightarrow{AD}=(2,-3)\) et \(\overrightarrow{AD'}=(3,2)\) sont orthogonaux et de même norme.</p>
    <p><strong>Q4.</strong> Avec \(A(1,0)\) et \(B(0,1)\) d'affixes \(1\) et \(i\), \(\frac{z-1}{z-i}\in i\mathbb R\) signifie \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\) (§10 du cours : partie réelle de \(\overline{(z-i)}(z-1)\) nulle). C'est le cercle de diamètre \([AB]\), \(x^2+y^2-x-y=0\), de centre \(\big(\frac12,\frac12\big)\) et de rayon \(\frac{\sqrt2}{2}\), privé du point \(B\) (exclu par \(z\neq i\)) ; le point \(A\) en fait partie (quotient nul, qui est imaginaire pur).</p>
  </div>
</div>

<div class="exo"><span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Lignes de niveau de MA² − MB² et de MA² + MB²</h3>
  <div class="statement">Soit \(A\neq B\) deux points du plan et \(I\) le milieu de \([AB]\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(MA^2-MB^2=2\,\overrightarrow{AB}\cdot\overrightarrow{IM}\) pour tout point \(M\). En déduire que les lignes de niveau de \(M\mapsto MA^2-MB^2\) sont des droites orthogonales à \((AB)\). Que donne le niveau 0 ?</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(MA^2+MB^2=2\,MI^2+\frac{AB^2}{2}\) (théorème de la médiane), et décrire les lignes de niveau de \(M\mapsto MA^2+MB^2\).</div>
  <div class="q"><strong>Q3.</strong> Application : \(A(-2,0)\), \(B(2,0)\). Déterminer les points \(M\) tels que \(MA^2+MB^2=26\) et \(MA^2-MB^2=8\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>Q1.</strong> Par la troisième identité remarquable :</p>
    <div class="formula">$$MA^2-MB^2=(\overrightarrow{MA}-\overrightarrow{MB})\cdot(\overrightarrow{MA}+\overrightarrow{MB}) .$$</div>
    <p>Or \(\overrightarrow{MA}-\overrightarrow{MB}=\overrightarrow{BA}\) et \(\overrightarrow{MA}+\overrightarrow{MB}=2\,\overrightarrow{MI}\), donc \(MA^2-MB^2\) vaut \(2\,\overrightarrow{BA}\cdot\overrightarrow{MI}\), c'est-à-dire \(2\,\overrightarrow{AB}\cdot\overrightarrow{IM}\). La ligne de niveau \(k\) est \(\{M : \overrightarrow{AB}\cdot\overrightarrow{IM}=\frac k2\}\) : une droite de vecteur normal \(\overrightarrow{AB}\) (cours, §6). Le niveau 0 est la droite passant par \(I\) orthogonale à \((AB)\) : la médiatrice de \([AB]\), ce qui est cohérent avec \(MA=MB\).</p>
    <p><strong>Q2.</strong> Avec \(\overrightarrow{MA}=\overrightarrow{MI}+\overrightarrow{IA}\) et \(\overrightarrow{MB}=\overrightarrow{MI}-\overrightarrow{IA}\), les doubles produits se compensent : \(MA^2+MB^2=2\,MI^2+2\,IA^2\), et \(IA=\frac{AB}2\). La ligne de niveau \(k\) est donc \(\big\{MI^2=\frac k2-\frac{AB^2}4\big\}\) : le cercle de centre \(I\) et de rayon \(\sqrt{\frac k2-\frac{AB^2}4}\) si \(k\gt\frac{AB^2}2\), le point \(I\) si \(k=\frac{AB^2}2\), le vide sinon.</p>
    <p><strong>Q3.</strong> Ici \(I=O\), \(AB=4\), \(\overrightarrow{AB}=(4,0)\). La première condition donne \(2\,OM^2+8=26\), soit \(x^2+y^2=9\) ; la seconde \(2\times4x=8\), soit \(x=1\). Donc \(y^2=8\) : \(M(1,2\sqrt2)\) ou \(M(1,-2\sqrt2)\). Contrôle direct pour le premier : \(MA^2=9+8=17\), \(MB^2=1+8=9\), somme 26 et différence 8.</p>
  </div>
</div>

<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : géométrie du plan — triangle rectangle, cercles circonscrit, inscrit et exinscrits, régionnement, distances, paramétrage).</div>
  <h3>Découper un disque dans une plaque triangulaire</h3>
  <div class="statement">Une plaque de tôle a la forme du triangle plein \(\mathcal T\) de sommets \(O(0,0)\), \(A(4,0)\) et \(B(0,3)\), dans un repère orthonormé direct (unité : le décimètre). On veut y découper un disque, et étudier les cercles liés au triangle.</div>
  <p class="exo-part">Partie A — Le triangle</p>
  <div class="q"><strong>A1.</strong> Donner une équation cartésienne de \((AB)\) et un vecteur normal.</div>
  <div class="q"><strong>A2.</strong> Décrire \(\mathcal T\) par trois inégalités. Le point \(E(2,1)\) est-il dans \(\mathcal T\) ? Et \(F(3,1)\) ?</div>
  <div class="q"><strong>A3.</strong> Calculer l'aire de \(\mathcal T\) par un produit mixte, et la longueur \(AB\).</div>
  <p class="exo-part">Partie B — Le cercle circonscrit</p>
  <div class="q"><strong>B1.</strong> Justifier que le cercle circonscrit \(\Gamma\) au triangle est le cercle de diamètre \([AB]\). En donner une équation, le centre \(K\) et le rayon \(R\).</div>
  <div class="q"><strong>B2.</strong> Écrire la tangente à \(\Gamma\) en \(O\).</div>
  <p class="exo-part">Partie C — Cercles tangents aux trois côtés</p>
  <div class="q"><strong>C1.</strong> Soit \(\rho\gt0\) et \(\Omega_\rho(\rho,\rho)\). Montrer que le cercle de centre \(\Omega_\rho\) et de rayon \(\rho\) est tangent aux deux axes, puis déterminer les valeurs de \(\rho\) pour lesquelles il est aussi tangent à \((AB)\).</div>
  <div class="q"><strong>C2.</strong> Pour chacune, dire si le centre est dans \(\mathcal T\). En déduire le cercle inscrit (centre \(I\), rayon \(r\)) et ses trois points de contact avec les côtés.</div>
  <div class="q"><strong>C3.</strong> Chercher de même les cercles tangents aux trois droites \((OA)\), \((OB)\), \((AB)\) dont le centre est de la forme \((\rho,-\rho)\) ou \((-\rho,\rho)\), avec \(\rho\gt0\). Combien y a-t-il de cercles tangents aux trois droites ?</div>
  <p class="exo-part">Partie D — Distances</p>
  <div class="q"><strong>D1.</strong> Calculer \(KI^2\) et vérifier la relation \(KI^2=R(R-2r)\).</div>
  <div class="q"><strong>D2.</strong> Le centre d'un outil parcourt le cercle inscrit : \(M(t)=(1+\cos t,\ 1+\sin t)\). Exprimer la distance de \(M(t)\) à \((AB)\) en fonction de \(t\), et déterminer le point où elle est maximale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
    <p><strong>A1.</strong> \(\overrightarrow{AB}=(-4,3)\) ; avec \([\overrightarrow{AM},\overrightarrow{AB}]=0\) : \(3(x-4)+4y=0\), soit \((AB) : 3x+4y-12=0\), de vecteur normal \((3,4)\).</p>
    <p><strong>A2.</strong> En lisant les signes sur les sommets opposés (\(O\) donne \(-12\lt0\) pour \((AB)\)) : \(\mathcal T=\{x\geqslant0,\ y\geqslant0,\ 3x+4y-12\leqslant0\}\). \(E\) : \(6+4-12=-2\leqslant0\), \(E\in\mathcal T\). \(F\) : \(9+4-12=1\gt0\), \(F\notin\mathcal T\).</p>
    <p><strong>A3.</strong> L'aire vaut \(\frac12\big|[\overrightarrow{OA},\overrightarrow{OB}]\big|\), soit \(\frac12|4\times3-0|=6\ \text{dm}^2\). \(AB=\sqrt{16+9}=5\) (triangle rectangle 3-4-5).</p>
    <p><strong>B1.</strong> L'angle en \(O\) est droit : \(\overrightarrow{OA}\cdot\overrightarrow{OB}=0\), donc \(O\) est sur le cercle de diamètre \([AB]\), qui passe aussi par \(A\) et \(B\) : c'est le cercle circonscrit. Équation \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\) : \(x(x-4)+y(y-3)=0\), soit \((x-2)^2+\big(y-\frac32\big)^2=\frac{25}4\) ; \(K\big(2,\frac32\big)\), \(R=\frac52=\frac{AB}2\).</p>
    <p><strong>B2.</strong> Normale \(\overrightarrow{KO}=\big(-2,-\frac32\big)\), ou \((4,3)\) : tangente \(4x+3y=0\).</p>
    <p><strong>C1.</strong> La distance de \(\Omega_\rho\) à l'axe \((Ox)\) (\(y=0\)) vaut \(\rho\), de même pour \((Oy)\) : le cercle est tangent aux deux axes. Il est tangent à \((AB)\) si et seulement si \(\frac{|3\rho+4\rho-12|}{5}=\rho\), soit \(|7\rho-12|=5\rho\) : \(7\rho-12=5\rho\) donne \(\rho=6\), \(12-7\rho=5\rho\) donne \(\rho=1\).</p>
    <p><strong>C2.</strong> \(\Omega_1(1,1)\) : \(3+4-12=-5\lt0\), il est dans \(\mathcal T\) ; \(\Omega_6(6,6)\) : \(18+24-12=30\gt0\), il est hors de \(\mathcal T\). Le cercle inscrit est donc celui de centre \(I(1,1)\) et de rayon \(r=1\) : c'est le plus grand disque qu'on puisse découper (on l'admet). Points de contact : les projetés de \(I\), soit \((1,0)\), \((0,1)\), et sur \((AB)\) : \(\lambda=\frac{3+4-12}{25}=-\frac15\), \(I-\lambda(3,4)=\big(\frac85,\frac95\big)\) (contrôle : \(\frac{24+36}{5}=12\)).</p>
    <p><strong>C3.</strong> Pour \((\rho,-\rho)\) : \(\frac{|3\rho-4\rho-12|}{5}=\frac{\rho+12}{5}=\rho\), d'où \(\rho=3\) : centre \((3,-3)\), rayon 3. Pour \((-\rho,\rho)\) : \(\frac{|\rho-12|}{5}=\rho\) ; \(12-\rho=5\rho\) donne \(\rho=2\), et \(\rho-12=5\rho\) donne \(\rho=-3\lt0\), exclu : centre \((-2,2)\), rayon 2. Un centre équidistant des deux axes vérifie \(|x|=|y|\), donc est de l'une des trois formes étudiées (le cas \((-\rho,-\rho)\) donne \(\frac{7\rho+12}5=\rho\), impossible). Il y a donc quatre cercles tangents aux trois droites : le cercle inscrit (rayon 1) et trois cercles exinscrits (rayons 6, 3 et 2).</p>
    <p><strong>D1.</strong> \(KI^2=(2-1)^2+\big(\frac32-1\big)^2=\frac54\) et \(R(R-2r)=\frac52\times\frac12=\frac54\) : la relation (d'Euler) est vérifiée.</p>
    <p><strong>D2.</strong> En reportant \(x=1+\cos t\) et \(y=1+\sin t\) dans la formule de distance :</p>
    <div class="formula">$$d\big(M(t),(AB)\big)=\frac{|3+3\cos t+4+4\sin t-12|}{5}=\frac{|3\cos t+4\sin t-5|}{5} .$$</div>
    <p>Avec \(\cos\varphi=\frac35\), \(\sin\varphi=\frac45\), \(3\cos t+4\sin t=5\cos(t-\varphi)\leqslant5\), d'où \(d=1-\cos(t-\varphi)\). Elle est nulle pour \(t=\varphi\) (le point de contact \(\big(\frac85,\frac95\big)\)) et maximale, égale à 2, pour \(t=\varphi+\pi\) : point \(\big(1-\frac35,1-\frac45\big)=\big(\frac25,\frac15\big)\), diamétralement opposé au point de contact, sur la perpendiculaire à \((AB)\) passant par \(I\).</p>
  </div>
</div>
