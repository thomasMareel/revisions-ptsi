  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie A « Géométrie du plan » de la section « Géométrie du plan et de l'espace » du programme de PTSI (second semestre). Il reprend les acquis du lycée (repère, vecteurs, produit scalaire) dans un cadre plus général, ajoute le produit mixte, et met en place les gestes de base sur les droites et les cercles. La géométrie de l'espace (partie B) a son propre chapitre, Géométrie dans l'espace, qui suit exactement la même démarche avec le produit vectoriel. Ces outils servent ensuite partout : déterminants (aire orientée), nombres complexes, et en 2ᵉ année courbes paramétrées, coniques, courbure.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Modes de repérage</strong> : coordonnées cartésiennes ; coordonnées polaires d'un point du plan muni d'un repère orthonormé (§1).</li>
        <li><strong>Produit scalaire</strong> : norme euclidienne et distance ; définition géométrique \(\vec u\cdot\vec v=\|\vec u\|\,\|\vec v\|\cos(\vec u,\vec v)\) ; interprétation par la projection orthogonale ; bilinéarité, symétrie (démonstration non exigible) (§2).</li>
        <li><strong>Calcul en base orthonormée</strong> : expression du produit scalaire ; identité \(\|\vec u+\vec v\|^2=\|\vec u\|^2+\|\vec v\|^2+2\,\vec u\cdot\vec v\) et formule de polarisation ; caractérisation de l'orthogonalité (§3).</li>
        <li><strong>Produit mixte dans le plan orienté</strong> : définition géométrique \([\vec u,\vec v]=\|\vec u\|\,\|\vec v\|\sin(\vec u,\vec v)\), aire orientée d'un parallélogramme (la notion d'orientation est admise) ; bilinéarité, antisymétrie (démonstration non exigible) ; expression dans une base orthonormée directe ; caractérisation de la colinéarité (§4).</li>
        <li><strong>Droites</strong> : paramétrage et équation cartésienne d'une droite définie par un point et un vecteur directeur, par deux points distincts, par un point et un vecteur normal ; notation \(A+\operatorname{Vect}(\vec u)\) (§5).</li>
        <li><strong>Lignes de niveau</strong> de \(M\mapsto\vec u\cdot\overrightarrow{AM}\) et de \(M\mapsto[\vec u,\overrightarrow{AM}]\) ; application au régionnement du plan (§6).</li>
        <li><strong>Projeté orthogonal</strong> d'un point sur une droite ; application aux calculs de distances (§7).</li>
        <li><strong>Cercles</strong> : équation cartésienne et paramétrage en repère orthonormé ; caractérisation du cercle de diamètre \([AB]\) par \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\) (§8) ; exemples de problèmes d'intersection (§9).</li>
        <li><strong>Lien avec les nombres complexes</strong> (programme, « Nombres complexes », partie h) : distances, alignement et orthogonalité par les affixes ; le produit scalaire et le produit mixte lus sur \(\overline{z}\,z'\) (§10).</li>
      </ul>
      <p>Hors programme (en fin de chapitre) : les lignes de niveau de \(M\mapsto\frac{MA}{MB}\) (cercles d'Apollonius) et l'étude générale des similitudes. La géométrie de l'espace est au chapitre Géométrie dans l'espace.</p>

<div class="course-section">
  <div class="sec-num">§1 · REPÉRAGE DANS LE PLAN</div>
  <h2>Coordonnées cartésiennes et coordonnées polaires</h2>
  <div class="intro">Repérer un point, c'est le décrire par deux nombres. Les coordonnées cartésiennes conviennent aux droites et aux calculs de vecteurs ; les coordonnées polaires (une distance et un angle) aux situations qui tournent autour d'un point : cercles centrés à l'origine, rotations, mouvements circulaires en mécanique.</div>

  <div class="def-box">
    Un <strong>repère orthonormé</strong> \(\mathcal R=(O;\vec\imath,\vec\jmath)\) est formé d'un point \(O\), l'origine, et de deux vecteurs \(\vec\imath\), \(\vec\jmath\) unitaires et orthogonaux. Les <strong>coordonnées cartésiennes</strong> \((x,y)\) du point \(M\) sont définies par \(\overrightarrow{OM}=x\,\vec\imath+y\,\vec\jmath\). Si \(A(x_A,y_A)\) et \(B(x_B,y_B)\), alors \(\overrightarrow{AB}=(x_B-x_A,\ y_B-y_A)\) et le milieu de \([AB]\) est \(\big(\frac{x_A+x_B}{2},\frac{y_A+y_B}{2}\big)\).
  </div>
  <p>On note \(B=A+\vec u\) lorsque \(\overrightarrow{AB}=\vec u\). Le plan est <strong>orienté</strong> en choisissant un sens de rotation positif, le sens trigonométrique (inverse des aiguilles d'une montre) ; le repère est <strong>direct</strong> si l'on passe de \(\vec\imath\) à \(\vec\jmath\) par un quart de tour dans ce sens. Le programme admet cette notion d'orientation : tous les repères du chapitre sont orthonormés directs.</p>

  <h3>Coordonnées polaires</h3>
  <div class="def-box">
    Pour \(\theta\in\mathbb R\), on pose \(\vec e_r(\theta)=\cos\theta\,\vec\imath+\sin\theta\,\vec\jmath\), vecteur unitaire qui fait l'angle \(\theta\) avec \(\vec\imath\). Un couple \((r,\theta)\), avec \(r\geqslant0\), est un couple de <strong>coordonnées polaires</strong> de \(M\) si \(\overrightarrow{OM}=r\,\vec e_r(\theta)\), c'est-à-dire
    <div class="formula" data-nom="Coordonnées polaires">$$x=r\cos\theta,\qquad y=r\sin\theta .$$</div>
    Alors \(r=OM=\sqrt{x^2+y^2}\). Si \(M\neq O\), l'angle \(\theta\) est une mesure de l'angle orienté \((\vec\imath,\overrightarrow{OM})\), unique à \(2\pi\) près, déterminée par \(\cos\theta=\frac xr\) et \(\sin\theta=\frac yr\). Pour \(M=O\), \(r=0\) et \(\theta\) est quelconque.
  </div>

</figure>
  <p>On associe à \(\theta\) la <strong>base polaire</strong> \((\vec e_r,\vec e_\theta)\), avec \(\vec e_\theta(\theta)=\vec e_r\big(\theta+\frac\pi2\big)\), c'est-à-dire \(\vec e_\theta=-\sin\theta\,\vec\imath+\cos\theta\,\vec\jmath\). Elle est orthonormée directe et tourne avec \(M\) : en dérivant par rapport à \(\theta\), \(\dfrac{\mathrm d\vec e_r}{\mathrm d\theta}=\vec e_\theta\) et \(\dfrac{\mathrm d\vec e_\theta}{\mathrm d\theta}=-\vec e_r\). C'est la base de la cinématique en coordonnées polaires (mouvement circulaire, force centrale). Le chapitre Courbes planes paramétrées note ces vecteurs \(\vec u(\theta)\) et \(\vec v(\theta)\). Avec les nombres complexes, \((r,\theta)\) sont un module et un argument de l'affixe : \(x+iy=r\,e^{i\theta}\) (§10).</p>

  <div class="method-box">
    <strong>Exemple — passer d'un système à l'autre</strong>
    <ol>
      <li>\(M(-\sqrt3,1)\) : \(r=\sqrt{3+1}=2\), \(\cos\theta=-\frac{\sqrt3}{2}\) et \(\sin\theta=\frac12\), donc \(\theta=\frac{5\pi}{6}\) (à \(2\pi\) près).</li>
      <li>Le point de coordonnées polaires \(\big(4,-\frac{2\pi}{3}\big)\) : \(x=4\cos\big(-\frac{2\pi}3\big)=-2\) et \(y=4\sin\big(-\frac{2\pi}3\big)=-2\sqrt3\).</li>
      <li>Le cercle \(x^2+y^2=6x\) : en polaires, \(r^2=6r\cos\theta\), soit \(r=0\) ou \(r=6\cos\theta\). En cartésiennes, \((x-3)^2+y^2=9\) : cercle de centre \((3,0)\) et de rayon 3, qui passe par \(O\).</li>
      <li>La droite \(x=2\) : \(r\cos\theta=2\), soit \(r=\frac{2}{\cos\theta}\) pour \(\theta\in\big]-\frac\pi2,\frac\pi2\big[\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(\theta=\arctan\frac yx\). Cette formule ne vaut que pour \(x\gt0\) : pour \(M(-\sqrt3,1)\), elle donne \(-\frac\pi6\), l'angle du point opposé. Il faut lire le quadrant sur les signes de \(\cos\theta\) et de \(\sin\theta\). Certains textes autorisent aussi \(r\lt0\) (courbes polaires) : \((r,\theta)\) et \((-r,\theta+\pi)\) désignent alors le même point.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · PRODUIT SCALAIRE</div>
  <h2>Définition géométrique et projection orthogonale</h2>
  <div class="intro">Le produit scalaire de deux vecteurs est un nombre qui mesure à la fois les longueurs et les angles. C'est l'outil des questions d'orthogonalité : vecteur normal d'une droite, projeté d'un point, distance, angle droit inscrit dans un cercle. En physique, c'est le travail d'une force \(W=\vec F\cdot\overrightarrow{AB}\).</div>

  <div class="def-box">
    La <strong>norme euclidienne</strong> de \(\vec u=(x,y)\), dans une base orthonormée, est \(\|\vec u\|=\sqrt{x^2+y^2}\) (théorème de Pythagore). Elle mesure les distances :
    <div class="formula" data-nom="Distance de deux points (plan)">$$AB=\|\overrightarrow{AB}\|=\sqrt{(x_B-x_A)^2+(y_B-y_A)^2} .$$</div>
    Un vecteur de norme 1 est dit <strong>unitaire</strong> ; si \(\vec u\neq\vec 0\), \(\frac{\vec u}{\|\vec u\|}\) est unitaire.
  </div>
  <div class="def-box">
    Si \(\vec u\) et \(\vec v\) sont non nuls, leur <strong>produit scalaire</strong> est
    <div class="formula" data-nom="Produit scalaire (définition géométrique)">$$\vec u\cdot\vec v=\|\vec u\|\,\|\vec v\|\cos(\vec u,\vec v) ,$$</div>
    où \((\vec u,\vec v)\) est une mesure de l'angle orienté de \(\vec u\) à \(\vec v\) ; si \(\vec u=\vec 0\) ou \(\vec v=\vec 0\), on pose \(\vec u\cdot\vec v=0\). Le cosinus étant pair, le sens de l'angle n'importe pas : on peut prendre l'angle géométrique \(\theta\in[0,\pi]\).
  </div>
  <h3>Interprétation : la projection orthogonale</h3>
  <p>Soit \(\vec u=\overrightarrow{OA}\neq\vec 0\), \(\vec v=\overrightarrow{OB}\), et \(H\) le projeté orthogonal de \(B\) sur la droite \((OA)\). Dans le triangle \(OHB\) rectangle en \(H\), la mesure algébrique \(\overline{OH}\), comptée positivement dans le sens de \(\vec u\), vaut \(\|\vec v\|\cos\theta\). Donc</p>
  <div class="formula" data-nom="Produit scalaire et projection">$$\vec u\cdot\vec v=\|\vec u\|\times\overline{OH}=\overrightarrow{OA}\cdot\overrightarrow{OH} .$$</div>
  <p>Le produit scalaire ne « voit » de \(\vec v\) que sa composante le long de \(\vec u\) : il est positif si l'angle est aigu, nul s'il est droit, négatif s'il est obtus.</p>

</figure>
  <div class="prop-box">
    <strong>Propriétés.</strong> Pour tous vecteurs \(\vec u,\vec v,\vec w\) et réels \(\lambda,\mu\) :
    <ul>
      <li><strong>symétrie</strong> : \(\vec v\cdot\vec u=\vec u\cdot\vec v\) ;</li>
      <li><strong>bilinéarité</strong> : \((\lambda\vec u+\mu\vec v)\cdot\vec w\) vaut \(\lambda\,\vec u\cdot\vec w+\mu\,\vec v\cdot\vec w\), et de même à droite ;</li>
      <li>\(\vec u\cdot\vec u=\|\vec u\|^2\geqslant0\), avec égalité si et seulement si \(\vec u=\vec 0\) ;</li>
      <li>\(|\vec u\cdot\vec v|\leqslant\|\vec u\|\,\|\vec v\|\) (car \(|\cos|\leqslant1\)), avec égalité si et seulement si \(\vec u\) et \(\vec v\) sont colinéaires.</li>
    </ul>
    La démonstration de la bilinéarité n'est pas exigible : elle repose sur le fait que la projection orthogonale sur une droite conserve les sommes et les produits par un réel.
  </div>
  <div class="method-box">
    <strong>Exemple — triangle équilatéral et carré</strong>
    <ol>
      <li>Triangle équilatéral \(ABC\) de côté 4 : \(\overrightarrow{AB}\cdot\overrightarrow{AC}=4\times4\times\cos\frac\pi3=8\).</li>
      <li>Dans le même triangle, \(\overrightarrow{AB}\cdot\overrightarrow{BC}\) : l'angle de \(\overrightarrow{AB}\) à \(\overrightarrow{BC}\) n'est pas l'angle du triangle en \(B\), mais son supplémentaire \(\frac{2\pi}{3}\) (on met les deux vecteurs bout à bout depuis un même point). Donc \(\overrightarrow{AB}\cdot\overrightarrow{BC}=16\cos\frac{2\pi}3=-8\).</li>
      <li>Carré \(ABCD\) de côté 3 : le projeté de \(C\) sur \((AB)\) est \(B\), donc \(\overrightarrow{AB}\cdot\overrightarrow{AC}\) vaut \(\overrightarrow{AB}\cdot\overrightarrow{AB}=9\), sans calculer \(AC=3\sqrt2\) ni l'angle.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre l'angle du triangle au lieu de l'angle entre les vecteurs. Il faut faire partir les deux vecteurs du même point : \(\overrightarrow{AB}\cdot\overrightarrow{BC}\) est égal à \(-\overrightarrow{BA}\cdot\overrightarrow{BC}\), et c'est \(\overrightarrow{BA}\cdot\overrightarrow{BC}\) qui fait intervenir l'angle \(\widehat{ABC}\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · PRODUIT SCALAIRE EN BASE ORTHONORMÉE</div>
  <h2>Calculer, polariser, tester l'orthogonalité</h2>
  <div class="intro">Dès que l'on dispose de coordonnées, le produit scalaire se calcule par une formule très simple, à condition que la base soit orthonormée. Les identités remarquables relient produit scalaire et normes ; elles donnent notamment la formule d'Al-Kashi.</div>

  <div class="prop-box">
    <strong>Expression en base orthonormée.</strong> Si \(\vec u=(x,y)\) et \(\vec v=(x',y')\) dans une base orthonormée \((\vec\imath,\vec\jmath)\) :
    <div class="formula" data-nom="Produit scalaire en base orthonormée">$$\vec u\cdot\vec v=xx'+yy',\qquad \|\vec u\|=\sqrt{x^2+y^2} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Développer par bilinéarité.</span>
    <div class="content"><p>Comme \(\vec\imath\cdot\vec\imath=\vec\jmath\cdot\vec\jmath=1\) et \(\vec\imath\cdot\vec\jmath=0\) (vecteurs unitaires orthogonaux), la bilinéarité donne</p>
    <div class="formula">$$\begin{aligned}(x\vec\imath+y\vec\jmath)\cdot(x'\vec\imath+y'\vec\jmath)&=xx'\,\vec\imath\cdot\vec\imath+(xy'+yx')\,\vec\imath\cdot\vec\jmath+yy'\,\vec\jmath\cdot\vec\jmath\\ &=xx'+yy' .\end{aligned}$$</div></div>
  </div>
  <div class="prop-box">
    <strong>Identités remarquables et polarisation.</strong> Par bilinéarité et symétrie :
    <div class="formula" data-nom="Identités remarquables (produit scalaire)">$$\begin{aligned}\|\vec u+\vec v\|^2&=\|\vec u\|^2+\|\vec v\|^2+2\,\vec u\cdot\vec v\\ \|\vec u-\vec v\|^2&=\|\vec u\|^2+\|\vec v\|^2-2\,\vec u\cdot\vec v\\ (\vec u+\vec v)\cdot(\vec u-\vec v)&=\|\vec u\|^2-\|\vec v\|^2\end{aligned}$$</div>
    d'où la <strong>formule de polarisation</strong>, qui exprime le produit scalaire à l'aide de normes seulement :
    <div class="formula" data-nom="Formule de polarisation">$$\vec u\cdot\vec v=\frac12\Big(\|\vec u+\vec v\|^2-\|\vec u\|^2-\|\vec v\|^2\Big)=\frac14\Big(\|\vec u+\vec v\|^2-\|\vec u-\vec v\|^2\Big) .$$</div>
  </div>
  <p>Appliquée à \(\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}\), la deuxième identité est la <strong>formule d'Al-Kashi</strong> : \(BC^2=AB^2+AC^2-2\,AB\times AC\times\cos\widehat{A}\). Elle généralise le théorème de Pythagore.</p>
  <div class="prop-box">
    <strong>Orthogonalité.</strong> \(\vec u\) et \(\vec v\) sont orthogonaux si et seulement si \(\vec u\cdot\vec v=0\), c'est-à-dire \(xx'+yy'=0\) en base orthonormée (le vecteur nul est orthogonal à tout vecteur). De façon équivalente, \(\|\vec u+\vec v\|^2=\|\vec u\|^2+\|\vec v\|^2\) (Pythagore). En particulier, le vecteur \((-b,a)\) est orthogonal à \((a,b)\) et de même norme : c'est son image par le quart de tour direct.
  </div>
  <div class="method-box">
    <strong>Exemple — angle, polarisation, Al-Kashi</strong>
    <ol>
      <li>\(\vec u=(3,1)\), \(\vec v=(1,2)\) : \(\vec u\cdot\vec v=3+2=5\), \(\|\vec u\|=\sqrt{10}\), \(\|\vec v\|=\sqrt5\), donc \(\cos\theta=\frac{5}{\sqrt{50}}=\frac{1}{\sqrt2}\) et \(\theta=\frac\pi4\).</li>
      <li>Contrôle par polarisation : \(\vec u+\vec v=(4,3)\), de norme 5, et \(\frac12(25-10-5)=5\).</li>
      <li>Un triangle a pour côtés \(AB=5\), \(AC=8\) et pour angle \(\widehat A=\frac\pi3\) : comme \(2\times5\times8\times\frac12=40\), \(BC^2=25+64-40=49\), donc \(BC=7\).</li>
      <li>Pour quel réel \(m\) les vecteurs \((m,3)\) et \((2,m-5)\) sont-ils orthogonaux ? \(2m+3(m-5)=0\), soit \(m=3\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer \(xx'+yy'\) avec des coordonnées dans une base qui n'est pas orthonormée (par exemple une base de vecteurs non unitaires). La formule, comme \(\|\vec u\|=\sqrt{x^2+y^2}\), n'est valable qu'en base orthonormée. Autre piège : \(\vec u\cdot\vec v=\vec u\cdot\vec w\) n'entraîne pas \(\vec v=\vec w\), seulement \(\vec u\perp(\vec v-\vec w)\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · PRODUIT MIXTE DANS LE PLAN</div>
  <h2>Aire orientée et colinéarité</h2>
  <div class="intro">Le produit scalaire fait intervenir le cosinus ; le produit mixte, le sinus. C'est l'aire, comptée avec un signe, du parallélogramme construit sur deux vecteurs. Il est nul exactement quand les vecteurs sont colinéaires : c'est le test d'alignement et la clé des équations de droites. On l'appelle aussi déterminant de \(\vec u\) et \(\vec v\).</div>

  <div class="def-box">
    Le plan étant orienté, si \(\vec u\) et \(\vec v\) sont non nuls, leur <strong>produit mixte</strong> est le réel
    <div class="formula" data-nom="Produit mixte (définition géométrique)">$$[\vec u,\vec v]=\|\vec u\|\,\|\vec v\|\sin(\vec u,\vec v) ,$$</div>
    où \((\vec u,\vec v)\) est une mesure de l'angle orienté de \(\vec u\) à \(\vec v\) ; si \(\vec u=\vec 0\) ou \(\vec v=\vec 0\), \([\vec u,\vec v]=0\). On le note aussi \(\det(\vec u,\vec v)\).
  </div>
  <p><strong>Interprétation.</strong> Le parallélogramme construit sur \(\vec u\) et \(\vec v\) a pour base \(\|\vec u\|\) et pour hauteur \(h=\|\vec v\|\,|\sin(\vec u,\vec v)|\) : son aire est \(|[\vec u,\vec v]|\). Le signe donne l'orientation : \([\vec u,\vec v]\gt0\) si l'on tourne de \(\vec u\) vers \(\vec v\) dans le sens direct par un angle de \(]0,\pi[\), autrement dit si \((\vec u,\vec v)\) est une base directe. Contrairement au produit scalaire, le sens de l'angle compte, car le sinus est impair.</p>

</figure>
  <div class="prop-box">
    <strong>Propriétés</strong> (démonstrations non exigibles).
    <ul>
      <li><strong>Bilinéarité</strong> : \([\lambda\vec u+\mu\vec v,\vec w]=\lambda[\vec u,\vec w]+\mu[\vec v,\vec w]\), et de même à droite.</li>
      <li><strong>Antisymétrie</strong> : \([\vec v,\vec u]=-[\vec u,\vec v]\), donc \([\vec u,\vec u]=0\).</li>
      <li><strong>Expression dans une base orthonormée directe</strong> : si \(\vec u=(x,y)\) et \(\vec v=(x',y')\),
      <div class="formula" data-nom="Produit mixte en base orthonormée directe">$$[\vec u,\vec v]=\begin{vmatrix} x & x'\\ y & y'\end{vmatrix}=xy'-yx' .$$</div></li>
      <li><strong>Colinéarité</strong> : \(\vec u\) et \(\vec v\) sont colinéaires si et seulement si \([\vec u,\vec v]=0\). Trois points \(A\), \(B\), \(C\) sont alignés si et seulement si \([\overrightarrow{AB},\overrightarrow{AC}]=0\).</li>
      <li><strong>Aire d'un triangle</strong> : \(\mathcal A(ABC)=\frac12\big|[\overrightarrow{AB},\overrightarrow{AC}]\big|\).</li>
      <li>\((\vec u\cdot\vec v)^2+[\vec u,\vec v]^2=\|\vec u\|^2\,\|\vec v\|^2\) (car \(\cos^2+\sin^2=1\)).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'expression en coordonnées et le critère de colinéarité.</span>
    <div class="content"><p>Dans une base orthonormée directe, \([\vec\imath,\vec\jmath]=1\times1\times\sin\frac\pi2=1\), \([\vec\jmath,\vec\imath]=-1\) et \([\vec\imath,\vec\imath]=[\vec\jmath,\vec\jmath]=0\). La bilinéarité donne alors</p>
    <div class="formula">$$[x\vec\imath+y\vec\jmath,\ x'\vec\imath+y'\vec\jmath]=xy'[\vec\imath,\vec\jmath]+yx'[\vec\jmath,\vec\imath]=xy'-yx' .$$</div>
    <p>Colinéarité : si l'un des vecteurs est nul, les deux membres sont vrais. Sinon, \([\vec u,\vec v]=0\) équivaut à \(\sin(\vec u,\vec v)=0\), c'est-à-dire à \((\vec u,\vec v)\equiv0\pmod\pi\), ce qui signifie que \(\vec v\) a la direction de \(\vec u\).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — aire, orientation, alignement</strong>
    <ol>
      <li>\(A(1,1)\), \(B(5,2)\), \(C(2,4)\) : \(\overrightarrow{AB}=(4,1)\), \(\overrightarrow{AC}=(1,3)\), \([\overrightarrow{AB},\overrightarrow{AC}]=4\times3-1\times1=11\). Le triangle a pour aire \(\frac{11}2\), et il est direct (on tourne de \(B\) vers \(C\) autour de \(A\) dans le sens trigonométrique).</li>
      <li>Contrôle : \(\overrightarrow{AB}\cdot\overrightarrow{AC}=7\), et \(7^2+11^2=170\), qui est bien \(AB^2\times AC^2=17\times10\).</li>
      <li>\(A(1,2)\), \(B(3,5)\), \(D(7,11)\) : \(\overrightarrow{AB}=(2,3)\), \(\overrightarrow{AD}=(6,9)\) et \([\overrightarrow{AB},\overrightarrow{AD}]=2\times9-3\times6=0\) : les trois points sont alignés.</li>
      <li>Les vecteurs \((m,2)\) et \((3,m+1)\) sont colinéaires si et seulement si \(m(m+1)-6=0\), soit \(m=2\) ou \(m=-3\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier la valeur absolue (une aire est positive) ou le facteur \(\frac12\) pour un triangle ; ou écrire \(xy'+yx'\). Moyen sûr : écrire les deux vecteurs <em>en colonnes</em> côte à côte et faire « diagonale descendante moins diagonale montante ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DROITES DU PLAN</div>
  <h2>Paramétrage, équation cartésienne, vecteur normal</h2>
  <div class="intro">Une droite se donne par un point et une direction, par deux points, ou par un point et une direction orthogonale. Les deux premières données conduisent naturellement à un paramétrage, la troisième à une équation cartésienne ; le produit mixte et le produit scalaire font le pont entre les deux.</div>

  <div class="def-box">
    Soit \(A\) un point et \(\vec u\neq\vec 0\). La <strong>droite</strong> passant par \(A\) et dirigée par \(\vec u\) est \(\mathcal D=A+\operatorname{Vect}(\vec u)=\{A+t\,\vec u,\ t\in\mathbb R\}\). Un <strong>paramétrage</strong> en est, pour \(\vec u=(\alpha,\beta)\) :
    <div class="formula" data-nom="Paramétrage d'une droite">$$\begin{cases} x=x_A+t\,\alpha\\ y=y_A+t\,\beta\end{cases}\qquad t\in\mathbb R .$$</div>
    Un <strong>vecteur normal</strong> à \(\mathcal D\) est un vecteur non nul orthogonal à \(\vec u\).
  </div>
  <div class="prop-box">
    <strong>Équation cartésienne.</strong> Toute droite admet une équation de la forme \(ax+by+c=0\) avec \((a,b)\neq(0,0)\). Réciproquement, une telle équation définit une droite, de vecteur normal \(\vec n=(a,b)\) et de vecteur directeur \(\vec u=(-b,a)\). Les équations d'une même droite sont proportionnelles.
    <ul>
      <li><strong>Par un point et un vecteur directeur</strong> \(\vec u\) : \(M\in\mathcal D\iff[\overrightarrow{AM},\vec u]=0\).</li>
      <li><strong>Par deux points distincts</strong> \(A\) et \(B\) : \(\vec u=\overrightarrow{AB}\), et \(M\in(AB)\iff[\overrightarrow{AM},\overrightarrow{AB}]=0\).</li>
      <li><strong>Par un point et un vecteur normal</strong> \(\vec n=(a,b)\) : \(M\in\mathcal D\iff\vec n\cdot\overrightarrow{AM}=0\), soit \(a(x-x_A)+b(y-y_A)=0\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Colinéarité et orthogonalité, dans le plan.</span>
    <div class="content"><p>Pour \(\vec u=(\alpha,\beta)\neq\vec 0\), un point \(M\) est sur \(A+\operatorname{Vect}(\vec u)\) si et seulement si \(\overrightarrow{AM}\) est colinéaire à \(\vec u\), soit (§4) \([\overrightarrow{AM},\vec u]=(x-x_A)\beta-(y-y_A)\alpha=0\) : c'est une équation \(ax+by+c=0\) avec \((a,b)=(\beta,-\alpha)\neq(0,0)\).</p>
    <p>Réciproquement, si \((a,b)\neq(0,0)\), l'équation a au moins une solution \(A(x_A,y_A)\) (si \(b\neq0\), prendre \(x_A=0\), \(y_A=-\frac cb\) ; sinon \(x_A=-\frac ca\), \(y_A=0\)), et \(c=-ax_A-by_A\). L'équation s'écrit donc \(a(x-x_A)+b(y-y_A)=0\), c'est-à-dire \([\overrightarrow{AM},(-b,a)]=0\) : c'est la droite passant par \(A\) dirigée par \((-b,a)\), qui est orthogonal à \((a,b)\).</p></div>
  </div>

</figure>
  <p><strong>Cas particuliers.</strong> Une droite non parallèle à l'axe des ordonnées s'écrit \(y=mx+p\) : \(m\) est sa <strong>pente</strong>, \((1,m)\) un vecteur directeur et \((m,-1)\) un vecteur normal. Les droites parallèles à \((Oy)\) s'écrivent \(x=k\).</p>
  <h3>Positions relatives de deux droites</h3>
  <p>Soit \(\mathcal D : ax+by+c=0\) et \(\mathcal D' : a'x+b'y+c'=0\). Elles sont <strong>parallèles</strong> (confondues ou disjointes) si et seulement si leurs vecteurs normaux sont colinéaires, c'est-à-dire \(ab'-a'b=0\) ; sinon elles sont <strong>sécantes</strong> en un point unique, solution d'un système de Cramer. Elles sont <strong>perpendiculaires</strong> si et seulement si \(aa'+bb'=0\).</p>
  <div class="method-box">
    <strong>Exemple — de deux points à l'équation, puis au point d'intersection</strong>
    <ol>
      <li>Droite \((AB)\) avec \(A(2,-1)\), \(B(5,1)\) : \(\overrightarrow{AB}=(3,2)\), et la condition \([\overrightarrow{AM},\overrightarrow{AB}]=0\) s'écrit \(2(x-2)-3(y+1)=0\), soit \(2x-3y-7=0\). Contrôle : \(B\) donne \(10-3-7=0\).</li>
      <li>Paramétrage : \(x=2+3t\), \(y=-1+2t\), \(t\in\mathbb R\). Vecteur normal : \((2,-3)\).</li>
      <li>Intersection avec \(\mathcal D' : x+y=3\) : comme \(2\times1-1\times(-3)=5\neq0\), elles sont sécantes. En reportant le paramétrage : \(1+5t=3\), \(t=\frac25\), point \(\big(\frac{16}5,-\frac15\big)\).</li>
      <li>Par \(C(1,4)\) : la parallèle à \((AB)\) est \(2x-3y+10=0\) (même normale, et \(2-12+10=0\)) ; la perpendiculaire, de normale \(\overrightarrow{AB}=(3,2)\), est \(3x+2y-11=0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre \((a,b)\) pour un vecteur directeur de \(ax+by+c=0\). C'est un vecteur <em>normal</em> ; un vecteur directeur est \((-b,a)\). Et une droite a une infinité d'équations (toutes proportionnelles) et de paramétrages : deux réponses différentes peuvent être justes, on les compare sur un point et une direction.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LIGNES DE NIVEAU ET RÉGIONNEMENT</div>
  <h2>Ensembles de points définis par une égalité ou une inégalité</h2>
  <div class="intro">Une ligne de niveau d'une fonction \(f\) du plan est l'ensemble des points où \(f\) prend une valeur donnée. Pour les deux fonctions « affines » du programme, ce sont des familles de droites parallèles. Les inégalités correspondantes découpent le plan en demi-plans : c'est le régionnement, qui sert à décrire une zone (intérieur d'un polygone, zone autorisée d'un robot) par des inéquations.</div>

  <div class="prop-box">
    <strong>Lignes de niveau.</strong> Soit \(A\) un point, \(\vec u\neq\vec 0\) et \(k\in\mathbb R\).
    <ul>
      <li>\(\{M : \vec u\cdot\overrightarrow{AM}=k\}\) est la droite de vecteur normal \(\vec u\) qui passe par \(A+\frac{k}{\|\vec u\|^2}\,\vec u\) : les lignes de niveau sont <strong>orthogonales à \(\vec u\)</strong>.</li>
      <li>\(\{M : [\vec u,\overrightarrow{AM}]=k\}\) est la droite dirigée par \(\vec u\), à la distance \(\frac{|k|}{\|\vec u\|}\) de \(A+\operatorname{Vect}(\vec u)\) : les lignes de niveau sont <strong>parallèles à \(\vec u\)</strong>.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux équations de droites.</span>
    <div class="content"><p>Avec \(\vec u=(a,b)\), \(\vec u\cdot\overrightarrow{AM}=k\) s'écrit \(a(x-x_A)+b(y-y_A)-k=0\) : équation d'une droite de vecteur normal \(\vec u\). Le point \(A+\lambda\vec u\) y est si et seulement si \(\lambda\|\vec u\|^2=k\).</p>
    <p>De même, \([\vec u,\overrightarrow{AM}]=a(y-y_A)-b(x-x_A)=k\) est l'équation d'une droite de vecteur normal \((-b,a)\), donc dirigée par \(\vec u\). Pour \(\vec w=(-b,a)\), on a \([\vec u,\vec w]=a^2+b^2=\|\vec u\|^2\) : le point \(A+\frac{k}{\|\vec u\|^2}\vec w\) est sur la ligne de niveau \(k\), à la distance \(\frac{|k|}{\|\vec u\|^2}\|\vec w\|=\frac{|k|}{\|\vec u\|}\) de \(A\) dans une direction orthogonale à \(\vec u\).</p></div>
  </div>

</figure>
  <div class="prop-box">
    <strong>Régionnement.</strong> La droite \(\mathcal D : ax+by+c=0\) partage le plan en deux <strong>demi-plans ouverts</strong> : \(\{ax+by+c\gt0\}\), du côté vers lequel pointe le vecteur normal \(\vec n=(a,b)\), et \(\{ax+by+c\lt0\}\), de l'autre côté. Deux points \(P\), \(Q\) hors de \(\mathcal D\) sont du même côté si et seulement si \(f(P)\) et \(f(Q)\) ont le même signe, où \(f(x,y)=ax+by+c\) ; sinon, le segment \([PQ]\) coupe \(\mathcal D\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Décomposer sur la normale.</span>
    <div class="content"><p>Soit \(A\in\mathcal D\). Alors \(f(M)=\vec n\cdot\overrightarrow{AM}\). Tout point s'écrit \(M=H+\lambda\vec n\) avec \(H\in\mathcal D\) (son projeté orthogonal, §7), et \(f(M)=\vec n\cdot\overrightarrow{AH}+\lambda\|\vec n\|^2=\lambda\|\vec n\|^2\), du signe de \(\lambda\) : positif exactement du côté où pointe \(\vec n\). Sur le segment, \(t\mapsto f\big(P+t\,\overrightarrow{PQ}\big)\) est affine en \(t\) : si elle change de signe entre \(t=0\) et \(t=1\), elle s'annule entre les deux.</p></div>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · PROJETÉ ORTHOGONAL ET DISTANCES</div>
  <h2>Distance d'un point à une droite</h2>
  <div class="intro">La distance d'un point à une droite est la plus courte distance de ce point à un point de la droite. Elle est atteinte au projeté orthogonal, et deux formules directes la donnent : l'une à partir d'une équation cartésienne, l'autre à partir d'un point et d'un vecteur directeur.</div>

  <div class="def-box">
    Soit \(\mathcal D\) une droite et \(M\) un point. Le <strong>projeté orthogonal</strong> de \(M\) sur \(\mathcal D\) est l'unique point \(H\) de \(\mathcal D\) tel que \(\overrightarrow{HM}\) soit orthogonal à \(\mathcal D\). Si \(\mathcal D=A+\operatorname{Vect}(\vec u)\) :
    <div class="formula" data-nom="Projeté orthogonal sur une droite">$$H=A+\frac{\overrightarrow{AM}\cdot\vec u}{\|\vec u\|^2}\,\vec u .$$</div>
  </div>
  <div class="prop-box">
    <strong>Distance d'un point à une droite.</strong> La <strong>distance</strong> \(d(M,\mathcal D)\) est le minimum de \(MP\) pour \(P\in\mathcal D\) ; il est atteint en \(P=H\) seulement. Si \(\mathcal D=A+\operatorname{Vect}(\vec u)\), ou si \(\mathcal D : ax+by+c=0\) et \(M(x_0,y_0)\) :
    <div class="formula" data-nom="Distance d'un point à une droite (plan)">$$d(M,\mathcal D)=MH=\frac{\big|[\vec u,\overrightarrow{AM}]\big|}{\|\vec u\|}=\frac{|ax_0+by_0+c|}{\sqrt{a^2+b^2}} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pythagore, puis une aire ou une projection sur la normale.</span>
    <div class="content"><p><strong>Projeté.</strong> On cherche \(H=A+t\vec u\) avec \(\overrightarrow{HM}\cdot\vec u=0\), soit \(\overrightarrow{AM}\cdot\vec u-t\|\vec u\|^2=0\) : une seule valeur de \(t\), celle de la formule.</p>
    <p><strong>Minimalité.</strong> Pour \(P\in\mathcal D\), le triangle \(PHM\) est rectangle en \(H\) : \(MP^2=MH^2+HP^2\geqslant MH^2\), avec égalité si et seulement si \(P=H\).</p>
    <p><strong>Formule du produit mixte.</strong> Le parallélogramme construit sur \(\vec u\) et \(\overrightarrow{AM}\) a pour aire \(\big|[\vec u,\overrightarrow{AM}]\big|\) ; c'est aussi sa base \(\|\vec u\|\) multipliée par sa hauteur \(MH\).</p>
    <p><strong>Formule de l'équation.</strong> Avec \(\vec n=(a,b)\), \(\overrightarrow{HM}\) est colinéaire à \(\vec n\) : \(M=H+\lambda\vec n\). Comme \(H\in\mathcal D\), \(ax_0+by_0+c=\lambda(a^2+b^2)\) (même calcul qu'au §6), d'où \(MH=|\lambda|\,\|\vec n\|=\frac{|ax_0+by_0+c|}{\sqrt{a^2+b^2}}\).</p></div>
  </div>

  <p>Le <strong>symétrique</strong> de \(M\) par rapport à \(\mathcal D\) (image par la réflexion d'axe \(\mathcal D\)) est le point \(M'\) tel que \(H\) soit le milieu de \([MM']\) : \(M'=2H-M\), c'est-à-dire \(\overrightarrow{OM'}=2\overrightarrow{OH}-\overrightarrow{OM}\). La distance de deux droites parallèles \(ax+by+c=0\) et \(ax+by+c'=0\) vaut \(\frac{|c-c'|}{\sqrt{a^2+b^2}}\) (distance d'un point de l'une à l'autre).</p>
  <div class="method-box">
    <strong>Exemple — par l'équation, puis par un paramétrage</strong>
    <ol>
      <li>\(M(4,3)\) et \(\mathcal D : x+2y-5=0\) : \(d=\frac{|4+6-5|}{\sqrt5}=\frac{5}{\sqrt5}=\sqrt5\).</li>
      <li>Projeté : \(M=H+\lambda\vec n\) avec \(\lambda=\frac{4+6-5}{5}=1\), donc \(H=M-\vec n=(3,1)\). Contrôle : \(3+2-5=0\) et \(MH=\|(1,2)\|=\sqrt5\). Symétrique : \(M'=2H-M=(2,-1)\).</li>
      <li>\(\mathcal D'=A+\operatorname{Vect}(\vec u)\) avec \(A(0,1)\), \(\vec u=(3,4)\), et \(N(5,1)\) : \(\overrightarrow{AN}=(5,0)\), \([\vec u,\overrightarrow{AN}]=3\times0-4\times5=-20\), donc \(d(N,\mathcal D')=\frac{20}{5}=4\).</li>
      <li>Projeté : \(\frac{\overrightarrow{AN}\cdot\vec u}{\|\vec u\|^2}=\frac{15}{25}=\frac35\), \(H'=\big(\frac95,\frac{17}5\big)\), et \(\overrightarrow{H'N}=\big(\frac{16}5,-\frac{12}5\big)\), de norme \(\frac{20}{5}=4\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : oublier de diviser par \(\sqrt{a^2+b^2}\) (inutile seulement si \((a,b)\) est unitaire), ou garder le signe : une distance est positive. Le signe de \(ax_0+by_0+c\) n'est pas perdu pour autant : il dit de quel côté de \(\mathcal D\) est \(M\) (§6).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CERCLES</div>
  <h2>Équation, paramétrage, cercle de diamètre [AB]</h2>
  <div class="intro">Le cercle est l'ensemble des points à distance fixée d'un centre. Son équation se reconnaît en complétant des carrés ; son paramétrage vient des coordonnées polaires. La caractérisation par un angle droit, \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\), est l'outil le plus rapide pour écrire un cercle de diamètre donné.</div>

  <div class="def-box">
    Le <strong>cercle</strong> \(\mathcal C\) de centre \(\Omega(a,b)\) et de rayon \(R\gt0\) est l'ensemble des points \(M\) tels que \(\Omega M=R\). En repère orthonormé :
    <div class="formula" data-nom="Cercle : équation et paramétrage">$$(x-a)^2+(y-b)^2=R^2\iff\exists t\in\mathbb R,\ \begin{cases} x=a+R\cos t\\ y=b+R\sin t\end{cases}$$</div>
    Le paramétrage est une bijection de \([0,2\pi[\) sur \(\mathcal C\) : \(t\) est l'angle polaire de \(\overrightarrow{\Omega M}\).
  </div>
  <p><strong>Reconnaître un cercle.</strong> Une équation \(x^2+y^2+\alpha x+\beta y+\gamma=0\) (mêmes coefficients devant \(x^2\) et \(y^2\), pas de terme en \(xy\)) se met sous la forme \((x-a)^2+(y-b)^2=k\) en complétant les carrés. C'est un cercle de rayon \(\sqrt k\) si \(k\gt0\), le seul point \(\Omega\) si \(k=0\), l'ensemble vide si \(k\lt0\).</p>
  <div class="prop-box">
    <strong>Cercle de diamètre \([AB]\).</strong> Pour \(A\neq B\), le cercle de diamètre \([AB]\) (centre le milieu \(I\), rayon \(\frac{AB}2\)) est l'ensemble des points \(M\) tels que
    <div class="formula" data-nom="Cercle de diamètre [AB]">$$\overrightarrow{MA}\cdot\overrightarrow{MB}=0\iff(x-x_A)(x-x_B)+(y-y_A)(y-y_B)=0 .$$</div>
    Autrement dit, un point \(M\) distinct de \(A\) et de \(B\) voit \([AB]\) sous un angle droit si et seulement s'il est sur ce cercle.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Faire apparaître le milieu \(I\).</span>
    <div class="content"><p>Comme \(\overrightarrow{IB}=-\overrightarrow{IA}\) :</p>
    <div class="formula">$$\overrightarrow{MA}\cdot\overrightarrow{MB}=\big(\overrightarrow{MI}+\overrightarrow{IA}\big)\cdot\big(\overrightarrow{MI}-\overrightarrow{IA}\big)=MI^2-IA^2 .$$</div>
    <p>Donc \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\iff MI=IA=\frac{AB}2\).</p></div>
  </div>
  <p><strong>Tangente.</strong> La tangente à \(\mathcal C\) en un point \(M_0\) est la droite passant par \(M_0\) et orthogonale au rayon \([\Omega M_0]\) : \(\overrightarrow{\Omega M_0}\cdot\overrightarrow{M_0M}=0\). C'est la seule droite passant par \(M_0\) qui ne recoupe pas le cercle (§9).</p>

      <li>\(x^2+y^2+2x-4y+6=0\) s'écrit \((x+1)^2+(y-2)^2=-1\) : ensemble vide.</li>

      <div class="formula">$$(x-1)(x-5)+(y-2)(y+2)=0 ,$$</div>
      soit \(x^2+y^2-6x+1=0\), c'est-à-dire \((x-3)^2+y^2=8\) : centre \(I(3,0)\), rayon \(2\sqrt2=\frac{AB}2\).</li>

</div>

<div class="course-section">
  <div class="sec-num">§9 · INTERSECTIONS</div>
  <h2>Droite et cercle, deux cercles</h2>
  <div class="intro">Les problèmes d'intersection se ramènent à un système. Avant de calculer, une comparaison de distances prévoit le nombre de solutions ; le calcul se fait ensuite en reportant un paramétrage, ou en remplaçant deux cercles par un cercle et une droite.</div>

  <div class="prop-box">
    <strong>Droite et cercle.</strong> Soit \(\mathcal C\) de centre \(\Omega\) et de rayon \(R\), \(\mathcal D\) une droite, \(d=d(\Omega,\mathcal D)\) et \(H\) le projeté de \(\Omega\) sur \(\mathcal D\).
    <ul>
      <li>Si \(d\lt R\) : deux points, symétriques par rapport à \(H\) ; la corde a pour longueur \(2\sqrt{R^2-d^2}\).</li>
      <li>Si \(d=R\) : le seul point \(H\) ; \(\mathcal D\) est <strong>tangente</strong> à \(\mathcal C\) en \(H\).</li>
      <li>Si \(d\gt R\) : aucun point.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pythagore dans le triangle \(\Omega HM\).</span>
    <div class="content"><p>Pour \(M\in\mathcal D\), \(\Omega M^2=d^2+HM^2\). Donc \(M\in\mathcal C\iff HM^2=R^2-d^2\) : deux points de \(\mathcal D\) à la distance \(\sqrt{R^2-d^2}\) de \(H\) si \(R^2-d^2\gt0\), le point \(H\) si \(R^2=d^2\), aucun sinon. En reportant un paramétrage de \(\mathcal D\) dans l'équation de \(\mathcal C\), on obtient une équation du second degré en \(t\) dont le discriminant a le signe de \(R^2-d^2\).</p></div>
  </div>
  <div class="prop-box">
    <strong>Deux cercles.</strong> Soit \(\mathcal C : x^2+y^2+\alpha x+\beta y+\gamma=0\) et \(\mathcal C' : x^2+y^2+\alpha' x+\beta' y+\gamma'=0\), de centres \(\Omega\neq\Omega'\). En retranchant les équations, on obtient l'équation d'une droite \(\Delta\), orthogonale à \((\Omega\Omega')\), et \(\mathcal C\cap\mathcal C'=\mathcal C\cap\Delta\). Les cercles se coupent en deux points si \(|R-R'|\lt\Omega\Omega'\lt R+R'\), sont tangents si \(\Omega\Omega'=R+R'\) ou \(\Omega\Omega'=|R-R'|\), et sont disjoints sinon.
  </div>
  <p>La différence \((\alpha-\alpha')x+(\beta-\beta')y+(\gamma-\gamma')=0\) a pour vecteur normal \((\alpha-\alpha',\beta-\beta')=2\,\overrightarrow{\Omega\Omega'}\), puisque le centre de \(\mathcal C\) est \(\big(-\frac\alpha2,-\frac\beta2\big)\) : c'est bien une droite si les centres sont distincts. Pour deux cercles concentriques et distincts, la différence est une équation impossible : aucun point commun.</p>

    <strong>Exemple — une droite, puis un second cercle</strong>
    <ol>
      <li>\(\mathcal C : x^2+y^2=25\) et \(\mathcal D : x+2y=5\) : \(d(O,\mathcal D)=\frac{5}{\sqrt5}=\sqrt5\lt5\), deux points. Avec \(x=5-2y\) : \((5-2y)^2+y^2=25\), soit \(5y^2-20y=0\), d'où \(y=0\) ou \(y=4\) : points \((5,0)\) et \((-3,4)\).</li>
      <li>Contrôle : la corde mesure \(\sqrt{8^2+4^2}=4\sqrt5\), et \(2\sqrt{25-5}=4\sqrt5\).</li>

    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : s'arrêter à la droite \(\Delta\) obtenue en retranchant les équations. Elle contient les points communs, mais elle n'est pas l'intersection : il reste à la couper avec l'un des cercles (et les cercles peuvent même être disjoints alors que \(\Delta\) existe toujours).</div>
</div>

<div class="course-section">
  <div class="sec-num">§10 · LIEN AVEC LES NOMBRES COMPLEXES</div>
  <h2>Produit scalaire et produit mixte par les affixes</h2>
  <div class="intro">Identifier le plan à \(\mathbb C\) (le point \(M(x,y)\) a pour affixe \(z=x+iy\)) donne un second langage pour la géométrie plane. Le chapitre Nombres complexes traduit déjà distances et angles ; une seule formule y relie les deux produits de ce chapitre.</div>

  <div class="prop-box">
    <strong>Produits et affixes.</strong> Si \(\vec u\) et \(\vec v\) ont pour affixes \(z=x+iy\) et \(z'=x'+iy'\) :
    <div class="formula" data-nom="Produits scalaire et mixte par les complexes">$$\overline{z}\,z'=\vec u\cdot\vec v+i\,[\vec u,\vec v] ,\qquad\text{soit}\quad \vec u\cdot\vec v=\operatorname{Re}\big(\overline{z}\,z'\big),\quad [\vec u,\vec v]=\operatorname{Im}\big(\overline{z}\,z'\big).$$</div>
    En effet, le produit \((x-iy)(x'+iy')\) vaut \((xx'+yy')+i(xy'-yx')\). Pour \(z\neq0\), \(\frac{z'}{z}=\frac{\overline{z}\,z'}{|z|^2}\) a le même argument que \(\overline z\,z'\), qui est l'angle orienté \((\vec u,\vec v)\).
  </div>
  <p>On en déduit, pour \(A\neq B\) et \(C\neq D\), d'affixes \(a,b,c,d\) : \(A\), \(B\), \(M\) sont <strong>alignés</strong> si et seulement si \(\frac{z_M-a}{b-a}\in\mathbb R\) ; \((AB)\perp(CD)\) si et seulement si \(\frac{d-c}{b-a}\in i\mathbb R\). La droite \(A+\operatorname{Vect}(\vec u)\) est \(\{a+t\,w,\ t\in\mathbb R\}\) (\(w\) affixe de \(\vec u\)), le cercle de centre \(\Omega\) et de rayon \(R\) est \(\{z : |z-\omega|=R\}=\{\omega+R\,e^{it}\}\). Multiplier par \(i\) fait tourner d'un quart de tour direct : c'est le passage de \((a,b)\) à \((-b,a)\) du §3, et \(z\mapsto\omega+e^{i\alpha}(z-\omega)\) est la rotation de centre \(\Omega\) et d'angle \(\alpha\).</p>
  <div class="method-box">
    <strong>Exemple — deux produits en un calcul, un carré construit par rotation</strong>
    <ol>
      <li>\(A(1,1)\), \(B(5,2)\), \(C(2,4)\) (exemple du §4) : \(\overrightarrow{AB}\) et \(\overrightarrow{AC}\) ont pour affixes \(4+i\) et \(1+3i\), et \((4-i)(1+3i)=7+11i\) : on retrouve \(\overrightarrow{AB}\cdot\overrightarrow{AC}=7\) et \([\overrightarrow{AB},\overrightarrow{AC}]=11\).</li>
      <li>Carré direct \(ABCD\) avec \(A=0\) et \(B=3+i\) : \(D\) est l'image de \(B\) par le quart de tour de centre \(A\), \(d=i(3+i)=-1+3i\), puis \(c=b+d-a=2+4i\).</li>
      <li>Rotation de centre \(\Omega(1,0)\) et d'angle \(\frac\pi2\) appliquée à \(M(3,2)\) : \(1+i(3+2i-1)=-1+2i\), soit le point \((-1,2)\). Contrôle : \(\Omega M=\Omega M'=2\sqrt2\) et \(\overrightarrow{\Omega M}\cdot\overrightarrow{\Omega M'}\) vaut \(2\times(-2)+2\times2=0\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : calculer \(z\,z'\) au lieu de \(\overline{z}\,z'\). Le produit \(z z'\) a pour argument la <em>somme</em> des angles, sans rapport avec l'angle entre les vecteurs. Et l'ordre compte : \(\overline{z'}\,z\) donne \(\vec u\cdot\vec v-i\,[\vec u,\vec v]\).</div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Autres lignes de niveau, et passage à l'espace</h2>
  <div class="intro">Ces compléments ne sont pas exigibles ; ils prolongent naturellement les §6 et §8.</div>
  <p><strong>Lignes de niveau de \(M\mapsto\overrightarrow{MA}\cdot\overrightarrow{MB}\).</strong> La démonstration du §8 donne \(\overrightarrow{MA}\cdot\overrightarrow{MB}=MI^2-\frac{AB^2}{4}\) : la ligne de niveau \(k\) est le cercle de centre \(I\) et de rayon \(\sqrt{k+\frac{AB^2}4}\) si \(k\gt-\frac{AB^2}4\), le point \(I\) si \(k=-\frac{AB^2}4\), le vide sinon. Le cercle de diamètre \([AB]\) est le niveau 0.</p>
  <p><strong>Cercles d'Apollonius.</strong> Pour \(k\gt0\), \(k\neq1\), l'ensemble des points \(M\) tels que \(MA=k\,MB\) est un cercle centré sur \((AB)\) ; pour \(k=1\), c'est la médiatrice de \([AB]\). Par exemple, pour \(A(0,0)\), \(B(3,0)\) et \(k=2\) : \(x^2+y^2=4\big((x-3)^2+y^2\big)\) donne \((x-4)^2+y^2=4\).</p>
  <p><strong>Dans l'espace</strong> (chapitre Géométrie dans l'espace) : le produit scalaire se calcule de même, \(xx'+yy'+zz'\) ; le produit mixte devient un produit de trois vecteurs (un volume), et c'est le produit vectoriel \(\vec u\wedge\vec v\) qui fournit un vecteur orthogonal à deux autres. Une équation \(ax+by+cz+d=0\) y définit un <em>plan</em> : une droite de l'espace demande deux équations, ou un paramétrage.</p>
</div>
</template>
<template class="pan-tpl" data-panneau="geo-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · GÉOMÉTRIE DU PLAN</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes rassemblent les gestes de base de la géométrie du plan, toujours dans un repère orthonormé direct \((O;\vec\imath,\vec\jmath)\) : changer de coordonnées, calculer avec le produit scalaire et le produit mixte, écrire et couper des droites, décrire une région, calculer projetés et distances, traiter cercles et intersections, et passer au besoin par les nombres complexes.</div>

  <div class="method-box"><strong>Méthode 1 — Passer des coordonnées cartésiennes aux coordonnées polaires, et inversement</strong>
    <ol>
      <li>De polaires à cartésiennes : \(x=r\cos\theta\), \(y=r\sin\theta\).</li>
      <li>De cartésiennes à polaires : \(r=\sqrt{x^2+y^2}\), puis \(\theta\) par \(\cos\theta=\frac xr\) <em>et</em> \(\sin\theta=\frac yr\) : les deux signes placent le quadrant.</li>
      <li>Pour traduire une équation, remplacer \(x\) et \(y\), utiliser \(x^2+y^2=r^2\), puis simplifier par \(r\) en gardant à part le point \(O\) (\(r=0\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(2,-2)\) : \(r=2\sqrt2\), \(\cos\theta=\frac{\sqrt2}{2}\), \(\sin\theta=-\frac{\sqrt2}{2}\), donc \(\theta=-\frac\pi4\). Le cercle \(x^2+y^2=4y\) s'écrit \(r^2=4r\sin\theta\), soit \(r=4\sin\theta\) (le point \(O\) y est, pour \(\theta=0\)) ; en cartésiennes, \(x^2+(y-2)^2=4\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\theta=\arctan\frac yx\) ne vaut que pour \(x\gt0\). Pour \(M(-2,2)\), elle donnerait \(-\frac\pi4\) au lieu de \(\frac{3\pi}{4}\).</div>

  <div class="method-box"><strong>Méthode 2 — Calculer un produit scalaire et mesurer un angle</strong>
    <ol>
      <li>Avec des coordonnées en base orthonormée : \(\vec u\cdot\vec v=xx'+yy'\).</li>
      <li>Avec des longueurs et un angle : \(\|\vec u\|\,\|\vec v\|\cos\theta\), en faisant partir les deux vecteurs du même point.</li>
      <li>Avec un angle droit sur la figure : projeter, \(\overrightarrow{AB}\cdot\overrightarrow{AC}\) vaut \(\overrightarrow{AB}\cdot\overrightarrow{AH}\) (\(H\) projeté de \(C\) sur \((AB)\)) ; ou décomposer par la relation de Chasles pour faire apparaître des vecteurs orthogonaux.</li>
      <li>Avec des longueurs seulement : polarisation, \(\vec u\cdot\vec v=\frac12\big(\|\vec u+\vec v\|^2-\|\vec u\|^2-\|\vec v\|^2\big)\), ou Al-Kashi.</li>
      <li>Angle géométrique : \(\cos\theta=\dfrac{\vec u\cdot\vec v}{\|\vec u\|\,\|\vec v\|}\), \(\theta\in[0,\pi]\). Angle orienté : il faut aussi \(\sin\theta=\dfrac{[\vec u,\vec v]}{\|\vec u\|\,\|\vec v\|}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> rectangle \(ABCD\) avec \(AB=4\), \(AD=3\). Comme \(\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}\), \(\overrightarrow{BD}=\overrightarrow{AD}-\overrightarrow{AB}\) et \(\overrightarrow{AB}\perp\overrightarrow{AD}\) : \(\overrightarrow{AC}\cdot\overrightarrow{BD}=AD^2-AB^2=-7\). Angle orienté de \(\vec u=(1,2)\) à \(\vec v=(3,-1)\) : \(\vec u\cdot\vec v=1\), \([\vec u,\vec v]=-1-6=-7\), \(\|\vec u\|\,\|\vec v\|=5\sqrt2\), donc \(\cos\theta=\frac{1}{5\sqrt2}\), \(\sin\theta=-\frac{7}{5\sqrt2}\) et \(\theta\approx-81{,}9^\circ\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(\arccos\) ne donne qu'un angle de \([0,\pi]\), sans orientation. Le signe du produit mixte dit dans quel sens on tourne de \(\vec u\) vers \(\vec v\).</div>

  <div class="method-box"><strong>Méthode 3 — Utiliser le produit mixte : aire, alignement, orientation</strong>
    <ol>
      <li>Écrire les deux vecteurs en colonnes et calculer \([\vec u,\vec v]=xy'-yx'\).</li>
      <li>Aire du parallélogramme : \(|[\vec u,\vec v]|\) ; du triangle \(ABC\) : \(\frac12\big|[\overrightarrow{AB},\overrightarrow{AC}]\big|\) ; d'un polygone convexe : le découper en triangles issus d'un même sommet.</li>
      <li>Alignement de \(A\), \(B\), \(C\), ou colinéarité : produit mixte nul.</li>
      <li>Orientation : \([\overrightarrow{AB},\overrightarrow{AC}]\gt0\) si et seulement si le triangle \(ABC\) est parcouru dans le sens direct.</li>
    </ol>
    <p><em>Exemple éclair :</em> quadrilatère convexe \(A(0,0)\), \(B(5,1)\), \(C(4,4)\), \(D(1,3)\) : \([\overrightarrow{AB},\overrightarrow{AC}]=20-4=16\) et \([\overrightarrow{AC},\overrightarrow{AD}]=12-4=8\), tous deux positifs ; aire \(\frac{16}2+\frac82=12\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Écrire une équation cartésienne et un paramétrage d'une droite</strong>
    <ol>
      <li>Point \(A\) et vecteur directeur \(\vec u\) : \([\overrightarrow{AM},\vec u]=0\) ; deux points : \(\vec u=\overrightarrow{AB}\).</li>
      <li>Point \(A\) et vecteur normal \(\vec n=(a,b)\) : \(a(x-x_A)+b(y-y_A)=0\).</li>
      <li>D'une équation \(ax+by+c=0\) à un paramétrage : un point (une coordonnée fixée, l'autre calculée) et le vecteur directeur \((-b,a)\).</li>
      <li>D'un paramétrage à une équation : éliminer \(t\), ou écrire \([\overrightarrow{AM},\vec u]=0\).</li>
      <li>Contrôler sur un second point de la droite.</li>
    </ol>
    <p><em>Exemple éclair :</em> par \(A(-1,3)\), de vecteur normal \((2,5)\) : \(2(x+1)+5(y-3)=0\), soit \(2x+5y-13=0\). Paramétrage : \(x=-1-5t\), \(y=3+2t\). Contrôle pour \(t=1\) : \((-6,5)\) donne \(-12+25-13=0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \((a,b)\) est un vecteur <em>normal</em> de \(ax+by+c=0\), pas un vecteur directeur.</div>

  <div class="method-box"><strong>Méthode 5 — Étudier la position de deux droites</strong>
    <ol>
      <li>Comparer les vecteurs normaux \((a,b)\) et \((a',b')\) : parallèles si \(ab'-a'b=0\), perpendiculaires si \(aa'+bb'=0\).</li>
      <li>Droites parallèles : tester un point de l'une dans l'équation de l'autre (confondues ou disjointes) ; leur distance est \(\frac{|c-c'|}{\sqrt{a^2+b^2}}\) une fois les équations écrites avec les mêmes \(a\), \(b\).</li>
      <li>Droites sécantes : résoudre le système (substitution, ou report d'un paramétrage dans l'autre équation).</li>
      <li>Parallèle à \(ax+by+c=0\) par \(P\) : même \((a,b)\), et \(c'\) calculé avec \(P\) ; perpendiculaire par \(P\) : \((a,b)\) devient vecteur directeur, donc \((-b,a)\) vecteur normal.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(x-2y+1=0\) et \(3x+y-11=0\) : \(1\times1-3\times(-2)=7\neq0\), sécantes. Avec \(x=2y-1\) : \(3(2y-1)+y=11\), \(y=2\), \(x=3\) : point \((3,2)\). Elles ne sont pas perpendiculaires : \(1\times3+(-2)\times1=1\neq0\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Décrire une région par des inéquations (régionnement, lignes de niveau)</strong>
    <ol>
      <li>Écrire l'équation \(f(M)=ax+by+c=0\) de chaque droite frontière.</li>
      <li>Choisir pour chacune un point témoin dont on connaît le côté (un sommet opposé, l'origine) et lire le signe de \(f\) en ce point.</li>
      <li>La région est l'intersection des demi-plans obtenus ; un point y est si toutes les inégalités sont vérifiées.</li>
      <li>Une condition \(\vec u\cdot\overrightarrow{AM}=k\) (ou \(\leqslant k\)) décrit une droite orthogonale à \(\vec u\) (ou un demi-plan) ; \([\vec u,\overrightarrow{AM}]=k\), une droite parallèle à \(\vec u\).</li>
    </ol>
    <p><em>Exemple éclair :</em> les points plus proches de \(A(0,0)\) que de \(B(4,2)\) : \(MA^2\lt MB^2\) s'écrit \(x^2+y^2\lt(x-4)^2+(y-2)^2\), soit \(8x+4y-20\lt0\), c'est-à-dire \(2x+y\lt5\). C'est le demi-plan limité par la médiatrice de \([AB]\) qui contient \(A\) (pour \(A\) : \(0\lt5\)).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : multiplier une inégalité par un nombre négatif en change le sens ; ne jamais deviner le côté, toujours tester un point.</div>

  <div class="method-box"><strong>Méthode 7 — Calculer un projeté orthogonal, une distance, un symétrique</strong>
    <ol>
      <li>Avec une équation \(ax+by+c=0\) et \(M(x_0,y_0)\) : \(d=\dfrac{|ax_0+by_0+c|}{\sqrt{a^2+b^2}}\) ; projeté \(H=M-\lambda\vec n\) avec \(\lambda=\dfrac{ax_0+by_0+c}{a^2+b^2}\).</li>
      <li>Avec \(A+\operatorname{Vect}(\vec u)\) : \(d=\dfrac{|[\vec u,\overrightarrow{AM}]|}{\|\vec u\|}\) ; projeté \(H=A+\dfrac{\overrightarrow{AM}\cdot\vec u}{\|\vec u\|^2}\,\vec u\).</li>
      <li>Symétrique par rapport à la droite : \(M'=2H-M\).</li>
      <li>Contrôler : \(H\) vérifie l'équation de la droite et \(MH=d\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(M(1,5)\) et \(3x-4y+2=0\) : \(d=\frac{|3-20+2|}{5}=3\) ; \(\lambda=-\frac{15}{25}=-\frac35\), \(H=(1,5)+\frac35(3,-4)=\big(\frac{14}5,\frac{13}5\big)\) ; symétrique \(\big(\frac{23}5,\frac15\big)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la racine \(\sqrt{a^2+b^2}\) au dénominateur, ou le signe de \(\lambda\) dans le projeté : \(H=M-\lambda\vec n\), et non \(M+\lambda\vec n\).</div>

  <div class="method-box"><strong>Méthode 8 — Reconnaître un cercle, le paramétrer, écrire une tangente</strong>
    <ol>
      <li>Diviser par le coefficient commun de \(x^2\) et \(y^2\), puis compléter les carrés : \((x-a)^2+(y-b)^2=k\) ; cercle si \(k\gt0\), point si \(k=0\), vide si \(k\lt0\).</li>
      <li>Paramétrage : \(x=a+R\cos t\), \(y=b+R\sin t\), \(t\in[0,2\pi[\).</li>
      <li>Tangente en \(M_0\) : droite par \(M_0\) de vecteur normal \(\overrightarrow{\Omega M_0}\).</li>
      <li>Cercle de diamètre \([AB]\) : écrire directement \(\overrightarrow{MA}\cdot\overrightarrow{MB}=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(2x^2+2y^2-4x+8y-8=0\) devient \(x^2+y^2-2x+4y-4=0\), soit \((x-1)^2+(y+2)^2=9\) : centre \((1,-2)\), rayon 3. Tangente en \(M_0(1,1)\) : \(\overrightarrow{\Omega M_0}=(0,3)\), d'où la droite \(y=1\). Cercle de diamètre \([AB]\), \(A(-1,0)\), \(B(3,2)\) : \((x+1)(x-3)+y(y-2)=0\), soit \((x-1)^2+(y-1)^2=5\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Résoudre un problème d'intersection</strong>
    <ol>
      <li>Prévoir : comparer \(d(\Omega,\mathcal D)\) à \(R\) (droite et cercle), ou \(\Omega\Omega'\) à \(R+R'\) et \(|R-R'|\) (deux cercles).</li>
      <li>Droite et cercle : exprimer une variable avec l'équation de la droite (ou reporter un paramétrage) dans l'équation du cercle, résoudre l'équation du second degré.</li>
      <li>Deux cercles : retrancher les équations (droite \(\Delta\)), puis couper \(\Delta\) avec l'un des cercles.</li>
      <li>Contrôler les points trouvés dans les deux équations.</li>
    </ol>
    <p><em>Exemple éclair :</em> \((x-1)^2+(y-2)^2=10\) et \(y=x-3\) : \(d=\frac{|1-2-3|}{\sqrt2}=2\sqrt2\lt\sqrt{10}\), deux points. En reportant : \((x-1)^2+(x-5)^2=10\), soit \(x^2-6x+8=0\), \(x=2\) ou \(x=4\) : points \((2,-1)\) et \((4,1)\), distants de \(2\sqrt2=2\sqrt{10-8}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : pour deux cercles, la droite \(\Delta\) existe même si les cercles sont disjoints ; c'est la résolution finale (ou la comparaison des distances) qui conclut.</div>

  <div class="method-box"><strong>Méthode 10 — Traduire avec les nombres complexes</strong>
    <ol>
      <li>Associer à chaque point son affixe, à \(\overrightarrow{AB}\) l'affixe \(b-a\).</li>
      <li>Produit scalaire et produit mixte : la partie réelle de \(\overline{(b-a)}\,(c-a)\) est \(\overrightarrow{AB}\cdot\overrightarrow{AC}\), sa partie imaginaire \([\overrightarrow{AB},\overrightarrow{AC}]\).</li>
      <li>Alignement : \(\frac{c-a}{b-a}\in\mathbb R\) ; angle droit en \(A\) : \(\frac{c-a}{b-a}\in i\mathbb R\) ; triangle rectangle isocèle en \(A\) : \(\frac{c-a}{b-a}=\pm i\).</li>
      <li>Rotation de centre \(\Omega\) et d'angle \(\alpha\) : \(z\mapsto\omega+e^{i\alpha}(z-\omega)\) ; quart de tour direct : multiplier par \(i\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A(1,0)\), \(B(3,1)\), \(C(2,3)\) : \(\frac{c-b}{a-b}=\frac{-1+2i}{-2-i}=-i\). Donc \(BC=BA\) et l'angle orienté \((\overrightarrow{BA},\overrightarrow{BC})\) vaut \(-\frac\pi2\) : le triangle est rectangle isocèle en \(B\).</p>
  </div>
</div>
</template>
