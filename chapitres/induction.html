<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre les parties 1.7.3 « Lois de l'induction », 1.7.4 « Circuit fixe dans un champ magnétique qui dépend du temps » et 1.7.5 « Circuit mobile dans un champ magnétique stationnaire » du programme de PTSI : tout y est exigible en 1ʳᵉ année. Il s'appuie sur le chapitre <a href="#emag/cours">« Champ magnétique et actions de Laplace »</a> (champ d'une bobine longue, force de Laplace sur une barre, couple \(\vec{\mathcal M}\wedge\vec B\) sur une spire). Le programme raisonne <strong>toujours par le flux</strong> : toute étude du champ électromoteur est exclue.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Flux</strong> : évaluer le flux d'un champ magnétique uniforme à travers une surface plane s'appuyant sur un contour fermé orienté (§1).</li>
        <li><strong>Loi de Faraday</strong> : l'utiliser en précisant les conventions d'algébrisation ; décrire et interpréter des expériences illustrant les lois de Faraday et de Lenz (§2).</li>
        <li><strong>Loi de Lenz</strong> : l'utiliser pour prédire ou interpréter les phénomènes observés (§3).</li>
        <li><strong>Auto-induction</strong> : distinguer flux propre et flux extérieur ; ordre de grandeur de l'inductance d'une bobine longue ; mesure d'une inductance ; bilan de puissance et d'énergie sur un schéma électrique équivalent (§4).</li>
        <li><strong>Inductance mutuelle</strong> de deux bobines longues de même axe en influence totale ; applications (§5).</li>
        <li><strong>Circuits couplés</strong> : établir le système d'équations en régime sinusoïdal forcé à partir de schémas électriques équivalents ; bilan de puissance et d'énergie (§6).</li>
        <li><strong>Transformateur</strong> : établir la loi des tensions ; bilan de puissance ; intérêt pour le transport de l'énergie (§7).</li>
        <li><strong>Rails de Laplace</strong> et <strong>spire rectangulaire en rotation</strong> dans un champ uniforme : interpréter, écrire les équations électrique et mécanique en précisant les conventions de signe, faire un bilan énergétique, citer des applications (§8, §9).</li>
        <li><strong>Freinage par induction</strong> : origine des courants de Foucault, mise en évidence, exemples d'utilisation (§10).</li>
        <li><strong>Moteur à courant continu à entrefer plan</strong> : en analyser le fonctionnement à partir des rails de Laplace ; exemples d'utilisation (§11).</li>
      </ul>
      <p>Hors programme : le champ électromoteur, le champ électrique induit, la formule de Neumann (voir la dernière section). Les équations de Maxwell, qui contiennent toute l'induction, sont l'objet du chapitre de 2ᵉ année <a href="#maxwell/cours">« Équations de Maxwell et ARQS »</a>.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · FLUX MAGNÉTIQUE</div>
  <h2>Orienter un circuit, mesurer le champ qui le traverse</h2>
  <div class="intro">L'induction électromagnétique est l'apparition d'une tension, donc d'un courant, dans un circuit dont le flux magnétique varie. C'est le principe des alternateurs, des transformateurs, des plaques à induction, des cartes sans contact et des freins des poids lourds. Tout commence par une convention : on oriente le circuit, ce qui fixe le signe du flux.</div>
  <div class="def-box">
    <strong>Contour orienté et normale.</strong> On choisit un sens de parcours positif du circuit (contour fermé \(\mathcal C\)), puis une surface \(S\) qui s'appuie sur \(\mathcal C\). Sa normale \(\vec n\) est donnée par la <strong>règle de la main droite</strong> : les doigts recourbés dans le sens du circuit, le pouce indique \(\vec n\). Le <strong>flux magnétique</strong> à travers le circuit est
    <div class="formula" data-nom="Flux magnétique">$$\Phi=\iint_S\vec B\cdot\vec n\,\mathrm dS\qquad(\text{weber : }1\ \text{Wb}=1\ \text{T·m}^2)$$</div>
  </div>
  <figure class="schema">

</figure>
  <div class="prop-box">
    <strong>Champ uniforme, circuit plan.</strong> Si \(\vec B\) est uniforme sur la surface plane d'aire \(S\), et \(\theta\) l'angle entre \(\vec B\) et \(\vec n\) :
    <div class="formula" data-nom="Flux d'un champ uniforme">$$\Phi=\vec B\cdot\vec n\,S=B\,S\cos\theta$$</div>
    Pour une bobine de \(N\) spires identiques, orientées dans le même sens, les flux s'ajoutent : \(\Phi=N\,B\,S\cos\theta\).
  </div>
  <p>Le champ magnétique est à <strong>flux conservatif</strong> (ses lignes de champ ne commencent ni ne finissent nulle part) : le flux est le même à travers toutes les surfaces qui s'appuient sur le même contour. On peut donc parler du flux « à travers le circuit » sans préciser la surface ; on admet ce résultat, établi en 2ᵉ année.</p>
  <div class="method-box">
    <strong>Exemple — flux à travers un cadre incliné</strong>
    <p>Un cadre de \(N = 50\) spires rectangulaires de \(4\ \text{cm}\times5\ \text{cm}\) est placé dans un champ uniforme \(B = 0{,}20\ \text{T}\) qui fait un angle de 60° avec le <em>plan</em> du cadre.</p>
    <ol>
      <li>L'angle utile est celui entre \(\vec B\) et la normale : \(\theta = 90° - 60° = 30°\) (si \(\vec n\) est orientée du côté où pointe \(\vec B\)).</li>
      <li>\(S = 2{,}0\times10^{-3}\ \text{m}^2\), d'où
        <div class="formula">$$\Phi = 50\times0{,}20\times2{,}0\times10^{-3}\times\cos30° \approx 1{,}7\times10^{-2}\ \text{Wb}$$</div></li>
      <li>Avec l'orientation contraire du cadre, \(\vec n\) change de sens et \(\Phi \approx -1{,}7\times10^{-2}\ \text{Wb}\) : le signe du flux n'a de sens qu'avec l'orientation.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre pour \(\theta\) l'angle entre \(\vec B\) et le <em>plan</em> du circuit (on obtient alors un sinus au lieu d'un cosinus), oublier le facteur \(N\) d'une bobine, ou changer d'orientation en cours de calcul.</div>
  <p><strong>Ordres de grandeur.</strong> Champ terrestre en France : \(\approx 5\times10^{-5}\ \text{T}\) ; aimant usuel, près d'un pôle : 0,1 à 1 T ; électroaimant de TP : jusqu'à 1 T environ ; IRM médicale : 1,5 à 3 T. À travers une spire de \(10\ \text{cm}^2\), le champ terrestre donne au plus \(5\times10^{-8}\ \text{Wb}\), un aimant de \(0{,}5\ \text{T}\) donne \(5\times10^{-4}\ \text{Wb}\) : dix mille fois plus.</p>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LOI DE FARADAY</div>
  <h2>La force électromotrice induite et le schéma électrique équivalent</h2>
  <div class="intro">Faraday (1831) observe qu'un courant apparaît dans une bobine reliée à un galvanomètre chaque fois que le flux qui la traverse varie, et seulement pendant qu'il varie. La loi qui porte son nom donne la tension créée ; on la traduit par un générateur dans le schéma électrique du circuit.</div>
  <h3>Les expériences</h3>
  <ul>
    <li>On approche le pôle nord d'un aimant d'une bobine fermée sur un galvanomètre : l'aiguille dévie pendant le mouvement ; elle dévie en sens inverse quand on éloigne l'aimant, ou quand on approche le pôle sud ; rien si l'aimant est immobile. L'effet croît avec la vitesse du mouvement et avec le nombre de spires.</li>
    <li>On garde l'aimant fixe et on déplace la bobine : même résultat. Seul compte le mouvement <strong>relatif</strong> ; selon le référentiel choisi (celui de l'aimant ou celui de la bobine), on décrit le même phénomène de deux façons. Ce constat est le point de départ de l'article d'Einstein sur la relativité (1905).</li>
    <li>On remplace l'aimant par une seconde bobine fixe (circuit inducteur) : un courant apparaît dans la première à l'établissement ou à la coupure du courant inducteur, pas en régime permanent.</li>
  </ul>
  <p>Deux causes font donc varier le flux : un <strong>circuit fixe dans un champ variable</strong> (§4 à §7) et un <strong>circuit mobile dans un champ stationnaire</strong> (§8 à §11). Une seule loi les décrit.</p>
  <div class="prop-box">
    <strong>Loi de Faraday.</strong> Un circuit orienté, traversé par le flux \(\Phi(t)\) calculé avec la normale associée à cette orientation, est le siège d'une force électromotrice (f.é.m.) induite
    <div class="formula" data-nom="Loi de Faraday">$$e=-\frac{\mathrm d\Phi}{\mathrm dt}$$</div>
    \(e\) est algébrique et comptée <strong>dans le sens d'orientation du circuit</strong>, en convention générateur.
  </div>
  <div class="def-box">
    <strong>Schéma électrique équivalent.</strong> Dans le schéma du circuit, on place un générateur idéal de tension \(e\) dont la flèche est dans le sens d'orientation, en série avec la résistance \(R\) du circuit et ses autres dipôles. On compte aussi le courant \(i\) dans le sens d'orientation (convention générateur pour \(e\)). Pour un circuit seulement résistif, la loi des mailles donne \(e = Ri\).
  </div>

</figure>
  <div class="method-box">
    <strong>Exemple — bobine dans le champ d'un électroaimant</strong>
    <p>Une bobine de \(N = 200\) spires d'aire \(S = 10\ \text{cm}^2\), de résistance totale \(R = 10\ \Omega\), est placée dans un champ uniforme parallèle à son axe, qui croît linéairement de 0 à \(0{,}50\ \text{T}\) en \(20\ \text{ms}\).</p>
    <ol>
      <li>On oriente la bobine pour que \(\vec n\) soit dans le sens de \(\vec B\) : \(\Phi = NBS\), positif et croissant.</li>
      <li>\(e = -NS\,\dfrac{\mathrm dB}{\mathrm dt} = -200\times1{,}0\times10^{-3}\times\dfrac{0{,}50}{0{,}020} = -5{,}0\ \text{V}\).</li>
      <li>\(i = e/R = -0{,}50\ \text{A}\) : le courant circule en sens <strong>inverse</strong> de l'orientation choisie. Vérification au §3 : il crée un champ opposé à \(\vec B\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : écrire \(e = BS\omega\) ou \(e = B\ell v\) « en valeur absolue » sans orientation. Le programme exige les conventions : on oriente d'abord, on en déduit \(\vec n\), puis \(\Phi\), puis \(e\) et enfin \(i\). Changer l'orientation change les signes de \(\Phi\), \(e\) et \(i\), mais pas le courant physique.</div>
  <p><strong>Ordre de grandeur.</strong> Retourner en \(0{,}1\ \text{s}\) une bobine de 100 spires de rayon \(5\ \text{cm}\) dont l'axe est aligné avec le champ terrestre (\(B\approx 5\times10^{-5}\ \text{T}\)) fait varier le flux de \(2NB\pi r^2 \approx 8\times10^{-5}\ \text{Wb}\) : la f.é.m. moyenne vaut environ \(0{,}8\ \text{mV}\), mesurable au galvanomètre.</p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · LOI DE LENZ</div>
  <h2>Les effets de l'induction s'opposent à leur cause</h2>
  <div class="intro">La loi de Lenz ne donne pas de valeur, mais elle prévoit en un instant le sens du courant induit et celui des forces qui en résultent. Elle sert aussi de contrôle de signe pour tout calcul fondé sur la loi de Faraday.</div>
  <div class="prop-box">
    <strong>Loi de modération de Lenz.</strong> Le courant induit a un sens tel que ses effets (le champ magnétique qu'il crée, les forces de Laplace qu'il subit) s'opposent à la cause qui lui a donné naissance.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Lien avec le signe « − »</span>
    <span class="prompt">Pourquoi la loi de Faraday contient déjà la loi de Lenz</span>
    <div class="content"><p>Si \(\Phi\) croît, \(e = -\mathrm d\Phi/\mathrm dt \lt 0\), donc \(i = e/R \lt 0\). Un courant crée à travers son propre circuit un flux de même signe que lui (flux propre \(Li\), \(L \gt 0\), §4) : ici un flux négatif, qui diminue le flux total. Le courant induit freine donc l'augmentation du flux. Avec un signe « + » dans la loi de Faraday, le courant induit renforcerait la variation qui le crée : l'énergie croîtrait sans fin, ce qui est impossible.</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — aimant approché d'un anneau</strong>
    <p>On approche le pôle nord d'un aimant d'un anneau de cuivre, le long de son axe.</p>
    <ol>
      <li>Cause : le flux du champ de l'aimant, dirigé vers l'anneau, augmente.</li>
      <li>Effet : le courant induit crée dans l'anneau un champ opposé, dirigé vers l'aimant. La face de l'anneau tournée vers l'aimant est donc une face <strong>nord</strong> : vu depuis l'aimant, le courant tourne dans le sens trigonométrique.</li>
      <li>Deux faces nord en regard se repoussent : l'anneau est <strong>repoussé</strong>, il s'oppose au rapprochement. Si l'on éloigne l'aimant, le courant change de sens et l'anneau est attiré : il « suit » l'aimant.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — quel courant dans l'anneau ?</strong>
    <p>L'anneau, de rayon \(a = 2{,}0\ \text{cm}\), est un fil de cuivre de section \(s = 1{,}0\ \text{mm}^2\) (résistivité \(\rho = 1{,}7\times10^{-8}\ \Omega\cdot\text{m}\)). En approchant l'aimant, on fait passer le champ moyen à travers l'anneau de 5 à 50 mT en 0,10 s. On oriente l'anneau pour que \(\vec n\) ait le sens du champ de l'aimant.</p>
    <ol>
      <li>Résistance de l'anneau : \(R = \rho\,\dfrac{2\pi a}{s} = \dfrac{1{,}7\times10^{-8}\times0{,}126}{1{,}0\times10^{-6}} \approx 2{,}1\ \text{m}\Omega\).</li>
      <li>F.é.m. moyenne : \(e = -\pi a^2\,\dfrac{\Delta B}{\Delta t} = -1{,}26\times10^{-3}\times\dfrac{0{,}045}{0{,}10} \approx -0{,}57\ \text{mV}\), d'où \(i = e/R \approx -0{,}27\ \text{A}\) : le courant circule en sens inverse de l'orientation, comme le prévoit la loi de Lenz.</li>
      <li>Champ créé par ce courant au centre de l'anneau (expression fournie : \(\mu_0|i|/(2a)\)) : \(\approx 8\ \mu\text{T}\), plusieurs milliers de fois moins que le champ de l'aimant. La loi de Lenz donne le <strong>sens</strong> des effets, pas leur importance : ici le flux propre est négligeable et la variation du flux n'est presque pas freinée.</li>
    </ol>
  </div>
  <p>Applications et expériences : l'anneau de Thomson, enfilé sur le noyau d'une bobine qu'on alimente brusquement, est violemment éjecté ; un aimant tombe lentement dans un tube de cuivre (§10) ; une tige lancée sur des rails est freinée (§8) ; une bobine s'oppose aux variations de son propre courant (§4).</p>
  <div class="notice"><strong>Erreur classique</strong> : croire que le champ induit est toujours opposé au champ extérieur. Il s'oppose à la <strong>variation</strong> du flux : si le flux diminue, le champ induit a le sens du champ extérieur.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · AUTO-INDUCTION</div>
  <h2>Flux propre, inductance et énergie magnétique</h2>
  <div class="intro">Un circuit parcouru par un courant crée un champ, donc un flux à travers lui-même. Si son courant varie, ce flux propre varie : le circuit est le siège d'une f.é.m. d'auto-induction. C'est l'origine du comportement des bobines en électrocinétique.</div>
  <div class="def-box">
    <strong>Flux propre et inductance propre.</strong> Le flux propre \(\Phi_p\) est le flux, à travers le circuit, du champ qu'il crée lui-même. Le champ créé est proportionnel au courant, donc
    <div class="formula" data-nom="Inductance propre">$$\Phi_p=L\,i\qquad(\text{henry : }1\ \text{H}=1\ \text{Wb·A}^{-1})$$</div>
    \(L\), l'<strong>inductance propre</strong>, ne dépend que de la géométrie du circuit (en l'absence de matériau magnétique : un noyau de fer l'augmente beaucoup) ; elle est positive quand \(\Phi_p\) et \(i\) sont calculés avec la même orientation. Le flux total à travers le circuit est \(\Phi = \Phi_p + \Phi_{ext}\), où \(\Phi_{ext}\) est le flux des champs créés par les autres sources (aimants, autres circuits).
  </div>
  <div class="prop-box">
    <strong>Bobine longue.</strong> Une bobine de \(N\) spires, de longueur \(\ell\) grande devant son rayon et de section \(S\), parcourue par \(i\), crée à l'intérieur le champ uniforme \(B = \mu_0\dfrac{N}{\ell}\,i\) (\(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\)). Son flux propre à travers les \(N\) spires vaut \(\Phi_p = NBS\), d'où
    <div class="formula" data-nom="Inductance d'une bobine longue">$$L=\frac{\mu_0N^2S}{\ell}=\mu_0\,n^2\,\ell\,S\qquad\Big(n=\frac{N}{\ell}\Big)$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — ordre de grandeur</strong>
    <ol>
      <li>Bobine de \(N = 500\) spires, longue de \(\ell = 40\ \text{cm}\), de diamètre \(4\ \text{cm}\) : \(S = \pi\times(0{,}02)^2 = 1{,}26\times10^{-3}\ \text{m}^2\).</li>
      <li>Inductance :
        <div class="formula">$$L = \frac{4\pi\times10^{-7}\times500^2\times1{,}26\times10^{-3}}{0{,}40} \approx 1{,}0\times10^{-3}\ \text{H} = 1{,}0\ \text{mH}$$</div></li>
      <li>\(L\) croît comme \(N^2\) : 1 000 spires donneraient 4 mH. Les bobines de TP valent de quelques mH à quelques centaines de mH ; un noyau de fer doux multiplie \(L\) par plusieurs centaines (on atteint 1 H et plus). Un fil de connexion ou un circuit ordinaire n'a qu'une inductance de l'ordre du µH.</li>
    </ol>
  </div>
  <h3>Schéma équivalent d'une bobine</h3>
  <p>La loi de Faraday appliquée au flux propre donne la f.é.m. d'auto-induction \(e_p = -L\,\mathrm di/\mathrm dt\). Dans le schéma équivalent, c'est un générateur orienté dans le sens de \(i\) ; vue de l'extérieur en <strong>convention récepteur</strong>, une bobine idéale a donc pour tension</p>
  <div class="formula" data-nom="Tension aux bornes d'une bobine">$$u=L\,\frac{\mathrm di}{\mathrm dt}\qquad\text{(bobine réelle : }u=r\,i+L\,\frac{\mathrm di}{\mathrm dt}\text{)}$$</div>
  <p>Lecture par la loi de Lenz : la bobine s'oppose aux <strong>variations</strong> de son courant. Celui-ci est continu (une discontinuité de \(i\) donnerait une tension infinie). Ouvrir brutalement un circuit inductif crée une forte surtension : couper \(0{,}30\ \text{A}\) en \(10\ \mu\text{s}\) dans une bobine de \(0{,}20\ \text{H}\) fait apparaître une tension de l'ordre de \(L\,\Delta i/\Delta t = 6\ \text{kV}\). D'où l'étincelle à l'interrupteur, et le principe de la bobine d'allumage des moteurs à essence. On protège les composants par une diode de roue libre, qui offre un chemin au courant de la bobine.</p>
  <h3>Bilan de puissance et d'énergie</h3>
  <div class="prop-box">
    <strong>Énergie magnétique.</strong> Circuit série : générateur \(E\), résistance \(R\), bobine \(L\). La loi des mailles \(E = Ri + L\,\dfrac{\mathrm di}{\mathrm dt}\), multipliée par \(i\), donne
    <div class="formula" data-nom="Bilan de puissance d'un circuit RL">$$E\,i=R\,i^2+\frac{\mathrm d}{\mathrm dt}\Big(\frac12L\,i^2\Big)$$</div>
    La puissance fournie par le générateur est dissipée par effet Joule ou stockée dans la bobine sous forme d'<strong>énergie magnétique</strong> \(U_m = \tfrac12 L\,i^2\) (notation reprise en 2ᵉ année, où l'on montre que cette énergie est répartie dans le champ). Une bobine idéale ne dissipe rien : elle stocke l'énergie et la restitue.
  </div>

    <strong>Exemple — énergie stockée, puis restituée</strong>
    <p>\(E = 6{,}0\ \text{V}\), \(R = 20\ \Omega\), \(L = 0{,}20\ \text{H}\), courant initial nul.</p>
    <ol>
      <li>\(\tau = L/R = 10\ \text{ms}\) ; régime établi en quelques \(\tau\), avec \(I_\infty = E/R = 0{,}30\ \text{A}\).</li>
      <li>Énergie stockée : \(\tfrac12 L I_\infty^2 = \tfrac12\times0{,}20\times0{,}30^2 = 9{,}0\ \text{mJ}\). En régime établi, la bobine ne reçoit plus rien : toute la puissance \(EI_\infty = 1{,}8\ \text{W}\) est dissipée dans \(R\).</li>
      <li>Si l'on remplace ensuite le générateur par un fil, le courant décroît en \(e^{-t/\tau}\) et les \(9{,}0\ \text{mJ}\) sont dissipés dans \(R\) : la bobine a joué le rôle d'un générateur.</li>
    </ol>
  </div>
  <h3>Mesurer une inductance</h3>
  <ul>
    <li><strong>Réponse à un échelon</strong> : on mesure \(\tau\) (tangente à l'origine, ou instant où \(i = 0{,}63\,I_\infty\)), puis \(L = R_{tot}\,\tau\), où \(R_{tot}\) compte la résistance \(r\) de la bobine et la résistance interne du générateur. Exemple : \(\tau = 2{,}5\ \text{ms}\) avec \(R_{tot} = 40\ \Omega\) donne \(L = 0{,}10\ \text{H}\).</li>
    <li><strong>Régime sinusoïdal</strong> : le module de l'impédance \(\sqrt{r^2 + L^2\omega^2}\), mesuré à plusieurs fréquences ; ou la fréquence de résonance \(f_0 = 1/(2\pi\sqrt{LC})\) avec un condensateur connu.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§5 · INDUCTANCE MUTUELLE</div>
  <h2>Deux circuits qui partagent leur champ</h2>
  <div class="intro">Quand deux circuits sont proches, le champ de l'un traverse l'autre. Une variation de courant dans le premier induit une f.é.m. dans le second : le transfert d'énergie se fait sans contact. Ce couplage est à la base des transformateurs, des chargeurs sans fil et des cartes sans contact.</div>
  <div class="def-box">
    <strong>Inductance mutuelle.</strong> Deux circuits fixes 1 et 2, orientés. Le flux, à travers le circuit 2, du champ créé par le courant \(i_1\) est proportionnel à \(i_1\) : \(\Phi_{1\to2} = M\,i_1\). Réciproquement, \(\Phi_{2\to1} = M\,i_2\), avec le <strong>même</strong> coefficient \(M\) (résultat admis). \(M\), en henrys, est algébrique : son signe dépend des orientations choisies. Les flux totaux sont
    <div class="formula" data-nom="Flux de deux circuits couplés">$$\Phi_1=L_1i_1+M\,i_2\qquad\Phi_2=L_2i_2+M\,i_1$$</div>
  </div>

  <div class="prop-box">
    <strong>Deux bobines longues de même axe en influence totale.</strong> Bobines de même longueur \(\ell\) et de même section \(S\), enroulées l'une sur l'autre dans le même sens, de \(N_1\) et \(N_2\) spires. Le champ uniforme \(B_1 = \mu_0N_1i_1/\ell\) de la bobine 1 traverse les \(N_2\) spires de la bobine 2 : \(\Phi_{1\to2} = N_2B_1S\), d'où
    <div class="formula" data-nom="Inductance mutuelle de deux bobines coaxiales">$$M=\frac{\mu_0N_1N_2S}{\ell}\qquad\text{et}\qquad M^2=L_1L_2$$</div>
    En influence totale (toutes les lignes de champ de l'une traversent l'autre), le couplage est parfait. En général \(|M| \le \sqrt{L_1L_2}\). Si l'on inverse l'orientation d'une bobine, \(M\) change de signe.
  </div>
  <div class="method-box">
    <strong>Exemple — f.é.m. induite dans la bobine secondaire</strong>
    <p>Bobine 1 : \(N_1 = 1\,000\) spires ; bobine 2 : \(N_2 = 100\) spires bobinées sur toute sa longueur ; \(\ell = 50\ \text{cm}\), \(S = 20\ \text{cm}^2\). La bobine 1 est parcourue par \(i_1 = I_1\cos\omega t\), \(I_1 = 1{,}0\ \text{A}\), \(f = 1{,}0\ \text{kHz}\) ; la bobine 2 est ouverte (\(i_2 = 0\)).</p>
    <ol>
      <li>Inductance mutuelle :
        <div class="formula">$$M = \frac{4\pi\times10^{-7}\times1\,000\times100\times2{,}0\times10^{-3}}{0{,}50} \approx 0{,}50\ \text{mH}$$</div>
        et de même \(L_1 \approx 5{,}0\ \text{mH}\), \(L_2 \approx 50\ \mu\text{H}\) : on vérifie \(M^2 = L_1L_2\).</li>
      <li>\(e_2 = -\dfrac{\mathrm d\Phi_2}{\mathrm dt} = -M\dfrac{\mathrm di_1}{\mathrm dt} = M\omega I_1\sin\omega t\), d'amplitude \(M\omega I_1 \approx 5{,}0\times10^{-4}\times6{,}3\times10^{3} \approx 3{,}2\ \text{V}\).</li>
    </ol>
  </div>
  <p><strong>Variante.</strong> Une petite bobine de \(N_2\) spires et de section \(S_2\), placée à l'intérieur d'une bobine longue (\(N_1\), \(\ell_1\)), de même axe, est traversée par le champ uniforme \(B_1\) sur sa seule section : \(M = \mu_0N_1N_2S_2/\ell_1\). C'est le principe d'une sonde de mesure de champ variable.</p>
  <p><strong>Applications.</strong> Transformateurs (§7) ; recharge sans fil des brosses à dents et des téléphones (vers 100 kHz) ; cartes et badges sans contact RFID / NFC (13,56 MHz : le lecteur alimente la puce par induction) ; plaques à induction ; détecteurs de métaux ; pinces ampèremétriques ; boucles enterrées qui détectent les véhicules aux feux.</p>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CIRCUITS COUPLÉS EN RÉGIME SINUSOÏDAL FORCÉ</div>
  <h2>Équations couplées et transfert d'énergie sans contact</h2>
  <div class="intro">Deux circuits à une maille, couplés par inductance mutuelle : le premier contient un générateur, le second une charge. On écrit les deux lois des mailles sur les schémas équivalents, puis on les résout avec les complexes.</div>
  <div class="method-box">
    <strong>Méthode — établir le système d'équations</strong>
    <ol>
      <li>Orienter chaque circuit dans le sens de son courant (\(i_1\), \(i_2\)) ; le signe de \(M\) en découle.</li>
      <li>Remplacer chaque bobine par son schéma équivalent : en convention récepteur, la bobine \(k\) a pour tension \(u_k = -e_k = \dfrac{\mathrm d\Phi_k}{\mathrm dt}\), soit \(u_1 = L_1\dfrac{\mathrm di_1}{\mathrm dt} + M\dfrac{\mathrm di_2}{\mathrm dt}\) et \(u_2 = L_2\dfrac{\mathrm di_2}{\mathrm dt} + M\dfrac{\mathrm di_1}{\mathrm dt}\).</li>
      <li>Écrire la loi des mailles de chaque circuit (générateur \(u_g\), résistances \(R_1\), \(R_2\)).</li>
      <li>En régime sinusoïdal forcé, remplacer \(\mathrm d/\mathrm dt\) par \(j\omega\) et résoudre le système linéaire.</li>
    </ol>
  </div>
  <div class="formula" data-nom="Circuits couplés (temporel)">$$\left\{\begin{aligned}u_g&=R_1i_1+L_1\frac{\mathrm di_1}{\mathrm dt}+M\frac{\mathrm di_2}{\mathrm dt}\\0&=R_2i_2+L_2\frac{\mathrm di_2}{\mathrm dt}+M\frac{\mathrm di_1}{\mathrm dt}\end{aligned}\right.$$</div>
  <div class="formula" data-nom="Circuits couplés en complexes">$$\left\{\begin{aligned}\underline U_g&=(R_1+jL_1\omega)\,\underline I_1+jM\omega\,\underline I_2\\0&=jM\omega\,\underline I_1+(R_2+jL_2\omega)\,\underline I_2\end{aligned}\right.$$</div>
  <p>La seconde équation donne \(\underline I_2 = -\dfrac{jM\omega}{R_2 + jL_2\omega}\,\underline I_1\) ; en reportant, l'impédance vue par le générateur est</p>
  <div class="formula" data-nom="Impédance d'entrée de deux circuits couplés">$$\underline Z_e=\frac{\underline U_g}{\underline I_1}=R_1+jL_1\omega+\frac{M^2\omega^2}{R_2+jL_2\omega}$$</div>
  <p>Le dernier terme est l'impédance « ramenée » du secondaire : sa partie réelle, positive, traduit la puissance prélevée par la charge.</p>
  <div class="method-box">
    <strong>Exemple — recharge sans fil</strong>
    <p>\(L_1 = L_2 = 20\ \text{µH}\), \(M = 8{,}0\ \text{µH}\), \(R_1 = 0{,}20\ \Omega\), charge et bobine 2 : \(R_2 = 5{,}0\ \Omega\), \(f = 100\ \text{kHz}\), générateur d'amplitude \(U_g = 10\ \text{V}\).</p>
    <ol>
      <li>\(L_2\omega = 12{,}6\ \Omega\), \(M\omega = 5{,}03\ \Omega\) : \(\left|\underline I_2/\underline I_1\right| = \dfrac{5{,}03}{\sqrt{5{,}0^2+12{,}6^2}} \approx 0{,}37\).</li>
      <li>\(\underline Z_e \approx 0{,}89 + 10{,}8\,j\ \Omega\), donc \(I_1 = U_g/|\underline Z_e| \approx 0{,}92\ \text{A}\) et \(I_2 \approx 0{,}34\ \text{A}\).</li>
      <li>Puissance reçue par la charge : \(\tfrac12R_2I_2^2 \approx 0{,}29\ \text{W}\) ; fournie par le générateur : \(\tfrac12\operatorname{Re}(\underline Z_e)I_1^2 \approx 0{,}38\ \text{W}\) ; la différence est dissipée dans \(R_1\). Le générateur débite surtout un courant « réactif » à cause de \(L_1\omega\) : les chargeurs réels ajoutent des condensateurs pour fonctionner à la résonance (exercice).</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Bilan énergétique.</strong> En multipliant la première équation par \(i_1\), la seconde par \(i_2\), et en les ajoutant :
    <div class="formula" data-nom="Énergie magnétique de deux circuits couplés">$$u_g\,i_1=R_1i_1^2+R_2i_2^2+\frac{\mathrm d}{\mathrm dt}\Big(\frac12L_1i_1^2+\frac12L_2i_2^2+M\,i_1i_2\Big)$$</div>
    La puissance du générateur est dissipée dans les résistances ou stockée en énergie magnétique \(U_m = \tfrac12L_1i_1^2 + \tfrac12L_2i_2^2 + Mi_1i_2\). En régime sinusoïdal, la moyenne d'une dérivée de grandeur périodique est nulle : la puissance moyenne du générateur passe dans les résistances, en particulier dans la charge du circuit 2, <strong>sans contact</strong> électrique.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Pour comprendre</span>
    <span class="prompt">Pourquoi \(|M|\) ne peut pas dépasser \(\sqrt{L_1L_2}\)</span>
    <div class="content"><p>L'énergie magnétique est positive pour tous les courants. En écrivant \(U_m = \tfrac12 i_2^2\,(L_1x^2 + 2Mx + L_2)\) avec \(x = i_1/i_2\), le trinôme en \(x\) doit rester positif : son discriminant est négatif ou nul, \(4M^2 - 4L_1L_2 \le 0\). L'égalité correspond au couplage parfait de l'influence totale.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · TRANSFORMATEUR</div>
  <h2>Changer la valeur d'une tension alternative</h2>
  <div class="intro">Le transformateur élève ou abaisse une tension alternative avec un rendement excellent. Sans lui, le transport de l'électricité sur des centaines de kilomètres serait impossible : il permet de transporter l'énergie sous très haute tension, donc sous faible courant.</div>

</figure>
  <div class="def-box">
    <strong>Transformateur idéal.</strong> Deux enroulements, le primaire (\(N_1\) spires, relié à la source) et le secondaire (\(N_2\) spires, relié à la charge), entourent un même circuit magnétique fermé. Modèle idéal : toutes les lignes de champ restent dans le circuit magnétique, de sorte que chaque spire est traversée par le même flux \(\varphi\) ; les résistances des enroulements et les pertes du fer sont négligées. On note \(m = N_2/N_1\) le <strong>rapport de transformation</strong>.
  </div>
  <div class="prop-box">
    <strong>Loi des tensions.</strong> Avec les tensions fléchées vers les bornes homologues (points de la figure) :
    <div class="formula" data-nom="Transformateur idéal : loi des tensions">$$\frac{u_2}{u_1}=\frac{N_2}{N_1}=m$$</div>
    Avec le primaire en convention récepteur et le secondaire en convention générateur, la conservation de la puissance donne \(u_1i_1 = u_2i_2\), d'où \(\dfrac{i_2}{i_1} = \dfrac1m\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Loi des tensions par la loi de Faraday</span>
    <div class="content"><p>On oriente chaque enroulement de façon qu'un courant entrant par sa borne homologue crée un flux dans le sens de \(\varphi\). Les flux totaux sont \(\Phi_1 = N_1\varphi\) et \(\Phi_2 = N_2\varphi\). Pour un enroulement sans résistance, la tension fléchée vers la borne homologue vaut \(u_k = -e_k = \mathrm d\Phi_k/\mathrm dt\) (schéma équivalent du §4). Donc \(u_1 = N_1\,\mathrm d\varphi/\mathrm dt\) et \(u_2 = N_2\,\mathrm d\varphi/\mathrm dt\) : leur rapport vaut \(N_2/N_1\) à chaque instant, quel que soit le courant débité. Le modèle idéal ne stocke ni ne dissipe d'énergie : la puissance \(u_1i_1\) reçue par le primaire est intégralement fournie à la charge, \(u_2i_2\). On retrouve la loi des tensions avec les équations de deux circuits couplés en influence totale (\(M^2 = L_1L_2\), \(M/L_1 = N_2/N_1\)) dont les enroulements n'ont pas de résistance : \(u_2 = \dfrac{M}{L_1}\,u_1\). La relation entre les courants demande en plus une inductance \(L_1\) très grande (circuit magnétique en fer).</p></div>
  </div>
  <div class="method-box">
    <strong>Exemple — alimentation d'une lampe de 12 V</strong>
    <ol>
      <li>Secteur 230 V efficaces, lampe de 24 W sous 12 V : \(m = 12/230 \approx 0{,}052\). Avec \(N_1 = 1\,150\) spires, il faut \(N_2 = mN_1 = 60\) spires.</li>
      <li>Secondaire : \(I_2 = 24/12 = 2{,}0\ \text{A}\) ; primaire : \(I_1 = mI_2 \approx 0{,}10\ \text{A}\). Le primaire, à haute tension, est parcouru par un faible courant : fil fin ; le secondaire, à basse tension, par un fort courant : fil épais.</li>
    </ol>
  </div>
  <h3>Bilan de puissance réel</h3>
  <p>Un transformateur réel reçoit \(P_1 = P_2 + P_{J} + P_{fer}\) : pertes Joule dans les enroulements (« pertes cuivre ») et pertes dans le circuit magnétique (courants de Foucault, §10, et cycles d'aimantation). Le rendement \(\eta = P_2/P_1\) dépasse 95 % pour les petits appareils et atteint 99,5 % pour les gros transformateurs du réseau. Un transformateur ne fonctionne qu'en régime variable : en continu, le flux ne varie pas et il n'y a pas d'induction.</p>
  <div class="method-box">
    <strong>Exemple — pourquoi la très haute tension ?</strong>
    <p>Une ligne de résistance \(R = 2{,}0\ \Omega\) transporte \(P = 100\ \text{MW}\). Le courant vaut \(I = P/U\) et les pertes \(P_J = RI^2 = RP^2/U^2\) (modèle simplifié, en monophasé).</p>
    <ol>
      <li>Sous \(U = 400\ \text{kV}\) : \(I = 250\ \text{A}\), \(P_J = 0{,}13\ \text{MW}\), soit 0,13 % de la puissance transportée.</li>
      <li>Sous \(U = 20\ \text{kV}\) : \(I = 5\,000\ \text{A}\), \(P_J = 50\ \text{MW}\) : la moitié de la puissance serait perdue.</li>
      <li>Les pertes varient en \(1/U^2\) : on élève la tension en sortie de centrale (de 20 kV à 400 kV), puis on l'abaisse par étapes jusqu'aux 230 V domestiques.</li>
    </ol>
  </div>
  <p>Autres usages : isolement galvanique (sécurité des appareils, le secondaire n'étant pas relié au réseau), adaptation d'une charge (une résistance \(R\) au secondaire est vue du primaire comme \(R/m^2\)), chargeurs et alimentations.</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · CIRCUIT MOBILE : RAILS DE LAPLACE</div>
  <h2>Équation électrique, équation mécanique et conversion de puissance</h2>

  <p>Dispositif : rails horizontaux, distants de \(\ell\), fermés par une résistance \(R\) (résistance totale du circuit) ; tige de masse \(m\), d'abscisse \(x\), de vitesse \(v = \dot x\), glissant sans frottement ; champ \(\vec B = B\,\vec e_z\) vertical, avec \(B \gt 0\).</p>
  <div class="method-box">
    <strong>Méthode — mise en équations, en quatre temps</strong>
    <ol>
      <li><strong>Orienter</strong> le circuit (ici dans le sens trigonométrique vu de dessus), d'où \(\vec n = \vec e_z\) et \(\Phi = B\ell x + \text{cste}\).</li>
      <li><strong>Équation électrique</strong> : \(e = -\dfrac{\mathrm d\Phi}{\mathrm dt} = -B\ell v\) ; schéma équivalent \(e = Ri\), d'où \(i = -\dfrac{B\ell v}{R}\).</li>
      <li><strong>Force de Laplace</strong> sur la tige, le vecteur \(\vec\ell\) étant orienté dans le sens du circuit (\(\vec\ell = \ell\,\vec e_y\)) : \(\vec F = i\,\vec\ell\wedge\vec B = i\ell B\,\vec e_x\).</li>
      <li><strong>Équation mécanique</strong> (principe fondamental projeté sur \(\vec e_x\), poids et réaction des rails se compensent) : \(m\dfrac{\mathrm dv}{\mathrm dt} = i\ell B + F_{op}\), où \(F_{op}\) est une éventuelle force extérieure.</li>
    </ol>
  </div>
  <p>En éliminant \(i\) : \(m\dfrac{\mathrm dv}{\mathrm dt} = -\dfrac{B^2\ell^2}{R}\,v + F_{op}\). La force de Laplace est toujours opposée à la vitesse : c'est la loi de Lenz.</p>
  <div class="prop-box">
    <strong>Conversion de puissance.</strong> Puissance de la force de Laplace : \(P_L = \vec F\cdot\vec v = i\ell Bv\) ; puissance électrique de la f.é.m. : \(e\,i = -B\ell v\,i\). Donc
    <div class="formula" data-nom="Couplage électromécanique parfait">$$P_L+e\,i=0$$</div>
    Ce résultat, admis en général, vaut pour tout circuit mobile dans un champ stationnaire (rails, spire en rotation, moteur) : les forces de Laplace prélèvent de la puissance mécanique exactement à la place où la f.é.m. fournit de la puissance électrique, ou l'inverse. Avec \(e\,i = Ri^2\), on en déduit le bilan
    <div class="formula" data-nom="Bilan énergétique des rails">$$F_{op}\,v=\frac{\mathrm d}{\mathrm dt}\Big(\frac12mv^2\Big)+R\,i^2$$</div>
  </div>
  <div class="method-box">
    <strong>Exemple — freinage d'une tige lancée</strong>
    <p>\(B = 1{,}0\ \text{T}\), \(\ell = 20\ \text{cm}\), \(m = 100\ \text{g}\), \(R = 0{,}50\ \Omega\) ; la tige est lancée à \(v_0 = 1{,}0\ \text{m·s}^{-1}\), sans force extérieure.</p>
    <ol>
      <li>\(\dfrac{\mathrm dv}{\mathrm dt} + \dfrac{v}{\tau} = 0\), avec \(\tau = \dfrac{mR}{B^2\ell^2} = \dfrac{0{,}100\times0{,}50}{1{,}0^2\times0{,}20^2} = 1{,}25\ \text{s}\) : \(v = v_0\,e^{-t/\tau}\).</li>
      <li>\(i(0) = -B\ell v_0/R = -0{,}40\ \text{A}\) : le courant circule en sens horaire vu de dessus.</li>
      <li>La tige s'arrête (asymptotiquement) après avoir parcouru \(\int_0^\infty v\,\mathrm dt = v_0\tau = 1{,}25\ \text{m}\). Toute son énergie cinétique, \(50\ \text{mJ}\), est dissipée par effet Joule.</li>
    </ol>
  </div>
  <h3>Générateur et moteur</h3>
  <ul>
    <li><strong>Générateur</strong> : un opérateur tire la tige avec une force constante \(F_{op}\). La vitesse tend vers \(v_{lim} = \dfrac{F_{op}R}{B^2\ell^2}\) ; en régime établi, la puissance mécanique \(F_{op}v_{lim}\) est intégralement convertie en puissance électrique \(Ri^2\). Même résultat pour une tige qui tombe le long de rails verticaux, avec \(F_{op} = mg\).</li>
    <li><strong>Moteur</strong> : on remplace la résistance par un générateur de f.é.m. \(E\) fléchée dans le sens d'orientation, en série avec \(R\). La loi des mailles devient \(E + e = Ri\), soit \(i = \dfrac{E - B\ell v}{R}\). La tige démarre et accélère jusqu'à \(v_{lim} = \dfrac{E}{B\ell}\), où le courant s'annule. La f.é.m. induite s'oppose à celle du générateur : c'est une <strong>force contre-électromotrice</strong>, qu'on retrouve dans le moteur à courant continu (§11).</li>
  </ul>
  <div class="notice"><strong>Erreur classique</strong> : orienter le vecteur \(\vec\ell\) de la force de Laplace au hasard. Il doit suivre l'orientation du circuit, celle qui a servi à calculer \(\Phi\) et à compter \(i\). Contrôle : la force obtenue doit freiner le mouvement quand la tige n'est reliée qu'à une résistance.</div>
  <p><strong>Applications</strong> : freins électromagnétiques, moteurs linéaires (portes automatiques, trains à sustentation magnétique, catapultes électromagnétiques des porte-avions), générateurs linéaires des houlomotrices, haut-parleur (§11).</p>
</div>

<div class="course-section">
  <div class="sec-num">§9 · SPIRE EN ROTATION : ALTERNATEUR</div>
  <h2>Produire une tension sinusoïdale</h2>
  <div class="intro">Une spire tourne dans un champ uniforme : le flux qui la traverse varie sinusoïdalement, et la f.é.m. aussi. C'est le principe de l'alternateur, qui produit la quasi-totalité de l'électricité du réseau, et de la dynamo de vélo.</div>

<figcaption>À gauche, vue selon l'axe de rotation \(\Delta\) : la spire (trait épais) tourne à la vitesse angulaire \(\omega\) ; \(\theta = \omega t\) est l'angle entre \(\vec B\) et la normale \(\vec n\). À droite, pour la spire fermée sur une résistance : f.é.m. \(e = e_0\sin\omega t\) et couple de Laplace \(\Gamma = -\Gamma_0\sin^2\omega t\), toujours résistant, de moyenne \(-\Gamma_0/2\) (tirets).</figcaption>
</figure>
  <p>Modèle du programme : spire rectangulaire (ou bobine de \(N\) spires) d'aire \(S\), en rotation uniforme à la vitesse angulaire \(\omega\) autour d'un axe fixe \(\Delta\) qui passe par les milieux de deux côtés opposés, orthogonal au champ uniforme \(\vec B\). L'angle entre \(\vec B\) et la normale est \(\theta = \omega t\). Le circuit est fermé sur une résistance \(R\) (inductance négligée).</p>
  <div class="prop-box">
    <strong>F.é.m. de la spire tournante.</strong>
    <div class="formula" data-nom="F.é.m. de la spire tournante">$$\Phi=NBS\cos\omega t\qquad e=-\frac{\mathrm d\Phi}{\mathrm dt}=NBS\,\omega\,\sin\omega t$$</div>
    L'amplitude \(e_0 = NBS\omega\) est proportionnelle à la vitesse de rotation, la fréquence est celle de la rotation.
  </div>
  <p><strong>Équation mécanique.</strong> Parcourue par \(i = e/R\), la bobine a le moment magnétique \(\vec{\mathcal M} = Ni S\,\vec n\) et subit le couple de Laplace \(\vec\Gamma = \vec{\mathcal M}\wedge\vec B\). Sa projection sur l'axe \(\Delta\), orienté dans le sens de la rotation, vaut</p>
  <div class="formula" data-nom="Couple sur la spire tournante">$$\Gamma=-NiSB\sin\omega t=-\frac{(NBS)^2\omega}{R}\,\sin^2\omega t\le0$$</div>
  <p>Le couple est toujours résistant (loi de Lenz) ; sa valeur moyenne est \(-\dfrac{(NBS)^2\omega}{2R}\). On vérifie \(\Gamma\omega + e\,i = 0\). Pour garder \(\omega\) constant, le moteur d'entraînement (turbine, roue, vent) doit fournir le couple opposé : sa puissance mécanique moyenne \(\dfrac{e_0^2}{2R}\) est convertie en puissance électrique, puis dissipée dans \(R\).</p>
  <div class="method-box">
    <strong>Exemple — petit alternateur</strong>
    <p>\(N = 200\) spires de \(5\ \text{cm}\times5\ \text{cm}\), \(B = 0{,}10\ \text{T}\), 3 000 tr/min, charge \(R = 20\ \Omega\).</p>
    <ol>
      <li>\(\omega = 2\pi\times3\,000/60 = 100\pi\ \text{rad·s}^{-1}\) : fréquence 50 Hz.</li>
      <li>Amplitude de la f.é.m. :
        <div class="formula">$$e_0 = NBS\omega = 200\times0{,}10\times2{,}5\times10^{-3}\times100\pi \approx 15{,}7\ \text{V}$$</div>
        soit une valeur efficace \(e_0/\sqrt2 \approx 11\ \text{V}\).</li>
      <li>Puissance électrique moyenne \(e_0^2/(2R) \approx 6{,}2\ \text{W}\) ; couple moyen à fournir \(6{,}2/(100\pi) \approx 2{,}0\times10^{-2}\ \text{N·m}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : la f.é.m. est nulle quand le flux est maximal (\(\theta = 0\), plan de la spire perpendiculaire à \(\vec B\)) et maximale quand la spire est parallèle au champ : c'est la <strong>variation</strong> du flux qui compte.</div>
  <p><strong>Applications</strong> : dans les alternateurs de centrale, c'est un électroaimant (le rotor) qui tourne à l'intérieur de bobines fixes : seul compte le mouvement relatif, et la puissance est récupérée sans contact glissant. À 3 000 tr/min, un rotor à une paire de pôles donne 50 Hz. Dynamos de vélo, éoliennes, groupes électrogènes fonctionnent de même. Alimentée par un courant, la même spire subit un couple : c'est le principe des moteurs (chapitre <a href="#emag/cours">« Champ magnétique et actions de Laplace »</a>).</p>
</div>

<div class="course-section">
  <div class="sec-num">§10 · COURANTS DE FOUCAULT</div>
  <h2>L'induction dans les conducteurs massifs</h2>
  <div class="intro">Dans un bloc de métal, il n'y a pas de fil : chaque courbe fermée tracée dans le métal se comporte comme un circuit. Si le métal se déplace dans un champ, ou si le champ varie, des courants induits tourbillonnent dans la masse : ce sont les courants de Foucault (1851). Ils freinent et ils chauffent.</div>
  <div class="prop-box">
    <strong>Origine.</strong> Le flux à travers les contours fermés tracés dans le conducteur varie : chaque contour est le siège d'une f.é.m. (loi de Faraday), et le métal, bon conducteur, laisse circuler des courants intenses en boucles. D'après la loi de Lenz, ils s'opposent à la cause : force de freinage sur un conducteur en mouvement, champ qui s'oppose aux variations du champ appliqué. Ils dissipent de l'énergie par effet Joule.
  </div>
  <p><strong>Mise en évidence.</strong> Une plaque d'aluminium qui oscille entre les pôles d'un aimant (pendule de Waltenhofen) s'arrête en quelques oscillations ; découpée en peigne, elle oscille presque librement, car les fentes coupent les boucles de courant. Un aimant lâché dans un tube vertical de cuivre met plusieurs secondes à en sortir, alors qu'il traverse en chute libre un tube en plastique identique.</p>
  <div class="method-box">
    <strong>Exemple — ordre de grandeur des pertes dans un disque</strong>
    <p>Disque métallique de rayon \(a\), d'épaisseur \(h\), de conductivité \(\sigma\), dans un champ uniforme perpendiculaire \(B(t) = B_0\cos\omega t\). On néglige le champ créé par les courants induits.</p>
    <ol>
      <li>Anneau de rayon \(r\), de largeur \(\mathrm dr\) : f.é.m. \(e = -\pi r^2\,\dfrac{\mathrm dB}{\mathrm dt}\), résistance \(\dfrac{2\pi r}{\sigma h\,\mathrm dr}\) ; puissance Joule \(\dfrac{e^2}{R} = \dfrac{\pi\sigma h}{2}\,r^3\Big(\dfrac{\mathrm dB}{\mathrm dt}\Big)^2\mathrm dr\).</li>
      <li>En sommant de 0 à \(a\) et en moyennant (\(\langle\sin^2\rangle = 1/2\)) : \(P = \dfrac{\pi\sigma h\,a^4B_0^2\omega^2}{16}\), soit une puissance volumique \(\dfrac{\sigma a^2B_0^2\omega^2}{16}\).</li>
      <li>Aluminium (\(\sigma = 3{,}7\times10^{7}\ \text{S·m}^{-1}\)), \(a = 5{,}0\ \text{cm}\), \(h = 0{,}50\ \text{mm}\), \(B_0 = 20\ \text{mT}\), 50 Hz : \(P \approx 0{,}9\ \text{W}\). Contrôle de l'hypothèse : le champ créé au centre par les courants induits vaut ici environ 10 % de \(B_0\) ; pour un disque deux fois plus épais, il atteindrait 20 % et le calcul ne donnerait plus qu'un ordre de grandeur.</li>
      <li>Leçons : les pertes croissent comme \(\omega^2\) (chauffage efficace à haute fréquence) et, par unité de volume, comme le carré de la taille des boucles (on les réduit en découpant le métal).</li>
    </ol>
  </div>
  <h3>Utilisations</h3>
  <ul>
    <li><strong>Freinage par induction</strong> : ralentisseurs des poids lourds et autocars (disques solidaires de la transmission qui tournent entre des électroaimants), freins sur rail de certains trains, freinage des attractions en chute libre par des aimants. Le freinage est sans contact ni usure, mais il s'annule à l'arrêt (la force est proportionnelle à la vitesse) : il faut un frein mécanique d'appoint.</li>
    <li><strong>Chauffage par induction</strong> : la plaque de cuisson contient une bobine plate alimentée vers 20 à 100 kHz ; les courants de Foucault chauffent le fond, conducteur et ferromagnétique, de la casserole, tandis que la plaque vitrocéramique, isolante, ne chauffe que par contact. Fours à induction pour fondre les métaux, trempe superficielle des pièces.</li>
    <li><strong>Détection</strong> : détecteurs de métaux, contrôle non destructif des pièces (une fissure modifie les courants induits), tri des déchets (les métaux non ferreux sont éjectés d'un tapis par un champ variable).</li>
  </ul>
  <div class="notice"><strong>Inconvénient</strong> : dans les transformateurs et les moteurs, les courants de Foucault dissipent de l'énergie dans le fer. On réalise donc les circuits magnétiques en <strong>tôles feuilletées</strong>, minces (0,3 à 0,5 mm) et isolées entre elles, parallèles au champ : les boucles de courant sont coupées et les pertes deviennent négligeables. Aux hautes fréquences, on emploie des ferrites, matériaux magnétiques isolants.</div>
</div>

<div class="course-section">
  <div class="sec-num">§11 · MOTEUR À COURANT CONTINU À ENTREFER PLAN</div>
  <h2>Des rails de Laplace en rotation</h2>

</figure>
  <p><strong>Modèle.</strong> Une tige radiale, de \(r_1\) à \(r_2\), tourne autour de l'axe \(Oz\) à la vitesse angulaire \(\omega = \dot\theta\) ; elle touche l'arbre et une couronne conductrice par des contacts glissants, reliés à une alimentation extérieure de tension \(u\). Le champ \(\vec B = B\,\vec e_z\) est uniforme dans l'entrefer. On note \(R\) la résistance du circuit et \(J\) le moment d'inertie du rotor par rapport à \(Oz\).</p>
  <ol>
    <li><strong>Orientation.</strong> On oriente le circuit pour que la normale du secteur balayé soit \(\vec e_z\) ; dans la tige, le sens positif va alors de la couronne vers l'arbre (figure).</li>
    <li><strong>Flux et f.é.m.</strong> Seul varie le flux à travers le secteur d'angle \(\theta\) compris entre \(r_1\) et \(r_2\) : \(\Phi = \dfrac{B(r_2^2 - r_1^2)}{2}\,\theta + \text{cste}\), d'où \(e = -\Phi_0\,\omega\), en posant \(\Phi_0 = \dfrac{B(r_2^2 - r_1^2)}{2}\).</li>
    <li><strong>Couple.</strong> Sur l'élément \(\mathrm dr\) de la tige (orienté vers l'axe), \(\mathrm d\vec F = i\,(-\mathrm dr\,\vec e_r)\wedge B\,\vec e_z = iB\,\mathrm dr\,\vec e_\theta\) ; son moment par rapport à \(Oz\) vaut \(r\,iB\,\mathrm dr\). En sommant : \(\Gamma = \Phi_0\,i\).</li>
  </ol>
  <div class="prop-box">
    <strong>Équations du moteur.</strong> Avec \(E = \Phi_0\,\omega\), force contre-électromotrice (\(E = -e\)), l'alimentation \(u\) fléchée dans le sens du courant :
    <div class="formula" data-nom="Moteur à courant continu : équations">$$\Gamma=\Phi_0\,i\qquad E=\Phi_0\,\omega\qquad u=R\,i+\Phi_0\,\omega\qquad J\frac{\mathrm d\omega}{\mathrm dt}=\Phi_0\,i-\Gamma_r$$</div>
    où \(\Gamma_r\) est le couple résistant de la charge. \(\Phi_0\) s'exprime en \(\text{V·s·rad}^{-1}\), ou de façon équivalente en \(\text{N·m·A}^{-1}\) (en sciences industrielles, on la note \(K\) : \(E = K\,\Omega\) et \(C_m = K\,i\)). Bilan : \(u\,i = R\,i^2 + \Phi_0\omega\,i\) et \(\Phi_0\omega\,i = \Gamma\omega\) : la puissance électrique \(Ei\) est intégralement convertie en puissance mécanique.
  </div>
  <p>Un moteur réel porte de nombreux conducteurs en série, sous des aimants de polarités alternées ; un collecteur à balais inverse le courant dans chaque conducteur quand il passe d'un pôle à l'autre, pour que tous les couples s'ajoutent. Les relations restent \(\Gamma = \Phi_0\,i\) et \(E = \Phi_0\,\omega\), avec un \(\Phi_0\) plus grand. Elles valent aussi pour le moteur à entrefer cylindrique usuel.</p>
  <div class="method-box">
    <strong>Exemple — point de fonctionnement</strong>
    <p>Disque : \(r_1 = 1\ \text{cm}\), \(r_2 = 5\ \text{cm}\), \(B = 0{,}50\ \text{T}\) ; une tige donne \(\Phi_0 = 6{,}0\times10^{-4}\ \text{Wb}\), et 100 conducteurs en série \(\Phi_0 = 0{,}060\ \text{V·s·rad}^{-1}\). Alimentation \(u = 24\ \text{V}\), \(R = 2{,}0\ \Omega\), couple résistant \(\Gamma_r = 0{,}12\ \text{N·m}\).</p>
    <ol>
      <li>Régime permanent : \(i = \Gamma_r/\Phi_0 = 2{,}0\ \text{A}\) ; \(\omega = (u - Ri)/\Phi_0 \approx 333\ \text{rad·s}^{-1}\), soit environ 3 200 tr/min.</li>
      <li>Rendement : \(\dfrac{\Gamma_r\omega}{u\,i} = \dfrac{40}{48} \approx 83\ \%\), les pertes étant l'effet Joule \(Ri^2 = 8\ \text{W}\).</li>
      <li>Au démarrage (\(\omega = 0\), pas de f.c.é.m.), \(i = u/R = 12\ \text{A}\) : six fois le courant nominal, d'où les dispositifs de démarrage progressif. À vide, la vitesse tend vers \(u/\Phi_0 = 400\ \text{rad·s}^{-1}\).</li>
    </ol>
  </div>
  <p><strong>Réversibilité.</strong> Entraînée par un couple extérieur, la machine fonctionne en génératrice : la f.é.m. \(\Phi_0\omega\) débite dans une charge, et le couple de Laplace devient résistant. C'est le freinage par récupération des véhicules électriques. <strong>Utilisations</strong> du moteur à courant continu : jouets et modélisme, petits appareils sur batterie, essuie-glaces et lève-vitres, robotique et servomoteurs ; la version à entrefer plan, très peu inertielle (rotor mince sans fer), convient aux démarrages et aux arrêts rapides.</p>
  <div class="method-box">
    <strong>Application — haut-parleur électrodynamique</strong>
    <p>Une bobine solidaire de la membrane, de longueur de fil totale \(\ell\), est plongée dans le champ radial d'un aimant annulaire. Comme la tige des rails, elle subit une force axiale \(F = B\ell i\) et, d'après \(P_L + e\,i = 0\), elle est le siège de la f.é.m. \(e = -B\ell v\). D'où les deux équations couplées (membrane de masse \(m\), suspension de raideur \(k\), frottement \(\alpha v\)) :</p>
    <div class="formula" data-nom="Haut-parleur : équations couplées">$$u=R\,i+L\frac{\mathrm di}{\mathrm dt}+B\ell\,v\qquad m\frac{\mathrm dv}{\mathrm dt}=-kx-\alpha v+B\ell\,i$$</div>
    <p>Exemple : \(B = 1{,}0\ \text{T}\), \(\ell = 5\ \text{m}\) de fil, \(i = 1\ \text{A}\) donnent \(5\ \text{N}\). Le microphone électrodynamique est le même dispositif utilisé en sens inverse.</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Ce qu'il y a derrière la loi de Faraday</h2>
  <div class="intro">Le programme de PTSI s'en tient au flux. Pour la curiosité, et pour préparer la 2ᵉ année :</div>
  <ul>
    <li><strong>Circuit mobile</strong> : la f.é.m. vient de la force de Lorentz \(q\,\vec v\wedge\vec B\) sur les porteurs de charge du conducteur en mouvement ; sa circulation le long du circuit, \(e = \oint(\vec v\wedge\vec B)\cdot\mathrm d\vec\ell\) (« champ électromoteur »), redonne \(-\mathrm d\Phi/\mathrm dt\).</li>
    <li><strong>Circuit fixe, champ variable</strong> : un champ magnétique variable crée un champ électrique dont la circulation sur le circuit vaut \(-\mathrm d\Phi/\mathrm dt\) : c'est l'équation de Maxwell-Faraday, vue en 2ᵉ année.</li>
    <li><strong>Formule de Neumann</strong> : \(M = \dfrac{\mu_0}{4\pi}\displaystyle\oint_1\oint_2\frac{\mathrm d\vec\ell_1\cdot\mathrm d\vec\ell_2}{r_{12}}\), symétrique en 1 et 2, ce qui justifie \(M_{12} = M_{21}\).</li>
    <li><strong>Énergie localisée dans le champ</strong> : l'énergie magnétique est répartie dans l'espace avec la densité \(\dfrac{B^2}{2\mu_0}\) ; pour la bobine longue, \(\dfrac{B^2}{2\mu_0}\,S\ell = \dfrac12Li^2\) (2ᵉ année).</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · INDUCTION</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles : orienter un circuit et calculer un flux, appliquer la loi de Faraday avec ses conventions et la traduire par un schéma électrique équivalent, prévoir les sens par la loi de Lenz, séparer flux propre et flux extérieur, calculer \(L\) et \(M\) pour des bobines longues, mettre en équations des circuits couplés et un transformateur, écrire les équations électrique et mécanique d'un circuit mobile, faire un bilan de puissance électromécanique et étudier une machine tournante. Un seul fil conducteur : <strong>on oriente d'abord</strong>, tout le reste en découle.</div>

  <div class="method-box"><strong>Méthode 1 — Orienter un circuit et calculer le flux d'un champ uniforme</strong>
    <ol>
      <li><span class="step">Sens de parcours.</span> Choisir arbitrairement un sens positif sur le circuit et le marquer d'une flèche sur le schéma ; s'y tenir jusqu'au bout.</li>
      <li><span class="step">Normale.</span> En déduire la normale \(\vec n\) à la surface qui s'appuie sur le circuit par la règle de la main droite (doigts recourbés dans le sens du circuit, pouce selon \(\vec n\)).</li>
      <li><span class="step">Angle.</span> Repérer l'angle \(\theta\) entre \(\vec B\) et \(\vec n\) (pas avec le plan du circuit).</li>
      <li><span class="step">Flux.</span> \(\Phi = N\,B\,S\cos\theta\) pour \(N\) spires planes identiques d'aire \(S\) dans un champ uniforme ; il est algébrique : son signe dépend de l'orientation choisie.</li>
    </ol>
    <p><em>Exemple éclair :</em> bobine plate de \(N = 20\) spires de rayon \(3{,}0\ \text{cm}\), dans un champ \(B = 0{,}40\ \text{T}\) qui fait 60° avec la normale : \(S = \pi\times(0{,}030)^2 \approx 2{,}8\times10^{-3}\ \text{m}^2\), d'où \(\Phi = NBS\cos60° \approx 1{,}1\times10^{-2}\ \text{Wb}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : un énoncé qui donne l'angle entre \(\vec B\) et le <em>plan</em> de la spire demande \(\theta = 90° - \alpha\). Un champ parallèle au plan du circuit donne un flux nul, quelle que soit son intensité.</div>

  <div class="method-box"><strong>Méthode 2 — Appliquer la loi de Faraday et tracer le schéma électrique équivalent</strong>
    <ol>
      <li><span class="step">Orientation.</span> Circuit orienté et \(\Phi(t)\) calculé avec la normale associée (méthode 1).</li>
      <li><span class="step">F.é.m.</span> \(e = -\dfrac{\mathrm d\Phi}{\mathrm dt}\), algébrique, comptée dans le sens d'orientation.</li>
      <li><span class="step">Schéma.</span> Remplacer le phénomène d'induction par un générateur idéal de f.é.m. \(e\), fléché dans le sens d'orientation, en série avec les dipôles du circuit ; compter \(i\) dans le même sens (convention générateur pour \(e\)).</li>
      <li><span class="step">Loi des mailles.</span> Pour un circuit seulement résistif : \(e = R\,i\). Un résultat \(i \lt 0\) signifie que le courant circule en sens inverse de l'orientation.</li>
    </ol>
    <p><em>Exemple éclair :</em> spire d'aire \(50\ \text{cm}^2\), de résistance \(0{,}10\ \Omega\), dans un champ normal qui décroît de \(0{,}80\ \text{T}\) à zéro en \(0{,}20\ \text{s}\) ; \(\vec n\) dans le sens de \(\vec B\). Alors \(e = -S\,\dfrac{\mathrm dB}{\mathrm dt} = -5{,}0\times10^{-3}\times(-4{,}0) = +20\ \text{mV}\) et \(i = +0{,}20\ \text{A}\) : le courant circule dans le sens d'orientation et renforce le champ qui diminue.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : écrire \(e = BS\omega\) ou \(e = B\ell v\) « en valeur absolue », puis deviner le signe. Le programme exige les conventions d'algébrisation : orientation → \(\vec n\) → \(\Phi\) → \(e\) → \(i\).</div>

  <div class="method-box"><strong>Méthode 3 — Prévoir un sens avec la loi de Lenz et contrôler un signe</strong>
    <ol>
      <li><span class="step">Cause.</span> Identifier ce qui fait varier le flux : un champ qui croît ou décroît, un circuit qui se déplace ou tourne, un aimant qui approche ou s'éloigne.</li>
      <li><span class="step">Effet sur le champ.</span> Le courant induit crée un champ qui s'oppose à la <em>variation</em> du flux : opposé au champ extérieur si le flux croît, de même sens s'il décroît. La main droite donne alors le sens du courant.</li>
      <li><span class="step">Effet sur les forces.</span> Les forces de Laplace sur le circuit induit s'opposent au mouvement relatif qui crée l'induction : freinage, répulsion d'un aimant qui approche, attraction d'un aimant qui s'éloigne.</li>
      <li><span class="step">Contrôle.</span> Comparer avec le signe de \(i\) obtenu par la loi de Faraday : un désaccord signale une erreur d'orientation.</li>
    </ol>
    <p><em>Exemple éclair :</em> un aimant tombe à travers une bobine de 100 spires ; le flux par spire passe de 0 à \(1{,}0\times10^{-4}\ \text{Wb}\) en 50 ms à l'entrée, puis revient à 0 en 30 ms à la sortie (l'aimant a accéléré). F.é.m. moyennes : \(-100\times10^{-4}/0{,}050 = -0{,}20\ \text{V}\), puis \(+100\times10^{-4}/0{,}030 \approx +0{,}33\ \text{V}\). Les signes sont opposés (le courant s'oppose d'abord à l'augmentation, puis à la diminution du flux) et les aires \(\int e\,\mathrm dt\) sont égales et opposées, car le flux revient à sa valeur initiale.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : la loi de Lenz donne un <strong>sens</strong>, jamais une valeur, et le champ induit ne « compense » pas la variation du flux : il est souvent très faible devant le champ extérieur.</div>

  <div class="method-box"><strong>Méthode 4 — Séparer flux propre et flux extérieur, écrire la loi des mailles d'un circuit inductif</strong>
    <ol>
      <li><span class="step">Flux total.</span> \(\Phi = L\,i + \Phi_{\text{ext}}\) : le flux propre \(L\,i\) vient du courant du circuit lui-même, \(\Phi_{\text{ext}}\) des aimants et des autres circuits.</li>
      <li><span class="step">F.é.m. totale.</span> \(e = -L\,\dfrac{\mathrm di}{\mathrm dt} - \dfrac{\mathrm d\Phi_{\text{ext}}}{\mathrm dt}\). Dans le schéma, le terme propre devient une bobine \(L\) (tension \(u = L\,\mathrm di/\mathrm dt\) en convention récepteur, plus \(r\,i\) si elle est résistive), le terme extérieur reste un générateur.</li>
      <li><span class="step">Continuité.</span> Le courant dans une bobine est continu ; en régime permanent continu, une bobine idéale se comporte comme un fil.</li>
      <li><span class="step">Négliger ?</span> Comparer \(\tau = L/R\) à la durée des variations : une spire de quelques centimètres a \(L\) de l'ordre de \(0{,}1\ \mu\text{H}\), souvent négligeable ; une bobine de TP (quelques mH à quelques centaines de mH), jamais.</li>
    </ol>
    <p><em>Exemple éclair :</em> générateur \(E = 10\ \text{V}\), résistance \(R = 40\ \Omega\), bobine \(L = 0{,}10\ \text{H}\) de résistance \(r = 10\ \Omega\) : en régime établi, \(i = E/(R + r) = 0{,}20\ \text{A}\). On remplace soudain le générateur par un fil : \(i(0^+) = 0{,}20\ \text{A}\) (continuité), puis \(i\) décroît avec \(\tau = L/(R + r) = 2{,}0\ \text{ms}\). La tension de la bobine passe de \(r\,i = +2{,}0\ \text{V}\) à \(-R\,i(0^+) = -8{,}0\ \text{V}\) : elle change de signe, pas le courant.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Calculer l'inductance propre et l'inductance mutuelle de bobines longues</strong>
    <ol>
      <li><span class="step">Champ.</span> Dans une bobine longue de \(N_1\) spires et de longueur \(\ell_1\) : \(B_1 = \mu_0\,\dfrac{N_1}{\ell_1}\,i_1\), uniforme (résultat admis), nul à l'extérieur.</li>
      <li><span class="step">Inductance propre.</span> Flux à travers ses propres \(N_1\) spires : \(N_1B_1S_1 = L_1i_1\), d'où \(L_1 = \dfrac{\mu_0N_1^2S_1}{\ell_1}\).</li>
      <li><span class="step">Inductance mutuelle.</span> Flux de \(\vec B_1\) à travers les \(N_2\) spires de l'autre bobine, sur la seule aire où \(B_1\) existe (la plus petite des deux sections) : \(N_2B_1S = M\,i_1\). Le signe de \(M\) dépend des orientations.</li>
      <li><span class="step">Contrôle.</span> \(|M| \le \sqrt{L_1L_2}\), avec égalité en influence totale (mêmes longueur et section, bobinages superposés).</li>
    </ol>
    <p><em>Exemple éclair :</em> bobine de 200 spires, longue de \(20\ \text{cm}\), de section \(10\ \text{cm}^2\) : \(L = \dfrac{4\pi\times10^{-7}\times200^2\times1{,}0\times10^{-3}}{0{,}20} \approx 0{,}25\ \text{mH}\). Une petite bobine de 30 spires et de section \(2{,}0\ \text{cm}^2\), placée à l'intérieur sur le même axe : \(M = \dfrac{\mu_0\times200\times30\times2{,}0\times10^{-4}}{0{,}20} \approx 7{,}5\ \mu\text{H}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : prendre la section de la grande bobine pour calculer le flux à travers la petite (seule la section de la petite est traversée), ou écrire \(N\) au lieu de \(N^2\) dans \(L\) (le champ est proportionnel à \(N\), et il traverse \(N\) spires).</div>

  <div class="method-box"><strong>Méthode 6 — Mettre en équations deux circuits couplés en régime sinusoïdal forcé</strong>
    <ol>
      <li><span class="step">Orienter.</span> Chaque circuit dans le sens de son courant \(i_1\), \(i_2\) ; flux totaux \(\Phi_1 = L_1i_1 + M\,i_2\) et \(\Phi_2 = L_2i_2 + M\,i_1\).</li>
      <li><span class="step">Schémas équivalents.</span> En convention récepteur, chaque bobine a pour tension \(u_k = \mathrm d\Phi_k/\mathrm dt\), soit \(u_1 = L_1\dfrac{\mathrm di_1}{\mathrm dt} + M\dfrac{\mathrm di_2}{\mathrm dt}\), et de même pour \(u_2\).</li>
      <li><span class="step">Lois des mailles.</span> Une par circuit, avec ses résistances et son éventuel générateur.</li>
      <li><span class="step">Complexes.</span> \(\mathrm d/\mathrm dt \to j\omega\) ; résoudre le système linéaire : la seconde équation donne \(\underline I_2\) en fonction de \(\underline I_1\), la première l'impédance vue par le générateur.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(L_1 = L_2 = 1{,}0\ \text{mH}\), \(M = 0{,}50\ \text{mH}\), circuit 2 fermé sur \(R_2 = 10\ \Omega\), \(f = 1{,}0\ \text{kHz}\) : \(\dfrac{\underline I_2}{\underline I_1} = -\dfrac{jM\omega}{R_2 + jL_2\omega}\), de module \(\dfrac{3{,}14}{\sqrt{10^2 + 6{,}28^2}} \approx 0{,}27\) ; impédance ramenée au primaire \(\dfrac{M^2\omega^2}{R_2 + jL_2\omega} \approx 0{,}71 - 0{,}44\,j\ \Omega\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier le terme de couplage dans l'une des deux équations (il apparaît dans les deux, avec le même \(M\)), ou changer l'orientation d'un circuit en cours de route sans changer le signe de \(M\).</div>

  <div class="method-box"><strong>Méthode 7 — Utiliser le modèle du transformateur idéal</strong>
    <ol>
      <li><span class="step">Rapport.</span> \(m = N_2/N_1\) : élévateur si \(m \gt 1\), abaisseur si \(m \lt 1\).</li>
      <li><span class="step">Tensions.</span> Fléchées vers les bornes homologues : \(u_2 = m\,u_1\) à chaque instant (loi des tensions, établie par la loi de Faraday avec le même flux par spire).</li>
      <li><span class="step">Courants.</span> Primaire en convention récepteur, secondaire en convention générateur, puissance conservée : \(u_1i_1 = u_2i_2\), donc \(i_1 = m\,i_2\). Le côté à haute tension a le faible courant.</li>
      <li><span class="step">Charge ramenée.</span> Une résistance \(R\) au secondaire est vue du primaire comme \(R/m^2\). Pour un transformateur réel, \(P_1 = P_2 + \text{pertes}\) et \(\eta = P_2/P_1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> adaptateur 230 V → 5,0 V (valeurs efficaces, avant redressement) qui débite 2,0 A : \(m = 5{,}0/230 \approx 0{,}022\), \(I_1 = m\,I_2 \approx 43\ \text{mA}\), \(P = 10\ \text{W}\). La charge de \(2{,}5\ \Omega\) est vue du secteur comme \(2{,}5/m^2 \approx 5{,}3\ \text{k}\Omega\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : appliquer le rapport des tensions aux courants (il est inversé), ou alimenter un transformateur en continu : le flux ne varie pas, il n'y a ni f.é.m. au secondaire ni limitation du courant primaire autre que la résistance du fil.</div>

  <div class="method-box"><strong>Méthode 8 — Mettre en équations un circuit mobile (rails de Laplace)</strong>
    <ol>
      <li><span class="step">Repère et orientation.</span> Axe \(Ox\) selon les rails, position \(x\) de la tige, \(v = \dot x\) ; circuit orienté, normale \(\vec n\) ; \(\Phi(x)\).</li>
      <li><span class="step">Équation électrique.</span> \(e = -\mathrm d\Phi/\mathrm dt\) (proportionnelle à \(v\)) ; schéma équivalent et loi des mailles, par exemple \(e = R\,i\).</li>
      <li><span class="step">Force de Laplace.</span> \(\vec F = i\,\vec\ell\wedge\vec B\) sur la tige, avec \(\vec\ell\) orienté <em>dans le sens d'orientation du circuit</em> (celui de \(i\)).</li>
      <li><span class="step">Équation mécanique.</span> Principe fondamental de la dynamique projeté sur \(Ox\) ; éliminer \(i\) pour obtenir une équation en \(v\), du premier ordre.</li>
      <li><span class="step">Contrôle.</span> La force de Laplace doit s'opposer à la vitesse lorsque le circuit ne contient que des résistances (loi de Lenz).</li>
    </ol>
    <p><em>Exemple éclair :</em> rails distants de \(\ell = 10\ \text{cm}\), \(B = 0{,}50\ \text{T}\), \(R = 0{,}20\ \Omega\), tige de \(20\ \text{g}\) : \(m\dot v = -\dfrac{B^2\ell^2}{R}\,v\), constante de temps \(\tau = \dfrac{mR}{B^2\ell^2} = \dfrac{0{,}020\times0{,}20}{0{,}25\times0{,}010} = 1{,}6\ \text{s}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : changer d'orientation entre l'équation électrique et la force de Laplace. Le même sens doit servir à calculer \(\Phi\), à compter \(i\) et à orienter \(\vec\ell\) ; sinon, on trouve une tige qui accélère toute seule.</div>

  <div class="method-box"><strong>Méthode 9 — Faire un bilan de puissance électromécanique</strong>
    <ol>
      <li><span class="step">Électrique.</span> Multiplier la loi des mailles par \(i\) : \(e\,i\) (puissance fournie par la f.é.m. induite) \(= R\,i^2\) \(+\) puissance reçue par les autres dipôles.</li>
      <li><span class="step">Mécanique.</span> Multiplier l'équation mécanique par \(v\) (ou par \(\omega\)) : théorème de la puissance cinétique, avec \(P_L = \vec F\cdot\vec v\) (ou \(\Gamma\omega\)).</li>
      <li><span class="step">Couplage.</span> Utiliser \(P_L + e\,i = 0\) : la puissance prélevée par les forces de Laplace est exactement celle que reçoit le circuit (ou l'inverse en moteur).</li>
      <li><span class="step">Conclure.</span> Puissance de l'opérateur \(=\) variation d'énergie cinétique \(+\) effet Joule (\(+\) énergie magnétique s'il y a une bobine) ; en régime établi, toute la puissance mécanique est convertie.</li>
    </ol>
    <p><em>Exemple éclair :</em> tige tirée par une force constante \(F_{op} = 0{,}10\ \text{N}\) sur les rails de la méthode 8 : vitesse limite \(v_{lim} = \dfrac{F_{op}R}{B^2\ell^2} = 8{,}0\ \text{m·s}^{-1}\), courant \(B\ell v_{lim}/R = 2{,}0\ \text{A}\) ; on vérifie \(F_{op}v_{lim} = R\,i^2 = 0{,}80\ \text{W}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : compter deux fois la conversion. \(P_L\) et \(e\,i\) décrivent le même échange vu de chaque côté ; dans le bilan global, ils disparaissent ensemble.</div>

  <div class="method-box"><strong>Méthode 10 — Étudier une machine tournante : spire en rotation, moteur à courant continu</strong>
    <ol>
      <li><span class="step">Spire en rotation.</span> \(\theta = \omega t\) entre \(\vec B\) et \(\vec n\) : \(\Phi = NBS\cos\omega t\), \(e = NBS\omega\sin\omega t\) ; couple de Laplace \(\vec\Gamma = \vec{\mathcal M}\wedge\vec B\) avec \(\vec{\mathcal M} = Ni S\,\vec n\), soit \(\Gamma = -NBS\,i\sin\omega t\) sur l'axe orienté dans le sens de rotation.</li>
      <li><span class="step">Moteur à courant continu.</span> Deux relations caractéristiques, \(E = \Phi_0\,\omega\) (force contre-électromotrice) et \(\Gamma = \Phi_0\,i\), avec la même constante \(\Phi_0\) (en \(\text{V·s·rad}^{-1} = \text{N·m·A}^{-1}\)).</li>
      <li><span class="step">Équations.</span> Électrique : \(u = R\,i + \Phi_0\,\omega\) ; mécanique : \(J\,\dfrac{\mathrm d\omega}{\mathrm dt} = \Phi_0\,i - \Gamma_r\).</li>
      <li><span class="step">Régime permanent.</span> Le couple résistant fixe le courant (\(i = \Gamma_r/\Phi_0\)), la tension fixe alors la vitesse (\(\omega = (u - Ri)/\Phi_0\)) ; rendement \(\Gamma_r\omega/(u\,i)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\Phi_0 = 0{,}020\ \text{V·s·rad}^{-1}\), \(R = 1{,}0\ \Omega\), \(u = 6{,}0\ \text{V}\) : à vide, \(\omega \to u/\Phi_0 = 300\ \text{rad·s}^{-1}\) ; avec \(\Gamma_r = 0{,}040\ \text{N·m}\), \(i = 2{,}0\ \text{A}\) et \(\omega = 200\ \text{rad·s}^{-1}\) ; au démarrage, \(i = u/R = 6{,}0\ \text{A}\) et le couple vaut \(0{,}12\ \text{N·m}\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : oublier la force contre-électromotrice (le courant ne vaut \(u/R\) qu'à l'arrêt), ou croire que la f.é.m. d'une spire tournante est maximale quand le flux l'est : elle est maximale quand le plan de la spire est parallèle au champ. Pour les courants de Foucault, même raisonnement qualitatif qu'à la méthode 3 : chaque boucle de courant dans le métal est un circuit, et les effets s'opposent à la cause (freinage, échauffement).</div>
</div>
