<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Flux et f.é.m. induite : spire dans un champ sinusoïdal</h3>
  <div class="statement">Une spire carrée de côté \(a = 10\ \text{cm}\), de résistance \(R = 10\ \Omega\), est fixe dans un champ magnétique uniforme perpendiculaire à son plan : \(\vec B(t) = B_0\sin(\omega t)\,\vec e_z\), avec \(B_0 = 0{,}50\ \text{T}\) et \(f = 50\ \text{Hz}\). On oriente la spire de sorte que sa normale soit \(\vec n = \vec e_z\). On néglige l'inductance propre de la spire.</div>
  <div class="q"><strong>Q1.</strong> Calculer le flux \(\Phi(t)\) à travers la spire.</div>
  <div class="q"><strong>Q2.</strong> En déduire la f.é.m. induite \(e(t)\) et son amplitude.</div>
  <div class="q"><strong>Q3.</strong> Dessiner le schéma électrique équivalent et calculer l'amplitude du courant induit.</div>
  <div class="q"><strong>Q4.</strong> Juste après \(t = 0\), le flux croît. Dans quel sens circule le courant ? Vérifier la loi de Lenz.</div>
  <div class="q"><strong>Q5.</strong> On incline la spire pour que sa normale fasse un angle de 60° avec \(\vec e_z\). Que devient l'amplitude de la f.é.m. ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le champ est uniforme et colinéaire à \(\vec n\) : \(\Phi(t) = \vec B\cdot\vec n\,S = B_0S\sin(\omega t)\), avec \(S = a^2 = 1{,}0\times10^{-2}\ \text{m}^2\) et \(\omega = 2\pi f = 100\pi\ \text{rad·s}^{-1}\) : \(\Phi(t) = 5{,}0\times10^{-3}\sin(100\pi t)\ \text{Wb}\).</p>
    <p><strong>Q2.</strong> Loi de Faraday : \(e(t) = -\dfrac{\mathrm d\Phi}{\mathrm dt} = -B_0S\omega\cos(\omega t)\), comptée dans le sens d'orientation. Amplitude : \(e_0 = B_0S\omega = 0{,}50\times0{,}010\times100\pi \approx 1{,}57\ \text{V}\).</p>
    <p><strong>Q3.</strong> Schéma : générateur de f.é.m. \(e\), fléché dans le sens d'orientation, en série avec \(R\) ; \(i\) est compté dans le même sens et \(e = Ri\). Amplitude : \(I_0 = e_0/R \approx 0{,}16\ \text{A}\).</p>
    <p><strong>Q4.</strong> Près de \(t = 0\), \(e \approx -e_0 \lt 0\), donc \(i \lt 0\) : le courant circule en sens inverse de l'orientation. Par la main droite, il crée au centre de la spire un champ selon \(-\vec e_z\), opposé à \(\vec B\) qui croît : il s'oppose bien à l'augmentation du flux (loi de Lenz).</p>
    <p><strong>Q5.</strong> Le flux devient \(B_0S\cos60°\sin(\omega t)\) : l'amplitude est divisée par deux, \(e_0' \approx 0{,}79\ \text{V}\). Elle serait nulle si le champ était parallèle au plan de la spire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Prévoir le sens du courant induit : trois expériences</h3>
  <div class="statement">On interprète trois expériences classiques avec la loi de Lenz, puis on estime un ordre de grandeur avec la loi de Faraday.</div>
  <div class="q"><strong>Q1.</strong> On approche le pôle <em>sud</em> d'un aimant droit d'une bobine fermée sur un ampèremètre, le long de son axe. Dans quel sens tourne le courant induit, vu depuis l'aimant ? La bobine est-elle attirée ou repoussée ?</div>
  <div class="q"><strong>Q2.</strong> Une spire carrée et un fil rectiligne infini, parcouru par un courant constant \(I\), sont dans le même plan. On éloigne la spire du fil, en translation perpendiculaire au fil. Dans quel sens circule le courant induit dans le côté de la spire le plus proche du fil ? La spire est-elle attirée ou repoussée par le fil ?</div>
  <div class="q"><strong>Q3.</strong> Un petit aimant droit tombe verticalement le long de l'axe d'une bobine de \(N = 500\) spires reliée à un oscilloscope (entrée de très grande résistance : le courant est négligeable). Décrire l'allure de la tension \(e(t)\) observée. Pourquoi y a-t-il deux impulsions de signes opposés ? Pourquoi la seconde est-elle plus haute et plus brève ? Que vaut \(\int e\,\mathrm dt\) sur toute la chute ?</div>
  <div class="q"><strong>Q4.</strong> Le flux par spire vaut au plus \(\Phi_1 = 2{,}0\times10^{-5}\ \text{Wb}\) (aimant au centre de la bobine), et la première impulsion dure environ \(20\ \text{ms}\). Estimer la tension. La chute de l'aimant est-elle freinée ? Et si l'on court-circuite la bobine ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Près d'un pôle sud, le champ de l'aimant est dirigé <em>vers</em> l'aimant. Le flux de ce champ à travers la bobine augmente : le courant induit crée un champ opposé, dirigé dans la bobine en s'éloignant de l'aimant. Ce champ entre dans la bobine par la face tournée vers l'aimant, qui est donc une face <strong>sud</strong>. Vu depuis l'aimant, un champ qui s'éloigne de l'observateur correspond à un courant qui tourne dans le sens <strong>horaire</strong>. Deux faces sud en regard se repoussent : la bobine est repoussée, elle s'oppose au rapprochement.</p>
    <p><strong>Q2.</strong> Le champ du fil traverse la spire perpendiculairement à son plan ; il décroît avec la distance, donc le flux diminue quand la spire s'éloigne. Le courant induit crée dans la spire un champ <strong>de même sens</strong> que celui du fil. Avec la main droite (par exemple, fil vertical, courant vers le haut, spire à droite : champ entrant dans la feuille), il faut un courant qui tourne dans le sens horaire, c'est-à-dire qui monte dans le côté proche du fil : ce côté porte un courant <strong>de même sens que \(I\)</strong>. La loi de Lenz donne directement la force : elle s'oppose à l'éloignement, la spire est <strong>attirée</strong> (le côté proche, dans un champ plus intense, l'emporte sur le côté éloigné, parcouru en sens inverse).</p>
    <p><strong>Q3.</strong> Quand l'aimant approche du centre de la bobine, le flux augmente : première impulsion, d'un signe. Quand il s'éloigne, le flux diminue : seconde impulsion, de signe opposé (la loi de Lenz fait s'opposer le courant d'abord à l'augmentation, puis à la diminution). Entre les deux, quand l'aimant traverse le centre, le flux est maximal et \(e\) s'annule. L'aimant, en chute libre, est plus rapide à la sortie : la même variation de flux se fait en moins de temps, donc la seconde impulsion est plus brève et plus haute. Sur toute la chute, \(\int e\,\mathrm dt = -\big(\Phi_{\text{fin}} - \Phi_{\text{début}}\big) = 0\), car le flux est nul loin de la bobine, avant et après : les deux impulsions ont des aires égales et opposées.</p>
    <p><strong>Q4.</strong> Ordre de grandeur : \(|e| \approx \dfrac{N\Phi_1}{\Delta t} = \dfrac{500\times2{,}0\times10^{-5}}{0{,}020} = 0{,}5\ \text{V}\), facile à mesurer. Le courant étant négligeable, il n'y a pas de force de Laplace : l'aimant n'est pas freiné. Si l'on court-circuite la bobine, un courant circule ; ses effets s'opposent au mouvement de l'aimant (répulsion à l'approche, attraction après le passage) : la chute est légèrement ralentie, et l'énergie mécanique perdue est dissipée par effet Joule dans le bobinage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Établissement du courant dans une bobine : énergie et mesure de L</h3>
  <div class="statement">Un circuit série comprend une résistance \(R = 100\ \Omega\) et une bobine idéale \(L = 50\ \text{mH}\). À \(t = 0\), on le relie à une source de tension constante \(E = 12\ \text{V}\) ; le courant est nul avant la fermeture.</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation différentielle vérifiée par \(i(t)\) et calculer la constante de temps \(\tau\).</div>
  <div class="q"><strong>Q2.</strong> Donner \(i(t)\) et la tension \(u_L(t)\) de la bobine (convention récepteur). Que valent-elles juste après la fermeture et en régime établi ?</div>
  <div class="q"><strong>Q3.</strong> Écrire le bilan de puissance du circuit. Calculer l'énergie stockée dans la bobine en régime établi.</div>
  <div class="q"><strong>Q4.</strong> Calculer l'énergie fournie par la source, l'énergie stockée et l'énergie dissipée entre \(t = 0\) et \(t = 5\tau\). L'énergie fournie se partage-t-elle à parts égales entre la bobine et la résistance, comme pour la charge d'un condensateur ?</div>
  <div class="q"><strong>Q5.</strong> En TP, on mesure \(L\) d'une bobine réelle : en série avec \(R = 100\ \Omega\), alimentée par un générateur de signaux carrés de résistance interne \(50\ \Omega\), la bobine de résistance \(r = 10\ \Omega\) donne \(\tau = 0{,}31\ \text{ms}\). Que vaut \(L\) ? Quelle erreur ferait-on en oubliant \(r\) et la résistance interne ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Loi des mailles : \(E = Ri + L\dfrac{\mathrm di}{\mathrm dt}\), soit \(\dfrac{\mathrm di}{\mathrm dt} + \dfrac{i}{\tau} = \dfrac{E}{L}\) avec \(\tau = \dfrac LR = \dfrac{50\times10^{-3}}{100} = 0{,}50\ \text{ms}\).</p>
    <p><strong>Q2.</strong> Avec la continuité du courant dans la bobine, \(i(0^+) = 0\) : \(i(t) = I_\infty\big(1 - e^{-t/\tau}\big)\), \(I_\infty = E/R = 0{,}12\ \text{A}\). La tension \(u_L = L\,\mathrm di/\mathrm dt = E\,e^{-t/\tau}\) saute de 0 à \(E = 12\ \text{V}\) à la fermeture (\(Ri = 0\) : toute la tension est aux bornes de la bobine) et tend vers 0 en régime établi (la bobine idéale se comporte alors comme un fil).</p>
    <p><strong>Q3.</strong> En multipliant la loi des mailles par \(i\) : \(Ei = Ri^2 + \dfrac{\mathrm d}{\mathrm dt}\Big(\dfrac12Li^2\Big)\). La puissance fournie est dissipée par effet Joule ou stockée. En régime établi, l'énergie magnétique vaut</p>
    <div class="formula">$$U_m = \frac12LI_\infty^2 = \frac12\times0{,}050\times0{,}12^2 = 3{,}6\times10^{-4}\ \text{J}$$</div>
    <p><strong>Q4.</strong> En intégrant \(Ei\) de 0 à \(T = 5\tau\) :</p>
    <div class="formula">$$W_E = EI_\infty\Big[T - \tau\big(1 - e^{-T/\tau}\big)\Big] = 1{,}44\times\big(2{,}5 - 0{,}50\times0{,}993\big)\times10^{-3} \approx 2{,}9\ \text{mJ}$$</div>
    <p>Énergie stockée à \(5\tau\) : \(\tfrac12L\,i(5\tau)^2 \approx 0{,}36\ \text{mJ}\) ; énergie dissipée : \(W_R = W_E - U_m \approx 2{,}5\ \text{mJ}\). Il n'y a <strong>pas</strong> de partage à parts égales : contrairement au condensateur, dont le courant s'annule à la fin de la charge, la bobine laisse passer en régime établi le courant \(I_\infty\), et la source fournit sans fin la puissance \(EI_\infty = 1{,}44\ \text{W}\), entièrement dissipée dans \(R\). L'énergie fournie et l'énergie dissipée croissent sans limite ; seule l'énergie stockée tend vers une valeur finie.</p>
    <p><strong>Q5.</strong> La constante de temps fait intervenir toute la résistance de la maille : \(\tau = L/R_{\text{tot}}\) avec \(R_{\text{tot}} = 100 + 50 + 10 = 160\ \Omega\), d'où \(L = R_{\text{tot}}\tau \approx 50\ \text{mH}\). En prenant seulement \(R = 100\ \Omega\), on trouverait \(31\ \text{mH}\) : 38 % d'erreur.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Deux bobines longues de même axe</h3>
  <div class="statement">Une bobine \(\mathcal B_1\) de \(N_1 = 800\) spires, de longueur \(\ell = 40\ \text{cm}\) et de diamètre \(5{,}0\ \text{cm}\), est recouverte, sur toute sa longueur et dans le même sens, d'une bobine \(\mathcal B_2\) de \(N_2 = 200\) spires (même section, à l'épaisseur du fil près). On les oriente dans le même sens. On admet que le champ d'une bobine longue vaut \(\mu_0\dfrac{N}{\ell}\,i\) à l'intérieur et zéro à l'extérieur ; \(\mu_0 = 4\pi\times10^{-7}\ \text{H·m}^{-1}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer les inductances propres \(L_1\), \(L_2\) et l'inductance mutuelle \(M\). Vérifier que \(M^2 = L_1L_2\) et interpréter.</div>
  <div class="q"><strong>Q2.</strong> \(\mathcal B_2\) est ouverte. \(\mathcal B_1\) est parcourue par un courant triangulaire qui passe de \(-0{,}50\ \text{A}\) à \(+0{,}50\ \text{A}\) en \(1{,}0\ \text{ms}\), puis redescend de même. Décrire la tension aux bornes de \(\mathcal B_2\). Comment en déduire \(M\) en TP ?</div>
  <div class="q"><strong>Q3.</strong> On relie les deux bobines en série, de façon que le même courant \(i\) les parcoure dans le même sens. Montrer que l'ensemble a pour inductance \(L_1 + L_2 + 2M\), et retrouver le résultat en le considérant comme une seule bobine. Que devient l'inductance si l'on inverse les connexions de \(\mathcal B_2\) ?</div>
  <div class="q"><strong>Q4.</strong> Une petite bobine-sonde de \(N_3 = 50\) spires et de diamètre \(1{,}0\ \text{cm}\) est placée au centre de \(\mathcal B_1\), son axe faisant un angle de 30° avec celui de \(\mathcal B_1\). Calculer l'inductance mutuelle \(M_{13}\) et la tension qu'elle mesure dans les conditions de Q2.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S = \pi\times(0{,}025)^2 \approx 1{,}96\times10^{-3}\ \text{m}^2\). Le flux de \(B_1 = \mu_0N_1i_1/\ell\) à travers les \(N_1\) spires de \(\mathcal B_1\) donne \(L_1 = \dfrac{\mu_0N_1^2S}{\ell} \approx 3{,}9\ \text{mH}\) ; de même \(L_2 = \dfrac{\mu_0N_2^2S}{\ell} \approx 0{,}25\ \text{mH}\). Le flux de \(\vec B_1\) à travers les \(N_2\) spires de \(\mathcal B_2\) donne</p>
    <div class="formula">$$M = \frac{\mu_0N_1N_2S}{\ell} \approx 0{,}99\ \text{mH}$$</div>
    <p>positive puisque les bobines sont orientées dans le même sens. \(L_1L_2 = \dfrac{\mu_0^2N_1^2N_2^2S^2}{\ell^2} = M^2\) : couplage parfait, car toutes les lignes de champ de l'une traversent toutes les spires de l'autre (influence totale).</p>
    <p><strong>Q2.</strong> \(i_2 = 0\), donc \(\Phi_2 = M\,i_1\) et \(e_2 = -M\,\dfrac{\mathrm di_1}{\mathrm dt}\). Sur une rampe montante, \(\dfrac{\mathrm di_1}{\mathrm dt} = \dfrac{1{,}0\ \text{A}}{1{,}0\ \text{ms}} = 1{,}0\times10^{3}\ \text{A·s}^{-1}\) : \(e_2 \approx -0{,}99\ \text{V}\) ; sur une rampe descendante, \(+0{,}99\ \text{V}\). La tension est un <strong>créneau</strong> d'amplitude \(0{,}99\ \text{V}\), de même période que le triangle (2,0 ms). En TP, on mesure la pente du courant (tension aux bornes d'une résistance en série) et la hauteur du créneau : leur rapport donne \(M\).</p>
    <p><strong>Q3.</strong> Le circuit unique est traversé par \(\Phi = \Phi_1 + \Phi_2 = (L_1i + M\,i) + (L_2i + M\,i)\), d'où \(L = L_1 + L_2 + 2M \approx 6{,}2\ \text{mH}\). Vu comme une seule bobine de \(N_1 + N_2 = 1\,000\) spires : \(L = \dfrac{\mu_0(N_1 + N_2)^2S}{\ell}\), qui redonne exactement la même valeur, puisque \((N_1 + N_2)^2 = N_1^2 + N_2^2 + 2N_1N_2\). En inversant \(\mathcal B_2\), \(M\) change de signe et les champs se retranchent :</p>
    <div class="formula">$$L_1 + L_2 - 2M = \frac{\mu_0(N_1 - N_2)^2S}{\ell} \approx 2{,}2\ \text{mH}$$</div>
    <p><strong>Q4.</strong> La sonde n'intercepte le champ uniforme \(\vec B_1\) que sur sa propre section \(S_3 = \pi\times(0{,}0050)^2\), avec un angle de 30° entre \(\vec B_1\) et sa normale :</p>
    <div class="formula">$$M_{13} = \frac{\mu_0N_1N_3S_3\cos30°}{\ell} \approx 8{,}5\ \mu\text{H}$$</div>
    <p>Tension mesurée : un créneau d'amplitude \(M_{13}\times10^{3} \approx 8{,}5\ \text{mV}\). Tourner la sonde jusqu'à annuler le signal donne la direction du champ (axe de la sonde perpendiculaire à \(\vec B_1\)).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Transformateur d'alimentation</h3>
  <div class="statement">Un transformateur, supposé idéal, a \(N_1 = 1\,000\) spires au primaire et \(N_2 = 50\) spires au secondaire. Le primaire est branché sur le secteur, \(U_1 = 230\ \text{V}\) efficaces à 50 Hz ; le secondaire alimente une résistance \(R = 4{,}0\ \Omega\). Primaire en convention récepteur, secondaire en convention générateur, tensions fléchées vers les bornes homologues.</div>
  <div class="q"><strong>Q1.</strong> Rappeler comment la loi de Faraday conduit à la loi des tensions. Calculer la tension efficace \(U_2\).</div>
  <div class="q"><strong>Q2.</strong> Calculer l'intensité efficace \(I_2\) et la puissance reçue par \(R\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(I_1\) et vérifier la conservation de la puissance.</div>
  <div class="q"><strong>Q4.</strong> Montrer que, vue du primaire, la résistance \(R\) se comporte comme une résistance \(R/m^2\) (\(m = N_2/N_1\)) et retrouver \(I_1\).</div>
  <div class="q"><strong>Q5.</strong> Le transformateur réel a un rendement de 92 %. Quelle puissance prélève-t-il sur le secteur ? Où passent les pertes, et comment les limite-t-on ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le circuit magnétique canalise le champ : chaque spire est traversée par le même flux \(\varphi(t)\). Les enroulements, orientés à partir des bornes homologues, ont pour flux totaux \(N_1\varphi\) et \(N_2\varphi\) ; sans résistance, leurs tensions valent \(u_1 = N_1\,\mathrm d\varphi/\mathrm dt\) et \(u_2 = N_2\,\mathrm d\varphi/\mathrm dt\), d'où \(u_2/u_1 = N_2/N_1 = m = 1/20\). \(U_2 = mU_1 = 11{,}5\ \text{V}\).</p>
    <p><strong>Q2.</strong> \(I_2 = U_2/R \approx 2{,}9\ \text{A}\) ; \(P_2 = U_2^2/R = 132{,}25/4{,}0 \approx 33\ \text{W}\).</p>
    <p><strong>Q3.</strong> \(I_1 = m\,I_2 \approx 0{,}14\ \text{A}\) ; \(P_1 = U_1I_1 = 230\times0{,}144 \approx 33\ \text{W} = P_2\) : le transformateur idéal ne stocke ni ne dissipe d'énergie.</p>
    <p><strong>Q4.</strong> Avec \(u_1 = u_2/m\) et \(i_1 = m\,i_2\) :</p>
    <div class="formula">$$\frac{u_1}{i_1} = \frac{1}{m^2}\,\frac{u_2}{i_2} = \frac{R}{m^2} = 400\times4{,}0 = 1\,600\ \Omega$$</div>
    <p>Le secteur « voit » une résistance de \(1{,}6\ \text{k}\Omega\) : \(I_1 = 230/1\,600 \approx 0{,}14\ \text{A}\), comme en Q3. C'est le principe de l'<strong>adaptation d'impédance</strong> par transformateur.</p>
    <p><strong>Q5.</strong> \(P_1 = P_2/\eta = 33/0{,}92 \approx 36\ \text{W}\) : environ 3 W de pertes, par effet Joule dans les enroulements (pertes « cuivre ») et dans le circuit magnétique (courants de Foucault et cycles d'aimantation, pertes « fer »). On les limite par des fils de section suffisante et par un circuit magnétique en tôles minces isolées, qui coupent les boucles des courants de Foucault.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Recharge sans fil : deux circuits couplés et accordés</h3>
  <div class="statement">Un chargeur sans fil comporte une bobine émettrice (\(L_1 = 20\ \mu\text{H}\), résistance \(R_1 = 0{,}20\ \Omega\)), alimentée par un générateur de tension sinusoïdale d'amplitude \(U_g = 10\ \text{V}\) et de fréquence \(f = 100\ \text{kHz}\). Le téléphone porte une bobine réceptrice (\(L_2 = 20\ \mu\text{H}\)) ; la résistance totale de son circuit, charge comprise, vaut \(R_2 = 5{,}0\ \Omega\). Téléphone bien posé : \(M = 8{,}0\ \mu\text{H}\). Les circuits sont orientés dans le sens de leurs courants \(i_1\) et \(i_2\).</div>
  <div class="q"><strong>Q1.</strong> Sans condensateur (situation de l'exemple du cours), la charge reçoit \(0{,}29\ \text{W}\) en moyenne. Rappeler le système d'équations en notation complexe, et expliquer pourquoi le transfert est si faible.</div>
  <div class="q"><strong>Q2.</strong> On place en série dans chaque circuit un condensateur de capacité \(C\). Écrire le nouveau système. Quelle valeur de \(C\) annule la réactance de chaque circuit à 100 kHz ?</div>
  <div class="q"><strong>Q3.</strong> Avec cette valeur, montrer que l'impédance vue par le générateur est \(R_1 + \dfrac{M^2\omega^2}{R_2}\). Calculer les amplitudes \(I_1\), \(I_2\), la puissance moyenne reçue par la charge et le rendement \(\eta\) du transfert.</div>
  <div class="q"><strong>Q4.</strong> Le téléphone est mal posé : \(M = 2{,}0\ \mu\text{H}\). Reprendre les calculs et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\underline U_g = (R_1 + jL_1\omega)\underline I_1 + jM\omega\,\underline I_2\) et \(0 = jM\omega\,\underline I_1 + (R_2 + jL_2\omega)\underline I_2\). Avec \(\omega = 2\pi\times10^5\ \text{rad·s}^{-1}\), \(L_1\omega = L_2\omega \approx 12{,}6\ \Omega\) dominent les résistances : le générateur débite un courant surtout limité par la réactance \(L_1\omega\), et la réactance \(L_2\omega\) limite le courant induit dans le récepteur. L'impédance vue par le générateur, \(\approx 0{,}89 + 10{,}8\,j\ \Omega\), est presque purement réactive : peu de puissance moyenne est transférée.</p>
    <p><strong>Q2.</strong> Chaque maille gagne le terme \(\dfrac{1}{jC\omega}\) :</p>
    <div class="formula">$$\left\{\begin{aligned}\underline U_g&=\Big(R_1+jL_1\omega+\frac{1}{jC\omega}\Big)\underline I_1+jM\omega\,\underline I_2\\0&=jM\omega\,\underline I_1+\Big(R_2+jL_2\omega+\frac{1}{jC\omega}\Big)\underline I_2\end{aligned}\right.$$</div>
    <p>La réactance s'annule si \(LC\omega^2 = 1\), soit, pour les deux circuits :</p>
    <div class="formula">$$C = \frac{1}{L\omega^2} = \frac{1}{20\times10^{-6}\times(2\pi\times10^5)^2} \approx 0{,}13\ \mu\text{F}\quad(127\ \text{nF})$$</div>
    <p><strong>Q3.</strong> Il reste \(\underline U_g = R_1\underline I_1 + jM\omega\,\underline I_2\) et \(\underline I_2 = -\dfrac{jM\omega}{R_2}\,\underline I_1\), d'où \(\underline Z_e = R_1 + \dfrac{M^2\omega^2}{R_2}\), réelle. Avec \(M\omega \approx 5{,}03\ \Omega\) : \(Z_e \approx 0{,}20 + 5{,}05 = 5{,}25\ \Omega\), \(I_1 = U_g/Z_e \approx 1{,}9\ \text{A}\), \(I_2 = \dfrac{M\omega}{R_2}\,I_1 \approx 1{,}9\ \text{A}\). Puissance reçue : \(P_2 = \tfrac12R_2I_2^2 \approx 9{,}2\ \text{W}\), trente fois plus qu'en Q1. Rendement, rapport de la puissance utile à la puissance fournie \(\tfrac12Z_eI_1^2\) :</p>
    <div class="formula">$$\eta = \frac{M^2\omega^2/R_2}{R_1 + M^2\omega^2/R_2} \approx 0{,}96$$</div>
    <p>À la résonance, les condensateurs compensent les inductances : le générateur ne débite plus de courant « inutile », et la résistance ramenée \(M^2\omega^2/R_2\), grande devant \(R_1\), capte presque toute la puissance.</p>
    <p><strong>Q4.</strong> \(M\omega \approx 1{,}26\ \Omega\), résistance ramenée \(\approx 0{,}32\ \Omega\), \(Z_e \approx 0{,}52\ \Omega\) : \(\eta \approx 0{,}61\) seulement. Et le courant primaire explose : \(I_1 \approx 19\ \text{A}\), avec \(\tfrac12R_1I_1^2 \approx 38\ \text{W}\) perdus dans l'émetteur. Un chargeur réel mesure le couplage et réduit sa tension (ou s'arrête) quand le téléphone est mal placé ; d'où les aimants de centrage de certains modèles.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Rails de Laplace : freinage d'une tige lancée</h3>
  <div class="statement">Deux rails horizontaux parallèles à \(Ox\), distants de \(\ell = 30\ \text{cm}\), sont reliés en \(x = 0\) par une résistance ; la résistance totale du circuit vaut \(R = 2{,}0\ \Omega\). Une tige conductrice de masse \(m = 50\ \text{g}\), perpendiculaire aux rails, glisse sans frottement ; on note \(x\) sa position et \(v = \dot x\). Le champ est uniforme, vertical : \(\vec B = B\,\vec e_z\) avec \(B = 0{,}50\ \text{T}\) (\(\vec e_z\) vers le haut). À \(t = 0\), la tige est lancée à \(v_0 = 4{,}0\ \text{m·s}^{-1}\). On oriente le circuit dans le sens trigonométrique vu de dessus. On néglige l'inductance propre du circuit.</div>
  <div class="q"><strong>Q1.</strong> Exprimer le flux, la f.é.m. induite et le courant. Dans quel sens circule le courant ? Vérifier avec la loi de Lenz.</div>
  <div class="q"><strong>Q2.</strong> Exprimer la force de Laplace sur la tige et écrire l'équation mécanique.</div>
  <div class="q"><strong>Q3.</strong> Résoudre et calculer la constante de temps \(\tau\), puis la distance parcourue jusqu'à l'arrêt.</div>
  <div class="q"><strong>Q4.</strong> Vérifier \(P_L + e\,i = 0\). Calculer l'énergie dissipée par effet Joule et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Sens trigonométrique vu de dessus : \(\vec n = \vec e_z\) (main droite). Le circuit embrasse l'aire \(\ell x\) : \(\Phi = B\ell x\). Loi de Faraday : \(e = -B\ell v\) ; schéma équivalent \(e = Ri\), d'où \(i = -\dfrac{B\ell v}{R}\). Initialement \(|i_0| = \dfrac{B\ell v_0}{R} = 0{,}30\ \text{A}\), avec \(i \lt 0\) : le courant tourne dans le sens horaire vu de dessus. Lenz : le flux augmente (\(x\) croît), le courant crée un champ selon \(-\vec e_z\) à l'intérieur du circuit, qui s'oppose à cette augmentation.</p>
    <p><strong>Q2.</strong> Dans la tige, le sens d'orientation est celui de \(\vec e_y\) (\(\vec e_y = \vec e_z\wedge\vec e_x\)) : \(\vec F = i\ell\,\vec e_y\wedge B\,\vec e_z = i\ell B\,\vec e_x = -\dfrac{B^2\ell^2}{R}\,v\,\vec e_x\). Le poids et la réaction des rails se compensent : \(m\dfrac{\mathrm dv}{\mathrm dt} = -\dfrac{B^2\ell^2}{R}\,v\). La force est opposée à la vitesse : freinage, conforme à la loi de Lenz.</p>
    <p><strong>Q3.</strong> \(v(t) = v_0\,e^{-t/\tau}\) avec</p>
    <div class="formula">$$\tau = \frac{mR}{B^2\ell^2} = \frac{0{,}050\times2{,}0}{0{,}25\times0{,}090} \approx 4{,}4\ \text{s}$$</div>
    <p>Distance d'arrêt : \(\displaystyle\int_0^\infty v\,\mathrm dt = v_0\tau \approx 18\ \text{m}\). Le freinage est lent, car la force initiale ne vaut que \(B^2\ell^2v_0/R \approx 45\ \text{mN}\) : pour freiner efficacement, il faut un champ intense et une faible résistance.</p>
    <p><strong>Q4.</strong> \(P_L = \vec F\cdot\vec v = i\ell Bv\) et \(e\,i = -B\ell v\,i\) : leur somme est nulle. Le théorème de l'énergie cinétique donne alors \(\dfrac{\mathrm d}{\mathrm dt}\Big(\dfrac12mv^2\Big) = P_L = -e\,i = -Ri^2\) : toute l'énergie cinétique initiale, \(\tfrac12mv_0^2 = 0{,}40\ \text{J}\), est dissipée par effet Joule. C'est le principe du freinage électromagnétique : sans contact ni usure, mais d'autant moins efficace que la vitesse est faible (la force s'annule à l'arrêt).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Rails verticaux : vitesse limite et bilan de puissance</h3>
  <div class="statement">Deux rails verticaux, distants de \(\ell = 40\ \text{cm}\), sont reliés en haut par une résistance (résistance totale \(R = 2{,}0\ \Omega\)). Une tige horizontale de masse \(m = 100\ \text{g}\) glisse sans frottement le long des rails, en restant en contact. Le champ \(\vec B = B\,\vec e_z\), \(B = 0{,}80\ \text{T}\), est horizontal, perpendiculaire au plan des rails. On prend l'axe \(Ox\) vertical vers le bas, \(x\) étant la distance de la tige à la résistance, \(\vec e_y\) horizontal dans le plan des rails, avec \(\vec e_z = \vec e_x\wedge\vec e_y\). La tige est lâchée sans vitesse ; \(g = 9{,}81\ \text{m·s}^{-2}\). On oriente le circuit de sorte que \(\vec n = \vec e_z\).</div>
  <div class="q"><strong>Q1.</strong> Établir l'équation électrique et l'équation mécanique.</div>
  <div class="q"><strong>Q2.</strong> Montrer qu'il existe une vitesse limite et la calculer.</div>
  <div class="q"><strong>Q3.</strong> Résoudre avec \(v(0) = 0\) ; calculer la constante de temps.</div>
  <div class="q"><strong>Q4.</strong> Faire le bilan de puissance en régime établi.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Aire embrassée \(\ell x\), normale \(\vec e_z\) : \(\Phi = B\ell x\), \(e = -B\ell v\), \(i = e/R = -\dfrac{B\ell v}{R}\). Dans la tige, le sens d'orientation est \(\vec e_y\) (parcours direct du rectangle dans le plan \((\vec e_x,\vec e_y)\)) : \(\vec F = i\ell\,\vec e_y\wedge B\,\vec e_z = i\ell B\,\vec e_x = -\dfrac{B^2\ell^2}{R}\,v\,\vec e_x\). Principe fondamental projeté sur \(\vec e_x\) :</p>
    <div class="formula">$$m\frac{\mathrm dv}{\mathrm dt} = mg - \frac{B^2\ell^2}{R}\,v$$</div>
    <p><strong>Q2.</strong> La force de freinage croît avec la vitesse jusqu'à compenser le poids :</p>
    <div class="formula">$$v_{lim} = \frac{mgR}{B^2\ell^2} = \frac{0{,}100\times9{,}81\times2{,}0}{0{,}64\times0{,}16} \approx 19\ \text{m·s}^{-1}$$</div>
    <p><strong>Q3.</strong> \(\dfrac{\mathrm dv}{\mathrm dt} + \dfrac{v}{\tau} = g\) avec \(\tau = \dfrac{mR}{B^2\ell^2} \approx 1{,}95\ \text{s}\) : \(v(t) = v_{lim}\big(1 - e^{-t/\tau}\big)\), et l'on vérifie \(v_{lim} = g\tau\). La vitesse limite est pratiquement atteinte après \(5\tau \approx 10\ \text{s}\) : la tige aurait alors parcouru environ 150 m ! Avec un champ plus intense ou une tige plus légère, la vitesse limite serait bien plus faible.</p>
    <p><strong>Q4.</strong> En régime établi, \(|i| = \dfrac{B\ell v_{lim}}{R} \approx 3{,}1\ \text{A}\) : la puissance du poids, \(mgv_{lim} \approx 18{,}8\ \text{W}\), est égale à la puissance Joule \(Ri^2 \approx 18{,}8\ \text{W}\). L'énergie potentielle de pesanteur est intégralement convertie en énergie électrique puis en chaleur : la tige fonctionne en <strong>générateur</strong>, comme une petite centrale hydroélectrique.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Alternateur : f.é.m., puissance et couple résistant</h3>
  <div class="statement">Une bobine plate de \(N = 100\) spires rectangulaires, d'aire \(S = 50\ \text{cm}^2\), tourne à vitesse constante, \(3\,000\ \text{tr·min}^{-1}\), autour d'un axe \(\Delta\) passant par les milieux de deux côtés opposés, perpendiculaire à un champ uniforme et stationnaire de norme \(B = 0{,}30\ \text{T}\). On note \(\theta = \omega t\) l'angle entre \(\vec B\) et la normale \(\vec n\) de la bobine. Elle est fermée sur une résistance \(R = 10\ \Omega\) ; la résistance et l'inductance propres du bobinage sont négligées.</div>
  <div class="q"><strong>Q1.</strong> Exprimer le flux à travers la bobine.</div>
  <div class="q"><strong>Q2.</strong> Calculer la f.é.m. \(e(t)\), son amplitude et sa valeur efficace.</div>
  <div class="q"><strong>Q3.</strong> Calculer la puissance moyenne reçue par \(R\).</div>
  <div class="q"><strong>Q4.</strong> Exprimer le couple de Laplace subi par la bobine, sa valeur moyenne, et le couple moyen que doit fournir le moteur d'entraînement. Que se passe-t-il si l'on ouvre le circuit ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\omega = 2\pi\times3\,000/60 = 100\pi\ \text{rad·s}^{-1}\) (50 Hz). \(\Phi = NBS\cos\omega t\), avec \(BS = 1{,}5\times10^{-3}\ \text{Wb}\) par spire et \(NBS = 0{,}15\ \text{Wb}\).</p>
    <p><strong>Q2.</strong> \(e = -\dfrac{\mathrm d\Phi}{\mathrm dt} = NBS\omega\sin\omega t\), d'amplitude \(e_0 = 0{,}15\times100\pi = 15\pi \approx 47\ \text{V}\) et de valeur efficace \(e_0/\sqrt2 \approx 33\ \text{V}\).</p>
    <p><strong>Q3.</strong> \(i = e/R\) ; puissance moyenne \(\langle Ri^2\rangle = \dfrac{e_0^2}{2R} \approx 111\ \text{W}\).</p>
    <p><strong>Q4.</strong> Moment magnétique \(\vec{\mathcal M} = NiS\,\vec n\) ; couple \(\vec\Gamma = \vec{\mathcal M}\wedge\vec B\), de projection sur \(\Delta\) (orienté dans le sens de rotation) \(\Gamma = -NiSB\sin\omega t = -\dfrac{(NBS)^2\omega}{R}\sin^2\omega t\). Il est toujours résistant ; sa moyenne vaut</p>
    <div class="formula">$$\langle\Gamma\rangle = -\frac{(NBS)^2\omega}{2R} \approx -0{,}35\ \text{N·m}$$</div>
    <p>Le moteur d'entraînement doit fournir le couple moyen opposé, \(0{,}35\ \text{N·m}\), soit la puissance \(0{,}35\times100\pi \approx 111\ \text{W}\) : on vérifie \(\Gamma\omega + e\,i = 0\) à chaque instant. Circuit ouvert, \(i = 0\) : la f.é.m. existe toujours, mais il n'y a plus de couple, et l'alternateur tourne « à vide » sans rien demander au moteur (aux frottements près). C'est quand on branche des appareils que l'entraînement doit fournir davantage.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Courants de Foucault : un aimant qui tombe dans un tube de cuivre</h3>
  <div class="statement">Un petit aimant cylindrique (masse \(m = 20\ \text{g}\)) est lâché dans un tube vertical en cuivre de hauteur \(h = 1{,}0\ \text{m}\), un peu plus large que lui. Il met \(t = 8{,}0\ \text{s}\) pour le traverser, à vitesse pratiquement constante. Dans un tube identique en plastique, il tombe en chute libre. \(g = 9{,}81\ \text{m·s}^{-2}\). On modélise l'action des courants induits sur l'aimant par une force \(-\alpha\,\vec v\).</div>
  <div class="q"><strong>Q1.</strong> Expliquer l'origine des courants induits dans le tube. Dans quel sens tournent-ils au-dessus et au-dessous de l'aimant ? Pourquoi n'y en a-t-il pas dans le tube en plastique ?</div>
  <div class="q"><strong>Q2.</strong> Justifier qualitativement que la force est proportionnelle à la vitesse.</div>
  <div class="q"><strong>Q3.</strong> Calculer la durée de la chute libre, la vitesse limite dans le tube de cuivre et \(\alpha\). Vérifier que le régime transitoire est très bref.</div>
  <div class="q"><strong>Q4.</strong> Faire un bilan d'énergie de la traversée.</div>
  <div class="q"><strong>Q5.</strong> On remplace le tube par un tube en aluminium de mêmes dimensions (conductivités : \(5{,}96\times10^7\ \text{S·m}^{-1}\) pour le cuivre, \(3{,}7\times10^7\ \text{S·m}^{-1}\) pour l'aluminium), puis par le tube de cuivre fendu sur toute sa longueur. Prévoir les résultats.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> On découpe le tube en anneaux horizontaux : chacun est un circuit fermé, traversé par le flux du champ de l'aimant. Au-dessous de l'aimant, l'aimant se rapproche : le flux augmente, le courant induit crée un champ opposé à celui de l'aimant. Au-dessus, l'aimant s'éloigne : le flux diminue, le courant crée un champ de même sens. Les deux courants tournent donc en <strong>sens opposés</strong> ; d'après la loi de Lenz, l'anneau du dessous repousse l'aimant et celui du dessus l'attire : les deux effets le freinent. Le plastique est isolant : la f.é.m. existe, mais aucun courant ne circule.</p>
    <p><strong>Q2.</strong> La f.é.m. de chaque anneau est proportionnelle à la vitesse de variation du flux, donc à \(v\) ; le courant aussi (\(i = e/R\)) ; la force de Laplace, proportionnelle au courant, l'est donc aussi. Elle est également proportionnelle à la conductivité du métal.</p>
    <p><strong>Q3.</strong> Chute libre : \(\sqrt{2h/g} \approx 0{,}45\ \text{s}\). Dans le cuivre, \(v_{lim} = h/t = 0{,}125\ \text{m·s}^{-1}\), atteinte quand \(\alpha v_{lim} = mg\) : \(\alpha = \dfrac{mg}{v_{lim}} \approx 1{,}6\ \text{N·s·m}^{-1}\). L'équation \(m\dot v = mg - \alpha v\) donne un régime transitoire de durée caractéristique \(\tau = m/\alpha \approx 13\ \text{ms}\), pendant lequel l'aimant parcourt environ \(v_{lim}\tau \approx 2\ \text{mm}\) : la vitesse est bien constante sur presque tout le tube.</p>
    <p><strong>Q4.</strong> L'énergie potentielle perdue, \(mgh \approx 0{,}20\ \text{J}\), n'est presque pas convertie en énergie cinétique (\(\tfrac12mv_{lim}^2 \approx 0{,}16\ \text{mJ}\)) : elle est dissipée par effet Joule dans le tube, à la puissance \(mgv_{lim} \approx 25\ \text{mW}\). Le tube s'échauffe (imperceptiblement).</p>
    <p><strong>Q5.</strong> \(\alpha\) est proportionnel à la conductivité, la vitesse limite lui est inversement proportionnelle, et la durée de traversée proportionnelle : avec l'aluminium, \(t \approx 8{,}0\times\dfrac{3{,}7}{5{,}96} \approx 5{,}0\ \text{s}\). Dans le tube fendu, les anneaux sont coupés : les courants ne peuvent plus faire le tour, le freinage devient très faible et l'aimant tombe presque librement. C'est le principe des tôles feuilletées des transformateurs, qui coupent les boucles de courant pour réduire les pertes.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Moteur à courant continu à entrefer plan</h3>
  <div class="statement">Un moteur à courant continu à entrefer plan a pour constante \(\Phi_0 = 0{,}050\ \text{V·s·rad}^{-1}\) (f.c.é.m. \(E = \Phi_0\,\omega\), couple de Laplace \(\Gamma = \Phi_0\,i\)), une résistance d'induit \(R = 1{,}5\ \Omega\) et un rotor de moment d'inertie \(J = 2{,}0\times10^{-4}\ \text{kg·m}^2\). Son inductance et ses frottements sont négligés. Il est alimenté sous la tension constante \(u = 12\ \text{V}\), le moteur étant en convention récepteur.</div>
  <div class="q"><strong>Q1.</strong> Rappeler, à partir du modèle des rails de Laplace « enroulés » (tige radiale dans un champ axial), l'origine des relations \(E = \Phi_0\,\omega\) et \(\Gamma = \Phi_0\,i\). Écrire l'équation électrique et l'équation mécanique.</div>
  <div class="q"><strong>Q2.</strong> Le moteur démarre à vide. Établir \(\omega(t)\) et \(i(t)\). Calculer la vitesse finale, la constante de temps et le courant de démarrage.</div>
  <div class="q"><strong>Q3.</strong> Le moteur entraîne une charge de couple résistant constant \(\Gamma_r = 0{,}10\ \text{N·m}\). Calculer en régime permanent le courant, la vitesse (en tr/min), les puissances électrique et mécanique, et le rendement.</div>
  <div class="q"><strong>Q4.</strong> Tracer la caractéristique \(\Gamma(\omega)\) du moteur alimenté sous 12 V. Pour quelle vitesse la puissance mécanique est-elle maximale ?</div>
  <div class="q"><strong>Q5.</strong> Dans une descente, la charge entraîne le rotor à \(\omega = 300\ \text{rad·s}^{-1}\), le moteur restant branché sur la batterie de 12 V. Calculer le courant et commenter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Une tige radiale qui tourne dans un champ axial balaie un secteur : le flux à travers le circuit croît proportionnellement à l'angle, d'où une f.é.m. proportionnelle à \(\omega\) ; parcourue par \(i\), la tige subit une force de Laplace orthoradiale, d'où un couple proportionnel à \(i\). La même constante apparaît dans les deux relations, comme l'impose \(P_L + e\,i = 0\) : \(\Gamma\omega = E\,i\). Équations :</p>
    <div class="formula">$$u = R\,i + \Phi_0\,\omega\qquad J\,\frac{\mathrm d\omega}{\mathrm dt} = \Phi_0\,i - \Gamma_r$$</div>
    <p><strong>Q2.</strong> À vide (\(\Gamma_r = 0\)), en éliminant \(i = (u - \Phi_0\omega)/R\) : \(J\dfrac{\mathrm d\omega}{\mathrm dt} + \dfrac{\Phi_0^2}{R}\,\omega = \dfrac{\Phi_0u}{R}\). Avec \(\omega(0) = 0\) : \(\omega(t) = \omega_0\big(1 - e^{-t/\tau_m}\big)\), \(\omega_0 = u/\Phi_0 = 240\ \text{rad·s}^{-1}\) (2 300 tr/min), \(\tau_m = \dfrac{JR}{\Phi_0^2} = 0{,}12\ \text{s}\). Le courant \(i = \dfrac uR\,e^{-t/\tau_m}\) vaut \(8{,}0\ \text{A}\) au démarrage (pas de f.c.é.m.) et tend vers zéro : un moteur parfait à vide ne consomme rien.</p>
    <p><strong>Q3.</strong> Régime permanent : \(\Phi_0\,i = \Gamma_r\), donc \(i = 2{,}0\ \text{A}\) ; \(\omega = \dfrac{u - Ri}{\Phi_0} = \dfrac{12 - 3{,}0}{0{,}050} = 180\ \text{rad·s}^{-1}\), soit environ 1 700 tr/min. Puissance électrique \(ui = 24\ \text{W}\), mécanique utile \(\Gamma_r\omega = 18\ \text{W}\), pertes Joule \(Ri^2 = 6{,}0\ \text{W}\) ; rendement 75 %.</p>
    <p><strong>Q4.</strong> \(\Gamma = \Phi_0\,i = \dfrac{\Phi_0(u - \Phi_0\omega)}{R}\) : une droite décroissante, de \(0{,}40\ \text{N·m}\) à l'arrêt (couple de démarrage) à zéro pour \(\omega_0 = 240\ \text{rad·s}^{-1}\). La puissance mécanique \(\Gamma\omega\) est un trinôme en \(\omega\), maximal au milieu, \(\omega = \omega_0/2 = 120\ \text{rad·s}^{-1}\), où elle vaut \(\dfrac{u^2}{4R} = 24\ \text{W}\) (le rendement n'y est alors que de 50 %).</p>
    <p><strong>Q5.</strong> \(E = \Phi_0\omega = 15\ \text{V} \gt u\) : \(i = \dfrac{u - E}{R} = -2{,}0\ \text{A}\). Le courant s'inverse : la machine fonctionne en <strong>génératrice</strong>, elle recharge la batterie. Le couple \(\Phi_0\,i = -0{,}10\ \text{N·m}\) est résistant : elle freine la charge. Bilan : la puissance mécanique reçue, \(\Phi_0\omega|i| = 30\ \text{W}\), se répartit entre la batterie (\(u|i| = 24\ \text{W}\)) et l'effet Joule (\(6{,}0\ \text{W}\)) : c'est le freinage par récupération des véhicules électriques.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Le haut-parleur électrodynamique</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves PT (thème <em>induction : couplage électromécanique, bilan de puissance, régime sinusoïdal forcé</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Dans un haut-parleur électrodynamique, une bobine cylindrique d'axe \(Oz\), solidaire de la membrane, est plongée dans l'entrefer d'un aimant annulaire où règne un champ <strong>radial</strong>, de norme uniforme \(B\), dirigé vers l'axe : \(\vec B = -B\,\vec e_r\) (coordonnées cylindriques d'axe \(Oz\)). Les spires de la bobine sont orientées selon \(\vec e_\theta\) ; la longueur totale de fil plongée dans le champ est \(\ell\). L'équipage mobile (bobine et membrane), de masse \(m\), est rappelé par une suspension de raideur \(k\) vers sa position d'équilibre \(z = 0\) ; l'air et les frottements exercent la force \(-\alpha\,\vec v\), avec \(\vec v = \dot z\,\vec e_z\). La bobine a une résistance \(R\) et une inductance \(L\) ; l'amplificateur impose la tension \(u\) à ses bornes, en convention récepteur pour le courant \(i\) compté selon \(\vec e_\theta\).
    <br>Données : \(B = 1{,}0\ \text{T}\) ; \(\ell = 8{,}0\ \text{m}\) ; \(R = 6{,}0\ \Omega\) ; \(L = 0{,}40\ \text{mH}\) ; \(m = 15\ \text{g}\) ; \(k = 2{,}0\times10^{3}\ \text{N·m}^{-1}\) ; \(\alpha = 1{,}5\ \text{N·s·m}^{-1}\).
  </div>

  <p class="exo-part">Partie A — Force de Laplace et force électromotrice</p>
  <div class="q"><strong>A1.</strong> Exprimer la force de Laplace sur un élément \(\mathrm d\ell\) de la bobine, puis la force totale. Montrer qu'elle s'écrit \(\vec F = B\ell\,i\,\vec e_z\).</div>
  <div class="q"><strong>A2.</strong> Calculer la force pour \(i = 1{,}0\ \text{A}\) et la comparer au poids de l'équipage mobile.</div>
  <div class="q"><strong>A3.</strong> On admet que la conversion électromécanique est parfaite : \(P_L + e\,i = 0\). En déduire la f.é.m. induite \(e\) dans la bobine en mouvement (comptée selon \(\vec e_\theta\)).</div>

  <p class="exo-part">Partie B — Équations couplées et bilan de puissance</p>
  <div class="q"><strong>B1.</strong> Dessiner le schéma électrique équivalent et établir l'équation électrique. Établir l'équation mécanique.</div>
  <div class="q"><strong>B2.</strong> Établir le bilan de puissance du haut-parleur et interpréter chaque terme.</div>
  <div class="q"><strong>B3.</strong> On applique une tension continue \(U_0 = 1{,}0\ \text{V}\). Calculer le courant et le déplacement de la membrane en régime permanent. Le haut-parleur émet-il un son ?</div>

  <p class="exo-part">Partie C — Régime sinusoïdal forcé : impédance électrique</p>
  <div class="q"><strong>C1.</strong> En notation complexe, exprimer la vitesse \(\underline V\) de la membrane en fonction du courant \(\underline I\). En déduire l'impédance électrique du haut-parleur :</div>
  <div class="formula">$$\underline Z = R + jL\omega + \underline Z_{\text{mot}}\qquad\text{avec}\qquad\underline Z_{\text{mot}} = \frac{(B\ell)^2}{\alpha + j\Big(m\omega - \dfrac{k}{\omega}\Big)}$$</div>
  <div class="q"><strong>C2.</strong> Calculer la fréquence de résonance mécanique \(f_0\), puis \(\underline Z\) à cette fréquence. Pourquoi l'impédance électrique y est-elle maximale ?</div>
  <div class="q"><strong>C3.</strong> Calculer \(\underline Z\) à \(1{,}0\ \text{kHz}\). Commenter la valeur indiquée par les fabricants (« impédance nominale »).</div>
  <div class="q"><strong>C4.</strong> L'amplificateur délivre une tension d'amplitude \(2{,}0\ \text{V}\) à \(f_0\). Calculer l'amplitude du courant, de la vitesse et du déplacement de la membrane. Quelle fraction de la puissance électrique est transmise à l'équipage mobile ?</div>

  <p class="exo-part">Partie D — Fonctionnement en microphone</p>
  <div class="q"><strong>D1.</strong> Le même dispositif, non alimenté et branché sur un voltmètre de très grande résistance, reçoit une onde sonore qui fait vibrer la membrane avec une vitesse d'amplitude \(1{,}0\ \text{mm·s}^{-1}\). Quelle tension mesure-t-on ? Quel est le rôle de la loi de Lenz si l'on ferme la bobine sur une faible résistance ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> L'élément de fil orienté vaut \(\mathrm d\ell\,\vec e_\theta\) : \(\mathrm d\vec F = i\,\mathrm d\ell\,\vec e_\theta\wedge(-B\,\vec e_r) = iB\,\mathrm d\ell\,\vec e_z\), car \(\vec e_\theta\wedge\vec e_r = -\vec e_z\). Toutes les forces élémentaires sont axiales, de même sens et de même norme par unité de longueur : elles s'ajoutent, \(\vec F = B\ell\,i\,\vec e_z\). La géométrie radiale est choisie précisément pour cela : il n'y a aucune composante radiale résultante, et la force ne dépend pas de la position de la bobine tant qu'elle reste dans l'entrefer.</p>
    <p><strong>A2.</strong> \(F = B\ell i = 8{,}0\ \text{N}\) pour 1 A, plus de cinquante fois le poids de l'équipage (\(mg \approx 0{,}15\ \text{N}\)) : la pesanteur est négligeable dans la suite.</p>
    <p><strong>A3.</strong> \(P_L = \vec F\cdot\vec v = B\ell\,i\,v\), donc \(e\,i = -B\ell\,i\,v\) et \(e = -B\ell\,v\). Pour une bobine qui monte (\(v \gt 0\)), la f.é.m. s'oppose au courant qui la fait monter : c'est une force contre-électromotrice, comme dans les rails de Laplace en moteur.</p>
    <p><strong>B1.</strong> Schéma : résistance \(R\), bobine \(L\) et générateur de f.é.m. \(e\) (fléché selon \(i\)) en série ; la tension de l'amplificateur, en convention récepteur, vaut \(u = Ri + L\dfrac{\mathrm di}{\mathrm dt} - e\), soit</p>
    <div class="formula">$$u = R\,i + L\frac{\mathrm di}{\mathrm dt} + B\ell\,v\qquad m\frac{\mathrm dv}{\mathrm dt} = -k\,z - \alpha\,v + B\ell\,i$$</div>
    <p>la seconde étant le principe fondamental projeté sur \(\vec e_z\) (poids négligé, A2). Les deux équations sont couplées par le même coefficient \(B\ell\).</p>
    <p><strong>B2.</strong> On multiplie la première par \(i\), la seconde par \(v\), et on élimine \(B\ell\,i\,v\) :</p>
    <div class="formula">$$u\,i = R\,i^2 + \alpha\,v^2 + \frac{\mathrm d}{\mathrm dt}\Big(\frac12L\,i^2 + \frac12m\,v^2 + \frac12k\,z^2\Big)$$</div>
    <p>La puissance fournie par l'amplificateur est dissipée par effet Joule (\(Ri^2\)), transmise à l'air et aux frottements (\(\alpha v^2\), dont une petite partie devient l'onde sonore), ou stockée sous forme d'énergie magnétique, cinétique et élastique. En régime périodique, le dernier terme est de moyenne nulle.</p>
    <p><strong>B3.</strong> En régime permanent continu, \(v = 0\) et \(\mathrm di/\mathrm dt = 0\) : \(i = U_0/R \approx 0{,}17\ \text{A}\), et \(kz = B\ell\,i\) donne \(z = \dfrac{B\ell U_0}{kR} \approx 0{,}67\ \text{mm}\). La membrane est déplacée mais immobile : aucune onde sonore n'est émise, et toute la puissance (\(U_0^2/R \approx 0{,}17\ \text{W}\)) chauffe la bobine. C'est pourquoi on bloque la composante continue en sortie des amplificateurs.</p>
    <p><strong>C1.</strong> Avec \(\underline z = \underline V/(j\omega)\) pour le déplacement, l'équation mécanique devient \(\Big(\alpha + jm\omega + \dfrac{k}{j\omega}\Big)\underline V = B\ell\,\underline I\), soit \(\underline V = \dfrac{B\ell\,\underline I}{\alpha + j(m\omega - k/\omega)}\). En reportant dans \(\underline U = (R + jL\omega)\underline I + B\ell\,\underline V\), on obtient l'expression annoncée. Le terme \(\underline Z_{\text{mot}}\), appelé <strong>impédance motionnelle</strong>, traduit le mouvement : il disparaît si l'on bloque la membrane.</p>
    <p><strong>C2.</strong> \(\omega_0 = \sqrt{k/m} \approx 365\ \text{rad·s}^{-1}\), \(f_0 \approx 58\ \text{Hz}\). À \(f_0\), \(m\omega_0 - k/\omega_0 = 0\) : \(\underline Z_{\text{mot}} = \dfrac{(B\ell)^2}{\alpha} \approx 43\ \Omega\), réelle, et \(L\omega_0 \approx 0{,}15\ \Omega\) est négligeable : \(\underline Z \approx 48{,}7 + 0{,}15\,j\ \Omega\). À la résonance, la membrane bouge le plus pour un courant donné : la f.c.é.m. \(B\ell v\) est maximale et s'oppose au courant, d'où une impédance maximale (le calcul confirme un maximum de \(|\underline Z|\) à \(58\ \text{Hz}\)).</p>
    <p><strong>C3.</strong> À \(1{,}0\ \text{kHz}\) : \(m\omega - k/\omega \approx 94\ \text{N·s·m}^{-1}\) domine \(\alpha\), \(\underline Z_{\text{mot}} \approx 0{,}01 - 0{,}68\,j\ \Omega\) et \(L\omega \approx 2{,}5\ \Omega\) : \(\underline Z \approx 6{,}0 + 1{,}8\,j\ \Omega\), de module \(6{,}3\ \Omega\). Au-dessus de quelques centaines de hertz, l'impédance reste voisine de \(R\) : c'est elle que les fabricants annoncent (4, 6 ou 8 Ω), bien que le haut-parleur présente près de 50 Ω à sa résonance.</p>
    <p><strong>C4.</strong> \(I = 2{,}0/48{,}7 \approx 41\ \text{mA}\) ; \(V = \dfrac{B\ell I}{\alpha} \approx 0{,}22\ \text{m·s}^{-1}\) ; déplacement \(V/\omega_0 \approx 0{,}60\ \text{mm}\). Puissance électrique moyenne \(\tfrac12\operatorname{Re}(\underline Z)\,I^2 \approx 41\ \text{mW}\), dont \(\tfrac12\alpha V^2 \approx 36\ \text{mW}\) transmis à l'équipage, soit 88 % : à la résonance, l'essentiel de la puissance quitte le circuit électrique par le couplage (\(\operatorname{Re}\underline Z_{\text{mot}}\) grande devant \(R\)). Seule une petite partie devient du son ; le modèle, avec un \(\alpha\) constant, ne distingue pas rayonnement et frottements.</p>
    <p><strong>D1.</strong> Avec \(i \approx 0\), l'équation électrique donne \(u = B\ell\,v\) : amplitude \(8{,}0\times1{,}0\times10^{-3} = 8{,}0\ \text{mV}\), qu'un préamplificateur rend exploitable. C'est le microphone électrodynamique. Si la bobine débite dans une faible résistance, le courant induit crée une force de Laplace qui, d'après la loi de Lenz, s'oppose au mouvement de la membrane : l'énergie électrique recueillie est prélevée sur l'onde sonore.</p>
  </div>
