<template class="pan-tpl" data-panneau="chs-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Pince à deux mors : compter avant de calculer</h3>
  <div class="statement">Une pince de préhension pneumatique est modélisée par six classes : corps 0 (bâti), tige de vérin 1, biellettes 2 et 4, mors 3 et 5. Liaisons : 1/0 glissière de direction \(\vec{x}\) ; 2/1 pivot d'axe \((B, \vec{z})\) ; 4/1 pivot d'axe \((B', \vec{z})\) ; 3/2 pivot d'axe \((C, \vec{z})\) ; 5/4 pivot d'axe \((C', \vec{z})\) ; 3/0 pivot d'axe \((D, \vec{z})\) ; 5/0 pivot d'axe \((D', \vec{z})\). Le vérin agit entre 0 et 1.</div>
  <div class="q"><strong>Q1.</strong> Décrire le graphe des liaisons. Quelle est la nature de la chaîne ? Calculer \(\gamma\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(m\) en précisant \(m_u\) et \(m_i\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(h\) pour le modèle spatial, puis pour un modèle plan. Interpréter l'écart.</div>
  <div class="q"><strong>Q4.</strong> Quelles conditions géométriques chaque boucle impose-t-elle ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Deux boucles partagent la glissière 1/0 : 0–1–2–3–0 et 0–1–4–5–0. \(n = 6\), \(n_L = 7\), donc \(\gamma = 7 - 6 + 1 = 2\) : chaîne <strong>complexe</strong>.</p>
    <p><strong>Q2.</strong> Tige bloquée, chaque boucle plane à quatre liaisons est immobile : la position de la tige fixe celle des deux mors. \(m_u = 1\), \(m_i = 0\), donc \(m = 1\) (un seul actionneur suffit).</p>
    <p><strong>Q3.</strong> Toutes les liaisons ont un degré de liberté : \(I_c = 7\). En 3D : \(h = m - I_c + 6\gamma = 1 - 7 + 12 = 6\). En plan : \(h = 1 - 7 + 3\times2 = 0\). Les 6 contraintes manquantes sont hors plan, 3 par boucle.</p>
    <p><strong>Q4.</strong> Dans chaque boucle, les équations \(R_x\), \(R_y\) et \(T_z\) de la fermeture cinématique se réduisent à « 0 = 0 » : les axes des pivots doivent être <strong>parallèles</strong> entre eux (deux conditions angulaires) et leurs positions selon \(\vec{z}\) <strong>cohérentes</strong> (une condition dimensionnelle). En pratique, des jeux dans les articulations suffisent souvent à absorber ces défauts sur une pince légère.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Support orientable : liaisons en série</h3>
  <div class="statement">Une colonne 1 est en liaison pivot glissant d'axe \((O, \vec{z})\) avec un pied 0. Une tête 2 est en liaison sphérique de centre C avec la colonne. On étudie la liaison équivalente entre 2 et 0 à l'instant considéré, dans la base \((\vec{x}, \vec{y}, \vec{z})\).</div>
  <div class="q"><strong>Q1.</strong> Cas où C = O. Écrire les deux torseurs cinématiques en O, en déduire la liaison équivalente, puis \(m_u\), \(m_i\) et \(h\).</div>
  <div class="q"><strong>Q2.</strong> Cas où \(\overrightarrow{OC} = a\,\vec{x}\) avec \(a \neq 0\). Même question (écrire les torseurs en C).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\{\mathcal{V}(1/0)\} = \{r_{10}\,\vec{z} \;;\; w_{10}\,\vec{z}\}_O\) (valable sur l'axe) et \(\{\mathcal{V}(2/1)\} = \{p_{21}\vec{x} + q_{21}\vec{y} + r_{21}\vec{z} \;;\; \vec{0}\}_O\). Somme en O :</p>
    <div class="formula">$$\{\mathcal{V}_{\text{éq}}(2/0)\} = \begin{Bmatrix} p_{21} & 0 \\ q_{21} & 0 \\ r_{10} + r_{21} & w_{10} \end{Bmatrix}_{O,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    <p>Trois rotations et une translation selon \(\vec{z}\) : liaison <strong>linéaire annulaire</strong> (sphère-cylindre) de centre O et de direction \(\vec{z}\). \(m = I_c = 2 + 3 = 5\), \(m_u = 4\), \(m_i = 1\) : la colonne peut tourner autour de \(\vec{z}\) pendant que la tête tourne en sens inverse (\(r_{21} = -r_{10}\)), sans mouvement de 2 par rapport à 0. Chaîne ouverte : \(h = 0\).</p>
    <p><strong>Q2.</strong> Transport en C (avec \(-a\,\vec{x}\wedge\vec{z} = a\,\vec{y}\)) :</p>
    <div class="formula">$$\vec{V}(C, 1/0) = w_{10}\,\vec{z} + \overrightarrow{CO}\wedge r_{10}\,\vec{z} = w_{10}\,\vec{z} + a\,r_{10}\,\vec{y}$$</div>
    <p>Somme en C :</p>
    <div class="formula">$$\{\mathcal{V}_{\text{éq}}(2/0)\} = \begin{Bmatrix} p_{21} & 0 \\ q_{21} & a\,r_{10} \\ r_{10} + r_{21} & w_{10} \end{Bmatrix}_{C,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    <p>Les cinq paramètres \(p_{21}\), \(q_{21}\), \(r_{10}+r_{21}\), \(r_{10}\), \(w_{10}\) sont indépendants : 5 degrés de liberté, trois rotations et deux translations en C, aucune selon \(\vec{x}\). C'est une <strong>sphère-plan</strong> (ponctuelle) de normale \((C, \vec{x})\). Ici \(m = m_u = 5\), \(m_i = 0\), \(h = 0\). Mêmes pièces, géométrie différente : liaison équivalente différente.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Table à deux guidages : liaisons en parallèle</h3>
  <div class="statement">Une table 1 se translate selon \(\vec{x}\) par rapport au bâti 0. Deux guidages sont placés en A et B, avec \(\overrightarrow{AB} = d\,\vec{y}\) (\(d = 400\ \text{mm}\)). Trois solutions sont envisagées :
    <ul style="margin:.4rem 0">
      <li>S1 : deux glissières de direction \(\vec{x}\), en A et en B ;</li>
      <li>S2 : pivot glissant d'axe \((A, \vec{x})\) + linéaire rectiligne en B, de ligne de contact \((B, \vec{x})\) et de normale \(\vec{z}\) ;</li>
      <li>S3 : appui plan de normale \(\vec{z}\) entre le dessous de la table et le dessus du bâti + linéaire rectiligne en B, de ligne de contact \((B, \vec{x})\) et de normale \(\vec{y}\) (règle d'appui latérale).</li>
    </ul>
  </div>
  <div class="q"><strong>Q1.</strong> S1 : nombre d'inconnues statiques, liaison équivalente, \(h\), nature des conditions géométriques.</div>
  <div class="q"><strong>Q2.</strong> S2 : torseur d'actions équivalent en A, identification, \(h\), inconnues indéterminées et condition géométrique associée.</div>
  <div class="q"><strong>Q3.</strong> S3 : même étude.</div>
  <div class="q"><strong>Q4.</strong> Quel inconvénient pratique présente S3 ? Comment y remédier ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque glissière transmet 5 composantes : \(I_s = 10\). La somme en A ne fait apparaître que \(Y_A + Y_B\), \(Z_A + Z_B\), \(L_A + L_B + d\,Z_B\), \(M_A + M_B\), \(N_A + N_B\) : liaison équivalente glissière de direction \(\vec{x}\), \(r_s = 5\), donc \(h = 10 - 5 = 5\). Conditions : 3 angulaires (les deux guidages doivent avoir exactement la même orientation autour de \(\vec{x}\), \(\vec{y}\) et \(\vec{z}\)) et 2 de position (écarts selon \(\vec{y}\) et \(\vec{z}\) identiques sur la table et sur le bâti).</p>
    <p><strong>Q2.</strong> \(\{\mathcal{T}_A\} = \{Y_A\vec{y} + Z_A\vec{z} \;;\; M_A\vec{y} + N_A\vec{z}\}_A\) et \(\{\mathcal{T}_B\} = \{Z_B\vec{z} \;;\; M_B\vec{y}\}_B\). Transport : \(\overrightarrow{AB}\wedge Z_B\vec{z} = d\,Z_B\,\vec{x}\). Somme en A :</p>
    <div class="formula">$$\{\mathcal{T}_{\text{éq}}\} = \begin{Bmatrix} 0 & d\,Z_B \\ Y_A & M_A + M_B \\ Z_A + Z_B & N_A \end{Bmatrix}_{A,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    <p>Glissière de direction \(\vec{x}\) ; 6 inconnues, rang 5 : \(h = 1\). Seule la somme \(M_A + M_B\) est connue : c'est un moment, donc une condition <strong>angulaire</strong> autour de \(\vec{y}\) : la ligne de contact en B doit être parallèle à l'axe du pivot glissant dans le plan \((\vec{x}, \vec{z})\).</p>
    <p><strong>Q3.</strong> L'appui plan transmet \(\{Z_P\vec{z} \;;\; L_P\vec{x} + M_P\vec{y}\}\), forme valable en tout point (on l'écrit en A). La linéaire rectiligne transmet \(\{\mathcal{T}_B\} = \{Y_B\vec{y} \;;\; N_B\vec{z}\}_B\) et \(\overrightarrow{AB}\wedge Y_B\vec{y} = \vec{0}\) puisque \(\overrightarrow{AB} = d\,\vec{y}\). Somme en A :</p>
    <div class="formula">$$\{\mathcal{T}_{\text{éq}}\} = \begin{Bmatrix} 0 & L_P \\ Y_B & M_P \\ Z_P & N_B \end{Bmatrix}_{A,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    <p>Glissière de direction \(\vec{x}\) ; 5 inconnues, rang 5 : \(h = 0\) (isostatique) et \(m = 6 - 5 = 1\). Chaque inconnue se calcule directement par le PFS.</p>
    <p><strong>Q4.</strong> Les deux contacts sont <strong>unilatéraux</strong> : la table ne reste sur le bâti que si \(Z_P\) garde le bon signe (poids suffisant, sinon brides de retenue), et contre la règle que si \(Y_B\) le garde (galets presseurs ou ressorts qui la plaquent latéralement). Il faut aussi que l'effort normal de l'appui plan reste à l'intérieur de la surface de contact, sinon la table bascule.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Bras de levage manœuvré par un vérin</h3>
  <div class="statement">Un bras 1 est articulé sur le bâti 0 par une pivot d'axe \((O, \vec{z}_0)\). Un vérin le manœuvre : corps 2 articulé sur le bâti par une pivot d'axe \((C, \vec{z}_0)\), tige 3 en pivot glissant d'axe \((C, \vec{x}_2)\) avec le corps, et articulée sur le bras par une pivot d'axe \((D, \vec{z}_0)\). On pose \(\overrightarrow{OC} = a\,\vec{x}_0\), \(\overrightarrow{OD} = b\,\vec{x}_1\), \(\overrightarrow{CD} = \lambda\,\vec{x}_2\), \(\theta = (\vec{x}_0, \vec{x}_1)\), avec \(a = 0{,}60\ \text{m}\), \(b = 0{,}35\ \text{m}\) ; \(\theta\) varie de 40° à 90°.</div>
  <div class="q"><strong>Q1.</strong> Graphe des liaisons, \(\gamma\), nature de la chaîne.</div>
  <div class="q"><strong>Q2.</strong> Par une fermeture géométrique, exprimer \(\lambda(\theta)\). En déduire la course du vérin.</div>
  <div class="q"><strong>Q3.</strong> Relier \(\dot\lambda\) et \(\dot\theta\). Vitesse angulaire du bras pour \(\theta = 60°\) si la tige sort à \(0{,}05\ \text{m/s}\) ?</div>
  <div class="q"><strong>Q4.</strong> Calculer \(m\) et \(h\) pour le modèle spatial, puis pour le modèle plan.</div>
  <div class="q"><strong>Q5.</strong> Le constructeur monte le vérin avec deux embouts à rotule (sphériques de centres C et D). Nouveaux \(m\) et \(h\) ? Intérêt ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Classes 0, 1, 2, 3 ; liaisons 1/0, 2/0, 3/2, 3/1 : \(n = 4\), \(n_L = 4\), \(\gamma = 1\) : chaîne <strong>fermée</strong> (cycle 0–1–3–2–0).</p>
    <p><strong>Q2.</strong> \(\overrightarrow{OC} + \overrightarrow{CD} + \overrightarrow{DO} = \vec{0}\), soit \(\lambda\,\vec{x}_2 = b\,\vec{x}_1 - a\,\vec{x}_0\). En prenant le carré scalaire (ce qui élimine l'angle du vérin) :</p>
    <div class="formula">$$\lambda^2 = a^2 + b^2 - 2ab\cos\theta$$</div>
    <div class="formula">$$\lambda(40°) = \sqrt{0{,}4825 - 0{,}42\times0{,}766} \approx 0{,}401\ \text{m} \qquad \lambda(90°) = \sqrt{0{,}4825} \approx 0{,}695\ \text{m}$$</div>
    <p>Course du vérin : \(\approx 0{,}294\ \text{m}\).</p>
    <p><strong>Q3.</strong> En dérivant : \(2\lambda\dot\lambda = 2ab\,\dot\theta\sin\theta\), d'où</p>
    <div class="formula">$$\dot\lambda = \frac{ab\sin\theta}{\lambda}\,\dot\theta$$</div>
    <p>Pour \(\theta = 60°\) : \(\lambda = \sqrt{0{,}4825 - 0{,}21} \approx 0{,}522\ \text{m}\) et \(\mathrm{d}\lambda/\mathrm{d}\theta = 0{,}21\times0{,}866/0{,}522 \approx 0{,}348\ \text{m/rad}\). Donc \(\dot\theta = 0{,}05/0{,}348 \approx 0{,}144\ \text{rad/s}\), environ 8°/s.</p>
    <p><strong>Q4.</strong> Modèle spatial : \(I_c = 1 + 1 + 2 + 1 = 5\). \(m_u = 1\) ; la tige ne peut pas tourner autour de \((CD)\), car sa pivot en D (axe \(\vec{z}_0\), perpendiculaire à \(CD\)) l'en empêche : \(m_i = 0\). Donc \(h = 1 - 5 + 6 = 2\) : une condition angulaire (axes en C et D parallèles à celui en O, autour de l'axe du plan perpendiculaire au vérin ; l'autre rotation est libérée par la pivot glissant) et une condition de position selon \(\vec{z}_0\). Modèle plan : la pivot glissant devient une glissière (1 degré de liberté), \(I_c = 4\), \(h = 1 - 4 + 3 = 0\).</p>
    <p><strong>Q5.</strong> \(I_c = 1 + 3 + 2 + 3 = 9\) ; \(m_u = 1\), \(m_i = 2\) (corps et tige peuvent chacun tourner autour de \((CD)\)), donc \(m = 3\) et \(h = 3 - 9 + 6 = 0\). Plus aucune condition de parallélisme : montage facile, et le vérin (masse négligée) n'est sollicité qu'en traction-compression selon \((CD)\), ce qui épargne la tige et les joints.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Pompe à excentrique : fermeture cinématique</h3>
  <div class="statement">Un excentrique 1 (disque de rayon R, de centre C) tourne autour de \((O, \vec{z}_0)\) par rapport au corps 0 (pivot), avec \(\overrightarrow{OC} = e\,\vec{x}_1\) et \(\theta = (\vec{x}_0, \vec{x}_1)\). Un poussoir 2, guidé par une glissière de direction \(\vec{y}_0\), appuie par sa face plane de normale \(\vec{y}_0\) sur le disque, au point I tel que \(\overrightarrow{CI} = R\,\vec{y}_0\) : liaison linéaire rectiligne de normale \(\vec{y}_0\) et de ligne de contact \((I, \vec{z}_0)\). Données : \(e = 4\ \text{mm}\), \(R = 25\ \text{mm}\), \(N = 900\ \text{tr/min}\).</div>
  <div class="q"><strong>Q1.</strong> Graphe des liaisons, \(\gamma\), \(I_c\).</div>
  <div class="q"><strong>Q2.</strong> Écrire la fermeture cinématique au point I dans la base 0. En déduire la vitesse \(v_{20}\) du poussoir et la vitesse de glissement en I.</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(m\) et \(h\). Quelle condition géométrique ?</div>
  <div class="q"><strong>Q4.</strong> Proposer une modification qui rend le mécanisme isostatique. Inconvénient ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Trois classes et trois liaisons : \(\gamma = 1\). Pivot (1), glissière (1) et linéaire rectiligne (4) : \(I_c = 1 + 1 + 4 = 6\).</p>
    <p><strong>Q2.</strong> \(\overrightarrow{OI} = e\,\vec{x}_1 + R\,\vec{y}_0\), donc</p>
    <div class="formula">$$\vec{V}(I, 1/0) = \overrightarrow{IO}\wedge\omega_{10}\vec{z}_0 = e\,\omega_{10}\,\vec{y}_1 - R\,\omega_{10}\,\vec{x}_0$$</div>
    <p>Torseurs en I :</p>
    <div class="formula">$$\{\mathcal{V}(2/1)\} = \{q_{21}\vec{y}_0 + r_{21}\vec{z}_0 \;;\; u_{21}\vec{x}_0 + w_{21}\vec{z}_0\}_I \qquad \{\mathcal{V}(0/2)\} = \{\vec{0} \;;\; -v_{20}\,\vec{y}_0\}$$</div>
    <p>Avec \(\vec{y}_1 = -\sin\theta\,\vec{x}_0 + \cos\theta\,\vec{y}_0\) :</p>
    <div class="formula">$$\begin{cases} R_x : & 0 = 0 \\ R_y : & q_{21} = 0 \\ R_z : & \omega_{10} + r_{21} = 0 \\ T_x : & -(e\sin\theta + R)\,\omega_{10} + u_{21} = 0 \\ T_y : & e\,\omega_{10}\cos\theta - v_{20} = 0 \\ T_z : & w_{21} = 0 \end{cases}$$</div>
    <p>Donc \(v_{20} = e\,\dot\theta\cos\theta\) (on retrouve la dérivée de \(y_I = e\sin\theta + R\)) et la vitesse de glissement vaut \(u_{21} = (R + e\sin\theta)\,\dot\theta\). Avec \(\dot\theta = 900\times2\pi/60 \approx 94{,}2\ \text{rad/s}\) : course \(2e = 8\ \text{mm}\), vitesse maximale du poussoir \(e\dot\theta \approx 0{,}38\ \text{m/s}\), glissement maximal \((R + e)\dot\theta \approx 2{,}7\ \text{m/s}\).</p>
    <p><strong>Q3.</strong> Cinq équations non triviales : \(r_c = 5\), \(m = 6 - 5 = 1\) (\(m_u = 1\)) et \(h = 6 - 5 = 1\). La ligne \(R_x\) : « 0 = 0 » impose une condition <strong>angulaire</strong> : la face du poussoir doit être parallèle à l'axe de l'excentrique (pas d'inclinaison autour de \(\vec{x}_0\)), sinon le poussoir ne touche plus le disque que sur un bord, avec une pression locale très élevée.</p>
    <p><strong>Q4.</strong> Donner au poussoir une face légèrement bombée (sphérique) : le contact devient ponctuel (sphère-plan, 5 degrés de liberté), qui libère \(R_x\). \(I_c = 7\), \(m = 1\), \(h = 1 - 7 + 6 = 0\). Inconvénient : la pression de contact (contact de Hertz ponctuel) est bien plus élevée, d'où usure et besoin de matériaux traités ou d'un galet.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Arbre de réducteur : choisir un modèle pour pouvoir calculer</h3>
  <div class="statement">Un arbre 1 est guidé dans un carter 0 par deux roulements à billes en A et B, avec \(\overrightarrow{AB} = L\,\vec{x}\) (\(L = 200\ \text{mm}\)). Il porte en G (\(\overrightarrow{AG} = a\,\vec{x}\), \(a = 50\ \text{mm}\)) un pignon hélicoïdal. On admet que l'action de la roue conjuguée sur le pignon se réduit en G au torseur \(\{F_a\vec{x} + F_r\vec{y} + F_t\vec{z} \;;\; C_r\,\vec{x}\}_G\) (on néglige le moment de flexion dû au fait que \(F_a\) s'applique sur le rayon primitif et non sur l'axe), avec \(F_a = 300\ \text{N}\), \(F_r = 600\ \text{N}\), \(F_t = 1600\ \text{N}\). Un moteur exerce sur l'arbre un couple \(C_m\,\vec{x}\). Pesanteur négligée, liaisons parfaites.</div>
  <div class="q"><strong>Q1.</strong> Modèle « deux pivots d'axe \((A, \vec{x})\) et \((B, \vec{x})\) » : calculer \(h\) par l'approche statique. Que peut-on dire des actions en A et B ?</div>
  <div class="q"><strong>Q2.</strong> Modèle retenu : roulement A arrêté axialement (sphérique de centre A), roulement B libre axialement (linéaire annulaire de centre B, direction \(\vec{x}\)). Calculer \(h\).</div>
  <div class="q"><strong>Q3.</strong> Écrire l'équilibre de l'arbre en A et déterminer les actions des roulements. Quelle équation ne contient aucune inconnue de liaison ? Interpréter.</div>
  <div class="q"><strong>Q4.</strong> Justifier physiquement le choix du modèle de Q2 (arbre en acier, \(\alpha = 12\cdot10^{-6}\ \text{K}^{-1}\), échauffement de 30 K).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(n = 2\), \(E_s = 6\), \(I_s = 5 + 5 = 10\), \(m = 1\) (rotation de l'arbre) : \(h = m + I_s - 6(n-1) = 1 + 10 - 6 = 5\). Le PFS ne donne que des combinaisons : \(X_A + X_B\), \(Y_A + Y_B\), \(Z_A + Z_B\) et deux combinaisons des moments \(M_A + M_B - L\,Z_B\), \(N_A + N_B + L\,Y_B\). Impossible de connaître la charge de chaque roulement sans modèle de déformation.</p>
    <p><strong>Q2.</strong> \(I_s = 3 + 2 = 5\) : \(h = 1 + 5 - 6 = 0\), isostatique.</p>
    <p><strong>Q3.</strong> Moments en A : \(\overrightarrow{AB}\wedge(Y_B\vec{y} + Z_B\vec{z}) = L\,Y_B\,\vec{z} - L\,Z_B\,\vec{y}\) et \(\overrightarrow{AG}\wedge\vec{F} = a\,F_r\,\vec{z} - a\,F_t\,\vec{y}\). Le PFS donne :</p>
    <div class="formula">$$\begin{cases} X_A + F_a = 0 \\ Y_A + Y_B + F_r = 0 \\ Z_A + Z_B + F_t = 0 \\ C_m + C_r = 0 \\ -L\,Z_B - a\,F_t = 0 \\ L\,Y_B + a\,F_r = 0 \end{cases}$$</div>
    <p>D'où \(X_A = -300\ \text{N}\), \(Y_B = -aF_r/L = -150\ \text{N}\), \(Z_B = -aF_t/L = -400\ \text{N}\), \(Y_A = -450\ \text{N}\), \(Z_A = -1200\ \text{N}\). Charges radiales : \(\sqrt{450^2 + 1200^2} \approx 1{,}28\ \text{kN}\) en A, \(\sqrt{150^2 + 400^2} \approx 0{,}43\ \text{kN}\) en B ; charge axiale 300 N sur A seul. L'équation \(C_m + C_r = 0\) ne contient aucune inconnue : c'est la condition d'équilibre associée à la mobilité (le couple moteur équilibre le couple résistant).</p>
    <p><strong>Q4.</strong> L'allongement libre de l'arbre vaut :</p>
    <div class="formula">$$\Delta L = \alpha L\,\Delta T = 12\cdot10^{-6}\times200\times30 \approx 0{,}07\ \text{mm}$$</div>
    <p>Avec deux roulements arrêtés axialement, cette dilatation empêchée créerait des efforts axiaux très importants (de l'ordre de \(E\alpha\Delta T \approx 75\ \text{MPa}\) dans l'arbre pour des appuis rigides) et surchargerait les roulements. Laisser B libre axialement supprime ce problème : c'est la condition dimensionnelle axiale de l'hyperstatisme qui est libérée.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Timonerie d'essuie-glace : choisir les isolements et les équations</h3>
  <div class="statement">Le balai d'un essuie-glace est porté par un balancier 1, en liaison pivot d'axe \((O, \vec{z})\) avec la carrosserie 0. Un motoréducteur, dont le carter est fixé sur 0, entraîne une manivelle 2 en liaison pivot d'axe \((A, \vec{z})\) avec 0 et exerce sur elle le couple \(C_m\,\vec{z}\). Une bielle 3 relie la manivelle au balancier par deux liaisons sphériques, de centres \(B\) (sur 2) et \(C\) (sur 1). Bielle et manivelle ont une masse négligeable, les liaisons sont parfaites et le poids est négligé devant les autres actions. Le frottement du balai sur la vitre se réduit, sur le balancier, à un couple \(-C_r\,\vec{z}\) opposé au mouvement, avec \(C_r = 12\ \text{N·m}\). Dans la position étudiée, le mécanisme est plan et l'on donne, en mètres, dans le repère \((O, \vec{x}, \vec{y})\) : \(C(0{,}050 \,;\, 0)\), \(A(0 \,;\, -0{,}120)\), \(B(0{,}030 \,;\, -0{,}120)\). Le balancier tourne dans le sens positif (\(\dot\theta_1 \gt 0\)).</div>
  <div class="q"><strong>Q1.</strong> Tracer le graphe de structure (liaisons et actions extérieures). Calculer \(\gamma\), \(m\) (en précisant \(m_u\) et \(m_i\)) et \(h\). Conclure sur la possibilité de calculer toutes les actions de liaison par la statique.</div>
  <div class="q"><strong>Q2.</strong> On cherche \(C_m\) en régime lent (termes d'inertie négligés). Proposer une démarche : quels isolements, dans quel ordre, et quelle équation pour chacun, de façon à n'écrire aucune équation inutile ?</div>
  <div class="q"><strong>Q3.</strong> Mettre en œuvre cette démarche : effort \(F\) dans la bielle (préciser traction ou compression), puis \(C_m\).</div>
  <div class="q"><strong>Q4.</strong> Au démarrage, le balancier (inertie \(J_1 = 0{,}020\ \text{kg·m}^2\) autour de \((O, \vec{z})\), balai compris) accélère à \(\ddot\theta_1 = 20\ \text{rad·s}^{-2}\) en passant par cette position avec une vitesse encore faible. Quel principe faut-il appliquer, à quel isolement ? Calculer le nouveau \(C_m\) et conclure sur l'hypothèse de Q3.</div>
  <div class="q"><strong>Q5.</strong> On connaît maintenant \(C_m(t)\) et l'on cherche la loi \(\theta_1(t)\). Quel isolement et quel théorème choisir ? Écrire l'équation obtenue en notant \(\lambda = \dot\theta_2/\dot\theta_1\), et calculer \(\lambda\) dans la position étudiée par une relation cinématique. Vérifier la cohérence avec Q4.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Graphe : 0–1 pivot \((O, \vec{z})\), 0–2 pivot \((A, \vec{z})\), 2–3 sphérique \(B\), 3–1 sphérique \(C\) ; actions extérieures : \(C_m\) sur 2 (depuis 0), \(-C_r\) sur 1. \(n = 4\), \(n_L = 4\), \(\gamma = 1\). Manivelle bloquée, \(B\) est fixe et le balancier ne peut plus tourner (la longueur \(BC\) est constante) : \(m_u = 1\) ; la bielle peut tourner autour de \((BC)\) : \(m_i = 1\), donc \(m = 2\). Avec \(I_c = 1 + 1 + 3 + 3 = 8\) : \(h = m - I_c + 6\gamma = 2 - 8 + 6 = 0\) (approche statique : \(I_s = 5 + 5 + 3 + 3 = 16\), \(h = m + I_s - 6(n-1) = 2 + 16 - 18 = 0\)). Le modèle est isostatique : toutes les actions de liaison se calculent par le principe fondamental de la statique.</p>
    <p><strong>Q2.</strong> (1) Isoler la bielle 3 : masse négligée, deux actions seulement (les glisseurs des sphériques en \(B\) et \(C\)), donc elles sont opposées et portées par \((BC)\) ; il ne reste qu'une inconnue, l'intensité \(F\). (2) Isoler le balancier 1 : moment en \(O\) projeté sur \(\vec{z}\), qui élimine les cinq inconnues de la pivot en \(O\) ; il donne \(F\). (3) Isoler la manivelle 2 : moment en \(A\) projeté sur \(\vec{z}\), qui élimine celles de la pivot en \(A\) ; il donne \(C_m\). Au total, deux équations scalaires écrites pour les deux inconnues utiles \(F\) et \(C_m\), au lieu des 18 équations des trois isolements complets.</p>
    <p><strong>Q3.</strong> \(\overrightarrow{BC} = (0{,}020 \,;\, 0{,}120)\), de longueur \(0{,}1217\ \text{m}\) ; on note \(\vec{u} = \overrightarrow{BC}/BC\) et \(F\vec{u}\) l'action de 3 sur 1 en \(C\). Les bras de levier valent :</p>
    <div class="formula">$$d_1 = \|\overrightarrow{OC}\wedge\vec{u}\| = \frac{0{,}050\times0{,}120}{0{,}1217} \approx 0{,}0493\ \text{m} \qquad d_2 = \|\overrightarrow{AB}\wedge\vec{u}\| = \frac{0{,}030\times0{,}120}{0{,}1217} \approx 0{,}0296\ \text{m}$$</div>
    <p>Balancier, moment en \(O\) sur \(\vec{z}\) : \(F\,d_1 - C_r = 0\), d'où \(F \approx 243\ \text{N}\). \(F \gt 0\) : la bielle pousse le balancier, elle est <strong>comprimée</strong>. Manivelle, qui reçoit \(-F\vec{u}\) en \(B\) : \(C_m - F\,d_2 = 0\), soit</p>
    <div class="formula">$$C_m = C_r\,\frac{d_2}{d_1} = 12\times0{,}6 = 7{,}2\ \text{N·m}$$</div>
    <p><strong>Q4.</strong> Le mouvement est imposé et l'on cherche un couple : principe fondamental de la dynamique, mêmes isolements et mêmes projections. La bielle, de masse négligée, reste soumise à deux glisseurs opposés. Pour le balancier, en rotation autour de l'axe fixe \((O, \vec{z})\), le moment dynamique projeté sur l'axe vaut \(J_1\ddot\theta_1\) : \(F\,d_1 - C_r = J_1\ddot\theta_1 = 0{,}40\ \text{N·m}\), donc \(C_m = 0{,}6\times(12 + 0{,}40) \approx 7{,}44\ \text{N·m}\). L'inertie n'ajoute que 3 % : l'hypothèse du régime lent était justifiée pour dimensionner le moteur.</p>
    <p><strong>Q5.</strong> Loi de mouvement d'un mécanisme à une mobilité utile, efforts de liaison non demandés : théorème de l'énergie cinétique appliqué à \(\{1, 2, 3\}\). Énergie cinétique : \(\frac12 J_1\dot\theta_1^2\) (2 et 3 de masse négligée). Puissances : moteur \(C_m\dot\theta_2\) (stator fixé au bâti), frottement \(-C_r\dot\theta_1\), liaisons parfaites : 0. Après division par \(\dot\theta_1\) :</p>
    <div class="formula">$$J_1\,\ddot\theta_1 = \lambda\,C_m - C_r \qquad \lambda = \frac{\dot\theta_2}{\dot\theta_1}$$</div>
    <p>La bielle est rigide : \(\vec{V}(B)\cdot\vec{u} = \vec{V}(C)\cdot\vec{u}\) (équiprojectivité), avec \(\vec{V}(C) = 0{,}050\,\dot\theta_1\,\vec{y}\) et \(\vec{V}(B) = 0{,}030\,\dot\theta_2\,\vec{y}\), d'où \(\lambda = 0{,}050/0{,}030 = 5/3 = d_1/d_2\). Avec \(C_m = 7{,}44\ \text{N·m}\) : \(\lambda C_m - C_r = 12{,}4 - 12 = 0{,}40\ \text{N·m} = J_1\ddot\theta_1\). Le théorème de l'énergie cinétique redonne le résultat du principe fondamental (il s'en déduit) ; il évite simplement d'isoler les pièces une à une. \(\lambda\) dépend de la position : l'équation de mouvement complète se résout numériquement.</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Hayon de coffre assisté par deux vérins à gaz</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>chaînes de solides, mobilité et hyperstatisme</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Le hayon 1 d'un véhicule s'ouvre par rotation autour de l'axe \((A, \vec{x})\) par rapport à la caisse 0. Il est porté par deux charnières modélisées par des pivots d'axes \((A, \vec{x})\) et \((B, \vec{x})\), avec \(\overrightarrow{AB} = \ell\,\vec{x}\). Deux vérins à gaz identiques l'assistent. Vérin gauche : corps 2 en liaison sphérique de centre C avec la caisse, tige 3 en pivot glissant d'axe \((CD)\) avec le corps, tige en liaison sphérique de centre D avec le hayon. Vérin droit : corps 4, tige 5, centres E et F, montage identique. Dans le plan perpendiculaire à \(\vec{x}\) : \(AC = c = 0{,}30\ \text{m}\), \(AD = d = 0{,}45\ \text{m}\), l'angle entre \(\overrightarrow{AC}\) et \(\overrightarrow{AD}\) vaut \(\varphi_0 + \theta\) avec \(\varphi_0 = 70°\), où \(\theta\) est l'angle d'ouverture, de 0 (fermé) à 80°.
  </div>

  <p class="exo-part">Partie A — Modélisation</p>
  <div class="q"><strong>A1.</strong> Construire le graphe des liaisons. Donner \(n\), \(n_L\) et le nombre cyclomatique \(\gamma\).</div>

  <p class="exo-part">Partie B — Mobilité et hyperstatisme</p>
  <div class="q"><strong>B1.</strong> Déterminer \(m_u\) et \(m_i\) en décrivant chaque mobilité.</div>
  <div class="q"><strong>B2.</strong> Calculer \(h\) par l'approche cinématique.</div>
  <div class="q"><strong>B3.</strong> Retrouver ce résultat par l'approche statique.</div>

  <p class="exo-part">Partie C — Origine de l'hyperstatisme</p>
  <div class="q"><strong>C1.</strong> Étudier l'ensemble des deux charnières seules : liaison équivalente, degré d'hyperstatisme, conditions géométriques. Conclure sur la contribution des vérins.</div>
  <div class="q"><strong>C2.</strong> Proposer une modélisation des charnières qui rende le mécanisme isostatique sans changer sa fonction. Vérifier par le calcul.</div>

  <p class="exo-part">Partie D — Loi entrée-sortie et efforts (modèle plan)</p>
  <div class="q"><strong>D1.</strong> Exprimer la longueur \(\lambda = CD\) d'un vérin en fonction de \(\theta\). Calculer la course nécessaire.</div>
  <div class="q"><strong>D2.</strong> Justifier que l'action d'un vérin sur le hayon est portée par la droite \((CD)\).</div>
  <div class="q"><strong>D3.</strong> Montrer que le bras de levier \(\delta\) de cette action par rapport à l'axe des charnières vaut \(\mathrm{d}\lambda/\mathrm{d}\theta\). Retrouver ce résultat par un argument de puissance, puis calculer le moment des deux vérins pour \(\theta = 40°\) si chacun pousse avec \(F = 350\ \text{N}\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Classes : caisse 0, hayon 1, corps 2 et tige 3 (vérin gauche), corps 4 et tige 5 (vérin droit) : \(n = 6\). Liaisons : deux pivots 1/0, et pour chaque vérin sphérique + pivot glissant + sphérique : \(n_L = 8\). \(\gamma = 8 - 6 + 1 = 3\) : boucle des deux charnières (0–1–0), boucle 0–2–3–1–0 et boucle 0–4–5–1–0.</p>
    <p><strong>B1.</strong> \(m_u = 1\) : l'angle d'ouverture \(\theta\). \(m_i = 4\) : dans chaque vérin, le corps et la tige peuvent tourner autour de leur axe commun indépendamment l'un de l'autre, sans aucun effet sur le hayon. Donc \(m = 5\).</p>
    <p><strong>B2.</strong> \(I_c = 1 + 1 + 2\times(3 + 2 + 3) = 18\) : \(h = m - I_c + 6\gamma = 5 - 18 + 18 = 5\).</p>
    <p><strong>B3.</strong> \(I_s = 5 + 5 + 2\times(3 + 4 + 3) = 30\), \(E_s = 6(n-1) = 30\) : \(h = m + I_s - E_s = 5 + 30 - 30 = 5\). Les deux approches concordent.</p>
    <p><strong>C1.</strong> Deux pivots coaxiales en parallèle : liaison équivalente pivot d'axe \((A, \vec{x})\), \(I_s = 10\), \(r_s = 5\), donc \(h = 5\). Tout l'hyperstatisme vient des charnières : chaque vérin à deux rotules est une chaîne série dont la liaison équivalente laisse 6 degrés de liberté (sa longueur est libre du point de vue des liaisons) ; il n'ajoute aucune contrainte. Conditions : coaxialité des deux charnières (2 conditions angulaires, 2 de position) et une condition de position selon \(\vec{x}\) (les deux charnières arrêtent le hayon axialement).</p>
    <p><strong>C2.</strong> Charnière A modélisée par une sphérique de centre A, charnière B par une linéaire annulaire de centre B et de direction \(\vec{x}\) (cf. paire de roulements). Elles restent équivalentes à une pivot (fonction conservée, \(m_u = 1\), \(m_i = 4\)) : \(I_c = 3 + 4 + 16 = 23\), \(h = 5 - 23 + 18 = 0\). En pratique : jeu ou bague élastomère dans une charnière, axe flottant, réglage de position au montage.</p>
    <p><strong>D1.</strong> Dans le triangle ACD : \(\overrightarrow{CD} = \overrightarrow{AD} - \overrightarrow{AC}\), donc</p>
    <div class="formula">$$\lambda^2 = c^2 + d^2 - 2cd\cos(\varphi_0 + \theta)$$</div>
    <div class="formula">$$\lambda(0) = \sqrt{0{,}2925 - 0{,}27\cos70°} \approx 0{,}447\ \text{m} \qquad \lambda(80°) = \sqrt{0{,}2925 - 0{,}27\cos150°} \approx 0{,}725\ \text{m}$$</div>
    <p>Course nécessaire : \(\approx 0{,}278\ \text{m}\).</p>
    <p><strong>D2.</strong> On isole un vérin complet (corps + tige), de masse négligée, liaisons parfaites : la pression du gaz est une action intérieure. Il n'est soumis qu'à deux actions extérieures, celles des sphériques en C et D, qui sont des glisseurs passant par C et par D. L'équilibre impose qu'ils soient opposés et portés par la droite \((CD)\).</p>
    <p><strong>D3.</strong> Le bras de levier est la distance de A à la droite \((CD)\) : \(\delta = 2\,\mathcal{A}_{ACD}/\lambda = cd\sin(\varphi_0 + \theta)/\lambda\). En dérivant D1 : \(2\lambda\,\mathrm{d}\lambda = 2cd\sin(\varphi_0 + \theta)\,\mathrm{d}\theta\), donc \(\mathrm{d}\lambda/\mathrm{d}\theta = \delta\). Argument de puissance : liaisons parfaites, la puissance de la poussée \(F\dot\lambda\) est égale à celle du moment sur le hayon \(M_1\dot\theta\), donc \(M_1 = F\,\mathrm{d}\lambda/\mathrm{d}\theta\). Pour \(\theta = 40°\) : \(\lambda = \sqrt{0{,}2925 + 0{,}27\times0{,}342} \approx 0{,}620\ \text{m}\), \(\delta = 0{,}135\times0{,}940/0{,}620 \approx 0{,}205\ \text{m}\), d'où un moment total \(2F\delta \approx 2\times350\times0{,}205 \approx 143\ \text{N·m}\).</p>
  </div>
