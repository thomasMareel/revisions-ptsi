<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre reprend et approfondit la modélisation des mécanismes de 1ʳᵉ année (liaisons, fermetures, liaisons équivalentes, mobilité et hyperstatisme : semestres S1 et S2), que les sujets de PT remobilisent dans presque toutes les études de mécanisme. Il y ajoute une capacité de 2ᵉ année (C1, semestre S3) : <strong>proposer une démarche</strong> pour trouver une action mécanique inconnue ou une loi de mouvement. Il sert de point de départ aux chapitres Cinétique et dynamique du solide (3D), Énergétique des systèmes de solides et Résistance des matériaux.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Proposer un modèle cinématique paramétré</strong> à partir d'un système réel, d'une maquette numérique ou d'un plan d'ensemble : classes d'équivalence, graphe des liaisons, schéma cinématique, paramètres linéaires et angulaires (B2, rappel S1) (§1).</li>
        <li><strong>Obtenir une loi entrée-sortie géométrique</strong> par fermeture géométrique (C1 et C2, rappel S1-S2) (§2).</li>
        <li><strong>Obtenir une loi entrée-sortie cinématique</strong> par fermeture cinématique (C2, rappel S2) (§3).</li>
        <li><strong>Proposer une démarche pour déterminer une action mécanique inconnue ou une loi de mouvement</strong> : graphe de structure, choix des isolements, choix des équations du principe fondamental de la statique ou de la dynamique, théorème de l'énergie cinétique (C1, <strong>S3</strong>) (§3).</li>
        <li><strong>Simplifier un modèle de mécanisme</strong> : associations de liaisons en série et en parallèle, liaisons équivalentes par les approches cinématique et statique (B2, rappel S2) (§4).</li>
        <li><strong>Mobilité et hyperstatisme</strong> du modèle d'un mécanisme ; conditions et limites de la modélisation plane (B2, rappel S2) (§5).</li>
        <li><strong>Conditions géométriques associées à l'hyperstatisme</strong> (B2, rappel S2) (§6).</li>
        <li><strong>Modifier un modèle pour le rendre isostatique</strong> : substitution de liaisons, ajout de solide (B2, rappel S2) (§7).</li>
      </ul>
      <p>Hors programme : rien dans ce chapitre. On dénombre les inconnues hyperstatiques et on les relie aux conditions géométriques, mais on ne les calcule pas : il faudrait un modèle déformable, et les méthodes de résolution des problèmes hyperstatiques de résistance des matériaux ne sont pas au programme.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · MODÉLISER UN MÉCANISME</div>
  <h2>Du mécanisme réel au graphe des liaisons</h2>
  <div class="intro">Avant tout calcul, on remplace le mécanisme par un modèle : quelques solides indéformables reliés par des liaisons parfaites. Tout le reste (loi entrée-sortie, efforts, hyperstatisme) dépend de ce choix : un modèle n'est pas « vrai » ou « faux », il est adapté ou non à la question posée.</div>

  <h3>Classes d'équivalence cinématique</h3>
  <div class="def-box">
    Une <strong>classe d'équivalence cinématique</strong> (ou sous-ensemble cinématique) rassemble toutes les pièces qui n'ont <strong>aucun mouvement relatif</strong> entre elles pendant la phase de fonctionnement étudiée. Elle est modélisée par un seul solide, numéroté (0 pour le bâti ou la pièce de référence).
  </div>
  <ul>
    <li>Vis, goupilles, clavettes, bagues emmanchées rejoignent la classe des pièces qu'elles immobilisent.</li>
    <li>On exclut les éléments roulants (billes, rouleaux) et les pièces déformables (ressorts, joints) : un roulement devient une liaison entre la classe de sa bague intérieure et celle de sa bague extérieure.</li>
    <li>Le découpage dépend de la situation étudiée : sur une perceuse à colonne, la table est solidaire de la colonne pendant le perçage, mais forme une classe à part dès qu'on desserre sa manette pour la régler en hauteur.</li>
  </ul>

  <h3>Graphe des liaisons</h3>
  <div class="def-box">
    Le <strong>graphe des liaisons</strong> (ou graphe de structure) représente chaque classe par un sommet et chaque liaison par un arc entre les deux classes concernées. Chaque arc porte la <strong>nature</strong> de la liaison et ses <strong>caractéristiques géométriques</strong> : centre d'une sphérique, axe d'une pivot ou d'une pivot glissant, direction d'une glissière, normale d'un appui plan ou d'une sphère-plan…
  </div>

  <h3>Chaînes ouvertes, fermées, complexes — nombre cyclomatique</h3>
  <div class="def-box">
    Soit \(n\) le nombre de classes (bâti compris) et \(n_L\) le nombre de liaisons. Une <strong>chaîne ouverte</strong> ne contient aucune boucle (bras de robot sériel), une <strong>chaîne fermée</strong> en contient une seule, une <strong>chaîne complexe</strong> en contient plusieurs. Le <strong>nombre cyclomatique</strong> est le nombre de cycles indépendants :
    $$\gamma = n_L - n + 1$$
  </div>
  <div class="prop-box">
    <strong>Pourquoi ?</strong> Relier \(n\) sommets sans former de boucle demande exactement \(n-1\) arcs (un « arbre »). Chaque liaison supplémentaire referme un cycle nouveau, indépendant des précédents : \(\gamma = n_L - (n-1)\). Chaîne ouverte : \(\gamma = 0\) ; fermée : \(\gamma = 1\) ; complexe : \(\gamma \geq 2\).
  </div>

  <h3>Schéma cinématique minimal ou d'architecture</h3>
  <p>Le schéma cinématique emploie les symboles normalisés des liaisons, en plan ou en perspective. On distingue deux niveaux de détail :</p>
  <ul>
    <li><strong>schéma minimal</strong> : chaque groupe de liaisons entre deux classes est remplacé par sa liaison équivalente. C'est le schéma des lois de mouvement (loi entrée-sortie, vitesses).</li>
    <li><strong>schéma d'architecture</strong> : chaque contact est représenté (chaque roulement, chaque portée). C'est lui qui sert à calculer les efforts dans chaque liaison et à étudier l'hyperstatisme.</li>
  </ul>

  <h3>Paramétrage</h3>
  <p>Chaque classe reçoit son repère, dont un vecteur de base est aligné de préférence sur l'axe (ou la direction) d'une liaison qu'elle porte. Le mouvement permis par une liaison se décrit alors avec un <strong>paramètre de position</strong> (angle ou longueur variable) par degré de liberté. Pour chaque rotation, tracer la petite figure plane qui relie les deux bases, avec un angle orienté et dessiné positif : la plupart des erreurs de signe disparaissent.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Un mécanisme comporte 5 classes et 7 liaisons. Combien de fermetures indépendantes faut-il écrire ?</span>
    <div class="content"><p>\(\gamma = 7 - 5 + 1 = 3\) : trois fermetures (géométriques ou cinématiques) indépendantes, choisies sur trois cycles du graphe dont aucun n'est « combinaison » des autres. Écrire une fermeture de plus n'apporterait aucune information nouvelle.</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · FERMETURE GÉOMÉTRIQUE</div>
  <h2>Loi entrée-sortie géométrique</h2>
  <div class="intro">La loi entrée-sortie géométrique relie le paramètre de position de la pièce d'entrée (pilotée par l'actionneur) à celui de la pièce de sortie. On l'obtient en écrivant que chaque cycle du graphe se referme.</div>

  <h3>Fermetures vectorielle et angulaire</h3>
  <div class="def-box">
    Pour un cycle \(0 \to 1 \to \dots \to k \to 0\), en notant \(O_{ij}\) un point caractéristique de la liaison entre \(i\) et \(j\) :
    <ul style="margin:.4rem 0">
      <li><strong>fermeture vectorielle</strong> (ou dimensionnelle) : la somme des vecteurs qui font le tour du cycle est nulle ;</li>
      <li><strong>fermeture angulaire</strong> : la composition des rotations relatives du cycle ramène à l'orientation de départ.</li>
    </ul>
    <div class="formula">$$\overrightarrow{O_{01}O_{12}} + \overrightarrow{O_{12}O_{23}} + \dots + \overrightarrow{O_{k0}O_{01}} = \vec{0}$$</div>
    En plan (toutes les rotations autour de la même normale \(\vec{z}\)), la fermeture angulaire est scalaire :
    <div class="formula">$$\theta_{1/0} + \theta_{2/1} + \dots + \theta_{0/k} = 0 \pmod{2\pi}$$</div>
  </div>
  <div class="prop-box">
    <strong>Bilan équations / paramètres.</strong> Une fermeture apporte au plus 6 relations scalaires dans l'espace (3 de position, 3 d'orientation) et 3 en plan (2 projections et l'équation angulaire). Si un cycle plan fait intervenir \(p\) paramètres variables, il en reste donc au moins \(p - 3\) à imposer de l'extérieur. Bielle-manivelle ci-dessous : \(p = 4\) (trois angles de pivot et la position du piston), une seule entrée suffit.
  </div>
  <p>Dans l'espace, l'équation angulaire (composition de rotations d'axes différents) est rarement exploitable telle quelle. On cherche plutôt, dans le cycle, deux directions liées à des classes différentes dont l'angle ne varie pas : leur produit scalaire, constant, fournit directement une équation entre paramètres. Exemple : dans un joint de cardan, les deux axes du croisillon restent perpendiculaires, et cette seule condition donne la loi entrée-sortie.</p>

  <h3>Exemple : bielle-manivelle centrée</h3>

  <p>On pose \(\overrightarrow{OA} = R\,\vec{x}_1\), \(\overrightarrow{AB} = L\,\vec{x}_2\), \(\overrightarrow{OB} = x\,\vec{x}_0\), avec \(L > R\). La fermeture \(\overrightarrow{OA} + \overrightarrow{AB} + \overrightarrow{BO} = \vec{0}\), projetée sur \((\vec{x}_0, \vec{y}_0)\), donne :</p>
  <div class="formula">$$R\,\vec{x}_1 + L\,\vec{x}_2 - x\,\vec{x}_0 = \vec{0} \;\Longrightarrow\; \begin{cases} R\cos\theta + L\cos\beta = x \\ R\sin\theta + L\sin\beta = 0 \end{cases}$$</div>
  <p>L'angle \(\beta\) est un paramètre de liaison sans intérêt pour la loi cherchée : on l'élimine en isolant \(L\cos\beta\) et \(L\sin\beta\), puis en sommant les carrés.</p>
  <div class="formula">$$L^2 = (x - R\cos\theta)^2 + R^2\sin^2\theta \;\Longrightarrow\; x = R\cos\theta + \sqrt{L^2 - R^2\sin^2\theta}$$</div>
  <p>On garde la racine positive (piston du côté \(x > 0\), possible car \(L > R\)). La fermeture angulaire, \(\theta + (\beta - \theta) + (-\beta) = 0\), est ici satisfaite d'office par le choix des angles : elle n'apporte rien de plus.</p>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">R = 40 mm, L = 140 mm : course du piston et position pour θ = 90° ?</span>
    <div class="content"><p>Course :</p><div class="formula">$$x(0) - x(\pi) = (L + R) - (L - R) = 2R = 80\ \text{mm}$$</div><p>Pour \(\theta = 90°\) :</p><div class="formula">$$x = \sqrt{L^2 - R^2} = \sqrt{140^2 - 40^2} \approx 134{,}2\ \text{mm}$$</div><p>soit légèrement moins que \(L = 140\ \text{mm}\).</p></div>
  </div>
  <div class="notice"><strong>Piège.</strong> Une racine carrée cache un choix de configuration (piston d'un côté ou de l'autre, coude « en haut » ou « en bas ») : vérifier le signe sur une position simple, par exemple \(\theta = 0\). Et ne pas éliminer trop tôt un paramètre dont on aura besoin ensuite.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · FERMETURE CINÉMATIQUE ET ANALYSE DES EFFORTS</div>
  <h2>Relations entre vitesses ; actions mécaniques dans un mécanisme</h2>
  <div class="intro">La fermeture cinématique est la version « vitesses » de la fermeture géométrique. Écrite avec les inconnues cinématiques des liaisons, elle fournit le système d'équations dont le rang donne mobilité et hyperstatisme.</div>

  <h3>Torseur cinématique d'une liaison</h3>
  <div class="def-box">
    Le mouvement de \(j\) par rapport à \(i\) est décrit, en un point \(P\), par :
    <div class="formula">$$\{\mathcal{V}(j/i)\} = \begin{Bmatrix} \vec{\Omega}(j/i) \\ \vec{V}(P, j/i) \end{Bmatrix}_P = \begin{Bmatrix} p_{ji} & u_{ji} \\ q_{ji} & v_{ji} \\ r_{ji} & w_{ji} \end{Bmatrix}_{P,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    Une liaison à \(n_c\) degrés de liberté laisse \(n_c\) composantes indépendantes. Sa forme « simple » n'est valable qu'en certains points : sur l'axe d'une pivot, au centre d'une sphérique, partout pour une glissière…
  </div>

  <h3>Relation de fermeture</h3>
  <div class="prop-box">
    Pour un cycle \(0 \to 1 \to \dots \to k \to 0\), la composition des mouvements donne :
    <div class="formula">$$\{\mathcal{V}(1/0)\} + \{\mathcal{V}(2/1)\} + \dots + \{\mathcal{V}(0/k)\} = \{0\}$$</div>
    à condition d'écrire <strong>tous les torseurs au même point</strong>, grâce à la relation de transport :
    <div class="formula">$$\vec{V}(B, j/i) = \vec{V}(A, j/i) + \overrightarrow{BA}\wedge\vec{\Omega}(j/i)$$</div>
    Projetée dans une base, la fermeture d'un cycle donne 6 équations scalaires (3 en plan), soit \(E_c = 6\gamma\) équations pour tout le mécanisme.
  </div>
  <p><strong>Choix du point</strong> : celui où le plus de torseurs s'écrivent sans transport (point commun à plusieurs axes, centre d'une sphérique). <strong>Choix de la base</strong> : celle où les vecteurs de position ont le moins de composantes.</p>

  <h3>Lien avec la fermeture géométrique</h3>
  <p>Les deux fermetures ne sont pas indépendantes : la fermeture cinématique n'est autre que la dérivée temporelle de la fermeture géométrique (dans \(\mathcal{R}_0\), \(\mathrm{d}\vec{x}_1/\mathrm{d}t = \dot\theta\,\vec{y}_1\)). Pour obtenir une <strong>loi en vitesse</strong>, le plus court est souvent de dériver la loi géométrique déjà établie. La fermeture cinématique écrite avec les inconnues de liaison reste l'outil pour <strong>dénombrer</strong> (rang, mobilité, hyperstatisme). Bielle-manivelle :</p>
  <div class="formula">$$\dot{x} = -R\,\dot\theta\sin\theta\left(1 + \frac{R\cos\theta}{\sqrt{L^2 - R^2\sin^2\theta}}\right)$$</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Vitesse du piston pour θ = 90° ? Interprétation, et valeur pour R = 40 mm, N = 1500 tr/min.</span>
    <div class="content"><p>Pour \(\theta = 90°\), \(\cos\theta = 0\) : \(\dot{x} = -R\dot\theta\). Les vitesses de A et de B sont alors toutes deux parallèles à \(\vec{x}_0\) : la bielle est en translation instantanée (centre instantané de rotation rejeté à l'infini), donc \(\vec{V}(B) = \vec{V}(A)\). Avec \(\dot\theta = 1500 \times 2\pi/60 \approx 157\ \text{rad/s}\) : \(|\dot{x}| \approx 0{,}040 \times 157 \approx 6{,}3\ \text{m/s}\).</p></div>
  </div>

  <h3>Analyse des actions mécaniques</h3>
  <div class="def-box">
    Le torseur des actions transmissibles par la liaison de \(i\) sur \(j\) s'écrit :
    <div class="formula">$$\{\mathcal{T}(i\to j)\} = \begin{Bmatrix} X_{ij} & L_{ij} \\ Y_{ij} & M_{ij} \\ Z_{ij} & N_{ij} \end{Bmatrix}_{P,\,(\vec{x},\vec{y},\vec{z})}$$</div>
    Une liaison parfaite à \(n_c\) degrés de liberté transmet \(n_s = 6 - n_c\) composantes indépendantes : la puissance des actions mutuelles dans une liaison parfaite est nulle, donc chaque mouvement permis « interdit » la composante d'effort correspondante.
  </div>
  <p>Avant toute équation, fixer le cadre de l'étude : quel modèle de contact (sans frottement ou avec frottement de Coulomb), quelles actions à distance (le poids compte-t-il devant les autres efforts ?), quel principe (PFS si les termes d'inertie sont négligeables, PFD sinon), et une éventuelle réduction à un problème plan, quand une symétrie du mécanisme et de son chargement la justifie.</p>
  <div class="prop-box">
    <strong>Démarche.</strong> On isole successivement les \(n-1\) classes mobiles (ou des groupes de classes) : on dispose de \(E_s = 6(n-1)\) équations scalaires pour les \(I_s\) inconnues de liaison. Commencer par les solides soumis à <strong>deux glisseurs</strong> (bielle à deux sphériques, vérin à deux rotules, masse négligée) : l'action est portée par la droite qui joint les deux centres.
  </div>

  <h3>Choisir les isolements et les équations</h3>
  <p>Le décompte \(E_s\) / \(I_s\) dit si le problème a une solution ; il ne dit pas par où commencer. Or on cherche rarement toutes les inconnues de liaison : le plus souvent, une seule grandeur intéresse (l'effort d'un vérin, le couple d'un moteur, la loi de mouvement de l'entrée). Tout l'art consiste à l'atteindre en écrivant le moins d'équations possible.</p>
  <div class="method-box">
    <strong>Méthode — atteindre une inconnue en peu d'équations</strong>
    <ol>
      <li><strong>Tracer le graphe de structure</strong> : le graphe des liaisons, complété par les actions extérieures (pesanteur, actionneurs, charge, ressorts), chacune rattachée à la classe qui la subit.</li>
      <li><strong>Repérer</strong> la grandeur cherchée, et les solides soumis à deux glisseurs (leur action n'a qu'une inconnue : son intensité).</li>
      <li><strong>Choisir l'isolement</strong> : un solide ou un groupe de solides dont la frontière coupe la liaison ou l'actionneur qui porte la grandeur cherchée, en coupant le moins possible d'autres liaisons. Les actions intérieures au groupe isolé disparaissent du bilan.</li>
      <li><strong>Choisir l'équation</strong> : la projection qui élimine les inconnues non cherchées — moment sur l'axe d'une pivot, résultante sur la direction d'une glissière, moment en un point par lequel passent plusieurs inconnues.</li>
      <li><strong>Choisir le principe</strong> (tableau ci-dessous), puis vérifier que les équations écrites sont aussi nombreuses que les inconnues qu'elles contiennent.</li>
    </ol>
  </div>
  <div style="overflow-x:auto;margin:.4rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Situation</th><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Outil</th><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Pourquoi</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">équilibre, ou accélérations négligeables devant les efforts appliqués</td><td style="padding:.35rem;border:1px solid var(--grid)">principe fondamental de la statique</td><td style="padding:.35rem;border:1px solid var(--grid)">6 équations par isolement (3 en plan), sans terme d'inertie</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">mouvement imposé, efforts cherchés (couple moteur, actions dans les paliers)</td><td style="padding:.35rem;border:1px solid var(--grid)">principe fondamental de la dynamique : théorèmes de la résultante et du moment dynamiques</td><td style="padding:.35rem;border:1px solid var(--grid)">les termes d'inertie se calculent à partir du mouvement connu</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">loi de mouvement cherchée, mécanisme à un seul paramètre, efforts de liaison non demandés</td><td style="padding:.35rem;border:1px solid var(--grid)">théorème de l'énergie cinétique appliqué à tout le mécanisme</td><td style="padding:.35rem;border:1px solid var(--grid)">une seule équation scalaire, d'où disparaissent les actions des liaisons parfaites</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">loi de mouvement et efforts de liaison</td><td style="padding:.35rem;border:1px solid var(--grid)">énergie cinétique pour l'équation du mouvement, puis principe fondamental de la dynamique solide par solide</td><td style="padding:.35rem;border:1px solid var(--grid)">chaque outil là où il est le plus court</td></tr>
  </table></div>
  <p>Le théorème de l'énergie cinétique n'apporte aucune information que le principe fondamental de la dynamique ne contienne déjà (il s'en déduit) : c'est une combinaison commode de ses équations, qui élimine d'un coup toutes les inconnues des liaisons parfaites. Le principe fondamental de la dynamique en 3D est traité dans le chapitre Cinétique et dynamique du solide (3D), §8 ; puissances, théorème de l'énergie cinétique et rendement le sont dans le chapitre Énergétique des systèmes de solides.</p>

  <div class="method-box">
    <strong>Exemple — effort dans le vérin d'une benne basculante</strong>
    <p>Une benne 1 est articulée sur le châssis 0 par une pivot d'axe \((O,\vec{z})\). Un vérin (corps 2, tige 3, en pivot glissant l'un dans l'autre) est relié au châssis par une rotule en \(A\) et à la benne par une rotule en \(B\). Benne chargée : 800 kg ; dans la position étudiée, son centre d'inertie est à 1,2 m de l'axe \((O,\vec{z})\), horizontalement, et la droite \(AB\) passe à 0,35 m de \(O\). Masse du vérin négligée, manœuvre lente.</p>
    <ol>
      <li>Graphe de structure : 0–1 pivot, 0–2 rotule, 2–3 pivot glissant, 3–1 rotule ; poids sur 1 ; l'effort moteur du vérin est intérieur à \(\{2, 3\}\). Quatre classes, quatre liaisons : \(\gamma = 1\).</li>
      <li>\(\{2, 3\}\) isolé (masse négligée, liaisons parfaites) n'est soumis qu'aux deux glisseurs des rotules : l'action du vérin sur la benne est portée par \(AB\), d'intensité \(F\) inconnue.</li>
      <li>On isole la benne 1 : six inconnues (cinq pour la pivot, plus \(F\)). Le moment en \(O\) projeté sur \(\vec{z}\) élimine d'un coup les cinq inconnues de la pivot.</li>
      <li>Manœuvre lente, donc statique : \(F \times 0{,}35 = 800 \times 9{,}81 \times 1{,}2\), soit \(F \approx 26{,}9\ \text{kN}\). Les autres équations ne serviraient qu'à dimensionner l'articulation en \(O\).</li>
    </ol>
    <p>Si la benne bascule avec une accélération angulaire \(\ddot\theta\), le même isolement et la même projection restent les bons ; le principe fondamental de la dynamique ajoute seulement \(J_O\,\ddot\theta\) au second membre (\(J_O\) : moment d'inertie de la benne chargée autour de l'axe). Avec \(J_O = 1\,500\ \text{kg·m}^2\) et \(\ddot\theta = 0{,}2\ \text{rad·s}^{-2}\), cela fait \(300\ \text{N·m}\), soit \(0{,}86\ \text{kN}\) de plus (3 %) : l'hypothèse statique était justifiée. Si c'est au contraire l'effort du vérin qui est connu et la loi \(\theta(t)\) qui est cherchée, on appliquera le théorème de l'énergie cinétique à l'ensemble \(\{1, 2, 3\}\).</p>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · LIAISONS ÉQUIVALENTES</div>
  <h2>Associer des liaisons en série ou en parallèle</h2>
  <div class="intro">Remplacer un groupe de liaisons par une liaison unique qui « fait la même chose » simplifie le schéma (schéma minimal) et révèle l'hyperstatisme local d'un guidage.</div>

  <h3>Liaisons en série (chaîne ouverte)</h3>
  <div class="def-box">
    Les classes \(0, 1, \dots, k\) sont reliées en chaîne par \(L_1, \dots, L_k\). La liaison équivalente entre \(0\) et \(k\) a pour torseur cinématique la somme des torseurs (tous au même point) :
    <div class="formula">$$\{\mathcal{V}_{\text{éq}}(k/0)\} = \sum_{i=1}^{k}\{\mathcal{V}(i/i-1)\}$$</div>
    Si les pièces intermédiaires ont une masse négligeable et ne reçoivent aucune autre action, chaque liaison transmet le même torseur d'actions :
    <div class="formula">$$\{\mathcal{T}_{\text{éq}}(0\to k)\} = \{\mathcal{T}(0\to 1)\} = \dots = \{\mathcal{T}(k-1\to k)\}$$</div>
  </div>
  <div class="prop-box">
    Bilan pour une chaîne ouverte : aucune boucle, donc aucune équation de compatibilité, et toutes les inconnues cinématiques restent libres : \(m = I_c = \sum n_{c,i}\). Celles qui déplacent une extrémité par rapport à l'autre forment les degrés de liberté de la liaison équivalente (\(m_u\)) ; le reste est interne (\(m_i = m - m_u\)). Et toujours \(h = 0\) : une chaîne ouverte est <strong>isostatique</strong>.
  </div>

  <h3>Liaisons en parallèle (une seule paire de classes)</h3>
  <div class="def-box">
    Les liaisons \(L_1, \dots, L_k\) relient toutes \(0\) et \(1\). Elles imposent chacune le même mouvement : \(\{\mathcal{V}_{\text{éq}}(1/0)\} = \{\mathcal{V}_{L_i}(1/0)\}\) pour tout \(i\). Les actions s'ajoutent (équilibre de 1, torseurs au même point) :
    <div class="formula">$$\{\mathcal{T}_{\text{éq}}(0\to 1)\} = \sum_{i=1}^{k}\{\mathcal{T}_{i}(0\to 1)\}$$</div>
  </div>
  <div class="prop-box">
    Avec \(I_s = \sum n_{s,i}\) inconnues et \(r_s\) le rang du système (6 équations au plus) : \(h = I_s - r_s\) et la liaison équivalente possède \(m = 6 - r_s\) degrés de liberté.
  </div>
  <p><strong>Choix de la méthode.</strong> En série, les mouvements se cumulent : on additionne des torseurs cinématiques. En parallèle, les efforts se partagent : on additionne des torseurs d'actions. Ainsi le système à résoudre ne dépasse jamais 6 équations scalaires, même pour un groupe de nombreuses liaisons. Reste à reconnaître la liaison obtenue : forme du torseur, mais aussi points où cette forme est valable.</p>

  <h3>Exemple : arbre guidé par deux paliers en A et B</h3>
  <p>L'arbre 1 tourne autour de \((A, \vec{x})\) par rapport au carter 0, avec \(\overrightarrow{AB} = d\,\vec{x}\). Selon le modèle retenu pour chaque palier :</p>
  <div style="overflow-x:auto;margin:.4rem 0"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <tr style="background:var(--paper-dark)"><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Palier A + palier B</th><th style="padding:.35rem;border:1px solid var(--grid)">\(I_s\)</th><th style="padding:.35rem;border:1px solid var(--grid)">Liaison équivalente</th><th style="padding:.35rem;border:1px solid var(--grid)">\(h\)</th><th style="padding:.35rem;border:1px solid var(--grid);text-align:left">Ce qui reste indéterminé</th></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">pivot + pivot (coaxiales)</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">10</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">5</td><td style="padding:.35rem;border:1px solid var(--grid)">répartition de tous les efforts entre A et B (axiaux, radiaux, moments)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">pivot glissant + pivot glissant</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">8</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot glissant</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">4</td><td style="padding:.35rem;border:1px solid var(--grid)">répartition des efforts radiaux et des moments ; arbre non arrêté axialement</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">sphérique + sphérique</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">6</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">1</td><td style="padding:.35rem;border:1px solid var(--grid)">partage de l'effort axial (\(X_A + X_B\) seul connu)</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">sphérique + pivot glissant</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">7</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">2</td><td style="padding:.35rem;border:1px solid var(--grid)">les moments en B, donc la répartition des efforts radiaux</td></tr>
    <tr><td style="padding:.35rem;border:1px solid var(--grid)">sphérique + linéaire annulaire</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">5</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">pivot</td><td style="padding:.35rem;border:1px solid var(--grid);text-align:center">0</td><td style="padding:.35rem;border:1px solid var(--grid)">rien : tout se calcule par le PFS</td></tr>
  </table></div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Démontrer que « sphérique de centre A + linéaire annulaire de centre B, direction x » équivaut à une pivot isostatique.</span>
    <div class="content">
      <p>\(\{\mathcal{T}_A\} = \{X_A\vec{x} + Y_A\vec{y} + Z_A\vec{z} \;;\; \vec{0}\}_A\) et \(\{\mathcal{T}_B\} = \{Y_B\vec{y} + Z_B\vec{z} \;;\; \vec{0}\}_B\). Transport en A : \(\overrightarrow{AB}\wedge(Y_B\vec{y} + Z_B\vec{z}) = d\,Y_B\,\vec{z} - d\,Z_B\,\vec{y}\). Somme en A :</p>
      <div class="formula">$$\{\mathcal{T}_{\text{éq}}\} = \begin{Bmatrix} X_A & 0 \\ Y_A + Y_B & -d\,Z_B \\ Z_A + Z_B & d\,Y_B \end{Bmatrix}_{A,\,(\vec{x},\vec{y},\vec{z})}$$</div>
      <p>Cinq composantes indépendantes, moment nul selon \(\vec{x}\) : c'est une pivot d'axe \((A, \vec{x})\). Les 5 inconnues se déduisent des 5 composantes : \(r_s = 5 = I_s\), donc \(h = 0\). C'est le modèle usuel d'une paire de roulements à billes, l'un arrêté axialement (sphérique), l'autre libre (linéaire annulaire).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · MOBILITÉ ET HYPERSTATISME</div>
  <h2>Compter les mouvements possibles et les contraintes surabondantes</h2>
  <div class="intro">Deux nombres caractérisent l'architecture d'un mécanisme : combien de mouvements indépendants il possède (mobilité), et combien de conditions de montage surabondantes il impose (hyperstatisme).</div>

  <div class="def-box">
    <strong>Degré de mobilité</strong> \(m\) : nombre de paramètres cinématiques indépendants qu'il faut se donner pour connaître tous les autres. On écrit \(m = m_u + m_i\) :
    <ul style="margin:.4rem 0">
      <li>\(m_u\), <strong>mobilités utiles</strong> : mouvements qui intéressent la fonction (loi entrée-sortie) ; il correspond le plus souvent au nombre d'actionneurs à prévoir ;</li>
      <li>\(m_i\), <strong>mobilités internes</strong> : mouvements d'une pièce ou d'un groupe de pièces qui laissent l'entrée et la sortie immobiles (rotation propre d'une bielle à deux sphériques, d'un galet, d'un vérin autour de son axe).</li>
    </ul>
  </div>
  <div class="def-box">
    <strong>Degré d'hyperstatisme</strong> \(h\) : nombre d'inconnues de liaison qui restent indéterminées lorsqu'on n'utilise que le PFS (ou le PFD), faute d'équations indépendantes en nombre suffisant. C'est aussi le nombre de <strong>conditions géométriques</strong> à respecter pour pouvoir assembler le mécanisme sans forcer. \(h = 0\) : mécanisme <strong>isostatique</strong>.
  </div>

  <h3>Approche cinématique</h3>
  <p>On écrit les \(\gamma\) fermetures cinématiques avec les \(I_c = \sum n_c\) inconnues cinématiques des liaisons : \(E_c = 6\gamma\) équations, de rang \(r_c\).</p>
  <div class="formula">$$m = I_c - r_c \qquad h = E_c - r_c = 6\gamma - r_c \qquad\Longrightarrow\qquad h = m - I_c + 6\gamma$$</div>
  <p>\(m\) compte les inconnues qui restent libres (à imposer) ; \(h\) compte les équations surabondantes, en particulier les lignes qui se réduisent à « 0 = 0 ».</p>

  <h3>Approche statique</h3>
  <p>On isole les \(n-1\) classes mobiles : \(E_s = 6(n-1)\) équations pour \(I_s = \sum n_s\) inconnues de liaison, de rang \(r_s\).</p>
  <div class="formula">$$h = I_s - r_s \qquad m = E_s - r_s = 6(n-1) - r_s \qquad\Longrightarrow\qquad h = m + I_s - 6(n-1)$$</div>
  <p>Après élimination des inconnues de liaison, il reste \(m\) relations qui ne portent que sur les <strong>actions extérieures</strong> (couple moteur et couple résistant, par exemple) : chaque mobilité « consomme » une équation.</p>
  <div class="prop-box">
    <strong>Cohérence des deux approches.</strong> Chaque liaison vérifie \(n_c + n_s = 6\), donc \(I_c + I_s = 6\,n_L\), et :
    <div class="formula">$$m + I_s - 6(n-1) = m - I_c + 6(n_L - n + 1) = m - I_c + 6\gamma$$</div>
    Comme \(r_c \leq 6\gamma\), on a toujours \(h \geq 0\) : un calcul qui donne \(h \lt 0\) signale une mobilité oubliée.
  </div>
  <p>Notation : on trouve aussi \(N_c\), \(N_s\) à la place de \(I_c\), \(I_s\). Calculer un rang à la main est long et source d'erreurs : on obtient d'abord \(m\) par l'observation du mécanisme (bloquer l'entrée, puis chercher ce qui bouge encore), on calcule \(h\) par la formule la plus commode, et l'on ne revient au système complet qu'en cas de doute ou pour localiser les conditions géométriques.</p>

  <h3>Version plane</h3>
  <p>Si toutes les liaisons sont modélisées dans un plan (rotations autour de \(\vec{z}\), translations dans le plan), chaque cycle ne donne que 3 équations et chaque liaison vérifie \(n_c + n_s = 3\) (pivot d'axe \(\vec{z}\) : 1 + 2 ; glissière : 1 + 2 ; contact ponctuel : 2 + 1).</p>
  <div class="formula">$$h_{\text{plan}} = m - I_c + 3\gamma = m + I_s - 3(n-1)$$</div>
  <div class="notice"><strong>Attention.</strong> Le modèle plan ignore toutes les contraintes hors du plan (parallélisme des axes, positions selon \(\vec{z}\)) : \(h_{\text{plan}} \leq h_{3D}\). Un mécanisme isostatique en plan est souvent hyperstatique en 3D.</div>

  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Application</span>
    <span class="prompt">Bielle-manivelle à trois pivots d'axe z₀ et une glissière : h en 3D et en plan ?</span>
    <div class="content"><p>\(n = 4\), \(n_L = 4\), \(\gamma = 1\), \(m = m_u = 1\) (le piston ne bouge pas si la manivelle est bloquée) et \(I_c = 4\). En 3D : \(h = 1 - 4 + 6 = 3\). En plan : \(h = 1 - 4 + 3 = 0\). Les trois contraintes manquantes du modèle plan sont hors plan : deux rotations (autour de \(\vec{x}_0\) et \(\vec{y}_0\)) et une translation (selon \(\vec{z}_0\)).</p></div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · CONSÉQUENCES DE L'HYPERSTATISME</div>
  <h2>Conditions géométriques, avantages et inconvénients</h2>
  <div class="intro">Un mécanisme hyperstatique ne s'assemble et ne fonctionne sans efforts parasites que si certaines dimensions ou orientations sont réalisées exactement. Concevoir, c'est choisir en connaissance de cause.</div>

  <h3>Lire les conditions géométriques</h3>
  <div class="prop-box">
    Dans la fermeture cinématique d'un cycle, une équation qui se réduit à <strong>0 = 0</strong> correspond à un mouvement qu'aucune liaison du cycle n'autorise : pour que le cycle se ferme, le défaut correspondant doit être nul à la fabrication.
    <ul style="margin:.4rem 0">
      <li>équation de <strong>rotation</strong> « 0 = 0 » → condition <strong>angulaire</strong> (parallélisme, perpendicularité) ;</li>
      <li>équation de <strong>translation</strong> « 0 = 0 » → condition <strong>dimensionnelle</strong> (position, distance).</li>
    </ul>
    Côté statique : une inconnue hyperstatique de type moment correspond à une condition angulaire, une inconnue de type force à une condition de position.
  </div>
  <p><strong>Exemple : bielle-manivelle.</strong> Inconnues de liaison : \(\omega_{10}\), \(\omega_{21}\), \(\omega_{32}\) (pivots d'axe \(\vec{z}_0\)) et \(u_{03}\) (glissière). Fermeture au point B, avec \(\vec{V}(B,1/0) = x\,\omega_{10}\,\vec{y}_0\) et \(\vec{V}(B,2/1) = L\,\omega_{21}\,\vec{y}_2\), projetée dans la base 0 :</p>
  <div class="formula">$$\begin{cases} R_x : & 0 = 0 \\ R_y : & 0 = 0 \\ R_z : & \omega_{10} + \omega_{21} + \omega_{32} = 0 \\ T_x : & u_{03} - L\,\omega_{21}\sin\beta = 0 \\ T_y : & x\,\omega_{10} + L\,\omega_{21}\cos\beta = 0 \\ T_z : & 0 = 0 \end{cases}$$</div>
  <p>\(r_c = 3\) : \(m = 4 - 3 = 1\) et \(h = 6 - 3 = 3\). Les lignes \(R_x\) et \(R_y\) réduites à « 0 = 0 » signifient qu'aucune liaison du cycle ne peut absorber un basculement autour de \(\vec{x}_0\) ou de \(\vec{y}_0\) : les défauts d'orientation de toutes les pièces du cycle doivent se compenser exactement, c'est-à-dire que les axes des trois pivots doivent être <strong>parallèles</strong> (deux conditions angulaires). La ligne \(T_z\) dit la même chose pour un décalage selon \(\vec{z}_0\) : les plans médians des liaisons doivent tomber à des cotes compatibles (une condition de position). Chaque pièce porte sa part de ces exigences : deux alésages parallèles pour la manivelle comme pour la bielle ; pour le bâti et pour le piston, l'orientation de l'alésage (en O ou en B) par rapport aux surfaces de la glissière, qui doit être la même sur les deux pièces. La cotation les transforme ensuite en tolérances de parallélisme, d'orientation et de localisation.</p>

  <h3>Avantages et inconvénients</h3>
  <div class="def-box">
    <strong>Ce que l'hyperstatisme apporte</strong> : rigidité accrue (plusieurs zones d'appui), meilleure répartition des charges (pressions de contact plus faibles), guidage plus précis, redondance en cas de défaillance d'un appui.
  </div>
  <div class="def-box">
    <strong>Ce qu'il coûte</strong> : tolérances géométriques serrées, donc usinage et contrôle plus chers ; montage délicat (appairage, réglage, alésage « en ligne ») ; si les conditions ne sont pas tenues, efforts internes de montage non maîtrisés, usure, échauffement, voire grippage ; sensibilité aux dilatations et aux déformations du bâti ; inconnues hyperstatiques incalculables par le seul PFS (il faut un modèle de déformation, voir la résistance des matériaux).
  </div>

  <h3>Ordres de grandeur</h3>
  <p><strong>Dilatation.</strong> Arbre en acier de longueur \(L = 300\ \text{mm}\), \(\alpha \approx 12\cdot10^{-6}\ \text{K}^{-1}\), échauffement \(\Delta T = 40\ \text{K}\). Si les deux paliers arrêtaient l'arbre axialement (appuis supposés rigides), la dilatation empêchée créerait une contrainte de compression :</p>
  <div class="formula">$$\Delta L = \alpha L\,\Delta T \approx 0{,}14\ \text{mm} \qquad \sigma = E\,\alpha\,\Delta T \approx 210\cdot10^{9}\times 12\cdot10^{-6}\times 40 \approx 100\ \text{MPa}$$</div>
  <p>soit environ 70 kN sur un arbre de diamètre 30 mm : d'où la règle « un seul palier arrête l'arbre axialement&nbsp;».</p>
  <p><strong>Désalignement admissible.</strong> Un roulement rigide à billes tolère quelques minutes d'angle (de l'ordre de \(10^{-3}\ \text{rad}\)), un roulement à rotule de l'ordre de 2 à 3° ; un palier lisse long (longueur supérieure à environ 1,5 fois le diamètre) presque rien. D'où les modèles usuels : palier lisse long → pivot glissant, palier lisse court ou roulement à billes → linéaire annulaire ou sphérique selon l'arrêt axial.</p>
</div>

<div class="course-section">
  <div class="sec-num">§7 · RENDRE UN MÉCANISME ISOSTATIQUE</div>
  <h2>Libérer les bons degrés de liberté</h2>
  <div class="intro">Objectif : faire disparaître les exigences de fabrication surabondantes en donnant un peu plus de liberté à certaines liaisons, sans toucher à ce pour quoi le mécanisme existe, c'est-à-dire ses mobilités utiles et sa loi entrée-sortie.</div>

  <div class="prop-box">
    <strong>Démarche.</strong>
    <ol style="margin:.4rem 0">
      <li>Localiser l'hyperstatisme : lignes « 0 = 0 » de la fermeture cinématique, inconnues indéterminées de l'approche statique, ou raisonnement local sur un guidage en parallèle.</li>
      <li>Choisir la ou les liaisons à modifier, plutôt parmi les liaisons intermédiaires : assouplir la liaison de l'actionneur ou celle de l'organe de sortie dégraderait justement le guidage que le mécanisme doit garantir.</li>
      <li>Libérer exactement les degrés de liberté correspondants, soit en changeant de liaison (pivot → sphérique : 2 rotations ; pivot → linéaire annulaire : 2 rotations et 1 translation ; glissière → pivot glissant : 1 rotation ; appui plan → contact linéique ou ponctuel…), soit en intercalant une pièce supplémentaire, qui crée des liaisons en série (biellette, accouplement, rotule intermédiaire).</li>
      <li>Recompter \(m\) et \(h\), et vérifier que \(m_u\) n'a pas changé.</li>
    </ol>
  </div>

  <h3>Exemple : bielle-manivelle</h3>
  <p>Les lignes « 0 = 0 » demandent de libérer \(R_x\), \(R_y\) et \(T_z\). Une solution : liaison <strong>pivot glissant</strong> d'axe \((A, \vec{z}_0)\) entre manivelle et bielle (libère \(T_z\)) et liaison <strong>sphérique</strong> de centre B entre bielle et piston (libère \(R_x\), \(R_y\)).</p>
  <div class="formula">$$I_c = 1 + 2 + 3 + 1 = 7 \qquad m = 1 \qquad h = 1 - 7 + 6 = 0$$</div>
  <p>Aucune mobilité interne n'apparaît : manivelle bloquée, B est fixé (piston immobile) et la bielle, tenue en A par la pivot glissant, ne peut ni tourner autour de \((A, \vec{z}_0)\) ni coulisser selon \(\vec{z}_0\) sans déplacer B. D'autres répartitions conviennent : les trois libertés peuvent être portées par une seule liaison ou réparties autrement. Si l'on en libère davantage, il faut vérifier que le surplus ne crée qu'une mobilité interne, sans effet sur la loi entrée-sortie, et contrôler à nouveau \(h\) avec ce nouveau \(m\).</p>
  <div class="notice"><strong>Piège.</strong> Un mécanisme peut devenir isostatique… et inutilisable : si les libertés ajoutées permettent à la sortie de bouger alors que l'entrée est bloquée, on a créé une mobilité utile parasite. Recompter \(m_u\) après chaque modification.</div>

  <h3>Autres moyens, sans changer de liaison</h3>
  <ul>
    <li><strong>Usinage en reprise</strong> : aléser les deux paliers d'un carter dans la même prise de pièce, ce qui garantit leur coaxialité sans tolérance sévère sur chacun.</li>
    <li><strong>Ajustement au montage</strong> : cales pelables, bagues excentriques, vis de positionnement, appairage de pièces mesurées.</li>
    <li><strong>Souplesse locale</strong> : silentblocs, accouplements élastiques, supports en élastomère, qui acceptent un petit défaut au prix d'un effort modéré.</li>
    <li><strong>Jeu fonctionnel</strong> : une liaison montée avec un jeu suffisant se comporte en réalité comme une liaison plus libre que son modèle nominal.</li>
  </ul>

  <h3>Exemple : vérin articulé</h3>
  <p>Un vérin (corps et tige en pivot glissant) relié à ses supports par deux <strong>embouts à rotule</strong> forme une chaîne série sphérique + pivot glissant + sphérique : \(I_c = 8\), avec \(m_i = 2\) (corps et tige peuvent tourner autour de leur axe). La liaison équivalente entre les deux supports n'impose rien (6 degrés de liberté : la longueur est pilotée par l'actionneur, pas par une liaison). Le vérin n'ajoute donc <strong>aucun hyperstatisme</strong> au mécanisme qu'il manœuvre et, masse et frottements négligés, il n'exerce qu'un effort porté par la droite des deux centres. Monté sur deux chapes pivots, il imposerait au contraire des conditions de parallélisme entre ses axes d'articulation et ceux du mécanisme.</p>
  <div class="notice"><strong>L'isostatisme n'est pas un dogme.</strong> Glissières de machines-outils, longs arbres sur plusieurs paliers, structures de bâtiment sont volontairement hyperstatiques pour leur rigidité : on paie alors la précision de fabrication, ou on prévoit des réglages.</div>
</div>

<template class="pan-tpl" data-panneau="chs-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · CHAÎNES DE SOLIDES</div>
  <h2>Savoir-faire pour les écrits et les oraux</h2>
  <div class="intro">Ces méthodes suivent l'ordre du cours : modèle et graphe (§1), fermetures géométrique et cinématique (§2, §3), démarche d'isolement pour une action inconnue ou une loi de mouvement (§3), liaisons équivalentes (§4), mobilité et hyperstatisme (§5 à §7).</div>

  <div class="method-box">
    <strong>Méthode 1 — Construire le graphe des liaisons et compter</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Classes.</span> Colorier le dessin d'ensemble pièce par pièce ; regrouper ce qui est immobile l'un par rapport à l'autre ; écarter billes, rouleaux, ressorts et joints.</li>
      <li><span class="step">Liaisons.</span> Pour chaque paire de classes en contact, identifier les surfaces (cylindre long ou court, plan, sphère…) et en déduire la liaison avec ses caractéristiques (centre, axe, normale).</li>
      <li><span class="step">Graphe.</span> Un sommet par classe, un arc par liaison, légendé. Compter \(n\) (bâti compris), \(n_L\), puis \(\gamma = n_L - n + 1\).</li>
      <li><span class="step">Cycles.</span> Choisir \(\gamma\) cycles indépendants : chaque nouveau cycle doit contenir au moins une liaison non encore utilisée.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Piège :</em> deux roulements entre les mêmes classes font deux arcs (liaisons en parallèle), à conserver dans le schéma d'architecture.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Établir une loi entrée-sortie par fermeture géométrique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Paramétrer.</span> Un repère par classe, une figure de changement de base par rotation, les longueurs constantes et variables.</li>
      <li><span class="step">Fermer.</span> Écrire la chaîne de vecteurs du cycle (somme nulle) et, si besoin, la relation angulaire.</li>
      <li><span class="step">Projeter.</span> Dans la base où les vecteurs ont le moins de composantes (souvent celle du bâti).</li>
      <li><span class="step">Éliminer.</span> Supprimer les paramètres de liaison inutiles : isoler \(L\cos\beta\) et \(L\sin\beta\) puis sommer les carrés, ou former un quotient pour obtenir \(\tan\beta\).</li>
      <li><span class="step">Contrôler.</span> Vérifier la loi sur une position particulière (alignement, angle nul) et choisir la bonne racine.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Écrire et exploiter une fermeture cinématique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Torseurs.</span> Écrire le torseur cinématique de chaque liaison du cycle avec ses inconnues (\(p, q, r, u, v, w\) non nulles), au point où sa forme est simple.</li>
      <li><span class="step">Point commun.</span> Transporter tous les torseurs au même point : \(\vec{V}(B) = \vec{V}(A) + \overrightarrow{BA}\wedge\vec{\Omega}\).</li>
      <li><span class="step">Projection.</span> 6 équations scalaires par cycle (3 en plan), dans une seule base.</li>
      <li><span class="step">Exploitation.</span> Résoudre pour la loi en vitesse ; compter le rang \(r_c\) ; repérer les lignes « 0 = 0 ».</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Raccourci :</em> si la loi géométrique est déjà établie, la dériver par rapport au temps donne la loi en vitesse plus vite ; la fermeture écrite avec les inconnues de liaison reste l'outil du dénombrement (rang, \(m\), \(h\)).</p>
    <p style="margin:.3rem 0 0"><em>Piège :</em> additionner des torseurs écrits en des points différents, ou projeter un même vecteur dans deux bases sans le dire.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Choisir les isolements et les équations pour atteindre une inconnue</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Graphe de structure.</span> Graphe des liaisons complété par les actions extérieures (pesanteur, actionneurs, charge, ressorts), chacune rattachée à la classe qui la subit. Repérer la grandeur cherchée : un effort, un couple, ou la loi de mouvement de l'entrée.</li>
      <li><span class="step">Deux glisseurs.</span> Isoler d'abord les solides de masse négligée soumis à deux actions seulement (bielle ou vérin à deux rotules) : l'action est portée par la droite des deux centres, il ne reste que son intensité.</li>
      <li><span class="step">Isolement.</span> Choisir le solide (ou le groupe) dont la frontière coupe la liaison ou l'actionneur qui porte l'inconnue, en coupant le moins possible d'autres liaisons.</li>
      <li><span class="step">Équation.</span> La projection qui élimine les inconnues non cherchées : moment sur l'axe d'une pivot, résultante selon la direction d'une glissière, moment en un point où passent plusieurs inconnues.</li>
      <li><span class="step">Principe.</span> Statique si les termes d'inertie sont négligeables ; dynamique si le mouvement est imposé et qu'on cherche un effort ; théorème de l'énergie cinétique sur tout le mécanisme si l'on cherche la loi de mouvement d'un système à un paramètre sans les efforts de liaison.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Exemple éclair :</em> une pédale articulée en \(O\) reçoit un effort de 300 N à 0,25 m de \(O\) ; la tige du maître-cylindre (deux rotules, masse négligée) passe à 0,05 m de \(O\). On isole la tige (deux glisseurs : effort selon son axe), puis la pédale, et l'on écrit le moment en \(O\) sur l'axe de la pivot : \(F \times 0{,}05 = 300 \times 0{,}25\), soit \(F = 1\,500\ \text{N}\), sans calculer aucune inconnue de la pivot.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 5 — Déterminer une liaison équivalente</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Série ?</span> Sommer les torseurs cinématiques au même point. Le nombre de paramètres indépendants dans le torseur obtenu donne les degrés de liberté de la liaison équivalente ; l'excédent (\(I_c\) moins ce nombre) donne \(m_i\).</li>
      <li><span class="step">Parallèle ?</span> Sommer les torseurs d'actions transmissibles au même point. Le nombre de composantes indépendantes donne \(r_s\) ; alors \(h = I_s - r_s\) et la liaison a \(6 - r_s\) degrés de liberté.</li>
      <li><span class="step">Identifier.</span> Comparer la forme obtenue (composantes nulles, point et base de validité) à celle des liaisons normalisées.</li>
    </ol>
    <p style="margin:.3rem 0 0"><em>Piège :</em> le résultat dépend de la géométrie (centre de sphérique sur l'axe ou non, axes concourants ou non) : ne jamais conclure sans faire le transport.</p>
  </div>

  <div class="method-box">
    <strong>Méthode 6 — Calculer m et h rapidement</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Recenser.</span> Liste des liaisons avec \(n_c\) (ou \(n_s\)), puis \(I_c\) (ou \(I_s\)), \(n\), \(n_L\), \(\gamma\).</li>
      <li><span class="step">Observer m.</span> \(m_u\) : combien de mouvements indépendants faut-il piloter ? \(m_i\) : bloquer l'entrée (et la sortie), puis chercher quelles pièces peuvent encore bouger (rotation propre d'une bielle à deux sphériques, d'un galet, d'un vérin à deux rotules).</li>
      <li><span class="step">Calculer h.</span> \(h = m - I_c + 6\gamma\) ou \(h = m + I_s - 6(n-1)\) (en plan : 3 au lieu de 6).</li>
      <li><span class="step">Vérifier.</span> \(h \geq 0\) obligatoirement ; recouper par l'autre approche en cas de doute.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 7 — Trouver les conditions géométriques et rendre isostatique</strong>
    <ol style="margin-top:.4rem">
      <li><span class="step">Localiser.</span> Lignes « 0 = 0 » de la fermeture cinématique (rotation → condition angulaire, translation → condition de position), ou inconnues qui n'apparaissent que par des sommes dans l'approche statique.</li>
      <li><span class="step">Répartir.</span> Dire quelles surfaces de quelles pièces sont concernées par chaque condition (deux alésages à rendre parallèles ou coaxiaux, un alésage perpendiculaire à une surface de guidage, une cote entre épaulements) : ce sont elles qui recevront une tolérance.</li>
      <li><span class="step">Libérer.</span> Modifier une liaison qui ne porte ni l'entrée ni la sortie pour libérer exactement ces mouvements (sphérique, linéaire annulaire, pivot glissant, pièce intermédiaire).</li>
      <li><span class="step">Recompter.</span> \(I_c\), \(m\), \(h\) ; vérifier que \(m_u\) est inchangé et que la fonction est conservée.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:.4rem">
      <li>Oublier le bâti dans \(n\), ou compter deux fois une liaison dans le graphe.</li>
      <li>Calculer \(h\) avec un modèle plan et conclure pour le mécanisme réel : \(h_{\text{plan}}\) ne voit pas les conditions hors plan.</li>
      <li>Oublier une mobilité interne : on trouve alors \(h\) trop petit, voire négatif.</li>
      <li>Confondre conditions géométriques et défauts admissibles : un jeu ou une pièce souple peuvent rendre un modèle hyperstatique acceptable en pratique.</li>
      <li>Penser qu'une chaîne ouverte peut être hyperstatique : en série, \(h = 0\) toujours.</li>
      <li>Chercher une loi de mouvement en isolant les solides un par un : le théorème de l'énergie cinétique appliqué à tout le mécanisme donne directement l'équation, sans inconnue de liaison (il ne contient rien de plus que le principe fondamental de la dynamique, mais il en élimine d'un coup les inconnues des liaisons parfaites).</li>
    </ul>
  </div>
</div>
