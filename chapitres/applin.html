<template class="pan-tpl" data-panneau="lin-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · APPLICATIONS LINÉAIRES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes couvrent les savoir-faire exigibles du chapitre : prouver une linéarité, calculer noyau, image et rang, conclure sur l'injectivité ou la bijectivité grâce au théorème du rang, construire une application par l'image d'une base, résoudre une équation linéaire, reconnaître et écrire projecteurs et symétries. Les notations sont celles du cours (\(\ker u\), \(\operatorname{Im} u\), \(\operatorname{rg} u\)).</div>

  <div class="method-box"><strong>Méthode 1 — Montrer qu'une application est linéaire, ou qu'elle ne l'est pas</strong>
    <ol>
      <li>Vérifier que \(u\) va bien de \(E\) dans \(F\) (pour un endomorphisme : l'image reste dans \(E\), par exemple le degré ne dépasse pas \(n\) dans \(\mathbb{K}_n[X]\)).</li>
      <li>Prendre \(x, y \in E\), \(\lambda, \mu \in \mathbb{K}\), calculer \(u(\lambda x + \mu y)\) avec la définition de \(u\) et faire apparaître \(\lambda u(x) + \mu u(y)\).</li>
      <li>Pour réfuter : un seul contre-exemple numérique suffit. Tester d'abord \(u(0) = 0\), puis \(u(2x) = 2u(x)\) ou \(u(-x) = -u(x)\) sur un vecteur simple.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u(P) = XP' - P\) sur \(\mathbb{R}_n[X]\) : \(u(\lambda P + \mu Q) = X(\lambda P' + \mu Q') - \lambda P - \mu Q = \lambda u(P) + \mu u(Q)\), et \(\deg u(P) \leq n\) : endomorphisme. En revanche \(v(x, y) = (x, |y|)\) vérifie \(v(0, -1) = (0, 1) \neq -v(0, 1)\) : non linéaire.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : \(u(0) = 0\) est nécessaire, pas suffisant. L'application \(v\) ci-dessus envoie bien \(0\) sur \(0\).</div>

  <div class="method-box"><strong>Méthode 2 — Déterminer le noyau</strong>
    <ol>
      <li>Écrire l'équation \(u(x) = 0\) en coordonnées : c'est un système linéaire homogène.</li>
      <li>Le résoudre (pivot de Gauss), exprimer les inconnues principales en fonction des inconnues libres.</li>
      <li>Écrire la solution générale comme combinaison \(t_1 v_1 + \cdots + t_k v_k\) : alors \(\ker u = \operatorname{Vect}(v_1, \ldots, v_k)\), et les \(v_i\) ainsi obtenus forment une base (chacun a un 1 à la place d'une inconnue libre où les autres ont 0).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u(x, y, z) = (x - y,\ y - z,\ z - x)\) : \(u(x, y, z) = 0 \iff x = y = z\), donc \(\ker u = \operatorname{Vect}\big((1, 1, 1)\big)\) et \(u\) n'est pas injective.</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Déterminer l'image</strong>
    <ol>
      <li>Calculer les images des vecteurs d'une base de départ (souvent la base canonique) : elles engendrent \(\operatorname{Im} u\).</li>
      <li>Éliminer celles qui sont combinaisons des autres ; chaque vecteur du noyau donne une telle relation (§3 du cours).</li>
      <li>Contrôler par le théorème du rang : le nombre de vecteurs restants doit valoir \(\dim E - \dim \ker u\). Si demandé, trouver des équations de l'image (relation satisfaite par toutes les colonnes).</li>
    </ol>
    <p><em>Exemple éclair :</em> pour \(u\) de la méthode 2, \(u(e_1) = (1, 0, -1)\), \(u(e_2) = (-1, 1, 0)\), \(u(e_3) = (0, -1, 1)\), de somme nulle (car \((1, 1, 1) \in \ker u\)). Rang 2 ; chaque image a des coordonnées de somme nulle, donc \(\operatorname{Im} u\) est le plan \(x + y + z = 0\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'image est engendrée par les images des vecteurs d'une base, pas par les vecteurs de la base eux-mêmes ; et le noyau se cherche au départ, l'image à l'arrivée.</div>

  <div class="method-box"><strong>Méthode 4 — Calculer un rang (famille, application, composée)</strong>
    <ol>
      <li>Rang d'une famille : chercher les relations évidentes (vecteur nul, colinéarité, somme), sinon échelonner les coordonnées ; le rang est le nombre de vecteurs indépendants restants.</li>
      <li>Rang d'une application : \(\operatorname{rg} u = \operatorname{rg}\big(u(e_1), \ldots, u(e_p)\big)\), ou \(\dim E - \dim \ker u\).</li>
      <li>Composée : \(\operatorname{rg}(v \circ u) \leq \min(\operatorname{rg} u, \operatorname{rg} v)\), avec égalité au rang de l'autre quand l'une est un isomorphisme.</li>
    </ol>
    <p><em>Exemple éclair :</em> \((1, 1, 0), (0, 1, 1), (1, 0, -1)\) : le troisième est la différence des deux premiers, rang 2. Si \(u \in \mathcal{L}(\mathbb{R}^3, \mathbb{R}^2)\) et \(v \in \mathcal{L}(\mathbb{R}^2, \mathbb{R}^4)\), alors \(\operatorname{rg}(v \circ u) \leq 2\) sans aucun calcul.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Conclure sur l'injectivité, la surjectivité, la bijectivité</strong>
    <ol>
      <li>Injectivité : montrer \(\ker u = \{0\}\) (résoudre \(u(x) = 0\)).</li>
      <li>Surjectivité : montrer \(\operatorname{Im} u = F\), ou \(\operatorname{rg} u = \dim F\).</li>
      <li>Si \(\dim E = \dim F\) est finie, une seule des trois propriétés suffit : on prouve presque toujours l'injectivité, la plus facile, et le théorème du rang donne le reste.</li>
      <li>Si \(\dim E \neq \dim F\) : \(\dim E \gt \dim F\) interdit l'injectivité, \(\dim E \lt \dim F\) interdit la surjectivité.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u : \mathbb{R}_2[X] \to \mathbb{R}^3\), \(P \mapsto \big(P(0), P'(0), P(1)\big)\). Si \(u(P) = 0\) : \(P = cX^2\), puis \(P(1) = c = 0\). Injective entre espaces de dimension 3 : bijective.</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'équivalence « injective ⟺ surjective » exige des espaces de même dimension <em>finie</em>. La dérivation de \(\mathbb{R}[X]\) est surjective et non injective.</div>

  <div class="method-box"><strong>Méthode 6 — Définir ou identifier une application linéaire par l'image d'une base</strong>
    <ol>
      <li>Vérifier que la famille dont on impose les images est une base (sinon, contrôler la compatibilité des conditions par linéarité).</li>
      <li>Décomposer un vecteur quelconque \(x\) dans cette base : \(x = \sum x_j e_j\).</li>
      <li>Écrire \(u(x) = \sum x_j\,u(e_j)\) et simplifier ; contrôler sur les vecteurs donnés.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u(1, 1) = (2, 0)\), \(u(0, 1) = (1, 1)\). Comme \((x, y) = x(1, 1) + (y - x)(0, 1)\), \(u(x, y) = x(2, 0) + (y - x)(1, 1) = (x + y,\ y - x)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Résoudre une équation linéaire \(u(x) = a\)</strong>
    <ol>
      <li>Reconnaître la structure : identifier l'application linéaire \(u\) (système, \(y \mapsto y' + ay\), \((u_n) \mapsto (u_{n+1} - q u_n)\), opérateur sur des polynômes…).</li>
      <li>Déterminer \(\ker u\) (solutions de l'équation homogène).</li>
      <li>Trouver une solution particulière \(x_0\) (constante, polynôme de même forme que le second membre, ou résolution directe) ; s'il n'y en a pas, prouver \(a \notin \operatorname{Im} u\).</li>
      <li>Conclure : solutions \(= x_0 + \ker u\), puis utiliser les conditions initiales.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(u_{n+1} = -u_n + 4\) : la constante 2 est solution, le noyau est formé des suites \(\big(\lambda(-1)^n\big)\), donc \(u_n = 2 + \lambda(-1)^n\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'ensemble des solutions n'est pas un sous-espace quand \(a \neq 0\) ; on n'additionne pas deux solutions, on leur ajoute un élément du noyau.</div>

  <div class="method-box"><strong>Méthode 8 — Reconnaître un projecteur et trouver ses éléments</strong>
    <ol>
      <li>Calculer \(p \circ p\) (ou \(A^2\)) et vérifier que l'on retrouve \(p\) (ou \(A\)).</li>
      <li>\(F = \operatorname{Im} p = \ker(p - \mathrm{id})\) : résoudre \(p(x) = x\), ou extraire une base des colonnes.</li>
      <li>\(G = \ker p\) : résoudre \(p(x) = 0\).</li>
      <li>Conclure : « \(p\) est la projection sur \(F\) parallèlement à \(G\) », et contrôler \(\dim F + \dim G = \dim E\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(A = \begin{pmatrix} 1 & 0 \\ 1 & 0 \end{pmatrix}\) vérifie \(A^2 = A\) ; \(A(x, y) = (x, x)\), donc \(\operatorname{Im} p = \operatorname{Vect}\big((1, 1)\big)\) et \(\ker p = \operatorname{Vect}\big((0, 1)\big)\) : projection sur la première bissectrice parallèlement à l'axe des ordonnées.</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Reconnaître une symétrie et trouver ses éléments</strong>
    <ol>
      <li>Calculer \(s \circ s\) (ou \(S^2\)) et vérifier que l'on obtient \(\mathrm{id}\) (ou \(I_n\)).</li>
      <li>\(F = \ker(s - \mathrm{id})\) (vecteurs invariants), \(G = \ker(s + \mathrm{id})\) (vecteurs changés en leur opposé).</li>
      <li>Conclure : « \(s\) est la symétrie par rapport à \(F\) parallèlement à \(G\) » ; la projection associée est \(p = \frac{1}{2}(s + \mathrm{id})\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(S = \begin{pmatrix} 1 & 0 \\ 2 & -1 \end{pmatrix}\), \(S^2 = I_2\). \(S - I_2\) donne \(x = y\) : \(F = \operatorname{Vect}\big((1, 1)\big)\) ; \(S + I_2\) donne \(x = 0\) : \(G = \operatorname{Vect}\big((0, 1)\big)\). Et \(\frac{1}{2}(S + I_2)\) est la matrice \(A\) de la méthode 8.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Écrire la matrice d'une projection ou d'une symétrie donnée géométriquement</strong>
    <ol>
      <li>Vérifier que \(E = F \oplus G\) (dans \(\mathbb{R}^3\), pour un plan \(F : \varphi(x) = 0\) et une droite \(G = \operatorname{Vect}(a)\) : \(\varphi(a) \neq 0\)).</li>
      <li>Décomposer \(x = x_F + x_G\) : pour un plan et une droite, chercher \(x - \lambda a \in F\), d'où \(p(x) = x - \frac{\varphi(x)}{\varphi(a)}\,a\).</li>
      <li>Écrire les images de \(e_1, e_2, e_3\) en colonnes ; pour la symétrie, \(s = 2p - \mathrm{id}\). Contrôler \(A^2 = A\) (ou \(S^2 = I\)) et un vecteur de \(F\), un de \(G\).</li>
      <li>Variante : dans une base adaptée, la matrice est \(\operatorname{diag}(1, \ldots, 1, 0, \ldots, 0)\) (ou avec des \(-1\)), puis on change de base (chapitre Calcul matriciel).</li>
    </ol>
    <p><em>Exemple éclair :</em> projection sur le plan \(x + y + z = 0\) parallèlement à \(\operatorname{Vect}\big((1, 0, 0)\big)\) : \(\varphi(a) = 1\), \(p(x, y, z) = (x, y, z) - (x + y + z)(1, 0, 0) = (-y - z,\ y,\ z)\), de matrice</p>
    <div class="formula">$$\begin{pmatrix} 0 & -1 & -1 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{pmatrix}, \qquad \text{dont le carré est elle-même.}$$</div>
  </div>
  <div class="notice"><strong>Piège</strong> : une projection n'est définie qu'avec sa direction \(G\) ; et une symétrie n'est pas forcément orthogonale. « Symétrie d'axe \(F\) » sans direction précisée n'a de sens qu'en géométrie euclidienne (2ᵉ année).</div>
</div>
</template>
<template class="pan-tpl" data-panneau="lin-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Reconnaître une application linéaire</h3>
  <div class="statement">Parmi les applications suivantes, lesquelles sont linéaires ?</div>
  <div class="q"><strong>Q1.</strong> \(f : \mathbb{R}^2 \to \mathbb{R}\), \(f(x, y) = 2x - 3y\)</div>
  <div class="q"><strong>Q2.</strong> \(g : \mathbb{R}^2 \to \mathbb{R}\), \(g(x, y) = 2x - 3y + 1\)</div>
  <div class="q"><strong>Q3.</strong> \(h : \mathbb{R} \to \mathbb{R}\), \(h(x) = x^2\)</div>
  <div class="q"><strong>Q4.</strong> \(\varphi : \mathbb{R}[X] \to \mathbb{R}[X]\), \(\varphi(P) = P'\) (dérivée)</div>
  <div class="q"><strong>Q5.</strong> \(\psi : \mathbb{R}[X] \to \mathbb{R}\), \(\psi(P) = P(1) \cdot P(2)\)</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Linéaire. Pour \(u = (x_u, y_u)\), \(v = (x_v, y_v)\) :</p>
    <div class="formula">$$f(\lambda u + \mu v) = 2(\lambda x_u + \mu x_v) - 3(\lambda y_u + \mu y_v) = \lambda(2x_u - 3y_u) + \mu(2x_v - 3y_v) = \lambda f(u) + \mu f(v).$$</div>
    <p><strong>Q2.</strong> <strong>Pas linéaire.</strong> Test rapide : \(g(0, 0) = 1 \neq 0\). C'est une application affine.</p>
    <p><strong>Q3.</strong> <strong>Pas linéaire.</strong> \(h(2 \cdot 1) = 4 \neq 2 = 2 \cdot h(1)\). Ou : \(h(x + y) = (x+y)^2\), différent en général de \(x^2 + y^2 = h(x) + h(y)\).</p>
    <p><strong>Q4.</strong> Linéaire. \((\lambda P + \mu Q)' = \lambda P' + \mu Q'\) (propriété de la dérivation).</p>
    <p><strong>Q5.</strong> <strong>Pas linéaire.</strong> \(\psi(2P) = (2P)(1) \cdot (2P)(2) = 4 P(1)P(2)\), c'est-à-dire \(4\psi(P)\) et non \(2\psi(P)\). Le produit de deux formes linéaires n'est pas linéaire.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Noyau et image dans \(\mathbb{R}^3\)</h3>
  <div class="statement">Soit \(f : \mathbb{R}^3 \to \mathbb{R}^3\) définie par \(f(x, y, z) = (x + y - z,\ 2x - y + z,\ x - 2y + 2z)\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(f\) est linéaire.</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(\ker f\) et en donner une base. En déduire \(\dim \ker f\).</div>
  <div class="q"><strong>Q3.</strong> En utilisant le théorème du rang, déterminer \(\operatorname{rg}(f)\).</div>
  <div class="q"><strong>Q4.</strong> \(f\) est-elle injective ? Surjective ? Bijective ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Chaque coordonnée de \(f(x,y,z)\) est une combinaison linéaire de \(x, y, z\) : c'est l'application \(X \mapsto AX\) pour la matrice \(A\) des coefficients, donc \(f\) est linéaire.</p>
    <p><strong>Q2.</strong> \(f(x,y,z) = (0,0,0)\) ⇔ système : \(\begin{cases} x+y-z=0 \\ 2x-y+z=0 \\ x-2y+2z=0 \end{cases}\)<br>
    \(L_2 \leftarrow L_2 - 2L_1\) : \(-3y + 3z = 0\), soit \(y = z\). Puis \(L_1\) : \(x = z - y = 0\). On vérifie \(L_3\) : \(0 - 2z + 2z = 0\) ✓.<br>
    Donc \(\ker f = \{(0, z, z) \mid z \in \mathbb{R}\} = \operatorname{Vect}((0, 1, 1))\). \(\dim \ker f = 1\).</p>
    <p><strong>Q3.</strong> Par le théorème du rang : \(\operatorname{rg}(f) = 3 - 1 = 2\).</p>
    <p><strong>Q4.</strong> \(\ker f \neq \{0\}\) donc \(f\) <strong>n'est pas injective</strong>. \(\operatorname{Im} f\) est de dim 2, donc strictement incluse dans \(\mathbb{R}^3\), donc \(f\) <strong>n'est pas surjective</strong>. Ni bijective.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Endomorphisme de polynômes</h3>
  <div class="statement">Soit \(E = \mathbb{R}_3[X]\) (polynômes de degré ≤ 3). On définit \(\varphi : E \to E\) par \(\varphi(P) = P - P'\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(\varphi\) est un endomorphisme de \(E\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(\ker \varphi\).</div>
  <div class="q"><strong>Q3.</strong> En déduire que \(\varphi\) est un automorphisme de \(E\) (sans calculer \(\operatorname{Im} \varphi\) directement).</div>
  <div class="q"><strong>Q4.</strong> Trouver \(\varphi^{-1}(X^2)\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Linéarité : \(\varphi(\lambda P + \mu Q) = (\lambda P + \mu Q) - (\lambda P' + \mu Q')\), qui vaut \(\lambda(P-P') + \mu(Q-Q') = \lambda\varphi(P) + \mu\varphi(Q)\). Stabilité : si \(\deg P \leq 3\), alors \(\deg P' \leq 2\) donc \(\deg(P - P') \leq 3\). ✓</p>
    <p><strong>Q2.</strong> \(\varphi(P) = 0 \Leftrightarrow P = P'\). Pour \(P = aX^3 + bX^2 + cX + d\), \(P' = 3aX^2 + 2bX + c\). Égalité : par identification des coefficients, \(a = 0\), \(b = 3a = 0\), \(c = 2b = 0\), \(d = c = 0\). Donc \(P = 0\). Conclusion : \(\ker \varphi = \{0\}\).</p>
    <p><strong>Q3.</strong> \(\varphi\) est un endomorphisme de \(E\) qui est de dimension finie (= 4). Comme \(\ker \varphi = \{0\}\), \(\varphi\) est injective. Par le théorème (en dimension finie), \(\varphi\) est donc bijective : c'est un <strong>automorphisme</strong>.</p>
    <p><strong>Q4.</strong> On cherche \(P\) tel que \(P - P' = X^2\). Posons \(P = aX^2 + bX + c\) (degré ≤ 2 suffit). Alors \(P' = 2aX + b\) et \(P - P' = aX^2 + (b - 2a)X + (c - b)\). Identification : \(a = 1\), \(b - 2a = 0 \Rightarrow b = 2\), \(c - b = 0 \Rightarrow c = 2\). Donc \(\varphi^{-1}(X^2) = X^2 + 2X + 2\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Détermination par les images d'une base</h3>
  <div class="statement">Existe-t-il une application linéaire \(f : \mathbb{R}^2 \to \mathbb{R}^2\) telle que \(f(1, 0) = (2, 3)\), \(f(0, 1) = (-1, 4)\) et \(f(1, 1) = (1, 8)\) ?</div>
  <div class="q"><strong>Q1.</strong> Si oui, est-elle unique ? Donner son expression.</div>
  <div class="q"><strong>Q2.</strong> Et si on remplace la dernière condition par \(f(1, 1) = (1, 7)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La famille \(((1,0), (0,1))\) est la base canonique de \(\mathbb{R}^2\). Le théorème de détermination par les images d'une base affirme qu'il existe une unique application linéaire \(f\) avec \(f(1,0) = (2,3)\) et \(f(0,1) = (-1, 4)\). Reste à vérifier la 3ᵉ condition.<br>
    Par linéarité : \(f(1,1) = f(1,0) + f(0,1)\), soit \((2,3) + (-1,4) = (1, 7)\).<br>
    Or on demande \(f(1,1) = (1, 8)\). <strong>Contradiction : aucune application linéaire ne convient.</strong></p>
    <p><strong>Q2.</strong> La condition est cette fois compatible. Il existe une unique \(f\) linéaire telle que \(f(1,0) = (2,3)\) et \(f(0,1) = (-1,4)\). Sur un \((x,y)\) quelconque : \(f(x,y) = x f(1,0) + y f(0,1)\), c'est-à-dire \(f(x, y) = (2x - y,\ 3x + 4y)\).<br>
    Vérification \(f(1,1) = (2-1, 3+4) = (1, 7)\) ✓.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Projecteur</h3>
  <div class="statement">Soit \(p : \mathbb{R}^3 \to \mathbb{R}^3\) définie par \(p(x, y, z) = \dfrac{1}{2}(x + z,\ 2y,\ x + z)\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(p\) est un endomorphisme de \(\mathbb{R}^3\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \(p \circ p = p\). Quel résultat en déduit-on ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer \(\operatorname{Im} p\) et \(\ker p\).</div>
  <div class="q"><strong>Q4.</strong> Donner la nature géométrique de \(p\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Linéarité évidente (chaque coordonnée est combinaison linéaire de \(x, y, z\)). Application de \(\mathbb{R}^3\) dans \(\mathbb{R}^3\). ✓</p>
    <p><strong>Q2.</strong> Posons \((x', y', z') = p(x,y,z) = \frac{1}{2}(x+z, 2y, x+z)\). Alors \(p(x', y', z') = \frac{1}{2}(x' + z', 2y', x' + z')\). Or \(x' + z' = \frac{1}{2}(x+z) + \frac{1}{2}(x+z) = x + z\), et \(y' = y\). Donc \(p(x',y',z') = \frac{1}{2}(x+z, 2y, x+z) = p(x,y,z)\). ✓<br>
    <strong>Donc \(p\) est un projecteur.</strong></p>
    <p><strong>Q3.</strong> \(\operatorname{Im} p = \{(t, y, t) \mid t, y \in \mathbb{R}\}\) (poser \(t = (x+z)/2\)). C'est un plan, \(\operatorname{Im} p = \operatorname{Vect}((1,0,1), (0,1,0))\), de dimension 2.<br>
    \(\ker p\) : \(p(x,y,z) = 0\) ⇔ \(x + z = 0\) et \(y = 0\). Donc \(\ker p = \{(x, 0, -x),\ x \in \mathbb{R}\}\), c'est-à-dire \(\operatorname{Vect}\big((1, 0, -1)\big)\), de dimension 1.<br>
    Vérification : \(\dim \operatorname{Im} p + \dim \ker p = 2 + 1 = 3 = \dim \mathbb{R}^3\) ✓ (théorème du rang, et même supplémentarité car c'est un projecteur).</p>
    <p><strong>Q4.</strong> \(p\) est la projection sur le plan \(P = \operatorname{Vect}\big((1,0,1), (0,1,0)\big)\), d'équation \(x = z\), parallèlement à la droite \(D = \operatorname{Vect}\big((1, 0, -1)\big)\). (Ici \(D\) est même perpendiculaire à \(P\) : c'est une projection orthogonale, notion de 2ᵉ année.)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Synthèse</h3>
  <div class="statement">Soit \(E\) un \(\mathbb{R}\)-ev de dimension finie \(n \geq 1\) et \(f \in \mathcal{L}(E)\). Montrer les équivalences :
  $$f^2 = 0 \iff \operatorname{Im} f \subset \ker f$$
  Que peut-on en déduire sur \(\operatorname{rg}(f)\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Équivalence.</strong><br>
    (⇒) Supposons \(f^2 = 0\). Soit \(y \in \operatorname{Im} f\). Alors il existe \(x \in E\) tel que \(y = f(x)\). On a \(f(y) = f(f(x)) = f^2(x) = 0\), donc \(y \in \ker f\). Ainsi \(\operatorname{Im} f \subset \ker f\).<br>
    (⇐) Supposons \(\operatorname{Im} f \subset \ker f\). Soit \(x \in E\). Alors \(f(x) \in \operatorname{Im} f \subset \ker f\), donc \(f(f(x)) = 0\). Comme c'est vrai pour tout \(x\), \(f^2 = 0\).</p>
    <p><strong>Conséquence sur le rang.</strong> Si \(f^2 = 0\), alors \(\operatorname{Im} f \subset \ker f\), donc \(\operatorname{rg}(f) = \dim \operatorname{Im} f \leq \dim \ker f\). Or par le théorème du rang, \(\dim \ker f = n - \operatorname{rg}(f)\). Donc :
    $$\operatorname{rg}(f) \leq n - \operatorname{rg}(f) \implies 2\operatorname{rg}(f) \leq n \implies \operatorname{rg}(f) \leq \frac{n}{2}$$
    Autrement dit, un endomorphisme de carré nul a un rang au plus égal à la moitié de la dimension de l'espace. Exemple : \(N(x, y) = (y, 0)\) sur \(\mathbb{R}^2\), de rang \(1 = \frac{2}{2}\), pour lequel \(\operatorname{Im} N = \ker N\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Rang d'une famille, rang d'une composée</h3>
  <div class="statement">Dans \(\mathbb{R}^3\), on pose \(x_1 = (1, 1, 0)\), \(x_2 = (1, 2, 1)\) et \(x_3 = (1, a, 2)\), où \(a\) est un réel. On considère aussi \(u : \mathbb{R}^3 \to \mathbb{R}^2\), \(u(x, y, z) = (x + y,\ y + z)\), et \(v : \mathbb{R}^2 \to \mathbb{R}^3\), \(v(s, t) = (s,\ t,\ s - t)\).</div>
  <div class="q"><strong>Q1.</strong> Déterminer, selon \(a\), le rang de la famille \((x_1, x_2, x_3)\). Pour la valeur particulière, écrire une relation entre les trois vecteurs.</div>
  <div class="q"><strong>Q2.</strong> Déterminer les rangs de \(u\) et de \(v\).</div>
  <div class="q"><strong>Q3.</strong> Sans calcul, expliquer pourquoi l'endomorphisme \(v \circ u\) de \(\mathbb{R}^3\) n'est pas bijectif. Calculer \(v \circ u\) et son noyau.</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(u \circ v\) est un automorphisme de \(\mathbb{R}^2\) et déterminer sa réciproque.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le rang ne change pas si l'on retranche \(x_1\) aux deux autres : \(x_2 - x_1 = (0, 1, 1)\) et \(x_3 - x_1 = (0, a - 1, 2)\). Ces deux vecteurs sont colinéaires si et seulement si \(a - 1 = 2\), soit \(a = 3\) ; et \(x_1\), dont la première coordonnée vaut 1, n'est pas dans le plan des vecteurs de première coordonnée nulle. Donc le rang vaut 3 si \(a \neq 3\) (la famille est une base) et 2 si \(a = 3\). Dans ce cas \(x_3 - x_1 = 2(x_2 - x_1)\), soit \(x_3 = 2x_2 - x_1\) : en effet \((1, 3, 2) = (2, 4, 2) - (1, 1, 0)\).</p>
    <p><strong>Q2.</strong> \(u(e_1) = (1, 0)\), \(u(e_2) = (1, 1)\) : déjà deux vecteurs non colinéaires, donc \(\operatorname{rg} u = 2 = \dim \mathbb{R}^2\) et \(u\) est surjective. Pour \(v\) : \(v(e_1) = (1, 0, 1)\) et \(v(e_2) = (0, 1, -1)\) ne sont pas colinéaires, donc \(\operatorname{rg} v = 2\) et \(v\) est injective.</p>
    <p><strong>Q3.</strong> \(\operatorname{rg}(v \circ u) \leq \min(\operatorname{rg} u, \operatorname{rg} v) = 2 \lt 3\) : l'endomorphisme \(v \circ u\) de \(\mathbb{R}^3\) n'est pas surjectif, donc pas bijectif. Le calcul donne \(v \circ u\,(x, y, z) = v(x + y,\ y + z)\), soit \((x + y,\ y + z,\ x - z)\). Son noyau : \(x = -y\), \(z = -y\) (la 3ᵉ équation suit), soit \(\ker(v \circ u) = \operatorname{Vect}\big((1, -1, 1)\big)\), de dimension \(3 - 2 = 1\) comme l'annonce le théorème du rang.</p>
    <p><strong>Q4.</strong> \(u \circ v\,(s, t) = u(s,\ t,\ s - t) = (s + t,\ s)\). Résolvons \((s + t,\ s) = (p, q)\) : \(s = q\), \(t = p - q\), solution unique pour tout \((p, q)\). Donc \(u \circ v\) est bijective et \((u \circ v)^{-1}(p, q) = (q,\ p - q)\). Ici l'inégalité \(\operatorname{rg}(u \circ v) \leq 2\) est une égalité : l'ordre de la composition compte.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Interpolation par le théorème du rang</h3>
  <div class="statement">Soit \(\varphi : \mathbb{R}_3[X] \to \mathbb{R}^4\), \(P \mapsto \big(P(-1), P(0), P(1), P(2)\big)\).</div>
  <div class="q"><strong>Q1.</strong> Justifier que \(\varphi\) est linéaire, puis qu'elle est bijective.</div>
  <div class="q"><strong>Q2.</strong> Déterminer l'unique \(P \in \mathbb{R}_3[X]\) tel que \(P(-1) = 2\), \(P(0) = 1\), \(P(1) = 0\) et \(P(2) = 5\).</div>
  <div class="q"><strong>Q3.</strong> Soit \(\psi : \mathbb{R}_3[X] \to \mathbb{R}^3\), \(P \mapsto \big(P(-1), P(0), P(1)\big)\). Déterminer \(\ker \psi\), puis le rang de \(\psi\). \(\psi\) est-elle surjective ? injective ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> L'évaluation en un point est linéaire (\((\lambda P + \mu Q)(a) = \lambda P(a) + \mu Q(a)\)), donc \(\varphi\) l'est. Si \(\varphi(P) = 0\), le polynôme \(P\), de degré au plus 3, a quatre racines distinctes : il est nul. Donc \(\varphi\) est injective. Comme \(\dim \mathbb{R}_3[X] = 4 = \dim \mathbb{R}^4\), le théorème du rang donne la bijectivité, sans chercher d'antécédent.</p>
    <p><strong>Q2.</strong> L'existence et l'unicité viennent de Q1. Posons \(P = a + bX + cX^2 + dX^3\). \(P(0) = 1\) donne \(a = 1\). Puis \(P(1) = 1 + b + c + d = 0\) et \(P(-1) = 1 - b + c - d = 2\) : la somme donne \(c = 0\), la différence \(b + d = -1\). Enfin \(P(2) = 1 + 2b + 8d = 5\), soit \(b + 4d = 2\), d'où \(d = 1\) et \(b = -2\). Donc \(P = X^3 - 2X + 1\). Contrôle : \(P(-1) = -1 + 2 + 1 = 2\), \(P(2) = 8 - 4 + 1 = 5\).</p>
    <p><strong>Q3.</strong> \(P \in \ker \psi\) si et seulement si \(-1\), \(0\) et \(1\) sont racines de \(P\), c'est-à-dire si \(P\) est un multiple de \((X + 1)X(X - 1) = X^3 - X\) ; au degré 3, \(\ker \psi = \operatorname{Vect}(X^3 - X)\), de dimension 1. Le théorème du rang donne \(\operatorname{rg} \psi = 4 - 1 = 3 = \dim \mathbb{R}^3\) : \(\psi\) est surjective, mais pas injective. Trois valeurs imposées laissent un polynôme de degré 3 défini à un multiple de \(X^3 - X\) près : c'est la structure \(x_0 + \ker \psi\) des équations linéaires.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Trois équations linéaires</h3>
  <div class="statement">On résout trois équations en faisant apparaître à chaque fois une application linéaire, son noyau et une solution particulière.</div>
  <div class="q"><strong>Q1.</strong> Soit \(T : \mathbb{R}_3[X] \to \mathbb{R}_3[X]\), \(P \mapsto P + P''\). Montrer que \(T\) est un automorphisme, puis résoudre \(P + P'' = X^3\) dans \(\mathbb{R}_3[X]\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les suites réelles telles que \(u_{n+1} = 3u_n + 4\) pour tout \(n\), puis celle qui vérifie \(u_0 = 5\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer les suites réelles telles que \(u_{n+1} = 3u_n + 2^n\) pour tout \(n\) (chercher une solution particulière de la forme \(c\,2^n\)), puis celle qui vérifie \(u_0 = 1\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(T\) est linéaire (la dérivation l'est) et \(\deg T(P) \leq 3\) : c'est un endomorphisme. Si \(P \neq 0\) est de degré \(d\), \(P''\) est de degré au plus \(d - 2\) (ou nul), donc \(P + P''\) est encore de degré \(d\) et n'est pas nul. Ainsi \(\ker T = \{0\}\) : \(T\) est injective, donc bijective en dimension finie. L'équation a une unique solution. On l'essaie sous la forme \(P = X^3 + aX\) : \(P'' = 6X\) et \(P + P'' = X^3 + (a + 6)X\), d'où \(a = -6\). Par unicité, la solution est \(P = X^3 - 6X\).</p>
    <p><strong>Q2.</strong> L'application \((u_n) \mapsto (u_{n+1} - 3u_n)\) est linéaire de \(\mathbb{R}^{\mathbb{N}}\) dans lui-même ; son noyau est formé des suites géométriques \((\lambda 3^n)\). Une constante \(c\) est solution si \(c = 3c + 4\), soit \(c = -2\). Les solutions sont donc \(u_n = -2 + \lambda 3^n\), et \(u_0 = 5\) impose \(\lambda = 7\) : \(u_n = 7 \cdot 3^n - 2\).</p>
    <p><strong>Q3.</strong> Même noyau. Avec \(u_n = c\,2^n\) : \(c\,2^{n+1} = 3c\,2^n + 2^n\), soit \(2c = 3c + 1\), \(c = -1\). Les solutions sont \(u_n = \lambda 3^n - 2^n\), et \(u_0 = 1\) donne \(\lambda = 2\) : \(u_n = 2 \cdot 3^n - 2^n\). Contrôle : \(u_1 = 3 \times 1 + 1 = 4\) et \(2 \times 3 - 2 = 4\) ; \(u_2 = 3 \times 4 + 2 = 14\) et \(18 - 4 = 14\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Une symétrie de l'espace donnée par sa matrice</h3>
  <div class="statement">Soit \(s\) l'endomorphisme de \(\mathbb{R}^3\) de matrice, dans la base canonique,
  $$S = \begin{pmatrix} 1 & 0 & 0 \\ -2 & 3 & -4 \\ -2 & 2 & -3 \end{pmatrix}.$$</div>
  <div class="q"><strong>Q1.</strong> Calculer \(S^2\). Qu'en déduit-on ?</div>
  <div class="q"><strong>Q2.</strong> Déterminer \(F = \ker(s - \mathrm{id})\) et \(G = \ker(s + \mathrm{id})\). Décrire \(s\) géométriquement.</div>
  <div class="q"><strong>Q3.</strong> Donner une base adaptée à \(\mathbb{R}^3 = F \oplus G\) et la matrice de \(s\) dans cette base.</div>
  <div class="q"><strong>Q4.</strong> Écrire la matrice de la projection \(p\) sur \(F\) parallèlement à \(G\), puis calculer \(p(1, 1, 1)\) et \(s(1, 1, 1)\).</div>
  <div class="q"><strong>Q5.</strong> On note \(\varphi(x, y, z) = x - y + 2z\) et \(a = (0, 1, 1)\). Vérifier que \(s(x) = x - 2\varphi(x)\,a\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Le calcul ligne par colonne donne \(S^2 = I_3\) (par exemple, ligne 2 par colonne 2 : \(0 + 9 - 8 = 1\) ; ligne 2 par colonne 3 : \(0 - 12 + 12 = 0\)). Donc \(s \circ s = \mathrm{id}\) : \(s\) est une symétrie (caractérisation du cours, §9).</p>
    <p><strong>Q2.</strong> \(S - I_3\) a une première ligne nulle et deux lignes égales à \((-2, 2, -4)\) : \(F\) est le plan \(x - y + 2z = 0\). \(S + I_3\) a pour lignes \((2, 0, 0)\), \((-2, 4, -4)\), \((-2, 2, -2)\) : la première impose \(x = 0\), puis \(y = z\), donc \(G = \operatorname{Vect}\big((0, 1, 1)\big)\). Ainsi \(s\) est la symétrie par rapport au plan \(F\) parallèlement à la droite \(G\).</p>
    <p><strong>Q3.</strong> \(f_1 = (1, 1, 0)\) et \(f_2 = (0, 2, 1)\) vérifient \(x - y + 2z = 0\) et ne sont pas colinéaires : c'est une base de \(F\). Avec \(a = (0, 1, 1)\), \((f_1, f_2, a)\) est une base adaptée, et la matrice de \(s\) y est \(\operatorname{diag}(1, 1, -1)\).</p>
    <p><strong>Q4.</strong> \(p = \frac{1}{2}(s + \mathrm{id})\), de matrice</p>
    <div class="formula">$$\frac{1}{2}(S + I_3) = \begin{pmatrix} 1 & 0 & 0 \\ -1 & 2 & -2 \\ -1 & 1 & -1 \end{pmatrix}.$$</div>
    <p>Pour \(x = (1, 1, 1)\) : \(p(x) = (1, -1, -1)\), qui est bien dans \(F\) (\(1 + 1 - 2 = 0\)), et \(x - p(x) = (0, 2, 2) \in G\). Puis \(s(x) = 2p(x) - x = (1, -3, -3)\).</p>
    <p><strong>Q5.</strong> \(\varphi(a) = -1 + 2 = 1\). Pour \(x \in F\), \(\varphi(x) = 0\) et la formule donne \(x\) ; pour \(x = a\), elle donne \(a - 2a = -a\). Deux applications linéaires qui coïncident sur \(F\) et sur \(G\), donc sur une base adaptée, sont égales. Contrôle sur \(e_1\) : \(\varphi(e_1) = 1\), \(e_1 - 2a = (1, -2, -2)\), première colonne de \(S\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Quand noyau et image sont-ils supplémentaires ?</h3>
  <div class="statement">Soit \(E\) un espace de dimension finie \(n\) et \(u \in \mathcal{L}(E)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\ker u \subset \ker u^2\) et \(\operatorname{Im} u^2 \subset \operatorname{Im} u\).</div>
  <div class="q"><strong>Q2.</strong> Montrer l'équivalence des quatre propriétés : (i) \(\ker u \cap \operatorname{Im} u = \{0\}\) ; (ii) \(E = \ker u \oplus \operatorname{Im} u\) ; (iii) \(\ker u^2 = \ker u\) ; (iv) \(\operatorname{rg} u^2 = \operatorname{rg} u\).</div>
  <div class="q"><strong>Q3.</strong> Application : \(u\) de matrice \(A = \begin{pmatrix} 1 & 1 & -1 \\ 1 & 2 & 1 \\ 2 & 3 & 0 \end{pmatrix}\) (exemple du §3 du cours). Calculer \(A^2\) et conclure.</div>
  <div class="q"><strong>Q4.</strong> Montrer que si \(u^3 = u\), alors \(E = \ker u \oplus \operatorname{Im} u\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Si \(u(x) = 0\), alors \(u^2(x) = u(0) = 0\). Si \(y = u^2(x)\), alors \(y = u\big(u(x)\big) \in \operatorname{Im} u\).</p>
    <p><strong>Q2.</strong> (i) ⇒ (ii) : la somme \(\ker u + \operatorname{Im} u\) est directe et sa dimension vaut \(\dim \ker u + \operatorname{rg} u = n\) (théorème du rang) ; c'est donc \(E\). (ii) ⇒ (i) : c'est la définition d'une somme directe.</p>
    <p>(i) ⇒ (iii) : si \(u^2(x) = 0\), alors \(u(x)\) est dans \(\operatorname{Im} u\) et dans \(\ker u\), donc nul : \(\ker u^2 \subset \ker u\), et l'autre inclusion est Q1. (iii) ⇒ (i) : si \(y = u(x)\) et \(u(y) = 0\), alors \(u^2(x) = 0\), donc \(x \in \ker u^2 = \ker u\) et \(y = u(x) = 0\).</p>
    <p>(iii) ⟺ (iv) : par le théorème du rang appliqué à \(u\) et à \(u^2\), \(\dim \ker u = n - \operatorname{rg} u\) et \(\dim \ker u^2 = n - \operatorname{rg} u^2\). Comme \(\ker u \subset \ker u^2\), l'égalité des sous-espaces équivaut à l'égalité de leurs dimensions, c'est-à-dire à \(\operatorname{rg} u^2 = \operatorname{rg} u\).</p>
    <p><strong>Q3.</strong> Le calcul donne</p>
    <div class="formula">$$A^2 = \begin{pmatrix} 0 & 0 & 0 \\ 5 & 8 & 1 \\ 5 & 8 & 1 \end{pmatrix},$$</div>
    <p>de rang 1, alors que \(\operatorname{rg} A = 2\). La propriété (iv) est fausse : noyau et image ne sont pas supplémentaires. C'est cohérent avec le cours, où l'on a vu \(\ker u \subset \operatorname{Im} u\).</p>
    <p><strong>Q4.</strong> Si \(u^2(x) = 0\), alors \(u(x) = u^3(x) = u\big(u^2(x)\big) = 0\) : \(\ker u^2 \subset \ker u\), donc (iii) est vraie, et (ii) aussi. Cela s'applique aux projecteurs (\(p^2 = p\) entraîne \(p^3 = p\)) et aux symétries (\(s^3 = s\)), pour lesquelles \(\ker s = \{0\}\) et \(\operatorname{Im} s = E\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Un endomorphisme de rang 1 : noyau, image, projecteur, symétrie</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format de l'épreuve de Mathématiques PT (thème <em>applications linéaires</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Soit \(f : \mathbb{R}^3 \to \mathbb{R}^3\) de matrice \(A = \begin{pmatrix}1&2&3\\2&4&6\\1&2&3\end{pmatrix}\) dans la base canonique. On note \(c = (1, 2, 1)\).
  </div>

  <p class="exo-part">Partie A — Rang, noyau, image</p>
  <div class="q"><strong>A1.</strong> Déterminer le rang de \(f\).</div>
  <div class="q"><strong>A2.</strong> Déterminer \(\ker f\) (dimension et base) et \(\operatorname{Im} f\).</div>

  <p class="exo-part">Partie B — Théorème du rang</p>
  <div class="q"><strong>B1.</strong> Vérifier le théorème du rang.</div>

  <p class="exo-part">Partie C — Un projecteur caché</p>
  <div class="q"><strong>C1.</strong> Montrer que \(A\) est le produit de la colonne \(c\) par la ligne \((1\ \ 2\ \ 3)\), puis que \(A^2 = 8A\).</div>
  <div class="q"><strong>C2.</strong> En déduire que \(p = \frac{1}{8} f\) est un projecteur ; préciser \(\operatorname{Im} p\) et \(\ker p\), puis justifier que \(\mathbb{R}^3 = \ker f \oplus \operatorname{Im} f\).</div>
  <div class="q"><strong>C3.</strong> Donner une base adaptée à cette décomposition et la matrice de \(f\) dans cette base.</div>

  <p class="exo-part">Partie D — La symétrie associée</p>
  <div class="q"><strong>D1.</strong> Écrire la matrice de \(s = 2p - \mathrm{id}\), vérifier que \(s\) est une symétrie et décrire ses éléments.</div>

  <p class="exo-part">Partie E — Équation et puissances</p>
  <div class="q"><strong>E1.</strong> Pour quels \(a \in \mathbb{R}^3\) l'équation \(f(x) = a\) a-t-elle des solutions ? Résoudre \(f(x) = (2, 4, 2)\).</div>
  <div class="q"><strong>E2.</strong> Montrer que \(f^k = 8^{k-1} f\) pour tout \(k \geq 1\), puis que \(f + \mathrm{id}\) est un automorphisme dont on donnera la réciproque en fonction de \(f\) et \(\mathrm{id}\).</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Les lignes sont proportionnelles à \((1, 2, 3)\) (\(L_2 = 2L_1\), \(L_3 = L_1\)) : le rang de \(f\) vaut \(1\).</p>
    <p><strong>A2.</strong> \(\ker f\) : le système \(AX = 0\) se réduit à \(x + 2y + 3z = 0\) (plan vectoriel), donc \(\dim \ker f = 2\), de base par exemple \(\big((-2,1,0),\,(-3,0,1)\big)\). Les colonnes de \(A\) sont toutes proportionnelles à \(c = (1,2,1)\), donc \(\operatorname{Im} f = \operatorname{Vect}(c)\), de dimension 1.</p>
    <p><strong>B1.</strong> \(\dim \ker f + \operatorname{rg} f = 2 + 1 = 3 = \dim \mathbb{R}^3\) : le théorème du rang est vérifié.</p>
    <p><strong>C1.</strong> Le coefficient \((i, j)\) du produit de la colonne \(c\) par la ligne \(r = (1\ \ 2\ \ 3)\) vaut \(c_i r_j\) : on retrouve les lignes \(1 \cdot r\), \(2 \cdot r\), \(1 \cdot r\) de \(A\). Alors \(A^2 = c\,(r\,c)\,r\), où \(r\,c = 1 + 4 + 3 = 8\) est un nombre : \(A^2 = 8A\).</p>
    <p><strong>C2.</strong> \(p^2 = \frac{1}{64} f^2 = \frac{8}{64} f = p\) : \(p\) est un projecteur. Comme \(p\) est proportionnel à \(f\), \(\operatorname{Im} p = \operatorname{Im} f = \operatorname{Vect}(c)\) et \(\ker p = \ker f\). Le cours (§8) donne \(\mathbb{R}^3 = \operatorname{Im} p \oplus \ker p = \operatorname{Im} f \oplus \ker f\) : \(p\) est la projection sur la droite \(\operatorname{Vect}(c)\) parallèlement au plan \(x + 2y + 3z = 0\). (Contrôle direct : \(c\) n'est pas dans ce plan, car \(1 + 4 + 3 = 8 \neq 0\).)</p>
    <p><strong>C3.</strong> La base \(\big((-2, 1, 0), (-3, 0, 1), c\big)\) est adaptée (deux vecteurs de \(\ker f\), puis \(c\)). Comme \(f(c) = 8c\) et \(f\) est nulle sur \(\ker f\), la matrice de \(f\) y est \(\operatorname{diag}(0, 0, 8)\).</p>
    <p><strong>D1.</strong> \(s = 2p - \mathrm{id} = \frac{1}{4}f - \mathrm{id}\) a pour matrice</p>
    <div class="formula">$$\frac{1}{4}A - I_3 = \frac{1}{4}\begin{pmatrix} -3 & 2 & 3 \\ 2 & 0 & 6 \\ 1 & 2 & -1 \end{pmatrix}.$$</div>
    <p>\(s^2 = 4p^2 - 4p + \mathrm{id} = \mathrm{id}\) : c'est une symétrie. Elle fixe \(c\) (\(s(c) = 2c - c = c\)) et change en leur opposé les vecteurs de \(\ker f\) : c'est la symétrie par rapport à la droite \(\operatorname{Vect}(c)\) parallèlement au plan \(x + 2y + 3z = 0\).</p>
    <p><strong>E1.</strong> L'équation a des solutions si et seulement si \(a \in \operatorname{Im} f = \operatorname{Vect}(c)\). Pour \(a = (2, 4, 2) = 2c\) : \(x_0 = (2, 0, 0)\) convient (\(f(e_1)\) est la première colonne \(c\)). Les solutions sont \((2, 0, 0) + \ker f\), c'est-à-dire tous les \((x, y, z)\) tels que \(x + 2y + 3z = 2\) : un plan parallèle à \(\ker f\).</p>
    <p><strong>E2.</strong> Récurrence : vrai pour \(k = 1\) ; si \(f^k = 8^{k-1} f\), alors \(f^{k+1} = 8^{k-1} f^2 = 8^{k-1} \cdot 8 f = 8^k f\). Ensuite, comme \(f^2 = 8f\) :</p>
    <div class="formula">$$(f + \mathrm{id}) \circ (9\,\mathrm{id} - f) = 9f - f^2 + 9\,\mathrm{id} - f = 9\,\mathrm{id},$$</div>
    <p>et les deux facteurs commutent. Donc \(f + \mathrm{id}\) est un automorphisme, de réciproque \(\frac{1}{9}(9\,\mathrm{id} - f) = \mathrm{id} - \frac{1}{9} f\). Contrôle dans la base adaptée : \(f + \mathrm{id}\) y vaut \(\operatorname{diag}(1, 1, 9)\), d'inverse \(\operatorname{diag}(1, 1, \frac{1}{9})\).</p>
  </div>
