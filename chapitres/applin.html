  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre suit la partie C « Applications linéaires » de la section « Espaces vectoriels et applications linéaires » du programme de PTSI (second semestre), avec deux notions de la partie B qui servent à chaque page : le rang d'une famille de vecteurs et les bases adaptées. Il s'appuie sur le chapitre Espaces vectoriels (sous-espaces, familles libres et génératrices, bases, dimension, sommes directes). La traduction en matrices (matrice d'une application linéaire, changement de base, matrices semblables) est faite au chapitre Calcul matriciel. En 2ᵉ année, les chapitres Applications linéaires (approfondissements), Projecteurs et symétries puis Réduction des endomorphismes reprennent et prolongent tout ce qui suit.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">

    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Application linéaire</strong> ; espace \(\mathcal{L}(E,F)\) ; endomorphisme, isomorphisme, automorphisme ; exemples dans \(\mathbb{K}^n\), \(\mathbb{K}[X]\), les espaces de fonctions et de suites (§1).</li>
        <li><strong>Opérations</strong> : combinaison linéaire, composition, bilinéarité de la composition ; réciproque d'un isomorphisme ; identité, homothéties, puissances \(u^k\) ; groupe linéaire \(\mathrm{GL}(E)\) et \(u^k\) pour \(k \in \mathbb{Z}\) (§2).</li>
        <li><strong>Image directe et image réciproque</strong> d'un sous-espace ; noyau \(\ker u\), image \(\operatorname{Im} u\) ; caractérisation de l'injectivité ; \(\operatorname{Im} u = \operatorname{Vect}\big(u(x_i)\big)\) pour une famille génératrice \((x_i)\) (§3).</li>

<div class="course-section">
  <div class="sec-num">§1 · APPLICATIONS LINÉAIRES</div>
  <h2>Des applications qui respectent la structure</h2>
  <div class="intro">Dériver un polynôme, intégrer une fonction, tourner une figure, multiplier une colonne par une matrice, décaler une suite : ces opérations très différentes ont un point commun, elles transforment une combinaison linéaire en la même combinaison linéaire des images. C'est la définition d'une application linéaire, et tout le chapitre exploite cette seule propriété. Dans tout le chapitre, \(\mathbb{K} = \mathbb{R}\) ou \(\mathbb{C}\), et \(E\), \(F\), \(G\) sont des \(\mathbb{K}\)-espaces vectoriels.</div>

  <div class="def-box">
    Une application \(u : E \to F\) est <strong>linéaire</strong> si, pour tous \(x, y \in E\) et tous \(\lambda, \mu \in \mathbb{K}\),
    <div class="formula" data-nom="Application linéaire">$$u(\lambda x + \mu y) = \lambda\,u(x) + \mu\,u(y).$$</div>
    Cela revient à demander \(u(x + y) = u(x) + u(y)\) et \(u(\lambda x) = \lambda\,u(x)\). On note \(\mathcal{L}(E, F)\) l'ensemble des applications linéaires de \(E\) dans \(F\), et \(\mathcal{L}(E)\) celui des <strong>endomorphismes</strong> de \(E\) (applications linéaires de \(E\) dans \(E\)). Une application linéaire bijective est un <strong>isomorphisme</strong> ; un endomorphisme bijectif est un <strong>automorphisme</strong>. Une application linéaire de \(E\) dans \(\mathbb{K}\) est une <strong>forme linéaire</strong>.
  </div>

  <div class="prop-box">
    <strong>Conséquences immédiates.</strong> Si \(u \in \mathcal{L}(E, F)\) : \(u(0_E) = 0_F\) (prendre \(\lambda = \mu = 0\)), \(u(-x) = -u(x)\), et par récurrence \(u\) conserve toute combinaison linéaire finie :
    <div class="formula">$$u\Big(\sum_{i=1}^{n} \lambda_i x_i\Big) = \sum_{i=1}^{n} \lambda_i\,u(x_i).$$</div>
  </div>

  <h3>Les exemples à connaître</h3>
  <ul>
    <li>L'application nulle et l'identité \(\mathrm{id}_E : x \mapsto x\) ; plus généralement l'<strong>homothétie</strong> \(x \mapsto \lambda x\) de rapport \(\lambda\).</li>
    <li>Sur \(\mathbb{K}^p\), toute application dont chaque coordonnée de l'image est une combinaison linéaire des coordonnées : \((x, y, z) \mapsto (x - 2y + z,\ 3y - z)\) est linéaire de \(\mathbb{R}^3\) dans \(\mathbb{R}^2\). C'est le cas \(X \mapsto AX\), \(A \in \mathcal{M}_{n,p}(\mathbb{K})\), étudié au chapitre Calcul matriciel.</li>
    <li>Sur \(\mathbb{K}[X]\) : la dérivation \(P \mapsto P'\), la multiplication par un polynôme fixé, la translation \(P \mapsto P(X + 1)\), l'évaluation \(P \mapsto P(a)\) (forme linéaire).</li>
    <li>Sur les fonctions : \(f \mapsto f'\) de \(\mathcal{C}^1(I, \mathbb{R})\) dans \(\mathcal{C}^0(I, \mathbb{R})\), \(f \mapsto \int_a^b f\) de \(\mathcal{C}^0([a, b], \mathbb{R})\) dans \(\mathbb{R}\), \(y \mapsto y'' + a y' + b y\).</li>
    <li>Sur les suites (\(\mathbb{K}^{\mathbb{N}}\)) : le décalage \((u_n) \mapsto (u_{n+1})\), et \((u_n) \mapsto (u_{n+1} - q\,u_n)\).</li>
    <li>En géométrie : les rotations vectorielles du plan, les projections et les symétries (§8, §9).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — prouver une linéarité, en réfuter une autre</strong>
    <p>Sur \(E = \mathbb{R}_2[X]\), soit \(\varphi(P) = P(1) + P'(0)\), et sur \(\mathbb{R}^2\), soit \(v(x, y) = (x + y,\ xy)\).</p>
    <ol>
      <li>Soit \(P, Q \in E\) et \(\lambda, \mu \in \mathbb{R}\). Comme \((\lambda P + \mu Q)' = \lambda P' + \mu Q'\), on obtient
      <div class="formula">$$\varphi(\lambda P + \mu Q) = \lambda P(1) + \mu Q(1) + \lambda P'(0) + \mu Q'(0) = \lambda\,\varphi(P) + \mu\,\varphi(Q) :$$</div>
      \(\varphi\) est une forme linéaire.</li>
      <li>Valeurs sur la base canonique : \(\varphi(1) = 1\), \(\varphi(X) = 1 + 1 = 2\), \(\varphi(X^2) = 1 + 0 = 1\). Par linéarité, \(\varphi(3 - X + 2X^2) = 3 - 2 + 2 = 3\), ce que confirme le calcul direct \(P(1) = 4\), \(P'(0) = -1\).</li>
      <li>Pour \(v\) : \(v(2, 2) = (4, 4)\) alors que \(2\,v(1, 1) = (4, 2)\). Un seul contre-exemple suffit : \(v\) n'est pas linéaire (le produit \(xy\) n'est pas une combinaison linéaire des coordonnées).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : confondre « linéaire » et « affine ». \(x \mapsto 2x + 1\) n'est pas linéaire, puisque l'image de \(0\) vaut \(1\). Le test \(u(0) = 0\) est un premier filtre rapide, mais il ne prouve rien : \(v\) ci-dessus vérifie \(v(0, 0) = (0, 0)\) et n'est pas linéaire.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · OPÉRATIONS ET GROUPE LINÉAIRE</div>
  <h2>Combiner, composer, inverser</h2>
  <div class="intro">On additionne et on compose des applications linéaires comme on additionne et multiplie des matrices : c'est la même algèbre, et ses pièges (non-commutativité, ordre dans l'inverse) sont les mêmes. Les automorphismes forment un « groupe », dans lequel toutes les puissances, positives ou négatives, ont un sens.</div>

  <div class="prop-box">
    <strong>Structure.</strong> Pour \(u, v \in \mathcal{L}(E, F)\) et \(\lambda \in \mathbb{K}\), \(u + v\) et \(\lambda u\) sont linéaires : \(\mathcal{L}(E, F)\) est un \(\mathbb{K}\)-espace vectoriel (sous-espace de l'espace des applications de \(E\) dans \(F\)). Si \(u \in \mathcal{L}(E, F)\) et \(v \in \mathcal{L}(F, G)\), alors \(v \circ u \in \mathcal{L}(E, G)\), et la composition est <strong>bilinéaire</strong> :
    <div class="formula">$$v \circ (\lambda u_1 + \mu u_2) = \lambda\, v \circ u_1 + \mu\, v \circ u_2, \qquad (\lambda v_1 + \mu v_2) \circ u = \lambda\, v_1 \circ u + \mu\, v_2 \circ u.$$</div>
    Elle est associative, mais <strong>pas commutative</strong> en général.
  </div>

  <div class="prop-box">
    <strong>Réciproque.</strong> Si \(u \in \mathcal{L}(E, F)\) est bijective, sa réciproque \(u^{-1}\) est linéaire : c'est un isomorphisme de \(F\) sur \(E\). Si \(u\) et \(v\) sont des isomorphismes composables, \((v \circ u)^{-1} = u^{-1} \circ v^{-1}\) (l'ordre s'inverse).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi la réciproque d'une application linéaire bijective est-elle linéaire ?</span>
    <div class="content"><p>Soit \(y_1, y_2 \in F\) et \(\lambda, \mu \in \mathbb{K}\). Posons \(x_i = u^{-1}(y_i)\). Par linéarité de \(u\), \(u(\lambda x_1 + \mu x_2) = \lambda y_1 + \mu y_2\), donc, en appliquant \(u^{-1}\), \(u^{-1}(\lambda y_1 + \mu y_2) = \lambda x_1 + \mu x_2\), c'est-à-dire \(\lambda\,u^{-1}(y_1) + \mu\,u^{-1}(y_2)\). Pour l'inverse d'une composée : \((v \circ u) \circ (u^{-1} \circ v^{-1}) = v \circ v^{-1} = \mathrm{id}\), et de même dans l'autre sens.</p></div>
  </div>

  <h3>Endomorphismes et groupe linéaire</h3>
  <div class="def-box">
    Pour \(u \in \mathcal{L}(E)\), on pose \(u^0 = \mathrm{id}_E\) et \(u^{k+1} = u \circ u^k\). L'ensemble des automorphismes de \(E\) est noté \(\mathrm{GL}(E)\), le <strong>groupe linéaire</strong> : il contient \(\mathrm{id}_E\), la composée de deux automorphismes est un automorphisme, et la réciproque d'un automorphisme aussi. Pour \(u \in \mathrm{GL}(E)\) et \(k \in \mathbb{N}\), on pose \(u^{-k} = (u^{-1})^k = (u^k)^{-1}\) : les puissances sont alors définies pour tout \(k \in \mathbb{Z}\), et \(u^{j} \circ u^{k} = u^{j+k}\).
  </div>
  <p>Comme pour les matrices, la formule du binôme \((u + v)^n = \sum_k \binom{n}{k} u^k \circ v^{n-k}\) n'est valable que si \(u \circ v = v \circ u\).</p>

  <div class="method-box">
    <strong>Exemple — deux composées différentes, et des puissances négatives</strong>
    <p>Dans \(\mathbb{R}^2\), soit \(u(x, y) = (y, x)\) (échange des coordonnées) et \(v(x, y) = (x, 0)\).</p>
    <ol>
      <li>\(v \circ u\,(x, y) = v(y, x) = (y, 0)\), mais \(u \circ v\,(x, y) = u(x, 0) = (0, x)\) : \(u \circ v \neq v \circ u\).</li>
      <li>Soit \(w(x, y) = (x + y,\ y)\). Résoudre \(w(x, y) = (a, b)\) donne \(y = b\), \(x = a - b\) : \(w\) est un automorphisme et \(w^{-1}(a, b) = (a - b,\ b)\).</li>
      <li>Par récurrence, \(w^k(x, y) = (x + k y,\ y)\) pour \(k \in \mathbb{N}\), et de même \((w^{-1})^k(x, y) = (x - k y,\ y)\) : la formule \(w^k(x, y) = (x + ky,\ y)\) vaut pour tout \(k \in \mathbb{Z}\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · NOYAU, IMAGE, IMAGES DE SOUS-ESPACES</div>
  <h2>Ce qui est écrasé, ce qui est atteint</h2>
  <div class="intro">Une application linéaire transporte les sous-espaces : l'image d'un sous-espace en est un, et l'ensemble des vecteurs envoyés dans un sous-espace aussi. Deux cas particuliers dominent tout le reste : le <strong>noyau</strong>, ensemble des vecteurs envoyés sur \(0\), qui mesure le défaut d'injectivité, et l'<strong>image</strong>, ensemble des valeurs atteintes, qui mesure le défaut de surjectivité.</div>

  <div class="prop-box">
    <strong>Images de sous-espaces.</strong> Soit \(u \in \mathcal{L}(E, F)\). Si \(E'\) est un sous-espace de \(E\), son <strong>image directe</strong> \(u(E') = \{u(x),\ x \in E'\}\) est un sous-espace de \(F\). Si \(F'\) est un sous-espace de \(F\), son <strong>image réciproque</strong> \(u^{-1}(F') = \{x \in E,\ u(x) \in F'\}\) est un sous-espace de \(E\) (la notation n'exige pas que \(u\) soit bijective).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Vérifier les deux stabilités.</span>
    <div class="content"><p><strong>Image directe.</strong> \(0_F = u(0_E) \in u(E')\). Si \(y_1 = u(x_1)\) et \(y_2 = u(x_2)\) avec \(x_1, x_2 \in E'\), alors \(\lambda y_1 + \mu y_2 = u(\lambda x_1 + \mu x_2)\), et \(\lambda x_1 + \mu x_2 \in E'\).</p>
    <p><strong>Image réciproque.</strong> \(u(0_E) = 0_F \in F'\). Si \(u(x_1), u(x_2) \in F'\), alors \(u(\lambda x_1 + \mu x_2) = \lambda u(x_1) + \mu u(x_2) \in F'\).</p></div>
  </div>

  <div class="def-box">
    Le <strong>noyau</strong> et l'<strong>image</strong> de \(u \in \mathcal{L}(E, F)\) sont
    <div class="formula" data-nom="Noyau et image">$$\ker u = u^{-1}(\{0_F\}) = \{x \in E,\ u(x) = 0_F\}, \qquad \operatorname{Im} u = u(E).$$</div>
    D'après ce qui précède, \(\ker u\) est un sous-espace de \(E\) (espace de départ) et \(\operatorname{Im} u\) un sous-espace de \(F\) (espace d'arrivée).
  </div>

  <div class="prop-box">
    <strong>Théorème.</strong> \(u\) est injective si et seulement si \(\ker u = \{0_E\}\) ; \(u\) est surjective si et seulement si \(\operatorname{Im} u = F\). Si \((x_1, \ldots, x_n)\) est une famille génératrice de \(E\) (une base, par exemple), alors
    <div class="formula" data-nom="Image et famille génératrice">$$\operatorname{Im} u = \operatorname{Vect}\big(u(x_1), \ldots, u(x_n)\big).$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Injectivité et noyau ; image d'une famille génératrice.</span>
    <div class="content"><p>Si \(u\) est injective et \(u(x) = 0 = u(0)\), alors \(x = 0\). Réciproquement, si \(\ker u = \{0\}\) et \(u(x) = u(y)\), alors \(u(x - y) = 0\), donc \(x - y \in \ker u\), et \(x = y\).</p>
    <p>Tout \(x \in E\) s'écrit \(x = \sum \lambda_i x_i\), donc \(u(x) = \sum \lambda_i u(x_i)\) : \(\operatorname{Im} u \subset \operatorname{Vect}\big(u(x_i)\big)\). L'inclusion inverse vient de ce que \(\operatorname{Im} u\) est un sous-espace contenant chaque \(u(x_i)\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — noyau, image et une image réciproque dans \(\mathbb{R}^3\)</strong>
    <p>Soit \(u(x, y, z) = (x + y - z,\ x + 2y + z,\ 2x + 3y)\), linéaire de \(\mathbb{R}^3\) dans \(\mathbb{R}^3\).</p>
    <ol>
      <li><strong>Noyau.</strong> \(u(x, y, z) = 0\) : la 3ᵉ équation est la somme des deux premières ; leur différence donne \(y + 2z = 0\), d'où \(y = -2z\) et \(x = z - y = 3z\). Ainsi \(\ker u = \operatorname{Vect}\big((3, -2, 1)\big)\), une droite : \(u\) n'est pas injective.</li>
      <li><strong>Image.</strong> \(u(e_1) = (1, 1, 2)\), \(u(e_2) = (1, 2, 3)\), \(u(e_3) = (-1, 1, 0)\). Le vecteur \((3, -2, 1)\) du noyau donne la relation \(3u(e_1) - 2u(e_2) + u(e_3) = 0\) : \(u(e_3)\) est combinaison des deux autres, qui ne sont pas colinéaires. Donc \(\operatorname{Im} u = \operatorname{Vect}\big((1, 1, 2), (1, 2, 3)\big)\), un plan.</li>
      <li><strong>Équation du plan image.</strong> Les trois images vérifient \(z = x + y\) ; c'est donc le plan d'équation \(z = x + y\) : \(u\) n'est pas surjective.</li>
      <li><strong>Image réciproque de la droite \(D = \operatorname{Vect}\big((1, 1, 2)\big)\).</strong> Elle contient \(e_1\) (car \(u(e_1) \in D\)) et le noyau ; la résolution de \(u(x) = a\,(1, 1, 2)\) donne \(x = a\,e_1 + z\,(3, -2, 1)\). Donc \(u^{-1}(D) = \operatorname{Vect}\big(e_1, (3, -2, 1)\big)\), un plan qui contient \(\ker u\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : chercher l'image en résolvant \(u(x) = 0\), ou le noyau à partir des colonnes. Le noyau vit au <em>départ</em> (on résout une équation), l'image à l'<em>arrivée</em> (on engendre avec les images d'une base). Une image réciproque contient toujours le noyau, puisque \(0\) est dans tout sous-espace.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · RANG D'UNE FAMILLE, RANG D'UNE APPLICATION</div>
  <h2>Compter les directions vraiment différentes</h2>
  <div class="intro">Une famille de vecteurs peut en contenir beaucoup et n'engendrer qu'un petit espace : le rang compte les directions indépendantes. Appliqué aux images d'une base, il mesure la taille de l'image d'une application linéaire, et il ne peut que diminuer quand on compose.</div>

  <div class="def-box">
    Le <strong>rang</strong> d'une famille finie \((x_1, \ldots, x_n)\) est la dimension du sous-espace qu'elle engendre : \(\operatorname{rg}(x_1, \ldots, x_n) = \dim \operatorname{Vect}(x_1, \ldots, x_n)\). On a \(\operatorname{rg}(x_1, \ldots, x_n) \leq n\), avec égalité si et seulement si la famille est libre. Une application \(u \in \mathcal{L}(E, F)\) est <strong>de rang fini</strong> si \(\operatorname{Im} u\) est de dimension finie, et son rang est
    <div class="formula" data-nom="Rang d'une application linéaire">$$\operatorname{rg} u = \dim \operatorname{Im} u.$$</div>
  </div>
  <p>Si \((e_1, \ldots, e_p)\) est une base de \(E\), le §3 donne \(\operatorname{rg} u = \operatorname{rg}\big(u(e_1), \ldots, u(e_p)\big)\). Par conséquent \(\operatorname{rg} u \leq \dim E\), et \(\operatorname{rg} u \leq \dim F\) puisque \(\operatorname{Im} u \subset F\). On calcule un rang en éliminant les vecteurs combinaisons des autres (relations évidentes, ou pivot de Gauss sur les coordonnées : chapitre Calcul matriciel).</p>

  <div class="prop-box">
    <strong>Rang d'une composée.</strong> Si \(u \in \mathcal{L}(E, F)\) et \(v \in \mathcal{L}(F, G)\) sont de rang fini,
    <div class="formula" data-nom="Rang d'une composée">$$\operatorname{rg}(v \circ u) \leq \min(\operatorname{rg} u,\ \operatorname{rg} v).$$</div>
    Composer par un isomorphisme ne change pas le rang : si \(v\) est un isomorphisme, \(\operatorname{rg}(v \circ u) = \operatorname{rg} u\) ; si \(u\) est un isomorphisme, \(\operatorname{rg}(v \circ u) = \operatorname{rg} v\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Deux inclusions, et l'image d'un sous-espace de dimension finie.</span>
    <div class="content"><p>\(\operatorname{Im}(v \circ u) = v\big(\operatorname{Im} u\big) \subset \operatorname{Im} v\), d'où \(\operatorname{rg}(v \circ u) \leq \operatorname{rg} v\). De plus, si \((y_1, \ldots, y_r)\) est une base de \(\operatorname{Im} u\), les \(v(y_i)\) engendrent \(v(\operatorname{Im} u)\), d'où \(\operatorname{rg}(v \circ u) \leq r = \operatorname{rg} u\).</p>
    <p>Si \(v\) est un isomorphisme, il envoie la base \((y_i)\) sur une famille libre (si \(\sum \lambda_i v(y_i) = 0\), alors \(v\big(\sum \lambda_i y_i\big) = 0\), donc \(\sum \lambda_i y_i = 0\) et les \(\lambda_i\) sont nuls) : \(\operatorname{rg}(v \circ u) = r\). Si \(u\) est un isomorphisme, \(\operatorname{Im} u = F\), donc \(\operatorname{Im}(v \circ u) = v(F) = \operatorname{Im} v\).</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — un rang sans calcul, et une inégalité stricte</strong>
    <ol>
      <li>Dans \(\mathbb{R}^4\), soit \(x_1 = (1, 2, 0, 1)\), \(x_2 = (2, 1, 3, 0)\), \(x_3 = (0, 3, -3, 2)\), \(x_4 = (1, -1, 3, -1)\). On repère \(x_3 = 2x_1 - x_2\) et \(x_4 = x_2 - x_1\), alors que \(x_1\) et \(x_2\) ne sont pas colinéaires : \(\operatorname{rg}(x_1, x_2, x_3, x_4) = 2\). Les quatre vecteurs n'engendrent qu'un plan.</li>
      <li>L'application \(u\) du §3 a pour rang \(\operatorname{rg}\big(u(e_1), u(e_2), u(e_3)\big) = 2\).</li>
      <li>Dans \(\mathbb{R}^2\), \(p(x, y) = (x, 0)\) et \(q(x, y) = (0, y)\) sont de rang 1, mais \(q \circ p = 0\) est de rang 0 : l'inégalité peut être stricte, même quand \(\operatorname{rg} u = \operatorname{rg} v\).</li>
      <li>Conséquence utile : si \(u \in \mathcal{L}(\mathbb{R}^3, \mathbb{R}^2)\) et \(v \in \mathcal{L}(\mathbb{R}^2, \mathbb{R}^3)\), alors \(\operatorname{rg}(v \circ u) \leq 2\) : l'endomorphisme \(v \circ u\) de \(\mathbb{R}^3\) n'est <strong>jamais</strong> bijectif, quels que soient \(u\) et \(v\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DÉTERMINATION PAR L'IMAGE D'UNE BASE</div>
  <h2>Une base suffit à tout décider</h2>
  <div class="intro">En dimension finie, une application linéaire est entièrement connue dès qu'on connaît les images des vecteurs d'une base, et ces images peuvent être choisies librement. C'est ce qui permet de fabriquer des applications linéaires « sur mesure », de comparer des espaces par leur dimension et, au chapitre suivant, de représenter une application par une matrice.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \((e_1, \ldots, e_p)\) une base de \(E\) et \((f_1, \ldots, f_p)\) une famille quelconque de vecteurs de \(F\). Il existe une <strong>unique</strong> \(u \in \mathcal{L}(E, F)\) telle que \(u(e_j) = f_j\) pour tout \(j\) : c'est
    <div class="formula" data-nom="Application définie sur une base">$$u\Big(\sum_{j=1}^{p} x_j e_j\Big) = \sum_{j=1}^{p} x_j f_j.$$</div>
    De plus : \(u\) est injective ⟺ \((f_j)\) est libre ; \(u\) est surjective ⟺ \((f_j)\) engendre \(F\) ; \(u\) est un isomorphisme ⟺ \((f_j)\) est une base de \(F\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Existence, unicité, et les trois caractérisations.</span>
    <div class="content"><p><strong>Unicité.</strong> Une telle \(u\) vérifie forcément la formule, par linéarité. <strong>Existence.</strong> Les coordonnées \(x_j\) étant uniques, la formule définit bien une application ; elle est linéaire (les coordonnées de \(\lambda x + \mu y\) sont \(\lambda x_j + \mu y_j\)) et \(u(e_j) = f_j\).</p>
    <p>\(u(x) = 0\) s'écrit \(\sum x_j f_j = 0\) : le noyau est nul exactement quand cette relation force tous les \(x_j\) à être nuls, c'est-à-dire quand \((f_j)\) est libre. L'image est \(\operatorname{Vect}(f_j)\) (§3), égale à \(F\) exactement quand \((f_j)\) engendre \(F\). Le troisième point réunit les deux premiers.</p></div>
  </div>

  <div class="prop-box">
    <strong>Conséquences.</strong>
    <ul>
      <li>Deux applications linéaires égales sur une base sont égales.</li>
      <li>Deux espaces de dimension finie sont <strong>isomorphes</strong> (il existe un isomorphisme de l'un sur l'autre) si et seulement s'ils ont la même dimension. Ainsi \(\mathbb{K}_n[X]\) et \(\mathbb{K}^{n+1}\), ou \(\mathcal{M}_2(\mathbb{K})\) et \(\mathbb{K}^4\), sont isomorphes.</li>
      <li>Si \(\dim E = p\) et \(\dim F = n\), alors \(\dim \mathcal{L}(E, F) = np\) (une application est déterminée par \(p\) vecteurs de \(F\), soit \(np\) coordonnées ; la preuve est achevée avec les matrices, chapitre Calcul matriciel).</li>
    </ul>
  </div>

  <h3>Bases adaptées et applications définies par morceaux</h3>
  <div class="def-box">
    Si \(E\) est de dimension \(n\) et \(F\) un sous-espace de dimension \(r\), une <strong>base adaptée</strong> à \(F\) est une base \((e_1, \ldots, e_n)\) de \(E\) dont les \(r\) premiers vecteurs forment une base de \(F\) (elle existe : on complète une base de \(F\), théorème de la base incomplète). Si \(E = E_1 \oplus E_2\), la famille obtenue en mettant bout à bout une base de \(E_1\) et une base de \(E_2\) est une base de \(E\), dite <strong>adaptée à la décomposition</strong> \(E = E_1 \oplus E_2\).
  </div>
  <div class="prop-box">
    <strong>Recollement.</strong> Si \(E = E_1 \oplus E_2\), \(u_1 \in \mathcal{L}(E_1, F)\) et \(u_2 \in \mathcal{L}(E_2, F)\), il existe une unique \(u \in \mathcal{L}(E, F)\) qui coïncide avec \(u_1\) sur \(E_1\) et avec \(u_2\) sur \(E_2\) : en écrivant \(x = x_1 + x_2\) (décomposition unique), \(u(x) = u_1(x_1) + u_2(x_2)\).
  </div>
  <p>C'est exactement ainsi que seront définies les projections (\(u_1 = \mathrm{id}\), \(u_2 = 0\)) et les symétries (\(u_1 = \mathrm{id}\), \(u_2 = -\mathrm{id}\)) aux §8 et §9.</p>

  <div class="method-box">
    <strong>Exemple — retrouver une application à partir de deux images</strong>
    <p>On cherche \(u \in \mathcal{L}(\mathbb{R}^2)\) telle que \(u(1, 1) = (3, 1)\) et \(u(1, -1) = (1, -1)\).</p>
    <ol>
      <li>\((1, 1)\) et \((1, -1)\) ne sont pas colinéaires : c'est une base de \(\mathbb{R}^2\), donc \(u\) existe et est unique.</li>
      <li>On décompose : \((x, y) = a(1, 1) + b(1, -1)\) avec \(a = \frac{x + y}{2}\) et \(b = \frac{x - y}{2}\).</li>
      <li>Donc \(u(x, y) = a(3, 1) + b(1, -1)\), soit \(u(x, y) = (2x + y,\ y)\). Contrôle : \(u(1, 1) = (3, 1)\) et \(u(1, -1) = (1, -1)\).</li>
      <li>Les images \(u(e_1) = (2, 0)\) et \(u(e_2) = (1, 1)\) forment une base : \(u\) est un automorphisme (figure ci-dessus).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : imposer des images à une famille qui n'est pas une base. Si l'on impose \(u(1, 0) = (2, 3)\), \(u(0, 1) = (-1, 4)\) et \(u(1, 1) = (1, 8)\), aucune application linéaire ne convient, car la linéarité impose \(u(1, 1) = (1, 7)\). Imposer des images à une famille liée crée des conditions de compatibilité.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · THÉORÈME DU RANG</div>
  <h2>Ce qui est perdu dans le noyau se retrouve dans l'image</h2>
  <div class="intro">Le théorème du rang relie la taille du noyau à celle de l'image. Sa forme géométrique explique pourquoi : un supplémentaire du noyau est transporté sans perte sur l'image. Ses conséquences pratiques sont considérables : en dimension finie, pour une application entre espaces de même dimension, il suffit de vérifier l'injectivité pour obtenir la bijectivité.</div>

  <div class="prop-box">
    <strong>Forme géométrique du théorème du rang.</strong> Soit \(u \in \mathcal{L}(E, F)\) et \(S\) un supplémentaire de \(\ker u\) dans \(E\). Alors \(u\) induit un isomorphisme de \(S\) sur \(\operatorname{Im} u\) : l'application \(S \to \operatorname{Im} u\), \(x \mapsto u(x)\), est bijective.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Injective sur S, et surjective sur l'image.</span>
    <div class="content"><p><strong>Injectivité.</strong> Si \(x \in S\) et \(u(x) = 0\), alors \(x \in S \cap \ker u = \{0\}\).</p>
    <p><strong>Surjectivité.</strong> Soit \(y = u(x) \in \operatorname{Im} u\). On décompose \(x = s + k\) avec \(s \in S\), \(k \in \ker u\) ; alors \(y = u(s) + u(k) = u(s)\), avec \(s \in S\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Théorème du rang.</strong> Si \(E\) est de dimension finie et \(u \in \mathcal{L}(E, F)\), alors \(u\) est de rang fini et
    <div class="formula" data-nom="Théorème du rang">$$\dim E = \dim \ker u + \operatorname{rg} u.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Choisir un supplémentaire du noyau.</span>
    <div class="content"><p>En dimension finie, \(\ker u\) admet un supplémentaire \(S\), et \(\dim S = \dim E - \dim \ker u\). La forme géométrique donne un isomorphisme de \(S\) sur \(\operatorname{Im} u\) : ces deux espaces ont la même dimension (§5), d'où \(\operatorname{rg} u = \dim E - \dim \ker u\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Corollaires.</strong> Soit \(E\) et \(F\) de dimension finie <strong>égale</strong>, et \(u \in \mathcal{L}(E, F)\). Alors
    <div class="formula">$$u \text{ injective} \iff u \text{ surjective} \iff u \text{ bijective},$$</div>
    et ces trois propriétés équivalent à \(\operatorname{rg} u = \dim E\).
    En particulier, un endomorphisme d'un espace de dimension finie qui est inversible à gauche (\(v \circ u = \mathrm{id}\)) ou à droite (\(u \circ v = \mathrm{id}\)) est inversible, et \(v = u^{-1}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tout se lit sur la formule du rang.</span>
    <div class="content"><p>\(u\) injective ⟺ \(\dim \ker u = 0\) ⟺ \(\operatorname{rg} u = \dim E = \dim F\) ⟺ \(\operatorname{Im} u = F\) (un sous-espace de même dimension finie que \(F\) est égal à \(F\)) ⟺ \(u\) surjective.</p>
    <p>Si \(v \circ u = \mathrm{id}\), alors \(u(x) = 0\) entraîne \(x = v(u(x)) = 0\) : \(u\) est injective, donc bijective, et \(v = v \circ u \circ u^{-1} = u^{-1}\). Si \(u \circ v = \mathrm{id}\), alors \(u\) est surjective (tout \(y\) vaut \(u(v(y))\)), donc bijective.</p></div>
  </div>

  <div class="method-box">
    <strong>Exemple — l'opérateur de différence sur \(\mathbb{R}_3[X]\)</strong>
    <p>Soit \(\Delta(P) = P(X + 1) - P(X)\), endomorphisme de \(E = \mathbb{R}_3[X]\) (de dimension 4).</p>
    <ol>
      <li><strong>Noyau.</strong> Si \(\Delta(P) = 0\), alors \(P(n) = P(0)\) pour tout entier \(n \geq 0\) : le polynôme \(P - P(0)\) a une infinité de racines, il est nul. Donc \(\ker \Delta\) est la droite des constantes.</li>
      <li><strong>Rang.</strong> \(\operatorname{rg} \Delta = 4 - 1 = 3\).</li>
      <li><strong>Image.</strong> Si \(\deg P = k \geq 1\), le terme en \(X^k\) disparaît dans \(P(X + 1) - P(X)\) : \(\operatorname{Im} \Delta \subset \mathbb{R}_2[X]\). Les deux espaces ont la même dimension 3, donc \(\operatorname{Im} \Delta = \mathbb{R}_2[X]\), sans aucun calcul d'antécédent.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — l'interpolation par le théorème du rang</strong>
    <p>Soit \(\psi : \mathbb{R}_2[X] \to \mathbb{R}^3\), \(P \mapsto \big(P(0), P(1), P(2)\big)\), linéaire entre deux espaces de dimension 3.</p>
    <ol>
      <li>Si \(\psi(P) = 0\), le polynôme \(P\), de degré au plus 2, a trois racines : \(P = 0\). Donc \(\psi\) est injective.</li>
      <li>Même dimension : \(\psi\) est bijective. Pour toutes valeurs \((a, b, c)\), il existe un unique \(P \in \mathbb{R}_2[X]\) tel que \(P(0) = a\), \(P(1) = b\), \(P(2) = c\).</li>
      <li>Avec \((a, b, c) = (1, 3, 9)\), on pose \(P = 1 + \beta X + \gamma X^2\) : \(1 + \beta + \gamma = 3\) et \(1 + 2\beta + 4\gamma = 9\) donnent \(\gamma = 2\), \(\beta = 0\), soit \(P = 2X^2 + 1\).</li>
    </ol>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire que le théorème du rang affirme \(E = \ker u \oplus \operatorname{Im} u\). D'abord, cela n'a de sens que pour un endomorphisme ; ensuite c'est faux en général. Pour l'application \(u\) du §3, \(\dim \ker u + \operatorname{rg} u = 1 + 2 = 3\), et pourtant \((3, -2, 1)\) vérifie \(z = x + y\) : \(\ker u \subset \operatorname{Im} u\), et \(\ker u + \operatorname{Im} u\) n'est qu'un plan. Pour \(N(x, y) = (y, 0)\), on a même \(\ker N = \operatorname{Im} N\).</div>
  <div class="notice"><strong>En dimension infinie, tout s'écroule</strong> : sur \(\mathbb{R}[X]\), la dérivation \(D\) est surjective mais pas injective (\(\ker D\) = constantes), et \(I : P \mapsto \int_0^X P(t)\,\mathrm{d}t\) est injective mais pas surjective (ses images s'annulent en 0). On a \(D \circ I = \mathrm{id}\), mais \(I \circ D\,(P) = P - P(0)\) : \(D\) est inversible à droite sans être inversible.</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · ÉQUATIONS LINÉAIRES</div>
  <h2>Une solution particulière plus le noyau</h2>
  <div class="intro">Système linéaire, équation différentielle linéaire, suite arithmético-géométrique, recherche d'un polynôme : tous ces problèmes s'écrivent \(u(x) = a\), avec \(u\) linéaire. Un seul théorème décrit l'ensemble des solutions, et explique la règle « solution générale = solution particulière + solution générale de l'équation homogène » rencontrée au premier semestre.</div>

  <div class="def-box">
    Une <strong>équation linéaire</strong> est une équation d'inconnue \(x \in E\) de la forme \(u(x) = a\), où \(u \in \mathcal{L}(E, F)\) et \(a \in F\) sont donnés. L'équation \(u(x) = 0\) est l'<strong>équation homogène associée</strong> ; ses solutions forment \(\ker u\).
  </div>
  <div class="prop-box">
    <strong>Théorème (structure des solutions).</strong> L'équation \(u(x) = a\) a des solutions si et seulement si \(a \in \operatorname{Im} u\). Dans ce cas, si \(x_0\) est une solution particulière, l'ensemble des solutions est
    <div class="formula" data-nom="Solutions d'une équation linéaire">$$x_0 + \ker u = \{x_0 + k,\ k \in \ker u\}.$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Soustraire la solution particulière.</span>
    <div class="content"><p>La première affirmation est la définition de \(\operatorname{Im} u\). Si \(u(x_0) = a\), alors pour tout \(x \in E\) :</p>
    <div class="formula">$$u(x) = a \iff u(x) = u(x_0) \iff u(x - x_0) = 0 \iff x - x_0 \in \ker u.$$</div></div>
  </div>
  <p>Géométriquement, l'ensemble des solutions est un « sous-espace translaté » : la figure du §6 le montre, chaque droite parallèle à \(\ker u\) étant l'ensemble des solutions d'une équation \(u(x) = a\). En particulier, si \(u\) est injective, l'équation a au plus une solution ; si \(u\) est bijective, exactement une.</p>

  <div class="method-box">
    <strong>Exemple — quatre équations, une seule structure</strong>
    <ol>
      <li><strong>Système.</strong> \(x + y + z = 6\), \(x - y + 2z = 3\). La différence donne \(2y - z = 3\), d'où \(z = 2y - 3\) et \(x = 9 - 3y\) : les solutions sont \((9, 0, -3) + y\,(-3, 1, 2)\), \(y \in \mathbb{R}\). Le vecteur \((-3, 1, 2)\) engendre le noyau (solutions du système homogène).</li>
      <li><strong>Équation différentielle.</strong> \(y' + 2y = 6\) sur \(\mathbb{R}\) : \(u(y) = y' + 2y\) est linéaire de \(\mathcal{C}^1\) dans \(\mathcal{C}^0\), \(\ker u = \{t \mapsto \lambda e^{-2t}\}\) et la constante 3 est solution. Solutions : \(y(t) = 3 + \lambda e^{-2t}\).</li>
      <li><strong>Suite arithmético-géométrique.</strong> \(u_{n+1} = 2u_n - 3\), \(u_0 = 5\). L'application \((u_n) \mapsto (u_{n+1} - 2u_n)\) est linéaire, son noyau est formé des suites géométriques \((\lambda 2^n)\), et la suite constante égale à 3 est solution. Donc \(u_n = 3 + \lambda 2^n\), puis \(\lambda = 2\) : \(u_n = 3 + 2^{n+1}\).</li>
      <li><strong>Polynômes.</strong> Avec \(\Delta\) du §6, résoudre \(\Delta(P) = X^2\) dans \(\mathbb{R}_3[X]\). Comme \(X^2 \in \mathbb{R}_2[X] = \operatorname{Im} \Delta\), il y a des solutions ; on vérifie que \(P_0 = \frac{1}{6}(2X^3 - 3X^2 + X)\) en est une. Toutes les solutions : \(P_0 + c\), \(c \in \mathbb{R}\).</li>
    </ol>
    <p>Bénéfice : en sommant \(P_0(k + 1) - P_0(k) = k^2\) pour \(k = 0, \ldots, n\), les termes se télescopent :</p>
    <div class="formula">$$\sum_{k=0}^{n} k^2 = P_0(n + 1) - P_0(0) = \frac{n(n + 1)(2n + 1)}{6}.$$</div>
  </div>

  <h3>Dimension des espaces de solutions homogènes</h3>
  <p>Un isomorphisme conserve la dimension (§5). Le théorème de Cauchy dit précisément que certaines applications « conditions initiales » sont des isomorphismes :</p>
  <div class="prop-box">
    <ul>
      <li>Les solutions sur un intervalle \(I\) de \(y' + a(t)\,y = 0\) (\(a\) continue) forment une droite vectorielle.</li>
      <li>Les solutions de \(y'' + a y' + b y = 0\) (\(a, b\) constants) forment un plan : \(y \mapsto \big(y(0), y'(0)\big)\) est un isomorphisme de l'espace des solutions sur \(\mathbb{K}^2\).</li>
      <li>Les suites vérifiant \(u_{n+2} = a u_{n+1} + b u_n\) forment un plan : \((u_n) \mapsto (u_0, u_1)\) est un isomorphisme sur \(\mathbb{K}^2\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — deux solutions indépendantes suffisent</strong>
    <p>Pour \(u_{n+2} = u_{n+1} + 2u_n\) : l'équation \(r^2 = r + 2\) a pour racines \(2\) et \(-1\), donc \((2^n)\) et \(\big((-1)^n\big)\) sont solutions ; elles ne sont pas proportionnelles, et l'espace des solutions est de dimension 2 : c'en est une base. Avec \(u_0 = 0\), \(u_1 = 3\) : \(u_n = \alpha 2^n + \beta(-1)^n\), \(\alpha + \beta = 0\), \(2\alpha - \beta = 3\), d'où \(u_n = 2^n - (-1)^n\).</p>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : additionner deux solutions de \(u(x) = a\) en espérant obtenir une solution. Si \(a \neq 0\), l'ensemble des solutions n'est pas un sous-espace : la somme de deux solutions est solution de \(u(x) = 2a\). Seule la différence de deux solutions est dans \(\ker u\).</div>
</div>

<div class="course-section">
  <div class="sec-num">§8 · PROJECTEURS</div>
  <h2>Garder une composante, oublier l'autre</h2>
  <div class="intro">Une décomposition \(E = F \oplus G\) coupe chaque vecteur en deux morceaux, l'un dans \(F\), l'autre dans \(G\). Garder le premier et oublier le second, c'est projeter sur \(F\) parallèlement à \(G\). Les projecteurs sont les endomorphismes les plus simples après les homothéties, et ils seront les premiers exemples de la réduction en 2ᵉ année (chapitre Projecteurs et symétries).</div>

  <div class="def-box">
    Soit \(E = F \oplus G\). Tout \(x \in E\) s'écrit de façon unique \(x = x_F + x_G\) avec \(x_F \in F\) et \(x_G \in G\). La <strong>projection</strong> (ou le <strong>projecteur</strong>) sur \(F\) parallèlement à \(G\) est l'application \(p : x \mapsto x_F\).
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> \(p\) est un endomorphisme de \(E\) (c'est le recollement du §5 de \(\mathrm{id}_F\) et de \(0\) sur \(G\)), et
    <ul>
      <li>\(\operatorname{Im} p = F = \ker(p - \mathrm{id})\) : les vecteurs de \(F\) sont exactement les vecteurs invariants ;</li>
      <li>\(\ker p = G\) ;</li>
      <li>\(p \circ p = p\) ;</li>
      <li>\(q = \mathrm{id} - p\) est la projection sur \(G\) parallèlement à \(F\) (<strong>projecteur associé</strong>), et \(p \circ q = q \circ p = 0\).</li>
    </ul>
  </div>

</figure>

  <div class="prop-box">
    <strong>Théorème (caractérisation).</strong> Soit \(p \in \mathcal{L}(E)\) tel que \(p \circ p = p\). Alors
    <div class="formula" data-nom="Projecteur">$$E = \operatorname{Im} p \oplus \ker p, \qquad \operatorname{Im} p = \ker(p - \mathrm{id}),$$</div>
    et \(p\) est la projection sur \(\operatorname{Im} p\) parallèlement à \(\ker p\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Écrire \(x = p(x) + \big(x - p(x)\big)\).</span>
    <div class="content"><p><strong>Vecteurs invariants.</strong> Si \(y = p(z)\), alors \(p(y) = p^2(z) = p(z) = y\) ; réciproquement, un vecteur invariant est l'image de lui-même. Donc \(\operatorname{Im} p = \ker(p - \mathrm{id})\).</p>
    <p><strong>Somme.</strong> \(x = p(x) + \big(x - p(x)\big)\) avec \(p(x) \in \operatorname{Im} p\) et \(p\big(x - p(x)\big) = p(x) - p^2(x) = 0\).</p>
    <p><strong>Somme directe.</strong> Si \(y \in \operatorname{Im} p \cap \ker p\), alors \(y = p(y) = 0\).</p>
    <p><strong>Conclusion.</strong> La décomposition de \(x\) est \(\big(p(x),\ x - p(x)\big)\), donc la projection sur \(\operatorname{Im} p\) parallèlement à \(\ker p\) envoie \(x\) sur \(p(x)\).</p></div>
  </div>

  <div class="prop-box">
    <strong>Matrice dans une base adaptée.</strong> Si \(\dim E = n\), \(\dim F = r\) et \(\mathcal{B}\) est adaptée à \(E = F \oplus G\), la matrice de \(p\) dans \(\mathcal{B}\) est diagonale, avec \(r\) coefficients 1 puis \(n - r\) coefficients 0 :
    <div class="formula">$$\operatorname{Mat}_{\mathcal{B}}(p) = \begin{pmatrix} I_r & 0 \\ 0 & 0 \end{pmatrix}.$$</div>
    En particulier \(\operatorname{rg} p = r = \dim F\).
  </div>

  <div class="method-box">
    <strong>Exemple — dans le plan</strong>
    <p>\(F = \operatorname{Vect}\big((2, 1)\big)\), \(G = \operatorname{Vect}\big((-1, 1)\big)\) : les deux vecteurs ne sont pas colinéaires, donc \(\mathbb{R}^2 = F \oplus G\).</p>
    <ol>
      <li>Décomposition : \((x_1, x_2) = \alpha(2, 1) + \beta(-1, 1)\) donne \(\alpha = \frac{x_1 + x_2}{3}\), \(\beta = \frac{2x_2 - x_1}{3}\).</li>
      <li>Donc \(p(x_1, x_2) = \frac{x_1 + x_2}{3}\,(2, 1)\), de matrice \(\frac{1}{3}\begin{pmatrix} 2 & 2 \\ 1 & 1 \end{pmatrix}\) dans la base canonique.</li>
      <li>Pour \(x = (1, 2)\) : \(\alpha = 1\), \(p(x) = (2, 1)\) et \(x - p(x) = (-1, 1) \in G\), comme sur la figure.</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — sur un plan de l'espace, parallèlement à une droite</strong>
    <p>Dans \(\mathbb{R}^3\), soit \(F\) le plan \(x + 2y - z = 0\) et \(G = \operatorname{Vect}(a)\), \(a = (1, 1, 1)\). Notons \(\varphi(x, y, z) = x + 2y - z\) ; \(\varphi(a) = 2 \neq 0\), donc \(a \notin F\) et \(\mathbb{R}^3 = F \oplus G\).</p>
    <ol>
      <li>On cherche \(p(x) = x - \lambda a\) dans \(F\) : \(\varphi(x) - \lambda\,\varphi(a) = 0\), donc \(\lambda = \frac{\varphi(x)}{2}\) et \(p(x) = x - \frac{\varphi(x)}{2}\,a\).</li>
      <li>Matrice dans la base canonique (colonne \(j\) = image de \(e_j\)) :</li>
    </ol>
    <div class="formula">$$A = \frac{1}{2}\begin{pmatrix} 1 & -2 & 1 \\ -1 & 0 & 1 \\ -1 & -2 & 3 \end{pmatrix}, \qquad A^2 = A.$$</div>
    <ol start="3">
      <li>Pour \(x = (1, 2, 3)\) : \(\varphi(x) = 2\), \(p(x) = (0, 1, 2)\), qui vérifie bien \(0 + 2 - 2 = 0\), et \(x - p(x) = (1, 1, 1) \in G\).</li>
      <li>Base adaptée : \(f_1 = (1, 0, 1)\) et \(f_2 = (2, -1, 0)\) sont dans \(F\) et non colinéaires, \((f_1, f_2, a)\) est une base de \(\mathbb{R}^3\), et la matrice de \(p\) y vaut \(\operatorname{diag}(1, 1, 0)\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§9 · SYMÉTRIES</div>
  <h2>Garder une composante, retourner l'autre</h2>
  <div class="intro">Au lieu d'oublier la composante sur \(G\), on peut la changer en son opposée : c'est la symétrie par rapport à \(F\) parallèlement à \(G\). Elle se déduit de la projection, et sa caractérisation \(s \circ s = \mathrm{id}\) fournit gratuitement des décompositions célèbres : fonctions paires et impaires, matrices symétriques et antisymétriques.</div>

  <div class="def-box">
    Soit \(E = F \oplus G\) et \(x = x_F + x_G\). La <strong>symétrie</strong> par rapport à \(F\) parallèlement à \(G\) est \(s : x \mapsto x_F - x_G\). Si \(p\) est la projection sur \(F\) parallèlement à \(G\),
    <div class="formula" data-nom="Symétrie et projection">$$s = 2p - \mathrm{id}, \qquad p = \tfrac{1}{2}\,(s + \mathrm{id}).$$</div>
  </div>
  <div class="prop-box">
    <strong>Propriétés.</strong> \(s\) est un endomorphisme (recollement de \(\mathrm{id}_F\) et de \(-\mathrm{id}_G\)), \(s \circ s = \mathrm{id}\) (donc \(s\) est un automorphisme égal à sa réciproque), \(F = \ker(s - \mathrm{id})\) est l'ensemble des vecteurs invariants et \(G = \ker(s + \mathrm{id})\) celui des vecteurs changés en leur opposé.
  </div>

  <div class="prop-box">
    <strong>Théorème (caractérisation).</strong> Soit \(s \in \mathcal{L}(E)\) tel que \(s \circ s = \mathrm{id}\). Alors
    <div class="formula" data-nom="Symétrie">$$E = \ker(s - \mathrm{id}) \oplus \ker(s + \mathrm{id}),$$</div>
    et \(s\) est la symétrie par rapport à \(\ker(s - \mathrm{id})\) parallèlement à \(\ker(s + \mathrm{id})\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Se ramener à un projecteur.</span>
    <div class="content"><p>Posons \(p = \frac{1}{2}(s + \mathrm{id})\). Comme \(s^2 = \mathrm{id}\), \(p^2 = \frac{1}{4}(s^2 + 2s + \mathrm{id}) = \frac{1}{4}(2s + 2\,\mathrm{id}) = p\) : \(p\) est un projecteur (§8). De plus \(p(x) = x \iff s(x) = x\) et \(p(x) = 0 \iff s(x) = -x\), donc \(\operatorname{Im} p = \ker(s - \mathrm{id})\) et \(\ker p = \ker(s + \mathrm{id})\), qui sont supplémentaires. Enfin \(s = 2p - \mathrm{id}\) est bien la symétrie associée à cette décomposition. (On divise par 2 : c'est possible car \(\mathbb{K} = \mathbb{R}\) ou \(\mathbb{C}\).)</p></div>
  </div>

  <div class="prop-box">
    <strong>Matrice dans une base adaptée.</strong> Avec les notations du §8, dans une base adaptée à \(E = F \oplus G\) :
    <div class="formula">$$\operatorname{Mat}_{\mathcal{B}}(s) = \begin{pmatrix} I_r & 0 \\ 0 & -I_{n-r} \end{pmatrix}.$$</div>
  </div>

  <div class="method-box">
    <strong>Exemple — symétries du plan et de l'espace</strong>
    <ol>
      <li>Dans le plan, avec \(F\) et \(G\) de l'exemple du §8 : \(s = 2p - \mathrm{id}\) a pour matrice \(\frac{1}{3}\begin{pmatrix} 1 & 4 \\ 2 & -1 \end{pmatrix}\), et l'on vérifie que son carré vaut \(I_2\). Pour \(x = (1, 2)\), \(s(x) = 2(2, 1) - (1, 2) = (3, 0)\) : le milieu de \(x\) et de \(s(x)\) est \(p(x) = (2, 1)\), sur \(F\).</li>
      <li>Dans l'espace, avec le plan \(F : x + 2y - z = 0\) et \(G = \operatorname{Vect}\big((1, 1, 1)\big)\) :</li>
    </ol>
    <div class="formula">$$S = 2A - I_3 = \begin{pmatrix} 0 & -2 & 1 \\ -1 & -1 & 1 \\ -1 & -2 & 2 \end{pmatrix}, \qquad S^2 = I_3.$$</div>
    <ol start="3">
      <li>Contrôle : les trois lignes de \(S - I_3\) sont égales à \((-1, -2, 1)\), donc \(\ker(S - I_3)\) est le plan \(x + 2y - z = 0\) ; et \(S\,(1, 1, 1) = (-1, -1, -1)\). Pour \(x = (1, 2, 3)\), \(s(x) = (-1, 0, 1)\) (figure du §8).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Exemple — deux décompositions célèbres</strong>
    <ol>
      <li>Sur l'espace des fonctions de \(\mathbb{R}\) dans \(\mathbb{R}\), \(s(f) : x \mapsto f(-x)\) vérifie \(s \circ s = \mathrm{id}\). Ses vecteurs invariants sont les fonctions paires, ses vecteurs changés en leur opposé les fonctions impaires : tout \(f\) s'écrit de façon unique comme somme d'une fonction paire et d'une fonction impaire, \(f(x) = \frac{f(x) + f(-x)}{2} + \frac{f(x) - f(-x)}{2}\). Pour l'exponentielle : \(e^x = \operatorname{ch} x + \operatorname{sh} x\).</li>
      <li>Sur \(\mathcal{M}_n(\mathbb{K})\), la transposition \(A \mapsto A^\top\) vérifie \(s \circ s = \mathrm{id}\) : \(\mathcal{M}_n(\mathbb{K}) = \mathcal{S}_n(\mathbb{K}) \oplus \mathcal{A}_n(\mathbb{K})\) (matrices symétriques et antisymétriques), avec \(A = \frac{A + A^\top}{2} + \frac{A - A^\top}{2}\). Par exemple :</li>
    </ol>
    <div class="formula">$$\begin{pmatrix} 1 & 4 \\ 2 & 3 \end{pmatrix} = \begin{pmatrix} 1 & 3 \\ 3 & 3 \end{pmatrix} + \begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}.$$</div>
  </div>

  <div class="notice"><strong>Erreur classique</strong> : croire qu'une symétrie est forcément un « miroir » orthogonal, ou que \(s^2 = \mathrm{id}\) force \(s = \pm\mathrm{id}\). Les symétries de ce paragraphe sont en général obliques (figure ci-dessus) et n'ont aucune raison d'être \(\pm\mathrm{id}\). Le simulateur du chapitre (onglet Simulateur) montre l'action de quelques projecteurs et symétries du plan sur un dessin.</div>
</div>
