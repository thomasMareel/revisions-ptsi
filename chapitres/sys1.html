<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre le modèle du premier ordre, au semestre S1 (modèle de connaissance, réponses temporelles) puis S2 (identification, validation, performances) du programme de sciences industrielles : compétences B2 « Modéliser », B3 « Valider un modèle », C2 « Résoudre » et D2 « Expérimenter ». Il s'appuie sur <a href="#slci/cours">« SLCI : modélisation et transformée de Laplace »</a> (fonction de transfert, table des transformées, théorèmes du retard et de la valeur finale). La réponse fréquentielle n'y est vue que pour le premier ordre : le tracé des diagrammes de Bode est dans <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a>, les performances d'un asservissement dans <a href="#precision/cours">« Performances : précision et rapidité »</a>. <strong>Tout est exigible en 1ʳᵉ année</strong>, sauf la dernière section.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Établir un modèle de connaissance par des fonctions de transfert</strong> (B2, S1) : équation différentielle, forme canonique \(\dfrac{K}{1 + \tau p}\), gain statique, constante de temps, pôle (§1).</li>
        <li><strong>Modéliser le signal d'entrée</strong> (B2, S1) : échelon (§2), rampe et impulsion (§3), sinusoïde (§4).</li>
        <li><strong>Déterminer la réponse temporelle</strong> (C2, S1) : expression de la réponse à un échelon (§2) ; allures des réponses à une impulsion, à une rampe (§3) et à une sinusoïde en régime permanent (§4). Le programme précise que la résolution des équations différentielles et les transformées inverses de Laplace ne sont pas exigibles : les calculs du chapitre sont donnés pour comprendre d'où viennent les résultats à retenir.</li>
        <li><strong>Déterminer la réponse fréquentielle</strong> (C2, S2) : diagrammes de Bode réel et asymptotique d'un premier ordre (§4 ; méthode générale dans <a href="#bode/cours">« Bode »</a>, §2 et §3).</li>
        <li><strong>Établir un modèle de comportement à partir d'une réponse temporelle ou fréquentielle</strong> (B2, S2) : identification de \(K\) et \(\tau\) (§5) ; modèles voisins, gain, intégrateur, retard (§7).</li>
        <li><strong>Choisir les entrées à imposer et les sorties pour identifier un modèle de comportement</strong> (D2, S2) : §5.</li>
        <li><strong>Vérifier la cohérence du modèle en confrontant les résultats analytiques ou numériques aux résultats expérimentaux</strong> (B3, S2) : §8, avec une simulation par la méthode d'Euler (lien avec l'informatique).</li>
        <li><strong>Critères de performances</strong> (C1, C2, S2) : temps de réponse à 5 %, temps de montée (§2), bande passante (§4), écart statique et écart de traînage d'un premier ordre bouclé (§3, §6 ; cas général dans <a href="#precision/cours">« Performances »</a>, §2).</li>
      </ul>
      <p>Relève de la 2ᵉ année : la linéarisation autour d'un point de fonctionnement et la réduction de l'ordre d'un modèle par les pôles dominants (S3), les non-linéarités et les limites de validité d'un modèle (S4). Pour aller plus loin (fin de chapitre) : linéariser un réservoir, identifier \(\tau\) par une régression linéaire.</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · LE MODÈLE DU PREMIER ORDRE</div>
  <h2>Deux paramètres : un gain et une constante de temps</h2>
  <div class="intro">Un système du premier ordre accumule une grandeur (charge d'un condensateur, énergie thermique, volume de liquide, énergie cinétique d'un rotor) et la restitue en proportion de ce qu'il contient. Il réagit sans à-coup et sans dépassement, à une vitesse fixée par une seule durée caractéristique. C'est le modèle le plus utilisé de l'automatique, souvent comme première approximation d'un système plus complexe.</div>
  <div class="def-box">
    Un système du <strong>premier ordre</strong> est régi par
    <div class="formula" data-nom="Équation du premier ordre">$$\tau\,\frac{ds}{dt} + s(t) = K\,e(t),$$</div>
    soit, sous conditions initiales nulles,
    <div class="formula" data-nom="FT du premier ordre">$$H(p) = \frac{S(p)}{E(p)} = \frac{K}{1 + \tau p}.$$</div>
    \(K\) est le <strong>gain statique</strong> (unité de \(s\) sur unité de \(e\)), \(\tau\) la <strong>constante de temps</strong> (en secondes). L'unique pôle vaut \(-1/\tau\) : il est négatif, le système est stable.
  </div>
  <div style="overflow-x:auto"><table>
    <tr><th>Système</th><th>Entrée → sortie</th><th>Gain \(K\)</th><th>Constante de temps \(\tau\)</th></tr>
    <tr><td>Circuit RC</td><td>tension d'entrée → tension du condensateur</td><td>1</td><td>\(RC\)</td></tr>
    <tr><td>Enceinte chauffée</td><td>puissance → écart de température</td><td>\(R_{th}\)</td><td>\(R_{th}C\)</td></tr>
    <tr><td>Moteur à courant continu (\(L\) négligée)</td><td>tension → vitesse</td><td>\(\dfrac{k}{Rf + k^2}\)</td><td>\(\dfrac{RJ}{Rf + k^2}\)</td></tr>
    <tr><td>Réservoir linéarisé (2ᵉ année)</td><td>débit → niveau</td><td>\(\dfrac{2\sqrt{h_0}}{k}\)</td><td>\(\dfrac{2S\sqrt{h_0}}{k}\)</td></tr>
  </table></div>
  <p>Dans le tableau, \(R_{th}\) est la résistance thermique des parois (K/W) et \(C\) la capacité thermique de l'enceinte (J/K) ; pour le moteur, \(R\) est la résistance de l'induit, \(k\) la constante de couple, \(J\) l'inertie et \(f\) le coefficient de frottement visqueux. Le réservoir n'est un premier ordre qu'après linéarisation autour d'un niveau \(h_0\) (voir la fin du chapitre).</p>
  <div class="method-box">
    <strong>Exemple — mettre un modèle sous forme canonique</strong>
    <p>Un système obéit à \(0{,}4\,s'(t) + 2\,s(t) = 5\,e(t)\).</p>
    <ol>
      <li>La forme canonique exige le coefficient 1 devant \(s\) : on divise par 2, d'où \(0{,}2\,s' + s = 2{,}5\,e\).</li>
      <li>Par identification : \(K = 2{,}5\) et \(\tau = 0{,}2\ \text{s}\) ; \(H(p) = \dfrac{2{,}5}{1 + 0{,}2p}\), pôle \(-5\ \text{s}^{-1}\).</li>
      <li>En Laplace, la même règle s'applique : \(\dfrac{5}{2 + 0{,}4p} = \dfrac{2{,}5}{1 + 0{,}2p}\) (on divise numérateur et dénominateur par le terme constant du dénominateur).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un moteur à courant continu</strong>
    <p>Un moteur a pour résistance d'induit \(R = 2\ \Omega\), constante \(k = 0{,}1\ \text{V}\cdot\text{s}\cdot\text{rad}^{-1}\) (ou N·m/A), inertie ramenée \(J = 2\times10^{-3}\ \text{kg}\cdot\text{m}^2\), frottement visqueux \(f = 10^{-3}\ \text{N}\cdot\text{m}\cdot\text{s}\cdot\text{rad}^{-1}\) ; on néglige son inductance.</p>
    <ol>
      <li>\(Rf + k^2 = 0{,}002 + 0{,}01 = 0{,}012\ \text{N}\cdot\text{m}\cdot\text{s}\cdot\text{rad}^{-1}\cdot\Omega\).</li>
      <li>\(K = \dfrac{k}{Rf + k^2} = 8{,}33\ \text{rad}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\) et \(\tau = \dfrac{RJ}{Rf + k^2} = 0{,}333\ \text{s}\).</li>
      <li>Sous 12 V, la vitesse tend vers \(12K = 100\ \text{rad/s}\), soit 955 tr/min, et l'atteint à 5 % près au bout de \(3\tau = 1{,}0\ \text{s}\).</li>
    </ol>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi le moteur est un premier ordre</span>
    <div class="content">
      <p>Équation électrique (inductance négligée) : \(u = Ri + k\,\Omega\). Équation mécanique : \(J\,\dfrac{d\Omega}{dt} = k\,i - f\,\Omega\). On élimine \(i = (u - k\Omega)/R\) : \(J\,\Omega' = \dfrac{k}{R}\,(u - k\,\Omega) - f\,\Omega\), soit \(RJ\,\Omega' + (Rf + k^2)\,\Omega = k\,u\). On divise par \(Rf + k^2\) pour obtenir la forme canonique \(\tau\,\Omega' + \Omega = K\,u\), avec les valeurs du tableau.</p>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : lire \(K\) et \(\tau\) sans avoir mis le terme constant du dénominateur à 1. Dans \(\dfrac{5}{2 + p}\), le gain n'est pas 5 mais 2,5, et la constante de temps n'est pas 1 s mais 0,5 s. Contrôler aussi les unités : \(\tau\) en secondes, \(K\) en unité de sortie par unité d'entrée.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · LA RÉPONSE INDICIELLE</div>
  <h2>Une montée exponentielle sans dépassement</h2>
  <div class="intro">La réponse à un échelon est l'essai de référence : on l'obtient en basculant brusquement l'entrée d'une valeur constante à une autre (on ferme un interrupteur, on change une consigne). Son expression est <strong>à connaître</strong> ; c'est sur elle que se lisent le gain, la rapidité et l'absence de dépassement.</div>
  <div class="prop-box">
    Pour un échelon d'amplitude \(E_0\) : \(S(p) = \dfrac{K E_0}{p\,(1 + \tau p)} = K E_0\Big(\dfrac{1}{p} - \dfrac{1}{p + 1/\tau}\Big)\), donc
    <div class="formula" data-nom="Réponse indicielle du premier ordre">$$s(t) = K E_0\big(1 - e^{-t/\tau}\big)\quad (t \geq 0).$$</div>
    <ul>
      <li>valeur finale \(K E_0\), atteinte sans dépassement ;</li>
      <li>pente à l'origine \(K E_0/\tau\) : la <strong>tangente à l'origine</strong> atteint la valeur finale à \(t = \tau\) ;</li>
      <li>à \(t = \tau\), \(s = 63\ \%\) de la valeur finale ; à \(2\tau\), 86 % ; à \(3\tau\), 95 % ; à \(5\tau\), 99 % ;</li>
      <li><strong>temps de réponse à 5 %</strong> : \(t_{r5\%} = \tau\ln 20 \approx 3\tau\).</li>
    </ul>
  </div>

  <h3>Temps de réponse et temps de montée</h3>
  <p>La sortie atteint la fraction \(x\) de sa variation finale à l'instant \(t_x\) tel que \(1 - e^{-t_x/\tau} = x\) :</p>
  <div class="formula" data-nom="Instant d'une fraction de la variation">$$t_x = -\tau\ln(1 - x).$$</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Fraction \(x\)</th><th>10 %</th><th>50 %</th><th>63 %</th><th>90 %</th><th>95 %</th><th>99 %</th></tr>
    <tr><td>\(t_x/\tau\)</td><td>0,105</td><td>0,693</td><td>1</td><td>2,30</td><td>3,00</td><td>4,61</td></tr>
  </table></div>
  <div class="def-box">
    Le <strong>temps de réponse à 5 %</strong>, \(t_{r5\%}\) (noté aussi \(t_{5\%}\)), est l'instant à partir duquel la sortie reste dans la bande ± 5 % autour de sa valeur finale. Le <strong>temps de montée</strong> \(t_m\) est la durée mise pour passer de 10 % à 90 % de la variation finale. Pour un premier ordre :
    <div class="formula" data-nom="Temps de réponse et de montée du premier ordre">$$t_{r5\%} = \tau\ln 20 \approx 3\tau,\qquad t_m = \tau\ln 9 \approx 2{,}2\,\tau.$$</div>
  </div>
  <p>Le temps de montée mesure la vivacité du début de la réponse ; le temps de réponse, le moment où l'on peut considérer le régime permanent atteint. Pour un premier ordre, les deux sont proportionnels à \(\tau\) : un seul paramètre fixe toute la rapidité.</p>
  <div class="method-box">
    <strong>Exemple — un four qui ne part pas de zéro</strong>
    <p>Un four du premier ordre, de gain \(K = 0{,}05\ \text{K/W}\) et de constante de temps \(\tau = 12\ \text{min}\), est à l'équilibre à 20 °C, chauffage coupé. On lui applique 1,5 kW.</p>
    <ol>
      <li>Le modèle porte sur les <strong>variations</strong> autour de l'équilibre de départ : \(\theta(t) = 20 + K P_0\big(1 - e^{-t/\tau}\big)\), avec \(K P_0 = 75\ \text{K}\). Température finale : 95 °C.</li>
      <li>À \(t = \tau = 12\) min : \(20 + 0{,}632 \times 75 = 67{,}4\) °C.</li>
      <li>80 °C correspond à 60 K sur 75, soit \(x = 0{,}8\) : \(t = \tau\ln 5 = 19{,}3\ \text{min}\).</li>
      <li>\(t_{r5\%} = 3\tau = 36\ \text{min}\) ; \(t_m = 2{,}2\,\tau = 26\ \text{min}\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : quand la sortie ne part pas de zéro, prendre 63 % de la <em>valeur</em> finale (\(0{,}63 \times 95 = 60\) °C) au lieu de 63 % de la <em>variation</em> (67,4 °C). Les pourcentages du premier ordre portent toujours sur la variation \(\Delta s\) depuis l'état d'équilibre de départ.</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÉPONSES À UNE RAMPE ET À UNE IMPULSION</div>
  <h2>Suivre une consigne qui varie</h2>
  <div class="intro">Une consigne ne fait pas que des sauts : un axe doit suivre une trajectoire à vitesse constante (rampe), un capteur subit un choc bref (impulsion). Le programme demande l'<strong>allure</strong> de ces réponses : retard et écart pour la rampe, saut puis décroissance pour l'impulsion.</div>
  <div class="prop-box">
    <strong>Rampe</strong> \(e(t) = a\,t\) : \(S(p) = \dfrac{K a}{p^2(1 + \tau p)} = K a\Big(\dfrac{1}{p^2} - \dfrac{\tau}{p} + \dfrac{\tau}{p + 1/\tau}\Big)\), d'où
    <div class="formula" data-nom="Réponse à une rampe du premier ordre">$$s(t) = K a\big(t - \tau + \tau\,e^{-t/\tau}\big).$$</div>
    En régime permanent, \(s(t) \approx K a\,(t - \tau)\). Pour \(K = 1\), la sortie suit la rampe avec un <strong>retard</strong> \(\tau\), c'est-à-dire un écart constant \(e - s \to a\tau\) : l'<strong>écart de traînage</strong>. Pour \(K \neq 1\), les pentes diffèrent et l'écart croît sans limite.
  </div>

<figcaption>Réponse à une rampe \(e = at\) d'un premier ordre de gain \(K = 1\) : la sortie suit la consigne avec un retard \(\tau\), donc un écart constant \(a\tau\) (écart de traînage).</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — un capteur de température en retard</strong>
    <p>Une sonde de température se comporte comme un premier ordre de gain 1 et de constante de temps \(\tau = 8\ \text{s}\). Le fluide où elle plonge se réchauffe régulièrement de 0,5 K/s.</p>
    <ol>
      <li>En régime permanent, l'indication suit la vraie température avec un retard de 8 s, donc un écart de traînage \(a\tau = 0{,}5 \times 8 = 4\ \text{K}\) : la sonde lit 4 K de moins que la réalité.</li>
      <li>Au bout de 8 s, le fluide a pris 4 K, mais la sonde n'en indique que \(0{,}5\,(8 - 8 + 8\,e^{-1}) = 1{,}5\ \text{K}\).</li>
      <li>Si la sonde avait un gain de 0,9 (défaut d'étalonnage), l'écart \(a t - 0{,}9\,a(t - \tau)\) croîtrait de \(0{,}1\,a = 0{,}05\) K par seconde, sans limite.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Impulsion</strong> : \(S(p) = H(p)\), donc \(h(t) = \dfrac{K}{\tau}\,e^{-t/\tau}\) : un saut à \(K/\tau\) puis une décroissance exponentielle de même constante de temps. C'est la dérivée de la réponse indicielle unitaire, comme l'impulsion est la dérivée de l'échelon.
  </div>

<figcaption>Réponse impulsionnelle d'un premier ordre : saut à \(K/\tau\) puis décroissance exponentielle de même constante de temps. La tangente à l'origine coupe l'axe des temps en \(t = \tau\), où il reste 37 % de la valeur initiale ; il en reste 5 % à \(3\tau\).</figcaption>
</figure>
  <p>L'impulsion de Dirac est une idéalisation : en pratique, c'est une entrée d'aire \(A\) (énergie, quantité de mouvement, charge) appliquée pendant une durée très courte devant \(\tau\). La réponse vaut alors \(A\,h(t)\), quelle que soit la forme exacte de l'impulsion. Les trois réponses se déduisent l'une de l'autre : la réponse à une rampe est la primitive de la réponse indicielle, qui est elle-même la primitive de la réponse impulsionnelle.</p>
  <div class="method-box">
    <strong>Exemple — une brève impulsion de chauffage</strong>
    <p>Une enceinte de gain \(K = 0{,}05\ \text{K/W}\) et de constante de temps \(\tau = 600\ \text{s}\) reçoit 6 kW pendant 0,5 s, soit une énergie \(A = 3\ \text{kJ}\).</p>
    <ol>
      <li>La durée (0,5 s) est très courte devant \(\tau\) : on assimile l'entrée à une impulsion d'aire \(A\).</li>
      <li>\(\Delta\theta(t) = A\,\dfrac{K}{\tau}\,e^{-t/\tau}\), qui part de \(\dfrac{3000 \times 0{,}05}{600} = 0{,}25\ \text{K}\) (le calcul exact avec l'impulsion rectangulaire donne aussi 0,25 K).</li>
      <li>L'élévation retombe à 37 % au bout de 10 min et à 5 % au bout de 30 min.</li>
    </ol>
  </div>
</div>

  <h2>Un filtre passe-bas</h2>
  <div class="intro">Soumis à une entrée sinusoïdale \(e(t) = E_m\sin(\omega t)\), un SLCI stable finit par répondre par une sinusoïde de <strong>même pulsation</strong>, \(s(t) = S_m\sin(\omega t + \varphi)\). Le rapport des amplitudes et le déphasage se lisent sur le nombre complexe \(H(j\omega)\), obtenu en remplaçant \(p\) par \(j\omega\) : \(S_m/E_m = |H(j\omega)|\) et \(\varphi = \arg H(j\omega)\). Cette section donne les résultats propres au premier ordre ; la méthode générale de tracé des diagrammes de Bode est dans <a href="#bode/cours">« Réponse fréquentielle et diagrammes de Bode »</a>.</div>

<figcaption>Capteur de température du premier ordre (\(K = 1\), \(\tau = 8\) s) plongé dans un fluide dont la température oscille de ± 5 K avec une période de 60 s (tirets). Après un court régime transitoire, l'indication \(s(t)\) est une sinusoïde de même période, d'amplitude \(S_m \approx 3{,}8\) K, en retard de \(\Delta t \approx 6{,}7\) s.</figcaption>
</figure>
  <div class="prop-box">
    Pour le premier ordre :
    <div class="formula" data-nom="Gain et phase du premier ordre">$$|H(j\omega)| = \frac{K}{\sqrt{1 + \tau^2\omega^2}},\qquad \varphi(\omega) = -\arctan(\tau\omega).$$</div>
    <ul>
      <li>basses pulsations (\(\omega \ll 1/\tau\)) : \(G_{dB} = 20\log|H| \approx 20\log K\), \(\varphi \approx 0\) ;</li>
      <li>hautes pulsations (\(\omega \gg 1/\tau\)) : \(|H| \approx \dfrac{K}{\tau\omega}\), une droite de pente \(-20\ \text{dB}\) par décade, et \(\varphi \to -90°\) ;</li>
      <li>à la <strong>pulsation de cassure</strong> \(\omega_c = 1/\tau\) : \(|H| = K/\sqrt2\), soit 3 dB sous l'asymptote, et \(\varphi = -45°\).</li>
    </ul>
  </div>
  <div class="method-box">
    <strong>Exemple — la sonde dans un fluide dont la température oscille</strong>
    <p>La sonde du §3 (\(K = 1\), \(\tau = 8\ \text{s}\)) plonge dans un fluide dont la température oscille de ± 5 K autour de sa moyenne, avec une période de 60 s (figure ci-dessus).</p>
    <ol>
      <li>\(\omega = \dfrac{2\pi}{60} = 0{,}105\ \text{rad/s}\) et \(\tau\omega = 0{,}84\) : on est sous la cassure, mais pas très loin.</li>
      <li>\(|H| = \dfrac{1}{\sqrt{1 + 0{,}84^2}} = 0{,}77\) : la sonde indique ± 3,8 K, soit 23 % de moins que la réalité.</li>
      <li>\(\varphi = -\arctan 0{,}84 = -40°\), c'est-à-dire un retard \(\Delta t = |\varphi|/\omega = 0{,}698/0{,}105 = 6{,}7\ \text{s}\).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§5 · IDENTIFIER UN PREMIER ORDRE</div>
  <h2>Lire \(K\) et \(\tau\) sur un relevé</h2>
  <div class="intro">Identifier, c'est choisir un modèle de comportement et en déterminer les paramètres à partir d'un essai. Le modèle du premier ordre se reconnaît à trois signes : un départ avec une pente non nulle, aucun dépassement, un palier.</div>
  <h3>Choisir l'essai</h3>
  <ul>
    <li>Partir d'un <strong>régime permanent</strong> (sortie stabilisée), puis appliquer un échelon : son amplitude doit être assez grande pour que la variation de la sortie domine le bruit de mesure, mais assez petite pour rester dans le domaine où le système est linéaire (pas de saturation de l'actionneur, pas de butée).</li>
    <li>Enregistrer l'entrée et la sortie jusqu'au palier (au moins \(4\tau\) à \(5\tau\)), avec un point de mesure toutes les quelques secondes si \(\tau\) vaut quelques minutes (au moins une dizaine de points par constante de temps).</li>
    <li>On peut aussi faire un essai harmonique (sinusoïdes de pulsations croissantes) et identifier sur le diagramme de Bode ; il est plus long, mais chaque point se mesure en régime établi, sur plusieurs périodes, ce qui le rend peu sensible au bruit.</li>
  </ul>
  <div class="method-box">
    <strong>Sur une réponse indicielle</strong>
    <ol>
      <li>Vérifier l'allure : départ avec une pente non nulle, pas de dépassement, palier.</li>
      <li>\(K = \dfrac{\Delta s_\infty}{\Delta e}\) : variation finale de la sortie sur amplitude de l'échelon, avec les unités.</li>
      <li>\(\tau\) = instant où la sortie atteint 63 % de sa variation finale. La tangente à l'origine donne la même valeur mais elle est imprécise sur un relevé bruité ; on peut aussi mesurer \(t_{r5\%}\) et prendre \(\tau = t_{r5\%}/3\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Sur un diagramme de Bode</strong>
    <ol>
      <li>\(K = 10^{G_0/20}\), où \(G_0\) est le gain en basses pulsations.</li>
      <li>\(\tau = 1/\omega_c\), où \(\omega_c\) est la pulsation à laquelle le gain a perdu 3 dB, ou bien celle où la phase vaut \(-45°\).</li>
      <li>Contrôle : pente de \(-20\) dB/décade et phase tendant vers \(-90°\) en hautes pulsations.</li>
    </ol>
  </div>

<figcaption>Relevé de la température d'une étuve (un point toutes les 10 s) : à \(t = 0\), la puissance passe de 0 à 800 W. La température part de 22 °C et se stabilise à 70 °C ; elle atteint 63 % de sa variation, 52,3 °C, vers \(t = 150\) s. Le départ est légèrement arrondi : c'est la sonde, qui a sa propre petite constante de temps.</figcaption>
</figure>
  <div class="method-box">
    <strong>Exemple — identifier une étuve sur un relevé</strong>
    <p>On enregistre la température d'une étuve à l'équilibre à 22 °C, puis on fait passer la puissance de chauffe de 0 à 800 W (figure ci-dessus).</p>
    <ol>
      <li>Allure : pas de dépassement, un palier à 70 °C. Le tout début est un peu arrondi (la sonde a sa propre inertie), mais la courbe a ensuite l'allure d'une exponentielle : on retient un premier ordre.</li>
      <li>Gain : \(\Delta\theta_\infty = 70 - 22 = 48\ \text{K}\) pour \(\Delta P = 800\ \text{W}\), donc \(K = 0{,}060\ \text{K/W}\).</li>
      <li>Constante de temps : 63 % de la variation, c'est \(22 + 0{,}632 \times 48 = 52{,}3\) °C, lu vers \(t = 150\ \text{s}\) : \(\tau \approx 150\ \text{s}\).</li>
      <li>Contrôle : 95 % de la variation (67,6 °C) est atteint vers 440 s, ce qui donne \(\tau \approx 440/3 \approx 147\ \text{s}\), cohérent. Modèle retenu : \(H(p) = \dfrac{0{,}06}{1 + 150p}\) (K/W).</li>
      <li>La tangente à l'origine est ici inutilisable : la pente mesurée sur les dix premières secondes (0,17 K/s) est moitié moindre que la pente \(K\Delta P/\tau = 0{,}32\) K/s du modèle, à cause du départ arrondi.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un moteur identifié en deux mesures</strong>
    <p>Sous un échelon de 12 V, un moteur atteint 2 400 tr/min en régime permanent et 1 512 tr/min au bout de 0,15 s.</p>
    <ol>
      <li>\(K = \dfrac{2400}{12} = 200\ \text{tr}\cdot\text{min}^{-1}\cdot\text{V}^{-1}\), soit \(200 \times \dfrac{2\pi}{60} \approx 20{,}9\ \text{rad}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\).</li>
      <li>\(1512/2400 = 0{,}63\) : on est à \(t = \tau\), donc \(\tau = 0{,}15\ \text{s}\).</li>
      <li>Modèle : \(H(p) = \dfrac{20{,}9}{1 + 0{,}15p}\) ; temps de réponse à 5 % prévu : 0,45 s.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · LE PREMIER ORDRE DANS UNE BOUCLE</div>
  <h2>Boucler accélère</h2>
  <div class="prop-box">
    <ul>
      <li>Un premier ordre \(\dfrac{K}{1 + \tau p}\) précédé d'un gain \(K_c\) et bouclé par un retour unitaire reste un premier ordre, de gain \(\dfrac{K_cK}{1 + K_cK}\) et de constante de temps \(\dfrac{\tau}{1 + K_cK}\) : plus rapide, mais avec un écart statique \(\dfrac{1}{1 + K_cK}\) à l'échelon.</li>
      <li>Un <strong>intégrateur</strong> \(\dfrac{K}{p}\) bouclé par un retour unitaire donne \(\dfrac{K}{p + K} = \dfrac{1}{1 + p/K}\) : un premier ordre de gain exactement 1 et de constante de temps \(1/K\). C'est le cas d'un axe positionné par un moteur commandé en vitesse : la position finale égale la consigne.</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">La fonction de transfert en boucle fermée</span>
    <div class="content">
      <p>Avec un retour unitaire, \(H_{BF} = \dfrac{H_{BO}}{1 + H_{BO}}\) (chapitre <a href="#schblocs/cours">« Schéma-blocs et systèmes asservis »</a>). Pour \(H_{BO} = \dfrac{K_cK}{1 + \tau p}\) : \(H_{BF} = \dfrac{K_cK}{1 + K_cK + \tau p}\), et l'on divise par \(1 + K_cK\) pour retrouver la forme canonique. L'écart statique à un échelon unité vaut \(1 - H_{BF}(0) = \dfrac{1}{1 + K_cK}\).</p>
    </div>
  </div>
  <div class="method-box">
    <strong>Exemple — boucler le moteur du §1 en vitesse</strong>
    <p>Le moteur du §1 (\(K = 8{,}33\ \text{rad}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\), \(\tau = 0{,}333\ \text{s}\)) est commandé par \(u = K_c\,(\Omega_c - \Omega)\), avec \(K_c = 2\ \text{V}\cdot\text{s}\cdot\text{rad}^{-1}\) (capteur et adaptateur ramenés à un retour unitaire).</p>
    <ol>
      <li>\(K_cK = 16{,}7\) : gain en boucle fermée \(\dfrac{16{,}7}{17{,}7} = 0{,}943\), constante de temps \(\dfrac{0{,}333}{17{,}7} = 18{,}8\ \text{ms}\).</li>
      <li>Temps de réponse : \(3 \times 18{,}8 = 56\ \text{ms}\), contre 1 s en boucle ouverte ; écart statique \(1/17{,}7 = 5{,}7\ \%\) de la consigne.</li>
      <li>Mais pour une consigne de 100 rad/s, la commande vaut \(u(0^+) = K_c \times 100 = 200\ \text{V}\) à l'instant de l'échelon : un variateur alimenté en 24 V sature, et la réponse réelle est bien plus lente que prévu.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — un axe positionné</strong>
    <p>Un axe linéaire commandé en vitesse a pour FTBO \(\dfrac{K}{p}\), avec \(K = 20\ \text{s}^{-1}\).</p>
    <ol>
      <li>En boucle fermée : premier ordre de gain 1 et de constante de temps \(1/K = 0{,}05\ \text{s}\), d'où \(t_{r5\%} = 0{,}15\ \text{s}\) et un écart statique nul.</li>
      <li>Pour une consigne en rampe de 0,1 m/s, l'écart de traînage vaut \(a/K = 0{,}1/20 = 5\ \text{mm}\) (formule générale : <a href="#precision/cours">« Performances »</a>, §2).</li>
    </ol>
  </div>
  <div class="notice">Ces résultats paraissent sans limite (gain infini, rapidité infinie). En réalité, la commande sature et les constantes de temps négligées (inductance, capteur) font apparaître un ordre plus élevé, qui peut osciller : c'est l'objet du chapitre « Stabilité des systèmes asservis ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · RECONNAÎTRE UN MODÈLE DE COMPORTEMENT</div>
  <h2>Premier ordre, intégrateur, retard</h2>
  <div class="intro">Tous les relevés ne sont pas des premiers ordres. Le programme cite, comme modèles de comportement, le gain pur, l'intégrateur, le dérivateur, le retard, le premier et le deuxième ordre (<a href="#slci/cours">« SLCI »</a>, §5). Bien les distinguer sur une réponse indicielle évite d'identifier \(\tau\) sur une courbe qui n'est pas une exponentielle.</div>
  <div style="overflow-x:auto"><table>
    <tr><th>Allure de la réponse à un échelon \(E_0\)</th><th>Modèle</th><th>Paramètres lus</th></tr>
    <tr><td>saut immédiat à une valeur constante</td><td>gain pur \(K\)</td><td>\(K = \Delta s/E_0\)</td></tr>
    <tr><td>rampe dès l'origine</td><td>intégrateur \(\dfrac{K}{p}\)</td><td>pente \(= KE_0\)</td></tr>
    <tr><td>départ en pente, palier, pas de dépassement</td><td>premier ordre \(\dfrac{K}{1 + \tau p}\)</td><td>\(K\), \(\tau\) (63 %)</td></tr>
    <tr><td>rien pendant \(T\), puis une exponentielle</td><td>premier ordre retardé \(\dfrac{K\,e^{-Tp}}{1 + \tau p}\)</td><td>\(T\), puis \(K\), \(\tau\)</td></tr>
    <tr><td>départ à tangente horizontale, puis une rampe</td><td>intégrateur et premier ordre \(\dfrac{K}{p\,(1 + \tau p)}\)</td><td>pente \(KE_0\), \(\tau\) (asymptote)</td></tr>
    <tr><td>départ à tangente horizontale, palier, avec ou sans dépassement</td><td>deuxième ordre (<a href="#sys2/cours">chapitre suivant</a>)</td><td>\(K\), \(\xi\), \(\omega_0\)</td></tr>
  </table></div>
  <h3>Le premier ordre retardé</h3>
  <div class="def-box">
    Un <strong>retard pur</strong> \(T\) (transport d'une matière dans un tuyau, sur un convoyeur, d'une information dans un réseau) décale la sortie sans la déformer : \(s(t) = e(t - T)\), de fonction de transfert \(e^{-Tp}\) (théorème du retard). Associé à un premier ordre :
    <div class="formula" data-nom="Premier ordre retardé">$$H(p) = \frac{K\,e^{-Tp}}{1 + \tau p},\qquad s(t) = K E_0\big(1 - e^{-(t - T)/\tau}\big)\ \text{pour } t \geq T,\quad s = 0 \text{ avant}.$$</div>
  </div>

  <h3>L'intégrateur suivi d'un premier ordre</h3>
  <p>La position \(\theta\) d'un axe de moteur est l'intégrale de sa vitesse, qui est un premier ordre : \(\dfrac{\theta(p)}{U(p)} = \dfrac{K}{p\,(1 + \tau p)}\). Sous un échelon \(U_0\),</p>
  <div class="formula" data-nom="Réponse indicielle d'un intégrateur et d'un premier ordre">$$\theta(t) = K U_0\Big[t - \tau\big(1 - e^{-t/\tau}\big)\Big] \;\approx\; K U_0\,(t - \tau)\ \text{pour } t \gg \tau.$$</div>

  <div class="method-box">
    <strong>Exemple — identifier un moteur sur sa position</strong>
    <p>Sous un échelon de 6 V, la position d'un moteur rejoint une droite de pente 300 rad/s qui coupe l'axe des temps à 0,08 s (figure ci-dessus).</p>
    <ol>
      <li>Pente de l'asymptote : \(KU_0 = 300\ \text{rad/s}\), donc \(K = 50\ \text{rad}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\) (c'est le gain du premier ordre « vitesse »).</li>
      <li>Abscisse à l'origine de l'asymptote : \(\tau = 0{,}08\ \text{s}\).</li>
      <li>Contrôle : à 0,5 s, le modèle donne \(300\,\big(0{,}5 - 0{,}08\,(1 - e^{-6{,}25})\big) = 126\ \text{rad}\), sur l'asymptote à 0,1 % près.</li>
    </ol>

  <div class="notice"><strong>Erreur classique</strong> : prendre une réponse à tangente horizontale au départ pour un premier ordre. Un premier ordre démarre toujours avec la pente \(KE_0/\tau\), non nulle ; une tangente horizontale signale un ordre au moins égal à 2 (deux premiers ordres en série, un intégrateur et un premier ordre, ou un deuxième ordre).</div>

<div class="course-section">
  <div class="sec-num">§8 · VALIDER UN MODÈLE</div>
  <h2>Confronter le modèle à la mesure</h2>
  <div class="intro">Un modèle identifié n'est utile que s'il prévoit correctement ce qu'on ne lui a pas montré. Le valider, c'est comparer ses prévisions (calculées à la main ou simulées) à des mesures, de préférence sur un <strong>autre essai</strong> que celui qui a servi à l'identifier, et conclure sur l'écart.</div>
  <h3>Simuler le modèle : la méthode d'Euler</h3>
  <p>Pour une entrée quelconque (échelon puis coupure, consigne en paliers…), on résout numériquement \(\tau\,s' + s = K\,e(t)\) écrite sous la forme \(s' = F(t, s) = \dfrac{K\,e(t) - s}{\tau}\), avec la fonction <span class="code-inline">euler</span> du chapitre <a href="#pynum/cours">« Méthodes numériques »</a>, §6 : \(s_{k+1} = s_k + h\,F(t_k, s_k)\). Le pas \(h\) doit être petit devant \(\tau\) (une à quelques dizaines de pas par constante de temps).</p>
  <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):
    <span class="str">"""Méthode d'Euler pour y' = F(t, y), y(t0) = y0 : renvoie les listes
    des instants t_k = t0 + k*h et des approximations y_k de y(t_k), k = 0, …, n."""</span>
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)      <span class="cmt"># pente au point (t_k, y_k)</span>
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys

K, tau = 0.06, 150.0                  <span class="cmt"># modèle de l'étuve identifié au §5 (K/W, s)</span>

<span class="kw">def</span> P(t):
    <span class="kw">return</span> 800.0 <span class="kw">if</span> t &lt; 600 <span class="kw">else</span> 0.0   <span class="cmt"># chauffe à 800 W, puis coupure à 600 s</span>

<span class="kw">def</span> F(t, theta):
    <span class="kw">return</span> (K * P(t) - theta) / tau     <span class="cmt"># tau theta' + theta = K P(t), theta = écart à 22 °C</span>

ts, thetas = euler(F, 0, 0.0, 5.0, 240)  <span class="cmt"># 240 pas de 5 s : 1 200 s</span>
<span class="kw">for</span> k <span class="kw">in</span> (20, 60, 120, 140, 180, 240):  <span class="cmt"># t = 100, 300, 600, 700, 900, 1 200 s</span>
    print(ts[k], round(22 + thetas[k], 1))</pre>
  <p>Le programme, exécuté tel quel, affiche :</p>
  <pre class="codeblock">100.0 45.6
300.0 63.7
600.0 69.2
700.0 45.9
900.0 28.2
1200.0 22.8</pre>

</figure>
  <div class="method-box">
    <strong>Exemple — valider le modèle de l'étuve</strong>
    <p>On réalise un second essai : chauffe à 800 W pendant 600 s, puis coupure (figure ci-dessus). On compare les mesures au modèle simulé.</p>
    <div style="overflow-x:auto"><table>
      <tr><th>\(t\) (s)</th><th>100</th><th>300</th><th>600</th><th>700</th><th>900</th><th>1 200</th></tr>
      <tr><td>modèle (°C)</td><td>45,6</td><td>63,7</td><td>69,2</td><td>45,9</td><td>28,2</td><td>22,8</td></tr>
      <tr><td>mesure (°C)</td><td>44,9</td><td>63,8</td><td>69,4</td><td>46,6</td><td>28,0</td><td>22,7</td></tr>
    </table></div>
    <ol>
      <li>Écarts : au plus 0,7 °C sur ces instants, et 1,6 °C au pire juste après la coupure, soit 3 % de la variation de 48 K. Le modèle est validé pour cet usage (prévoir une température à quelques degrés près).</li>
      <li>Les écarts ne sont pas du bruit : ils sont systématiquement de même signe juste après chaque changement de puissance. Ils trahissent la petite constante de temps de la sonde, négligée. Un modèle plus fin (deux premiers ordres) les réduirait.</li>
      <li>Précision du calcul : avec un pas de 5 s (\(\tau/30\)), Euler donne 52,6 °C à 150 s, pour 52,3 °C exactement ; avec un pas de 1 s, 52,4 °C. L'erreur de méthode, proportionnelle au pas, reste ici petite devant l'écart modèle-mesure.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : valider un modèle sur l'essai même qui a servi à l'identifier. L'accord est alors forcé aux points choisis (63 %, palier) et ne prouve rien ailleurs. Autre piège : conclure sans ordre de grandeur. « Le modèle est bon » doit s'accompagner d'un écart chiffré, comparé à la précision attendue par le cahier des charges.</div>
  <p>Le modèle n'est valable que dans le domaine où le système reste linéaire : un four ne dépasse pas sa puissance maximale, un moteur sa tension d'alimentation. L'étude des non-linéarités (saturation, seuil, hystérésis) et des limites de validité d'un modèle relève de la 2ᵉ année.</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Linéariser, ajuster par régression</h2>
  <div class="intro">Deux compléments utiles, non exigibles en PTSI : le premier est au programme de 2ᵉ année (S3), le second relève du traitement de données.</div>
  <h3>Linéariser un modèle autour d'un point de fonctionnement</h3>
  <p>Un réservoir de section \(S\) alimenté par un débit \(q_e\) se vide par un orifice : \(S\,\dfrac{dh}{dt} = q_e - k\sqrt{h}\). Cette équation n'est pas linéaire. Autour d'un niveau d'équilibre \(h_0\) (où \(q_{e0} = k\sqrt{h_0}\)), on remplace \(\sqrt{h}\) par sa tangente, \(\sqrt{h_0} + \dfrac{h - h_0}{2\sqrt{h_0}}\). Les petites variations \(\delta h\) et \(\delta q\) obéissent alors à \(\dfrac{2S\sqrt{h_0}}{k}\,\delta h' + \delta h = \dfrac{2\sqrt{h_0}}{k}\,\delta q\) : un premier ordre, dont le gain et la constante de temps dépendent du point de fonctionnement (dernière ligne du tableau du §1).</p>
  <h3>Identifier \(\tau\) par une régression linéaire</h3>
  <p>Pour un premier ordre, \(\ln\!\Big(1 - \dfrac{\Delta s(t)}{\Delta s_\infty}\Big) = -\dfrac{t}{\tau}\) : les points \(\big(t, \ln(1 - \Delta s/\Delta s_\infty)\big)\) s'alignent sur une droite de pente \(-1/\tau\). Une régression linéaire (par exemple <span class="code-inline">numpy.polyfit</span>) utilise alors tous les points du relevé au lieu d'un seul, ce qui réduit l'effet du bruit. On écarte les points proches du palier, où le logarithme amplifie le bruit, et ceux du tout début si le départ est arrondi.</p>
</div>

<div class="course-section">
  <div class="sec-num">MÉTHODES · SYSTÈMES DU 1er ORDRE</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire pour mettre un système sous forme de premier ordre, prévoir ses réponses, l'identifier sur un relevé et vérifier le modèle obtenu. Les numéros de section renvoient au cours.</div>

  <div class="method-box"><strong>Méthode 1 — Mettre un modèle sous la forme d'un premier ordre</strong>
    <ol>
      <li>Écrire l'équation différentielle et la diviser par le coefficient de \(s\) pour obtenir \(\tau\,s' + s = K\,e\).</li>
      <li>Ou, en Laplace, diviser numérateur et dénominateur par le terme constant du dénominateur : \(\dfrac{b}{a + c\,p} = \dfrac{b/a}{1 + (c/a)\,p}\).</li>
      <li>Contrôler les unités : \(\tau\) en secondes, \(K\) en unité de sortie par unité d'entrée ; le pôle vaut \(-1/\tau\) (§1).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{12}{4 + 2p} = \dfrac{3}{1 + 0{,}5p}\) : \(K = 3\) et \(\tau = 0{,}5\ \text{s}\) (et non 12 et 2 s).</p>
  </div>

  <div class="method-box"><strong>Méthode 2 — Exploiter une réponse indicielle</strong>
    <ol>
      <li>Valeur finale \(K E_0\), atteinte sans dépassement ; pente à l'origine \(KE_0/\tau\).</li>
      <li>Repères : 63 % à \(\tau\), 86 % à \(2\tau\), 95 % à \(3\tau\) ; temps de réponse \(t_{r5\%} = 3\tau\), temps de montée (10 % → 90 %) \(t_m = 2{,}2\,\tau\) (§2).</li>
      <li>Instant où la sortie atteint une fraction \(x\) de sa variation finale : \(t = -\tau\ln(1 - x)\) (\(x = 0{,}9\) donne \(2{,}3\,\tau\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 4\), \(\tau = 0{,}25\ \text{s}\), échelon \(E_0 = 2\) : valeur finale 8, \(s(0{,}25\ \text{s}) = 5{,}06\), 90 % atteint à 0,58 s, \(t_{r5\%} = 0{,}75\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Raisonner en variations autour d'un équilibre</strong>
    <ol>
      <li>Repérer l'état d'équilibre de départ \((e_0, s_0)\) : le modèle relie les variations \(\Delta e = e - e_0\) et \(\Delta s = s - s_0\).</li>
      <li>Écrire \(s(t) = s_0 + K\,\Delta e\,\big(1 - e^{-t/\tau}\big)\).</li>
      <li>Appliquer les pourcentages (63 %, 95 %) à la variation \(K\,\Delta e\), jamais à la valeur finale (§2).</li>
    </ol>
    <p><em>Exemple éclair :</em> un moteur (\(K = 50\ \text{tr}\cdot\text{min}^{-1}\cdot\text{V}^{-1}\), \(\tau = 0{,}2\ \text{s}\)) tourne à 300 tr/min sous 6 V ; on passe à 9 V. Vitesse finale \(300 + 50 \times 3 = 450\) tr/min ; à 0,2 s, \(300 + 0{,}632 \times 150 = 395\) tr/min.</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Identifier \(K\) et \(\tau\)</strong>
    <ol>
      <li>Vérifier l'allure d'un premier ordre : départ en pente, pas de dépassement, palier (§5, §7).</li>
      <li>Indiciel : \(K = \Delta s_\infty/\Delta e\), \(\tau\) à 63 % de la variation (ou \(t_{r5\%}/3\)).</li>
      <li>Fréquentiel : \(K = 10^{G_0/20}\), \(\tau = 1/\omega_c\) avec \(\omega_c\) à \(-3\) dB ou à \(-45°\).</li>
      <li>Contrôler sur un autre point de la courbe (95 % à \(3\tau\), ou \(-20\) dB à \(10\,\omega_c\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> un échelon de 0 à 10 V fait passer la sortie de 1,0 à 4,0 V, et la sortie vaut 2,9 V à 40 ms. \(K = 3/10 = 0{,}30\) ; 2,9 V est à 63 % de la variation, donc \(\tau = 40\ \text{ms}\) ; contrôle : la sortie doit valoir 3,85 V à 120 ms.</p>
  </div>

  <div class="method-box"><strong>Méthode 5 — Tracer le Bode d'un premier ordre</strong>
    <ol>
      <li>Asymptote basse : horizontale à \(20\log K\) ; asymptote haute : pente \(-20\) dB/décade, les deux se coupant en \(\omega_c = 1/\tau\).</li>
      <li>Courbe réelle : 3 dB sous le coin des asymptotes, 1 dB sous à \(\omega_c/2\) et \(2\,\omega_c\).</li>
      <li>Phase : 0° jusqu'à \(\omega_c/10\), \(-45°\) en \(\omega_c\), \(-90°\) au-delà de \(10\,\omega_c\) ; asymptote oblique entre les deux (§4 ; méthode générale : <a href="#bode/cours">« Bode »</a>, §3).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\dfrac{5}{1 + 0{,}02p}\) : plateau à 14 dB, cassure à 50 rad/s ; à 500 rad/s, gain \(\approx 14 - 20 = -6\) dB et phase \(-84°\).</p>
  </div>

  <div class="method-box"><strong>Méthode 6 — Calculer la réponse à une sinusoïde</strong>
    <ol>
      <li>Vérifier que le système est stable et attendre la fin du régime transitoire (quelques \(\tau\)).</li>
      <li>Amplitude : \(S_m = |H(j\omega)|\,E_m = \dfrac{K E_m}{\sqrt{1 + \tau^2\omega^2}}\) ; déphasage \(\varphi = -\arctan(\tau\omega)\), en radians pour écrire \(s(t)\).</li>
      <li>Traduire le déphasage en retard temporel si besoin : \(\Delta t = |\varphi|/\omega\) (§4).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(H = \dfrac{2}{1 + 0{,}1p}\), \(e = 3\sin(20t)\) : \(\tau\omega = 2\), \(S_m = \dfrac{6}{\sqrt5} = 2{,}68\), \(\varphi = -63{,}4° = -1{,}11\ \text{rad}\), donc \(s(t) = 2{,}68\sin(20t - 1{,}11)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 7 — Prévoir les réponses à une rampe et à une impulsion</strong>
    <ol>
      <li>Rampe \(at\) : en régime permanent, \(s(t) \approx K a\,(t - \tau)\), soit un retard \(\tau\) sur la rampe \(K a t\).</li>
      <li>Si \(K = 1\), l'écart de traînage vaut \(a\tau\) ; si \(K \neq 1\), l'écart diverge (§3).</li>
      <li>Impulsion d'aire \(A\) (durée très courte devant \(\tau\)) : saut à \(AK/\tau\), puis décroissance en \(e^{-t/\tau}\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 1\), \(\tau = 0{,}5\ \text{s}\), rampe de 2 V/s : la sortie suit avec 0,5 s de retard, soit 1 V d'écart.</p>
  </div>

  <div class="method-box"><strong>Méthode 8 — Identifier un premier ordre retardé, ou un intégrateur suivi d'un premier ordre</strong>
    <ol>
      <li>Premier ordre retardé (rien ne bouge pendant \(T\)) : \(T\) = instant où la sortie commence à varier ; \(\tau\) = (instant des 63 %) \(- T\) ; \(K\) comme d'habitude.</li>
      <li>Intégrateur et premier ordre (départ à tangente horizontale puis rampe) : tracer l'asymptote ; sa pente vaut \(KE_0\), son abscisse à l'origine vaut \(\tau\) (§7).</li>
    </ol>
    <p><em>Exemple éclair :</em> une sortie immobile jusqu'à 1,2 s atteint 63 % de sa variation à 3,0 s : \(T = 1{,}2\ \text{s}\), \(\tau = 1{,}8\ \text{s}\). Une position rejoint une droite de pente 4 mm/s pour un échelon de 2 V, coupant l'axe des temps à 0,3 s : \(K = 2\ \text{mm}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\), \(\tau = 0{,}3\ \text{s}\).</p>
  </div>

  <div class="method-box"><strong>Méthode 9 — Boucler un premier ordre</strong>
    <ol>
      <li>Écrire la FTBO \(\dfrac{K_cK}{1 + \tau p}\) puis la FTBF \(\dfrac{K_cK}{1 + K_cK + \tau p}\), et diviser par \(1 + K_cK\).</li>
      <li>Lire \(K' = \dfrac{K_cK}{1 + K_cK}\), \(\tau' = \dfrac{\tau}{1 + K_cK}\), \(t_{r5\%} = 3\tau'\) et l'écart statique \(\dfrac{1}{1 + K_cK}\) (§6).</li>
      <li>Vérifier la commande au premier instant, \(u(0^+) = K_c\,E_0\) : si elle dépasse ce que l'actionneur peut fournir, le modèle linéaire surestime la rapidité.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K = 4\), \(\tau = 2\ \text{s}\), \(K_c = 2\) : \(K_cK = 8\), \(K' = 0{,}89\), \(\tau' = 0{,}22\ \text{s}\), \(t_{r5\%} = 0{,}67\ \text{s}\), écart statique 11 %.</p>
  </div>

  <div class="method-box"><strong>Méthode 10 — Simuler et valider un modèle</strong>
    <ol>
      <li>Écrire l'équation sous la forme \(s' = F(t, s) = \dfrac{K e(t) - s}{\tau}\) et appliquer la méthode d'Euler, \(s_{k+1} = s_k + h\,F(t_k, s_k)\), avec un pas \(h\) au plus égal à \(\tau/10\) (§8).</li>
      <li>Comparer la simulation aux mesures d'un essai <strong>différent</strong> de celui de l'identification ; chiffrer l'écart (en valeur et en pourcentage de la variation).</li>
      <li>Conclure : écart compatible avec la précision attendue ? écart systématique (modèle trop simple) ou aléatoire (bruit) ?</li>
    </ol>
    <p><em>Exemple éclair :</em> \(K E_0 = 1\), \(\tau = 0{,}5\ \text{s}\), pas \(h = 0{,}05\ \text{s}\) : le premier pas donne \(s_1 = 0{,}05 \times 1/0{,}5 = 0{,}10\), pour \(1 - e^{-0{,}1} = 0{,}095\) exactement ; 100 pas couvrent 5 s, soit \(10\tau\).</p>
  </div>

  <div class="notice"><strong>Pièges classiques</strong> : confondre \(\tau\) (en secondes) et \(\omega_c = 1/\tau\) (en rad/s) ; lire 63 % de la valeur finale et non de la variation quand le système ne part pas de zéro ; croire le système en régime permanent à \(t = \tau\) (il n'est qu'à 63 %) ; oublier de convertir les tr/min en rad/s ; identifier \(\tau\) sur une réponse à tangente horizontale (ce n'est pas un premier ordre) ou mesurer \(\tau\) depuis l'échelon quand il y a un retard ; valider un modèle sur l'essai qui a servi à l'identifier.</div>
</div>
</template>

  <div class="q"><strong>Q2.</strong> Écrire la fonction de transfert et l'expression de \(s(t)\).</div>

    <h4>Correction</h4>

    <p><strong>Q2.</strong> \(H(p) = \dfrac{3}{1 + 0{,}2p}\) et \(s(t) = 15\,\big(1 - e^{-t/0{,}2}\big)\ \text{V}\).</p>
    <p><strong>Q3.</strong> \(s(0{,}2) = 15\,(1 - e^{-1}) \approx 9{,}48\ \text{V}\), soit 63 % de la valeur finale, comme attendu à \(t = \tau\). \(s(1) = 15\,(1 - e^{-5}) \approx 14{,}9\ \text{V}\), soit 99,3 %. \(t_{r5\%} = 3\tau = 0{,}6\ \text{s}\).</p>

  <h3>Circuit RC — réponse indicielle et réponse fréquentielle</h3>
  <div class="statement">Un circuit RC (sortie : tension du condensateur) a pour composants \(R = 10\ \text{k}\Omega\) et \(C = 100\ \mu\text{F}\). Le condensateur est initialement déchargé ; l'entrée est un échelon \(E = 5\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(\tau\) et \(\omega_c\). Écrire \(H(p)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(s(1\ \text{s})\) et le temps pour atteindre 90 % de \(E\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(|H(j\omega_c)|\) en dB, puis \(|H|\) à \(\omega = 10\,\omega_c\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\tau = RC = 10^4 \times 10^{-4} = 1\ \text{s}\), \(\omega_c = 1/\tau = 1\ \text{rad/s}\), \(H(p) = \dfrac{1}{1 + p}\) (gain 1 : en régime permanent, le condensateur se charge à la tension d'entrée).</p>
    <p><strong>Q2.</strong> \(s(1) = 5\,(1 - e^{-1}) \approx 3{,}16\ \text{V}\). Pour 90 % : \(1 - e^{-t/\tau} = 0{,}9\), donc \(t = -\tau\ln(0{,}1) \approx 2{,}3\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(|H(j\omega_c)| = 1/\sqrt{2}\), soit \(-3\ \text{dB}\). À \(\omega = 10\,\omega_c\) : \(|H| = 1/\sqrt{1 + 100} \approx 0{,}0995\), soit \(-20\ \text{dB}\) : on est sur l'asymptote de pente \(-20\) dB/décade.</p>
  </div>
</div>

  <div class="q"><strong>Q2.</strong> Tracer les asymptotes du diagramme de Bode en gain et en phase.</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Système thermique — constante de temps</h3>
  <div class="statement">Une petite enceinte chauffante, de masse \(m = 2\ \text{kg}\) et de capacité thermique massique \(c_p = 500\ \text{J}\cdot\text{kg}^{-1}\cdot\text{K}^{-1}\), échange avec l'air ambiant à \(T_0 = 20\) °C par sa surface \(S = 0{,}5\ \text{m}^2\), avec un coefficient d'échange \(h = 10\ \text{W}\cdot\text{m}^{-2}\cdot\text{K}^{-1}\). On la suppose à température uniforme \(T(t)\), initialement égale à \(T_0\), et on la chauffe avec une puissance \(P(t)\).</div>
  <div class="q"><strong>Q1.</strong> Écrire le bilan d'énergie, puis calculer \(\tau\) et \(K\) (entrée : puissance en W ; sortie : écart de température \(T - T_0\)).</div>
  <div class="q"><strong>Q2.</strong> Pour une puissance de chauffage \(P = 100\ \text{W}\), calculer la température d'équilibre.</div>
  <div class="q"><strong>Q3.</strong> Au bout de combien de temps l'écart de température atteint-il 95 % de sa valeur finale ? Quelle est la température à \(t = \tau\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pendant \(dt\), l'énergie reçue sert à chauffer l'enceinte ou part dans l'air : \(m c_p\,\dfrac{dT}{dt} = P - hS\,(T - T_0)\). Avec \(\theta = T - T_0\) : \(\dfrac{m c_p}{hS}\,\theta' + \theta = \dfrac{1}{hS}\,P\). D'où \(\tau = \dfrac{m c_p}{hS} = \dfrac{2 \times 500}{10 \times 0{,}5} = 200\ \text{s}\) et \(K = \dfrac{1}{hS} = 0{,}2\ \text{K/W}\).</p>
    <p><strong>Q2.</strong> \(\theta_\infty = KP = 0{,}2 \times 100 = 20\ \text{K}\), donc \(T_{eq} = T_0 + \theta_\infty = 40\) °C.</p>
    <p><strong>Q3.</strong> \(1 - e^{-t/\tau} = 0{,}95\), donc \(t = -200\ln(0{,}05) \approx 600\ \text{s} = 10\ \text{min}\) (\(3\tau\)). À \(t = \tau = 200\ \text{s}\) : \(T = 20 + 0{,}632 \times 20 = 32{,}6\) °C. Attention : 63 % porte sur l'écart (20 K), pas sur la température finale (40 °C).</p>
  </div>
</div>

  <h3>Association de systèmes du 1er ordre</h3>
  <div class="statement">\(H_1(p) = \dfrac{2}{1 + 0{,}1p}\) et \(H_2(p) = \dfrac{5}{1 + 0{,}5p}\) sont placés en série.</div>
  <div class="q"><strong>Q1.</strong> Calculer \(H(p) = H_1(p)\,H_2(p)\). Quel est l'ordre du système résultant ?</div>
  <div class="q"><strong>Q2.</strong> Calculer le gain statique et les deux pulsations de cassure.</div>
  <div class="q"><strong>Q3.</strong> Tracer les asymptotes du gain de Bode. Quelle est la pente en hautes pulsations ?</div>
  <div class="q"><strong>Q4.</strong> Mettre \(H(p)\) sous la forme canonique d'un deuxième ordre \(\dfrac{K}{1 + \frac{2\xi}{\omega_0}p + \frac{p^2}{\omega_0^2}}\) (chapitre <a href="#sys2/cours">« Systèmes du 2e ordre »</a>). Que vaut \(\xi\) ? La réponse indicielle peut-elle dépasser sa valeur finale ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H(p) = \dfrac{10}{(1 + 0{,}1p)(1 + 0{,}5p)}\) : ordre 2 (deux pôles).</p>
    <p><strong>Q2.</strong> Gain statique \(K = 2 \times 5 = 10\), soit 20 dB. Cassures : \(\omega_1 = 1/0{,}5 = 2\ \text{rad/s}\) et \(\omega_2 = 1/0{,}1 = 10\ \text{rad/s}\).</p>
    <p><strong>Q3.</strong> Horizontale à 20 dB jusqu'à 2 rad/s ; pente \(-20\) dB/décade de 2 à 10 rad/s (le gain asymptotique passe de 20 dB à \(20 - 20\log 5 = 6\) dB) ; pente \(-40\) dB/décade au-delà (deux pôles).</p>
    <p><strong>Q4.</strong> \((1 + 0{,}1p)(1 + 0{,}5p) = 1 + 0{,}6p + 0{,}05p^2\). Donc \(\dfrac{1}{\omega_0^2} = 0{,}05\), \(\omega_0 = 4{,}47\ \text{rad/s}\), et \(\dfrac{2\xi}{\omega_0} = 0{,}6\), \(\xi = 0{,}3 \times 4{,}47 = 1{,}34\). Comme \(\xi \gt 1\) (c'est toujours le cas pour deux premiers ordres en série, \(\xi = 1\) seulement si les constantes de temps sont égales), la réponse indicielle est apériodique : jamais de dépassement, mais un départ à tangente horizontale.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Identification par Bode et vérification temporelle</h3>
  <div class="statement">Le diagramme de Bode relevé sur un système montre un gain de 26 dB en basses pulsations, une pente de \(-20\) dB/décade en hautes pulsations et une cassure en \(\omega_c = 50\ \text{rad/s}\), où la phase vaut \(-45°\). On soumet ensuite le système, au repos, à un échelon \(E = 2\ \text{V}\).</div>
  <div class="q"><strong>Q1.</strong> Identifier \(K\) et \(\tau\). Écrire \(H(p)\).</div>
  <div class="q"><strong>Q2.</strong> Écrire \(s(t)\) et calculer la valeur finale.</div>
  <div class="q"><strong>Q3.</strong> À quelle fréquence (en Hz) le gain est-il réduit de moitié (en valeur linéaire) par rapport au gain en basses pulsations ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pente \(-20\) dB/décade et \(-45°\) à la cassure : premier ordre. \(K = 10^{26/20} = 10^{1{,}3} \approx 20\) ; \(\tau = 1/\omega_c = 0{,}02\ \text{s}\) ; \(H(p) = \dfrac{20}{1 + 0{,}02p}\).</p>
    <p><strong>Q2.</strong> \(s(t) = 40\,\big(1 - e^{-50t}\big)\ \text{V}\) ; valeur finale \(KE = 40\ \text{V}\), atteinte à 5 % près en \(3\tau = 60\ \text{ms}\).</p>
    <p><strong>Q3.</strong> \(|H| = K/2\) quand \(\sqrt{1 + \omega^2\tau^2} = 2\), soit \(\omega = \sqrt{3}/\tau = 50\sqrt{3} \approx 86{,}6\ \text{rad/s}\) et \(f = 86{,}6/(2\pi) \approx 13{,}8\ \text{Hz}\). Ne pas confondre avec la coupure à \(-3\) dB, où \(|H| = K/\sqrt{2}\) (en \(f_c = 50/2\pi \approx 8{,}0\ \text{Hz}\)) ; une division par 2 correspond à \(-6\) dB.</p>
  </div>
</div>

  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Lire les performances d'un premier ordre</h3>
  <div class="statement">Un système du premier ordre a pour fonction de transfert \(H(p) = \dfrac{K}{1 + \tau p}\), avec \(K = 2{,}0\) et \(\tau = 0{,}50\ \text{s}\). On lui applique, au repos, un échelon d'entrée d'amplitude \(E_0 = 1{,}0\).</div>
  <div class="q"><strong>Q1.</strong> Donner l'expression de la sortie \(s(t)\), sa valeur finale et sa valeur à \(t = 0{,}5\ \text{s}\).</div>
  <div class="q"><strong>Q2.</strong> Définir et calculer le temps de réponse à 5 % et le temps de montée (10 % → 90 %).</div>
  <div class="q"><strong>Q3.</strong> Donner le gain statique en dB, la pulsation de coupure et la pente de l'asymptote en hautes pulsations.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(s(t) = K E_0\,(1 - e^{-t/\tau}) = 2{,}0\,(1 - e^{-2t})\). Valeur finale : \(K E_0 = 2{,}0\). À \(t = \tau = 0{,}5\ \text{s}\) : \(2 \times 0{,}632 = 1{,}26\).</p>
    <p><strong>Q2.</strong> Temps de réponse à 5 % : instant à partir duquel la sortie reste à moins de 5 % de sa valeur finale ; sans dépassement, c'est l'instant où elle atteint 95 % : \(t_{r5\%} = \tau\ln 20 \approx 3\tau = 1{,}5\ \text{s}\). Temps de montée : \(t_m = \tau\ln 9 \approx 2{,}2\,\tau = 1{,}1\ \text{s}\).</p>
    <p><strong>Q3.</strong> \(20\log K = 20\log 2 \approx 6\ \text{dB}\) ; \(\omega_c = 1/\tau = 2{,}0\ \text{rad/s}\) ; pente \(-20\) dB/décade (phase tendant vers \(-90°\)).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Asservissement d'un procédé du premier ordre</h3>
  <div class="statement">Un procédé du premier ordre \(H(p) = \dfrac{K_0}{1 + \tau p}\) (\(K_0 = 2{,}0\), \(\tau = 0{,}50\ \text{s}\)) est placé dans une boucle à retour unitaire, précédé d'un correcteur proportionnel de gain \(K_c = 4{,}0\).</div>
  <div class="q"><strong>Q1.</strong> Établir la FTBF. Montrer qu'elle reste du premier ordre et donner sa constante de temps \(\tau'\) et son gain statique \(K'\).</div>
  <div class="q"><strong>Q2.</strong> Comparer les temps de réponse à 5 % en boucle ouverte et en boucle fermée.</div>
  <div class="q"><strong>Q3.</strong> Calculer l'écart statique pour une consigne en échelon unitaire.</div>
  <div class="q"><strong>Q4.</strong> Quelle valeur de \(K_c\) ramènerait l'écart statique à 2 % ? Que vaudrait alors \(\tau'\) ? Pourquoi ne peut-on pas augmenter \(K_c\) indéfiniment en pratique ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong></p><div class="formula">$$\text{FTBF} = \frac{K_cH}{1 + K_cH} = \frac{K_cK_0}{1 + K_cK_0 + \tau p} = \frac{K'}{1 + \tau' p},$$</div><p>avec \(K' = \dfrac{K_cK_0}{1 + K_cK_0}\) et \(\tau' = \dfrac{\tau}{1 + K_cK_0}\). Avec \(K_cK_0 = 8{,}0\) : \(K' = 8/9 \approx 0{,}89\) et \(\tau' = 0{,}50/9 \approx 0{,}056\ \text{s}\).</p>
    <p><strong>Q2.</strong> Boucle ouverte : \(3\tau = 1{,}5\ \text{s}\) ; boucle fermée : \(3\tau' \approx 0{,}17\ \text{s}\). Le bouclage divise la constante de temps par \(1 + K_cK_0 = 9\).</p>
    <p><strong>Q3.</strong> \(\varepsilon_s = 1 - K' = \dfrac{1}{1 + K_cK_0} = \dfrac{1}{9} \approx 0{,}11\), soit 11 % de la consigne.</p>
    <p><strong>Q4.</strong> \(\dfrac{1}{1 + 2K_c} = 0{,}02\) donne \(K_c = 24{,}5\), et \(\tau' = 0{,}5/50 = 0{,}01\ \text{s}\). Mais la commande au premier instant vaut \(K_c\) fois l'échelon de consigne : l'actionneur sature ; de plus, les constantes de temps négligées (capteur, actionneur) font apparaître un ordre plus élevé et la boucle finit par osciller (chapitre <a href="#stabilite/cours">« Stabilité des systèmes asservis »</a>). Pour annuler l'écart sans gain excessif, on ajoute un intégrateur dans le correcteur (correcteur PI, 2ᵉ année).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Identifier un convoyeur qui ne part pas du repos</h3>
  <div class="statement">
    <p>Un convoyeur tourne en régime permanent à 0,40 m/s sous une tension de commande de 6 V. À \(t = 0\), la tension passe à 9 V. On relève sa vitesse \(v\) :</p>
    <div style="overflow-x:auto"><table>
      <tr><th>\(t\) (s)</th><td>0</td><td>0,4</td><td>0,8</td><td>1,2</td><td>1,6</td><td>2,4</td><td>3,6</td><td>6,0</td></tr>
      <tr><th>\(v\) (m/s)</th><td>0,400</td><td>0,485</td><td>0,546</td><td>0,590</td><td>0,621</td><td>0,659</td><td>0,685</td><td>0,698</td></tr>
    </table></div>
    <p>La vitesse se stabilise ensuite à 0,700 m/s.</p>
  </div>
  <div class="q"><strong>Q1.</strong> Justifier un modèle du premier ordre et calculer son gain \(K\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer la constante de temps \(\tau\).</div>
  <div class="q"><strong>Q3.</strong> Calculer le temps de réponse à 5 % et le temps de montée.</div>
  <div class="q"><strong>Q4.</strong> Prévoir la vitesse à \(t = 2\ \text{s}\) et l'instant où la vitesse atteint 0,65 m/s.</div>
  <div class="q"><strong>Q5.</strong> Un camarade cherche l'instant où \(v = 0{,}63 \times 0{,}70 = 0{,}441\ \text{m/s}\). Quelle constante de temps trouve-t-il ? Expliquer son erreur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> La vitesse croît dès l'échelon (pente non nulle), sans dépassement, vers un palier : premier ordre. On raisonne en variations : \(\Delta v_\infty = 0{,}70 - 0{,}40 = 0{,}30\ \text{m/s}\) pour \(\Delta u = 3\ \text{V}\), donc \(K = 0{,}10\ \text{m}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\).</p>
    <p><strong>Q2.</strong> 63 % de la variation : \(0{,}40 + 0{,}632 \times 0{,}30 = 0{,}590\ \text{m/s}\), atteint à \(t = 1{,}2\ \text{s}\) : \(\tau = 1{,}2\ \text{s}\). Contrôle : à \(3\tau = 3{,}6\ \text{s}\), la variation vaut \(0{,}285/0{,}30 = 95\ \%\).</p>
    <p><strong>Q3.</strong> \(t_{r5\%} = 3\tau = 3{,}6\ \text{s}\) ; \(t_m = 2{,}2\,\tau = 2{,}6\ \text{s}\).</p>
    <p><strong>Q4.</strong> \(v(2) = 0{,}40 + 0{,}30\,(1 - e^{-2/1{,}2}) = 0{,}643\ \text{m/s}\). Pour 0,65 m/s, la fraction de la variation vaut \(0{,}25/0{,}30 = 5/6\), d'où \(t = -\tau\ln(1/6) = 1{,}2\ln 6 \approx 2{,}15\ \text{s}\).</p>
    <p><strong>Q5.</strong> 0,441 m/s ne représente que \(0{,}041/0{,}30 = 14\ \%\) de la variation, atteints vers \(t = -1{,}2\ln(0{,}863) \approx 0{,}18\ \text{s}\) : il trouverait \(\tau \approx 0{,}18\ \text{s}\), près de sept fois trop petit. Les 63 % portent sur la variation depuis l'équilibre de départ, pas sur la valeur finale.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Un échangeur avec un retard de transport</h3>
  <div class="statement">Un échangeur de chaleur réchauffe de l'eau ; on agit sur l'ouverture de la vanne de vapeur (en %) et l'on mesure la température de l'eau en sortie, à quelques mètres de l'échangeur. Partant d'un équilibre, on ouvre la vanne de 30 % supplémentaires à \(t = 0\). La température ne commence à monter qu'à \(t = 2{,}5\ \text{s}\) ; elle atteint 63 % de sa variation à \(t = 6{,}5\ \text{s}\) et gagne au total 18 K.</div>
  <div class="q"><strong>Q1.</strong> Proposer un modèle de comportement et identifier ses trois paramètres.</div>
  <div class="q"><strong>Q2.</strong> Calculer le temps de réponse à 5 %.</div>
  <div class="q"><strong>Q3.</strong> Un camarade a négligé le retard et identifié un premier ordre de constante de temps 6,5 s. Comparer les deux modèles à \(t = 2\ \text{s}\) et à \(t = 6{,}5\ \text{s}\).</div>
  <div class="q"><strong>Q4.</strong> La vanne oscille autour de sa position moyenne à la pulsation \(\omega = 0{,}25\ \text{rad/s}\). Calculer l'amplitude de la température (en K par % d'ouverture) et son déphasage, sachant qu'un retard pur ne change pas l'amplitude et retarde la phase de \(\omega T\) (en radians).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Rien pendant 2,5 s, puis une montée sans dépassement : premier ordre retardé \(H(p) = \dfrac{K\,e^{-Tp}}{1 + \tau p}\), avec \(T = 2{,}5\ \text{s}\) (temps de transport de l'eau jusqu'à la sonde), \(\tau = 6{,}5 - 2{,}5 = 4\ \text{s}\) (les 63 % se comptent depuis le début de la montée) et \(K = 18/30 = 0{,}6\ \text{K}/\%\).</p>
    <p><strong>Q2.</strong> \(t_{r5\%} = T + 3\tau = 2{,}5 + 12 = 14{,}5\ \text{s}\).</p>
    <p><strong>Q3.</strong> À 2 s, la vraie température n'a pas bougé, alors que le modèle sans retard prévoit déjà \(18\,(1 - e^{-2/6{,}5}) = 4{,}8\ \text{K}\). À 6,5 s, les deux donnent 11,4 K (63 %) : c'est le point choisi pour identifier. Le modèle sans retard réagit trop tôt ; dans une boucle, il ferait croire à une marge de stabilité que le système réel n'a pas.</p>
    <p><strong>Q4.</strong> \(\tau\omega = 1\) : amplitude \(\dfrac{0{,}6}{\sqrt{1 + 1}} = 0{,}42\ \text{K}/\%\) ; phase</p><div class="formula">$$\varphi = -\arctan 1 - \omega T = -45° - 0{,}625\ \text{rad} = -45° - 35{,}8° \approx -81°.$$</div><p>Le retard double presque le déphasage, sans rien changer au gain.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Axe de positionnement : intégrateur et premier ordre</h3>
  <div class="statement">On alimente le moteur d'un axe de positionnement, à l'arrêt, par un échelon de tension \(U_0 = 2\ \text{V}\) et l'on enregistre la position angulaire \(\theta(t)\) du moteur. Le départ est à tangente horizontale ; ensuite, la courbe rejoint une droite de pente 40 rad/s qui coupe l'axe des temps à \(t = 0{,}05\ \text{s}\).</div>
  <div class="q"><strong>Q1.</strong> Proposer un modèle \(\dfrac{\theta(p)}{U(p)}\) et identifier ses paramètres.</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\theta(1\ \text{s})\). En déduire l'erreur commise en utilisant l'asymptote à cet instant.</div>
  <div class="q"><strong>Q3.</strong> Quelle est la fonction de transfert de la vitesse \(\Omega = d\theta/dt\) ? Au bout de combien de temps la vitesse est-elle établie à 5 % près ?</div>
  <div class="q"><strong>Q4.</strong> On asservit la position : \(u = K_c\,(\theta_c - \theta)\), retour unitaire. Montrer que la FTBF est un deuxième ordre de gain 1 et exprimer \(\omega_0\) et \(\xi\) en fonction de \(K_cK\) et \(\tau\).</div>
  <div class="q"><strong>Q5.</strong> Calculer \(K_c\) pour \(\xi = 1\), puis le temps de réponse (on donne, au régime critique, \(t_{r5\%}\,\omega_0 \approx 4{,}75\)). Comparer à la prévision obtenue en négligeant \(\tau\) (modèle intégrateur pur).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Tangente horizontale puis rampe : intégrateur et premier ordre, \(\dfrac{\theta(p)}{U(p)} = \dfrac{K}{p\,(1 + \tau p)}\). Pente de l'asymptote : \(KU_0 = 40\ \text{rad/s}\), donc \(K = 20\ \text{rad}\cdot\text{s}^{-1}\cdot\text{V}^{-1}\) ; abscisse à l'origine : \(\tau = 0{,}05\ \text{s}\).</p>
    <p><strong>Q2.</strong> \(\theta(1) = 40\,\big[1 - 0{,}05\,(1 - e^{-20})\big] = 38{,}0\ \text{rad}\). L'asymptote donne \(40\,(1 - 0{,}05) = 38{,}0\ \text{rad}\) aussi : au bout de \(20\tau\), l'écart (\(40 \times 0{,}05\,e^{-20}\)) est négligeable.</p>
    <p><strong>Q3.</strong> \(\Omega(p) = p\,\theta(p)\), donc \(\dfrac{\Omega(p)}{U(p)} = \dfrac{K}{1 + \tau p}\) : premier ordre, vitesse finale 40 rad/s, établie à 5 % près en \(3\tau = 0{,}15\ \text{s}\).</p>
    <p><strong>Q4.</strong> \(H_{BO} = \dfrac{K_cK}{p\,(1 + \tau p)}\), d'où</p><div class="formula">$$H_{BF} = \frac{K_cK}{\tau p^2 + p + K_cK} = \frac{1}{1 + \frac{1}{K_cK}\,p + \frac{\tau}{K_cK}\,p^2}.$$</div><p>Par identification : gain 1, \(\omega_0 = \sqrt{\dfrac{K_cK}{\tau}}\), \(\xi = \dfrac{1}{2\sqrt{K_cK\tau}}\).</p>
    <p><strong>Q5.</strong> \(\xi = 1\) : \(K_cK = \dfrac{1}{4\tau} = 5\ \text{s}^{-1}\), donc \(K_c = 0{,}25\ \text{V/rad}\) ; \(\omega_0 = \sqrt{5/0{,}05} = 10\ \text{rad/s}\) et \(t_{r5\%} \approx 4{,}75/10 = 0{,}47\ \text{s}\). En négligeant \(\tau\), la boucle serait un premier ordre de constante de temps \(1/(K_cK) = 0{,}2\ \text{s}\), soit \(t_{r5\%} = 0{,}6\ \text{s}\) : l'ordre de grandeur est bon, mais seul le modèle complet prévoit qu'au-delà de \(K_c = 0{,}25\ \text{V/rad}\) la réponse dépasse la consigne et oscille (\(\xi \lt 1\)).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Régulation de température d'une couveuse néonatale</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>modélisation, identification et asservissement d'un système du premier ordre</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    <p>Une couveuse maintient l'air qui entoure un nouveau-né à une température de consigne de 34 °C, dans une pièce à \(\theta_a = 25\) °C. Une résistance chauffante fournit une puissance \(P(t)\) comprise entre 0 et \(P_{max} = 200\ \text{W}\). On note \(x(t) = \theta(t) - \theta_a\) l'écart de la température de l'air à l'ambiante.</p>
    <p>Données de conception : capacité thermique de l'air et des parois \(C = 6{,}0\ \text{kJ/K}\) ; conductance thermique des parois \(G = 10\ \text{W/K}\) (la puissance perdue vaut \(G\,x\)).</p>
  </div>

  <p class="exo-part">Partie A — Modèle de connaissance</p>
  <div class="q"><strong>A1.</strong> Écrire le bilan d'énergie de l'air de la couveuse. Montrer que \(\dfrac{X(p)}{P(p)}\) est un premier ordre et calculer \(K\) et \(\tau\).</div>
  <div class="q"><strong>A2.</strong> Quelle puissance constante faut-il pour maintenir 34 °C ? Partant de 25 °C, combien de temps la couveuse met-elle alors à s'approcher de 34 °C à 5 % près ?</div>
  <div class="q"><strong>A3.</strong> Quelle est la température maximale que la couveuse peut atteindre ?</div>

  <p class="exo-part">Partie B — Identification et validation</p>
  <div class="statement">
    <p>Sur un prototype à l'équilibre à 25 °C, on applique un échelon de 100 W et l'on relève :</p>
    <div style="overflow-x:auto"><table>
      <tr><th>\(t\) (min)</th><td>0</td><td>2</td><td>4</td><td>6</td><td>8</td><td>10</td><td>15</td><td>20</td><td>30</td><td>40</td><td>60</td></tr>
      <tr><th>\(\theta\) (°C)</th><td>25,0</td><td>26,4</td><td>27,9</td><td>29,2</td><td>30,2</td><td>31,0</td><td>32,4</td><td>33,3</td><td>34,1</td><td>34,4</td><td>34,5</td></tr>
    </table></div>
  </div>
  <div class="q"><strong>B1.</strong> Pourquoi a-t-on choisi un échelon de 100 W plutôt que de 200 W, à partir d'un état d'équilibre ?</div>
  <div class="q"><strong>B2.</strong> Identifier \(K\) et \(\tau\) à partir du relevé (palier atteint à 60 min).</div>
  <div class="q"><strong>B3.</strong> Comparer au modèle de la partie A. Proposer une explication de l'écart sur le gain. Le modèle de conception est-il acceptable ?</div>

  <p class="exo-part">Partie C — La sonde de température</p>
  <div class="q"><strong>C1.</strong> La sonde se comporte comme un premier ordre de gain 1 et de constante de temps \(\tau_s = 20\ \text{s}\). Au début d'une chauffe à pleine puissance, la température de l'air monte d'environ 1,9 K/min. Quel écart la sonde présente-t-elle alors ?</div>
  <div class="q"><strong>C2.</strong> Justifier que, pour la suite, on puisse assimiler la sonde à un gain unitaire.</div>

  <p class="exo-part">Partie D — Régulation proportionnelle</p>
  <div class="statement">On prend le modèle identifié en B (\(K = 0{,}095\ \text{K/W}\), \(\tau = 600\ \text{s}\)). La commande est \(P = K_c\,(x_c - x)\), avec \(x_c = 9\ \text{K}\) (consigne de 34 °C).</div>
  <div class="q"><strong>D1.</strong> Sans tenir compte de la limite \(P_{max}\), donner la FTBF \(\dfrac{X(p)}{X_c(p)}\). Le cahier des charges impose un écart statique d'au plus 0,3 K : en déduire la valeur minimale de \(K_c\). Avec \(K_c = 320\ \text{W/K}\), calculer l'écart statique et le temps de réponse prévus.</div>
  <div class="q"><strong>D2.</strong> Calculer la puissance demandée à l'instant où l'on fixe la consigne. Conclure sur la validité de la prévision de D1.</div>
  <div class="q"><strong>D3.</strong> Pendant la phase saturée, \(P = P_{max}\). Calculer l'instant où la commande cesse d'être saturée, puis estimer le temps de réponse réel.</div>
  <div class="q"><strong>D4.</strong> Écrire un programme Python qui simule la boucle avec saturation par la méthode d'Euler (fonction <span class="code-inline">euler(F, t0, y0, h, n)</span> du cours, §8) et qui affiche la valeur finale et le temps de réponse à 5 %.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(C\,\dfrac{dx}{dt} = P - G\,x\), soit \(\dfrac{C}{G}\,x' + x = \dfrac{1}{G}\,P\) : premier ordre de gain \(K = 1/G = 0{,}10\ \text{K/W}\) et de constante de temps \(\tau = C/G = 6000/10 = 600\ \text{s} = 10\ \text{min}\).</p>
    <p><strong>A2.</strong> En régime permanent, \(P = G\,x = 10 \times 9 = 90\ \text{W}\). Sans régulation, la température s'approche de 34 °C comme \(9\,(1 - e^{-t/\tau})\) : à 5 % près au bout de \(3\tau = 30\ \text{min}\), beaucoup trop lent pour une couveuse dont on ouvre les hublots.</p>
    <p><strong>A3.</strong> \(x_{max} = K\,P_{max} = 20\ \text{K}\), soit 45 °C : la puissance est largement suffisante, ce qui permettra d'accélérer la chauffe en boucle fermée.</p>
    <p><strong>B1.</strong> Partir d'un équilibre permet de mesurer une variation due au seul échelon. 100 W donnent une variation de l'ordre de 10 K, grande devant le bruit de mesure, sans s'approcher de la limite de l'actionneur ni d'une température dangereuse pour le matériel ; à 200 W, on monterait vers 45 °C, hors du domaine d'utilisation.</p>
    <p><strong>B2.</strong> Variation finale : \(34{,}5 - 25{,}0 = 9{,}5\ \text{K}\) pour 100 W, donc \(K = 0{,}095\ \text{K/W}\). 63 % de la variation : \(25 + 0{,}632 \times 9{,}5 = 31{,}0\) °C, atteint à 10 min : \(\tau = 600\ \text{s}\). Contrôle : 95 % (34,0 °C) est atteint entre 20 et 30 min, vers \(3\tau = 30\ \text{min}\).</p>
    <p><strong>B3.</strong> La constante de temps est celle prévue ; le gain est 5 % plus faible, ce qui correspond à une conductance réelle de \(1/0{,}095 = 10{,}5\ \text{W/K}\) : fuites d'air par les hublots et la ventilation, non comptées dans \(G\). Un écart de 5 % est acceptable pour un modèle de conception ; pour régler la boucle, on garde le modèle identifié.</p>
    <p><strong>C1.</strong> Rampe \(a = 1{,}9/60 \approx 0{,}032\ \text{K/s}\) : écart de traînage \(a\tau_s \approx 0{,}63\ \text{K}\), avec un retard de 20 s. La sonde sous-estime la température pendant la chauffe.</p>
    <p><strong>C2.</strong> \(\tau_s = 20\ \text{s}\) est trente fois plus petite que \(\tau = 600\ \text{s}\) : l'effet de la sonde ne se voit qu'au tout début des réponses (quelques dizaines de secondes) et n'affecte ni le gain ni l'allure générale. On l'assimile à un gain unitaire, en gardant en tête que cette simplification devra être vérifiée si la boucle devient très rapide.</p>
    <p><strong>D1.</strong> \(\dfrac{X(p)}{X_c(p)} = \dfrac{K_cK}{1 + K_cK + \tau p} = \dfrac{K'}{1 + \tau' p}\), avec \(K' = \dfrac{K_cK}{1 + K_cK}\) et \(\tau' = \dfrac{\tau}{1 + K_cK}\). Écart statique : \(\dfrac{x_c}{1 + K_cK} \le 0{,}3\) impose \(1 + K_cK \ge 30\), donc \(K_c \ge 29/0{,}095 \approx 305\ \text{W/K}\). Avec \(K_c = 320\ \text{W/K}\) : \(K_cK = 30{,}4\), écart \(9/31{,}4 = 0{,}29\ \text{K}\) (température finale 33,7 °C), \(\tau' = 600/31{,}4 = 19\ \text{s}\), \(t_{r5\%} = 3\tau' \approx 57\ \text{s}\).</p>
    <p><strong>D2.</strong> \(P(0^+) = K_c\,x_c = 320 \times 9 = 2880\ \text{W}\), quatorze fois \(P_{max}\). La résistance chauffe à 200 W tant que \(K_c\,(x_c - x)\) dépasse 200 W : le modèle linéaire n'est plus valable au début de la réponse, et la prévision de 57 s est beaucoup trop optimiste.</p>
    <p><strong>D3.</strong> Phase saturée : \(x(t) = K P_{max}\,(1 - e^{-t/\tau}) = 19\,(1 - e^{-t/600})\). La saturation cesse quand \(320\,(9 - x) = 200\), soit \(x = 8{,}375\ \text{K}\), atteint en \(t = -600\ln(1 - 8{,}375/19) \approx 349\ \text{s}\). La bande des 5 % autour de la valeur finale \(8{,}71\ \text{K}\) commence à \(8{,}28\ \text{K}\), atteint en \(t = -600\ln(1 - 8{,}28/19) \approx 343\ \text{s}\) ; la réponse est monotone, donc \(t_{r5\%} \approx 5{,}7\ \text{min}\), six fois plus que la prévision linéaire, et cinq fois moins qu'en boucle ouverte.</p>
    <p><strong>D4.</strong> On borne la commande dans la fonction \(F\) :</p>
    <pre class="codeblock"><span class="kw">def</span> euler(F, t0, y0, h, n):
    ts, ys = [t0], [y0]
    y = y0
    <span class="kw">for</span> k <span class="kw">in</span> range(n):
        y = y + h * F(t0 + k * h, y)
        ts.append(t0 + (k + 1) * h)
        ys.append(y)
    <span class="kw">return</span> ts, ys

K, tau, Kc, Pmax = 0.095, 600.0, 320.0, 200.0
xc = 9.0                                        <span class="cmt"># consigne : 34 °C, soit 9 K au-dessus de l'ambiante</span>

<span class="kw">def</span> F(t, x):
    P = min(Pmax, max(0.0, Kc * (xc - x)))      <span class="cmt"># commande proportionnelle, bornée à [0, Pmax]</span>
    <span class="kw">return</span> (K * P - x) / tau

ts, xs = euler(F, 0, 0.0, 1.0, 900)             <span class="cmt"># pas de 1 s, petit devant tau' = 19 s</span>
xf = xs[-1]
k = max(i <span class="kw">for</span> i <span class="kw">in</span> range(len(xs)) <span class="kw">if</span> abs(xs[i] - xf) &gt; 0.05 * xf)
print(round(xf, 2), ts[k + 1])                  <span class="cmt"># dernier instant hors de la bande, plus un pas</span></pre>
    <p>Le programme affiche :</p>
    <pre class="codeblock">8.71 343.0</pre>
    <p>On retrouve la valeur finale de D1 (8,71 K) et le temps de réponse de D3 (343 s). Sans la ligne qui borne \(P\), le même programme donne 56 s, la prévision linéaire.</p>
  </div>
</div>

</div>
