<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PT</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre la partie A « Courbes implicites du plan » de la section « Courbes et surfaces » du programme de PT. Il applique le gradient (chapitre Fonctions de plusieurs variables) aux courbes d'équation \(f(x,y)=0\), puis définit les coniques par foyer, directrice et excentricité. La réduction d'une équation du second degré contenant un terme en \(xy\) est traitée au chapitre Réduction des coniques et matrices symétriques, les surfaces d'équation \(f(x,y,z)=0\) au chapitre Courbes et surfaces de l'espace.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les notions et capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Courbe d'équation \(f(x,y)=0\)</strong>, où \(f\) est de classe \(C^1\) ; lignes de niveau de \(f\) (§1).</li>
        <li><strong>Point régulier</strong> ; en un point régulier, le gradient est normal à la tangente (l'existence d'un paramétrage local de classe \(C^1\) est admise) ; équation de la tangente (§2).</li>
        <li><strong>Gradient et lignes de niveau</strong> : lorsqu'il est non nul, le gradient est orthogonal aux lignes de niveau et orienté dans le sens des valeurs croissantes de \(f\) (§3).</li>
        <li><strong>Coniques définies par foyer, directrice et excentricité</strong> ; obtention d'une équation cartésienne réduite à partir de la définition géométrique (§4 à §7).</li>
        <li><strong>Classification selon l'excentricité</strong> à partir d'une équation réduite ; axes et centre de symétrie, grand axe et petit axe d'une ellipse, asymptotes d'une hyperbole, déterminés à partir d'une équation réduite. Les formules donnant ces éléments ne sont pas exigibles : elles sont fournies au besoin (§5 à §8).</li>
        <li><strong>Paramétrages</strong> de l'ellipse par les fonctions trigonométriques et de chaque branche d'hyperbole, séparément, par les fonctions hyperboliques (§6, §7).</li>
        <li><strong>Hyperbole \(xy=k\)</strong>, d'asymptotes les axes du repère (§7) ; équation générale \(ax^2+2bxy+cy^2+dx+ey+f=0\) : renvoi au chapitre Réduction des coniques (§8).</li>
        <li><strong>Tangente à une conique</strong> par le gradient (§9) ; la règle du dédoublement n’en est qu’un raccourci de calcul.</li>
      </ul>
      <p>Hors programme (en fin de chapitre) : l'équation polaire des coniques ; les définitions bifocale, par cercle directeur ou comme sections planes d'un cône, qui « peuvent être présentées » sans qu'aucune connaissance soit attendue ; le passage général d'une équation cartésienne à un paramétrage (seulement sur des exemples).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · COURBES DÉFINIES PAR UNE ÉQUATION</div>
  <h2>Décrire une courbe par une condition sur les coordonnées</h2>
  <div class="intro">Une droite \(ax+by+c=0\), un cercle \(x^2+y^2=R^2\) : on décrit souvent une courbe par une équation plutôt que par un paramétrage. Toute fonction \(f\) de deux variables assez régulière fournit ainsi une courbe \(f(x,y)=0\), et même toute une famille de courbes, ses lignes de niveau. Dans tout le chapitre, le plan est rapporté à un repère orthonormé \((O;\vec\imath,\vec\jmath)\).</div>

  <div class="def-box">
    Soit \(U\) un ouvert de \(\mathbb{R}^2\) et \(f : U\to\mathbb{R}\) de classe \(C^1\). La <strong>courbe d'équation \(f(x,y)=0\)</strong> est l'ensemble \(\Gamma\) des points \(M(x,y)\), avec \((x,y)\in U\), tels que \(f(x,y)=0\). Pour \(\lambda\in\mathbb{R}\), la <strong>ligne de niveau \(\lambda\)</strong> de \(f\) est l'ensemble des points de \(U\) où \(f\) vaut \(\lambda\) : c'est la courbe d'équation \(f(x,y)-\lambda=0\).
  </div>
  <p>Chaque point \(M\) de \(U\) est sur exactement une ligne de niveau, celle de niveau \(f(M)\) : les lignes de niveau découpent \(U\) en « tranches » disjointes. C'est le principe des cartes topographiques (courbes d'altitude constante), des cartes météorologiques (isobares, isothermes) et, en physique, des équipotentielles.</p>

  <p><strong>Exemples de référence.</strong> Les lignes de niveau de \(f(x,y)=ax+by+c\), avec \((a,b)\neq(0,0)\), sont des droites parallèles ; celles de \(f(x,y)=(x-x_0)^2+(y-y_0)^2\) sont les cercles de centre \((x_0,y_0)\). La courbe représentative d'une fonction \(g\) de classe \(C^1\) est la courbe d'équation \(y-g(x)=0\) ; la réciproque est fausse, un cercle n'étant pas un graphe.</p>

  <div class="method-box">
    <strong>Exemple — lignes de niveau de \(f(x,y)=x^2+4y^2-2x\)</strong>
    <ol>
      <li>On complète le carré : \(x^2-2x=(x-1)^2-1\), donc \(f(x,y)=(x-1)^2+4y^2-1\).</li>
      <li>La ligne de niveau \(\lambda\) a pour équation \((x-1)^2+4y^2=\lambda+1\).</li>
      <li>Si \(\lambda\gt-1\), en divisant par \(\lambda+1\) :
        <div class="formula">$$\frac{(x-1)^2}{\lambda+1}+\frac{y^2}{(\lambda+1)/4}=1,$$</div>
        une ellipse de centre \(\Omega(1,0)\), de demi-axes \(\sqrt{\lambda+1}\) et \(\frac12\sqrt{\lambda+1}\) (§6).</li>
      <li>Si \(\lambda=-1\), la ligne de niveau est réduite au point \(\Omega\), où \(f\) atteint son minimum \(-1\) ; si \(\lambda\lt-1\), elle est vide.</li>
      <li>Les ellipses obtenues ont toutes le même rapport de demi-axes \(\frac12\) : elles se déduisent les unes des autres par des homothéties de centre \(\Omega\).</li>
    </ol>
  </div>

  <h3>Équation et paramétrage, sur des exemples</h3>
  <p>D'un paramétrage, on tire une équation en <strong>éliminant le paramètre</strong> : \(x=2\cos t\), \(y=\sin t\) donne \(\frac{x^2}{4}+y^2=1\). En sens inverse, on reconnaît une identité : \(\frac{x^2}{4}+y^2=1\) invite à poser \(\frac x2=\cos t\), \(y=\sin t\) (§6). On peut aussi résoudre par morceaux : \(x^2+y^2=1\) donne les deux demi-cercles \(y=\pm\sqrt{1-x^2}\).</p>

  <div class="notice"><strong>Erreur classique</strong> : croire qu'une équation \(f(x,y)=0\) décrit toujours une « vraie » courbe. L'ensemble peut être vide (\(x^2+y^2+1=0\)), réduit à un point (\(x^2+y^2=0\)), ou contenir une région entière si \(f\) s'annule sur un disque. Il faut chaque fois identifier l'ensemble obtenu.</div>
</div>

<div class="course-section">
  <div class="sec-num">§2 · POINT RÉGULIER ET TANGENTE</div>
  <h2>Le gradient est normal à la tangente</h2>
  <div class="intro">Une courbe donnée par une équation peut se croiser ou présenter une pointe. Le gradient de \(f\) repère les points où tout se passe bien et y fournit directement un vecteur normal, donc l'équation de la tangente, sans avoir à paramétrer la courbe.</div>

  <div class="def-box">
    Soit \(\Gamma\) la courbe d'équation \(f(x,y)=0\) (\(f\) de classe \(C^1\) sur l'ouvert \(U\)) et \(M_0(x_0,y_0)\) un point de \(\Gamma\). On rappelle que \(\nabla f=\big(\partial_x f,\ \partial_y f\big)\), où \(\partial_x f=\dfrac{\partial f}{\partial x}\). Le point \(M_0\) est <strong>régulier</strong> si \(\nabla f(M_0)\neq\vec 0\), c'est-à-dire si l'une au moins des deux dérivées partielles est non nulle en \(M_0\). Sinon, \(M_0\) est un point <strong>singulier</strong> de \(\Gamma\).
  </div>
  <div class="prop-box">
    <strong>Résultat admis.</strong> Au voisinage d'un point régulier \(M_0\), la courbe \(\Gamma\) admet un paramétrage \(t\mapsto M(t)=\big(x(t),y(t)\big)\) de classe \(C^1\) sur un intervalle ouvert contenant \(t_0\), avec \(M(t_0)=M_0\) et \(\overrightarrow{M'(t_0)}\neq\vec 0\). En particulier, \(\Gamma\) admet une tangente en \(M_0\).
  </div>
  <div class="prop-box">
    <strong>Théorème (gradient normal à la tangente).</strong> En un point régulier \(M_0\) de \(\Gamma\), le vecteur \(\nabla f(M_0)\) est orthogonal à la tangente à \(\Gamma\) en \(M_0\). La tangente est la droite passant par \(M_0\) de vecteur normal \(\nabla f(M_0)\) :
    <div class="formula" data-nom="Tangente à une courbe f(x, y) = 0">$$\frac{\partial f}{\partial x}(x_0,y_0)\,(x-x_0)+\frac{\partial f}{\partial y}(x_0,y_0)\,(y-y_0)=0 .$$</div>
    Elle est dirigée par le vecteur \(\big(-\partial_y f(M_0),\ \partial_x f(M_0)\big)\), qui est le gradient tourné d'un quart de tour. La droite passant par \(M_0\) dirigée par \(\nabla f(M_0)\) est la <strong>normale</strong> à \(\Gamma\) en \(M_0\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Dériver la relation \(f\big(x(t),y(t)\big)=0\).</span>
    <div class="content">
      <p>Soit \(t\mapsto M(t)\) le paramétrage local admis. Comme \(M(t)\) reste sur \(\Gamma\), la fonction \(\varphi(t)=f\big(x(t),y(t)\big)\) est nulle sur tout l'intervalle, donc sa dérivée aussi. La règle de la chaîne donne :</p>
      <div class="formula">$$\begin{aligned}\varphi'(t)&=\frac{\partial f}{\partial x}\big(M(t)\big)\,x'(t)+\frac{\partial f}{\partial y}\big(M(t)\big)\,y'(t)\\&=\nabla f\big(M(t)\big)\cdot\overrightarrow{M'(t)}=0 .\end{aligned}$$</div>
      <p>En \(t=t_0\) : \(\nabla f(M_0)\cdot\overrightarrow{M'(t_0)}=0\). Le vecteur non nul \(\overrightarrow{M'(t_0)}\) dirige la tangente, et le gradient lui est orthogonal. Dans le plan, un point \(M\) est sur la tangente si et seulement si \(\overrightarrow{M_0M}\) est colinéaire à \(\overrightarrow{M'(t_0)}\), c'est-à-dire orthogonal au vecteur non nul \(\nabla f(M_0)\) : c'est l'équation annoncée.</p>
    </div>
  </div>
  <p><strong>Cas d'un graphe.</strong> Pour la courbe \(y=g(x)\), on pose \(f(x,y)=g(x)-y\) : \(\nabla f=\big(g'(x),-1\big)\) ne s'annule jamais, tout point est régulier, et la formule redonne la tangente de première année \(y-y_0=g'(x_0)(x-x_0)\). <strong>Pente.</strong> Si \(\partial_y f(M_0)\neq0\), la tangente a pour pente \(-\partial_x f(M_0)/\partial_y f(M_0)\). Elle est horizontale lorsque \(\partial_x f(M_0)=0\) et verticale lorsque \(\partial_y f(M_0)=0\) (l'autre dérivée étant non nulle).</p>

  <div class="method-box">
    <strong>Exemple — la courbe \(x\,e^{y}+y=1\)</strong>
    <ol>
      <li>\(f(x,y)=x\,e^{y}+y-1\) est de classe \(C^1\) sur \(\mathbb{R}^2\), et \(\partial_x f(x,y)=e^{y}\) ne s'annule jamais : <strong>tous</strong> les points de la courbe sont réguliers.</li>
      <li>Le point \(A(1,0)\) est sur la courbe, car \(1\cdot e^{0}+0=1\). On a \(\partial_y f=x\,e^{y}+1\), d'où \(\nabla f(A)=(1,2)\).</li>
      <li>Tangente en \(A\) : \(1\cdot(x-1)+2\,(y-0)=0\), soit \(x+2y=1\), de pente \(-\frac12\).</li>
      <li>Contrôle : la courbe est le graphe \(x=(1-y)\,e^{-y}\), de dérivée \((y-2)\,e^{-y}\), égale à \(-2\) en \(y=0\) : tangente \(x-1=-2y\), la même droite.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — tangentes horizontales et point singulier de la lemniscate</strong>
    <p>La lemniscate de Bernoulli \(\mathcal L\) (en noir sur la figure du §3) a pour équation \(f(x,y)=0\), avec \(f(x,y)=(x^2+y^2)^2-2(x^2-y^2)\).</p>
    <ol>
      <li>Dérivées partielles : \(\partial_x f=4x\,(x^2+y^2-1)\) et \(\partial_y f=4y\,(x^2+y^2+1)\).</li>
      <li>Points singuliers : \(\partial_y f=0\) impose \(y=0\) (car \(x^2+y^2+1\gt0\)), puis \(\partial_x f=0\) donne \(x\in\{-1,0,1\}\). Seul \(O\) est sur \(\mathcal L\), puisque \(f(\pm1,0)=-1\) : <strong>\(O\) est l'unique point singulier</strong>, là où la courbe se croise.</li>
      <li>Tangentes horizontales : \(\partial_x f=0\) avec \(\partial_y f\neq0\). Hors de \(O\), cela impose \(x^2+y^2=1\), puis l'équation de \(\mathcal L\) donne \(x^2-y^2=\frac12\), d'où \(x^2=\frac34\) et \(y^2=\frac14\).</li>
      <li>D'où quatre points \(\big(\pm\frac{\sqrt3}{2},\pm\frac12\big)\) ; en \(\big(\frac{\sqrt3}{2},\frac12\big)\), \(\nabla f=(0,4)\) et la tangente est \(y=\frac12\), ordonnée maximale de \(\mathcal L\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : la régularité dépend de l'<strong>équation</strong> choisie, pas seulement de l'ensemble de points. Le cercle unité est la courbe \(x^2+y^2-1=0\), dont tous les points sont réguliers ; c'est aussi la courbe \((x^2+y^2-1)^2=0\), dont le gradient \(4(x^2+y^2-1)\,(x,y)\) est nul en tout point du cercle. En un point singulier, on ne peut rien conclure : la courbe peut y être lisse (ce cercle), se croiser (lemniscate) ou former une pointe (\(y^2=x^3\) en \(O\)).</div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · GRADIENT ET LIGNES DE NIVEAU</div>
  <h2>Le gradient pointe vers les valeurs croissantes</h2>
  <div class="intro">Appliqué à chaque ligne de niveau, le §2 montre que le gradient leur est orthogonal. On précise ici de quel côté il pointe et ce que mesure sa norme : le gradient donne la direction de plus forte pente, une notion omniprésente en physique.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(f\) de classe \(C^1\) sur un ouvert \(U\) et \(M_0\in U\) tel que \(\nabla f(M_0)\neq\vec 0\). Alors :
    <ul>
      <li>\(\nabla f(M_0)\) est orthogonal à la ligne de niveau de \(f\) passant par \(M_0\), c'est-à-dire à sa tangente en \(M_0\) ;</li>
      <li>\(\nabla f(M_0)\) est orienté dans le sens des valeurs croissantes de \(f\) : pour \(s\gt0\) assez petit, \(f\big(M_0+s\,\nabla f(M_0)\big)\gt f(M_0)\).</li>
    </ul>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Orthogonalité par le §2, orientation par une dérivée.</span>
    <div class="content">
      <p>La ligne de niveau passant par \(M_0\) est la courbe d'équation \(g(x,y)=0\) avec \(g=f-f(M_0)\). Comme \(\nabla g=\nabla f\), \(M_0\) en est un point régulier, et le §2 donne l'orthogonalité. Pour l'orientation, on pose \(\vec n=\nabla f(M_0)\) et \(\psi(s)=f(M_0+s\,\vec n)\). La règle de la chaîne donne \(\psi'(0)=\nabla f(M_0)\cdot\vec n=\|\nabla f(M_0)\|^2\gt0\). Le taux d'accroissement \(\frac{\psi(s)-\psi(0)}{s}\) tend vers ce nombre strictement positif quand \(s\to0\) : il est donc strictement positif pour \(s\gt0\) assez petit, ce qui signifie \(f(M_0+s\,\vec n)\gt f(M_0)\).</p>
    </div>
  </div>
  <div class="prop-box">
    <strong>Direction de plus forte pente.</strong> Pour un vecteur unitaire \(\vec u\), la dérivée de \(f\) en \(M_0\) selon \(\vec u\) vaut
    <div class="formula" data-nom="Dérivée selon un vecteur unitaire">$$D_{\vec u}f(M_0)=\nabla f(M_0)\cdot\vec u .$$</div>
    Par l'inégalité de Cauchy-Schwarz, elle est maximale, égale à \(\|\nabla f(M_0)\|\), pour \(\vec u\) unitaire colinéaire à \(\nabla f(M_0)\) et de même sens : le gradient indique la direction de plus forte croissance de \(f\), et sa norme ce taux de croissance. Le long de la ligne de niveau, ce taux est nul.
  </div>

<figcaption>Lignes de niveau −0,75 ; −0,4 ; 0 (en noir, la lemniscate) ; 0,5 et 1,5 de la fonction f(x, y) = (x² + y²)² − 2(x² − y²). Les gradients (en vert, de longueur proportionnelle à leur norme) sont orthogonaux aux lignes de niveau, donc à la tangente (en tirets), et pointent vers les niveaux croissants. En O, col de f, la ligne de niveau 0 se croise ; en (±1, 0), minimums de valeur −1.</figcaption>

  <p><strong>Lire une carte de niveaux.</strong> Entre les lignes de niveau \(\lambda\) et \(\lambda+\delta\), l'écart mesuré le long du gradient vaut environ \(\delta/\|\nabla f\|\) : des lignes serrées signalent une pente raide. Autour d'un extremum local, les lignes s'enroulent autour du point ; en un col, la ligne de niveau critique se croise. <strong>En physique</strong>, \(\vec E=-\overrightarrow{\operatorname{grad}}\,V\) est orthogonal aux équipotentielles et dirigé vers les potentiels décroissants ; le flux thermique \(\vec\jmath=-\lambda\,\overrightarrow{\operatorname{grad}}\,T\) est orthogonal aux isothermes.</p>

  <div class="method-box">
    <strong>Exemple — le randonneur</strong>
    <p>Sur une carte, l'altitude en mètres est modélisée par \(h(x,y)=100-x^2-2y^2\), où \(x\) et \(y\) sont en kilomètres. Un randonneur se trouve en \(A(3,2)\).</p>
    <ol>
      <li>Altitude : \(h(3,2)=100-9-8=83\) m. Gradient : \(\nabla h=(-2x,-4y)\), donc \(\nabla h(A)=(-6,-8)\), de norme 10.</li>
      <li>Pour monter le plus vite possible, il part selon \(\nabla h(A)\), c'est-à-dire selon le vecteur unitaire \(\big(-\frac35,-\frac45\big)\). La pente y vaut 10 m par kilomètre, soit 1 %.</li>
      <li>Pour rester à la même altitude, il suit la ligne de niveau 83, l'ellipse \(x^2+2y^2=17\). Sa tangente en \(A\) a pour équation \(-6(x-3)-8(y-2)=0\), soit \(3x+4y=17\) ; elle est dirigée par \((4,-3)\), orthogonal à \(\nabla h(A)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : prendre le gradient pour un vecteur directeur de la tangente. Il est <strong>normal</strong> à la ligne de niveau ; la tangente est dirigée par \((-\partial_y f,\ \partial_x f)\). En un point critique, le théorème ne dit rien.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · CONIQUES : FOYER, DIRECTRICE, EXCENTRICITÉ</div>
  <h2>Une définition commune aux ellipses, paraboles et hyperboles</h2>
  <div class="intro">Après les droites et les cercles, les coniques sont les courbes les plus simples : orbites des planètes et des comètes, profils de miroirs et d'antennes, trajectoires des projectiles. Le programme les définit toutes de la même façon, par un point, une droite et un nombre ; un repère bien choisi en donne ensuite une équation très simple, dite réduite.</div>

  <div class="def-box">
    Soit \(F\) un point, \(\mathcal D\) une droite ne passant pas par \(F\) et \(e\) un réel strictement positif. La <strong>conique</strong> de <strong>foyer</strong> \(F\), de <strong>directrice</strong> \(\mathcal D\) et d'<strong>excentricité</strong> \(e\) est l'ensemble des points \(M\) du plan tels que
    <div class="formula" data-nom="Définition d'une conique">$$MF=e\;d(M,\mathcal D),$$</div>
    où \(d(M,\mathcal D)=MH\), \(H\) étant le projeté orthogonal de \(M\) sur \(\mathcal D\). La conique est une <strong>ellipse</strong> si \(e\lt1\), une <strong>parabole</strong> si \(e=1\), une <strong>hyperbole</strong> si \(e\gt1\).
  </div>
  <div class="prop-box">
    <strong>Axe focal.</strong> La droite \(\Delta\) passant par \(F\) et perpendiculaire à \(\mathcal D\) est un axe de symétrie de la conique ; on l'appelle l'<strong>axe focal</strong>. Elle coupe \(\mathcal D\) en un point \(K\), et l'on note \(h=FK=d(F,\mathcal D)\gt0\). Le nombre \(p=e\,h\) est le <strong>paramètre</strong> de la conique.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Pourquoi l'axe focal est-il un axe de symétrie ?</span>
    <div class="content"><p>La symétrie orthogonale \(s\) d'axe \(\Delta\) conserve les distances, fixe \(F\) (qui est sur \(\Delta\)) et envoie \(\mathcal D\) sur elle-même (\(\mathcal D\) est perpendiculaire à \(\Delta\)). Donc \(s(M)F=MF\) et \(d\big(s(M),\mathcal D\big)=d(M,\mathcal D)\) : le point \(M\) est sur la conique si et seulement si \(s(M)\) l'est.</p></div>
  </div>

  <h3>L'équation dans le repère du foyer</h3>
  <p>Plaçons l'origine en \(F\) et l'axe des abscisses sur \(\Delta\), orienté de \(K\) vers \(F\) : la directrice a pour équation \(x=-h\). Pour \(M(x,y)\), \(MF^2=x^2+y^2\) et \(d(M,\mathcal D)=|x+h|\). Les deux membres de \(MF=e\,d(M,\mathcal D)\) étant positifs, cette condition équivaut à l'égalité de leurs carrés :</p>
  <div class="formula" data-nom="Conique dans le repère du foyer">$$x^2+y^2=e^2(x+h)^2\iff(1-e^2)\,x^2-2e^2h\,x+y^2=e^2h^2 .$$</div>
  <p>Le classement se lit sur le coefficient \(1-e^2\) de \(x^2\) : nul pour la parabole, strictement positif pour l'ellipse, strictement négatif pour l'hyperbole. Les §5 à §7 achèvent le calcul dans chaque cas par un changement d'origine (mise sous forme canonique), ce qui donne l'équation réduite.</p>

</figure>

  <div class="method-box">
    <strong>Exemple — une ellipse donnée par foyer et directrice</strong>
    <p>Foyer \(F(1,0)\), directrice \(\mathcal D : x=-2\), excentricité \(e=\frac12\).</p>
    <ol>
      <li>\(M(x,y)\) est sur la conique si et seulement si \((x-1)^2+y^2=\frac14(x+2)^2\) ; en multipliant par 4 et en développant : \(3x^2-12x+4y^2=0\).</li>
      <li>Forme canonique : \(3(x^2-4x)=3(x-2)^2-12\), donc \(3(x-2)^2+4y^2=12\), soit \(\dfrac{(x-2)^2}{4}+\dfrac{y^2}{3}=1\).</li>
      <li>Ellipse de centre \(\Omega(2,0)\), de demi-axes \(a=2\) et \(b=\sqrt3\) ; avec le §6, \(c=1\), \(e=\frac ca=\frac12\), foyer \(\Omega-c\,\vec\imath=F\), directrice \(x=2-\frac ae=-2\).</li>
      <li>Le couple symétrique par rapport à \(\Omega\), foyer \(F'(3,0)\) et directrice \(x=6\), définit la même ellipse.</li>
    </ol>
  </div>
  <p><strong>Directrice oblique.</strong> Avec le foyer \(O\), la directrice \(x+y=2\) et \(e=1\), la condition \(MO^2=d(M,\mathcal D)^2=\frac{(x+y-2)^2}{2}\) donne \(x^2-2xy+y^2+4x+4y-4=0\) : une parabole d'axe la première bissectrice, dont l'équation contient un terme en \(xy\) parce que le repère n'est pas adapté (voir le chapitre Réduction des coniques).</p>
  <div class="notice"><strong>Erreur classique</strong> : oublier que la directrice ne doit pas passer par le foyer. Si \(F\in\mathcal D\), la condition \(MF=e\,MH\) décrit tout autre chose : le seul point \(F\) pour \(e\lt1\), la perpendiculaire à \(\mathcal D\) en \(F\) pour \(e=1\), deux droites sécantes en \(F\) pour \(e\gt1\). Ce sont des coniques « dégénérées ».</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · LA PARABOLE</div>
  <h2>Excentricité 1 : équation réduite \(y^2=2px\)</h2>
  <div class="intro">Pour \(e=1\), la parabole est l'ensemble des points équidistants d'un point \(F\) et d'une droite \(\mathcal D\). C'est la conique dont le calcul est le plus court ; le paramètre \(p\) est alors la distance du foyer à la directrice.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(\mathcal P\) la parabole de foyer \(F\) et de directrice \(\mathcal D\), et \(p=d(F,\mathcal D)\). Dans le repère orthonormé d'origine le milieu \(S\) de \([KF]\) et d'axe des abscisses l'axe focal orienté vers \(F\), on a \(F\big(\frac p2,0\big)\), \(\mathcal D : x=-\frac p2\) et
    <div class="formula" data-nom="Parabole : équation réduite">$$\mathcal P : \ y^2=2px .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Obtenir \(y^2=2px\) à partir de \(MF=MH\).</span>
    <div class="content">
      <p>Pour \(e=1\) (et \(h=p\)), l'équation du §4 dans le repère du foyer s'écrit \(y^2=2p\,x+p^2=2p\big(x+\frac p2\big)\). On déplace l'origine en \(S\big(-\frac p2,0\big)\), milieu de \([KF]\) : avec \(X=x+\frac p2\), il vient \(y^2=2pX\), et le foyer a pour nouvelle abscisse \(\frac p2\).</p>
      <p>On peut aussi calculer directement dans le repère d'origine \(S\) : \(MF^2=\big(x-\frac p2\big)^2+y^2\) et \(d(M,\mathcal D)^2=\big(x+\frac p2\big)^2\). Leur égalité se simplifie en \(y^2=2px\) : les termes \(x^2\) et \(\frac{p^2}{4}\) disparaissent des deux côtés. Toutes les étapes sont des équivalences.</p>
    </div>
  </div>

  <h3>Éléments géométriques</h3>
  <ul>
    <li><strong>Sommet</strong> \(S\), seul point de \(\mathcal P\) sur l'axe focal ; <strong>axe de symétrie</strong> : l'axe focal \((Ox)\). La parabole n'a pas de centre de symétrie.</li>
    <li>Elle est contenue dans le demi-plan \(x\geqslant0\) et n'a pas d'asymptote (branche parabolique de direction \((Ox)\)).</li>
    <li><strong>Paramètre</strong> : la droite \(x=\frac p2\), perpendiculaire à l'axe passant par le foyer, coupe \(\mathcal P\) en \(\big(\frac p2,\pm p\big)\) ; \(p\) est la demi-longueur de cette corde.</li>
    <li><strong>Paramétrage</strong> par l'ordonnée : \(t\mapsto\Big(\dfrac{t^2}{2p},\ t\Big)\), \(t\in\mathbb{R}\).</li>
    <li><strong>Autres positions</strong> : \(y^2=-2px\) (tournée vers les \(x\) négatifs) ; \(x^2=2py\), d'axe \((Oy)\), tournée vers le haut, de foyer \(\big(0,\frac p2\big)\) et de directrice \(y=-\frac p2\) ; \(x^2=-2py\).</li>
  </ul>

  <div class="method-box">
    <strong>Exemple — foyer et directrice de la parabole \(y=\frac{x^2}{4}\)</strong>
    <ol>
      <li>L'équation s'écrit \(x^2=4y=2py\) avec \(p=2\) : parabole de sommet \(O\), d'axe \((Oy)\), tournée vers le haut.</li>
      <li>Foyer \(F(0,1)\), directrice \(\mathcal D : y=-1\).</li>
      <li>Vérification sur le point \(M(2,1)\) : \(MF=2\) et \(d(M,\mathcal D)=1-(-1)=2\).</li>
      <li>Plus généralement, \(y=\alpha x^2\) (\(\alpha\gt0\)) est la parabole \(x^2=2py\) avec \(p=\frac{1}{2\alpha}\), de foyer \(\big(0,\frac{1}{4\alpha}\big)\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : placer le foyer de \(y^2=2px\) en \((p,0)\) ou en \((2p,0)\). Le foyer et la directrice sont à la même distance \(\frac p2\) du sommet, de part et d'autre ; c'est la distance du foyer à la directrice qui vaut \(p\). En cas de doute, revenir à \(MF=MH\) sur un point simple.</div>
</div>

<div class="course-section">
  <div class="sec-num">§6 · L'ELLIPSE</div>
  <h2>Excentricité \(e\lt1\) : équation réduite \(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\)</h2>
  <div class="intro">Pour \(e\lt1\), la conique est une courbe fermée et bornée. Le calcul fait apparaître un centre de symétrie, un second couple foyer-directrice et deux longueurs, les demi-axes, qui suffisent à tout décrire.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(\mathcal E\) la conique de foyer \(F\), de directrice \(\mathcal D\) et d'excentricité \(e\in\,]0,1[\), avec \(h=d(F,\mathcal D)\). On pose
    <div class="formula">$$a=\frac{e\,h}{1-e^2},\qquad b=a\sqrt{1-e^2},\qquad c=e\,a .$$</div>
    Il existe un point \(O\) de l'axe focal tel que, dans le repère orthonormé d'origine \(O\) dont l'axe des abscisses est l'axe focal orienté de \(O\) vers \(F\), on ait \(F(c,0)\), \(\mathcal D : x=\frac ae\) et
    <div class="formula" data-nom="Ellipse : équation réduite">$$\mathcal E : \ \frac{x^2}{a^2}+\frac{y^2}{b^2}=1,\qquad 0\lt b\lt a .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">De \(MF=e\,MH\) à l'équation réduite, par une forme canonique.</span>
    <div class="content">
      <p>Repartons de l'équation dans le repère du foyer (§4) : \((1-e^2)x^2-2e^2hx+y^2=e^2h^2\). Comme \(1-e^2\neq0\), on complète le carré en \(x\) :</p>
      <div class="formula">$$\begin{aligned}(1-e^2)\Big(x-\frac{e^2h}{1-e^2}\Big)^2+y^2&=e^2h^2+\frac{e^4h^2}{1-e^2}\\&=\frac{e^2h^2}{1-e^2}.\end{aligned}$$</div>
      <p>Soit \(O\) le point d'abscisse \(\frac{e^2h}{1-e^2}\) dans le repère du foyer, et \(X=x-\frac{e^2h}{1-e^2}\). En divisant par \(\frac{e^2h^2}{1-e^2}\), on obtient \(\dfrac{X^2}{a^2}+\dfrac{y^2}{b^2}=1\) avec \(a^2=\frac{e^2h^2}{(1-e^2)^2}\) et \(b^2=\frac{e^2h^2}{1-e^2}=a^2(1-e^2)\).</p>
      <p>Dans ce repère, \(F\) (ancienne origine) a pour abscisse \(-\frac{e^2h}{1-e^2}=-ea=-c\), et la directrice \(x=-h\) devient \(X=-h-\frac{e^2h}{1-e^2}=-\frac{h}{1-e^2}=-\frac ae\). En retournant l'axe des abscisses, ce qui ne change pas l'équation, on obtient \(F(c,0)\) et \(\mathcal D : X=\frac ae\). Toutes les étapes sont des équivalences : la conique est exactement cette ellipse.</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Réciproque et éléments (formules fournies au besoin).</strong> Soit \(0\lt b\lt a\) et \(\mathcal E\) la courbe d'équation \(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\). On pose \(c=\sqrt{a^2-b^2}\) et \(e=\frac ca\in\,]0,1[\). Alors \(\mathcal E\) est la conique d'excentricité \(e\), de foyer \(F(c,0)\) et de directrice \(x=\frac{a^2}{c}\) ; c'est aussi celle de foyer \(F'(-c,0)\) et de directrice \(x=-\frac{a^2}{c}\).
    <div class="formula" data-nom="Ellipse : éléments">$$c^2=a^2-b^2,\qquad e=\frac ca,\qquad \frac ae=\frac{a^2}{c},\qquad p=\frac{b^2}{a} .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Vérifier directement que \(MF=a-ex\).</span>
    <div class="content">
      <p>Pour \(M(x,y)\in\mathcal E\), \(y^2=b^2-\frac{b^2}{a^2}x^2\) et \(b^2+c^2=a^2\), d'où</p>
      <div class="formula">$$\begin{aligned}MF^2&=(x-c)^2+y^2=\Big(1-\frac{b^2}{a^2}\Big)x^2-2cx+c^2+b^2\\&=\frac{c^2}{a^2}x^2-2cx+a^2=(a-ex)^2 .\end{aligned}$$</div>
      <p>Comme \(|x|\leqslant a\) et \(e\lt1\), \(a-ex\gt0\), donc \(MF=a-ex=e\big(\frac ae-x\big)=e\,d(M,\mathcal D)\). Par symétrie par rapport à \((Oy)\), \(MF'=a+ex=e\,d(M,\mathcal D')\).</p>
    </div>
  </div>

  <h3>Symétries, axes, sommets</h3>
  <ul>
    <li><strong>Centre de symétrie</strong> \(O\), milieu de \([FF']\) ; <strong>axes de symétrie</strong> \((Ox)\) et \((Oy)\) (seuls \(x^2\) et \(y^2\) interviennent).</li>
    <li><strong>Sommets</strong> : \(A(a,0)\) et \(A'(-a,0)\) sur l'axe focal, \(B(0,b)\) et \(B'(0,-b)\) sur l'autre axe.</li>
    <li>Le <strong>grand axe</strong> \([AA']\), de longueur \(2a\), est porté par l'axe focal ; le <strong>petit axe</strong> \([BB']\) a pour longueur \(2b\) (on nomme aussi ainsi les droites qui les portent).</li>
    <li>\(BF=\sqrt{b^2+c^2}=a\) : le triangle rectangle \(OBF\) permet de retrouver \(c^2=a^2-b^2\).</li>
    <li>Le cercle est le cas limite \(a=b\), \(c=0\) (« \(e=0\) »), sans directrice. Une excentricité proche de 0 donne une ellipse presque ronde (orbite terrestre : \(e\approx0{,}017\)), proche de 1 une ellipse très allongée (comète de Halley : \(e\approx0{,}97\)).</li>
  </ul>

  <h3>Paramétrage trigonométrique</h3>
  <div class="prop-box">
    <strong>Paramétrage.</strong> L'application \(t\mapsto(a\cos t,\ b\sin t)\) est une bijection de \([0,2\pi[\) sur l'ellipse \(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\) :
    <div class="formula" data-nom="Paramétrage de l'ellipse">$$x=a\cos t,\qquad y=b\sin t,\qquad t\in[0,2\pi[ .$$</div>
    L'ellipse de centre \(\Omega(x_0,y_0)\) et d'axes parallèles à ceux du repère, \(\frac{(x-x_0)^2}{a^2}+\frac{(y-y_0)^2}{b^2}=1\), est paramétrée par \(t\mapsto(x_0+a\cos t,\ y_0+b\sin t)\).
  </div>
  <p>En effet, \(M(x,y)\) est sur l'ellipse si et seulement si le point \(\big(\frac xa,\frac yb\big)\) est sur le cercle unité, c'est-à-dire s'il existe un unique \(t\in[0,2\pi[\) tel que \(\frac xa=\cos t\) et \(\frac yb=\sin t\). Géométriquement, l'ellipse est l'image du cercle de centre \(O\) et de rayon \(a\) par l'affinité orthogonale d'axe \((Ox)\) et de rapport \(\frac ba\), qui « écrase » les ordonnées.</p>
  <div class="notice"><strong>Erreur classique</strong> : prendre \(t\) pour l'angle polaire du point \(M(a\cos t,b\sin t)\). Cet angle \(\theta\) vérifie \(\tan\theta=\frac ba\tan t\) et ne coïncide avec \(t\) qu'aux sommets. Le point de paramètre \(\frac\pi4\) n'est pas sur la première bissectrice, sauf pour un cercle.</div>

  <div class="method-box">
    <strong>Exemple — l'ellipse \(4x^2+9y^2=36\)</strong>
    <ol>
      <li>En divisant par 36 : \(\dfrac{x^2}{9}+\dfrac{y^2}{4}=1\), donc \(a=3\), \(b=2\) ; le grand axe est porté par \((Ox)\).</li>
      <li>\(c=\sqrt{9-4}=\sqrt5\) et \(e=\frac{\sqrt5}{3}\approx0{,}75\). Foyers \((\pm\sqrt5,0)\), directrices \(x=\pm\frac{9}{\sqrt5}\), paramètre \(p=\frac{b^2}{a}=\frac43\).</li>
      <li>Sommets \((\pm3,0)\) et \((0,\pm2)\) ; paramétrage \(t\mapsto(3\cos t,\ 2\sin t)\).</li>
      <li>Contrôle en \(B(0,2)\) : \(BF=\sqrt{5+4}=3\) et \(e\,d(B,\mathcal D)=\frac{\sqrt5}{3}\cdot\frac{9}{\sqrt5}=3\).</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§7 · L'HYPERBOLE</div>
  <h2>Excentricité \(e\gt1\) : équation réduite \(\frac{x^2}{a^2}-\frac{y^2}{b^2}=1\)</h2>
  <div class="intro">Pour \(e\gt1\), le calcul de l'ellipse se refait avec un coefficient \(1-e^2\) négatif. La courbe obtenue a deux branches, séparées par une bande vide, et s'approche de deux droites, ses asymptotes.</div>

  <div class="prop-box">
    <strong>Théorème.</strong> Soit \(\mathcal H\) la conique de foyer \(F\), de directrice \(\mathcal D\) et d'excentricité \(e\gt1\), avec \(h=d(F,\mathcal D)\). On pose
    <div class="formula">$$a=\frac{e\,h}{e^2-1},\qquad b=a\sqrt{e^2-1},\qquad c=e\,a .$$</div>
    Il existe un point \(O\) de l'axe focal tel que, dans le repère orthonormé d'origine \(O\) dont l'axe des abscisses est l'axe focal orienté de \(O\) vers \(F\), on ait \(F(c,0)\), \(\mathcal D : x=\frac ae\) et
    <div class="formula" data-nom="Hyperbole : équation réduite">$$\mathcal H : \ \frac{x^2}{a^2}-\frac{y^2}{b^2}=1,\qquad a\gt0,\ b\gt0 .$$</div>
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le calcul de l'ellipse, avec \(1-e^2\lt0\).</span>
    <div class="content">
      <p>Dans le repère du foyer, \((1-e^2)x^2-2e^2hx+y^2=e^2h^2\). La même forme canonique, avec \(X=x-\frac{e^2h}{1-e^2}=x+\frac{e^2h}{e^2-1}\), donne \((1-e^2)X^2+y^2=\frac{e^2h^2}{1-e^2}\), soit en changeant les signes :</p>
      <div class="formula">$$(e^2-1)\,X^2-y^2=\frac{e^2h^2}{e^2-1}.$$</div>
      <p>En divisant, \(\dfrac{X^2}{a^2}-\dfrac{y^2}{b^2}=1\) avec \(a=\frac{eh}{e^2-1}\) et \(b^2=\frac{e^2h^2}{e^2-1}=a^2(e^2-1)\). Dans ce repère, le foyer a pour abscisse \(\frac{e^2h}{e^2-1}=ea=c\gt0\) et la directrice \(x=-h\) devient \(X=-h+\frac{e^2h}{e^2-1}=\frac{h}{e^2-1}=\frac ae\) : l'orientation convient sans retournement. On note que \(\frac ae\lt a\lt c\) : la directrice passe entre le centre et le sommet voisin du foyer.</p>
    </div>
  </div>

  <div class="prop-box">
    <strong>Réciproque et éléments (formules fournies au besoin).</strong> Soit \(a,b\gt0\) et \(\mathcal H : \frac{x^2}{a^2}-\frac{y^2}{b^2}=1\). On pose \(c=\sqrt{a^2+b^2}\) et \(e=\frac ca\gt1\). Alors \(\mathcal H\) est la conique d'excentricité \(e\), de foyer \(F(c,0)\) et de directrice \(x=\frac{a^2}{c}\), ou de foyer \(F'(-c,0)\) et de directrice \(x=-\frac{a^2}{c}\).
    <div class="formula" data-nom="Hyperbole : éléments">$$c^2=a^2+b^2,\qquad e=\frac ca,\qquad \frac ae=\frac{a^2}{c},\qquad p=\frac{b^2}{a} .$$</div>
    Le calcul de vérification est celui de l'ellipse : pour \(M\in\mathcal H\), \(MF^2=(ex-a)^2\), et sur la branche \(x\geqslant a\), \(MF=ex-a=e\big(x-\frac ae\big)\).
  </div>

  <h3>Symétries, branches, asymptotes</h3>
  <ul>
    <li><strong>Centre de symétrie</strong> \(O\), milieu de \([FF']\) ; <strong>axes de symétrie</strong> \((Ox)\), l'axe focal (ou axe transverse), et \((Oy)\).</li>
    <li><strong>Sommets</strong> \(A(a,0)\) et \(A'(-a,0)\). L'axe \((Oy)\) ne rencontre pas \(\mathcal H\), car \(-\frac{y^2}{b^2}=1\) est impossible.</li>
    <li><strong>Deux branches</strong> : \(\frac{x^2}{a^2}=1+\frac{y^2}{b^2}\geqslant1\) impose \(x\geqslant a\) ou \(x\leqslant-a\) ; aucun point dans la bande \(|x|\lt a\).</li>
  </ul>
  <div class="prop-box">
    <strong>Asymptotes.</strong> Les droites
    <div class="formula" data-nom="Asymptotes de l'hyperbole">$$y=\frac ba\,x\qquad\text{et}\qquad y=-\frac ba\,x$$</div>
    sont asymptotes à \(\mathcal H\). Ce sont les diagonales du rectangle \(|x|\leqslant a\), \(|y|\leqslant b\), et leur réunion a pour équation \(\frac{x^2}{a^2}-\frac{y^2}{b^2}=0\) : on l'obtient en remplaçant le second membre 1 par 0.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">L'écart entre la courbe et la droite tend vers 0.</span>
    <div class="content">
      <p>Par symétrie, il suffit d'étudier la partie de \(\mathcal H\) située dans le quart de plan \(x\geqslant a\), \(y\geqslant0\) : c'est le graphe de \(x\mapsto\frac ba\sqrt{x^2-a^2}\). L'écart vertical à la droite \(y=\frac ba\,x\) vaut, en multipliant par la quantité conjuguée :</p>
      <div class="formula">$$\frac ba\Big(x-\sqrt{x^2-a^2}\Big)=\frac ba\cdot\frac{a^2}{x+\sqrt{x^2-a^2}}=\frac{ab}{x+\sqrt{x^2-a^2}} .$$</div>
      <p>Il est strictement positif et tend vers 0 quand \(x\to+\infty\) : la droite est asymptote, et la courbe reste en dessous d'elle.</p>
    </div>
  </div>

  <h3>Paramétrage des branches</h3>
  <div class="prop-box">
    <strong>Paramétrage hyperbolique.</strong> Comme \(\operatorname{ch}^2t-\operatorname{sh}^2t=1\), chaque branche se paramètre séparément : avec \(\varepsilon=1\) pour la branche \(x\gt0\) et \(\varepsilon=-1\) pour la branche \(x\lt0\),
    <div class="formula" data-nom="Paramétrage de l'hyperbole">$$x=\varepsilon\,a\operatorname{ch}t,\qquad y=b\operatorname{sh}t,\qquad t\in\mathbb{R} .$$</div>
  </div>
  <p>Pour un point \(M(x,y)\) de la branche \(x\gt0\), il existe un unique \(t\) tel que \(y=b\operatorname{sh}t\) (\(\operatorname{sh}\) est bijective de \(\mathbb{R}\) sur \(\mathbb{R}\)) ; alors \(\frac{x^2}{a^2}=1+\operatorname{sh}^2t=\operatorname{ch}^2t\) et \(x=a\operatorname{ch}t\). Comme \(\operatorname{ch}t\geqslant1\), un seul paramétrage ne décrit qu'une branche.</p>

  <div class="method-box">
    <strong>Exemple — l'hyperbole \(9x^2-16y^2=144\)</strong>
    <ol>
      <li>En divisant par 144 : \(\dfrac{x^2}{16}-\dfrac{y^2}{9}=1\), donc \(a=4\), \(b=3\) et \(c=\sqrt{16+9}=5\).</li>
      <li>\(e=\frac54\) ; foyers \((\pm5,0)\), directrices \(x=\pm\frac{16}{5}\), sommets \((\pm4,0)\), asymptotes \(y=\pm\frac34x\), paramètre \(p=\frac94\).</li>
      <li>Branches : \(t\mapsto(\pm4\operatorname{ch}t,\ 3\operatorname{sh}t)\).</li>
      <li>Le point \(M\big(5,\frac94\big)\), à la verticale du foyer, est sur \(\mathcal H\) : \(\frac{25}{16}-\frac{81}{144}=\frac{25-9}{16}=1\). On vérifie que \(MF=\frac94\) et \(e\,d(M,\mathcal D)=\frac54\big(5-\frac{16}{5}\big)=\frac54\cdot\frac95=\frac94\).</li>
    </ol>
  </div>

  <h3>Hyperbole équilatère et équation \(xy=k\)</h3>
  <div class="prop-box">
    Une hyperbole est <strong>équilatère</strong> si ses asymptotes sont perpendiculaires, c'est-à-dire si \(a=b\) ; alors \(e=\sqrt2\). <strong>Proposition.</strong> Pour \(k\neq0\), la courbe d'équation \(xy=k\) est une hyperbole équilatère dont les asymptotes sont les axes du repère.
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Tourner le repère d'un huitième de tour.</span>
    <div class="content"><p>Dans le repère orthonormé obtenu en tournant les axes de \(\frac\pi4\), les nouvelles coordonnées \((X,Y)\) vérifient \(x=\frac{X-Y}{\sqrt2}\) et \(y=\frac{X+Y}{\sqrt2}\). Alors \(xy=\frac{X^2-Y^2}{2}\), et l'équation devient \(X^2-Y^2=2k\). Pour \(k\gt0\), c'est l'hyperbole équilatère de demi-axe \(a=\sqrt{2k}\) dont l'axe focal est la première bissectrice ; pour \(k\lt0\), l'axe focal est la seconde bissectrice. Ses asymptotes \(Y=X\) et \(Y=-X\) sont les droites \(x=0\) et \(y=0\).</p></div>
  </div>
  <p>Exemple : \(xy=2\) s'écrit \(X^2-Y^2=4\) ; \(a=b=2\), \(c=2\sqrt2\). Dans le repère initial, les sommets sont \(\pm(\sqrt2,\sqrt2)\) et les foyers \(\pm(2,2)\).</p>
</div>

<div class="course-section">
  <div class="sec-num">§8 · LIRE UNE ÉQUATION RÉDUITE</div>
  <h2>De l'équation à la figure</h2>
  <div class="intro">Le programme demande de classer une conique et d'en déterminer les éléments à partir d'une équation réduite, éventuellement après un changement d'origine. On rassemble ici les formes à reconnaître et la méthode lorsque le centre n'est pas l'origine. Les formules du tableau ne sont pas à apprendre par cœur : elles se retrouvent avec les §5 à §7, ou sont fournies.</div>

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0">
    <tr><th style="text-align:left">Équation réduite</th><th style="text-align:left">Nature, axe focal</th><th style="text-align:left">Foyers ; directrices</th><th style="text-align:left">\(e\)</th></tr>
    <tr><td>\(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\), \(a\gt b\)</td><td>ellipse, grand axe \((Ox)\)</td><td>\((\pm c,0)\), \(c^2=a^2-b^2\) ; \(x=\pm\frac{a^2}{c}\)</td><td>\(\frac ca\)</td></tr>
    <tr><td>\(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\), \(a\lt b\)</td><td>ellipse, grand axe \((Oy)\)</td><td>\((0,\pm c)\), \(c^2=b^2-a^2\) ; \(y=\pm\frac{b^2}{c}\)</td><td>\(\frac cb\)</td></tr>
    <tr><td>\(\frac{x^2}{a^2}-\frac{y^2}{b^2}=1\)</td><td>hyperbole, axe \((Ox)\)</td><td>\((\pm c,0)\), \(c^2=a^2+b^2\) ; \(x=\pm\frac{a^2}{c}\)</td><td>\(\frac ca\)</td></tr>
    <tr><td>\(\frac{y^2}{b^2}-\frac{x^2}{a^2}=1\)</td><td>hyperbole, axe \((Oy)\)</td><td>\((0,\pm c)\), \(c^2=a^2+b^2\) ; \(y=\pm\frac{b^2}{c}\)</td><td>\(\frac cb\)</td></tr>
    <tr><td>\(y^2=2px\)</td><td>parabole, axe \((Ox)\)</td><td>\(\big(\frac p2,0\big)\) ; \(x=-\frac p2\)</td><td>1</td></tr>
    <tr><td>\(x^2=2py\)</td><td>parabole, axe \((Oy)\)</td><td>\(\big(0,\frac p2\big)\) ; \(y=-\frac p2\)</td><td>1</td></tr>
  </table></div>
  <p><strong>Classification.</strong> Deux carrés de même signe : ellipse (\(e\lt1\)) ; de signes contraires : hyperbole (\(e\gt1\)) ; un seul carré et un terme du premier degré : parabole (\(e=1\)).</p>

  <div class="method-box">
    <strong>Méthode — conique sans terme en \(xy\)</strong>
    <ol>
      <li>Regrouper les termes en \(x\) et ceux en \(y\), puis compléter les carrés : \(\alpha x^2+\delta x=\alpha\big(x+\frac{\delta}{2\alpha}\big)^2-\frac{\delta^2}{4\alpha}\).</li>
      <li>Passer les constantes à droite et diviser pour obtenir le second membre 1, ou une forme \(Y^2=2pX\).</li>
      <li>Lire la nature et les éléments dans le repère translaté \((\Omega;\vec\imath,\vec\jmath)\), où \(X=x-x_0\) et \(Y=y-y_0\), puis revenir aux coordonnées initiales en ajoutant \((x_0,y_0)\).</li>
      <li>Surveiller les cas dégénérés : un second membre nul ou négatif peut donner un point, deux droites ou l'ensemble vide.</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — \(9x^2+4y^2-18x+16y-11=0\)</strong>
    <ol>
      <li>\(9(x^2-2x)=9(x-1)^2-9\) et \(4(y^2+4y)=4(y+2)^2-16\) : l'équation devient \(9(x-1)^2+4(y+2)^2=36\), soit \(\dfrac{(x-1)^2}{4}+\dfrac{(y+2)^2}{9}=1\).</li>
      <li>Ellipse de centre \(\Omega(1,-2)\), de demi-axes 2 (horizontal) et 3 (vertical) : le <strong>grand axe est vertical</strong>, porté par la droite \(x=1\).</li>
      <li>\(c=\sqrt{9-4}=\sqrt5\), \(e=\frac{\sqrt5}{3}\) ; foyers \(\big(1,-2\pm\sqrt5\big)\), directrices \(y=-2\pm\frac{9}{\sqrt5}\), sommets \((1,-2\pm3)\) et \((1\pm2,-2)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — \(y^2-4y-8x+12=0\)</strong>
    <ol>
      <li>\(y^2-4y=(y-2)^2-4\), d'où \((y-2)^2=8(x-1)\) : avec \(X=x-1\), \(Y=y-2\), \(Y^2=2pX\), \(p=4\). Parabole de sommet \(S(1,2)\), d'axe \(y=2\).</li>
      <li>Foyer \(S+\frac p2\,\vec\imath=(3,2)\), directrice \(x=1-\frac p2=-1\).</li>
      <li>Contrôle avec \(M(3,6)\), point de la courbe : \(MF=4\) et \(d(M,\mathcal D)=3-(-1)=4\).</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : pour \(\frac{x^2}{4}+\frac{y^2}{9}=1\), poser \(a=2\), \(b=3\) et écrire \(c^2=a^2-b^2\lt0\). Les formules du §6 supposent le grand axe sur \((Ox)\) : repérer d'abord le plus grand dénominateur, qui porte le grand axe et les foyers. Pour une hyperbole, c'est le terme précédé du signe \(+\) qui désigne l'axe focal, quel que soit l'ordre des dénominateurs.</div>
  <p><strong>Avec un terme en \(xy\).</strong> Toute équation \(ax^2+2bxy+cy^2+dx+ey+f=0\) avec \((a,b,c)\neq(0,0,0)\) définit une conique, éventuellement dégénérée. On diagonalise la matrice symétrique \(\begin{pmatrix}a & b\\b & c\end{pmatrix}\) dans une base orthonormée pour supprimer le terme en \(xy\), puis on termine comme ci-dessus : voir le chapitre Réduction des coniques et matrices symétriques.</p>
</div>

<div class="course-section">
  <div class="sec-num">§9 · TANGENTES AUX CONIQUES</div>
  <h2>Le gradient et la règle du dédoublement</h2>
  <div class="intro">Une conique donnée par une équation réduite est une courbe \(f(x,y)=0\) où \(f\) est un polynôme de degré 2 : le §2 s'applique directement. Le calcul se résume en une règle mécanique, le dédoublement. On en tire les propriétés de réflexion qui font l'intérêt technique des coniques.</div>

  <p>Une conique en équation réduite n'a aucun point singulier : pour l'ellipse ou l'hyperbole, \(\nabla f=\big(\frac{2x}{a^2},\pm\frac{2y}{b^2}\big)\) ne s'annule qu'en \(O\), hors de la courbe ; pour la parabole \(y^2-2px=0\), \(\nabla f=(-2p,\ 2y)\neq\vec0\).</p>
  <div class="prop-box">
    <strong>Tangente par dédoublement.</strong> La tangente en un point \(M_0(x_0,y_0)\) d'une conique s'obtient en remplaçant dans son équation \(x^2\) par \(x_0x\), \(y^2\) par \(y_0y\), \(x\) par \(\frac{x+x_0}{2}\) et \(y\) par \(\frac{y+y_0}{2}\). Pour les équations réduites :
    <div class="formula" data-nom="Tangentes aux coniques (dédoublement)">$$\begin{aligned} & \text{ellipse :} &  & \frac{x_0\,x}{a^2}+\frac{y_0\,y}{b^2}=1\\ & \text{hyperbole :} &  & \frac{x_0\,x}{a^2}-\frac{y_0\,y}{b^2}=1\\ & \text{parabole :} &  & y_0\,y=p\,(x+x_0)\end{aligned}$$</div>
    Plus généralement, pour \(\alpha x^2+\gamma y^2+\delta x+\varepsilon y+\varphi=0\), la tangente en \(M_0\) a pour équation
    <div class="formula">$$\alpha x_0x+\gamma y_0y+\delta\,\frac{x+x_0}{2}+\varepsilon\,\frac{y+y_0}{2}+\varphi=0,$$</div>
    et un éventuel terme \(xy\) se dédouble en \(\frac{x_0y+y_0x}{2}\).
  </div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Démonstration</span>
    <span class="prompt">Le dédoublement n'est que l'équation de la tangente, simplifiée.</span>
    <div class="content">
      <p>Soit \(f(x,y)=\alpha x^2+\gamma y^2+\delta x+\varepsilon y+\varphi\) et \(M_0\) un point régulier de la courbe \(f=0\). D'après le §2, la tangente a pour équation</p>
      <div class="formula">$$(2\alpha x_0+\delta)(x-x_0)+(2\gamma y_0+\varepsilon)(y-y_0)=0 .$$</div>
      <p>En développant :</p>
      <div class="formula">$$\begin{aligned} & 2\alpha x_0x+2\gamma y_0y+\delta x+\varepsilon y\\ & \quad-\big(2\alpha x_0^2+2\gamma y_0^2+\delta x_0+\varepsilon y_0\big)=0 .\end{aligned}$$</div>
      <p>Comme \(f(x_0,y_0)=0\), \(\alpha x_0^2+\gamma y_0^2=-\delta x_0-\varepsilon y_0-\varphi\), et la parenthèse vaut \(-\delta x_0-\varepsilon y_0-2\varphi\). En divisant par 2, on obtient exactement la formule du dédoublement.</p>
    </div>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer le dédoublement en un point qui n'est pas sur la conique. L'équation obtenue est alors celle d'une autre droite (la polaire du point, hors programme), pas d'une tangente. Toujours vérifier d'abord que \(f(x_0,y_0)=0\).</div>

  <div class="method-box">
    <strong>Exemple — tangente à l'ellipse \(\frac{x^2}{9}+\frac{y^2}{4}=1\) en \(M_0\big(\frac95,\frac85\big)\)</strong>
    <ol>
      <li>\(M_0\) est sur l'ellipse : \(\frac{81}{225}+\frac{64}{100}=\frac{9}{25}+\frac{16}{25}=1\).</li>
      <li>Dédoublement : \(\frac95\cdot\frac x9+\frac85\cdot\frac y4=1\), soit \(\frac x5+\frac{2y}{5}=1\), c'est-à-dire \(x+2y=5\).</li>
      <li>Contrôle par le gradient : \(\nabla f(M_0)=\big(\frac{2x_0}{9},\frac{y_0}{2}\big)=\big(\frac25,\frac45\big)\), colinéaire au vecteur normal \((1,2)\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — tangentes de direction imposée</strong>
    <p>Quelles tangentes à l'ellipse \(\frac{x^2}{9}+\frac{y^2}{4}=1\) sont parallèles à la droite \(x+y=0\) ?</p>
    <ol>
      <li>La tangente en \(M_0\) est parallèle à cette droite si et seulement si son vecteur normal \(\big(\frac{2x_0}{9},\frac{y_0}{2}\big)\) est colinéaire à \((1,1)\) : \(\frac{2x_0}{9}=\frac{y_0}{2}\), soit \(y_0=\frac{4x_0}{9}\).</li>
      <li>En reportant dans l'équation : \(\frac{x_0^2}{9}+\frac{16x_0^2}{324}=\frac{13x_0^2}{81}=1\), d'où \(x_0=\pm\frac{9}{\sqrt{13}}\) et \(y_0=\pm\frac{4}{\sqrt{13}}\), avec le même signe.</li>
      <li>Le dédoublement donne \(\frac{x+y}{\sqrt{13}}=\pm1\) : les deux tangentes sont \(x+y=\sqrt{13}\) et \(x+y=-\sqrt{13}\), symétriques par rapport à \(O\).</li>
    </ol>
  </div>
  <div class="method-box">
    <strong>Exemple — tangentes à l'hyperbole \(xy=k\)</strong>
    <p>Soit \(k\neq0\) et \(M_0(x_0,y_0)\) un point de la courbe \(xy=k\).</p>
    <ol>
      <li>Avec \(f(x,y)=xy-k\), \(\nabla f(M_0)=(y_0,x_0)\neq\vec0\). Tangente : \(y_0(x-x_0)+x_0(y-y_0)=0\), soit \(y_0x+x_0y=2k\) ; c'est bien le dédoublement de \(xy\) en \(\frac{x_0y+y_0x}{2}\).</li>
      <li>Elle coupe les axes en \(P(2x_0,0)\) et \(Q(0,2y_0)\) : \(M_0\) est le milieu de \([PQ]\).</li>
      <li>L'aire du triangle \(OPQ\) vaut \(\frac12\,|2x_0|\,|2y_0|=2|k|\) : elle est la même pour tous les points de l'hyperbole.</li>
    </ol>
  </div>

  <h3>Propriétés de réflexion (remarque culturelle)</h3>
  <p><strong>Parabole.</strong> Sur la figure du §5, le vecteur \(\overrightarrow{HF}=(p,-y_0)\) est colinéaire au gradient \((-2p,\ 2y_0)\), et le milieu \(\big(0,\frac{y_0}{2}\big)\) de \([FH]\) vérifie l'équation \(y_0y=p(x+x_0)\), puisque \(y_0^2=2px_0\). La tangente en \(M\) est donc la médiatrice de \([FH]\) ; le triangle \(FMH\) étant isocèle en \(M\), elle est aussi la bissectrice de l'angle \(\widehat{FMH}\). Par les lois de la réflexion, un rayon arrivant parallèlement à l'axe repart vers le foyer (antennes paraboliques, fours solaires) ; une source placée au foyer donne un faisceau parallèle (phares).</p>
  <p><strong>Ellipse et hyperbole.</strong> La tangente à une ellipse en \(M\) est la bissectrice extérieure de l'angle \(\widehat{FMF'}\) : un rayon issu d'un foyer se réfléchit vers l'autre (lithotripteurs, qui concentrent des ondes de choc sur un calcul rénal). Pour l'hyperbole, c'est la bissectrice intérieure (miroir secondaire des télescopes Cassegrain). Ces propriétés ne sont pas exigibles.</p>
</div>

<div class="course-section">
  <div class="sec-num">POUR ALLER PLUS LOIN · HORS PROGRAMME</div>
  <h2>Équation polaire, définitions bifocales, sections de cône</h2>
  <div class="intro">Ces compléments éclairent le chapitre et servent en physique, mais aucune connaissance n'en est attendue en mathématiques.</div>
  <h3>Équation polaire d'une conique de foyer \(O\)</h3>
  <p>Plaçons le foyer à l'origine et la directrice sur la droite \(x=\frac pe\). Pour un point \(M\) de coordonnées polaires \((r,\theta)\), \(r\gt0\), situé du même côté de \(\mathcal D\) que le foyer, \(MF=r\) et \(d(M,\mathcal D)=\frac pe-r\cos\theta\). La condition \(r=e\big(\frac pe-r\cos\theta\big)\) donne</p>
  <div class="formula">$$r=\frac{p}{1+e\cos\theta} .$$</div>
  <p>C'est la forme utilisée en mécanique pour les trajectoires dans un champ newtonien (problème de Kepler) : ellipses des planètes, le Soleil en un foyer ; paraboles ou hyperboles des corps non liés. Les courbes polaires sont hors programme de mathématiques en PT.</p>
  <h3>Définitions bifocales et cercle directeur</h3>
  <p>Sur l'ellipse, \(MF=a-ex\) et \(MF'=a+ex\) (§6), d'où \(MF+MF'=2a\) : c'est la construction « du jardinier », avec une ficelle tendue entre deux piquets. Sur l'hyperbole, \(|MF-MF'|=2a\). L'ellipse est aussi l'ensemble des centres des cercles passant par \(F\) et tangents intérieurement au cercle de centre \(F'\) et de rayon \(2a\) (cercle directeur).</p>
  <h3>Sections planes d'un cône de révolution</h3>
  <p>Un plan ne passant pas par le sommet d'un cône de révolution le coupe selon une ellipse, une parabole ou une hyperbole, selon que l'angle entre le plan et l'axe est supérieur, égal ou inférieur au demi-angle au sommet. Les sphères inscrites dans le cône et tangentes au plan (sphères de Dandelin) le touchent aux foyers. C'est l'origine du nom « conique ».</p>
</div>

<template class="pan-tpl" data-panneau="con-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · COURBES DU PLAN ET CONIQUES</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Ces méthodes servent à exploiter une courbe donnée par une équation \(f(x,y)=0\) (ensemble décrit, tangentes, points singuliers, gradient), puis à passer d'une conique définie par foyer, directrice et excentricité à son équation réduite, et inversement : nature, éléments, paramétrage et tangentes.</div>

  <div class="method-box"><strong>Méthode 1 — Décrire une courbe d'équation \(f(x,y)=0\) et ses lignes de niveau</strong>
    <ol>
      <li>Simplifier l'équation : regrouper les termes, compléter les carrés, factoriser quand c'est possible (un produit nul donne une réunion de courbes).</li>
      <li>Reconnaître une forme connue : droite, cercle \((x-x_0)^2+(y-y_0)^2=R^2\), graphe \(y=g(x)\), conique en équation réduite (§5 à §8).</li>
      <li>Pour la ligne de niveau \(\lambda\), résoudre \(f(x,y)=\lambda\) et discuter selon \(\lambda\) : courbe, point ou ensemble vide.</li>
      <li>Conclure par une phrase qui nomme l'ensemble obtenu (centre, rayon, demi-axes…).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(f(x,y)=x^2+y^2-6y\) s'écrit \(x^2+(y-3)^2-9\). La ligne de niveau \(\lambda\) est le cercle de centre \((0,3)\) et de rayon \(\sqrt{\lambda+9}\) si \(\lambda\gt-9\), le seul point \((0,3)\) si \(\lambda=-9\), l'ensemble vide si \(\lambda\lt-9\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : une équation \(f(x,y)=0\) ne décrit pas toujours une « vraie » courbe : \(x^2+2y^2+1=0\) est vide, \(x^2+y^2=0\) est réduite à \(O\). Toujours identifier l'ensemble avant de parler de tangente.</div>

  <div class="method-box"><strong>Méthode 2 — Écrire la tangente et la normale en un point régulier</strong>
    <ol>
      <li>Vérifier que \(M_0(x_0,y_0)\) est sur la courbe : \(f(x_0,y_0)=0\).</li>
      <li>Calculer \(\nabla f(M_0)=\big(\partial_x f(M_0),\ \partial_y f(M_0)\big)\) et vérifier qu'il n'est pas nul : le point est régulier.</li>
      <li>Tangente : la droite passant par \(M_0\) de vecteur <strong>normal</strong> \(\nabla f(M_0)\),
      <div class="formula">$$\partial_x f(M_0)\,(x-x_0)+\partial_y f(M_0)\,(y-y_0)=0 ;$$</div>
      elle est dirigée par \(\big(-\partial_y f(M_0),\ \partial_x f(M_0)\big)\).</li>
      <li>Normale : la droite passant par \(M_0\) dirigée par \(\nabla f(M_0)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> courbe \(x^3+y^3=9\) en \(M_0(1,2)\) (\(1+8=9\)). \(\nabla f=(3x^2,3y^2)\) vaut \((3,12)\) en \(M_0\). Tangente : \(3(x-1)+12(y-2)=0\), soit \(x+4y=9\) ; normale : \(4(x-1)-(y-2)=0\), soit \(4x-y=2\).</p>
  </div>

  <div class="method-box"><strong>Méthode 3 — Chercher les points singuliers et les tangentes horizontales ou verticales</strong>
    <ol>
      <li>Points singuliers : résoudre le système \(\partial_x f=0\), \(\partial_y f=0\), \(f=0\) (les <strong>trois</strong> équations : un point critique de \(f\) hors de la courbe ne compte pas).</li>
      <li>Tangente horizontale : \(\partial_x f=0\) avec \(\partial_y f\neq0\), sur la courbe.</li>
      <li>Tangente verticale : \(\partial_y f=0\) avec \(\partial_x f\neq0\), sur la courbe.</li>
      <li>En un point singulier, la formule de la tangente ne s'applique pas : étudier la courbe autrement (factorisation, paramétrage, graphe local).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(y^2=x^2(x+1)\), avec \(f=y^2-x^3-x^2\) : \(\partial_x f=-x(3x+2)\), \(\partial_y f=2y\). Les points critiques \((0,0)\) et \(\big(-\frac23,0\big)\) ne sont sur la courbe que pour \(O\) : seul point singulier (la courbe s'y croise). Tangentes horizontales en \(\big(-\frac23,\pm\frac{2\sqrt3}{9}\big)\) ; tangente verticale en \((-1,0)\).</p>
  </div>

  <div class="method-box"><strong>Méthode 4 — Exploiter le gradient : lignes de niveau et plus forte pente</strong>
    <ol>
      <li>En un point où \(\nabla f\neq\vec0\), le gradient est orthogonal à la ligne de niveau qui y passe et pointe vers les valeurs croissantes de \(f\).</li>
      <li>Direction de plus forte croissance : \(\dfrac{\nabla f(M_0)}{\|\nabla f(M_0)\|}\) ; taux de croissance maximal : \(\|\nabla f(M_0)\|\) ; plus forte décroissance : \(-\nabla f(M_0)\).</li>
      <li>Pour suivre la ligne de niveau (valeur constante), se déplacer selon \(\big(-\partial_y f,\ \partial_x f\big)\).</li>
      <li>Deux familles de lignes de niveau se coupent à angle droit là où les gradients sont orthogonaux : \(\nabla f\cdot\nabla g=0\).</li>
    </ol>
    <p><em>Exemple éclair :</em> température \(T(x,y)=40-x^2-3y^2\) sur une plaque, en \(A(2,1)\) : \(T(A)=33\) et \(\nabla T(A)=(-4,-6)\). La température croît le plus vite selon \(\frac{1}{\sqrt{13}}(-2,-3)\), au taux \(2\sqrt{13}\approx7{,}2\) degrés par unité de longueur ; l'isotherme \(x^2+3y^2=7\) passe par \(A\) avec la direction \((3,-2)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le gradient est <strong>normal</strong> à la ligne de niveau, il ne la dirige pas. Écrire « tangente dirigée par \(\nabla f\) » donne la normale.</div>

  <div class="method-box"><strong>Méthode 5 — Obtenir l'équation d'une conique définie par foyer, directrice et excentricité</strong>
    <ol>
      <li>Vérifier que le foyer \(F\) n'est pas sur la directrice \(\mathcal D\), et que \(e\gt0\).</li>
      <li>Écrire \(MF^2=e^2\,d(M,\mathcal D)^2\) (les deux distances étant positives, c'est équivalent à \(MF=e\,d(M,\mathcal D)\)), avec \(d(M,\mathcal D)=\dfrac{|ux+vy+w|}{\sqrt{u^2+v^2}}\) si \(\mathcal D : ux+vy+w=0\).</li>
      <li>Développer, puis compléter le carré en \(x\) (directrice verticale) : on obtient l'équation réduite dans un repère translaté.</li>
      <li>Contrôler : le foyer et la directrice retrouvés par les formules (§5 à §7) doivent être ceux de départ.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(F(2,0)\), \(\mathcal D : x=-1\), \(e=2\). \((x-2)^2+y^2=4(x+1)^2\) se simplifie en \(3x^2+12x-y^2=0\), soit \(\dfrac{(x+2)^2}{4}-\dfrac{y^2}{12}=1\) : hyperbole de centre \((-2,0)\), \(a=2\), \(b=2\sqrt3\), \(c=4\), \(e=\frac ca=2\). Contrôle : foyer \((-2+4,0)=F\), directrice \(x=-2+\frac ae=-1\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : avec une directrice oblique, l'équation obtenue contient un terme en \(xy\) ; sa réduction relève du chapitre Réduction des coniques et matrices symétriques.</div>

  <div class="method-box"><strong>Méthode 6 — Identifier une conique sans terme en \(xy\)</strong>
    <ol>
      <li>Regrouper les termes en \(x\) et en \(y\), puis compléter les carrés : \(\alpha x^2+\delta x=\alpha\big(x+\frac{\delta}{2\alpha}\big)^2-\frac{\delta^2}{4\alpha}\).</li>
      <li>Signes des carrés : deux carrés de même signe → ellipse ; de signes contraires → hyperbole ; un seul carré et un terme du premier degré → parabole.</li>
      <li>Diviser pour obtenir le second membre 1 (ou la forme \(Y^2=2pX\)), dans le repère translaté au centre (ou au sommet).</li>
      <li>Lire \(a\), \(b\), calculer \(c\) et \(e\) (méthode 7), puis revenir aux coordonnées initiales.</li>
      <li>Surveiller les cas dégénérés : second membre nul ou du mauvais signe (point, deux droites, vide).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(4x^2-y^2+8x+4y-4=0\) donne \(4(x+1)^2-(y-2)^2=4\), soit \((x+1)^2-\dfrac{(y-2)^2}{4}=1\) : hyperbole de centre \((-1,2)\), \(a=1\), \(b=2\), \(c=\sqrt5\), \(e=\sqrt5\), foyers \((-1\pm\sqrt5,\ 2)\), asymptotes \(y-2=\pm2(x+1)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : l'équation \(xy=k\) (\(k\neq0\)) a un terme en \(xy\) mais se reconnaît directement : hyperbole équilatère d'asymptotes les axes (rotation d'un huitième de tour, §7). Pour un terme \(2bxy\) quelconque, voir le chapitre Réduction des coniques.</div>

  <div class="method-box"><strong>Méthode 7 — Lire les éléments d'une équation réduite</strong>
    <ol>
      <li>Ellipse \(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\) : repérer le <strong>plus grand dénominateur</strong>, qui porte le grand axe et les foyers.</li>
      <li>Hyperbole : l'axe focal est celui de la variable précédée du signe \(+\), quel que soit l'ordre des dénominateurs.</li>
      <li>Calculer \(c\) : \(c^2=a^2-b^2\) (ellipse, grand axe \((Ox)\)) ou \(c^2=a^2+b^2\) (hyperbole) ; puis \(e=\frac ca\), directrices \(x=\pm\frac{a^2}{c}\), paramètre \(p=\frac{b^2}{a}\) (formules fournies au besoin).</li>
      <li>Hyperbole : asymptotes obtenues en remplaçant le second membre 1 par 0. Parabole \(y^2=2px\) : foyer \(\big(\frac p2,0\big)\), directrice \(x=-\frac p2\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{x^2}{16}+\frac{y^2}{25}=1\) : grand axe vertical, \(c^2=25-16=9\), foyers \((0,\pm3)\), \(e=\frac35\), directrices \(y=\pm\frac{25}{3}\). \(\frac{y^2}{9}-\frac{x^2}{16}=1\) : axe focal \((Oy)\), \(c=5\), foyers \((0,\pm5)\), \(e=\frac53\), asymptotes \(y=\pm\frac34x\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : ellipse \(c^2=a^2-b^2\), hyperbole \(c^2=a^2+b^2\) : les signes diffèrent. Et l'excentricité est toujours strictement positive, égale à 1 exactement pour la parabole.</div>

  <div class="method-box"><strong>Méthode 8 — Paramétrer une ellipse, une hyperbole, une parabole</strong>
    <ol>
      <li>Ellipse \(\frac{(x-x_0)^2}{a^2}+\frac{(y-y_0)^2}{b^2}=1\) : \(t\mapsto(x_0+a\cos t,\ y_0+b\sin t)\), \(t\in[0,2\pi[\).</li>
      <li>Hyperbole \(\frac{(x-x_0)^2}{a^2}-\frac{(y-y_0)^2}{b^2}=1\) : <strong>une branche à la fois</strong>, \(t\mapsto(x_0+\varepsilon a\operatorname{ch}t,\ y_0+b\operatorname{sh}t)\), \(t\in\mathbb R\), avec \(\varepsilon=1\) (branche de droite) ou \(\varepsilon=-1\).</li>
      <li>Parabole \(y^2=2px\) : \(t\mapsto\big(\frac{t^2}{2p},\ t\big)\).</li>
      <li>Sens inverse : éliminer le paramètre avec \(\cos^2+\sin^2=1\) ou \(\operatorname{ch}^2-\operatorname{sh}^2=1\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{(x-2)^2}{9}+\frac{(y+1)^2}{4}=1\) est paramétrée par \((2+3\cos t,\ -1+2\sin t)\) (en \(t=\frac\pi2\), le sommet \((2,1)\)) ; les branches de \(\frac{x^2}{4}-\frac{y^2}{9}=1\) par \((\pm2\operatorname{ch}t,\ 3\operatorname{sh}t)\) ; \(y^2=6x\) par \(\big(\frac{t^2}{6},\ t\big)\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : le paramètre \(t\) de \((a\cos t,b\sin t)\) n'est pas l'angle polaire du point (sauf pour un cercle) ; et \((a\operatorname{ch}t,\ b\operatorname{sh}t)\) ne décrit jamais la branche \(x\lt0\).</div>

  <div class="method-box"><strong>Méthode 9 — Tangente à une conique en un de ses points (dédoublement)</strong>
    <ol>
      <li>Vérifier que \(M_0(x_0,y_0)\) est sur la conique.</li>
      <li>Dédoubler : \(x^2\to x_0x\), \(y^2\to y_0y\), \(x\to\frac{x+x_0}{2}\), \(y\to\frac{y+y_0}{2}\), \(xy\to\frac{x_0y+y_0x}{2}\), la constante restant inchangée.</li>
      <li>Contrôler avec le gradient : les coefficients de \(x\) et de \(y\) obtenus sont proportionnels à \(\nabla f(M_0)\).</li>
    </ol>
    <p><em>Exemple éclair :</em> \(\frac{x^2}{4}-\frac{y^2}{3}=1\) en \(M_0(4,3)\) (\(4-3=1\)) : \(\frac{4x}{4}-\frac{3y}{3}=1\), soit \(x-y=1\) ; le gradient \((2,-2)\) est bien normal. Parabole \(y^2=8x\) en \((2,4)\) : \(4y=4(x+2)\), soit \(y=x+2\).</p>
  </div>
  <div class="notice"><strong>Piège</strong> : en un point qui n'est pas sur la conique, le dédoublement donne une droite qui n'est pas une tangente. Toujours commencer par \(f(x_0,y_0)=0\).</div>

  <div class="method-box"><strong>Méthode 10 — Trouver les tangentes de direction imposée, ou passant par un point</strong>
    <ol>
      <li>Écrire la tangente en un point inconnu \(M_0(x_0,y_0)\) de la conique (méthode 9), ou utiliser un paramétrage \(M_0=M(t)\).</li>
      <li>Traduire la condition : vecteur normal colinéaire à une normale donnée (direction imposée), ou coordonnées du point extérieur vérifiant l'équation de la tangente (point imposé).</li>
      <li>Résoudre avec l'équation de la conique \(f(x_0,y_0)=0\) : on trouve en général deux points de contact, donc deux tangentes.</li>
      <li>Contrôler : la droite trouvée coupe la conique en un point double (équation du second degré à discriminant nul).</li>
    </ol>
    <p><em>Exemple éclair :</em> tangentes à \(y^2=4x\) parallèles à \(y=2x\). En \(M_0\), la tangente \(y_0y=2(x+x_0)\) a pour pente \(\frac{2}{y_0}=2\) : \(y_0=1\), \(x_0=\frac14\), tangente \(y=2x+\frac12\). Contrôle : \(\big(2x+\frac12\big)^2=4x\) s'écrit \(\big(2x-\frac12\big)^2=0\), racine double \(x=\frac14\).</p>
  </div>
</div>
</template>
