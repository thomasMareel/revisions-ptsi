<div class="exo"><span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Reconnaître et caractériser</h3>
  <div class="statement">Soit la courbe \(\mathcal E\) d'équation \(\dfrac{x^2}{25}+\dfrac{y^2}{9}=1\) dans un repère orthonormé.</div>
  <div class="q"><strong>Q1.</strong> Nature de \(\mathcal E\) ?</div>
  <div class="q"><strong>Q2.</strong> Foyers et excentricité ?</div>
  <div class="q"><strong>Q3.</strong> Sommets, directrices et un paramétrage de \(\mathcal E\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Deux carrés de même signe, second membre 1 : ellipse de centre \(O\), avec \(a=5\) et \(b=3\) ; le plus grand dénominateur est sous \(x^2\), donc le grand axe est porté par \((Ox)\).</p>
  <p><strong>Q2.</strong> \(c=\sqrt{a^2-b^2}=\sqrt{25-9}=4\) : foyers \((\pm4,0)\), excentricité \(e=\frac ca=\frac45=0{,}8\lt1\).</p>
  <p><strong>Q3.</strong> Sommets \((\pm5,0)\) et \((0,\pm3)\). Directrices \(x=\pm\frac{a^2}{c}=\pm\frac{25}{4}\). Paramétrage : \(t\mapsto(5\cos t,\ 3\sin t)\), \(t\in[0,2\pi[\). Contrôle en \(B(0,3)\) : \(BF=\sqrt{16+9}=5\) et \(e\,d(B,\mathcal D)=\frac45\cdot\frac{25}{4}=5\).</p></div>
</div>
<div class="exo"><span class="num">EXO 02</span><span class="diff">★ ☆ ☆</span>
  <h3>Compléter les carrés</h3>
  <div class="statement">Identifier la conique \(\mathcal C\) d'équation \(x^2+4y^2-2x-3=0\).</div>
  <div class="q"><strong>Q1.</strong> Forme réduite.</div>
  <div class="q"><strong>Q2.</strong> Nature, centre, excentricité.</div>
  <div class="q"><strong>Q3.</strong> Foyers et directrices dans le repère initial.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(x^2-2x=(x-1)^2-1\), d'où \((x-1)^2+4y^2=4\), soit \(\dfrac{(x-1)^2}{4}+\dfrac{y^2}{1}=1\).</p>
  <p><strong>Q2.</strong> Ellipse de centre \(\Omega(1,0)\), \(a=2\), \(b=1\), grand axe porté par la droite \(y=0\). \(c=\sqrt{4-1}=\sqrt3\), \(e=\frac{\sqrt3}{2}\approx0{,}87\).</p>
  <p><strong>Q3.</strong> Dans le repère translaté en \(\Omega\), foyers \((\pm\sqrt3,0)\) et directrices \(X=\pm\frac{a^2}{c}=\pm\frac{4}{\sqrt3}\). En revenant aux coordonnées initiales (\(x=X+1\)) : foyers \((1\pm\sqrt3,\ 0)\), directrices \(x=1\pm\frac{4}{\sqrt3}\).</p></div>
</div>
<div class="exo"><span class="num">EXO 03</span><span class="diff">★ ☆ ☆</span>
  <h3>Tangentes à une courbe implicite</h3>
  <div class="statement">Soit \(\Gamma\) la courbe d'équation \(f(x,y)=0\), avec \(f(x,y)=x^2+xy+y^2-3\), et \(A(1,1)\).</div>
  <div class="q"><strong>Q1.</strong> Vérifier que \(A\in\Gamma\) et montrer que tous les points de \(\Gamma\) sont réguliers.</div>
  <div class="q"><strong>Q2.</strong> Écrire la tangente et la normale à \(\Gamma\) en \(A\). Que remarque-t-on sur la normale ?</div>
  <div class="q"><strong>Q3.</strong> Déterminer les points de \(\Gamma\) où la tangente est horizontale, puis ceux où elle est verticale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(1+1+1-3=0\). \(f\) est polynomiale, donc de classe \(C^1\), et \(\nabla f=(2x+y,\ x+2y)\). Le système \(2x+y=0\), \(x+2y=0\) n'a que la solution \((0,0)\), qui n'est pas sur \(\Gamma\) (\(f(0,0)=-3\)) : tous les points de \(\Gamma\) sont réguliers.</p>
  <p><strong>Q2.</strong> \(\nabla f(A)=(3,3)\). Tangente : \(3(x-1)+3(y-1)=0\), soit \(x+y=2\). Normale : passant par \(A\), dirigée par \((3,3)\), c'est la droite \(y=x\) : elle passe par l'origine.</p>
  <p><strong>Q3.</strong> Tangente horizontale : \(\partial_x f=0\) et \(\partial_y f\neq0\). Avec \(y=-2x\), l'équation devient \(x^2-2x^2+4x^2=3x^2=3\), d'où \(x=\pm1\) : points \((1,-2)\) et \((-1,2)\), où \(\partial_y f=x+2y=\mp3\neq0\). Tangente verticale : \(\partial_y f=0\), soit \(x=-2y\), puis \(3y^2=3\) : points \((-2,1)\) et \((2,-1)\). (La courbe est une ellipse inclinée, voir le chapitre Réduction des coniques.)</p></div>
</div>
<div class="exo"><span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Lignes de niveau qui se coupent à angle droit</h3>
  <div class="statement">On considère \(f(x,y)=xy\) et \(g(x,y)=x^2-y^2\) sur \(\mathbb R^2\), et le point \(A(2,1)\).</div>
  <div class="q"><strong>Q1.</strong> Décrire les lignes de niveau de \(f\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les points critiques de \(f\). Que se passe-t-il pour la ligne de niveau 0 ?</div>
  <div class="q"><strong>Q3.</strong> Écrire la tangente en \(A\) à la ligne de niveau de \(f\) passant par \(A\). Dans quelle direction \(f\) croît-elle le plus vite à partir de \(A\), et à quel taux ?</div>
  <div class="q"><strong>Q4.</strong> Montrer qu'en tout point autre que \(O\), la ligne de niveau de \(f\) et celle de \(g\) qui y passent se coupent à angle droit.</div>
  <div class="q"><strong>Q5.</strong> Vérifier ce résultat en \(A\) en écrivant la tangente à la ligne de niveau de \(g\) passant par \(A\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Pour \(\lambda\neq0\), la ligne de niveau \(xy=\lambda\) est une hyperbole équilatère d'asymptotes les axes (§7), dans les quadrants \(xy\gt0\) si \(\lambda\gt0\), \(xy\lt0\) sinon. Pour \(\lambda=0\), \(xy=0\) est la réunion des deux axes.</p>
  <p><strong>Q2.</strong> \(\nabla f=(y,x)\) ne s'annule qu'en \(O\). Ce point est sur la ligne de niveau 0, dont il est le seul point singulier : les deux axes s'y croisent. Comme \(f\) prend des valeurs positives et négatives au voisinage de \(O\), c'est un col de \(f\).</p>
  <p><strong>Q3.</strong> \(f(A)=2\) et \(\nabla f(A)=(1,2)\). Tangente à \(xy=2\) en \(A\) : \((x-2)+2(y-1)=0\), soit \(x+2y=4\) (c'est aussi le dédoublement \(\frac{1\cdot x+2\cdot y}{2}=2\)). \(f\) croît le plus vite selon \(\frac{1}{\sqrt5}(1,2)\), au taux \(\|\nabla f(A)\|=\sqrt5\).</p>
  <p><strong>Q4.</strong> \(\nabla g=(2x,-2y)\) et \(\nabla f\cdot\nabla g=2xy-2xy=0\). Hors de \(O\), les deux gradients sont non nuls ; chacun est normal à la tangente de sa ligne de niveau, donc les deux tangentes sont perpendiculaires.</p>
  <p><strong>Q5.</strong> \(g(A)=3\) : la ligne de niveau est l'hyperbole équilatère \(x^2-y^2=3\). \(\nabla g(A)=(4,-2)\), tangente \(4(x-2)-2(y-1)=0\), soit \(2x-y=3\). Les normales \((1,2)\) et \((2,-1)\) sont orthogonales : les tangentes \(x+2y=4\) et \(2x-y=3\) sont perpendiculaires.</p></div>
</div>
<div class="exo"><span class="num">EXO 05</span><span class="diff">★ ★ ☆</span>
  <h3>Une ellipse définie par foyer et directrice</h3>
  <div class="statement">Dans un repère orthonormé, soit \(F(1,0)\), \(\mathcal D\) la droite d'équation \(x=9\) et \(\mathcal E\) la conique de foyer \(F\), de directrice \(\mathcal D\) et d'excentricité \(e=\frac13\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal E\) a pour équation \(\dfrac{x^2}{9}+\dfrac{y^2}{8}=1\).</div>
  <div class="q"><strong>Q2.</strong> En déduire ses sommets, son second foyer \(F'\) et la directrice \(\mathcal D'\) associée.</div>
  <div class="q"><strong>Q3.</strong> Déterminer les points de \(\mathcal E\) situés sur la perpendiculaire à l'axe focal passant par \(F\) ; vérifier sur eux la relation \(MF=e\,d(M,\mathcal D)\).</div>
  <div class="q"><strong>Q4.</strong> Pour \(M(x,y)\in\mathcal E\), exprimer \(MF\) et \(MF'\) en fonction de \(x\). Que vaut \(MF+MF'\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(F\notin\mathcal D\), et les distances sont positives, donc</p>
  <div class="formula">$$M(x,y)\in\mathcal E\iff MF^2=\tfrac19(x-9)^2\iff 9(x-1)^2+9y^2=(x-9)^2 .$$</div>
  <p>En développant : \(9x^2-18x+9+9y^2=x^2-18x+81\), soit \(8x^2+9y^2=72\), c'est-à-dire \(\dfrac{x^2}{9}+\dfrac{y^2}{8}=1\). Les termes en \(x\) se sont simplifiés : le centre est \(O\).</p>
  <p><strong>Q2.</strong> \(a=3\), \(b=2\sqrt2\), \(c=\sqrt{9-8}=1\) et \(\frac ca=\frac13=e\) : cohérent. Sommets \((\pm3,0)\) et \((0,\pm2\sqrt2)\). Par symétrie par rapport à \((Oy)\) : \(F'(-1,0)\) et \(\mathcal D' : x=-9\) (on a bien \(\frac{a^2}{c}=9\)).</p>
  <p><strong>Q3.</strong> Pour \(x=1\) : \(y^2=8\big(1-\frac19\big)=\frac{64}{9}\), d'où \(M\big(1,\pm\frac83\big)\). Alors \(MF=\frac83\) et \(e\,d(M,\mathcal D)=\frac13(9-1)=\frac83\). On retrouve le paramètre \(p=\frac{b^2}{a}=\frac83=e\,d(F,\mathcal D)\).</p>
  <p><strong>Q4.</strong> Sur \(\mathcal E\), \(|x|\leqslant3\lt9\), donc \(d(M,\mathcal D)=9-x\) et \(MF=\frac13(9-x)=3-\frac x3\). De même \(MF'=e\,d(M,\mathcal D')=\frac13(x+9)=3+\frac x3\). Ainsi \(MF+MF'=6=2a\) pour tout point de \(\mathcal E\) (propriété bifocale, culture hors programme).</p></div>
</div>
<div class="exo"><span class="num">EXO 06</span><span class="diff">★ ★ ☆</span>
  <h3>Une hyperbole décentrée</h3>
  <div class="statement">Soit \(\mathcal H\) la courbe d'équation \(9x^2-4y^2-18x-16y-43=0\). Les formules donnant les éléments d'une conique réduite peuvent être utilisées.</div>
  <div class="q"><strong>Q1.</strong> Mettre l'équation sous forme réduite ; nature de \(\mathcal H\) ?</div>
  <div class="q"><strong>Q2.</strong> Centre, sommets, foyers, excentricité, directrices et asymptotes dans le repère initial.</div>
  <div class="q"><strong>Q3.</strong> Paramétrer chaque branche de \(\mathcal H\).</div>
  <div class="q"><strong>Q4.</strong> Déterminer les points de \(\mathcal H\) d'ordonnée 1, de deux façons. Pour celui d'abscisse positive, vérifier que \(MF=e\,d(M,\mathcal D)\), où \(F\) est le foyer d'abscisse positive et \(\mathcal D\) la directrice associée.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(9(x^2-2x)=9(x-1)^2-9\) et \(-4(y^2+4y)=-4(y+2)^2+16\). L'équation devient \(9(x-1)^2-4(y+2)^2=36\), soit</p>
  <div class="formula">$$\frac{(x-1)^2}{4}-\frac{(y+2)^2}{9}=1 :$$</div>
  <p>deux carrés de signes contraires, hyperbole de centre \(\Omega(1,-2)\), d'axe focal la droite \(y=-2\), avec \(a=2\), \(b=3\).</p>
  <p><strong>Q2.</strong> \(c=\sqrt{4+9}=\sqrt{13}\), \(e=\frac{\sqrt{13}}{2}\approx1{,}80\). Sommets \((3,-2)\) et \((-1,-2)\) ; foyers \(\big(1\pm\sqrt{13},\ -2\big)\) ; directrices \(x=1\pm\frac{4}{\sqrt{13}}\) ; asymptotes \(y+2=\pm\frac32(x-1)\), obtenues en remplaçant le second membre 1 par 0.</p>
  <p><strong>Q3.</strong> Branche de droite : \(t\mapsto\big(1+2\operatorname{ch}t,\ -2+3\operatorname{sh}t\big)\) ; branche de gauche : \(t\mapsto\big(1-2\operatorname{ch}t,\ -2+3\operatorname{sh}t\big)\), \(t\in\mathbb R\).</p>
  <p><strong>Q4.</strong> Avec l'équation : \((y+2)^2=9\), donc \(\frac{(x-1)^2}{4}=2\) et \(x=1\pm2\sqrt2\). Avec le paramétrage : \(-2+3\operatorname{sh}t=1\) donne \(\operatorname{sh}t=1\), \(\operatorname{ch}t=\sqrt{1+1}=\sqrt2\), d'où \(x=1\pm2\sqrt2\). Pour \(M(1+2\sqrt2,\ 1)\) et \(F(1+\sqrt{13},-2)\) :</p>
  <div class="formula">$$MF^2=\big(2\sqrt2-\sqrt{13}\big)^2+9=30-4\sqrt{26},$$</div>
  <p>et \(e\,d(M,\mathcal D)=\frac{\sqrt{13}}{2}\Big(2\sqrt2-\frac{4}{\sqrt{13}}\Big)=\sqrt{26}-2\), dont le carré vaut \(26-4\sqrt{26}+4=30-4\sqrt{26}\). Les deux nombres étant positifs, \(MF=e\,d(M,\mathcal D)\).</p></div>
</div>
<div class="exo"><span class="num">EXO 07</span><span class="diff">★ ★ ☆</span>
  <h3>Parabole : tangente et triangle isocèle</h3>
  <div class="statement">Soit \(\mathcal P\) la courbe d'équation \(y^2-6y-4x+1=0\) et \(M(2,7)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\mathcal P\) est une parabole ; sommet, axe, paramètre, foyer \(F\) et directrice \(\mathcal D\).</div>
  <div class="q"><strong>Q2.</strong> Vérifier que \(M\in\mathcal P\) et calculer \(MF\) et \(d(M,\mathcal D)\).</div>
  <div class="q"><strong>Q3.</strong> Écrire la tangente \(\mathcal T\) à \(\mathcal P\) en \(M\) par dédoublement, et la contrôler par le gradient.</div>
  <div class="q"><strong>Q4.</strong> \(\mathcal T\) coupe l'axe de \(\mathcal P\) en \(T\). Montrer que \(FT=FM\) et interpréter.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(y^2-6y=(y-3)^2-9\), d'où \((y-3)^2=4x+8=4(x+2)\). Avec \(X=x+2\), \(Y=y-3\) : \(Y^2=2pX\), \(p=2\). Parabole de sommet \(S(-2,3)\), d'axe la droite \(y=3\), tournée vers les \(x\) croissants ; foyer \(S+\frac p2\,\vec\imath=F(-1,3)\), directrice \(\mathcal D : x=-2-\frac p2=-3\).</p>
  <p><strong>Q2.</strong> \(49-42-8+1=0\). \(MF=\sqrt{3^2+4^2}=5\) et \(d(M,\mathcal D)=2-(-3)=5\) : on retrouve \(MF=d(M,\mathcal D)\).</p>
  <p><strong>Q3.</strong> Dédoublement en \(M(2,7)\) : \(7y-3(y+7)-4\cdot\frac{x+2}{2}+1=0\), soit \(4y-2x-24=0\), c'est-à-dire \(\mathcal T : x-2y+12=0\). Contrôle : \(\nabla f=(-4,\ 2y-6)\) vaut \((-4,8)\) en \(M\), colinéaire à la normale \((1,-2)\) de \(\mathcal T\), et \(2-14+12=0\).</p>
  <p><strong>Q4.</strong> Sur l'axe \(y=3\) : \(x=2\cdot3-12=-6\), donc \(T(-6,3)\) et \(FT=|-6-(-1)|=5=FM\). Le triangle \(FMT\) est isocèle en \(F\), donc \(\widehat{FMT}=\widehat{FTM}\) : la tangente fait le même angle avec \((MF)\) qu'avec l'axe, donc qu'avec la parallèle à l'axe passant par \(M\). Par la loi de la réflexion, un rayon arrivant parallèlement à l'axe repart vers \(F\) (remarque culturelle, §9).</p></div>
</div>
<div class="exo"><span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Trajectoire d'une comète (équation polaire ramenée en cartésiennes)</h3>
  <div class="statement">Une comète a pour trajectoire, en coordonnées polaires de pôle le Soleil \(O\), la courbe d'équation \(r=\dfrac{2}{1+\cos\theta}\), \(\theta\in\,]-\pi,\pi[\) (unité : l'unité astronomique). L'étude des courbes polaires est hors programme : on se ramène aux coordonnées cartésiennes \(x=r\cos\theta\), \(y=r\sin\theta\).</div>
  <div class="q"><strong>Q1.</strong> Montrer qu'un point \(M(x,y)\neq O\) est sur la trajectoire si et seulement si \(\sqrt{x^2+y^2}=2-x\), puis si et seulement si \(y^2=-4(x-1)\).</div>
  <div class="q"><strong>Q2.</strong> Nature de la trajectoire ; sommet, foyer et directrice. Où se trouve le Soleil ?</div>
  <div class="q"><strong>Q3.</strong> Distance minimale de la comète au Soleil (périhélie) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> Si \(r(1+\cos\theta)=2\) avec \(r\gt0\), alors \(r=2-r\cos\theta\), soit \(\sqrt{x^2+y^2}=2-x\). Réciproquement, si \(\sqrt{x^2+y^2}=2-x\) avec \(M\neq O\), on écrit \(M\) en polaires avec \(r=\sqrt{x^2+y^2}\gt0\) : \(r=2-r\cos\theta\), donc \(r(1+\cos\theta)=2\), ce qui impose \(\cos\theta\neq-1\). Ensuite, comme les deux membres doivent être positifs :</p>
  <div class="formula">$$\begin{aligned}\sqrt{x^2+y^2}=2-x&\iff x^2+y^2=(2-x)^2\ \text{et}\ x\leqslant2\\&\iff y^2=4-4x\ \text{et}\ x\leqslant2 .\end{aligned}$$</div>
  <p>Or \(y^2=4-4x\) entraîne déjà \(x\leqslant1\) : la condition \(x\leqslant2\) est automatique, et la trajectoire est la courbe \(y^2=-4(x-1)\).</p>
  <p><strong>Q2.</strong> Avec \(X=x-1\) : \(y^2=-4X=-2pX\), \(p=2\). Parabole de sommet \(S(1,0)\), d'axe \((Ox)\), tournée vers les \(x\) négatifs ; foyer \(S-\frac p2\,\vec\imath=(0,0)\) : c'est le Soleil ; directrice \(x=1+\frac p2=2\). La relation \(\sqrt{x^2+y^2}=2-x\) de Q1 est exactement \(MO=d(M,\mathcal D)\).</p>
  <p><strong>Q3.</strong> \(MO=2-x\) est minimal quand \(x\) est maximal, c'est-à-dire au sommet \(S\) (\(x=1\)) : distance minimale 1 (en polaires, \(\theta=0\) et \(r=\frac22=1\)).</p></div>
</div>
<div class="exo"><span class="num">EXO 09</span><span class="diff">★ ★ ★</span>
  <h3>Tangentes à une ellipse et triangle d'aire minimale</h3>
  <div class="statement">Soit \(\mathcal E\) l'ellipse d'équation \(\dfrac{x^2}{4}+y^2=1\) et, pour \(t\in\mathbb R\), \(M(t)=(2\cos t,\ \sin t)\).</div>
  <div class="q"><strong>Q1.</strong> Écrire la tangente \(\mathcal T_t\) à \(\mathcal E\) en \(M(t)\).</div>
  <div class="q"><strong>Q2.</strong> Déterminer les tangentes à \(\mathcal E\) qui passent par le point \(P_0(0,2)\).</div>
  <div class="q"><strong>Q3.</strong> Pour \(t\in\,]0,\frac\pi2[\), \(\mathcal T_t\) coupe les axes en \(P\) et \(Q\). Calculer l'aire \(\mathcal A(t)\) du triangle \(OPQ\) et déterminer son minimum.</div>
  <div class="q"><strong>Q4.</strong> Montrer que \(M(t)\) est le milieu de \([PQ]\) si et seulement si l'aire est minimale.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>Q1.</strong> \(M(t)\in\mathcal E\) car \(\cos^2t+\sin^2t=1\). Dédoublement en \((x_0,y_0)=(2\cos t,\sin t)\) : \(\frac{2\cos t\,x}{4}+\sin t\,y=1\), soit</p>
  <div class="formula">$$\mathcal T_t :\ \frac{\cos t}{2}\,x+\sin t\;y=1 .$$</div>
  <p><strong>Q2.</strong> \(P_0\in\mathcal T_t\iff2\sin t=1\iff t\equiv\frac\pi6\) ou \(t\equiv\frac{5\pi}{6}\pmod{2\pi}\). Points de contact \(\big(\sqrt3,\frac12\big)\) et \(\big(-\sqrt3,\frac12\big)\) ; tangentes \(\frac{\sqrt3}{4}x+\frac12y=1\) et \(-\frac{\sqrt3}{4}x+\frac12y=1\), soit \(\sqrt3\,x+2y=4\) et \(-\sqrt3\,x+2y=4\). Contrôle : \(P_0\) vérifie \(0+4=4\).</p>
  <p><strong>Q3.</strong> Avec \(y=0\) : \(P\big(\frac{2}{\cos t},0\big)\) ; avec \(x=0\) : \(Q\big(0,\frac{1}{\sin t}\big)\). Comme \(\cos t\) et \(\sin t\) sont positifs,</p>
  <div class="formula">$$\mathcal A(t)=\frac12\cdot\frac{2}{\cos t}\cdot\frac{1}{\sin t}=\frac{2}{\sin 2t}\geqslant2 ,$$</div>
  <p>avec égalité si et seulement si \(\sin2t=1\), c'est-à-dire \(t=\frac\pi4\) : l'aire minimale vaut 2, atteinte en \(M\big(\sqrt2,\frac{\sqrt2}{2}\big)\).</p>
  <p><strong>Q4.</strong> Le milieu de \([PQ]\) est \(\big(\frac{1}{\cos t},\frac{1}{2\sin t}\big)\). Il est égal à \(M(t)\) si et seulement si \(2\cos^2t=1\) et \(2\sin^2t=1\), c'est-à-dire, sur \(]0,\frac\pi2[\), \(t=\frac\pi4\) : exactement le cas de l'aire minimale.</p></div>
</div>
<div class="exo concours"><span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Coniques de mêmes foyers</h3>
  <div class="exo-source">Exercice <strong>original</strong> au format des épreuves PT (thème : équations réduites, gradient et tangentes, paramétrage d'une hyperbole, famille de coniques).</div>
  <div class="statement">Le plan est rapporté à un repère orthonormé \((O;\vec\imath,\vec\jmath)\). On rappelle (formules fournies) : pour \(\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\) avec \(a\gt b\gt0\), \(c^2=a^2-b^2\), foyers \((\pm c,0)\), \(e=\frac ca\), directrices \(x=\pm\frac{a^2}{c}\) ; pour \(\frac{x^2}{a^2}-\frac{y^2}{b^2}=1\), les mêmes formules avec \(c^2=a^2+b^2\). On pose \(F(2,0)\), \(F'(-2,0)\) et</div>
  <div class="formula">$$\mathcal E :\ \frac{x^2}{16}+\frac{y^2}{12}=1,\qquad \mathcal H :\ x^2-\frac{y^2}{3}=1 .$$</div>

  <p class="exo-part">Partie A — Une ellipse et une hyperbole</p>
  <div class="q"><strong>A1.</strong> Donner la nature et les éléments (sommets, foyers, excentricité, directrices) de \(\mathcal E\) et de \(\mathcal H\), ainsi que les asymptotes de \(\mathcal H\). Que remarque-t-on ?</div>
  <div class="q"><strong>A2.</strong> Déterminer les points communs à \(\mathcal E\) et \(\mathcal H\).</div>
  <div class="q"><strong>A3.</strong> Soit \(M_0(2,3)\). Écrire les tangentes à \(\mathcal E\) et à \(\mathcal H\) en \(M_0\) et montrer qu'elles sont perpendiculaires.</div>

  <p class="exo-part">Partie B — Une famille de coniques</p>
  <div class="statement">Pour \(\lambda\in\mathbb R\setminus\{-4,0\}\), on note \(\mathcal C_\lambda\) la courbe d'équation \(\dfrac{x^2}{\lambda+4}+\dfrac{y^2}{\lambda}=1\).</div>
  <div class="q"><strong>B1.</strong> Discuter la nature de \(\mathcal C_\lambda\) selon \(\lambda\). Montrer que les courbes non vides de la famille ont toutes pour foyers \(F\) et \(F'\). Pour quelles valeurs de \(\lambda\) retrouve-t-on \(\mathcal E\) et \(\mathcal H\) ?</div>
  <div class="q"><strong>B2.</strong> Soit \(M_1(x_1,y_1)\) avec \(x_1y_1\neq0\). Montrer que \(M_1\in\mathcal C_\lambda\) si et seulement si \(P(\lambda)=0\), où \(P(\lambda)=\lambda^2+(4-x_1^2-y_1^2)\,\lambda-4y_1^2\). En déduire que par \(M_1\) passent exactement deux courbes de la famille : une ellipse et une hyperbole.</div>
  <div class="q"><strong>B3.</strong> On note \(\lambda\) et \(\mu\) les deux racines de \(P\). En retranchant les équations de \(\mathcal C_\lambda\) et \(\mathcal C_\mu\), montrer que les gradients de \(f_\lambda(x,y)=\frac{x^2}{\lambda+4}+\frac{y^2}{\lambda}-1\) et de \(f_\mu\) sont orthogonaux en \(M_1\). Interpréter, et vérifier sur \(M_0\).</div>

  <p class="exo-part">Partie C — Paramétrage et asymptotes de \(\mathcal H\)</p>
  <div class="q"><strong>C1.</strong> Montrer que \(t\mapsto M(t)=\big(\operatorname{ch}t,\ \sqrt3\operatorname{sh}t\big)\), \(t\in\mathbb R\), paramètre la branche \(x\gt0\) de \(\mathcal H\). Trouver \(t_0\) tel que \(M(t_0)=M_0\).</div>
  <div class="q"><strong>C2.</strong> Écrire la tangente \(\mathcal T_t\) à \(\mathcal H\) en \(M(t)\).</div>
  <div class="q"><strong>C3.</strong> \(\mathcal T_t\) coupe les asymptotes en \(P(t)\) et \(Q(t)\). Montrer que \(M(t)\) est le milieu de \([P(t)Q(t)]\) et que l'aire du triangle \(OP(t)Q(t)\) ne dépend pas de \(t\).</div>

  <p class="exo-part">Partie D — Bissectrices</p>
  <div class="q"><strong>D1.</strong> Calculer \(M_0F\) et \(M_0F'\). Montrer que la tangente à \(\mathcal H\) en \(M_0\) est dirigée par \(\vec u_1+\vec u_2\), où \(\vec u_1\) et \(\vec u_2\) sont les vecteurs unitaires de \(\overrightarrow{M_0F}\) et \(\overrightarrow{M_0F'}\) : c'est la bissectrice intérieure de l'angle \(\widehat{FM_0F'}\). Que dire de la tangente à \(\mathcal E\) ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution"><h4>Correction</h4>
  <p><strong>A1.</strong> \(\mathcal E\) : ellipse, \(a=4\), \(b=2\sqrt3\), \(c=\sqrt{16-12}=2\), \(e=\frac12\) ; sommets \((\pm4,0)\), \((0,\pm2\sqrt3)\) ; foyers \((\pm2,0)\) ; directrices \(x=\pm\frac{16}{2}=\pm8\). \(\mathcal H\) : hyperbole, \(a=1\), \(b=\sqrt3\), \(c=\sqrt{1+3}=2\), \(e=2\) ; sommets \((\pm1,0)\) ; foyers \((\pm2,0)\) ; directrices \(x=\pm\frac12\) ; asymptotes \(y=\pm\sqrt3\,x\). Les deux coniques ont les mêmes foyers \(F\) et \(F'\).</p>
  <p><strong>A2.</strong> Sur \(\mathcal H\), \(y^2=3x^2-3\). En reportant dans \(\mathcal E\) : \(\frac{x^2}{16}+\frac{x^2-1}{4}=1\), soit \(\frac{5x^2}{16}=\frac54\), \(x^2=4\), puis \(y^2=9\). Quatre points communs : \((\pm2,\pm3)\).</p>
  <p><strong>A3.</strong> Dédoublement en \(M_0(2,3)\) : pour \(\mathcal E\), \(\frac{2x}{16}+\frac{3y}{12}=1\), soit \(x+2y=8\) ; pour \(\mathcal H\), \(2x-\frac{3y}{3}=1\), soit \(2x-y=1\). Les normales \((1,2)\) et \((2,-1)\) sont orthogonales : les tangentes sont perpendiculaires.</p>
  <p><strong>B1.</strong> Si \(\lambda\gt0\) : \(\lambda+4\gt\lambda\gt0\), ellipse avec \(a^2=\lambda+4\), \(b^2=\lambda\), donc \(c^2=4\). Si \(-4\lt\lambda\lt0\) : l'équation s'écrit \(\frac{x^2}{\lambda+4}-\frac{y^2}{-\lambda}=1\), hyperbole avec \(a^2=\lambda+4\), \(b^2=-\lambda\), donc \(c^2=4\). Si \(\lambda\lt-4\) : les deux coefficients sont strictement négatifs et \(\mathcal C_\lambda\) est vide. Dans les deux premiers cas, \(c=2\) et les foyers sont \(F\) et \(F'\). On retrouve \(\mathcal E\) pour \(\lambda=12\) et \(\mathcal H\) pour \(\lambda=-3\).</p>
  <p><strong>B2.</strong> Comme \(\lambda(\lambda+4)\neq0\), on multiplie l'équation par \(\lambda(\lambda+4)\) :</p>
  <div class="formula">$$M_1\in\mathcal C_\lambda\iff\lambda x_1^2+(\lambda+4)\,y_1^2=\lambda(\lambda+4)\iff P(\lambda)=0 .$$</div>
  <p>Or \(P(-4)=4x_1^2\gt0\), \(P(0)=-4y_1^2\lt0\) et \(P(\lambda)\to+\infty\) quand \(\lambda\to+\infty\). Par le théorème des valeurs intermédiaires, \(P\) a une racine dans \(]-4,0[\) et une dans \(]0,+\infty[\) ; de degré 2, il n'en a pas d'autre. Par \(M_1\) passent donc exactement une hyperbole (\(\lambda\in\,]-4,0[\)) et une ellipse (\(\mu\gt0\)) de la famille.</p>
  <p><strong>B3.</strong> En retranchant les deux équations vérifiées par \(M_1\) :</p>
  <div class="formula">$$x_1^2\Big(\frac{1}{\lambda+4}-\frac{1}{\mu+4}\Big)+y_1^2\Big(\frac1\lambda-\frac1\mu\Big)=0 ,$$</div>
  <p>soit \((\mu-\lambda)\Big(\dfrac{x_1^2}{(\lambda+4)(\mu+4)}+\dfrac{y_1^2}{\lambda\mu}\Big)=0\). Comme \(\lambda\neq\mu\), la parenthèse est nulle. Or \(\nabla f_\lambda(M_1)=\big(\frac{2x_1}{\lambda+4},\frac{2y_1}{\lambda}\big)\), et \(\nabla f_\lambda(M_1)\cdot\nabla f_\mu(M_1)\) vaut 4 fois cette parenthèse : les gradients, non nuls, sont orthogonaux. L'ellipse et l'hyperbole de la famille qui passent par \(M_1\) s'y coupent à angle droit. Pour \(M_0\) : \(P(\lambda)=\lambda^2-9\lambda-36=(\lambda-12)(\lambda+3)\), on retrouve \(\mathcal E\), \(\mathcal H\) et le résultat de A3.</p>
  <p><strong>C1.</strong> \(\operatorname{ch}^2t-\frac{3\operatorname{sh}^2t}{3}=1\) : \(M(t)\in\mathcal H\), et \(\operatorname{ch}t\gt0\). Réciproquement, si \(M(x,y)\in\mathcal H\) avec \(x\gt0\), il existe un unique \(t\) tel que \(\sqrt3\operatorname{sh}t=y\) (\(\operatorname{sh}\) est bijective) ; alors \(x^2=1+\operatorname{sh}^2t=\operatorname{ch}^2t\) et \(x=\operatorname{ch}t\). Pour \(M_0\) : \(\operatorname{sh}t_0=\sqrt3\), \(\operatorname{ch}t_0=2\), donc \(e^{t_0}=\operatorname{ch}t_0+\operatorname{sh}t_0=2+\sqrt3\) et \(t_0=\ln\big(2+\sqrt3\big)\).</p>
  <p><strong>C2.</strong> Dédoublement : \(\mathcal T_t :\ x\operatorname{ch}t-\dfrac{y\operatorname{sh}t}{\sqrt3}=1\).</p>
  <p><strong>C3.</strong> Avec \(y=\sqrt3\,x\) : \(x(\operatorname{ch}t-\operatorname{sh}t)=1\), soit \(x=e^{t}\) : \(P(t)=\big(e^{t},\ \sqrt3\,e^{t}\big)\). Avec \(y=-\sqrt3\,x\) : \(x(\operatorname{ch}t+\operatorname{sh}t)=1\), d'où \(Q(t)=\big(e^{-t},\ -\sqrt3\,e^{-t}\big)\). Le milieu de \([PQ]\) est \(\big(\frac{e^t+e^{-t}}{2},\ \sqrt3\,\frac{e^t-e^{-t}}{2}\big)=M(t)\). L'aire du triangle vaut</p>
  <div class="formula">$$\frac12\Big|e^{t}\big(-\sqrt3\,e^{-t}\big)-e^{-t}\big(\sqrt3\,e^{t}\big)\Big|=\sqrt3 ,$$</div>
  <p>indépendante de \(t\) (elle vaut \(ab\)).</p>
  <p><strong>D1.</strong> \(M_0F=3\) et \(M_0F'=\sqrt{16+9}=5\) ; on note que \(M_0F+M_0F'=8=2a_{\mathcal E}\) et \(M_0F'-M_0F=2=2a_{\mathcal H}\). \(\vec u_1=(0,-1)\), \(\vec u_2=\frac15(-4,-3)\), donc \(\vec u_1+\vec u_2=-\frac45(1,2)\). La tangente \(2x-y=1\) à \(\mathcal H\) est dirigée par \((1,2)\) : c'est la bissectrice intérieure de \(\widehat{FM_0F'}\) (la somme de deux vecteurs unitaires dirige la bissectrice de leur angle). La tangente \(x+2y=8\) à \(\mathcal E\), perpendiculaire (A3), est la bissectrice extérieure. Ce sont les propriétés de réflexion des coniques (remarque culturelle, §9).</p></div>
</div>
