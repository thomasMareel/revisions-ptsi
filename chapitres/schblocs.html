<div class="course-section">
  <div class="sec-num">AU PROGRAMME · PTSI</div>
  <h2>Ce que le programme officiel demande</h2>
  <div class="intro">Ce chapitre couvre deux capacités du semestre S1 : identifier la structure d'un système asservi (compétence A3 « Analyser ») et modéliser un système par schéma-blocs (compétence B2 « Modéliser »). Il s'appuie sur <a href="#slci/cours">« SLCI : modélisation et transformée de Laplace »</a> (fonctions de transfert) et sert à tous les chapitres de performances qui suivent. Les chaînes fonctionnelles sont présentées dans <a href="#ingsys/cours">« Ingénierie système »</a>, les systèmes séquentiels dans <a href="#sequentiel/cours">« Systèmes séquentiels »</a>.</div>
  <div class="reveal" onclick="this.classList.toggle('open')">
    <span class="label">Programme officiel</span>
    <span class="prompt">Les capacités exigibles, dans l'ordre du chapitre</span>
    <div class="content">
      <ul>
        <li><strong>Identifier la structure d'un système asservi</strong> (A3, S1) : grandeurs d'entrée et de sortie, consigne, comparateur, correcteur, commande, chaîne directe, chaîne de retour, capteur, perturbation (§1, §4) ; poursuite et régulation (§1).</li>
        <li><strong>Identifier et décrire les liens entre les chaînes fonctionnelles</strong> (A3, S1) : place de la chaîne d'information et de la chaîne de puissance dans un asservissement (§5) ; systèmes asservis et systèmes séquentiels (§6).</li>
        <li><strong>Modéliser un système par schéma-blocs</strong> (B2, S1) : schéma-blocs organique d'un système (§5, §7) ; élaboration (§2, §7, §8), manipulation et réduction de schéma-blocs (§3) ; fonctions de transfert de la chaîne directe et de la chaîne de retour, en boucle ouverte et en boucle fermée (§4).</li>
      </ul>
      <p>Les schémas-blocs servent ensuite à évaluer la stabilité, la précision et la rapidité d'un système asservi (S2, chapitres suivants). Relèvent de la 2ᵉ année : le réglage des correcteurs (S4) et la modélisation multiphysique (S3). Hors programme des deux années : la règle de Mason, qui réduit d'un coup un graphe quelconque ; on s'en passe en déplaçant les sommateurs et les points de prélèvement (§3).</p>
    </div>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§1 · POURQUOI BOUCLER</div>
  <h2>Commander en boucle ouverte ou en boucle fermée</h2>
  <div class="intro">Pour régler la vitesse d'un tapis roulant, on peut appliquer au moteur la tension qui, d'après les essais, donne la bonne vitesse : c'est une commande en <strong>boucle ouverte</strong>. Elle est simple, mais aveugle : si la charge augmente ou si le moteur chauffe, la vitesse dérive sans que rien ne la corrige. En <strong>boucle fermée</strong>, on mesure la vitesse, on la compare en permanence à la consigne et l'on corrige la commande en fonction de l'écart. C'est le principe de tout système asservi.</div>
  <div class="def-box">
    Un <strong>système asservi</strong> comprend :
    <ul>
      <li>une <strong>consigne</strong> \(e(t)\), traduite par un <strong>adaptateur</strong> dans la même unité que la mesure ;</li>
      <li>un <strong>comparateur</strong>, qui forme l'<strong>écart</strong> \(\varepsilon(t)\) = consigne adaptée − mesure ;</li>
      <li>un <strong>correcteur</strong>, qui élabore la <strong>commande</strong> \(u(t)\) à partir de l'écart ;</li>
      <li>la <strong>chaîne d'action</strong> : préactionneur, actionneur et processus, qui produit la sortie \(s(t)\), soumise à des <strong>perturbations</strong> ;</li>
      <li>un <strong>capteur</strong>, qui mesure la sortie et referme la boucle : il forme la <strong>chaîne de retour</strong>, tandis que le correcteur et la chaîne d'action forment la <strong>chaîne directe</strong>.</li>
    </ul>
    On parle de <strong>poursuite</strong> (ou d'asservissement au sens strict) quand la consigne varie : la sortie doit la suivre (trajectoire d'un robot, pointage d'une antenne). On parle de <strong>régulation</strong> quand la consigne est constante : la sortie doit résister aux perturbations (température d'un four, vitesse d'une voiture).
  </div>

  <div class="notice">L'adaptateur doit avoir le <strong>même gain</strong> que le capteur : c'est à cette condition qu'un écart nul correspond à une sortie égale à la consigne. On en profite pour simplifier les calculs : on se ramène à un retour unitaire (§4).</div>
  <div class="method-box">
    <strong>Exemple — le régulateur de vitesse d'une voiture</strong>
    <ol>
      <li>Consigne : la vitesse choisie par le conducteur, 90 km/h, constante : c'est une <strong>régulation</strong>. Sortie : la vitesse du véhicule.</li>
      <li>Capteur : le capteur de vitesse de roue, qui délivre des impulsions ; adaptateur, comparateur et correcteur : programmes du calculateur ; commande : le couple demandé au moteur.</li>
      <li>Chaîne d'action : injection (préactionneur), moteur (actionneur), transmission et véhicule (processus). Perturbations : pente, vent, chargement.</li>
      <li>Effet du bouclage : à commande fixe (boucle ouverte), une côte de 5 % ferait tomber la vitesse de 90 à 70 km/h. En boucle fermée, avec une FTBO de gain statique 19, la chute n'est plus que de \(\dfrac{20}{1 + 19} = 1\) km/h (§4).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§2 · LE LANGAGE DES SCHÉMAS-BLOCS</div>
  <h2>Trois éléments suffisent</h2>
  <div class="def-box">
    Dans le domaine de Laplace, sous conditions de Heaviside :
    <ul>
      <li>un <strong>bloc</strong> de fonction de transfert \(H(p)\) traversé par \(X(p)\) délivre \(Y(p) = H(p)\,X(p)\) ;</li>
      <li>un <strong>sommateur</strong> (ou comparateur) délivre la somme de ses entrées affectées de leurs signes : \(\varepsilon = X_1 - X_2\) ;</li>
      <li>un <strong>point de prélèvement</strong> recopie un signal sur plusieurs branches, sans le modifier.</li>
    </ul>
  </div>
  <div class="notice">Les signaux qui arrivent sur un même sommateur ont forcément la <strong>même unité</strong> : c'est un contrôle immédiat de tout schéma.</div>

  <h3>Un exemple fondamental : le moteur à courant continu</h3>
  <p>Les quatre équations du moteur, avec \(u\) la tension d'induit, \(i\) le courant, \(\omega\) la vitesse, \(c_m\) le couple moteur, \(c_r\) le couple résistant, \(J\) l'inertie ramenée sur l'arbre et \(f\) le frottement visqueux :</p>
  <div class="formula" data-nom="Équations du moteur à courant continu">$$u = R\,i + L\,\frac{di}{dt} + e,\qquad e = k\,\omega,\qquad c_m = k\,i,\qquad J\,\frac{d\omega}{dt} = c_m - c_r - f\,\omega.$$</div>
  <p>En Laplace : \(I = \dfrac{U - E}{R + Lp}\), \(E = k\,\Omega\), \(C_m = k\,I\) et \(\Omega = \dfrac{C_m - C_r}{f + Jp}\). Chaque relation devient un bloc ou un sommateur.</p>

  <div class="method-box">
    <strong>Exemple — la fonction de transfert du moteur</strong>
    <ol>
      <li>Sans couple résistant (\(C_r = 0\)), la chaîne directe vaut \(\dfrac{k}{(R + Lp)(f + Jp)}\) et le retour \(k\).</li>
      <li>Formule de la boucle : \(\dfrac{\Omega(p)}{U(p)} = \dfrac{\dfrac{k}{(R + Lp)(f + Jp)}}{1 + \dfrac{k^2}{(R + Lp)(f + Jp)}} = \dfrac{k}{(R + Lp)(f + Jp) + k^2}\) : un deuxième ordre.</li>
      <li>Modèle simplifié usuel : inductance et frottement négligés (\(L = 0\), \(f = 0\)) : \(\dfrac{\Omega(p)}{U(p)} = \dfrac{k}{RJp + k^2} = \dfrac{1/k}{1 + \tau_m p}\) avec la constante de temps mécanique \(\tau_m = \dfrac{RJ}{k^2}\).</li>
      <li>Valeurs : \(R = 2{,}0\ \Omega\), \(k = 0{,}10\ \text{V·s/rad}\) (ou N·m/A), \(J = 2{,}0\times 10^{-4}\ \text{kg·m}^2\) donnent \(\tau_m = \dfrac{2{,}0 \times 2{,}0\times 10^{-4}}{0{,}10^2} = 0{,}040\ \text{s}\) et un gain \(\dfrac1k = 10\ \text{rad·s}^{-1}/\text{V}\) : sous 12 V, le moteur atteint 120 rad/s (1 150 tr/min) à 5 % près en \(3\tau_m = 0{,}12\) s. Avec \(L = 1{,}0\) mH, la constante électrique \(L/R = 0{,}5\) ms est 80 fois plus petite que \(\tau_m\) : les pôles exacts valent \(-25\) et \(-1\,975\ \text{s}^{-1}\), et le modèle simplifié garde le seul pôle qui compte.</li>
    </ol>
  </div>
</div>

<div class="course-section">
  <div class="sec-num">§3 · RÉDUIRE UN SCHÉMA-BLOCS</div>
  <h2>Les règles d'algèbre</h2>
  <div class="prop-box">
    <ul>
      <li><strong>Blocs en série</strong> : \(H = H_1\,H_2\) (l'ordre importe peu pour des fonctions de transfert scalaires, mais il fixe le signal intermédiaire).</li>
      <li><strong>Blocs en parallèle</strong> (même entrée, sorties sommées) : \(H = H_1 \pm H_2\), avec le signe du sommateur.</li>
      <li><strong>Boucle</strong> de chaîne directe \(A\) et de chaîne de retour \(B\), retour soustrait :</li>
    </ul>
    <div class="formula" data-nom="Formule de la boucle (formule de Black)">$$\frac{S}{E} = \frac{A}{1 + A\,B}\quad\text{(retour soustrait)},$$</div>
    <div class="formula">$$\frac{S}{E} = \frac{A}{1 - A\,B}\quad\text{(retour ajouté)}.$$</div>
  </div>
  <div class="prop-box">
    <strong>Déplacer un élément sans changer les signaux.</strong>
    <ul>
      <li>Point de prélèvement déplacé de l'amont à l'aval d'un bloc \(H\) : ajouter \(1/H\) sur la branche prélevée ; de l'aval vers l'amont : ajouter \(H\).</li>
      <li>Sommateur déplacé de l'aval à l'amont d'un bloc \(H\) : ajouter \(1/H\) sur l'entrée déplacée ; de l'amont vers l'aval : ajouter \(H\).</li>
    </ul>
    Dans chaque cas, on vérifie que le signal qui arrive au même endroit n'a pas changé.
  </div>
  <div class="method-box">
    <strong>Exemple — deux boucles imbriquées</strong>
    <p>Une boucle interne de chaîne directe \(G_1(p) = \dfrac{4}{p}\) et de retour unitaire est suivie de \(G_2(p) = \dfrac{1}{1 + 0{,}5p}\) ; le tout est bouclé par un retour unitaire.</p>
    <ol>
      <li>Boucle interne : \(\dfrac{G_1}{1 + G_1} = \dfrac{4}{p + 4} = \dfrac{1}{1 + 0{,}25p}\).</li>
      <li>Chaîne directe de la boucle externe : \(A = \dfrac{1}{(1 + 0{,}25p)(1 + 0{,}5p)}\).</li>
      <li>Boucle externe :
        <div class="formula">$$\frac{S}{E} = \frac{A}{1 + A} = \frac{1}{(1 + 0{,}25p)(1 + 0{,}5p) + 1} = \frac{0{,}5}{1 + 0{,}375p + 0{,}0625p^2},$$</div>
        de gain statique 0,5 : un deuxième ordre.</li>
    </ol>
    <p><strong>Autre voie, souvent plus sûre :</strong> nommer les signaux intermédiaires (sortie de chaque sommateur), écrire une équation par sommateur et par bloc, puis éliminer. On ne se trompe ni de signe ni de branche.</p>
  </div>
  <h3>Boucles entrelacées</h3>
  <p>Deux boucles sont <strong>entrelacées</strong> quand elles partagent un bloc sans que l'une contienne l'autre : la formule de la boucle ne s'applique alors à aucune des deux. On déplace un point de prélèvement ou un sommateur pour les rendre <strong>imbriquées</strong>, ou l'on passe par les équations.</p>

</figure>
  <div class="method-box">
    <strong>Exemple — séparer deux boucles entrelacées</strong>
    <p>\(G_1 = 4\), \(G_2 = \dfrac{2}{p}\), \(G_3 = \dfrac{1}{1 + 0{,}5p}\) ; retour \(H_1 = 0{,}5\) de \(X_2\) vers le premier comparateur, retour \(H_2 = 1\) de \(S\) vers le second (figure a).</p>
    <ol>
      <li>On déplace le prélèvement de \(H_1\) de \(X_2\) à \(S = G_3\,X_2\), en aval de \(G_3\) : pour transmettre le même signal, la branche devient \(H_1/G_3\) (figure b).</li>
      <li>Boucle intérieure (\(G_2\), \(G_3\), retour \(H_2\)) : \(\dfrac{G_2G_3}{1 + G_2G_3H_2}\).</li>
      <li>Boucle extérieure, de chaîne directe \(G_1\cdot\dfrac{G_2G_3}{1 + G_2G_3H_2}\) et de retour \(\dfrac{H_1}{G_3}\) :
        <div class="formula">$$\frac{S}{E} = \frac{G_1G_2G_3}{1 + G_2G_3H_2 + G_1G_2H_1}.$$</div></li>
      <li>Valeurs : \(\dfrac{S}{E} = \dfrac{16}{p^2 + 6p + 12} = \dfrac{4/3}{1 + 0{,}5p + p^2/12}\) : deuxième ordre de gain statique \(\tfrac43\), \(\omega_0 = \sqrt{12} \approx 3{,}5\ \text{rad/s}\), \(\xi \approx 0{,}87\).</li>
      <li>Contrôle par les équations : \(X_1 = G_1\,(E - H_1X_2)\), \(X_2 = G_2\,(X_1 - H_2S)\), \(S = G_3X_2\) ; l'élimination de \(X_1\) et \(X_2\) redonne la même fonction de transfert.</li>
    </ol>
  </div>
  <div class="notice"><strong>Erreur classique</strong> : appliquer la formule de la boucle à l'une de deux boucles entrelacées, comme si l'autre n'existait pas. Repère : chaque boucle doit contenir entièrement, ou ne pas toucher du tout, chacune des autres.</div>
</div>

<div class="course-section">
  <div class="sec-num">§4 · BOUCLE OUVERTE, BOUCLE FERMÉE ET PERTURBATIONS</div>
  <h2>Les deux fonctions de transfert d'un asservissement</h2>
  <div class="def-box">
    Pour une boucle de chaîne directe \(A(p)\) (correcteur, actionneur, processus) et de chaîne de retour \(B(p)\) (capteur) :
    <ul>
      <li>la <strong>fonction de transfert en boucle ouverte</strong> (FTBO) est le produit de tous les blocs de la boucle, \(H_{BO}(p) = A(p)\,B(p)\) : c'est le rapport mesure / écart, celui que l'on obtiendrait en ouvrant la boucle juste avant le comparateur ;</li>
      <li>la <strong>fonction de transfert en boucle fermée</strong> (FTBF) est le rapport sortie / consigne.</li>
    </ul>
    <div class="formula" data-nom="FTBO et FTBF">$$H_{BO}(p) = A(p)\,B(p),\qquad H_{BF}(p) = \frac{S(p)}{E(p)} = \frac{A(p)}{1 + H_{BO}(p)}.$$</div>
  </div>
  <div class="prop-box">
    <strong>Se ramener à un retour unitaire.</strong> Avec un adaptateur de même gain \(K_a\) que le capteur, constant, on peut faire passer ce gain dans la chaîne directe : l'asservissement est équivalent à une boucle à <strong>retour unitaire</strong> de FTBO \(H_{BO}\), et
    <div class="formula" data-nom="FTBF à retour unitaire">$$H_{BF}(p) = \frac{H_{BO}(p)}{1 + H_{BO}(p)}.$$</div>
    C'est la forme utilisée dans tous les chapitres suivants (stabilité, précision, correction).
  </div>
  <div class="prop-box">
    <strong>Plusieurs entrées : superposition.</strong> Le système étant linéaire, une consigne \(E\) et une perturbation \(D\) agissent séparément :
    <div class="formula" data-nom="Superposition consigne et perturbation">$$S(p) = H_E(p)\,E(p) + H_D(p)\,D(p),$$</div>
    où \(H_E\) se calcule avec \(D = 0\) et \(H_D\) avec \(E = 0\). Si la perturbation entre entre deux blocs \(G_1\) (amont) et \(G_2\) (aval) d'une boucle à retour unitaire de correcteur \(C\) : \(H_E = \dfrac{C\,G_1G_2}{1 + C\,G_1G_2}\) et \(H_D = \dfrac{G_2}{1 + C\,G_1G_2}\). Les deux ont le <strong>même dénominateur</strong> \(1 + H_{BO}\).
  </div>
  <div class="method-box">
    <strong>Exemple — ce que le bouclage apporte à un premier ordre</strong>
    <p>Un processus \(G(p) = \dfrac{K}{1 + \tau p}\) est commandé par un correcteur proportionnel \(C(p) = K_c\), retour unitaire.</p>
    <ol>
      <li>\(H_{BF}(p) = \dfrac{K_cK}{1 + \tau p + K_cK} = \dfrac{K'}{1 + \tau' p}\) avec \(K' = \dfrac{K_cK}{1 + K_cK}\) et \(\tau' = \dfrac{\tau}{1 + K_cK}\).</li>
      <li>Avec \(K_cK = 9\) : la boucle fermée est <strong>dix fois plus rapide</strong> que le processus seul, et son gain statique 0,9 est proche de 1 : la sortie suit la consigne à 10 % près.</li>
      <li>Si le gain \(K\) du processus dérive de 20 %, \(K'\) passe de 0,900 à 0,915 : moins de 2 %. Le bouclage rend la sortie peu sensible aux défauts de la chaîne directe.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Écart et adaptateur.</strong> Avec un adaptateur de gain \(K_a\) égal à celui du capteur, l'écart vaut \(\varepsilon = K_a\,E - K_a\,S = K_a\,(E - S)\) : il est nul si et seulement si la sortie égale la consigne, et il mesure l'erreur \(E - S\) dans l'unité du capteur. La FTBF vaut alors \(\dfrac{K_a\,A}{1 + A\,K_a} = \dfrac{H_{BO}}{1 + H_{BO}}\) : c'est le retour unitaire.
  </div>
  <div class="method-box">
    <strong>Exemple — une boucle de vitesse à génératrice tachymétrique</strong>
    <p>Variateur et moteur : \(\dfrac{\Omega(p)}{U(p)} = \dfrac{10}{1 + 0{,}04p}\) (rad/s par V) ; génératrice tachymétrique \(K_{cap} = 0{,}05\ \text{V}/(\text{rad/s})\) ; adaptateur \(K_a = 0{,}05\ \text{V}/(\text{rad/s})\) ; correcteur proportionnel \(K_c = 20\).</p>
    <ol>
      <li>FTBO : \(H_{BO} = K_c \times \dfrac{10}{1 + 0{,}04p} \times K_{cap} = \dfrac{10}{1 + 0{,}04p}\), sans unité (des volts sur des volts).</li>
      <li>FTBF : \(\dfrac{\Omega}{\Omega_c} = \dfrac{H_{BO}}{1 + H_{BO}} = \dfrac{10}{11 + 0{,}04p} = \dfrac{0{,}909}{1 + 0{,}0036\,p}\).</li>
      <li>Consigne 100 rad/s : \(\Omega_\infty = 90{,}9\) rad/s ; écart \(\varepsilon_\infty = 0{,}05 \times (100 - 90{,}9) = 0{,}45\) V ; commande \(u = 20 \times 0{,}45 = 9{,}1\) V, et l'on vérifie \(10 \times 9{,}1 = 91\) rad/s.</li>
      <li>Rapidité : constante de temps 3,6 ms, onze fois moins que celle du moteur seul (40 ms)… à condition que le variateur fournisse la tension demandée au démarrage, \(u(0^+) = 20 \times 0{,}05 \times 100 = 100\) V. Alimenté sous 24 V, il sature : le démarrage réel est plus lent que ne le prévoit le modèle linéaire.</li>
    </ol>
  </div>
  <div class="prop-box">
    <strong>Effet statique d'une perturbation.</strong> Si une perturbation, agissant en aval du correcteur, déplace la sortie de \(\Delta S\) en boucle ouverte (commande figée), elle ne la déplace plus que de \(\dfrac{\Delta S}{1 + H_{BO}(0)}\) en boucle fermée à retour unitaire, pour une FTBO de classe 0. C'est le calcul du régulateur de vitesse du §1 ; l'étude complète (classe, position de l'intégrateur) est au chapitre <a href="#precision/cours">« Performances : précision et rapidité »</a>.
  </div>
  <div class="notice">Si la FTBO est grande devant 1, \(H_{BF} \approx 1/B\) : la précision ne dépend plus que du capteur. Un asservissement n'est jamais plus précis que sa mesure.</div>
</div>

<div class="course-section">
  <div class="sec-num">§5 · DE LA CHAÎNE FONCTIONNELLE AU SCHÉMA-BLOCS</div>
  <h2>Relier l'architecture du système au modèle</h2>
  <p>L'analyse fonctionnelle décrit un système par sa <strong>chaîne d'information</strong> (acquérir, traiter, communiquer) et sa <strong>chaîne de puissance</strong> (alimenter, moduler, convertir, transmettre, agir). Le schéma-blocs en donne la traduction quantitative : le capteur (acquérir) est le bloc de retour, le calculateur (traiter) porte l'adaptateur, le comparateur et le correcteur, le variateur (moduler) et le moteur (convertir) forment l'actionneur, le réducteur ou la vis (transmettre) et la charge (agir) forment le processus.</p>
  <div class="method-box">
    <strong>Exemple — l'axe d'un robot, de la chaîne fonctionnelle au schéma-blocs</strong>
    <ol>
      <li><em>Acquérir</em> : un codeur de 4 096 points par tour, monté sur l'axe, donne \(K_{cap} = \dfrac{4096}{2\pi} \approx 652\) points/rad (un point vaut 0,088°).</li>
      <li><em>Traiter</em> : le calculateur convertit la consigne \(\theta_c\) (en rad) en points par un adaptateur \(K_a = K_{cap}\), forme l'écart en points, et le correcteur proportionnel \(K_c = 0{,}020\) V/point en tire la tension de commande \(u\).</li>
      <li><em>Moduler et convertir</em> : variateur et moteur, \(\dfrac{\Omega_m}{U} = \dfrac{K_m}{1 + \tau_m p}\) avec \(K_m = 20\ \text{rad·s}^{-1}/\text{V}\) et \(\tau_m = 0{,}050\) s.</li>
      <li><em>Transmettre et agir</em> : réducteur \(r = 1/40\), \(\omega = r\,\omega_m\) ; l'angle de l'axe est l'intégrale de sa vitesse : bloc \(\dfrac1p\).</li>
      <li>FTBO : \(H_{BO}(p) = \dfrac{K_c\,K_m\,r\,K_{cap}}{p\,(1 + \tau_m p)} \approx \dfrac{6{,}5}{p\,(1 + 0{,}05p)}\) (gain en \(\text{s}^{-1}\)) : classe 1, l'intégrateur venant de l'axe lui-même. L'écart statique est donc nul pour une consigne en échelon (« Performances »), et la boucle fermée est un deuxième ordre, \(\omega_0 \approx 11{,}4\ \text{rad/s}\) et \(\xi \approx 0{,}88\) (« Systèmes du 2e ordre », §5).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§6 · SYSTÈMES ASSERVIS ET SYSTÈMES SÉQUENTIELS</div>
  <h2>Deux façons de commander</h2>
  <div class="intro">Le programme demande de relier la chaîne d'information à la chaîne de puissance, et de distinguer deux manières de le faire : en continu, en dosant la commande d'après l'écart mesuré (système asservi), ou par événements, en basculant d'un état à un autre (système séquentiel).</div>
  <div class="def-box">
    <ul>
      <li>Un <strong>système asservi</strong> commande une grandeur continue (vitesse, position, température) : il la compare en permanence à une consigne et dose la commande d'après l'écart. On le modélise par un schéma-blocs et des fonctions de transfert.</li>
      <li>Un <strong>système séquentiel</strong> manipule des grandeurs logiques (tout ou rien : marche ou arrêt, ouvert ou fermé, présent ou absent) et évolue par <strong>événements</strong> : franchissement d'un seuil, appui sur un bouton, fin d'une temporisation. On le modélise par un diagramme d'états (chapitre <a href="#sequentiel/cours">« Systèmes séquentiels »</a>).</li>
    </ul>
  </div>
  <p>La plupart des systèmes combinent les deux. La partie séquentielle choisit le mode de fonctionnement (attente, ouverture, fermeture d'un portail ; mise en marche d'une machine), la partie asservie règle une grandeur continue à l'intérieur de chaque mode (la vitesse du moteur pendant l'ouverture). Un capteur de fin de course n'est donc pas le retour d'un asservissement : il délivre un événement, qui fait changer d'état.</p>
  <div class="method-box">
    <strong>Exemple — chauffer une pièce par thermostat</strong>
    <p>Pièce de capacité thermique \(C = 1{,}0\times 10^{6}\ \text{J/K}\), de résistance thermique vers l'extérieur \(R_{th} = 1{,}0\times 10^{-2}\ \text{K/W}\) (constante de temps \(\tau = R_{th}C = 1{,}0\times 10^{4}\) s, soit 2,8 h), extérieur à 5 °C, radiateur de 2,0 kW.</p>
    <ol>
      <li>Le thermostat est séquentiel : deux états, Chauffe (2 kW) et Arrêt, et deux transitions, vers Arrêt quand \(\theta \geq 21\) °C, vers Chauffe quand \(\theta \leq 19\) °C. En chauffe, la pièce tend vers \(5 + R_{th} \times 2000 = 25\) °C ; à l'arrêt, vers 5 °C.</li>
      <li>Chaque phase est la réponse d'un premier ordre : \(\theta(t) = \theta_\infty + (\theta_0 - \theta_\infty)\,e^{-t/\tau}\). Montée de 19 à 21 °C : \(t_{\text{on}} = \tau\ln\dfrac{25 - 19}{25 - 21} \approx 4\,050\) s (68 min) ; descente de 21 à 19 °C : \(t_{\text{off}} = \tau\ln\dfrac{21 - 5}{19 - 5} \approx 1\,340\) s (22 min). Période : environ 1 h 30.</li>
      <li>Puissance moyenne : \(2\ \text{kW} \times \dfrac{4\,050}{5\,390} \approx 1{,}5\) kW (1 505 W), pratiquement celle qui maintiendrait 20 °C en continu : \(\dfrac{20 - 5}{R_{th}} = 1\,500\) W.</li>
      <li>Bilan : le thermostat, simple et bon marché, laisse la température osciller de ± 1 °C autour de 20 °C ; un asservissement qui module la puissance la tient constante (§7).</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§7 · ÉLABORER UN SCHÉMA-BLOCS AVEC PERTURBATION</div>
  <h2>De la description du système au schéma-blocs</h2>
  <div class="intro">On reprend la pièce du §6, chauffée cette fois par une puissance modulée : un capteur de température, un calculateur, un gradateur qui dose la puissance du radiateur. La température extérieure n'est pas commandée : c'est une perturbation. La démarche vaut pour tous les systèmes : une équation par constituant, un bloc ou un sommateur par équation.</div>
  <div class="method-box">
    <strong>Exemple — la régulation de température d'une pièce</strong>
    <ol>
      <li>Bilan d'énergie de la pièce : \(C\,\dfrac{d\theta}{dt} = P - \dfrac{\theta - \theta_{ext}}{R_{th}}\). Avec \(\tau = R_{th}C\) : \(\Theta(p) = \dfrac{R_{th}\,P(p) + \Theta_{ext}(p)}{1 + \tau p}\). Dans le schéma, un sommateur reçoit \(R_{th}\,P\) et la perturbation \(\Theta_{ext}\), suivi d'un premier ordre de gain 1.</li>
      <li>Mesure et commande : capteur \(K_{cap} = 0{,}10\) V/°C, adaptateur \(K_a = 0{,}10\) V/°C, correcteur proportionnel et gradateur \(P = K_c\,\varepsilon\) avec \(K_c = 4\,000\) W/V.</li>
      <li>FTBO : \(H_{BO}(p) = \dfrac{K_c\,R_{th}\,K_{cap}}{1 + \tau p} = \dfrac{4}{1 + \tau p}\).</li>
      <li>Superposition : \(\Theta = H_E\,\Theta_c + H_D\,\Theta_{ext}\), avec \(H_E = \dfrac{K_a K_c R_{th}}{1 + K_{BO} + \tau p} = \dfrac{0{,}8}{1 + 2\,000\,p}\) et \(H_D = \dfrac{1}{1 + K_{BO} + \tau p} = \dfrac{0{,}2}{1 + 2\,000\,p}\) (\(K_{BO} = 4\)) : même dénominateur.</li>
      <li>Lecture : pour \(\theta_c = 20\) °C et \(\theta_{ext} = 5\) °C, \(\theta_\infty = 0{,}8 \times 20 + 0{,}2 \times 5 = 17\) °C, avec \(P = 1\,200\) W. Le correcteur proportionnel laisse un écart de 3 °C (un correcteur à action intégrale l'annule : « Performances »). Une baisse de 5 °C dehors ne fait plus perdre que 1 °C dedans, contre 5 °C sans régulation, et la constante de temps tombe de 2,8 h à \(\tau/(1 + K_{BO}) = 2\,000\) s, soit 33 min.</li>
    </ol>
  </div>

<div class="course-section">
  <div class="sec-num">§8 · BLOCS EN SÉRIE ET EFFET DE CHARGE</div>
  <h2>Quand peut-on multiplier les fonctions de transfert ?</h2>
  <div class="intro">Mettre deux blocs en série suppose que le second ne modifie pas le fonctionnement du premier. C'est vrai pour un amplificateur suivi d'un moteur, pour un réservoir qui se déverse à l'air libre dans un autre ; c'est faux pour deux circuits électriques branchés l'un sur l'autre. L'interaction apparaît alors comme une boucle de plus dans le schéma-blocs.</div>
  <div class="prop-box">
    <strong>Effet de charge.</strong> Deux sous-systèmes de fonctions de transfert \(H_1\) et \(H_2\), établies chacune isolément, se mettent en série avec \(H = H_1\,H_2\) seulement si la sortie du premier ne dépend pas de ce que lui demande le second (source de tension idéale, sortie d'un montage suiveur, déversement à l'air libre). Sinon, il faut écrire les équations de l'ensemble.
  </div>

  <div class="method-box">
    <strong>Exemple — deux cellules RC en cascade</strong>
    <p>\(R = 10\ \text{k}\Omega\), \(C = 10\ \mu\text{F}\), donc \(RC = 0{,}10\) s. Une cellule seule, à vide, a pour fonction de transfert \(\dfrac{1}{1 + RCp}\).</p>
    <ol>
      <li>Équations (une par bloc ou sommateur) : \(I_1 = \dfrac{E - U_1}{R}\), \(U_1 = \dfrac{I_1 - I_2}{Cp}\), \(I_2 = \dfrac{U_1 - U_2}{R}\), \(U_2 = \dfrac{I_2}{Cp}\). Le schéma-blocs compte trois boucles entrelacées (figure ci-dessous).</li>
      <li>Fin de chaîne : la seconde cellule est un diviseur, \(U_2 = \dfrac{U_1}{1 + RCp}\), et elle tire le courant \(I_2 = Cp\,U_2 = \dfrac{Cp\,U_1}{1 + RCp}\).</li>
      <li>Nœud de la première cellule, multiplié par \(R\) : \(RCp\,U_1 = E - U_1 - \dfrac{RCp\,U_1}{1 + RCp}\), d'où \(U_1 = \dfrac{(1 + RCp)\,E}{(1 + RCp)^2 + RCp}\).</li>
      <li>Résultat : \(\dfrac{U_2}{E} = \dfrac{1}{(1 + RCp)^2 + RCp} = \dfrac{1}{1 + 3RC\,p + (RC)^2p^2}\). Le terme \(RCp\) ajouté au dénominateur traduit l'effet de charge : le produit naïf donnerait \(1 + 2RC\,p + (RC)^2p^2\).</li>
      <li>Conséquence : les pôles sont \(-3{,}8\) et \(-26{,}2\ \text{s}^{-1}\) (constantes de temps 0,26 s et 0,038 s) au lieu d'un pôle double \(-10\ \text{s}^{-1}\) ; le temps de réponse à 5 % passe de 0,47 s à 0,83 s.</li>
      <li>Remède : un montage suiveur à amplificateur linéaire intégré, placé entre les cellules, recopie \(u_1\) sans prélever de courant ; la fonction de transfert redevient le produit \(\dfrac{1}{(1 + RCp)^2}\).</li>
    </ol>
  </div>

<template class="pan-tpl" data-panneau="sb-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · SCHÉMA-BLOCS</div>
  <h2>Les réflexes du chapitre</h2>
  <div class="intro">Dix savoir-faire pour passer d'un système réel à son schéma-blocs, le réduire sans erreur de signe, et en tirer les fonctions de transfert en boucle ouverte, en boucle fermée et vis-à-vis d'une perturbation.</div>
  <div class="method-box"><strong>Méthode 1 — Construire un schéma-blocs à partir des équations</strong>
    <ol>
      <li>Passer chaque équation en Laplace (conditions initiales nulles).</li>
      <li>Écrire chacune sous la forme « une grandeur = fonction de transfert × (combinaison d'autres grandeurs) » : une combinaison devient un sommateur, un produit devient un bloc.</li>
      <li>Placer les blocs de l'entrée vers la sortie, puis tracer les retours (forces contre-électromotrices, frottements, mesures).</li>
      <li>Contrôler les unités à chaque sommateur et le signe de chaque entrée.</li>
    </ol>
    <p><em>Exemple éclair :</em> \(m\,x'' = F - c\,x' - k\,x\) avec \(m = 2\ \text{kg}\), \(c = 4\ \text{N·s/m}\), \(k = 50\ \text{N/m}\) : un sommateur \(F - c\,V - k\,X\), un bloc \(\dfrac{1}{mp}\) qui donne \(V\), un bloc \(\dfrac1p\) qui donne \(X\), deux retours \(c\) (depuis \(V\)) et \(k\) (depuis \(X\)). Réduction : \(\dfrac{X}{F} = \dfrac{1}{2p^2 + 4p + 50}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 2 — Réduire un schéma-blocs</strong>
    <ol>
      <li>Réduire d'abord les associations évidentes : séries, parallèles, puis les boucles les plus internes.</li>
      <li>Si deux boucles se chevauchent, appliquer la méthode 6 ; ou bien la méthode 7 (équations).</li>
      <li>Contrôler le gain statique obtenu (cas \(p = 0\)) par un raisonnement direct sur le schéma.</li>
    </ol>
    <p><em>Exemple éclair :</em> boucle interne \(\dfrac{10}{p}\) de retour 0,5 : \(\dfrac{10/p}{1 + 5/p} = \dfrac{10}{p + 5} = \dfrac{2}{1 + 0{,}2p}\) ; bouclée par un retour unitaire : \(\dfrac{2}{3 + 0{,}2p} = \dfrac{2/3}{1 + p/15}\). Contrôle à \(p = 0\) : la boucle interne a le gain \(1/0{,}5 = 2\), puis \(\dfrac{2}{1 + 2} = \dfrac23\).</p>
  </div>
  <div class="method-box"><strong>Méthode 3 — Calculer FTBO et FTBF</strong>
    <ol>
      <li>FTBO : produit de tous les blocs rencontrés en faisant le tour de la boucle (chaîne directe et chaîne de retour), sans le signe du comparateur.</li>
      <li>FTBF : \(\dfrac{\text{chaîne directe}}{1 + \text{FTBO}}\) pour un retour soustrait ; multiplier par le gain de l'adaptateur s'il est en amont du comparateur.</li>
      <li>Mettre le résultat sous forme canonique pour lire gain, ordre et constantes de temps.</li>
    </ol>
    <p><em>Exemple éclair :</em> chaîne directe \(A = \dfrac{10}{1 + p}\), retour \(B = 0{,}5\) : FTBO \(= \dfrac{5}{1 + p}\), FTBF \(= \dfrac{A}{1 + AB} = \dfrac{10}{p + 6} = \dfrac{5/3}{1 + p/6}\) ; gain statique \(\dfrac53\), un peu moins que \(1/B = 2\).</p>
  </div>
  <div class="method-box"><strong>Méthode 4 — Traiter une perturbation</strong>
    <ol>
      <li>Annuler la consigne et redessiner le schéma vu depuis la perturbation : la sortie devient le bout d'une chaîne directe partant de \(D\).</li>
      <li>\(H_D = \dfrac{\text{blocs entre } D \text{ et } S}{1 + \text{FTBO}}\) (signe moins si la perturbation est soustraite).</li>
      <li>Sortie totale : \(S = H_E\,E + H_D\,D\) par superposition.</li>
    </ol>
    <p><em>Exemple éclair :</em> correcteur \(C = 5\), \(G_1 = 2\), perturbation ajoutée avant \(G_2 = \dfrac{3}{1 + p}\), retour unitaire : \(H_D = \dfrac{G_2}{1 + C\,G_1G_2} = \dfrac{3}{p + 31}\). Statiquement, \(H_D(0) = \dfrac{3}{31} \approx 0{,}097\) : l'effet de \(D\) est divisé par \(1 + K_{BO} = 31\) par rapport à la boucle ouverte (gain 3).</p>
  </div>
  <div class="method-box"><strong>Méthode 5 — Se ramener à un retour unitaire</strong>
    <ol>
      <li>Vérifier que l'adaptateur a le même gain constant \(K_a\) que le capteur.</li>
      <li>Faire passer \(K_a\) du retour à la chaîne directe (juste après le comparateur) : la FTBO est inchangée et le retour devient unitaire.</li>
      <li>Utiliser alors \(H_{BF} = \dfrac{H_{BO}}{1 + H_{BO}}\) et l'erreur \(E - S = \dfrac{E}{1 + H_{BO}}\), dans l'unité de la consigne ; l'écart physique, en sortie du comparateur, vaut \(K_a\) fois plus.</li>
    </ol>
    <p><em>Exemple éclair :</em> capteur et adaptateur de 0,2 V/(m/s), correcteur 10, processus \(\dfrac{4}{1 + p}\) (m/s par V) : \(H_{BO} = \dfrac{8}{1 + p}\), \(H_{BF} = \dfrac{8}{9 + p}\). Consigne 1 m/s : erreur \(\dfrac{1}{9} \approx 0{,}11\) m/s, écart \(0{,}2 \times 0{,}11 \approx 0{,}022\) V.</p>
  </div>
  <div class="method-box"><strong>Méthode 6 — Séparer deux boucles entrelacées</strong>
    <ol>
      <li>Repérer les boucles qui partagent un bloc sans que l'une contienne l'autre.</li>
      <li>Déplacer un point de prélèvement (de l'amont vers l'aval d'un bloc \(H\) : ajouter \(1/H\) sur la branche ; de l'aval vers l'amont : ajouter \(H\)) ou un sommateur (de l'aval vers l'amont : \(1/H\) sur l'entrée déplacée ; de l'amont vers l'aval : \(H\)).</li>
      <li>Vérifier que chaque signal arrive inchangé, puis réduire les boucles devenues imbriquées, de l'intérieur vers l'extérieur.</li>
    </ol>
    <p><em>Exemple éclair :</em> boucles \(H_1\) (de \(X_2\), sortie de \(G_2\), vers l'entrée de \(G_1\)) et \(H_2\) (de \(S = G_3X_2\) vers l'entrée de \(G_2\)) ; en prélevant \(H_1\) sur \(S\), la branche devient \(H_1/G_3\), et \(\dfrac{S}{E} = \dfrac{G_1G_2G_3}{1 + G_2G_3H_2 + G_1G_2H_1}\) (cours, §3).</p>
  </div>
  <div class="method-box"><strong>Méthode 7 — Réduire par les équations des signaux intermédiaires</strong>
    <ol>
      <li>Nommer la sortie de chaque sommateur et de chaque bloc utile.</li>
      <li>Écrire une équation par sommateur (somme signée de ses entrées) et par bloc (sortie = fonction de transfert × entrée).</li>
      <li>Éliminer les signaux intermédiaires, de proche en proche, jusqu'à la relation entre \(S\) et \(E\) (et \(D\)).</li>
    </ol>
    <p><em>Exemple éclair :</em> retour <strong>ajouté</strong> : \(X = E + 0{,}25\,S\) et \(S = \dfrac{2}{1 + p}\,X\) donnent \(S\,\Big(1 - \dfrac{0{,}5}{1 + p}\Big) = \dfrac{2E}{1 + p}\), soit \(\dfrac{S}{E} = \dfrac{2}{0{,}5 + p} = \dfrac{4}{1 + 2p}\) : c'est \(\dfrac{A}{1 - AB}\).</p>
  </div>
  <div class="method-box"><strong>Méthode 8 — Identifier la structure d'un système asservi sur une description</strong>
    <ol>
      <li>Repérer la grandeur à commander (sortie) et ce qui la fixe (consigne) ; consigne constante : régulation, variable : poursuite.</li>
      <li>Trouver le capteur (chaîne de retour), puis, dans le calculateur, l'adaptateur, le comparateur et le correcteur.</li>
      <li>Suivre la chaîne de puissance : préactionneur (moduler), actionneur (convertir), transmetteur et processus ; repérer ce qui agit sans être commandé (perturbations).</li>
      <li>Tracer le schéma-blocs organique, en notant l'unité de chaque signal.</li>
    </ol>
    <p><em>Exemple éclair :</em> surpresseur d'eau à vitesse variable. Sortie : pression du réseau ; consigne 3 bar, constante (régulation) ; capteur de pression ; calculateur ; variateur de fréquence (moduler), moteur (convertir), pompe (transmettre, agir) ; perturbation : le débit tiré par les usagers.</p>
  </div>
  <div class="method-box"><strong>Méthode 9 — Vérifier un schéma-blocs</strong>
    <ol>
      <li>Unités : les entrées d'un même sommateur ont la même unité ; l'adaptateur convertit la consigne dans l'unité de la mesure.</li>
      <li>Signes : une force contre-électromotrice, un frottement, un couple résistant ou une mesure se retranchent.</li>
      <li>Cas statique : en faisant \(p = 0\), retrouver un résultat connu (équilibre, vitesse à vide, gain statique).</li>
    </ol>
    <p><em>Exemple éclair :</em> moteur à courant continu du cours : \(U - E\) (V − V) et \(C_m - C_r\) (N·m − N·m) ; à vide et sans frottement, \(p \to 0\) donne \(\Omega = U/k\), soit 120 rad/s sous 12 V pour \(k = 0{,}10\ \text{V·s/rad}\) : la f.c.é.m. équilibre alors exactement la tension.</p>
  </div>
  <div class="method-box"><strong>Méthode 10 — Exprimer l'écart en présence d'une perturbation</strong>
    <ol>
      <li>Retour unitaire, perturbation \(D\) ajoutée avant le bloc \(G_2\) (chaîne directe \(C\,G_1G_2\)) : \(S = \dfrac{H_{BO}\,E + G_2\,D}{1 + H_{BO}}\).</li>
      <li>D'où l'erreur \(E - S = \dfrac{E - G_2\,D}{1 + H_{BO}}\) : un terme dû à la consigne, un terme dû à la perturbation, même dénominateur.</li>
      <li>Valeur finale par le théorème du même nom, la boucle fermée étant stable.</li>
    </ol>
    <p><em>Exemple éclair :</em> FTBO de classe 0 et de gain statique 9, \(G_2(0) = 3\), échelons \(E_0 = 1\) et \(D_0 = 1\) : erreur finale \(\dfrac{1 - 3}{10} = -0{,}2\), soit \(+0{,}1\) dû à la consigne et \(-0{,}3\) dû à la perturbation, qui pousse ici la sortie au-dessus de la consigne.</p>
  </div>
  <div class="notice"><strong>Pièges classiques</strong> : oublier un bloc du retour dans la FTBO ; appliquer \(H_{BO}/(1 + H_{BO})\) à un retour non unitaire ; se tromper de signe sur un sommateur (une force contre-électromotrice ou un couple résistant se soustrait) ; additionner des signaux d'unités différentes ; appliquer la formule de la boucle à des boucles entrelacées ; multiplier les fonctions de transfert de deux sous-systèmes qui se chargent l'un l'autre (cours, §8).</div>
</div>

<div class="exo-wrapper">
<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Blocs en série et en parallèle</h3>
  <div class="statement">\(H_1(p) = \dfrac{2}{1 + p}\), \(H_2(p) = \dfrac{3}{1 + 2p}\), \(H_3(p) = 5\).</div>
  <div class="q"><strong>Q1.</strong> Calculer \(H_1 H_2\) (blocs en série).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(H_1 + H_3\) (blocs en parallèle, sorties ajoutées).</div>
  <div class="q"><strong>Q3.</strong> Calculer la fonction de transfert en boucle fermée à retour unitaire de chaîne directe \(H_1 H_2\), et son gain statique.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H_1H_2 = \dfrac{6}{(1 + p)(1 + 2p)} = \dfrac{6}{1 + 3p + 2p^2}\).</p>
    <p><strong>Q2.</strong></p>
    <div class="formula">$$H_1 + H_3 = \frac{2}{1 + p} + 5 = \frac{2 + 5\,(1 + p)}{1 + p} = \frac{7 + 5p}{1 + p}.$$</div>
    <p><strong>Q3.</strong></p>
    <div class="formula">$$H_{BF} = \frac{H_1H_2}{1 + H_1H_2} = \frac{6}{(1 + p)(1 + 2p) + 6} = \frac{6}{7 + 3p + 2p^2},$$</div>
    <p>de gain statique \(\dfrac67 \approx 0{,}86\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Retour non unitaire et rôle de l'adaptateur</h3>
  <div class="statement">Processus \(H_p(p) = \dfrac{4}{1 + 2p}\), correcteur proportionnel \(C(p) = K\), capteur de gain \(B = 0{,}5\) dans la chaîne de retour ; la consigne \(E\) arrive directement sur le comparateur.</div>
  <div class="q"><strong>Q1.</strong> Écrire \(H_{BO}(p)\) et \(H_{BF}(p)\).</div>
  <div class="q"><strong>Q2.</strong> Calculer le gain statique de \(H_{BF}\). Que devient-il quand \(K \to +\infty\) ?</div>
  <div class="q"><strong>Q3.</strong> Pour \(K = 5\) et un échelon de consigne \(E = 1\), calculer la sortie finale et l'écart final \(\varepsilon_\infty\) en sortie du comparateur. La sortie rejoint-elle la consigne ?</div>
  <div class="q"><strong>Q4.</strong> On place en amont du comparateur un adaptateur de gain 0,5, égal à celui du capteur. Reprendre Q3.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(H_{BO} = C\,H_p\,B = \dfrac{2K}{1 + 2p}\) ; \(H_{BF} = \dfrac{C\,H_p}{1 + H_{BO}} = \dfrac{4K}{1 + 2K + 2p}\).</p>
    <p><strong>Q2.</strong> \(H_{BF}(0) = \dfrac{4K}{1 + 2K}\), qui tend vers \(2 = 1/B\) quand \(K \to +\infty\) : une boucle de grand gain impose \(B\,S \approx E\).</p>
    <p><strong>Q3.</strong> \(s_\infty = \dfrac{20}{11} \approx 1{,}82\). L'écart en sortie du comparateur vaut \(\varepsilon_\infty = E - B\,s_\infty\), soit \(1 - 0{,}5 \times 1{,}82 = \dfrac{1}{11} \approx 0{,}091\). La sortie ne rejoint pas la consigne (1,82 au lieu de 1) : sans adaptateur, la boucle compare \(E\) à \(B\,S\) et tend à rendre \(S\) égale à \(E/B\), pas à \(E\).</p>
    <p><strong>Q4.</strong> \(H_{BF} = \dfrac{0{,}5 \times 4K}{1 + 2K + 2p} = \dfrac{10}{11 + 2p}\) pour \(K = 5\) : \(s_\infty = \dfrac{10}{11} \approx 0{,}91\). L'erreur \(E - s_\infty = \dfrac{1}{11} \approx 0{,}091\) est maintenant dans l'unité de la consigne, et l'écart vaut \(0{,}5 \times 0{,}091 \approx 0{,}045\). La sortie suit la consigne, à l'écart statique d'un correcteur proportionnel près : c'est le retour unitaire équivalent, de FTBO \(\dfrac{10}{1 + 2p}\).</p>

  <h3>Schéma-blocs d'un moteur à courant continu</h3>
  <div class="statement">Moteur à courant continu, entrée : tension \(u\), sortie : vitesse \(\omega\). Équations : \(u = R\,i + L\,\dfrac{di}{dt} + K_e\,\omega\) et \(J\,\dfrac{d\omega}{dt} = K_i\,i - f\,\omega\) (sans couple résistant ; dans le système international, \(K_e = K_i = k\)).</div>
  <div class="q"><strong>Q1.</strong> Passer en Laplace (conditions initiales nulles).</div>
  <div class="q"><strong>Q2.</strong> Identifier les deux blocs et dessiner le schéma-blocs avec la boucle de la force contre-électromotrice.</div>
  <div class="q"><strong>Q3.</strong> Calculer la fonction de transfert \(\Omega(p)/U(p)\). Quel est son ordre ?</div>
  <div class="q"><strong>Q4.</strong> Que devient-elle si l'on néglige \(L\) et \(f\) ? Identifier gain et constante de temps.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(U(p) = (R + Lp)\,I(p) + K_e\,\Omega(p)\) et \((Jp + f)\,\Omega(p) = K_i\,I(p)\).</p>
    <p><strong>Q2.</strong> Bloc électrique : \(I = \dfrac{U - K_e\,\Omega}{R + Lp}\) ; bloc mécanique : \(\Omega = \dfrac{K_i\,I}{Jp + f}\). Schéma : \(U\) → sommateur (\(+U\), \(-K_e\Omega\)) → \(\dfrac{1}{R + Lp}\) → \(I\) → \(\dfrac{K_i}{Jp + f}\) → \(\Omega\), avec un retour de \(\Omega\) par le bloc \(K_e\) vers le sommateur.</p>
    <p><strong>Q3.</strong> Formule de la boucle, chaîne directe \(\dfrac{K_i}{(R + Lp)(Jp + f)}\), retour \(K_e\) :</p>
    <div class="formula">$$\frac{\Omega}{U} = \frac{K_i}{(R + Lp)(Jp + f) + K_iK_e}.$$</div>
    <p>Le dénominateur est de degré 2 si \(L \neq 0\) : deuxième ordre.</p>
    <p><strong>Q4.</strong> \(\dfrac{\Omega}{U} = \dfrac{K_i}{RJp + K_iK_e} = \dfrac{1/K_e}{1 + \dfrac{RJ}{K_iK_e}\,p}\) : premier ordre de gain \(1/K_e\) et de constante de temps mécanique \(\tau_m = \dfrac{RJ}{K_iK_e} = \dfrac{RJ}{k^2}\).</p>
  </div>

  <h3>Structure et unités d'un asservissement de position d'antenne</h3>
  <div class="statement">Une antenne de poursuite de satellites est orientée en azimut par un moteur à courant continu, à travers un réducteur de rapport \(r = 1/100\). Un codeur monté sur l'arbre moteur délivre 2 000 points par tour moteur. Le calculateur reçoit la consigne d'azimut \(\theta_c\) (en rad), la convertit en points, forme l'écart \(\varepsilon\) (en points), et le correcteur proportionnel délivre la tension \(u = K_c\,\varepsilon\) avec \(K_c = 2{,}0\times 10^{-3}\) V/point. Variateur et moteur : \(\dfrac{\Omega_m}{U} = \dfrac{K_m}{1 + \tau_m p}\), \(K_m = 20\ \text{rad·s}^{-1}/\text{V}\), \(\tau_m = 0{,}050\) s.</div>
  <div class="q"><strong>Q1.</strong> Associer chaque constituant à une fonction de la chaîne d'information ou de la chaîne de puissance, puis dessiner le schéma-blocs organique en notant l'unité de chaque signal.</div>
  <div class="q"><strong>Q2.</strong> Le codeur compte l'angle du moteur \(\theta_m = \theta/r\). Exprimer le gain \(K_{cap}\) qui relie l'angle \(\theta\) de l'antenne au nombre de points. Quel gain donner à l'adaptateur ? Quelle est la résolution de la mesure sur l'antenne, en degrés ?</div>
  <div class="q"><strong>Q3.</strong> Établir la FTBO ; donner sa classe et son gain, avec son unité.</div>
  <div class="q"><strong>Q4.</strong> L'antenne suit un satellite qui défile à \(0{,}10\ \text{rad/s}\) (consigne en rampe). On admet que l'écart de traînage d'une boucle à retour unitaire de classe 1 vaut \(a/K_{BO}\) (chapitre « Performances »). De quel angle l'antenne est-elle en retard ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Codeur : acquérir ; calculateur (adaptateur, comparateur, correcteur) : traiter ; variateur : moduler ; moteur : convertir ; réducteur : transmettre ; antenne : agir. Schéma : \(\theta_c\) (rad) → adaptateur \(K_a\) → points → comparateur → \(\varepsilon\) (points) → \(K_c\) → \(u\) (V) → \(\dfrac{K_m}{1 + \tau_m p}\) → \(\omega_m\) (rad/s) → \(r\) → \(\omega\) (rad/s) → \(\dfrac1p\) → \(\theta\) (rad) ; retour : \(\theta\) → \(K_{cap}\) → points.</p>
    <p><strong>Q2.</strong> Nombre de points \(= \dfrac{2000}{2\pi}\,\theta_m = \dfrac{2000}{2\pi\,r}\,\theta\), donc \(K_{cap} = \dfrac{2\times 10^{5}}{2\pi} \approx 3{,}18\times 10^{4}\) points/rad. L'adaptateur doit avoir le même gain, \(K_a = K_{cap}\), pour qu'un écart nul corresponde à \(\theta = \theta_c\). Un point vaut \(\dfrac{360°}{2\times 10^{5}} = 0{,}0018°\) d'antenne : placé côté moteur, le codeur gagne le rapport de réduction (100) en résolution.</p>
    <p><strong>Q3.</strong></p>
    <div class="formula">$$H_{BO}(p) = \frac{K_c\,K_m\,r\,K_{cap}}{p\,(1 + \tau_m p)} \approx \frac{12{,}7}{p\,(1 + 0{,}05p)},$$</div>
    <p>car \(K_c\,K_m\,r\,K_{cap}\) vaut \(2{,}0\times 10^{-3} \times 20 \times 0{,}01 \times 3{,}18\times 10^{4}\), soit environ 12,7. Classe 1 (intégration de la vitesse de l'antenne) ; \(K_{BO} \approx 12{,}7\ \text{s}^{-1}\) : la boucle compare des points à des points, et l'intégrateur apporte l'unité \(\text{s}^{-1}\).</p>
    <p><strong>Q4.</strong> \(\varepsilon_v = \dfrac{0{,}10}{12{,}7} \approx 7{,}9\times 10^{-3}\) rad, soit 0,45° de retard permanent sur le satellite. Pour le réduire, il faut augmenter \(K_{BO}\) (au prix de la stabilité) ou passer en classe 2.</p>
  </div>
</div>

<figcaption>Schéma de l'exercice : la boucle de \(H_1\) (de \(X_2\) au premier comparateur) et celle de \(H_2\) (de \(S\) au second) se chevauchent sur \(G_2\).</figcaption>
</figure></div>
  <div class="q"><strong>Q1.</strong> Pourquoi la formule de la boucle ne s'applique-t-elle directement à aucune des deux boucles ?</div>
  <div class="q"><strong>Q2.</strong> Écrire les équations des signaux \(X_1\) (sortie de \(G_1\)), \(X_2\) et \(S\), puis en déduire \(S/E\) littéralement.</div>
  <div class="q"><strong>Q3.</strong> Retrouver ce résultat en déplaçant le second comparateur en amont de \(G_1\).</div>
  <div class="q"><strong>Q4.</strong> Application numérique : forme canonique, gain statique, pôles. Contrôler le gain statique par un raisonnement direct.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Les deux boucles ont en commun le bloc \(G_2\) sans que l'une contienne l'autre : elles sont entrelacées.</p>
    <p><strong>Q2.</strong> \(X_1 = G_1\,(E - H_1X_2)\), \(X_2 = G_2\,(X_1 - H_2S)\), \(S = G_3X_2\). En reportant : \(X_2 = G_2\,\big(G_1E - G_1H_1X_2 - H_2G_3X_2\big)\), donc \(X_2\,(1 + G_1G_2H_1 + G_2G_3H_2) = G_1G_2\,E\) et</p>
    <div class="formula">$$\frac{S}{E} = \frac{G_1G_2G_3}{1 + G_1G_2H_1 + G_2G_3H_2}.$$</div>
    <p><strong>Q3.</strong> Le second comparateur passe de l'aval à l'amont de \(G_1\) : son entrée \(H_2S\) doit être divisée par \(G_1\). Les deux retours arrivent alors au même comparateur ; exprimés depuis \(X_2\) (avec \(S = G_3X_2\)), ils forment un retour unique \(H_1 + \dfrac{H_2G_3}{G_1}\), et la boucle de chaîne directe \(G_1G_2\) donne \(\dfrac{X_2}{E} = \dfrac{G_1G_2}{1 + G_1G_2H_1 + G_2G_3H_2}\). On multiplie par \(G_3\) : même résultat.</p>
    <p><strong>Q4.</strong> \(G_1G_2G_3 = \dfrac{10}{p\,(1 + p)}\) et \(1 + G_1G_2H_1 + G_2G_3H_2 = \dfrac{p^2 + 3p + 2}{p\,(1 + p)}\), d'où \(\dfrac{S}{E} = \dfrac{10}{(p + 1)(p + 2)} = \dfrac{5}{(1 + p)(1 + 0{,}5p)}\) : gain statique 5, pôles \(-1\) et \(-2\). Contrôle direct : en régime permanent, l'intégrateur \(G_3\) impose \(X_2 = 0\) ; alors \(X_1 = G_1E\) et \(X_1 = H_2S\), donc \(S = \dfrac{G_1}{H_2}\,E = 5E\).</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Deux réservoirs en cascade, avec et sans interaction</h3>
  <div class="statement">Le réservoir 1 (section \(S_1 = 0{,}50\ \text{m}^2\)) reçoit le débit \(q\) et se déverse à l'air libre dans le réservoir 2 (section \(S_2 = 1{,}0\ \text{m}^2\)) par un orifice de débit \(q_{12} = h_1/R_1\) (\(R_1 = 200\ \text{s/m}^2\), modèle linéarisé). Le réservoir 2 se vide par \(q_2 = h_2/R_2\) (\(R_2 = 100\ \text{s/m}^2\)) ; les usagers y tirent en plus le débit \(q_p\), perturbation. Niveaux et débits sont comptés à partir d'un état d'équilibre, système au repos à \(t = 0\).</div>
  <div class="q"><strong>Q1.</strong> Écrire les deux bilans de volume, puis leurs transformées de Laplace.</div>
  <div class="q"><strong>Q2.</strong> Dessiner le schéma-blocs d'entrées \(Q\) et \(Q_p\), de sortie \(H_2\).</div>
  <div class="q"><strong>Q3.</strong> Calculer \(H_2/Q\) et \(H_2/Q_p\). Pourquoi peut-on ici multiplier les fonctions de transfert des deux réservoirs ?</div>
  <div class="q"><strong>Q4.</strong> On relie maintenant les réservoirs par le fond : \(q_{12} = (h_1 - h_2)/R_1\). Montrer que le schéma-blocs gagne une boucle, puis calculer \(H_2/Q\) et ses constantes de temps.</div>
  <div class="q"><strong>Q5.</strong> Pour un échelon \(q = 0{,}010\ \text{m}^3/\text{s}\), donner les niveaux finaux \(h_1\) et \(h_2\) dans les deux montages.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(S_1\,h_1' = q - \dfrac{h_1}{R_1}\) et \(S_2\,h_2' = \dfrac{h_1}{R_1} - \dfrac{h_2}{R_2} - q_p\). Laplace : \(H_1 = \dfrac{R_1\,Q}{1 + \tau_1 p}\), donc \(Q_{12} = \dfrac{H_1}{R_1} = \dfrac{Q}{1 + \tau_1 p}\), puis \(H_2 = \dfrac{R_2\,(Q_{12} - Q_p)}{1 + \tau_2 p}\), avec \(\tau_1 = R_1S_1 = 100\) s et \(\tau_2 = R_2S_2 = 100\) s.</p>
    <p><strong>Q2.</strong> \(Q\) → \(\dfrac{1}{1 + \tau_1 p}\) → \(Q_{12}\) → sommateur (\(+Q_{12}\), \(-Q_p\)) → \(\dfrac{R_2}{1 + \tau_2 p}\) → \(H_2\). Aucun retour.</p>
    <p><strong>Q3.</strong> \(\dfrac{H_2}{Q} = \dfrac{R_2}{(1 + \tau_1 p)(1 + \tau_2 p)} = \dfrac{100}{(1 + 100\,p)^2}\) (en s/m²) et \(\dfrac{H_2}{Q_p} = -\dfrac{100}{1 + 100\,p}\). Le débit \(q_{12}\) ne dépend que de \(h_1\) : le second réservoir n'agit pas sur le premier, il n'y a pas d'effet de charge, et les blocs se mettent en série.</p>
    <p><strong>Q4.</strong> \(S_1\,h_1' = q - \dfrac{h_1 - h_2}{R_1}\) : \(h_2\) intervient dans le bilan du premier réservoir, d'où un retour de \(H_2\) vers le premier sommateur. La résolution des deux équations donne</p>
    <div class="formula">$$\frac{H_2}{Q} = \frac{100}{1 + 250\,p + 10^{4}\,p^2} = \frac{100}{(1 + 50\,p)(1 + 200\,p)}.$$</div>
    <p>Même gain statique, mais des constantes de temps de 50 s et 200 s au lieu de deux fois 100 s : l'interaction écarte les pôles, et la constante de temps lente double.</p>
    <p><strong>Q5.</strong> En régime permanent, tout le débit sort par \(q_2\) : \(h_2 = R_2\,q = 1{,}0\) m dans les deux montages. Sans interaction, \(h_1 = R_1\,q = 2{,}0\) m ; reliés par le fond, \(h_1 = h_2 + R_1\,q = 3{,}0\) m.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Four à thermostat : un système séquentiel</h3>
  <div class="statement">Un four de capacité thermique \(C = 2{,}0\times 10^{4}\ \text{J/K}\) perd de la chaleur vers la pièce (20 °C) à travers une paroi de résistance thermique \(R_{th} = 0{,}10\ \text{K/W}\) : \(C\,\theta' = P - \dfrac{\theta - 20}{R_{th}}\). Sa résistance chauffante de 3,0 kW est commandée par un thermostat : marche quand \(\theta \leq 180\) °C, arrêt quand \(\theta \geq 190\) °C.</div>
  <div class="q"><strong>Q1.</strong> Ce système est-il asservi ou séquentiel ? Décrire ses états et ses transitions.</div>
  <div class="q"><strong>Q2.</strong> Vers quelle température le four tend-il en chauffe ? à l'arrêt ? Quelle est sa constante de temps ?</div>
  <div class="q"><strong>Q3.</strong> Calculer la durée de chauffe de 180 à 190 °C, celle du refroidissement de 190 à 180 °C, la période et la puissance moyenne.</div>
  <div class="q"><strong>Q4.</strong> Quelle puissance constante maintiendrait 185 °C ? Comparer et conclure.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Séquentiel : la chauffe est en tout ou rien, et bascule sur des événements (franchissement de 190 °C ou de 180 °C). Deux états, Chauffe et Arrêt ; transition Chauffe → Arrêt quand \(\theta \geq 190\) °C, Arrêt → Chauffe quand \(\theta \leq 180\) °C. On le décrit par un diagramme d'états et un chronogramme.</p>
    <p><strong>Q2.</strong> En chauffe, la température d'équilibre vérifie \(P = (\theta - 20)/R_{th}\) : \(\theta_\infty = 20 + 0{,}10 \times 3\,000 = 320\) °C. À l'arrêt, 20 °C. Constante de temps \(\tau = R_{th}C = 2\,000\) s dans les deux phases.</p>
    <p><strong>Q3.</strong> Chaque phase est un premier ordre : \(t = \tau\ln\dfrac{\theta_0 - \theta_\infty}{\theta_1 - \theta_\infty}\). Chauffe : \(t_{\text{on}} = 2\,000\,\ln\dfrac{140}{130} \approx 148\) s ; refroidissement : \(t_{\text{off}} = 2\,000\,\ln\dfrac{170}{160} \approx 121\) s. Période \(\approx 269\) s (4,5 min) ; puissance moyenne \(3\,000 \times \dfrac{148}{269} \approx 1\,650\) W.</p>
    <p><strong>Q4.</strong> \(P = \dfrac{185 - 20}{R_{th}} = 1\,650\) W : c'est la puissance moyenne du thermostat. Le thermostat obtient le même bilan d'énergie, mais la température oscille de ± 5 °C avec une période de 4,5 min ; un asservissement qui module la puissance (gradateur) la tiendrait à 185 °C.</p>
  </div>
</div>
<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Effet de charge : un filtre RC branché sur une résistance</h3>
  <div class="statement">Une cellule RC (\(R = 10\ \text{k}\Omega\) en série, \(C = 100\ \text{nF}\) en sortie) alimente une résistance d'utilisation \(R_u = 10\ \text{k}\Omega\) branchée aux bornes de \(C\). Entrée : tension \(e\) ; sortie : tension \(u\) aux bornes de \(C\).</div>
  <div class="q"><strong>Q1.</strong> Fonction de transfert à vide (sans \(R_u\)) : gain et constante de temps.</div>
  <div class="q"><strong>Q2.</strong> Avec \(R_u\), écrire les équations (courant \(i\) dans \(R\), courant \(i_u\) dans \(R_u\)) et le schéma-blocs. Quelle boucle traduit l'effet de charge ?</div>
  <div class="q"><strong>Q3.</strong> Calculer \(U/E\) avec \(R_u\) ; gain statique et constante de temps. Comparer.</div>
  <div class="q"><strong>Q4.</strong> On intercale un montage suiveur (courant d'entrée nul, sortie qui recopie la tension d'entrée) entre la cellule et \(R_u\). Que devient la fonction de transfert de \(e\) à la tension aux bornes de \(R_u\) ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\dfrac{U}{E} = \dfrac{1}{1 + RCp}\) : gain 1, constante de temps \(RC = 10^{4} \times 10^{-7} = 1{,}0\) ms.</p>
    <p><strong>Q2.</strong> \(I = \dfrac{E - U}{R}\), \(U = \dfrac{I - I_u}{Cp}\), \(I_u = \dfrac{U}{R_u}\). Schéma : \(E\) → sommateur (\(+E\), \(-U\)) → \(\dfrac1R\) → \(I\) → sommateur (\(+I\), \(-I_u\)) → \(\dfrac{1}{Cp}\) → \(U\), avec deux retours depuis \(U\) : l'un, direct, vers le premier sommateur ; l'autre par \(\dfrac{1}{R_u}\) vers le second. Ce second retour, le courant prélevé par \(R_u\), est l'effet de charge.</p>
    <p><strong>Q3.</strong> Boucle intérieure : \(\dfrac{1/(Cp)}{1 + 1/(R_uCp)} = \dfrac{R_u}{1 + R_uCp}\) ; puis chaîne directe \(\dfrac{1}{R}\cdot\dfrac{R_u}{1 + R_uCp}\) et retour unitaire :</p>
    <div class="formula">$$\frac{U}{E} = \frac{R_u}{R + R_u + R R_u C\,p} = \frac{\dfrac{R_u}{R + R_u}}{1 + \dfrac{R\,R_u}{R + R_u}\,C\,p}.$$</div>
    <p>Gain \(\dfrac{R_u}{R + R_u} = 0{,}5\) et constante de temps \(\dfrac{R R_u}{R + R_u}\,C = 5\ \text{k}\Omega \times 100\ \text{nF} = 0{,}50\) ms : la charge divise par deux le gain et la constante de temps. On ne peut pas représenter l'ensemble par le bloc « cellule à vide » suivi d'un bloc « résistance ».</p>
    <p><strong>Q4.</strong> Le suiveur ne prélève aucun courant sur la cellule, qui fonctionne à vide, et impose \(u\) aux bornes de \(R_u\) : \(\dfrac{1}{1 + RCp}\), gain 1 et 1,0 ms. Les blocs « cellule » et « suiveur » (gain 1) se mettent alors en série.</p>
  </div>
</div>
<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Asservissement de vitesse d'un treuil de levage</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format des épreuves de Sciences industrielles PT (thème <em>systèmes asservis et schéma-blocs</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Le treuil d'un pont roulant soulève une charge de masse \(m = 500\ \text{kg}\). Un moteur à courant continu entraîne, à travers un réducteur de rapport \(r = 1/20\), un tambour de rayon \(R_t = 0{,}10\ \text{m}\) sur lequel s'enroule le câble. Le calculateur reçoit une consigne de vitesse de montée \(v_c\) (en m/s) ; une génératrice tachymétrique montée sur l'arbre moteur mesure sa vitesse \(\omega_m\). On néglige l'inductance de l'induit, les frottements et les pertes du réducteur ; \(g = 9{,}81\ \text{m/s}^2\).
    Moteur : \(R = 0{,}50\ \Omega\), \(k = 0{,}80\ \text{V·s/rad}\) (ou N·m/A), inertie de l'ensemble ramenée sur l'arbre moteur \(J = 0{,}080\ \text{kg·m}^2\). Génératrice : \(K_t = 0{,}020\ \text{V}/(\text{rad/s})\). Variateur (hacheur) de gain \(K_v = 24\) ; correcteur proportionnel \(K_c = 30\).
  </div>
  <p class="exo-part">Partie A — Structure du système</p>
  <div class="q"><strong>A1.</strong> Identifier la consigne, la sortie, la perturbation, le capteur, le préactionneur, l'actionneur et le processus. Poursuite ou régulation ?</div>
  <div class="q"><strong>A2.</strong> Montrer que la vitesse du câble vaut \(v = R_t\,r\,\omega_m\) et que la charge exerce sur l'arbre moteur un couple résistant \(C_r = m\,g\,R_t\,r\). Valeurs numériques.</div>
  <p class="exo-part">Partie B — Modèle du moteur et de sa charge</p>
  <div class="q"><strong>B1.</strong> Écrire les équations du moteur (électrique, couplage, mécanique) et en déduire \(\Omega_m(p) = H_U(p)\,U(p) - H_C(p)\,C_r(p)\) sous forme canonique. Valeurs de la constante de temps \(\tau_m\) et des deux gains.</div>
  <div class="q"><strong>B2.</strong> En boucle ouverte, sous \(U = 200\) V : vitesse de montée à vide, puis avec la charge. Conclure.</div>
  <p class="exo-part">Partie C — Asservissement de vitesse</p>
  <div class="q"><strong>C1.</strong> Dessiner le schéma-blocs complet (adaptateur \(K_a\), comparateur, correcteur, variateur, moteur, génératrice, perturbation \(C_r\), sortie \(v\)). Quelle valeur de \(K_a\), en V/(m/s), assure un écart nul quand \(v = v_c\) ?</div>
  <div class="q"><strong>C2.</strong> Calculer la FTBO, puis \(V(p)/V_c(p)\) et \(\Omega_m(p)/C_r(p)\) sous forme canonique.</div>
  <div class="q"><strong>C3.</strong> Consigne \(v_c = 1{,}25\) m/s : vitesse finale à vide, puis en charge ; constante de temps en boucle fermée. Comparer à la boucle ouverte.</div>
  <p class="exo-part">Partie D — Limites du modèle</p>
  <div class="q"><strong>D1.</strong> Calculer la tension \(u(0^+)\) demandée au variateur au démarrage (échelon de consigne de 1,25 m/s, moteur à l'arrêt). Le variateur est alimenté sous 240 V : commenter.</div>
  <div class="q"><strong>D2.</strong> Par erreur, l'adaptateur est réglé à 3,8 V/(m/s). Quelle est la vitesse finale à vide ? Conclure sur le rôle de l'adaptateur.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> Consigne : la vitesse de montée \(v_c\) ; sortie : la vitesse \(v\) de la charge ; perturbation : le poids de la charge, qui impose un couple résistant ; capteur : la génératrice tachymétrique (acquérir) ; préactionneur : le variateur (moduler) ; actionneur : le moteur (convertir) ; processus : réducteur, tambour et charge (transmettre, agir). La consigne varie (accélération, montée, arrêt, descente) : poursuite ; à vitesse constante et charge variable, la boucle travaille en régulation.</p>
    <p><strong>A2.</strong> Le tambour tourne à \(r\,\omega_m\) et le câble s'enroule à \(v = R_t\,r\,\omega_m = 0{,}005\,\omega_m\). Sans pertes, la puissance se conserve : \(C_r\,\omega_m = m\,g\,v\), donc \(C_r = m\,g\,R_t\,r\), soit \(500 \times 9{,}81 \times 0{,}10/20 \approx 24{,}5\ \text{N·m}\) (l'inertie de la charge est comptée dans \(J\)).</p>
    <p><strong>B1.</strong> \(u = R\,i + e\), \(e = k\,\omega_m\), \(c_m = k\,i\), \(J\,\omega_m' = c_m - C_r\). En Laplace : \(Jp\,\Omega_m = \dfrac{k\,(U - k\,\Omega_m)}{R} - C_r\), d'où</p>
    <div class="formula">$$\Omega_m = \frac{1/k}{1 + \tau_m p}\,U - \frac{R/k^2}{1 + \tau_m p}\,C_r,\qquad \tau_m = \frac{RJ}{k^2}.$$</div>
    <p>\(\tau_m = \dfrac{0{,}50 \times 0{,}080}{0{,}64} = 0{,}0625\) s ; gain en tension \(1/k = 1{,}25\ \text{rad·s}^{-1}/\text{V}\) ; gain en couple \(R/k^2 \approx 0{,}78\ \text{rad·s}^{-1}/(\text{N·m})\).</p>
    <p><strong>B2.</strong> À vide : \(\omega_m = 1{,}25 \times 200 = 250\) rad/s, \(v = 1{,}25\) m/s. En charge : \(\omega_m = 250 - 0{,}78 \times 24{,}5 \approx 231\) rad/s, \(v \approx 1{,}15\) m/s : la vitesse baisse de 7,7 % (le moteur tire alors \(i = C_r/k \approx 31\) A). En boucle ouverte, la vitesse dépend de la charge levée.</p>
    <p><strong>C1.</strong> \(V_c\) → \(K_a\) → comparateur → \(K_c\) → \(K_v\) → \(U\) → \(H_U\) → sommateur (\(-H_C\,C_r\)) → \(\Omega_m\) → \(R_t\,r\) → \(V\), avec le retour \(\Omega_m\) → \(K_t\) → comparateur. La mesure vaut \(K_t\,\omega_m = \dfrac{K_t}{R_t\,r}\,v\) ; pour qu'un écart nul corresponde à \(v = v_c\), il faut \(K_a = \dfrac{K_t}{R_t\,r} = \dfrac{0{,}020}{0{,}005} = 4{,}0\ \text{V}/(\text{m/s})\).</p>
    <p><strong>C2.</strong> FTBO :</p>
    <div class="formula">$$H_{BO} = K_c\,K_v\,\frac{1/k}{1 + \tau_m p}\,K_t = \frac{30 \times 24 \times 1{,}25 \times 0{,}020}{1 + 0{,}0625\,p} = \frac{18}{1 + 0{,}0625\,p}.$$</div>
    <p>L'adaptateur étant bien réglé, la boucle équivaut à un retour unitaire sur \(v\) :</p>
    <div class="formula">$$\frac{V}{V_c} = \frac{H_{BO}}{1 + H_{BO}} = \frac{18}{19 + 0{,}0625\,p} = \frac{0{,}947}{1 + 3{,}3\times 10^{-3}\,p},$$</div>
    <div class="formula">$$\frac{\Omega_m}{C_r} = -\frac{R/k^2}{(1 + \tau_m p)(1 + H_{BO})} = -\frac{R/k^2}{19 + 0{,}0625\,p} = -\frac{0{,}041}{1 + 3{,}3\times 10^{-3}\,p}.$$</div>
    <p><strong>C3.</strong> À vide : \(v = 0{,}947 \times 1{,}25 \approx 1{,}184\) m/s. La charge abaisse \(\omega_m\) de \(0{,}041 \times 24{,}5 \approx 1{,}0\) rad/s, soit \(v\) de 5 mm/s : \(v \approx 1{,}179\) m/s, contre une baisse de 96 mm/s en boucle ouverte (divisée par \(1 + 18 = 19\)). Constante de temps : \(0{,}0625/19 \approx 3{,}3\) ms, au lieu de 62,5 ms. Reste un écart statique de 0,066 m/s (5 %), propre au correcteur proportionnel ; un correcteur à action intégrale l'annulerait (2ᵉ année).</p>
    <p><strong>D1.</strong> Au démarrage, \(\omega_m = 0\) : écart \(K_a\,v_c = 4{,}0 \times 1{,}25 = 5{,}0\) V, et \(u(0^+) = K_v\,K_c \times 5{,}0 = 3\,600\) V, quinze fois la tension disponible : le variateur sature à 240 V, le démarrage est plus lent que prévu et le modèle linéaire n'est plus valable. Il demanderait aussi un courant de \(3\,600/0{,}50 = 7\,200\) A : en pratique, une boucle interne limite le courant (boucles imbriquées, 2ᵉ année).</p>
    <p><strong>D2.</strong> Le retour n'est plus équivalent à un retour unitaire ; le gain statique de la boucle fermée vaut</p>
    <div class="formula">$$\frac{V}{V_c}(0) = \frac{K_a\,K_c\,K_v\,(1/k)\,R_t\,r}{1 + H_{BO}(0)} = \frac{3{,}8 \times 30 \times 24 \times 1{,}25 \times 0{,}005}{19} = 0{,}90,$$</div>
    <p>d'où \(v = 1{,}125\) m/s au lieu de 1,184 m/s. Un écart nul ne correspond plus à \(v = v_c\) : l'adaptateur doit reproduire exactement le gain de la chaîne de mesure, sinon l'erreur qu'il introduit s'ajoute à celle du correcteur.</p>
