<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Limites simples</h3>
  <div class="statement">Calculer les limites suivantes (justifier brièvement).</div>
  <div class="q"><strong>Q1.</strong> \(u_n = \dfrac{3n^2 + 2n - 1}{n^2 - 5}\)</div>
  <div class="q"><strong>Q2.</strong> \(v_n = \sqrt{n^2 + 3n} - n\)</div>
  <div class="q"><strong>Q3.</strong> \(w_n = \dfrac{n^3 + (\ln n)^4}{2^n}\)</div>
  <div class="q"><strong>Q4.</strong> \(x_n = \dfrac{n!}{n^n}\) (montrer que \(0 \lt x_n \le \frac1n\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Factoriser par \(n^2\) : \(u_n = \dfrac{3 + 2/n - 1/n^2}{1 - 5/n^2} \to 3/1 = 3\).</p>
    <p><strong>Q2.</strong> Multiplier par la quantité conjuguée : $$v_n = \dfrac{n^2+3n - n^2}{\sqrt{n^2+3n}+n} = \dfrac{3n}{\sqrt{n^2+3n}+n} .$$ Factoriser \(n\) au dénominateur : \(= \dfrac{3}{\sqrt{1+3/n}+1} \to \dfrac{3}{1+1} = \boxed{3/2}\).</p>
    <p><strong>Q3.</strong> Croissances comparées : \(n^3 \ll 2^n\) et \((\ln n)^4 \ll 2^n\). Donc \(w_n \to 0\).</p>
    <p><strong>Q4.</strong> On écrit $$x_n = \dfrac{1 \times 2 \times \cdots \times n}{n \times n \times \cdots \times n} = \dfrac1n \times \dfrac2n \times \cdots \times \dfrac nn \ :$$ le premier facteur vaut \(\frac1n\), les \(n - 1\) autres sont compris entre 0 et 1. Donc \(0 \lt x_n \le \frac1n\), et \(x_n \to 0\) par encadrement. (On retrouve « \(n!\) est négligeable devant \(n^n\) ».)</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Suite arithmético-géométrique</h3>
  <div class="statement">Soit la suite définie par \(u_0 = 1\) et \(u_{n+1} = \dfrac{1}{2}\,u_n + 3\).</div>
  <div class="q"><strong>Q1.</strong> Trouver le point fixe.</div>
  <div class="q"><strong>Q2.</strong> Exprimer \(u_n\) en fonction de \(n\).</div>
  <div class="q"><strong>Q3.</strong> Étudier la convergence.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\ell = \dfrac{1}{2}\ell + 3\) donne \(\ell = 6\).</p>
    <p><strong>Q2.</strong> Poser \(v_n = u_n - 6\) : $$v_{n+1} = u_{n+1} - 6 = \dfrac{1}{2}u_n + 3 - 6 = \dfrac{1}{2}(u_n - 6) = \dfrac{1}{2}v_n .$$ Donc \(v_n = (1/2)^n\,v_0 = -5\cdot(1/2)^n\). D'où :
    $$u_n = 6 - 5\cdot(1/2)^n = 6 - \dfrac{5}{2^n}$$</p>
    <p><strong>Q3.</strong> Comme \(|1/2| < 1\), \((1/2)^n \to 0\), donc \(u_n \to 6\). La suite est croissante (chaque terme s'approche de 6 par en dessous) et majorée par 6.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Récurrence linéaire d'ordre 2 — Fibonacci</h3>
  <div class="statement">Soit \((F_n)\) définie par \(F_0 = 0\), \(F_1 = 1\) et \(F_{n+2} = F_{n+1} + F_n\).</div>
  <div class="q"><strong>Q1.</strong> Donner l'expression de \(F_n\) en fonction de \(n\) (formule de Binet).</div>
  <div class="q"><strong>Q2.</strong> Calculer \(\lim_{n\to+\infty} F_{n+1}/F_n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Équation caractéristique \(r^2 = r + 1\), soit \(r^2 - r - 1 = 0\), \(\Delta = 1 + 4 = 5\). Racines \(\varphi = (1+\sqrt{5})/2 \approx 1{,}618\) (nombre d'or), \(\varphi' = (1-\sqrt{5})/2 \approx -0{,}618\). Forme générale : \(F_n = A\varphi^n + B\varphi'^n\). Conditions : \(F_0 = A + B = 0\) → \(B = -A\). $$F_1 = A\varphi + B\varphi' = A(\varphi - \varphi') = A\sqrt{5} = 1$$ → \(A = 1/\sqrt{5}\). D'où :
    $$\boxed{F_n = \dfrac{\varphi^n - \varphi'^n}{\sqrt{5}}}$$</p>
    <p><strong>Q2.</strong> Comme \(|\varphi'| < 1\), \(\varphi'^n \to 0\). Donc \(F_n \sim \varphi^n/\sqrt{5}\) et \(F_{n+1}/F_n \to \varphi = \dfrac{1+\sqrt{5}}{2}\). Le rapport de deux termes consécutifs de Fibonacci converge vers le nombre d'or.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Suite récurrente définie par une fonction : selon la valeur de \(u_0\)</h3>
  <div class="statement">Soit \(f(x) = \sqrt{x + 2}\), définie sur \([-2, +\infty[\), et la suite définie par \(u_0 \ge -2\) et \(u_{n+1} = f(u_n)\).</div>
  <div class="q"><strong>Q1.</strong> Étudier les variations de \(f\), ses points fixes, et le signe de \(f(x) - x\) sur \([-2, +\infty[\).</div>
  <div class="q"><strong>Q2.</strong> On suppose \(u_0 = 2\). Que vaut \(u_n\) ?</div>
  <div class="q"><strong>Q3.</strong> On suppose \(-2 \le u_0 \lt 2\). Montrer que \([-2, 2]\) est stable par \(f\), que \((u_n)\) est croissante, et en déduire sa limite.</div>
  <div class="q"><strong>Q4.</strong> On suppose \(u_0 \gt 2\). Montrer que \((u_n)\) est décroissante et minorée par 2, et conclure. Contrôler avec \(u_0 = 7\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(f\) est continue et strictement croissante sur \([-2, +\infty[\) (composée de \(x \mapsto x + 2\) et de la racine carrée). Pour \(x \ge -2\) : \(f(x) = x\) si et seulement si \(x \ge 0\) et \(x + 2 = x^2\). Les racines de \(x^2 - x - 2 = (x - 2)(x + 1)\) sont 2 et \(-1\) ; seule \(2 \ge 0\) convient : l'unique point fixe est 2. Signe : pour \(x \in [-2, 0[\), \(f(x) \ge 0 \gt x\) ; pour \(x \ge 0\), $$f(x) \ge x \iff x + 2 \ge x^2 \iff (2 - x)(1 + x) \ge 0 \iff x \le 2 .$$ Donc \(f(x) - x \gt 0\) sur \([-2, 2[\), \(= 0\) en 2, \(\lt 0\) sur \(]2, +\infty[\).</p>
    <p><strong>Q2.</strong> \(f(2) = 2\) : par récurrence, \(u_n = 2\) pour tout \(n\) ; la suite est constante.</p>
    <p><strong>Q3.</strong> \(f\) croît, \(f(-2) = 0\) et \(f(2) = 2\), donc \(f([-2, 2]) = [0, 2] \subset [-2, 2]\) : l'intervalle est stable, et \(u_n \in [-2, 2]\) pour tout \(n\). Comme \(f(x) - x \ge 0\) sur cet intervalle, \(u_{n+1} - u_n = f(u_n) - u_n \ge 0\) : \((u_n)\) croît. Croissante et majorée par 2, elle converge vers \(\ell \in [-2, 2]\) ; \(f\) étant continue en \(\ell\), \(f(\ell) = \ell\), donc \(\ell = 2\). (Pour \(u_0 = 0\) : \(u_1 \approx 1{,}414\), \(u_2 \approx 1{,}848\), \(u_3 \approx 1{,}962\).)</p>
    <p><strong>Q4.</strong> \(]2, +\infty[\) est stable : si \(x \gt 2\), \(f(x) \gt f(2) = 2\). Sur cet intervalle \(f(x) - x \lt 0\), donc \((u_n)\) décroît, et elle est minorée par 2 : elle converge vers \(\ell \ge 2\) avec \(f(\ell) = \ell\), soit \(\ell = 2\). Avec \(u_0 = 7\) : \(u_1 = 3\), \(u_2 = \sqrt5 \approx 2{,}236\), \(u_3 \approx 2{,}058\) : la suite décroît vers 2.</p>
    <p><em>Bilan :</em> pour tout \(u_0 \ge -2\), \(u_n \to 2\) ; la construction en escalier (onglet Simulateur, fonction \(\sqrt{2 + x}\)) le montre.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Méthode de Héron — approximation de \(\sqrt{2}\)</h3>
  <div class="statement">Soit la suite \(u_0 = 2\) et \(u_{n+1} = \dfrac{1}{2}\left(u_n + \dfrac{2}{u_n}\right)\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que pour tout \(n\), \(u_n > 0\) et \(u_n^2 \geq 2\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \((u_n)\) est décroissante.</div>
  <div class="q"><strong>Q3.</strong> En déduire la convergence et la limite. Calculer \(u_1, u_2, u_3\) avec 6 décimales.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Par récurrence : \(u_0 = 2 > 0\). Si \(u_n > 0\), alors \(u_{n+1} = (u_n + 2/u_n)/2 > 0\) (somme de réels positifs). Donc \(u_n > 0\).
    Pour \(u_n^2 \geq 2\) : $$u_{n+1}^2 - 2 = \dfrac{1}{4}\left(u_n + \dfrac{2}{u_n}\right)^2 - 2 = \dfrac{1}{4}\left(u_n^2 + 4 + 4/u_n^2\right) - 2 = \dfrac{1}{4}\left(u_n^2 - 4 + 4/u_n^2\right) = \dfrac{1}{4}\left(u_n - \dfrac{2}{u_n}\right)^2 \geq 0 .$$ Donc \(u_{n+1}^2 \geq 2\). (Initialisation : \(u_0^2 = 4 \geq 2\) ✓.)</p>
    <p><strong>Q2.</strong> $$u_{n+1} - u_n = \dfrac{1}{2}(u_n + 2/u_n) - u_n = \dfrac{1}{2}(2/u_n - u_n) = \dfrac{2 - u_n^2}{2u_n} .$$ Comme \(u_n > 0\) et \(u_n^2 \geq 2\), ce numérateur est \(\leq 0\), donc \(u_{n+1} \leq u_n\). La suite décroît.</p>
    <p><strong>Q3.</strong> \((u_n)\) est décroissante minorée (par \(\sqrt{2}\) car \(u_n^2 \geq 2\) et \(u_n > 0\)), donc converge vers une limite \(\ell \geq \sqrt{2}\). Le point fixe vérifie \(\ell = (\ell + 2/\ell)/2\), soit \(\ell^2 = 2\), \(\ell = \sqrt{2}\) (la positive). Donc \(u_n \to \sqrt{2}\).
    Calcul numérique :
    \(u_1 = (2 + 1)/2 = 1{,}500000\) ; $$u_2 = (1{,}5 + 4/3)/2 = (1{,}5 + 1{,}333{...})/2 = 1{,}416667 \ ;$$ $$u_3 = (1{,}416667 + 2/1{,}416667)/2 = 1{,}414216 .$$
    Convergence très rapide (quadratique) : à chaque étape, le nombre de décimales exactes double.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Suites adjacentes — convergence vers \(e\)</h3>
  <div class="statement">On définit deux suites : \(u_n = \displaystyle\sum_{k=0}^{n} \dfrac{1}{k!}\) et \(v_n = u_n + \dfrac{1}{n\cdot n!}\) pour \(n \geq 1\).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \((u_n)\) est croissante et \((v_n)\) est décroissante.</div>
  <div class="q"><strong>Q2.</strong> Montrer que \((u_n)\) et \((v_n)\) sont adjacentes.</div>
  <div class="q"><strong>Q3.</strong> Conclure : elles convergent vers une limite commune (qui est \(e\)).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \((u_n)\) croissante : \(u_{n+1} - u_n = 1/(n+1)! > 0\).
    \((v_n)\) décroissante : $$v_{n+1} - v_n = u_{n+1} - u_n + \dfrac{1}{(n+1)(n+1)!} - \dfrac{1}{n\cdot n!} = \dfrac{1}{(n+1)!} + \dfrac{1}{(n+1)(n+1)!} - \dfrac{1}{n\cdot n!} .$$
    Réduisons au même dénominateur \(n(n+1)(n+1)!\) :
    $$\dfrac{n(n+1)}{n(n+1)(n+1)!} + \dfrac{n}{n(n+1)(n+1)!} - \dfrac{(n+1)^2}{n(n+1)(n+1)!} = \dfrac{n(n+1) + n - (n+1)^2}{n(n+1)(n+1)!} = \dfrac{n^2 + n + n - n^2 - 2n - 1}{n(n+1)(n+1)!} = \dfrac{-1}{n(n+1)(n+1)!} < 0 .$$ Donc \(v_{n+1} < v_n\).</p>
    <p><strong>Q2.</strong> \(v_n - u_n = 1/(n\cdot n!) \to 0\) car \(n!\) tend vers \(+\infty\). Avec Q1, \((u_n)\) et \((v_n)\) sont adjacentes.</p>
    <p><strong>Q3.</strong> Par le théorème des suites adjacentes, elles convergent vers la <strong>même limite</strong>. Cette limite est \(e \approx 2{,}718\,281\,828\), la base du logarithme népérien (chapitre « Séries numériques », série exponentielle). L'encadrement \(u_n \lt e \lt v_n\) donne une valeur approchée précise : pour \(n = 10\), \(v_{10} - u_{10} = \frac{1}{10 \cdot 10!} \approx 2{,}8 \times 10^{-8}\). Il sert aussi de point de départ à une démonstration classique de l'irrationalité de \(e\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 07</span><span class="diff">★ ☆ ☆</span>
  <h3>Bornes supérieures et approximations décimales</h3>
  <div class="q"><strong>Q1.</strong> Soit \(A = \left\{\frac1n + (-1)^n : n \ge 1\right\}\). Déterminer \(\sup A\) et \(\inf A\). Sont-ils atteints ?</div>
  <div class="q"><strong>Q2.</strong> Soient \(A \subset B\) deux parties non vides et majorées de \(\mathbb R\). Montrer que \(\sup A \le \sup B\).</div>
  <div class="q"><strong>Q3.</strong> Donner les valeurs décimales approchées de \(\pi\) à \(10^{-4}\) près par défaut et par excès. Quel \(n\) choisir pour que \(d_n = \frac{\lfloor 10^n\pi \rfloor}{10^n}\) vérifie \(|\pi - d_n| \le 10^{-6}\) à coup sûr ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour \(n\) pair, l'élément vaut \(1 + \frac1n\) : \(\frac32, \frac54, \frac76, \ldots\), qui décroissent vers 1. Pour \(n\) impair, il vaut \(\frac1n - 1\) : \(0, -\frac23, -\frac45, \ldots\), qui décroissent vers \(-1\). Le plus grand élément est \(\frac32\) (pour \(n = 2\)) : \(\sup A = \max A = \frac32\). Tous les éléments sont \(\gt -1\), et \(\frac{1}{2p + 1} - 1\) est aussi proche de \(-1\) qu'on veut (pour \(\varepsilon \gt 0\), prendre \(2p + 1 \gt \frac1\varepsilon\)) : \(\inf A = -1\), non atteint.</p>
    <p><strong>Q2.</strong> \(\sup B\) majore \(B\), donc majore \(A\) (qui est contenu dans \(B\)). Or \(\sup A\) est le plus petit des majorants de \(A\) : \(\sup A \le \sup B\).</p>
    <p><strong>Q3.</strong> \(\pi = 3{,}141\,592\ldots\), donc \(d_4 = 3{,}1415\) (par défaut) et \(e_4 = 3{,}1416\) (par excès). Comme \(0 \le \pi - d_n \lt 10^{-n}\), le choix \(n = 6\) garantit \(|\pi - d_6| \lt 10^{-6}\) : \(d_6 = 3{,}141\,592\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 08</span><span class="diff">★ ★ ☆</span>
  <h3>Trois limites par encadrement</h3>
  <div class="q"><strong>Q1.</strong> Soit \(x\) un réel et \(u_n = \dfrac{1}{n^2}\displaystyle\sum_{k=1}^{n}\lfloor kx \rfloor\) (\(n \ge 1\)). Montrer que \(u_n \to \frac x2\). (On rappelle \(\sum_{k=1}^{n} k = \frac{n(n + 1)}{2}\).)</div>
  <div class="q"><strong>Q2.</strong> Déterminer la limite de \(v_n = \displaystyle\sum_{k=1}^{n}\frac{1}{\sqrt{n^2 + k}}\).</div>
  <div class="q"><strong>Q3.</strong> Déterminer la limite de \(w_n = \left(2^n + 3^n\right)^{1/n}\) et calculer \(w_{10}\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Pour tout \(k\), \(kx - 1 \lt \lfloor kx \rfloor \le kx\) (partie entière). On somme pour \(k = 1, \ldots, n\) :
    $$x\,\frac{n(n + 1)}{2} - n \lt \sum_{k=1}^{n}\lfloor kx \rfloor \le x\,\frac{n(n + 1)}{2},$$
    puis on divise par \(n^2\) : \(\frac x2\left(1 + \frac1n\right) - \frac1n \lt u_n \le \frac x2\left(1 + \frac1n\right)\). Les deux bornes tendent vers \(\frac x2\) : \(u_n \to \frac x2\) par encadrement.</p>
    <p><strong>Q2.</strong> Les \(n\) termes sont compris entre le plus petit, \(\frac{1}{\sqrt{n^2 + n}}\), et le plus grand, \(\frac{1}{\sqrt{n^2 + 1}}\) :
    $$\frac{n}{\sqrt{n^2 + n}} = \frac{1}{\sqrt{1 + \frac1n}} \le v_n \le \frac{n}{\sqrt{n^2 + 1}} = \frac{1}{\sqrt{1 + \frac{1}{n^2}}} .$$
    Les deux bornes tendent vers 1 : \(v_n \to 1\).</p>
    <p><strong>Q3.</strong> \(3^n \le 2^n + 3^n \le 2 \cdot 3^n\), et \(t \mapsto t^{1/n}\) est croissante sur \([0, +\infty[\) : \(3 \le w_n \le 3 \cdot 2^{1/n}\). Or \(2^{1/n} = e^{(\ln 2)/n} \to e^0 = 1\) : \(w_n \to 3\). Le terme dominant l'emporte. Numériquement, \(w_{10} = 60\,073^{1/10} \approx 3{,}005\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 09</span><span class="diff">★ ★ ☆</span>
  <h3>Suites extraites, suites complexes</h3>
  <div class="q"><strong>Q1.</strong> Montrer que la suite \(u_n = \cos\dfrac{2n\pi}{3}\) n'a pas de limite.</div>
  <div class="q"><strong>Q2.</strong> Soit \(q = \frac{1 + i\sqrt3}{4}\). Étudier la suite \((q^n)\) et calculer \(q^3\).</div>
  <div class="q"><strong>Q3.</strong> Soit \((z_n)\) définie par \(z_0 = 0\) et \(z_{n+1} = \frac{i\,z_n + 1}{2}\). Exprimer \(z_n\) en fonction de \(n\), puis étudier sa limite. Donner les limites de \(\operatorname{Re} z_n\) et de \(\operatorname{Im} z_n\).</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(u_{3n} = \cos(2n\pi) = 1\) et \(u_{3n+1} = \cos\left(2n\pi + \frac{2\pi}{3}\right) = -\frac12\). Deux suites extraites constantes, de limites différentes : \((u_n)\) n'a pas de limite.</p>
    <p><strong>Q2.</strong> \(q = \frac12\,e^{i\pi/3}\) : \(|q^n| = \frac{1}{2^n} \to 0\), donc \(q^n \to 0\) (les points tournent de \(\frac\pi3\) à chaque pas en se rapprochant de 0). \(q^3 = \frac18\,e^{i\pi} = -\frac18\).</p>
    <p><strong>Q3.</strong> Suite arithmético-géométrique \(z_{n+1} = a z_n + b\) avec \(a = \frac i2 \neq 1\) et \(b = \frac12\). Solution constante : \(\ell = \frac{b}{1 - a} = \frac{1/2}{1 - i/2} = \frac{1}{2 - i} = \frac{2 + i}{5}\). Donc
    $$z_n = \ell + \left(\frac i2\right)^n(z_0 - \ell) = \frac{2 + i}{5}\left(1 - \left(\frac i2\right)^n\right).$$
    Comme \(\left|\frac i2\right| = \frac12 \lt 1\), \(z_n \to \frac{2 + i}{5}\) : \(\operatorname{Re} z_n \to \frac25\) et \(\operatorname{Im} z_n \to \frac15\). Contrôle : \(z_1 = \frac12\) et la formule donne \(\frac{2 + i}{5}\left(1 - \frac i2\right) = \frac{(2 + i)(2 - i)}{10} = \frac12\).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 10</span><span class="diff">★ ★ ☆</span>
  <h3>Récurrences linéaires d'ordre 2 : périodicité, racine double, instabilité</h3>
  <div class="q"><strong>Q1.</strong> Résoudre \(u_{n+2} = u_{n+1} - u_n\), \(u_0 = 1\), \(u_1 = 2\). Montrer que la suite est périodique.</div>
  <div class="q"><strong>Q2.</strong> Résoudre \(v_{n+2} = 6v_{n+1} - 9v_n\), \(v_0 = 1\), \(v_1 = 6\).</div>
  <div class="q"><strong>Q3.</strong> On considère \(w_{n+2} = \frac{10}{3} w_{n+1} - w_n\). Pour quelles valeurs de \((w_0, w_1)\) la suite converge-t-elle ? Calculée en Python avec \(w_0 = 1\) et \(w_1 = \frac13\), elle donne \(w_{40} \approx 105\) : expliquer.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(r^2 - r + 1 = 0\) : \(\Delta = -3\), racines \(\frac{1 \pm i\sqrt3}{2} = e^{\pm i\pi/3}\) (\(\rho = 1\), \(\theta = \frac\pi3\)). Donc \(u_n = \lambda\cos\frac{n\pi}{3} + \mu\sin\frac{n\pi}{3}\), avec \(u_0 = \lambda = 1\) et \(u_1 = \frac12 + \mu\frac{\sqrt3}{2} = 2\), soit \(\mu = \sqrt3\). Ainsi $$u_n = \cos\frac{n\pi}{3} + \sqrt3\sin\frac{n\pi}{3} = 2\cos\left(\frac{n\pi}{3} - \frac\pi3\right) \ :$$ la suite est périodique de période 6 (\(1, 2, 1, -1, -2, -1, 1, \ldots\), ce que confirme la récurrence).</p>
    <p><strong>Q2.</strong> \(r^2 - 6r + 9 = (r - 3)^2\) : racine double 3, \(v_n = (\lambda + \mu n)\,3^n\). \(v_0 = \lambda = 1\), \(v_1 = 3(1 + \mu) = 6\), \(\mu = 1\) : \(v_n = (n + 1)\,3^n\). Contrôle : \(v_2 = 36 - 9 = 27 = 3 \times 3^2\).</p>
    <p><strong>Q3.</strong> \(r^2 - \frac{10}{3} r + 1 = 0\) a pour racines 3 et \(\frac13\) (somme \(\frac{10}{3}\), produit 1) : \(w_n = \lambda\,3^n + \mu\,3^{-n}\), avec \(\lambda + \mu = w_0\) et \(3\lambda + \frac\mu3 = w_1\), d'où \(\lambda = \frac{3w_1 - w_0}{8}\). Si \(\lambda \neq 0\), \(|w_n| \to +\infty\) ; si \(\lambda = 0\), \(w_n = w_0\,3^{-n} \to 0\). La suite converge si et seulement si \(w_1 = \frac{w_0}{3}\). Avec \(w_0 = 1\), \(w_1 = \frac13\), la suite exacte est \(3^{-n}\) (\(w_{40} \approx 8 \times 10^{-20}\)). Mais ni \(\frac13\) ni \(\frac{10}{3}\) ne s'écrivent exactement en binaire : l'ordinateur les arrondit, ce qui introduit une minuscule composante \(\lambda \approx 10^{-17}\), multipliée par 3 à chaque pas ; \(3^{40} \approx 1{,}2 \times 10^{19}\) : elle domine bien avant le rang 40. Une récurrence peut être exacte en théorie et inutilisable en calcul approché.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 11</span><span class="diff">★ ★ ★</span>
  <h3>Suites adjacentes : la constante d'Euler</h3>
  <div class="statement">On pose, pour \(n \ge 1\), \(H_n = \sum_{k=1}^{n}\frac1k\), \(u_n = H_n - \ln n\) et \(v_n = H_n - \ln(n + 1)\). On admet l'inégalité \(\ln(1 + x) \le x\) pour \(x \gt -1\) (chapitre « Fonctions réelles — généralités », §7).</div>
  <div class="q"><strong>Q1.</strong> Montrer que \(\frac{1}{n + 1} \le \ln\left(1 + \frac1n\right) \le \frac1n\) pour tout \(n \ge 1\).</div>
  <div class="q"><strong>Q2.</strong> Montrer que \((u_n)\) et \((v_n)\) sont adjacentes. On note \(\gamma\) leur limite commune (constante d'Euler).</div>
  <div class="q"><strong>Q3.</strong> Encadrer \(\gamma\) à l'aide de \(u_{10}\) et \(v_{10}\). En déduire que \(H_n \to +\infty\).</div>
  <div class="q"><strong>Q4.</strong> Combien de termes faut-il, environ, pour que \(H_n\) dépasse 10 ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Avec \(x = \frac1n\) : \(\ln\left(1 + \frac1n\right) \le \frac1n\). Avec \(x = -\frac{1}{n + 1} \gt -1\) : \(\ln\left(1 - \frac{1}{n + 1}\right) = \ln\frac{n}{n + 1} \le -\frac{1}{n + 1}\), soit \(\ln\frac{n + 1}{n} \ge \frac{1}{n + 1}\).</p>
    <p><strong>Q2.</strong> \(u_{n+1} - u_n = \frac{1}{n + 1} - \ln\frac{n + 1}{n} \le 0\) par Q1 : \((u_n)\) décroît. $$v_{n+1} - v_n = \frac{1}{n + 1} - \ln\frac{n + 2}{n + 1} = \frac{1}{n + 1} - \ln\left(1 + \frac{1}{n + 1}\right) \ge 0$$ par Q1 au rang \(n + 1\) : \((v_n)\) croît. Enfin \(u_n - v_n = \ln\left(1 + \frac1n\right) \to 0\). Les suites sont adjacentes : elles convergent vers une même limite \(\gamma\), avec \(v_n \le \gamma \le u_n\).</p>
    <p><strong>Q3.</strong> \(H_{10} \approx 2{,}928\,968\), donc \(u_{10} = H_{10} - \ln 10 \approx 0{,}626\) et \(v_{10} = H_{10} - \ln 11 \approx 0{,}531\) : \(0{,}531 \le \gamma \le 0{,}627\) (en fait \(\gamma \approx 0{,}577\,2\)). Et \(H_n \ge v_1 + \ln(n + 1)\) puisque \((v_n)\) croît, donc \(H_n \to +\infty\) par minoration, comme \(\ln(n + 1)\) : la somme des inverses diverge, mais très lentement.</p>
    <p><strong>Q4.</strong> \(H_n \approx \ln n + \gamma\) (car \(u_n \to \gamma\)) : \(H_n \gt 10\) demande \(\ln n \gt 10 - 0{,}577\), soit \(n \approx e^{9{,}42} \approx 12\,370\). Un calcul en Python (boucle <span class="code-inline">while</span>) donne exactement \(n = 12\,367\).</p>
  </div>
</div>

<div class="exo concours">
  <span class="num">CONCOURS PT</span><span class="diff">★ ★ ★</span>
  <h3>Une suite définie implicitement</h3>
  <div class="exo-source">
    Exercice <strong>original</strong> au format de l'épreuve de Mathématiques PT (thème <em>suites numériques</em>). Pour t'entraîner sur les sujets réellement tombés :
    <a href="https://www.banquept.fr/rubrique38.html" target="_blank" rel="noopener">annales officielles de la Banque PT</a>.
  </div>
  <div class="statement">
    Pour \(n \ge 1\), on pose \(g_n(t) = t^n + t - 1\) pour \(t \in [0, 1]\).
  </div>

  <p class="exo-part">Partie A — Existence</p>
  <div class="q"><strong>A1.</strong> Montrer que \(g_n\) s'annule en un unique réel \(x_n \in\, ]0, 1[\).</div>
  <div class="q"><strong>A2.</strong> Calculer \(x_1\) et \(x_2\).</div>

  <p class="exo-part">Partie B — Monotonie et limite</p>
  <div class="q"><strong>B1.</strong> Calculer \(g_{n+1}(x_n)\) et en déduire que \((x_n)\) est strictement croissante.</div>
  <div class="q"><strong>B2.</strong> En déduire que \((x_n)\) converge vers un réel \(\ell \in\, ]0, 1]\).</div>
  <div class="q"><strong>B3.</strong> En raisonnant par l'absurde, montrer que \(\ell = 1\).</div>

  <p class="exo-part">Partie C — Calcul numérique</p>
  <div class="q"><strong>C1.</strong> Écrire une fonction Python <span class="code-inline">racine(n)</span> qui renvoie une valeur approchée de \(x_n\) à \(10^{-10}\) près par dichotomie sur \([0, 1]\).</div>
  <div class="q"><strong>C2.</strong> Combien d'itérations de la boucle sont nécessaires ? On obtient \(x_{10} \approx 0{,}835\), \(x_{100} \approx 0{,}967\), \(x_{1000} \approx 0{,}995\) : commenter la vitesse de convergence.</div>

  <p class="exo-part">Partie D — La convergence est lente</p>
  <div class="q"><strong>D1.</strong> Soit \(M \gt 0\). Montrer que \(\left(1 - \frac Mn\right)^n \to e^{-M}\).</div>
  <div class="q"><strong>D2.</strong> Vérifier que \(1 - x_n = x_n^n\), puis montrer, par l'absurde, que la suite \(\big(n(1 - x_n)\big)\) n'est pas majorée.</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> \(g_n\) est continue et strictement croissante sur \([0, 1]\) (somme de deux fonctions croissantes, dont \(t \mapsto t\) strictement), avec \(g_n(0) = -1 \lt 0\) et \(g_n(1) = 1 \gt 0\). Par le théorème des valeurs intermédiaires, \(g_n\) s'annule sur \(]0, 1[\), et une seule fois par stricte monotonie.</p>
    <p><strong>A2.</strong> \(g_1(t) = 2t - 1\) : \(x_1 = \frac12\). \(g_2(t) = t^2 + t - 1\), de racines \(\frac{-1 \pm \sqrt5}{2}\) : \(x_2 = \frac{\sqrt5 - 1}{2} \approx 0{,}618\).</p>
    <p><strong>B1.</strong> Comme \(x_n + x_n^n = 1\) : $$\begin{aligned} g_{n+1}(x_n) &= x_n^{n+1} + x_n - 1 = x_n^{n+1} - x_n^n \\ &= x_n^n(x_n - 1) \lt 0 , \end{aligned}$$ car \(0 \lt x_n \lt 1\). Ainsi \(g_{n+1}(x_n) \lt 0 = g_{n+1}(x_{n+1})\), et \(g_{n+1}\) étant strictement croissante, \(x_n \lt x_{n+1}\).</p>
    <p><strong>B2.</strong> \((x_n)\) est strictement croissante et majorée par 1 : par le théorème de la limite monotone, elle converge vers \(\ell \le 1\), et \(\ell \ge x_1 = \frac12 \gt 0\).</p>
    <p><strong>B3.</strong> Supposons \(\ell \lt 1\). Pour tout \(n\), \(0 \lt x_n \le \ell\) (suite croissante de limite \(\ell\)), donc \(0 \lt x_n^n \le \ell^n \to 0\) : \(x_n^n \to 0\) par encadrement. Or \(x_n^n = 1 - x_n \to 1 - \ell \gt 0\) : contradiction. Donc \(\ell = 1\).</p>
    <p><strong>C1.</strong> On garde \(g_n(a) \lt 0 \le g_n(b)\) et l'on coupe l'intervalle en deux à chaque pas :</p>
    <pre class="codeblock"><span class="kw">def</span> racine(n, eps=1e-10):
    a, b = 0, 1
    <span class="kw">while</span> b - a &gt; eps:
        m = (a + b) / 2
        <span class="kw">if</span> m ** n + m - 1 &lt; 0:
            a = m
        <span class="kw">else</span>:
            b = m
    <span class="kw">return</span> a</pre>
    <p><strong>C2.</strong> Après \(k\) itérations, l'intervalle a pour longueur \(2^{-k}\) ; il faut \(2^{-k} \le 10^{-10}\), soit \(k \ge 10\log_2 10 \approx 33{,}2\) : 34 itérations, quel que soit \(n\). En revanche, la suite \((x_n)\) approche 1 lentement : \(1 - x_{10} \approx 0{,}165\), \(1 - x_{100} \approx 0{,}033\), \(1 - x_{1000} \approx 0{,}005\) ; multiplier \(n\) par 10 ne divise l'écart que par 5 à 7.</p>
    <p><strong>D1.</strong> Pour \(n \gt M\), \(\left(1 - \frac Mn\right)^n = e^{n\ln(1 - M/n)}\), et \(n\ln\left(1 - \frac Mn\right) = -M\,\frac{\ln(1 + h)}{h}\) avec \(h = -\frac Mn \to 0\). Le taux d'accroissement \(\frac{\ln(1 + h)}{h}\) tend vers \(\ln'(1) = 1\), donc l'exposant tend vers \(-M\), et par continuité de l'exponentielle, \(\left(1 - \frac Mn\right)^n \to e^{-M}\).</p>
    <p><strong>D2.</strong> \(g_n(x_n) = 0\) s'écrit \(1 - x_n = x_n^n\). Supposons \(n(1 - x_n) \le M\) pour tout \(n\). Alors \(x_n \ge 1 - \frac Mn \ge 0\) pour \(n \ge M\), et \(x_n^n \ge \left(1 - \frac Mn\right)^n\). D'une part \(x_n^n = 1 - x_n \le \frac Mn \to 0\) ; d'autre part, en passant à la limite dans l'inégalité large, \(\lim x_n^n \ge e^{-M} \gt 0\) (D1) : contradiction. La suite \(\big(n(1 - x_n)\big)\) n'est pas majorée : \(1 - x_n\) tend vers 0 moins vite que toute suite \(\frac Mn\) (numériquement, \(n(1 - x_n)\) vaut environ 1,65, 3,34 et 5,24 pour \(n = 10\), 100, 1000).</p>
  </div>
</div>
