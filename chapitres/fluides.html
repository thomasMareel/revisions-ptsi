<div class="course-section">
  <div class="sec-num">§1 · NOTION DE PRESSION</div>
  <h2>Pression dans un fluide — définitions</h2>
  <div class="intro">La pression est la grandeur centrale de la mécanique des fluides. Elle traduit l'intensité des forces de contact exercées par un fluide sur les surfaces qu'il baigne.</div>

  <h3>Définition de la pression</h3>
  <div class="def-box">
    La <strong>pression</strong> \(p\) est une grandeur scalaire positive définie en tout point du fluide. Sur une surface élémentaire \(dS\) de vecteur normal unitaire sortant \(\vec{n}\), la force de pression exercée par le fluide est :
    $$d\vec{F} = -p\,\mathrm{d}S\,\vec{n}$$
    L'unité de pression est le pascal : 1 Pa = 1 N/m². Autres unités courantes : 1 bar = \(10^5\) Pa, 1 atm = 101 325 Pa.
  </div>

  <h3>Fluide au repos — hypothèses</h3>
  <p>On étudie un fluide <strong>au repos</strong> (statique) dans le <strong>champ de pesanteur uniforme</strong> \(\vec{g} = -g\vec{e}_z\) (axe \(z\) vertical ascendant). On suppose :</p>
  <ul>
    <li><strong>Fluide incompressible</strong> : densité \(\rho\) constante (cas des liquides).</li>
    <li><strong>Fluide au repos</strong> : pas d'écoulement.</li>
  </ul>
</div>

<div class="course-section">
  <div class="sec-num">§2 · RELATION FONDAMENTALE DE LA STATIQUE DES FLUIDES</div>
  <h2>RFSF — variation de pression avec l'altitude</h2>
  <div class="intro">La RFSF est la loi de base de l'hydrostatique. Elle relie directement la variation de pression à l'altitude dans un fluide au repos.</div>

  <h3>Relation fondamentale</h3>
  <div class="prop-box">
    Pour un fluide de masse volumique \(\rho\) en équilibre statique dans la pesanteur :
    $$\frac{\mathrm{d}p}{\mathrm{d}z} = -\rho g$$
    Sous forme intégrée, entre deux points A et B (altitudes \(z_A\) et \(z_B\)) dans le <strong>même fluide homogène</strong> :
    $$p_A - p_B = \rho g (z_B - z_A)$$
    ou de façon équivalente : \(p + \rho g z = \text{const}\) (dans un fluide incompressible homogène au repos).
  </div>

  <h3>Surfaces isobares</h3>
  <div class="prop-box">
    Dans un fluide incompressible au repos, les <strong>surfaces de même pression</strong> (isobares) sont des plans horizontaux. Deux points à la même altitude dans le même fluide ont la même pression.
    La surface libre d'un liquide en contact avec l'atmosphère est un plan horizontal à la pression atmosphérique \(p_0\).
  </div>

  <h3>Pression dans un liquide</h3>
  <p>À profondeur \(h\) sous la surface libre d'un liquide de densité \(\rho\) :</p>
  <div class="formula">$$p = p_0 + \rho g h$$</div>
  <p>La pression augmente de \(\rho g h\) par mètre de profondeur. Pour l'eau : \(\rho g \approx 10^4\) Pa/m = 0,1 bar/m.</p>

  <h3>Vases communicants</h3>
  <p>Pour deux colonnes de fluides en communication via un tube en U : appliquer la RFSF dans chaque branche depuis le point de jonction vers le haut. <strong>Même fluide même niveau.</strong></p>
</div>

<div class="course-section">
  <div class="sec-num">§3 · POUSSÉE D'ARCHIMÈDE</div>
  <h2>Loi d'Archimède — flottaison</h2>
  <div class="intro">La poussée d'Archimède explique la flottaison et est fondamentale pour les sous-marins, ballons, iceberg, densimètres. Elle découle directement de la RFSF.</div>

  <h3>Théorème d'Archimède</h3>
  <div class="prop-box">
    <strong>Théorème d'Archimède.</strong> Tout corps immergé dans un fluide subit de la part de ce fluide une force verticale ascendante, appelée <strong>poussée d'Archimède</strong> \(\vec{\Pi}\), égale au <strong>poids du volume de fluide déplacé</strong> :
    $$\|\vec{\Pi}\| = \rho_\text{fluide}\,g\,V_\text{immergé}$$
    Cette force s'applique au centre de gravité du volume de fluide déplacé, appelé <strong>centre de poussée</strong> C.
  </div>

<figcaption>Poussée d'Archimède Π&#8407; : force <strong>verticale ascendante</strong> de norme ρ<sub>fluide</sub>·g·V<sub>immergé</sub>, opposée au poids P&#8407;. L'objet flotte si Π ≥ P, coule sinon. Elle vient de la pression plus forte en bas qu'en haut.</figcaption>
</figure>

  <p>La poussée d'Archimède résulte de la différence de pression entre la face inférieure (plus profonde, pression plus grande) et la face supérieure d'un objet immergé.</p>

  <h3>Conditions de flottaison</h3>
  <div class="prop-box">
    Pour un corps de masse \(m\), masse volumique moyenne \(\rho_\text{corps}\), dans un fluide de masse volumique \(\rho_f\) :
    <ul style="margin:0.4rem 0">
      <li>\(\rho_\text{corps} > \rho_f\) : le corps coule (poids > poussée).</li>
      <li>\(\rho_\text{corps} = \rho_f\) : équilibre indifférent (flotte à toute profondeur).</li>
      <li>\(\rho_\text{corps} < \rho_f\) : le corps flotte en surface, partiellement immergé.</li>
    </ul>
    En flottaison (surface) : poids = poussée d'Archimède, soit \(\rho_\text{corps}\,V\,g = \rho_f\,V_\text{im}\,g\), d'où la fraction immergée :
    $$\frac{V_\text{im}}{V} = \frac{\rho_\text{corps}}{\rho_f}$$
  </div>

  <h3>Stabilité d'un corps flottant</h3>
  <p>Pour un corps flottant, l'équilibre est <strong>stable</strong> si le métacentre M (point d'intersection de la droite d'action de la poussée en position penchée avec la verticale initiale) est au-dessus du centre de gravité G. Sinon, le corps chavire.</p>
</div>

<div class="course-section">
  <div class="sec-num">§4 · APPLICATIONS — INSTRUMENTS DE MESURE</div>
  <h2>Manomètre, baromètre, densimètre</h2>
  <div class="intro">Les instruments de mesure de pression et de densité exploitent directement la RFSF. Savoir les analyser est une compétence attendue.</div>

  <h3>Baromètre de Torricelli</h3>
  <p>Un tube fermé rempli de mercure (longueur \(L\)) est retourné dans un bac de mercure. La pression atmosphérique \(p_0\) soutient la colonne de mercure (\(\rho_\text{Hg} = 13\,600\) kg/m³) :</p>
  <div class="formula">$$p_0 = \rho_\text{Hg}\,g\,h \quad\Rightarrow\quad h = \frac{p_0}{\rho_\text{Hg}\,g} \approx 0{,}76\text{ m} = 760\text{ mmHg}$$</div>

  <h3>Manomètre en U</h3>
  <p>Un tube en U contient un liquide manométrique (mercure, huile) de densité \(\rho_m\). Il mesure une différence de pression en exploitant la RFSF dans le tube.</p>
  <p>Pour une différence de hauteur \(\Delta h\) dans le liquide manométrique : \(p_1 - p_2 = \rho_m g \Delta h\).</p>

  <h3>Densimètre (aréomètre)</h3>
  <p>Un densimètre flotte verticalement. Sa graduation indique la densité du liquide dans lequel il est plongé. À l'équilibre : poids = poussée d'Archimède, donc la profondeur d'enfoncement est proportionnelle à \(1/\rho_\text{liquide}\).</p>

  <h3>Atmosphère isotherme (gaz)</h3>
  <p>Pour un gaz parfait isotherme de masse molaire \(M\), la pression varie avec l'altitude selon :</p>
  <div class="formula">$$p(z) = p_0\,e^{-Mgz/(RT)}$$</div>
  <p>L'échelle de hauteur est \(H = RT/(Mg) \approx 8{,}5\) km pour l'air à 20°C. La pression décroit de moitié environ tous les 5,5 km.</p>
</div>

<template class="pan-tpl" data-panneau="flu-meth">
<div class="course-section">
  <div class="sec-num">MÉTHODES · STATIQUE DES FLUIDES</div>
  <h2>Protocoles de résolution</h2>

  <div class="method-box">
    <strong>Méthode 1 — Calculer une pression à une profondeur donnée</strong>
    <ol style="margin-top:0.4rem">
      <li>Identifier la pression de référence (surface libre : \(p_0\), ou point connu).</li>
      <li>Repérer l'altitude du point (ou la profondeur \(h = z_\text{surface} - z_\text{point}\)).</li>
      <li>Appliquer : \(p = p_\text{ref} + \rho g h\) (descendre = augmenter la pression).</li>
    </ol>
    <p><em>Attention au signe :</em> \(p\) augmente quand on descend (\(z\) diminue).</p>
  </div>

  <div class="method-box">
    <strong>Méthode 2 — Analyser un manomètre en U</strong>
    <ol style="margin-top:0.4rem">
      <li>Identifier le fluide manométrique et ses niveaux dans les deux branches.</li>
      <li>Choisir un point de référence commode (fond du U, ou interface d'un fluide).</li>
      <li>Appliquer la RFSF séparément dans chaque branche, depuis les extrémités jusqu'au point de référence.</li>
      <li>Égaliser les pressions au point de référence (ou à la jonction des deux fluides).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 3 — Calculer la poussée d'Archimède et le flottaison</strong>
    <ol style="margin-top:0.4rem">
      <li>Identifier le volume immergé \(V_\text{im}\) (= volume total si entièrement immergé).</li>
      <li>Calculer \(\Pi = \rho_\text{fluide}\,g\,V_\text{im}\).</li>
      <li>Bilan des forces : \(\vec{P} + \vec{\Pi} + \text{autres forces} = \vec{0}\).</li>
      <li>Pour la flottaison partielle : utiliser \(V_\text{im}/V = \rho_\text{corps}/\rho_\text{fluide}\).</li>
    </ol>
  </div>

  <div class="method-box">
    <strong>Méthode 4 — Force totale de pression sur une surface plane</strong>
    <p>Pour une surface plane horizontale à profondeur \(h\) et d'aire \(S\) :</p>
    <ol style="margin-top:0.4rem">
      <li>Pression uniforme : \(p = p_0 + \rho g h\).</li>
      <li>Force : \(F = p \cdot S\) (perpendiculaire à la surface).</li>
    </ol>
    <p>Pour une surface inclinée ou verticale : intégrer \(dF = p(z)\,dS\), en variant \(z\) sur la surface.</p>
  </div>

  <div class="method-box">
    <strong>Pièges classiques</strong>
    <ul style="margin-top:0.4rem">
      <li>Ne pas confondre pression absolue et pression relative (manométrique) : \(p_\text{rel} = p_\text{abs} - p_0\).</li>
      <li>Dans un manomètre en U avec deux fluides différents : ne pas oublier la contribution de chaque fluide dans sa branche.</li>
      <li>La poussée d'Archimède dépend du volume immergé, pas de la masse ni de la forme exacte.</li>
      <li>Ne pas confondre centre de gravité G et centre de poussée C : ils ne coïncident en général pas.</li>
      <li>La RFSF s'applique seulement dans un fluide connecté : deux espaces fluides séparés par un gaz n'ont pas de lien.</li>
    </ul>
  </div>
</div>
</template>
<template class="pan-tpl" data-panneau="flu-exos">
<div class="exo-wrapper">

<div class="exo">
  <span class="num">EXO 01</span><span class="diff">★ ☆ ☆</span>
  <h3>Pression en profondeur</h3>
  <div class="statement">Un plongeur descend à \(h = 30\) m dans la mer (\(\rho = 1025\) kg/m³, \(g = 9{,}81\) m/s², \(p_0 = 101{,}3\) kPa).</div>
  <div class="q"><strong>Q1.</strong> Calculer la pression absolue à cette profondeur.</div>
  <div class="q"><strong>Q2.</strong> Exprimer ce résultat en bars et en atmosphères.</div>
  <div class="q"><strong>Q3.</strong> À quelle profondeur la pression vaut-elle 5 bar ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(p = p_0 + \rho g h = 101\,300 + 1025 \times 9{,}81 \times 30 = 101\,300 + 301\,657 \approx 403\,000\) Pa \(\approx\boxed{4{,}03}\) bar.</p>
    <p><strong>Q2.</strong> 4,03 bar. En atm : \(4{,}03/1{,}013 \approx 3{,}98\) atm, soit environ 4 atm.</p>
    <p><strong>Q3.</strong> \(p = 5\) bar = \(5\times10^5\) Pa. \(h = \dfrac{p - p_0}{\rho g} = \dfrac{5\times10^5 - 1{,}013\times10^5}{1025\times9{,}81} = \dfrac{3{,}987\times10^5}{10055} \approx 39{,}7\) m.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 02</span><span class="diff">★ ★ ☆</span>
  <h3>Manomètre en U — deux fluides</h3>
  <div class="statement">Un manomètre en U contient de l'huile (\(\rho_h = 850\) kg/m³) dans la branche gauche et de l'eau (\(\rho_e = 1000\) kg/m³) dans la branche droite. La surface libre de l'eau est à l'altitude \(z_e = 20\) cm et celle de l'huile à \(z_h = 35\) cm. Les deux surfaces libres sont à la pression atmosphérique \(p_0\).</div>
  <div class="q"><strong>Q1.</strong> En appliquant la RFSF dans chaque branche depuis le bas, calculer la pression à la jonction (fond du U, altitude \(z = 0\)).</div>
  <div class="q"><strong>Q2.</strong> Quelle est la pression au fond du U ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1 & Q2.</strong> En remontant depuis la surface de chaque branche :</p>
    <p>Branche eau (droite) : \(p_\text{fond} = p_0 + \rho_e g z_e = p_0 + 1000\times9{,}81\times0{,}20 = p_0 + 1962\) Pa.</p>
    <p>Branche huile (gauche) : \(p_\text{fond} = p_0 + \rho_h g z_h = p_0 + 850\times9{,}81\times0{,}35 = p_0 + 2917\) Pa.</p>
    <p>Or ces deux valeurs doivent être égales (même fond) : il y a une différence de \(2917 - 1962 = 955\) Pa. Cela signifie que les deux colonnes ne sont <em>pas</em> en équilibre telles que décrites, ou qu'un fluide supplémentaire comble la différence. Dans ce problème on constate simplement que \(p_\text{fond, huile} > p_\text{fond, eau}\), ce qui signifie que la pression est plus élevée côté huile — le liquide s'ajuste jusqu'à équilibre.</p>
    <p>À l'équilibre : \(p_0 + \rho_h g h_h = p_0 + \rho_e g h_e\), soit \(\rho_h h_h = \rho_e h_e\). La hauteur d'eau équivalente à 35 cm d'huile est : \(h_e = \dfrac{\rho_h}{\rho_e} h_h = \dfrac{850}{1000}\times0{,}35 = 0{,}2975\) m \(= 29{,}75\) cm.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 03</span><span class="diff">★ ★ ☆</span>
  <h3>Poussée d'Archimède — flottaison d'un bois</h3>
  <div class="statement">Un bloc de bois de masse \(m = 2\) kg et de volume \(V = 3 \times 10^{-3}\) m³ flotte à la surface de l'eau (\(\rho_e = 1000\) kg/m³).</div>
  <div class="q"><strong>Q1.</strong> Calculer la masse volumique du bois.</div>
  <div class="q"><strong>Q2.</strong> Calculer la fraction du volume immergée.</div>
  <div class="q"><strong>Q3.</strong> On pose une masse de 500 g sur le bloc. Quelle fraction est maintenant immergée ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(\rho_\text{bois} = m/V = 2/(3\times10^{-3}) = 667\) kg/m³ (inférieur à 1000 kg/m³ → flotte).</p>
    <p><strong>Q2.</strong> Équilibre : \(P = \Pi\). \(mg = \rho_e g V_\text{im}\), soit \(V_\text{im} = m/\rho_e = 2/1000 = 2\times10^{-3}\) m³. Fraction : \(V_\text{im}/V = 2\times10^{-3}/3\times10^{-3} = 2/3 \approx 66\%\). (Vérif : \(\rho_\text{bois}/\rho_e = 667/1000 = 2/3\) ✓)</p>
    <p><strong>Q3.</strong> Poids total : \((m + 0{,}5)\,g = 2{,}5\times9{,}81\) N. \(V_\text{im} = (m+0{,}5)/\rho_e = 2{,}5/1000 = 2{,}5\times10^{-3}\) m³. Fraction : \(2{,}5/3 = 83\%\). Le bloc est encore en flottaison (83% < 100%).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 04</span><span class="diff">★ ★ ☆</span>
  <h3>Sous-marin — équilibre</h3>
  <div class="statement">Un sous-marin de masse \(m = 5000\) kg a un volume total \(V = 6\) m³. Il peut remplir ses ballasts (réservoirs) d'eau de mer (\(\rho = 1025\) kg/m³).</div>
  <div class="q"><strong>Q1.</strong> Calculer la masse d'eau nécessaire dans les ballasts pour que le sous-marin soit en équilibre immergé (totalement immergé, en suspension).</div>
  <div class="q"><strong>Q2.</strong> En déduire la masse volumique totale du sous-marin avec eau.</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Équilibre immergé : poids total = poussée d'Archimède. \((m + m_\text{eau})g = \rho_\text{mer}\,V\,g\). \(m_\text{eau} = \rho_\text{mer} V - m = 1025\times6 - 5000 = 6150 - 5000 = 1150\) kg.</p>
    <p><strong>Q2.</strong> Masse totale : \(5000 + 1150 = 6150\) kg. Volume : 6 m³. Masse volumique : \(6150/6 = 1025\) kg/m³ = masse volumique de l'eau de mer ✓ (condition d'équilibre neutre).</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 05</span><span class="diff">★ ★ ★</span>
  <h3>Iceberg</h3>
  <div class="statement">Un iceberg a une masse volumique \(\rho_g = 917\) kg/m³ et flotte dans l'eau de mer (\(\rho_e = 1025\) kg/m³).</div>
  <div class="q"><strong>Q1.</strong> Calculer la fraction immergée de l'iceberg.</div>
  <div class="q"><strong>Q2.</strong> Quelle fraction est émergée (partie visible) ?</div>
  <div class="q"><strong>Q3.</strong> Un iceberg de volume \(V = 10^6\) m³ fond jusqu'à 80% de son volume initial. Quelle fraction est maintenant immergée ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> Flottaison : \(\rho_g V = \rho_e V_\text{im}\), soit \(V_\text{im}/V = \rho_g/\rho_e = 917/1025 \approx 0{,}895 = \mathbf{89{,}5\%}\).</p>
    <p><strong>Q2.</strong> Partie émergée : \(1 - 0{,}895 = \mathbf{10{,}5\%}\). On retrouve le célèbre "la partie émergée est ~10%".</p>
    <p><strong>Q3.</strong> Volume réduit : \(V' = 0{,}8\times10^6\) m³. La masse est réduite dans les mêmes proportions (même densité de glace), donc \(m' = \rho_g V' = 0{,}8\rho_g V\). La fraction immergée reste \(\rho_g/\rho_e = 89{,}5\%\). La fraction immergée ne dépend que des densités, pas du volume : elle reste constante.</p>
  </div>
</div>

<div class="exo">
  <span class="num">EXO 06</span><span class="diff">★ ★ ★</span>
  <h3>Barrage — force hydrostatique sur une paroi</h3>
  <div class="statement">Un barrage retient de l'eau sur une hauteur \(H = 20\) m. La paroi est verticale et de largeur \(l = 50\) m. L'eau est à la pression atmosphérique en surface (\(\rho = 1000\) kg/m³).</div>
  <div class="q"><strong>Q1.</strong> Exprimer la pression \(p(z)\) en fonction de la profondeur \(z\) (comptée depuis la surface).</div>
  <div class="q"><strong>Q2.</strong> Calculer la force totale de pression (en pression relative, i.e. sans \(p_0\)) exercée par l'eau sur le barrage.</div>
  <div class="q"><strong>Q3.</strong> À quelle hauteur depuis le fond s'applique la résultante des forces ?</div>
  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>Q1.</strong> \(p_\text{rel}(z) = \rho g z\) (pression relative à \(p_0\), croît avec la profondeur \(z\)).</p>
    <p><strong>Q2.</strong> Force totale : \(F = \int_0^H p_\text{rel}(z)\,l\,\mathrm{d}z = l\int_0^H \rho g z\,\mathrm{d}z = \rho g l \left[\dfrac{z^2}{2}\right]_0^H = \dfrac{\rho g l H^2}{2}\). Application numérique : \(F = \dfrac{1000\times9{,}81\times50\times400}{2} = 9{,}81\times10^7\) N \(\approx\boxed{98{,}1}\) MN.</p>
    <p><strong>Q3.</strong> Moment par rapport au fond : \(M = \int_0^H p_\text{rel}(z)\,l\,(H-z)\,\mathrm{d}z\). On pose \(u = H-z\) (hauteur depuis le fond) : \(M = l\int_0^H \rho g(H-u)\,u\,\mathrm{d}u = \rho g l\int_0^H(Hu - u^2)\,\mathrm{d}u = \rho g l\left[\dfrac{Hu^2}{2}-\dfrac{u^3}{3}\right]_0^H = \rho g l H^3\left(\dfrac{1}{2}-\dfrac{1}{3}\right) = \dfrac{\rho g l H^3}{6}\). Hauteur d'application : \(h^* = M/F = \dfrac{\rho g l H^3/6}{\rho g l H^2/2} = \dfrac{H}{3} \approx 6{,}67\) m depuis le fond (à 1/3 de la hauteur).</p>
  </div>
</div>

  <p class="exo-part">Partie A — Pression avec la profondeur</p>
  <div class="q"><strong>A1.</strong> Énoncer la relation fondamentale de la statique des fluides et en déduire \(p(z)\) en fonction de la profondeur \(z\).</div>
  <div class="q"><strong>A2.</strong> Calculer la pression absolue à \(10\ \text{m}\) de profondeur. À combien d'atmosphères cela correspond-il ?</div>

  <p class="exo-part">Partie B — Flottaison (Archimède)</p>
  <div class="q"><strong>B1.</strong> Un iceberg de masse volumique \(\rho_g = 917\ \text{kg/m}^3\) flotte sur l'eau de mer. Quelle fraction de son volume émerge ?</div>

  <button class="toggle-sol" onclick="toggleSol(this)">Voir la solution</button>
  <div class="solution">
    <h4>Correction</h4>
    <p><strong>A1.</strong> RFSF : \(\dfrac{\mathrm dp}{\mathrm dz} = \rho_e\, g\) (axe \(z\) orienté vers le bas), d'où \(p(z) = p_{atm} + \rho_e\, g\, z\).</p>
    <p><strong>A2.</strong> \(p = 1{,}013\times10^{5} + 1025\times9{,}8\times10 = 1{,}013\times10^{5} + 1{,}005\times10^{5} \approx 2{,}0\times10^{5}\ \text{Pa}\), soit environ 2 atmosphères.</p>
    <p><strong>B1.</strong> À l'équilibre, poids = poussée : \(\rho_g\, V g = \rho_e\, V_{imm}\, g\), donc \(\dfrac{V_{imm}}{V} = \dfrac{\rho_g}{\rho_e} = \dfrac{917}{1025} = 0{,}895\). Fraction émergée : \(1 - 0{,}895 = 0{,}105\), soit ≈ <strong>10,5 %</strong> (la majeure partie de l'iceberg est immergée).</p>
